# PyPI version pins for test tooling.
# This file is the single source of truth for what version of each test tool
# is installed in test container images. CI workflows resolve versions via yq.
# Separate from source-refs.yaml which tracks git refs for OpenStack services.
#
# tempest is branchless like the plugins below. 2025.2 and 2026.1 stay on
# 46.3.0 because renovate.json disables major updates under
# releases/**/test-refs.yaml.
tempest: "47.0.0"
barbican-tempest-plugin: "4.6.0"
keystone-tempest-plugin: "0.22.0"
# neutron-tempest-plugin is branchless like tempest and the keystone plugin.
# 3.3.0 imports neutron_lib.services.pvlan, and the neutron-lib this release
# constrains (5.0.1) ships it, so renovate.json holds nothing for this file.
neutron-tempest-plugin: "3.3.0"
# cinder-tempest-plugin is branchless like the plugins above, and it needs only
# pbr, oslo.config, oslo.serialization and tempest>=40.0.0, so nothing in a
# release's upper-constraints.txt narrows it: every release pins the same version.
cinder-tempest-plugin: "1.23.0"
