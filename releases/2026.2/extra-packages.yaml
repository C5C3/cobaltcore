# Per-service Python extras and additional pip packages.
# pip_extras: bare Python extra names (e.g. ldap, not keystone[ldap]).
#   hack/nix-lock.sh appends them to the project in the lock it writes under
#   nix/locks/<release>/<service>/ (e.g. "keystone[ldap,...]").
# pip_packages: additional pip packages installed alongside the service, locked
#   the same way. Use an empty list when none are needed.
# The nova-compute block lists what the image adds to nova's packages:
#   hack/nix-lock.sh writes it into the nova-compute dependency group of the
#   nova lock, whose venv also carries nova's own pip_packages. No block
#   carries apt_packages: every image names its runtime packages in
#   images/<image>/image.nix, which verify_release_config.sh checks.
keystone:
  pip_extras:
    - ldap
  pip_packages: []
horizon:
  pip_extras: []
  pip_packages: []
glance:
  pip_extras: []
  pip_packages:
    # The S3 store driver's extra lives on glance_store, not glance — it pulls
    # boto3/botocore/s3transfer, all pinned in upper-constraints.txt.
    - "glance_store[s3]"
    # Optional LHA-archive support for the image_decompression image-import
    # plugin. upper-constraints.txt carries no lhafile entry — it is no
    # OpenStack dependency — so the version is pinned in
    # overrides/2026.2/constraints.txt, which apply-constraint-overrides.sh
    # merges into the constraints file this install is run against.
    - lhafile
placement:
  pip_extras: []
  pip_packages: []
barbican:
  pip_extras: []
  pip_packages: []
neutron:
  pip_extras: []
  pip_packages: []
cinder:
  pip_extras:
    # cinder 29.0.0 moved the backup drivers' libraries out of its hard
    # requirements into these extras (boto3, google-api-python-client,
    # python-swiftclient); 28.0.0 installed all three. The image keeps them:
    # tests/container-images/verify_cinder.sh imports boto3, and
    # oslo-config-generator loads cinder.opts, which imports
    # cinder/backup/drivers/gcs.py and with it googleapiclient.
    - s3
    - gcs
    - swift
  pip_packages: []
nova:
  pip_extras: []
  pip_packages:
    # os-vif's ovs plugin imports pyroute2 (os_vif/internal/ip/linux/
    # impl_pyroute2.py) and os-vif 5.2.1 lists it in its requirements.txt,
    # but the published wheel's metadata does not, so nothing installs it.
    # Without it os-vif loads only its noop plugin, and the option catalog
    # generated from this image loses the [os_vif_ovs] section. Pinned by
    # upper-constraints.txt.
    - pyroute2
nova-compute:
  # The image of images/nova-compute/. It is built from the nova source pin
  # above with nova's patches and constraints, so it has no source-refs.yaml
  # key of its own.
  pip_extras: []
  pip_packages:
    # The libvirt driver's binding, pinned by upper-constraints.txt. PyPI
    # ships it as an sdist only; nix/lib/python-env.nix builds it against
    # the libvirt of nix/pkgs/libvirt.nix.
    - libvirt-python
