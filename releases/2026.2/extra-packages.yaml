# Per-service Python extras, additional pip packages, and runtime system packages.
# pip_extras: bare Python extra names (e.g. ldap, not keystone[ldap]).
#   The CI workflow reads these and passes them as the PIP_EXTRAS build arg to the
#   Dockerfile, which appends them to the package path (e.g. "keystone[ldap,...]").
#   verify_release_config.sh validates the wiring between this file, the Dockerfile,
#   and the CI workflow.
# pip_packages: additional pip packages installed alongside the service (PIP_PACKAGES
#   build arg). Use an empty list when none are needed.
# apt_packages: runtime system packages installed via apt in the final image
#   (EXTRA_APT_PACKAGES build arg).
keystone:
  pip_extras:
    - ldap
  pip_packages: []
  apt_packages:
    - libapache2-mod-wsgi-py3
    - libldap2
    - libsasl2-2
    - libxml2
horizon:
  pip_extras: []
  pip_packages: []
  apt_packages:
    # uWSGI is compiled in venv-builder against the shared libpython; the
    # dashboard is otherwise pure Python. Without this, uwsgi fails to load
    # (python-base ships no libpython3.12.so.1.0).
    - libpython3.12t64
glance:
  pip_extras: []
  pip_packages:
    # The S3 store driver's extra lives on glance_store, not glance — it pulls
    # boto3/botocore/s3transfer, all pinned in upper-constraints.txt.
    - "glance_store[s3]"
    # Optional LHA-archive support for the image_decompression image-import
    # plugin. upper-constraints.txt carries no lhafile entry — it is no
    # OpenStack dependency — so the version is pinned in
    # overrides/2026.2/constraints.txt, which apply-constraint-overrides.sh
    # merges into the constraints file this install is run against.
    - lhafile
  apt_packages:
    # uWSGI is compiled in venv-builder against the shared libpython; without
    # this, uwsgi fails to load (python-base ships no libpython3.12.so.1.0).
    - libpython3.12t64
    # The image_conversion image-import plugin shells out to `qemu-img info`
    # and `qemu-img convert` on the staged image.
    - qemu-utils
    # The rados and rbd modules of the RBD store. glance_store/_drivers/rbd.py
    # imports both behind a guard, and configure_add raises
    # BadStoreConfiguration ("The required libraries(rbd and rados) are not
    # available") without them. The store runs no ceph or rbd binary, so the
    # image carries no ceph-common. Both packages install into
    # /usr/lib/python3/dist-packages, and the Dockerfile links the two
    # modules onto the venv's path.
    - python3-rados
    - python3-rbd
placement:
  pip_extras: []
  pip_packages: []
  apt_packages:
    # uWSGI is compiled in venv-builder against the shared libpython; placement
    # is otherwise pure Python at runtime. Without this, uwsgi fails to load
    # (python-base ships no libpython3.12.so.1.0).
    - libpython3.12t64
barbican:
  pip_extras: []
  pip_packages: []
  apt_packages:
    # uWSGI is compiled in venv-builder against the shared libpython; barbican
    # is otherwise pure Python at runtime. Without this, uwsgi fails to load
    # (python-base ships no libpython3.12.so.1.0).
    - libpython3.12t64
neutron:
  pip_extras: []
  pip_packages: []
  apt_packages:
    # uWSGI is compiled in venv-builder against the shared libpython; without
    # this, uwsgi fails to load (python-base ships no libpython3.12.so.1.0).
    - libpython3.12t64
    # neutron shells out to `ovsdb-client transact` in pre_fork_initialize
    # (neutron/common/ovn/utils.py) and dies without the binary.
    - openvswitch-common
    # neutron-ovn-metadata-agent spawns `haproxy -f <cfg>` per network
    # (neutron/agent/metadata/driver_base.py) through `ip netns exec`
    # (neutron/agent/linux/ip_lib.py).
    - haproxy
    - iproute2
cinder:
  pip_extras:
    # cinder 29.0.0 moved the backup drivers' libraries out of its hard
    # requirements into these extras (boto3, google-api-python-client,
    # python-swiftclient); 28.0.0 installed all three. The image keeps them:
    # tests/container-images/verify_cinder.sh imports boto3, and
    # oslo-config-generator loads cinder.opts, which imports
    # cinder/backup/drivers/gcs.py and with it googleapiclient.
    - s3
    - gcs
    - swift
  pip_packages: []
  apt_packages:
    # uWSGI is compiled in venv-builder against the shared libpython; without
    # this, uwsgi fails to load (python-base ships no libpython3.12.so.1.0).
    - libpython3.12t64
    # The NFS driver's do_setup probes for mount.nfs through the root helper
    # (cinder/volume/drivers/nfs.py, do_setup) and raises NfsException when
    # the probe's argv[0] is missing; the pod never mounts (D3), the probe's
    # non-zero exit is tolerated. The root helper is `sudo cinder-rootwrap`
    # with no sudoers entry (D3); sudo comes from python-base.
    - nfs-common
    # qemu-img: create-from-image, clone and extend go through
    # cinder/image/image_utils.py (fetch_to_raw, resize_image, convert_image)
    # and the LUKS qcow2 pre-create in cinder/volume/drivers/remotefs.py.
    - qemu-utils
    # ceph and rbd. The RBD volume driver (cinder/volume/drivers/rbd.py) runs
    # `ceph mon dump --format=json` in _get_mon_addrs, `rbd import` in
    # _create_encrypted_volume and _copy_image_to_volume, `rbd export` in
    # copy_volume_to_image and `rbd status` in _get_image_status. The Ceph
    # backup driver (cinder/backup/drivers/ceph.py) pipes `rbd export-diff`
    # into `rbd import-diff` in _rbd_diff_transfer. The postinst adds the
    # system user ceph and the directories /var/lib/ceph and /var/log/ceph,
    # owned by it and not writable by 42424.
    - ceph-common
    # The rados and rbd modules. Both drivers import them behind a guard, and
    # check_for_setup_error raises "rados and rbd python libraries not found"
    # without them (VolumeBackendAPIException in the volume driver,
    # BackupDriverException in the backup driver). ceph-common depends on
    # both; they are named because the drivers import them. Both packages
    # install into /usr/lib/python3/dist-packages, and the Dockerfile links
    # the two modules onto the venv's path.
    - python3-rados
    - python3-rbd
nova:
  pip_extras: []
  pip_packages:
    # os-vif's ovs plugin imports pyroute2 (os_vif/internal/ip/linux/
    # impl_pyroute2.py) and os-vif 5.2.1 lists it in its requirements.txt,
    # but the published wheel's metadata does not, so nothing installs it.
    # Without it os-vif loads only its noop plugin, and the option catalog
    # generated from this image loses the [os_vif_ovs] section. Pinned by
    # upper-constraints.txt.
    - pyroute2
  apt_packages:
    # uWSGI is compiled in venv-builder against the shared libpython; without
    # this, uwsgi fails to load (python-base ships no libpython3.12.so.1.0).
    - libpython3.12t64
    # No qemu-utils: the control-plane roles convert nothing (#1014 D14). No
    # libvirt0: the fake driver of #1018 needs no libvirt, and nova.virt.fake
    # imports without it (#1015 section (a.1)).
nova-compute:
  # The image of images/nova-compute/. It is built from the nova source pin
  # above with nova's patches and constraints, so it has no source-refs.yaml
  # key of its own.
  pip_extras: []
  pip_packages:
    # The libvirt driver's binding, pinned by upper-constraints.txt. PyPI
    # ships it as an sdist only; the build stage compiles it against
    # libvirt-dev.
    - libvirt-python
    # os-vif 5.2.1 omits pyroute2 from its wheel metadata although its ovs
    # plugin imports it (see nova above). Without it nova-compute cannot plug
    # an instance port into Open vSwitch.
    - pyroute2
  apt_packages:
    # libvirt.so.0, libvirt-qemu.so.0 and libvirt-lxc.so.0, which the
    # binding's extension modules link (nova/virt/libvirt/host.py imports it).
    - libvirt0
    # qemu-img create (nova/virt/libvirt/utils.py), info and convert
    # (nova/privsep/qemu.py).
    - qemu-utils
    # iscsiadm (os_brick/initiator/connectors/iscsi.py). The postinst writes
    # /etc/iscsi/initiatorname.iscsi, which the Dockerfile removes.
    - open-iscsi
    # multipath and multipathd (os_brick/initiator/linuxscsi.py). The package
    # ships /etc/multipath.conf, which the Dockerfile removes.
    - multipath-tools
    # nvme (os_brick/initiator/connectors/nvmeof.py,
    # os_brick/privileged/nvmeof.py). The postinst writes /etc/nvme/hostnqn
    # and /etc/nvme/hostid, which the Dockerfile removes.
    - nvme-cli
    # lsscsi (os_brick/initiator/linuxscsi.py).
    - lsscsi
    # /lib/udev/scsi_id (os_brick/initiator/linuxscsi.py, get_scsi_wwn).
    - udev
    # mount.nfs, the helper mount(8) runs for `mount -t nfs`. nova mounts a
    # Cinder NFS export itself, below [libvirt] nfs_mount_point_base
    # ($state_path/mnt): nova/virt/libvirt/volume/nfs.py,
    # nova/virt/libvirt/volume/mount.py and mount() in nova/privsep/fs.py.
    # os-brick takes no part in it. The postinst bakes no node identity.
    - nfs-common
    # cryptsetup, run by the LUKS encryptors (os_brick/encryptors/luks.py)
    # when an encrypted volume attaches. The compute contract enables the
    # Barbican key manager whenever Barbican is enabled.
    - cryptsetup-bin
    # genisoimage, the default [DEFAULT] mkisofs_cmd
    # (nova/conf/configdrive.py), which builds config drives.
    - genisoimage
    # ceph and rbd (nova/storage/rbd_utils.py): `ceph mon dump` in
    # get_mon_addrs, `rbd import` in import_image, `rbd export` in
    # export_image and `ceph df` in get_pool_info. The postinst adds the
    # system user ceph and the directories /var/lib/ceph and /var/log/ceph,
    # and installs /etc/ceph/rbdmap, /etc/default/ceph and
    # /etc/logrotate.d/ceph-common. None of them names the node, so the
    # Dockerfile removes nothing for it.
    - ceph-common
    # The rados and rbd modules. nova/storage/rbd_utils.py imports them
    # behind a guard, and RBDDriver.__init__ raises RuntimeError("rbd python
    # libraries not found") through _check_for_import_failure without them.
    # ceph-common depends on both; they are named because nova imports them.
    # Both packages install into /usr/lib/python3/dist-packages, and the
    # Dockerfile links the two modules onto the venv's path.
    - python3-rados
    - python3-rbd
