# Codecov configuration with component-level coverage thresholds.
# Components enforce per-area coverage targets so regressions are caught at the
# module level rather than hidden by project-wide averages.
---
# Drop controller-gen output from every coverage denominator (project, patch,
# and component targets). zz_generated.deepcopy.go files are mechanically
# generated DeepCopy plumbing with no hand-written logic to test; counting them
# understates real coverage — notably for the webhooks component (target 90%),
# whose api/ paths include the generated deepcopy file.
ignore:
  - "**/zz_generated*.go"

coverage:
  status:
    # Project-level check: overall coverage must not decrease. It counts the
    # unit and integration flags alone; the e2e, chaos and Tempest flags
    # report without gating.
    project:
      default:
        target: auto
        threshold: 1%
        flags:
          - unit-common
          - unit-keystone
          - unit-c5c3
          - unit-horizon
          - unit-glance
          - unit-placement
          - unit-barbican
          - unit-ovn
          - unit-neutron
          - unit-cinder
          - unit-nova
          - integration-common
          - integration-keystone
          - integration-c5c3
          - integration-horizon
          - integration-glance
          - integration-placement
          - integration-barbican
          - integration-ovn
          - integration-neutron
          - integration-cinder
          - integration-nova
    # Patch-level check: new/changed lines in a PR must meet this target, on
    # the same flags.
    patch:
      default:
        target: 90%
        flags:
          - unit-common
          - unit-keystone
          - unit-c5c3
          - unit-horizon
          - unit-glance
          - unit-placement
          - unit-barbican
          - unit-ovn
          - unit-neutron
          - unit-cinder
          - unit-nova
          - integration-common
          - integration-keystone
          - integration-c5c3
          - integration-horizon
          - integration-glance
          - integration-placement
          - integration-barbican
          - integration-ovn
          - integration-neutron
          - integration-cinder
          - integration-nova

# Flag management links CI-uploaded flags to coverage tracking rules. There
# are five prefixes, each with one flag per operator and one for
# internal/common: unit- and integration- from the test and test-integration
# jobs, which the statuses gate on, and e2e-, chaos- and tempest- from the
# e2e-operator, e2e-chaos and tempest jobs, which only report. Each flag's
# paths scope its upload to its own tree. Carryforward ensures missing flags
# (e.g., when only one operator is changed) do not reduce the reported
# coverage.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit-common
      paths:
        - internal/common/
      carryforward: true
    - name: unit-keystone
