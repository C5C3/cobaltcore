# Component-level thresholds: each component is tracked independently on the
# Codecov dashboard, with its own target percentage. flag_regexes keeps each
# component's status on the unit and integration flags.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto

  individual_components:
    # Shared library code — high coverage expected since it underpins all operators.
    - component_id: common
      name: common
      paths:
        - internal/common/**
      flag_regexes:
        - "^unit-"
        - "^integration-"
      statuses:
        - type: project
          target: 80%

    # Controller reconciliation logic — medium coverage target to account for
    # envtest-dependent code paths that are harder to cover exhaustively.
    - component_id: controllers
      name: controllers
      paths:
        - operators/*/internal/controller/**
      flag_regexes:
        - "^unit-"
        - "^integration-"
      statuses:
        - type: project
          target: 70%

    # Webhook validation and defaulting — highest coverage target because
    # incorrect admission logic causes silent data corruption.
    - component_id: webhooks
      name: webhooks
      paths:
        - operators/*/api/**
      flag_regexes:
        - "^unit-"
        - "^integration-"
      statuses:
        - type: project
          target: 90%
