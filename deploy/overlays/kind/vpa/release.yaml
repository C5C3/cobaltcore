# vertical-pod-autoscaler HelmRelease: the VPA CRDs and the recommender. Opt-in,
# reconciled only when the vpa overlay is applied (WITH_VPA=true make
# deploy-infra). Two users apply it: the sizing measurement of
# hack/ci-vpa-recommendations.sh, and the e2e-autoscaling leg, whose operators
# create the opt-in VPAs of the ControlPlane and the OVNCentral and whose suite
# waits for the recommender to serve them.
#
# Only the recommender runs: neither the updater (it evicts pods) nor the
# admission controller (it rewrites pod requests) is installed. The
# measurement creates every VPA with updateMode "Off", which changes no pod.
# The e2e-autoscaling leg also renders VPAs with updateMode "Auto" and
# "Initial", but it checks only the VPA objects and the recommender's
# recommendation; without those two components the modes change no pod here
# either. At one replica the chart turns leader election off.
#
# The chart renders `recommender.extraArgs` verbatim into the recommender's
# args. The two floor flags replace the per-pod defaults of 25 millicores and
# 250 MiB, which the recommender divides evenly among a pod's containers
# (pkg/recommender/logic/recommender.go of VPA 1.8.0). Without them a
# container using less than its share of the floor reports the floor instead
# of its real use. `--memory-saver` keeps its default `false`, so the
# recommender samples every pod from its start, whether or not a VPA selects
# it yet.
#
# The chart version is bounded to one minor (0.13.x ships VPA 1.8.0) so the
# recommender's behaviour stays fixed between measurements, the way the dizzy
# overlay bounds its charts.
#
# Production overlays never install this release.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vertical-pod-autoscaler
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: ">=0.13.0 <0.14.0"
      sourceRef:
        kind: HelmRepository
        name: autoscaler
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    admissionController:
      enabled: false
    updater:
      enabled: false
    recommender:
      replicas: 1
      extraArgs:
        - --pod-recommendation-min-cpu-millicores=1
        - --pod-recommendation-min-memory-mb=1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    crds:
      enabled: true
