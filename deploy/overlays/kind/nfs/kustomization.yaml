# Kind NFS uses the local standard storage class.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../bases/nfs
patches:
  - target:
      kind: PersistentVolumeClaim
      name: nfs-server-exports
      namespace: openstack
    patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: nfs-server-exports
        namespace: openstack
      spec:
        storageClassName: standard
