# Namespace for the standalone Prometheus entry point. The platform aggregate
# also declares monitoring. Composed installs use ../prometheus-managed, which
# excludes this object so platform labels and annotations have a single owner.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
