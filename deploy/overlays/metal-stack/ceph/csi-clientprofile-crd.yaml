# The CRD clientprofiles.csi.ceph.io of the ceph-csi-operator, installed
# without that operator. The Rook 1.21 operator watches ClientProfile in its
# controllers for CephFilesystemSubVolumeGroup and CephBlockPoolRadosNamespace
# without a condition (pkg/operator/ceph/file/subvolumegroup/controller.go
# and pkg/operator/ceph/pool/radosnamespace/controller.go of rook v1.21.0).
# With `csi.installCsiOperator: false` in ../release.yaml the subchart that
# carries this CRD is not installed, the watch's cache never syncs, and the
# operator exits after about two minutes with
#
#   failed to wait for ceph-fs-subvolumegroup-controller caches to sync kind
#   source: *v1.ClientProfile: timed out waiting for cache to be synced
#
# and restarts with a growing back-off (seen on newforge on 2026-10-12: five
# restarts in fourteen minutes). The CRD alone satisfies the watch; no
# ClientProfile is ever created, because `csi.createCsiOperatorResources` is
# false too. ClientProfile is the only csi.ceph.io kind Rook v1.21.0 watches;
# the CephConnection CRD stays out.
#
# Copied unchanged, but for this header, from
# config/crd/bases/csi.ceph.io_clientprofiles.yaml of
# https://github.com/ceph/ceph-csi-operator at tag v1.1.0 (commit
# 98eee8980fc69e5c9c02c80958abe06c3faba5eb), the subchart version the
# rook-ceph chart v1.21.0 depends on and the commit rook v1.21.0's go.mod pins
# for github.com/ceph/ceph-csi-operator/api. It moves with the chart pin of
# ../release.yaml, by hand: Renovate tracks the chart, not this copy. The
# teardown deletes the csi.ceph.io group with the other stack CRDs.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: clientprofiles.csi.ceph.io
spec:
  group: csi.ceph.io
  names:
    kind: ClientProfile
    listKind: ClientProfileList
    plural: clientprofiles
    singular: clientprofile
  scope: Namespaced
  versions:
