              nfs:
                description: NfsConfigSpec defines the desired NFS configuration
                type: object
              nvmeof:
                description: NvmeofConfigSpec defines the desired NVMe-oF configuration
                properties:
                  cephCsiSecrets:
                    description: |-
                      CephCsiSecretsSpec defines the secrets used by the client profile
