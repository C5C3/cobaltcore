# The lab Ceph: one monitor, one manager and three OSDs per worker, each OSD
# on a raw block volume of the cluster's default class (D1 and D2 of #1338). On
# newforge that class is `premium`, whose Lightbits volumes reach the workers
# as NVMe/TCP devices.
#
# The image is Tentacle, the Ceph release the Rook 1.21 CephCluster docs name,
# pinned by tag and digest. The toolbox of toolbox.yaml runs the same string,
# and Renovate's customManager for quay.io/ceph/ceph moves both together
# (packageRules "ceph image", no automerge: a Ceph minor is a question of the
# versions the pinned Rook supports).
#
# The device set's `count` is the number of OSDs, three per worker of
# newforge's three. It is the one field a shoot of another size changes, as
# three times its worker count; the topology spread on the hostname keeps the
# OSDs level across the hosts, and the deploy's health wait reads the count
# from the live CR. Nine OSDs of 100Gi at two replicas give about 450 GiB of
# pool capacity, which bounds the lab's Cinder volumes and backups together.
# Three OSDs per host spread a pool's placement groups over more daemons than
# one, so a single slow OSD stalls a smaller share of the lab's writes.
#
# The OSDs are not portable. Rook names a portable OSD's CRUSH host after its
# claim, not after its node (crushHostname in pkg/operator/ceph/cluster/osd/
# osd.go of rook v1.21.0), so nine portable OSDs were nine CRUSH hosts and
# the pools' failure domain `host` placed 17 of 64 placement groups with both
# replicas on one worker (newforge, 2026-10-12). A non-portable OSD is pinned
# to the node its prepare Job ran on, which the topology spread chose, and
# carries that node's name as its CRUSH host, so two replicas never share a
# worker (D2). The price is that a worker Gardener replaces leaves its three
# OSDs down until they are purged and their claims deleted, whereupon Rook
# prepares three new ones on the node the spread picks; the volumes do not
# follow by themselves.
#
# One monitor is a single point of failure the lab accepts, as it accepts the
# single NFS server (D2). The claims name no storage class, so they bind to the
# cluster's default class like every other volume of the lab;
# hack/deploy-infra.sh refuses a cluster without one.
#
# The memory values are Rook's documented minimums. With the limits equal to
# the requests Rook derives osd_memory_target from them. Per worker that is
# 6 GiB for its three OSDs, plus 1.5 GiB on the worker that runs the mon and
# the mgr.
#
# The daemons keep Rook's cephx defaults, which give them aes256k keys on
# 20.2.4. The two clients of clients.yaml carry `keyType: aes` (D7 of #1338).
# To create such keys Rook runs `mon set auth_allowed_ciphers aes,aes256k` on
# every reconcile, and 20.2.4 answers with three warnings: the keys raise
# AUTH_INSECURE_CLIENT_KEY_TYPE, the allowed cipher raises
# AUTH_INSECURE_KEYS_ALLOWED, and the creation it permits raises
# AUTH_INSECURE_KEYS_CREATABLE (seen on newforge on 2026-10-12, where the
# deploy's health wait never saw HEALTH_OK with the first mute alone).
# healthCheck mutes all three so the deploy can wait for HEALTH_OK. When D7 is
# revisited the mutes are lifted with
# `policy: unmute`, not by deleting the entry, so Rook sends the unmute to Ceph.
# No allowedCiphers: an empty list is Ceph's default, aes and aes256k.
#
# cleanupPolicy.confirmation stays empty here. hack/teardown-infra.sh sets it
# right before it deletes the cluster; Rook refuses spec changes once it is
# set, so the manifest never carries it.
---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  mon:
    count: 1
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 10Gi
  mgr:
    count: 1
  dashboard:
    enabled: false
  crashCollector:
    disable: true
  logCollector:
    enabled: false
  # No exporter and no Prometheus module; a Ceph scrape target is a follow-up
  # of #1338.
  monitoring:
    metricsDisabled: true
  network:
    connections:
      # The Rook 1.21 default, written out. msgr2 needs a 5.11 kernel; the
      # lab's workers run 6.1.
      requireMsgr2: true
  cephConfig:
    global:
      # The manager creates the .mgr pool at the default size. Without this it
      # is created at size 3, and the cluster never reaches HEALTH_OK on a
      # shoot with two workers; the lab's own pools set size 2 themselves.
      osd_pool_default_size: "2"
  healthCheck:
    muteHealthWarning:
      # D7 of #1338: the clients' keys stay aes. See the header.
      AUTH_INSECURE_CLIENT_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_KEYS_ALLOWED:
        policy: mute
      AUTH_INSECURE_KEYS_CREATABLE:
        policy: mute
  resources:
    mon:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 1Gi
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
  storage:
    useAllNodes: false
    useAllDevices: false
    storageClassDeviceSets:
      - name: lightbits
        # Three OSDs per worker of newforge's three; see the header.
        count: 9
        # Pinned to the node of the prepare Job, named as the CRUSH host; see
        # the header.
        portable: false
        placement:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app: rook-ceph-osd
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 2Gi
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes:
                - ReadWriteOnce
              volumeMode: Block
              resources:
                requests:
                  storage: 100Gi
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
    wipeDevicesFromOtherClusters: false
