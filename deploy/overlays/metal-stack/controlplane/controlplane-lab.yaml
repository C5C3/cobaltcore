# The ControlPlane of the ControlPlane Quick Start (docs/quick-start-controlplane.md,
# Step 4): the data of the first `# controlplane.yaml` block without its
# publicEndpoint fields, plus the spec.services.cinder of the page's optional
# `# block-storage.yaml` fragment with the lab's Ceph backends in place of its
# NFS ones, plus three keys the lab adds: spec.services.neutron.extraConfig,
# spec.services.nova.consoleProxy and spec.services.nova.hypervisorOperator.
# The comments above those three keys, above the Cinder backends and above
# spec.sizing give the reasons. tests/unit/deploy/metal_stack_controlplane_test.sh
# fails when this file, minus cinder and the three keys, and the first block
# without its publicEndpoint fields drift apart, and when cinder without its
# backends and the fragment without its own do.
#
# The file is not named controlplane.yaml: .gitignore ignores that basename in
# every directory.
#
# Every gateway hostname below ends in 127-0-0-1.nip.io, which is a template:
# Part 1, Step 4 of docs/quick-start-metal-stack.md applies the render with
# that suffix replaced by the Gateway's, <a-b-c-d>.nip.io for the address of
# its LoadBalancer Service, which nip.io resolves to that address. The suffix
# is the first DNS name of the Certificate openstack/openstack-gw-tls, minus
# its `*.`. Under EXTERNAL_LOADBALANCER=false the suffix stays
# 127-0-0-1.nip.io, the end of a port-forward on local port 443.
#
# No service sets publicEndpoint: the Gateway answers on 443, and the operator
# derives https://<hostname> (https://<hostname>/v3 for Keystone) from the
# hostname, the URL the catalog then advertises. The kind quick start sets them
# for its host port 8443.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: controlplane
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  infrastructure:
    # The shared message bus. The webhook fills clusterRef.name with
    # openstack-rabbitmq, the RabbitmqCluster this ControlPlane then owns.
    messaging: {}
  services:
    keystone:
      gateway:
        parentRef:
          name: openstack-gw
        hostname: keystone.127-0-0-1.nip.io
        path: /
    horizon:
      # The dashboard, at https://horizon.<suffix>.
      gateway:
        parentRef:
          name: openstack-gw
        hostname: horizon.127-0-0-1.nip.io
    glance:
      gateway:
        parentRef:
          name: openstack-gw
        hostname: glance.127-0-0-1.nip.io
      # One S3 image store on the in-cluster Garage object store; the lab's
      # infrastructure overlay ships the Garage cluster and the glance-images
      # bucket.
      backends:
        - name: default
          type: S3
          isDefault: true
          s3:
            endpoint: http://garage.shared-services.svc.cluster.local:3900
            bucket: glance-images
            region: garage
            credentialsSecretRef:
              name: garage-s3-credentials
    placement:
      gateway:
        parentRef:
          name: openstack-gw
        hostname: placement.127-0-0-1.nip.io
    barbican:
      # An OpenBao instance this ControlPlane provisions and owns; its name, its
      # KV mount, and its AppRole are derived by convention, so the block is empty.
      secretStore:
        dedicated: {}
      gateway:
        parentRef:
          name: openstack-gw
        hostname: barbican.127-0-0-1.nip.io
    neutron:
      gateway:
        parentRef:
          name: openstack-gw
        hostname: neutron.127-0-0-1.nip.io
      # The standalone OVNCentral of ovncentral.yaml. Its namespace defaults to
      # this ControlPlane's own, so naming the CR is the whole reference.
      ovn:
        centralRef:
          name: controlplane-ovn
      # Lab setting. Tenant networks are Geneve, and Neutron 27.0.3 computes
      # their MTU as global_physnet_mtu minus 20 (the IPv4 header, get_mtu in
      # neutron/plugins/ml2/drivers/type_tunnel.py) minus [ml2_type_geneve]
      # max_header_size, which the Neutron operator owns at 38
      # (operators/neutron/internal/controller/reconcile_config.go). Every
      # tenant network therefore gets MTU 1402.
      # 1460 is the MTU of the pod network (the cali* lines of
      # deploy/overlays/metal-stack/probe/node-probe.yaml). The chassis tunnels over
      # the node network (its encapsulation address is the pod's status.hostIP),
      # whose uplinks lan0 and lan1 carry 9000. 1460 is a bound that holds
      # without a path-MTU measurement between the two racks, and nothing has
      # measured it yet. The value is a string: extraConfig is
      # map[string]map[string]string.
      extraConfig:
        DEFAULT:
          global_physnet_mtu: "1460"
    cinder:
      gateway:
        parentRef:
          name: openstack-gw
        hostname: cinder.127-0-0-1.nip.io
      # The lab Ceph of deploy/overlays/metal-stack/ceph/, which WITH_CEPH=true
      # deploys: the RBD volume backend ceph1 on the pool volumes and the RBD
      # backup target cephbk on the pool backups. Where the values come from:
      #   - pool volumes and backups: the CephBlockPools of
      #     ../ceph/cluster/pools.yaml
      #   - user cinder and cinder-backup: the CephClients of
      #     ../ceph/cluster/clients.yaml
      #   - keySecretRef ceph-client-cinder and ceph-client-cinder-backup: the
      #     targets of the ExternalSecrets of ../ceph/cluster/keys-pull.yaml,
      #     each with the one key userKey
      #   - monitors: the Service Rook gives the first monitor in the
      #     CephCluster's namespace rook-ceph; ../ceph/cluster/cluster.yaml runs
      #     one (mon.count 1), so it is rook-ceph-mon-a.
      #   - secretUUID: the libvirt secret that ceph-secret.sh of
      #     ../hypervisor/libvirt-configmap.yaml defines on every hypervisor.
      #     The backup entry carries none, because no hypervisor attaches a
      #     backup.
      #   - networks: the podNetwork and serviceNetwork of forge and newforge,
      #     read from the ConfigMap kube-system/shoot-info on 2026-10-04 and
      #     2026-10-11. Another shoot writes its own two from there.
      # clusterName stays unset: the satellite CRDs default it to ceph, and
      # the ControlPlane field has no default on purpose.
      #
      # The networks open nothing on the lab: the projected Cinder runs
      # without a NetworkPolicy. With one, they would open the Ceph ports to
      # every pod and Service address of the shoot, which is where Rook's
      # daemons answer.
      #
      # ../controlplane-nfs adds the NFS volume backend nfs1 beside ceph1, for
      # a lab deployed with WITH_NFS=true as well.
      backends:
        - name: ceph1
          type: RBD
          rbd:
            pool: volumes
            user: cinder
            monitors:
              - rook-ceph-mon-a.rook-ceph.svc.cluster.local
            networks:
              - 10.240.0.0/13
              - 10.248.0.0/18
            keySecretRef:
              name: ceph-client-cinder
            secretUUID: 090e4a3c-6c20-4e74-82dc-1a70382babe8
      backupBackend:
        name: cephbk
        type: RBD
        rbd:
          pool: backups
          user: cinder-backup
          monitors:
            - rook-ceph-mon-a.rook-ceph.svc.cluster.local
          networks:
            - 10.240.0.0/13
            - 10.248.0.0/18
          keySecretRef:
            name: ceph-client-cinder-backup
    nova:
      # Both compute catalog rows append /v2.1 to this endpoint.
      # The metadata API, the scheduler and the conductor run one replica each
      # and stay in-cluster.
      gateway:
        parentRef:
          name: openstack-gw
        hostname: nova.127-0-0-1.nip.io
      # Lab setting. Publishes the noVNC console proxy, which Horizon's console
      # tab and `openstack console url show` send a browser to. It takes a
      # hostname of its own (docs/guides/nova/expose-the-console-proxy.md); the
      # operator renders [vnc] novncproxy_base_url as
      # https://nova-console.<suffix>/vnc_lite.html, without a port, so the
      # console works only where the Gateway answers on 443. The compute
      # contract carries the URL, and the NovaCompute pods of Part 2 read it
      # at start, after this CR is applied. The proxy dials the VNC server of
      # each hypervisor on the node's address ([vnc] server_listen is $my_ip
      # on the NovaCompute), which no Service of the lab publishes.
      consoleProxy:
        gateway:
          parentRef:
            name: openstack-gw
          hostname: nova-console.127-0-0-1.nip.io
      # Lab setting. Provisions the Keystone user hypervisor-operator (project
      # service-hypervisor-operator, role admin) and writes the Secret
      # controlplane-nova-hypervisor-operator-auth into openstack
      # (ServiceNovaHypervisorOperatorSpec in
      # docs/reference/c5c3/controlplane-crd.md), which #1142 feeds into the
      # hypervisor operator's chart.
      hypervisorOperator: {}
  # Lab setting, identical to the quick start. Minimal is one replica per
  # component and a 512Mi database volume
  # (operators/c5c3/api/v1alpha1/sizing_profiles.go); a worker of forge
  # offers 16 CPUs and 128 GiB, a worker of newforge 15.9 CPUs and 29.9 GiB
  # allocatable. The Lightbits CSI driver rounds a request up to its
  # 1 GiB granularity (getReqCapacity in pkg/driver/controller.go of
  # LightBitsLabs/los-csi), so the 512Mi claim binds as a 1 GiB volume. A lab
  # that needs a value between Minimal and Standard declares a cluster-scoped
  # SizingProfile with spec.base: Minimal and selects it with
  # spec.sizing.profileRef.name, which excludes spec.sizing.profile.
  sizing:
    profile: Minimal
