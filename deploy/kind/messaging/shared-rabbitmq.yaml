# The kind-only message bus.
#
# It exists for the standalone Cinder e2e suites, which each create their own
# vhost on it (one vhost per suite), and the ControlPlane suites of #989 use
# the same broker.
#
# One replica. The RabbitMQ Cluster Operator's defaults for image and
# persistence are left alone. Its resource default is not: the operator
# requests 1 CPU and 2Gi per pod, and that request does not fit beside the
# rest of the stack on the 4-vCPU kind node, where it takes the last
# schedulable CPU and leaves the next pod Pending on "Insufficient cpu".
# tests/e2e-chaos/neutron-broker-outage/01-rabbitmqcluster.yaml records the
# same reason for its own broker. The suites push little traffic through the
# bus, so 100m CPU is what it needs here.
#
# Memory follows from the broker's alarm. The Cluster Operator sets
# total_memory_available_override_value to the limit minus a fifth, and
# RabbitMQ blocks every publisher once it uses 0.6 of that value. 512Mi
# alarms at 245.8 MiB against an idle footprint of about 236 MiB, 1Gi at
# 491.5 MiB (#1298). nova-api and cinder-api publish to this broker in the
# Tempest legs and in the e2e-controlplane chain.
#
# The cluster operator labels the server pod
# `app.kubernetes.io/name: shared-rabbitmq` and names it
# `shared-rabbitmq-server-0`. Those are the selectors deploy-infra.sh's
# AllReplicasReady wait and the suite diagnostics use.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: shared-rabbitmq
  namespace: openstack
spec:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi
