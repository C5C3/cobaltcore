# Kustomize overlay for kind cluster — CRD-dependent infrastructure resources.
# References the production flux-system/infrastructure kustomization and
# patches MariaDB CR (1 replica, Galera disabled, MaxScale disabled,
# standard storage class) and Memcached CR (1 replica) for single-node
# kind cluster resource constraints.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../flux-system/infrastructure
  # Gateway API Quick Start: CRD-dependent CRs whose CRDs are shipped
  # by the cert-manager / envoy-gateway HelmReleases in Phase 1.
  - envoy-nodeport.yaml
  - keystone-nip-io-tls-certificate.yaml
  # TLS for the second Gateway listener the ControlPlane Quick Start's Horizon
  # dashboard is exposed through (deploy/kind/base/openstack-gateway.yaml).
  - horizon-nip-io-tls-certificate.yaml
  # TLS for the third Gateway listener the ControlPlane Quick Start's Glance
  # image API is exposed through (deploy/kind/base/openstack-gateway.yaml).
  - glance-nip-io-tls-certificate.yaml
  # TLS for the fourth Gateway listener (`https-dizzy`) the opt-in dizzy
  # overlay's Grafana UI is exposed through (deploy/kind/base/openstack-gateway.yaml).
  - dizzy-nip-io-tls-certificate.yaml
  # TLS for the fifth Gateway listener (`https-glance-upload`) the Glance
  # large-upload e2e suite streams through (deploy/kind/base/openstack-gateway.yaml).
  - glance-upload-nip-io-tls-certificate.yaml
  # TLS for the sixth Gateway listener (`https-placement`) the Placement API
  # is exposed through (deploy/kind/base/openstack-gateway.yaml).
  - placement-nip-io-tls-certificate.yaml
  # TLS for the seventh Gateway listener (`https-barbican`) the Barbican
  # key-management API is exposed through (deploy/kind/base/openstack-gateway.yaml).
  - barbican-nip-io-tls-certificate.yaml
  # TLS for the eighth Gateway listener (`https-neutron`) the Neutron
  # networking API is exposed through (deploy/kind/base/openstack-gateway.yaml).
  - neutron-nip-io-tls-certificate.yaml
  # kind-only: standalone Keystone CRs (Quick Start, keystone e2e/tempest/
  # chaos suites) reference the Secret "keystone-db"; ControlPlane-based
  # deployments use the operator-projected per-ControlPlane ExternalSecret
  # instead, so the production stack ships none.
  #
  # keystone-admin and mariadb-root-password are likewise kind-only shims for
  # standalone flows; production deploy/eso ships none of the three. The admin
  # password is operator-projected per-ControlPlane by the c5c3 operator
  # (reconcileAdminPassword); the MariaDB root password is expected
  # from a non-kind Flux MariaDB baseline.
  - keystone-db-externalsecret.yaml
  # kind-only: standalone Glance CRs (the glance e2e/multistore suites) reference
  # the Secret "glance-db" through the Glance CR's database.secretRef, mirroring
  # the keystone-db shim above. It is NOT one of the WITH_CONTROLPLANE shim-drop
  # names (keystone-admin/keystone-db/mariadb-root-password), so it survives that
  # filter on the ControlPlane path.
  - glance-db-externalsecret.yaml
  # kind-only: standalone Placement CRs (the placement e2e suites) reference the
  # Secret "placement-db" through the Placement CR's database.secretRef,
  # mirroring the glance-db shim above. It is NOT one of the WITH_CONTROLPLANE
  # shim-drop names (keystone-admin/keystone-db/mariadb-root-password), so it
  # survives that filter on the ControlPlane path.
  - placement-db-externalsecret.yaml
  # kind-only: standalone Barbican CRs (the barbican e2e suites) reference the
  # Secret "barbican-db" through the Barbican CR's database.secretRef, mirroring
  # the placement-db shim above. It is NOT one of the WITH_CONTROLPLANE
  # shim-drop names (keystone-admin/keystone-db/mariadb-root-password), so it
  # survives that filter on the ControlPlane path.
  - barbican-db-externalsecret.yaml
  # kind-only: standalone Neutron CRs (the neutron e2e suites) reference the
  # Secret "neutron-db" through the Neutron CR's database.secretRef, mirroring
  # the barbican-db shim above. It is NOT one of the WITH_CONTROLPLANE shim-drop
  # names (keystone-admin/keystone-db/mariadb-root-password), so it survives that
  # filter on the ControlPlane path.
  - neutron-db-externalsecret.yaml
  - keystone-admin-externalsecret.yaml
  - mariadb-root-password-externalsecret.yaml
  # horizon-secret-key is the Django SECRET_KEY shim for standalone Horizon
  # flows (per-CR OpenBao path; survives the WITH_CONTROLPLANE shim drop).
  - horizon-secret-key-externalsecret.yaml
  # kind-only: materialize the Garage admin token and the imported S3 key pair
  # (seeded in OpenBao) so the GarageCluster/GarageKey can consume them.
  # garage-admin-token and one garage-s3-credentials copy sit in the
  # shared-services namespace next to the Garage CRs; the retained
  # garage-s3-credentials copy sits in openstack for the Glance consumers. All
  # of them survive the WITH_CONTROLPLANE shim drop (they are not among the
  # keystone-admin/keystone-db/mariadb-root-password names that
  # hack/deploy-infra.sh filters out on the ControlPlane path).
  - garage-admin-token-externalsecret.yaml
  - garage-s3-credentials-externalsecret.yaml
  # kind-only: the proving OpenBaoCluster for the openbao-operator primitives
  # the Barbican onboarding builds on, plus the ExternalSecret that materializes
  # its static unseal key (seeded in the management OpenBao) so the operator can
  # adopt it instead of generating its own. Both sit in the openstack namespace
  # and survive the WITH_CONTROLPLANE shim drop (neither is among the
  # keystone-admin/keystone-db/mariadb-root-password names). The instance is
  # CI/dev-only — see the posture rationale in its own file header. The tenant
  # admits the openstack namespace to the multi-tenant openbao-operator, without
  # which the controller never reconciles the instance.
  - openbao-tenant.yaml
  - openbao-instance.yaml
  - openbao-instance-unseal-key-externalsecret.yaml

patches:
  # MariaDB: single replica, no Galera, no MaxScale, standard storage.
  #
  # Intentional divergence the kind overlay disables
  # spec.tls. The production base (deploy/flux-system/infrastructure/
  # mariadb.yaml) enables TLS via serverCertIssuerRef/clientCertIssuerRef
  # because mariadb-operator v0.38.1 issues per-Galera-node server certs and
  # MaxScale terminates client TLS. In the kind overlay we patch out Galera
  # AND MaxScale to fit a single-node cluster — leaving spec.tls.enabled=true
  # would force a single-replica mariadbd to terminate TLS without the
  # listener Galera/MaxScale provides, a posture that has not been verified
  # in this environment. Disabling TLS in kind keeps the Quick Start path
  # green; the production TLS posture is exercised by the
  # tests/e2e/keystone/database-tls/ chainsaw suite on a full Galera+MaxScale
  # cluster. To exercise the mTLS path against kind,
  # remove this spec.tls override and re-enable Galera/MaxScale in this
  # patch.
  - target:
      group: k8s.mariadb.com
      version: v1alpha1
      kind: MariaDB
      name: openstack-db
      namespace: openstack
    patch: |
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      metadata:
        name: openstack-db
        namespace: openstack
      spec:
        replicas: 1
        galera:
          enabled: false
        maxScale:
          enabled: false
        # Probe thresholds only: a probe override without a handler keeps
        # mariadb-operator's own exec command (SELECT 1 as root) and merges
        # these values over its defaults (timeoutSeconds 5, periodSeconds 10,
        # failureThreshold 3). Those defaults kill the single replica after
        # thirty seconds of slow answers, which on a CI kind node is not death
        # but CPU contention: concurrent e2e suites running their db-sync Jobs
        # starved the node, the SELECT 1 ran past five seconds, and the kubelet
        # restarted the database mid schema migration, failing every suite in
        # flight. Sixty seconds of liveness tolerance rides out the contention;
        # readiness keeps the tighter threshold so a genuinely wedged server
        # still leaves the Service.
        livenessProbe:
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
        storage:
          size: 1Gi
          storageClassName: standard
        tls:
          enabled: false
          required: false

  # Memcached: single replica
  - target:
      group: memcached.c5c3.io
      version: v1beta1
      kind: Memcached
      name: openstack-memcached
      namespace: openstack
    patch: |
      apiVersion: memcached.c5c3.io/v1beta1
      kind: Memcached
      metadata:
        name: openstack-memcached
        namespace: openstack
      spec:
        replicas: 1

  # Garage: single storage node with small PVCs on the kind default storage
  # class (mirrors the MariaDB/Memcached single-node kind footprint).
  - target:
      group: garage.rajsingh.info
      version: v1beta2
      kind: GarageCluster
      name: garage
      namespace: shared-services
    patch: |
      apiVersion: garage.rajsingh.info/v1beta2
      kind: GarageCluster
      metadata:
        name: garage
        namespace: shared-services
      spec:
        storage:
          replicas: 1
          metadata:
            size: 512Mi
            storageClassName: standard
          data:
            size: 2Gi
            storageClassName: standard
