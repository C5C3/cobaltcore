# kind-only ExternalSecrets for the Garage S3 access/secret key pair — one per
# consuming namespace. A CR resolves a Secret ref in its own namespace and ESO
# materializes a target Secret only into the ExternalSecret's own namespace,
# hence two copies:
#   - openstack: the Glance consumers reference the Secret
#     garage-s3-credentials from their own namespace (the GlanceBackend
#     credentialsSecretRef).
#   - shared-services: the GarageKey "glance-s3" IMPORTS this pair (via
#     spec.importKey.secretRef, resolved in the CR's own namespace) instead of
#     the operator minting a fresh key, so OpenBao stays the single source of
#     truth.
#
# Both read the same seeded OpenBao path
# "bootstrap/openstack/garage/s3-credentials" (a GK-prefixed access key, as
# Garage requires), written by
# deploy/openbao/bootstrap/write-bootstrap-secrets.sh. The access-key-id /
# secret-access-key data-key names match the GarageKey's
# importKey.accessKeyIdKey / secretAccessKeyKey.
#
# CI/dev-only shims, like every other deploy/kind/infrastructure/ ExternalSecret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-credentials
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: garage-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: bootstrap/openstack/garage/s3-credentials
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: bootstrap/openstack/garage/s3-credentials
        property: secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3-credentials
  namespace: shared-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: garage-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: bootstrap/openstack/garage/s3-credentials
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: bootstrap/openstack/garage/s3-credentials
        property: secret-access-key
