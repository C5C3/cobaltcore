# kind-only ExternalSecret for the Nova cell database credentials.
#
# Standalone Nova CRs (the nova e2e suites) reference a Secret named "nova-db"
# in the openstack namespace through the Nova CR's database.secretRef. In
# ControlPlane-based deployments this standalone shim is NOT used (per-service
# DB credentials are operator-projected there), which is why the production
# stack (deploy/eso/, included by deploy/flux-system/) ships no nova-db
# ExternalSecret.
#
# This kind overlay keeps the standalone flows working: it pulls username and
# password from the dedicated standalone OpenBao path
# (openstack/nova/openstack/standalone/db, seeded by write-bootstrap-secrets.sh)
# and materialises them as the Secret "nova-db".
#
# The username matters here. A Nova on a managed database derives its SQL user
# from the instance name and reads only the password, but a brownfield Nova
# reads username from the Secret as well. The two Nova databases need two SQL
# users, so this path carries nova while the API path behind the sibling
# nova-api-db shim carries nova_api.
#
# It authenticates through the per-tenant openbao-tenant-store, the enforced
# default and the same store the cinder-db shim uses, rather than the shared
# cluster store. On the standalone path hack/deploy-infra.sh provisions that
# store via setup-eso-tenant.sh openstack; the store's eso-tenant identity scopes
# reads to openstack/nova/openstack/*, which is why the remote key carries the
# openstack namespace segment.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nova-db
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tenant-store
    kind: SecretStore
  target:
    name: nova-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: openstack/nova/openstack/standalone/db
        property: username
    - secretKey: password
      remoteRef:
        key: openstack/nova/openstack/standalone/db
        property: password
