# Compose with kind/base or another owner of Namespace/monitoring.
# Keep ../prometheus as the compatible standalone entry point.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../prometheus
patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
      $patch: delete
