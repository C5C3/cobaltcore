# EnvoyProxy CR referenced by `GatewayClass/envoy` (see
# deploy/kind/base/openstack-gateway.yaml). Switches the generated
# Envoy proxy Service to `type: NodePort` and pins the HTTPS listener's
# nodePort to 31443 via a StrategicMerge patch; kind's
# `extraPortMappings` maps host :443 to this port
# (hack/kind-config.yaml).
#
# Lives in the base overlay, beside the GatewayClass that references it.
# hack/deploy-infra.sh registers the `gateway.envoyproxy.io` CRDs in Step 2
# (install_envoy_gateway_crds), before the base overlay, so the CR applies
# there, and it then exists before the envoy-gateway controller first renders
# the Gateway. Applied later, with the infrastructure overlay, it raced that
# render: the controller logs "failed to find envoyproxy" and creates the
# proxy Service with its defaults, `type: LoadBalancer` with
# `externalTrafficPolicy: Local`, which allocates a random
# healthCheckNodePort. When that port happened to be 31443, the switch to
# `nodePort: 31443` this CR asks for failed on every retry with
# `spec.ports[0].nodePort: Invalid value: 31443: provided port is already
# allocated`, and the Gateway stayed at `AddressNotAssigned` until
# hack/deploy-infra.sh timed out.
#
# DECISION: patch type
# gateway-helm@1.7.2 rejects `JSONPatch` for `envoyService.patch` with
# `Invalid parametersRef: unsupported envoy service patch type JSONPatch`;
# only `StrategicMerge` and `JSONMerge` are accepted. StrategicMerge
# keys v1.ServicePort entries by `port` (patchMergeKey=port), so listing
# `port: 443` selects the auto-generated HTTPS ServicePort without
# depending on the chart-generated `name` (which varies with the
# Gateway's listener name and chart version).
#
# DECISION: externalTrafficPolicy Cluster
# EnvoyProxy defaults `envoyService.externalTrafficPolicy` to `Local`, unlike
# a plain Service. With NodePort and `Local`, Envoy Gateway assigns the
# Gateway only the addresses of nodes that carry a Ready endpoint of the proxy
# Service, so a status pass that runs before the proxy pod's readiness reaches
# the EndpointSlice leaves `Programmed=False` with reason
# `AddressNotAssigned`, and when no later event recomputes it the Gateway
# stays there: hack/deploy-infra.sh then times out after 600 s with both
# Envoy pods Running. With `Cluster` every node address is assigned on the
# first pass and `Programmed` follows the proxy Deployment alone. It is also
# what hack/kind-config-multinode.yaml assumes: its host bridges sit on the
# control-plane node and must reach the proxy pod on whichever node runs it.
#
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-nodeport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 443
                  nodePort: 31443
