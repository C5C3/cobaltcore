# Kustomize overlay for kind cluster base deployments.
# References the flux-system base infrastructure manifests and patches
# OpenBao for single-node Raft mode (1 replica, HA enabled for Raft
# storage rendering, no retry_join peers, standard storage class).
# Feature: CC-0010
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - crds/memcached.yaml
  - ../../flux-system/

patches:
  # OpenBao: single-node Raft for kind (ha.enabled=true so the Helm chart
  # renders ha.raft.config; replicas=1 with no retry_join peers).
  # See: review #1 — ha.raft.config is ignored when ha.enabled=false.
  - target:
      kind: HelmRelease
      name: openbao
      namespace: openbao-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: openbao
        namespace: openbao-system
      spec:
        values:
          server:
            ha:
              enabled: true
              replicas: 1
              raft:
                enabled: true
                config: |
                  ui = false

                  listener "tcp" {
                    tls_disable     = 0
                    address         = "[::]:8200"
                    cluster_address = "[::]:8201"
                    tls_cert_file   = "/openbao/tls/tls.crt"
                    tls_key_file    = "/openbao/tls/tls.key"
                  }

                  storage "raft" {
                    path = "/openbao/data"
                  }

                  service_registration "kubernetes" {}
            dataStorage:
              storageClass: standard
