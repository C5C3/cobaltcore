# Kustomize overlay for kind cluster — base FluxCD manifests.
# References the production flux-system kustomization and patches
# the OpenBao HelmRelease to standalone mode (1 replica, HA disabled,
# no retry_join peers, standard storage class) suitable for a
# single-node kind cluster. It also sizes the operators, OpenBao and the
# Flux controllers for the one 4 vCPU / 16 GiB node the devstack targets,
# which the e2e-controlplane job checks with hack/ci-check-node-budget.sh.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../flux-system
  # Headlamp UI — kind-only demo addon (see headlamp.yaml header).
  - headlamp.yaml
  # Flux Web UI — kind-only demo addon (see flux-web.yaml header).
  - flux-web.yaml
  # Envoy Gateway controller + EnvoyProxy NodePort config (kind-only).
  - envoy-gateway.yaml
  # GatewayClass/envoy + Certificate + Gateway/openstack-gw (kind-only).
  - openstack-gateway.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: openbao
      namespace: shared-services
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: openbao
        namespace: shared-services
      spec:
        values:
          server:
            ha:
              enabled: false
              replicas: 1
            standalone:
              enabled: true
              config: |
                # kind-only — production keeps ui = false
                ui = true

                listener "tcp" {
                  tls_disable     = 0
                  address         = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_cert_file   = "/openbao/tls/tls.crt"
                  tls_key_file    = "/openbao/tls/tls.key"
                  # kind matches production mTLS posture
                  tls_client_ca_file               = "/openbao/tls/ca.crt"
                  tls_require_and_verify_client_cert = true
                }

                storage "raft" {
                  path = "/openbao/data"
                }

                service_registration "kubernetes" {}
            dataStorage:
              storageClass: standard
            # The production release asks 250m. One idle standalone server
            # needs far less, and the node budget counts requests. Only the
            # CPU request is lowered: the memory request and limit stay.
            resources:
              requests:
                cpu: 100m

  # Memcached operator: disable webhooks in kind to avoid cert-manager
  # webhook TLS provisioning issues (liveness probe kills the container
  # after ~2.5min when the webhook server cannot bind its TLS port).
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: memcached-operator
      namespace: memcached-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: memcached-operator
        namespace: memcached-system
      spec:
        values:
          webhook:
            enabled: false

  # keystone-operator: suspend Flux management in kind so that the e2e CI
  # job can install it manually with a locally built dev image. Both Flux
  # and the CI's `helm install` now target the keystone-system Namespace
  # so the historical ownership-annotation conflict
  # caused by the prior openstack-vs-default-namespace mismatch (fix-001)
  # no longer applies. The suspend is still required because the published
  # chart and the locally built dev image cannot share the same release
  # name without one overwriting the other.
  #
  # One replica instead of the chart default of 2, so the devstack stays
  # within the node budget. The CONTROLPLANE_OPERATORS=flux path of
  # hack/deploy-infra.sh installs the chart with these values; the CI jobs
  # that install the operator themselves pass OPERATOR_REPLICAS=1 to
  # hack/ci-deploy-operator.sh instead.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: keystone-operator
      namespace: keystone-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: keystone-operator
        namespace: keystone-system
      spec:
        suspend: true
        values:
          replicas: 1

  # horizon-operator: suspend Flux management in kind for the same reason as
  # keystone-operator above — the e2e CI job installs it manually with a
  # locally built dev image, and the published chart and the dev image cannot
  # share the same release name without one overwriting the other. It runs
  # one replica, like keystone-operator.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: horizon-operator
      namespace: horizon-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: horizon-operator
        namespace: horizon-system
      spec:
        suspend: true
        values:
          replicas: 1

  # glance-operator: suspend Flux management in kind for the same reason as
  # keystone-operator above — the e2e CI job installs it manually with a
  # locally built dev image, and the published chart and the dev image cannot
  # share the same release name without one overwriting the other. It runs
  # one replica, like keystone-operator.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: glance-operator
      namespace: glance-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: glance-operator
        namespace: glance-system
      spec:
        suspend: true
        values:
          replicas: 1

  # placement-operator: suspend Flux management in kind for the same reason as
  # keystone-operator above — the e2e CI job installs it manually with a
  # locally built dev image, and the published chart and the dev image cannot
  # share the same release name without one overwriting the other. It runs
  # one replica, like keystone-operator.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: placement-operator
      namespace: placement-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: placement-operator
        namespace: placement-system
      spec:
        suspend: true
        values:
          replicas: 1

  # barbican-operator: suspend Flux management in kind for the same reason as
  # keystone-operator above — the e2e CI job installs it manually with a
  # locally built dev image, and the published chart and the dev image cannot
  # share the same release name without one overwriting the other. It runs
  # one replica, like keystone-operator.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: barbican-operator
      namespace: barbican-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: barbican-operator
        namespace: barbican-system
      spec:
        suspend: true
        values:
          replicas: 1

  # ovn-operator: suspend Flux management in kind for the same reason as
  # keystone-operator above — the e2e CI job installs it manually with a
  # locally built dev image, and the published chart and the dev image cannot
  # share the same release name without one overwriting the other. It runs
  # one replica, like keystone-operator.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: ovn-operator
      namespace: ovn-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: ovn-operator
        namespace: ovn-system
      spec:
        suspend: true
