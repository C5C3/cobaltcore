        suspend: true
        values:
          replicas: 1

  # c5c3-operator: one replica, like keystone-operator. Unlike the service
  # operators it is not suspended here: hack/deploy-infra.sh suspends it at
  # runtime unless CONTROLPLANE_OPERATORS=flux, and that flux path relies on
  # the base applying it active.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: c5c3-operator
      namespace: c5c3-system
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: c5c3-operator
        namespace: c5c3-system
      spec:
        values:
          replicas: 1

  # k-orc: suspend the Flux Kustomization in kind for the same reason as the
  # operator HelmReleases above. The e2e-controlplane CI job installs K-ORC out
  # of band (hack/ci-deploy-korc.sh), and hack/deploy-infra.sh suspends this
  # Kustomization only after the base overlay is applied. Applied active, the
  # kustomize-controller reconciles it inside that window whenever something
  # slower than a patch sits between the two (the WITH_NFS=true rollout wait
  # takes ~18 s where the default path takes 0.5 s), and the CI script's
  # server-side apply then conflicts with the kustomize-controller on the
  # manager image (Flux renders <name>:<tag>@<digest>, the script renders
  # <name>@<digest>).
  # Suspended at apply time, nothing reconciles K-ORC until a path lifts the
  # suspension; the CONTROLPLANE_OPERATORS=flux branch of hack/deploy-infra.sh
  # does so right before it waits for the Kustomization.
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: k-orc
      namespace: flux-system
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: k-orc
        namespace: flux-system
      spec:
        suspend: true

  # Flux controllers: the upstream manifests ask 100m CPU per controller.
  # Each entry lowers that request to 25m with the JSON6902 recipe of
  # docs/reference/infrastructure/infrastructure-manifests.md, which the
  # flux-operator applies to the Deployment it renders. `add` on
  # resources/requests/cpu replaces that one member and leaves the memory
  # request and the limits in place, so nothing is throttled harder.
  - target:
      group: fluxcd.controlplane.io
      version: v1
      kind: FluxInstance
      name: flux
      namespace: flux-system
    patch: |
      apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      metadata:
        name: flux
        namespace: flux-system
      spec:
        kustomize:
          patches:
            - target:
                kind: Deployment
                name: source-controller
              patch: |
                - op: add
                  path: /spec/template/spec/containers/0/resources/requests/cpu
                  value: 25m
            - target:
                kind: Deployment
                name: kustomize-controller
              patch: |
                - op: add
                  path: /spec/template/spec/containers/0/resources/requests/cpu
                  value: 25m
            - target:
                kind: Deployment
                name: helm-controller
              patch: |
                - op: add
                  path: /spec/template/spec/containers/0/resources/requests/cpu
                  value: 25m
            - target:
                kind: Deployment
                name: notification-controller
              patch: |
                - op: add
                  path: /spec/template/spec/containers/0/resources/requests/cpu
                  value: 25m

  # The Chaos Mesh kind-tuning patch (containerd runtime, dashboard disabled,
  # reduced resource requests) lives in the opt-in deploy/kind/chaos-mesh/
  # overlay. It cannot stay here because Chaos Mesh is no longer in the base
  # resource list — kustomize would refuse to render with a missing patch
  # target.
