# Gateway API wiring for the kind Quick Start — `GatewayClass/envoy`
# plus a six-listener HTTPS Gateway on port 443
# (`keystone.127-0-0-1.nip.io`, `horizon.127-0-0-1.nip.io`,
# `glance.127-0-0-1.nip.io`, `dizzy.127-0-0-1.nip.io`,
# `glance-upload.127-0-0-1.nip.io`, and `placement.127-0-0-1.nip.io`,
# routed by SNI) terminating TLS with self-signed certificates issued by
# the existing `selfsigned-cluster-issuer` ClusterIssuer (the same issuer
# OpenBao uses; see
# `deploy/flux-system/infrastructure/cluster-issuer.yaml`).
#
# The Gateway lives in the `openstack` namespace alongside the Keystone
# CR on purpose: same-namespace `parentRef` resolution does not need a
# `ReferenceGrant`, and the Keystone Operator explicitly does not manage
# ReferenceGrant (see `keystone_types.go:348-354`: "Cross-namespace
# references require a ReferenceGrant in the target namespace (out of
# scope for this operator)"). This also matches the E2E fixture at
# `tests/e2e/keystone/httproute/01-keystone-cr.yaml:40`, which hard-codes
# `parentRef.name: openstack-gw` in the `openstack` namespace.
#
# The `parametersRef` on the GatewayClass points at the EnvoyProxy CR
# defined in `envoy-gateway.yaml`, which pins the proxy data-plane
# Service to `type: NodePort` with `nodePort: 31443` — the fixed port
# that `hack/kind-config.yaml` `extraPortMappings` bridges to the host's
# TCP :443. Result: `https://keystone.127-0-0-1.nip.io/v3` reaches the
# proxy from the developer's machine with no `/etc/hosts` edit and no
# `kubectl port-forward`.
#
# This manifest is deployed ONLY from the kind overlay
# (deploy/kind/base/kustomization.yaml) and NEVER reaches the production
# overlay — the Gateway/GatewayClass stay infrastructure concerns that
# customers pick for themselves (docs/reference/keystone-crd.md:316-318).
#
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-nodeport
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: openstack-gw
  namespace: openstack
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: keystone.127-0-0-1.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: keystone-nip-io-tls
      allowedRoutes:
        namespaces:
          from: Same
    # Second HTTPS listener for the Horizon dashboard the ControlPlane Quick
    # Start projects (docs/quick-start-controlplane.md). It shares port 443
    # with the Keystone listener above — Envoy Gateway routes the two by SNI
    # on the distinct `hostname` values, each terminating with its own
    # certificate. The Horizon HTTPRoute the horizon-operator projects carries
    # `hostnames: [horizon.127-0-0-1.nip.io]`, so it attaches to THIS listener
    # (matching hostname) and not the Keystone one. Adding a second listener on
    # the same port does not disturb the NodePort pin: `envoy-nodeport.yaml`
    # keys its StrategicMerge patch by `port: 443`, which selects the single
    # ServicePort Envoy generates for both listeners.
    - name: https-horizon
      protocol: HTTPS
      port: 443
      hostname: horizon.127-0-0-1.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: horizon-nip-io-tls
      allowedRoutes:
        namespaces:
          from: Same
    # Third HTTPS listener for the Glance image API the ControlPlane Quick
    # Start exposes (docs/quick-start-controlplane.md). It shares port 443
    # with the two listeners above — Envoy Gateway routes them by SNI on
    # the distinct `hostname` values, each terminating with its own
    # certificate. The Glance HTTPRoute the glance-operator projects carries
    # `hostnames: [glance.127-0-0-1.nip.io]`, so it attaches to THIS listener
    # (matching hostname) and not the ones above. Adding another listener on
    # the same port does not disturb the NodePort pin: `envoy-nodeport.yaml`
    # keys its StrategicMerge patch by `port: 443`, which selects the single
    # ServicePort Envoy generates for all three listeners.
    - name: https-glance
      protocol: HTTPS
      port: 443
      hostname: glance.127-0-0-1.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: glance-nip-io-tls
      allowedRoutes:
        namespaces:
          from: Same
    # Fourth HTTPS listener for the Grafana UI of the opt-in dizzy
    # observability overlay (`deploy/kind/dizzy/`, gated on
    # WITH_DIZZY=true in hack/deploy-infra.sh). It shares port 443 with
    # the listeners above, routed by SNI on its distinct `hostname` and
    # terminating with its own certificate; the envoy-nodeport
    # StrategicMerge patch keys by `port: 443` and is untouched by
    # another listener on the same port.
    #
    # This is the repo's FIRST listener admitting routes from another
    # namespace (`allowedRoutes.namespaces.from: Selector` instead of
    # `Same`): the static `dizzy-grafana` HTTPRoute lives next to its
    # backend in the gated `dizzy` overlay's namespace, selected via the
    # automatic `kubernetes.io/metadata.name` namespace label (no custom
    # label needed) — this avoids introducing the repo's first
    # ReferenceGrant.
    #
    # The listener is unconditional: with WITH_DIZZY unset no route
    # attaches and requests for this SNI get 404, mirroring how the
    # glance listener exists without a Glance service.
    - name: https-dizzy
      protocol: HTTPS
      port: 443
      hostname: dizzy.127-0-0-1.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dizzy-nip-io-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: dizzy
    # Fifth HTTPS listener for the Glance large-upload e2e suite. It shares
    # port 443 with the listeners above, routed by SNI on its distinct
    # `hostname` and terminating with its own certificate.
    #
    # The suite gets its own hostname instead of reusing `https-glance`
    # because the Quick Start smoke suite already claims that one: two
    # HTTPRoutes on the same hostname with the same `/` prefix would race
    # under chainsaw's parallelism. Like the dizzy listener above it is
    # unconditional — with no HTTPRoute projected onto this hostname,
    # requests for this SNI get 404.
    - name: https-glance-upload
      protocol: HTTPS
      port: 443
      hostname: glance-upload.127-0-0-1.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: glance-upload-nip-io-tls
      allowedRoutes:
        namespaces:
          from: Same
    # Sixth HTTPS listener for the Placement API. It shares port 443 with
    # the listeners above, routed by SNI on its distinct `hostname` and
    # terminating with its own certificate
    # (deploy/kind/infrastructure/placement-nip-io-tls-certificate.yaml).
    # Another listener on the same port leaves the NodePort pin intact:
    # `envoy-nodeport.yaml` keys its StrategicMerge patch by `port: 443`,
    # which selects the single ServicePort Envoy generates for all
    # listeners.
    #
    # The HTTPRoute the placement-operator projects from the Placement
    # CR's `spec.gateway` carries the hostname
    # `placement.127-0-0-1.nip.io`, so it attaches to THIS listener
    # (matching hostname) and not the ones above. Its first consumer is
    # tests/e2e/placement/gateway-quick-start-smoke. Like the listeners
    # above it is unconditional: with no HTTPRoute projected onto this
    # hostname, requests for this SNI get 404.
    - name: https-placement
      protocol: HTTPS
      port: 443
      hostname: placement.127-0-0-1.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: placement-nip-io-tls
      allowedRoutes:
        namespaces:
          from: Same
