# csi-driver-nfs HelmRelease, the mounter for the Cinder NFS backend and the
# Cinder backup share. It turns the two exports of nfs-server.yaml into
# volumes a pod can use. The node plugin image carries its own `mount.nfs`,
# so nothing has to be installed into the kindest/node image. The
# cinder-operator mounts every backend and backup share as an inline `csi:`
# volume in the pod spec: no PersistentVolume, no PersistentVolumeClaim. The
# CSIDriver object's `attachRequired: false` keeps the attach/detach
# controller out of the path, so the node plugin mounts the share alone.
#
# Deployed to kube-system: the chart defaults to
# `priorityClassName: system-cluster-critical`, which resolves in no other
# Namespace.
#
# Kind-only. Production clusters bring their own CSI mounter, and shipping a
# privileged hostNetwork DaemonSet from deploy/flux-system/releases/ into
# every production deployment is rejected.
#
# The chart version is PINNED, unlike the `>=x <y` ranges of
# deploy/kind/chaos-mesh/release.yaml, deploy/kind/metrics-server/release.yaml
# and deploy/kind/dizzy/release-*.yaml. A range would let Flux adopt a new
# chart on its next reconcile with no repo diff, and what it installs here is
# a privileged hostNetwork DaemonSet whose chart defaults the stack relies on
# (listed below) are not overridden and would flip unnoticed. Renovate tracks
# the pin (customManager on `version:` in this file, packageRules
# "csi-driver-nfs chart", major disabled, no automerge), so an upgrade is a
# reviewed diff.
#
# The HelmRepository still points at the upstream `master` chart directory
# (source.yaml), because that is the only place upstream publishes: every
# index entry, including the ones for older minors, carries an absolute
# tarball URL back under `master/charts/`, so pinning the repository URL to a
# tag would freeze the index without making the downloaded chart any more
# immutable.
#
# The pin controls WHICH VERSION Flux installs, not WHICH BYTES it installs.
# Flux HelmRepository `spec.verify` is OCI-only and nothing here records a
# checksum or a signature, so a rewrite of the 4.13.4 tarball on the upstream
# branch is adopted on the next reconcile (interval 1h) with no repo diff and
# no PR — and what it would install is the privileged hostNetwork DaemonSet
# below. That residual risk is accepted for a kind-only CI overlay; a real
# content pin means mirroring the chart into a registry this project controls
# and referencing it by digest, or vendoring the rendered manifests here the
# way the overlay already vendors nfs-server.yaml.
#
# What stays at chart default, and is relied on:
#   - `driver.name: nfs.csi.k8s.io`, the provisioner string the static
#     PersistentVolumes reference.
#   - `attachRequired: false` on the CSIDriver.
#   - `fsGroupPolicy: File` (chart `feature.enableFSGroupPolicy: true`), so
#     the kubelet applies a pod's fsGroup to the mounted share.
#   - `kubeletDir: /var/lib/kubelet`, which is kind's kubelet root.
#   - The `csi-nfs-node` DaemonSet with `hostNetwork: true`,
#     `dnsPolicy: ClusterFirstWithHostNet` and one privileged container
#     (`nfs`) that mounts /var/lib/kubelet/pods with bidirectional mount
#     propagation.
#   - The `csi-nfs-controller` Deployment (csi-provisioner, csi-resizer,
#     liveness-probe, nfs).
# Combined CPU requests across both workloads are 70m: 30m for the three node
# containers and 40m for the four controller containers. Chart 4.13.4 asks
# for 80m at its defaults, the extra 10m being the csi-snapshotter sidecar
# the values below switch off.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      # Pinned, not a range. Renovate bumps it; see the header.
      version: "4.13.4"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      # The chart defaults enableSnapshotter to true while
      # externalSnapshotter.enabled defaults to false, so the csi-snapshotter
      # sidecar would run against snapshot.storage.k8s.io CRDs that nothing
      # in this stack installs. The Cinder NFS backend has snapshots off
      # anyway (#979 D3).
      enableSnapshotter: false
    storageClass:
      # Already the chart default, set here with the reason: the
      # cinder-operator mounts inline volumes, so no dynamic class is wanted,
      # and an unwanted class in a kind cluster competes for
      # is-default-class.
      create: false
    feature:
      # The cinder-operator mounts every backend and backup share as an
      # inline `csi:` volume in the pod spec. The driver serves an inline
      # volume only when its CSIDriver lists the `Ephemeral` lifecycle mode,
      # which the chart adds behind this flag (default false).
      #
      # `CSIDriver.spec.volumeLifecycleModes` is immutable, so a cluster whose
      # nfs.csi.k8s.io predates this value cannot be upgraded in place — the
      # API server rejects the patch and this HelmRelease never goes Ready
      # again. hack/deploy-infra.sh therefore drops the object before it
      # applies this overlay whenever the live one lists no `Ephemeral` mode,
      # and the chart recreates it. A fresh cluster needs nothing.
      #
      # TRUST CONSEQUENCE, accepted for this kind-only overlay. The export
      # behind the driver is wildcard-permitted and `no_root_squash`
      # (nfs-server.yaml, "CI-ONLY posture"). Reaching it used to require a
      # cluster-scoped PersistentVolume, which namespaced RBAC does not grant;
      # with the Ephemeral mode the whole mount is expressed in a pod spec, so
      # anyone who can create a Pod in any namespace that is not PSA
      # `restricted` mounts both shares as root — including another suite's
      # volume and backup files. A namespace label does not stop the mount
      # either: `csi` is on the PSS restricted allow-list, so the label bounds
      # the UID and not the volume. The mode is accepted anyway — the operator
      # needs it and this cluster has no untrusted tenant — but it is a reason
      # not to lift this overlay into a non-kind deployment: production
      # clusters bring their own CSI mounter against an export that squashes
      # root.
      enableInlineVolume: true
