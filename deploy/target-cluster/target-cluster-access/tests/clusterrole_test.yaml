# ClusterRole and ClusterRoleBinding unit tests.
suite: ClusterRole
templates:
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
tests:
  - it: should carry only the four cluster-scoped rules by default
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRole
      - lengthEqual:
          path: rules
          count: 4

  - it: should grant read-only on namespaces
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - namespaces
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only on clustersecretstores
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - clustersecretstores
            verbs:
              - get
              - list
              - watch

  # The ovn-operator watches Node labels to steer chassis placement and gateway
  # roles. Nodes have no namespace, so a namespace-scoped cache cannot hold them
  # and the reads have to be cluster-wide.
  - it: should grant read-only on nodes by default
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - get
              - list
              - watch

  # patch on Nodes is an unbounded write that no value turns on: resourceNames
  # cannot narrow it, and it covers the labels and taints of every node
  # alongside the annotations, so it would lift the control-plane NoSchedule
  # taint for a privileged chassis pod. Per-node state goes into a namespaced
  # object instead, which the per-namespace Role already covers.
  - it: should never grant patch on nodes
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
      privilegedNamespaces: []
    asserts:
      # equal on the rule, not notContains on one verb list. notContains is a
      # deep compare against each element, so it rules out exactly the shape it
      # spells and nothing else: [get, list, watch, update, patch] would pass
      # it. Pinning the rule leaves no verb list that does.
      - equal:
          path: rules[2]
          value:
            apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - get
              - list
              - watch
      # And no second rule to hide a write in: four rules by default, each one
      # pinned by a test above.
      - lengthEqual:
          path: rules
          count: 4

  # Neither does the opt-in that does exist: authDelegatorBinding widens the
  # ClusterRoleBinding rule and leaves the node rule read-only.
  - it: should keep nodes read-only with authDelegatorBinding on
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
      authDelegatorBinding: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - get
              - list
              - watch

  # Every ControlPlane teardown reads the auth-delegator ClusterRoleBinding by
  # name before it releases its finalizer, dedicated OpenBao or not. Without the
  # read the API server answers forbidden rather than not-found, and the teardown
  # retries that error instead of releasing, so a default install would leave
  # every placed ControlPlane on this cluster in Terminating.
  - it: should grant read-only on clusterrolebindings by default
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
            verbs:
              - get

  # The grants no namespace bounds: patch and delete reach every
  # ClusterRoleBinding on the cluster, cluster-admin included. A default install
  # must not carry them, so the account a registration kubeconfig authenticates
  # as cannot take the cluster's own control plane apart.
  - it: should grant no writes on clusterrolebindings by default
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
            verbs:
              - get
              - create
              - patch
              - delete
      - notContains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterroles
            resourceNames:
              - system:auth-delegator
            verbs:
              - bind

  - it: should grant clusterrolebindings without list or watch when opted in
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
      authDelegatorBinding: true
    asserts:
      - lengthEqual:
          path: rules
          count: 5
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
            verbs:
              - get
              - create
              - patch
              - delete

  - it: should grant bind on system:auth-delegator and on no other ClusterRole
    template: templates/clusterrole.yaml
    set:
      namespaces:
        - openstack
      authDelegatorBinding: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterroles
            resourceNames:
              - system:auth-delegator
            verbs:
              - bind

  - it: should bind the ClusterRole to the account in the release namespace
    template: templates/clusterrolebinding.yaml
    release:
      namespace: cluster-access
    set:
      namespaces:
        - openstack
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: RELEASE-NAME-target-cluster-access
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: target-cluster-access
              namespace: cluster-access
