# Required-values guard unit tests.
#
# The guard aborts the whole render, so the assertions are chart-wide rather
# than per template: whichever template Helm reaches first raises the error, and
# pinning one of them would only pin the render order.
suite: RequiredValues
tests:
  - it: should fail on the chart default, which declares no namespace
    asserts:
      - failedTemplate:
          errorMessage: "values.namespaces must name at least one namespace (the namespaces key of the registration Secret)"

  - it: should fail on an empty namespaces list
    set:
      namespaces: []
    asserts:
      - failedTemplate:
          errorMessage: "values.namespaces must name at least one namespace (the namespaces key of the registration Secret)"

  - it: should fail when namespaces is absent
    set:
      namespaces: null
    asserts:
      - failedTemplate:
          errorMessage: "values.namespaces must name at least one namespace (the namespaces key of the registration Secret)"

  - it: should render once a namespace is declared
    set:
      namespaces:
        - openstack
    asserts:
      - notFailedTemplate: {}

  # The label lands on a Namespace this chart writes, so an entry naming one it
  # does not write is a typo or a missing declaration. Rendered, it would label
  # nothing and the install would still report success.
  - it: should fail on a privileged namespace that is not declared
    set:
      namespaces:
        - openstack
      privilegedNamespaces:
        - edge
    asserts:
      - failedTemplate:
          errorMessage: 'values.privilegedNamespaces entry "edge" is not in values.namespaces'

  - it: should fail on privileged namespaces without createNamespaces
    set:
      namespaces:
        - openstack
      createNamespaces: false
      privilegedNamespaces:
        - openstack
    asserts:
      - failedTemplate:
          errorMessage: "values.privilegedNamespaces requires createNamespaces: true (the chart cannot label a namespace it does not create)"
