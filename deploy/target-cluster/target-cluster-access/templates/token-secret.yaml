{{/*
A long-lived token for the account, which is what the registration kubeconfig
carries. The management cluster reads the Secret it is registered with on every
reconcile of every placed CR, so a token that expires would take the placement
down with it, and no controller on that side renews one.

Kubernetes fills in the token, the CA bundle, and the namespace once the account
exists; the chart only asks for them.
*/}}
{{- include "target-cluster-access.requireNamespaces" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceAccount.name }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "target-cluster-access.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceAccount.name }}
type: kubernetes.io/service-account-token
