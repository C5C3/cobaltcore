{{/*
One Role per assigned namespace, holding what the c5c3-operator needs to serve
the order kinds there (KeystoneUser, KeystoneProject, KeystoneRoleAssignment,
KeystoneCatalogEntry, KeystoneApplicationCredential, MariaDBDatabase,
RabbitMQVhost) and nothing else: it reads the orders, writes their status and
finalizers, and writes the Secret a KeystoneUser, KeystoneApplicationCredential,
MariaDBDatabase or RabbitMQVhost delivers beside it. It also reads the
mariadb-operator's Database CRs, for a registration that still lists these
namespaces under its namespaces key: the operator's Database informer then spans
them. A MariaDBDatabase's Database CR lives beside the MariaDB, in a placed
namespace, whose Role grants the writes.
No workload kind is granted, so whoever holds the registration kubeconfig
cannot run anything in a namespace that belongs to a service owner.

The finalizers subresource is what lets the delivered Secret carry an owner
reference with blockOwnerDeletion, which the OwnerReferencesPermissionEnforcement
admission plugin checks against update on the owner's finalizers.
*/}}
{{- include "target-cluster-access.requireNamespaces" . }}
{{- include "target-cluster-access.requireAssignedNamespaces" . }}
{{- range $namespace := .Values.assignedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "target-cluster-access.fullname" $ }}-assigned
  namespace: {{ $namespace }}
  labels:
    {{- include "target-cluster-access.labels" $ | nindent 4 }}
rules:
  # core - secrets
  # The Secret <order>-credentials the operator delivers, repairs and deletes.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # c5c3.io - the order kinds
  # The orders themselves: read, and updated to install and release the
  # teardown finalizer. The operator never creates or deletes one.
  - apiGroups:
      - c5c3.io
    resources:
      - keystoneapplicationcredentials
      - keystonecatalogentries
      - keystoneprojects
      - keystoneroleassignments
      - keystoneusers
      - mariadbdatabases
      - rabbitmqvhosts
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # c5c3.io - the order kinds' status
  - apiGroups:
      - c5c3.io
    resources:
      - keystoneapplicationcredentials/status
      - keystonecatalogentries/status
      - keystoneprojects/status
      - keystoneroleassignments/status
      - keystoneusers/status
      - mariadbdatabases/status
      - rabbitmqvhosts/status
    verbs:
      - get
      - update
      - patch
  # c5c3.io - the order kinds' finalizers
  - apiGroups:
      - c5c3.io
    resources:
      - keystoneapplicationcredentials/finalizers
      - keystonecatalogentries/finalizers
      - keystoneprojects/finalizers
      - keystoneroleassignments/finalizers
      - keystoneusers/finalizers
      - mariadbdatabases/finalizers
      - rabbitmqvhosts/finalizers
    verbs:
      - update
  # k8s.mariadb.com - databases (read-only)
  # Only for a registration written before the assignedNamespaces key existed,
  # which still lists these namespaces under namespaces: the c5c3-operator's
  # Database informer then spans them, and a watch that cannot list one never
  # syncs. A registration with the assignedNamespaces key keeps that informer on
  # the placed namespaces. No Database CR is written here, and one an owner
  # writes here wakes no order: the operator maps a Database CR back only from
  # Keystone's namespace.
  - apiGroups:
      - k8s.mariadb.com
    resources:
      - databases
    verbs:
      - get
      - list
      - watch
{{- end }}
