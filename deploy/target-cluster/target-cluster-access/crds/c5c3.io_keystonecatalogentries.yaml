apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: keystonecatalogentries.c5c3.io
spec:
  group: c5c3.io
  names:
    kind: KeystoneCatalogEntry
    listKind: KeystoneCatalogEntryList
    plural: keystonecatalogentries
    singular: keystonecatalogentry
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.controlPlaneRef.name
      name: ControlPlane
      type: string
    - jsonPath: .spec.serviceType
