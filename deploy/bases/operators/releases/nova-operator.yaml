# The nova-operator controller runs in its own dedicated nova-system
# Namespace; the Nova and NovaCompute CRs and the operator-managed payload (five
# Deployments, Services, ConfigMaps, Secrets, the migration Jobs, the archive
# CronJob, HTTPRoutes, NetworkPolicies, and a NovaCompute's nova-compute
# DaemonSet with its config ConfigMaps) live in the tenant Namespace the CRs
# are created in.
# dependsOn: keystone-operator is ordered so the compute service's identity
# backend exists before Nova is projected; mariadb-operator is required
# because Nova has databases and memcached-operator because it caches
# Keystone tokens. That is the dependency set of placement-operator.
# rabbitmq-cluster-operator is absent from the list although every Nova
# process talks over the shared message bus: it is applied by a Flux
# Kustomization, and a HelmRelease dependsOn can only reference other
# HelmReleases. See the "Dependency Order" section of
# docs/reference/infrastructure/infrastructure-manifests.md.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nova-operator
  namespace: nova-system
spec:
  interval: 30m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: mariadb-operator
      namespace: mariadb-system
    - name: memcached-operator
      namespace: memcached-system
    - name: external-secrets
      namespace: external-secrets
    - name: keystone-operator
      namespace: keystone-system
  chart:
    spec:
      chart: nova-operator
      # Floor 0.1.0: the first published chart, whose values schema already
      # accepts image.digest. Older charts do not exist: 0.1.0 was published
      # to GHCR when #1017 (PR #1026) landed on main.
      version: ">=0.1.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: c5c3-charts
        namespace: flux-system
  values:
    replicas: 2
    leaderElection:
      enabled: true
    image:
      # Use latest until a versioned release (v* git tag) publishes a semver image tag.
      # The chart default (appVersion) only resolves once a v0.1.0 git tag
      # publishes the 0.1.0 image; the chart itself is already published.
      tag: latest
  # image.digest is injected from a ConfigMap that
  # hack/refresh-operator-image-digests.sh (re)applies at deploy time on the
  # WITH_CONTROLPLANE flux path, pinning the mutable :latest tag to the digest
  # current at deploy. With optional: true an absent ConfigMap (the default
  # Quick Start and CI paths) leaves the release rendering exactly as before.
  # Flux merges valuesFrom first, then spec.values on top per-key (deep
  # merge), so image.tag stays from spec.values and image.digest comes only
  # from here.
  valuesFrom:
    - kind: ConfigMap
      name: nova-operator-image-digest
      valuesKey: values.yaml
      optional: true
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
