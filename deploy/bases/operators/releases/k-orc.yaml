# Deploy K-ORC from the immutable main-line commit in sources/k-orc.yaml.
# Keep ./config/default: its namespace and namePrefix place resources in
# orc-system, so spec.targetNamespace is deliberately unset.
#
# Upstream publishes branch-main on every main push; there is no latest tag.
# The digest, not the tag, resolves the deployed image. A tag-only edit must
# never turn this into a floating pull.
#
# The digest is NOT the one branch-main resolves to. quay drops a branch-main
# digest in the second the tag moves to the next build. Upstream pushes the
# same build a second time as commit-<short sha>, with the same platform
# images in an index of its own, and that tag expires 28 days after its push.
# Renovate's korc-commit-image datasource (renovate.json) pins the index of
# the commit tag pushed with the current branch-main build and groups it with
# the source commit. A pin lasts 28 days at most, so keep the Renovate updates
# merging. CI compares each platform's build provenance with the source pin
# before deploying. A source-only update cannot pass that gate.
#
# Credentials: the previous HelmRelease set globalCloudConfig.secretName, the chart
# value for K-ORC's GLOBAL default clouds.yaml mount. The upstream installer has no
# such knob. There is NO static orc-system clouds.yaml copy anymore — the static
# No static ExternalSecret supplies a global clouds.yaml mount.
# K-ORC needs no global default clouds.yaml mount because (C1) every
# c5c3-operator K-ORC CR carries a per-resource CloudCredentialsRef that K-ORC
# resolves in the CR's OWN (control-plane) namespace; the upstream installer ships
# no globalCloudConfig knob.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # Short, stable name so other manifests/diagnostics reference K-ORC as "k-orc"
  # (the upstream installer's own resources keep their openstack-resource-controller
  # names). Flux Kustomizations live in flux-system alongside their source.
  name: k-orc
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: k-orc
    namespace: flux-system
  path: ./config/default
  images:
    - name: controller
      newName: quay.io/orc/openstack-resource-controller
      # Names the build line and anchors Renovate's rule; the digest below, the
      # index of the build's commit-<short sha> tag, is what resolves the pull.
      newTag: branch-main
      digest: sha256:bf8553c502998e6051d3d6b7e3b23e7b69ad7d68d0355e40d50c446087bded07
  prune: true
  wait: true
