# K-ORC supplies the Keystone resource CRDs consumed by c5c3. Track upstream
# main through Renovate while retaining an immutable source commit. Its grouped
# update also refreshes the digest of the branch-main image. CI verifies the
# image's build provenance against this commit.
#
# Upstream expires commit-* image tags after 28 days. branch-main is the rolling
# discovery tag; deployments still pull the digest in releases/k-orc.yaml.
# Renovate updates must merge before an old image is garbage-collected. A fixed
# digest is reproducible while retained, but does not extend registry retention.
#
# SPARSE CHECKOUT, not only spec.ignore. For a ref.commit the source-controller
# clones the tip of upstream main and then hard-resets the worktree to the pinned
# commit, which removes every path the tip has and the pin lacks. go-git fails on
# one kind of path: a symlink to a non-empty directory. Upstream added
# charts/orc-crds/crds -> ../../config/crd/bases after an earlier pin, and the reset
# then ended in "remove .../config/crd/bases: directory not empty", so the source
# never became Ready and the c5c3-operator crash-looped for want of the K-ORC
# CRDs. With spec.sparseCheckout the clone starts from an empty worktree and
# materialises only the listed directories, so nothing outside them is ever
# removed, whatever upstream main holds there. The list has to cover the
# spec.path the Kustomization builds (releases/k-orc.yaml);
# tests/unit/deploy/korc_flux_source_test.sh guards both.
#
# spec.ignore stays next to it and scopes the source ARTIFACT to /config, so it
# stays small (the full upstream repo carries a website/, examples/, tooling,
# etc.). It filters after the checkout and cannot prevent the failure above.
#
# Renovate: the pinned commit below is tracked by a customManager rule in
# renovate.json (datasource git-refs, currentValue main), so it cannot silently
# drift from the go.mod k-orc module version the operator compiles against.
# hack/ci-deploy-korc.sh parses this same commit so the CI installer and the Flux
# source stay in lockstep. The container image in releases/k-orc.yaml (pinned by
# digest, with newTag: commit-<short sha> as its drift anchor) is NOT independently
# Renovate-tracked; the ci-deploy-korc.sh drift guard (run offline on every pull
# request by tests/unit/deploy/korc_pin_lockstep_test.sh) plus e2e keep it honest, so a
# Renovate commit-bump PR fails CI until the image is re-pinned in lockstep.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: k-orc
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/k-orc/openstack-resource-controller
  ref:
    commit: c48889697d73221e39497dac0ae89e2000d6a0c7
  sparseCheckout:
    - config
  ignore: |
    # Vendor only the config/ kustomize base; skip the rest of the repo.
    /*
    !/config
