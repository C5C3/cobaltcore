# OCIRepository for the kubebao/openbao-operator chart. Every other chart in
# this stack rides an OCI-type HelmRepository; this one does not, because it is
# the one chart that has to pin CONTENT rather than a version.
#
# `0.5.3` on oci://ghcr.io/kubebao/charts is a MUTABLE tag. A HelmRepository
# plus an exact chart.spec.version gates version drift only: Flux resolves the
# tag on every interval and tracks the resulting artifact DIGEST, so re-pushing
# the tag with different bytes produces a new revision and the HelmRelease
# upgrades itself — no Git change, no reviewer, cluster-wide operator RBAC over
# the namespace that holds the instance seal key. spec.verify is not the control
# either: whether Flux can verify the sigstore bundles the publisher attaches is
# not established, so the digest pin stays the control.
#
# ref.digest closes that: it takes precedence over every other ref field, so
# Flux pulls this exact manifest and a re-pushed tag cannot change what runs.
# ref.tag rides alongside it as the human-readable version and as Renovate's
# lookup handle.
#
# Renovate's native flux manager reads deploy/bases/operators/, but a packageRule
# switches it off for this file, because the openbao-operator customManager in
# renovate.json moves the tag and the digest in one match and so bumps both in
# one reviewed PR; tests/unit/renovate/openbao_operator_chart_custommanager_test.sh
# guards that pairing.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: openbao-operator
  namespace: flux-system
spec:
  interval: 1h
  # Unlike a HelmRepository, the url of an OCIRepository is the chart artifact
  # itself, not the registry namespace it lives in.
  url: oci://ghcr.io/kubebao/charts/openbao-operator
  # `copy` hands the chart tarball to helm-controller unaltered, which is what a
  # HelmRelease chartRef consumes; the default `extract` would unpack it.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: "0.5.3"
    digest: "sha256:3da12c3dd3f8083ab56888ad84de3224dff859400a7716c22db7bb3e24599ff6"
