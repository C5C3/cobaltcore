# Shared development instances and secret shims, using the cluster default storage class.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../infrastructure
  - barbican-db-externalsecret.yaml
  - cinder-db-externalsecret.yaml
  - garage-admin-token-externalsecret.yaml
  - garage-s3-credentials-externalsecret.yaml
  - glance-db-externalsecret.yaml
  - horizon-secret-key-externalsecret.yaml
  - keystone-admin-externalsecret.yaml
  - keystone-db-externalsecret.yaml
  - mariadb-root-password-externalsecret.yaml
  - neutron-db-externalsecret.yaml
  - nova-api-db-externalsecret.yaml
  - nova-db-externalsecret.yaml
  - openbao-instance-unseal-key-externalsecret.yaml
  - openbao-instance.yaml
  - openbao-tenant.yaml
  - placement-db-externalsecret.yaml
patches:
  # MariaDB: single replica, no Galera, no MaxScale, standard storage.
  #
  # Intentional divergence the kind overlay disables
  # spec.tls. The production base (deploy/bases/infrastructure/
  # mariadb.yaml) enables TLS via serverCertIssuerRef/clientCertIssuerRef
  # because mariadb-operator issues per-Galera-node server certs and
  # MaxScale terminates client TLS. In the kind overlay we patch out Galera
  # AND MaxScale to fit a single-node cluster — leaving spec.tls.enabled=true
  # would force a single-replica mariadbd to terminate TLS without the
  # listener Galera/MaxScale provides, a posture that has not been verified
  # in this environment. Disabling TLS in kind keeps the Quick Start path
  # green; the production TLS posture is exercised by the
  # tests/e2e/keystone/database-tls/ chainsaw suite on a full Galera+MaxScale
  # cluster. To exercise the mTLS path against kind,
  # remove this spec.tls override, re-enable Galera and the maxScaleRef in
  # this patch, and drop the MaxScale delete patch below.
  - target:
      group: k8s.mariadb.com
      version: v1alpha1
      kind: MariaDB
      name: openstack-db
      namespace: openstack
    patch: |
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      metadata:
        name: openstack-db
        namespace: openstack
      spec:
        replicas: 1
        galera:
          enabled: false
        # The base's MaxScale CR is deleted by the next patch; drop the
        # reference to it as well.
        maxScaleRef: null
        # Probe thresholds only: a probe override without a handler keeps
        # mariadb-operator's own exec command (SELECT 1 as root) and merges
        # these values over its defaults (timeoutSeconds 5, periodSeconds 10,
        # failureThreshold 3). Those defaults kill the single replica after
        # thirty seconds of slow answers, which on a CI kind node is not death
        # but CPU contention: concurrent e2e suites running their db-sync Jobs
        # starved the node, the SELECT 1 ran past five seconds, and the kubelet
        # restarted the database mid schema migration, failing every suite in
        # flight. Sixty seconds of liveness tolerance rides out the contention;
        # readiness keeps the tighter threshold so a genuinely wedged server
        # still leaves the Service.
        livenessProbe:
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
        # Memory only, no CPU. Without a request the single replica is
        # BestEffort, the QoS class the kernel OOM killer takes first
        # (oom_score_adj 1000), while every operator workload requests memory
        # (internal/common/types/resources.go). When two parallel e2e suites
        # push a 4-vCPU runner past its RAM, the largest BestEffort process
        # on the node is mariadbd: CI run 34718789784 restarted openstack-db-0
        # five times in 36 minutes, each start an InnoDB crash recovery, and
        # whichever suite was waiting on DatabaseReady at that moment failed.
        # The request moves the database below the service pods in the
        # killer's order and makes the scheduler account for it; the equal
        # limit bounds mariadbd (server defaults: 128M buffer pool, 151
        # connections) so an undersized value surfaces as OOMKilled against
        # a limit instead of a restart nobody can attribute. No CPU: a 500m
        # request left pods Pending on the 4-vCPU keystone leg (#970), and a
        # CPU limit would throttle the SELECT 1 probe relaxed above.
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 1Gi
        storage:
          size: 1Gi
          storageClassName: null
        tls:
          enabled: false
          required: false

  # MaxScale: none on the single-node cluster. The base's standalone MaxScale
  # CR is removed, the patch above drops the MariaDB's maxScaleRef to it.
  - target:
      group: k8s.mariadb.com
      version: v1alpha1
      kind: MaxScale
      name: openstack-db-maxscale
      namespace: openstack
    patch: |
      $patch: delete
      apiVersion: k8s.mariadb.com/v1alpha1
      kind: MaxScale
      metadata:
        name: openstack-db-maxscale
        namespace: openstack

  # Memcached: single replica
  - target:
      group: memcached.c5c3.io
      version: v1beta1
      kind: Memcached
      name: openstack-memcached
      namespace: openstack
    patch: |
      apiVersion: memcached.c5c3.io/v1beta1
      kind: Memcached
      metadata:
        name: openstack-memcached
        namespace: openstack
      spec:
        replicas: 1

  # Garage: single storage node with small PVCs on the kind default storage
  # class (mirrors the MariaDB/Memcached single-node kind footprint).
  - target:
      group: garage.rajsingh.info
      version: v1beta2
      kind: GarageCluster
      name: garage
      namespace: shared-services
    patch: |
      apiVersion: garage.rajsingh.info/v1beta2
      kind: GarageCluster
      metadata:
        name: garage
        namespace: shared-services
      spec:
        storage:
          replicas: 1
          metadata:
            size: 512Mi
            storageClassName: null
          data:
            size: 2Gi
            storageClassName: null
