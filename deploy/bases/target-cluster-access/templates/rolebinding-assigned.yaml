{{/*
One RoleBinding per assigned namespace, each binding that namespace's assigned
Role to the single account in the release namespace.
*/}}
{{- include "target-cluster-access.requireNamespaces" . }}
{{- include "target-cluster-access.requireAssignedNamespaces" . }}
{{- range $namespace := .Values.assignedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "target-cluster-access.fullname" $ }}-assigned
  namespace: {{ $namespace }}
  labels:
    {{- include "target-cluster-access.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "target-cluster-access.fullname" $ }}-assigned
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
