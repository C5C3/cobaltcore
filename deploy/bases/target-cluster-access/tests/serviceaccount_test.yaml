# ServiceAccount and token Secret unit tests.
suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
  - templates/token-secret.yaml
tests:
  - it: should create the account in the release namespace
    template: templates/serviceaccount.yaml
    release:
      namespace: cluster-access
    set:
      namespaces:
        - openstack
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: target-cluster-access
      - equal:
          path: metadata.namespace
          value: cluster-access

  - it: should honour a custom account name
    template: templates/serviceaccount.yaml
    set:
      namespaces:
        - openstack
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should create a service-account token Secret next to the account
    template: templates/token-secret.yaml
    release:
      namespace: cluster-access
    set:
      namespaces:
        - openstack
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: type
          value: kubernetes.io/service-account-token
      - equal:
          path: metadata.name
          value: target-cluster-access-token
      - equal:
          path: metadata.namespace
          value: cluster-access
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: target-cluster-access

  - it: should point the token Secret at a custom account name
    template: templates/token-secret.yaml
    set:
      namespaces:
        - openstack
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa-token
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: custom-sa
