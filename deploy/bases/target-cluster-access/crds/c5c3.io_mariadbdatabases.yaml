kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mariadbdatabases.c5c3.io
spec:
  group: c5c3.io
  names:
    kind: MariaDBDatabase
    listKind: MariaDBDatabaseList
    plural: mariadbdatabases
    singular: mariadbdatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.controlPlaneRef.name
      name: ControlPlane
      type: string
    - jsonPath: .status.databaseName
      name: Database
