# openbao-operator (dc-tec/openbao-operator) manages OpenBaoCluster instance
# CRs: static-seal auto-unseal, cert-manager TLS, declarative self-init, raft
# snapshots, upgrade strategies. It delivers the per-service OpenBao instances
# the Barbican secret store builds on and the in-repo proving instance
# (deploy/kind/infrastructure/openbao-instance.yaml).
#
# The operator ships ValidatingAdmissionPolicies and requires Kubernetes >=
# 1.33. It needs cert-manager for nothing itself, but the instance TLS
# Certificates do, and the stack's dependency order keeps cert-manager first,
# so this release dependsOn cert-manager (mirroring garage-operator).
#
# ACCEPTED RISK: openbao-operator is a young, single-maintainer, pre-1.0
# (v0.4.x) project, and unlike garage-operator it sits in the PRODUCTION DATA
# PATH of every future Barbican secret store. The bet is mitigated by the thin
# consumed surface (one OpenBaoCluster CR shape), the operator-independent
# brownfield attachment path on the shared instance, and the open fallback of
# an in-repo openbao-helm-derived StatefulSet projection. Accepted with issue
# #803 for the Barbican onboarding (#804).
#
# The chart carries no cosign signature Flux can verify, so no spec.verify
# policy can gate it. It is therefore consumed through a DIGEST-PINNED
# OCIRepository (deploy/flux-system/sources/openbao-operator.yaml) rather than
# through a HelmRepository plus a version constraint as with garage-operator.
# garage-operator's `>=x <1.0.0` range would install every future 0.x release of
# an individual-owned GHCR namespace within one interval; an exact chart version
# would still upgrade on its own whenever that tag is re-pushed with different
# bytes, because Flux tracks the resolved artifact digest and not the tag
# string. Pinning the digest is what puts a reviewer in front of every change to
# what runs here — see the source manifest for the Renovate side of it.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao-operator
  namespace: openbao-operator-system
spec:
  interval: 30m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chartRef:
    kind: OCIRepository
    name: openbao-operator
    namespace: flux-system
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # Multi-tenant mode. The c5c3 operator projects a dedicated OpenBaoCluster
  # into the Barbican service namespace of every ControlPlane, and those
  # namespaces are created at runtime, so no single watched namespace covers
  # them. Multi-tenant mode deploys the provisioner next to the controller and
  # lets the controller reconcile in every onboarded namespace. tenancy.mode
  # only shapes the chart's own output: the controller derives its tenancy from
  # the WATCH_NAMESPACE environment variable, which no chart template sets, so
  # an unset controller.extraEnv is what actually runs it multi-tenant.
  #
  # namespacePodSecurityLabels.mode: external bounds what that costs in RBAC.
  # Under the chart default (enforce) the provisioner holds update and patch on
  # namespaces cluster-wide and stamps restricted Pod Security labels onto every
  # onboarded namespace, including openstack, the namespace that hosts every
  # OpenStack service workload — which restricted would start rejecting. external
  # drops those verbs from the ClusterRole and widens the chart's
  # ValidatingAdmissionPolicy to deny the provisioner any Namespace update at
  # all. Tenant RBAC onboarding is unaffected.
  #
  # ACCEPTED GAP: this repo ships no policy layer that stamps the labels instead.
  # Nothing here sets pod-security.kubernetes.io/* on a service namespace (the
  # only occurrence in the tree is deploy/kind/chaos-mesh/namespace.yaml, which
  # sets privileged), and reconcileNamespaces stamps none either, so an onboarded
  # namespace admits pods at whatever the cluster default is. For a namespace
  # holding a dedicated OpenBao instance that is the seal key and the raft volume
  # in reach of any pod that namespace admits. Closing it means picking an
  # enforcement level the OpenStack workloads in openstack actually satisfy and
  # stamping it from the platform side — not from this operator, whose labels
  # would land on the same namespace with the same problem.
  #
  # Every namespace hosting an OpenBaoCluster needs an OpenBaoTenant. Without
  # one the controller waits for the RoleBinding
  # openbao-operator-tenant-rolebinding that tenant onboarding creates and
  # pauses every reconcile in that namespace, silently, at log level V(1),
  # leaving the OpenBaoCluster with an empty status and no StatefulSet. The c5c3
  # operator creates a tenant for each service namespace it projects into; the
  # kind overlay carries a static one for the proving instance in openstack
  # (deploy/kind/infrastructure/openbao-tenant.yaml).
  values:
    tenancy:
      mode: multi
      namespacePodSecurityLabels:
        mode: external
