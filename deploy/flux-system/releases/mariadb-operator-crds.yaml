# MariaDB Operator CRDs — separate chart required since mariadb-operator v0.35.0.
# Must be installed before mariadb-operator so CRDs are available for the operator
# and for infrastructure CRs (e.g., MariaDB Galera cluster).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: mariadb-system
spec:
  interval: 30m
  chart:
    spec:
      chart: mariadb-operator-crds
      # The floor follows the github.com/mariadb-operator/mariadb-operator/v26
      # Go module the operators build against and the CRDs the manifests
      # need (no embedded spec.maxScale since 25.10.3).
      version: ">=26.10.2 <27.0.0"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
