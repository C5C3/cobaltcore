# The ovn-operator controller runs in its own dedicated ovn-system Namespace;
# the OVNCentral and OVNChassis CRs and the operator-managed payload
# (StatefulSet, Deployment, DaemonSet, Services, ConfigMaps, Secrets) live
# in the tenant Namespace the CRs are created in.
# dependsOn: cert-manager only. The OVN databases speak mTLS, and the
# Certificates the operator issues for them (internal/controller/reconcile_tls.go)
# need the cert-manager CRDs and its issuers. Nothing else is consumed: OVN
# keeps its state in its own OVSDB raft cluster, so there is no MariaDB
# database, no Memcached cache and no Keystone identity behind this operator.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ovn-operator
  namespace: ovn-system
spec:
  interval: 30m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: ovn-operator
      # Floor 0.1.0: the first published chart, whose values schema already
      # accepts image.digest. Older charts do not exist — this operator is
      # first published to GHCR when this release lands on main.
      version: ">=0.1.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: c5c3-charts
        namespace: flux-system
  values:
    replicas: 2
    leaderElection:
      enabled: true
    image:
      # Use latest until a versioned release (v* git tag) publishes a semver image tag.
      # The chart default (appVersion) only works once 0.1.0 has been released.
      tag: latest
  # image.digest is injected from a ConfigMap that
  # hack/refresh-operator-image-digests.sh (re)applies at deploy time on the
  # WITH_CONTROLPLANE flux path, pinning the mutable :latest tag to the digest
  # current at deploy. optional: true — when the ConfigMap is absent (default
  # Quick Start and CI paths) the release renders exactly as before. Flux
  # merges valuesFrom first, then spec.values on top per-key (deep merge), so
  # image.tag stays from spec.values and image.digest comes only from here.
  valuesFrom:
    - kind: ConfigMap
      name: ovn-operator-image-digest
      valuesKey: values.yaml
      optional: true
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
