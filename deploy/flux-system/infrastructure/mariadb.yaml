# MariaDB Galera cluster for OpenStack infrastructure databases.
# The mariadb-operator manages this CR and provisions a 3-node Galera cluster
# with automatic failover and synchronous replication.
#
# TLS is configured via ClusterIssuer refs rather than raw CA Secret refs.
# Verified against the mariadb-operator v26.10.2 Go types
# (github.com/mariadb-operator/mariadb-operator/v26, k8s.mariadb.com/v1alpha1:
# TLS.ServerCertIssuerRef, TLS.ClientCertIssuerRef in
# api/v1alpha1/mariadb_types.go). The operator auto-derives the
# server/client CA bundles from the referenced issuer, which:
#   (a) avoids the cross-namespace problem of mirroring the CA bundle Secret
#       from the cert-manager clusterResourceNamespace (where the CA keypair
#       lives, see db-ca-issuer.yaml) into the openstack namespace.
#   (b) keeps the trust root unified with the Keystone DB-client cert that
#       the Keystone operator issues from the same ClusterIssuer
#       (operators/keystone/internal/controller/reconcile_databasetls.go).
#
# MaxScale is a CR of its own, openstack-db-maxscale below. mariadb-operator
# 25.10.3 removed the embedded spec.maxScale of the MariaDB CR; up to then
# spec.maxScale.enabled made the operator create exactly that CR (name
# <mariadb>-maxscale, mariaDbRef to the MariaDB) and set spec.maxScaleRef on
# the MariaDB. The two documents spell out what the operator used to derive,
# so the topology stays the same.
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: openstack-db
  namespace: openstack
spec:
  replicas: 3
  galera:
    enabled: true
  # Makes the MariaDB MaxScale-aware: it takes the primary MaxScale reports
  # and leaves primary failover to MaxScale.
  maxScaleRef:
    name: openstack-db-maxscale
  # The mariadb-root-password Secret will be provisioned by the External
  # Secrets Operator integration.
  rootPasswordSecretKeyRef:
    name: mariadb-root-password
    key: password
  storage:
    size: 100Gi
    storageClassName: ceph-rbd
  metrics:
    enabled: true
  primaryService:
    type: ClusterIP
  secondaryService:
    type: ClusterIP
  # TLS to the database. Galera inter-node traffic and the Keystone client
  # sit inside the OpenStack DB trust domain rooted at the
  # "openstack-db-ca-issuer" ClusterIssuer defined in db-ca-issuer.yaml.
  # The MaxScale listener and admin API join it through
  # listenerCertIssuerRef / adminCertIssuerRef of the MaxScale CR below.
  tls:
    enabled: true
    required: true
    serverCertIssuerRef:
      name: openstack-db-ca-issuer
      kind: ClusterIssuer
      group: cert-manager.io
    clientCertIssuerRef:
      name: openstack-db-ca-issuer
      kind: ClusterIssuer
      group: cert-manager.io
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MaxScale
metadata:
  name: openstack-db-maxscale
  namespace: openstack
spec:
  # Servers and the monitor module (galeramon) are inferred from the
  # referenced MariaDB.
  mariaDbRef:
    name: openstack-db
  replicas: 2
  # One writer: readwritesplit sends autocommit reads to the replicas unless
  # max_slave_connections is 0, and with wsrep_sync_wait at 0 such a read can
  # miss a commit the primary made milliseconds earlier. The OpenStack
  # operators route a service through a MaxScale only when it has a
  # readwritesplit service with max_slave_connections "0" on the database
  # port (database.ResolveEndpoint); any other MaxScale is bypassed for
  # openstack-db-primary with a DatabaseMaxScaleBypassed Warning. Name,
  # router and port equal what MaxScale.SetDefaults writes on an install
  # without spec.services, so the router, which the webhook keeps immutable,
  # does not change.
  services:
    - name: rw-router
      router: readwritesplit
      params:
        max_slave_connections: "0"
      listener:
        port: 3306
  # MaxScale terminates TLS on its client listener (3306) and its admin
  # REST API (8989). Both certificates come from the OpenStack DB trust
  # domain: the two issuer refs name the ClusterIssuer that the MariaDB's
  # serverCertIssuerRef names. Without them mariadb-operator provisions a
  # self-signed CA of its own, openstack-db-maxscale-ca, and signs both
  # certificates with it.
  # There is no listenerCASecretRef / adminCASecretRef: the trust chain is
  # the ca.crt that cert-manager writes into each certificate Secret, and a
  # CA ref would replace it. There is no listenerCertSecretRef /
  # adminCertSecretRef either, because the webhook rejects a cert Secret
  # ref beside an issuer ref.
  # The ServerCA/ServerCert refs MaxScale uses towards the MariaDB servers
  # still default from the referenced MariaDB (MaxScaleTLS.SetDefaults in
  # api/v1alpha1/maxscale_types.go of the v26 module).
  tls:
    enabled: true
    listenerCertIssuerRef:
      name: openstack-db-ca-issuer
      kind: ClusterIssuer
      group: cert-manager.io
    adminCertIssuerRef:
      name: openstack-db-ca-issuer
      kind: ClusterIssuer
      group: cert-manager.io
