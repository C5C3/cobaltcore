# Namespace resources for all infrastructure components.
# Applied before any namespaced resources to ensure target namespaces exist.
#
# keystone-system is added so the
# keystone-operator HelmRelease can run in its own dedicated Namespace
# instead of co-tenanting with the Keystone workload in openstack; the
# dead monitoring-system Namespace is dropped after the
# prometheus-operator-crds and memcached-operator releases were repointed
# at the live monitoring Namespace, which the flux base now owns directly
# (previously only declared in the kind overlay).
#
# c5c3-system hosts the c5c3-operator controller in its own
# dedicated Namespace (mirroring keystone-system), and orc-system hosts the
# K-ORC (OpenStack Resource Controller) manager that provides the declarative
# Keystone resource CRDs the c5c3-operator drives. The orc-system Namespace is
# co-declared here because the K-ORC installer's own resources land there; it no
# longer hosts a static k-orc-clouds-yaml ExternalSecret (removed).
# rabbitmq-system is co-declared for the same reason: the RabbitMQ Cluster
# Operator installer's own resources land there.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: mariadb-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: memcached-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: openstack
---
apiVersion: v1
kind: Namespace
metadata:
  # shared-services hosts infrastructure consumed by more than one control
  # plane: the shared OpenBao cluster and the Garage object store. Components
  # that exist only to run the operators standalone (the static MariaDB and
  # Memcached instances, the proving OpenBao instance, the kind Gateway) stay
  # in openstack.
  #
  # TRUST ZONE. This namespace holds the credentials that unlock every other
  # secret in the stack: openbao-init-keys (root token plus all Shamir unseal
  # key shares, plaintext), openbao-tls (the server key) and
  # eso-openbao-client-tls (the mTLS identity ESO presents on every OpenBao
  # call). Namespace-scoped read access to Secrets here is therefore equivalent
  # to read access to the whole store, and the namespace is on the
  # openbao-cluster-store allow-list (deploy/eso/clustersecretstore.yaml), so an
  # ExternalSecret created here reaches bootstrap/* as well. Do not co-locate a
  # workload that needs either — and in particular do not grant a Role with
  # `get secrets` in this namespace to anything but OpenBao itself. Garage is
  # the one accepted co-tenant, and it is granted neither.
  name: shared-services
---
apiVersion: v1
kind: Namespace
metadata:
  name: keystone-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: horizon-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: glance-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: placement-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: barbican-system
---
apiVersion: v1
kind: Namespace
metadata:
  # ovn-system hosts the ovn-operator controller; the OVNCentral and OVNChassis
  # CRs and their payload live in the tenant Namespace they are created in.
  name: ovn-system
---
apiVersion: v1
kind: Namespace
metadata:
  # neutron-system hosts the neutron-operator controller; the Neutron and
  # NeutronMetadataAgent CRs and their payload live in the tenant Namespace
  # they are created in.
  name: neutron-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: c5c3-system
---
apiVersion: v1
kind: Namespace
metadata:
  # garage-system hosts the garage-operator controller (S3 object store for the
  # CI/e2e stack), mirroring the mariadb-system / memcached-system operators.
  name: garage-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: orc-system
---
apiVersion: v1
kind: Namespace
metadata:
  # openbao-operator-system hosts the openbao-operator controller. The shared
  # OpenBao instance runs in shared-services, and the operator keeps its own
  # lifecycle namespace, which keeps the shared-instance and operator
  # lifecycles separate.
  name: openbao-operator-system
---
apiVersion: v1
kind: Namespace
metadata:
  # rabbitmq-system hosts the rabbitmq-cluster-operator controller, which serves
  # the RabbitmqCluster CRD behind the ControlPlane's shared message bus. The
  # upstream installer declares this Namespace too; it is co-declared here (as
  # orc-system is) so it exists before the Kustomization reconciles.
  name: rabbitmq-system
# The chaos-mesh Namespace lives in the opt-in overlay deploy/kind/chaos-mesh/,
# not here, so the privileged PodSecurity label is created only when Chaos Mesh
# is actually deployed.
