# Legacy aggregate: runtime, operators, shared OpenBao and c5c3.
# New staged consumers start at deploy/README.md#reusable-bases. Do not reconcile both
# this aggregate and its staged equivalents against the same objects.
# Add controller sources/releases to their own catalogs, not to this list.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - fluxinstance.yaml
  - sources
  - releases
  - releases/openbao
  - releases/c5c3-operator
