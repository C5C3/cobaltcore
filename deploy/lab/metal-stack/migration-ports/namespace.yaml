# The namespace of the migration port reservation (reservation-daemonset.yaml)
# and of what ../hypervisor adds to it: the libvirt migration CA, its Issuer,
# the per-node Certificates openstack-hypervisor-operator requests
# (libvirt-<node>, Secret tls-libvirt-<node>) and kvm-node-agent. Every
# CobaltCore operator reads Secrets in openstack, and a tls-libvirt-<node>
# Secret is root on its node's libvirtd
# (docs/reference/nova/novacompute-crd.md, Live migration), so the
# certificates live here and not there.
#
# The label and the annotation are the lab's rule for every namespace it
# declares (see ../base/kustomization.yaml). The label keeps Gardener's
# kubernetes-service-host webhook from rewriting KUBERNETES_SERVICE_HOST in
# the namespace's pods. The annotation lets a Chaos Mesh experiment select a
# pod here, as the namespace filter of ../chaos-mesh/kustomization.yaml
# requires; without Chaos Mesh it does nothing.
apiVersion: v1
kind: Namespace
metadata:
  name: hypervisor-system
  labels:
    apiserver-proxy.networking.gardener.cloud/inject: disable
  annotations:
    chaos-mesh.org/inject: enabled
