#   == filesystems
#   nfs4: not registered
#   nfsd: not registered
#   == nested / iommu
#   kvm_intel nested=Y
#   iommu groups: 79
#   == memory
#   MemTotal:       131558552 kB
#   HugePages_Total:       0
#   HugePages_Free:        0
#   HugePages_Rsvd:        0
#   HugePages_Surp:        0
#   Hugepagesize:       2048 kB
#   Hugetlb:               0 kB
#   == disks
#   NAME          SIZE TYPE FSTYPE MOUNTPOINT     MODEL                                    ROTA
#   nvme0n1     894.3G disk                       SAMSUNG MZQL2960HCJR-00A07                  0
#   |-nvme0n1p1   500M part        /host/boot/efi                                             0
#   |-nvme0n1p2   4.9G part        /host                                                      0
#   `-nvme0n1p3 888.9G part                                                                   0
#   Filesystem                   Size  Used Avail Use% Mounted on
#   /dev/nvme0n1p2               4.8G  1.5G  3.1G  33% /host
#   /dev/mapper/csi--lvm-varlib  192G   13G  169G   8% /host/var/lib
#   == cgroup
#   cgroup2fs
#   == host os / binaries
#   PRETTY_NAME="Debian GNU/Linux 12 (bookworm)"
#   NAME="Debian GNU/Linux"
#   VERSION_ID="12"
#   usr/sbin/libvirtd: absent
#   usr/bin/qemu-system-x86_64: absent
#   usr/sbin/ovs-vswitchd: absent
#   usr/sbin/rpc.nfsd: absent
#   == containerd socket
#   run/containerd/containerd.sock: socket
#   run/k3s/containerd/containerd.sock: absent
#   config.toml [grpc] address: "/run/containerd/containerd.sock"
#   == nics
#   br-int: mtu=1500 operstate=down
#   cali21903bc434e: mtu=1460 operstate=up
#   eth0: mtu=1500 operstate=down
#   eth2: mtu=1500 operstate=down
#   genev_sys_6081: mtu=65000 operstate=unknown
#   lan0: mtu=9000 operstate=up
#   lan1: mtu=9000 operstate=up
#   lo: mtu=65536 operstate=unknown
#   ovs-system: mtu=1500 operstate=down
#
# Reading it: `/dev/kvm` present, VT-x and a `kvm-intel` module file mean
# `virtType: kvm`; an `openvswitch`, `geneve` and `vhost_net` module file mean
# the OVN chassis and the libvirt DaemonSet can load what they need; the lab's
# /var/lib is the 192G LVM volume; the uplinks lan0 and lan1 carry MTU 9000
# and the pod network (the cali* host ends) MTU 1460; no libvirt, QEMU, OVS or
# NFS server runs on the host. The `nfsd`, `nfs` and `nfsv4` module files mean
# the NFS stack of #1193 can use the node's kernel: the server can be the
# kernel's nfsd in a privileged pod, as on kind, and the clients can mount
# NFSv4. nfs-module-load.yaml loaded all three on the same node on
# 2026-10-03; that run and the probe's run of the same day decided D1 and D2
# of #1193 in a comment there. `not registered` under `== filesystems` means
# no NFS module is loaded. The nfs module registers nfs4, not nfsv4, so
# `nfs4: registered` does not show that the NFSv4 client code is there; the
# `nfsv4` module file does.
#
# The six Chaos Mesh module files, `ip_set`, `ip_set_hash_ip`,
# `ip_set_hash_net`, `xt_set`, `sch_netem` and `sch_tbf`, each print a path,
# so a pod can load every module NetworkChaos needs: D3 of #1219 stands, and
# #1221 is to load all six. `xt_set`, `ip_set_hash_ip`, `ip_set_hash_net` and
# `ip_set` under `== loaded modules` were loaded at the time of the run. This
# does not shorten the list: a reboot or a replaced node starts without them.
# `run/containerd/containerd.sock: socket` means #1221 can mount
# /run/containerd/containerd.sock, the kind overlay's value, and the [grpc]
# address names the same path. A `NOT FOUND` among the six means no pod can
# load that module on the node; a socket line other than `socket` means the
# kind overlay's path does not fit. The other worker printed the same module
# and socket lines; the comment on #1219 holds both outputs.
#
# `geneve`, `openvswitch`, `vhost_net` and their helpers under
# `== loaded modules`, and br-int, genev_sys_6081 and ovs-system under
# `== nics`, come from earlier lab runs and stay until the node reboots; the
# 2026-09-29 run, before any lab run and before the probe looked for the Chaos
# Mesh modules, listed only tun, nvme_tcp, kvm_intel and kvm as loaded. The
# `/dev/kvm` date and the `Used` column change from run to run.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: node-probe
  namespace: default
  labels:
    app.kubernetes.io/name: node-probe
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-probe
    spec:
      restartPolicy: Never
      # The probe never calls the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: probe
          image: docker.io/library/debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "== kvm device"
              ls -l /dev/kvm 2>/dev/null || echo absent
              echo "== cpu"
              lscpu 2>/dev/null | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|Virtualization|NUMA node\(s\)):' || echo absent
              echo "cpus with vmx|svm: $(grep -cE '^flags[[:space:]]*:.* (vmx|svm)( |$)' /proc/cpuinfo 2>/dev/null)"
              echo "== loaded modules"
              cut -d ' ' -f1 /proc/modules 2>/dev/null | grep -E '^(kvm|vhost|openvswitch|geneve|vxlan|nbd|tun|bridge|br_netfilter|dm_multipath|nvme_tcp|nfs|sunrpc|ip_set|xt_set|sch_netem|sch_tbf)' || echo none
              KVER="$(uname -r)"
              echo "== module files for $KVER"
              for m in kvm kvm-intel kvm-amd vhost_net openvswitch geneve nbd tun bridge br_netfilter dm-multipath nfsd nfs nfsv4 lockd sunrpc ip_set ip_set_hash_ip ip_set_hash_net xt_set sch_netem sch_tbf; do
                f="$(find "/host/lib/modules/$KVER" -name "$m.ko*" -print -quit 2>/dev/null)"
                if [ -z "$f" ] && grep -qE "/$m\.ko\$" "/host/lib/modules/$KVER/modules.builtin" 2>/dev/null; then
                  f="builtin"
                fi
                echo "$m: ${f:-NOT FOUND}"
              done
              echo "== filesystems"
              for fs in nfs4 nfsd; do
                if grep -qE "[[:space:]]$fs\$" /proc/filesystems 2>/dev/null; then echo "$fs: registered"; else echo "$fs: not registered"; fi
              done
              echo "== nested / iommu"
              nested=""
              for m in kvm_intel kvm_amd; do
                if [ -f "/sys/module/$m/parameters/nested" ]; then
                  nested="$m nested=$(cat "/sys/module/$m/parameters/nested")"
                fi
              done
              echo "${nested:-kvm_* not loaded, no nested param}"
              echo "iommu groups: $(ls /sys/kernel/iommu_groups 2>/dev/null | wc -l)"
              echo "== memory"
              grep -E '^(MemTotal|Huge)' /proc/meminfo 2>/dev/null || echo absent
              echo "== disks"
              lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT,MODEL,ROTA 2>/dev/null || echo absent
              df -h /host /host/var/lib 2>/dev/null || echo absent
              echo "== cgroup"
              stat -fc %T /sys/fs/cgroup 2>/dev/null || echo absent
              echo "== host os / binaries"
              head -n 3 /host/etc/os-release 2>/dev/null || echo absent
              for b in usr/sbin/libvirtd usr/bin/qemu-system-x86_64 usr/sbin/ovs-vswitchd usr/sbin/rpc.nfsd; do
                if [ -e "/host/$b" ]; then echo "$b: present"; else echo "$b: absent"; fi
              done
              echo "== containerd socket"
              for s in run/containerd/containerd.sock run/k3s/containerd/containerd.sock; do
                if [ -S "/host/$s" ]; then echo "$s: socket"; elif [ -e "/host/$s" ]; then echo "$s: present, not a socket"; else echo "$s: absent"; fi
              done
              addr="$(awk '/^\[grpc\]/ { g = 1; next } /^\[/ { g = 0 } g && /^[[:space:]]*address[[:space:]]*=/ { print $NF }' /host/etc/containerd/config.toml 2>/dev/null)"
              echo "config.toml [grpc] address: ${addr:-not set}"
              echo "== nics"
              for n in /host/sys/class/net/*/; do
                [ -e "$n" ] || { echo absent; break; }
                echo "$(basename "$n"): mtu=$(cat "${n}mtu" 2>/dev/null) operstate=$(cat "${n}operstate" 2>/dev/null)"
              done
              exit 0
          securityContext:
            # Only a privileged container sees the host's device nodes; an
            # unprivileged one gets a synthetic /dev without kvm.
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: host
              mountPath: /host
              readOnly: true
              recursiveReadOnly: IfPossible
      volumes:
        - name: host
          hostPath:
            path: /
