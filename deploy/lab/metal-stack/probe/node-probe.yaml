# Read-only node probe for metal-stack clusters, the survey of #1138 (work
# package 0) as a reusable Job. It is the prerequisite check of the CobaltCore
# lab: run it against a metal-stack cluster before anything of the lab is
# deployed. It prints the node facts the lab depends on under twelve fixed
# headers and exits 0 whatever it finds, so a node that lacks something
# prints `absent`, `none` or `NOT FOUND` and the Job still completes.
#
# IMAGE docker.io/library/debian:bookworm-slim, a Docker Official Image whose
# util-linux and coreutils supply lscpu, lsblk, stat and df. Digest-pinned;
# the Renovate customManager in renovate.json refreshes the digest. Nothing is
# installed at run time, so the probe needs no egress beyond the image pull.
#
# READ-ONLY posture:
#   - The container runs privileged, because only a privileged container sees
#     the host's device nodes. An unprivileged one gets a synthetic /dev
#     without kvm.
#   - The host root is mounted at /host with readOnly and
#     recursiveReadOnly: IfPossible, so its submounts (/host/sys,
#     /host/var/lib, ...) are read-only too where the runtime supports it.
#   - No hostPID, no hostNetwork, no ServiceAccount token, a read-only root
#     filesystem. The script enters no host namespace, loads no module and
#     writes nothing; tests/unit/deploy/metal_stack_probe_test.sh fails when a
#     later edit names nsenter, chroot, modprobe, insmod, rmmod, mount, umount,
#     sysctl, apt-get, apt, tee, dd, mknod or rm, or adds a redirection other
#     than 2>/dev/null.
#   - /proc, /sys/module, /sys/kernel and /sys/fs/cgroup are read from the
#     container's own mounts, which show the host kernel's values. The NIC
#     list is read from /host/sys/class/net, the host's sysfs, so it names the
#     host's interfaces and not the pod's own eth0.
#   - The containerd socket is looked up under /host/run and never under
#     /host/var/run: on Debian /var/run is an absolute symlink to /run, which
#     inside the pod resolves to the container's own /run. The socket is only
#     tested for, never opened, and the one value read from the host's
#     /etc/containerd/config.toml is the address of its [grpc] table. The
#     unit test fails when the script names /host/var/run.
#
# NAMESPACE default: the probe runs before deploy/flux-system/namespaces.yaml
# has created `openstack` or `shared-services`, and the metal-stack shoot
# enforces no PodSecurity level on `default`.
#
# Run it, read it and remove it:
#   kubectl apply -k deploy/lab/metal-stack/probe
#   kubectl wait --for=condition=complete job/node-probe -n default --timeout=5m
#   kubectl logs -n default job/node-probe
#   kubectl delete job -n default node-probe
#
# The Job runs on the node the scheduler picks. A cluster with more than one
# worker is probed one node at a time by pinning the pod, followed by the same
# wait, logs and delete (node-probe.yaml holds the one Job and nothing else):
#   yq '.spec.template.spec.nodeName = "<node>"' deploy/lab/metal-stack/probe/node-probe.yaml | kubectl apply -f -
# Delete the Job between runs: its pod template is immutable, so a second
# apply with another nodeName is rejected. ttlSecondsAfterFinished removes the
# Job, and its logs with it, one hour after it completes.
#
# A DaemonSet would cover every node at once, but it never completes, has to
# be deleted by hand, and its pods' logs are read one at a time anyway. The
# Job keeps the run bounded.
#
# EXPECTED OUTPUT of the 2026-10-04 run on
# shoot--df33f0b4c1--forge-group-0-666b6-qmhrg, a lab-ready node, taken on a
# bare cluster that carried no CobaltCore stack. The `== nics` section lists
# one cali* interface per pod on the node (14 in this run, all mtu=1460
# operstate=up); they are cut to one line here.
#   == kvm device
#   crw-rw---- 1 root 103 10, 232 Oct  4 15:06 /dev/kvm
#   == cpu
#   CPU(s):                                  16
#   Model name:                              Intel(R) Xeon(R) D-2141I CPU @ 2.20GHz
#   Thread(s) per core:                      2
#   Core(s) per socket:                      8
#   Socket(s):                               1
#   Virtualization:                          VT-x
#   NUMA node(s):                            1
#   cpus with vmx|svm: 16
#   == loaded modules
#   geneve
