# Kustomize overlay for the metal-stack lab: base FluxCD manifests.
# hack/deploy-infra.sh applies it in Step 3 under EXTERNAL_CLUSTER=true, in
# place of deploy/kind/base:
#
#   EXTERNAL_CLUSTER=true make deploy-infra
#
# It takes the kind base as its own base, so the lab inherits everything the
# kind overlay patches:
#   - Envoy Gateway with the NodePort EnvoyProxy, so the data-plane Service
#     never pends as a LoadBalancer on a MetalLB without an address pool, and
#     the twelve-listener openstack-gw Gateway on the *.127-0-0-1.nip.io
#     hostnames, reached through `kubectl port-forward` on 8443;
#   - headlamp and flux-web, the optional addons of the kind base;
#   - the standalone single-replica OpenBao, the suspended service-operator
#     HelmReleases with one replica each, the one-replica c5c3-operator and
#     the suspended K-ORC Kustomization;
#   - the 25m CPU request of the Flux controllers.
#
# Three things are lab-specific. The first is the OpenBao data volume's storage
# class. The kind base pins `standard`, and the lab has a Lightbits `standard`
# class too, so the pin would bind the volume to a class chosen by
# coincidence. The patch removes the class (a null value deletes the key), and
# the volume binds to the cluster's default class like every volume the
# ControlPlane provisions. hack/deploy-infra.sh checks that a default class
# exists before Step 2. A lab deployed while this patch still pinned
# `premium` keeps that class in the OpenBao StatefulSet's volume claim
# template and in the MariaDB and GarageCluster specs of ../infrastructure.
# Volume claim templates cannot change and the mariadb-operator webhook
# refuses a new storageClassName, so such a lab is not updated in place: it
# is torn down (EXTERNAL_CLUSTER=true make teardown-infra) and deployed again.
#
# The second is the label apiserver-proxy.networking.gardener.cloud/inject:
# disable on every namespace the stack declares. The lab is a Gardener shoot,
# and Gardener's kubernetes-service-host webhook (gardener-resource-manager)
# sets KUBERNETES_SERVICE_HOST in every new pod to the API server's DNS name,
# so that pods bypass the node-local apiserver-proxy. The stack's
# NetworkPolicies expect the address instead:
#   - openbao-operator 0.4.2 reads the variable as an IP address to derive
#     the API-server egress of the policy it renders over an OpenBaoCluster.
#     A name makes the read fail, its fallback (`get` on Service
#     default/kubernetes) is outside the operator's RBAC, and the instance
#     stays at APIServerNetworkReady=False, reason
#     APIServerNetworkConfigurationInvalid. Its pods would also dial the
#     name's address, which no rule of the policy names.
#   - The memcached-operator's chart policy allows DNS on port 53 alone, and
#     the shoot's CoreDNS answers behind its Service on 8053, so the pod
#     cannot resolve the name and every API request times out. With the
#     address it needs no lookup.
#   - The service-operator charts take their API-server egress as a list of
#     endpoint addresses (networkPolicy.apiServer in their values).
# The label is Gardener's opt-out for exactly this: its webhook skips
# namespaces and pods that carry it, so the pods keep the kubelet's
# KUBERNETES_SERVICE_HOST, the kubernetes Service's ClusterIP, and reach the
# API server through the apiserver-proxy, the same path as on kind. It is set
# on every namespace of the render, not on the ones known to break, so a
# namespace added later gets the same path and the stack's network posture
# stays one thing on the lab. The kind base creates all of them, so the patch
# below needs no name.
#
# The third is the annotation chaos-mesh.org/inject: enabled on the same
# namespaces, the scope of Chaos Mesh on the lab (D2 of #1219). The release
# of ../chaos-mesh sets controllerManager.enableFilterNamespace: true, and its
# controller then selects a pod only in a namespace that carries the
# annotation. Without Chaos Mesh the annotation does nothing. The namespaces
# the lab does not declare carry none: chaos-mesh itself, flux-system, which
# the flux-operator install creates, and the platform's (kube-system,
# firewall, metallb-system, default), whose pods connect the shoot to its
# control plane. ../migration-ports annotates hypervisor-system the same way.
#
# The kind base sits outside this directory. A directory reference is allowed
# under kustomize's default LoadRestrictionsRootOnly check (the kind base
# itself references ../../flux-system), so `kubectl apply -k` works without
# `--load-restrictor`. No metrics-server or VPA release is rendered: the
# platform runs both.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../kind/base

patches:
  # Every Namespace of the render: the Gardener label and the Chaos Mesh
  # annotation. kustomize replaces the patch's name with each target's own.
  - target:
      version: v1
      kind: Namespace
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: every-namespace
        labels:
          apiserver-proxy.networking.gardener.cloud/inject: disable
        annotations:
          chaos-mesh.org/inject: enabled

  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: openbao
      namespace: shared-services
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: openbao
        namespace: shared-services
      spec:
        values:
          server:
            dataStorage:
              storageClass: null
