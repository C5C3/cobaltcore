# The two workers of the metal-stack lab as KVM hypervisors of the lab
# ControlPlane (#1142): libvirt in a DaemonSet, the OVN chassis, the metadata
# agent and the NovaCompute pool, the libvirt migration CA,
# openstack-hypervisor-operator and kvm-node-agent with their chart sources,
# and the Service that lets the operator reach the gateway. Applied by hand,
# like ../controlplane; hack/deploy-infra.sh never applies it. It needs the
# lab ControlPlane Ready, node labels, a Placement trait and
# ../hypervisor-fixtures before it, and hand steps after it. Part 2 of
# docs/quick-start-metal-stack.md runs the sequence;
# docs/reference/infrastructure/infrastructure-manifests.md (Lab hypervisors)
# gives the reason behind each setting.
#
# EXTERNAL_CLUSTER=true make teardown-infra removes all of it in its step 0,
# labels included (docs/reference/infrastructure/e2e-deployment.md).
#
# The namespace and the migration port reservation come from
# ../migration-ports, which Part 2, Step 1 applies on its own before the node
# port check. Every other resource is local to this directory, and a directory
# is no file reference, so `kubectl apply -k` renders the overlay under
# kustomize's default LoadRestrictionsRootOnly check.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../migration-ports
  - libvirt-ca.yaml
  - libvirt-configmap.yaml
  - libvirt-daemonset.yaml
  - compute.yaml
  - gateway-alias.yaml
  - sources.yaml
  - hvo-release.yaml
  - kna-release.yaml
