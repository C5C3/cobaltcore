# kvm-node-agent (kna) from the upstream chart of the pinned kna commit
# (sources.yaml), on every node labelled nova.openstack.cloud.sap/virt-driver,
# running the image #1178 builds from that commit with the key mode patch:
# the chart renders <repository>:<appVersion>, and only the repository is
# overridden. It reports libvirt's state into the node's Hypervisor and
# installs the Secret tls-libvirt-<node> under the host's /etc/pki, where
# the libvirt DaemonSet waits for it.
#
# The values that differ from the chart's defaults, and why:
#   - image.repository is ghcr.io/c5c3/kvm-node-agent, the image of #1178.
#   - libvirtDefaultUri is qemu:///system: the chart's default ch:///system
#     is Cloud Hypervisor.
#   - nodeLabelFieldPath is spec.nodeName: the chart's DaemonSet renders it
#     into the fieldRef of NODE_LABEL and defines no value for it.
#   - The manager keeps DAC_OVERRIDE and drops every other capability. The
#     image runs as uid 0 (#1167): upstream's uid 42438 has no passwd entry
#     on the host, the host's dbus-daemon closes the connection of a uid it
#     cannot resolve ("recvmsg: connection reset by peer"), and starting a
#     unit over the system bus needs root as well, or a polkit rule. Root
#     still needs DAC_OVERRIDE, because the chart's init container hands the
#     PKI directories to 42438.
#
# PKI_KEY_GROUP stays unset. QEMU runs as root here (libvirt-configmap.yaml),
# so no hypervisor process needs a group to read its key, and the agent
# writes all three private keys with mode 0600.
#
# kna reads its namespace from the environment variable NAMESPACE, which the
# chart does not set, and falls back to monsoon3 without it. The
# post-renderer sets it to hypervisor-system. Hypervisor
# spec.createCertManagerCertificate stays at its default false, so the agent
# requests no certificate of its own and installs the one
# openstack-hypervisor-operator requests.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kvm-node-agent
  namespace: hypervisor-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kvm-node-agent
    namespace: flux-system
  # The chart ships the Migration CRD; Flux's upgrade default would leave it
  # at the first release's schema.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    controllerManager:
      manager:
        image:
          repository: ghcr.io/c5c3/kvm-node-agent
        env:
          libvirtDefaultUri: qemu:///system
          nodeLabelFieldPath: spec.nodeName
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [DAC_OVERRIDE]
  postRenderers:
    - kustomize:
        patches:
          # The chart renders one DaemonSet; kustomize replaces the patch's
          # name with its own.
          - target:
              kind: DaemonSet
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: controller-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        env:
                          - name: NAMESPACE
                            value: hypervisor-system
