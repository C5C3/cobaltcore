# A second Service in front of the openstack-gw Envoy pods, on port 8443 and
# a fixed ClusterIP, for openstack-hypervisor-operator (hvo-release.yaml).
#
# hvo takes the first public endpoint of compute, placement, image and
# network from the catalog. On the lab those are
# https://<service>.127-0-0-1.nip.io:8443 URLs, the port-forward a
# workstation runs, and in a pod the name resolves to the pod itself. The
# hostAliases of the hvo Deployment point the four names at this Service, so
# the URLs reach the same Envoy listeners from inside the cluster, port
# included.
#
# The selector and the targetPort are those of the Envoy Service Envoy
# Gateway generates for openstack-gw:
#
#   kubectl get svc -n envoy-gateway-system \
#     -l gateway.envoyproxy.io/owning-gateway-name=openstack-gw \
#     -o jsonpath='{.items[0].spec.selector}{"\n"}{.items[0].spec.ports[?(@.port==443)].targetPort}{"\n"}'
#
# 10.248.0.200 is in the static band of the lab's service network
# 10.248.0.0/18, 10.248.0.0/24, from which the API server allocates a dynamic
# ClusterIP only once the rest of the range is used up. An apply that answers "provided IP is already allocated" means the address
# is taken: pick another one of 10.248.0.0/24 and change the hostAliases in
# hvo-release.yaml with it.
apiVersion: v1
kind: Service
metadata:
  name: openstack-gw-8443
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: lab-hypervisor
spec:
  type: ClusterIP
  clusterIP: 10.248.0.200
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: openstack-gw
    gateway.envoyproxy.io/owning-gateway-namespace: openstack
  ports:
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 10443
