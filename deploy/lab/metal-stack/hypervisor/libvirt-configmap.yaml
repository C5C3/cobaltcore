# The scripts and the configuration of the libvirt DaemonSet
# (libvirt-daemonset.yaml), mounted at /etc/libvirt-lab.
#
# host-prepare.sh runs in the init container: it loads vhost_net from the
# host's module tree and fails the pod on a node without /dev/kvm.
#
# libvirtd.sh runs in the container libvirtd. It waits for the TLS files
# kvm-node-agent installs, then starts libvirtd in a host scope
# (systemd-run --scope --slice=system), so that libvirtd and the QEMU
# processes it forks leave the pod's cgroup and outlive a restart of the pod.
# It then writes two runtime units into the host's /run/systemd/system,
# because kvm-node-agent reads libvirt's state from the host's systemd:
#   - libvirtd.service is active exactly as long as the containerized
#     libvirtd lives (tail --pid). Without an active libvirtd.service the
#     agent reports nothing about libvirt.
#   - virt-admin-server-update-tls.service reloads libvirtd's TLS files
#     through its mount namespace. The agent starts it after every
#     certificate write and sets TLSCertificateInstalled=True only when the
#     start succeeds.
# Writing to the host bends decision D1 of #1138 ("the host is not
# modified") knowingly. /run is a tmpfs, so a reboot removes the units, and
# the script removes them whenever it ends. A libvirtd an earlier container
# left in the host scope is stopped before the next one starts.
#
# ceph-secret.sh runs in the third container. It defines the libvirt secret
# 090e4a3c-6c20-4e74-82dc-1a70382babe8 for client.cinder from the Secret
# openstack/ceph-client-cinder, mounted at /etc/ceph-client-cinder, sets its
# value again whenever the key changes, and undefines it when the Secret goes.
# QEMU authenticates to Ceph with that secret when it opens a Cinder volume on
# RBD. The UUID is the one the lab's RBD volume backend (#1346) sets as
# spec.rbd.secretUUID. Nova stores that UUID in the connection_info of every
# attachment and reuses it when a server starts, so the UUID stays fixed once
# a volume is attached; a change needs both UUIDs defined until every
# attachment has been refreshed. A server that holds an attached RBD volume
# keeps the key its QEMU started with until it is live-migrated or restarted.
#
# libvirtd.conf listens for TLS on the node's address only (@HOST_IP@ is
# replaced with status.hostIP). The socket's group is the numeric 108, the
# group kvm-node-agent's chart gives its pod (supplementalGroups); the agent
# runs as root here (kna-release.yaml) and opens it either way. qemu.conf runs
# QEMU as root: the host's
# /dev/kvm is root:103 and the image's kvm group has another ID
# (docs/reference/ci-cd/container-images.md, libvirt). qemu.conf sets
# stdio_handler to file, so libvirtd opens QEMU's log files itself and no
# virtlogd runs, because a virtlogd in the pod dies with the pod and takes
# the console log of every running domain with it (#1174).
# qemu.conf sets dynamic_ownership to 0. libvirt adds its DAC driver whenever
# QEMU runs privileged, also under security_driver = "none" (qemuSecurityInit
# in src/qemu/qemu_driver.c), and with dynamic ownership on, an attach changes
# the owner of a Cinder volume file to QEMU's user, 0:0
# (virSecurityDACSetImageLabelInternal in src/security/security_dac.c, both
# read at libvirt v9.0.0). Cinder's NFS backends keep their files
# 42424:42424 with mode 660, so Cinder could no longer read a volume once it
# had been attached. QEMU as root opens every file it needs without a chown.
apiVersion: v1
kind: ConfigMap
metadata:
  name: libvirt-lab
  namespace: openstack
  labels:
    app.kubernetes.io/name: libvirt
    app.kubernetes.io/part-of: lab-hypervisor
data:
  host-prepare.sh: |
    #!/bin/bash
    set -euo pipefail

    if ! modprobe vhost_net; then
      echo "host-prepare: cannot load vhost_net from /lib/modules/$(uname -r)"
      exit 1
    fi
    if [[ ! -e /dev/kvm ]]; then
      echo "host-prepare: /dev/kvm is missing on this node"
      exit 1
    fi

  libvirtd.sh: |
    #!/bin/bash
    set -euo pipefail

    # systemctl ignores start and daemon-reload when /proc/1/root and / differ,
    # taking that for a chroot. With hostPID, PID 1 is the host's init, so this
    # container always looks like one.
    export SYSTEMD_IGNORE_CHROOT=1

    unit_dir=/run/systemd/system
    unit_header='# Written by the cobaltcore lab libvirt DaemonSet (openstack/libvirt); removed when its pod stops.'
    libvirtd_pid=""

    remove_units() {
      systemctl stop libvirtd.service || true
      rm -f "${unit_dir}/libvirtd.service" "${unit_dir}/virt-admin-server-update-tls.service"
      systemctl daemon-reload || true
    }

    # Wait for libvirtd and exit with its status.
    exit_with_libvirtd() {
      local rc=0
      wait "${libvirtd_pid}" || rc=$?
      exit "${rc}"
    }

    # 6. On TERM or INT: remove the host units, then stop libvirtd. Its domains
    # keep running. A unit an earlier pod left behind goes as well.
    # shellcheck disable=SC2329 # invoked by the trap below
    shutdown() {
      trap - EXIT
      remove_units
      if [[ -z "${libvirtd_pid}" ]]; then
        exit 0
      fi
      kill -TERM "${libvirtd_pid}" 2>/dev/null || true
      exit_with_libvirtd
    }
    # Every other end, a failed step or libvirtd's own exit, removes the host
    # units too, and stops the libvirtd this script started: it runs in the
    # host scope, which the end of this container does not reach.
    # shellcheck disable=SC2329 # invoked by the trap below
    on_exit() {
      local rc=$?
      remove_units
      if [[ -n "${libvirtd_pid}" ]]; then
        systemctl stop cobaltcore-libvirtd.scope 2>/dev/null || true
      fi
      exit "${rc}"
    }
    trap shutdown TERM INT
    trap on_exit EXIT

    # 1. No timeout: libvirtd refuses to start a TLS listener without these
    # files, and a pod that is Running but not Ready is the signal.
    until [[ -f /etc/pki/CA/cacert.pem && -f /etc/pki/libvirt/servercert.pem &&
      -f /etc/pki/libvirt/private/serverkey.pem ]]; do
      echo "libvirtd: waiting for the TLS files kvm-node-agent installs under /etc/pki"
      sleep 10
    done

    # 2. The configuration, with the node's address in listen_addr.
    sed "s/@HOST_IP@/${HOST_IP}/" /etc/libvirt-lab/libvirtd.conf >/etc/libvirt/libvirtd.conf
    cp /etc/libvirt-lab/qemu.conf /etc/libvirt/qemu.conf

    # 3. The scope moves libvirtd out of the pod's cgroup into the host's
    # system.slice. systemd-run execs libvirtd, so $! is libvirtd's host PID.
    # A libvirtd an earlier container left in the scope (killed after its
    # grace period) still holds the scope and the socket, so it goes first.
    # QEMU runs in libvirt's own /machine cgroups, so that stops libvirtd alone.
    # A stop that runs out (systemd's 90s) leaves the scope failed, and a
    # failed unit keeps its name: reset-failed frees it, and --collect lets
    # systemd unload this scope however it ends.
    systemctl stop cobaltcore-libvirtd.scope 2>/dev/null || true
    systemctl reset-failed cobaltcore-libvirtd.scope 2>/dev/null || true
    rm -f /run/libvirtd.pid
    systemd-run --collect --scope --slice=system --unit=cobaltcore-libvirtd libvirtd --listen &
    libvirtd_pid=$!

    # 4. Liveness first, so a socket another libvirtd left behind cannot hide
    # a systemd-run that failed. A libvirtd that exits during the wait ends it
    # with its status.
    for _ in $(seq 60); do
      if ! kill -0 "${libvirtd_pid}" 2>/dev/null; then
        exit_with_libvirtd
      fi
      if [[ -S /run/libvirt/libvirt-sock ]]; then
        break
      fi
      sleep 1
    done
    if [[ ! -S /run/libvirt/libvirt-sock ]]; then
      echo "libvirtd: /run/libvirt/libvirt-sock did not appear within 60s"
      exit 1
    fi

    # 5. The two host units, read by kvm-node-agent through the host's systemd.
    # The TLS unit enters the PID's mount namespace as host root, so it first
    # checks that the PID still lives in the scope: a unit left behind fails
    # instead of running another process's virt-admin.
    cat >"${unit_dir}/libvirtd.service" <<EOF
    ${unit_header}
    [Unit]
    Description=Stand-in for the containerized libvirtd, PID ${libvirtd_pid}

    [Service]
    Type=simple
    ExecStart=/usr/bin/tail --pid=${libvirtd_pid} -f /dev/null
    EOF
    cat >"${unit_dir}/virt-admin-server-update-tls.service" <<EOF
    ${unit_header}
    [Unit]
    Description=Reload the TLS files of the containerized libvirtd, PID ${libvirtd_pid}

    [Service]
    Type=oneshot
    ExecStartPre=/usr/bin/grep -q /cobaltcore-libvirtd.scope /proc/${libvirtd_pid}/cgroup
    ExecStart=/usr/bin/nsenter --target ${libvirtd_pid} --mount -- /usr/bin/virt-admin server-update-tls libvirtd
    EOF
    systemctl daemon-reload
    systemctl restart libvirtd.service

    # 7. Exit with libvirtd's status.
    exit_with_libvirtd

  ceph-secret.sh: |
    #!/bin/bash
    set -euo pipefail

    # The lab's RBD volume backend (#1346) carries this UUID as
    # spec.rbd.secretUUID, so the rbd_secret_uuid Cinder sends names the
    # secret defined here. Nova stores that UUID in the connection_info of
    # every attachment and reuses it when a server starts, so the UUID stays
    # fixed once a volume is attached; a change needs both UUIDs defined
    # until every attachment has been refreshed.
    uuid=090e4a3c-6c20-4e74-82dc-1a70382babe8
    usage_name=client.cinder
    secret_ref=openstack/ceph-client-cinder
    key_file=/etc/ceph-client-cinder/userKey
    xml_file=/tmp/ceph-secret.xml
    interval=10

    # TERM or INT: the pod is being deleted, and libvirtd.sh stops libvirtd
    # with it. The secret is left as it is; the next pod's container defines
    # it again.
    trap 'exit 0' TERM INT

    # virsh_or_retry <subcommand> [<argument>...]
    # One virsh call. A failure (libvirtd restarting, the socket gone) prints
    # the retry line after virsh's error, waits the interval and returns 1,
    # and the caller skips the rest of the pass, its state unchanged.
    virsh_or_retry() {
      if ! virsh -c qemu:///system "$@" >/dev/null; then
        echo "ceph-secret: virsh $1 failed; retrying in ${interval}s"
        sleep "${interval}"
        return 1
      fi
    }

    # defined: whether libvirtd has the secret. A restarted libvirtd has
    # lost it.
    defined() {
      virsh -c qemu:///system secret-dumpxml "${uuid}" >/dev/null 2>&1
    }

    echo "ceph-secret: libvirt secret ${uuid} for ${usage_name} follows the Secret ${secret_ref}"

    # No timeout, for the reason libvirtd.sh gives: a pod that is Running but
    # not Ready is the signal, and readiness here is libvirtd's.
    if [[ ! -S /run/libvirt/libvirt-sock ]]; then
      echo "ceph-secret: waiting for /run/libvirt/libvirt-sock"
      until [[ -S /run/libvirt/libvirt-sock ]]; do
        sleep "${interval}"
      done
    fi

    last_sha=""
    last_state=""
    while true; do
      # One read per pass decides whether the key is there and gives its
      # digest: a missing or empty file counts as absent, and a file the
      # kubelet replaces during a pass is read whole on the next one.
      key="$(tr -d '[:space:]' 2>/dev/null <"${key_file}")" || key=""
      if [[ -n "${key}" ]]; then
        sha="$(printf '%s' "${key}" | sha256sum | cut -c1-12)"
        if ! defined; then
          # private='yes': libvirt refuses secret-get-value, so the key goes
          # from the Secret into libvirtd and QEMU alone. ephemeral='yes':
          # libvirtd keeps the value in memory and writes no file under
          # /etc/libvirt/secrets, where QEMU, which runs as root, could read
          # it and the node's disk would keep it in the container's layer.
          # libvirtd.sh ends with libvirtd, so a restarted libvirtd runs in a
          # new container without the secret either way, and the next pass
          # defines it again.
          cat >"${xml_file}" <<EOF
    <secret ephemeral='yes' private='yes'>
      <uuid>${uuid}</uuid>
      <description>Ceph key of ${usage_name} from the Secret ${secret_ref}</description>
      <usage type='ceph'>
        <name>${usage_name}</name>
      </usage>
    </secret>
    EOF
          virsh_or_retry secret-define "${xml_file}" || continue
          echo "ceph-secret: defined libvirt secret ${uuid} for ${usage_name}"
          last_sha=""
        fi
        # --file reads the base64 text and stores the decoded key. The key
        # never appears on a command line, which hostPID shows to every
        # process on the node through /proc/<pid>/cmdline, and the log carries
        # the first twelve hex characters of its SHA-256, never the key.
        if [[ "${sha}" != "${last_sha}" ]]; then
          virsh_or_retry secret-set-value "${uuid}" --file "${key_file}" || continue
          echo "ceph-secret: set the value of libvirt secret ${uuid} from ${secret_ref} (sha256 ${sha})"
          last_sha="${sha}"
        fi
        last_state=present
      else
        if defined; then
          virsh_or_retry secret-undefine "${uuid}" || continue
          echo "ceph-secret: undefined libvirt secret ${uuid} because ${secret_ref} is gone"
        fi
        last_sha=""
        if [[ "${last_state}" != absent ]]; then
          echo "ceph-secret: waiting for the Secret ${secret_ref} (deployed by WITH_CEPH=true); no libvirt secret is defined"
        fi
        last_state=absent
      fi
      sleep "${interval}"
    done

  libvirtd.conf: |
    listen_tls = 1
    listen_tcp = 0
    tls_port = "16514"
    listen_addr = "@HOST_IP@"
    auth_tls = "none"
    unix_sock_group = "+108"
    unix_sock_rw_perms = "0770"
    auth_unix_rw = "none"

  qemu.conf: |
    user = "root"
    group = "root"
    dynamic_ownership = 0
    security_driver = "none"
    default_tls_x509_cert_dir = "/etc/pki/qemu"
    default_tls_x509_verify = 1
    stdio_handler = "file"
