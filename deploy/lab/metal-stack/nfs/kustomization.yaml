# Kustomize overlay for the metal-stack lab: the NFS server and the
# csi-driver-nfs mounter behind Cinder's volume and backup backends (#1196).
# hack/deploy-infra.sh applies it in Step 3 under EXTERNAL_CLUSTER=true
# WITH_NFS=true, in place of deploy/kind/nfs:
#
#   EXTERNAL_CLUSTER=true WITH_NFS=true make deploy-infra
#
# It takes the kind NFS overlay as its base and differs from it in three
# places:
#   - The export claim nfs-server-exports asks for 100Gi and names no storage
#     class (D3 of #1193). On kind, 5Gi on local-path bounds nothing. Here one
#     RWO volume holds both exports, so 100Gi bounds every Cinder volume and
#     backup of the lab together. The patch removes the kind pin `standard` (a
#     null value deletes the key), so the claim binds to the cluster's default
#     class like the lab's other volumes; ../base/kustomization.yaml gives the
#     reason. D3 named `premium`, which is the default class of forge.
#   - The init container load-nfsd loads nfsd on the node the server pod runs
#     on, before prepare-exports and the server start. On kind the deploy
#     script loads it on the host, which under EXTERNAL_CLUSTER=true is a
#     workstation. In the server's own pod the order holds on every start,
#     also after a node reboot. It mirrors host-prepare of
#     ../hypervisor/libvirt-daemonset.yaml: ghcr.io/c5c3/libvirt:latest,
#     privileged, root, the node's /lib/modules mounted read-only. A failing
#     modprobe ends it with exit 1 and
#     `load-nfsd: cannot load nfsd from /lib/modules/<kernel>`; the server
#     never starts, and the deploy's rollout gate fails.
#   - The DaemonSet nfs-client-modules (client-modules-daemonset.yaml) loads
#     nfs and nfsv4 on every node, for csi-nfs-node and nova-compute.
# D1 of #1193 chose the kernel's nfsd in a privileged pod, as on kind, and D2
# a privileged init container that loads the modules from the node's
# /lib/modules. The load test of #1194 decided both:
# https://github.com/C5C3/cobaltcore/issues/1193#issuecomment-5969676743
#
# What stays as on kind: the HelmRepository, the HelmRelease in kube-system
# with chart 4.13.4 and its three values, the digest-pinned server image, the
# Service on 2049, and the two shares
# nfs-server.openstack.svc.cluster.local:/volumes and :/backups. The chart's
# kubeletDir, /var/lib/kubelet, is the lab's kubelet root too. The server
# image is amd64 only, and so are both workers.
#
# No Gardener opt-out label is set here. The server pod and the
# nfs-client-modules pods run in `openstack`, which ../base labels with
# apiserver-proxy.networking.gardener.cloud/inject: disable, and mount no
# ServiceAccount token. The chart's pods run in kube-system, the platform's
# namespace, which this repository does not label. csi-nfs-controller and
# csi-nfs-node are host-network pods, so the lab's deny-all NetworkPolicy in
# kube-system does not apply to them, and they reach the API server the way
# the platform's own host-network pods do. kube-system enforces no PodSecurity
# level on the lab and runs privileged host-network pods already (calico-node,
# lb-csi-node), so it admits the privileged csi-nfs-node.
#
# POSTURE, as on kind (D1 of #1193; "NON-PRODUCTION posture" in
# deploy/kind/nfs/nfs-server.yaml): the server container is privileged, the
# export is sec=sys with no_root_squash and a wildcard client list, and with
# the chart's Ephemeral lifecycle mode every principal that can create a pod
# mounts both shares from the pod spec. PodSecurity does not bound that: in a
# namespace that is not `restricted` the pod mounts them as root, and a
# `restricted` namespace admits a `csi` volume and the UID 42424, the owner
# of both exports. The lab is one tenant's cluster, and the Service is a
# ClusterIP.
#
# One thing is narrower than on kind. client-policy.yaml admits only the node
# network to port 2049, so a pod can no longer dial the server itself; it
# reaches the shares only through a volume the node mounts for it. The file is
# a template, not a resource of this kustomization: hack/deploy-infra.sh fills
# in the cluster's node network and applies it before this overlay. Its header
# has the reasons and the probe that showed which address a node presents.
#
# What the pods leave on a node: load-nfsd loads nfsd and its dependencies on
# the server's node, and nfs-client-modules loads nfs, nfsv4 and theirs on
# every node, eleven modules in all (auth_rpcgss, dns_resolver, fscache,
# grace, lockd, netfs, nfs, nfs_acl, nfsd, nfsv4, sunrpc). Nothing unloads
# them; they stay until the node reboots, also after a teardown. The sockets
# csi-nfs-node registers under /var/lib/kubelet/plugins and the mounts below
# /var/lib/kubelet/pods go with the pods.
#
# The kind overlay sits outside this directory. A directory reference is
# allowed under kustomize's default LoadRestrictionsRootOnly check, so
# `kubectl apply -k` works without `--load-restrictor`.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../kind/nfs
  - client-modules-daemonset.yaml

patches:
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: nfs-server-exports
      namespace: openstack
    patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: nfs-server-exports
        namespace: openstack
      spec:
        storageClassName: null
        resources:
          requests:
            storage: 100Gi

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nfs-server
      namespace: openstack
    patch: |
      - op: add
        path: /spec/template/spec/initContainers/0
        value:
          name: load-nfsd
          image: ghcr.io/c5c3/libvirt:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              if ! modprobe nfsd; then
                echo "load-nfsd: cannot load nfsd from /lib/modules/$(uname -r)"
                exit 1
              fi
              echo "load-nfsd: nfsd is loaded"
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: lib-modules
          hostPath:
            path: /lib/modules
