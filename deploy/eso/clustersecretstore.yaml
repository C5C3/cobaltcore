# ClusterSecretStore connecting ESO to the OpenBao instance running in the
# Management cluster (shared-services namespace).
# Authentication uses the Kubernetes auth method mounted at
# "kubernetes/management", with the "eso-management" role bound to the
# external-secrets ServiceAccount in the external-secrets namespace.
# The TLS CA certificate is sourced from the "openbao-tls" Secret created
# by cert-manager (see deploy/flux-system/infrastructure/openbao-tls-cert.yaml).
#
# the OpenBao API listener now requires & verifies a client TLS
# certificate (mTLS). The transport-layer client cert/key are sourced from
# the eso-openbao-client-tls Secret (see openbao-client-tls-cert.yaml). The
# Kubernetes auth method below still authorises the resulting Vault session;
# mTLS is purely a transport-layer admission gate, not an auth replacement.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cluster-store
spec:
  # Restrict which namespaces may reference this shared store. Before #606 the
  # store declared no conditions, so any namespace could reference it and reach
  # OpenBao as the shared eso-management identity — the confused-deputy surface
  # this change closes. Per-ControlPlane secret traffic now flows through the
  # operator-provisioned per-tenant namespaced store, so the shared store is only
  # referenced by the static infrastructure ExternalSecrets under
  # deploy/kind/infrastructure/, which live in two namespaces: `openstack` keeps
  # the standalone-mode ones (keystone-admin, mariadb-root-password,
  # horizon-secret-key, openbao-instance-unseal-key, and the garage-s3-credentials
  # copy retained there), and `shared-services` hosts the Garage ones
  # (garage-admin-token and the garage-s3-credentials copy that feeds the
  # GarageKey import). This allow-list is DEPLOYMENT-SPECIFIC: extend it to every
  # namespace that hosts an ExternalSecret/PushSecret referencing this store by
  # name.
  #
  # Each entry is a privilege grant, not a routing hint: anyone who can create an
  # ExternalSecret in a listed namespace reads everything the eso-management
  # policy grants, which is all of bootstrap/*. `shared-services` is on the list
  # because the Garage ExternalSecrets live there, and it is also the namespace
  # the shared OpenBao cluster itself runs in — see the TRUST ZONE note on the
  # Namespace in deploy/flux-system/namespaces.yaml before adding a workload or a
  # Secret-reading Role there. Adding a namespace here is a security review, and
  # tests/unit/deploy/eso_cluster_store_contract_test.sh pins the current list so
  # a widening cannot land unnoticed.
  conditions:
    - namespaces:
        - openstack
        - shared-services
  provider:
    vault:
      server: "https://openbao.shared-services.svc:8200"
      path: "kv-v2"
      version: "v2"
      # DECISION: ESO Vault-provider mTLS field path — Chose tls.certSecretRef /
      # tls.keySecretRef (the VaultClientTLS type on VaultProvider.tls) per the
      # external-secrets.io/v1 API spec (verified against ESO docs api/spec.md
      # for the pinned chart range >=0.10.0 <1.0.0). The alternative
      # auth.cert.{clientCert,secretRef} is a *different* feature (the Vault
      # "cert" auth method) and would replace, not augment, our Kubernetes auth.
      # Secret keys default to tls.crt / tls.key, which match the cert-manager
      # kubernetes.io/tls Secret layout produced by openbao-client-tls-cert.yaml,
      # so the `key:` field is intentionally omitted. Reviewer: please verify.
      tls:
        certSecretRef:
          name: "eso-openbao-client-tls"
          namespace: "shared-services"
        keySecretRef:
          name: "eso-openbao-client-tls"
          namespace: "shared-services"
      auth:
        kubernetes:
          mountPath: "kubernetes/management"
          role: "eso-management"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
      caProvider:
        type: "Secret"
        name: "openbao-tls"
        namespace: "shared-services"
        key: "ca.crt"
