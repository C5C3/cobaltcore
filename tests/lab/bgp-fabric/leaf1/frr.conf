!
! leaf1 stands in for one top-of-rack switch of the node's leaf pair: eth1 faces
! node1, eth2 the spine. 198.18.0.0/15 is the bait: a route the leaf offers the
! node that the node's inbound filter has to drop.
frr defaults datacenter
hostname leaf1
log stdout
!
interface lo
 ip address 192.0.2.101/32
 ipv6 address 2001:db8::101/128
exit
!
ip route 198.18.0.0/15 blackhole
!
bfd
 profile fabric
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp 4200001001
 bgp router-id 192.0.2.101
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor nodes peer-group
 neighbor nodes remote-as external
 neighbor nodes bfd profile fabric
 neighbor eth1 interface peer-group nodes
 neighbor eth2 interface remote-as external
 !
 address-family ipv4 unicast
  network 192.0.2.101/32
  redistribute static
  neighbor nodes activate
  neighbor nodes default-originate
  neighbor nodes prefix-list NODES-IN-V4 in
  neighbor nodes maximum-prefix 8192
  neighbor eth2 activate
  maximum-paths 64
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8::101/128
  redistribute static
  neighbor nodes activate
  neighbor nodes default-originate
  neighbor nodes prefix-list NODES-IN-V6 in
  neighbor nodes maximum-prefix 8192
  neighbor eth2 activate
  maximum-paths 64
 exit-address-family
exit
!
ip prefix-list NODES-IN-V4 seq 10 permit 192.0.2.0/24 ge 32
ip prefix-list NODES-IN-V4 seq 20 permit 198.51.100.0/24 ge 32
ip prefix-list NODES-IN-V4 seq 100 deny any
ipv6 prefix-list NODES-IN-V6 seq 10 permit 2001:db8::/64 ge 128
ipv6 prefix-list NODES-IN-V6 seq 100 deny any
