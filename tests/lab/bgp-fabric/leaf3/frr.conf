!
! leaf3 is the observer VTEP: a leaf of another rack with the deployment VRF
! cobaltcore and no node. It imports node1's host routes as Type-5 routes
! from leaf1 and leaf2 and installs both paths. 2001:db8:0:ff::3, on the VRF
! device, is the target of the A5 probe.
frr defaults datacenter
hostname leaf3
log stdout
!
vrf cobaltcore
 vni 20001
exit-vrf
!
interface lo
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 192.0.2.131
exit
!
! The underlay instance carries l2vpn evpn to the route reflector and nothing
! else.
router bgp 65000
 bgp router-id 192.0.2.131
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.0.2.193 remote-as internal
 neighbor 192.0.2.193 update-source lo
 !
 address-family l2vpn evpn
  neighbor 192.0.2.193 activate
  advertise-all-vni
 exit-address-family
exit
!
! The imported Type-5 routes arrive over the iBGP session with the reflector;
! maximum-paths ibgp 2 lets both VTEP next hops into the table.
router bgp 65000 vrf cobaltcore
 bgp router-id 192.0.2.131
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  maximum-paths ibgp 2
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:0:ff::3/128
  maximum-paths ibgp 2
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
  route-target import 65000:20001
  route-target export 65000:20001
 exit-address-family
exit
