!
! node1 stands in for one chassis-bearing CobaltCore OpenStack node. Its
! uplinks eth1 and eth2, its fabric loopback and the bait 203.0.113.0/24 (a
! connected prefix the outbound filter has to keep on the node) sit in the
! VRF "fabric" that setup.sh builds; eth0 stands in for the node network and
! is never touched.
frr defaults datacenter
hostname node1
log stdout
!
bfd
 profile fabric
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp 4200000001 vrf fabric
 bgp router-id 192.0.2.1
 neighbor leaves peer-group
 neighbor leaves remote-as external
 neighbor leaves bfd profile fabric
 neighbor eth1 interface peer-group leaves
 neighbor eth2 interface peer-group leaves
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor leaves activate
  neighbor leaves prefix-list FABRIC-OUT-V4 out
  neighbor leaves prefix-list FABRIC-IN-V4 in
  maximum-paths 2
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  neighbor leaves activate
  neighbor leaves prefix-list FABRIC-OUT-V6 out
  neighbor leaves prefix-list FABRIC-IN-V6 in
  maximum-paths 2
 exit-address-family
exit
!
ip prefix-list FABRIC-OUT-V4 seq 10 permit 192.0.2.0/25 ge 32
ip prefix-list FABRIC-OUT-V4 seq 20 permit 198.51.100.0/24 ge 32
ip prefix-list FABRIC-OUT-V4 seq 30 permit 10.200.0.0/16 ge 32
ip prefix-list FABRIC-OUT-V4 seq 100 deny any
ip prefix-list FABRIC-IN-V4 seq 10 permit 0.0.0.0/0
ip prefix-list FABRIC-IN-V4 seq 100 deny any
ipv6 prefix-list FABRIC-OUT-V6 seq 10 permit 2001:db8::/64 ge 128
ipv6 prefix-list FABRIC-OUT-V6 seq 100 deny any
ipv6 prefix-list FABRIC-IN-V6 seq 10 permit ::/0
ipv6 prefix-list FABRIC-IN-V6 seq 100 deny any
