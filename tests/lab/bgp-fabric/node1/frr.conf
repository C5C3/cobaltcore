!
! node1 stands in for one chassis-bearing CobaltCore node. 203.0.113.0/24 is
! the bait: a connected prefix the outbound filter has to keep on the node.
frr defaults datacenter
hostname node1
log stdout
!
interface lo
 ip address 192.0.2.1/32
 ip address 203.0.113.1/24
 ipv6 address 2001:db8::1/128
exit
!
bfd
 profile fabric
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp 4200000001
 bgp router-id 192.0.2.1
 bgp bestpath as-path multipath-relax
 neighbor fabric peer-group
 neighbor fabric remote-as external
 neighbor fabric bfd profile fabric
 neighbor eth1 interface peer-group fabric
 neighbor eth2 interface peer-group fabric
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor fabric activate
  neighbor fabric prefix-list FABRIC-OUT-V4 out
  neighbor fabric prefix-list FABRIC-IN-V4 in
  maximum-paths 2
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  neighbor fabric activate
  neighbor fabric prefix-list FABRIC-OUT-V6 out
  neighbor fabric prefix-list FABRIC-IN-V6 in
  maximum-paths 2
 exit-address-family
exit
!
ip prefix-list FABRIC-OUT-V4 seq 10 permit 192.0.2.0/24 ge 32
ip prefix-list FABRIC-OUT-V4 seq 20 permit 198.51.100.0/24 ge 32
ip prefix-list FABRIC-OUT-V4 seq 100 deny any
ip prefix-list FABRIC-IN-V4 seq 10 permit 0.0.0.0/0
ip prefix-list FABRIC-IN-V4 seq 100 deny any
ipv6 prefix-list FABRIC-OUT-V6 seq 10 permit 2001:db8::/64 ge 128
ipv6 prefix-list FABRIC-OUT-V6 seq 100 deny any
ipv6 prefix-list FABRIC-IN-V6 seq 10 permit ::/0
ipv6 prefix-list FABRIC-IN-V6 seq 100 deny any
