!
! spine1 stands in for the spine layer: eth1 faces leaf1, eth2 leaf2. It sees
! node1's host routes over both leaves and has to keep both paths.
frr defaults datacenter
hostname spine1
log stdout
!
interface lo
 ip address 192.0.2.201/32
 ipv6 address 2001:db8::201/128
exit
!
router bgp 4200000100
 bgp router-id 192.0.2.201
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth2 interface remote-as external
 !
 address-family ipv4 unicast
  network 192.0.2.201/32
  neighbor eth1 activate
  neighbor eth2 activate
  maximum-paths 64
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8::201/128
  neighbor eth1 activate
  neighbor eth2 activate
  maximum-paths 64
 exit-address-family
exit
