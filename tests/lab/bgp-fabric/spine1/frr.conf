!
! spine1 carries the underlay (OSPF area 0 over point-to-point links) and
! reflects the leaves' EVPN routes. It terminates no VRF and runs no VXLAN
! device.
frr defaults datacenter
hostname spine1
log stdout
!
interface lo
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth3
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 192.0.2.193
exit
!
router bgp 65000
 bgp router-id 192.0.2.193
 bgp cluster-id 192.0.2.193
 no bgp default ipv4-unicast
 neighbor leaves peer-group
 neighbor leaves remote-as internal
 neighbor leaves update-source lo
 neighbor 192.0.2.129 peer-group leaves
 neighbor 192.0.2.130 peer-group leaves
 neighbor 192.0.2.131 peer-group leaves
 !
 address-family l2vpn evpn
  neighbor leaves activate
  neighbor leaves route-reflector-client
 exit-address-family
exit
