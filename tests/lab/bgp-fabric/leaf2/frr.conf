!
! leaf2 is one leaf of node1's leaf pair and a VTEP. The node session on eth1
! terminates in the deployment VRF cobaltcore, which maps to the L3VNI 20001;
! the leaf exports node1's host routes as EVPN Type-5 routes under its own
! route distinguisher. 198.18.0.0/15 is the bait: a route of the deployment
! VRF the node's inbound filter has to drop.
frr defaults datacenter
hostname leaf2
log stdout
!
bfd
 profile fabric
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
vrf cobaltcore
 vni 20001
 ip route 198.18.0.0/15 blackhole
exit-vrf
!
interface lo
 ip ospf area 0
 ip ospf passive
exit
!
interface eth2
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 192.0.2.130
exit
!
! The underlay instance carries l2vpn evpn to the route reflector and nothing
! else.
router bgp 65000
 bgp router-id 192.0.2.130
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.0.2.193 remote-as internal
 neighbor 192.0.2.193 update-source lo
 !
 address-family l2vpn evpn
  neighbor 192.0.2.193 activate
  advertise-all-vni
 exit-address-family
exit
!
! The deployment VRF instance. The node session has an explicit inbound list
! and default-originate but no outbound policy, so it must not depend on
! ebgp-requires-policy. Two nodes with different ASNs may announce the same
! provider host route after a floating IP moves; multipath-relax keeps both.
router bgp 65000 vrf cobaltcore
 bgp router-id 192.0.2.130
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor nodes peer-group
 neighbor nodes remote-as external
 neighbor nodes bfd profile fabric
 neighbor eth1 interface peer-group nodes
 !
 address-family ipv4 unicast
  redistribute static
  neighbor nodes activate
  neighbor nodes default-originate
  neighbor nodes prefix-list NODES-IN-V4 in
  neighbor nodes maximum-prefix 8192
  maximum-paths 64
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute static
  neighbor nodes activate
  neighbor nodes default-originate
  neighbor nodes prefix-list NODES-IN-V6 in
  neighbor nodes maximum-prefix 8192
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
  route-target import 65000:20001
  route-target export 65000:20001
 exit-address-family
exit
!
ip prefix-list NODES-IN-V4 seq 10 permit 192.0.2.0/25 ge 32
ip prefix-list NODES-IN-V4 seq 20 permit 198.51.100.0/24 ge 32
ip prefix-list NODES-IN-V4 seq 30 permit 10.200.0.0/16 ge 32
ip prefix-list NODES-IN-V4 seq 100 deny any
ipv6 prefix-list NODES-IN-V6 seq 10 permit 2001:db8::/64 ge 128
ipv6 prefix-list NODES-IN-V6 seq 100 deny any
