# Tempest configuration for Keystone identity API tests (CC-0035 REQ-003).
# Targets the Keystone service deployed by Chainsaw E2E in the kind cluster.
# Admin credentials are injected at runtime from the keystone-admin K8s secret.

[DEFAULT]
log_dir = /tmp/tempest-logs
log_file = tempest.log

[identity]
uri_v3 = http://keystone-basic-api.openstack.svc:5000/v3

[auth]
admin_username = admin
admin_password = ${KEYSTONE_ADMIN_PASSWORD}
admin_project_name = admin
admin_domain_name = Default
use_dynamic_credentials = false

[service_available]
identity = true
compute = false
network = false
volume = false
image = false
object-storage = false

[identity-feature-enabled]
api_v3 = true
