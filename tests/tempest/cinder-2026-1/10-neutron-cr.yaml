# Dedicated Neutron CR for the Cinder Tempest leg (2026.1 release).
#
# The volume suites create no network, and a network API still has to answer
# two callers. Tempest's dynamic credentials delete each project's default
# security group through it once [service_available] neutron is true, and nova
# asks it for the project's networks on every server create, so a leg without a
# Neutron fails the compute-tagged volume tests on the boot.
#
# It uses a separate database (neutron_cinder_tempest_2026_1) to avoid stale
# state from prior Chainsaw E2E tests that reuse the same kind cluster, and
# authenticates against the dedicated keystone-cinder-tempest-2026-1 identity
# service with the real admin credentials. The database credentials come from
# the ESO-synced neutron-db Secret and the service-user password from the
# pre-seeded keystone-admin Secret. The broker Secret and the OVN control plane
# come from the two sibling fixtures.
#
# spec.nova is not set. The field is not on the Neutron CRD yet; it belongs to
# https://github.com/C5C3/cobaltcore/issues/1019. Without it Neutron reports no
# port state back to Nova, and the leg passes anyway because the servers carry
# no NIC and the fake compute runs with vif_plugging_timeout = 0
# (14-fake-compute.yaml), so nova-compute finishes a boot without waiting for a
# network-vif-plugged event.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-cinder-tempest-2026-1
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 2
    # Mirror 06-cinder-cr.yaml: the operator sets no CPU limit, so this block
    # exists for its memory. The four uWSGI workers below share one memory
    # cgroup, and the port-forward pins every stestr worker to a single pod, so
    # that pod's budget has to cover the whole suite and the second replica
    # takes no traffic.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi
  # neutron-server serves its API from uWSGI, so this pod's request capacity is
  # replicas x processes. The webhook default (2) is at the stestr worker count
  # ci-run-tempest.sh runs on this leg (TEMPEST_CONCURRENCY 2) with nothing left
  # for the network calls nova-api makes against the same Deployment while a
  # server boots, so raise the process count to 4.
  apiServer:
    uwsgi:
      processes: 4
  # The RPC workers serve no request the leg makes: no chassis and no agent runs
  # on this leg to call them. One is enough to keep the Deployment Ready without
  # lengthening the bring-up.
  workers:
    deployment:
      replicas: 1
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: neutron_cinder_tempest_2026_1
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: neutron-cinder-tempest-2026-1-messaging
  ovn:
    centralRef:
      name: ovn-cinder-tempest-2026-1
  keystoneEndpoint: http://keystone-cinder-tempest-2026-1.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
