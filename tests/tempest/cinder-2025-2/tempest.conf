# Tempest configuration for Cinder block-storage API tests.
# Targets the dedicated cinder-tempest-2025-2 volume service in the kind
# cluster, together with the glance-cinder-tempest-2025-2 image service and the
# compute stack the compute-tagged volume tests boot a server on
# (nova-cinder-tempest-2025-2, placement-cinder-tempest-2025-2 and
# neutron-cinder-tempest-2025-2), and authenticates against the
# keystone-cinder-tempest-2025-2 identity service. admin_password is injected at
# runtime from the keystone-admin K8s secret.

[DEFAULT]
log_dir = /tmp/tempest-logs
log_file = tempest.log

[identity]
uri_v3 = http://keystone-cinder-tempest-2025-2.openstack.svc:5000/v3

[auth]
use_dynamic_credentials = true
# The volume suites bind no port, so tempest passes no network and nova boots
# the server without a NIC.
create_isolated_networks = false
admin_username = admin
admin_password = ${KEYSTONE_ADMIN_PASSWORD}
admin_project_name = admin
admin_domain_name = Default

[identity-feature-enabled]
api_v3 = true
enforce_scope = true

[volume]
catalog_type = block-storage
# The block-storage endpoints are registered in RegionOne by the catalog-setup
# Job; be explicit so the volume client's catalog lookup does not depend on the
# identity region default.
region = RegionOne
# The volume-type tests build a type from these two properties and expect the
# scheduler to place a volume on it. The NFS driver reports "nfs"
# (driver_volume_type), and the scheduler expands that into the NFS/nfs variant
# pair before the capabilities filter matches against it
# (cinder/scheduler/host_manager.py get_storage_protocol_variants), so either
# spelling of this value places the volume.
storage_protocol = NFS
vendor_name = Open Source
# The one CinderBackend of this leg (04-cinderbackend-cr.yaml). The name is the
# backend section in cinder.conf, which is what the backend-specific tests
# address.
backend_names = nfs1
# Volumes are carved out of the kind NFS export, so keep them at the smallest
# size the API accepts.
volume_size = 1
build_timeout = 300
min_microversion = 3.0
# The upper end of the range the suite selects tests from. Re-read the version
# document the API serves at GET / on the first CI run and lower this if the
# deployed Cinder advertises less.
max_microversion = 3.71

[volume-feature-enabled]
# The NFS driver has no snapshot support, so the snapshot-tagged tests are off
# and the clone path (a full copy through the volume service) carries the
# create-from-volume coverage instead.
snapshot = false
clone = true
# 05-cinderbackupbackend-cr.yaml attaches the backup target these need.
backup = true
# Off, as the Phase-0 lab of #1015 ran it (section (d.7)). Extending a volume
# while it is attached is not proven against the NFS driver here.
extend_attached_volume = false
# cinder manage adopts a volume that already exists on the backend; nothing
# creates one out-of-band here.
manage_volume = false
manage_snapshot = false
# One backend, so the multi-backend suite has nothing to compare.
multi_backend = false
# Registered by cinder-tempest-plugin, in this group. A revert restores a volume
# from one of its snapshots, which the NFS driver cannot take.
volume_revert = false

[image]
catalog_type = image
# Registered in RegionOne by the catalog-setup Job, like the block-storage
# endpoints above.
region = RegionOne

[compute]
# The image 07-image-seed-job.yaml creates. tempest.api.volume reads this option
# for every create-volume-from-image case (tempest/api/volume/base.py), and the
# compute-tagged cases boot their server from it.
image_ref = c1d3f000-0988-4000-8000-000000000001
# The two flavors 15-flavor-seed-job.yaml creates. Pinning the ids keeps this
# file free of per-run substitution.
flavor_ref = 4e0a7e57-0000-4000-8000-0000000000f1
flavor_ref_alt = 4e0a7e57-0000-4000-8000-0000000000f2
# The leg runs one fake compute (14-fake-compute.yaml). The multi-node classes
# skip on this value.
min_compute_nodes = 1
# How long the boot waiters give a server to reach ACTIVE. A fake-driver server
# gets there in seconds; the value matches [volume] build_timeout above.
build_timeout = 300
# The compute endpoints are registered in RegionOne by the catalog-setup Job,
# like the block-storage and image ones above.
region = RegionOne

[network]
# The network endpoints land in RegionOne too. Tempest's dynamic credentials
# reach the network API for every project they tear down
# (tempest/lib/common/dynamic_creds.py).
region = RegionOne

[validation]
# A fake-driver server has no guest to ssh into. test_incremental_backup asks
# create_server for SSHABLE (cinder_tempest_plugin/api/volume/base.py), and with
# validation off tempest waits for ACTIVE alone, which is how the Phase-0 lab of
# #1015 ran that test
# (https://github.com/C5C3/cobaltcore/issues/1015#issuecomment-5685726178,
# section (d.7)).
run_validation = false

[service_available]
cinder = true
glance = true
# The leg deploys a Nova with one fake compute, so the compute-tagged tests
# (attach, boot-from-volume) run. Neutron is on because tempest's dynamic
# credentials delete each project's default security group through the network
# API (tempest/lib/common/dynamic_creds.py) and the runner forwards this leg's
# Neutron. Placement is on because that Nova claims its inventory there.
nova = true
neutron = true
placement = true
swift = false
barbican = false
horizon = false
