# The Glance the Cinder Tempest leg (2025.2 release) creates volumes from and
# uploads volumes back to. tempest.api.volume boots its volumes from an image
# (CONF.compute.image_ref, seeded by 07-image-seed-job.yaml), so the leg carries
# an image service of its own next to the Cinder.
#
# Uses a separate database (glance_cinder_tempest_2025_2) to avoid stale state
# from prior Chainsaw E2E tests that reuse the same kind cluster, and
# authenticates against the leg's own keystone-cinder-tempest-2025-2 identity
# service with the real admin credentials. The database credentials come from
# the ESO-synced glance-db Secret and the service-user password from the
# pre-seeded keystone-admin Secret. glance-api cannot start without a default
# image store, so 03-glancebackend-cr.yaml attaches one before Ready can settle.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-cinder-tempest-2025-2
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
    # Mirror 00-keystone-cr.yaml: the operator's default 500m CPU limit
    # throttles the glance-api pod to half a core. The volume suites push the
    # seed image through this pod on every create-from-image, so give it the
    # same headroom the glance leg gives its own API.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance_cinder_tempest_2025_2
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone-cinder-tempest-2025-2.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
