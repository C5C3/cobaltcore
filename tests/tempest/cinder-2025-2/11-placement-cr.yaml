# Placement CR for the Cinder Tempest leg (2025.2 release).
#
# The scheduler picks a host by asking Placement for allocation candidates, and
# nova-compute publishes the resource provider its inventory hangs off. Without
# this service a server never leaves the scheduling step, so the leg runs one
# Placement of its own on the schema placement_cinder_tempest_2025_2.
#
# One replica. The Placement traffic comes from nova-scheduler, nova-conductor
# and the one compute, and only the compute-tagged volume tests boot a server at
# all; a second pod would only lengthen the bring-up on a node that already
# carries the Keystone, the OVN control plane, the Neutron, the Glance, the
# Cinder and the five Nova workloads.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-cinder-tempest-2025-2
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: placement_cinder_tempest_2025_2
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone-cinder-tempest-2025-2.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
