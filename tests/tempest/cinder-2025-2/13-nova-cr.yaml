# Dedicated Nova CR for the Cinder Tempest leg (2025.2 release).
#
# The compute-tagged volume tests are what it serves: attaching a volume to a
# server, detaching it again, backing up an attached volume and booting a server
# from a volume all go through this API, and so does the incremental-backup test
# of cinder_tempest_plugin.
#
# Managed mode throughout: the two schemas nova_cinder_tempest_2025_2_api and
# nova_cinder_tempest_2025_2 on the openstack-db MariaDB cluster (cell0 is
# derived as nova_cinder_tempest_2025_2_cell0), the openstack-memcached cache,
# the ESO-synced nova-api-db and nova-db credentials and the pre-seeded
# keystone-admin service-user password (all from deploy/kind/infrastructure).
# Separate schemas keep stale state from prior Chainsaw E2E tests on the same
# kind cluster out of this leg.
#
# allow_resize_to_same_host is the leg's only override. No volume test resizes a
# server, so it changes nothing that runs here; it is kept so both legs that
# deploy a Nova render the same configuration
# (tests/tempest/nova-2025-2/10-nova-cr.yaml). The option is not rendered by the
# operator (it is listed in operators/nova/api/v1alpha1/catalogs/2025.2.json),
# so ExtraConfigHealthy stays True on NoOwnedKeysOverridden.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-cinder-tempest-2025-2
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  api:
    deployment:
      # The second replica takes no tempest traffic, because the 8774
      # port-forward pins every stestr worker to one pod. It is kept to match
      # the sibling tempest CRs: 06-cinder-cr.yaml and
      # tests/tempest/neutron-2025-2/04-neutron-cr.yaml both run two API
      # replicas.
      replicas: 2
      # Mirror 06-cinder-cr.yaml: with resources unset the webhook
      # fills in the shared defaults (500m CPU, 512Mi memory,
      # internal/common/types/workload.go), and the four uWSGI workers below do
      # not fit. Each nova-api worker settles near 130 MiB RSS once it has
      # initialized its cell worker thread pool, so the kernel OOM-kills the
      # container and the CR never reports Ready.
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 1536Mi
    # nova-api serves its API from uWSGI, so this pod's request capacity is
    # replicas x processes. The webhook default (2) is at the stestr worker
    # count ci-run-tempest.sh runs on this leg (TEMPEST_CONCURRENCY 2) with
    # nothing left for the polling a compute-tagged volume test does while it
    # waits for a server to reach ACTIVE, and the 8774 forward pins every worker
    # to a single pod, so raise the process count to 4.
    uwsgi:
      processes: 4
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_cinder_tempest_2025_2_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_cinder_tempest_2025_2
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  # The kind-only broker deploy-infra.sh installs under WITH_MESSAGING. Managed
  # mode lands on the root vhost, which this leg's Cinder also uses
  # (06-cinder-cr.yaml). The two share it without colliding: nova's control
  # exchange is nova, with the topics scheduler, conductor and compute, while
  # cinder's is openstack, with cinder-scheduler, cinder-volume and
  # cinder-backup.
  messaging:
    clusterRef:
      name: shared-rabbitmq
  keystoneEndpoint: http://keystone-cinder-tempest-2025-2.openstack.svc.cluster.local:5000/v3
  region: RegionOne
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-cinder-tempest-2025-2-metadata-secret
  extraConfig:
    DEFAULT:
      allow_resize_to_same_host: "true"
