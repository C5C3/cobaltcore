# Tempest configuration for Nova compute API tests.
# Targets the dedicated nova-tempest-2026-1 compute service in the kind cluster,
# together with the placement-nova-tempest-2026-1, glance-nova-tempest-2026-1
# and neutron-nova-tempest-2026-1 services it depends on, and authenticates
# against the keystone-nova-tempest-2026-1 identity service. admin_password is
# injected at runtime from the keystone-admin K8s secret.

[DEFAULT]
log_dir = /tmp/tempest-logs
log_file = tempest.log

[identity]
uri_v3 = http://keystone-nova-tempest-2026-1.openstack.svc:5000/v3
# Every endpoint the catalog-setup Job registers lands in RegionOne.
region = RegionOne

[auth]
use_dynamic_credentials = true
# Every server boots onto a port, so each dynamic-credential project needs a
# network of its own.
create_isolated_networks = true
admin_username = admin
admin_password = ${KEYSTONE_ADMIN_PASSWORD}
admin_project_name = admin
admin_domain_name = Default

[identity-feature-enabled]
api_v3 = true
# enforce_scope is not set here, unlike on the cinder and neutron legs. The
# Phase-0 lab of #1015 measured the compute suite without it, and this leg runs
# the configuration the lab measured.

[compute]
# The two images 08-image-seed-job.yaml creates and the two flavors
# 14-flavor-seed-job.yaml creates. Pinning the ids keeps this file free of
# per-run substitution.
image_ref = 4e0a7e57-0000-4000-8000-000000000001
image_ref_alt = 4e0a7e57-0000-4000-8000-000000000002
flavor_ref = 4e0a7e57-0000-4000-8000-0000000000f1
flavor_ref_alt = 4e0a7e57-0000-4000-8000-0000000000f2
# The compute endpoints are registered in RegionOne by the catalog-setup Job; be
# explicit so the compute client's catalog lookup does not depend on the
# identity region default.
region = RegionOne
# The leg runs one fake compute. A kind node carries one chassis hostname and
# neutron binds a port only to a host that has a live chassis, so a second
# compute could not bind ports. The live-migration, cold-migration and
# multi-node classes skip on this value; the Phase-0 lab ran three computes with
# min_compute_nodes = 2.
min_compute_nodes = 1
min_microversion = 2.1
max_microversion = latest
build_timeout = 120

[network]
region = RegionOne
# The CIDR the dynamic-credential projects carve their tenant networks out of,
# and the prefix length each one gets. 10.110.0.0/16 is unused by the kind
# cluster (nodes, pods and services all live elsewhere).
project_network_cidr = 10.110.0.0/16
project_network_mask_bits = 24

[network-feature-enabled]
# No provider network exists on a kind node, so no floating IP can be allocated.
floating_ips = false

[image]
region = RegionOne

[placement]
region = RegionOne

[validation]
# A fake-driver server has no guest to ssh into.
run_validation = false

[service_available]
nova = true
neutron = true
glance = true
placement = true
# No Cinder on this leg, so the volume-tagged compute tests skip. The
# cross-service path between compute and block storage runs on the cinder legs.
cinder = false
swift = false
barbican = false
horizon = false

[compute-feature-enabled]
# The table the Phase-0 lab recorded
# (https://github.com/C5C3/cobaltcore/issues/1015#issuecomment-5685726178,
# section (d.6)), kept as recorded. The migration flags stay true: the tests
# they gate skip on min_compute_nodes = 1 above rather than on the flag. With
# every flag on, the same suite took 91 minutes in place of 42 and failed 18
# tests.
attach_encrypted_volume = true
block_migration_for_live_migration = true
can_migrate_between_any_hosts = true
change_password = true
cold_migration = true
config_drive = true
console_output = true
disk_config = true
enable_instance_password = true
hostname_fqdn_sanitization = true
ide_bus = true
interface_attach = true
live_migrate_back_and_forth = true
live_migration = true
metadata_service = true
pause = true
personality = true
rescue = true
resize = true
serial_console = true
shelve = true
shelve_migrate = true
suspend = true
swap_volume = true
unified_limits = true
vnc_console = true
volume_backed_live_migration = true
volume_multiattach = true
vtpm_live_migration = true
# The fake driver's snapshot sets IMAGE_UPLOADING and never uploads
# (nova/virt/fake.py:216-219), so the glance image stays queued and each test
# that takes one waits about 300 s and then fails.
snapshot = false
# Its rescue image is a snapshot of a server, so it runs into the same wait.
stable_rescue = false
# The API answers 400 "Unavailable console type spice-direct".
spice_console = false
