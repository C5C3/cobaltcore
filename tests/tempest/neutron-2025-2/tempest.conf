# Tempest configuration for Neutron network API tests.
# Targets the dedicated neutron-tempest-2025-2 network service in the kind
# cluster and authenticates against the keystone-neutron-tempest-2025-2
# identity service. admin_password is injected at runtime from the
# keystone-admin K8s secret.

[DEFAULT]
log_dir = /tmp/tempest-logs
log_file = tempest.log

[identity]
uri_v3 = http://keystone-neutron-tempest-2025-2.openstack.svc:5000/v3

[auth]
use_dynamic_credentials = true
create_isolated_networks = false
admin_username = admin
admin_password = ${KEYSTONE_ADMIN_PASSWORD}
admin_project_name = admin
admin_domain_name = Default

[identity-feature-enabled]
api_v3 = true
enforce_scope = true

[enforce_scope]
neutron = true

[network]
catalog_type = network
# The network endpoints are registered in RegionOne by the catalog-setup Job; be
# explicit so the network client's catalog lookup does not depend on the
# identity region default.
region = RegionOne
# The CIDR the dynamic-credential projects carve their tenant networks out of,
# and the prefix length each one gets. 10.100.0.0/16 is unused by the kind
# cluster (nodes, pods and services all live elsewhere).
project_network_cidr = 10.100.0.0/16
project_network_mask_bits = 24
# Nothing routes to those networks: the leg drives the API, never a workload.
project_networks_reachable = false

[network-feature-enabled]
api_extensions = all
# No external provider network exists yet, so no floating IP can be allocated
# (D6). The router and floating-IP suites are out of include-tests.txt for the
# same reason.
floating_ips = false
ipv6 = true
ipv6_subnet_attributes = true
port_security = true

[neutron_plugin_options]
available_type_drivers = geneve,flat
# List of provider networks available in the deployment, empty because none is:
# a value here names a physnet the trunk and admin suites would then try to
# build provider networks on.
provider_vlans =
firewall_driver = ovn

[service_available]
neutron = true
nova = false
cinder = false
glance = false
swift = false
barbican = false
horizon = false
