# Dedicated Keystone CR the Nova Tempest leg authenticates against.
# Uses a separate database (keystone_nova_tempest_2025_2) to avoid stale
# state from prior Chainsaw E2E tests or the other Tempest legs that reuse
# the same kind cluster.
#
# The cache stays on the shared openstack-memcached, and the leg brings no
# Memcached of its own. Keystone caches the lookup of a user by name under a
# key that carries no instance identity, so two Keystones on one Memcached read
# each other's entry and the second one answers 401 for admin. That is why the
# nova E2E suites (tests/e2e/nova/*/00-keystone-cr.yaml) each carry a Memcached
# of their own: up to four of them run at once. This leg runs a single Keystone
# per cluster, so no second writer reaches those keys.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-nova-tempest-2025-2
  namespace: openstack
spec:
  deployment:
    replicas: 3
    # The operator sets no CPU limit, so this block exists for its memory: it
    # gives the keystone-API pod a 1Gi limit, twice the 512Mi it gets by
    # default at two uWSGI processes, as headroom for the Tempest run.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_nova_tempest_2025_2
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
