# An application credential for the ordered user on the ordered project, with
# the default rotation: keystone-user proves the schedule, and this suite proves
# the delivery to the target.
# region keystoneapplicationcredential-workflow-appcred
apiVersion: c5c3.io/v1alpha1
kind: KeystoneApplicationCredential
metadata:
  name: workflow-appcred
  namespace: orders-tenant
spec:
  controlPlaneRef:
    name: cp
    namespace: "@CP_NS@"
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
# endregion keystoneapplicationcredential-workflow-appcred
