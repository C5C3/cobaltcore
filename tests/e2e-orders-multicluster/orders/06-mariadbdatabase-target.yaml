# A database on the plane's MariaDB, with the default deletionPolicy Retain. On
# the target the delivered host and port are the plane's
# spec.infrastructure.publishedDatabaseEndpoint.
# region mariadbdatabase-workflow-db
apiVersion: c5c3.io/v1alpha1
kind: MariaDBDatabase
metadata:
  name: workflow-db
  namespace: orders-tenant
spec:
  controlPlaneRef:
    name: cp
    namespace: "@CP_NS@"
# endregion mariadbdatabase-workflow-db
