# Proves the delivered credentials work from the target cluster: `token issue`
# reaches Keystone at the auth_url the Secret carries, the plane's published
# endpoint, and fails unless the password is the one K-ORC applied to the
# Keystone user. The token is unscoped, so the Job makes no catalog call.
#
# keystone-user's 03-openstack-verify-job.yaml, run on the target. The image is
# pinned to the tag the e2e-orders-multicluster job loads into the target
# cluster, with IfNotPresent so it uses that copy rather than pulling from GHCR.
# region token-verify-job
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-verify
  namespace: orders-tenant
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: osc
        image: ghcr.io/c5c3/tempest:2026.1
        imagePullPolicy: IfNotPresent
        env:
        - name: OS_CLIENT_CONFIG_FILE
          value: /etc/openstack/clouds.yaml
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "== openstack --os-cloud admin token issue =="
          openstack --os-cloud admin token issue -c expires
          echo "OK: the delivered credentials authenticate"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: clouds
          mountPath: /etc/openstack
          readOnly: true
      volumes:
      - name: clouds
        secret:
          secretName: workflow-credentials
# endregion token-verify-job
