# Proves the delivered application credential works from the target cluster:
# `token issue` fails unless Keystone holds the credential the Secret names,
# with the secret it carries. Only the expiry and the project are printed: the
# token id is a bearer credential and stays out of the pod log.
#
# keystone-user's 11-openstack-appcred-verify-job.yaml, run on the target. The
# image and pull policy are the 10- Job's, for the reason it gives.
# region appcred-verify-job
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-appcred-verify
  namespace: orders-tenant
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: osc
        image: ghcr.io/c5c3/tempest:2026.1
        imagePullPolicy: IfNotPresent
        env:
        - name: OS_CLIENT_CONFIG_FILE
          value: /etc/openstack/clouds.yaml
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "== openstack --os-cloud admin token issue =="
          openstack --os-cloud admin token issue -c expires -c project_id
          echo "OK: the delivered application credential authenticates"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: clouds
          mountPath: /etc/openstack
          readOnly: true
      volumes:
      - name: clouds
        secret:
          secretName: workflow-appcred-credentials
# endregion appcred-verify-job
