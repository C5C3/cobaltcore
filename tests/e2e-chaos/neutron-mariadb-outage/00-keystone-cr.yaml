# Keystone CR fixture for the MariaDB partition chaos test. Unique name
# (keystone-neutron-outage) and database (keystone_neutron_outage) to avoid
# conflicts with other test suites.
#
# The Neutron API rejects an unauthenticated request, so the probes of this
# suite need a token. The suite brings its own Keystone rather than pointing at
# whatever another suite happened to leave behind: the Service the operator
# projects carries the CR name, so the Neutron CR's keystoneEndpoint resolves to
# keystone-neutron-outage.openstack.svc.cluster.local:5000, and the token the
# API validates comes from the same Keystone the probe asked.
#
# The bootstrap admin password comes from the pre-seeded keystone-admin Secret,
# which is also the Neutron serviceUser's, so both identities are one.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-neutron-outage
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_neutron_outage
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
