# Keystone CR for the operator clock-skew chaos test. Unique name
# (keystone-chaos-opclk) and database (keystone_chaos_opclk) to avoid
# conflicts with other test suites.
#
# One replica. The suite patches spec.deployment.replicas to 2 while the
# leader's clock is an hour ahead and back to 1 while it is past the API
# server's certificate, and reads each change off Deployment
# keystone-chaos-opclk: a reconcile the operator completed under the fault.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-chaos-opclk
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_chaos_opclk
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
