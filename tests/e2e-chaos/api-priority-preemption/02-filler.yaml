# A filler Deployment of api-priority-preemption, rendered once per worker by
# step 4: @N@ is the worker's number, @NODE@ its name and @CPU@ the CPU
# request in millicores that leaves 20m of the node's allocatable CPU free,
# less than an API pod requests.
#
# The filler requests CPU and uses none: it sleeps. It is pinned by a
# nodeSelector, not by nodeName, so the scheduler places it and can preempt
# it. Its class chaos-preempt-low never preempts, so the replacement of a
# preempted filler stays Pending on its full node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-preempt-filler-@N@
  namespace: openstack
  labels:
    app.kubernetes.io/name: chaos-preempt-filler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chaos-preempt-filler
      app.kubernetes.io/instance: chaos-preempt-filler-@N@
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaos-preempt-filler
        app.kubernetes.io/instance: chaos-preempt-filler-@N@
    spec:
      nodeSelector:
        kubernetes.io/hostname: "@NODE@"
      priorityClassName: chaos-preempt-low
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      containers:
      - name: filler
        image: ghcr.io/c5c3/keystone:2026.1
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: "@CPU@m"
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 42424
          runAsGroup: 42424
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
