# Keystone CR for the Glance download abort chaos test. Unique name
# (keystone-cinder-img) and database (keystone_cinder_img) to avoid conflicts
# with other test suites. Cinder and Glance validate tokens against it, and
# cinder-volume downloads an image from Glance with the token of the request
# that asked for the volume, so both services and the probes share this one
# identity: the bootstrap admin of the pre-seeded keystone-admin Secret.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-cinder-img
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_cinder_img
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
