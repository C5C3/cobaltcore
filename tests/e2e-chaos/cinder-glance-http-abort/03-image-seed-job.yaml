# Registers the image service in the catalog of keystone-cinder-img and seeds
# the image the suite's volumes are created from: 1 MiB of zeros in raw
# format, under an id no other suite uses, as the nova suites'
# 09-image-seed-job.yaml do. Every Glance on the leg writes into the one
# glance-images bucket and keys its objects by image id, so two suites
# sharing an id would share an object.
#
# keystone-manage bootstrap creates the identity service alone, and the
# openstack CLI resolves `image create` through the catalog, so the Job writes
# the image service with its public and internal endpoint first, the rows the
# nova suites' catalog Jobs write. Nothing else in the suite reads them: Cinder
# reaches Glance through spec.glanceEndpoint, and the probes and the workload
# take their Glance URL as an argument.
#
# It runs after the Glance CR is Ready, authenticates as the bootstrap admin
# (keystone-admin Secret) and is guarded by two listings up front and an
# `image show` on the same id, so a Job retry converges rather than erroring
# on a duplicate.
apiVersion: batch/v1
kind: Job
metadata:
  name: cinder-img-image-seed
  namespace: openstack
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ghcr.io/c5c3/tempest:2026.1
          imagePullPolicy: IfNotPresent
          env:
            - name: OS_AUTH_URL
              value: http://keystone-cinder-img.openstack.svc.cluster.local:5000/v3
            - name: OS_IDENTITY_API_VERSION
              value: "3"
            - name: OS_USERNAME
              value: admin
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_NAME
              value: admin
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keystone-admin
                  key: password
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              GLANCE_URL="http://glance-cinder-img.openstack.svc:9292"

              # One listing each, not one per resource: an openstack
              # invocation costs about 12 s on the CI node. The guards match
              # the whole name, and the endpoint row as one fixed string.
              existing_services="$(openstack service list --format value -c Name)"
              existing_endpoints="$(openstack endpoint list --format value \
                -c "Service Name" -c Interface -c URL)"
              if ! grep -qx glance <<<"${existing_services}"; then
                openstack service create --name glance \
                  --description "OpenStack Image Service" image
              fi
              for interface in public internal; do
                if ! grep -qxF "glance ${interface} ${GLANCE_URL}" <<<"${existing_endpoints}"; then
                  openstack endpoint create --region RegionOne glance "${interface}" "${GLANCE_URL}"
                fi
              done
              echo "OK: image service registered at ${GLANCE_URL}"

              SEED_ID="4e0a0000-0000-4000-8000-00000000000d"
              if openstack image show "${SEED_ID}" >/dev/null 2>&1; then
                echo "OK: seed image ${SEED_ID} already present"
                exit 0
              fi

              dd if=/dev/zero of=/tmp/seed.img bs=1M count=1
              openstack image create --id "${SEED_ID}" \
                --disk-format raw --container-format bare \
                --public --file /tmp/seed.img seed

              echo "OK: seed image registered"
              openstack image show "${SEED_ID}" --format value -c id -c status
