# IOChaos openbao-io-latency: every I/O call below the raft directory of
# openbao-0 takes 200 ms longer. Writes still commit, slower.
#
# volumePath /openbao/data is the raft storage of the shared OpenBao
# (storage "raft" { path = "/openbao/data" }, deploy/kind/base), assumed to be
# a mount root of container openbao: the latency canary fails loudly when the
# chart mounts it elsewhere. The selector names namespace shared-services and
# app.kubernetes.io/name: openbao, which keeps the openbao-operator instance
# in openstack, labelled the same, out. The object lives in the suite's
# namespace, as every chaos object of the suites does. duration is a safety
# net above the phase; the suite deletes the object itself.
apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: openbao-io-latency
  namespace: openstack
  labels:
    chaos.c5c3.io/suite: openbao-io-fault
spec:
  mode: all
  selector:
    namespaces:
      - shared-services
    labelSelectors:
      app.kubernetes.io/name: openbao
  containerNames:
    - openbao
  volumePath: /openbao/data
  action: latency
  delay: "200ms"
  percent: 100
  duration: "600s"
