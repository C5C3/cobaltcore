# Neutron CR for the broker partition chaos test.
#
# Managed messaging: messaging.clusterRef points at the RabbitmqCluster of
# 01-rabbitmqcluster.yaml, so the operator reads that cluster's
# status.defaultUser.secretReference and builds the transport URL from the
# credentials and endpoint in it. That is the mode the fault is about. The
# brownfield secretRef mode of the sibling neutron-mariadb-outage suite points
# at a host that never resolves and could not tell a partition from a typo.
#
# Everything else is managed too: the schema neutron_broker_chaos on the
# openstack-db MariaDB cluster, the openstack-memcached cache, the ESO-synced
# neutron-db credentials and the pre-seeded keystone-admin service-user
# password.
#
# One API replica and one worker: the suite asserts what an unreachable broker
# does to the API, and a second replica would only lengthen the bring-up.
#
# keystoneEndpoint points at the Keystone this suite brings up in
# 00-keystone-cr.yaml, and serviceUser is that Keystone's bootstrap admin, whose
# password the pre-seeded keystone-admin Secret carries. The probes authenticate
# as the same identity, so the token the API validates and the token the probe
# presents come from one Keystone.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-broker-chaos
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  workers:
    deployment:
      replicas: 1
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron_broker_chaos
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: neutron-chaos-rabbitmq
  ovn:
    centralRef:
      name: neutron-broker-ovn
  keystoneEndpoint: http://keystone-neutron-broker.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
