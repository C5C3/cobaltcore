# OVN control plane the neutron-broker-chaos CR programs.
#
# The Neutron reconciler gates on this CR's status: it needs both
# internalDbAddress values and the published clientSecretName before it renders
# ml2_conf.ini. Single-member Raft clusters and a single northd keep the
# bring-up inside the suite's assert budget.
#
# The partition this suite injects severs the message bus, not OVN, so the
# control plane is untouched scaffolding for the API under test. The backup
# CronJob is suspended: this suite asserts nothing about it.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: neutron-broker-ovn
  namespace: openstack
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca-issuer
  northbound:
    replicas: 1
  southbound:
    replicas: 1
  northd:
    deployment:
      replicas: 1
  backup:
    suspend: true
