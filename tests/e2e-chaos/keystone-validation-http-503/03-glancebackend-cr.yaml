# Default S3 image store for the glance-ks503 CR, as
# ../glance-keystone-outage/02-glancebackend-cr.yaml: the in-cluster Garage on
# the pre-created glance-images bucket. glance-api registers no store without
# it, so it has to go Ready before the Glance CR can.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: GlanceBackend
metadata:
  name: glance-ks503-s3
  namespace: openstack
spec:
  glanceRef:
    name: glance-ks503
  type: S3
  isDefault: true
  s3:
    host: http://garage.shared-services.svc.cluster.local:3900
    bucket: glance-images
    region: garage
    credentialsSecretRef:
      name: garage-s3-credentials
