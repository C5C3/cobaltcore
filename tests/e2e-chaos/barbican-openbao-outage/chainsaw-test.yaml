# Chainsaw chaos E2E test for an OpenBao (secret store) outage.
# The partition severs barbican-api <-> OpenBao traffic. It is enforced on the
# OpenBao (server) side so it catches the ClusterIP-routed connection the vault
# plugin actually uses (see 03-networkchaos.yaml for why a client-side rule would
# be a no-op). The suite proves the secret write path fails closed under the
# outage while the API stays up:
#   - baseline: an authenticated POST /v1/secrets stores a payload and a GET of
#     the same secret reads it back byte for byte
#   - under partition: a fresh POST FAILS the way a store outage fails (5xx or a
#     bounded timeout, never a 4xx) — barbican never claims a stored secret it
#     could not write to the store, and an auth-pipeline regression that turns
#     every write into a 401 cannot pass for that proof
#   - under partition: GET /healthcheck stays 200 AND the Barbican condition
#     BarbicanAPIReady stays True. The healthcheck app is routed outside the
#     authtoken pipeline and touches neither the database nor the store, so a
#     store outage is invisible to readiness — only secret traffic fails. The
#     aggregate Ready condition is deliberately NOT asserted here: the store
#     controller revalidates its AppRole credentials against OpenBao on its own
#     cadence, so CredentialsReady may legitimately flip inside the window.
#   - after the partition is lifted the failed write is still not readable, and
#     a fresh round trip succeeds again
#
# Unlike the other chaos suites this one authenticates: barbican has no anonymous
# mode, and the secret path is only reachable with a project-scoped token. The
# suite therefore brings its own Keystone (00-keystone-cr.yaml) and every probe
# asks it for a token as the bootstrap admin before touching the Barbican API.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: barbican-openbao-outage
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply the Keystone CR the probes authenticate against ────────
  - try:
    - apply:
        file: 00-keystone-cr.yaml
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-barbican-outage
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: ../diagnostics.sh baseline keystone-barbican-outage
  # ── Step 2: Apply the Barbican CR and its default store, assert Ready ────
  - try:
    - apply:
        file: 01-barbican-cr.yaml
    - apply:
        file: 02-barbican-secretstore.yaml
    - assert:
        resource:
          apiVersion: barbican.openstack.c5c3.io/v1alpha1
          kind: Barbican
          metadata:
            name: barbican-bao-outage
            namespace: openstack
          status:
            (conditions[?type == 'SecretStoresReady']):
            - status: "True"
              reason: AllStoresProjected
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - assert:
        resource:
          apiVersion: barbican.openstack.c5c3.io/v1alpha1
          kind: BarbicanSecretStore
          metadata:
            name: barbican-bao-outage-store
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: ../diagnostics.sh baseline barbican-bao-outage --cr-kind=barbican --dep-label=app.kubernetes.io/name=openbao --dep-ns=openstack
    - script:
        content: kubectl get barbicansecretstore barbican-bao-outage-store -n openstack -o yaml 2>&1 || true
  # ── Step 3: Baseline — a secret round trip stores and reads back ─────────
  # Runs an in-cluster python client (the barbican image ships python3): it asks
  # Keystone for a project-scoped admin token, POSTs a secret with a payload,
  # then GETs the payload back and compares it byte for byte. Connection errors
  # are retried; an HTTP error fails fast with the body. The WRITE-OK sentinel is
  # grepped so a swallowed pod exit code still fails.
  - try:
    - script:
        timeout: 5m
        content: |
          set -eu
          # Every probe in this suite reads its verdict from the pod log, not
          # from an attached stream. `kubectl run -i` carries only what the
          # container writes after the attach is established, so a probe that
          # reaches its sentinel first leaves the captured output holding
          # nothing but the deletion notice — the sentinel grep then fails on a
          # run where the assertion itself held. The kubelet writes the
          # container log to disk as it is produced, so reading it after
          # termination cannot race. That costs --rm: the pod has to outlive
          # the run to stay readable, and the trap removes it.
          POD=barbican-bao-baseline-probe
          cleanup() { kubectl delete pod "$POD" -n "$NAMESPACE" --ignore-not-found --wait=false >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # The bootstrap admin password travels as a pod env var, the same way
          # the c5c3 suites hand credentials to their openstack-client probes.
          PW="$(kubectl get secret keystone-admin -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)"
          kubectl run "$POD" -n "$NAMESPACE" \
            --image=ghcr.io/c5c3/barbican:2025.2 --restart=Never \
            --env "OS_PASSWORD=${PW}" \
            --command -- python3 -c '
          import json, os, sys, time, urllib.request, urllib.error

          KEYSTONE = "http://keystone-barbican-outage.openstack.svc.cluster.local:5000/v3"
          BARBICAN = "http://barbican-bao-outage.openstack.svc.cluster.local:9311"
          NAME = "bao-outage-baseline"
          PAYLOAD = "bao-outage-baseline-payload"

          def fail(msg):
              print("FAIL: " + msg)
              sys.exit(1)

          def call(method, url, data=None, headers=None, timeout=30):
              req = urllib.request.Request(url, data=data, method=method, headers=dict(headers or {}))
              return urllib.request.urlopen(req, timeout=timeout)

          def do(fn, what, tries=30):
              err = None
              for i in range(tries):
                  try:
                      return fn()
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      fail("%s -> HTTP %d: %s" % (what, e.code, body))
                  except (urllib.error.URLError, ConnectionError, OSError) as e:
                      err = e
                      print("retry %d for %s: %s" % (i, what, e))
                      time.sleep(5)
              fail("%s -> gave up after retries: %s" % (what, err))

          def token():
              body = json.dumps({"auth": {
                  "identity": {"methods": ["password"], "password": {"user": {
                      "name": "admin", "domain": {"id": "default"},
                      "password": os.environ["OS_PASSWORD"]}}},
                  "scope": {"project": {"name": "admin", "domain": {"id": "default"}}}}}).encode()
              resp = do(lambda: call("POST", KEYSTONE + "/auth/tokens", data=body,
                                     headers={"Content-Type": "application/json"}), "keystone token")
              return resp.headers["X-Subject-Token"]

          tok = token()
          print("obtained a project-scoped admin token")

          body = json.dumps({"name": NAME, "secret_type": "opaque",
                             "payload": PAYLOAD, "payload_content_type": "text/plain"}).encode()
          created = json.loads(do(lambda: call("POST", BARBICAN + "/v1/secrets", data=body,
                                               headers={"X-Auth-Token": tok, "Content-Type": "application/json"}),
                                  "store secret").read())
          # barbican renders secret_ref from the request host, so the uuid is
          # taken out of it and the read is rebuilt against the Service URL the
          # probe already resolved.
          uuid = created["secret_ref"].rstrip("/").rsplit("/", 1)[-1]
          print("stored secret %s (ref %s)" % (uuid, created["secret_ref"]))

          got = do(lambda: call("GET", BARBICAN + "/v1/secrets/%s/payload" % uuid,
                                headers={"X-Auth-Token": tok, "Accept": "text/plain"}),
                   "retrieve payload").read().decode("utf-8", "replace")
          if got != PAYLOAD:
              fail("payload round trip returned %r, want %r" % (got, PAYLOAD))
          print("payload read back byte for byte")
          print("WRITE-OK")
          '
          # Poll for a terminal phase instead of waiting for Succeeded alone: a
          # probe that fails its assertion ends in Failed, and waiting only for
          # Succeeded would burn the step timeout and then throw away the log
          # that says why. The sentinel below, not the phase, is the verdict.
          phase=""
          for _ in $(seq 1 100); do
            phase="$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          # || true so a log read that fails is echoed and grepped like any
          # other output rather than aborting the step under set -e with the
          # diagnosis unprinted.
          OUT="$(kubectl logs -n "$NAMESPACE" "$POD" 2>&1 || true)"
          echo "${OUT}"
          echo "pod phase: ${phase:-<none>}"
          echo "${OUT}" | grep -q 'WRITE-OK'
          echo "OK: baseline secret round trip stored and read back the payload"
    catch:
    - script:
        content: ../diagnostics.sh baseline barbican-bao-outage --cr-kind=barbican --dep-label=app.kubernetes.io/name=openbao --dep-ns=openstack
  # ── Step 4: Inject NetworkChaos to partition OpenBao traffic ─────────────
  - try:
    - apply:
        file: 03-networkchaos.yaml
  # ── Step 5: Assert NetworkChaos injection is active ──────────────────────
  # Confirms the fault is applied before checking effects. Uses `kubectl wait
  # --for=condition=AllInjected` instead of a chainsaw resource assert because
  # NetworkChaos.status.conditions is a fixed 4-item list
  # (Selected/AllInjected/AllRecovered/Paused); chainsaw's list-merge rejects
  # any shorter expected slice with "lengths of slices don't match". Asserting
  # the negative conditions instead would be worse than verbose: chaos-mesh
  # writes ALL four False before the selector has run, so a Selected=False
  # assertion passes on an experiment that never injected anything.
  - try:
    - script:
        timeout: 60s
        content: |
          set -eu
          kubectl wait networkchaos/partition-openbao-barbican -n openstack \
            --for=condition=AllInjected --timeout=60s
    catch:
    - script:
        content: kubectl get networkchaos/partition-openbao-barbican -n openstack -o yaml 2>&1 || true
    - script:
        content: ../diagnostics.sh chaos barbican-bao-outage --cr-kind=barbican --dep-label=app.kubernetes.io/name=openbao --dep-ns=openstack --log-label=app.kubernetes.io/instance=barbican-bao-outage
  # ── Step 6: Assert fail-closed — writes fail while the API stays up ──────
  # The in-cluster probe proves three things at once while OpenBao is
  # partitioned: (1) GET /healthcheck stays 200 (the API keeps serving), (2) a
  # Keystone token is still obtainable (the partition is scoped to the store, not
  # to identity traffic), and (3) POST /v1/secrets does NOT return a 2xx —
  # barbican fails closed rather than claiming a secret it could not store. The
  # resource assert then confirms BarbicanAPIReady stays True: the operator's
  # probe hits /healthcheck, which never touches the store.
  - try:
    - script:
        timeout: 5m
        content: |
          set -eu
          # Log-based verdict, not an attached stream — see step 3 for why.
          POD=barbican-bao-failclosed-probe
          cleanup() { kubectl delete pod "$POD" -n "$NAMESPACE" --ignore-not-found --wait=false >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          PW="$(kubectl get secret keystone-admin -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)"
          kubectl run "$POD" -n "$NAMESPACE" \
            --image=ghcr.io/c5c3/barbican:2025.2 --restart=Never \
            --env "OS_PASSWORD=${PW}" \
            --command -- python3 -c '
          import json, os, sys, time, urllib.request, urllib.error

          KEYSTONE = "http://keystone-barbican-outage.openstack.svc.cluster.local:5000/v3"
          BARBICAN = "http://barbican-bao-outage.openstack.svc.cluster.local:9311"
          NAME = "bao-outage-failclosed"
          PAYLOAD = "bao-outage-failclosed-payload"

          def fail(msg):
              print("FAIL: " + msg)
              sys.exit(1)

          def call(method, url, data=None, headers=None, timeout=30):
              req = urllib.request.Request(url, data=data, method=method, headers=dict(headers or {}))
              return urllib.request.urlopen(req, timeout=timeout)

          def do(fn, what, tries=12):
              err = None
              for i in range(tries):
                  try:
                      return fn()
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      fail("%s -> HTTP %d: %s" % (what, e.code, body))
                  except (urllib.error.URLError, ConnectionError, OSError) as e:
                      err = e
                      print("retry %d for %s: %s" % (i, what, e))
                      time.sleep(5)
              fail("%s -> gave up after retries: %s" % (what, err))

          def healthcheck(what):
              resp = do(lambda: call("GET", BARBICAN + "/healthcheck", timeout=15), what)
              if resp.status != 200:
                  fail("%s -> %d during partition, want 200" % (what, resp.status))

          # The API must keep serving health traffic: /healthcheck is served by
          # the oslo healthcheck middleware and never touches the secret store,
          # so it stays 200. Checked before the write attempt parks a worker.
          healthcheck("healthcheck")
          print("healthcheck 200 during partition (API up)")

          # Identity traffic is outside the partition, so a token is still
          # obtainable and a failing write below is about the store alone.
          body = json.dumps({"auth": {
              "identity": {"methods": ["password"], "password": {"user": {
                  "name": "admin", "domain": {"id": "default"},
                  "password": os.environ["OS_PASSWORD"]}}},
              "scope": {"project": {"name": "admin", "domain": {"id": "default"}}}}}).encode()
          tok = do(lambda: call("POST", KEYSTONE + "/auth/tokens", data=body,
                                headers={"Content-Type": "application/json"}),
                   "keystone token").headers["X-Subject-Token"]
          print("keystone token still obtainable during partition")

          # Fail-closed contract: storing the payload goes through the vault
          # plugin to the partitioned OpenBao, so the POST must NOT return a 2xx.
          # A 5xx (the store failed) or a bounded timeout / connection error is
          # the expected, correct outcome; a 2xx would mean barbican reported a
          # secret it could not have stored. A 4xx is NOT accepted: the suite
          # exists to prove the STORE fails closed, and a regression that breaks
          # the auth pipeline (a bad serviceUser, a misrendered
          # [keystone_authtoken]) turns every write into a 401 that would
          # otherwise read as proof. One attempt only — a retry could land a
          # second secret under the same name and blur what step 7b reads.
          secret = json.dumps({"name": NAME, "secret_type": "opaque",
                               "payload": PAYLOAD, "payload_content_type": "text/plain"}).encode()
          try:
              resp = call("POST", BARBICAN + "/v1/secrets", data=secret,
                          headers={"X-Auth-Token": tok, "Content-Type": "application/json"},
                          timeout=90)
              if 200 <= resp.status < 300:
                  fail("POST /v1/secrets returned %d during partition -- the secret write did NOT fail closed" % resp.status)
              print("POST non-2xx %d during partition (fail-closed OK)" % resp.status)
          except urllib.error.HTTPError as e:
              if e.code < 500:
                  body = e.read().decode("utf-8", "replace")
                  fail("POST -> HTTP %d during partition: a client error does not prove the store failed closed: %s"
                       % (e.code, body))
              print("POST -> HTTP %d during partition (fail-closed OK)" % e.code)
          except (urllib.error.URLError, ConnectionError, OSError) as e:
              print("POST -> %r during partition (fail-closed OK)" % e)

          # The failed write must not have taken the API down with it.
          healthcheck("healthcheck after the failed write")
          print("healthcheck 200 after the failed write (API still up)")
          print("FAILCLOSED-OK")
          '
          phase=""
          for _ in $(seq 1 100); do
            phase="$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          OUT="$(kubectl logs -n "$NAMESPACE" "$POD" 2>&1 || true)"
          echo "${OUT}"
          echo "pod phase: ${phase:-<none>}"
          echo "${OUT}" | grep -q 'FAILCLOSED-OK'
          echo "OK: secret write failed closed while the API stayed up"
    - assert:
        resource:
          apiVersion: barbican.openstack.c5c3.io/v1alpha1
          kind: Barbican
          metadata:
            name: barbican-bao-outage
            namespace: openstack
          status:
            (conditions[?type == 'BarbicanAPIReady']):
            - status: "True"
              reason: APIHealthy
    catch:
    - script:
        content: ../diagnostics.sh chaos barbican-bao-outage --cr-kind=barbican --dep-label=app.kubernetes.io/name=openbao --dep-ns=openstack --log-label=app.kubernetes.io/instance=barbican-bao-outage
    - script:
        content: kubectl get networkchaos/partition-openbao-barbican -n openstack -o yaml 2>&1 || true
    - script:
        content: kubectl get pods -n openstack -l app.kubernetes.io/name=openbao,openbao.org/cluster=openbao-instance -o wide 2>&1 || true
  # ── Step 7: Delete NetworkChaos to lift the partition ────────────────────
  - try:
    - delete:
        ref:
          apiVersion: chaos-mesh.org/v1alpha1
          kind: NetworkChaos
          name: partition-openbao-barbican
    catch:
    - script:
        content: ../diagnostics.sh chaos barbican-bao-outage --cr-kind=barbican --dep-label=app.kubernetes.io/name=openbao --dep-ns=openstack --log-label=app.kubernetes.io/instance=barbican-bao-outage
    - script:
        content: kubectl get networkchaos/partition-openbao-barbican -n openstack -o yaml 2>&1 || true
  # ── Step 7b: Assert the failed-closed write stayed failed ────────────────
  # Step 6 accepts a bounded timeout as a fail-closed outcome, but a timeout only
  # proves the CLIENT gave up — the vault plugin could still have completed the
  # write via its own retry/backoff after the probe stopped waiting. Re-read the
  # secret now that OpenBao is reachable again: no secret under that name may
  # hand back the payload. One that does is a write barbican was never confirmed
  # on — the fail-closed contract broken in exactly the way step 6 cannot see.
  - try:
    - script:
        timeout: 3m
        content: |
          set -eu
          # Log-based verdict, not an attached stream — see step 3 for why.
          POD=barbican-bao-failclosed-verify
          cleanup() { kubectl delete pod "$POD" -n "$NAMESPACE" --ignore-not-found --wait=false >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          PW="$(kubectl get secret keystone-admin -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)"
          kubectl run "$POD" -n "$NAMESPACE" \
            --image=ghcr.io/c5c3/barbican:2025.2 --restart=Never \
            --env "OS_PASSWORD=${PW}" \
            --command -- python3 -c '
          import json, os, sys, time, urllib.request, urllib.error

          KEYSTONE = "http://keystone-barbican-outage.openstack.svc.cluster.local:5000/v3"
          BARBICAN = "http://barbican-bao-outage.openstack.svc.cluster.local:9311"
          NAME = "bao-outage-failclosed"
          PAYLOAD = "bao-outage-failclosed-payload"

          def fail(msg):
              print("FAIL: " + msg)
              sys.exit(1)

          def call(method, url, data=None, headers=None, timeout=30):
              req = urllib.request.Request(url, data=data, method=method, headers=dict(headers or {}))
              return urllib.request.urlopen(req, timeout=timeout)

          def do(fn, what, tries=12):
              err = None
              for i in range(tries):
                  try:
                      return fn()
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      fail("%s -> HTTP %d: %s" % (what, e.code, body))
                  except (urllib.error.URLError, ConnectionError, OSError) as e:
                      err = e
                      print("retry %d for %s: %s" % (i, what, e))
                      time.sleep(5)
              fail("%s -> gave up after retries: %s" % (what, err))

          body = json.dumps({"auth": {
              "identity": {"methods": ["password"], "password": {"user": {
                  "name": "admin", "domain": {"id": "default"},
                  "password": os.environ["OS_PASSWORD"]}}},
              "scope": {"project": {"name": "admin", "domain": {"id": "default"}}}}}).encode()
          tok = do(lambda: call("POST", KEYSTONE + "/auth/tokens", data=body,
                                headers={"Content-Type": "application/json"}),
                   "keystone token").headers["X-Subject-Token"]

          listing = json.loads(do(lambda: call("GET", BARBICAN + "/v1/secrets?name=" + NAME,
                                               headers={"X-Auth-Token": tok}), "list secrets").read())
          secrets = listing.get("secrets", [])
          print("listing returned %d secret(s) named %r" % (len(secrets), NAME))

          # An empty listing is the cleanest fail-closed outcome: the POST never
          # created a row. A row without a readable payload is the other one —
          # barbican creates the metadata before it hands the payload to the
          # plugin, so a store failure can leave the record behind in ERROR.
          for entry in secrets:
              uuid = entry["secret_ref"].rstrip("/").rsplit("/", 1)[-1]
              print("secret %s status=%r" % (uuid, entry.get("status")))
              try:
                  got = call("GET", BARBICAN + "/v1/secrets/%s/payload" % uuid,
                             headers={"X-Auth-Token": tok, "Accept": "text/plain"}).read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  print("payload GET -> HTTP %d (nothing readable)" % e.code)
                  continue
              if got == PAYLOAD:
                  fail("secret %s hands back the payload of the write that failed closed -- barbican stored a secret the client was never confirmed on" % uuid)
              print("payload GET returned %r, not the failed write" % got)
          print("STAYED-FAILED-OK")
          '
          phase=""
          for _ in $(seq 1 60); do
            phase="$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          OUT="$(kubectl logs -n "$NAMESPACE" "$POD" 2>&1 || true)"
          echo "${OUT}"
          echo "pod phase: ${phase:-<none>}"
          echo "${OUT}" | grep -q 'STAYED-FAILED-OK'
          echo "OK: the failed-closed secret never became readable"
    catch:
    - script:
        content: ../diagnostics.sh chaos barbican-bao-outage --cr-kind=barbican --dep-label=app.kubernetes.io/name=openbao --dep-ns=openstack --log-label=app.kubernetes.io/instance=barbican-bao-outage
  # ── Step 8: Assert recovery — a fresh round trip succeeds again ──────────
  # Once the partition is lifted the vault plugin reaches OpenBao again; the
  # retrying probe stores a fresh secret and reads its payload back, proving the
  # secret path recovers autonomously with no operator intervention.
  - try:
    - script:
        timeout: 5m
        content: |
          set -eu
          # Log-based verdict, not an attached stream — see step 3 for why.
          POD=barbican-bao-recovery-probe
          cleanup() { kubectl delete pod "$POD" -n "$NAMESPACE" --ignore-not-found --wait=false >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          PW="$(kubectl get secret keystone-admin -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)"
          kubectl run "$POD" -n "$NAMESPACE" \
            --image=ghcr.io/c5c3/barbican:2025.2 --restart=Never \
            --env "OS_PASSWORD=${PW}" \
            --command -- python3 -c '
          import json, os, sys, time, urllib.request, urllib.error

          KEYSTONE = "http://keystone-barbican-outage.openstack.svc.cluster.local:5000/v3"
          BARBICAN = "http://barbican-bao-outage.openstack.svc.cluster.local:9311"
          NAME = "bao-outage-recovery"
          PAYLOAD = "bao-outage-recovery-payload"

          def fail(msg):
              print("FAIL: " + msg)
              sys.exit(1)

          def call(method, url, data=None, headers=None, timeout=30):
              req = urllib.request.Request(url, data=data, method=method, headers=dict(headers or {}))
              return urllib.request.urlopen(req, timeout=timeout)

          def do(fn, what, tries=30):
              err = None
              for i in range(tries):
                  try:
                      return fn()
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      fail("%s -> HTTP %d: %s" % (what, e.code, body))
                  except (urllib.error.URLError, ConnectionError, OSError) as e:
                      err = e
                      print("retry %d for %s: %s" % (i, what, e))
                      time.sleep(5)
              fail("%s -> gave up after retries: %s" % (what, err))

          body = json.dumps({"auth": {
              "identity": {"methods": ["password"], "password": {"user": {
                  "name": "admin", "domain": {"id": "default"},
                  "password": os.environ["OS_PASSWORD"]}}},
              "scope": {"project": {"name": "admin", "domain": {"id": "default"}}}}}).encode()
          tok = do(lambda: call("POST", KEYSTONE + "/auth/tokens", data=body,
                                headers={"Content-Type": "application/json"}),
                   "keystone token").headers["X-Subject-Token"]

          secret = json.dumps({"name": NAME, "secret_type": "opaque",
                               "payload": PAYLOAD, "payload_content_type": "text/plain"}).encode()
          created = json.loads(do(lambda: call("POST", BARBICAN + "/v1/secrets", data=secret,
                                               headers={"X-Auth-Token": tok, "Content-Type": "application/json"}),
                                  "store secret").read())
          uuid = created["secret_ref"].rstrip("/").rsplit("/", 1)[-1]
          print("stored secret %s (ref %s)" % (uuid, created["secret_ref"]))

          got = do(lambda: call("GET", BARBICAN + "/v1/secrets/%s/payload" % uuid,
                                headers={"X-Auth-Token": tok, "Accept": "text/plain"}),
                   "retrieve payload").read().decode("utf-8", "replace")
          if got != PAYLOAD:
              fail("payload round trip returned %r, want %r" % (got, PAYLOAD))
          print("payload read back byte for byte")
          print("WRITE-OK")
          '
          phase=""
          for _ in $(seq 1 100); do
            phase="$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          OUT="$(kubectl logs -n "$NAMESPACE" "$POD" 2>&1 || true)"
          echo "${OUT}"
          echo "pod phase: ${phase:-<none>}"
          echo "${OUT}" | grep -q 'WRITE-OK'
          echo "OK: the secret round trip succeeds again after the partition was lifted"
    catch:
    - script:
        content: ../diagnostics.sh chaos barbican-bao-outage --cr-kind=barbican --dep-label=app.kubernetes.io/name=openbao --dep-ns=openstack --log-label=app.kubernetes.io/instance=barbican-bao-outage
    - script:
        content: kubectl get pods -n openstack -l app.kubernetes.io/name=openbao,openbao.org/cluster=openbao-instance -o wide 2>&1 || true
