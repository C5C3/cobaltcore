# Nova CR for the Neutron HTTPChaos delay chaos test (2026.1 release).
#
# The bus is the per-suite vhost ../../e2e/cinder/broker-vhost.sh writes into
# nova-vifd-chaos-messaging on the kind-only shared-rabbitmq. Nothing in
# this suite partitions the bus, so the broker can be the shared one, and it
# has to be a vhost rather than managed messaging: the URL managed mode renders
# always names the root vhost, and nova's RPC topics are named after the
# service, so two suites there would share the scheduler and conductor queues.
#
# Everything else is managed too: the two schemas nova_vifd_chaos_api and
# nova_vifd_chaos on the openstack-db MariaDB cluster (cell0 is derived as
# nova_vifd_chaos_cell0), the openstack-memcached cache, the ESO-synced
# nova-api-db and nova-db credentials and the pre-seeded keystone-admin
# service-user password (all from deploy/kind/infrastructure).
#
# One API replica: the suite makes a handful of API calls and the node already
# carries five services. The conductor, the metadata API and the console proxy
# take the webhook's defaults. The scheduler runs one worker
# instead of the default two, as in ../nova-placement-outage/, which keeps the
# footprint of the leg's heaviest stack down.
#
# spec.logging.perLoggerLevels sets urllib3.connectionpool to DEBUG, as in
# ../nova-placement-outage/, so the Nova workloads log every new HTTP
# connection. perLoggerLevels renders [DEFAULT] default_log_levels, which
# replaces oslo.log's default list, so amqp, stevedore and the other libraries
# that list silences fall back to the root level INFO in this suite's Nova.
#
# No spec.dbArchive and no spec.extraConfig: the archive is what
# ../../e2e/nova/db-archive/ pins, and the resize override the full-stack
# suites carry exists for a resize this suite never performs.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-vifd-chaos
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2026.1"
  api:
    deployment:
      replicas: 1
  scheduler:
    workers: 1
  logging:
    perLoggerLevels:
      urllib3.connectionpool: DEBUG
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_vifd_chaos_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_vifd_chaos
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: nova-vifd-chaos-messaging
  keystoneEndpoint: http://keystone-nova-vifd-chaos.openstack.svc.cluster.local:5000/v3
  region: RegionOne
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-vifd-chaos-metadata-secret
