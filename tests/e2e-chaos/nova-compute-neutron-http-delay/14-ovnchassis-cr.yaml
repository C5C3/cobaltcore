# OVNChassis of the Neutron HTTPChaos delay chaos test. Its pods program the
# local Open vSwitch of every node the selector matches, which is the one kind
# node; step 1 labels it.
#
# Neutron binds a port only to a host that has a live chassis row in the
# Southbound database, and the chassis registers under the node's name, which
# is why the fake compute of 12-fake-compute.yaml takes its [DEFAULT] host from
# the same field.
#
# No bridge mappings and no gateway: there is no provider network on a kind
# node to map. spec.image is left unset so the operator resolves the same OVN
# image the control plane runs.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: nova-vifd-chaos-chassis
  namespace: openstack
spec:
  centralRef:
    name: nova-vifd-chaos-ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
