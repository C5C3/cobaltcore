# A copy of the fixture of ../../e2e/nova/compute-node-pool/ under the
# nova-loss prefix, for novacompute-node-loss.
#
# Nova CR for novacompute-node-loss (2026.1 release).
#
# Managed mode throughout: the two schemas nova_loss_api and nova_loss on the
# openstack-db MariaDB cluster (cell0 is derived as nova_loss_cell0), the
# openstack-memcached cache, the ESO-synced nova-api-db and nova-db credentials
# and the pre-seeded keystone-admin service-user password (all from
# deploy/kind/infrastructure).
#
# The bus is the per-suite vhost broker-vhost.sh writes into
# nova-loss-messaging. Managed messaging is not usable here: the URL it renders
# always names the root vhost, so two suites would share the scheduler and
# conductor RPC topics.
#
# Every process runs one replica: the suite asserts the node pool, not the
# control plane. The compute the pool registers is the one the NovaCompute CR
# of this suite runs, so the Nova carries no compute override of its own.
#
# The scheduler's host discovery periodic is off (-1, nova's own default), so
# the pool's discovery Job is the only thing that maps the node's host. The
# operator renders 300 otherwise and reports the override with
# ExtraConfigHealthy=False, which Ready does not aggregate.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-loss
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2026.1"
  api:
    deployment:
      replicas: 1
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_loss_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_loss
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: nova-loss-messaging
  keystoneEndpoint: http://keystone-nova-loss.openstack.svc.cluster.local:5000/v3
  region: RegionOne
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-loss-metadata-secret
  extraConfig:
    scheduler:
      discover_hosts_in_cells_interval: "-1"
