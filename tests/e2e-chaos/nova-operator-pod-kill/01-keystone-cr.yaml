# Keystone CR fixture for the nova-operator pod-kill chaos test (2026.1 release).
#
# The suite boots a server, so every call in it is authenticated: the Nova API
# validates the token, nova reaches Placement, Neutron and Glance with the same
# account, and the workload talks to all of them as a client. The suite brings
# its own Keystone because the Service the operator projects carries the CR
# name, which is what keeps the catalog rows and the service users of parallel
# suites apart.
#
# One replica and the database keystone_nova_chaos_op. The bootstrap
# admin password comes from the pre-seeded keystone-admin Secret
# (deploy/kind/infrastructure), which is also the serviceUser password of the
# Nova, the Neutron, the Placement and the Glance below, so all of them are one
# identity.
#
# The kill of this suite hits the nova-operator in nova-system and leaves this
# Keystone alone.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-nova-chaos-op
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_nova_chaos_op
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
