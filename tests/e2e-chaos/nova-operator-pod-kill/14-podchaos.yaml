# PodChaos CR to kill a nova-operator pod in nova-system.
#
# One-shot pod-kill of one of the two operator replicas the chart runs; the
# Deployment replaces it and the survivor or the new pod takes the leader
# lease. The selector is the operator's own label in its own namespace, so no
# Nova workload pod in openstack is a candidate.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-nova-operator
  namespace: nova-system
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - nova-system
    labelSelectors:
      app.kubernetes.io/name: nova-operator
  gracePeriod: 0
