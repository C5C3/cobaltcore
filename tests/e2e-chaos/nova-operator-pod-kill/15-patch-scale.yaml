# Patch applied AFTER the operator pod kill: proves the recovered operator
# still reconciles spec changes end-to-end. The API Deployment carries the CR
# name (operators/nova/internal/controller/reconcile_deployment.go).
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-chaos-op
  namespace: openstack
spec:
  api:
    deployment:
      replicas: 2
