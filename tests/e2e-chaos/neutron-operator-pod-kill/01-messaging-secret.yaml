# Brownfield transport-URL Secret for the neutron-chaos-op CR.
#
# This suite runs no broker. Nothing in the reconcile path dials one: the
# messaging step reads this Secret, checks that the URL parses with the rabbit
# scheme, and copies it into the derived Secret neutron-chaos-op-transport-url. The
# host therefore points at the reserved .invalid TLD, which never resolves, so
# a code change that started connecting on the reconcile path fails here
# instead of passing quietly.
#
# The name is neutron-chaos-op-messaging rather than neutron-chaos-op-transport-url: the
# latter is the derived Secret the operator writes, and a fixture under that
# name would be overwritten on the first pass.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-chaos-op-messaging
  namespace: openstack
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
