# Chainsaw chaos E2E test for a neutron-operator pod kill.
#
# The operator is a control-plane component: the Neutron API and RPC workers it
# deployed keep running while it is gone, and they keep running while it comes
# back. The suite states that as pod identity: every workload pod UID of
# neutron-chaos-op is snapshotted before the kill and compared after the
# operator has recovered, so a restart anywhere in the deployment fails the
# test instead of passing as "still Ready".
#
# The second half is the other side of the contract: an operator that survived
# the kill still reconciles. A replica count patched after the recovery has to
# reach the API Deployment, which nothing but a working control loop does.
#
# Identity-based verification: snapshot ALL pre-chaos operator pod UIDs, then
# wait for at least one to disappear. Snapshotting only .items[0] is racy: the
# operator runs 2 replicas and PodChaos mode: one picks its victim at random,
# so the recorded pod survives the kill in about half the runs. Mirrors
# cinder-operator-pod-kill.
#
# Blast radius: the PodChaos selects app.kubernetes.io/name: neutron-operator
# in neutron-system alone (04-podchaos.yaml).
#
# Workload, on the network leg: the token and network streams of
# ../lib/workload.sh create and delete networks and ports through
# neutron-chaos-op while the operator is gone. The operator is not on that
# request path, so the budget is zero and a failed record is a defect to find.
# Chaos matrix: neutron operator pod-kill
# Chaos random: neutron-operator-pod-kill
# Chaos budget: failures=0 recovery=0s
# Chaos budget measured: 2026-10-15, estimate, failures 0, recovery 0 s
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: neutron-operator-pod-kill
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply the Keystone CR the workload authenticates against ──────
  - try:
    - apply:
        file: 00-keystone-cr.yaml
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-neutron-chaos-op
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: ../diagnostics.sh baseline keystone-neutron-chaos-op
  # ── Step 2: Apply the OVN control plane and Neutron, start the workload ───
  - try:
    - apply:
        file: 01-messaging-secret.yaml
    - apply:
        file: 02-ovncentral-cr.yaml
    - apply:
        file: 03-neutron-cr.yaml
    - assert:
        resource:
          apiVersion: ovn.openstack.c5c3.io/v1alpha1
          kind: OVNCentral
          metadata:
            name: neutron-chaos-op-ovn
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: Neutron
          metadata:
            name: neutron-chaos-op
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - script:
        timeout: 6m
        content: >-
          ../lib/workload.sh start neutron-operator-pod-kill --
          --streams token,network
          --keystone http://keystone-neutron-chaos-op.openstack.svc:5000/v3
          --neutron http://neutron-chaos-op.openstack.svc:9696
    catch: &neutron-op-dump
    - script:
        timeout: 3m
        content: ../diagnostics.sh chaos neutron-chaos-op --cr-kind=neutron --dep-label=app.kubernetes.io/name=neutron-operator --dep-ns=neutron-system
    - get:
        apiVersion: ovn.openstack.c5c3.io/v1alpha1
        kind: OVNCentral
        name: neutron-chaos-op-ovn
        namespace: openstack
    - get:
        apiVersion: neutron.openstack.c5c3.io/v1alpha1
        kind: Neutron
        name: neutron-chaos-op
        namespace: openstack
    - script:
        timeout: 2m
        content: |
          echo "=== OVN and Neutron children ==="
          kubectl get deploy,sts,pod -n "$NAMESPACE" -l app.kubernetes.io/instance=neutron-chaos-op-ovn -o wide 2>&1 || true
          kubectl get deploy,pod -n "$NAMESPACE" -l app.kubernetes.io/instance=neutron-chaos-op -o wide 2>&1 || true
    - podLogs:
        selector: app.kubernetes.io/instance=neutron-chaos-op
        tail: 60
    - script:
        timeout: 1m
        content: ../lib/workload.sh dump neutron-operator-pod-kill
    cleanup:
    - script:
        timeout: 1m
        content: ../lib/workload.sh stop neutron-operator-pod-kill
  # ── Step 3: Inject chaos and verify one operator pod was replaced ─────────
  # Snapshot, apply and poll live in one script so the pre-chaos UID snapshot
  # and the wait share state. mode: one kills one of the two replicas, so "at
  # least one pre-chaos UID gone" proves the kill took effect regardless of
  # which pod chaos-mesh picked. Phase 3 then compares the workload UIDs
  # snapshotted here against the post-recovery set.
  - try:
    - script:
        # Timeout budget: Phase 1 (60×2s=120s) + Phase 2 (60×2s=120s) = 240s
        # worst case; Phase 3 is kubectl reads with no polling. 270s gives 30s
        # margin.
        timeout: 270s
        content: |
          # NOTE: set -euo pipefail is intentionally omitted. The polling
          # loops use ${VAR:-0} defensive defaults that would fail under
          # set -e when kubectl returns empty output, and loop exit
          # conditions are checked explicitly rather than via exit codes.

          # Read desired replica count from the Deployment so the test stays
          # valid if the operator replica count changes.
          DESIRED=$(kubectl get deployment neutron-operator -n neutron-system -o jsonpath='{.spec.replicas}')
          if [ -z "$DESIRED" ] || [ "$DESIRED" -lt 1 ]; then
            echo "ERROR: could not determine desired replica count from neutron-operator Deployment"
            exit 1
          fi
          echo "Desired replicas: ${DESIRED}"

          # Snapshot pre-chaos pod UIDs. mode: one must replace at least one
          # of these; checking that at least one disappears is race-free.
          OLD_UIDS=$(kubectl get pods -n neutron-system -l app.kubernetes.io/name=neutron-operator -o jsonpath='{.items[*].metadata.uid}')
          if [ -z "$OLD_UIDS" ]; then
            echo "ERROR: no operator pods found before chaos injection"
            exit 1
          fi
          echo "Pre-chaos operator pod UIDs: ${OLD_UIDS}"

          # Snapshot the Neutron's pod UIDs (the API, the RPC workers and the completed
          # db-sync Job pod). Killing the operator must disturb none of
          # them, which is the operational-independence contract Phase 3
          # checks.
          UIDS_0=$(kubectl get pods -n openstack -l app.kubernetes.io/instance=neutron-chaos-op -o jsonpath='{.items[*].metadata.uid}')
          if [ -z "$UIDS_0" ]; then
            echo "ERROR: no pods with app.kubernetes.io/instance=neutron-chaos-op before chaos injection"
            exit 1
          fi
          WORKLOAD_UIDS="${WORKLOAD_UIDS:-} ${UIDS_0}"
          echo "Pre-chaos workload pod UIDs:${WORKLOAD_UIDS}"

          # Inject chaos (kill one operator pod). The fault window is marked
          # on the workload's clock first; the script omits set -e, hence
          # the explicit exit.
          ../lib/workload.sh mark neutron-operator-pod-kill fault-start || exit 1
          kubectl apply -f 04-podchaos.yaml

          # Phase 1: wait until at least one pre-chaos UID is gone, proving
          # mode: one replaced a pod. 60 iterations × 2s = 120s max. An empty
          # CURRENT_UIDS (a transient kubectl failure) would spuriously match
          # "no UIDs present", so those iterations are skipped. REPLACED is
          # seeded before the loop, so a run of empty reads still fails the
          # guard below.
          REPLACED=0
          for i in $(seq 1 60); do
            CURRENT_UIDS=$(kubectl get pods -n neutron-system -l app.kubernetes.io/name=neutron-operator -o jsonpath='{.items[*].metadata.uid}')
            if [ -z "$CURRENT_UIDS" ]; then
              sleep 2
              continue
            fi
            REPLACED=0
            for uid in $OLD_UIDS; do
              case " $CURRENT_UIDS " in
                *" $uid "*) ;;
                *) REPLACED=1; break ;;
              esac
            done
            if [ "$REPLACED" -eq 1 ]; then
              echo "At least one pre-chaos operator pod replaced"
              break
            fi
            sleep 2
          done
          if [ "$REPLACED" -ne 1 ]; then
            echo "ERROR: no pre-chaos operator pod was replaced by chaos injection"
            echo "  pre-chaos UIDs: ${OLD_UIDS}"
            echo "  current UIDs:   ${CURRENT_UIDS}"
            exit 1
          fi

          # Phase 2: wait until readyReplicas returns to DESIRED (operator
          # recovered and reconciliation resumed). 60×2s = 120s max.
          RECOVERED=0
          for i in $(seq 1 60); do
            READY=$(kubectl get deployment neutron-operator -n neutron-system -o jsonpath='{.status.readyReplicas}')
            if [ "${READY:-0}" -eq "${DESIRED}" ]; then
              echo "Operator recovered: readyReplicas=${DESIRED}"
              RECOVERED=1
              break
            fi
            sleep 2
          done
          if [ "$RECOVERED" -ne 1 ]; then
            echo "ERROR: operator did not recover — readyReplicas=${READY:-0}, desired=${DESIRED}"
            exit 1
          fi

          # Phase 3: operational independence. The workload must have been
          # untouched by the operator outage: same pods, never restarted.
          NOW_WORKLOAD_UIDS="$(kubectl get pods -n openstack -l app.kubernetes.io/instance=neutron-chaos-op -o jsonpath='{.items[*].metadata.uid}')"
          if [ -z "$(printf '%s' "$NOW_WORKLOAD_UIDS" | tr -d ' ')" ]; then
            echo "ERROR: no workload pods present after the operator kill"
            exit 1
          fi
          for uid in $WORKLOAD_UIDS; do
            case " $NOW_WORKLOAD_UIDS " in
              *" $uid "*) ;;
              *)
                echo "ERROR: workload pod ${uid} was replaced during the operator outage"
                echo "  pre-chaos workload UIDs:${WORKLOAD_UIDS}"
                echo "  current workload UIDs:   ${NOW_WORKLOAD_UIDS}"
                exit 1
                ;;
            esac
          done
          echo "Workload undisturbed: pod UIDs unchanged across the kill"
          exit 0
    catch: *neutron-op-dump
    cleanup:
    - script:
        timeout: 2m
        content: |
          set -eu
          kubectl delete -f 04-podchaos.yaml --ignore-not-found
          echo "OK: the operator PodChaos is gone"
  # ── Step 4: Delete PodChaos ───────────────────────────────────────────────
  - try:
    - delete:
        ref:
          apiVersion: chaos-mesh.org/v1alpha1
          kind: PodChaos
          name: kill-neutron-operator
          namespace: neutron-system
    - script:
        timeout: 1m
        content: ../lib/workload.sh mark neutron-operator-pod-kill fault-end
    catch: *neutron-op-dump
  # ── Step 5: Prove the recovered operator reconciles a spec change ─────────
  - try:
    - patch:
        file: 05-patch-scale.yaml
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: neutron-chaos-op
            namespace: openstack
          spec:
            replicas: 2
          status:
            availableReplicas: 2
            updatedReplicas: 2
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: Neutron
          metadata:
            name: neutron-chaos-op
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch: *neutron-op-dump
  # ── Step 6: Judge the workload against the budget ─────────────────────────
  - try:
    - script:
        timeout: 15m
        content: ../lib/workload.sh verify neutron-operator-pod-kill
    catch: *neutron-op-dump
