# Brownfield transport-URL Secret for the neutron-ovn-ctl-kill CR, as in
# ../ovn-operator-pod-kill/01-messaging-secret.yaml.
#
# This suite runs no broker, and nothing in the reconcile path dials one: the
# messaging step checks that the URL parses with the rabbit scheme and copies
# it into the derived Secret neutron-ovn-ctl-kill-transport-url. The host is in the
# reserved .invalid TLD, so a change that started connecting fails here.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-ovn-ctl-kill-messaging
  namespace: openstack
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
