# Chainsaw chaos E2E test for a cinder-operator pod kill.
#
# The operator is a control-plane component: the API, the scheduler and the
# volume service it deployed keep running while it is gone, and they keep
# running while it comes back. The suite states that as pod identity: every
# workload pod UID is snapshotted before the kill and compared after the
# operator has recovered, so a restart anywhere in the deployment fails the
# test instead of passing as "still Ready".
#
# The second half is the other side of the contract: an operator that survived
# the kill still reconciles. A replica count patched after the recovery has to
# reach the API Deployment, which nothing but a working control loop does.
#
# Identity-based verification: snapshot ALL pre-chaos operator pod UIDs, then
# wait for at least one to disappear. Snapshotting only .items[0] is racy —
# the operator runs 2 replicas and PodChaos mode: one picks its victim at
# random, so the recorded pod survives the kill in ~half the runs and the
# old-pod-gone poll fails spuriously. Mirrors glance-operator-pod-kill.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cinder-operator-pod-kill
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Give the suite its vhost, then apply the CRs ────────────────
  # One vhost per suite: Cinder's RPC topics are named after the deployment,
  # so two suites on one vhost would share the scheduler and volume-service
  # queues. See ../../e2e/cinder/broker-vhost.sh. The step cleanup runs at the
  # end of the test.
  - try:
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../../e2e/cinder/broker-vhost.sh create cinder-chaos-op cinder-chaos-op-messaging openstack
    - apply:
        file: 00-cinder-cr.yaml
    - apply:
        file: 01-cinderbackend-cr.yaml
    - assert:
        resource:
          apiVersion: cinder.openstack.c5c3.io/v1alpha1
          kind: Cinder
          metadata:
            name: cinder-chaos-op
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch: &cinder-dump
    - script:
        content: ../diagnostics.sh chaos cinder-chaos-op --cr-kind=cinder --dep-label=app.kubernetes.io/name=cinder-operator --dep-ns=cinder-system
    - get:
        apiVersion: cinder.openstack.c5c3.io/v1alpha1
        kind: CinderBackend
        name: chaos-op-nfs1
        namespace: openstack
    - script:
        content: |
          echo "=== Cinder children ==="
          kubectl get deploy,pod -n $NAMESPACE -l app.kubernetes.io/instance=cinder-chaos-op -o wide 2>&1 || true
          echo "=== Cinder pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=cinder-chaos-op -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
          done
    cleanup:
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../../e2e/cinder/broker-vhost.sh delete cinder-chaos-op || true
  # ── Step 2: Inject chaos and verify one operator pod was replaced ───────
  # Snapshot, apply and poll live in one script so the pre-chaos UID snapshot
  # and the wait share state. mode: one kills exactly one of the two replicas,
  # so "at least one pre-chaos UID gone" proves the kill took effect
  # regardless of which pod chaos-mesh picked. Phase 3 then compares the
  # workload UIDs snapshotted here against the post-recovery set.
  - try:
    - script:
        # Timeout budget: Phase 1 (60×2s=120s) + Phase 2 (60×2s=120s) = 240s
        # worst case; Phase 3 is two kubectl reads with no polling. 270s gives
        # 30s margin.
        timeout: 270s
        content: |
          # NOTE: set -euo pipefail is intentionally omitted. The polling
          # loops use ${VAR:-0} defensive defaults that would fail under
          # set -e when kubectl returns empty output, and loop exit
          # conditions are checked explicitly rather than via exit codes.

          # Read desired replica count from the Deployment so the test stays
          # valid if the operator replica count changes.
          DESIRED=$(kubectl get deployment cinder-operator -n cinder-system -o jsonpath='{.spec.replicas}')
          if [ -z "$DESIRED" ] || [ "$DESIRED" -lt 1 ]; then
            echo "ERROR: could not determine desired replica count from cinder-operator Deployment"
            exit 1
          fi
          echo "Desired replicas: ${DESIRED}"

          # Snapshot pre-chaos pod UIDs. mode: one must replace at least one
          # of these; checking that at least one disappears is race-free.
          OLD_UIDS=$(kubectl get pods -n cinder-system -l app.kubernetes.io/name=cinder-operator -o jsonpath='{.items[*].metadata.uid}')
          if [ -z "$OLD_UIDS" ]; then
            echo "ERROR: no operator pods found before chaos injection"
            exit 1
          fi
          echo "Pre-chaos operator pod UIDs: ${OLD_UIDS}"

          # Snapshot the managed workload's pod UIDs too. The instance label
          # covers all four pods this CR owns: the API, the scheduler, the
          # volume service of chaos-op-nfs1 and the completed db-sync Job pod
          # (the migration Job carries no ttlSecondsAfterFinished, so it stays
          # listed). Killing the operator must disturb none of them, which is
          # the operational-independence contract Phase 3 checks.
          WORKLOAD_UIDS=$(kubectl get pods -n openstack -l app.kubernetes.io/instance=cinder-chaos-op -o jsonpath='{.items[*].metadata.uid}')
          if [ -z "$WORKLOAD_UIDS" ]; then
            echo "ERROR: no cinder pods found before chaos injection"
            exit 1
          fi
          echo "Pre-chaos cinder pod UIDs: ${WORKLOAD_UIDS}"

          # Inject chaos (kill one operator pod).
          kubectl apply -f 02-podchaos.yaml

          # Phase 1: wait until at least one pre-chaos UID is gone, proving
          # mode: one replaced a pod. 60 iterations × 2s = 120s max.
          # Empty CURRENT_UIDS (transient kubectl failure) would spuriously
          # match "no UIDs present" — skip those iterations instead.
          # REPLACED is seeded here, not only inside the loop body: every
          # iteration can hit the empty-CURRENT_UIDS `continue` above, and an
          # unset REPLACED would make the guard below an "integer expression
          # expected" error that the `if` reads as false, silently falling
          # through to Phase 2 instead of failing.
          REPLACED=0
          for i in $(seq 1 60); do
            CURRENT_UIDS=$(kubectl get pods -n cinder-system -l app.kubernetes.io/name=cinder-operator -o jsonpath='{.items[*].metadata.uid}')
            if [ -z "$CURRENT_UIDS" ]; then
              sleep 2
              continue
            fi
            REPLACED=0
            for uid in $OLD_UIDS; do
              case " $CURRENT_UIDS " in
                *" $uid "*) ;;
                *) REPLACED=1; break ;;
              esac
            done
            if [ "$REPLACED" -eq 1 ]; then
              echo "At least one pre-chaos operator pod replaced"
              break
            fi
            sleep 2
          done
          if [ "$REPLACED" -ne 1 ]; then
            echo "ERROR: no pre-chaos operator pod was replaced by chaos injection"
            echo "  pre-chaos UIDs: ${OLD_UIDS}"
            echo "  current UIDs:   ${CURRENT_UIDS}"
            exit 1
          fi

          # Phase 2: wait until readyReplicas returns to DESIRED (operator
          # recovered and reconciliation resumed). 60×2s = 120s max.
          RECOVERED=0
          for i in $(seq 1 60); do
            READY=$(kubectl get deployment cinder-operator -n cinder-system -o jsonpath='{.status.readyReplicas}')
            if [ "${READY:-0}" -eq "${DESIRED}" ]; then
              echo "Operator recovered: readyReplicas=${DESIRED}"
              RECOVERED=1
              break
            fi
            sleep 2
          done
          if [ "$RECOVERED" -ne 1 ]; then
            echo "ERROR: operator did not recover — readyReplicas=${READY:-0}, desired=${DESIRED}"
            exit 1
          fi

          # Phase 3: operational independence. The workload must have been
          # untouched by the operator outage — same pods, never restarted.
          # Any UID that changed means a cinder pod was disrupted by an
          # operator kill, which the contract forbids.
          NOW_WORKLOAD_UIDS=$(kubectl get pods -n openstack -l app.kubernetes.io/instance=cinder-chaos-op -o jsonpath='{.items[*].metadata.uid}')
          if [ -z "$NOW_WORKLOAD_UIDS" ]; then
            echo "ERROR: no cinder pods present after the operator kill"
            exit 1
          fi
          for uid in $WORKLOAD_UIDS; do
            case " $NOW_WORKLOAD_UIDS " in
              *" $uid "*) ;;
              *)
                echo "ERROR: cinder pod ${uid} was replaced during the operator outage"
                echo "  pre-chaos workload UIDs: ${WORKLOAD_UIDS}"
                echo "  current workload UIDs:   ${NOW_WORKLOAD_UIDS}"
                exit 1
                ;;
            esac
          done
          echo "Workload undisturbed: cinder pod UIDs unchanged across the kill"
          exit 0
    catch: *cinder-dump
  # ── Step 3: Delete PodChaos ─────────────────────────────────────────────
  - try:
    - delete:
        ref:
          apiVersion: chaos-mesh.org/v1alpha1
          kind: PodChaos
          name: kill-cinder-operator
          namespace: cinder-system
  # ── Step 4: Prove the recovered operator reconciles a spec change ───────
  - try:
    - patch:
        file: 03-patch-scale.yaml
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cinder-chaos-op
            namespace: openstack
          spec:
            replicas: 2
          status:
            availableReplicas: 2
            updatedReplicas: 2
    - assert:
        resource:
          apiVersion: cinder.openstack.c5c3.io/v1alpha1
          kind: Cinder
          metadata:
            name: cinder-chaos-op
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch: *cinder-dump
