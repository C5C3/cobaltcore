# PodChaos CR to kill a cinder-operator pod in cinder-system.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-cinder-operator
  namespace: cinder-system
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - cinder-system
    labelSelectors:
      app.kubernetes.io/name: cinder-operator
  gracePeriod: 0
