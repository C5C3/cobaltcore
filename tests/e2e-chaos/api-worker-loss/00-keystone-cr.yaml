# Keystone CR of api-worker-loss: three API replicas, one per node once step
# 2 has opened the workers and labelled one zone per node. The Neutron and the
# Placement of the suite validate their tokens against it, and the workload's
# token stream issues them here.
#
# The bootstrap admin password comes from the pre-seeded keystone-admin
# Secret, which is also the serviceUser password of the Neutron and the
# Placement.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-worker-loss
  namespace: openstack
spec:
  deployment:
    replicas: 3
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_worker_loss
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
