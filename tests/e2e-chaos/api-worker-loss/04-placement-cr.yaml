# Placement CR of api-worker-loss: three API replicas, one per node, on the
# schema placement_worker_loss. A copy of
# ../placement-operator-pod-kill/00-placement-cr.yaml that validates its
# tokens against this suite's Keystone.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-worker-loss
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 3
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: placement_worker_loss
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone-worker-loss.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
