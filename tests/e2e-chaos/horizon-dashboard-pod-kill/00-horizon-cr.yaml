# Horizon CR fixture for the dashboard pod-kill chaos test. It is
# ../horizon-memcached-pod-kill/00-horizon-cr.yaml under a unique name
# (horizon-chaos-dash) with two replicas: the PodChaos kills one dashboard pod,
# and the Service keeps an endpoint through the kill only while the other one
# serves. Cache via clusterRef to openstack-memcached; SECRET_KEY from the
# kind-infrastructure shim.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-chaos-dash
  namespace: openstack
spec:
  deployment:
    replicas: 2
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
