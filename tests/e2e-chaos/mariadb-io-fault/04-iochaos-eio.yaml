# IOChaos mariadb-io-eio: every write and fsync below /var/lib/mysql of the
# mariadb container fails with EIO (errno 5), a failing disk. InnoDB may stop
# the server; the suite waits for MariaDB to come back after the lift.
#
# IOChaos mounts a FUSE file system over volumePath, which must be a mount
# root of the container: /var/lib/mysql is the data volume of container
# mariadb. The selector names the pod of the suite's own MariaDB, never the
# shared openstack-db. duration is a safety net above the phase; the suite
# deletes the object itself.
apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: mariadb-io-eio
  namespace: openstack
  labels:
    chaos.c5c3.io/suite: mariadb-io-fault
spec:
  mode: all
  selector:
    namespaces:
      - openstack
    labelSelectors:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: mariadb-io-chaos
  containerNames:
    - mariadb
  volumePath: /var/lib/mysql
  action: fault
  errno: 5
  methods:
    - write
    - fsync
  percent: 100
  duration: "600s"
