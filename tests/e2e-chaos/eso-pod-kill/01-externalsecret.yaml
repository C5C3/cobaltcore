# The ExternalSecret the suite forces a sync of after the kill. It reads what
# deploy/kind/infrastructure/keystone-admin-externalsecret.yaml reads, into a
# Secret of its own name, so the force-sync touches no Secret a Keystone uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-kill-probe
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: eso-kill-probe
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: bootstrap/openstack/controlplane-keystone/admin
        property: password
