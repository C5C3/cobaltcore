# Keystone CR for the Barbican MariaDB partition chaos test. Unique name
# (keystone-barbican-db-chaos) and database (keystone_barbican_db_chaos) to avoid conflicts with
# other test suites.
#
# The Barbican API rejects an unauthenticated request, so the probes and
# the workload need a token. The suite brings its own Keystone rather than
# pointing at whatever another suite happened to leave behind: the Service the
# operator projects carries the CR name, so the Barbican CR's
# keystoneEndpoint resolves to keystone-barbican-db-chaos.openstack.svc.cluster.local:5000, and
# the token the API validates comes from the same Keystone the probe asked.
#
# The partition of 03-networkchaos.yaml targets the Barbican API pods alone,
# so this Keystone keeps its database and keeps issuing tokens through it.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-barbican-db-chaos
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_barbican_db_chaos
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
