# A copy of the fixture of ../../e2e/nova/compute-node-pool/ under the
# nova-drain prefix, for novacompute-drain-compute-kill.
#
# Placement CR for novacompute-drain-compute-kill (2026.1 release). The
# placement audit of the workload's verify reads its allocations.
#
# The scheduler picks a host by asking Placement for allocation candidates, and
# nova-compute publishes the resource provider its inventory hangs off. Without
# this service a server never leaves the scheduling step, so the suite runs one
# Placement of its own on the schema placement_nova_drain.
#
# One replica: the suite issues a handful of requests, and the node already
# carries a Keystone, an OVN control plane, a Neutron, a Glance and the five
# Nova workloads.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-nova-drain
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: placement_nova_drain
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone-nova-drain.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
