# The node pool under test: pool-a of ../../e2e/nova/compute-node-pool/ as
# nova-drain-pool. It selects the node step 1 labels with
# openstack.c5c3.io/nova-compute-pool=drain, and removing that label is how
# step 6 starts the drain. It declares no traits: a pool without traits never
# reads a Hypervisor (reconcile_novacompute_traits.go), and no stand-in
# Hypervisor CRD runs on this leg.
#
# spec.extraConfig is the fake-driver seam: kind has no KVM, and
# FakeDriverWithoutFakeNodes reports one node named after [DEFAULT] host, which
# the pod takes from spec.nodeName, so the compute service, the hypervisor and
# the resource provider all carry the node's name. vif plugging is switched off
# because no ML2 agent runs here to report a port as bound; the server carries
# no NIC either way. All three options are in the 2026.1 catalog, so the
# webhook's catalog check admits them.
#
# The resources are the ones the fake compute of
# ../../e2e/nova/basic-deployment runs on.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: nova-drain-pool
  namespace: openstack
spec:
  novaRef:
    name: nova-drain
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: drain
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 768Mi
  extraConfig:
    DEFAULT:
      compute_driver: fake.FakeDriverWithoutFakeNodes
      vif_plugging_is_fatal: "false"
      vif_plugging_timeout: "0"
