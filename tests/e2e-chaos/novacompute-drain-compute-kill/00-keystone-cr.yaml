# A copy of the fixture of ../../e2e/nova/compute-node-pool/ under the
# nova-drain prefix, for novacompute-drain-compute-kill.
#
# A Memcached of the Keystone's own. Keystone caches the lookup of a user by
# name under a key that carries no instance identity, so two Keystones on one
# Memcached read each other's entry: the second resolves "admin" to the first
# one's user id, finds no such row in its own database and answers 401, which
# nova-conductor and nova-scheduler meet while they build their Placement
# client. Five nova suites bring a Keystone and up to four run at once. The
# other services stay on openstack-memcached, where their keys are token hashes.
apiVersion: memcached.c5c3.io/v1beta1
kind: Memcached
metadata:
  name: keystone-nova-drain-cache
  namespace: openstack
spec:
  replicas: 1
  image: memcached:1.6
---
# Keystone CR fixture for novacompute-drain-compute-kill (2026.1 release).
#
# The suite boots a server, so every call in it is authenticated: the Nova API
# validates the token, nova reaches Placement, Neutron and Glance with the same
# account, and the boot Job, the probes and the workload talk to them as
# clients. The suite brings
# its own Keystone because the Service the operator projects carries the CR
# name, which is what keeps the catalog rows and the service users of parallel
# suites apart.
#
# One replica and the database keystone_nova_drain. The bootstrap admin
# password comes from the pre-seeded keystone-admin Secret
# (deploy/kind/infrastructure), which is also the serviceUser password of the
# Nova, the Neutron, the Placement and the Glance below, so all of them are one
# identity.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-nova-drain
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_nova_drain
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: keystone-nova-drain-cache
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
