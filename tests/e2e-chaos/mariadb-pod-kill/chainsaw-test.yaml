# Chainsaw chaos E2E test for MariaDB pod kill.
# Verifies the Keystone operator detects a MariaDB outage
# (DatabaseReady=False) and recovers autonomously when the
# StatefulSet restarts the killed pod.
#
# Chaos scenario: SC-CHAOS-001
#
# Workload: the token stream of ../lib/workload.sh issues and validates tokens
# against keystone-chaos-db through the fault. The budget is what three kind
# runs measured.
# Chaos matrix: keystone database pod-kill
# Chaos matrix: mariadb self pod-kill
# Chaos random: mariadb-pod-kill
# Chaos budget: failures=36 recovery=50s
# Chaos budget measured: 2026-10-14, kind, failures 13/18/13, recovery 19/20/19 s
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keystone-mariadb-pod-kill
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply Keystone CR ──────────────────────────────────────────
  - try:
    - apply:
        file: 00-keystone-cr.yaml
  # ── Step 2: Assert baseline Ready=True before chaos injection ──────────
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-chaos-db
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - script:
        timeout: 6m
        content: ../lib/workload.sh start mariadb-pod-kill -- --streams token --keystone http://keystone-chaos-db.openstack.svc:5000/v3
    catch:
    - script:
        content: ../diagnostics.sh baseline keystone-chaos-db
    - &workload-dump
      script:
        timeout: 1m
        content: ../lib/workload.sh dump mariadb-pod-kill
    cleanup:
    - script:
        timeout: 1m
        content: ../lib/workload.sh stop mariadb-pod-kill
  # ── Step 3: Inject PodChaos to kill MariaDB pod ────────────────────────
  - try:
    - script:
        timeout: 1m
        content: ../lib/workload.sh mark mariadb-pod-kill fault-start
    - apply:
        file: 01-podchaos.yaml
    catch:
    - *workload-dump
  # ── Step 4: Assert DatabaseReady=False after pod kill ──────────────────
  # REVIEWER-DISAGREEMENT: [Reviewer requested adding inline `kubectl get
  # keystone keystone-chaos-db -n $NAMESPACE -o yaml` here] — diagnostics.sh
  # already collects Keystone CR status (Keystone CR status section) for both
  # baseline and chaos modes, so adding it inline would duplicate the output.
  # The diagnostics matrix table has been corrected to reflect actual coverage.
  # Reviewer: please verify.
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-chaos-db
            namespace: openstack
          status:
            (conditions[?type == 'DatabaseReady']):
            - status: "False"
    catch:
    - script:
        content: ../diagnostics.sh chaos keystone-chaos-db --dep-label=app.kubernetes.io/name=mariadb --log-label=app.kubernetes.io/name=keystone-operator
    - *workload-dump
  # ── Step 5: Delete PodChaos to lift fault ──────────────────────────────
  - try:
    - delete:
        ref:
          apiVersion: chaos-mesh.org/v1alpha1
          kind: PodChaos
          name: kill-mariadb
    - script:
        timeout: 1m
        content: ../lib/workload.sh mark mariadb-pod-kill fault-end
    catch:
    - *workload-dump
  # ── Step 6: Assert full recovery to Ready=True ─────────────────────────
  # REVIEWER-DISAGREEMENT: [Reviewer requested adding inline `kubectl get
  # keystone keystone-chaos-db -n $NAMESPACE -o yaml` here] — see Step 4
  # comment: diagnostics.sh already collects Keystone CR status uniformly.
  # Reviewer: please verify.
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-chaos-db
            namespace: openstack
          status:
            (conditions[?type == 'DatabaseReady']):
            - status: "True"
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: ../diagnostics.sh chaos keystone-chaos-db --dep-label=app.kubernetes.io/name=mariadb --log-label=app.kubernetes.io/name=keystone-operator
    - *workload-dump
  # ── Step 7: Judge the workload against the budget ──────────────────────
  - try:
    - script:
        timeout: 15m
        content: ../lib/workload.sh verify mariadb-pod-kill
    catch:
    - *workload-dump
