# Patch to move cinder-upg-bus from 2026.1 to 2026.2. Both fields move
# together: the operator refuses a release bump that leaves the image
# untouched. The kill step applies it as a merge patch, so the upgrade starts
# in the same script that waits for RollingUpdate.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-upg-bus
  namespace: openstack
spec:
  openStackRelease: "2026.2"
  image:
    tag: "2026.2"
