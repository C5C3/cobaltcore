# Keystone CR under a HorizontalPodAutoscaler for the stress chaos test:
# keystone-chaos-hpa on the database keystone_chaos_hpa, with the Keystone
# autoscaling block of cp-autoscaling (tests/e2e-autoscaling/
# 00-controlplane-cr.yaml): one to three replicas at 150 % of the CPU
# request, scaling down after a 15-second window. The CPU StressChaos of
# 02-stresschaos-cpu.yaml loads its API pod until the HPA scales out, which
# needs metrics-server (WITH_METRICS_SERVER on the faults entry).
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-chaos-hpa
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_chaos_hpa
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 150
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 15
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
