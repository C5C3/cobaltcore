# StressChaos keystone-memory-stress: one memory worker in the keystone
# container of the API pod of keystone-chaos-vpa that allocates @SIZE@, which
# the suite computes at run time as memory.max minus memory.current of the
# container plus 64 MiB: past the limit, so the kernel's OOM killer runs in
# the container's cgroup. oomScoreAdj -1000 keeps the stressor itself off the
# OOM killer's list, so it picks a uWSGI process.
#
# duration is a safety net above the suite's memory phase; the suite deletes
# the object itself.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: keystone-memory-stress
  namespace: openstack
  labels:
    chaos.c5c3.io/suite: keystone-api-stress-autoscaling
spec:
  mode: all
  selector:
    namespaces:
      - openstack
    labelSelectors:
      app.kubernetes.io/name: keystone
      app.kubernetes.io/instance: keystone-chaos-vpa
      app.kubernetes.io/component: api
  containerNames:
    - keystone
  stressors:
    memory:
      workers: 1
      size: "@SIZE@"
      oomScoreAdj: -1000
  duration: "600s"
