# Seeds the image the three Jobs boot their servers from.
#
# The id is fixed so those Jobs need no lookup, and it is unique to this suite:
# every Glance on the leg writes into the one glance-images bucket and keys its
# objects by image id, so two suites sharing an id would share an object.
#
# The payload is 1 MiB of zeros in raw format. The fake driver never reads the
# disk it is handed, so the only thing the size changes is how long the download
# takes on a node that is running five services.
#
# It runs after the Glance CR is Ready, authenticates as the bootstrap admin
# (keystone-admin Secret) and is guarded by an `image show` on the same id, so a
# Job retry converges rather than erroring on the duplicate.
apiVersion: batch/v1
kind: Job
metadata:
  name: nova-broker-chaos-image-seed
  namespace: openstack
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ghcr.io/c5c3/tempest:2025.2
          imagePullPolicy: IfNotPresent
          env:
            - name: OS_AUTH_URL
              value: http://keystone-nova-broker-chaos.openstack.svc.cluster.local:5000/v3
            - name: OS_IDENTITY_API_VERSION
              value: "3"
            - name: OS_USERNAME
              value: admin
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_NAME
              value: admin
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keystone-admin
                  key: password
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              SEED_ID="4e0a0000-0000-4000-8000-000000000005"
              if openstack image show "${SEED_ID}" >/dev/null 2>&1; then
                echo "OK: seed image ${SEED_ID} already present"
                exit 0
              fi

              dd if=/dev/zero of=/tmp/seed.img bs=1M count=1
              # --public so the image stays bootable if a later suite copy runs
              # the server create in another project; the image is owned by
              # admin.
              openstack image create --id "${SEED_ID}" \
                --disk-format raw --container-format bare \
                --public --file /tmp/seed.img seed

              echo "OK: seed image registered"
              openstack image show "${SEED_ID}" --format value -c id -c status
