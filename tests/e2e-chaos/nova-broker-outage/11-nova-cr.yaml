# Nova CR for the broker-outage chaos test (2025.2 release).
#
# Managed messaging: messaging.clusterRef points at the RabbitmqCluster of
# 00-rabbitmqcluster.yaml, so the operator reads that cluster's
# status.defaultUser.secretReference and builds the transport URL from the
# credentials and the endpoint in it. That is the mode the fault is about, and
# it is why this suite takes no per-suite vhost the way the Nova suites under
# tests/e2e/nova/ do: managed mode always lands on the root vhost
# (BuildTransportURL renders the path as "/"), and this broker carries one
# Nova, so there is nothing to keep apart.
#
# Everything else is managed too: the two schemas nova_broker_chaos_api and
# nova_broker_chaos on the openstack-db MariaDB cluster (cell0 is derived as
# nova_broker_chaos_cell0), the openstack-memcached cache, the ESO-synced
# nova-api-db and nova-db credentials and the pre-seeded keystone-admin
# service-user password (all from deploy/kind/infrastructure).
#
# One API replica. The suite reads the API container's readiness and restart
# count under the partition, and a second replica would make those reads
# ambiguous. The scheduler, the conductor, the metadata API and the console
# proxy take the webhook's defaults.
#
# No spec.dbArchive and no spec.extraConfig: the archive is what
# ../../e2e/nova/db-archive/ pins, and the resize override the full-stack
# suites carry exists for a resize this suite never performs.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-broker-chaos
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  api:
    deployment:
      replicas: 1
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_broker_chaos_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_broker_chaos
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: nova-chaos-rabbitmq
  keystoneEndpoint: http://keystone-nova-broker-chaos.openstack.svc.cluster.local:5000/v3
  region: RegionOne
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-broker-chaos-metadata-secret
