# Brownfield transport-URL Secret for the neutron-nova-broker-chaos CR.
#
# This Neutron is pure ML2/OVN: it opens no broker connection. Nothing in the
# reconcile path dials one either, since the messaging step reads this Secret,
# checks that the URL parses with the rabbit scheme, and copies it into the
# derived Secret neutron-nova-broker-chaos-transport-url. The host therefore
# points at the reserved .invalid TLD, which never resolves, so a code change
# that started connecting on the reconcile path fails here instead of passing
# quietly.
#
# It also keeps the Neutron off the broker 00-rabbitmqcluster.yaml brings up.
# That broker carries the Nova alone, which is what makes the partition of
# 13-networkchaos.yaml a statement about Nova rather than about the stack
# around it.
#
# The name is neutron-nova-broker-chaos-messaging rather than
# neutron-nova-broker-chaos-transport-url: the latter is the derived Secret the
# operator writes, and a fixture under that name would be overwritten on the
# first pass.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-nova-broker-chaos-messaging
  namespace: openstack
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
