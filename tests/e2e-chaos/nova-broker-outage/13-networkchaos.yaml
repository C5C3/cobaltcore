# NetworkChaos CR to partition nova <-> RabbitMQ traffic.
#
# The partition is enforced on the broker (server) side on purpose. nova does
# not connect to a broker pod IP: the transport URL the operator builds from
# the RabbitmqCluster's default-user Secret carries the cluster's ClusterIP
# Service. chaos-mesh installs its drop rule inside the *selector* pods'
# network namespace and matches the *target* pods by their pod IPs. If the rule
# were installed on the nova (client) side, it would match broker pod IPs. At
# that point the packet still carries the Service ClusterIP, because kube-proxy
# only DNATs ClusterIP -> pod IP later, in the node's root namespace, after the
# packet has left the pod. The rule would therefore never match and the
# partition would be a no-op for Service-routed traffic.
#
# Installing the rule on the broker pods and dropping traffic *from* the nova
# pods works because, by the time the packet reaches the broker's namespace, it
# has already been DNATed and carries the real nova pod source IP. It is the
# same reason Kubernetes NetworkPolicies can match Service-routed traffic by
# client pod IP. direction 'both' fully severs the link in either direction.
#
# The broker side is also the side that survives the window. The rule lives in
# the network namespace of the one pod the suite never restarts; a rule
# installed in a nova pod would be gone with that pod, and this suite reads
# what happens to five workloads over three minutes of outage.
#
# The selector is the broker: the RabbitMQ Cluster Operator labels a cluster's
# pods app.kubernetes.io/name=<cluster name>.
#
# The target is every pod of this suite's Nova, with no component key. All five
# workloads hold a broker connection, and the suite's claim is about the
# difference between them: the scheduler and the conductor take their readiness
# off that connection and go NotReady, while the API keeps serving HTTP and
# only its write path blocks. A target that spared one of them would leave that
# process reachable and let it answer for a bus that is gone. The fake compute
# is not a target: it carries app.kubernetes.io/name=nova-fake-compute
# (12-fake-compute.yaml) and the claim is about the control plane.
#
# Duration is a safety net for auto-expiry if the test does not explicitly
# delete the CR; the suite lifts the partition explicitly. It must *exceed* the
# Chainsaw assert window, not equal it: an equal duration self-heals at the
# exact deadline, restoring broker connectivity in the same instant an
# assertion is still reading the state under the fault. 600s sits above the 5m
# assert window with margin, and above the readiness flip the suite waits out
# first (chainsaw-test.yaml step 10 derives its budget).
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: partition-rabbitmq-nova
  namespace: openstack
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - openstack
    labelSelectors:
      app.kubernetes.io/name: nova-chaos-rabbitmq
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - openstack
      labelSelectors:
        app.kubernetes.io/name: nova
        app.kubernetes.io/instance: nova-broker-chaos
  duration: "600s"
