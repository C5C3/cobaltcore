# The two credentials of the fresh Keystone, applied while the ESO controller
# is at zero. Each reads what its kind counterpart reads
# (deploy/kind/infrastructure/keystone-db-externalsecret.yaml and
# keystone-admin-externalsecret.yaml) into a Secret of its own name, so no
# Secret exists until a controller syncs them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-down-db
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tenant-store
    kind: SecretStore
  target:
    name: eso-down-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: openstack/keystone/openstack/standalone/db
        property: username
    - secretKey: password
      remoteRef:
        key: openstack/keystone/openstack/standalone/db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-down-admin
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: eso-down-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: bootstrap/openstack/controlplane-keystone/admin
        property: password
