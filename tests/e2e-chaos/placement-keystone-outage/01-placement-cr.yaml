# Placement CR for the Keystone outage chaos test. Unique name
# (placement-ks-outage) and database (placement_ks_outage) to avoid conflicts
# with other test suites. It is ../placement-operator-pod-kill/00-placement-cr.yaml
# with keystoneEndpoint pointed at the Keystone of 00-keystone-cr.yaml, the
# Keystone the outage takes away. Placement owns no store backend, so the CR
# is the only service fixture the suite applies.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-ks-outage
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: placement_ks_outage
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone-placement-ks-outage.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
