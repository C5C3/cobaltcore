# Keystone CR for the Placement Keystone outage chaos test. Unique name
# (keystone-placement-ks-outage) and database (keystone_placement_ks_outage) to avoid conflicts with
# other test suites.
#
# This is the Keystone the outage takes away, so the suite brings its own. The
# Service the operator projects carries the CR name, so the Placement CR's
# keystoneEndpoint resolves to
# keystone-placement-ks-outage.openstack.svc.cluster.local:5000, and the PodChaos of
# 02-podchaos.yaml selects the API pods of this CR by their instance label.
# A Placement pointed at a Keystone another suite runs would take that suite's
# identity service away with it.
#
# The bootstrap admin password comes from the pre-seeded keystone-admin
# Secret, which is also the Placement serviceUser's, so the probes, the
# workload and the service authenticate as one identity.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-placement-ks-outage
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_placement_ks_outage
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
