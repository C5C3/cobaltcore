# OVN control plane of ovn-northd-pod-kill.
#
# Single-member Raft clusters keep the bring-up short. northd runs two
# replicas, which share a lock in the Southbound database: one is active
# and the other waits for it
# (operators/ovn/internal/controller/reconcile_northd.go). The suite kills
# the active one. The backup CronJob is suspended: this suite asserts
# nothing about it.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn-northd-kill-ovn
  namespace: openstack
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca-issuer
  northbound:
    replicas: 1
  southbound:
    replicas: 1
  northd:
    deployment:
      replicas: 2
  backup:
    suspend: true
