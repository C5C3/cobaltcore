# The chassis of ovn-northd-pod-kill, on the nodes step 1 labels
# openstack.c5c3.io/chassis=true: both workers, the two ends of the Geneve tunnel the pings cross.
#
# No bridge mappings and no gateway: the data path is one logical switch
# between ports the suite plugs into network namespaces. spec.image is unset,
# so the operator resolves the OVN image the control plane runs.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: ovn-northd-kill-chassis
  namespace: openstack
spec:
  centralRef:
    name: ovn-northd-kill-ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
