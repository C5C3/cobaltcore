# What the deployment does once Placement is reachable again: it schedules.
#
# s-after is a fresh create. The scheduler's Placement client is an HTTP client
# with no connection state to rebuild, so the first request after the drop rule
# goes away reaches the service and the build is placed. That is the whole
# recovery contract here: no pod restart, no operator action, no re-submission.
#
# The ERROR server of 15-failclosed-job.yaml is deleted afterwards rather than
# left behind. A build that failed cannot be retried, so the only thing left to
# prove about it is that the deployment takes it off the books, and a suite
# that ended with an ERROR server in the listing would leave the teardown
# reading an unclear state.
#
# backoffLimit is 0 because the script is not idempotent: a second attempt
# would find the server s-after the first one created and fail on the name.
apiVersion: batch/v1
kind: Job
metadata:
  name: nova-placement-chaos-recovered
  namespace: openstack
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: recovered
          image: ghcr.io/c5c3/tempest:2025.2
          imagePullPolicy: IfNotPresent
          env:
            - name: OS_AUTH_URL
              value: http://keystone-nova-placement-chaos.openstack.svc.cluster.local:5000/v3
            - name: OS_IDENTITY_API_VERSION
              value: "3"
            - name: OS_USERNAME
              value: admin
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_NAME
              value: admin
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keystone-admin
                  key: password
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              SEED=4e0a0000-0000-4000-8000-000000000006

              # wait_status <kind> <name> <want> <timeoutSeconds>: poll one
              # object's status every 5s. On the deadline it prints the
              # object's own show output, whose fault message is what explains
              # a server that reached ERROR.
              wait_status() {
                ws_deadline=$(( $(date +%s) + $4 ))
                while true; do
                  ws_status="$(openstack "$1" show "$2" -f value -c status 2>/dev/null || true)"
                  if [ "${ws_status}" = "$3" ]; then
                    return 0
                  fi
                  if [ "$(date +%s)" -ge "${ws_deadline}" ]; then
                    echo "ERROR: $1 $2 status '${ws_status:-<none>}' != $3 within $4s"
                    openstack "$1" show "$2" 2>&1 || true
                    exit 1
                  fi
                  sleep 5
                done
              }

              # wait_gone <kind> <name> <timeoutSeconds>: poll until show no
              # longer finds the object.
              wait_gone() {
                wg_deadline=$(( $(date +%s) + $3 ))
                while openstack "$1" show "$2" >/dev/null 2>&1; do
                  if [ "$(date +%s)" -ge "${wg_deadline}" ]; then
                    echo "ERROR: $1 $2 still present after $3s"
                    openstack "$1" show "$2" 2>&1 || true
                    exit 1
                  fi
                  sleep 5
                done
              }

              # m1.nano is the flavor 14-baseline-job.yaml created.
              openstack server create --image "${SEED}" --flavor m1.nano --nic none s-after
              wait_status server s-after ACTIVE 300
              echo "OK: server s-after is ACTIVE"

              openstack server delete s-fail
              wait_gone server s-fail 120
              echo "OK: the build that failed under the partition is gone"

              echo RECOVERED-OK
