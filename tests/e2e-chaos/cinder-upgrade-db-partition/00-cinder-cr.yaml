# Cinder CR for the database partition across a release upgrade, installed at
# 2026.1. The release-upgrade fixture (../../e2e/cinder/release-upgrade/) under
# the name cinder-upg-part, on the schema cinder_upg_part and the vhost the
# suite creates for it. 04-patch-upgrade.yaml moves it to 2026.2, which puts
# it through the expand-migrate-contract machine.
#
# No keystoneEndpoint and no serviceUser, so the API renders auth_strategy =
# noauth and the volume stream of the workload sends the token admin:admin.
#
# One API replica: the rollout is read off updatedReplicas == replicas.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-upg-part
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2026.1"
  api:
    deployment:
      replicas: 1
  database:
    clusterRef:
      name: openstack-db
    database: cinder_upg_part
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: cinder-upg-part-messaging
