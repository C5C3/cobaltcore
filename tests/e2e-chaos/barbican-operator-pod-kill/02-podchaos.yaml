# PodChaos CR to kill a barbican-operator pod in barbican-system.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-barbican-operator
  namespace: barbican-system
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
    - barbican-system
    labelSelectors:
      app.kubernetes.io/name: barbican-operator
  gracePeriod: 0
