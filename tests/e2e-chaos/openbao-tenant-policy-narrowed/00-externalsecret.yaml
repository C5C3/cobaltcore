# The database credential of the suite's Keystone, read through the tenant
# store from the path deploy/kind/infrastructure/keystone-db-externalsecret.yaml
# reads, into a Secret of its own name. The suite takes the store's read on
# that path away and forces a sync. ESO's default deletionPolicy, Retain, keeps
# the Secret when a sync fails, which is what the Keystone keeps running on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: policy-narrowed-db
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tenant-store
    kind: SecretStore
  target:
    name: policy-narrowed-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: openstack/keystone/openstack/standalone/db
        property: username
    - secretKey: password
      remoteRef:
        key: openstack/keystone/openstack/standalone/db
        property: password
