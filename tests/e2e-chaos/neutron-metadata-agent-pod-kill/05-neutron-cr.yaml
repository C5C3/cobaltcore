# Neutron CR for the metadata agent pod-kill chaos test (2026.1 release).
#
# Nova needs a network service in the catalog it can reach: the API resolves
# [neutron] on every request that touches ports, and the metadata API verifies a
# proxied request against the shared secret the metadata agent signs with. The
# workload's servers carry no NIC; meta-chaos-vm of 16-boot-job.yaml carries one
# port on meta-chaos-net, which the chassis binds and the agent serves. The
# operator renders ovn_metadata_enabled = true, so every subnet gets the
# network:distributed port the agent's namespace answers behind.
#
# spec.nova is not set: the fake compute sets vif_plugging_is_fatal = false, so
# no boot waits for the port event Neutron would send.
#
# One API replica and one worker replica: neither serves a request this suite
# makes, so more pods would only lengthen the bring-up on a node that already
# carries five services.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-nova-meta-chaos
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  workers:
    deployment:
      replicas: 1
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: neutron_nova_meta_chaos
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: neutron-nova-meta-chaos-messaging
  ovn:
    centralRef:
      name: nova-meta-chaos-ovn
  keystoneEndpoint: http://keystone-nova-meta-chaos.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  # The workload's verify (../lib/workload.sh --ovn-db-sync) runs this CronJob
  # once in log mode to compare Neutron and the OVN Northbound database after
  # the suite. Suspended, it never runs on its own and OVNDBSyncReady stays True.
  ovnDBSync:
    syncMode: log
    suspend: true
