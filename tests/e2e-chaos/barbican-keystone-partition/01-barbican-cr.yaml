# Barbican CR for the Keystone partition chaos test. Unique name
# (barbican-ks-part) and database (barbican_ks_part) to avoid conflicts
# with other test suites. Managed database via clusterRef to openstack-db,
# cache via clusterRef to openstack-memcached.
#
# keystoneEndpoint points at the Keystone of 00-keystone-cr.yaml, the Keystone
# the partition cuts off, and serviceUser is its bootstrap admin, whose
# password the pre-seeded keystone-admin Secret carries.
#
# The CR sets no extraConfig: the [keystone_authtoken] http_connect_timeout the
# operator renders by default is what the suite proves. One replica with the
# default two uWSGI workers: under the partition a validation holds one worker
# for at most 43.5 seconds, the probe sends its requests one at a time, and the
# workload's token stays validated in Memcached for 300 seconds, so the other
# worker keeps answering the readiness probe.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-ks-part
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: barbican_ks_part
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone-barbican-ks-part.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
