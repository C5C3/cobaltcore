# Chainsaw chaos E2E test for OpenBao pod kill.
# Verifies the Keystone operator detects an OpenBao outage
# (SecretsReady=False) and recovers when OpenBao returns and
# ESO resumes syncing ExternalSecrets.
#
# NOTE: OpenBao runs in the shared-services namespace, not openstack.
# The PodChaos CR targets shared-services via selector.namespaces.
#
# NOTE: The kind/E2E topology runs OpenBao single-replica with file/raft
# storage and Shamir-key sealing (init keys live in Secret
# shared-services/openbao-init-keys, applied at bootstrap by
# hack/deploy-infra.sh::openbao_init_unseal). After PodChaos pod-kill the
# new openbao-0 starts sealed and stays 0/1 Running indefinitely — there is
# no auto-unseal in this topology. Production runs 3-replica HA Raft, where
# the surviving quorum keeps the cluster unsealed; that recovery path does
# not exist with one replica. Step 6 below explicitly re-unseals openbao-0
# via tests/e2e-chaos/unseal-openbao.sh so the test validates the operator-
# side recovery (SecretsReady False -> True) without depending on automatic
# OpenBao recovery the kind topology cannot provide.
#
# Chaos scenario: SC-CHAOS-003
#
# Workload: the token stream of ../lib/workload.sh issues and validates tokens
# against keystone-chaos-bao through the fault. The fault never touches the
# token path, so the budget is zero.
# Chaos matrix: keystone backend pod-kill
# Chaos matrix: openbao self pod-kill
# Chaos random: none (a killed OpenBao starts sealed on kind and needs unseal-openbao.sh)
# Chaos budget: failures=0 recovery=0s
# Chaos budget measured: 2026-10-14, kind, failures 0/0/0, recovery 0/0/0 s
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keystone-openbao-pod-kill
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply Keystone CR ──────────────────────────────────────────
  - try:
    - apply:
        file: 00-keystone-cr.yaml
  # ── Step 2: Assert baseline Ready=True before chaos injection ──────────
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-chaos-bao
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "True"
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - script:
        timeout: 6m
        content: ../lib/workload.sh start openbao-pod-kill -- --streams token --keystone http://keystone-chaos-bao.openstack.svc:5000/v3
    catch:
    - script:
        content: ../diagnostics.sh baseline keystone-chaos-bao --dep-label=app.kubernetes.io/name=openbao --dep-ns=shared-services
    - &workload-dump
      script:
        timeout: 1m
        content: ../lib/workload.sh dump openbao-pod-kill
    cleanup:
    - script:
        timeout: 1m
        content: ../lib/workload.sh stop openbao-pod-kill
  # ── Step 3: Inject PodChaos to kill OpenBao pod ────────────────────────
  - try:
    - script:
        timeout: 1m
        content: ../lib/workload.sh mark openbao-pod-kill fault-start
    - apply:
        file: 01-podchaos.yaml
    catch:
    - *workload-dump
  # ── Step 4: Assert SecretsReady=False after OpenBao kill ───────────────
  # REVIEWER-DISAGREEMENT: [Reviewer requested adding inline `kubectl get
  # keystone keystone-chaos-bao -n $NAMESPACE -o yaml` here] — diagnostics.sh
  # already collects Keystone CR status (Keystone CR status section) for both
  # baseline and chaos modes, so adding it inline would duplicate the output.
  # The diagnostics matrix table has been corrected to reflect actual coverage.
  # Reviewer: please verify.
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-chaos-bao
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "False"
    catch:
    - script:
        content: ../diagnostics.sh chaos keystone-chaos-bao --dep-label=app.kubernetes.io/name=openbao --dep-ns=shared-services --log-label=app.kubernetes.io/name=keystone-operator --eso
    - *workload-dump
  # ── Step 5: Delete PodChaos to lift fault ──────────────────────────────
  - try:
    - delete:
        ref:
          apiVersion: chaos-mesh.org/v1alpha1
          kind: PodChaos
          name: kill-openbao
    - script:
        timeout: 1m
        content: ../lib/workload.sh mark openbao-pod-kill fault-end
    catch:
    - *workload-dump
  # ── Step 6: Re-unseal openbao-0 (kind single-replica recovery) ─────────
  # See header comment for why this step exists. The helper is idempotent:
  # if openbao-0 happens to come back unsealed (it will not, in this
  # topology, but the script handles the case), it exits 0 without acting.
  - try:
    - script:
        timeout: 180s
        content: ../unseal-openbao.sh
    catch:
    - script:
        content: ../diagnostics.sh chaos keystone-chaos-bao --dep-label=app.kubernetes.io/name=openbao --dep-ns=shared-services --log-label=app.kubernetes.io/name=keystone-operator --eso
    - *workload-dump
  # ── Step 7: Assert full recovery to SecretsReady=True and Ready=True ───
  # REVIEWER-DISAGREEMENT: [Reviewer requested adding inline `kubectl get
  # keystone keystone-chaos-bao -n $NAMESPACE -o yaml` here] — see Step 4
  # comment: diagnostics.sh already collects Keystone CR status uniformly.
  # Reviewer: please verify.
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-chaos-bao
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "True"
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: ../diagnostics.sh chaos keystone-chaos-bao --dep-label=app.kubernetes.io/name=openbao --dep-ns=shared-services --log-label=app.kubernetes.io/name=keystone-operator --eso
    - *workload-dump
  # ── Step 8: Judge the workload against the budget ──────────────────────
  - try:
    - script:
        timeout: 15m
        content: ../lib/workload.sh verify openbao-pod-kill
    catch:
    - *workload-dump
