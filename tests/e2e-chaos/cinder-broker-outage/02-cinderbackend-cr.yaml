# The one NFS backend the cinder-broker-chaos CR serves.
#
# A Cinder without an attached backend reports VolumeServicesReady=False under
# reason NoBackends and never reaches Ready, so the baseline needs one. It is
# also what gives the partition a second bus consumer to sever: the volume
# service takes its readiness off the broker exactly as the scheduler does.
#
# The export is the kind-only NFS server (deploy/kind/nfs/nfs-server.yaml),
# whose /volumes directory is pre-created 42424:42424 with mode 0770, so the
# cinder-volume pod writes into it under its own uid.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: broker-chaos-nfs1
  namespace: openstack
spec:
  cinderRef:
    name: cinder-broker-chaos
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /volumes
