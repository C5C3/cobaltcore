# Cinder CR for the broker partition chaos test.
#
# Managed messaging: messaging.clusterRef points at the RabbitmqCluster of
# 00-rabbitmqcluster.yaml, so the operator reads that cluster's
# status.defaultUser.secretReference and builds the transport URL from the
# credentials and the endpoint in it. That is the mode the fault is about, and
# it is why this suite takes no vhost from ../../e2e/cinder/broker-vhost.sh:
# managed mode always lands on the default vhost (BuildTransportURL renders the
# path as "/"), and this broker carries one deployment, so there is nothing to
# keep apart.
#
# Everything else is managed too: the schema cinder_broker_chaos on the
# openstack-db MariaDB cluster, the openstack-memcached cache and the
# ESO-synced cinder-db credentials.
#
# No keystoneEndpoint and no serviceUser: the two are set together or not at
# all (the pairing CEL rule on CinderSpec), and leaving both out renders
# auth_strategy = noauth, which is how the storage path is exercised on a
# cluster that runs no identity service.
#
# One API replica: the suite asserts what an unreachable broker does to the
# API, and a second replica would only lengthen the bring-up and make the
# per-pod readiness reads below ambiguous.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-broker-chaos
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  api:
    deployment:
      replicas: 1
  database:
    clusterRef:
      name: openstack-db
    database: cinder_broker_chaos
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: cinder-chaos-rabbitmq
