# Chainsaw configuration for the multi-node OVN overlay suites.
#
# The suites live outside tests/e2e/ because each needs two schedulable nodes.
# Every suite under tests/e2e/ runs against the single-node hack/kind-config.yaml
# cluster that `make e2e` sweeps, where neither question has an answer:
#   - default-spread checks where the replicas of an OVNCentral that names no
#     spread land on two workers without a zone label: northd two on each, the
#     Northbound members on both. On one node every pod lands on that node.
#   - geneve-datapath programs one logical switch port on each worker and pings
#     across the Geneve tunnel between them. On one node the second port would
#     land beside the first and the tunnel would never carry a packet.
#
# Key differences from the happy-path config at tests/e2e/chainsaw-config.yaml:
#   - Assert timeout: 300s (5m) vs 120s: the OVNCentral, the two chassis
#     DaemonSets and the chassis registration on both workers happen in
#     sequence before the first datapath assertion can run, and the spread
#     suite's northd Deployment exists only once a three-member Northbound
#     cluster has formed.
#   - Cleanup timeout: 120s (2m) vs 3m: the teardown deletes probe Pods, two
#     network namespaces, two OVS ports and one logical switch. No finalizer
#     waits on a database behind it, so it needs less than the happy path.
#   - Parallelism: 1 vs 4: the probe Pods run with hostNetwork and own
#     /run/openvswitch and /run/netns on both workers, and there is one
#     `openstack` namespace to put them in. The spread suite also loads one
#     worker with a ballast Pod for its whole run, which would steer the pods
#     of any suite running beside it.
#
# apiVersion v1alpha2 Configuration is the correct pairing with v1alpha1 Test
# manifests, matching the sibling configs.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: cloud-operator-e2e-ovn-overlay
spec:
  # ── Timeouts ────────────────────────────────────────────────────────────
  timeouts:
    apply: 30s
    assert: 300s
    cleanup: 120s
    delete: 30s
    error: 30s
    exec: 30s

  # ── Cleanup ─────────────────────────────────────────────────────────────
  cleanup:
    skipDelete: false

  # ── Execution ───────────────────────────────────────────────────────────
  execution:
    failFast: true
    parallel: 1

  # ── Report ──────────────────────────────────────────────────────────────
  report:
    format: JUNIT-TEST
    name: chainsaw-ovn-overlay-report
    path: _output/reports
