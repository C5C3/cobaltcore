# OVNCentral fixture for the fabric-advertised-route E2E test.
#
# The control plane is scaffolding for the dynamic routing under test, so it
# runs one Raft member per database and one northd replica, as the
# geneve-datapath fixture does. The backup is suspended: a snapshot of the two
# test routers proves nothing this suite is about. The databases stay
# unpublished: the chassis reaches the Southbound database over its ClusterIP,
# and the client Pod reaches both the same way.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn-fabric-central
  namespace: openstack
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca-issuer
  northbound:
    replicas: 1
  southbound:
    replicas: 1
  northd:
    deployment:
      replicas: 1
  backup:
    suspend: true
