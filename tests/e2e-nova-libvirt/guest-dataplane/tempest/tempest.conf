# Tempest configuration of the libvirt guest suite (step 11 of
# ../chainsaw-test.yaml). It targets the nova-pool stack the suite brings up
# on the one kind node: nova-pool on the libvirt driver under TCG,
# cinder-nova-pool on NFS, and the Glance, Neutron and Placement beside them,
# behind the keystone-nova-pool identity service. hack/ci-run-tempest.sh
# renders admin_password from the keystone-admin Secret.

[DEFAULT]
# Tempest's own log stays in the container, as on the nova Tempest suites.
log_dir = /tmp/tempest-logs
log_file = tempest.log

[identity]
# The runner forwards keystone-nova-pool to localhost:5000 and renders this
# URL to that address.
uri_v3 = http://keystone-nova-pool.openstack.svc.cluster.local:5000/v3
# Every endpoint of the two catalog Jobs lands in RegionOne.
region = RegionOne

[identity-feature-enabled]
# Identity v3 only, as on the nova Tempest suites.
api_v3 = true

[auth]
# One project per test class, each with a network of its own, since every
# server the scenarios boot gets a port.
use_dynamic_credentials = true
create_isolated_networks = true
admin_username = admin
admin_password = ${KEYSTONE_ADMIN_PASSWORD}
admin_project_name = admin
admin_domain_name = Default

[compute]
# The cirros image 04-image-seed-job.yaml seeds and the flavor m1.guest step 5
# creates; step 10 keeps both.
image_ref = 4e0a0000-0000-4000-8000-000000000010
image_ref_alt = 4e0a0000-0000-4000-8000-000000000010
flavor_ref = 4e0a7e57-0000-4000-8000-0000000000c1
flavor_ref_alt = 4e0a7e57-0000-4000-8000-0000000000c1
# The one libvirt node of the suite.
min_compute_nodes = 1
# A boot under TCG on a busy runner takes minutes, not seconds.
build_timeout = 600
region = RegionOne

[compute-feature-enabled]
# test_server_sequence_suspend_resume runs on this flag.
suspend = true
# The scenarios would ask for a config drive, and the suite does not prove
# that nova-compute can build one.
config_drive = false
# The metadata agent of 05-neutronmetadataagent-cr.yaml serves the guests.
metadata_service = true

[validation]
# No floating IP reaches a guest from the runner, so nothing logs in.
run_validation = false

[network]
# The CIDR the dynamic-credential projects carve their networks out of, as on
# the nova Tempest suites.
project_network_cidr = 10.110.0.0/16
project_network_mask_bits = 24
region = RegionOne

[network-feature-enabled]
# No provider network exists on a kind node.
floating_ips = false

[volume]
# The block-storage row of 01-catalog-extras-job.yaml.
catalog_type = block-storage
region = RegionOne
# The one CinderBackend of 02-cinderbackend-cr.yaml.
backend_names = nfs1
storage_protocol = nfs
# TestServerVolumeAttachScenarioOldVersion needs 3.27 or later.
max_microversion = latest
volume_size = 1
build_timeout = 600

[image]
# The image row of the pool's catalog Job.
region = RegionOne

[placement]
# The placement row of the pool's catalog Job.
region = RegionOne

[service_available]
# The services of the nova-pool stack, and nothing else.
nova = true
neutron = true
glance = true
cinder = true
placement = true
swift = false
barbican = false
horizon = false
