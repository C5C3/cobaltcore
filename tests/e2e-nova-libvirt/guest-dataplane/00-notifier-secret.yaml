# The password of neutron-nova, the Keystone account neutron-nova-pool posts
# its port-status notifications to nova-pool as. 01-catalog-extras-job.yaml
# creates the account with it, and step 2 patches spec.nova of the Neutron to
# name this Secret. Without the notifications nova-compute waits for a
# network-vif-plugged event that never comes, and the boot of a server with a
# NIC fails once vif_plugging_timeout runs out.
apiVersion: v1
kind: Secret
metadata:
  name: nova-pool-neutron-notifier
  namespace: openstack
type: Opaque
stringData:
  password: e2e-nova-pool-neutron-notifier-0
