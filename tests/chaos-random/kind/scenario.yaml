# The dizzy scenario of the random chaos runs on kind (#1395):
# deploy/lab/metal-stack/dizzy-soak/scenario.yaml with three departures:
#   - name: ci-random;
#   - image: chaos-random and flavor: chaos-random, the public image and
#     flavor seed-job.yaml creates; the kind plane has neither the lab's
#     cirros-kvm nor hvo-smoke-test.
# Every other value is the lab scenario's, which takes it from dizzy's mix
# small profile. hack/chaos-random.sh run on ci passes it as DIZZY_SCENARIO
# and DIZZY_SOAK_DURATION, which reaches dizzy as --duration and takes
# precedence over chaos.duration.
name: ci-random
seed: 42                        # deterministic; same seed => same plan

# image and flavor are referenced by name, are shared by every persona, and must
# already exist on the target cloud: dizzy uploads no image and creates no
# flavor.
image: chaos-random
flavor: chaos-random

services: []                    # opt-in services bound to every persona; this build supports none

resources:
  servers: 6                    # the server envelope the personas divide by their shares

personas:
  ci:                                         # short-lived servers on one network each, no lifecycle operation
    share: 0.5                                # share of resources.servers
    cloud: ""                                 # clouds.yaml entry of the persona's project; "" uses --os-cloud
    networks: 2                               # networks the persona's servers are spread over
    volumes_per_server: { min: 0, max: 1 }    # data volumes attached per server
    volume_gib:         { min: 1, max: 2 }    # size drawn per data volume
    interval:           { min: 100ms, max: 1s }  # random delay drawn per churn tick
    churn_ratio: 0.5                          # create bias at steady state (0..1)
    target_fill: 0.6                          # fraction of the persona's envelope kept populated (0..1)
  gardener:                                   # Kubernetes clusters: workers in an anti-affinity server group, replaced one at a time
    share: 0.3                                # share of resources.servers
    cloud: ""                                 # clouds.yaml entry of the persona's project; "" uses --os-cloud
    clusters: 1                               # clusters the workers are spread over, each with its own network and server group
    policy: soft-anti-affinity                # or anti-affinity, which needs a compute host per worker of a cluster
    volume_gib:         { min: 1, max: 2 }    # size drawn for the one data volume of each worker
    interval:           { min: 10s, max: 1m } # random delay drawn per tick of the persona's engine
  legacy:                                     # long-lived servers changed in place until teardown
    share: 0.2                                # share of resources.servers
    cloud: ""                                 # clouds.yaml entry of the persona's project; "" uses --os-cloud
    networks: 1                               # networks the persona's servers are spread over
    resize_flavor: ""                         # second flavor the servers alternate with; "" disables resize
    cold_migration: false                     # false disables cold migration; live migration stays on
    volumes_per_server: { min: 1, max: 2 }    # data volumes per server, detached and re-attached
    volume_gib:         { min: 1, max: 2 }    # size drawn per data volume
    ports_per_server:   { min: 0, max: 1 }    # extra ports per server, detached and re-attached
    interval:           { min: 10s, max: 1m } # random delay drawn per tick of the persona's engine

# A lane shares the quota of any persona that authenticates against its project.
lanes:                                                    # single-service churn next to the personas; off by default
  cinder:   { enabled: false, cloud: "", profile: small }  # volumes and snapshots; volume_type: "" uses the default type
  glance:   { enabled: false, cloud: "", profile: small }  # image upload and lifecycle
  keystone: { enabled: false, cloud: "", profile: small }  # projects, users, assignments; needs admin or a domain manager
  neutron:  { enabled: false, cloud: "", profile: small }  # networks, routers, ports, floating IPs

chaos:
  duration: 6h                         # total runtime; the only hard stop besides a stop of the soak
  parallel: { max: 4 }                 # per-tick fan-out of each persona, drawn in [1, max]; capped by --concurrency

# Sized to fit the default quotas of the soak's project dizzy-soak: Nova's 10
# instances, 10 server groups and 10 members per group, and the defaults of
# Neutron and Cinder. A larger scenario, such as one with
# --set resources.servers=20, needs those quotas raised by hand.
