# The metadata agent of the random chaos plane on kind (#1395), a copy of
# tests/e2e/c5c3/full-controlplane-keystone/05-neutronmetadataagent-cr.yaml
# with every controlplane-keystone name turned into controlplane. It runs on
# the chassis of ovnchassis.yaml and reads the shared secret the ControlPlane
# generates for its Nova.
---
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: controlplane-agent
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2026.1"
  chassisRef:
    name: controlplane-chassis
  novaMetadata:
    host: controlplane-nova-metadata.openstack.svc.cluster.local
    port: 8775
    protocol: http
    sharedSecretRef:
      name: controlplane-nova-metadata-secret
