# The OVN chassis of the random chaos plane on kind (#1395), a copy of
# tests/e2e/c5c3/full-controlplane-keystone/04-ovnchassis-cr.yaml with every
# controlplane-keystone name turned into controlplane. It lands on the node
# hack/chaos-random.sh up labels openstack.c5c3.io/chassis=true.
---
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: controlplane-chassis
  namespace: openstack
spec:
  centralRef:
    name: controlplane-ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
