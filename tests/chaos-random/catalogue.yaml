# The fault catalogue of the random chaos runs (#1395): one entry per distinct
# fault of the chaos suites, keyed by fault. tests/chaos-random/draw.py draws
# from it and renders the drawn entries as one Chaos Mesh Workflow, which
# hack/chaos-random.sh applies under dizzy load (see the section Random runs
# of docs/reference/testing/chaos-e2e-tests.md).
#
# Every entry holds:
#   name          ^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$, unique
#   kind          PodChaos or NetworkChaos
#   environments  where the runner may draw it: ci, lab or both
#   duration      the template deadline, how long the fault holds: 30s for a
#                 pod-kill, 120s for a pod-failure, partition or delay
#   recovery      the bound after the lift within which the plane recovers:
#                 the # Chaos budget: recovery of the suites that name the
#                 entry, the largest of them, and 60s at least; an entry of a
#                 lab fault takes the bound of that fault's gate
#   source        only on an entry no suite names: the lab fault it stands for
#   spec          the Chaos Mesh spec without duration
#
# @CP@ and @NS@ stand for the ControlPlane's name and namespace. A projected
# child is named <cp>-<service>, so its pods carry the instance label
# @CP@-<service>; the shared infrastructure and the platform carry the same
# labels on kind and on the lab. hack/chaos-random.sh preflight proves that
# every entry of the environment selects a pod.
#
# Every suite header under tests/e2e-chaos/ names the entries of its faults in
# `# Chaos random: <entry>` lines, or carries one
# `# Chaos random: none (<reason>)` line. No NetworkChaos selects a hostNetwork
# workload (libvirt, novacompute, ovnchassis, neutronmetadataagent,
# migration-port-reservation). tests/unit/ci/chaos_random_catalogue_test.sh
# checks all of it.

