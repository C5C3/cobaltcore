# Default secret store for the placed-services E2E test, in managed mode.
#
# The store carries no targetClusterRef of its own: it resolves the cluster its
# parent Barbican names, so its credentials Secret lands next to that Barbican's
# workload. instanceRef points at the proving OpenBaoCluster on the target
# (deploy/kind/infrastructure/openbao-instance.yaml), which the operator reaches
# over a pods/portforward tunnel through the registered kubeconfig — the service
# proxy cannot carry the instance's own TLS handshake.
#
# isDefault is what makes the parent Barbican reach Ready: without a
# credential-ready default store it reports SecretStoresReady=False with reason
# NoDefaultSecretStore.
# region barbican-store
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-mc-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-mc
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
# endregion barbican-store
