!
! One fabric peer of the frr-k8s fabric peering suite: the node-facing part
! of tests/lab/bgp-fabric/leaf1/frr.conf, in the default VRF and without EVPN
! and OSPF. peer.sh replaces @HOSTNAME@ and @ROUTER_ID@. The peer sends the
! node a default route per family and accepts only the node's host routes.
! 198.18.0.0/15 and 2001:db8:ffff::/48 are the baits: routes the node's
! inbound filter has to drop.
frr defaults datacenter
hostname @HOSTNAME@
log stdout
!
bfd
 profile fabric
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
ip route 198.18.0.0/15 blackhole
ipv6 route 2001:db8:ffff::/48 blackhole
!
router bgp 65000
 bgp router-id @ROUTER_ID@
 no bgp ebgp-requires-policy
 neighbor nodes peer-group
 neighbor nodes remote-as external
 neighbor nodes bfd profile fabric
 neighbor eth1 interface peer-group nodes
 !
 address-family ipv4 unicast
  redistribute static
  neighbor nodes activate
  neighbor nodes default-originate
  neighbor nodes prefix-list NODES-IN-V4 in
  neighbor nodes maximum-prefix 8192
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute static
  neighbor nodes activate
  neighbor nodes default-originate
  neighbor nodes prefix-list NODES-IN-V6 in
  neighbor nodes maximum-prefix 8192
 exit-address-family
exit
!
ip prefix-list NODES-IN-V4 seq 10 permit 192.0.2.0/25 ge 32
ip prefix-list NODES-IN-V4 seq 20 permit 198.51.100.0/24 ge 32
ip prefix-list NODES-IN-V4 seq 100 deny any
ipv6 prefix-list NODES-IN-V6 seq 10 permit 2001:db8::/64 ge 128
ipv6 prefix-list NODES-IN-V6 seq 100 deny any
