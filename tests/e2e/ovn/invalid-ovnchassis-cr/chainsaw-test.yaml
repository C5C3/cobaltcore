# Chainsaw E2E tests for OVNChassis CRD + webhook validation rejection.
# Pins every implemented kubebuilder-marker and webhook.validate() rejection
# path in operators/ovn/api/v1alpha1/ovnchassis_* to a deterministic admission
# failure. Each step applies an otherwise-valid OVNChassis CR with a single
# aspect violating the rule under test, captures the admission $error, and
# asserts the field path plus message substring.
#
# The API server validates against the structural schema and its CEL rules
# before it calls the validating webhook, so a rule carried by both layers is
# answered by the schema and the assertions below quote the schema message. The
# webhook message is asserted only where the rule has no schema counterpart:
# the duplicate bridge (the +listMapKey covers the network side only), the two
# three maxUnavailable shapes (an int-or-string field carries no marker), the
# metadata.name bound, which comes from the name of a child object, and the
# thirteen spec.fabric rules of validateFabric, each of which compares two
# fields or reads a value as an address or a prefix.
#
# The test runs in an ephemeral namespace: the fixtures reference an OVNCentral
# that does not exist there, which admission deliberately tolerates (GitOps
# ordering), so the dangling reference never competes with the rule a fixture
# pins.
#
# All fixtures are generated from the single canonical scaffold in
# `_generate.py`. After editing the scaffold or any per-fixture override,
# regenerate via:
#   python3 tests/e2e/ovn/invalid-ovnchassis-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes
# `_generate.py --check` (drift mode, both directions incl. orphans) and
# `test_generate.py` (FIXTURES count + chainsaw-test.yaml cross-reference)
# so any hand-edit to a generated fixture fails the build before the
# cluster-bound e2e-operator job runs.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ovn-invalid-ovnchassis-cr
spec:
  steps:
  # spec.centralRef.name empty must be rejected by the MinLength=1 marker on
  # OVNCentralRef, which answers before the webhook's field.Required twin.
  - try:
    - apply:
        file: 00-centralref-name-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'centralRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.nodeSelector empty must be rejected by the MinProperties=1 marker: an
  # empty selector matches every node rather than none.
  - try:
    - apply:
        file: 01-nodeselector-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'nodeSelector')): true
            (contains($error, 'should have at least 1 properties')): true
  # spec.gateway.nodeSelector empty must be rejected by the same marker on
  # OVNGatewaySpec: it would promote every selected node to a gateway.
  - try:
    - apply:
        file: 02-gateway-nodeselector-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'gateway.nodeSelector')): true
            (contains($error, 'should have at least 1 properties')): true
  # A bridgeMappings physicalNetwork outside the CRD pattern must be rejected:
  # the grammar is the DNS-1123 label a Neutron network name is bounded to.
  - try:
    - apply:
        file: 03-bridgemappings-physicalnetwork-pattern.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'bridgeMappings[0].physicalNetwork')): true
            (contains($error, 'should match')): true
  # A bridgeMappings bridge past 15 characters must be rejected by the CRD
  # pattern: the kernel's IFNAMSIZ leaves 15 usable bytes for an interface name.
  - try:
    - apply:
        file: 04-bridgemappings-bridge-pattern.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'bridgeMappings[0].bridge')): true
            (contains($error, 'should match')): true
  # Two bridgeMappings entries sharing one bridge must be rejected by the
  # validating webhook: the +listMapKey covers the physicalNetwork side only,
  # and a repeated bridge silently shadows the first entry.
  - try:
    - apply:
        file: 05-bridgemappings-duplicate-bridge.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'bridgeMappings[1].bridge')): true
            (contains($error, 'Duplicate value')): true
  # spec.encapType outside the CRD enum must be rejected: geneve and vxlan are
  # the only two tunnel protocols the chassis are configured for.
  - try:
    - apply:
        file: 06-encaptype-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'encapType')): true
            (contains($error, 'Unsupported value')): true
  # spec.updateStrategy.maxUnavailable paired with OnDelete must be rejected by
  # the validating webhook: nothing reads it under that type.
  - try:
    - apply:
        file: 07-updatestrategy-maxunavailable-with-ondelete.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'updateStrategy.maxUnavailable')): true
            (contains($error, 'maxUnavailable applies to RollingUpdate only')): true
  # spec.updateStrategy.maxUnavailable of 0 must be rejected by the validating
  # webhook: it stalls the rollout instead of pacing it.
  - try:
    - apply:
        file: 08-updatestrategy-maxunavailable-zero.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'updateStrategy.maxUnavailable')): true
            (contains($error, 'maxUnavailable must resolve to at least 1 for RollingUpdate')): true
  # The percentage form wedges the rollout the same way, so the webhook resolves
  # the value before it judges it and rejects "0%" under the same message.
  - try:
    - apply:
        file: 12-updatestrategy-maxunavailable-zero-percent.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'updateStrategy.maxUnavailable')): true
            (contains($error, 'maxUnavailable must resolve to at least 1 for RollingUpdate')): true
  # A negative spec.remoteProbeIntervalMs must be rejected by the Minimum=0
  # marker: zero already means no probe at all.
  - try:
    - apply:
        file: 09-remoteprobeinterval-negative.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'remoteProbeIntervalMs')): true
            (contains($error, 'should be greater than or equal to 0')): true
  # A metadata.name past 42 characters must be rejected by the validating
  # webhook: the per-node {name}-chassis-del-{8 hex} Job would exceed the
  # 63-character cap on an object name, so the CR would admit cleanly and then
  # fail the deletion of every chassis registration it leaves behind.
  - try:
    - apply:
        file: 10-name-too-long.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'metadata.name')): true
            (contains($error, 'name must be at most 42 characters')): true
  # spec.targetClusterRef.name empty must be rejected by the MinLength=1 marker
  # on the shared TargetClusterRefSpec, which answers before the webhook twin.
  - try:
    - apply:
        file: 11-targetclusterref-empty-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'targetClusterRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.jobs.priorityClassName naming a missing PriorityClass must be rejected as
  # Not found; without the operator's get grant on priorityclasses it would answer
  # Internal error instead.
  - try:
    - apply:
        file: 13-jobs-priorityclass-not-found.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.jobs.priorityClassName')): true
            (contains($error, 'Not found')): true
  # spec.ovs.revalidatorThreads below one must be rejected by the Minimum=1 marker,
  # which answers before the webhook twin.
  - try:
    - apply:
        file: 14-ovs-revalidatorthreads-zero.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.ovs.revalidatorThreads')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # A foreign spec.verticalAutoscaling.minAllowed key must be rejected by the
  # CEL rule on VerticalAutoscalingSpec.
  - try:
    - apply:
        file: 15-vertical-autoscaling-foreign-resource.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.verticalAutoscaling')): true
            (contains($error, 'minAllowed may only name cpu and memory')): true
  # spec.verticalAutoscaling.minAllowed above maxAllowed must be rejected by the
  # validating webhook (webhook-only).
  - try:
    - apply:
        file: 16-vertical-autoscaling-min-above-max.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.verticalAutoscaling.minAllowed[cpu]')): true
            (contains($error, 'must not exceed maxAllowed')): true
  # spec.verticalAutoscaling.updateMode outside the enum must be rejected by the
  # Enum marker.
  - try:
    - apply:
        file: 17-vertical-autoscaling-update-mode.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.verticalAutoscaling.updateMode')): true
            (contains($error, 'Unsupported value')): true
  # spec.verticalAutoscaling.minReplicas: 0 must be rejected by the Minimum=1
  # marker.
  - try:
    - apply:
        file: 18-vertical-autoscaling-min-replicas-zero.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.verticalAutoscaling.minReplicas')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # spec.fabric.uplinks empty must be rejected by the MinItems=1 marker.
  - try:
    - apply:
        file: 19-fabric-uplinks-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks')): true
            (contains($error, 'should have at least 1 items')): true
  # Five fabric uplinks must be rejected by the MaxItems=4 marker.
  - try:
    - apply:
        file: 20-fabric-uplinks-too-many.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks')): true
            (contains($error, 'must have at most 4 items')): true
  # A fabric uplink interface past 15 characters must be rejected by the
  # CRD pattern.
  - try:
    - apply:
        file: 21-fabric-uplink-interface-pattern.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks[0].interface')): true
            (contains($error, 'should match')): true
  # A fabric peer bridge past 15 characters must be rejected by the CRD
  # pattern.
  - try:
    - apply:
        file: 22-fabric-uplink-bridge-pattern.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks[0].bridge')): true
            (contains($error, 'should match')): true
  # Two fabric uplinks naming one interface must be rejected by the
  # list-map key of the schema.
  - try:
    - apply:
        file: 23-fabric-uplink-duplicate-interface.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks[1]')): true
            (contains($error, 'Duplicate value')): true
  # Two fabric uplinks sharing one bridge must be rejected by the webhook:
  # the list-map key covers the interface side only.
  - try:
    - apply:
        file: 24-fabric-uplink-duplicate-bridge.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks[1].bridge')): true
            (contains($error, 'Duplicate value')): true
  # A fabric peer bridge named after an uplink interface must be rejected
  # by the webhook.
  - try:
    - apply:
        file: 25-fabric-uplink-bridge-is-interface.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks[1].bridge')): true
            (contains($error, 'a peer bridge cannot carry the name of an uplink interface')): true
  # A fabric peer bridge named br-int must be rejected by the webhook.
  - try:
    - apply:
        file: 26-fabric-uplink-bridge-br-int.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks[0].bridge')): true
            (contains($error, 'br-int is the integration bridge of ovn-controller')): true
  # A fabric VRF name past 15 characters must be rejected by the CRD
  # pattern.
  - try:
    - apply:
        file: 27-fabric-vrf-name-pattern.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.vrf.name')): true
            (contains($error, 'should match')): true
  # A fabric VRF name with the ovnvrf prefix must be rejected by the
  # webhook.
  - try:
    - apply:
        file: 28-fabric-vrf-name-ovnvrf-prefix.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.vrf.name')): true
            (contains($error, 'the prefix ovnvrf is reserved for the VRFs ovn-controller maintains')): true
  # A fabric VRF name an uplink interface carries must be rejected by the
  # webhook, on the interface.
  - try:
    - apply:
        file: 29-fabric-vrf-name-taken-by-uplink.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks[0].interface')): true
            (contains($error, 'the name is taken by the fabric VRF device')): true
  # A fabric VRF table of 0 must be rejected by the Minimum=1 marker.
  - try:
    - apply:
        file: 30-fabric-vrf-table-zero.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.vrf.table')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # The kernel's main table as the fabric VRF table must be rejected by
  # the webhook.
  - try:
    - apply:
        file: 31-fabric-vrf-table-kernel.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.vrf.table')): true
            (contains($error, 'default, main and local tables')): true
  # A fabric VRF table equal to a listed VRF id must be rejected by the
  # webhook.
  - try:
    - apply:
        file: 32-fabric-vrf-table-is-ovn-vrf-id.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.vrf.table')): true
            (contains($error, 'ovn-controller uses a VRF id as the table of ovnvrf<id>')): true
  # A fabric MTU of 1279 must be rejected by the Minimum=1280 marker.
  - try:
    - apply:
        file: 33-fabric-mtu-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.mtu')): true
            (contains($error, 'should be greater than or equal to 1280')): true
  # A node ASN below the private 4-byte range must be rejected by the
  # Minimum marker.
  - try:
    - apply:
        file: 34-fabric-node-asn-below-range.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.nodes[0].asn')): true
            (contains($error, 'should be greater than or equal to 4200000000')): true
  # A node ASN of 4294967295 must be rejected by the Maximum marker.
  - try:
    - apply:
        file: 35-fabric-node-asn-above-range.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.nodes[0].asn')): true
            (contains($error, 'should be less than or equal to 4294967294')): true
  # Two node rows sharing one ASN must be rejected by the webhook.
  - try:
    - apply:
        file: 36-fabric-node-duplicate-asn.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.nodes[1].asn')): true
            (contains($error, 'Duplicate value')): true
  # A node IPv4 loopback that is no IPv4 address must be rejected by the
  # Format=ipv4 marker.
  - try:
    - apply:
        file: 37-fabric-node-loopback-ipv4-format.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.nodes[0].loopbackIPv4')): true
            (contains($error, 'must be of type ipv4')): true
  # A node IPv6 loopback that is no IPv6 address must be rejected by the
  # Format=ipv6 marker.
  - try:
    - apply:
        file: 38-fabric-node-loopback-ipv6-format.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.nodes[0].loopbackIPv6')): true
            (contains($error, 'must be of type ipv6')): true
  # Two node rows sharing one IPv4 loopback must be rejected by the
  # webhook.
  - try:
    - apply:
        file: 39-fabric-node-duplicate-loopback.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.nodes[1].loopbackIPv4')): true
            (contains($error, 'Duplicate value')): true
  # An announceable range that is no CIDR must be rejected by the
  # Format=cidr marker.
  - try:
    - apply:
        file: 40-fabric-announceable-range-format.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.announceableRanges[0]')): true
            (contains($error, 'must be of type cidr')): true
  # An announceable range with host bits must be rejected by the webhook,
  # which names the masked network.
  - try:
    - apply:
        file: 41-fabric-announceable-range-host-bits.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.announceableRanges[0]')): true
            (contains($error, 'must be a network address; did you mean 198.51.100.0/24')): true
  # Advertised VRF ids without an announceable range must be rejected by
  # the webhook.
  - try:
    - apply:
        file: 42-fabric-advertise-without-ranges.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.announceableRanges')): true
            (contains($error, 'advertiseVRFIDs needs at least one announceable range')): true
  # An advertised VRF id of 0 must be rejected by the Minimum=1 marker.
  - try:
    - apply:
        file: 43-fabric-vrf-id-zero.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.advertiseVRFIDs[0]')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # A VRF id both advertised and learned must be rejected by the webhook.
  - try:
    - apply:
        file: 44-fabric-vrf-id-advertised-and-learned.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.learnVRFIDs[1]')): true
            (contains($error, 'a VRF id is either advertised from or learned into, not both')): true
  # A BFD receive interval of 9 must be rejected by the Minimum=10 marker.
  - try:
    - apply:
        file: 45-fabric-bfd-interval-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.bfd.receiveIntervalMs')): true
            (contains($error, 'should be greater than or equal to 10')): true
  # A BFD detect multiplier of 1 must be rejected by the Minimum=2 marker.
  - try:
    - apply:
        file: 46-fabric-bfd-multiplier-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.bfd.detectMultiplier')): true
            (contains($error, 'should be greater than or equal to 2')): true
  # Two node rows naming one node must be rejected by the list-map key of
  # the schema.
  - try:
    - apply:
        file: 47-fabric-node-duplicate-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.nodes[1]')): true
            (contains($error, 'Duplicate value')): true
  # An uplink bridge named after the fabric VRF must be rejected by the
  # validating webhook.
  - try:
    - apply:
        file: 48-fabric-uplink-bridge-is-vrf.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.fabric.uplinks[0].bridge')): true
            (contains($error, 'the name is taken by the fabric VRF device')): true
