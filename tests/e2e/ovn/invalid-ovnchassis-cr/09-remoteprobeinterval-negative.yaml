# spec.remoteProbeIntervalMs below the CRD Minimum=0 marker. Zero already
# means no probe at all, so a negative value names no behaviour
# ovn-controller has.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  remoteProbeIntervalMs: -1
