# A spec.fabric.announceableRanges entry with host bits set passes the
# cidr format and is rejected by the validating webhook alone, which
# names the network address the range masks to.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  fabric:
    uplinks:
    - interface: fab1
      bridge: br-fab1
    - interface: fab2
      bridge: br-fab2
    nodes:
    - name: node-1
      asn: 4200000001
      loopbackIPv4: 192.0.2.1
      loopbackIPv6: "2001:db8::1"
    announceableRanges:
    - 198.51.100.7/24
    advertiseVRFIDs: [42]
    learnVRFIDs: [10]
