# A spec.fabric.nodes[].loopbackIPv4 that is no IPv4 address violates the
# Format=ipv4 marker.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  fabric:
    uplinks:
    - interface: fab1
      bridge: br-fab1
    - interface: fab2
      bridge: br-fab2
    nodes:
    - name: node-1
      asn: 4200000001
      loopbackIPv4: 192.0.2.256
      loopbackIPv6: "2001:db8::1"
    announceableRanges:
    - 198.51.100.0/24
    - 2001:db8::/64
    advertiseVRFIDs: [42]
    learnVRFIDs: [10]
