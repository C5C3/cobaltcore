# A spec.fabric.uplinks interface of 16 characters violates the CRD
# pattern (^[a-zA-Z0-9_.-]{1,15}$): the kernel's IFNAMSIZ leaves 15
# usable bytes, so no NIC carries a longer name.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  fabric:
    uplinks:
    - interface: fab-sixteen-char
      bridge: br-fab1
    nodes:
    - name: node-1
      asn: 4200000001
      loopbackIPv4: 192.0.2.1
      loopbackIPv6: "2001:db8::1"
    announceableRanges:
    - 198.51.100.0/24
    - 2001:db8::/64
    advertiseVRFIDs: [42]
    learnVRFIDs: [10]
