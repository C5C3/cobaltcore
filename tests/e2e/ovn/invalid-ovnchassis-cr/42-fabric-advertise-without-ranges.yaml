# spec.fabric.advertiseVRFIDs without an announceable range is rejected
# by the validating webhook alone: the node's outbound prefix lists
# would permit no route OVN advertises.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  fabric:
    uplinks:
    - interface: fab1
      bridge: br-fab1
    - interface: fab2
      bridge: br-fab2
    nodes:
    - name: node-1
      asn: 4200000001
      loopbackIPv4: 192.0.2.1
      loopbackIPv6: "2001:db8::1"
    advertiseVRFIDs: [42]
    learnVRFIDs: [10]
