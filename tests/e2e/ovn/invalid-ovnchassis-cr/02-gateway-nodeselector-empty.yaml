# spec.gateway.nodeSelector empty violates the MinProperties=1 marker on
# OVNGatewaySpec. The gateway selector narrows the set spec.nodeSelector
# already matched, so an empty one promotes every selected node to a
# gateway and spreads the external connectivity onto nodes with no uplink
# to carry it.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  gateway:
    nodeSelector: {}
