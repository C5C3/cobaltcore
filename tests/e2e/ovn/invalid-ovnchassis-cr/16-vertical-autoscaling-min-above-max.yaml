# spec.verticalAutoscaling.minAllowed.cpu above maxAllowed.cpu is rejected by
# the validating webhook alone: CEL cannot compare quantities across two maps.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  verticalAutoscaling:
    updateMode: "Off"
    minAllowed:
      cpu: "2"
    maxAllowed:
      cpu: "1"
