# spec.fabric.uplinks empty violates the MinItems=1 marker. A fabric
# block attaches a node through its uplinks, so a block without one
# has nothing to peer over.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  fabric:
    uplinks: []
    nodes:
    - name: node-1
      asn: 4200000001
      loopbackIPv4: 192.0.2.1
      loopbackIPv6: "2001:db8::1"
    announceableRanges:
    - 198.51.100.0/24
    - 2001:db8::/64
    advertiseVRFIDs: [42]
    learnVRFIDs: [10]
