# Two spec.fabric.nodes rows sharing one ASN are rejected by the
# validating webhook alone: a BGP speaker drops a route whose AS path
# carries its own ASN, so the two nodes would drop each other's routes.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  fabric:
    uplinks:
    - interface: fab1
      bridge: br-fab1
    - interface: fab2
      bridge: br-fab2
    nodes:
    - name: node-1
      asn: 4200000001
      loopbackIPv4: 192.0.2.1
      loopbackIPv6: "2001:db8::1"
    - name: node-2
      asn: 4200000001
      loopbackIPv4: 192.0.2.2
      loopbackIPv6: "2001:db8::2"
    announceableRanges:
    - 198.51.100.0/24
    - 2001:db8::/64
    advertiseVRFIDs: [42]
    learnVRFIDs: [10]
