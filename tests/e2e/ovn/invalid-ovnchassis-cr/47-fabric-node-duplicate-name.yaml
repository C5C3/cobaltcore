# Two spec.fabric.nodes rows naming one node are rejected by the schema:
# name is the +listMapKey of the list, so the API server answers before
# the webhook is called.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  fabric:
    uplinks:
    - interface: fab1
      bridge: br-fab1
    - interface: fab2
      bridge: br-fab2
    nodes:
    - name: node-1
      asn: 4200000001
      loopbackIPv4: 192.0.2.1
      loopbackIPv6: "2001:db8::1"
    - name: node-1
      asn: 4200000002
      loopbackIPv4: 192.0.2.2
      loopbackIPv6: "2001:db8::2"
    announceableRanges:
    - 198.51.100.0/24
    - 2001:db8::/64
    advertiseVRFIDs: [42]
    learnVRFIDs: [10]
