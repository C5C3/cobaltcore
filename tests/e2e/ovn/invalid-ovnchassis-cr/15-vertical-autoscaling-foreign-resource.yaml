# spec.verticalAutoscaling.minAllowed naming ephemeral-storage violates the CEL
# rule on VerticalAutoscalingSpec; the webhook mirrors it. The VPA the operator
# writes controls cpu and memory only.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  verticalAutoscaling:
    updateMode: "Off"
    minAllowed:
      ephemeral-storage: 1Gi
