# A spec.bridgeMappings bridge of 16 characters violates the CRD pattern
# (^[a-zA-Z0-9_.-]{1,15}$). The bridge appears as a Linux interface and the
# kernel's IFNAMSIZ leaves 15 usable bytes, so a longer name is one Open
# vSwitch could not create.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: chassis
spec:
  centralRef:
    name: ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
  bridgeMappings:
  - physicalNetwork: physnet1
    bridge: br-sixteen-chars
