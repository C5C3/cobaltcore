# The script the three database probes of this suite run inside the OVN image.
#
# It lives in a ConfigMap rather than in the `kubectl run --overrides` payload so
# it stays a reviewable, shellcheck-able shell script instead of a JSON-escaped
# one-liner. Each probe pod mounts it at /probe and the client certificate the
# OVNCentral published at /certs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ovn-drain-probe-script
  namespace: openstack
data:
  probe.sh: |
    #!/bin/bash
    # Seeds the state the two maintenance Jobs are supposed to take away, and
    # reads both databases back afterwards.
    #
    # Without the seed there is nothing to evacuate: the evacuation Job builds
    # its work list from the Gateway_Chassis and HA_Chassis rows that name this
    # chassis, and on the empty Northbound database of a fresh kind cluster it
    # exits 0 having written nothing. status.nodes[0].gatewayEvacuated flips on
    # the Job's exit code alone, so the suite would report a drain that never
    # moved a binding.
    #
    # NB_ADDRESS, SB_ADDRESS, CHASSIS and NODE_NAME arrive as environment
    # variables; each mode reads only the ones it needs. The mode is the first
    # argument.
    set -u

    # The client keypair and the CA the databases authenticate peers against.
    readonly CERT=(-p /certs/tls.key -c /certs/tls.crt -C /certs/ca.crt)

    # Only a connection-level failure is retried. A TLS failure reports a
    # certificate, an SSL routine or a protocol error instead, and retrying it
    # would burn the budget on a misconfiguration that cannot resolve itself.
    readonly RETRYABLE='Connection refused|Connection timed out|Network is unreachable|No route to host|Host is unreachable|Name or service not known|timeout exceeded'

    readonly ATTEMPTS=30
    readonly INTERVAL=5

    # The router carries one port and the port one gateway chassis: what the
    # evacuation has to remove is a binding, and a richer topology would only
    # widen what a partial pass could get away with.
    readonly ROUTER=ovn-drain-router
    readonly LRP=ovn-drain-lrp

    # ovnctl <tool> <address> <label> <arguments...>
    #
    # Runs one ovn-nbctl or ovn-sbctl invocation and leaves its output in OUT. A
    # connection that is not up yet is retried; anything else fails the probe.
    OUT=""
    ovnctl() {
      local tool="$1" addr="$2" label="$3"
      shift 3
      local attempt=0 out rc

      while [ "${attempt}" -lt "${ATTEMPTS}" ]; do
        attempt=$((attempt + 1))
        out="$("${tool}" --db="${addr}" "${CERT[@]}" --timeout=10 "$@" 2>&1)"
        rc=$?
        if [ "${rc}" -eq 0 ]; then
          OUT="${out}"
          return 0
        fi
        if grep -Eq "${RETRYABLE}" <<< "${out}"; then
          echo "retry ${attempt}/${ATTEMPTS}: database not reachable yet: ${out}"
          sleep "${INTERVAL}"
          continue
        fi
        echo "FAIL: ${tool} ${label} exited ${rc}: ${out}"
        exit 1
      done

      echo "FAIL: ${tool} ${label} never reached the database"
      exit 1
    }

    nbctl() { ovnctl ovn-nbctl "${NB_ADDRESS}" "$@"; }
    sbctl() { ovnctl ovn-sbctl "${SB_ADDRESS}" "$@"; }

    # chassis_row leaves the Southbound Chassis rows carrying this node's
    # hostname in OUT. An empty OUT means the node is not registered.
    chassis_row() {
      sbctl "chassis row for ${NODE_NAME}" \
        --bare --columns=name find Chassis "hostname=${NODE_NAME}"
    }

    case "${1:-}" in
    seed)
      nbctl "lr-add ${ROUTER}" --may-exist lr-add "${ROUTER}"
      nbctl "lrp-add ${LRP}" --may-exist lrp-add "${ROUTER}" "${LRP}" \
        00:00:00:00:00:01 192.0.2.1/24
      nbctl "lrp-set-gateway-chassis ${LRP}" \
        lrp-set-gateway-chassis "${LRP}" "${CHASSIS}" 100
      # Read back rather than trust the exit status: a binding that never landed
      # would have the check after the evacuation pass on a database the
      # evacuation never had to touch.
      nbctl "lrp-get-gateway-chassis ${LRP}" lrp-get-gateway-chassis "${LRP}"
      if ! grep -qF -- "${CHASSIS}" <<< "${OUT}"; then
        echo "FAIL: ${LRP} carries no gateway chassis for ${CHASSIS}: ${OUT}"
        exit 1
      fi

      # The Southbound row the chassis-deletion Job has to remove. Reading it
      # here is what keeps the deregistration check from passing on a chassis
      # that never registered in the first place.
      chassis_row
      if [ -z "${OUT}" ]; then
        echo "FAIL: the southbound database carries no Chassis row for ${NODE_NAME}"
        exit 1
      fi
      echo "chassis row: ${OUT}"
      echo "SEED-OK"
      ;;
    evacuated)
      nbctl "lrp-get-gateway-chassis ${LRP}" lrp-get-gateway-chassis "${LRP}"
      if grep -qF -- "${CHASSIS}" <<< "${OUT}"; then
        echo "FAIL: ${LRP} still binds gateway chassis ${CHASSIS}: ${OUT}"
        exit 1
      fi
      echo "EVACUATED-OK"
      ;;
    deregistered)
      # ovn-controller is gone with the DaemonSet pod by now, so nothing puts
      # the row back. Polled rather than read once because the delete lands on
      # the Southbound leader and the Job's completion is observed through the
      # API server, which can be the earlier of the two.
      attempt=0
      while [ "${attempt}" -lt "${ATTEMPTS}" ]; do
        attempt=$((attempt + 1))
        chassis_row
        if [ -z "${OUT}" ]; then
          echo "DEREGISTERED-OK"
          exit 0
        fi
        echo "retry ${attempt}/${ATTEMPTS}: southbound still carries ${OUT}"
        sleep "${INTERVAL}"
      done
      echo "FAIL: the southbound database still carries a Chassis row for ${NODE_NAME}: ${OUT}"
      exit 1
      ;;
    *)
      echo "FAIL: unknown mode '${1:-}', want seed, evacuated or deregistered"
      exit 1
      ;;
    esac
