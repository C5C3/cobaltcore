# spec.northbound.storage.size in decimal units violates the CRD pattern
# (^[0-9]+(Mi|Gi|Ti)$), which admits binary units only. On a volume this small
# the difference between 1G and 1Gi is large enough to matter, and accepting
# both spellings invites the confusion.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca
  northbound:
    storage:
      size: "1G"
