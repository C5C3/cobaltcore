# spec.northbound.verticalAutoscaling.updateMode outside Off, Initial, Recreate
# and Auto violates the Enum marker; the webhook mirrors it.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca
  northbound:
    verticalAutoscaling:
      updateMode: Sometimes
