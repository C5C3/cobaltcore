# spec.targetClusterRef.name empty violates the MinLength=1 marker on the
# shared TargetClusterRefSpec. An unnamed target names no registered cluster,
# so the operator would have nowhere to place the CR's children. The webhook
# repeats it via validation.TargetClusterRef, but the schema answers first.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca
  targetClusterRef:
    name: ""
