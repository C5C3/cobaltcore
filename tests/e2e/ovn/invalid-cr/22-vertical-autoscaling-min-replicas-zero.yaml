# spec.northbound.verticalAutoscaling.minReplicas of zero violates the Minimum=1
# marker; the webhook mirrors it.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca
  northbound:
    verticalAutoscaling:
      updateMode: Auto
      minReplicas: 0
