# spec.northbound.verticalAutoscaling.minAllowed.cpu above maxAllowed.cpu is
# rejected by the validating webhook alone: CEL cannot compare quantities across
# two maps.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca
  northbound:
    verticalAutoscaling:
      updateMode: "Off"
      minAllowed:
        cpu: "2"
      maxAllowed:
        cpu: "1"
