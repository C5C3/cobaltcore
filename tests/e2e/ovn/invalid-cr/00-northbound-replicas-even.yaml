# spec.northbound.replicas set to an even number violates the CEL rule
# (self % 2 == 1) on OVNDatabaseSpec.Replicas, a schema-level rejection the
# API server answers before the validating webhook runs. An even Raft cluster
# tolerates no more failures than the odd one below it and has two ways to
# split the vote.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca
  northbound:
    replicas: 2
