# spec.relay.nodePort without spec.relay.externallyReachable violates the
# XValidation rule on OVNRelaySpec, which the API server answers before the
# webhook's twin runs. A node port the relay is not published on names a
# port nothing listens on.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca
  relay:
    replicas: 1
    nodePort: 30661
