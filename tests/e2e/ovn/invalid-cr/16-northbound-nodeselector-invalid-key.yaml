# spec.northbound.nodeSelector with the key "bad key" is not a qualified label
# name. The schema admits any string key on the map, so the validating
# webhook (validation.NodeSelectorLabels) is the only gate before the
# rendered pod template reaches the API server and is refused there.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: ovn
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca
  northbound:
    nodeSelector:
      "bad key": x
