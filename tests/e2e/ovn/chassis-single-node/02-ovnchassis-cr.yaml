# OVNChassis fixture for the chassis-single-node E2E test.
#
# The selector matches the label step 1 puts on the one kind node, so the two
# DaemonSets land on exactly that node and status.nodes carries a single entry.
# The same label is what tests/e2e/ovn/invalid-ovnchassis-cr/ uses.
#
# No bridge mappings and no gateway: there is no provider network on a kind
# node to map, and a gateway chassis without an uplink would announce
# connectivity it does not have. spec.image is left unset so the operator
# resolves the same OVN image the control plane runs.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: ovn-chassis
  namespace: openstack
spec:
  centralRef:
    name: ovn-chassis-central
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
