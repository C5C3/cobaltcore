# The backup target of the cinder-pss CR.
#
# It brings the fourth Deployment (cinder-backup) into the namespace, so the
# restricted profile is exercised against every workload kind the operator
# projects rather than against three of them.
#
# The name carries the suite's own prefix for the same reason its sibling
# CinderBackend does: spec.cinderRef is immutable.
#
# The export is the /backups directory the kind NFS server pre-creates
# 42424:42424 mode 0770 (deploy/kind/nfs/nfs-server.yaml).
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackupBackend
metadata:
  name: pss-nfsbk
  namespace: cinder-pss
spec:
  cinderRef:
    name: cinder-pss
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /backups
