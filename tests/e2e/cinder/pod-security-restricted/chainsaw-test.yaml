# Chainsaw E2E test for a Cinder reconciling under restricted PodSecurity.
#
# Decisions worth knowing before reading the steps:
#
#   - Opt-out from per-test namespace (`spec.namespace: ""`): Chainsaw's
#     per-test namespace plumbing creates a chainsaw-* namespace WITHOUT PSS
#     labels. To exercise restricted-profile admission we must own the
#     namespace, so this test sets `spec.namespace: ""` to OPT OUT of the
#     plumbing entirely; Chainsaw then creates no namespace and the test
#     applies its own labelled namespace `cinder-pss` from 00-namespace.yaml.
#     Chainsaw's applied-resource cleanup deletes that namespace (and
#     everything in it) when the test finishes.
#
#   - Every workload kind the operator projects is in the subject: the API, the
#     scheduler, the volume service, the backup service, the db-sync Job, the
#     db-purge CronJob and the service-remove Job. The suite triggers the last
#     two by hand so a Job pod that only the restricted profile would reject is
#     created inside the sampling window rather than at midnight.
#
#   - Brownfield mode (database.host + cache.servers, no clusterRef): the
#     shared provisioning flow resolves `Database.ClusterRef` / `Cache.
#     ClusterRef` in the Cinder CR's own namespace, so a CR in `cinder-pss`
#     cannot reach `openstack/openstack-db` through clusterRef. Brownfield
#     wiring reaches the existing cluster DB/cache without duplicating infra;
#     the `cinder_pss` Database/User/Grant are pre-created in `openstack` by
#     Step 2.
#
#   - The ESO-managed `cinder-db` Secret: `reconcileSecrets` gates SecretsReady
#     on the per-tenant store and on the ESO-synced credential Secret. The
#     Step-1 script seeds the namespace-scoped OpenBao path by COPYING the
#     shared standalone values, then provisions this namespace's per-tenant
#     store via setup-eso-tenant.sh.
#
#   - Zero-PSS-violation event scan (Step 6): the parent controller emits a
#     `FailedCreate` event with the violation listed verbatim when PSS rejects
#     a Pod, so a zero-match scan on `violates PodSecurity "restricted:latest"`
#     is the explicit regression net for any future sub-reconciler that forgets
#     the restricted securityContext.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cinder-pod-security-restricted
spec:
  # Disable Chainsaw's per-test namespace plumbing so Pods land in our
  # PSS-labelled namespace.
  namespace: ""
  timeouts:
    # The schema migration, the API cold start and two NFS mounts precede the
    # first assertion. That does not fit the 120s the shared config allows.
    assert: 5m
  steps:
  # ── Step 1: Apply the labelled namespace, seed OpenBao, take a vhost ────
  # Asserts the PSS enforce label is present so a mis-typed label would surface
  # here, before any Pod is created. Also asserts the ExternalSecret reaches
  # Ready=True so a regression that broke ESO sync fails here, not deeper in
  # Step 3 where the operator's SecretsReady condition would be the only
  # signal.
  - try:
    - apply:
        file: 00-namespace.yaml
    # Provision this namespace's per-tenant OpenBao store and seed its
    # namespace-scoped db path by COPYING the shared standalone values, so the
    # ExternalSecret (which authenticates as the eso-tenant identity) can sync
    # and the `cinder` MariaDB user's password still matches the value the
    # brownfield User CR reconciles onto the same shared user: no SET PASSWORD
    # race. Chainsaw runs scripts with the test directory as CWD.
    - script:
        timeout: 5m
        shell: bash
        content: |
          set -euo pipefail
          BAO_NS="shared-services"
          BAO_POD="openbao-0"
          TENANT_NS="cinder-pss"
          BAO_TOKEN="$(kubectl get secret openbao-init-keys -n "${BAO_NS}" \
            -o jsonpath='{.data.init-output}' | base64 -d | jq -r '.root_token')"
          bao_exec() {
            kubectl exec -n "${BAO_NS}" "${BAO_POD}" -- \
              env BAO_ADDR="https://127.0.0.1:8200" BAO_TOKEN="${BAO_TOKEN}" \
              VAULT_CACERT="/openbao/tls/ca.crt" \
              VAULT_CLIENT_CERT=/openbao/client-tls/tls.crt \
              VAULT_CLIENT_KEY=/openbao/client-tls/tls.key "$@"
          }
          DB_USER="$(bao_exec bao kv get -mount=kv-v2 -field=username \
            openstack/cinder/openstack/standalone/db)"
          DB_PASS="$(bao_exec bao kv get -mount=kv-v2 -field=password \
            openstack/cinder/openstack/standalone/db)"
          bao_exec bao kv put -mount=kv-v2 "openstack/cinder/${TENANT_NS}/pss/db" \
            username="${DB_USER}" password="${DB_PASS}" >/dev/null
          ../../../../deploy/openbao/bootstrap/setup-eso-tenant.sh "${TENANT_NS}"
    # One vhost per suite: the RPC topics are named after the deployment, so two
    # suites on one vhost would share the scheduler and volume-service queues.
    # See ../broker-vhost.sh. The Secret lands in the labelled namespace beside
    # the CR that reads it. The step cleanup runs at the end of the test.
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../broker-vhost.sh create cinder-pss cinder-pss-messaging cinder-pss
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cinder-pss
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/enforce-version: latest
    - assert:
        resource:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: cinder-db
            namespace: cinder-pss
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    cleanup:
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../broker-vhost.sh delete cinder-pss || true
  # ── Step 2: Pre-create brownfield MariaDB Database/User/Grant ──────────
  # The CRs live in `openstack` (the MariaDB operator's namespace), not in the
  # test namespace, because MariaDB CRs reference `openstack-db` via a
  # same-namespace `mariaDbRef`. The User CR manages the canonical `cinder`
  # MariaDB user against the existing `openstack/cinder-db` Secret and is
  # marked `cleanupPolicy: Skip` so this test's User-CR deletion does not drop
  # the user out from under a sibling test.
  - try:
    - apply:
        file: 00-brownfield-db-setup.yaml
    - assert:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Database
          metadata:
            name: cinder-pss-restricted-db
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: User
          metadata:
            name: cinder-pss-restricted-user
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Grant
          metadata:
            name: cinder-pss-restricted-grant
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  # ── Step 3: Apply the CRs and assert Ready under the restricted profile ─
  # Ready=True is the primary end-to-end gate: every Pod the reconciler creates
  # (four Deployments plus the db-sync Job) must have been admitted under
  # restricted PSS for the sub-conditions to flip True.
  #
  # The trailing `error` assertions enforce the brownfield-mode invariant: NO
  # Database/User/Grant CR named after the Cinder CR may be created in the test
  # namespace.
  - try:
    - apply:
        file: 01-cinderbackend-cr.yaml
    - apply:
        file: 02-cinderbackupbackend-cr.yaml
    - apply:
        file: 03-cinder-cr.yaml
    - assert:
        resource:
          apiVersion: cinder.openstack.c5c3.io/v1alpha1
          kind: Cinder
          metadata:
            name: cinder-pss
            namespace: cinder-pss
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cinder-pss
            namespace: cinder-pss
          status:
            availableReplicas: 1
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cinder-pss-scheduler
            namespace: cinder-pss
          status:
            availableReplicas: 1
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cinder-pss-volume-pss-nfs1
            namespace: cinder-pss
          status:
            availableReplicas: 1
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cinder-pss-backup
            namespace: cinder-pss
          status:
            availableReplicas: 1
    - error:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Database
          metadata:
            name: cinder-pss
            namespace: cinder-pss
    - error:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: User
          metadata:
            name: cinder-pss
            namespace: cinder-pss
    - error:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Grant
          metadata:
            name: cinder-pss
            namespace: cinder-pss
    catch: &pss-dump
    - script:
        content: |
          NS=cinder-pss
          echo "=== Cinder CR status ==="
          kubectl get cinder cinder-pss -n "$NS" -o yaml 2>&1 || true
          echo "=== Satellite CR status ==="
          kubectl get cinderbackend,cinderbackupbackend -n "$NS" -o yaml 2>&1 || true
          echo "=== Pod securityContext (CR namespace) ==="
          kubectl get pods -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.securityContext}{"\t"}{.spec.containers[*].securityContext}{"\n"}{end}' 2>&1 || true
          echo "=== Workloads ==="
          kubectl get deploy,job,cronjob -n "$NS" -o wide 2>&1 || true
          echo "=== Pod logs ==="
          for pod in $(kubectl get pods -n "$NS" -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n "$NS" "$pod" --all-containers --tail=60 2>&1 || true
            echo "--- $pod describe (last 30 lines) ---"
            kubectl describe -n "$NS" "$pod" 2>&1 | tail -30 || true
          done
          echo "=== cinder-operator pod logs ==="
          kubectl logs -n cinder-system -l app.kubernetes.io/name=cinder-operator --all-containers --tail=100 2>&1 || true
          echo "=== Sorted events (last 30, CR namespace) ==="
          kubectl get events -n "$NS" --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 4: Run the db-purge CronJob by hand under the profile ─────────
  # The purge runs daily at 00:01, so a scheduled firing would never fall inside
  # a test run. `kubectl create job --from=cronjob` copies the jobTemplate the
  # operator rendered, so the pod that is admitted here is the one the schedule
  # would have produced.
  - try:
    - script:
        shell: bash
        timeout: 3m
        content: |
          set -euo pipefail
          NS=cinder-pss
          kubectl create job cinder-pss-purge-now \
            --from=cronjob/cinder-pss-db-purge -n "$NS"
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: cinder-pss-purge-now
            namespace: cinder-pss
          status:
            succeeded: 1
    catch: *pss-dump
  # ── Step 5: Detach the volume backend and let the service-remove Job run ─
  # The delete blocks until the CinderBackend is gone, which the service-remove
  # finalizer only permits once the Job has succeeded, so the Job pod was
  # admitted under the restricted profile too.
  - try:
    - delete:
        timeout: 6m
        ref:
          apiVersion: cinder.openstack.c5c3.io/v1alpha1
          kind: CinderBackend
          name: pss-nfs1
          namespace: cinder-pss
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: cinder-pss-pss-nfs1-service-remove
            namespace: cinder-pss
          status:
            succeeded: 1
    # The only volume backend is gone, so the aggregate reports the absence.
    # This is the expected end state of the detach rather than a fault: the
    # suite is about admission, and it needed the Job.
    - assert:
        resource:
          apiVersion: cinder.openstack.c5c3.io/v1alpha1
          kind: Cinder
          metadata:
            name: cinder-pss
            namespace: cinder-pss
          status:
            (conditions[?type == 'VolumeServicesReady']):
            - status: "False"
              reason: NoBackends
    catch: *pss-dump
  # ── Step 6: Assert zero PSS-violation FailedCreate events ──────────────
  # PSS admission rejection emits a `FailedCreate` event on the Pod's parent
  # (Deployment/Job) with the violation listed verbatim. A zero-match scan on
  # `violates PodSecurity "restricted:latest"` is the explicit regression net
  # for any future sub-reconciler that forgets the restricted securityContext.
  # The scan is scoped to the test namespace so unrelated FailedCreate events
  # in `openstack` are not picked up.
  - try:
    - script:
        shell: bash
        content: |
          set -euo pipefail
          NS=cinder-pss
          NEEDLE='violates PodSecurity "restricted:latest"'

          MSGS=$(kubectl get events -n "$NS" \
            --field-selector reason=FailedCreate \
            -o jsonpath='{range .items[*]}{.message}{"\n"}{end}')
          # grep -c returns 1 when zero matches; guard with `|| true` so
          # `set -e` does not abort before the count check runs.
          COUNT=$(printf '%s\n' "$MSGS" | grep -cF "$NEEDLE" || true)
          if [ "$COUNT" -ne 0 ]; then
            echo "FAIL: $COUNT FailedCreate event(s) carry the PSS-restricted violation:"
            printf '%s\n' "$MSGS" | grep -F "$NEEDLE" || true
            exit 1
          fi
          echo "OK: zero PSS-restricted FailedCreate events in $NS"
    catch:
    - script:
        content: |
          NS=cinder-pss
          echo "=== Pod securityContext (CR namespace) ==="
          kubectl get pods -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.securityContext}{"\t"}{.spec.containers[*].securityContext}{"\n"}{end}' 2>&1 || true
          echo "=== All FailedCreate events (CR namespace) ==="
          kubectl get events -n "$NS" --field-selector reason=FailedCreate \
            -o custom-columns=LAST:.lastTimestamp,OBJ:.involvedObject.kind/.involvedObject.name,MSG:.message 2>&1 || true
          echo "=== Sorted events (last 30, CR namespace) ==="
          kubectl get events -n "$NS" --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
