# Test namespace + ExternalSecret fixture for the PSS-restricted E2E test.
#
# The namespace carries both `pod-security.kubernetes.io/enforce=restricted`
# AND `pod-security.kubernetes.io/enforce-version=latest`. Without the version
# label, kube-apiserver pins to the cluster's current PSS baseline, which can
# drift on cluster upgrade and surface as a spurious failure; `latest` tracks
# the newest baseline and is the regression net we want.
#
# `cinder-db` is ESO-managed: the operator's `reconcileSecrets` gates
# SecretsReady on the selected secret store and on the ESO-synced credential
# Secret, so a plain Secret is not sufficient to reach Ready=True.
#
# The shared cluster store is namespace-restricted, so a foreign namespace like
# this one cannot reach the shared standalone paths through it. The
# ExternalSecret therefore authenticates through this namespace's OWN
# per-tenant `openbao-tenant-store` (provisioned by the chainsaw Step-1 script
# via setup-eso-tenant.sh) and reads a namespace-scoped path that the
# eso-tenant policy templates to this namespace:
# `openstack/cinder/cinder-pss/pss/db`. The Step-1 script seeds that path by
# COPYING the values from the shared
# `openstack/cinder/openstack/standalone/db` path, so the `cinder` MariaDB
# user's password still matches the value the brownfield User CR reconciles
# onto the same shared MariaDB user: no SET PASSWORD race.
#
# There is no `keystone-admin` ExternalSecret here. The Cinder CR names neither
# spec.keystoneEndpoint nor spec.serviceUser, so it renders auth_strategy =
# noauth and the operator gates on the database credentials alone.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cinder-pss
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cinder-db
  namespace: cinder-pss
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tenant-store
    kind: SecretStore
  target:
    name: cinder-db
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: openstack/cinder/cinder-pss/pss/db
      property: username
  - secretKey: password
    remoteRef:
      key: openstack/cinder/cinder-pss/pss/db
      property: password
