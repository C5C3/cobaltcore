# Brownfield MariaDB Database/User/Grant pre-creation for the PSS-restricted
# E2E test.
#
# The Cinder CR lives in the labelled `cinder-pss` namespace, but
# `Database.ClusterRef` / `Cache.ClusterRef` are `LocalObjectReference` and the
# shared provisioning flow (`IsClusterReady` in
# internal/common/database/flow.go) only looks up MariaDB CRs in the Cinder
# CR's own namespace: cross-namespace lookup is not supported. To reach the
# cluster's existing `openstack/openstack-db` without copying MariaDB CRs into
# the test namespace, the test uses brownfield mode (database.host +
# cache.servers) and pre-creates the Database/User/Grant CRs here, in
# `openstack`.
#
# The User CR manages the canonical `cinder` MariaDB user against the existing
# `openstack/cinder-db` Secret (synced from OpenBao by the cluster's
# `cinder-db` ExternalSecret), so the User's SET PASSWORD lands the same value
# the PSS-namespace `cinder-db` Secret carries (copied from the same standalone
# OpenBao path): no race. `cleanupPolicy: Skip` keeps the user alive when this
# test's User CR is deleted, so a sibling test still managing the same
# canonical user is not stranded mid-flight.
#
# All resource names are prefixed `cinder-pss-restricted-` and the database
# name is `cinder_pss` so this fixture cannot collide with sibling tests. The
# Grant scopes the `cinder` user's privileges to the test-only `cinder_pss`
# database.
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: cinder-pss-restricted-db
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  characterSet: utf8
  collate: utf8_general_ci
  name: cinder_pss
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: cinder-pss-restricted-user
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  name: cinder
  passwordSecretKeyRef:
    name: cinder-db
    key: password
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: cinder-pss-restricted-grant
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  privileges:
  - "ALL PRIVILEGES"
  database: cinder_pss
  table: "*"
  username: cinder
