# The key Secret of the bkrbd-rbd1 volume backend, in the shape Rook's
# CephClient writes: the raw cephx key under the data key userKey.
#
# The key is syntactically valid, so the credentials gate admits it, and no
# Ceph cluster knows it. Its keyring is projected into the backup pod as well,
# because a backup of an RBD volume reads the volume with this backend's user.
apiVersion: v1
kind: Secret
metadata:
  name: bkrbd-rbd1-key
  namespace: openstack
type: Opaque
stringData:
  userKey: AQDHlkVoYx3QKRAAk9m6j4QzG8w2yK0hfr9c6g==
