# The key Secret of bkrbd-rbdbk, carrying userKey with an empty value: the data
# key exists, so the Secret-then-ExternalSecret ladder passes, and the gate's
# own value check is what holds the backup target.
apiVersion: v1
kind: Secret
metadata:
  name: bkrbd-rbdbk-key
  namespace: openstack
type: Opaque
stringData:
  userKey: ""
