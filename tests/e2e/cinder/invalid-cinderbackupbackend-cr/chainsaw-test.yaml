# Chainsaw E2E tests for CinderBackupBackend CRD + webhook validation
# rejection. Pins every implemented CEL XValidation, kubebuilder-marker, and
# webhook.validate() rejection path in
# operators/cinder/api/v1alpha1/cinderbackupbackend_* to a deterministic
# admission failure. Each step applies an otherwise-valid backup backend CR with
# a single aspect violating the rule under test, captures the admission $error,
# and asserts the message substring.
#
# Fixture categories:
#   - Create-rejection fixtures (00-03, 08-15) are each applied once and
#     rejected.
#   - The immutability updates: 04-immutable-cinderref-base is the valid base
#     CR applied first, and 05-immutable-cinderref (cinderRef) and
#     16-immutable-type (NFS to RBD) are applied as UPDATEs of it that the CRD
#     CEL transition rules (self == oldSelf, evaluated only on UPDATE) reject.
#     Each rejection leaves the base in place for the next.
#   - The single-attachment pair: 06-second-backup-base is a valid backup
#     backend applied first, and 07-second-backup-backend attaches a second one
#     to the same Cinder, which the validating webhook's sibling List rejects.
#     It is the create-rejection that needs an existing object.
#
# To prevent scaffold drift across fixtures they are generated from a single
# source of truth in `_generate.py`. After editing the canonical scaffold or
# any per-fixture override, regenerate via:
#   python3 tests/e2e/cinder/invalid-cinderbackupbackend-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes
# `_generate.py --check` (drift mode incl. the orphan sweep) and
# `test_generate.py` (FIXTURES count + chainsaw-test.yaml cross-reference)
# so any hand-edit fails the build before the cluster-bound e2e-operator job.
#
# The test runs in an ephemeral namespace: the base CRs reference Cinders that
# do not exist there, which admission deliberately tolerates (GitOps ordering),
# and the two bases carry different cinderRefs so neither competes with the
# other for the single-attachment rule.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cinder-invalid-cinderbackupbackend-cr
spec:
  steps:
  # type NFS without spec.nfs must be rejected (union rule).
  - try:
    - apply:
        file: 00-type-nfs-without-nfs-block.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one backup backend block matching spec.type')): true
  # spec.fileSize below the Minimum=1048576 marker must be rejected by the
  # schema: a sub-MiB chunk turns a large volume into tens of thousands of
  # objects.
  - try:
    - apply:
        file: 01-filesize-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'fileSize')): true
            (contains($error, 'should be greater than or equal to 1048576')): true
  # spec.compression outside the CRD enum must be rejected: the four values are
  # cinder's own choices for backup_compression_algorithm.
  - try:
    - apply:
        file: 02-compression-not-in-enum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'compression')): true
            (contains($error, 'Unsupported value')): true
  # extraOptions must not carry an option the operator renders from a typed
  # field.
  - try:
    - apply:
        file: 03-extraoptions-denylist.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'option "backup_driver" is owned by')): true
  # ── cinderRef-immutability block ────────────────────────────────────────
  # The valid base CR is applied first and must SUCCEED.
  - try:
    - apply:
        file: 04-immutable-cinderref-base.yaml
  # cinderRef is immutable (CEL transition rule, UPDATE-only).
  - try:
    - apply:
        file: 05-immutable-cinderref.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'cinderRef is immutable')): true
  # type is immutable (CEL transition rule, UPDATE-only): the base is moved from
  # NFS to RBD. The update reaches the object as a merge patch, which leaves the
  # base's nfs block in place, so the merged object also trips the exactly-one
  # rule; the API server returns both messages and the step asserts on the
  # transition rule's. TestIntegration_CRD_CELOnly_RejectsBackupTypeChange is the
  # isolated case.
  - try:
    - apply:
        file: 16-immutable-type.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'type is immutable')): true
  # ── single-attachment block ─────────────────────────────────────────────
  # The valid base CR is applied first and must SUCCEED.
  - try:
    - apply:
        file: 06-second-backup-base.yaml
  # A second backup backend on the same Cinder must be rejected by the webhook:
  # the backup driver is a property of the one cinder-backup Deployment.
  - try:
    - apply:
        file: 07-second-backup-backend.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'already has CinderBackupBackend')): true
  # spec.nfs.path carrying a newline must be rejected by the CRD pattern: the
  # value is rendered verbatim as backup_share, so a newline injects a further
  # option line into the backup driver's section.
  - try:
    - apply:
        file: 08-nfs-path-newline.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'nfs.path')): true
            (contains($error, 'should match')): true
  # type RBD without spec.rbd must be rejected (union rule, second half).
  - try:
    - apply:
        file: 09-type-rbd-without-rbd-block.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one backup backend block matching spec.type')): true
  # type NFS carrying spec.rbd beside spec.nfs must be rejected (union rule).
  - try:
    - apply:
        file: 10-type-nfs-with-rbd-block.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one backup backend block matching spec.type')): true
  # spec.rbd.user with the client. prefix must be rejected by the field-level
  # CEL rule: the keyring section is client.<user>.
  - try:
    - apply:
        file: 11-rbd-user-client-prefix.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'without its client. prefix')): true
  # An empty spec.rbd.monitors must be rejected by MinItems.
  - try:
    - apply:
        file: 12-rbd-monitors-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'monitors')): true
            (contains($error, 'should have at least 1 items')): true
  # A spec.rbd.networks entry that is no IPv4 CIDR must be rejected by the item
  # pattern: each entry becomes an ipBlock peer.
  - try:
    - apply:
        file: 13-rbd-network-not-cidr.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'networks')): true
            (contains($error, 'should match')): true
  # spec.rbd.keySecretRef.name must be a DNS-1123 subdomain.
  - try:
    - apply:
        file: 14-rbd-key-secret-name-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'keySecretRef.name')): true
            (contains($error, 'should match')): true
  # extraOptions on an RBD target must not carry backup_ceph_pool: the
  # webhook's per-type denylist rejects it.
  - try:
    - apply:
        file: 15-extraoptions-rbd-denylist.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'option "backup_ceph_pool" is owned by')): true
