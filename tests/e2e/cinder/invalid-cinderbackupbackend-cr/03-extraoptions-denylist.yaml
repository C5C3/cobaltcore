# spec.extraOptions carrying backup_driver duplicates an option the
# operator renders from spec.type; the validating webhook's denylist
# rejects it, because a duplicate would shadow the typed value depending on
# render order.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackupBackend
metadata:
  name: cinderbackupbackend-denylist
spec:
  cinderRef:
    name: cinder
  type: NFS
  nfs:
    server: nfs.example.com
    path: /exports/cinder-backup
  extraOptions:
    backup_driver: "cinder.backup.drivers.swift.SwiftBackupDriver"
