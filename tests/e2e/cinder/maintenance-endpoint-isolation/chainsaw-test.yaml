# Chainsaw E2E test for maintenance-pod isolation from the Cinder API Service.
# Verifies:
#   - The EndpointSlices of the API Service never list more addresses than the
#     API Deployment's replica count while two maintenance Jobs run, i.e.
#     neither a db-purge pod nor a service-remove pod becomes a backend of the
#     API Service
#   - The API Service is never left without backends: the full replica count is
#     observed at least once, so an empty selector cannot pass the upper bound
#   - The sampling window really overlaps both maintenance runs, proven by a
#     live db-purge pod and a live service-remove pod each holding a pod IP,
#     and neither IP ever appears among the slice addresses
#
# Cinder is the operator with the most components under one instance label:
# the API, the scheduler, one volume service per backend, the backup service,
# and two kinds of maintenance Job. Its API Service selector therefore carries
# `app.kubernetes.io/component=api` from the first pass, and this suite is what
# checks that claim against the endpoints controller rather than against the
# rendered selector.
#
# The two maintenance pods are triggered by hand: the purge runs daily at 00:01
# and a detach only happens when a user deletes a backend, so neither would ever
# fall inside a test run on its own.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cinder-maintenance-endpoint-isolation
spec:
  namespace: openstack
  timeouts:
    # The schema migration, the API cold start and two NFS mounts precede the
    # sampling window. That does not fit the 120s the shared config allows.
    assert: 5m
  steps:
  # ── Step 1: Give the suite its vhost, then apply the CRs ───────────────
  # One vhost per suite: the RPC topics are named after the deployment, so two
  # suites on one vhost would share the scheduler and volume-service queues.
  # See ../broker-vhost.sh. The step cleanup runs at the end of the test.
  - try:
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../broker-vhost.sh create cinder-isolation cinder-isolation-messaging openstack
    - apply:
        file: 00-cinder-cr.yaml
    - apply:
        file: 01-cinderbackend-a-cr.yaml
    - apply:
        file: 02-cinderbackend-b-cr.yaml
    cleanup:
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../broker-vhost.sh delete cinder-isolation || true
  # ── Step 2: Wait for Ready=True with both volume services up ───────────
  - try:
    - assert:
        resource:
          apiVersion: cinder.openstack.c5c3.io/v1alpha1
          kind: Cinder
          metadata:
            name: cinder-isolation
            namespace: openstack
          status:
            # Nil-safe: a Cinder created a moment ago carries no
            # volumeServices yet, and the `|| `[]`` fallback keeps length()
            # from raising a non-retryable type error, so the assert polls.
            (length(volumeServices || `[]`) == `2`): true
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cinder-isolation
            namespace: openstack
          status:
            availableReplicas: 2
    catch: &isolation-dump
    - get:
        apiVersion: cinder.openstack.c5c3.io/v1alpha1
        kind: Cinder
        name: cinder-isolation
        namespace: openstack
    - script:
        content: |
          echo "=== EndpointSlices ==="
          kubectl get endpointslices -n $NAMESPACE \
            -l kubernetes.io/service-name=cinder-isolation -o yaml 2>&1 || true
          echo "=== Pods ==="
          kubectl get pods -n $NAMESPACE \
            -l app.kubernetes.io/instance=cinder-isolation -o wide \
            --show-labels 2>&1 || true
          echo "=== db-purge CronJob ==="
          kubectl describe cronjob cinder-isolation-db-purge -n $NAMESPACE 2>&1 | tail -40 || true
          echo "=== Jobs ==="
          kubectl get jobs -n $NAMESPACE -o wide 2>&1 || true
          kubectl describe job cinder-isolation-isolation-nfs-b-service-remove -n $NAMESPACE 2>&1 | tail -40 || true
          echo "=== Cinder pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=cinder-isolation -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
          done
    - podLogs:
        namespace: cinder-system
        selector: app.kubernetes.io/name=cinder-operator
        tail: 200
    - events:
        namespace: openstack
  # ── Step 3: Sample the API Service endpoints across both maintenance runs ─
  # The CR is never patched after Step 1: any spec change would roll the API
  # Deployment and put a surge pod into the EndpointSlices, which the address
  # count below would report as a failure.
  - try:
    - script:
        timeout: 180s
        # Chainsaw defaults to `sh`, which lacks the here-string-free `while
        # read` over a heredoc this keeps its counters across.
        shell: bash
        content: |
          set -euo pipefail

          SERVICE=cinder-isolation
          CRONJOB=cinder-isolation-db-purge
          PURGE_JOB=cinder-isolation-purge-now
          REMOVE_JOB=cinder-isolation-isolation-nfs-b-service-remove

          # Read the bound off the live Deployment rather than restating the
          # fixture: a copy here would silently stop matching the CR.
          REPLICAS=$(kubectl get deploy "$SERVICE" -n "$NAMESPACE" \
            -o jsonpath='{.spec.replicas}' 2>/dev/null || true)
          [ -n "$REPLICAS" ] || { echo "FAIL: could not read spec.replicas of Deployment $SERVICE"; exit 1; }

          # Both maintenance runs are started before the window opens. Neither
          # call waits: the purge Job's pod is scheduled within a second, and the
          # detach needs the parent to stop the volume Deployment first, so the
          # service-remove pod appears a few seconds in. Blocking on the delete
          # would put the whole detach outside the window it has to fall inside.
          kubectl create job "$PURGE_JOB" --from="cronjob/$CRONJOB" -n "$NAMESPACE"
          kubectl delete cinderbackend isolation-nfs-b -n "$NAMESPACE" --wait=false

          # 90 s covers the purge pod (immediate) and the service-remove pod
          # (behind one volume-Deployment teardown); the two SAW_ flags below
          # turn that from an expectation into an observation.
          WINDOW=90
          DEADLINE=$(( $(date +%s) + WINDOW ))
          SAW_FULL=false
          SAW_PURGE_POD=false
          SAW_REMOVE_POD=false
          MAINT_IPS=""

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            # Every non-terminating address of every slice counts, not just the
            # ready ones: a maintenance pod that satisfies the Service selector
            # is published as an address as soon as it is scheduled, and a Job
            # pod carries no readiness probe, so it is Ready from its first
            # moment. Counting only ready addresses would hide the very state
            # this suite is about. Terminating addresses are excluded so an
            # ordinary API-pod replacement (which briefly puts the old and the
            # new address in the slice) is not misreported as a maintenance-pod
            # leak. A transient API-server error yields an empty ADDRS; that
            # sample counts as no observation and the next tick retries.
            ADDRS=$(kubectl get endpointslices -n "$NAMESPACE" \
              -l kubernetes.io/service-name="$SERVICE" -o json 2>/dev/null \
              | jq -r '.items[].endpoints[]?
                       | select((.conditions.terminating // false) == false)
                       | .addresses[]?' 2>/dev/null || true)
            COUNT=$(printf '%s\n' "$ADDRS" | grep -c . || true)

            if [ "$COUNT" -gt "$REPLICAS" ]; then
              echo "FAIL: API Service $SERVICE has $COUNT endpoint addresses, expected at most $REPLICAS"
              echo "=== EndpointSlices ==="
              kubectl get endpointslices -n "$NAMESPACE" \
                -l kubernetes.io/service-name="$SERVICE" -o yaml 2>&1 || true
              echo "=== Pods ==="
              kubectl get pods -n "$NAMESPACE" \
                -l app.kubernetes.io/instance="$SERVICE" -o wide --show-labels 2>&1 || true
              exit 1
            fi

            # The upper bound alone is satisfied by an empty Service, which is
            # the opposite failure: a selector that matches no API pod at all.
            if [ "$COUNT" -eq "$REPLICAS" ]; then
              SAW_FULL=true
            fi

            # A maintenance pod holding a pod IP is the state that could land
            # in the EndpointSlices, so it is what the sampling above has to
            # overlap. Completed pods are excluded: they keep their IP in status
            # but the endpoints controller ignores them, so a leftover from an
            # earlier run would prove nothing. The heredoc keeps the loop in this
            # shell, so the flags it sets survive it.
            LIVE=$(kubectl get pods -n "$NAMESPACE" \
              -l app.kubernetes.io/instance="$SERVICE" -o json 2>/dev/null \
              | jq -r '.items[]
                       | select(.status.phase == "Running" or .status.phase == "Pending")
                       | select((.status.podIP // "") != "")
                       | "\(.metadata.labels["app.kubernetes.io/component"]) \(.status.podIP)"' 2>/dev/null || true)
            while read -r component ip; do
              case "${component:-}" in
              db-purge) SAW_PURGE_POD=true ;;
              service-remove) SAW_REMOVE_POD=true ;;
              *) continue ;;
              esac
              case " $MAINT_IPS " in
              *" $ip "*) ;;
              *)
                MAINT_IPS="${MAINT_IPS}${MAINT_IPS:+ }${ip}"
                echo "Observed a live $component pod at $ip"
                ;;
              esac
              # The address set is the one read this same tick, so a maintenance
              # pod that reached the slices is caught in the sample that created
              # it rather than after the fact.
              if printf '%s\n' "$ADDRS" | grep -qx "$ip"; then
                echo "FAIL: the $component pod IP $ip is an address of the API Service $SERVICE"
                echo "=== EndpointSlices ==="
                kubectl get endpointslices -n "$NAMESPACE" \
                  -l kubernetes.io/service-name="$SERVICE" -o yaml 2>&1 || true
                exit 1
              fi
            done <<EOF
          $LIVE
          EOF

            sleep 1
          done

          if [ "$SAW_FULL" = false ]; then
            echo "FAIL: API Service $SERVICE never had its full $REPLICAS endpoint addresses during the ${WINDOW}s window"
            echo "The selector matches no API pod, so the upper bound above proves nothing."
            echo "=== Service ==="
            kubectl get svc "$SERVICE" -n "$NAMESPACE" -o yaml 2>&1 || true
            echo "=== EndpointSlices ==="
            kubectl get endpointslices -n "$NAMESPACE" \
              -l kubernetes.io/service-name="$SERVICE" -o yaml 2>&1 || true
            exit 1
          fi

          if [ "$SAW_PURGE_POD" = false ] || [ "$SAW_REMOVE_POD" = false ]; then
            echo "FAIL: the ${WINDOW}s window did not overlap both maintenance runs"
            echo "  live db-purge pod observed:       $SAW_PURGE_POD"
            echo "  live service-remove pod observed: $SAW_REMOVE_POD"
            echo "The endpoint counts above prove nothing without them."
            echo "=== Jobs ==="
            kubectl get jobs -n "$NAMESPACE" -o wide 2>&1 || true
            kubectl describe job "$PURGE_JOB" -n "$NAMESPACE" 2>&1 | tail -30 || true
            kubectl describe job "$REMOVE_JOB" -n "$NAMESPACE" 2>&1 | tail -30 || true
            echo "=== maintenance pods ==="
            kubectl get pods -n "$NAMESPACE" \
              -l app.kubernetes.io/instance="$SERVICE" -o wide --show-labels 2>&1 || true
            exit 1
          fi

          echo "PASS: API Service $SERVICE kept its $REPLICAS backends and no more while the maintenance pods at [$MAINT_IPS] were live"
    catch: *isolation-dump
