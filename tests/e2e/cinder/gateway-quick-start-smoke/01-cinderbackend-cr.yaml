# The one NFS backend the cinder-smoke CR serves.
#
# The HTTPRoute sub-reconciler runs in the parallel group after the Deployment
# step, and a Cinder without an attached backend stops the pipeline earlier
# under VolumeServicesReady=False/NoBackends. So the route this suite is about
# needs a backend to exist at all.
#
# The name carries the suite's own prefix because every suite of this tree runs
# in the shared openstack namespace and spec.cinderRef is immutable: two suites
# applying a CinderBackend of the same name would be one object fighting over
# which Cinder it attaches to.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: smoke-nfs1
  namespace: openstack
spec:
  cinderRef:
    name: cinder-smoke
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /volumes
