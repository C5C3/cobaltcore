# Cinder CR for the basic-deployment E2E test (2026.1 release).
#
# Managed mode throughout: the schema cinder_basic_2026_1 on the openstack-db
# MariaDB cluster, the openstack-memcached cache, and the ESO-synced cinder-db
# credentials (deploy/kind/infrastructure). The transport URL comes from the
# Secret ../broker-vhost.sh writes for this suite's own vhost.
#
# No keystoneEndpoint and no serviceUser: the two are set together or not at
# all (the pairing CEL rule on CinderSpec), and leaving both out renders
# auth_strategy = noauth, which is how the storage path is exercised on a
# cluster that runs no identity service.
#
# The API runs two replicas because that is what makes the PodDisruptionBudget
# assertion meaningful: the shared builder renders minAvailable=1 only above one
# replica and maxUnavailable=1 at exactly one. The volume and backup blocks are
# absent, so the schema default of three replicas never applies to them: naming
# either block would mean spelling out replicas: 1 beside it.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-basic-2026-1
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2026.1"
  api:
    deployment:
      replicas: 2
  database:
    clusterRef:
      name: openstack-db
    database: cinder_basic_2026_1
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: cinder-basic-2026-1-messaging
