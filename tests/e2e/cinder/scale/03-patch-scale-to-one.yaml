# Patch: scale the Cinder API down to a single replica (the PDB flips to
# maxUnavailable=1 to avoid a drain deadlock).
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-scale
  namespace: openstack
spec:
  api:
    deployment:
      replicas: 1
