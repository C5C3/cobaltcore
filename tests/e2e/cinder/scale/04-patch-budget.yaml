# Patch: set the Cinder API PodDisruptionBudget to maxUnavailable: 1.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-scale
  namespace: openstack
spec:
  podDisruptionBudget:
    maxUnavailable: 1
