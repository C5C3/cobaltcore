# The one NFS backend the cinder-scale CR serves.
#
# A Cinder without an attached backend reports VolumeServicesReady=False under
# reason NoBackends and never reaches Ready, so this suite brings one. Its
# Deployment is also half the control group: the replica count under test
# belongs to the API alone, and this one has to stay at one.
#
# The name carries the suite's prefix because every suite of this tree runs in
# the shared openstack namespace: a backend named after its driver alone would
# be one object six suites apply, delete and re-point at each other's Cinder.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: scale-nfs1
  namespace: openstack
spec:
  cinderRef:
    name: cinder-scale
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /volumes
