# The one NFS backend the cinder-upgrade CR serves.
#
# A Cinder without an attached backend reports VolumeServicesReady=False under
# reason NoBackends and never reaches Ready, so the suite needs one to have a
# pre-upgrade steady state at all. The backend also gives the rollout a third
# Deployment to carry across the release, beside the API and the scheduler.
#
# The name carries the suite's own prefix because every suite of this tree runs
# in the shared openstack namespace and spec.cinderRef is immutable: two suites
# applying a CinderBackend of the same name would be one object fighting over
# which Cinder it attaches to.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: upgrade-nfs1
  namespace: openstack
spec:
  cinderRef:
    name: cinder-upgrade
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /volumes
