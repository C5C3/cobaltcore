# Valid base CinderBackend for the cinderRef-immutability pair. It is
# applied FIRST and must SUCCEED; 06-immutable-cinderref reuses this name
# so it is applied as an UPDATE. The referenced Cinder does not have to
# exist at admission time (GitOps ordering), so the base is admitted.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: cinderbackend-immutable
spec:
  cinderRef:
    name: cinder-immutable
  type: NFS
  nfs:
    server: nfs.example.com
    path: /exports/cinder
