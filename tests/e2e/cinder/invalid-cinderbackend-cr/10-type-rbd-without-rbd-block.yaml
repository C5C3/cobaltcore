# type RBD without a spec.rbd block violates the second half of the union
# CEL rule ((self.type == 'RBD') == has(self.rbd)); the webhook mirrors it
# with the same message, but the schema answers first.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: cinderbackend-no-rbd
spec:
  cinderRef:
    name: cinder
  type: RBD
