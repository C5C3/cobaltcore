# spec.nfs.path without a leading slash violates the ^/ pattern on
# NFSBackendSpec.Path. The path reaches the mount command verbatim, where a
# relative one names nothing on the server. The schema is the only gate:
# the webhook carries no counterpart.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: cinderbackend-relative-path
spec:
  cinderRef:
    name: cinder
  type: NFS
  nfs:
    server: nfs.example.com
    path: exports/cinder
