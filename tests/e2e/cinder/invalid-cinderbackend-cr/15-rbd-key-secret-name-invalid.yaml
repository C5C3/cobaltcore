# spec.rbd.keySecretRef.name that is no DNS-1123 subdomain violates the
# object-name pattern: no Secret can carry the name, so the gate would wait
# forever. The schema answers before the webhook twin.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: cinderbackend-rbd-bad-secret
spec:
  cinderRef:
    name: cinder
  type: RBD
  rbd:
    pool: volumes
    user: cinder
    monitors:
    - ceph-mon.openstack.svc.cluster.local
    networks:
    - 10.244.0.0/16
    keySecretRef:
      name: Ceph_Key
