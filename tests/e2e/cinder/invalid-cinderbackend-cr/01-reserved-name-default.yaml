# metadata.name "default" names cinder.conf's [DEFAULT] section, so the
# backend's own options would be read as service-wide ones. The validating
# webhook rejects the exact reserved name; the schema has no counterpart,
# because the section names come from the embedded option catalogs.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: default
spec:
  cinderRef:
    name: cinder
  type: NFS
  nfs:
    server: nfs.example.com
    path: /exports/cinder
