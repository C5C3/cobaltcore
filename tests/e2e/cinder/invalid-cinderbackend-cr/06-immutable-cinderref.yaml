# Update of the cinderbackend-immutable base CR that re-points
# spec.cinderRef.name. The spec-level CEL transition rule
# (self.cinderRef.name == oldSelf.cinderRef.name) rejects the change on
# UPDATE: re-pointing would strand the volumes the old deployment created
# under a host identity nothing serves anymore.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: cinderbackend-immutable
spec:
  cinderRef:
    name: cinder-repointed
  type: NFS
  nfs:
    server: nfs.example.com
    path: /exports/cinder
