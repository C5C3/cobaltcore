# spec.api.deployment.tolerations[0] with no key and the operator Equal: an
# empty key only means "match all keys" with Exists. The schema has no rule
# for it on the embedded upstream Toleration, so the validating webhook
# (validation.Tolerations) is the only gate before the rendered pod template
# reaches the API server and is refused there.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-toleration
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  api:
    deployment:
      tolerations:
      - operator: Equal
        value: x
