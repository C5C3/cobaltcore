# spec.internalTenant.userID empty violates the MinLength=1 marker on
# InternalTenantSpec. Cinder passes the ID to the volume API without
# resolving it through Keystone, so an empty one creates the image-volume
# cache's volumes under nothing. The webhook repeats it as a
# field.Required, but the schema answers first.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-internaltenant-userid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  internalTenant:
    projectID: 8f3a1c0e5b7d4a2f9c6e1b8d3a7f5c40
    userID: ""
