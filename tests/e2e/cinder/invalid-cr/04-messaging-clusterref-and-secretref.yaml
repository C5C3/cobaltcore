# spec.messaging with both clusterRef and secretRef violates the shared
# MessagingSpec XOR CEL rule: managed mode derives the transport URL from
# the RabbitmqCluster, brownfield mode reads it from the Secret, and naming
# both leaves no rule for which URL the pods get. The webhook mirrors it via
# MessagingXOR.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-messaging-both
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
    secretRef:
      name: cinder-transport-url
