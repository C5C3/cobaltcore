# spec.api.deployment.verticalAutoscaling.minAllowed naming ephemeral-storage
# violates the CEL rule on VerticalAutoscalingSpec; the webhook mirrors it. The
# VPA the operator writes controls cpu and memory only.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-vpa-foreign-resource
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  api:
    deployment:
      verticalAutoscaling:
        updateMode: "Off"
        minAllowed:
          ephemeral-storage: 1Gi
