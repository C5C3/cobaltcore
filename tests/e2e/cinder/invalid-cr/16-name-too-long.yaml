# A metadata.name of 44 characters is rejected by the validating webhook
# alone. The bound is 43: the purge CronJob is named {name}-db-purge, 9
# characters on top of the CR name, against the 52-character cap Kubernetes
# puts on a CronJob name. The name is a valid DNS-1123 subdomain apart from
# its length, so the bound is the only rule it breaks. The rule runs in
# ValidateCreate only, so the finalizer-removal update never trips over it.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-name-one-past-the-43-char-cap
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
