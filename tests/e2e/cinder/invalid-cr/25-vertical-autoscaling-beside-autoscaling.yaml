# spec.api.deployment.verticalAutoscaling beside spec.autoscaling violates the
# CEL rule on the spec root; the webhook mirrors it. Every HPA scales on the
# utilization a VPA changes, so the two are rejected on one Deployment. The API
# server reports the rule at spec, with the block's path in the message.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-vpa-beside-autoscaling
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  api:
    deployment:
      verticalAutoscaling:
        updateMode: "Off"
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 80
