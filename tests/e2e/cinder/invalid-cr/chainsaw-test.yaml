# Chainsaw E2E tests for Cinder CRD webhook + CEL validation rejection.
# Pins the implemented CEL XValidation, kubebuilder-marker, and
# webhook.validate() rejection paths in operators/cinder/api/v1alpha1/ to a
# deterministic admission failure. Each step applies an otherwise-valid Cinder
# CR with a single aspect violating the rule under test, captures the admission
# $error, and asserts the field path plus message substring.
#
# The API server validates against the structural schema and its CEL rules
# before it calls the validating webhook, so a rule carried by both layers is
# answered by the schema and the assertions below quote the schema message. The
# webhook message is asserted only where the rule has no schema counterpart: the
# cron grammar of spec.dbPurge.schedule, the two spec.extraConfig checks (the
# map is preserve-unknown-fields, which CEL cannot constrain), and the
# metadata.name bound, which comes from the name of a child object.
#
# The test runs in an ephemeral namespace: the fixtures reference a
# RabbitmqCluster, a MariaDB, a Memcached and a Secret that do not exist there,
# which admission deliberately tolerates (GitOps ordering), so no dangling
# reference competes with the rule a fixture pins.
#
# All fixtures are generated from the single canonical scaffold in
# `_generate.py`. After editing the scaffold or any per-fixture override,
# regenerate via:
#   python3 tests/e2e/cinder/invalid-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes
# `_generate.py --check` (drift mode, both directions incl. orphans) and
# `test_generate.py` (FIXTURES count + chainsaw-test.yaml cross-reference)
# so any hand-edit to a generated fixture fails the build before the
# cluster-bound e2e-operator job runs.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cinder-invalid-cr
spec:
  steps:
  # spec.openStackRelease with a non-cadence minor must be rejected by the CRD
  # pattern.
  - try:
    - apply:
        file: 00-openstackrelease-pattern.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'openStackRelease')): true
            (contains($error, 'should match')): true
  # spec.image with both tag and digest must be rejected by the ImageSpec XOR
  # CEL rule, which answers before the webhook's validateImage twin.
  - try:
    - apply:
        file: 01-image-tag-and-digest.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'image')): true
            (contains($error, 'exactly one of image.tag or image.digest')): true
  # spec.database with both clusterRef and host must be rejected.
  - try:
    - apply:
        file: 02-database-clusterref-and-host.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'database')): true
            (contains($error, 'exactly one of clusterRef or host')): true
  # spec.cache with both clusterRef and servers must be rejected.
  - try:
    - apply:
        file: 03-cache-clusterref-and-servers.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'cache')): true
            (contains($error, 'exactly one of clusterRef or servers')): true
  # spec.messaging with both clusterRef and secretRef must be rejected: the two
  # modes resolve the transport URL differently.
  - try:
    - apply:
        file: 04-messaging-clusterref-and-secretref.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'messaging')): true
            (contains($error, 'exactly one of clusterRef or secretRef')): true
  # spec.messaging naming neither mode must be rejected by the same rule from
  # the other side. The block is required, so an empty object is what reaches
  # the XOR.
  - try:
    - apply:
        file: 05-messaging-neither-mode.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'messaging')): true
            (contains($error, 'exactly one of clusterRef or secretRef')): true
  # spec.messaging.tls with an unnamed CA bundle Secret must be rejected by the
  # MinLength=1 marker on the shared SecretRefSpec.
  - try:
    - apply:
        file: 06-messaging-tls-without-cabundle-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'messaging.tls.caBundleSecretRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.dbPurge.schedule outside the cron grammar must be rejected by the
  # validating webhook: the field carries no CRD pattern because the grammar
  # includes descriptors such as @daily.
  - try:
    - apply:
        file: 07-dbpurge-schedule-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dbPurge.schedule')): true
            (contains($error, 'invalid cron expression')): true
  # spec.dbPurge.retentionDays below the Minimum=1 marker must be rejected by
  # the schema: a zero-day window purges the rows an in-flight request wrote.
  - try:
    - apply:
        file: 08-dbpurge-retentiondays-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dbPurge.retentionDays')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # spec.internalTenant.userID empty must be rejected by the MinLength=1 marker:
  # cinder never resolves the ID through Keystone, so an empty one creates the
  # cached image volumes under nothing.
  - try:
    - apply:
        file: 09-internaltenant-userid-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'internalTenant.userID')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.keyManager without spec.keystoneEndpoint must be rejected by the CEL
  # rule: castellan authenticates against Keystone with the service user's
  # credentials.
  - try:
    - apply:
        file: 10-keymanager-without-keystone-endpoint.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'keyManager requires keystoneEndpoint (castellan authenticates against Keystone)')): true
  # spec.serviceUser without spec.keystoneEndpoint must be rejected by the
  # pairing CEL rule: either half alone renders a [keystone_authtoken] section
  # the service cannot use.
  - try:
    - apply:
        file: 11-serviceuser-without-keystone-endpoint.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'keystoneEndpoint and serviceUser must be set together')): true
  # spec.volume.deployment.replicas above one must be rejected by the
  # single-writer CEL rule: two cinder-volume processes under the same host
  # identity have the same volume state open twice.
  - try:
    - apply:
        file: 12-volume-replicas-above-one.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'volume/backup deployments run exactly one replica')): true
  # spec.backup.deployment.strategy.type other than Recreate must be rejected by
  # the second single-writer CEL rule: a rolling update overlaps the surge pod
  # with the outgoing one.
  - try:
    - apply:
        file: 13-backup-strategy-not-recreate.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'volume/backup deployments must use the Recreate strategy')): true
  # spec.extraConfig setting [DEFAULT] auth_strategy must be rejected by the
  # webhook: extraConfig has the last word in the merge, so anything but
  # keystone serves the API through a pipeline without token validation.
  - try:
    - apply:
        file: 14-extraconfig-rejected-owned-key.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'auth_strategy is managed via operator-computed')): true
            (contains($error, 'anything but keystone disables token validation entirely')): true
  # spec.extraConfig setting an unknown option in a known section must be
  # rejected: it is absent from the cinder 2025.2 option catalog.
  - try:
    - apply:
        file: 15-extraconfig-unknown-option.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'no such option in the cinder 2025.2 option catalog')): true
  # A metadata.name past 43 characters must be rejected by the validating
  # webhook: the {name}-db-purge CronJob would exceed the 52-character cap
  # Kubernetes puts on a CronJob name, so the CR would admit cleanly and then
  # fail to create the purge job on every reconcile.
  - try:
    - apply:
        file: 16-name-too-long.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'metadata.name')): true
            (contains($error, 'name must be at most 43 characters')): true
  # spec.targetClusterRef.name empty must be rejected by the MinLength=1 marker
  # on the shared TargetClusterRefSpec, which answers before the webhook twin.
  - try:
    - apply:
        file: 17-targetclusterref-empty-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'targetClusterRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.gateway without spec.keystoneEndpoint must be rejected by the
  # spec-level CEL rule: a Keystone-free Cinder renders auth_strategy = noauth,
  # so publishing it through a Gateway serves every volume operation
  # unauthenticated.
  - try:
    - apply:
        file: 18-gateway-without-keystone.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'gateway requires keystoneEndpoint')): true
            (contains($error, 'auth_strategy = noauth')): true
