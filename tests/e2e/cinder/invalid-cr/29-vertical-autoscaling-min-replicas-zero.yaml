# spec.api.deployment.verticalAutoscaling.minReplicas of zero violates the
# Minimum=1 marker; the webhook mirrors it.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-vpa-min-replicas-zero
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  api:
    deployment:
      verticalAutoscaling:
        updateMode: Auto
        minReplicas: 0
