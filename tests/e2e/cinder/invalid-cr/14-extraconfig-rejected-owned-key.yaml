# spec.extraConfig setting [DEFAULT] auth_strategy is rejected by the
# validating webhook: extraConfig is a preserve-unknown-fields map, so CEL
# cannot constrain its keys and admission is the only gate. The key is
# Rejected rather than merely owned because extraConfig has the last word
# in the merge, so a value other than keystone selects a WSGI pipeline
# without token validation the moment the pods load the rendered file.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-extraconfig-owned
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  extraConfig:
    DEFAULT:
      auth_strategy: noauth
