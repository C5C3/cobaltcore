# spec.api.deployment.nodeSelector with the key "bad key" is not a qualified label
# name. The schema admits any string key on the map, so the validating
# webhook (validation.NodeSelectorLabels) is the only gate before the
# rendered pod template reaches the API server and is refused there.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-nodeselector
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  api:
    deployment:
      nodeSelector:
        "bad key": x
