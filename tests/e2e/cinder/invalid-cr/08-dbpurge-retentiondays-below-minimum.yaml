# spec.dbPurge.retentionDays below the Minimum=1 marker is answered by the
# schema. A zero-day window purges the rows an in-flight request just
# wrote, so the floor keeps the CronJob from racing the API. The webhook
# repeats the bound, but the schema answers first.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-dbpurge-retention
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  dbPurge:
    retentionDays: 0
