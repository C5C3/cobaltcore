# spec.gateway on a Keystone-free Cinder violates the spec-level CEL rule
# (!has(self.gateway) || has(self.keystoneEndpoint)); the webhook mirrors it
# with the same message, but the schema answers first. Without
# spec.keystoneEndpoint the API renders auth_strategy = noauth, a pipeline
# that takes the project from the request URL and validates no token, so an
# HTTPRoute in front of it would serve every volume operation of every
# project unauthenticated. The scaffold is Keystone-free already, so the
# gateway block alone is what this fixture adds.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-gateway-no-keystone
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  gateway:
    hostname: cinder.example.com
    parentRef:
      name: openstack-gateway
