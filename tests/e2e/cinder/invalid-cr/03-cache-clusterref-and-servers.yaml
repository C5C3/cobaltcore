# spec.cache with both clusterRef and servers violates the shared CacheSpec
# XOR CEL rule: the two modes resolve [keystone_authtoken]
# memcached_servers differently, and naming both leaves no rule for which
# one wins. The webhook mirrors it via CacheXOR.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-cache-both
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
    servers:
    - memcached.example.com:11211
  messaging:
    clusterRef:
      name: openstack-rabbitmq
