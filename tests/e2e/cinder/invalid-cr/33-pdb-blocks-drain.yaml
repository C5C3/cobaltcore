# spec.podDisruptionBudget.minAvailable of 3 at three API replicas allows no
# voluntary eviction, so a node drain could not evict an API pod. CEL cannot
# compare the budget with the replica count, so the validating webhook
# answers (validation.PodDisruptionBudgetEvictable) with "allows no voluntary
# eviction".
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-pdb-blocks-drain
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  api:
    deployment:
      replicas: 3
  podDisruptionBudget:
    minAvailable: 3
