# spec.podDisruptionBudget sets both minAvailable and maxUnavailable. The CEL
# rule on the shared PodDisruptionBudgetSpec answers first with "exactly one
# of minAvailable or maxUnavailable must be set"; the webhook mirrors it
# (validation.PodDisruptionBudgetValues).
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-invalid-pdb-both-set
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: cinder
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  podDisruptionBudget:
    minAvailable: 1
    maxUnavailable: 1
