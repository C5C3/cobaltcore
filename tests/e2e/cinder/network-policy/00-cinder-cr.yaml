# Cinder CR with spec.networkPolicy for the NetworkPolicy lifecycle test.
#
# Same Keystone-free wiring as the basic-deployment fixture, on the schema
# cinder_netpol. One API replica: the policy is a function of the spec and the
# resolved backends, not of the replica count, and a second pod would only
# lengthen the bring-up.
#
# No keystoneEndpoint, which is what the egress assertion turns on: a Cinder
# that validates no token gets no Keystone rule.
#
# The single ingress source selects the openstack namespace. The operator
# appends one peer for its own namespace on top of it, which is the peer
# arithmetic step 3 patches against.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-netpol
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  api:
    deployment:
      replicas: 1
  database:
    clusterRef:
      name: openstack-db
    database: cinder_netpol
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: cinder-netpol-messaging
  networkPolicy:
    ingress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openstack
