# The one NFS backend the cinder-netpol CR serves.
#
# It is what the last egress rule under assertion is derived from: the operator
# opens 2049 once for the exports of every attached backend, and a Cinder with
# none opens nothing. It is also what carries the CR to Ready at all, since an
# unattached Cinder stops at VolumeServicesReady=False/NoBackends.
#
# The name carries the suite's prefix because every suite of this tree runs in
# the shared openstack namespace: a backend named after its driver alone would
# be one object six suites apply, delete and re-point at each other's Cinder.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: netpol-nfs1
  namespace: openstack
spec:
  cinderRef:
    name: cinder-netpol
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /volumes
