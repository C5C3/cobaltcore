# Patch: add a second ingress source, the namespace of the outside probe
# client (cinder-netpol-outside).
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-netpol
  namespace: openstack
spec:
  networkPolicy:
    ingress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openstack
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cinder-netpol-outside
