# The one NFS backend the cinder-ns-scoped CR serves, the healthcheck backend
# under this suite's names.
#
# A Cinder without an attached backend reports VolumeServicesReady=False under
# reason NoBackends and never reaches Ready, so this suite brings one even
# though it asserts nothing about storage. The name carries the suite's prefix
# because every suite of this tree runs in the shared openstack namespace.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: ns-scoped-nfs1
  namespace: openstack
spec:
  cinderRef:
    name: cinder-ns-scoped
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /volumes
