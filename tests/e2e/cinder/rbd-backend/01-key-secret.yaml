# The key Secret of the rbdbe-rbd1 backend, in the shape Rook's CephClient
# writes and "kubectl create secret generic --from-literal=userKey=..." makes:
# the raw cephx key under the data key userKey.
#
# The key is syntactically valid (the base64 a cephx key is printed as), so the
# credentials gate admits it, and no Ceph cluster knows it.
apiVersion: v1
kind: Secret
metadata:
  name: rbdbe-rbd1-key
  namespace: openstack
type: Opaque
stringData:
  userKey: AQDHlkVoYx3QKRAAk9m6j4QzG8w2yK0hfr9c6g==
