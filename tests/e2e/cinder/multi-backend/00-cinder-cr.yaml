# Cinder CR for the multi-backend E2E test (2025.2 release).
#
# Same Keystone-free wiring as the basic-deployment fixture, on the schema
# cinder_multi. Two CinderBackends attach to it, so the operator projects two
# cinder-volume Deployments and the scheduler has a choice to make.
#
# One API replica: the probe reaches the Service, and this suite already holds
# four pods on the single kind node.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: Cinder
metadata:
  name: cinder-multi
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/cinder
    tag: "2025.2"
  api:
    deployment:
      replicas: 1
  database:
    clusterRef:
      name: openstack-db
    database: cinder_multi
    secretRef:
      name: cinder-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: cinder-multi-messaging
