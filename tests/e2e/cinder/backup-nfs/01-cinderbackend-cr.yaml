# The one NFS volume backend the cinder-backup CR serves.
#
# The name carries the suite's own prefix because every suite of this tree runs
# in the shared openstack namespace and spec.cinderRef is immutable: two suites
# applying a CinderBackend of the same name would be one object fighting over
# which Cinder it attaches to.
#
# The cinder-backup pod mounts this export too, at the same path the volume
# service holds it at: a backup reads the source volume itself rather than a
# copy the volume service hands over.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackend
metadata:
  name: backup-nfs1
  namespace: openstack
spec:
  cinderRef:
    name: cinder-backup
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /volumes
