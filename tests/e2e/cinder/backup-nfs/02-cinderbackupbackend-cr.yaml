# The backup target of the cinder-backup CR.
#
# It is a separate kind from CinderBackend because the two describe different
# things: a volume backend is one of several a Cinder serves and gets its own
# cinder-volume Deployment, while the backup driver is a single property of the
# one cinder-backup Deployment.
#
# The name carries the suite's own prefix for the same reason its sibling
# CinderBackend does: the namespace is shared and spec.cinderRef is immutable.
#
# The export is the /backups directory the kind NFS server pre-creates
# 42424:42424 mode 0770 (deploy/kind/nfs/nfs-server.yaml), so the backup driver
# skips the root branches it would otherwise take to widen the permissions.
#
# fileSize, compression and mountOptions are left out, so the schema defaults
# apply and the suite reads them back off the rendered section.
apiVersion: cinder.openstack.c5c3.io/v1alpha1
kind: CinderBackupBackend
metadata:
  name: backup-nfsbk
  namespace: openstack
spec:
  cinderRef:
    name: cinder-backup
  type: NFS
  nfs:
    server: nfs-server.openstack.svc.cluster.local
    path: /backups
