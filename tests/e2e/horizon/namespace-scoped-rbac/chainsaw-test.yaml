# Chainsaw E2E test for namespace-scoped RBAC deployment.
# Validates the install the Multi-Tenant Deployment guide recommends for a
# single namespace: a horizon-operator release with rbac.namespaceScoped=true
# and webhook.enabled=false in the namespace it reconciles:
#   - Operator deployed via Helm with namespace-scoped RBAC
#   - Role/RoleBinding created (not ClusterRole/ClusterRoleBinding)
#   - Horizon CR reconciled to Ready=True
#   - The namespace-scoped operator's own pod reconciled the CR, as its log
#     and metrics show
#
# The cluster-wide horizon-operator in "horizon-system" watches every namespace
# and drives this Horizon to Ready on its own, so the Ready condition of Step 4
# does not show that the namespace-scoped operator did any work. Step 5 reads
# the namespace-scoped pod's own log and metrics instead, through
# ../../lib/assert-namespace-scoped-operator.sh. A cluster-scoped watch or
# cached read fails it on the log within seconds of the pod starting, and a
# manager blocked in its cache sync records no reconcile. The cluster-wide
# release also keeps its in-process webhook, which admits this suite's CRs.
#
# The test runs in the "openstack" namespace where the shared infrastructure
# (MariaDB, Memcached, Secrets) lives, so standard managed mode (clusterRef)
# works exactly as in all other E2E tests. A namespace-scoped operator only
# watches its own release namespace, so its release is installed there too.
#
# The namespace-scoped release runs one replica instead of the chart's two.
# With two, one pod leads and the other stands by behind the same release
# label, and the standby's metrics count no reconcile.
#
# ── concurrent: false ────────────────────────────────────────────────
# The namespace-scoped operator reconciles every Horizon in "openstack" beside
# the cluster-wide one, and every other horizon suite puts its Horizon there.
# Two operators would drive another suite's Horizon at once, so this suite runs
# alone, before the concurrent suites start. Running alone also keeps this
# Horizon the only one in "openstack" while Step 5 counts reconciles.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: horizon-namespace-scoped-rbac
spec:
  namespace: openstack
  concurrent: false
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Deploy operator with namespace-scoped RBAC ─────────────────
  # One replica, because Step 5 reads one pod's log and metrics. Step 6
  # uninstalls the release before chainsaw deletes the Horizon. The step
  # cleanup runs at the end of the test and removes a release that a failed
  # step left installed, so it cannot outlive this suite.
  - try:
    - script:
        timeout: 120s
        content: |
          helm install horizon-operator-ns-scoped \
            ${GITHUB_WORKSPACE:-.}/operators/horizon/helm/horizon-operator/ \
            --namespace openstack \
            --set rbac.namespaceScoped=true \
            --set webhook.enabled=false \
            --set replicas=1 \
            --set image.repository=${IMAGE_PREFIX:-ghcr.io/c5c3}/horizon-operator \
            --set image.tag=dev \
            --set image.pullPolicy=Never \
            --set controller.defaultImagePullPolicy=IfNotPresent \
            --wait --timeout 90s
    catch:
    - script:
        content: |
          echo "=== Helm status ==="
          helm status horizon-operator-ns-scoped -n openstack 2>&1 || true
          echo "=== Pod status ==="
          kubectl get pods -n openstack -o wide 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
    cleanup:
    - script:
        content: |
          helm uninstall horizon-operator-ns-scoped -n openstack 2>&1 || true
  # ── Step 2: Assert Role and RoleBinding exist (not ClusterRole) ────────
  - try:
    - assert:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: horizon-operator-ns-scoped
            namespace: openstack
    - assert:
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: horizon-operator-ns-scoped
            namespace: openstack
    - script:
        content: |
          # Verify no ClusterRole was created for this release
          if kubectl get clusterrole horizon-operator-ns-scoped 2>/dev/null; then
            echo "FAIL: ClusterRole should not exist for namespace-scoped deployment"
            exit 1
          fi
          echo "OK: No ClusterRole found (expected)"
  # ── Step 3: Apply the Horizon CR ───────────────────────────────────────
  - try:
    - apply:
        file: 00-horizon-cr.yaml
  # ── Step 4: Assert successful reconciliation ───────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: horizon.openstack.c5c3.io/v1alpha1
          kind: Horizon
          metadata:
            name: horizon-ns-scoped
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - get:
        apiVersion: horizon.openstack.c5c3.io/v1alpha1
        kind: Horizon
        name: horizon-ns-scoped
        namespace: openstack
    - script:
        content: |
          echo "=== Dashboard pod logs ==="
          for pod in $(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/instance=horizon-ns-scoped -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n "$NAMESPACE" "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n "$NAMESPACE" "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
    - podLogs:
        namespace: openstack
        selector: app.kubernetes.io/instance=horizon-operator-ns-scoped
        tail: 200
    - events:
        namespace: openstack
  # ── Step 5: Prove the namespace-scoped operator reconciled the Horizon ──
  # The header of ../../lib/assert-namespace-scoped-operator.sh lists the
  # checks it runs against the release's single pod.
  - try:
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../../lib/assert-namespace-scoped-operator.sh openstack horizon-operator-ns-scoped horizon horizons.horizon.openstack.c5c3.io
    catch:
    - podLogs:
        namespace: openstack
        selector: app.kubernetes.io/instance=horizon-operator-ns-scoped
        tail: 200
  # ── Step 6: Cleanup Helm release ───────────────────────────────────────
  - try:
    - script:
        content: |
          helm uninstall horizon-operator-ns-scoped -n openstack 2>&1 || true
