# Horizon CR fixture for the namespace-scoped RBAC E2E test, the healthcheck
# fixture under the horizon-ns-scoped name with one replica. Managed cache via
# clusterRef to openstack-memcached; the SECRET_KEY comes from the ESO-synced
# horizon-secret-key Secret (deploy/kind/infrastructure). keystoneEndpoint
# points at the cluster-local convention URL: the login page renders without
# a live Keystone, which is only contacted on login submit.
# spec.secretStoreRef selects the namespaced SecretStore: a namespace-scoped
# operator refuses the default ClusterSecretStore with
# SecretsReady=False/ClusterSecretStoreUnsupported.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-ns-scoped
  namespace: openstack
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao-tenant-store
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
