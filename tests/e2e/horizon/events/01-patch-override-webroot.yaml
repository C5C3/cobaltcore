# Patch overriding the operator-owned WEBROOT with the value the operator
# renders, so local_settings.py, the ConfigMap and the Deployment stay
# unchanged and only the extraConfig ownership guard reacts.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-events
  namespace: openstack
spec:
  extraConfig:
    WEBROOT: "/"
