# Patch with a per-logger level outside the allowed enum. Admission rejects
# it at spec.logging.perLoggerLevels[django.request] before it is persisted.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-logging
  namespace: openstack
spec:
  logging:
    perLoggerLevels:
      django.request: VERBOSE
