# Chainsaw E2E test for happy-path Horizon deployment (2026.2 release).
# Validates the full reconciliation cycle:
#   - All 7 sub-conditions progress to True with expected reasons
#   - Aggregate Ready=True with reason AllReady
#   - Owned resources exist (Deployment, Service, PDB, ConfigMap), and the
#     ConfigMap the Deployment mounts carries the image-scoped cache
#     KEY_PREFIX
#   - The dashboard login page renders (HTTP 200) — this exercises Django
#     URL routing, templates, and the offline-compression manifest without
#     a live Keystone
#   - The login page and the splash logo answer on one connection, which
#     uWSGI keeps open with --http-keepalive
#   - The login page answers a request with a 6000-byte cookie and one with
#     a 60000-byte cookie, which uWSGI accepts only with --buffer-size 65535
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: horizon-basic-deployment-2026-2
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply Horizon CR ───────────────────────────────────────────
  - try:
    - apply:
        file: 00-horizon-cr.yaml
  # ── Step 2: Assert all sub-conditions and Ready ────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: horizon.openstack.c5c3.io/v1alpha1
          kind: Horizon
          metadata:
            name: horizon-basic-2026-2
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "True"
              reason: SecretsAvailable
            (conditions[?type == 'ConfigReady']):
            - status: "True"
              reason: ConfigRendered
            (conditions[?type == 'DeploymentReady']):
            - status: "True"
              reason: DeploymentReady
            (conditions[?type == 'HorizonAPIReady']):
            - status: "True"
              reason: APIHealthy
            (conditions[?type == 'HPAReady']):
            - status: "True"
              reason: HPANotRequired
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
            (conditions[?type == 'HTTPRouteReady']):
            - status: "True"
              reason: HTTPRouteNotRequired
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== Horizon CR status ==="
          kubectl get horizon horizon-basic-2026-2 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n horizon-system -l app.kubernetes.io/name=horizon-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n horizon-system -l app.kubernetes.io/name=horizon-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Dashboard pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=horizon-basic-2026-2 -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Assert Deployment, Service, and PDB ────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: horizon-basic-2026-2
            namespace: openstack
          status:
            (availableReplicas > `0`): true
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: horizon-basic-2026-2
            namespace: openstack
          spec:
            ports:
            - port: 8080
    - assert:
        resource:
          apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata:
            name: horizon-basic-2026-2
            namespace: openstack
            labels:
              app.kubernetes.io/name: horizon
              app.kubernetes.io/instance: horizon-basic-2026-2
              app.kubernetes.io/managed-by: horizon-operator
          spec:
            minAvailable: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: horizon
                app.kubernetes.io/instance: horizon-basic-2026-2
  # ── Step 4: Assert the rendered ConfigMap and its cache KEY_PREFIX ─────
  # The prefix is "horizon-" plus the first 12 hex characters of
  # sha256("ghcr.io/c5c3/horizon:2026.2"); the plain suite pins its own
  # (2026.1), so the leg shows two releases on one Memcached render two
  # prefixes (#1305). The script reads the ConfigMap the Deployment mounts,
  # because the retention sweep keeps up to three historical ones beside
  # it. Plain grep -F, no -q: an early exit would break the pipe under
  # pipefail.
  - try:
    - script:
        shell: bash
        content: |
          set -euo pipefail
          kubectl get cm -n openstack -o name | grep horizon-basic-2026-2-config-
          cm=$(kubectl get deploy horizon-basic-2026-2 -n openstack -o jsonpath='{.spec.template.spec.volumes[?(@.name=="config")].configMap.name}')
          test -n "$cm"
          kubectl get cm -n openstack "$cm" -o jsonpath='{.data.local_settings\.py}' | grep -F '"KEY_PREFIX": "horizon-bf42999233c3"'
  # ── Step 5: Assert the login page renders over HTTP ────────────────────
  # HTTP-level dashboard coverage: tempest-horizon is retired upstream, so
  # the login-page fetch is the Chainsaw-level substitute for a tempest run.
  # The probe retries connection-level failures inside the pod: kube-proxy's
  # endpoint programming can trail the CR's Ready flip by a second or two, so
  # a single-shot request races it (seen in CI). HTTP errors still fail hard.
  # The splash logo the page links has to come back as image/svg+xml: uWSGI's
  # --static-map types the assets from the image's /etc/mime.types, and a
  # browser never renders an untyped SVG (#1624).
  # Two more requests then fetch the login page and the splash logo on one
  # connection, as a pooling proxy would; uWSGI keeps a connection open only
  # with --http-keepalive (#1753). The check waits one second between the
  # two, so the FIN uWSGI sends without the flag has arrived and the second
  # request fails with RemoteDisconnected every time.
  # Two last requests send the login page a 6000-byte and a 60000-byte
  # cookie, each on a new connection. Under its default of 4096 bytes for a
  # request's line and headers, uWSGI closes such a connection without a
  # response, and a gateway in front answers 503 to every request after the
  # login; uWSGI answers both only with --buffer-size 65535 (#1843). The
  # login page is the target because the request then passes the HTTP
  # router, the uWSGI packet and Django, the path a session cookie takes.
  - try:
    - script:
        timeout: 90s
        content: |
          kubectl run curl-test-horizon-basic-2026-2 -n $NAMESPACE --image=ghcr.io/c5c3/horizon:2026.2 --rm -i --restart=Never \
            --command -- python3 -c "
          import time, urllib.error, urllib.request
          last = None
          for _ in range(15):
              try:
                  r = urllib.request.urlopen('http://horizon-basic-2026-2.openstack.svc:8080/auth/login/')
                  body = r.read().decode()
                  assert r.status == 200, r.status
                  assert 'static' in body, 'login page must reference pre-built static assets'
                  print('login page OK, %d bytes' % len(body))
                  break
              except urllib.error.HTTPError as exc:
                  raise SystemExit('GET /auth/login/ -> HTTP %d' % exc.code)
              except (urllib.error.URLError, ConnectionError, OSError) as exc:
                  last = exc
                  print('GET /auth/login/ retry: %s' % exc)
                  time.sleep(2)
          else:
              raise SystemExit('GET /auth/login/ never answered after retries: %r' % last)
          logo = '/static/dashboard/img/logo-splash.svg'
          assert logo in body, 'login page must link the splash logo'
          r = urllib.request.urlopen('http://horizon-basic-2026-2.openstack.svc:8080' + logo)
          content_type = r.headers.get('Content-Type')
          assert content_type == 'image/svg+xml', 'GET %s -> Content-Type %r, want image/svg+xml' % (logo, content_type)
          print('splash logo OK, %s' % content_type)
          import http.client
          conn = http.client.HTTPConnection('horizon-basic-2026-2.openstack.svc', 8080, timeout=10)
          conn.request('GET', '/auth/login/')
          r = conn.getresponse()
          r.read()
          assert r.status == 200, 'keep-alive: GET /auth/login/ -> HTTP %d' % r.status
          sock = conn.sock
          assert sock is not None, 'keep-alive: the first response ends the connection (HTTP/%d.%d, Connection: %r, Content-Length: %r)' % (r.version // 10, r.version % 10, r.getheader('Connection'), r.getheader('Content-Length'))
          time.sleep(1)
          try:
              conn.request('GET', logo)
              r = conn.getresponse()
              r.read()
          except (http.client.HTTPException, OSError) as exc:
              raise SystemExit('keep-alive: second request on the same connection failed: %r' % exc) from exc
          assert r.status == 200, 'keep-alive: GET %s -> HTTP %d' % (logo, r.status)
          assert conn.sock is sock, 'keep-alive: the second response ends the connection (HTTP/%d.%d, Connection: %r, Content-Length: %r)' % (r.version // 10, r.version % 10, r.getheader('Connection'), r.getheader('Content-Length'))
          print('keep-alive OK, two requests on one connection')
          for n in (6000, 60000):
              conn = http.client.HTTPConnection('horizon-basic-2026-2.openstack.svc', 8080, timeout=10)
              try:
                  conn.request('GET', '/auth/login/', headers={'Cookie': 'pad=' + 'x' * n})
                  r = conn.getresponse()
                  r.read()
              except (http.client.HTTPException, OSError) as exc:
                  raise SystemExit('request buffer: GET /auth/login/ with a %d-byte cookie got no response: %r' % (n, exc)) from exc
              finally:
                  conn.close()
              if r.status != 200:
                  raise SystemExit('request buffer: GET /auth/login/ with a %d-byte cookie -> HTTP %d' % (n, r.status))
          print('request buffer OK, cookies of 6000 and 60000 bytes answered')
          "
    catch:
    - script:
        content: |
          echo "=== Horizon CR status ==="
          kubectl get horizon horizon-basic-2026-2 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n horizon-system -l app.kubernetes.io/name=horizon-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n horizon-system -l app.kubernetes.io/name=horizon-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Dashboard pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=horizon-basic-2026-2 -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
