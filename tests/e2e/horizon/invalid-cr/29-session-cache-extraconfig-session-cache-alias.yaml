# spec.extraConfig.SESSION_CACHE_ALIAS while spec.session.backend is Cache would
# win the render-time merge over the "sessions" alias the block renders. The
# validating webhook answers (webhook-only).
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-invalid-session-extraconfig-cache-alias
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
  session:
    backend: Cache
  extraConfig:
    SESSION_CACHE_ALIAS: "default"
