# spec.podDisruptionBudget sets both minAvailable and maxUnavailable. The CEL
# rule on the shared PodDisruptionBudgetSpec answers first with "exactly one
# of minAvailable or maxUnavailable must be set"; the webhook mirrors it
# (validation.PodDisruptionBudgetValues).
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-invalid-pdb-both-set
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
  podDisruptionBudget:
    minAvailable: 1
    maxUnavailable: 1
