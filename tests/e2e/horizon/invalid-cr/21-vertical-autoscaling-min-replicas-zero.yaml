# spec.deployment.verticalAutoscaling.minReplicas of zero violates the Minimum=1
# marker; the webhook mirrors it.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-vpa-min-replicas-zero
  namespace: openstack
spec:
  deployment:
    replicas: 1
    verticalAutoscaling:
      updateMode: Auto
      minReplicas: 0
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2025.2"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
