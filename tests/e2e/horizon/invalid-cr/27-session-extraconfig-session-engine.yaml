# spec.extraConfig.SESSION_ENGINE beside a spec.session block would win the
# render-time merge and silently drop the block, with either backend. CEL
# cannot see extraConfig, so the validating webhook answers (webhook-only).
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-invalid-session-extraconfig-session-engine
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
  session:
    backend: SignedCookies
  extraConfig:
    SESSION_ENGINE: "django.contrib.sessions.backends.cache"
