# spec.podDisruptionBudget.minAvailable of 3 at three API replicas allows no
# voluntary eviction, so a node drain could not evict an API pod. CEL cannot
# compare the budget with the replica count, so the validating webhook
# answers (validation.PodDisruptionBudgetEvictable) with "allows no voluntary
# eviction".
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-invalid-pdb-blocks-drain
  namespace: openstack
spec:
  deployment:
    replicas: 3
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
  podDisruptionBudget:
    minAvailable: 3
