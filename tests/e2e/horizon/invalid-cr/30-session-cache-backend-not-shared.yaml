# spec.session.backend Cache on the per-process LocMemCache backend could not
# hold a session across uWSGI processes and replicas. The validating webhook
# answers (webhook-only) with "requires the cache backend".
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-invalid-session-cache-backend-not-shared
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
    backend: django.core.cache.backends.locmem.LocMemCache
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
  session:
    backend: Cache
