# spec.deployment.nodeSelector with the key "bad key" is not a qualified label
# name. The schema admits any string key on the map, so the validating
# webhook (validation.NodeSelectorLabels) is the only gate before the
# rendered pod template reaches the API server and is refused there.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-invalid-nodeselector
  namespace: openstack
spec:
  deployment:
    replicas: 1
    nodeSelector:
      "bad key": x
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2025.2"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
