# spec.deployment.tolerations[0] with no key and the operator Equal: an empty
# key only means "match all keys" with Exists. The schema has no rule for it
# on the embedded upstream Toleration, so the validating webhook
# (validation.Tolerations) is the only gate before the rendered pod template
# reaches the API server and is refused there.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-invalid-toleration
  namespace: openstack
spec:
  deployment:
    replicas: 1
    tolerations:
    - operator: Equal
      value: x
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2025.2"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
