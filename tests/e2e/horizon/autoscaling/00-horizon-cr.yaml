# Horizon CR fixture for the autoscaling E2E test: initial replicas: 3 and
# CPU-based autoscaling. The rest of the spec is basic-deployment's.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-autoscaling
  namespace: openstack
spec:
  deployment:
    replicas: 3
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
  autoscaling:
    maxReplicas: 6
    targetCPUUtilization: 80
