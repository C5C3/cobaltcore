# Patch to lower the autoscaler's minimum to one replica. The dashboard
# PodDisruptionBudget follows that minimum and switches to maxUnavailable: 1,
# so a drain can still evict the one pod the HPA may leave running.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-autoscaling
  namespace: openstack
spec:
  autoscaling:
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilization: 80
    targetMemoryUtilization: 70
