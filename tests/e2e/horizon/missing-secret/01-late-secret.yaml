# Late-created ExternalSecret for the missing-secret E2E test. It syncs the
# Secret the Horizon CR references from the OpenBao path the standalone
# suites read (deploy/kind/infrastructure/horizon-secret-key-externalsecret.yaml),
# which lets the CR recover from SecretsReady=False to Ready=True.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: missing-secret-horizon-secret-key
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: missing-secret-horizon-secret-key
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: bootstrap/openstack/controlplane-horizon/secret-key
        property: secret-key
