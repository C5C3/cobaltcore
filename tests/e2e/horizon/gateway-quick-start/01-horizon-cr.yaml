# Horizon CR fixture for the Gateway quick-start E2E test: basic-deployment's
# spec with one replica and the quick start's route.
#
# The CR is pinned to the real `openstack-gw` Gateway installed by
# `deploy/kind/base/openstack-gateway.yaml` and the real Envoy Gateway
# controller installed by `deploy/kind/base/envoy-gateway.yaml`. The hostname
# MUST match the `https-horizon` listener hostname AND the dnsName on
# `Certificate/horizon-nip-io-tls`, so the listener's TLS Secret matches the
# SNI the client presents.
#
# HTTPRoute path isolation: this route matches the root path `/`, the
# quick start's route. The sibling smoke fixture
# (../gateway-quick-start-smoke/01-smoke-horizon-cr.yaml) attaches to the
# same listener and hostname on `/auth`, so the two routes never overlap
# entirely when both suites run at once.
#
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-gateway-qs
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
  gateway:
    parentRef:
      name: openstack-gw
    hostname: horizon.127-0-0-1.nip.io
    path: /
