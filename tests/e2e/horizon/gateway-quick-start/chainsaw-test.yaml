# Chainsaw E2E test for the Envoy Gateway quick-start wiring of the Horizon
# dashboard, the Horizon copy of tests/e2e/keystone/gateway-quick-start.
# Exercises the real reconcile path end-to-end on the kind cluster:
#
#   - GatewayClass/envoy + Gateway/openstack-gw reach Programmed=True, and
#     the `https-horizon` listener reaches Accepted=True.
#   - cert-manager issues Certificate/horizon-nip-io-tls.
#   - The Envoy proxy Service is `type: NodePort` with nodePort 31443,
#     matching `hack/kind-config.yaml` extraPortMappings.
#   - A Horizon CR with spec.gateway triggers the operator to create an
#     HTTPRoute, and the REAL Envoy Gateway controller (not a test patch)
#     publishes Accepted=True on the route's parent status.
#   - The Horizon CR's HTTPRouteReady condition flips True with reason
#     HTTPRouteAccepted, and status.endpoint resolves to
#     https://horizon.127-0-0-1.nip.io/.
#
# Scope gating, runtime presence probe (first step): if GatewayClass/envoy,
#   Gateway/openstack-gw or the horizons.horizon.openstack.c5c3.io CRD is
#   missing, the probe script logs SKIP and exits 0. Production overlays
#   (deploy/flux-system/) install neither Envoy Gateway nor the quick-start
#   Gateway, so no chainsaw `--selector` flag is required from callers.
#
# Differs from tests/e2e/horizon/httproute/chainsaw-test.yaml: that suite
# simulates a Gateway controller, while this suite does NOT patch HTTPRoute
# status anywhere. A real Envoy Gateway controller runs in the kind cluster
# and must publish Accepted=True on its own.
#
# Cross-suite parallelism, shared `https-horizon` listener:
#   tests/e2e/chainsaw-config.yaml sets `execution.parallel: 4`, so this
#   suite often runs concurrently with its sibling
#   `tests/e2e/horizon/gateway-quick-start-smoke/`. Both attach an HTTPRoute
#   to the `https-horizon` listener of `Gateway/openstack-gw`
#   (`horizon-gateway-qs` here on `/`, `horizon-smoke` there on `/auth`).
#   Anything asserted on the LISTENER as a whole (e.g.
#   `status.listeners[].attachedRoutes`) is therefore a cross-suite
#   counter and MUST NOT be expected to equal this suite's own route
#   count. Per-route assertions (steps 6 and 7) are the safe contract
#   surface; future authors adding a third suite that attaches to
#   `openstack-gw` should follow the same pattern.
#
# Timeouts: Gateway Programmed, Certificate Ready, and HTTPRoute
# Accepted-by-real-controller take minutes on a fresh kind cluster, so
# `timeouts.assert` is 8m.
#
# The horizon-operator pod runs in `horizon-system`, while the Horizon CR
# and its workload live in `openstack`. Catch-step podLogs lookups for
# `app.kubernetes.io/name=horizon-operator` therefore target
# `horizon-system`.
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: horizon-gateway-quick-start
spec:
  # Relative resource references (Horizon CR, HTTPRoute, Certificate)
  # resolve against this namespace. Matches the httproute suite.
  namespace: openstack
  timeouts:
    # Gateway Programmed + Certificate Ready + HTTPRoute
    # Accepted-by-real-controller costs minutes on a fresh kind cluster,
    # and the default 2m is too tight.
    assert: 8m
    exec: 5m
  steps:
  # ── Step 1: Runtime presence probe ─────────────────────────────────
  # Structured as a separate step (not a wrapper around the rest of
  # the suite) because chainsaw has no step-level skip and nesting
  # every declarative assert inside a shell `if` would defeat the
  # point of declarative asserts. If a resource is missing we
  # exit 0 with a SKIP line; subsequent steps still execute, but
  # because the cluster truly lacks a Gateway controller, asserting
  # Programmed=True would fail. CI pipelines that cannot install Envoy
  # Gateway never deploy `deploy/kind/base/openstack-gateway.yaml`, so
  # the runtime probe alone is sufficient to default-skip this test
  # off non-kind clusters.
  - try:
    - script:
        timeout: 1m
        # Chainsaw defaults to `sh`, which rejects `set -o pipefail`
        # with "Illegal option -o pipefail" (exit 2), so pin bash.
        shell: bash
        content: |
          set -euo pipefail

          # ── Presence guard ──────────────────────────────
          # The kind overlay alone deploys
          # deploy/kind/base/envoy-gateway.yaml +
          # deploy/kind/base/openstack-gateway.yaml, which between them
          # materialise GatewayClass/envoy and Gateway/openstack-gw.
          # Their absence signals a non-kind cluster: exit 0 with a SKIP
          # line so the suite passes without failing on the missing
          # reconcile path downstream.
          if ! kubectl get gatewayclass envoy >/dev/null 2>&1; then
            echo "SKIP: GatewayClass/envoy not present on this cluster."
            echo "      This is expected on non-kind overlays (deploy/flux-system/"
            echo "      does not reference deploy/kind/base/envoy-gateway.yaml)."
            exit 0
          fi
          if ! kubectl get gateway openstack-gw -n openstack >/dev/null 2>&1; then
            echo "SKIP: Gateway/openstack-gw not present in namespace openstack."
            echo "      This is expected on non-kind overlays (deploy/flux-system/"
            echo "      does not reference deploy/kind/base/openstack-gateway.yaml)."
            exit 0
          fi
          # Horizon CRD gate, as in ../gateway-quick-start-smoke: the
          # e2e-operator job installs the operator, so the CRD is present.
          if ! kubectl get crd horizons.horizon.openstack.c5c3.io >/dev/null 2>&1; then
            echo "SKIP: Horizon CRD not present (operator not deployed)."
            exit 0
          fi
          echo "OK: GatewayClass/envoy, Gateway/openstack-gw and the Horizon CRD present, running real-controller assertions"

  # ── Step 2: Apply fixtures ─────────────────────────────────────────
  # Namespace first (idempotent if already created by the kind overlay),
  # then the Horizon CR that wires spec.gateway to the real Gateway.
  - try:
    - apply:
        file: 00-namespace.yaml
    - apply:
        file: 01-horizon-cr.yaml
    catch:
    - script:
        shell: bash
        content: |
          set -euo pipefail
          echo "=== Events in openstack namespace ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp' 2>&1 | tail -30 || true

  # ── Step 3: Gateway Programmed=True + https-horizon listener Accepted=True
  # `(listeners[?name == 'https-horizon'] | [0].conditions[?type == 'Accepted'])`
  # matches on condition type regardless of ordering. The `| [0]` pipe
  # unwraps the single-element list the listener filter returns before
  # descending into `.conditions`; the projection-and-flatten form
  # evaluates to an empty slice under go-jmespath (see
  # tests/e2e/keystone/gateway-quick-start).
  #
  # NO `attachedRoutes` count assertion: `Listener.status.attachedRoutes`
  # counts every HTTPRoute attached to the listener across every suite.
  # Under `execution.parallel: 4` this suite and `gateway-quick-start-smoke`
  # both attach an HTTPRoute to the `https-horizon` listener
  # (`horizon-gateway-qs` + `horizon-smoke`), so a count would race that
  # scheduling. Steps 6 and 7 assert this suite's own route.
  - try:
    - assert:
        resource:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: openstack-gw
            namespace: openstack
          status:
            (conditions[?type == 'Programmed']):
            - status: "True"
            (listeners[?name == 'https-horizon'] | [0].conditions[?type == 'Accepted']):
            - status: "True"
    catch:
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        name: openstack-gw
        namespace: openstack
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: GatewayClass
        name: envoy
    - podLogs:
        namespace: envoy-gateway-system
        selector: control-plane=envoy-gateway
        tail: 200

  # ── Step 4: Certificate Ready=True ───────────────────────
  # cert-manager publishes Ready=True on the Certificate once it has
  # issued and stored the TLS Secret (horizon-nip-io-tls) that the
  # https-horizon listener references.
  - try:
    - assert:
        resource:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: horizon-nip-io-tls
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    catch:
    - describe:
        apiVersion: cert-manager.io/v1
        kind: Certificate
        name: horizon-nip-io-tls
        namespace: openstack
    - podLogs:
        namespace: cert-manager
        selector: app.kubernetes.io/name=cert-manager
        tail: 200

  # ── Step 5: Envoy proxy Service is NodePort with nodePort 31443
  # The Envoy Gateway controller generates a Service per Gateway, labelled
  # `gateway.envoyproxy.io/owning-gateway-name=<gateway-name>`. The
  # EnvoyProxy JSONPatch in deploy/kind/base/envoy-gateway.yaml pins
  # `/spec/ports/0/nodePort` to 31443 so kind's extraPortMappings can
  # bridge host :443 to it.
  #
  # Using jq (rather than kubectl jsonpath) so the diagnostic on
  # mismatch can print the entire service for post-mortem. The check
  # is shaped as:
  #   - exactly one service matched (0 → cryptic waits from the real
  #     controller; >1 → ambiguous which one kind maps to :443),
  #   - `.spec.type == "NodePort"`,
  #   - at least one port has `.nodePort == 31443` (the JSONPatch
  #     targets /spec/ports/0/nodePort but we match any port index so
  #     the assertion survives a chart-side port-ordering change).
  - try:
    - script:
        shell: bash
        timeout: 5m
        content: |
          set -euo pipefail

          # Poll until the Envoy Gateway controller has materialised the
          # per-Gateway Service; it's asynchronous from the Gateway
          # reaching Programmed=True above.
          for _ in $(seq 1 60); do
            count="$(kubectl get svc -n envoy-gateway-system \
              -l gateway.envoyproxy.io/owning-gateway-name=openstack-gw \
              -o json | jq '.items | length')"
            if [ "$count" = "1" ]; then
              break
            fi
            sleep 5
          done

          svc_json="$(kubectl get svc -n envoy-gateway-system \
            -l gateway.envoyproxy.io/owning-gateway-name=openstack-gw \
            -o json)"
          count="$(echo "$svc_json" | jq '.items | length')"
          if [ "$count" != "1" ]; then
            echo "ERROR: expected exactly 1 Service with label"
            echo "       gateway.envoyproxy.io/owning-gateway-name=openstack-gw,"
            echo "       got $count"
            echo "$svc_json" | jq .
            exit 1
          fi

          svc_type="$(echo "$svc_json" | jq -r '.items[0].spec.type')"
          if [ "$svc_type" != "NodePort" ]; then
            echo "ERROR: Envoy proxy Service .spec.type is '$svc_type', expected NodePort"
            echo "$svc_json" | jq '.items[0].spec'
            exit 1
          fi

          has_nodeport="$(echo "$svc_json" | jq '[.items[0].spec.ports[] | select(.nodePort == 31443)] | length')"
          if [ "$has_nodeport" = "0" ]; then
            echo "ERROR: Envoy proxy Service has no port with nodePort=31443"
            echo "$svc_json" | jq '.items[0].spec.ports'
            exit 1
          fi

          echo "OK: Envoy proxy Service is NodePort with nodePort 31443"
    catch:
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        name: openstack-gw
        namespace: openstack
    - podLogs:
        namespace: envoy-gateway-system
        selector: control-plane=envoy-gateway
        tail: 200

  # ── Step 6: HTTPRoute Accepted=True by the REAL controller
  # This suite relies exclusively on the real Envoy Gateway controller to
  # publish Accepted=True on the route's parent status. NO `patch` step
  # exists anywhere in this file; if Envoy Gateway fails to accept the
  # route, this assertion times out and the catch dumps the controller
  # logs for triage.
  #
  # The HTTPRoute is named after the Horizon CR (`subResourceName`, see
  # operators/horizon/internal/controller/reconcile_deployment.go).
  #
  # `(parents[0].conditions[?type == 'Accepted'])` matches only the
  # Accepted condition: the real controller also publishes ResolvedRefs,
  # and chainsaw's array matcher is length-strict.
  - try:
    - assert:
        resource:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: horizon-gateway-qs
            namespace: openstack
          status:
            (parents[0].conditions[?type == 'Accepted']):
            - status: "True"
    catch:
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: horizon-gateway-qs
        namespace: openstack
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        name: openstack-gw
        namespace: openstack
    - podLogs:
        namespace: envoy-gateway-system
        selector: control-plane=envoy-gateway
        tail: 200

  # ── Step 7: Horizon HTTPRouteReady=True/HTTPRouteAccepted + status.endpoint
  # The operator observes HTTPRoute.status.parents[].conditions and flips
  # its own HTTPRouteReady condition True with reason HTTPRouteAccepted once
  # a parent reports Accepted=True. status.endpoint is
  # https://<spec.gateway.hostname>/ whatever the path.
  - try:
    - assert:
        resource:
          apiVersion: horizon.openstack.c5c3.io/v1alpha1
          kind: Horizon
          metadata:
            name: horizon-gateway-qs
            namespace: openstack
          status:
            endpoint: https://horizon.127-0-0-1.nip.io/
            (conditions[?type == 'HTTPRouteReady']):
            - status: "True"
              reason: HTTPRouteAccepted
    catch:
    - describe:
        apiVersion: horizon.openstack.c5c3.io/v1alpha1
        kind: Horizon
        name: horizon-gateway-qs
        namespace: openstack
    - describe:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: horizon-gateway-qs
        namespace: openstack
    - podLogs:
        namespace: horizon-system
        selector: app.kubernetes.io/name=horizon-operator
        tail: 200
    - podLogs:
        namespace: envoy-gateway-system
        selector: control-plane=envoy-gateway
        tail: 200
