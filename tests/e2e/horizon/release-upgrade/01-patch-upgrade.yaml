# Patch to trigger a cross-release upgrade from 2026.1 to 2026.2. The tag
# alone moves: Horizon has no spec.openStackRelease, so the image tag is the
# release.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-release-upgrade
  namespace: openstack
spec:
  image:
    tag: "2026.2"
