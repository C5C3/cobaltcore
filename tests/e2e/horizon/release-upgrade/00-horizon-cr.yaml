# Horizon CR fixture for the release-upgrade E2E test. The CR starts at the
# 2026.1 release: Horizon has no spec.openStackRelease, so the image tag is
# the release and 01-patch-upgrade.yaml moves it alone. Managed cache via
# clusterRef to openstack-memcached; the SECRET_KEY comes from the ESO-synced
# horizon-secret-key Secret (deploy/kind/infrastructure). keystoneEndpoint
# points at the cluster-local convention URL: the login page renders without
# a live Keystone. A single replica keeps the rollout observable when the
# patch bumps the tag to 2026.2.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-release-upgrade
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
