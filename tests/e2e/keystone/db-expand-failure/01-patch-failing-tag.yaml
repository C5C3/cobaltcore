# Patch that drives the db-expand failure path for CC-0102.
#
# Failing-tag mechanism:
#   The plan offered two candidates — (a) bogus-tag whose image is missing
#   from the kind image set, and (b) an "incompatible-real-tag" such as a
#   downgrade tag rejected by the upgrade matrix. A third option — patching
#   the operator-managed Job spec to inject a failing command — was noted as
#   cleaner but invasive (REQ-010 forbids operator-side changes).
#
# Chosen mechanism: (a) bogus-tag, concretely "2026.1-bogus".
#
# Reason:
#   * "2026.1-bogus" passes operators/keystone/internal/controller/
#     version.go:ParseRelease (Year=2026, Minor=1, Patch="bogus"; the
#     suffix after `-` is treated as an opaque patch label).
#   * IsSequentialUpgrade(2025.2, 2026.1-bogus) returns true (year +1,
#     from.Minor=2 → to.Minor=1) so initiateUpgrade in
#     reconcile_database.go:494 sets UpgradePhase=Expanding and dispatches
#     to reconcileExpand — the exact code path REQ-005 needs to exercise.
#   * The kind image set (.github/workflows/ci.yaml `Load images into
#     kind`) pre-loads only `keystone:2025.2`, `keystone:2025.2-upgraded`,
#     and `keystone:2026.1`. `keystone:2026.1-bogus` is intentionally
#     missing → the expand Job's pod fails to pull the image and, after
#     the Job's BackoffLimit (=4 in buildDBJob) is exhausted, the Job
#     transitions to JobFailed=True. RunJob then returns ErrJobFailed,
#     reconcileExpand at reconcile_database.go:563-566 records the failure
#     via recordDBJobTerminalState, sets DatabaseReady=False/
#     reason=ExpandFailed, and emits Warning event reason=ExpandFailed —
#     the symptom REQ-005 asserts.
#
#   Candidates rejected:
#     * Bogus *non-parseable* tag (e.g. "broken"): ParseRelease errors out
#       before reaching reconcileExpand; the surfaced reason is
#       VersionParseError, not ExpandFailed (reconcile_database.go:464).
#     * Downgrade tag (e.g. "2025.1"): IsDowngrade short-circuits with
#       reason=DowngradeNotSupported (reconcile_database.go:474), again
#       not ExpandFailed.
#     * Skip-version tag (e.g. "2026.2", "2027.1"): passes parsing but
#       fails IsSequentialUpgrade with reason=UpgradePathInvalid
#       (reconcile_database.go:486), again not ExpandFailed.
#
#   Environment dependency (CC-0102 review fix — explicit documentation):
#   This mechanism relies on the K8s Job controller marking the expand
#   Job's pod Failed within the chainsaw assert window once the image-pull
#   retries have exhausted the pod's BackoffLimit. With BackoffLimit=4
#   and exponential backoff (10s, 20s, 40s, 80s, 160s), total wait is
#   approximately 5 minutes before the Job transitions to JobFailed=True.
#
#   Concretely, kind / Kubernetes >=1.31 honours pod ImagePullBackOff
#   toward Job BackoffLimit by default, so a freshly-imported kind cluster
#   reproduces the ExpandFailed reason within the test's bounded window.
#   Older clusters keep the pod in ImagePullBackOff indefinitely and the
#   Job never transitions to JobFailed=True — on those clusters this test
#   would deterministically time out asserting DatabaseReady=False/
#   ExpandFailed.
#
#   To accommodate the upper bound while still catching real regressions,
#   the chainsaw Step 4 assert timeout is raised to 10 m (vs the 5 m
#   default) — this gives the Job controller comfortably more than the
#   ~5 min BackoffLimit budget plus headroom for kubelet-side pull-retry
#   pacing variance. If the test ever needs to pass on a Kubernetes <1.31
#   cluster, the follow-up is to add a PodFailurePolicy rule to buildDBJob
#   in reconcile_database.go that explicitly counts ImagePullBackOff
#   toward BackoffLimit; that work is out of scope per REQ-010 ("no
#   operator code changes") and tracked under a separate feature ID.
#
# REQ-005 (CC-0102)
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-db-expand-failure
  namespace: openstack
spec:
  image:
    tag: "2026.1-bogus"
