# Chainsaw E2E test for cross-release upgrade from 2026.1 to 2026.2.
# Verifies the full upgrade lifecycle including the expand-migrate-contract
# database migration path (keystone 29.0.0 → 30.0.0):
#   (1) Fresh deployment with tag 2026.1 reaches Ready=True with installedRelease=2026.1
#   (2) Keystone API at /v3 is accessible before the upgrade, and the admin
#       user issues a project-scoped token
#   (3) Patching spec.image.tag to 2026.2 triggers expand-migrate-contract upgrade
#   (4) db-expand, db-migrate, and db-contract Jobs are created
#   (5) Deployment image updates to 2026.2 and rollout completes
#   (6) Ready=True with installedRelease=2026.2 after upgrade
#   (7) Keystone API at /v3 remains accessible after the upgrade, the admin
#       user issues a project-scoped token (#420), the pre-upgrade token
#       still validates, and the fernet key Secret is unchanged unless a
#       rotation applied in between
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keystone-release-upgrade
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply Keystone CR with initial release 2026.1 ──────────────
  - try:
    - apply:
        file: 00-keystone-cr.yaml
  # ── Step 2: Assert Ready and verify initial Deployment image ───────────
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-release-upgrade
            namespace: openstack
          status:
            installedRelease: "2026.1"
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - script:
        content: |
          kubectl get deploy keystone-release-upgrade -n openstack \
            -o jsonpath='{.spec.template.spec.containers[0].image}' | grep '2026\.1$'
    catch:
    - script:
        content: |
          echo "=== All pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Failed Job logs ==="
          for job in $(kubectl get jobs -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $job ---"
            kubectl logs -n $NAMESPACE "$job" --all-containers --tail=100 2>&1 || true
          done
          echo "=== Pod describe ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l job-name -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -30 || true
          done
          echo "=== Job status ==="
          kubectl get jobs -n $NAMESPACE -o wide 2>&1 || true
          echo "=== ConfigMap content ==="
          for cm in $(kubectl get cm -n $NAMESPACE -o name 2>/dev/null | grep config-); do
            echo "--- $cm ---"
            kubectl get -n $NAMESPACE "$cm" -o jsonpath='{.data}' 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Verify Keystone API accessible before upgrade ──────────────
  # The probe retries connection-level failures inside the pod: kube-proxy's
  # endpoint programming can trail the CR's Ready flip by a second or two, so
  # a single-shot request races it (seen in CI). HTTP errors still fail hard.
  - try:
    - script:
        timeout: 90s
        content: |
          kubectl run curl-test-release-pre -n $NAMESPACE --image=ghcr.io/c5c3/keystone:2026.1 --rm -i --restart=Never \
            --command -- python3 -c "
          import time, urllib.error, urllib.request
          last = None
          for _ in range(15):
              try:
                  print(urllib.request.urlopen('http://keystone-release-upgrade.openstack.svc:5000/v3').read().decode())
                  break
              except urllib.error.HTTPError as exc:
                  raise SystemExit('GET /v3 -> HTTP %d' % exc.code)
              except (urllib.error.URLError, ConnectionError, OSError) as exc:
                  last = exc
                  print('GET /v3 retry: %s' % exc)
                  time.sleep(2)
          else:
              raise SystemExit('GET /v3 never answered after retries: %r' % last)
          "
    # The second script issues an admin token scoped to the project admin and
    # stashes it for step 6 with a hash of the fernet key Secret and the
    # Secret's rotation-completed-at annotation. It runs inside the API pod
    # against localhost: the keystone image ships python3 and no curl, and the
    # loopback request takes no kube-proxy hop. The bounded retry covers a
    # listener that is not up yet; HTTP errors fail hard. The stash is a
    # Secret because the token is a credential.
    - script:
        timeout: 120s
        shell: bash
        content: |
          set -euo pipefail
          ADMIN_PASS=$(kubectl get secret keystone-admin -n openstack \
            -o jsonpath='{.data.password}' | base64 -d || true)
          if [ -z "$ADMIN_PASS" ]; then
            echo "FAIL: keystone-admin Secret has empty or missing password field"
            exit 1
          fi
          # Skip terminating pods: a replaced pod keeps its labels for up to
          # terminationGracePeriodSeconds, and items[0] has no order guarantee.
          POD=$(kubectl get pods -n openstack \
            -l app.kubernetes.io/name=keystone,app.kubernetes.io/instance=keystone-release-upgrade,app.kubernetes.io/component=api \
            -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running")][0].metadata.name // empty' || true)
          if [ -z "$POD" ]; then
            echo "FAIL: no API pod of keystone-release-upgrade found"
            exit 1
          fi
          # The admin password is passed as argv[1], as in fernet-rotation.
          # Retry notices go to stderr so stdout carries the token alone.
          TOKEN=$(kubectl exec -n openstack "$POD" -- python3 -c '
          import json, sys, time, urllib.error, urllib.request
          pw = sys.argv[1]
          body = json.dumps({"auth": {"identity": {"methods": ["password"], "password": {"user": {"name": "admin", "domain": {"id": "default"}, "password": pw}}}, "scope": {"project": {"name": "admin", "domain": {"id": "default"}}}}}).encode()
          req = urllib.request.Request("http://localhost:5000/v3/auth/tokens", data=body, headers={"Content-Type": "application/json"})
          last = None
          for _ in range(15):
              try:
                  with urllib.request.urlopen(req) as r:
                      status = r.status
                      token = r.headers.get("X-Subject-Token", "")
                      doc = json.load(r).get("token", {})
                  break
              except urllib.error.HTTPError as exc:
                  raise SystemExit("POST /v3/auth/tokens -> HTTP %d" % exc.code)
              except (urllib.error.URLError, ConnectionError, OSError) as exc:
                  last = exc
                  print("POST /v3/auth/tokens retry: %s" % exc, file=sys.stderr)
                  time.sleep(2)
          else:
              raise SystemExit("POST /v3/auth/tokens never answered after retries: %r" % last)
          if status != 201:
              raise SystemExit("POST /v3/auth/tokens -> HTTP %d, expected 201" % status)
          if not token:
              raise SystemExit("POST /v3/auth/tokens answered 201 without an X-Subject-Token header")
          user = doc.get("user", {}).get("name")
          project = doc.get("project", {}).get("name")
          roles = [r["name"] for r in doc.get("roles", [])]
          if user != "admin" or project != "admin" or "admin" not in roles:
              raise SystemExit("token issued without the admin scope: user=%s project=%s roles=%s" % (user, project, roles))
          sys.stdout.write(token)
          ' "$ADMIN_PASS") || TOKEN=""
          if [ -z "$TOKEN" ]; then
            echo "FAIL: no token issued before the hop"
            exit 1
          fi
          echo "OK: admin token issued before the hop (project admin, role admin)"
          # Keys and rotation stamp come from one read, so a rotation applied
          # between two reads cannot pair the old keys with the new stamp.
          # Read .data first: sha256sum of empty input is a non-empty digest,
          # so hashing straight from the pipe never detects a missing Secret.
          FERNET=$(kubectl get secret keystone-release-upgrade-fernet-keys -n openstack \
            -o json || true)
          FERNET_DATA=$(printf '%s' "$FERNET" | jq -c '.data // empty' || true)
          if [ -z "$FERNET_DATA" ]; then
            echo "FAIL: keystone-release-upgrade-fernet-keys has no data before the hop"
            exit 1
          fi
          HASH=$(printf '%s' "$FERNET_DATA" | sha256sum | cut -d' ' -f1)
          # The operator writes rotated keys and a new stamp in one update.
          # "none" marks a Secret no rotation has touched yet.
          ROTATED_AT=$(printf '%s' "$FERNET" \
            | jq -r '.metadata.annotations["cobaltcore.c5c3.io/rotation-completed-at"] // "none"')
          # The apply form lets a local re-run on the same cluster pass instead
          # of failing on AlreadyExists.
          kubectl create secret generic keystone-release-upgrade-pre-hop -n openstack \
            --from-literal=token="$TOKEN" --from-literal=fernet-hash="$HASH" \
            --from-literal=rotation-completed-at="$ROTATED_AT" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "OK: fernet Secret hash stashed"
    catch:
    - script:
        content: |
          echo "=== Keystone Service ==="
          kubectl get svc -n $NAMESPACE -l app.kubernetes.io/name=keystone 2>&1 || true
          echo "=== Keystone Endpoints ==="
          kubectl get endpoints -n $NAMESPACE -l app.kubernetes.io/name=keystone 2>&1 || true
          echo "=== Keystone pod status ==="
          kubectl get pods -n $NAMESPACE -l app.kubernetes.io/name=keystone -o wide 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -20 || true
          echo "=== Keystone API pod logs ==="
          kubectl logs -n $NAMESPACE -l app.kubernetes.io/instance=keystone-release-upgrade,app.kubernetes.io/component=api --tail=60 2>&1 || true
          # Drop the token and the apply annotation: client-side apply copies
          # the whole object, token included, into last-applied-configuration.
          echo "=== Pre-hop stash (token redacted) ==="
          kubectl get secret keystone-release-upgrade-pre-hop -n $NAMESPACE 2>&1 || true
          kubectl get secret keystone-release-upgrade-pre-hop -n $NAMESPACE -o json 2>/dev/null \
            | jq 'del(.data.token, .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"])' 2>&1 || true
    # The pre-hop stash is created by a script, so chainsaw does not track it.
    # This is a step cleanup and not a finally on step 6: chainsaw runs a
    # step's finally at the end of that step and skips every later step once
    # one fails, while the cleanups of the steps that did run fire at the end
    # of the test. So the token is deleted whichever of steps 3 to 6 failed.
    cleanup:
    - script:
        content: |
          kubectl delete secret keystone-release-upgrade-pre-hop -n openstack --ignore-not-found 2>&1 || true
  # ── Step 4: Patch image tag to trigger cross-release upgrade ───────────
  - try:
    - patch:
        file: 01-patch-upgrade.yaml
  # ── Step 5: Assert upgrade completes with expand-migrate-contract ──────
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-release-upgrade
            namespace: openstack
          status:
            installedRelease: "2026.2"
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - script:
        content: |
          set -eu
          echo "=== Verifying upgrade phase Jobs ==="
          for phase in expand migrate contract; do
            JOB="keystone-release-upgrade-db-${phase}"
            if kubectl get job "$JOB" -n openstack >/dev/null 2>&1; then
              echo "OK: Job $JOB exists"
            else
              echo "ERROR: Job $JOB not found"
              exit 1
            fi
          done
    - script:
        content: |
          kubectl get deploy keystone-release-upgrade -n openstack \
            -o jsonpath='{.spec.template.spec.containers[0].image}' | grep '2026\.2$'
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: keystone-release-upgrade
            namespace: openstack
          status:
            (availableReplicas > `0`): true
            (updatedReplicas == replicas): true
    catch:
    - script:
        content: |
          echo "=== Keystone status ==="
          kubectl get keystone keystone-release-upgrade -n $NAMESPACE -o yaml 2>&1 | tail -40 || true
          echo "=== All pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Failed Job logs ==="
          for job in $(kubectl get jobs -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $job ---"
            kubectl logs -n $NAMESPACE "$job" --all-containers --tail=100 2>&1 || true
          done
          echo "=== Pod describe ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l job-name -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -30 || true
          done
          echo "=== Job status ==="
          kubectl get jobs -n $NAMESPACE -o wide 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 6: Verify Keystone API accessible after upgrade ───────────────
  # The probe retries connection-level failures inside the pod: kube-proxy's
  # endpoint programming can trail the CR's Ready flip by a second or two, so
  # a single-shot request races it (seen in CI). HTTP errors still fail hard.
  - try:
    - script:
        timeout: 90s
        content: |
          kubectl run curl-test-release-post -n $NAMESPACE --image=ghcr.io/c5c3/keystone:2026.2 --rm -i --restart=Never \
            --command -- python3 -c "
          import time, urllib.error, urllib.request
          last = None
          for _ in range(15):
              try:
                  print(urllib.request.urlopen('http://keystone-release-upgrade.openstack.svc:5000/v3').read().decode())
                  break
              except urllib.error.HTTPError as exc:
                  raise SystemExit('GET /v3 -> HTTP %d' % exc.code)
              except (urllib.error.URLError, ConnectionError, OSError) as exc:
                  last = exc
                  print('GET /v3 retry: %s' % exc)
                  time.sleep(2)
          else:
              raise SystemExit('GET /v3 never answered after retries: %r' % last)
          "
    # The second script is the authenticated POST /v3/auth/tokens #420 left
    # untested, against a 2026.2 API pod in the shape of step 3's. It then
    # validates the token step 3 stashed with the fresh one and compares the
    # fernet key Secret with the stashed hash and rotation stamp. The step 3
    # cleanup deletes the stash, so this step has no finally.
    - script:
        timeout: 120s
        shell: bash
        content: |
          set -euo pipefail
          OLD_TOKEN=$(kubectl get secret keystone-release-upgrade-pre-hop -n openstack \
            -o jsonpath='{.data.token}' | base64 -d || true)
          OLD_HASH=$(kubectl get secret keystone-release-upgrade-pre-hop -n openstack \
            -o jsonpath='{.data.fernet-hash}' | base64 -d || true)
          OLD_ROTATED_AT=$(kubectl get secret keystone-release-upgrade-pre-hop -n openstack \
            -o jsonpath='{.data.rotation-completed-at}' | base64 -d || true)
          if [ -z "$OLD_TOKEN" ] || [ -z "$OLD_HASH" ] || [ -z "$OLD_ROTATED_AT" ]; then
            echo "FAIL: no pre-hop stash found (step 3 did not run or was cleaned up)"
            exit 1
          fi
          ADMIN_PASS=$(kubectl get secret keystone-admin -n openstack \
            -o jsonpath='{.data.password}' | base64 -d || true)
          if [ -z "$ADMIN_PASS" ]; then
            echo "FAIL: keystone-admin Secret has empty or missing password field"
            exit 1
          fi
          # Skip terminating pods: a 2026.1 pod keeps its labels for up to
          # terminationGracePeriodSeconds after the rollout, and items[0] has
          # no order guarantee.
          POD=$(kubectl get pods -n openstack \
            -l app.kubernetes.io/name=keystone,app.kubernetes.io/instance=keystone-release-upgrade,app.kubernetes.io/component=api \
            -o json | jq -r '[.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running")][0].metadata.name // empty' || true)
          if [ -z "$POD" ]; then
            echo "FAIL: no API pod of keystone-release-upgrade found"
            exit 1
          fi
          echo "API pod: $POD ($(kubectl get pod "$POD" -n openstack -o jsonpath='{.spec.containers[0].image}' || true))"
          NEW_TOKEN=$(kubectl exec -n openstack "$POD" -- python3 -c '
          import json, sys, time, urllib.error, urllib.request
          pw = sys.argv[1]
          body = json.dumps({"auth": {"identity": {"methods": ["password"], "password": {"user": {"name": "admin", "domain": {"id": "default"}, "password": pw}}}, "scope": {"project": {"name": "admin", "domain": {"id": "default"}}}}}).encode()
          req = urllib.request.Request("http://localhost:5000/v3/auth/tokens", data=body, headers={"Content-Type": "application/json"})
          last = None
          for _ in range(15):
              try:
                  with urllib.request.urlopen(req) as r:
                      status = r.status
                      token = r.headers.get("X-Subject-Token", "")
                      doc = json.load(r).get("token", {})
                  break
              except urllib.error.HTTPError as exc:
                  raise SystemExit("POST /v3/auth/tokens -> HTTP %d" % exc.code)
              except (urllib.error.URLError, ConnectionError, OSError) as exc:
                  last = exc
                  print("POST /v3/auth/tokens retry: %s" % exc, file=sys.stderr)
                  time.sleep(2)
          else:
              raise SystemExit("POST /v3/auth/tokens never answered after retries: %r" % last)
          if status != 201:
              raise SystemExit("POST /v3/auth/tokens -> HTTP %d, expected 201" % status)
          if not token:
              raise SystemExit("POST /v3/auth/tokens answered 201 without an X-Subject-Token header")
          user = doc.get("user", {}).get("name")
          project = doc.get("project", {}).get("name")
          roles = [r["name"] for r in doc.get("roles", [])]
          if user != "admin" or project != "admin" or "admin" not in roles:
              raise SystemExit("token issued without the admin scope: user=%s project=%s roles=%s" % (user, project, roles))
          sys.stdout.write(token)
          ' "$ADMIN_PASS") || NEW_TOKEN=""
          if [ -z "$NEW_TOKEN" ]; then
            echo "FAIL: no token issued after the hop"
            exit 1
          fi
          echo "OK: admin token issued after the hop (project admin, role admin)"
          # Both tokens go over stdin, as in fernet-rotation. Keystone answers
          # 404 for a subject token it cannot decrypt or does not know, and 401
          # when the fresh token does not authorize the call. The status is
          # written only after the user check, so a 200 naming another user
          # leaves HTTP_CODE empty.
          HTTP_CODE=$(printf '%s\n%s' "$NEW_TOKEN" "$OLD_TOKEN" | kubectl exec -i -n openstack "$POD" -- python3 -c '
          import json, sys, urllib.error, urllib.request
          new_tok, old_tok = sys.stdin.read().split("\n", 1)
          req = urllib.request.Request("http://localhost:5000/v3/auth/tokens", headers={"X-Auth-Token": new_tok, "X-Subject-Token": old_tok})
          try:
              with urllib.request.urlopen(req) as r:
                  status = r.status
                  user = json.load(r).get("token", {}).get("user", {}).get("name")
          except urllib.error.HTTPError as e:
              sys.stdout.write(str(e.code))
              raise SystemExit(0)
          if user != "admin":
              raise SystemExit("validated token names user %s, not admin" % user)
          sys.stdout.write(str(status))
          ') || HTTP_CODE=""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: pre-hop token validation on 2026.2 returned HTTP ${HTTP_CODE:-none} (expected 200)"
            exit 1
          fi
          echo "OK: pre-hop token validates after the hop (HTTP 200)"
          # Hashed in the form of step 3, from one read like there.
          FERNET=$(kubectl get secret keystone-release-upgrade-fernet-keys -n openstack \
            -o json || true)
          FERNET_DATA=$(printf '%s' "$FERNET" | jq -c '.data // empty' || true)
          if [ -z "$FERNET_DATA" ]; then
            echo "FAIL: keystone-release-upgrade-fernet-keys has no data after the hop"
            exit 1
          fi
          NEW_HASH=$(printf '%s' "$FERNET_DATA" | sha256sum | cut -d' ' -f1)
          NEW_ROTATED_AT=$(printf '%s' "$FERNET" \
            | jq -r '.metadata.annotations["cobaltcore.c5c3.io/rotation-completed-at"] // "none"')
          # The fixture's weekly rotation can apply between steps 3 and 6. Its
          # new stamp tells it apart from an upgrade that rewrote the keys. The
          # token check above holds either way: with three active keys, one
          # rotation keeps the key that signed the pre-hop token.
          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "OK: fernet key Secret unchanged across the hop"
          elif [ "$NEW_ROTATED_AT" != "none" ] && [ "$NEW_ROTATED_AT" != "$OLD_ROTATED_AT" ]; then
            echo "NOTE: a fernet rotation applied at $NEW_ROTATED_AT during the hop; key equality not checked"
          else
            echo "FAIL: fernet key Secret changed across the hop without a rotation (before $OLD_HASH, after $NEW_HASH)"
            exit 1
          fi
    catch:
    - script:
        content: |
          echo "=== Keystone Service ==="
          kubectl get svc -n $NAMESPACE -l app.kubernetes.io/name=keystone 2>&1 || true
          echo "=== Keystone Endpoints ==="
          kubectl get endpoints -n $NAMESPACE -l app.kubernetes.io/name=keystone 2>&1 || true
          echo "=== Keystone pod status ==="
          kubectl get pods -n $NAMESPACE -l app.kubernetes.io/name=keystone -o wide 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -20 || true
          echo "=== Keystone API pod logs ==="
          kubectl logs -n $NAMESPACE -l app.kubernetes.io/instance=keystone-release-upgrade,app.kubernetes.io/component=api --tail=60 2>&1 || true
          # Drop the token and the apply annotation, as in the step 3 catch.
          echo "=== Pre-hop stash (token redacted) ==="
          kubectl get secret keystone-release-upgrade-pre-hop -n $NAMESPACE 2>&1 || true
          kubectl get secret keystone-release-upgrade-pre-hop -n $NAMESPACE -o json 2>/dev/null \
            | jq 'del(.data.token, .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"])' 2>&1 || true
