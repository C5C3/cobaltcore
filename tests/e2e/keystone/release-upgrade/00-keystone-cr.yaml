# Keystone CR fixture for the release-upgrade E2E test.
# Managed mode with initial image tag 2026.1.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-release-upgrade
  namespace: openstack
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao-tenant-store
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_release_upgrade
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
  # Disable dogpile.cache for this fixture. The e2e-operator Chainsaw suite
  # runs four keystone suites in parallel against a single shared
  # `openstack-memcached`, and keystone's cache keys carry no per-instance
  # discriminator (function and arguments only), so every instance reads
  # and writes the same keys for the `admin@default` user and the `admin`
  # project. A neighbouring suite's entry can therefore answer the token
  # probes of steps 3 and 6 with a 401 on the password lookup or a 404 on
  # the project scope, although this instance's bootstrap Job created the
  # admin user with the correct password. The upgrade path under test does
  # not involve the cache; with it off, every lookup reads the migrated
  # database. #227 tracks per-instance cache keys in the operator.
  extraConfig:
    cache:
      enabled: "false"
