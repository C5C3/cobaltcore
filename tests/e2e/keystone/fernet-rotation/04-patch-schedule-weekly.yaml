# Patch to restore the fixture's weekly Fernet rotation schedule (Sunday
# 00:00 UTC) once step 9 has seen the held scheduled rotation skip a tick.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-fernet
  namespace: openstack
spec:
  fernet:
    rotationSchedule: "0 0 * * 0"
