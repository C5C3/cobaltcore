# Chainsaw E2E test for fernet key rotation.
# Verifies:
#   - CronJob schedule matches spec.fernet.rotationSchedule, and the CronJob
#     carries concurrencyPolicy: Forbid
#   - Manual rotation via kubectl create job --from=cronjob changes Secret data
#   - Pod UIDs remain unchanged after rotation (no Deployment rollout)
#   - A fernet token obtained before rotation validates after rotation
#   - A staging Secret deleted between rotations comes back empty with its
#     label and controller owner reference, and nothing commits from it
#   - A second rotation past maxActiveKeys prunes the key that signed the
#     pre-rotation token, so that token gets a 401 while tokens signed by
#     surviving keys validate
#   - The keystone-operator release exports
#     keystone_operator_key_rotation_age_seconds for the fernet keys once
#     a rotation is applied
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keystone-fernet-rotation
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply Keystone CR ──────────────────────────────────────────
  - try:
    - apply:
        file: 00-keystone-cr.yaml
  # ── Step 2: Wait for Ready=True ────────────────────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-fernet
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== All pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Failed Job logs ==="
          for job in $(kubectl get jobs -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $job ---"
            kubectl logs -n $NAMESPACE "$job" --all-containers --tail=100 2>&1 || true
          done
          echo "=== Pod describe ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l job-name -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -30 || true
          done
          echo "=== Job status ==="
          kubectl get jobs -n $NAMESPACE -o wide 2>&1 || true
          echo "=== ConfigMap content ==="
          for cm in $(kubectl get cm -n $NAMESPACE -o name 2>/dev/null | grep config-); do
            echo "--- $cm ---"
            kubectl get -n $NAMESPACE "$cm" -o jsonpath='{.data}' 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Assert CronJob schedule, suspend and concurrency policy ────
  # The schedule matches spec, rotation is not suspended by default, and a
  # scheduled rotation never overlaps an earlier one.
  - try:
    - assert:
        resource:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: keystone-fernet-fernet-rotate
            namespace: openstack
          spec:
            schedule: "0 0 * * 0"
            suspend: false
            concurrencyPolicy: Forbid
  # ── Step 4: Trigger rotation, verify no rollout, validate token ─────────
  - try:
    - script:
        timeout: 180s
        shell: bash
        content: |
          set -euo pipefail

          # Record pre-rotation state: pod UIDs and Secret data hash.
          # The pod-template-hash label is set only on Deployment-owned pods by
          # the ReplicaSet controller, so the selector excludes CronJob-managed
          # rotation pods that share commonLabels with the API pods.
          BEFORE_UIDS=$(kubectl get pods -n openstack \
            -l app.kubernetes.io/name=keystone,app.kubernetes.io/instance=keystone-fernet,pod-template-hash \
            -o jsonpath='{range .items[*]}{.metadata.uid}{"\n"}{end}' | sort)
          BEFORE_HASH=$(kubectl get secret keystone-fernet-fernet-keys -n openstack \
            -o jsonpath='{.data}' | sha256sum | cut -d' ' -f1)

          # Obtain a fernet token before rotation for later validation.
          ADMIN_PASS=$(kubectl get secret keystone-admin -n openstack \
            -o jsonpath='{.data.password}' | base64 -d)
          if [ -z "$ADMIN_PASS" ]; then
            echo "ERROR: keystone-admin Secret has empty or missing password field"
            exit 1
          fi
          POD=$(kubectl get pods -n openstack \
            -l app.kubernetes.io/name=keystone,app.kubernetes.io/instance=keystone-fernet,pod-template-hash \
            -o jsonpath='{.items[0].metadata.name}')
          # The keystone image ships python3 but no curl; use urllib to issue
          # the auth request. The admin password is passed as argv[1] (not
          # stdin) because openbao generates a shell-safe 64-char hex string.
          TOKEN=$(kubectl exec -n openstack "$POD" -- python3 -c '
          import json, sys, urllib.request
          pw = sys.argv[1]
          body = json.dumps({"auth": {"identity": {"methods": ["password"], "password": {"user": {"name": "admin", "domain": {"id": "default"}, "password": pw}}}}}).encode()
          req = urllib.request.Request("http://localhost:5000/v3/auth/tokens", data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req) as r:
              sys.stdout.write(r.headers.get("X-Subject-Token", ""))
          ' "$ADMIN_PASS")
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to obtain fernet token before rotation"
            exit 1
          fi
          echo "OK: Obtained fernet token before rotation"
          # Stash the token for step 7, which expects it to fail once a second
          # rotation prunes its key. The stash is a Secret because the token is
          # a credential. The apply form lets a local re-run on the same
          # cluster pass instead of failing on AlreadyExists. The token goes
          # over stdin, never into an argument, and server-side apply keeps it
          # out of the last-applied-configuration annotation.
          printf '%s' "$TOKEN" | kubectl create secret generic keystone-fernet-pre-rotation-token -n openstack \
            --from-file=token=/dev/stdin \
            --dry-run=client -o yaml | kubectl apply --server-side -f -
          echo "OK: pre-rotation token stashed"

          # Trigger manual fernet key rotation.
          kubectl create job keystone-fernet-manual-rotate \
            --from=cronjob/keystone-fernet-fernet-rotate -n openstack
          kubectl wait --for=condition=complete \
            job/keystone-fernet-manual-rotate -n openstack --timeout=120s

          # The CronJob writes new keys to the staging Secret only; the
          # operator promotes them to the production Secret on the next
          # reconcile triggered by the staging Secret watch. Poll
          # for the production Secret hash to change rather than asserting
          # immediately after Job completion.
          AFTER_HASH="$BEFORE_HASH"
          for _ in $(seq 1 60); do
            AFTER_HASH=$(kubectl get secret keystone-fernet-fernet-keys -n openstack \
              -o jsonpath='{.data}' | sha256sum | cut -d' ' -f1)
            [ "$BEFORE_HASH" != "$AFTER_HASH" ] && break
            sleep 1
          done
          if [ "$BEFORE_HASH" = "$AFTER_HASH" ]; then
            echo "ERROR: Fernet Secret data did not change after rotation"
            exit 1
          fi
          echo "OK: Fernet Secret data changed"

          # No kubelet projection wait needed: the token validation below is the
          # real semantic guarantee that rotated keys are functional.

          # Verify pod UIDs are unchanged (no Deployment rollout).
          AFTER_UIDS=$(kubectl get pods -n openstack \
            -l app.kubernetes.io/name=keystone,app.kubernetes.io/instance=keystone-fernet,pod-template-hash \
            -o jsonpath='{range .items[*]}{.metadata.uid}{"\n"}{end}' | sort)
          if [ "$BEFORE_UIDS" != "$AFTER_UIDS" ]; then
            echo "ERROR: Pod UIDs changed after rotation — rollout occurred"
            echo "Before: $BEFORE_UIDS"
            echo "After:  $AFTER_UIDS"
            exit 1
          fi
          echo "OK: Pod UIDs unchanged after fernet rotation (no rollout)"

          # Validate the pre-rotation token still works (multi-key overlap).
          # Same python-over-stdin pattern: keystone image has no curl, and
          # piping the token avoids embedding it in a quoted -c argument.
          HTTP_CODE=$(printf '%s' "$TOKEN" | kubectl exec -i -n openstack "$POD" -- python3 -c '
          import sys, urllib.request, urllib.error
          tok = sys.stdin.read()
          req = urllib.request.Request("http://localhost:5000/v3/auth/tokens", headers={"X-Auth-Token": tok, "X-Subject-Token": tok})
          try:
              with urllib.request.urlopen(req) as r:
                  sys.stdout.write(str(r.status))
          except urllib.error.HTTPError as e:
              sys.stdout.write(str(e.code))
          ')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Pre-rotation token validation returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi
          echo "OK: Pre-rotation token validates post-rotation (HTTP 200)"
    catch:
    - script:
        content: |
          echo "=== Fernet rotation Job pods ==="
          kubectl get pods -n $NAMESPACE -l job-name=keystone-fernet-manual-rotate -o wide 2>&1 || true
          for pod in $(kubectl get pods -n $NAMESPACE -l job-name=keystone-fernet-manual-rotate -o name 2>/dev/null); do
            echo "--- $pod logs ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=100 2>&1 || true
            echo "--- $pod previous logs ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=100 --previous 2>&1 || true
            echo "--- $pod describe ---"
            kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -30 || true
          done
          echo "=== Keystone API pods ==="
          kubectl get pods -n $NAMESPACE \
            -l app.kubernetes.io/name=keystone,app.kubernetes.io/instance=keystone-fernet \
            -o wide 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -20 || true
          echo "=== Pre-rotation token stash (token redacted) ==="
          kubectl get secret keystone-fernet-pre-rotation-token -n $NAMESPACE 2>&1 || true
          kubectl get secret keystone-fernet-pre-rotation-token -n $NAMESPACE -o json 2>/dev/null \
            | jq 'del(.data.token, .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"])' 2>&1 || true
    # The token stash is created by a script, so chainsaw does not track it.
    # This is a step cleanup and not a finally on step 7: chainsaw runs a
    # step's finally at the end of that step and skips every later step once
    # one fails, while the cleanups of the steps that did run fire at the end
    # of the test. So the token is deleted whichever step failed.
    cleanup:
    - script:
        content: |
          kubectl delete secret keystone-fernet-pre-rotation-token -n openstack --ignore-not-found 2>&1 || true
  # ── Step 4.5: Assert rotation Role RBAC split ─────────
  # Verifies the `keystone-fernet-fernet-rotate` Role grants `patch` ONLY on
  # the staging Secret (`keystone-fernet-fernet-keys-rotation`) and NEVER on
  # the production Secret (`keystone-fernet-fernet-keys`). This is the
  # regression guard for the split-compute-write architecture.
  - try:
    - script:
        shell: bash
        content: |
          set -euo pipefail

          ROLE_JSON=$(kubectl get role keystone-fernet-fernet-rotate -n openstack -o json)

          # Assertion 1: NO PolicyRule may grant `patch` scoped to the
          # production Secret `keystone-fernet-fernet-keys`.
          PROD_PATCH=$(echo "$ROLE_JSON" | jq '[.rules[] | select(.resourceNames // [] | index("keystone-fernet-fernet-keys")) | select(.verbs // [] | index("patch"))] | length')
          if [ "$PROD_PATCH" != "0" ]; then
            echo "ERROR: Role keystone-fernet-fernet-rotate grants 'patch' on production Secret keystone-fernet-fernet-keys (violation)"
            echo "$ROLE_JSON" | jq '.rules'
            exit 1
          fi
          echo "OK: Role has no 'patch' verb scoped to production Secret keystone-fernet-fernet-keys"

          # Assertion 2: At least ONE PolicyRule must grant `patch` scoped to
          # the staging Secret `keystone-fernet-fernet-keys-rotation`.
          STAGING_PATCH=$(echo "$ROLE_JSON" | jq '[.rules[] | select(.resourceNames // [] | index("keystone-fernet-fernet-keys-rotation")) | select(.verbs // [] | index("patch"))] | length')
          if [ "$STAGING_PATCH" -lt 1 ]; then
            echo "ERROR: Role keystone-fernet-fernet-rotate is missing 'patch' verb on staging Secret keystone-fernet-fernet-keys-rotation (violation)"
            echo "$ROLE_JSON" | jq '.rules'
            exit 1
          fi
          echo "OK: Role has 'patch' verb scoped to staging Secret keystone-fernet-fernet-keys-rotation"

          echo "OK: Rotation Role RBAC split verified (read-only on prod, patch only on staging)"
    catch:
    - script:
        content: |
          echo "=== Role keystone-fernet-fernet-rotate (yaml) ==="
          kubectl get role keystone-fernet-fernet-rotate -n openstack -o yaml 2>&1 || true
          echo "=== Role keystone-fernet-fernet-rotate (json rules) ==="
          kubectl get role keystone-fernet-fernet-rotate -n openstack -o json 2>&1 | jq '.rules' || true
          echo "=== All roles in namespace ==="
          kubectl get roles -n $NAMESPACE -o wide 2>&1 || true
  # ── Step 5: Assert Ready=True maintained after rotation ────────────────
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-fernet
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
  # ── Step 6: Delete the staging Secret between rotations ────────────────
  # Between rotations the staging Secret holds no data. Deleting it by hand
  # wakes the operator through the Secret watch's owner-reference fallback,
  # and the operator must recreate it empty, with its label and controller
  # owner reference, and commit nothing from it. Step 7's rotation then
  # commits through the recreated Secret.
  - try:
    - script:
        timeout: 180s
        shell: bash
        content: |
          set -euo pipefail
          STAGING=keystone-fernet-fernet-keys-rotation
          KS_UID=$(kubectl get keystone keystone-fernet -n openstack -o jsonpath='{.metadata.uid}')

          # prod_state: "<sha256 of .data> <rotation-completed-at or none>" of
          # the production Secret, from one read. sha256sum of empty input is
          # a non-empty digest, so a missing .data fails instead of hashing.
          prod_state() {
            local secret data
            secret=$(kubectl get secret keystone-fernet-fernet-keys -n openstack -o json)
            data=$(printf '%s' "$secret" | jq -c '.data // empty')
            if [ -z "$data" ]; then
              echo "FAIL: keystone-fernet-fernet-keys has no data" >&2
              return 1
            fi
            printf '%s %s\n' "$(printf '%s' "$data" | sha256sum | cut -d' ' -f1)" \
              "$(printf '%s' "$secret" | jq -r '.metadata.annotations["cobaltcore.c5c3.io/rotation-completed-at"] // "none"')"
          }
          # rotated_count: the summed count of FernetKeysRotated events on the
          # Keystone CR. The recorder raises an event's count on a repeat; an
          # event without count counts as 1.
          rotated_count() {
            kubectl get events -n openstack \
              --field-selector "involvedObject.uid=$KS_UID,reason=FernetKeysRotated" -o json \
              | jq '[.items[] | .count // 1] | add // 0'
          }

          # The commit of step 4 deleted the staging Secret, and the next
          # reconcile recreates it.
          deadline=$((SECONDS + 60))
          OLD_UID=""
          until [ -n "$OLD_UID" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "FAIL: staging Secret $STAGING does not exist after 60s"
              exit 1
            fi
            sleep 2
            OLD_UID=$(kubectl get secret "$STAGING" -n openstack -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
          done
          PROD0=$(prod_state)
          # The recorder sends step 4's FernetKeysRotated event asynchronously;
          # wait for it so a late write cannot pass for a new commit.
          COUNT0=$(rotated_count)
          until [ "$COUNT0" -ge 1 ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "FAIL: no FernetKeysRotated event on keystone-fernet after the rotation of step 4"
              exit 1
            fi
            sleep 2
            COUNT0=$(rotated_count)
          done
          echo "OK: staging Secret $STAGING exists (uid $OLD_UID); FernetKeysRotated count $COUNT0"

          kubectl delete secret "$STAGING" -n openstack --wait=true

          deadline=$((SECONDS + 60))
          NEW=""
          NEW_UID=""
          until [ -n "$NEW_UID" ] && [ "$NEW_UID" != "$OLD_UID" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "FAIL: staging Secret $STAGING was not recreated within 60s"
              exit 1
            fi
            sleep 2
            NEW=$(kubectl get secret "$STAGING" -n openstack -o json 2>/dev/null || true)
            NEW_UID=$(printf '%s' "$NEW" | jq -r '.metadata.uid // empty' 2>/dev/null || true)
          done
          echo "OK: staging Secret $STAGING recreated (uid $NEW_UID)"

          LABEL=$(printf '%s' "$NEW" | jq -r '.metadata.labels["cobaltcore.c5c3.io/rotation-target"] // "none"')
          if [ "$LABEL" != "fernet-keys" ]; then
            echo "FAIL: recreated $STAGING has rotation-target label $LABEL, expected fernet-keys"
            exit 1
          fi
          OWNERS=$(printf '%s' "$NEW" | jq '[.metadata.ownerReferences // [] | .[]
            | select(.kind == "Keystone" and .name == "keystone-fernet" and .controller == true)] | length')
          if [ "$OWNERS" != "1" ]; then
            echo "FAIL: recreated $STAGING has $OWNERS controller owner references to Keystone keystone-fernet, expected 1"
            printf '%s' "$NEW" | jq '.metadata.ownerReferences'
            exit 1
          fi
          DATA_KEYS=$(printf '%s' "$NEW" | jq '.data // {} | length')
          if [ "$DATA_KEYS" != "0" ]; then
            echo "FAIL: recreated $STAGING holds $DATA_KEYS data keys, expected none"
            exit 1
          fi
          if printf '%s' "$NEW" | jq -e '.metadata.annotations // {} | has("cobaltcore.c5c3.io/rotation-completed-at")' >/dev/null; then
            echo "FAIL: recreated $STAGING carries the rotation-completed-at annotation"
            exit 1
          fi
          echo "OK: recreated $STAGING is empty, labelled fernet-keys and controlled by Keystone keystone-fernet"

          # Longer than RequeueSecretPolling (15s), so a spurious commit from
          # the recreated Secret would have happened by now.
          sleep 20

          PROD1=$(prod_state)
          if [ "$PROD1" != "$PROD0" ]; then
            echo "FAIL: production Secret changed after the staging Secret was deleted: hash and rotation-completed-at were [$PROD0], are [$PROD1]"
            exit 1
          fi
          COUNT1=$(rotated_count)
          if [ "$COUNT1" != "$COUNT0" ]; then
            echo "FAIL: FernetKeysRotated count rose from $COUNT0 to $COUNT1 after the staging Secret was deleted"
            exit 1
          fi
          REJECTED=$(kubectl get events -n openstack \
            --field-selector "involvedObject.uid=$KS_UID,reason=RotationRejected" -o name)
          if [ -n "$REJECTED" ]; then
            echo "FAIL: RotationRejected event on keystone-fernet: $REJECTED"
            exit 1
          fi
          echo "OK: production keys, rotation-completed-at and FernetKeysRotated count unchanged; no RotationRejected event"
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-fernet
            namespace: openstack
          status:
            (conditions[?type == 'FernetKeysReady']):
            - status: "True"
              reason: FernetKeysAvailable
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== Staging Secret (data removed) ==="
          kubectl get secret keystone-fernet-fernet-keys-rotation -n $NAMESPACE -o json 2>/dev/null | jq 'del(.data)' 2>&1 || true
          echo "=== Production Secret (data removed) ==="
          kubectl get secret keystone-fernet-fernet-keys -n $NAMESPACE -o json 2>/dev/null | jq 'del(.data)' 2>&1 || true
          echo "=== Events of keystone-fernet ==="
          kubectl get events -n $NAMESPACE --field-selector involvedObject.name=keystone-fernet --sort-by='.lastTimestamp' 2>&1 || true
  # ── Step 7: Prune a key past maxActiveKeys ─────────────────────────────
  # keystone-manage fernet_rotate renames key 0 to max+1, writes a new 0 and
  # purges the lowest indices until maxActiveKeys (3) keys remain. Step 4
  # left {0,2,3}; this rotation leaves {0,3,4} and purges 2, the primary key
  # that signed the stashed token T0. The kubelet projects the Secret into
  # the API pod in place, and keystone reads the key repository on every
  # token operation (the fixture turns caching off), so T0 must get a 401
  # while T1, signed by the surviving key 3, and a fresh T2 validate.
  - try:
    - script:
        timeout: 600s
        shell: bash
        content: |
          set -euo pipefail

          ADMIN_PASS=$(kubectl get secret keystone-admin -n openstack \
            -o jsonpath='{.data.password}' | base64 -d)
          if [ -z "$ADMIN_PASS" ]; then
            echo "FAIL: keystone-admin Secret has empty or missing password field"
            exit 1
          fi
          POD=$(kubectl get pods -n openstack \
            -l app.kubernetes.io/name=keystone,app.kubernetes.io/instance=keystone-fernet,pod-template-hash \
            -o jsonpath='{.items[0].metadata.name}')

          T0=$(kubectl get secret keystone-fernet-pre-rotation-token -n openstack \
            -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)
          if [ -z "$T0" ]; then
            echo "FAIL: no pre-rotation token stash (step 4 did not run or was cleaned up)"
            exit 1
          fi

          # prod_keys: the key indices of the production Secret, ascending.
          prod_keys() {
            kubectl get secret keystone-fernet-fernet-keys -n openstack -o json \
              | jq -r '.data // {} | keys | sort_by(tonumber) | join(" ")'
          }
          # pod_keys: the digit-named entries of the API pod's key directory,
          # ascending. The kubelet projection adds ..data entries, which the
          # filter drops; python3 lists the directory because the image does
          # not promise ls.
          pod_keys() {
            kubectl exec -n openstack "$POD" -- python3 -c 'import os; print(" ".join(sorted((n for n in os.listdir("/etc/keystone/fernet-keys") if n.isdigit()), key=int)))'
          }
          # wait_projection <keys> <seconds>: poll until the pod projects <keys>.
          # A token issued before the projection completes would be signed
          # with the old primary key.
          wait_projection() {
            local want="$1" limit="$2" have=""
            local until_s=$((SECONDS + limit))
            while :; do
              have=$(pod_keys || true)
              [ "$have" = "$want" ] && return 0
              if [ "$SECONDS" -ge "$until_s" ]; then
                echo "FAIL: pod $POD projects keys [$have], Secret holds [$want] after ${limit}s"
                return 1
              fi
              sleep 2
            done
          }
          # issue_token: an admin token, the request of step 4. The password
          # goes over stdin, never into an argument.
          issue_token() {
            printf '%s' "$ADMIN_PASS" | kubectl exec -i -n openstack "$POD" -- python3 -c '
          import json, sys, urllib.request
          pw = sys.stdin.read()
          body = json.dumps({"auth": {"identity": {"methods": ["password"], "password": {"user": {"name": "admin", "domain": {"id": "default"}, "password": pw}}}}}).encode()
          req = urllib.request.Request("http://localhost:5000/v3/auth/tokens", data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req) as r:
              sys.stdout.write(r.headers.get("X-Subject-Token", ""))
          '
          }
          # validate <token>: the HTTP code of GET /v3/auth/tokens with the
          # token as both X-Auth-Token and X-Subject-Token, the request of
          # step 4. The token goes over stdin, never into an argument.
          validate() {
            printf '%s' "$1" | kubectl exec -i -n openstack "$POD" -- python3 -c '
          import sys, urllib.request, urllib.error
          tok = sys.stdin.read()
          req = urllib.request.Request("http://localhost:5000/v3/auth/tokens", headers={"X-Auth-Token": tok, "X-Subject-Token": tok})
          try:
              with urllib.request.urlopen(req) as r:
                  sys.stdout.write(str(r.status))
          except urllib.error.HTTPError as e:
              sys.stdout.write(str(e.code))
          '
          }

          wait_projection "$(prod_keys)" 150
          T1=$(issue_token)
          if [ -z "$T1" ]; then
            echo "FAIL: no token issued before the second rotation"
            exit 1
          fi
          echo "OK: token T1 issued under the projected key set"

          # E is the set keystone leaves for max_active_keys 3; P holds the
          # keys the rotation must purge.
          B=$(prod_keys)
          MAXB=${B##* }
          E="0 $MAXB $((MAXB + 1))"
          P=""
          for k in $B; do
            case " $E " in
              *" $k "*) ;;
              *) P="${P:+$P }$k" ;;
            esac
          done
          if [ -z "$P" ]; then
            echo "FAIL: no key would be pruned: B=[$B] E=[$E]"
            exit 1
          fi
          echo "OK: keys before the second rotation [$B], expected after [$E], to be pruned [$P]"

          BEFORE_HASH=$(kubectl get secret keystone-fernet-fernet-keys -n openstack \
            -o jsonpath='{.data}' | sha256sum | cut -d' ' -f1)
          kubectl create job keystone-fernet-manual-rotate-2 \
            --from=cronjob/keystone-fernet-fernet-rotate -n openstack
          kubectl wait --for=condition=complete \
            job/keystone-fernet-manual-rotate-2 -n openstack --timeout=120s
          AFTER_HASH="$BEFORE_HASH"
          for _ in $(seq 1 60); do
            AFTER_HASH=$(kubectl get secret keystone-fernet-fernet-keys -n openstack \
              -o jsonpath='{.data}' | sha256sum | cut -d' ' -f1)
            [ "$BEFORE_HASH" != "$AFTER_HASH" ] && break
            sleep 1
          done
          if [ "$BEFORE_HASH" = "$AFTER_HASH" ]; then
            echo "FAIL: fernet Secret data did not change within 60s of the second rotation"
            exit 1
          fi

          A=$(prod_keys)
          read -ra A_KEYS <<<"$A"
          if [ "$A" != "$E" ] || [ "${#A_KEYS[@]}" -ne 3 ]; then
            echo "FAIL: key set after the second rotation is [$A], expected [$E] (before: [$B])"
            exit 1
          fi
          echo "OK: second rotation left keys [$A] and pruned [$P]"

          wait_projection "$E" 150
          echo "OK: pod $POD projects keys [$E]"

          until_s=$((SECONDS + 60))
          CODE=""
          while :; do
            CODE=$(validate "$T0" || true)
            [ "$CODE" = "401" ] && break
            if [ "$SECONDS" -ge "$until_s" ]; then
              echo "FAIL: pre-rotation token still returns HTTP $CODE after 60s; pruning kept its key (pruned candidates: P=[$P])"
              exit 1
            fi
            sleep 2
          done
          echo "OK: pre-rotation token T0 rejected with HTTP 401 after key [$P] was pruned"

          CODE=$(validate "$T1")
          if [ "$CODE" != "200" ]; then
            echo "FAIL: token T1, signed by key $MAXB, returns HTTP $CODE; pruning dropped a surviving key"
            exit 1
          fi
          echo "OK: token T1 signed by surviving key $MAXB validates (HTTP 200)"

          T2=$(issue_token)
          if [ -z "$T2" ]; then
            echo "FAIL: no token issued after the second rotation"
            exit 1
          fi
          CODE=$(validate "$T2")
          if [ "$CODE" != "200" ]; then
            echo "FAIL: token T2, issued after the second rotation, returns HTTP $CODE"
            exit 1
          fi
          echo "OK: token T2 issued after the second rotation validates (HTTP 200)"
    catch:
    - script:
        content: |
          echo "=== Second rotation Job pods ==="
          kubectl get pods -n $NAMESPACE -l job-name=keystone-fernet-manual-rotate-2 -o wide 2>&1 || true
          for pod in $(kubectl get pods -n $NAMESPACE -l job-name=keystone-fernet-manual-rotate-2 -o name 2>/dev/null); do
            echo "--- $pod logs ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=100 2>&1 || true
            echo "--- $pod previous logs ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=100 --previous 2>&1 || true
            echo "--- $pod describe ---"
            kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -30 || true
          done
          echo "=== Production key names ==="
          kubectl get secret keystone-fernet-fernet-keys -n $NAMESPACE -o json 2>/dev/null \
            | jq -r '.data // {} | keys | join(" ")' 2>&1 || true
          echo "=== API pod key directory ==="
          for pod in $(kubectl get pods -n $NAMESPACE \
              -l app.kubernetes.io/name=keystone,app.kubernetes.io/instance=keystone-fernet,pod-template-hash \
              -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl exec -n $NAMESPACE "$pod" -- python3 -c 'import os; print(" ".join(sorted(os.listdir("/etc/keystone/fernet-keys"))))' 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 9: Pause rotation via spec.fernet.suspend: true (escape hatch) ──
  - try:
    - patch:
        file: 01-patch-suspend-fernet.yaml
  # ── Step 10: Assert CronJob preserved, suspended, schedule unchanged ────
  # suspend pauses rotation without deleting the CronJob and without changing
  # the rotation cadence, so an SRE can resume without churn.
  - try:
    - assert:
        resource:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: keystone-fernet-fernet-rotate
            namespace: openstack
          spec:
            schedule: "0 0 * * 0"
            suspend: true
  # ── Step 11: Assert the operator's metric families ─────────────────────
  # The header of ../../lib/assert-operator-metric-families.sh lists the
  # checks it runs against the cluster-wide release.
  # The rotations of steps 4 and 7 set the age gauge, which no fresh
  # deployment exports.
  - try:
    - script:
        shell: bash
        timeout: 120s
        content: |
          ../../lib/assert-operator-metric-families.sh keystone-system keystone-operator keystone_operator \
            'keystone_operator_key_rotation_age_seconds{keystone="keystone-fernet",namespace="openstack",key_type="fernet"}'
    catch:
    - podLogs:
        namespace: keystone-system
        selector: app.kubernetes.io/instance=keystone-operator
        tail: 200
