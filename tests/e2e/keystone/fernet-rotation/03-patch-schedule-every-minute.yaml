# Patch to run the Fernet rotation CronJob every minute in step 9, so a
# scheduled Job starts at the next minute and a second tick follows one
# minute later.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-fernet
  namespace: openstack
spec:
  fernet:
    rotationSchedule: "* * * * *"
