# Keystone CR fixture for the plugins E2E test.
# Managed mode as in basic-deployment, with one replica. The one plugin
# selects keystone's in-tree strict_two_level unified-limit model, a
# stevedore entry point of namespace keystone.unified_limit.model. The image
# installs keystone with the ldap extra and no other package, so no
# out-of-tree plugin exists to load; this one is resolved through the same
# driver loader an out-of-tree one would be.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-plugins
  namespace: openstack
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao-tenant-store
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_plugins
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
  plugins:
  - name: keystone-unified-limit-strict-two-level
    configSection: unified_limit
    config:
      enforcement_model: strict_two_level
  # Caching is off: the e2e-operator suites run in parallel against one
  # shared `openstack-memcached`, and keystone's cache keys carry no
  # per-instance discriminator, so a neighbouring suite's entry for the
  # `admin@default` user or the `admin` project could answer the token
  # requests of limit_model with a 401 or a 404. #227 tracks per-instance
  # cache keys in the operator.
  extraConfig:
    cache:
      enabled: "false"
