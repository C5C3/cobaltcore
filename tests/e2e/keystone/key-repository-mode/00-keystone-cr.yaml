# Keystone CR fixture for the key-repository-mode E2E test.
# Minimal managed-mode CR cloned from tests/e2e/keystone/basic-deployment;
# the test loads both key repositories through a token and a credential
# round trip on the API pod and reads the logs for the
# `key_repository is world readable` warning, so a single replica is
# sufficient.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-keymode
  namespace: openstack
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao-tenant-store
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_keymode
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
  # Disable dogpile.cache for this fixture, for the reason the
  # ldap-domain-backend fixture gives: parallel Keystone CRs share
  # `openstack-memcached` under the same keys (#227). A neighbouring suite's
  # bootstrap writes get_project_by_name("admin", "default") with its own
  # project, and the project-scoped token request of step 3 then answers
  # HTTP 404 (CI run 44972380549). With the cache off, step 3 also validates
  # its token by decrypting it, not from the entry issue_token cached.
  extraConfig:
    cache:
      enabled: "false"
