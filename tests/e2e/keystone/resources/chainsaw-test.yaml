# Chainsaw E2E test for spec.resources defaulting and propagation.
# Validates that:
#   - A Keystone CR without explicit resources renders the reconcile-time
#     defaults on the Deployment: 100m CPU and 512Mi memory requests, a 512Mi
#     memory limit, and no CPU limit
#   - A running keystone Pod keeps no CPU limit and runs Burstable, so the
#     openstack tenant's LimitRange adds no CPU limit either
#   - The db-sync Job renders the Job defaults: a 100m CPU request, 368Mi
#     memory as request and limit, and no CPU limit
#   - Patching spec.resources updates the Deployment container resources
#   - Removing spec.resources again and raising spec.uwsgi.processes to 4 moves
#     the rendered memory to 800Mi, still with a 100m CPU request and no CPU
#     limit, so the defaults follow the process count through the real webhook
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keystone-resources
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply Keystone CR without explicit resources ────────────────
  - try:
    - apply:
        file: 00-keystone-cr.yaml
  # ── Step 2: Assert Ready and the rendered default resources ─────────────
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-resources
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: keystone-resources
            namespace: openstack
          spec:
            template:
              spec:
                containers:
                - name: keystone
                  resources:
                    requests:
                      memory: 512Mi
                      cpu: 100m
                    limits:
                      memory: 512Mi
                # A partial match would accept a CPU limit beside the memory
                # limit, so its absence is asserted on its own.
                (length(containers[?name == 'keystone'].resources.limits.cpu) == `0`): true
    # The same on a running API Pod: the namespace's LimitRange fills a default
    # limit into a container at admission, so the template alone cannot show
    # that openstack adds no CPU limit. A CPU request without a CPU limit is
    # never Guaranteed. Running excludes the Job and CronJob pods.
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: openstack
            labels:
              app.kubernetes.io/name: keystone
              app.kubernetes.io/instance: keystone-resources
          spec:
            (length(containers[?name == 'keystone'].resources.limits.cpu) == `0`): true
          status:
            phase: Running
            qosClass: Burstable
    # The Job defaults, asserted on the Job template rather than on its Pod:
    # the tenant LimitRange would fill a limit into a Pod that carried none.
    - assert:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: keystone-resources-db-sync
            namespace: openstack
          spec:
            template:
              spec:
                containers:
                - name: db-sync
                  resources:
                    requests:
                      cpu: 100m
                      memory: 368Mi
                    limits:
                      memory: 368Mi
                (length(containers[?name == 'db-sync'].resources.limits.cpu) == `0`): true
    catch:
    - script:
        content: |
          echo "=== All pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Failed Job logs ==="
          for job in $(kubectl get jobs -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $job ---"
            kubectl logs -n $NAMESPACE "$job" --all-containers --tail=100 2>&1 || true
          done
          echo "=== Pod describe ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l job-name -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -40 || true
          done
          echo "=== Deployment resources ==="
          kubectl get deployment keystone-resources -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].resources}' 2>&1 || true
          echo ""
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Patch spec.resources with custom values ─────────────────────
  - try:
    - patch:
        file: 01-patch-custom-resources.yaml
  # ── Step 4: Assert Deployment updated with custom resources ─────────────
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: keystone-resources
            namespace: openstack
          spec:
            template:
              spec:
                containers:
                - name: keystone
                  resources:
                    requests:
                      memory: 512Mi
                      cpu: 200m
                    limits:
                      memory: 1Gi
                      cpu: "1"
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: keystone-resources
            namespace: openstack
          status:
            (updatedReplicas): 3
            (availableReplicas): 3
    catch:
    - podLogs:
        selector: application=keystone
        namespace: openstack
        tail: 50
    - command:
        entrypoint: kubectl
        args:
        - get
        - deployments
        - -n
        - openstack
        - -o
        - yaml
    - events:
        namespace: openstack
  # ── Step 5: Remove spec.resources and raise spec.uwsgi.processes ────────
  - try:
    - patch:
        file: 02-patch-uwsgi-processes.yaml
  # ── Step 6: Assert the rendered defaults follow the process count ───────
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: keystone-resources
            namespace: openstack
          spec:
            template:
              spec:
                containers:
                - name: keystone
                  resources:
                    requests:
                      memory: 800Mi
                      cpu: 100m
                    limits:
                      memory: 800Mi
                (length(containers[?name == 'keystone'].resources.limits.cpu) == `0`): true
    catch:
    - command:
        entrypoint: kubectl
        args:
        - get
        - keystone
        - keystone-resources
        - -n
        - openstack
        - -o
        - yaml
    - command:
        entrypoint: kubectl
        args:
        - get
        - deployment
        - keystone-resources
        - -n
        - openstack
        - -o
        - jsonpath={.spec.template.spec.containers[0].resources}
    - events:
        namespace: openstack
