# Late-created ExternalSecrets for the eso-down failure/recovery E2E test
# (CC-0102, REQ-004).
#
# Why "late-created" and not part of the GitOps inventory?
#   The eso-down test uses unique secretRef names (eso-down-keystone-db,
#   eso-down-keystone-admin) so the operator must materialise the underlying
#   Secrets from zero — this is the core of the WaitForExternalSecret==false
#   branch under test (operators/keystone/internal/controller/
#   reconcile_secrets.go:86). The static GitOps inventory under
#   deploy/eso/externalsecrets/ uses the shared keystone-db / keystone-admin
#   names (CC-0009) and cannot be re-aimed at the test-only target Secret
#   names without polluting every other test that depends on the canonical
#   keystone-db / keystone-admin Secrets.
#
# Why apply AFTER ESO scale-up (Step 5) rather than alongside the CR (Step 3)?
#   ESO is scaled to 0 replicas during Steps 2-4. With no controller running
#   there is no reconciliation loop to update an ExternalSecret's Ready
#   condition, so applying these manifests during the ESO-down window would
#   leave them stuck without a Ready condition for the duration. The
#   downstream WaitForExternalSecret call already returns (false, nil) for
#   that state — the same outcome as for an absent ExternalSecret — and the
#   test's central assertion (SecretsReady=False/WaitingForDBCredentials
#   sustained for >=60s) holds regardless of whether the ExternalSecrets
#   exist yet. Deferring the apply until AFTER ESO scale-up makes the
#   recovery ordering linear (ESO returns -> ExternalSecrets created ->
#   ExternalSecrets reconciled to Ready=True -> Secrets materialised ->
#   operator's SecretsReady flips to True), which removes a class of subtle
#   sync races that would otherwise complicate failure diagnosis.
#
# This is the same pattern as tests/e2e/keystone/missing-secret/01-late-
# secrets.yaml (CC-0016), which ships the late-applied ExternalSecrets that
# the missing-secret recovery step relies on.
#
# REQ-004 (CC-0102)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-down-keystone-db
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: eso-down-keystone-db
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: openstack/keystone/db
      property: username
  - secretKey: password
    remoteRef:
      key: openstack/keystone/db
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-down-keystone-admin
  namespace: openstack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: eso-down-keystone-admin
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: bootstrap/keystone-admin
      property: password
