# Patch to start a sequential upgrade from 2026.1 to 2026.2. 2026.2 is a valid
# sequential target (same year, minor 1 -> 2); the operator keys the upgrade on
# the tag and runs the db-expand Job on <repository>:<new tag>. The repository
# sits under the reserved .invalid TLD (RFC 2606), which never resolves, so the
# db-expand Job pod stays in ImagePullBackOff and the upgrade wedges in the
# Expanding phase. That holds once a 2026.2 image exists too: pointing the tag
# alone at an unloaded release worked only until the release was added.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-upgrade-abort
  namespace: openstack
spec:
  image:
    repository: registry.invalid/c5c3/keystone
    tag: "2026.2"
