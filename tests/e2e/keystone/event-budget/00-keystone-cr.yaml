# Keystone CR fixture for the event-budget E2E test
# (CC-0103, parent #277 Phase 1).
# Managed mode: database via clusterRef to openstack-db,
# cache via clusterRef to openstack-memcached. Mirrors
# tests/e2e/keystone/events/00-keystone-cr.yaml exactly except for
# metadata.name and the database name.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-event-budget
  namespace: openstack
spec:
  replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_event_budget
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
