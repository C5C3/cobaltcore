# Chainsaw E2E test for NetworkPolicy reconciliation.
# Verifies that the operator creates, updates, and deletes NetworkPolicies
# based on spec.networkPolicy:
#   - Initial deployment with ingress from envoy-gateway-system namespace, the
#     auto-whitelisted operator namespace, and auto-derived egress (issue #461)
#   - The rendered policy is enforced: probe pods are dropped and admitted as
#     its rules say (Step 3)
#   - Update ingress sources (add the keystone-netpol-outside namespace), after
#     which its client reaches TCP 5000 (Step 5)
#   - Disable networkPolicy (NetworkPolicy deleted)
#
# ENFORCEMENT: the kindnetd of kind v0.32 and later (CI pins KIND_VERSION)
# enforces NetworkPolicy. The suite asserts the policy the operator renders
# and then probes it with the four pods of 03-probe-pods.yaml through
# ../../lib/assert-networkpolicy-enforced.sh (Step 3):
#   - the target, which carries the policy's selector labels, is dropped on
#     sink port 9999, which no egress rule admits;
#   - it resolves a cluster name, which the DNS rule admits;
#   - it reaches the sink on TCP 3306, 6443 and 11211, every TCP egress port
#     the policy admits but 53 and 443;
#   - a client in keystone-system, the operator namespace, is dropped on
#     target port 9999, which no ingress rule admits, and reaches TCP 5000;
#   - a client in keystone-netpol-outside is dropped on TCP 5000 until the
#     update patch admits its namespace (Step 5).
# On a CNI that does not enforce NetworkPolicy the first probe fails with "was
# never dropped". TCP 53 and 443 are not probed: the sink listens on
# unprivileged ports only, DNS is probed by resolution, and Step 2 pins both
# rules.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keystone-network-policy
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply Keystone CR with networkPolicy ─────────────────────────
  - try:
    - apply:
        file: 00-keystone-cr.yaml
  # ── Step 2: Assert NetworkPolicyReady and NetworkPolicy created ──────────
  # The aggregate Ready condition is not asserted here: it depends on the full
  # Keystone stack (DB schema sync, bootstrap, key rotation) reaching readiness,
  # which is exercised by the basic-deployment and rotation suites. This suite
  # scopes to NetworkPolicy reconciliation — the NetworkPolicyReady condition
  # plus the rendered ingress peers (user source + auto-whitelisted operator
  # namespace) and auto-derived egress ports asserted below (issue #461).
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyReady
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: keystone-netpol
            namespace: openstack
            labels:
              app.kubernetes.io/name: keystone
              app.kubernetes.io/instance: keystone-netpol
              app.kubernetes.io/managed-by: keystone-operator
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: keystone
                app.kubernetes.io/instance: keystone-netpol
            policyTypes:
            - Ingress
            - Egress
            ingress:
            - ports:
              - protocol: TCP
                port: 5000
              from:
              # User-declared source.
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway-system
              # Operator namespace, auto-whitelisted so reconcileHealthCheck can
              # reach the Keystone API (issue #461). NAMESPACE defaults to
              # keystone-system in the CI deploy (hack/ci-deploy-operator.sh); a
              # job overriding NAMESPACE must update this peer.
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: keystone-system
            # Auto-derived egress (issue #461), asserted declaratively in the
            # reconciler's deterministic order (DNS, kube-apiserver, database,
            # cache) using the same int-typed scalar form chainsaw matches for
            # the ingress port above. A JMESPath `contains()` over the port list
            # does not match here: the rendered ports are integers and chainsaw's
            # contains() compares values by strict type.
            egress:
            # DNS (UDP+TCP 53).
            - ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
            # kube-apiserver (TCP 443+6443) for the rotation CronJob pods that
            # share this policy's selector.
            - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
            # Database (TCP 3306, managed-mode default).
            - ports:
              - protocol: TCP
                port: 3306
            # Cache (TCP 11211, managed-mode default).
            - ports:
              - protocol: TCP
                port: 11211
    catch:
    - script:
        content: |
          echo "=== All pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Failed Job logs ==="
          for job in $(kubectl get jobs -n $NAMESPACE -o name 2>/dev/null); do
            echo "--- $job ---"
            kubectl logs -n $NAMESPACE "$job" --all-containers --tail=100 2>&1 || true
          done
          echo "=== Pod describe ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l job-name -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -30 || true
          done
          echo "=== Job status ==="
          kubectl get jobs -n $NAMESPACE -o wide 2>&1 || true
          echo "=== ConfigMap content ==="
          for cm in $(kubectl get cm -n $NAMESPACE -o name 2>/dev/null | grep config-); do
            echo "--- $cm ---"
            kubectl get -n $NAMESPACE "$cm" -o jsonpath='{.data}' 2>&1 || true
          done
          echo "=== NetworkPolicy status ==="
          kubectl get networkpolicy -n $NAMESPACE -o wide 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Probe the enforced policy ────────────────────────────────────
  # The pods of 03-probe-pods.yaml stand in for the Keystone pods (see
  # ENFORCEMENT above). kindnet adds a new pod to its policy set a moment
  # after the pod starts, so the first dropped probe polls until the target's
  # connection times out. The inside client's open probe then shows that
  # kindnet knows the clients, which start together, so the outside client's
  # drop comes from the policy. The trailing dot keeps the resolver off the
  # search list.
  - try:
    - apply:
        file: 03-probe-pods.yaml
    - script:
        timeout: 8m
        content: |
          set -eu
          kubectl wait --for=condition=Ready --timeout=120s -n openstack \
            pod/keystone-netpol-probe-target pod/keystone-netpol-probe-sink
          kubectl wait --for=condition=Ready --timeout=120s -n keystone-system pod/keystone-netpol-probe-inside
          kubectl wait --for=condition=Ready --timeout=120s -n keystone-netpol-outside pod/keystone-netpol-probe-outside
          TARGET="$(kubectl get pod keystone-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          SINK="$(kubectl get pod keystone-netpol-probe-sink -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ] || [ -z "${SINK}" ]; then
            echo "ERROR: a probe pod has no pod IP (target '${TARGET}', sink '${SINK}')"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          # Egress of the pod the policy selects. The first drop proves kindnet holds it.
          "${PROBE}" openstack keystone-netpol-probe-target dropped "${SINK}" 9999
          "${PROBE}" openstack keystone-netpol-probe-target resolves kubernetes.default.svc.cluster.local.
          "${PROBE}" openstack keystone-netpol-probe-target open "${SINK}" 3306 6443 11211
          # Ingress into it: a port no rule admits, then the API port from an admitted
          # and from a foreign namespace.
          "${PROBE}" keystone-system keystone-netpol-probe-inside dropped "${TARGET}" 9999
          "${PROBE}" keystone-system keystone-netpol-probe-inside open "${TARGET}" 5000
          "${PROBE}" keystone-netpol-outside keystone-netpol-probe-outside dropped "${TARGET}" 5000
    catch:
    - script:
        timeout: 2m
        content: |
          echo "=== Probe pods ==="
          kubectl get pods -A -l app.kubernetes.io/instance=keystone-netpol -o wide --show-labels 2>&1 || true
          for ref in openstack/keystone-netpol-probe-target openstack/keystone-netpol-probe-sink \
            keystone-system/keystone-netpol-probe-inside keystone-netpol-outside/keystone-netpol-probe-outside; do
            echo "--- ${ref} ---"
            kubectl logs -n "${ref%%/*}" "${ref#*/}" 2>&1 || true
            kubectl describe pod -n "${ref%%/*}" "${ref#*/}" 2>&1 | tail -20 || true
          done
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicy -n openstack -l app.kubernetes.io/instance=keystone-netpol -o yaml 2>&1 || true
          echo "=== Events (keystone-netpol-outside) ==="
          kubectl get events -n keystone-netpol-outside 2>&1 || true
  # ── Step 4: Update ingress sources ───────────────────────────────────────
  - try:
    - patch:
        file: 01-patch-update-ingress.yaml
  # ── Step 5: Assert NetworkPolicy updated with both ingress sources ───────
  - try:
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: keystone-netpol
            namespace: openstack
          spec:
            ingress:
            - ports:
              - protocol: TCP
                port: 5000
              from:
              # User-declared sources (envoy-gateway-system +
              # keystone-netpol-outside) plus the auto-whitelisted operator
              # namespace, in build order.
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway-system
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: keystone-netpol-outside
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: keystone-system
    # The patch admits keystone-netpol-outside, so its client, which Step 3
    # saw dropped, now reaches the API port. That proves the patched policy is
    # enforced and the earlier drop came from the policy.
    - script:
        timeout: 2m
        content: |
          set -eu
          TARGET="$(kubectl get pod keystone-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ]; then
            echo "ERROR: the probe target has no pod IP"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          "${PROBE}" keystone-netpol-outside keystone-netpol-probe-outside open "${TARGET}" 5000
  # ── Step 6: Disable networkPolicy ────────────────────────────────────────
  - try:
    - patch:
        file: 02-patch-disable-networkpolicy.yaml
  # ── Step 7: Assert NetworkPolicy deleted and condition updated ───────────
  - try:
    - assert:
        resource:
          apiVersion: keystone.openstack.c5c3.io/v1alpha1
          kind: Keystone
          metadata:
            name: keystone-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
    - script:
        content: |
          # Verify NetworkPolicy no longer exists.
          if kubectl get networkpolicy keystone-netpol -n $NAMESPACE 2>/dev/null; then
            echo "FAIL: NetworkPolicy should have been deleted"
            exit 1
          fi
          echo "PASS: NetworkPolicy correctly deleted"
