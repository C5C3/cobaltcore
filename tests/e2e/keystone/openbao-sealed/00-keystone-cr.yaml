# Keystone CR fixture for the openbao-sealed failure/recovery E2E test (CC-0102).
#
# Managed mode: database via clusterRef to openstack-db, cache via clusterRef
# to openstack-memcached. Modelled on tests/e2e/keystone/basic-deployment/
# 00-keystone-cr.yaml so the test inherits the operator-managed
# MariaDB User/Database/Grant chain for free (REQ-009).
#
# Unique name (keystone-openbao-sealed) and database (keystone_openbao_sealed)
# avoid collisions with other tests sharing the openstack namespace.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-openbao-sealed
  namespace: openstack
spec:
  replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_openbao_sealed
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
