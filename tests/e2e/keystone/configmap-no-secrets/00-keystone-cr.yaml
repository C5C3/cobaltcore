# Keystone CR fixture for the configmap-no-secrets E2E test (CC-0080).
# Managed mode: database via clusterRef to openstack-db,
# cache via clusterRef to openstack-memcached. Minimal 1-replica
# configuration used to validate that the rendered keystone.conf
# contains only a placeholder DB connection URL and that the real
# credentials flow through the derived <name>-db-connection Secret
# referenced via OS_DATABASE__CONNECTION env vars.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-no-secrets
  namespace: openstack
spec:
  replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_no_secrets
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
