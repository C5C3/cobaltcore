# Second KeystoneIdentityBackend attaching the Keycloak "cobaltcore2" realm — the
# multi-realm proof: the shared sidecar serves both realms' metadata from
# one OIDCMetadataDir and each per-IdP websso Location pins its own issuer.
# No oauth2Introspection here: the OIDCOAuth* directives are server-scoped,
# so only one backend per Keystone may enable them (webhook-enforced) — the
# multi-realm assertions ride the websso flow instead.
#
# Discovery mode, not explicit endpoints: this backend omits spec.oidc.endpoints
# so the defaulting webhook derives providerMetadataURL from the issuer and the
# operator fetches .well-known/openid-configuration from the in-cluster Keycloak
# (a ClusterIP in kind's Service CIDR). The CI deploy passes
# --federation-metadata-allow-cidrs=10.96.0.0/12 (kind's Service CIDR) so the
# operator's SSRF dial guard permits that private-address fetch. Backend one
# (02-backend-cr.yaml) keeps explicit endpoints, so both discovery shapes stay
# covered end-to-end.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: KeystoneIdentityBackend
metadata:
  name: keycloak-cobaltcore2
  namespace: openstack
spec:
  keystoneRef:
    name: keystone-oidc
  domain:
    name: cobaltcore2
    mode: Manage
    deletionPolicy: Delete
    description: Keycloak cobaltcore2 realm
  type: OIDC
  oidc:
    issuer: http://keycloak.openstack.svc.cluster.local:8080/realms/cobaltcore2
    clientID: keystone
    clientSecretRef:
      name: keycloak-cobaltcore2-client
  mappings:
  - remote:
    - type: HTTP_OIDC_ISS
      anyOneOf:
      - http://keycloak.openstack.svc.cluster.local:8080/realms/cobaltcore2
    - type: HTTP_OIDC_PREFERRED_USERNAME
    local:
    # {0}, not {1}: the HTTP_OIDC_ISS anyOneOf rule is a condition and is not
    # added to the positional direct-map tuple, so HTTP_OIDC_PREFERRED_USERNAME
    # is index 0 (see the keycloak-cobaltcore backend for the full rationale).
    - user:
        name: "{0}"
      group:
        name: federated-captains
        domain:
          name: cobaltcore2
  groups:
  - name: federated-captains
    description: Federated Keycloak cobaltcore2 users
    roleAssignments:
    - role: member
      domain: true
