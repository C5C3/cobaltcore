# Patch to re-enable keep-alive with an idle timeout of 5 seconds.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-uwsgi
  namespace: openstack
spec:
  uwsgi:
    httpKeepAlive: true
    httpKeepAliveTimeout: 5
