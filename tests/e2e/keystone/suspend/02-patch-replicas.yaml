# Patch to change the replica count while the Keystone CR is suspended.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-suspend
  namespace: openstack
spec:
  deployment:
    replicas: 3
