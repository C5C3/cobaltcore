# Patch that removes the opt-in. Chainsaw merge-patches with this manifest,
# setting spec.deployment.verticalAutoscaling to null.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-vertical
  namespace: openstack
spec:
  deployment:
    verticalAutoscaling: null
