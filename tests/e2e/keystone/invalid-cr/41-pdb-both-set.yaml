# spec.podDisruptionBudget sets both minAvailable and maxUnavailable. The CEL
# rule on the shared PodDisruptionBudgetSpec answers first with "exactly one
# of minAvailable or maxUnavailable must be set"; the webhook mirrors it
# (validation.PodDisruptionBudgetValues).
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: invalid-pdb-both-set
spec:
  deployment:
    replicas: 3
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    host: db.example.com
    port: 3306
    database: keystone
    secretRef:
      name: keystone-db
  cache:
    backend: dogpile.cache.pymemcache
    servers:
    - "mc:11211"
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
  podDisruptionBudget:
    minAvailable: 1
    maxUnavailable: 1
