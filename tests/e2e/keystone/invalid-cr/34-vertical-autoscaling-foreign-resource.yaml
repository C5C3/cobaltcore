# spec.deployment.verticalAutoscaling.minAllowed naming ephemeral-storage
# violates the CEL rule on VerticalAutoscalingSpec; the webhook mirrors it. The
# VPA the operator writes controls cpu and memory only.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: invalid-vpa-foreign-resource
spec:
  deployment:
    replicas: 3
    verticalAutoscaling:
      updateMode: "Off"
      minAllowed:
        ephemeral-storage: 1Gi
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2025.2"
  database:
    host: db.example.com
    port: 3306
    database: keystone
    secretRef:
      name: keystone-db
  cache:
    backend: dogpile.cache.pymemcache
    servers:
    - "mc:11211"
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
