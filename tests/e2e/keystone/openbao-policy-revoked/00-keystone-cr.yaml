# Keystone CR fixture for the openbao-policy-revoked failure/recovery E2E
# test (CC-0102).
#
# Managed mode: database via clusterRef to openstack-db, cache via clusterRef
# to openstack-memcached. Modelled on tests/e2e/keystone/basic-deployment/
# 00-keystone-cr.yaml so the test inherits the operator-managed
# MariaDB User/Database/Grant chain for free (REQ-009).
#
# fernet.rotationSchedule = "0 0 * * 0" (weekly Sunday 00:00 UTC). The test
# does NOT wait for the schedule to fire — it forces a rotation via
# `kubectl create job --from=cronjob/keystone-policy-revoked-fernet-rotate
# keystone-policy-revoked-manual-rotate`. The schedule value is therefore
# irrelevant to test timing; it just has to be a valid cron string so the
# operator creates the CronJob (which is what `kubectl create job --from=` then
# clones from). REQ-003 (CC-0102).
#
# Unique name (keystone-policy-revoked) and database (keystone_policy_revoked)
# avoid collisions with other tests sharing the openstack namespace (REQ-009).
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-policy-revoked
  namespace: openstack
spec:
  replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_policy_revoked
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
