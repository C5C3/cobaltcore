# Patch: set the Keystone API PodDisruptionBudget to maxUnavailable: 1.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-scale
  namespace: openstack
spec:
  podDisruptionBudget:
    maxUnavailable: 1
