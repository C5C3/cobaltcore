      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keystone-db
  namespace: keystone-mns-b
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tenant-store
    kind: SecretStore
  target:
    name: keystone-db
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: openstack/keystone/keystone-mns-b/mns/db
      property: username
  - secretKey: password
    remoteRef:
      key: openstack/keystone/keystone-mns-b/mns/db
      property: password
---
