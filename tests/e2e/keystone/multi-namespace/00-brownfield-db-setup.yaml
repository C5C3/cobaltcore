# Brownfield MariaDB Database/User/Grant pre-creation for the multi-namespace
# E2E test.
#
# The three Keystones live outside `openstack`, and Database.ClusterRef /
# Cache.ClusterRef are LocalObjectReferences, so they reach the shared
# openstack/openstack-db and openstack/openstack-memcached in brownfield mode
# (database.host + cache.servers), as pod-security-restricted does. These CRs
# therefore live in `openstack`, beside openstack-db.
#
# One schema per namespace, keystone_mns_a to keystone_mns_c, each granted to
# the canonical `keystone` MariaDB user. The User CR manages that user against
# the existing openstack/keystone-db Secret, as brownfield-database and
# pod-security-restricted do, so all of them reconcile the same password onto
# it. `cleanupPolicy: Skip` keeps the user and the schemas when the CRs are
# deleted, so a sibling suite still using the user is not stranded.
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: keystone-mns-a-db
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  characterSet: utf8
  collate: utf8_general_ci
  name: keystone_mns_a
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: keystone-mns-b-db
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  characterSet: utf8
  collate: utf8_general_ci
  name: keystone_mns_b
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: keystone-mns-c-db
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  characterSet: utf8
  collate: utf8_general_ci
  name: keystone_mns_c
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: keystone-mns-user
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  name: keystone
  passwordSecretKeyRef:
    name: keystone-db
    key: password
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: keystone-mns-a-grant
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  privileges:
  - "ALL PRIVILEGES"
  database: keystone_mns_a
  table: "*"
  username: keystone
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: keystone-mns-b-grant
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  privileges:
  - "ALL PRIVILEGES"
  database: keystone_mns_b
  table: "*"
  username: keystone
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: keystone-mns-c-grant
  namespace: openstack
spec:
  mariaDbRef:
    name: openstack-db
  cleanupPolicy: Skip
  privileges:
  - "ALL PRIVILEGES"
  database: keystone_mns_c
  table: "*"
  username: keystone
