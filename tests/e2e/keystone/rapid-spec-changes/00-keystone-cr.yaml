# Keystone CR fixture for the rapid-spec-changes E2E test.
# Managed mode as in basic-deployment, with one replica. The suite moves
# [token] expiration twelve times in a burst and reads the last value back
# from the token lifetime the API issues.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-rapid
  namespace: openstack
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao-tenant-store
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_rapid
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
  # [token] expiration starts at keystone's default and is the value the burst
  # moves. Caching is off: the e2e-operator suites run in parallel against one
  # shared `openstack-memcached`, and keystone's cache keys carry no
  # per-instance discriminator, so a neighbouring suite's entry for the
  # `admin@default` user or the `admin` project could answer the token request
  # of step 2 with a 401 or a 404. #227 tracks per-instance cache keys in the
  # operator.
  extraConfig:
    token:
      expiration: "3600"
    cache:
      enabled: "false"
