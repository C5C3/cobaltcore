# Valid policy source ConfigMap for the policy-validation-gating E2E test (CC-0058).
# Replaces the invalid ConfigMap to test the failure-to-success transition.
# Contains syntactically valid oslo.policy rules that oslopolicy-validator accepts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keystone-pv-gate-policy-source
  namespace: openstack
data:
  policy.yaml: |
    "identity:list_users": "role:admin"
    "identity:get_user": "role:admin or user_id:%(target.user.id)s"
    "identity:create_project": "role:admin"
