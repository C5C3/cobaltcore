# Keystone CR fixture for the credential-rotation E2E test.
# Managed mode with explicit credential key rotation schedule.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-credential
  namespace: openstack
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao-tenant-store
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_credential
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: openstack-memcached
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  credentialKeys:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
  # Disable dogpile.cache for this fixture, for the reason the fernet-rotation
  # fixture gives: parallel Keystone CRs share `openstack-memcached`, so a
  # concurrent instance's cached `admin@default` lookup can answer the admin
  # authentication of step 6 with a 401. With the cache off, step 6 also reads
  # its credential from the database, not from a cached row.
  extraConfig:
    cache:
      enabled: "false"
