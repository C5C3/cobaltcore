# Admission policy that refuses the staging PATCH of the credential rotation
# Job of keystone-credential in step 6. It matches only an UPDATE (the API
# server admits a PATCH as UPDATE) of the staging Secret
# keystone-credential-credential-keys-rotation in openstack by the rotation
# ServiceAccount, so the operator's own writes pass. Step 6 applies and
# deletes both objects itself, because it lifts the policy partway through the
# step.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: keystone-credential-refuse-staging-patch
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["secrets"]
      resourceNames: ["keystone-credential-credential-keys-rotation"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openstack
  matchConditions:
  - name: rotation-service-account
    expression: "request.userInfo.username == 'system:serviceaccount:openstack:keystone-credential-credential-rotate'"
  validations:
  - expression: "false"
    message: credential-rotation e2e refuses the staging PATCH once
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: keystone-credential-refuse-staging-patch
spec:
  policyName: keystone-credential-refuse-staging-patch
  validationActions: [Deny]
