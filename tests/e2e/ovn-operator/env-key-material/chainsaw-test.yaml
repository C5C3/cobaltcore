# Chainsaw E2E test: the ovn-operator's process environment holds no key
# material.
#
# ../../lib/assert-operator-env-clean.sh reads the spec of the operator pod that
# hack/ci-deploy-operator.sh deployed into ovn-system and, through an
# ephemeral container, the environment of its running manager. It fails on env
# read from a Secret, on a name such as DB_PASSWORD and on a value such as a
# PEM block, and names the variable without printing its value.
#
# The operator image is a static binary without a shell, so the ephemeral
# container runs ghcr.io/c5c3/ovn:<pin>, the OVN daemon image the
# ovn leg of the e2e-operator job loads onto the node. <pin> is the version
# hack/ci-resolve-ovn-version.sh reads from images/ovn/source.json, the same
# script the leg resolves the image with.
# The scan adds one ephemeral container to the pod, which Kubernetes cannot
# remove again; apart from that it only reads.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ovn-env-key-material
spec:
  # The operator's own namespace exists before the suite runs, so chainsaw
  # neither creates nor deletes it.
  namespace: ovn-system
  steps:
  - name: scan
    try:
    - script:
        timeout: 180s
        content: |
          tag="$(../../../../hack/ci-resolve-ovn-version.sh)" || exit 1
          [ -n "$tag" ] || { echo "FAIL: hack/ci-resolve-ovn-version.sh printed no OVN version"; exit 1; }
          ../../lib/assert-operator-env-clean.sh ovn-system ovn-operator "ghcr.io/c5c3/ovn:$tag"
    catch:
    # States only: the log of an env-scan container holds the values the scan
    # judged, every line of a multi-line one included, and a CI log must not
    # repeat them, so the catch never reads it.
    - script:
        content: |
          for pod in $(kubectl get pods -n ovn-system -l app.kubernetes.io/instance=ovn-operator -o name 2>/dev/null); do
            echo "=== $pod: ephemeral containers ==="
            kubectl get "$pod" -n ovn-system -o jsonpath='{range .status.ephemeralContainerStatuses[*]}{.name}{" "}{.state}{"\n"}{end}' 2>&1 || true
          done
