# Nova CR for the db-archive E2E test (2025.2 release).
#
# Managed mode throughout: the two schemas nova_archive_api and nova_archive
# on the openstack-db MariaDB cluster (cell0 is derived as
# nova_archive_cell0), the openstack-memcached cache, the ESO-synced
# nova-api-db and nova-db credentials and the pre-seeded keystone-admin
# service-user password (all from deploy/kind/infrastructure).
#
# The bus is the per-suite vhost broker-vhost.sh writes into
# nova-archive-messaging. Managed messaging is not usable here: the URL it
# renders always names the root vhost, so two suites would share the
# scheduler and conductor RPC topics.
#
# One API replica. This suite asserts nothing about the PodDisruptionBudget the
# second replica of ../basic-deployment exists for, and the node already runs
# six services. The scheduler, the conductor, the metadata API and the console
# proxy take the webhook's defaults.
#
# allow_resize_to_same_host is the suite's only override. The resize step has
# one compute to land on, and nova refuses to resize onto the source host
# unless it is switched on. The option is not rendered by the operator (it is
# listed in operators/nova/api/v1alpha1/catalogs/2025.2.json), so
# ExtraConfigHealthy stays True on NoOwnedKeysOverridden.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-archive
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  api:
    deployment:
      replicas: 1
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_archive_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_archive
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: nova-archive-messaging
  keystoneEndpoint: http://keystone-nova-archive.openstack.svc.cluster.local:5000/v3
  region: RegionOne
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-archive-metadata-secret
  extraConfig:
    DEFAULT:
      allow_resize_to_same_host: "true"
  # The archive under test. A minute schedule is what makes the suite short
  # enough to run at all: the default is @daily, so no run would fire inside
  # it. The webhook checks the cron grammar rather than a CRD pattern and
  # accepts any valid expression (operators/nova/api/v1alpha1/nova_webhook.go).
  # The row cap is the operator default spelled out, well above the handful of
  # rows one deleted server leaves behind.
  #
  # No retentionDays: without a window the run passes no --before, so a row
  # soft-deleted seconds earlier is already eligible
  # (operators/nova/internal/controller/reconcile_dbarchive.go).
  dbArchive:
    schedule: "* * * * *"
    maxRows: 1000
