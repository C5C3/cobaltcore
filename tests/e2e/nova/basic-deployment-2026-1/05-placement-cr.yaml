# Placement CR for the basic-deployment E2E test (2026.1 release).
#
# The scheduler picks a host by asking Placement for allocation candidates, and
# nova-compute publishes the resource provider its inventory hangs off. Without
# this service a server never leaves the scheduling step, so the suite runs one
# Placement of its own on the schema placement_nova_basic_2026_1.
#
# One replica: the suite issues a handful of requests, and the node already
# carries a Keystone, an OVN control plane, a Neutron, a Glance and the five
# Nova workloads.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-nova-basic-2026-1
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: placement_nova_basic_2026_1
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone-nova-basic-2026-1.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
