# Patch: scale the Nova API from 3 to 5 replicas.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-scale
  namespace: openstack
spec:
  api:
    deployment:
      replicas: 5
