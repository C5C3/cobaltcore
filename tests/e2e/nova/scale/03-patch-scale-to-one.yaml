# Patch: scale the Nova API down to a single replica (the PDB flips to
# maxUnavailable=1 to avoid a drain deadlock).
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-scale
  namespace: openstack
spec:
  api:
    deployment:
      replicas: 1
