# Nova CR for the scaling E2E test (2025.2 release).
#
# The light fixture tier: no Keystone, no Placement, no Neutron and no Glance
# run beside it. A Nova reaches Ready with only Secrets and the broker, because
# the API and metadata probes GET the API root and the scheduler and conductor
# probes read the broker socket. spec.keystoneEndpoint is a convention URL
# nothing serves, and spec.serviceUser reads the kind-only keystone-admin
# Secret from deploy/kind/infrastructure.
#
# The two schemas nova_scale_api and nova_scale live on the openstack-db
# MariaDB cluster (cell0 is derived as nova_scale_cell0), the cache is
# openstack-memcached, and the credentials are the ESO-synced nova-api-db and
# nova-db Secrets.
#
# The bus is the per-suite vhost broker-vhost.sh writes into
# nova-scale-messaging. Managed messaging is not usable here: the URL it
# renders always names the root vhost, so two suites would share the scheduler
# and conductor RPC topics.
#
# The API starts at three replicas, which is what makes the PodDisruptionBudget
# assertion meaningful: the shared builder renders minAvailable=1 above one
# replica and maxUnavailable=1 at exactly one, and the suite patches across
# that boundary. The scheduler runs two, so a second pod name registers under
# the same RPC topic. The scheduler, the conductor, the metadata API and the
# console proxy are the control group: they are sized by their own spec fields,
# so a builder that read the API replica count for every workload would scale
# them along and only their assertions would catch it.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-scale
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  api:
    deployment:
      replicas: 3
  scheduler:
    deployment:
      replicas: 2
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_scale_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_scale
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: nova-scale-messaging
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-scale-metadata-secret
