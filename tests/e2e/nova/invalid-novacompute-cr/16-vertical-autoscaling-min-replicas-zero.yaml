# spec.verticalAutoscaling.minReplicas of zero violates the Minimum=1 marker;
# the webhook mirrors it.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  verticalAutoscaling:
    updateMode: Auto
    minReplicas: 0
