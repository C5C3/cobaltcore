# spec.libvirt.virtType outside the CRD enum (kvm, qemu). The schema enum is
# the sole gate.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  libvirt:
    virtType: xen
