# spec.image with neither a tag nor a digest violates the CEL rule on the
# shared ImageSpec: at least one of the two names the image.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  image:
    repository: ghcr.io/c5c3/nova-compute
