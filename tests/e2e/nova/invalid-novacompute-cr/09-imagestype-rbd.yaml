# spec.libvirt.imagesType rbd is outside the CRD enum (default, qcow2, raw,
# flat): the nova-compute image carries no Ceph client and no pod mounts a
# ceph.conf, so an rbd backend could not start.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  libvirt:
    imagesType: rbd
