# spec.verticalAutoscaling.updateMode outside Off, Initial, Recreate and Auto
# violates the Enum marker; the webhook mirrors it.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  verticalAutoscaling:
    updateMode: Sometimes
