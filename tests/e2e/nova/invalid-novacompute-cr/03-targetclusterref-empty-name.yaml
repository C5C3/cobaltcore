# spec.targetClusterRef.name empty violates the MinLength=1 marker on the
# shared TargetClusterRefSpec. An unnamed target names no registered
# cluster, so the operator would have nowhere to place the DaemonSet. The
# webhook repeats it via validation.TargetClusterRef, but the schema answers
# first.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  targetClusterRef:
    name: ""
