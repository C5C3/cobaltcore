# Two spec.hostTraits entries for one node violate the list-map key
# nodeName: one node has one list of traits. The schema is the sole gate.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  hostTraits:
  - nodeName: n1
    traits:
    - CUSTOM_A
  - nodeName: n1
    traits:
    - CUSTOM_B
