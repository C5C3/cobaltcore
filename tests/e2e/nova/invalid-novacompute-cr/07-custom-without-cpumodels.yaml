# spec.libvirt.cpuMode custom without cpuModels violates the same CEL rule:
# nova-compute refuses to start on a custom mode that names no CPU model.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  libvirt:
    cpuMode: custom
