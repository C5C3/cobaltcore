# spec.nodeSelector empty violates the MinProperties=1 marker. An empty
# selector matches every node rather than none, so it would start
# nova-compute on the control-plane nodes too. The webhook repeats the
# check, but the schema answers first.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector: {}
