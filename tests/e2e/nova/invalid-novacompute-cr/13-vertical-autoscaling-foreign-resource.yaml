# spec.verticalAutoscaling.minAllowed naming ephemeral-storage violates the CEL
# rule on VerticalAutoscalingSpec; the webhook mirrors it. The VPA the operator
# writes controls cpu and memory only.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  verticalAutoscaling:
    updateMode: "Off"
    minAllowed:
      ephemeral-storage: 1Gi
