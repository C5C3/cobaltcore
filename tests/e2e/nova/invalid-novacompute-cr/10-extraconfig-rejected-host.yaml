# spec.extraConfig [DEFAULT] host is rejected by the validating webhook
# alone: extraConfig is a free-form map the schema cannot constrain. The host
# is the node name, from the downward API, and the aggregates, the drain and
# openstack-hypervisor-operator all find the service by it.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  extraConfig:
    DEFAULT:
      host: compute-1
