# spec.updateStrategy.maxUnavailable paired with OnDelete is rejected by the
# validating webhook alone: the field is an int-or-string with no marker to
# correlate it with the type, and under OnDelete nothing reads it.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: NovaCompute
metadata:
  name: pool
spec:
  novaRef:
    name: nova
  nodeSelector:
    openstack.c5c3.io/nova-compute-pool: a
  updateStrategy:
    type: OnDelete
    maxUnavailable: 1
