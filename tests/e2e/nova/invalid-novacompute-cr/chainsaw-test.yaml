# Chainsaw E2E tests for NovaCompute CRD + webhook validation rejection.
# Pins every implemented kubebuilder-marker and webhook.validate() rejection
# path in operators/nova/api/v1alpha1/novacompute_* to a deterministic
# admission failure. Each step applies an otherwise-valid NovaCompute CR with a
# single aspect violating the rule under test, captures the admission $error,
# and asserts the field path plus message substring.
#
# The API server validates against the structural schema and its CEL rules
# before it calls the validating webhook, so a rule carried by both layers is
# answered by the schema and the assertions below quote the schema message. The
# webhook message is asserted only where the rule has no schema counterpart: the
# metadata.name bound, the two offboarding tolerations, the rejected
# extraConfig key and maxUnavailable under OnDelete.
#
# The test runs in an ephemeral namespace: the fixtures reference a Nova that
# does not exist there, which admission deliberately tolerates, so the dangling
# reference never competes with the rule a fixture pins.
#
# All fixtures are generated from the single canonical scaffold in
# `_generate.py`. After editing the scaffold or any per-fixture override,
# regenerate via:
#   python3 tests/e2e/nova/invalid-novacompute-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes
# `_generate.py --check` (drift mode, both directions incl. orphans) and
# `test_generate.py` (FIXTURES count + chainsaw-test.yaml cross-reference).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nova-invalid-novacompute-cr
spec:
  steps:
  # spec.novaRef.name empty must be rejected by the MinLength=1 marker on
  # NovaRef, which answers before the webhook's field.Required twin.
  - try:
    - apply:
        file: 00-novaref-name-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'novaRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.nodeSelector empty must be rejected by the MinProperties=1 marker: an
  # empty selector matches every node rather than none.
  - try:
    - apply:
        file: 01-nodeselector-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'nodeSelector')): true
            (contains($error, 'should have at least 1 properties')): true
  # A metadata.name past 63 characters must be rejected by the validating
  # webhook: it is the instance label of every child.
  - try:
    - apply:
        file: 02-name-too-long.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'metadata.name')): true
            (contains($error, 'name must be at most 63 characters')): true
  # spec.targetClusterRef.name empty must be rejected by the MinLength=1 marker
  # on the shared TargetClusterRefSpec, which answers before the webhook twin.
  - try:
    - apply:
        file: 03-targetclusterref-empty-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'targetClusterRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # A toleration of the offboarding taint without tolerationSeconds must be
  # rejected by the validating webhook: hvo waits for the pod to leave before it
  # deletes the compute service.
  - try:
    - apply:
        file: 04-toleration-offboarding.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.tolerations[0]')): true
            (contains($error, 'tolerates kvm.cloud.sap/offboarding:NoExecute')): true
  # The keyless Exists toleration tolerates the offboarding taint too and is
  # rejected under the same message.
  - try:
    - apply:
        file: 05-toleration-wildcard.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.tolerations[0]')): true
            (contains($error, 'tolerates kvm.cloud.sap/offboarding:NoExecute')): true
  # cpuModels without cpuMode custom must be rejected by the CEL rule on
  # NovaComputeLibvirtSpec.
  - try:
    - apply:
        file: 06-cpumodels-without-custom.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.libvirt')): true
            (contains($error, 'cpuModels is required when cpuMode is custom and must be empty otherwise')): true
  # cpuMode custom without cpuModels must be rejected by the same rule.
  - try:
    - apply:
        file: 07-custom-without-cpumodels.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.libvirt')): true
            (contains($error, 'cpuModels is required when cpuMode is custom and must be empty otherwise')): true
  # spec.libvirt.virtType outside kvm and qemu must be rejected by the enum.
  - try:
    - apply:
        file: 08-virttype-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.libvirt.virtType')): true
            (contains($error, 'Unsupported value')): true
  # spec.libvirt.imagesType rbd must be rejected by the enum: the image carries
  # no Ceph client.
  - try:
    - apply:
        file: 09-imagestype-rbd.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.libvirt.imagesType')): true
            (contains($error, 'Unsupported value')): true
  # [DEFAULT] host in extraConfig must be rejected by the validating webhook:
  # the host is the node name, from the downward API.
  - try:
    - apply:
        file: 10-extraconfig-rejected-host.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.extraConfig[DEFAULT][host]')): true
            (contains($error, 'must not be set in extraConfig')): true
  # maxUnavailable under OnDelete must be rejected by the validating webhook:
  # nothing reads it there.
  - try:
    - apply:
        file: 11-maxunavailable-with-ondelete.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'updateStrategy.maxUnavailable')): true
            (contains($error, 'maxUnavailable applies to RollingUpdate only')): true
  # An image with both a tag and a digest must be rejected by the CEL rule on
  # the shared ImageSpec.
  - try:
    - apply:
        file: 12-image-tag-and-digest.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.image')): true
            (contains($error, 'exactly one of image.tag or image.digest must be set')): true
