# The shared secret the metadata API verifies a proxied instance request with,
# the healthcheck Secret under this suite's name.
#
# spec.metadata is a required block and the reconciler refuses an empty value
# (SecretsReady=False/MetadataSharedSecretEmpty), so without it the CR never
# reaches Ready. The key name is shared_secret, which is what the defaulting
# webhook fills in for spec.metadata.sharedSecretRef.key when a CR names none.
# The value is 32 characters, the width nova's own documentation uses for it.
apiVersion: v1
kind: Secret
metadata:
  name: nova-ns-scoped-metadata-secret
  namespace: openstack
type: Opaque
stringData:
  shared_secret: e2e-nova-ns-scoped-metadata-scrt
