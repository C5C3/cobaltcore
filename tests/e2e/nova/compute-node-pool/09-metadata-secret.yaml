# The shared secret the metadata API verifies a proxied instance request with.
#
# It is a fixture rather than a generated Secret because spec.metadata is a
# required block: the Nova reconciler reads this value, refuses an empty one
# (SecretsReady=False/MetadataSharedSecretEmpty) and republishes it in the
# compute contract under the key metadata_proxy_shared_secret.
#
# The key name is shared_secret, which is what the defaulting webhook fills in
# for spec.metadata.sharedSecretRef.key when a CR names none. The value is 32
# characters, the width nova's own documentation uses for it.
apiVersion: v1
kind: Secret
metadata:
  name: nova-pool-metadata-secret
  namespace: openstack
type: Opaque
stringData:
  shared_secret: e2e-nova-pool-metadata-secret-0
