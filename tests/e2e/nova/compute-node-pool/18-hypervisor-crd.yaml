# Stand-in for the Hypervisor CRD of openstack-hypervisor-operator at a2baf3f,
# the commit images/openstack-hypervisor-operator/source.json pins. The kind
# cluster runs no hypervisor operator, so this minimal CRD lets the pool's
# Traits step read and patch the kind node's Hypervisor, and lets the suite
# write the status that operator would. The Traits step writes
# spec.customTraits and reads spec.customTraits, spec.lifecycleEnabled,
# status.traits and the TraitsUpdated entry of status.conditions; spec and
# status use x-kubernetes-preserve-unknown-fields so those fields round-trip
# without the upstream schema.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hypervisors.kvm.cloud.sap
spec:
  group: kvm.cloud.sap
  names:
    plural: hypervisors
    singular: hypervisor
    kind: Hypervisor
    listKind: HypervisorList
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
