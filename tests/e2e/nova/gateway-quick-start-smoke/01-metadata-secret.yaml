# The shared secret the metadata API verifies a proxied instance request with.
#
# Every Nova suite carries one, including the ones that assert nothing about
# metadata: spec.metadata is a required block and the reconciler refuses an
# empty value (SecretsReady=False/MetadataSharedSecretEmpty), so without it the
# CR never reaches Ready.
#
# The key name is shared_secret, which is what the defaulting webhook fills in
# for spec.metadata.sharedSecretRef.key when a CR names none. The value is 32
# characters, the width nova's own documentation uses for it.
#
# It is applied from the Step-2 script rather than by chainsaw, behind the same
# presence guard as the CR: on a cluster without the Gateway or the Nova CRD the
# suite skips and leaves nothing behind. The test's `finally` block deletes it.
apiVersion: v1
kind: Secret
metadata:
  name: nova-smoke-metadata-secret
  namespace: openstack
type: Opaque
stringData:
  shared_secret: e2e-nova-smoke-metadata-secret00
