# Brownfield transport-URL Secret for the neutron-nova-vnc CR.
#
# This Neutron is pure ML2/OVN: it opens no broker connection. Nothing in the
# reconcile path dials one either, since the messaging step reads this Secret,
# checks that the URL parses with the rabbit scheme, and copies it into the
# derived Secret neutron-nova-vnc-transport-url. The host therefore
# points at the reserved .invalid TLD, which never resolves, so a code
# change that started connecting on the reconcile path fails here instead of
# passing quietly. The suite's own broker vhost belongs to the Nova alone.
#
# The name is neutron-nova-vnc-messaging rather than
# neutron-nova-vnc-transport-url: the latter is the derived Secret the
# operator writes, and a fixture under that name would be overwritten on the
# first pass.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-nova-vnc-messaging
  namespace: openstack
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
