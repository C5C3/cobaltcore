# spec.remoteCompute.keystoneEndpoint over plain http violates the ^https://
# pattern the field carries, a schema-level rejection: every compute on
# another cluster sends the nova service-user password to this URL. The
# webhook mirrors it with `must use scheme https`, but the schema answers
# first. The bus is verified, so the pattern is the only rule that fails.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
    tls:
      caBundleSecretRef:
        name: nova-messaging-ca
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  remoteCompute:
    keystoneEndpoint: http://keystone.example.com/v3
    transportURLSecretRef:
      name: nova-remote-transport
