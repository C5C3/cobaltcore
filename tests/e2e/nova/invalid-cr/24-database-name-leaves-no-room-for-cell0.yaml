# spec.database.database of 59 characters violates the size rule on
# spec.database: cell0 is provisioned as <database>_cell0, which has to fit
# the 64-character schema limit, so the bound is 58. The name matches the
# shared schema-name pattern and MaxLength=64, so the size rule is the only
# one it breaks. The webhook mirrors the rule, but the schema answers first.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova_cell_schema_named_one_character_past_the_58_char_bound
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
