# Chainsaw E2E tests for Nova CRD webhook + CEL validation rejection.
# Pins the implemented CEL XValidation, kubebuilder-marker, and
# webhook.validate() rejection paths in operators/nova/api/v1alpha1/ to a
# deterministic admission failure. Each step applies an otherwise-valid Nova
# CR with a single aspect violating the rule under test, captures the admission
# $error, and asserts the field path plus message substring.
#
# The API server validates against the structural schema and its CEL rules
# before it calls the validating webhook, so a rule carried by both layers is
# answered by the schema and the assertions below quote the schema message. The
# webhook message is asserted only where the rule has no schema counterpart: the
# cron grammar of spec.dbArchive.schedule, the two spec.extraConfig checks (the
# map is preserve-unknown-fields, which CEL cannot constrain), the two
# metadata.name rules, which come from the names of child objects, the newline
# check on the typed fields rendered into nova.conf, and the console route's
# path.
#
# The test runs in an ephemeral namespace: the fixtures reference a
# RabbitmqCluster, a MariaDB, a Memcached and Secrets that do not exist there,
# which admission deliberately tolerates (GitOps ordering), so no dangling
# reference competes with the rule a fixture pins.
#
# All fixtures are generated from the single canonical scaffold in
# `_generate.py`. After editing the scaffold or any per-fixture override,
# regenerate via:
#   python3 tests/e2e/nova/invalid-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes
# `_generate.py --check` (drift mode, both directions incl. orphans) and
# `test_generate.py` (FIXTURES count + chainsaw-test.yaml cross-reference)
# so any hand-edit to a generated fixture fails the build before the
# cluster-bound e2e-operator job runs.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nova-invalid-cr
spec:
  steps:
  # spec.openStackRelease with a non-cadence minor must be rejected by the CRD
  # pattern.
  - try:
    - apply:
        file: 00-openstackrelease-pattern.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'openStackRelease')): true
            (contains($error, 'should match')): true
  # spec.image with both tag and digest must be rejected by the ImageSpec XOR
  # CEL rule, which answers before the webhook's validateImage twin.
  - try:
    - apply:
        file: 01-image-tag-and-digest.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'image')): true
            (contains($error, 'exactly one of image.tag or image.digest')): true
  # spec.apiDatabase with both clusterRef and host must be rejected by the
  # shared DatabaseSpec XOR rule.
  - try:
    - apply:
        file: 02-apidatabase-clusterref-and-host.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'apiDatabase')): true
            (contains($error, 'exactly one of clusterRef or host')): true
  # spec.database with both clusterRef and host must be rejected by the same
  # rule on the cell half of Nova's state.
  - try:
    - apply:
        file: 03-database-clusterref-and-host.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'database')): true
            (contains($error, 'exactly one of clusterRef or host')): true
  # spec.cache with both clusterRef and servers must be rejected.
  - try:
    - apply:
        file: 04-cache-clusterref-and-servers.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'cache')): true
            (contains($error, 'exactly one of clusterRef or servers')): true
  # spec.messaging with both clusterRef and secretRef must be rejected: the two
  # modes resolve the transport URL differently.
  - try:
    - apply:
        file: 05-messaging-clusterref-and-secretref.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'messaging')): true
            (contains($error, 'exactly one of clusterRef or secretRef')): true
  # spec.messaging naming neither mode must be rejected by the same rule from
  # the other side. An empty object is what reaches the XOR.
  - try:
    - apply:
        file: 06-messaging-neither-mode.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'messaging')): true
            (contains($error, 'exactly one of clusterRef or secretRef')): true
  # spec.messaging.tls with an unnamed CA bundle Secret must be rejected by the
  # MinLength=1 marker on the shared SecretRefSpec.
  - try:
    - apply:
        file: 07-messaging-tls-without-cabundle-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'messaging.tls.caBundleSecretRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.messaging omitted must be rejected: a Nova without a broker accepts
  # requests nothing acts on. The defaulting webhook materializes the block as
  # an empty object (a non-pointer struct without omitempty on the Go field), so
  # the MessagingSpec XOR CEL rule answers rather than the required-properties
  # list.
  - try:
    - apply:
        file: 08-messaging-missing.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.messaging')): true
            (contains($error, 'exactly one of clusterRef or secretRef')): true
  # spec.dbArchive.schedule outside the cron grammar must be rejected by the
  # validating webhook: the field carries no CRD pattern because the grammar
  # includes descriptors such as @daily.
  - try:
    - apply:
        file: 09-dbarchive-schedule-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dbArchive.schedule')): true
            (contains($error, 'invalid cron expression')): true
  # spec.dbArchive.maxRows below the Minimum=1 marker must be rejected by the
  # schema: a run bounded at zero rows moves nothing.
  - try:
    - apply:
        file: 10-dbarchive-maxrows-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dbArchive.maxRows')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # spec.dbArchive.retentionDays below the Minimum=1 marker must be rejected by
  # the schema: a zero-day window archives the rows an in-flight request wrote.
  - try:
    - apply:
        file: 11-dbarchive-retentiondays-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dbArchive.retentionDays')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # spec.scheduler.workers below the Minimum=1 marker must be rejected by the
  # schema: a scheduler pod without a worker process schedules nothing.
  - try:
    - apply:
        file: 12-scheduler-workers-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'scheduler.workers')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # spec.apiDatabase and spec.database naming one schema must be rejected by the
  # first database CEL rule: the two halves install different migration
  # histories.
  - try:
    - apply:
        file: 13-databases-same-schema.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'apiDatabase and database must name different schemas')): true
  # spec.apiDatabase on Dynamic credentials while spec.database keeps the Static
  # default must be rejected by the second database CEL rule: the two schemas
  # share a credential path.
  - try:
    - apply:
        file: 14-databases-credentialsmode-mismatch.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'apiDatabase and database must use the same credentialsMode')): true
  # spec.metadata.sharedSecretRef.name empty must be rejected by the MinLength=1
  # marker on the shared SecretRefSpec: without the value the Neutron metadata
  # agent signs with, every metadata request is rejected.
  - try:
    - apply:
        file: 15-metadata-sharedsecretref-empty-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'metadata.sharedSecretRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.endpoints.placement.override without a scheme must be rejected by the
  # ^https?:// pattern: the value is handed to the HTTP client verbatim.
  - try:
    - apply:
        file: 16-endpoints-override-not-url.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'endpoints.placement.override')): true
            (contains($error, 'should match')): true
  # spec.extraConfig setting [database] connection must be rejected by the
  # webhook: the runtime value is env-injected, so a file override is inert and
  # only copies the database password into the config Secret every pod mounts.
  - try:
    - apply:
        file: 17-extraconfig-rejected-owned-key.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'connection is managed via spec.database')): true
            (contains($error, 'OS_DATABASE__CONNECTION')): true
  # spec.extraConfig setting an unknown option in a known section must be
  # rejected: it is absent from the nova 2025.2 option catalog.
  - try:
    - apply:
        file: 18-extraconfig-unknown-option.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'no such option in the nova 2025.2 option catalog')): true
  # A metadata.name past 41 characters must be rejected by the validating
  # webhook: the {name}-db-archive CronJob would exceed the 52-character cap
  # Kubernetes puts on a CronJob name, so the CR would admit cleanly and then
  # fail to create the archive job on every reconcile.
  - try:
    - apply:
        file: 19-name-too-long.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'metadata.name')): true
            (contains($error, 'name must be at most 41 characters')): true
  # spec.targetClusterRef.name empty must be rejected by the MinLength=1 marker
  # on the shared TargetClusterRefSpec, which answers before the webhook twin.
  - try:
    - apply:
        file: 20-targetclusterref-empty-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'targetClusterRef.name')): true
            (contains($error, 'should be at least 1 chars long')): true
  # spec.dbArchive.sleep below the Minimum=0 marker must be rejected by the
  # schema: a negative pause fails every run of the archive CronJob.
  - try:
    - apply:
        file: 21-dbarchive-sleep-below-minimum.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dbArchive.sleep')): true
            (contains($error, 'should be greater than or equal to 0')): true
  # spec.keystoneEndpoint without a scheme must be rejected by the ^https?://
  # pattern: every authenticated call Nova makes starts at this URL.
  - try:
    - apply:
        file: 22-keystoneendpoint-not-url.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'keystoneEndpoint')): true
            (contains($error, 'should match')): true
  # spec.apiDatabase naming the cell0 schema derived from spec.database must be
  # rejected by the third database CEL rule: the nova_api migrations would run
  # into the schema map_cell0 maps.
  - try:
    - apply:
        file: 23-apidatabase-names-cell0.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'apiDatabase must not name the cell0 schema derived from database')): true
  # spec.database.database past 58 characters must be rejected by the size rule
  # on spec.database: <database>_cell0 has to fit the 64-character schema limit.
  - try:
    - apply:
        file: 24-database-name-leaves-no-room-for-cell0.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'database.database must be at most 58 characters')): true
  # A metadata.name ending in -api must be rejected by the validating webhook:
  # the Nova named by the rest of the name builds its nova_api MariaDB objects
  # under this name, so deleting either CR would delete the other's.
  - try:
    - apply:
        file: 25-name-collides-with-sibling-child.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'metadata.name')): true
            (contains($error, 'so the two CRs would share and delete each other')): true
  # spec.region carrying a newline must be rejected by the validating webhook:
  # the value is rendered verbatim into nova.conf and the compute fragment.
  - try:
    - apply:
        file: 26-region-control-chars.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'spec.region')): true
            (contains($error, 'value must not contain a newline or carriage return')): true
  # spec.consoleProxy.gateway with a path prefix must be rejected by the
  # validating webhook: the console page and its WebSocket open on the root of
  # the console hostname.
  - try:
    - apply:
        file: 27-consoleproxy-gateway-path.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'consoleProxy.gateway.path')): true
            (contains($error, 'the console page and its WebSocket are served from the root of the console hostname')): true
