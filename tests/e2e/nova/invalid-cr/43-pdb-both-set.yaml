# spec.podDisruptionBudget sets both minAvailable and maxUnavailable. The CEL
# rule on the shared PodDisruptionBudgetSpec answers first with "exactly one
# of minAvailable or maxUnavailable must be set"; the webhook mirrors it
# (validation.PodDisruptionBudgetValues).
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2026.1"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  podDisruptionBudget:
    minAvailable: 1
    maxUnavailable: 1
