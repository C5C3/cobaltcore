# spec.remoteCompute.keystoneEndpoint without a scheme violates the
# ^https:// pattern the field carries, a schema-level rejection. The bus is
# verified, so the remote-compute CEL rule is met and the pattern is the
# only rule that fails.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
    tls:
      caBundleSecretRef:
        name: nova-messaging-ca
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  remoteCompute:
    keystoneEndpoint: keystone.example.com
    transportURLSecretRef:
      name: nova-remote-transport
