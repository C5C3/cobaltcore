# spec.api.deployment.verticalAutoscaling beside spec.autoscaling violates the
# CEL rule on the spec root; the webhook mirrors it. Every HPA scales on the
# utilization a VPA changes, so the two are rejected on one Deployment. The API
# server reports the rule at spec, with the block's path in the message.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  api:
    deployment:
      verticalAutoscaling:
        updateMode: "Off"
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 80
