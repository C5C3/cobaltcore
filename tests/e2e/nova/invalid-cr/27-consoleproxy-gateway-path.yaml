# spec.consoleProxy.gateway with a path prefix is rejected by the validating
# webhook alone. The console URL the API hands a browser names a page at the
# root of the console hostname and the noVNC client opens its WebSocket
# there too, so a prefix route would match neither while it reports
# Accepted.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  consoleProxy:
    gateway:
      parentRef:
        name: gateway
      hostname: console.example.com
      path: /console
