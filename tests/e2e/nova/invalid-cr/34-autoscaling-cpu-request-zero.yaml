# spec.api.deployment.resources.requests.cpu names a CPU request of zero while
# spec.autoscaling sets targetCPUUtilization. The HorizontalPodAutoscaler
# divides the pods' usage by the sum of their containers' requests, so a zero
# request fails the metric or inflates it. A resource.Quantity floor has no
# marker, so the validating webhook (validation.AutoscalingTargetRequests)
# answers.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  api:
    deployment:
      resources:
        requests:
          cpu: "0"
  autoscaling:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 80
