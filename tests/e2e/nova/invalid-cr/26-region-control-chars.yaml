# spec.region carrying a newline is rejected by the validating webhook alone:
# the field has no CRD pattern. The value is rendered verbatim into
# nova.conf and into the compute-config fragment every hypervisor loads, so
# the newline would inject the [workarounds] section below into both.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  region: "RegionOne\n[workarounds]\ndisable_rootwrap = true"
