# spec.api.deployment.verticalAutoscaling.minAllowed naming ephemeral-storage
# violates the CEL rule on VerticalAutoscalingSpec; the webhook mirrors it. The
# VPA the operator writes controls cpu and memory only.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  api:
    deployment:
      verticalAutoscaling:
        updateMode: "Off"
        minAllowed:
          ephemeral-storage: 1Gi
