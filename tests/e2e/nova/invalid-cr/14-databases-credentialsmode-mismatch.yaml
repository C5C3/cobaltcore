# spec.apiDatabase on Dynamic credentials while spec.database keeps the
# Static default violates the second database CEL rule on NovaSpec: the two
# schemas share a credential path, so a deployment cannot issue one of them
# dynamic credentials and the other a static password. The apiDatabase block
# keeps its clusterRef, which is what the Dynamic mode of the shared
# DatabaseSpec requires, so this fixture pins the mismatch rule alone.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    credentialsMode: Dynamic
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
