# A metadata.name of 42 characters is rejected by the validating webhook
# alone. The bound is 41: the archive CronJob is named {name}-db-archive, 11
# characters on top of the CR name, against the 52-character cap Kubernetes
# puts on a CronJob name. The name is a valid DNS-1123 subdomain apart from
# its length, so the bound is the only rule it breaks. The rule runs in
# ValidateCreate only, so the finalizer-removal update never trips over it.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid-name-one-past-the-41-char-cap
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
