# spec.apiDatabase and spec.database naming one schema violates the first
# database CEL rule on NovaSpec. The two halves run their own db-sync
# against a different set of migrations, so pointing them at one schema
# installs both migration histories into it. Only the apiDatabase schema
# name moves, so the pair collides on the cell schema the scaffold already
# carries.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
