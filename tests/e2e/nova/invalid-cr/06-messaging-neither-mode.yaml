# spec.messaging present but naming neither mode violates the same
# MessagingSpec XOR CEL rule from the other side. An omitted spec.messaging
# reaches the rule as the same empty object, which the next fixture pins.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging: {}
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
