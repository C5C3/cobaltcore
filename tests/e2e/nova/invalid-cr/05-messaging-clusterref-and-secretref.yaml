# spec.messaging with both clusterRef and secretRef violates the shared
# MessagingSpec XOR CEL rule: managed mode derives the transport URL from
# the RabbitmqCluster, brownfield mode reads it from the Secret, and naming
# both leaves no rule for which URL the pods get. The webhook mirrors it via
# MessagingXOR.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
    secretRef:
      name: nova-transport-url
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
