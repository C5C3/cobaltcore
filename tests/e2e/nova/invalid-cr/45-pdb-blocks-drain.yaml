# spec.podDisruptionBudget.minAvailable of 3 at three API replicas allows no
# voluntary eviction, so a node drain could not evict an API pod. CEL cannot
# compare the budget with the replica count, so the validating webhook
# answers (validation.PodDisruptionBudgetEvictable) with "allows no voluntary
# eviction".
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2026.1"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  api:
    deployment:
      replicas: 3
  podDisruptionBudget:
    minAvailable: 3
