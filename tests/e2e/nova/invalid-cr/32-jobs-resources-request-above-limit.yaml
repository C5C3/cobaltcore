# A spec.jobs.resources memory request above its limit is rejected by the
# validating webhook alone (validation.RequestsWithinLimits):
# ResourceRequirements is an embedded upstream type carrying no cross-field
# marker, so admission is the only gate before the rendered Job and CronJob
# pod templates reach the API server and are refused there.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-invalid
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  apiDatabase:
    clusterRef:
      name: mariadb
    database: nova_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: mariadb
    database: nova
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: memcached
  messaging:
    clusterRef:
      name: rabbitmq
  keystoneEndpoint: http://keystone.openstack.svc:5000
  serviceUser:
    secretRef:
      name: nova-service-user
  metadata:
    sharedSecretRef:
      name: nova-metadata-secret
  jobs:
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 512Mi
