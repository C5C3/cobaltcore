# Nova CR for the healthcheck E2E test (2025.2 release).
#
# The light fixture tier: no Keystone, no Placement, no Neutron and no Glance
# run beside it. A Nova reaches Ready with only Secrets and the broker, because
# the API and metadata probes GET the API root and the scheduler and conductor
# probes read the broker socket. spec.keystoneEndpoint is a convention URL
# nothing serves, and spec.serviceUser reads the kind-only keystone-admin
# Secret from deploy/kind/infrastructure.
#
# The two schemas nova_health_api and nova_health live on the openstack-db
# MariaDB cluster (cell0 is derived as nova_health_cell0), the cache is
# openstack-memcached, and the credentials are the ESO-synced nova-api-db and
# nova-db Secrets.
#
# The bus is the per-suite vhost broker-vhost.sh writes into
# nova-health-messaging. Managed messaging is not usable here: the URL it
# renders always names the root vhost, so two suites would share the scheduler
# and conductor RPC topics.
#
# No spec.gateway: the suite asserts status.endpoint carries the cluster-local
# Service URL, which is the only address the operator writes there without one.
#
# One API replica. The probe under test reaches the Service, so a second pod
# would only lengthen the bring-up.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-health
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  api:
    deployment:
      replicas: 1
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_health_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_health
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: nova-health-messaging
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-health-metadata-secret
