# A Memcached of the Keystone's own. Keystone caches the lookup of a user by
# name under a key that carries no instance identity, so two Keystones on one
# Memcached read each other's entry: the second resolves "admin" to the first
# one's user id, finds no such row in its own database and answers 401, which
# nova-conductor and nova-scheduler meet while they build their Placement
# client. Five nova suites bring a Keystone and up to four run at once. The
# other services stay on openstack-memcached, where their keys are token hashes.
apiVersion: memcached.c5c3.io/v1beta1
kind: Memcached
metadata:
  name: keystone-nova-upgrade-cache
  namespace: openstack
spec:
  replicas: 1
  image: memcached:1.6
---
# Keystone CR fixture for the release-upgrade E2E test (2026.1 release).
#
# The suite needs a live identity service because the expand phase runs
# nova-status upgrade check, and that check reads Placement as an authenticated
# client. The suite brings its own Keystone because the Service the operator
# projects carries the CR name, which is what keeps the catalog rows and the
# service users of parallel suites apart.
#
# It stays at 2026.1 for the whole run, the release the Nova is upgraded to.
# Identity moves ahead of the services that authenticate against it, so a 2025.2
# Nova against a 2026.1 Keystone is a pairing an upgrade passes through anyway.
#
# One replica and the database keystone_nova_upgrade. The bootstrap admin
# password comes from the pre-seeded keystone-admin Secret
# (deploy/kind/infrastructure), which is also the serviceUser password of the
# Placement and the Nova, so all of them are one identity.
apiVersion: keystone.openstack.c5c3.io/v1alpha1
kind: Keystone
metadata:
  name: keystone-nova-upgrade
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/keystone
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: keystone_nova_upgrade
    secretRef:
      name: keystone-db
  cache:
    clusterRef:
      name: keystone-nova-upgrade-cache
    backend: dogpile.cache.pymemcache
  fernet:
    rotationSchedule: "0 0 * * 0"
    maxActiveKeys: 3
  bootstrap:
    adminUser: admin
    adminPasswordSecretRef:
      name: keystone-admin
    region: RegionOne
