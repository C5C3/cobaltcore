# Registers the two services this suite runs in the keystone-nova-upgrade
# catalog, each with its public and internal endpoint. keystone-manage bootstrap
# only creates the identity service, so the rest has to be added out-of-band.
#
# Two rather than four: no Neutron and no Glance run here, and the nova-status
# checks that cover those integrations report a missing one as a warning
# (exit 1), which the expand phase keeps.
#
# Both interfaces are written because two different clients read them. nova
# resolves Placement through its own client section, which pins
# valid_interfaces = internal
# (operators/nova/internal/controller/reconcile_config.go), while a client
# reaching the compute API from outside resolves the public row.
#
# The Job runs before the Placement and the Nova are applied. The catalog is
# what a service reads at its first request, and a row written after a pod
# started is only picked up once the token middleware's catalog cache expires.
#
# It authenticates as the bootstrap admin (keystone-admin Secret) and every step
# is idempotent, so a Job retry converges rather than erroring on a duplicate.
# The client image is the 2025.2 tempest one the sibling nova suites run, which
# is the tag the leg loads; it talks to the identity API both releases serve.
apiVersion: batch/v1
kind: Job
metadata:
  name: nova-upgrade-catalog-setup
  namespace: openstack
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: ghcr.io/c5c3/tempest:2025.2
          imagePullPolicy: IfNotPresent
          env:
            - name: OS_AUTH_URL
              value: http://keystone-nova-upgrade.openstack.svc.cluster.local:5000/v3
            - name: OS_IDENTITY_API_VERSION
              value: "3"
            - name: OS_USERNAME
              value: admin
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_NAME
              value: admin
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keystone-admin
                  key: password
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # Service create is guarded by a name-list grep rather than by a
              # show: `openstack service show` of a missing resource can exit 0
              # on this image, so a show-guard would skip the create.
              create_service() {
                name="$1"
                type="$2"
                description="$3"
                if ! openstack service list --format value -c Name | grep -qx "${name}"; then
                  openstack service create --name "${name}" \
                    --description "${description}" "${type}"
                fi
              }

              # Endpoints are guarded by listing the service's existing
              # endpoints for the interface and matching the exact URL as a
              # fixed string, so the dotted FQDN is not read as a regex.
              create_endpoint() {
                service="$1"
                interface="$2"
                url="$3"
                if ! openstack endpoint list --service "${service}" --interface "${interface}" \
                     --format value -c URL | grep -qxF "${url}"; then
                  openstack endpoint create --region RegionOne "${service}" "${interface}" "${url}"
                fi
              }

              create_service nova compute "OpenStack Compute"
              create_service placement placement "OpenStack Placement"

              # The compute URL carries the version prefix the client appends
              # its paths to; Placement serves its resources off the bare
              # Service address.
              NOVA_URL="http://nova-upgrade.openstack.svc:8774/v2.1"
              create_endpoint nova public "${NOVA_URL}"
              create_endpoint nova internal "${NOVA_URL}"

              PLACEMENT_URL="http://placement-nova-upgrade.openstack.svc:8778"
              create_endpoint placement public "${PLACEMENT_URL}"
              create_endpoint placement internal "${PLACEMENT_URL}"

              echo "OK: compute and placement services registered"
              openstack endpoint list --format value -c "Service Name" -c Interface -c URL
