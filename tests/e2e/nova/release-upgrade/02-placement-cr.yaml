# Placement CR for the release-upgrade E2E test (2026.1 release).
#
# The expand phase runs nova-status upgrade check before it migrates, and
# several of its checks read Placement. Without a service behind the catalog row
# the check exits above 1 and the script stops the phase rather than migrating
# (operators/nova/internal/controller/reconcile_database.go).
#
# It sits at 2026.1, the release the Nova is upgraded to, for the whole run: a
# check run by 2026.1 nova against an older Placement is not a pairing this
# repository proves, and Placement is upgraded ahead of the computes anyway.
#
# One replica on the schema placement_nova_upgrade. The suite issues a handful
# of requests through it, and the node also carries a Keystone and five Nova
# workloads.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-nova-upgrade
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: placement_nova_upgrade
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone-nova-upgrade.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
