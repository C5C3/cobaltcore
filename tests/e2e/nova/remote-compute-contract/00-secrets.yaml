# Inputs of the remote-compute-contract suite. Nothing here reaches a backend:
# the Nova publishes both compute contracts before its Database step, and no
# step before that dials the database, the cache, the broker or Keystone. The
# values are placeholders the contracts carry verbatim.
#
# nova-rc-messaging names the in-cluster bus, nova-rc-remote-messaging the
# broker's external listener a compute on another cluster connects to. Both
# carry an explicit port, which the operator requires of the cell transport
# URL. nova-rc-messaging-ca is copied into both contracts as ca.crt and never
# parsed, so any PEM block does.
apiVersion: v1
kind: Secret
metadata:
  name: nova-rc-api-db
  namespace: openstack
stringData:
  username: nova-rc-api
  password: nova-rc-api-password
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-rc-db
  namespace: openstack
stringData:
  username: nova-rc
  password: nova-rc-password
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-rc-service-user
  namespace: openstack
stringData:
  password: nova-rc-service-password
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-rc-metadata
  namespace: openstack
stringData:
  shared_secret: nova-rc-metadata-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-rc-messaging
  namespace: openstack
stringData:
  transport_url: rabbit://nova:nova@nova-rc-bus.openstack.svc:5671/
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-rc-messaging-ca
  namespace: openstack
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    bm92YS1yYy1wbGFjZWhvbGRlcg==
    -----END CERTIFICATE-----
---
apiVersion: v1
kind: Secret
metadata:
  name: nova-rc-remote-messaging
  namespace: openstack
stringData:
  transport_url: rabbit://nova:nova@198.51.100.10:5671/
