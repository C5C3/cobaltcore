# Nova CR for the deletion-cleanup E2E test (2025.2 release).
#
# The light fixture tier: no Keystone, no Placement, no Neutron and no Glance
# run beside it. A Nova reaches Ready with only Secrets and the broker, because
# the API and metadata probes GET the API root and the scheduler and conductor
# probes read the broker socket. spec.keystoneEndpoint is a convention URL
# nothing serves, and spec.serviceUser reads the kind-only keystone-admin
# Secret from deploy/kind/infrastructure.
#
# Both database blocks are managed (clusterRef), which is what puts the seven
# MariaDB objects the suite asserts on into the namespace: Database, User and
# Grant for the nova_cleanup_api schema under the instance name
# nova-cleanup-api, the same three for nova_cleanup under nova-cleanup, and the
# derived Database and Grant of nova_cleanup_cell0. cell0 travels as an
# additional schema on the cell block's user, so it gets no User of its own.
#
# The bus is the per-suite vhost broker-vhost.sh writes into
# nova-cleanup-messaging. Managed messaging is not usable here: the URL it
# renders always names the root vhost, so two suites would share the scheduler
# and conductor RPC topics.
#
# No spec.gateway on any of the three front ends: an HTTPRoute is not owned
# child inventory this suite can assert on a cluster whose Gateway API is the
# minimal test CRD, and the deletion path treats it like every other child.
#
# One API replica. The suite asserts that the children exist and then that they
# are gone, not how many pods serve requests, and a second replica only
# lengthens the bring-up on the single kind node.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-cleanup
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  api:
    deployment:
      replicas: 1
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_cleanup_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_cleanup
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: nova-cleanup-messaging
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-cleanup-metadata-secret
