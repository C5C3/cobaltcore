# Test namespace + ExternalSecret fixtures for the PSS-restricted E2E test.
#
# The namespace carries both `pod-security.kubernetes.io/enforce=restricted`
# AND `pod-security.kubernetes.io/enforce-version=latest`. Without the version
# label, kube-apiserver pins to the cluster's current PSS baseline, which can
# drift on cluster upgrade and surface as a spurious failure; `latest` tracks
# the newest baseline and is the regression net we want.
#
# A Nova has two database blocks, each with its own SQL user, so it needs two
# credential Secrets rather than one: `nova-api-db` carries the nova_api user of
# the API schema and `nova-db` the nova user of the cell schema. Both are
# ESO-managed, because the operator's `reconcileSecrets` gates SecretsReady on
# the selected secret store and on the ESO-synced credential Secrets, so plain
# Secrets are not sufficient to reach Ready=True.
#
# The shared cluster store is namespace-restricted, so a foreign namespace like
# this one cannot reach the shared standalone paths through it. Both
# ExternalSecrets therefore authenticate through this namespace's OWN
# per-tenant `openbao-tenant-store` (provisioned by the chainsaw Step-1 script
# via setup-eso-tenant.sh) and read namespace-scoped paths that the eso-tenant
# policy templates to this namespace: `openstack/nova/nova-pss/pss/api-db` and
# `openstack/nova/nova-pss/pss/db`. The Step-1 script seeds both by COPYING the
# values from the shared `openstack/nova/openstack/standalone/api-db` and
# `openstack/nova/openstack/standalone/db` paths, so the nova_api and nova
# MariaDB users' passwords still match the values the brownfield User CRs
# reconcile onto the same shared users: no SET PASSWORD race.
#
# The key names are the ones the Nova reads: username and password, as in the
# kind-only shims deploy/kind/infrastructure/nova-api-db-externalsecret.yaml and
# nova-db-externalsecret.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nova-pss
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nova-api-db
  namespace: nova-pss
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tenant-store
    kind: SecretStore
  target:
    name: nova-api-db
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: openstack/nova/nova-pss/pss/api-db
      property: username
  - secretKey: password
    remoteRef:
      key: openstack/nova/nova-pss/pss/api-db
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nova-db
  namespace: nova-pss
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tenant-store
    kind: SecretStore
  target:
    name: nova-db
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: openstack/nova/nova-pss/pss/db
      property: username
  - secretKey: password
    remoteRef:
      key: openstack/nova/nova-pss/pss/db
      property: password
