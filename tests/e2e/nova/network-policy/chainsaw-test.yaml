# Chainsaw E2E test for the NetworkPolicy sub-reconciler.
#
# ENFORCEMENT: the kindnetd of kind v0.32 and later (CI pins KIND_VERSION)
# enforces NetworkPolicy. The suite asserts the two rendered policy objects
# (described below) and their lifecycle, and probes both with the five pods of
# 04-probe-pods.yaml through ../../lib/assert-networkpolicy-enforced.sh
# (Step 3):
#   - the target, which carries the policy's selector labels, is dropped on
#     sink port 9999, which no egress rule admits, and on 5900: the display
#     range lives on the console proxy's own policy, and the target has no
#     component label, so only the main policy selects it;
#   - it resolves a cluster name, which the DNS rule admits;
#   - it reaches the sink on TCP 3306, 5000, 5672, 8778, 9292, 9696 and 11211,
#     every TCP egress port the policy admits but 53;
#   - a pod with the console proxy's selector labels, which both policies
#     select, reaches sink ports 5900 and 9999 through the display range;
#   - a client in nova-system, the operator namespace, is dropped on target
#     port 9999, which no ingress rule admits, and reaches TCP 8774, 8775 and
#     6080;
#   - a client in nova-netpol-outside is dropped on TCP 8774, 8775 and 6080
#     until the update patch admits its namespace (Step 4).
# On a CNI that does not enforce NetworkPolicy the first probe fails with "was
# never dropped". TCP 53 is not probed: the sink listens on unprivileged ports
# only, DNS is probed by resolution, and Step 2 pins the rule.
#
# Nova renders two policies. The main one covers every pod of the CR, since its
# selector carries no component key: the API, the metadata API, the scheduler,
# the conductor, the console proxy and the Job pods read the same two schemas,
# publish on the same broker and call the same siblings. The second one belongs
# to the console proxy alone, which dials the VNC server of whichever
# hypervisor an instance runs on. Policies are additive per pod, so putting
# that display range on the main policy would open it to every Nova pod.
#
# The auto-derived egress order of the main policy is deterministic:
#   - DNS           UDP+TCP 53
#   - api-database  TCP 3306 (spec.apiDatabase default port)
#   - database      TCP 3306 (spec.database default port)
#   - cache         TCP 11211 (managed memcached)
#   - Keystone      TCP 5000 (the port of spec.keystoneEndpoint)
#   - siblings      TCP 8778, 9292, 9696 (Placement, Glance, Neutron)
#   - messaging     TCP 5672 (the port of the transport URL in the broker
#                   Secret)
# The two schemas carry their own connection parameters and may sit on
# different MariaDB instances, so each contributes a rule of its own even when
# both resolve to 3306. The sibling ports arrive as one rule, sorted
# numerically by the shared builder rather than in spec order. Neither the
# siblings nor the broker nor the hypervisors are reachable by a label
# selector, so those rules are port-only.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nova-network-policy
spec:
  namespace: openstack
  timeouts:
    # The two-schema migration, the cell mapping and the cold start of five
    # workloads precede the parallel group that owns the policies, and that
    # does not fit the 120s the shared config allows.
    # The first CI run measured the bring-up: the eight MariaDB CRs take 3
    # minutes at the operator's 30 s requeue and the six nova-manage invocations
    # of the db-sync about 3 more, so Ready lands roughly 8 minutes after the
    # apply. 10m keeps a margin for a leg that runs two suites at once.
    assert: 10m
  steps:
  # ── Step 1: Give the suite its vhost, then apply the CR ────────────────
  # One vhost per suite: nova's RPC topics are named after the service rather
  # than after the CR, so two suites on one vhost would share the scheduler and
  # conductor queues. See ../../cinder/broker-vhost.sh. The step cleanup runs
  # at the end of the test.
  - try:
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../../cinder/broker-vhost.sh create nova-netpol nova-netpol-messaging openstack
    - apply:
        file: 00-metadata-secret.yaml
    - apply:
        file: 01-nova-cr.yaml
    catch: &nova-dump
    - get:
        apiVersion: nova.openstack.c5c3.io/v1alpha1
        kind: Nova
        name: nova-netpol
        namespace: openstack
    - script:
        content: |
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicy -n "$NAMESPACE" -l app.kubernetes.io/instance=nova-netpol -o yaml 2>&1 || true
          echo "=== Deployments ==="
          kubectl describe deploy -n "$NAMESPACE" -l app.kubernetes.io/instance=nova-netpol 2>&1 | tail -200 || true
          echo "=== Pod logs ==="
          for pod in $(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/instance=nova-netpol -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n "$NAMESPACE" "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n "$NAMESPACE" "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
    - podLogs:
        namespace: nova-system
        selector: app.kubernetes.io/name=nova-operator
        tail: 200
    - events:
        namespace: openstack
    cleanup:
    - script:
        shell: bash
        timeout: 2m
        content: |
          ../../cinder/broker-vhost.sh delete nova-netpol || true
  # ── Step 2: Assert both policies carry the expected rules ──────────────
  - try:
    - assert:
        resource:
          apiVersion: nova.openstack.c5c3.io/v1alpha1
          kind: Nova
          metadata:
            name: nova-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyReady
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: nova-netpol
            namespace: openstack
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: nova
                app.kubernetes.io/instance: nova-netpol
            policyTypes:
            - Ingress
            - Egress
            # One rule for all three front ends: their peers are the same set.
            ingress:
            - ports:
              - protocol: TCP
                port: 8774
              - protocol: TCP
                port: 8775
              - protocol: TCP
                port: 6080
            egress:
            - ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
            - ports:
              - protocol: TCP
                port: 3306
            - ports:
              - protocol: TCP
                port: 3306
            - ports:
              - protocol: TCP
                port: 11211
            - ports:
              - protocol: TCP
                port: 5000
            - ports:
              - protocol: TCP
                port: 8778
              - protocol: TCP
                port: 9292
              - protocol: TCP
                port: 9696
            - ports:
              - protocol: TCP
                port: 5672
          # matchLabels is asserted as a subset above, so the absence of the
          # component key needs its own check: one policy has to cover every
          # component, and a selector narrowed to one of them would leave the
          # other four workloads unisolated. `|| `{}`` is what keeps a missing
          # matchLabels a readable diff: keys() on an absent field aborts the
          # whole assert at its first poll with `invalid type for: <nil>`. The
          # subset above is what still fails the step in that case.
          (contains(keys(spec.podSelector.matchLabels || `{}`), 'app.kubernetes.io/component')): false
    # The console proxy's own policy. libvirt hands every guest a display port
    # out of remote_display_port_min..remote_display_port_max, whose defaults
    # span the whole range, and the hypervisors are addressed by whatever the
    # compute registered, so the rule is port-only.
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: nova-netpol-novncproxy
            namespace: openstack
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: nova
                app.kubernetes.io/instance: nova-netpol
                app.kubernetes.io/component: novncproxy
            policyTypes:
            - Egress
            egress:
            - ports:
              - protocol: TCP
                port: 5900
                endPort: 65535
    catch: *nova-dump
  # ── Step 3: Probe the enforced policy ──────────────────────────────────
  # The pods of 04-probe-pods.yaml stand in for the Nova pods (see ENFORCEMENT
  # above). kindnet adds a new pod to its policy set a moment after the pod
  # starts, so the first dropped probe polls until the target's connection
  # times out. The inside client's open probe then shows that kindnet knows
  # the clients, which start together, so the outside client's drop comes from
  # the policy. The console stand-in starts with the target, which the first
  # drop shows kindnet holds, so its open probe meets both policies. The
  # trailing dot keeps the resolver off the search list.
  - try:
    - apply:
        file: 04-probe-pods.yaml
    - script:
        timeout: 8m
        content: |
          set -eu
          kubectl wait --for=condition=Ready --timeout=120s -n openstack \
            pod/nova-netpol-probe-target pod/nova-netpol-probe-sink pod/nova-netpol-probe-vnc
          kubectl wait --for=condition=Ready --timeout=120s -n nova-system pod/nova-netpol-probe-inside
          kubectl wait --for=condition=Ready --timeout=120s -n nova-netpol-outside pod/nova-netpol-probe-outside
          TARGET="$(kubectl get pod nova-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          SINK="$(kubectl get pod nova-netpol-probe-sink -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ] || [ -z "${SINK}" ]; then
            echo "ERROR: a probe pod has no pod IP (target '${TARGET}', sink '${SINK}')"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          # Egress of the pod the policy selects. The first drop proves kindnet holds it.
          "${PROBE}" openstack nova-netpol-probe-target dropped "${SINK}" 5900 9999
          "${PROBE}" openstack nova-netpol-probe-target resolves kubernetes.default.svc.cluster.local.
          "${PROBE}" openstack nova-netpol-probe-target open "${SINK}" 3306 5000 5672 8778 9292 9696 11211
          # Egress of a console proxy pod: the display range of its own policy.
          "${PROBE}" openstack nova-netpol-probe-vnc open "${SINK}" 5900 9999
          # Ingress into the target: a port no rule admits, then the API ports from an admitted
          # and from a foreign namespace.
          "${PROBE}" nova-system nova-netpol-probe-inside dropped "${TARGET}" 9999
          "${PROBE}" nova-system nova-netpol-probe-inside open "${TARGET}" 8774 8775 6080
          "${PROBE}" nova-netpol-outside nova-netpol-probe-outside dropped "${TARGET}" 8774 8775 6080
    catch:
    - script:
        timeout: 2m
        content: |
          echo "=== Probe pods ==="
          kubectl get pods -A -l app.kubernetes.io/instance=nova-netpol -o wide --show-labels 2>&1 || true
          for ref in openstack/nova-netpol-probe-target openstack/nova-netpol-probe-sink \
            nova-system/nova-netpol-probe-inside nova-netpol-outside/nova-netpol-probe-outside \
            openstack/nova-netpol-probe-vnc; do
            echo "--- ${ref} ---"
            kubectl logs -n "${ref%%/*}" "${ref#*/}" 2>&1 || true
            kubectl describe pod -n "${ref%%/*}" "${ref#*/}" 2>&1 | tail -20 || true
          done
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicy -n openstack -l app.kubernetes.io/instance=nova-netpol -o yaml 2>&1 || true
          echo "=== Events (nova-netpol-outside) ==="
          kubectl get events -n nova-netpol-outside 2>&1 || true
  # ── Step 4: Add a second ingress source and assert it lands ────────────
  # Peer arithmetic: the operator appends one peer per declared ingress source
  # plus one for its own Namespace (so the operator's health check reaches the
  # API). One source therefore renders 2 peers and the patched two sources
  # render 3, so `>= 3` is what distinguishes "the patch landed" from "the
  # policy is unchanged". `|| `[]`` is what makes an empty peer list poll on
  # and report "got 0, want >= 3" rather than aborting the assert at its first
  # poll with `invalid type for: <nil>` — which is the regression this step
  # exists to catch.
  - try:
    - patch:
        file: 02-patch-update-ingress.yaml
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: nova-netpol
            namespace: openstack
          (length(spec.ingress[0].from || `[]`) >= `3`): true
    # The patch admits nova-netpol-outside, so its client, which Step 3 saw
    # dropped, now reaches the API ports. That proves the patched policy is
    # enforced and the earlier drop came from the policy.
    - script:
        timeout: 2m
        content: |
          set -eu
          TARGET="$(kubectl get pod nova-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ]; then
            echo "ERROR: the probe target has no pod IP"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          "${PROBE}" nova-netpol-outside nova-netpol-probe-outside open "${TARGET}" 8774 8775 6080
    catch: *nova-dump
  # ── Step 5: Disable networkPolicy and assert both are deleted ──────────
  - try:
    - patch:
        file: 03-patch-disable-networkpolicy.yaml
    - assert:
        resource:
          apiVersion: nova.openstack.c5c3.io/v1alpha1
          kind: Nova
          metadata:
            name: nova-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
    - error:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: nova-netpol
            namespace: openstack
    - error:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: nova-netpol-novncproxy
            namespace: openstack
    catch: *nova-dump
