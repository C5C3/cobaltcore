# Nova CR with spec.networkPolicy for the NetworkPolicy lifecycle test.
#
# The light fixture tier: no Keystone, no Placement, no Neutron and no Glance
# run beside it. A Nova reaches Ready with only Secrets and the broker, because
# the API and metadata probes GET the API root and the scheduler and conductor
# probes read the broker socket. spec.keystoneEndpoint is a convention URL
# nothing serves, and spec.serviceUser reads the kind-only keystone-admin
# Secret from deploy/kind/infrastructure.
#
# The two schemas nova_netpol_api and nova_netpol live on the openstack-db
# MariaDB cluster (cell0 is derived as nova_netpol_cell0), the cache is
# openstack-memcached, and the credentials are the ESO-synced nova-api-db and
# nova-db Secrets. The bus is the per-suite vhost broker-vhost.sh writes into
# nova-netpol-messaging.
#
# One API replica: the policy is a function of the spec, not of the replica
# count, and a second pod would only lengthen the bring-up.
#
# The three sibling endpoint blocks are left at their defaults, which is what
# the sibling egress rule under assertion is derived from: an override-free
# Nova resolves Placement, Neutron and Glance from the catalog, so the operator
# opens the conventional port of each. Cinder and Barbican stay off, so neither
# contributes a port.
#
# The single ingress source selects the openstack namespace. The operator
# appends one peer for its own namespace on top of it, which is the peer
# arithmetic step 3 patches against. No gateway block is set, so no Gateway
# namespace contributes a peer either.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-netpol
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/nova
    tag: "2025.2"
  api:
    deployment:
      replicas: 1
  apiDatabase:
    clusterRef:
      name: openstack-db
    database: nova_netpol_api
    secretRef:
      name: nova-api-db
  database:
    clusterRef:
      name: openstack-db
    database: nova_netpol
    secretRef:
      name: nova-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: nova-netpol-messaging
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  metadata:
    sharedSecretRef:
      name: nova-netpol-metadata-secret
  networkPolicy:
    ingress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openstack
