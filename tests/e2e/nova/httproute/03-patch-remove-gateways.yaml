# Patch: unset all three gateway blocks so the operator deletes all three
# HTTPRoutes.
apiVersion: nova.openstack.c5c3.io/v1alpha1
kind: Nova
metadata:
  name: nova-route
  namespace: openstack
spec:
  gateway: null
  metadata:
    gateway: null
  consoleProxy:
    gateway: null
