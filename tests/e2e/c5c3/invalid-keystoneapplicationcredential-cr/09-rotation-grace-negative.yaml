# A negative grace period is rejected by the CEL rule on the field. The
# error carries 'rotation.gracePeriod is not negative'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneApplicationCredential
metadata:
  name: kac-invalid-grace-negative
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  rotation:
    gracePeriod: -1h
