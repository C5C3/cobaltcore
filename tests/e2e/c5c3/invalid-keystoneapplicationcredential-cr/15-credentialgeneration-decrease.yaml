# credentialGeneration may only increase (CEL transition rule): a rotation
# is never rolled back. The error carries 'credentialGeneration may only
# increase'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneApplicationCredential
metadata:
  name: kac-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  credentialGeneration: 1
