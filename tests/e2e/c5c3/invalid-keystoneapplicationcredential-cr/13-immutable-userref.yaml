# userRef is immutable (CEL transition rule): the credentials belong to the
# user they were minted for. The error carries 'userRef is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneApplicationCredential
metadata:
  name: kac-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: another-user
  projectRef:
    name: workflow-project
  credentialGeneration: 2
