# spec.infrastructure.messaging.secretRef.name is empty. Brownfield messaging
# reads the whole rabbit:// transport URL out of that Secret, so a ref naming no
# Secret addresses no broker at all. The shared SecretRefSpec.Name carries
# MinLength=1, which rejects it at the CRD schema layer; the webhook's
# field.Required on spec.infrastructure.messaging.secretRef.name is the twin for
# a bypassed schema. Only the brownfield mode is declared, so the empty name is
# the only violation.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-messaging-empty-secret-name
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: ""
  services:
    keystone:
      mode: Managed
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
