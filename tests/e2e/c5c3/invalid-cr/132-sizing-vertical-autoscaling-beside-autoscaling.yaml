# A spec.sizing.keystone.api that sets both autoscaling and verticalAutoscaling
# violates the CEL rule on the API sizing type; the webhook mirrors it on the
# component and on the merged sizing. Every HPA scales on the utilization a VPA
# changes.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-vpa-beside-autoscaling
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    keystone:
      api:
        verticalAutoscaling:
          updateMode: "Off"
        autoscaling:
          maxReplicas: 3
          targetCPUUtilization: 80
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
