# Accepted base for the messaging freeze test: a Managed ControlPlane that
# declares the shared message bus in brownfield mode. Brownfield throughout
# (database, cache and messaging all address endpoints outside the cluster), so
# the base provisions nothing and leaves no side effects for the rejection steps
# to clean up, while still carrying a declared messaging block for them to
# freeze.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-transition-g
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
