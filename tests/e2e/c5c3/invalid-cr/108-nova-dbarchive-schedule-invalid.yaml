# services.nova.dbArchive.schedule is not a cron expression. The field is checked
# by the webhook rather than by a CRD pattern: the accepted grammar includes
# descriptors such as @daily, which no regex expresses without also rejecting
# valid expressions. An unparseable schedule reaches the projected archive CronJob,
# which the apiserver then refuses on every pass, so the webhook answers at
# admission and the step anchors on `invalid cron expression`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-nova-bad-schedule
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
    placement: {}
    neutron:
      ovn:
        centralRef:
          name: ovn
    nova:
      dbArchive:
        schedule: every day
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
