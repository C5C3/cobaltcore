# services.glance.backends with no entry violates the CRD MinItems floor: an empty
# list projects no GlanceBackend, so Glance has no image store at all.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-glance-backends-empty
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends: []
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
