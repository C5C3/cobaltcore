# services.glance.publicEndpoint with a non-http(s) scheme violates the CRD
# pattern. The value is advertised verbatim as the public image catalog
# Endpoint, so an unusable scheme could never serve external clients.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-glance-bad-endpoint
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      publicEndpoint: ftp://glance.example.com
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
