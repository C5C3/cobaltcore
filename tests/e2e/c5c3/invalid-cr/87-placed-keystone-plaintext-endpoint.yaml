# Keystone's publicEndpoint must use https as soon as a cluster boundary
# separates Keystone from any service, here by placing Keystone itself
# (webhook-only). With nothing placed, that URL only feeds the Keystone bootstrap
# and the catalog's public identity row; across a boundary it becomes the auth_url
# the operator renders the admin password and every service-account password NEXT
# TO, and those credentials cross that boundary on every mint, re-mint and
# delivery. The ^https?:// pattern on the field admits http:// on purpose for the
# all-local case, so the scheme is checked here instead. Everything else a placed
# service needs is present, so the plaintext endpoint is the only violation.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-placed-keystone-plaintext
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
      namespace:
        name: identity
      publicEndpoint: http://keystone.example.com:5000/v3
      targetClusterRef:
        name: edge
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
