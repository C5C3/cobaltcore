# spec.sizing.cinder.volume.verticalAutoscaling.minAllowed.cpu above
# maxAllowed.cpu is rejected by the validating webhook alone: CEL cannot compare
# quantities across two maps.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-vpa-min-above-max
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    cinder:
      volume:
        verticalAutoscaling:
          updateMode: "Off"
          minAllowed:
            cpu: "2"
          maxAllowed:
            cpu: "1"
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
