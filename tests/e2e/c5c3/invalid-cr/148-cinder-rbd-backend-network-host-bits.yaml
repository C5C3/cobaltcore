# rbd.networks names 10.244.0.1/16, a CIDR with host bits set. It passes the
# Pattern marker and is rejected by the validating webhook (webhook-only)
# through the delegated cinder rule: the network becomes an ipBlock of the
# Cinder's NetworkPolicy, which the API server refuses in that form.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-cinder-rbd-network-host-bits
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    cinder:
      backends:
      - name: rbd1
        type: RBD
        rbd:
          pool: volumes
          user: cinder
          monitors:
          - rook-ceph-mon-a.rook-ceph.svc.cluster.local
          networks:
          - 10.244.0.1/16
          - 10.96.0.0/12
          keySecretRef:
            name: ceph-client-cinder
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
