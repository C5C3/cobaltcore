# A duplicate spec.namespaceAssignments[].allowedRoles entry is rejected by
# the apiserver's listType=set semantics: the role allowlist is a set.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-assignment-duplicate-role
spec:
  openStackRelease: "2025.2"
  services:
    keystone:
      mode: External
      external:
        authURL: https://keystone.example.com/v3
  namespaceAssignments:
  - namespace: tenant-a
    allowedRoles:
    - member
    - member
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
