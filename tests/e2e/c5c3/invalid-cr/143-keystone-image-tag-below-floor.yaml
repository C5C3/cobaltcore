# services.keystone.image.tag below the 2026.1 release floor is rejected by the
# validating webhook (validation.OpenStackReleaseFloor), the mirror of the floor
# the Keystone child applies to the spec.image.tag it is projected into.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-keystone-image-below-floor
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
      image:
        repository: ghcr.io/c5c3/keystone
        tag: "2025.2"
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
