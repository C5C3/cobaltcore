# services.nova.metadataGateway.path carries a prefix, which the webhook refuses:
# it must be empty or "/". The Neutron metadata agent addresses nova-api-metadata
# by scheme, host and port alone (neutron has no path option) and the route
# rewrites nothing, so every request an agent proxies arrives on the root of the
# hostname and a prefix match routes none of them while the HTTPRoute still
# reports Accepted. The gateway is otherwise valid, so the ONLY violation is the
# path.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-nova-metadata-path
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
    placement: {}
    neutron:
      ovn:
        centralRef:
          name: ovn
    nova:
      metadataGateway:
        hostname: nova-metadata.example.com
        parentRef:
          name: openstack-gw
        path: /metadata
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
