# spec.infrastructure.publishedMessagingEndpoint without a port violates the
# Pattern marker: the field is a host:port address. Schema-only, no webhook twin.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-published-messaging-endpoint-invalid
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    publishedMessagingEndpoint: broker.example.com
  services:
    keystone:
      mode: Managed
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
