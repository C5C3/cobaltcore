# An inline spec.korc.serviceAccounts entry managing the Keystone user of a
# DECLARED built-in service is rejected by the webhook: the KeystoneService
# child the ControlPlane projects for that service already owns the user, so
# both mechanisms would provision it and the registration would report a
# permanent ServiceAccountCollision.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-inline-account-collision
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
    serviceAccounts:
    - name: glance
      project:
        name: service
