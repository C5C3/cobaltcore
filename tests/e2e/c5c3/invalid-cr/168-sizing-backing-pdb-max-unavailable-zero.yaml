# spec.sizing.messaging.podDisruptionBudget.maxUnavailable 0 would let no drain
# evict a broker. The Minimum marker on BackingPodDisruptionBudgetSpec answers
# at the CRD schema layer; the webhook mirrors it with `must be at least 1`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-backing-pdb-max-unavailable-zero
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    messaging:
      podDisruptionBudget:
        maxUnavailable: 0
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
