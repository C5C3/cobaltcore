# services.nova.remoteCompute beside an unpublished Keystone is rejected
# (webhook-only): one of publicEndpoint or gateway is required on
# services.keystone, because every compute cluster authenticates against the
# public Keystone URL. The bus is brownfield with tls and the siblings are
# published, so the step anchors on `a compute cluster authenticates against the
# public Keystone URL`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-nova-remote-no-keystone
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
      tls:
        caBundleSecretRef:
          name: bus-ca
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      publicEndpoint: https://glance.example.com
    placement:
      publicEndpoint: https://placement.example.com
    neutron:
      ovn:
        centralRef:
          name: ovn
      publicEndpoint: https://neutron.example.com
    nova:
      remoteCompute:
        transportURLSecretRef:
          name: nova-remote-transport
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
