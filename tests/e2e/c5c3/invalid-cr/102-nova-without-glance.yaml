# services.glance is required as soon as services.nova is set (webhook-only):
# Nova reads the image of every instance it boots, so a compute service declared
# without the image service reaches an endpoint no child serves. Every other block
# is the valid one, so the missing glance is the only violation and the step
# anchors on `is required when services.nova is set`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-nova-no-glance
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    placement: {}
    neutron:
      ovn:
        centralRef:
          name: ovn
    nova: {}
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
