# spec.sizing.cinder.scheduler.verticalAutoscaling.minReplicas of zero violates
# the Minimum=1 marker; the webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-vpa-min-replicas-zero
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    cinder:
      scheduler:
        verticalAutoscaling:
          updateMode: Auto
          minReplicas: 0
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
