# spec.sizing.neutron.workers.verticalAutoscaling.minAllowed naming ephemeral-
# storage violates the CEL rule on VerticalAutoscalingSpec; the webhook mirrors
# it.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-vpa-foreign-resource
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    neutron:
      workers:
        verticalAutoscaling:
          updateMode: "Off"
          minAllowed:
            ephemeral-storage: 1Gi
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
