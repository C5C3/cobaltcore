# services.nova.consoleProxy.gateway beside enabled: false violates the CEL rule
# on ServiceNovaConsoleProxySpec. A disabled proxy has no listener to expose, so
# the value would have nowhere to land. The rule is intra-struct and has no
# webhook twin, so CRD schema validation answers and the step anchors on the CEL
# message, `gateway must not be set when consoleProxy.enabled is false`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-nova-console-disabled
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
    placement: {}
    neutron:
      ovn:
        centralRef:
          name: ovn
    nova:
      consoleProxy:
        enabled: false
        gateway:
          hostname: nova-novnc.example.com
          parentRef:
            name: openstack-gw
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
