# services.placement.publicEndpoint with a non-http(s) scheme violates the CRD
# pattern. The value is advertised verbatim as the public placement catalog
# Endpoint, so an unusable scheme could never serve the compute services that
# place their allocations through it.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-placement-bad-endpoint
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    placement:
      publicEndpoint: ftp://placement.example.com
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
