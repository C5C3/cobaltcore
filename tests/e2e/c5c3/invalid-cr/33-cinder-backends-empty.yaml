# services.cinder.backends is empty. A Cinder with no volume backend accepts a
# volume request and leaves it in error, so the list carries MinItems=1 and the CR
# is rejected at the CRD schema layer, before the webhook mirror in
# validateCinderBackends runs. The step therefore anchors on the API server's
# marker message rather than the webhook's.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-cinder-backends-empty
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    cinder:
      backends: []
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
