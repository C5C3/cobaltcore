# A spec.sizing.keystone.api.podDisruptionBudget.maxUnavailable of "half" is
# neither an integer nor a percentage. The int-or-string schema admits any
# string, so the webhook answers on the sizing as written (webhook-only).
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-pdb-malformed-value
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    keystone:
      api:
        podDisruptionBudget:
          maxUnavailable: "half"
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
