# services.barbican.secretStore naming NEITHER mode violates the same CEL union
# rule from the other side. A Barbican with no store attached parks on
# SecretStoresReady=False/NoDefaultSecretStore for as long as it exists, so the
# block would only ever project a child that can never reach Ready. The webhook
# mirrors the rule for an API server old enough to skip x-kubernetes-validations.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-barbican-store-neither
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    barbican:
      secretStore: {}
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
