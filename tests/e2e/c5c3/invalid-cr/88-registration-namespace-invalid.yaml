# spec.korc.serviceRegistrations.allowedNamespaces[] outside the RFC-1123
# label shape is rejected (CRD items pattern): each entry names a Kubernetes
# namespace the registration gate admits KeystoneService CRs from, so a value
# no namespace can carry would sit in the allowlist admitting nothing.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-registration-bad-namespace
spec:
  openStackRelease: "2025.2"
  services:
    keystone:
      mode: External
      external:
        authURL: https://keystone.example.com/v3
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
    serviceRegistrations:
      allowedNamespaces:
      - Tenant_A
