# SECRET_KEY in services.horizon.extraConfig is forbidden by the webhook
# (Family A, unconditional): it is managed via services.horizon.secretKeyRef, and
# an override in extraConfig would collide with the operator-projected Django
# session key.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-horizon-extraconfig-secret-key
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    horizon:
      extraConfig:
        SECRET_KEY: hunter2
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
