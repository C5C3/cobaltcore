# services.keystone.targetClusterRef in External mode violates the CEL rule: no
# Keystone workload is deployed, so there is nothing to place on another cluster.
# The rest of the CR is the minimal External sketch, so the ref is the only
# violation.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-external-target-cluster
spec:
  openStackRelease: "2025.2"
  services:
    keystone:
      mode: External
      external:
        authURL: https://keystone.example.com/v3
      targetClusterRef:
        name: edge
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
