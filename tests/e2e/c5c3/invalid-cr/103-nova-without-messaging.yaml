# spec.infrastructure.messaging is required as soon as services.nova is set, and
# the webhook is the only layer that can say so: the Nova CRD requires
# spec.messaging and the ControlPlane derives the child's transport URL from the
# shared bus, so a ControlPlane declaring the compute service without a bus would
# project a child its own admission rejects on every pass. The infrastructure
# block is the brownfield one every Managed fixture carries, minus the messaging
# entry. services.neutron requires the bus too and the base declares it, so the
# error names spec.infrastructure.messaging twice; the step anchors on the nova
# sentence, `is required when services.nova is set`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-nova-no-messaging
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
    placement: {}
    neutron:
      ovn:
        centralRef:
          name: ovn
    nova: {}
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
