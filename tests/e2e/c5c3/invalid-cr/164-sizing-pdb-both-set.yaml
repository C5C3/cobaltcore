# A spec.sizing.keystone.api.podDisruptionBudget that sets both minAvailable and
# maxUnavailable violates the CEL rule on the shared PodDisruptionBudgetSpec,
# which answers first; the webhook mirrors it on the sizing as written.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-pdb-both-set
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    keystone:
      api:
        podDisruptionBudget:
          minAvailable: 1
          maxUnavailable: 1
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
