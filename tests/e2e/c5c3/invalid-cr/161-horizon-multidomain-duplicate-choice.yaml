# services.horizon.multiDomain lists the same domain name twice. No schema
# rule sees duplicates; the webhook's delegated ValidateMultiDomain rejects it.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-horizon-multidomain-duplicate-choice
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    horizon:
      multiDomain:
        enabled: true
        domainDropdown: true
        domainChoices:
        - name: Default
          label: Default
        - name: Default
          label: Default again
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
