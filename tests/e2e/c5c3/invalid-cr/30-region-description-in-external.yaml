# spec.regionDescription set in External mode is forbidden by the webhook
# (cross-field): no Region CR is adopted against a pre-existing installation,
# so the description would be silently inert rather than applied.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-external-region-description
spec:
  openStackRelease: "2025.2"
  regionDescription: "Frankfurt DC2"
  services:
    keystone:
      mode: External
      external:
        authURL: https://keystone.example.com/v3
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
