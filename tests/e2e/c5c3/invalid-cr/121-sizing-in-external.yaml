# spec.sizing is forbidden in External mode (webhook): no workload is deployed, so
# a sizing profile has nothing to size. The step anchors on `forbidden when
# services.keystone.mode is External (no workload is deployed)`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-external
spec:
  openStackRelease: "2025.2"
  services:
    keystone:
      mode: External
      external:
        authURL: https://keystone.example.com/v3
  sizing:
    profile: Minimal
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
