# services.glance.importFiltering sets allowedHosts AND disallowedHosts, which
# violates the CEL mutual-exclusivity rule: glance evaluates the deny-list only
# while the allow-list is empty, so the deny-list would be silently dropped. The
# rest of the glance block is valid, so the ONLY violation is the host pair.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-glance-importfiltering-hosts
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      importFiltering:
        allowedHosts:
        - mirror.example.com
        disallowedHosts:
        - 169.254.169.254
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
