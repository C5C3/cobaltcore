# spec.openStackRelease below the 2026.1 release floor passes the CRD pattern
# and is rejected by the validating webhook (validation.OpenStackReleaseFloor).
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-release-below-floor
spec:
  openStackRelease: "2025.2"
  services:
    keystone:
      mode: External
      external:
        authURL: https://keystone.example.com/v3
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
