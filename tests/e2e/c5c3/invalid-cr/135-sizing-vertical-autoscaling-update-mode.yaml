# spec.sizing.nova.conductor.verticalAutoscaling.updateMode outside Off,
# Initial, Recreate, InPlaceOrRecreate and Auto violates the Enum marker; the
# webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-vpa-update-mode
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    nova:
      conductor:
        verticalAutoscaling:
          updateMode: Sometimes
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
