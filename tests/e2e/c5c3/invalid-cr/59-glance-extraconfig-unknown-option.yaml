# services.glance.extraConfig sets an unknown option (default_backend_typo) in
# the known [glance_store] section: rejected by the webhook because it is absent
# from the glance 2025.2 option catalog. The rest of the glance block is valid, so
# the ONLY violation is the per-service catalog check.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-glance-extraconfig-unknown
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      extraConfig:
        glance_store:
          default_backend_typo: rbd
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
