# spec.sizing names a built-in profile and a SizingProfile at once, which the CEL
# rule on ControlPlaneSizingSpec rejects: the base of the resolved sizing would
# be ambiguous. CRD schema validation answers before the webhook looks the
# profile up, so the step anchors on the CEL message, `profile and profileRef are
# mutually exclusive`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-profile-and-ref
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    profile: Minimal
    profileRef:
      name: c5c3-e2e-sizing-absent
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
