# services.placement.publicEndpoint must name the same host as
# services.placement.gateway.hostname. The Gateway listener is what routes that
# hostname to the Placement API, so a divergent host advertises a catalog endpoint
# that never reaches it. The value is projected into no child CR, so this webhook
# is the only gate on the URL every compute service resolves to place its
# allocations.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-placement-endpoint-host-mismatch
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    placement:
      gateway:
        hostname: placement.example.com
        parentRef:
          name: openstack-gw
      publicEndpoint: https://allocations.example.com
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
