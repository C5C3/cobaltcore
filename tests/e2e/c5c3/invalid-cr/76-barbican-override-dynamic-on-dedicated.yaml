# databaseCredentialsMode Dynamic on the Barbican service is rejected by the
# webhook when Barbican declares a DEDICATED database, mirroring the keystone,
# glance, and placement twins: the override retargets the shared database this
# service does not use, and a dedicated database is Static-only. The defaulting
# webhook injects the barbican service account, so the only violation is the
# credentials-mode override.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-override-dynamic-dedicated-bn
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    barbican:
      secretStore:
        dedicated: {}
      databaseCredentialsMode: Dynamic
      dedicatedBackingServices:
        database:
          clusterRef:
            name: cp-dedicated-db
          database: barbican
          secretRef:
            name: barbican-db
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
