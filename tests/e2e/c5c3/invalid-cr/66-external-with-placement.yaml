# services.placement set in External mode is forbidden by the webhook (cross-field,
# mirrors services.glance): Placement needs its own External-mode design. Every
# ServicePlacementSpec field is optional, so the empty block is valid and the ONLY
# violation is the cross-field forbid.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-external-with-placement
spec:
  openStackRelease: "2025.2"
  services:
    keystone:
      mode: External
      external:
        authURL: https://keystone.example.com/v3
    placement: {}
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
