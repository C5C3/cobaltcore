# spec.sizing.nova.consoleProxy beside services.nova.consoleProxy.enabled: false
# (webhook-only): a disabled proxy has no Deployment to size, and the Nova CRD
# rejects a spec.consoleProxy.deployment written on a disabled proxy. The step
# anchors on `must not be set when services.nova.consoleProxy.enabled is false`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-console-disabled
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
    placement: {}
    neutron:
      ovn:
        centralRef:
          name: ovn
    nova:
      consoleProxy:
        enabled: false
  sizing:
    nova:
      consoleProxy:
        replicas: 2
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
