# services.glance.publicEndpoint must be a bare origin. The ^https?:// pattern
# anchors only the prefix, so a query string is schema-legal — and since the
# Glance API is served at the root, clients append the API path to the catalog
# endpoint and 404 on every image call.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-glance-endpoint-with-query
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      publicEndpoint: https://glance.example.com?utm=1
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
