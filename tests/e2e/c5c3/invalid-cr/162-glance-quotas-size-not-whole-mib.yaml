# services.glance.quotas.imageSizeTotal of 1536Ki is rejected by the webhook
# (validateGlanceQuotas): Keystone stores Glance's image quotas in MiB, and 1536Ki
# is 1.5Mi. A Quantity carries no marker for that, so the rule is webhook-only.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-glance-quotas-size
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      quotas:
        imageSizeTotal: 1536Ki
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
