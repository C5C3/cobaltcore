# A services.cinder.backends entry of type RBD without an rbd block violates the
# CEL union rule on CinderBackendEntry: the Ceph driver has no pool, user or
# monitor to address. The rule answers at the CRD schema layer, before the
# webhook mirror in validateCinderBackends runs, so the step anchors on the
# rule's message.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-cinder-rbd-without-rbd
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    cinder:
      backends:
      - name: rbd1
        type: RBD
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
