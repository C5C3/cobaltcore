# spec.sizing.database.antiAffinity Strict is none of Required, Preferred and
# Off. The Enum marker on AntiAffinityMode answers at the CRD schema layer; the
# webhook mirrors it with field.NotSupported on the sizing as written.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-anti-affinity-unsupported
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    database:
      antiAffinity: Strict
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
