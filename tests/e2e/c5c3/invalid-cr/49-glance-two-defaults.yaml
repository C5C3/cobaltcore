# Two backends both setting isDefault violate the single-default CEL rule: the
# Glance default_backend would be ambiguous. The webhook mirrors the rule.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-glance-two-defaults
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      - name: secondary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3-2.example.com
          bucket: images2
          credentialsSecretRef:
            name: glance-s3-creds-2
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
