# services.horizon.multiDomain turns on a domain dropdown without any
# domainChoices, which would render an empty select. The CEL rule of the
# embedded horizon MultiDomainSpec, copied into the ControlPlane CRD, answers
# at the CRD schema layer before the webhook's delegated mirror runs.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-horizon-multidomain-no-choices
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    horizon:
      multiDomain:
        enabled: true
        domainDropdown: true
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
