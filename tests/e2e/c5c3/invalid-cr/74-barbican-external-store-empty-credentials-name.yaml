# services.barbican.secretStore.external.credentialsSecretRef.name empty violates
# the SecretNameRefSpec MinLength marker, mirroring the keystone caBundleSecretRef
# fixture: the external store authenticates with the AppRole credentials that
# Secret holds, so an unnamed reference resolves to nothing. Schema validation runs
# before the validating webhook, so the marker is what rejects this CR and the
# chainsaw step anchors on its message; the webhook mirrors the rule for callers
# that bypass the schema.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-barbican-store-empty-creds
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    barbican:
      secretStore:
        external:
          url: https://openbao.example.com:8200
          credentialsSecretRef:
            name: ""
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
