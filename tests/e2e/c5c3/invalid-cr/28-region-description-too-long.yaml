# spec.regionDescription is 256 characters, one over the MaxLength=255 the
# field carries, which mirrors K-ORC's bound on
# RegionResourceSpec.Description: a longer value would be refused by the
# Region CR the ControlPlane adopts, once the ControlPlane itself had already
# been admitted. The marker is the whole enforcement by decision, with no
# webhook mirror, so the rejection at admission is the API server's own and
# the step anchors on the field name plus `Too long`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-region-description-too-long
spec:
  openStackRelease: "2025.2"
  regionDescription: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
