# services.horizon.extraConfig.SESSION_ENGINE beside a services.horizon.session
# block would win the child's render-time merge and drop the block. No schema
# rule sees extraConfig; the webhook's delegated ValidateSession rejects it.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-horizon-session-extraconfig-engine
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    horizon:
      session:
        backend: Cache
      extraConfig:
        SESSION_ENGINE: "django.contrib.sessions.backends.signed_cookies"
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
