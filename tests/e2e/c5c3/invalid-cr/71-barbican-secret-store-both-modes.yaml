# services.barbican.secretStore setting BOTH dedicated and external violates the
# type-level CEL union rule: the two modes address different servers with
# different credentials, so a block naming both leaves the projection no way to
# tell which server barbican writes its secret material to. The external block is
# itself valid, so the ONLY violation is the union.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-barbican-store-both
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    barbican:
      secretStore:
        dedicated: {}
        external:
          url: https://openbao.example.com:8200
          credentialsSecretRef:
            name: barbican-approle
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
