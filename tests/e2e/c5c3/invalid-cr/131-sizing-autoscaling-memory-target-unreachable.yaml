# A Keystone API memory target of 150 while the merged sizing names no memory
# (webhook-only): the render-time default makes the memory request and limit
# equal, so the pod can never use more than 100% of its request and the HPA
# would never scale out. The step anchors on
# `spec.sizing.keystone.api.autoscaling.targetMemoryUtilization` and `can never
# be reached`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-memory-unreachable
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    keystone:
      api:
        autoscaling:
          maxReplicas: 3
          targetMemoryUtilization: 150
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
