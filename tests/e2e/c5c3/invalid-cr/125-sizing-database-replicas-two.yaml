# spec.sizing.database.replicas: 2 (webhook-only): two Galera nodes cannot hold a
# majority, so a partition takes the database offline. The step anchors on
# `spec.sizing.database.replicas` and `2 cannot hold a majority`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-db-two
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    database:
      replicas: 2
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
