# UPDATE replacing nfsbk with the RBD backup target rbdbk is admitted: a new name
# projects a new satellite, and the reconciler prunes the old one before it
# projects the new one. nfs is explicitly nulled, as in the previous step, so the
# merge patch does not retain the base's nfs block.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-transition-h
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      secretRef:
        name: bus-url
  services:
    keystone:
      mode: Managed
    cinder:
      backends:
      - name: nfs1
        type: NFS
        nfs:
          server: nfs-server.openstack.svc.cluster.local
          path: /volumes
      - name: rbd1
        type: RBD
        rbd:
          pool: volumes
          user: cinder
          monitors:
          - rook-ceph-mon-a.rook-ceph.svc.cluster.local
          networks:
          - 10.244.0.0/16
          - 10.96.0.0/12
          keySecretRef:
            name: ceph-client-cinder
      backupBackend:
        name: rbdbk
        type: RBD
        nfs: null
        rbd:
          pool: backups
          user: cinder-backup
          monitors:
          - rook-ceph-mon-a.rook-ceph.svc.cluster.local
          networks:
          - 10.244.0.0/16
          - 10.96.0.0/12
          keySecretRef:
            name: ceph-client-cinder-backup
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
