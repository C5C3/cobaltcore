# Accepted base for the release-downgrade test: a brownfield,
# keystone-unset (staged-adoption) ControlPlane at 2026.2. It projects no
# service child, so the persisting base provisions nothing and pulls no 2026.2
# image.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-transition-i
spec:
  openStackRelease: "2026.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
