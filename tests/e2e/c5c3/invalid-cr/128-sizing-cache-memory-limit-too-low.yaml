# spec.sizing.cache.resources.limits.memory: 64Mi (webhook-only): the Memcached
# operator requires maxMemoryMB (64) plus 32Mi. The step anchors on
# `spec.sizing.cache.resources.limits.memory` and `memory limit must be at least
# 96Mi`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-cache-64mi
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    cache:
      resources:
        limits:
          memory: 64Mi
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
