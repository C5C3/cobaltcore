# services.nova.remoteCompute beside a managed bus is forbidden (webhook-only). A
# managed RabbitmqCluster is provisioned without a TLS listener, and a compute
# cluster reaches the bus across a cluster boundary. Keystone and the three
# siblings are published over https, so the managed bus is the ONLY violation
# and the step anchors on `requires a brownfield bus with tls`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-nova-remote-managed-bus
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
    messaging:
      clusterRef:
        name: rabbitmq
  services:
    keystone:
      mode: Managed
      publicEndpoint: https://keystone.example.com/v3
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      publicEndpoint: https://glance.example.com
    placement:
      publicEndpoint: https://placement.example.com
    neutron:
      ovn:
        centralRef:
          name: ovn
      publicEndpoint: https://neutron.example.com
    nova:
      remoteCompute:
        transportURLSecretRef:
          name: nova-remote-transport
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
