# A spec.sizing.nodeSelector key with a space is not a label key (webhook-only):
# the schema cannot check the keys of a map, and every projected pod template
# would be refused. The step anchors on `spec.sizing.nodeSelector` and `bad key`.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-sizing-bad-selector
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
  sizing:
    nodeSelector:
      "bad key": control
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
