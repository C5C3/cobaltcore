# services.glance.extraConfig setting [DEFAULT] use_keystone_limits is forbidden
# by the webhook: the key belongs to the Glance child's spec.keystoneLimits, which
# services.glance.quotas drives, and a hand-set value refuses every image create
# or drops the quotas.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp-glance-extraconfig-limits
spec:
  openStackRelease: "2026.1"
  infrastructure:
    database:
      host: db.example.com
      database: openstack
      secretRef:
        name: db-creds
    cache:
      backend: dogpile.cache.pymemcache
      servers:
      - mc:11211
  services:
    keystone:
      mode: Managed
    glance:
      backends:
      - name: primary
        type: S3
        isDefault: true
        s3:
          endpoint: https://s3.example.com
          bucket: images
          credentialsSecretRef:
            name: glance-s3-creds
      extraConfig:
        DEFAULT:
          use_keystone_limits: "true"
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: external-admin
        key: password
