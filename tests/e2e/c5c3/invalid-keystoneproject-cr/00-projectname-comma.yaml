# projectName carrying a comma is rejected by the CRD pattern that mirrors
# K-ORC's KeystoneName: admitted, the name would only be rejected by the
# K-ORC CRD, which wedges the reconcile. The error carries 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneProject
metadata:
  name: kp-invalid-projectname-comma
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  projectName: a,b
