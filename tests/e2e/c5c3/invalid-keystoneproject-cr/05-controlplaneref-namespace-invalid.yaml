# controlPlaneRef.namespace 'Bad_NS' violates the RFC-1123 label pattern
# (CRD marker). The error carries 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneProject
metadata:
  name: kp-invalid-ref-namespace
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
    namespace: Bad_NS
