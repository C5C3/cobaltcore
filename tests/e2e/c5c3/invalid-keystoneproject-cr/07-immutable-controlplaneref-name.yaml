# controlPlaneRef.name is immutable (CEL transition rule): the edit would
# strand the Keystone project the order created on the old plane. The error
# carries 'controlPlaneRef.name is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneProject
metadata:
  name: kp-immutable
spec:
  controlPlaneRef:
    name: cp-other
  projectName: svc-project
