# controlPlaneRef.name is immutable (CEL transition rule): the edit would
# strand the Keystone user the order created on the old plane. The error
# carries 'controlPlaneRef.name is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneUser
metadata:
  name: ku-immutable
spec:
  controlPlaneRef:
    name: cp-other
  userName: svc-user
  passwordGeneration: 2
