# controlPlaneRef.namespace is immutable (CEL transition rule), also when
# the base left it to the order's own namespace. The error carries
# 'controlPlaneRef.namespace is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneUser
metadata:
  name: ku-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
    namespace: elsewhere
  userName: svc-user
  passwordGeneration: 2
