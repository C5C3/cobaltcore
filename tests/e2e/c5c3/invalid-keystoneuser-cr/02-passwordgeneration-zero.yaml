# passwordGeneration 0 is rejected by the CRD minimum; the schema default
# is 1. The error carries 'should be greater than or equal to 1'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneUser
metadata:
  name: ku-invalid-generation-zero
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  passwordGeneration: 0
