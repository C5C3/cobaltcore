# passwordGeneration may only increase (CEL transition rule): a lower value
# would roll the password back. The error carries 'passwordGeneration may
# only increase'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneUser
metadata:
  name: ku-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userName: svc-user
  passwordGeneration: 1
