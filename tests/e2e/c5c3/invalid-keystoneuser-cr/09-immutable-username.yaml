# userName is immutable (root CEL transition rule over the effective name):
# the name identifies a live Keystone user. The error carries 'userName is
# immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneUser
metadata:
  name: ku-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userName: svc-user-renamed
  passwordGeneration: 2
