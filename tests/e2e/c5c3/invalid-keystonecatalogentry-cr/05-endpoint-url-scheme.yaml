# An endpoint URL with the ftp scheme violates the http(s) pattern of the
# endpoint type KeystoneService shares. The error carries 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneCatalogEntry
metadata:
  name: kce-invalid-endpoint-url-scheme
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  serviceType: dns
  endpoints:
  - interface: public
    url: ftp://x
