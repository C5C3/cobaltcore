# Valid base for the immutability wave. It is applied FIRST and must
# SUCCEED. The 13-16 variants reuse this metadata.name, so Chainsaw applies
# each of them to the live object as an UPDATE, which is what makes the CEL
# transition rules evaluate at all. serviceName is declared explicitly.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneCatalogEntry
metadata:
  name: kce-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  serviceType: dns
  serviceName: svc-dns
  endpoints:
  - interface: public
    url: https://dns.example.test/v2
