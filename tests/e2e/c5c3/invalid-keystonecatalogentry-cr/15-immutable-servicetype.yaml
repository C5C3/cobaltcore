# serviceType is immutable (CEL transition rule): the collision probe runs
# only while no managed Service exists. The error carries 'serviceType is
# immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneCatalogEntry
metadata:
  name: kce-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  serviceType: image
  serviceName: svc-dns
  endpoints:
  - interface: public
    url: https://dns.example.test/v2
