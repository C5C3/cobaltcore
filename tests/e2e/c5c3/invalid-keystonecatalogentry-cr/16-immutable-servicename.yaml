# serviceName is immutable (root CEL transition rule over the effective
# name), for the reason serviceType is. The error carries 'serviceName is
# immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneCatalogEntry
metadata:
  name: kce-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  serviceType: dns
  serviceName: svc-dns-renamed
  endpoints:
  - interface: public
    url: https://dns.example.test/v2
