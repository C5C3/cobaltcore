# An endpoint interface outside public, internal and admin is rejected by
# the CRD enum. The error carries 'Unsupported value'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneCatalogEntry
metadata:
  name: kce-invalid-endpoint-interface
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  serviceType: dns
  endpoints:
  - interface: private
    url: https://dns.example.test/v2
