# A 1025-byte endpoint URL is rejected by the CRD maximum that mirrors
# K-ORC's own EndpointResourceSpec.URL cap. The error carries 'Too long'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneCatalogEntry
metadata:
  name: kce-invalid-endpoint-url-too-long
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  serviceType: dns
  endpoints:
  - interface: public
    url: https:
