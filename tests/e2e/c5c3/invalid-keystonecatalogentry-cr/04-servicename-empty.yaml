# An empty serviceName is rejected by the CRD minimum: the default is
# spelled by leaving the field out, which means metadata.name. The error
# carries 'should be at least 1 chars'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneCatalogEntry
metadata:
  name: kce-invalid-servicename-empty
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  serviceType: dns
  serviceName: ""
