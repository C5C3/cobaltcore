# serviceType 'DNS' violates the DNS-1123 label pattern (CRD marker). The
# error carries 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneCatalogEntry
metadata:
  name: kce-invalid-servicetype-uppercase
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  serviceType: DNS
