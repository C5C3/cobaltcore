# ControlPlane CR fixture for the db-credential-scoping E2E test
# (CC-0116, REQ-001). It owns namespace `db-cred-scope` and the single
# ControlPlane `controlplane` in it.
#
# CC-0116 scopes the Keystone DATABASE credential per-ControlPlane in the
# cluster-global OpenBao backend: the c5c3-operator's reconcileDBCredentials
# sub-reconciler projects an owned ExternalSecret
#   controlplane-keystone-db-credentials  (keystoneName(cp) + "-db-credentials")
# that reads the per-CP OpenBao path
#   openstack/keystone/db-cred-scope/controlplane/db
# (dbCredentialRemoteKeyFor; read back via `bao kv get` as the kv-v2 path
#   kv-v2/openstack/keystone/db-cred-scope/controlplane/db), replacing the
# legacy shared flat openstack/keystone/db path so two ControlPlanes never
# resolve to the same DB credential
# (operators/c5c3/internal/controller/reconcile_dbcredentials.go).
#
# DECISION (CC-0116, REQ-001): namespace `db-cred-scope` / ControlPlane name
# `controlplane`. The suite runs with chainsaw parallel:4 + failFast:true
# (tests/e2e/chainsaw-config.yaml) and the validating webhook (CC-0112) enforces
# ONE ControlPlane per namespace, so this test MUST NOT place a second
# ControlPlane in the `openstack` namespace that full-controlplane-keystone
# already occupies (CP "controlplane-keystone") — concurrent CREATE there would
# be webhook-rejected. We therefore use a DEDICATED namespace (bundled below,
# mirroring multi-controlplane's 00-tenant-a-controlplane.yaml) and the test
# SEEDS the per-CP DB OpenBao path inside the script before applying this CR
# (the deploy bootstrap only seeds the default openstack/controlplane identity,
# not this one). This keeps the test self-contained when the stack is present
# and SKIPs cleanly otherwise.
#
# DECISION (CC-0116, REQ-001): managed mode (database.clusterRef + cache.clusterRef
# set) is REQUIRED — only managed mode provisions an operator-owned DB credential.
# In brownfield mode (clusterRef nil) reconcileDBCredentials creates NO
# ExternalSecret and sets DBCredentialsReady=True immediately
# (reason BrownfieldDatabase), so there would be nothing to scope. The managed
# shape mirrors full-controlplane-keystone so the chain reads against
# production-shaped infrastructure when the fast-follow CI wiring lands. The
# korc.adminCredential block is present because the validating webhook requires
# korc.adminCredential.passwordSecretRef.name even though this test stops at
# DBCredentialsReady (it does not drive the chain past Keystone).
apiVersion: v1
kind: Namespace
metadata:
  name: db-cred-scope
---
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: controlplane
  namespace: db-cred-scope
spec:
  openStackRelease: "2025.2"
  region: RegionOne
  infrastructure:
    database:
      clusterRef:
        name: openstack-db
      database: keystone
      secretRef:
        name: keystone-db
    cache:
      clusterRef:
        name: openstack-memcached
      backend: dogpile.cache.pymemcache
      replicas: 3
  services:
    keystone:
      replicas: 3
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
        secretName: k-orc-clouds-yaml
      passwordSecretRef:
        name: keystone-admin
        key: password
      applicationCredential:
        # restricted:true keeps the admin AC least-privilege (REQ-013) and
        # projects to K-ORC's spec.resource.unrestricted=false.
        restricted: true
        rotation:
          mode: PasswordDriven
