# ControlPlane CR fixture for the db-credential-scoping E2E test
#
# A minimal managed-mode ControlPlane named "controlplane". It carries no
# namespace: the suite applies it into chainsaw's ephemeral namespace with
# `kubectl apply -n`. Its name is LOAD-BEARING for this suite: the
# c5c3-operator's reconcileDBCredentials derives the per-ControlPlane
# DB-credential ExternalSecret/Secret name
#   keystoneName(cp) + "-db-credentials" = "controlplane-keystone-db-credentials"
# and the per-tenant dynamic engine creds path
#   database/mariadb/creds/keystone-{cp.KeystoneNamespace()}
#     = database/mariadb/creds/keystone-<namespace>
# (dbDynamicRoleFor, keyed on the namespace alone), whose engine role the test
# onboards via deploy/openbao/bootstrap/setup-database-tenant.sh.
#
# ── DECISION: a fresh CR in the suite's own namespace ───────────────────────
# The suite seeds the plane's admin-password path itself with
# write-bootstrap-secrets.sh before it applies this CR, so nothing depends on
# what deploy-infra seeded or onboarded. The CR omits spec.infrastructure, which
# the defaulting webhook fills with the well-known managed clusters
# (openstack-db, openstack-memcached), and it omits a gateway block: Gateway
# openstack-gw admits routes from its own namespace only.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: controlplane
spec:
  openStackRelease: "2026.1"
  services:
    keystone: {}
  sizing:
    profile: Minimal
