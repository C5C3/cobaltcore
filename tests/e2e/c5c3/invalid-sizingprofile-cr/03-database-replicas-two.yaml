# database.replicas: 2 (webhook-only): two Galera nodes cannot hold a majority.
# The error names `spec.database.replicas` and carries `2 cannot hold a majority`.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-db-two
spec:
  base: Minimal
  database:
    replicas: 2
