# A spec.keystone.api.podDisruptionBudget.maxUnavailable of "half" is neither an
# integer nor a percentage. The int-or-string schema admits any string, so the
# webhook answers (webhook-only).
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-pdb-malformed-value
spec:
  base: Minimal
  keystone:
    api:
      podDisruptionBudget:
        maxUnavailable: "half"
