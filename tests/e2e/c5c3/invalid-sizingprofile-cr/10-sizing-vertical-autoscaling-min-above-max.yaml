# spec.cinder.volume.verticalAutoscaling.minAllowed.cpu above maxAllowed.cpu is
# rejected by the validating webhook alone: CEL cannot compare quantities across
# two maps.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-vpa-min-above-max
spec:
  base: Minimal
  cinder:
    volume:
      verticalAutoscaling:
        updateMode: "Off"
        minAllowed:
          cpu: "2"
        maxAllowed:
          cpu: "1"
