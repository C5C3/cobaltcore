# A spec.keystone.api that sets both autoscaling and verticalAutoscaling
# violates the CEL rule on the API sizing type; the webhook mirrors it on the
# component and on the merged sizing. Every HPA scales on the utilization a VPA
# changes.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-vpa-beside-autoscaling
spec:
  base: Minimal
  keystone:
    api:
      verticalAutoscaling:
        updateMode: "Off"
      autoscaling:
        maxReplicas: 3
        targetCPUUtilization: 80
