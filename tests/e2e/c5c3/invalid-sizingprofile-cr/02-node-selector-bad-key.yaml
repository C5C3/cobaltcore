# A nodeSelector key with a space is not a label key (webhook-only): the schema
# cannot check the keys of a map. The error names `spec.nodeSelector` and the key.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-bad-selector
spec:
  base: Minimal
  nodeSelector:
    "bad key": control
