# spec.cinder.scheduler.verticalAutoscaling.minReplicas of zero violates the
# Minimum=1 marker; the webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-vpa-min-replicas-zero
spec:
  base: Minimal
  cinder:
    scheduler:
      verticalAutoscaling:
        updateMode: Auto
        minReplicas: 0
