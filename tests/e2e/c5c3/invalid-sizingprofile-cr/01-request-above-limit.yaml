# A memory request above its limit (webhook-only): the schema cannot compare two
# quantities, and every projected pod would be refused. The error names
# `spec.messaging.resources.requests.memory`.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-request-above-limit
spec:
  base: Minimal
  messaging:
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 1Gi
