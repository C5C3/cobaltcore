# database.applierThreads of 513 violates the Maximum=512 marker, the largest
# wsrep_slave_threads MariaDB 12.3.3 accepts; the webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-db-applier-threads-513
spec:
  base: Minimal
  database:
    applierThreads: 513
