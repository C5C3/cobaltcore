# cache.resources.limits.memory: 64Mi (webhook-only): the Memcached operator
# requires maxMemoryMB (64) plus 32Mi. The error carries `memory limit must be at
# least 96Mi`.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-cache-64mi
spec:
  base: Minimal
  cache:
    resources:
      limits:
        memory: 64Mi
