# spec.base names no built-in profile. Rejected by the Enum marker on
# SizingProfileName before the webhook runs; the error carries
# `Unsupported value`.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-base-unknown
spec:
  base: Large
