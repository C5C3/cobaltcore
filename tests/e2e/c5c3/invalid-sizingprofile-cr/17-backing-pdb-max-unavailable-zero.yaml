# database.podDisruptionBudget.maxUnavailable of 0 violates the Minimum=1
# marker on BackingPodDisruptionBudgetSpec; the webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-backing-pdb-max-unavailable-zero
spec:
  base: Minimal
  database:
    podDisruptionBudget:
      maxUnavailable: 0
