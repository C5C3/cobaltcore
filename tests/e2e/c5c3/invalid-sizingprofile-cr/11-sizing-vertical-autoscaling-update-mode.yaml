# spec.nova.conductor.verticalAutoscaling.updateMode outside Off, Initial,
# Recreate and Auto violates the Enum marker; the webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-vpa-update-mode
spec:
  base: Minimal
  nova:
    conductor:
      verticalAutoscaling:
        updateMode: Sometimes
