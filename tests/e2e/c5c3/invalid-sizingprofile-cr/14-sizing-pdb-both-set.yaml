# A spec.keystone.api.podDisruptionBudget that sets both minAvailable and
# maxUnavailable violates the CEL rule on the shared PodDisruptionBudgetSpec,
# which answers first; the webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-pdb-both-set
spec:
  base: Minimal
  keystone:
    api:
      podDisruptionBudget:
        minAvailable: 1
        maxUnavailable: 1
