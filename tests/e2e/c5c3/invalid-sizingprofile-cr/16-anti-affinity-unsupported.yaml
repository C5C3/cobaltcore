# cache.antiAffinity Strict is none of Required, Preferred and Off and violates
# the Enum marker on AntiAffinityMode; the webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-anti-affinity-unsupported
spec:
  base: Minimal
  cache:
    antiAffinity: Strict
