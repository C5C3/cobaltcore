# spec.neutron.workers.verticalAutoscaling.minAllowed naming ephemeral-storage
# violates the CEL rule on VerticalAutoscalingSpec; the webhook mirrors it.
apiVersion: c5c3.io/v1alpha1
kind: SizingProfile
metadata:
  name: c5c3-e2e-sizing-vpa-foreign-resource
spec:
  base: Minimal
  neutron:
    workers:
      verticalAutoscaling:
        updateMode: "Off"
        minAllowed:
          ephemeral-storage: 1Gi
