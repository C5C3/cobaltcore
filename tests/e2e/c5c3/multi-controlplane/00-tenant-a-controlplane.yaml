# Tenant-A ControlPlane CR fixture for the multi-controlplane E2E test
# It owns namespace `tenant-a` and the single ControlPlane
# `controlplane-a` in it.
#
# scopes the minted admin application credential per-ControlPlane in the
# cluster-global OpenBao backend: the c5c3-operator mirrors this CR's admin AC to
#   openstack/keystone/tenant-a/controlplane-a/admin/app-credential
# (adminAppCredentialRemoteKeyFor; read back via `bao kv get` as the kv-v2 path
#   kv-v2/openstack/keystone/tenant-a/controlplane-a/admin/app-credential).
# the c5c3-operator now also CREATES the per-CR,
# controller-owned `k-orc-clouds-yaml` ExternalSecret in THIS tenant's namespace
# (reconcileKORC's ensureKORCCloudsYAMLExternalSecret) reading that per-CR path —
# no per-identity KORC_KEYSTONE_AUTH_URL seed override is needed.
# Tenant-B (01-tenant-b-controlplane.yaml) lives in a DIFFERENT namespace with a
# DIFFERENT name so its path can never collide with this one. The two axes are
# both distinct on purpose, mirroring the completed envtest
# TestIntegration_MultiControlPlane_DistinctAdminCredentialPaths.
#
# DECISION the validating webhook
# enforces ONE ControlPlane per namespace, so the two ControlPlanes MUST live in
# separate namespaces — hence the bundled Namespace object here.
#
# DECISION the per-namespace prerequisites this CR references (the
# admin-password path in OpenBao and the database-engine role for the managed
# MariaDB) are provisioned by the suite itself: it seeds both identities with
# write-bootstrap-secrets.sh before the apply and onboards both tenants with
# setup-database-tenant.sh once their MariaDBs are Ready. The suite runs on the
# e2e-controlplane job, which carries the c5c3 + K-ORC stack, and its finally
# block deletes this ControlPlane and then the bundled Namespace. It deletes
# them only when the Namespace carries the c5c3.io/e2e-suite label set below,
# and the suite refuses to run when a tenant-a it did not create exists. Managed
# mode mirrors full-controlplane-keystone's shape, so these CRs reconcile
# against production-shaped infrastructure.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    c5c3.io/e2e-suite: multi-controlplane
---
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: controlplane-a
  namespace: tenant-a
spec:
  openStackRelease: "2026.1"
  region: RegionOne
  infrastructure:
    database:
      clusterRef:
        name: openstack-db
      database: keystone
      secretRef:
        name: keystone-db
    cache:
      clusterRef:
        name: openstack-memcached
      backend: dogpile.cache.pymemcache
  services:
    keystone: {}
  sizing:
    profile: Minimal
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
        secretName: k-orc-clouds-yaml
      passwordSecretRef:
        name: keystone-admin
        key: password
      applicationCredential:
        # restricted:true keeps the admin AC least-privilege and
        # projects to K-ORC's spec.resource.unrestricted=false.
        restricted: true
        rotation:
          mode: PasswordDriven
