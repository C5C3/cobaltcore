# Chainsaw E2E test for per-ControlPlane admin-credential isolation in the
# cluster-global OpenBao backend. It brings up TWO
# ControlPlanes in TWO namespaces and asserts, end-to-end against a live OpenBao,
# that the c5c3-operator scopes each CR's minted admin application credential to
# a DISTINCT per-CR path so two ControlPlanes never clobber each other:
#
#   Namespace tenant-a / ControlPlane controlplane-a
#     → kv-v2/openstack/keystone/tenant-a/controlplane-a/admin/app-credential
#   Namespace tenant-b / ControlPlane controlplane-b
#     → kv-v2/openstack/keystone/tenant-b/controlplane-b/admin/app-credential
#
# These paths are the kv-v2-prefixed read view of adminAppCredentialRemoteKeyFor
# (operators/c5c3/internal/controller/reconcile_korc.go), which returns
#   openstack/keystone/{cp.Namespace}/{cp.Name}/admin/app-credential.
# Both axes (namespace AND name) are distinct on purpose, mirroring the completed
# envtest TestIntegration_MultiControlPlane_DistinctAdminCredentialPaths.
#
# Task 7.1 — distinct ids: both ControlPlanes reach Ready=True and their
# status.adminApplicationCredential.id values are non-empty and distinct.
# Task 7.2 — OpenBao isolation + rotation non-interference: both per-CR paths
# exist with DIFFERENT material; rotating ONLY tenant-a's admin AC leaves
# tenant-b's status, OpenBao material, and K-ORC AC health unchanged.
#
# The suite seeds both identities' admin-password paths with
# write-bootstrap-secrets.sh and onboards both tenants' database-engine roles
# with setup-database-tenant.sh, so it depends on nothing deploy-infra seeded.
# The per-CR `k-orc-clouds-yaml` ExternalSecret each tenant references is
# OPERATOR-created: reconcileKORC's ensureKORCCloudsYAMLExternalSecret
# materialises a per-CR, controller-owned ExternalSecret reading that CR's
# per-CR OpenBao path, with NO per-identity KORC_KEYSTONE_AUTH_URL seed
# override. The section after the Ready waits asserts this materialisation
# (ownership + per-CR remoteRef.key) for both tenants.
#
# ── DECISION: presence guard + single consolidated script ───────────────────
# The e2e-operator (c5c3) leg runs this directory on a cluster that carries the
# stack's CRDs alone, so the guard SKIPs there. The e2e-controlplane job sets
# E2E_REQUIRE_CONTROLPLANE_STACK=true, so the guard fails there instead. The
# suite seeds its own OpenBao paths. Because chainsaw has no step-level skip,
# the guard and all assertions live in ONE script step (declarative asserts in
# sibling steps would time out and fail even after the guard exited 0).
#
# ── Secrets stay out of argv ─────────────────────────────────────────────────
# kubectl sends every remote-command element as a query parameter, which the
# API server's audit log records, and a process's arguments are readable in
# /proc on a shared runner. So this suite's own bao calls read the root token
# from a file staged inside openbao-0, the ServiceAccount JWT and the client
# token reach bao on stdin, and the database passwords reach the probe pod on
# stdin, as in the keystone-user suite. write-bootstrap-secrets.sh and
# setup-database-tenant.sh still pass the root token to kubectl exec as an
# argument (see the TODO in deploy/openbao/bootstrap/common.sh), so the suite
# unsets BAO_TOKEN once its last call to them returns.
#
# ── DECISION: "credentials differ" comparison field ──────────────────────────
# The c5c3-operator pushes the operator-owned admin-credential Secret to OpenBao;
# its key `clouds.yaml` (appCredCloudsYAMLKey in reconcile_korc.go) is the
# assembled application-credential clouds.yaml and EMBEDS the per-CR
# application-credential id and secret. We compare `bao kv get -field=clouds.yaml`
# between the two paths: it is a single, stable, always-present field whose value
# differs iff the two ControlPlanes minted distinct credentials — the realistic
# "the actual secret material differs" signal. We hash it (sha256) before logging
# so the comparison is deterministic and no credential material is printed.
#
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multi-controlplane
# NOTE: no spec.namespace — the two fixtures declare their own namespaces
# (tenant-a / tenant-b); the one-CP-per-namespace webhook forces them apart.
# Chainsaw does not delete namespaces a script creates, so the finally block
# removes both.
spec:
  # Two full mint chains (Galera + Keystone bootstrap + two K-ORC mints + the
  # OpenBao round-trip) plus a rotation are long-running, so the consolidated
  # script gets a generous bound above the suite default.
  #
  # The single consolidated script runs its polls SEQUENTIALLY, and their own
  # per-poll deadlines sum to a worst case of 4020s: wait_cp_condition
  # InfrastructureReady 600 + 600, the MariaDB waits 120 + 120, wait_cp_condition
  # Ready 600 + 600 (both ControlPlanes), wait_ready_condition externalsecret
  # k-orc-clouds-yaml 60 + 60 (the two per-CR operator-created
  # ExternalSecrets), wait_bao_clouds_sha 300 + 300 (both per-CR paths), the
  # 600s rotation wait and the 60s wait for tenant-a's revoked credential.
  # exec / script.timeout MUST exceed that sum so that, on a genuine hang, the
  # offending poll prints its precise "condition/path X not … within Ns" error
  # rather than chainsaw killing the whole script with a generic timeout that
  # hides which poll stalled. 70m (4200s) clears the 4020s worst case with
  # margin for the seed, the onboarding and the probe pods.
  #
  # catch and finally pin their own timeouts, so the suite's ceiling is
  # 70+5+20+5 = 100m.
  timeouts:
    assert: 5m
    exec: 70m
    cleanup: 5m
  steps:
  # ── Step 1: Presence-gate, apply both ControlPlanes, assert isolation ──────
  - try:
    - script:
        # 70m > the 4020s worst-case sum of the sequential per-poll deadlines
        # below (see spec.timeouts above) so a hung poll surfaces its own precise
        # error instead of a generic chainsaw script-timeout kill.
        timeout: 70m
        # Chainsaw defaults to `sh`, which rejects `set -o pipefail`; every
        # infra/keystone e2e script pins bash for the same reason.
        shell: bash
        content: |
          set -euo pipefail

          NS_A=tenant-a
          NS_B=tenant-b
          CP_A=controlplane-a
          CP_B=controlplane-b
          # AC CR name == {cp.Name}-admin-app-credential (adminAppCredentialName).
          AC_B="${CP_B}-admin-app-credential"
          # Per-CR OpenBao read paths (kv-v2 mount prefix added on read).
          PATH_A="kv-v2/openstack/keystone/${NS_A}/${CP_A}/admin/app-credential"
          PATH_B="kv-v2/openstack/keystone/${NS_B}/${CP_B}/admin/app-credential"

          # OpenBao server lives in shared-services (deploy/openbao/bootstrap).
          BAO_NS="shared-services"
          BAO_SECRET="openbao-init-keys"

          REQUIRE_STACK="${E2E_REQUIRE_CONTROLPLANE_STACK:-false}"
          skip_or_fail() { # <reason...>
            if [ "${REQUIRE_STACK}" = "true" ]; then
              echo "ERROR: $*"
              echo "       E2E_REQUIRE_CONTROLPLANE_STACK=true — the ControlPlane"
              echo "       stack is required on this job, so this is a hard failure."
              exit 1
            fi
            echo "SKIP: $*"
            exit 0
          }

          # ── Presence guard ──────────────────────────────
          # Probe every CRD the chain spans plus the OpenBao ClusterSecretStore
          # and the init-keys Secret (we need its root token to read bao).
          # Their absence unambiguously means the c5c3-operator + K-ORC +
          # keystone-operator stack is not deployed here.
          missing=""
          for crd in \
            controlplanes.c5c3.io \
            credentialrotations.c5c3.io \
            keystones.keystone.openstack.c5c3.io \
            applicationcredentials.openstack.k-orc.cloud \
            externalsecrets.external-secrets.io \
            vaultdynamicsecrets.generators.external-secrets.io; do
            if ! kubectl get crd "$crd" >/dev/null 2>&1; then
              missing="${missing} ${crd}"
            fi
          done
          if [ -n "${missing}" ]; then
            skip_or_fail "required CRDs not present:${missing}." \
              "The c5c3-operator + K-ORC + keystone-operator stack is" \
              "not deployed on this cluster, so per-ControlPlane admin" \
              "credential isolation cannot be exercised here."
          fi
          if ! kubectl get clustersecretstore openbao-cluster-store >/dev/null 2>&1; then
            skip_or_fail "openbao-cluster-store ClusterSecretStore not present;" \
              "the admin-credential push chain cannot complete."
          fi
          if ! kubectl get secret "${BAO_SECRET}" -n "${BAO_NS}" >/dev/null 2>&1; then
            skip_or_fail "${BAO_NS}/${BAO_SECRET} not present; cannot read the" \
              "OpenBao root token to verify the per-CR paths."
          fi
          # The CRDs alone no longer prove the stack: the e2e-operator (c5c3)
          # matrix leg installs every CRD the c5c3 controller watches WITHOUT
          # deploying the sibling operators. Both tenants' ControlPlanes need
          # the keystone-operator and the c5c3-operator to converge, so probe
          # for their running pods (any namespace), not just the schema. The
          # probe captures via command substitution and retries, so a transient
          # apiserver error, or grep closing the pipe early, does not read as
          # "no pods" (see full-controlplane-keystone).
          operator_running() { # <app.kubernetes.io/name label value>
            local pods
            for _ in 1 2 3 4 5; do
              if pods="$(kubectl get pods -A -l "app.kubernetes.io/name=$1" --no-headers 2>/dev/null)" \
                && [ -n "${pods}" ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! operator_running keystone-operator; then
            skip_or_fail "no keystone-operator is running; the cluster carries the" \
              "stack's CRDs only, so the tenant ControlPlanes cannot converge here."
          fi
          if ! operator_running c5c3-operator; then
            skip_or_fail "no c5c3-operator is running."
          fi
          if ! kubectl get pod openbao-0 -n "${BAO_NS}" >/dev/null 2>&1; then
            skip_or_fail "${BAO_NS}/openbao-0 not present."
          fi
          # The two deploy/openbao/bootstrap scripts below read the token from
          # their environment and hand it to kubectl exec as an argument (see
          # the header), so the export stays until the onboarding is done.
          # Every bao call of this script reads it from a file staged in
          # openbao-0 instead. The file carries this run's namespace in its
          # name: openbao-0 is shared with the other suites, chainsaw runs
          # suites in parallel, and the keystone-service and keystone-user
          # suites remove the /tmp/.bao-token they stage when they finish.
          export BAO_TOKEN
          BAO_TOKEN="$(kubectl get secret "${BAO_SECRET}" -n "${BAO_NS}" \
            -o jsonpath='{.data.init-output}' | base64 -d | jq -r '.root_token')"
          if [ -z "${BAO_TOKEN}" ] || [ "${BAO_TOKEN}" = "null" ]; then
            skip_or_fail "could not extract the OpenBao root token."
          fi
          BAO_TOKEN_FILE="/tmp/.bao-token-${NAMESPACE}"
          # The shell stays alive until cat ends: containerd closes an exec's stdin on
          # the first EOF of its stdout or stderr, so a last command that redirects
          # stdout can lose the token (#1580). Exit 1 can mean a refused exec, a stream
          # lost mid-exec or an API error, so it SKIPs only when a read of the pod
          # succeeds and shows no running container. Every other failure stops the
          # suite: exit 3 is a short file, and any other code is the remote exit of a
          # pod that took the exec, such as 137 for a container killed with the token
          # in flight.
          stage_rc=0
          printf '%s' "${BAO_TOKEN}" | kubectl exec -i -n "${BAO_NS}" openbao-0 -- \
            sh -c 'umask 077; cat > "$1"; [ "$(wc -c < "$1")" -eq "$2" ] || exit 3' _ "${BAO_TOKEN_FILE}" "${#BAO_TOKEN}" || stage_rc=$?
          case "${stage_rc}" in
            0) ;;
            1)
              if ! bao_running="$(kubectl get pod openbao-0 -n "${BAO_NS}" -o jsonpath='{.status.containerStatuses[*].state.running}')" \
                || [ -n "${bao_running}" ]; then
                echo "ERROR: could not stage the OpenBao root token in openbao-0: the exec exited 1 and the pod is not known to be down."
                exit 1
              fi
              skip_or_fail "could not stage the OpenBao root token in openbao-0."
              ;;
            3) echo "ERROR: could not stage the OpenBao root token in openbao-0: the staged file has the wrong size."; exit 1 ;;
            *) echo "ERROR: could not stage the OpenBao root token in openbao-0: the exec exited ${stage_rc}."; exit 1 ;;
          esac
          echo "OK: c5c3 + K-ORC + keystone CRDs, OpenBao, and running keystone- and c5c3-operators"
          echo "    present — running the per-ControlPlane admin-credential isolation test."

          # ── Helpers ────────────────────────────────────────────────────────
          # Poll a ControlPlane status condition to True. Implemented as an
          # explicit poll (not `kubectl wait`) so a condition that is briefly
          # absent or False simply retries instead of erroring out, and so the
          # failure message names the last-observed status for triage.
          wait_cp_condition() { # <name> <namespace> <conditionType> <timeoutSeconds>
            local name="$1" ns="$2" ctype="$3" timeout="$4"
            local deadline status
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              status="$(kubectl get controlplane "${name}" -n "${ns}" \
                -o "jsonpath={.status.conditions[?(@.type=='${ctype}')].status}" 2>/dev/null || true)"
              if [ "${status}" = "True" ]; then
                echo "OK: ControlPlane ${ns}/${name} condition ${ctype}=True"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ControlPlane ${ns}/${name} condition ${ctype} not True within ${timeout}s (last: '${status:-<none>}')"
                return 1
              fi
              sleep 5
            done
          }

          # Poll an arbitrary resource's Ready condition to True (ExternalSecret
          # exposes a "Ready" condition). Same explicit-poll rationale as
          # wait_cp_condition: a briefly-absent/False condition simply retries and
          # the failure message names the last-observed status.
          wait_ready_condition() { # <resource> <name> <namespace> <timeoutSeconds>
            local res="$1" name="$2" ns="$3" timeout="$4"
            local deadline status
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              status="$(kubectl get "${res}" "${name}" -n "${ns}" \
                -o "jsonpath={.status.conditions[?(@.type=='Ready')].status}" 2>/dev/null || true)"
              if [ "${status}" = "True" ]; then
                echo "OK: ${res}/${name} Ready=True"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${res}/${name} Ready not True within ${timeout}s (last: '${status:-<none>}')"
                return 1
              fi
              sleep 5
            done
          }

          assert_eq() { # <description> <expected> <actual>
            if [ "$2" != "$3" ]; then
              echo "ERROR: $1 — expected '$2', got '$3'"
              exit 1
            fi
            echo "OK: $1 ('$3')"
          }

          assert_ne() { # <description> <a> <b>  (fails when a == b)
            if [ "$2" = "$3" ]; then
              echo "ERROR: $1 — values must differ but both are '$2'"
              exit 1
            fi
            echo "OK: $1 (distinct)"
          }

          cp_ac_id() { # <name> <namespace>  → status.adminApplicationCredential.id
            kubectl get controlplane "$1" -n "$2" \
              -o "jsonpath={.status.adminApplicationCredential.id}" 2>/dev/null || true
          }

          cp_ac_last_rotation() { # <name> <namespace> → status.…lastRotation
            kubectl get controlplane "$1" -n "$2" \
              -o "jsonpath={.status.adminApplicationCredential.lastRotation}" 2>/dev/null || true
          }

          # bao_exec runs a bao command inside openbao-0 with the mTLS client
          # material, reading the root token from the file the guard staged.
          bao_exec() {
            kubectl exec -n "${BAO_NS}" openbao-0 -- \
              env BAO_ADDR=https://127.0.0.1:8200 \
              BAO_TOKEN_FILE="${BAO_TOKEN_FILE}" \
              VAULT_CACERT=/openbao/tls/ca.crt \
              VAULT_CLIENT_CERT=/openbao/client-tls/tls.crt \
              VAULT_CLIENT_KEY=/openbao/client-tls/tls.key \
              sh -c 'BAO_TOKEN="$(cat "${BAO_TOKEN_FILE}")"; export BAO_TOKEN; exec "$@"' _ "$@"
          }
          # bao_login logs in through the Kubernetes auth method with the
          # ServiceAccount token on stdin and prints the client token.
          bao_login() { # <auth role> <ServiceAccount token>
            printf '%s' "$2" | kubectl exec -i -n "${BAO_NS}" openbao-0 -- \
              env BAO_ADDR=https://127.0.0.1:8200 \
              VAULT_CACERT=/openbao/tls/ca.crt \
              VAULT_CLIENT_CERT=/openbao/client-tls/tls.crt \
              VAULT_CLIENT_KEY=/openbao/client-tls/tls.key \
              bao write -field=token auth/kubernetes/management/login role="$1" jwt=-
          }
          # bao_as runs a bao command as the client token, passed on stdin.
          bao_as() { # <client token> <bao args...>
            local token="$1"
            shift
            printf '%s' "${token}" | kubectl exec -i -n "${BAO_NS}" openbao-0 -- \
              env BAO_ADDR=https://127.0.0.1:8200 \
              VAULT_CACERT=/openbao/tls/ca.crt \
              VAULT_CLIENT_CERT=/openbao/client-tls/tls.crt \
              VAULT_CLIENT_KEY=/openbao/client-tls/tls.key \
              sh -c 'BAO_TOKEN="$(cat)"; export BAO_TOKEN; exec "$@"' _ "$@"
          }

          # sha256 of `bao kv get -field=clouds.yaml <path>`. Returns the hash on
          # stdout and exit 0 when the path exists; exit 1 (empty stdout) when the
          # path / field is absent so callers can poll. We hash so no credential
          # material is ever printed and the comparison is a fixed-width token.
          bao_clouds_sha() { # <path>
            local path="$1" field
            field=$(bao_exec bao kv get -field=clouds.yaml "${path}" 2>/dev/null) || return 1
            if [ -z "${field}" ]; then
              return 1
            fi
            printf '%s' "${field}" | sha256sum | awk '{print $1}'
          }

          # Poll bao_clouds_sha until the path materialises (PushSecret sync is
          # eventually-consistent). Echoes the sha on success.
          wait_bao_clouds_sha() { # <path> <timeoutSeconds>
            local path="$1" timeout="$2" deadline sha
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              if sha=$(bao_clouds_sha "${path}"); then
                echo "${sha}"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${path} did not materialise in OpenBao within ${timeout}s" >&2
                return 1
              fi
              sleep 5
            done
          }

          # Runs a throwaway pod in the namespace with the Keystone image's
          # pymysql. The script reads its secrets from stdin, so no password
          # reaches the pod spec or the API server's audit log.
          mysql_pod() { # <namespace> <python script>
            kubectl run "mariadb-probe-$(date +%s%N)" --image=ghcr.io/c5c3/keystone:2026.1 \
              --image-pull-policy=IfNotPresent --rm -i --quiet --restart=Never -n "$1" --command -- \
              python3 -c "$2"
          }
          # Exits 0 iff the credential authenticates against the namespace's
          # MariaDB, 3 iff MariaDB denies it (ER_ACCESS_DENIED_ERROR 1045).
          # Any other exit is a failed probe and says nothing about the
          # credential: kubectl run hands back the pod's exit code, but also
          # fails on its own, and the connect can time out or be refused.
          db_login_probe() { # <namespace> <username> <password>
            printf '%s\n%s' "$2" "$3" | mysql_pod "$1" "import sys, pymysql
          user, password = sys.stdin.read().split('\n', 1)
          try:
              pymysql.connect(host='openstack-db.$1.svc', port=3306, user=user, password=password,
                              connect_timeout=10).close()
          except pymysql.err.OperationalError as e:
              if e.args and e.args[0] == 1045:
                  sys.exit(3)
              raise"
          }

          # ── Refuse a tenant namespace this suite did not create ────────────
          # The fixtures label both namespaces c5c3.io/e2e-suite=multi-controlplane,
          # and the finally block deletes the namespaces that carry the label,
          # with everything in them. One that exists already belongs to
          # somebody else (write-bootstrap-secrets.sh names tenant-a/cp as its
          # multi-ControlPlane example), and applying the fixture would label
          # it, so the suite stops before it seeds or applies anything. A
          # leftover of an earlier run carries the label, so this run's finally
          # block removes it. The lookup is a plain assignment, so an API error
          # ends the script under set -e instead of reading as "absent".
          for ns in "${NS_A}" "${NS_B}"; do
            existing="$(kubectl get namespace "${ns}" --ignore-not-found -o name)"
            if [ -n "${existing}" ]; then
              echo "ERROR: namespace ${ns} already exists; this suite creates and deletes it and will not adopt one it did not create"
              exit 1
            fi
          done

          # ── Seed both identities' OpenBao paths ────────────────────────────
          # One call writes bootstrap/tenant-a/controlplane-a-keystone/admin and
          # bootstrap/tenant-b/controlplane-b-keystone/admin. deploy-infra seeds
          # the openstack plane alone.
          KORC_CONTROLPLANES="${NS_A}/${CP_A} ${NS_B}/${CP_B}" \
            ../../../../deploy/openbao/bootstrap/write-bootstrap-secrets.sh
          echo "OK: both identities' admin-password paths are seeded."

          # Apply both ControlPlane fixtures (each carries its own namespace).
          # Chainsaw runs scripts with the test directory as CWD.
          kubectl apply -f 00-tenant-a-controlplane.yaml
          kubectl apply -f 01-tenant-b-controlplane.yaml

          # ── Onboard each tenant's OpenBao database-engine role (stage b, #439) ─
          # Both managed ControlPlanes draw engine-issued (Dynamic) DB credentials
          # from distinct per-tenant roles (keystone-<ns>, keyed on the namespace
          # alone), so each role must be provisioned once its MariaDB is Ready
          # before the chain can pass DBCredentialsReady. InfrastructureReady
          # comes first, because `kubectl wait` on a MariaDB the plane has not
          # projected yet exits NotFound.
          ROLE_A="keystone-${NS_A}"
          ROLE_B="keystone-${NS_B}"
          wait_cp_condition "${CP_A}" "${NS_A}" InfrastructureReady 600
          wait_cp_condition "${CP_B}" "${NS_B}" InfrastructureReady 600
          kubectl wait mariadb/openstack-db -n "${NS_A}" --for=condition=Ready --timeout=120s
          kubectl wait mariadb/openstack-db -n "${NS_B}" --for=condition=Ready --timeout=120s
          ../../../../deploy/openbao/bootstrap/setup-database-tenant.sh "${NS_A}" "${CP_A}"
          ../../../../deploy/openbao/bootstrap/setup-database-tenant.sh "${NS_B}" "${CP_B}"
          unset BAO_TOKEN
          echo "OK: both tenants' OpenBao database-engine roles onboarded."

          # ── Task 7.1: both Ready=True with distinct, non-empty AC ids ───────
          wait_cp_condition "${CP_A}" "${NS_A}" Ready 600
          wait_cp_condition "${CP_B}" "${NS_B}" Ready 600

          # ── DB-engine isolation (AC 4): distinct per-tenant roles ───────────
          # The two ControlPlanes draw from DISTINCT per-tenant roles/paths.
          assert_ne "per-tenant dynamic DB roles" "${ROLE_A}" "${ROLE_B}"
          assert_eq "tenant-a VaultDynamicSecret reads tenant-a creds path" \
            "database/mariadb/creds/${ROLE_A}" \
            "$(kubectl get vaultdynamicsecret "${CP_A}-keystone-db-credentials" -n "${NS_A}" -o 'jsonpath={.spec.path}')"
          assert_eq "tenant-b VaultDynamicSecret reads tenant-b creds path" \
            "database/mariadb/creds/${ROLE_B}" \
            "$(kubectl get vaultdynamicsecret "${CP_B}-keystone-db-credentials" -n "${NS_B}" -o 'jsonpath={.spec.path}')"

          # ── Templated-policy tenant isolation (F1/#439) ─────────────────────
          # A token minted from tenant-a's keystone-db-creds SA may read ONLY
          # tenant-a's creds path: the keystone-db-dynamic policy templates the
          # readable path to the caller's own service_account_namespace (an exact
          # match), so a cross-tenant read is denied even though the shared
          # keystone-db role binds bound_service_account_namespaces="*".
          TOKEN_A="$(kubectl create token keystone-db-creds -n "${NS_A}" --duration=10m)"
          CLIENT_TOKEN_A="$(bao_login keystone-db "${TOKEN_A}")"
          if [ -z "${CLIENT_TOKEN_A}" ]; then
            echo "ERROR: tenant-a keystone-db login returned no token"; exit 1
          fi
          # Own path MUST read — proves the login + policy grant work, so the deny
          # check below cannot pass vacuously on a broken login.
          if ! bao_as "${CLIENT_TOKEN_A}" \
            bao read "database/mariadb/creds/${ROLE_A}" >/dev/null 2>&1; then
            echo "ERROR: tenant-a token could not read its OWN creds path ${ROLE_A}"; exit 1
          fi
          echo "OK: tenant-a token reads its own creds path (${ROLE_A})"
          # Cross-tenant path MUST be denied by the templated policy.
          if bao_as "${CLIENT_TOKEN_A}" \
            bao read "database/mariadb/creds/${ROLE_B}" >/dev/null 2>&1; then
            echo "ERROR: tenant-a token READ tenant-b creds path ${ROLE_B}; cross-tenant DB-credential isolation is broken"; exit 1
          fi
          echo "OK: tenant-a token denied on tenant-b creds path (${ROLE_B}) — templated-policy isolation holds"

          ID_A="$(cp_ac_id "${CP_A}" "${NS_A}")"
          ID_B="$(cp_ac_id "${CP_B}" "${NS_B}")"
          if [ -z "${ID_A}" ]; then
            echo "ERROR: ${NS_A}/${CP_A} status.adminApplicationCredential.id is empty"
            exit 1
          fi
          if [ -z "${ID_B}" ]; then
            echo "ERROR: ${NS_B}/${CP_B} status.adminApplicationCredential.id is empty"
            exit 1
          fi
          echo "OK: both ControlPlanes report a non-empty admin AC id"
          assert_ne "admin AC ids of the two ControlPlanes" "${ID_A}" "${ID_B}"

          # ──: per-CR operator-created ExternalSecret materialises ──
          # moved the K-ORC clouds.yaml seed into the c5c3-operator: during
          # reconcileKORC, ensureKORCCloudsYAMLExternalSecret CREATES a per-CR,
          # controller-owned ExternalSecret `k-orc-clouds-yaml` in each CR's own
          # namespace, reading that CR's per-CR OpenBao path with NO per-identity
          # KORC_KEYSTONE_AUTH_URL override and no per-CR remoteRef.key manifest
          # edit — the operator computes everything from the CR. This is exactly
          # what lets a non-default-name ControlPlane reach AdminCredentialReady
          # without manifest edits. Ready=True (above) subsumes the operator's ES
          # creation, so a SHORT poll suffices to confirm prior materialisation.
          # The remoteRef.key has NO kv-v2/ read prefix (PATH_A/PATH_B carry it).
          wait_ready_condition externalsecret k-orc-clouds-yaml "${NS_A}" 60
          assert_eq "tenant-a k-orc-clouds-yaml ExternalSecret owned by ${CP_A}" "${CP_A}" \
            "$(kubectl get externalsecret k-orc-clouds-yaml -n "${NS_A}" -o "jsonpath={.metadata.ownerReferences[?(@.kind=='ControlPlane')].name}" 2>/dev/null || true)"
          assert_eq "tenant-a k-orc-clouds-yaml ExternalSecret reads per-CR path" \
            "openstack/keystone/${NS_A}/${CP_A}/admin/app-credential" \
            "$(kubectl get externalsecret k-orc-clouds-yaml -n "${NS_A}" -o "jsonpath={.spec.data[0].remoteRef.key}" 2>/dev/null || true)"
          wait_ready_condition externalsecret k-orc-clouds-yaml "${NS_B}" 60
          assert_eq "tenant-b k-orc-clouds-yaml ExternalSecret owned by ${CP_B}" "${CP_B}" \
            "$(kubectl get externalsecret k-orc-clouds-yaml -n "${NS_B}" -o "jsonpath={.metadata.ownerReferences[?(@.kind=='ControlPlane')].name}" 2>/dev/null || true)"
          assert_eq "tenant-b k-orc-clouds-yaml ExternalSecret reads per-CR path" \
            "openstack/keystone/${NS_B}/${CP_B}/admin/app-credential" \
            "$(kubectl get externalsecret k-orc-clouds-yaml -n "${NS_B}" -o "jsonpath={.spec.data[0].remoteRef.key}" 2>/dev/null || true)"

          # ── Task 7.2a: both per-CR OpenBao paths exist with DIFFERENT material ─
          echo "== bao kv get ${PATH_A} (expect present) =="
          SHA_A="$(wait_bao_clouds_sha "${PATH_A}" 300)"
          echo "OK: ${PATH_A} present (clouds.yaml sha256=${SHA_A})"
          echo "== bao kv get ${PATH_B} (expect present) =="
          SHA_B="$(wait_bao_clouds_sha "${PATH_B}" 300)"
          echo "OK: ${PATH_B} present (clouds.yaml sha256=${SHA_B})"
          assert_ne "OpenBao admin-credential material of the two paths" "${SHA_A}" "${SHA_B}"

          # ── Task 7.2b: record tenant-b's pre-rotation state ─────────────────
          B_ROT_BEFORE="$(cp_ac_last_rotation "${CP_B}" "${NS_B}")"
          B_ID_BEFORE="${ID_B}"
          B_SHA_BEFORE="${SHA_B}"
          echo "tenant-b before rotation: id='${B_ID_BEFORE}' lastRotation='${B_ROT_BEFORE:-<none>}' sha=${B_SHA_BEFORE}"

          # ── Task 7.2c: rotate ONLY tenant-a's admin AC (reMint) ─────────────
          # The CredentialRotation reconciler resolves its target in its own
          # namespace, so this rotates controlplane-a only. We observe the
          # rotation as a CHANGE in tenant-a's status.adminApplicationCredential.id
          # (the re-mint produces a fresh OpenStack application-credential id) —
          # the most robust observable signal, since the CredentialRotation flips
          # Ready=True the moment it nudges, before the re-mint completes.
          kubectl apply -f 02-tenant-a-rotation.yaml
          A_ID_BEFORE="${ID_A}"
          echo "== waiting for tenant-a admin AC id to change from '${A_ID_BEFORE}' =="
          rot_deadline=$(( $(date +%s) + 600 ))
          A_ID_AFTER="${A_ID_BEFORE}"
          while true; do
            A_ID_AFTER="$(cp_ac_id "${CP_A}" "${NS_A}")"
            if [ -n "${A_ID_AFTER}" ] && [ "${A_ID_AFTER}" != "${A_ID_BEFORE}" ]; then
              echo "OK: tenant-a admin AC id rotated '${A_ID_BEFORE}' → '${A_ID_AFTER}'"
              break
            fi
            if [ "$(date +%s)" -ge "${rot_deadline}" ]; then
              echo "ERROR: tenant-a admin AC id did not change within 600s (still '${A_ID_AFTER}')"
              exit 1
            fi
            sleep 5
          done

          # ── Task 7.2d: assert tenant-b is UNAFFECTED by tenant-a's rotation ─
          # (i) lastRotation unchanged from the recorded pre-rotation value.
          B_ROT_AFTER="$(cp_ac_last_rotation "${CP_B}" "${NS_B}")"
          assert_eq "tenant-b admin AC lastRotation unchanged by tenant-a rotation" \
            "${B_ROT_BEFORE}" "${B_ROT_AFTER}"
          # (ii) id unchanged (belt-and-braces with lastRotation).
          B_ID_AFTER="$(cp_ac_id "${CP_B}" "${NS_B}")"
          assert_eq "tenant-b admin AC id unchanged by tenant-a rotation" \
            "${B_ID_BEFORE}" "${B_ID_AFTER}"
          # (iii) tenant-b's K-ORC ApplicationCredential CR still Available=True.
          B_AC_AVAIL="$(kubectl get applicationcredentials.openstack.k-orc.cloud "${AC_B}" -n "${NS_B}" \
            -o "jsonpath={.status.conditions[?(@.type=='Available')].status}" 2>/dev/null || true)"
          assert_eq "tenant-b K-ORC ApplicationCredential ${AC_B} Available" "True" "${B_AC_AVAIL}"
          # (iv) tenant-b's OpenBao material unchanged from before the rotation.
          B_SHA_AFTER="$(bao_clouds_sha "${PATH_B}")"
          assert_eq "tenant-b OpenBao admin-credential material unchanged" \
            "${B_SHA_BEFORE}" "${B_SHA_AFTER}"

          # ── DB-engine isolation (AC 4): tenant-a's revoke spares tenant-b ──
          # Revoke ALL of tenant-a's issued DB credentials by lease prefix, then
          # prove tenant-b's materialised credential still authenticates against
          # tenant-b's MariaDB and tenant-b stays Ready — one tenant's revoke does
          # not affect another. This runs last: the revoke drops the database
          # user tenant-a's Keystone logs in with, and nothing issues a new one
          # within the run (the DB ExternalSecret refreshes every 24h). Keystone
          # recycles a pooled connection after 600s, so a revoke before the
          # rotation above could fail its re-mint, a database write in
          # tenant-a's Keystone.
          UA="$(kubectl get secret "${CP_A}-keystone-db-credentials" -n "${NS_A}" -o 'jsonpath={.data.username}' | base64 -d)"
          PA="$(kubectl get secret "${CP_A}-keystone-db-credentials" -n "${NS_A}" -o 'jsonpath={.data.password}' | base64 -d)"
          UB="$(kubectl get secret "${CP_B}-keystone-db-credentials" -n "${NS_B}" -o 'jsonpath={.data.username}' | base64 -d)"
          PB="$(kubectl get secret "${CP_B}-keystone-db-credentials" -n "${NS_B}" -o 'jsonpath={.data.password}' | base64 -d)"
          # tenant-a's credential MUST authenticate before the revoke, so its
          # failure afterwards is the revoke's doing and not the probe's.
          db_login_probe "${NS_A}" "${UA}" "${PA}"
          echo "OK: tenant-a credential authenticates before the revoke"
          bao_exec bao lease revoke -prefix "database/mariadb/creds/${ROLE_A}"
          # tenant-a's credential MUST be denied, or the survival check below
          # passes on a revoke that did nothing. Only MariaDB's denial counts:
          # a probe that fails for another reason is retried until the
          # deadline.
          echo "== tenant-a credential must stop authenticating =="
          revoke_deadline=$(( $(date +%s) + 60 ))
          while true; do
            rc=0
            db_login_probe "${NS_A}" "${UA}" "${PA}" >/dev/null 2>&1 || rc=$?
            [ "${rc}" -eq 3 ] && break
            if [ "$(date +%s)" -ge "${revoke_deadline}" ]; then
              echo "ERROR: tenant-a credential not denied 60s after its revoke (last probe exit ${rc})"
              exit 1
            fi
            sleep 5
          done
          echo "OK: tenant-a credential is denied"
          echo "== tenant-b credential must survive tenant-a's revoke =="
          db_login_probe "${NS_B}" "${UB}" "${PB}"
          echo "OK: tenant-b credential unaffected by tenant-a's DB revoke (AC 4)"
          assert_eq "tenant-b ControlPlane still Ready after tenant-a DB revoke" "True" \
            "$(kubectl get controlplane "${CP_B}" -n "${NS_B}" -o "jsonpath={.status.conditions[?(@.type=='Ready')].status}")"

          echo "OK: per-ControlPlane admin-credential isolation verified —"
          echo "    distinct ids + distinct OpenBao paths/material, and tenant-a's"
          echo "    rotation left tenant-b's credential, OpenBao material, and"
          echo "    K-ORC AC untouched."
    catch:
    - script:
        # Pinned, because chainsaw applies the test's exec budget to every
        # script operation; a dump against a wedged apiserver must not inherit
        # 70m.
        timeout: 5m
        shell: bash
        content: |
          echo "=== ControlPlane controlplane-a (tenant-a) describe ==="
          kubectl describe controlplane controlplane-a -n tenant-a 2>&1 || true
          echo "=== ControlPlane controlplane-b (tenant-b) describe ==="
          kubectl describe controlplane controlplane-b -n tenant-b 2>&1 || true
          echo "=== ControlPlane conditions (both) ==="
          for pair in "controlplane-a tenant-a" "controlplane-b tenant-b"; do
            set -- $pair
            echo "--- $1/$2 ---"
            kubectl get controlplane "$1" -n "$2" \
              -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}: {.message}){"\n"}{end}' 2>&1 || true
            echo "adminApplicationCredential:"
            kubectl get controlplane "$1" -n "$2" \
              -o jsonpath='{.status.adminApplicationCredential}{"\n"}' 2>&1 || true
          done
          echo "=== CredentialRotation (tenant-a) ==="
          kubectl get credentialrotation -n tenant-a -o wide 2>&1 || true
          kubectl describe credentialrotation rotate-controlplane-a-admin -n tenant-a 2>&1 || true
          echo "=== K-ORC ApplicationCredentials (both tenants) ==="
          kubectl get applicationcredentials.openstack.k-orc.cloud -n tenant-a 2>&1 || true
          kubectl get applicationcredentials.openstack.k-orc.cloud -n tenant-b 2>&1 || true
          echo "=== c5c3-operator logs (last 200 lines) ==="
          kubectl logs -n c5c3-system -l app.kubernetes.io/name=c5c3-operator --tail=200 --all-containers 2>&1 || true
          echo "=== K-ORC controller logs (last 100 lines) ==="
          kubectl logs -n orc-system deploy/orc-controller-manager --pod-running-timeout=5s --tail=100 --all-containers 2>&1 || true
          echo "=== openbao pods ==="
          kubectl get pods -n shared-services -l app.kubernetes.io/name=openbao 2>&1 || true
          echo "=== openbao-0 logs (last 100 lines) ==="
          kubectl logs -n shared-services openbao-0 --tail=100 2>&1 || true
          echo "=== Events (tenant-a / tenant-b, last 30 each) ==="
          kubectl get events -n tenant-a --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
          kubectl get events -n tenant-b --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
    finally:
    - script:
        # Pinned for the same reason as catch above. The two waits below are
        # bounded at 600s and 300s; 20m covers them plus the deletes that drive
        # them.
        timeout: 20m
        shell: bash
        content: |
          # Chainsaw does not delete tenant-a and tenant-b: the fixtures create
          # them through kubectl, not through a chainsaw operation. So this
          # block removes the root token the try block staged in openbao-0
          # (the pod serves every suite on the job), the CredentialRotation,
          # both ControlPlanes and then both namespaces. It touches a tenant
          # namespace only when the namespace carries this suite's label: the
          # try block refuses a tenant-a or tenant-b that exists already, so
          # an unlabelled one is somebody else's. The planes go first, so their
          # finalizers sequence the K-ORC teardown before the namespace
          # deletion removes everything at once. After a run that reached the
          # revoke, tenant-a's Keystone has lost its database user, so its
          # teardown can run into the 7m orcTeardownDeadline, which the 600s
          # wait covers. Every wait is bounded and best-effort: it prints OK
          # or WARN and never fails the block.
          kubectl exec -n shared-services openbao-0 -- \
            rm -f "/tmp/.bao-token-${NAMESPACE}" 2>&1 || true

          # gone_by polls one object until it is gone or a deadline shared by
          # every object of its group passes. It never fails.
          gone_by() { # <deadline> <budgetSeconds> <label> <kubectl get args...>
            local deadline="$1" budget="$2" label="$3"
            shift 3
            while kubectl get "$@" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "WARN: ${label} still present after ${budget}s"
                return 0
              fi
              sleep 5
            done
            echo "OK: ${label} is gone"
          }

          # owned prints yes when the namespace carries this suite's label, no
          # when it does not or is absent, and unknown when three reads fail.
          # Only a yes namespace is deleted, so a failed read leaves the
          # namespace alone instead of deleting it without its planes first.
          owned() { # <namespace>
            local label
            for _ in 1 2 3; do
              if label="$(kubectl get namespace "$1" --ignore-not-found \
                -o 'jsonpath={.metadata.labels.c5c3\.io/e2e-suite}' 2>/dev/null)"; then
                if [ "${label}" = multi-controlplane ]; then echo yes; else echo no; fi
                return 0
              fi
              sleep 2
            done
            echo unknown
          }
          OWN_A="$(owned tenant-a)"
          OWN_B="$(owned tenant-b)"
          [ "${OWN_A}" != unknown ] || echo "WARN: could not read tenant-a's labels; leaving it alone"
          [ "${OWN_B}" != unknown ] || echo "WARN: could not read tenant-b's labels; leaving it alone"

          if [ "${OWN_A}" = yes ]; then
            kubectl delete credentialrotation rotate-controlplane-a-admin -n tenant-a --ignore-not-found 2>&1 || true
            kubectl delete controlplane controlplane-a -n tenant-a --ignore-not-found --wait=false 2>&1 || true
          fi
          if [ "${OWN_B}" = yes ]; then
            kubectl delete controlplane controlplane-b -n tenant-b --ignore-not-found --wait=false 2>&1 || true
          fi
          deadline=$(( $(date +%s) + 600 ))
          [ "${OWN_A}" != yes ] || gone_by "${deadline}" 600 tenant-a/controlplane-a controlplane controlplane-a -n tenant-a
          [ "${OWN_B}" != yes ] || gone_by "${deadline}" 600 tenant-b/controlplane-b controlplane controlplane-b -n tenant-b

          [ "${OWN_A}" != yes ] || kubectl delete namespace tenant-a --wait=false 2>&1 || true
          [ "${OWN_B}" != yes ] || kubectl delete namespace tenant-b --wait=false 2>&1 || true
          deadline=$(( $(date +%s) + 300 ))
          [ "${OWN_A}" != yes ] || gone_by "${deadline}" 300 "namespace tenant-a" namespace tenant-a
          [ "${OWN_B}" != yes ] || gone_by "${deadline}" 300 "namespace tenant-b" namespace tenant-b
