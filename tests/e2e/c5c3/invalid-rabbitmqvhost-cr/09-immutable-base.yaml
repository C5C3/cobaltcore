# Valid base for the immutability wave. It is applied FIRST and must
# SUCCEED. The 10-12 variants reuse this metadata.name, so Chainsaw applies
# each of them to the live object as an UPDATE, which is what makes the CEL
# transition rules evaluate at all. passwordGeneration starts at 2, so a
# lowered value is reachable.
apiVersion: c5c3.io/v1alpha1
kind: RabbitMQVhost
metadata:
  name: rmv-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  passwordGeneration: 2
