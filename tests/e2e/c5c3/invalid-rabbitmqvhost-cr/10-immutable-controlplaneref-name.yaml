# controlPlaneRef.name is immutable (CEL transition rule): the edit would
# strand the vhost and the user the order created on the old bus. The error
# carries 'controlPlaneRef.name is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: RabbitMQVhost
metadata:
  name: rmv-immutable
spec:
  controlPlaneRef:
    name: cp-other
  passwordGeneration: 2
