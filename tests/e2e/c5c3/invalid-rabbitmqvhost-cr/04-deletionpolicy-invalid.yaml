# deletionPolicy 'Drop' is outside the Retain and Delete enum (CRD marker).
# The error carries 'Unsupported value'.
apiVersion: c5c3.io/v1alpha1
kind: RabbitMQVhost
metadata:
  name: rmv-invalid-deletion-policy
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  deletionPolicy: Drop
