# passwordGeneration may only increase (CEL transition rule): a rotation is
# never rolled back. The error carries 'passwordGeneration may only
# increase'.
apiVersion: c5c3.io/v1alpha1
kind: RabbitMQVhost
metadata:
  name: rmv-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  passwordGeneration: 1
