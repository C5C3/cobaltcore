# CredentialRotation fixture that rotates the "workflow" registration's service
# account password.
#
# target: serviceAccountPassword takes a keystoneService naming a KeystoneService
# in the CredentialRotation's OWN namespace. The two CEL rules on the CRD require
# the field for this target and forbid it for any other one.
#
# reMint:true is what fires the rotation. It latches to the spec generation, so
# re-applying the same generation reports NoRotationNeeded rather than rotating a
# second time.
#
# The reconciler clears the User child's cobaltcore.c5c3.io/password-generation
# annotation. The KeystoneService controller then flips the User's passwordRef to
# the next "…-password-v<N+1>" Secret, re-publishes the new password through
# OpenBao and ESO, and bumps status.account.passwordGeneration.
apiVersion: c5c3.io/v1alpha1
kind: CredentialRotation
metadata:
  name: rotate-workflow
spec:
  target: serviceAccountPassword
  keystoneService: workflow
  reMint: true
