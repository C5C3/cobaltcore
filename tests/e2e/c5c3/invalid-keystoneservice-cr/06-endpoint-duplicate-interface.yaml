# Two endpoint rows sharing the interface 'public' collide on the listMapKey: the
# list is a listType=map keyed by interface, so an entry publishes at most one row
# per interface and the apiserver rejects the duplicate before any rule of ours
# runs. Both rows are otherwise valid, so the key is the only violation. The error
# names 'endpoints' and carries 'Duplicate value'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-invalid-duplicate-interface
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  catalog:
    serviceType: object-store
    endpoints:
    - interface: public
      url: https://swift.example.com
    - interface: public
      url: https://swift.example.com
