# catalog.serviceType 'identity' is rejected by the CEL rule on the field: the
# identity catalog entry is ControlPlane-owned in both modes (created in Managed,
# imported in External), so registering it here would leave two owners writing one
# row. The error carries the substring:
# the identity catalog entry is ControlPlane-owned
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-invalid-identity-type
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  catalog:
    serviceType: identity
    endpoints:
    - interface: public
      url: https://swift.example.com
