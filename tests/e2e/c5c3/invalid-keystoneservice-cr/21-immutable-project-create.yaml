# UPDATE flipping account.project.create from the defaulted false to true,
# rejected by the CEL transition rule on the project field: the flip would hand
# the registration ownership of a project it merely referenced, and deleting the
# CR would then delete that live project. The error carries the substring:
# project.create is immutable
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  catalog:
    serviceType: object-store
    endpoints:
    - interface: public
      url: https://swift.example.com
  account:
    userName: svc-object-store
    project:
      name: service
      create: true
    roles:
    - service
