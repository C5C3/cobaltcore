# An account.roles entry carrying a comma violates the items pattern: each role is
# projected as an unmanaged K-ORC Role import whose name filter is the same one.
# The error names 'roles' and carries 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-invalid-role-comma
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  account:
    userName: svc-object-store
    project:
      name: service
    roles:
    - "member,admin"
