# UPDATE adding an explicit account.domainName over the fallback, rejected by the
# validating webhook, which compares the DECLARED value. Resolving the fallback
# needs the referenced ControlPlane's admin domain, which admission cannot read,
# so the value is rejected even where it names that same domain. The error carries
# the substring 'domainName is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  catalog:
    serviceType: object-store
    endpoints:
    - interface: public
      url: https://swift.example.com
  account:
    userName: svc-object-store
    domainName: Default
    project:
      name: service
    roles:
    - service
