# catalog.serviceType 'Object_Store' violates the DNS-1123 label pattern (CRD
# marker): the type is embedded verbatim in the names of the child K-ORC CRs, so
# an upper-case letter or an underscore would project a child the apiserver
# rejects. The error names 'serviceType' and carries 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-invalid-type-shape
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  catalog:
    serviceType: Object_Store
    endpoints:
    - interface: public
      url: https://swift.example.com
