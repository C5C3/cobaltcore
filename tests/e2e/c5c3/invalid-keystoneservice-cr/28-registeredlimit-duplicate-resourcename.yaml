# Two catalog.registeredLimits entries with the same resourceName are rejected
# by the apiserver (listType=map keyed by resourceName): Keystone holds one
# registered limit per service, region and resource. The error names
# 'registeredLimits' and carries 'Duplicate value'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-invalid-limit-duplicate
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  catalog:
    serviceType: object-store
    endpoints:
    - interface: public
      url: https://swift.example.com
    registeredLimits:
    - resourceName: object_count
      defaultLimit: 10
    - resourceName: object_count
      defaultLimit: 20
