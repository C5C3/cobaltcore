# account.userName carrying a comma violates the CRD pattern, mirroring K-ORC's
# OpenStackName exactly as the catalog service name does: the cast on the child
# User CR would be rejected there instead. The error names 'userName' and carries
# 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-invalid-username-comma
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  account:
    userName: "glance,admin"
    project:
      name: service
    roles:
    - service
