# catalog.endpoints[].url with a non-http(s) scheme violates the CRD pattern. The
# value is advertised verbatim as the catalog endpoint, so a scheme no OpenStack
# client dials could never serve one. The error names 'url' and carries
# 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-invalid-url-scheme
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  catalog:
    serviceType: object-store
    endpoints:
    - interface: public
      url: ftp://swift.example.com
