# UPDATE renaming account.userName, rejected by the CEL transition rule on the
# field: the name identifies a live Keystone user, so the edit would mint a second
# one and strand the first, still holding the password its consumers authenticate
# with. The error carries the substring 'userName is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneService
metadata:
  name: ks-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  catalog:
    serviceType: object-store
    endpoints:
    - interface: public
      url: https://swift.example.com
  account:
    userName: svc-renamed
    project:
      name: service
    roles:
    - service
