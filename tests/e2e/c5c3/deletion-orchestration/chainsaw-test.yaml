# Chainsaw E2E test for ControlPlane deletion orchestration: the ORC-teardown
# finalizer (c5c3.io/orc-teardown) must sequence the deletion of the operator-
# owned K-ORC CRs (ApplicationCredential/Service/Endpoint/User/Domain) and let
# ControlPlane deletion COMPLETE even when Keystone is already gone — so the
# managed control plane (and its namespace) never hangs forever on a Terminating
# ApplicationCredential whose K-ORC finalizer can never revoke against a dead
# Keystone.
#
# Scenario ("Keystone already gone"):
#   1. Apply a managed ControlPlane and drive it to Ready (infra + Keystone +
#      minted K-ORC ApplicationCredential + identity catalog).
#   2. Initiate ControlPlane deletion (async). The operator enters its deletion
#      branch and stops re-projecting children.
#   3. Take Keystone down (delete the projected Keystone CR; the c5c3-operator no
#      longer recreates it while the ControlPlane is Terminating). K-ORC can now
#      no longer revoke the admin credential against the Keystone API.
#   4. Assert ControlPlane deletion COMPLETES within a window larger than the
#      bounded stall deadline (orcTeardownDeadline = 7m, the 2m registration
#      window plus orcTeardownStallTimeout): the finalizer waits, then
#      force-removes the stuck openstack.k-orc.cloud/* finalizers and releases
#      the ControlPlane.
#   5. Assert the projected Keystone, MariaDB, Memcached, and all six K-ORC CRs
#      are garbage-collected, that the Warning ORCTeardownStalled was emitted,
#      and that ORCTeardownComplete was not.
#   6. Assert the Barbican ensemble is reclaimed with it: the child, its
#      BarbicanSecretStore, the dedicated OpenBaoCluster, the raft PVC that
#      instance leaves behind (data-<instance>-0, reaped because the projection
#      pins deletionPolicy DeletePVCs), and the cluster-scoped auth-delegator
#      ClusterRoleBinding. The last two are the ones nothing else collects: no GC
#      cascade reaches a cluster-scoped object from a namespaced owner, and a
#      retained PVC would meet the next ControlPlane of the same name with raft
#      storage sealed under a key that no longer exists.
#   7. Assert the projected Barbican registration leaves no residue: the
#      KeystoneService deletion-orch-barbican and every K-ORC CR carrying its
#      c5c3.io/keystoneservice-name label are gone. The teardown force-releases
#      those children here, and the registration's own controller then releases
#      the CR.
#
# The stall is deterministic in this suite. deleteRegistrationsBeforeTeardown
# holds the revoke of the admin credential until the Barbican registration is
# gone, and Keystone goes in step 3, far too early for K-ORC to finish the
# registration's dependent deletes and then revoke. So the teardown takes the
# stall escape every time: it emits a Warning ORCTeardownStalled and
# force-removes, and an ORCTeardownComplete here is a false report. The
# stall/force-remove escalation itself is also covered by the fast fake-client
# unit test (TestReconcileDelete_ForceRemovesORCFinalizersAfterStall).
#
# The ControlPlane runs alone in chainsaw's ephemeral namespace. The suite
# seeds its admin-password path with write-bootstrap-secrets.sh and onboards its
# database-engine roles (Keystone and Barbican, which shares the managed
# database) with setup-database-tenant.sh, so it depends on nothing an earlier
# run left behind.
#
# ── DECISION: presence guard + single consolidated script ───────────────────
# The e2e-operator (c5c3) leg runs this directory on a cluster that carries the
# stack's CRDs alone, so the guard SKIPs there. The e2e-controlplane job sets
# E2E_REQUIRE_CONTROLPLANE_STACK=true, so the guard fails there instead. The
# suite seeds its own OpenBao path. Because chainsaw has no step-level skip, the
# guard and all assertions live in ONE script step.
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deletion-orchestration
spec:
  # No spec.namespace: chainsaw runs the suite in an ephemeral namespace of its
  # own, which keeps it clear of the full-chain plane that stays in openstack
  # (the webhook admits one ControlPlane per namespace).
  #
  # The full chain bring-up (including the dedicated OpenBao instance the
  # Barbican secret store is provisioned against) plus the bounded stall (7m) and
  # the GC cascade is long-running, so the consolidated script gets a generous
  # bound. Its poll deadlines sum past it, but they are never all spent: once the
  # ControlPlane is gone, the garbage collector removes its children within
  # seconds. catch and finally pin their own timeouts, and cleanup leaves room
  # for a namespace deletion that meets the 7m stall after a run that died
  # mid-flight, so the suite's ceiling is 55+5+5+10 = 75m.
  timeouts:
    assert: 5m
    exec: 55m
    cleanup: 10m
  steps:
  - try:
    - script:
        timeout: 55m
        # Chainsaw defaults to `sh`, which rejects `set -o pipefail`; every
        # infra/keystone/c5c3 e2e script pins bash for the same reason.
        shell: bash
        content: |
          set -euo pipefail

          CP_NS="${NAMESPACE}"
          CP_NAME=deletion-orch
          KEYSTONE_CR="${CP_NAME}-keystone"
          AC_NAME="${CP_NAME}-admin-app-credential"
          SVC_CR="${CP_NAME}-identity-service"
          EP_CR="${CP_NAME}-identity-endpoint"
          USER_CR="${CP_NAME}-user-admin"
          DOMAIN_CR="${CP_NAME}-domain-default"
          REGION_CR="${CP_NAME}-region"
          BARBICAN_CR="${CP_NAME}-barbican"
          BARBICAN_STORE="${BARBICAN_CR}-store"
          BARBICAN_BAO="${BARBICAN_CR}-bao"
          # The Barbican service registration the ControlPlane projects, and the
          # label its K-ORC children carry. BARBICAN_REG repeats BARBICAN_CR's
          # value but names a different object: the registration is a
          # keystoneservices.c5c3.io CR, while BARBICAN_CR names the
          # barbicans.barbican.openstack.c5c3.io child. The kinds are the eight
          # the KeystoneService controller projects, and they live in the
          # ControlPlane's namespace rather than in the registration's.
          BARBICAN_REG="${CP_NAME}-barbican"
          REG_LABEL="c5c3.io/keystoneservice-name=${BARBICAN_REG}"
          REG_KORC_KINDS="services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud,regions.openstack.k-orc.cloud,users.openstack.k-orc.cloud,projects.openstack.k-orc.cloud,roles.openstack.k-orc.cloud,roleassignments.openstack.k-orc.cloud,domains.openstack.k-orc.cloud"
          # The raft volume the openbao-operator's StatefulSet claims for the
          # single instance replica.
          BARBICAN_BAO_PVC="data-${BARBICAN_BAO}-0"
          # The auth-delegator ClusterRoleBinding is the one ensemble name this
          # script does NOT spell out: it carries a hash of the instance's
          # namespace so two same-named ControlPlanes in different namespaces
          # cannot collide on one cluster-scoped object. It is resolved from the
          # ownership labels below, once the ensemble is up.
          BARBICAN_BAO_CRB=""
          CP_LABELS="c5c3.io/controlplane-name=${CP_NAME},c5c3.io/controlplane-namespace=${CP_NS}"
          FINALIZER="c5c3.io/orc-teardown"

          REQUIRE_STACK="${E2E_REQUIRE_CONTROLPLANE_STACK:-false}"
          skip_or_fail() { # <reason...>
            if [ "${REQUIRE_STACK}" = "true" ]; then
              echo "ERROR: $*"
              echo "       E2E_REQUIRE_CONTROLPLANE_STACK=true — the ControlPlane"
              echo "       stack is required on this job, so this is a hard failure."
              exit 1
            fi
            echo "SKIP: $*"
            exit 0
          }

          # ── Presence guard ─────────────────────────────────────────────────
          # The operators are probed before the CRDs. The e2e-operator (c5c3)
          # matrix leg installs every CRD the c5c3 controller watches WITHOUT
          # deploying the sibling operators, and it carries no Barbican CRDs,
          # so probing the keystone-operator first gives that leg the reason
          # every stack suite prints there. This suite's ControlPlane needs the
          # keystone-operator and the c5c3-operator to converge before its
          # deletion can be orchestrated. The Barbican leg needs two more
          # controllers: the barbican-operator drives the child and mints its
          # secret store's AppRole credentials, and the openbao-operator drives
          # the dedicated instance behind that store to Available. The listing
          # is captured and retried rather than piped into `grep -q`, which
          # under pipefail reads a transient apiserver error, or grep closing
          # the pipe on a match, as "no pods".
          operator_running() { # <app.kubernetes.io/name label value>
            local pods
            for _ in 1 2 3 4 5; do
              if pods="$(kubectl get pods -A -l "app.kubernetes.io/name=$1" --no-headers 2>/dev/null)" \
                && [ -n "${pods}" ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! operator_running keystone-operator; then
            skip_or_fail "no keystone-operator is running; the cluster carries the" \
              "stack's CRDs only, so the ControlPlane cannot converge here."
          fi
          if ! operator_running c5c3-operator; then
            skip_or_fail "no c5c3-operator is running."
          fi
          missing=""
          for crd in \
            controlplanes.c5c3.io \
            keystoneservices.c5c3.io \
            keystones.keystone.openstack.c5c3.io \
            barbicans.barbican.openstack.c5c3.io \
            barbicansecretstores.barbican.openstack.c5c3.io \
            openbaoclusters.openbao.org \
            openbaotenants.openbao.org \
            applicationcredentials.openstack.k-orc.cloud \
            services.openstack.k-orc.cloud \
            endpoints.openstack.k-orc.cloud \
            users.openstack.k-orc.cloud \
            projects.openstack.k-orc.cloud \
            roles.openstack.k-orc.cloud \
            roleassignments.openstack.k-orc.cloud \
            domains.openstack.k-orc.cloud \
            regions.openstack.k-orc.cloud \
            externalsecrets.external-secrets.io; do
            if ! kubectl get crd "$crd" >/dev/null 2>&1; then
              missing="${missing} ${crd}"
            fi
          done
          if [ -n "${missing}" ]; then
            skip_or_fail "required CRDs not present:${missing}." \
              "The c5c3-operator + K-ORC + keystone-operator stack is" \
              "not deployed on this cluster, so ControlPlane deletion" \
              "orchestration cannot be exercised here."
          fi
          if ! kubectl get clustersecretstore openbao-cluster-store >/dev/null 2>&1; then
            skip_or_fail "openbao-cluster-store ClusterSecretStore not present;" \
              "the admin-credential chain cannot complete."
          fi
          for op in barbican-operator openbao-operator; do
            if ! operator_running "${op}"; then
              skip_or_fail "no ${op} is running; the projected Barbican ensemble" \
                "cannot converge, so its teardown cannot be exercised here."
            fi
          done
          if ! kubectl get pod openbao-0 -n shared-services >/dev/null 2>&1; then
            skip_or_fail "shared-services/openbao-0 not present."
          fi
          # The two deploy/openbao/bootstrap scripts below read the token from
          # their environment.
          export BAO_TOKEN
          BAO_TOKEN="$(kubectl get secret openbao-init-keys -n shared-services \
            -o jsonpath='{.data.init-output}' | base64 -d | jq -r '.root_token')"
          if [ -z "${BAO_TOKEN}" ] || [ "${BAO_TOKEN}" = "null" ]; then
            skip_or_fail "could not extract the OpenBao root token."
          fi
          echo "OK: stack present (including running keystone-, c5c3-, barbican- and"
          echo "    openbao-operators) — running ControlPlane deletion orchestration."

          # ── Helpers ────────────────────────────────────────────────────────
          wait_cp_condition() { # <conditionType> <timeoutSeconds>
            local ctype="$1" timeout="$2" deadline status
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              status="$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" \
                -o "jsonpath={.status.conditions[?(@.type=='${ctype}')].status}" 2>/dev/null || true)"
              if [ "${status}" = "True" ]; then
                echo "OK: ControlPlane condition ${ctype}=True"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ControlPlane condition ${ctype} not True within ${timeout}s (last: '${status:-<none>}')"
                return 1
              fi
              sleep 5
            done
          }

          wait_gone() { # <resource> <name> <timeoutSeconds>
            local res="$1" name="$2" timeout="$3" deadline
            deadline=$(( $(date +%s) + timeout ))
            while kubectl get "${res}" "${name}" -n "${CP_NS}" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${res}/${name} still present after ${timeout}s"
                return 1
              fi
              sleep 5
            done
            echo "OK: ${res}/${name} is gone"
          }

          # The label twin of wait_gone: a registration's K-ORC children are
          # found by their ownership label, not by name. Gone means a kubectl
          # that SUCCEEDED and printed nothing — this is the only assertion
          # covering the force-release, and a query that errors (an API server
          # restarting mid-teardown, one kind in the list momentarily
          # unservable) prints nothing either, so treating that as gone would
          # pass a regression that leaves every child Terminating. stderr stays
          # suppressed: a matchless `kubectl get -l` writes "No resources found"
          # there and exits 0.
          wait_label_gone() { # <kinds> <label> <timeoutSeconds>
            local kinds="$1" label="$2" timeout="$3" deadline out
            deadline=$(( $(date +%s) + timeout ))
            while :; do
              # The assignment is the left operand of && so `set -e` does not fire
              # on a failing kubectl, and its output is only trusted on exit 0.
              if out="$(kubectl get "${kinds}" -n "${CP_NS}" -l "${label}" --no-headers 2>/dev/null)" \
                 && [ -z "${out}" ]; then
                break
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${kinds} carrying ${label} still present or unqueryable after ${timeout}s: ${out}"
                return 1
              fi
              sleep 5
            done
            echo "OK: no ${kinds} carrying ${label} is left"
          }

          # The cluster-scoped twin of wait_gone. It exists for the auth-delegator
          # ClusterRoleBinding: `kubectl get -n` on a cluster-scoped object ignores
          # the namespace, so the check would still work, but naming it separately
          # keeps it obvious that no namespace teardown can collect this one.
          wait_gone_cluster_scoped() { # <resource> <name> <timeoutSeconds>
            local res="$1" name="$2" timeout="$3" deadline
            deadline=$(( $(date +%s) + timeout ))
            while kubectl get "${res}" "${name}" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${res}/${name} still present after ${timeout}s"
                return 1
              fi
              sleep 5
            done
            echo "OK: ${res}/${name} is gone"
          }

          # ── Seed the per-CR OpenBao path this plane reads ──────────────────
          KORC_CONTROLPLANES="${CP_NS}/${CP_NAME}" \
            ../../../../deploy/openbao/bootstrap/write-bootstrap-secrets.sh
          echo "OK: the per-CR admin-password path is seeded."

          # ── Bring the ControlPlane up to Ready ─────────────────────────────
          # Chainsaw runs scripts with the test directory as CWD.
          kubectl apply -n "${CP_NS}" -f 00-controlplane-cr.yaml

          # The database-engine roles need the projected, Ready MariaDB.
          # InfrastructureReady comes first, because `kubectl wait` on a MariaDB
          # the plane has not projected yet exits NotFound. The script
          # provisions the Keystone pair and the Barbican pair, because Barbican
          # shares the managed database.
          wait_cp_condition InfrastructureReady 600
          kubectl wait mariadb/openstack-db -n "${CP_NS}" --for=condition=Ready --timeout=120s
          ../../../../deploy/openbao/bootstrap/setup-database-tenant.sh "${CP_NS}" "${CP_NAME}"
          unset BAO_TOKEN
          echo "OK: OpenBao database-engine tenant onboarded."

          # The window covers the Barbican leg too: the dedicated OpenBao instance
          # is created, unsealed and self-init'd, and only then can the store's
          # AppRole be minted and the child converge.
          wait_cp_condition Ready 1200

          # The ORC-teardown finalizer must be installed, and the six owned
          # K-ORC CRs must exist before we tear down.
          kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" \
            -o jsonpath='{.metadata.finalizers}' | grep -qF "${FINALIZER}" \
            || { echo "ERROR: ${FINALIZER} not installed on the ControlPlane"; exit 1; }
          for kv in \
            "applicationcredential ${AC_NAME}" \
            "services.openstack.k-orc.cloud ${SVC_CR}" \
            "endpoints.openstack.k-orc.cloud ${EP_CR}" \
            "users.openstack.k-orc.cloud ${USER_CR}" \
            "domains.openstack.k-orc.cloud ${DOMAIN_CR}" \
            "regions.openstack.k-orc.cloud ${REGION_CR}"; do
            set -- $kv
            kubectl get "$1" "$2" -n "${CP_NS}" >/dev/null \
              || { echo "ERROR: expected K-ORC CR $1/$2 missing before teardown"; exit 1; }
          done
          echo "OK: finalizer installed and all six K-ORC CRs present."

          # The Barbican ensemble must be STANDING before the teardown, or the
          # "gone" checks below would pass against objects that never existed.
          for kv in \
            "barbicans.barbican.openstack.c5c3.io ${BARBICAN_CR}" \
            "barbicansecretstores.barbican.openstack.c5c3.io ${BARBICAN_STORE}" \
            "openbaoclusters.openbao.org ${BARBICAN_BAO}" \
            "persistentvolumeclaim ${BARBICAN_BAO_PVC}"; do
            set -- $kv
            kubectl get "$1" "$2" -n "${CP_NS}" >/dev/null \
              || { echo "ERROR: expected Barbican ensemble object $1/$2 missing before teardown"; exit 1; }
          done
          # {.items[*]...} emits a SPACE-SEPARATED list, and wait_gone_cluster_scoped
          # passes the value quoted — so two matches (a binding leaked by an earlier
          # run of this suite in the same cluster carries the same labels) would look
          # up one resource literally named "a b", get NotFound on the first
          # iteration, and report the residue reaped while both are still live. That
          # would make the assertion this suite exists for a no-op, so anything but
          # exactly one match is an error here.
          BARBICAN_BAO_CRB="$(kubectl get clusterrolebinding -l "${CP_LABELS}" \
            -o jsonpath='{.items[*].metadata.name}')"
          case "${BARBICAN_BAO_CRB}" in
            "")   echo "ERROR: expected auth-delegator ClusterRoleBinding missing before teardown"; exit 1 ;;
            *\ *) echo "ERROR: ${CP_LABELS} matches more than one ClusterRoleBinding: ${BARBICAN_BAO_CRB}"; exit 1 ;;
          esac
          echo "OK: Barbican child, secret store, dedicated OpenBao instance, its PVC, and the auth-delegator binding are present."

          # The projected Barbican registration and at least one of its
          # label-owned K-ORC children must be STANDING too, or the residue
          # checks below are vacuous.
          kubectl get keystoneservices.c5c3.io "${BARBICAN_REG}" -n "${CP_NS}" >/dev/null \
            || { echo "ERROR: expected projected KeystoneService ${BARBICAN_REG} missing before teardown"; exit 1; }
          if [ -z "$(kubectl get "${REG_KORC_KINDS}" -n "${CP_NS}" -l "${REG_LABEL}" --no-headers 2>/dev/null)" ]; then
            echo "ERROR: expected at least one K-ORC CR carrying ${REG_LABEL} before teardown"; exit 1
          fi
          echo "OK: projected KeystoneService ${BARBICAN_REG} and its label-owned K-ORC CRs are present."

          # ── Simulate "Keystone already gone" during teardown ───────────────
          # Initiate deletion first (async) so the operator enters its deletion
          # branch and stops re-projecting the Keystone child, THEN delete the
          # Keystone CR so K-ORC can no longer revoke against a live Keystone.
          echo "== deleting ControlPlane (async) and taking Keystone down =="
          kubectl delete controlplane "${CP_NAME}" -n "${CP_NS}" --wait=false
          kubectl delete keystone "${KEYSTONE_CR}" -n "${CP_NS}" --ignore-not-found --wait=false

          # ── Deletion must COMPLETE despite Keystone being gone ──────────────
          # The finalizer waits up to orcTeardownDeadline (7m), then force-
          # removes the stuck openstack.k-orc.cloud/* finalizers and releases the
          # ControlPlane. 10m bounds that with headroom.
          echo "== waiting for ControlPlane deletion to complete (<=10m) =="
          kubectl wait --for=delete "controlplane/${CP_NAME}" -n "${CP_NS}" --timeout=10m
          echo "OK: ControlPlane deletion completed — did not hang on Terminating ORC CRs."

          # ── GC cascade: every owned child must be reclaimed ────────────────
          wait_gone applicationcredential "${AC_NAME}" 300
          wait_gone services.openstack.k-orc.cloud "${SVC_CR}" 300
          wait_gone endpoints.openstack.k-orc.cloud "${EP_CR}" 300
          wait_gone users.openstack.k-orc.cloud "${USER_CR}" 300
          wait_gone domains.openstack.k-orc.cloud "${DOMAIN_CR}" 300
          wait_gone regions.openstack.k-orc.cloud "${REGION_CR}" 300
          wait_gone keystone "${KEYSTONE_CR}" 300
          wait_gone mariadb openstack-db 300
          wait_gone memcacheds.memcached.c5c3.io openstack-memcached 300

          # ── The Barbican ensemble must be reclaimed too ────────────────────
          # The child, its store, and the instance follow the owner references;
          # the PVC follows the instance's deletionPolicy (DeletePVCs), and the
          # cluster-scoped binding is removed by the ControlPlane finalizer, since
          # neither the GC cascade nor a namespace deletion reaches it. The
          # instance carries the openbao-operator's own finalizer, so it gets the
          # widest window of the group.
          wait_gone barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" 300
          wait_gone barbicansecretstores.barbican.openstack.c5c3.io "${BARBICAN_STORE}" 300
          wait_gone openbaoclusters.openbao.org "${BARBICAN_BAO}" 600
          wait_gone persistentvolumeclaim "${BARBICAN_BAO_PVC}" 300
          wait_gone_cluster_scoped clusterrolebinding "${BARBICAN_BAO_CRB}" 300

          # ── The projected registration must leave no residue ───────────────
          # On this Keystone-gone path the ControlPlane gives up on the
          # registration and force-releases its K-ORC CRs and PushSecrets before
          # it lets go; the registration CR itself follows through its own
          # controller. So nothing of it may be left Terminating.
          wait_gone keystoneservices.c5c3.io "${BARBICAN_REG}" 300
          wait_label_gone "${REG_KORC_KINDS}" "${REG_LABEL}" 300

          # ── The stall escape must have announced itself ────────────────────
          # Keystone goes before K-ORC can revoke, so ORCTeardownStalled proves the
          # finalizer drove the teardown through the escape. ORCTeardownComplete
          # would report a clean finish for a teardown that orphaned Keystone
          # resources. Here-strings, because `echo | grep -q` fails with SIGPIPE
          # under pipefail on a large string.
          echo "== ORC-teardown events =="
          reasons="$(kubectl get events -n "${CP_NS}" \
            -o jsonpath='{range .items[*]}{.reason}{"\n"}{end}' 2>/dev/null || true)"
          echo "${reasons}" | grep -E 'FinalizingORC|ORCTeardown' || true
          if ! grep -qx ORCTeardownStalled <<<"${reasons}"; then
            echo "ERROR: no ORCTeardownStalled event observed"
            exit 1
          fi
          if grep -qx ORCTeardownComplete <<<"${reasons}"; then
            echo "ERROR: ORCTeardownComplete reported for a teardown that took the stall escape"
            exit 1
          fi
          echo "OK: the stall escape announced itself and no clean completion was reported."
          echo "OK: ControlPlane deletion orchestration verified."
    catch:
    - script:
        # Pinned, because chainsaw applies the test's exec budget to every
        # script operation; a dump against a wedged apiserver must not inherit
        # 55m.
        timeout: 5m
        shell: bash
        content: |
          echo "=== ControlPlane (may be Terminating or gone) ==="
          kubectl get controlplane deletion-orch -n "${NAMESPACE}" -o yaml 2>&1 || true
          echo "=== ControlPlane status.conditions ==="
          kubectl get controlplane deletion-orch -n "${NAMESPACE}" \
            -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}: {.message}){"\n"}{end}' 2>&1 || true
          echo "=== K-ORC CRs (may be Terminating) ==="
          kubectl get applicationcredentials.openstack.k-orc.cloud,services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud,users.openstack.k-orc.cloud,domains.openstack.k-orc.cloud,regions.openstack.k-orc.cloud -n "${NAMESPACE}" 2>&1 || true
          echo "=== Projected child CRs ==="
          kubectl get mariadb,memcacheds.memcached.c5c3.io,keystone -n "${NAMESPACE}" 2>&1 || true
          echo "=== Projected KeystoneService registrations (may be Terminating) ==="
          kubectl get keystoneservices.c5c3.io -n "${NAMESPACE}" 2>&1 || true
          echo "=== Registration-owned K-ORC CRs (may be Terminating) ==="
          kubectl get services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud,users.openstack.k-orc.cloud,projects.openstack.k-orc.cloud,roles.openstack.k-orc.cloud,roleassignments.openstack.k-orc.cloud,domains.openstack.k-orc.cloud -n "${NAMESPACE}" -l c5c3.io/keystoneservice-name=deletion-orch-barbican 2>&1 || true
          echo "=== Barbican ensemble (may be Terminating or gone) ==="
          kubectl get barbicans.barbican.openstack.c5c3.io,barbicansecretstores.barbican.openstack.c5c3.io -n "${NAMESPACE}" 2>&1 || true
          kubectl get openbaoclusters.openbao.org,pvc -n "${NAMESPACE}" 2>&1 || true
          kubectl get clusterrolebinding \
            -l "c5c3.io/controlplane-name=deletion-orch,c5c3.io/controlplane-namespace=${NAMESPACE}" 2>&1 || true
          echo "=== barbican-operator logs (last 100 lines) ==="
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --tail=100 --all-containers 2>&1 || true
          echo "=== openbao-operator logs (last 100 lines) ==="
          kubectl logs -n openbao-operator-system -l app.kubernetes.io/name=openbao-operator --tail=100 --all-containers 2>&1 || true
          echo "=== c5c3-operator logs (last 200 lines) ==="
          kubectl logs -n c5c3-system -l app.kubernetes.io/name=c5c3-operator --tail=200 --all-containers 2>&1 || true
          echo "=== K-ORC controller logs (last 100 lines) ==="
          kubectl logs -n orc-system deploy/orc-controller-manager --pod-running-timeout=5s --tail=100 --all-containers 2>&1 || true
          echo "=== Events (suite namespace, last 40) ==="
          kubectl get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' 2>&1 | tail -40 || true
    finally:
    - script:
        # Pinned for the same reason as catch above.
        timeout: 5m
        shell: bash
        content: |
          # Best-effort cleanup if the test failed mid-flight: start the
          # ControlPlane's and Keystone's deletion before chainsaw deletes the
          # suite's namespace, so the plane's finalizer runs its bounded stall
          # (orcTeardownDeadline, 7m) inside the 10m cleanup. Successful runs
          # already deleted everything.
          kubectl delete controlplane deletion-orch -n "${NAMESPACE}" --ignore-not-found --wait=false 2>&1 || true
          kubectl delete keystone deletion-orch-keystone -n "${NAMESPACE}" --ignore-not-found --wait=false 2>&1 || true
