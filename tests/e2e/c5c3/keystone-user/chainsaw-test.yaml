# Chainsaw E2E test for the Keystone orders: a service owner orders a Keystone
# user from a namespace the ControlPlane assigns to them, and the credentials
# arrive as a Secret beside the order. Beside the user the owner orders a
# project, a role on it, and a catalog entry.
#
# Unit tests drive a fake client and envtest carries K-ORC as schema without a
# controller; neither sees Keystone, OpenBao or ESO. This suite is where the
# orders meet all three: K-ORC creates the user, the project, the role
# assignment and the catalog rows in a live Keystone, ESO pushes the password to
# OpenBao through the plane namespace's own store, and a Job in the owner's
# namespace authenticates with the delivered Secret and scopes to the project.
#
# ── Legs ─────────────────────────────────────────────────────────────────────
#   DELIVERY  the order in the assigned namespace reaches Ready, its Secret
#             carries clouds.yaml and password, nothing that reaches OpenBao is
#             in the owner's namespace, the password is backed up, and a Job
#             there issues a token.
#   REPAIR    an overwritten password and a deleted Secret come back.
#   ROTATION  raising spec.passwordGeneration delivers a new password, backs
#             it up to OpenBao, and drops the old generation's Secret.
#   PIECES-REFUSED  a project, a role assignment and a catalog entry are
#             ordered; the project is provisioned, the role is off the empty
#             allowedRoles and the entry has no allowCatalogEntries, so neither
#             projects anything.
#   PIECES    admitting the role and catalog entries assigns the role and
#             registers the entry; a Job scoped to the project issues a token
#             and reads the entry out of the catalog. A duplicate assignment
#             and a colliding catalog entry are refused.
#   PIECES-FREEZE  taking the role off the list and clearing the catalog flag
#             freeze the two orders without revoking anything.
#   REFUSAL   an order from a namespace no entry assigns reads
#             NamespaceNotAssigned and creates nothing.
#   FREEZE    withdrawing the assignment freezes every order: the Secret, the
#             Keystone user and the pieces' K-ORC children stay, and an edited
#             Secret is not repaired. Restoring the entry recovers them.
#   TEARDOWN  deleting the user holds while the assignment references it;
#             deleting the assignment releases it, and every order's deletion
#             removes what it created, the OpenBao path included.
#
# ── Its own ControlPlane, and the two seeds it needs ─────────────────────────
# As the keystone-service-foreign-namespace suite: a Keystone-only plane in
# chainsaw's ephemeral namespace, with the Model B admin password and the
# database-engine role seeded by the scripts deploy-infra runs.
#
# ── Presence guard ───────────────────────────────────────────────────────────
# Mirrors the sibling c5c3 suites. The e2e-operator c5c3 matrix leg runs this
# whole directory on a cluster carrying the stack's CRDs but none of its
# operators, so the suite SKIPs there. E2E_REQUIRE_CONTROLPLANE_STACK=true flips
# the guard to a hard failure on the job that is meant to carry the stack.
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keystone-user
spec:
  # The bring-up of an identity plane plus nine legs and a bounded teardown runs
  # well past the suite defaults. The three legs of the pieces add three K-ORC
  # convergences to the foreign-namespace suite's budget, and cleanup is
  # generous for the same reason it is there.
  timeouts:
    assert: 5m
    exec: 50m
    cleanup: 15m
  steps:
  - try:
    - script:
        timeout: 50m
        # Chainsaw defaults to `sh`, which rejects `set -o pipefail`.
        shell: bash
        content: |
          set -euo pipefail

          CP_NS="${NAMESPACE}"
          CP_NAME="cp"
          TENANT_NS="${NAMESPACE}-tenant"
          OUTSIDER_NS="${NAMESPACE}-outsider"
          ORDER=workflow
          OUTSIDER=outsider
          PROJECT=workflow-project
          MEMBER=workflow-member
          DNS=workflow-dns
          CREDS_SECRET=workflow-credentials
          ORDER_SELECTOR="c5c3.io/keystoneuser-name=${ORDER},c5c3.io/keystoneuser-namespace=${TENANT_NS}"
          OUTSIDER_SELECTOR="c5c3.io/keystoneuser-name=${OUTSIDER},c5c3.io/keystoneuser-namespace=${OUTSIDER_NS}"
          PROJECT_SELECTOR="c5c3.io/keystoneproject-name=${PROJECT},c5c3.io/keystoneproject-namespace=${TENANT_NS}"
          MEMBER_SELECTOR="c5c3.io/keystoneroleassignment-name=${MEMBER},c5c3.io/keystoneroleassignment-namespace=${TENANT_NS}"
          DNS_SELECTOR="c5c3.io/keystonecatalogentry-name=${DNS},c5c3.io/keystonecatalogentry-namespace=${TENANT_NS}"
          CHILD_KINDS=users.openstack.k-orc.cloud,secrets,pushsecrets.external-secrets.io
          PIECE_KINDS=roleassignments.openstack.k-orc.cloud,services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud

          REQUIRE_STACK="${E2E_REQUIRE_CONTROLPLANE_STACK:-false}"
          skip_or_fail() { # <reason...>
            if [ "${REQUIRE_STACK}" = "true" ]; then
              echo "ERROR: $*"
              echo "       E2E_REQUIRE_CONTROLPLANE_STACK=true — the ControlPlane"
              echo "       stack is required on this job, so this is a hard failure."
              exit 1
            fi
            echo "SKIP: $*"
            exit 0
          }

          # ── Presence guard ────────────────────────────────────────────────
          missing=""
          for crd in \
            controlplanes.c5c3.io \
            keystoneusers.c5c3.io \
            keystoneprojects.c5c3.io \
            keystoneroleassignments.c5c3.io \
            keystonecatalogentries.c5c3.io \
            keystones.keystone.openstack.c5c3.io \
            mariadbs.k8s.mariadb.com \
            memcacheds.memcached.c5c3.io \
            applicationcredentials.openstack.k-orc.cloud \
            users.openstack.k-orc.cloud \
            domains.openstack.k-orc.cloud \
            projects.openstack.k-orc.cloud \
            roles.openstack.k-orc.cloud \
            roleassignments.openstack.k-orc.cloud \
            services.openstack.k-orc.cloud \
            endpoints.openstack.k-orc.cloud \
            regions.openstack.k-orc.cloud \
            externalsecrets.external-secrets.io \
            pushsecrets.external-secrets.io \
            secretstores.external-secrets.io \
            certificates.cert-manager.io; do
            if ! kubectl get crd "$crd" >/dev/null 2>&1; then
              missing="${missing} ${crd}"
            fi
          done
          if [ -n "${missing}" ]; then
            skip_or_fail "required CRDs not present:${missing}"
          fi
          if ! kubectl get clustersecretstore openbao-cluster-store >/dev/null 2>&1; then
            skip_or_fail "openbao-cluster-store ClusterSecretStore not present."
          fi
          if ! kubectl get pod openbao-0 -n shared-services >/dev/null 2>&1; then
            skip_or_fail "shared-services/openbao-0 not present."
          fi
          # The CRDs alone do not prove the stack: the e2e-operator (c5c3) leg
          # installs them without the sibling operators. Probe for running pods.
          # The probe captures via command substitution and retries, so a
          # transient apiserver error does not read as "no pods".
          operator_running() { # <app.kubernetes.io/name label value>
            local pods
            for _ in 1 2 3 4 5; do
              if pods="$(kubectl get pods -A -l "app.kubernetes.io/name=$1" --no-headers 2>/dev/null)" \
                && [ -n "${pods}" ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! operator_running keystone-operator; then
            skip_or_fail "no keystone-operator is running; the cluster carries the stack's CRDs only."
          fi
          if ! operator_running c5c3-operator; then
            skip_or_fail "no c5c3-operator is running."
          fi

          # The two deploy/openbao/bootstrap scripts below read the token from
          # their environment, so the export stays. Every bao call of this script
          # reads it from a file staged in openbao-0 instead, which keeps the root
          # token out of argv and the API server's audit log (see the
          # keystone-service suite for the full reasoning).
          export BAO_TOKEN
          BAO_TOKEN="$(kubectl get secret openbao-init-keys -n shared-services \
            -o jsonpath='{.data.init-output}' | base64 -d | jq -r '.root_token')"
          if [ -z "${BAO_TOKEN}" ] || [ "${BAO_TOKEN}" = "null" ]; then
            skip_or_fail "could not extract the OpenBao root token."
          fi
          if ! printf '%s' "${BAO_TOKEN}" | kubectl exec -i -n shared-services openbao-0 -- \
            sh -c 'umask 077; cat > /tmp/.bao-token'; then
            skip_or_fail "could not stage the OpenBao root token in openbao-0."
          fi
          bao_exec() {
            kubectl exec -n shared-services openbao-0 -- \
              env BAO_ADDR=https://127.0.0.1:8200 \
              VAULT_CACERT=/openbao/tls/ca.crt \
              VAULT_CLIENT_CERT=/openbao/client-tls/tls.crt \
              VAULT_CLIENT_KEY=/openbao/client-tls/tls.key \
              sh -c 'BAO_TOKEN="$(cat /tmp/.bao-token)"; export BAO_TOKEN; exec "$@"' _ "$@"
          }
          if ! bao_exec bao read auth/kubernetes/management/role/eso-tenant >/dev/null 2>&1; then
            skip_or_fail "the eso-tenant OpenBao auth role is not configured."
          fi
          echo "OK: prerequisites present — running the Keystone order chain."

          # ── Helpers ───────────────────────────────────────────────────────
          # Explicit polls rather than `kubectl wait`, so a condition that is
          # briefly absent retries and the failure names the last status seen.
          wait_condition() { # <resource> <name> <namespace> <conditionType> <expected> <timeoutSeconds>
            local res="$1" name="$2" ns="$3" ctype="$4" want="$5" timeout="$6"
            local deadline status
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              status="$(kubectl get "${res}" "${name}" -n "${ns}" \
                -o "jsonpath={.status.conditions[?(@.type=='${ctype}')].status}" 2>/dev/null || true)"
              if [ "${status}" = "${want}" ]; then
                echo "OK: ${res}/${name} ${ctype}=${want}"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${res}/${name} ${ctype} not ${want} within ${timeout}s (last: '${status:-<none>}')"
                kubectl get "${res}" "${name}" -n "${ns}" \
                  -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}: {.message}){"\n"}{end}' 2>&1 || true
                return 1
              fi
              sleep 5
            done
          }
          wait_cp_condition() { # <conditionType> <timeoutSeconds>
            wait_condition controlplane "${CP_NAME}" "${CP_NS}" "$1" True "$2"
          }
          condition_reason() { # <resource> <name> <namespace> <conditionType>
            kubectl get "$1" "$2" -n "$3" \
              -o "jsonpath={.status.conditions[?(@.type=='$4')].reason}" 2>/dev/null || true
          }
          condition_message() { # <resource> <name> <namespace> <conditionType>
            kubectl get "$1" "$2" -n "$3" \
              -o "jsonpath={.status.conditions[?(@.type=='$4')].message}" 2>/dev/null || true
          }
          wait_reason() { # <resource> <name> <namespace> <conditionType> <expectedReason> <timeoutSeconds>
            local res="$1" name="$2" ns="$3" ctype="$4" want="$5" timeout="$6"
            local deadline reason
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              reason="$(condition_reason "${res}" "${name}" "${ns}" "${ctype}")"
              if [ "${reason}" = "${want}" ]; then
                echo "OK: ${res}/${name} ${ctype} reports ${want}"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${res}/${name} ${ctype} did not report ${want} within ${timeout}s (last: '${reason:-<none>}')"
                kubectl get "${res}" "${name}" -n "${ns}" \
                  -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}: {.message}){"\n"}{end}' 2>&1 || true
                return 1
              fi
              sleep 5
            done
          }
          assert_eq() { # <description> <expected> <actual>
            if [ "$2" != "$3" ]; then
              echo "ERROR: $1 — expected '$2', got '$3'"
              exit 1
            fi
            echo "OK: $1 ('$3')"
          }
          assert_nonempty() { # <description> <value>
            if [ -z "$2" ]; then
              echo "ERROR: $1 — value is empty"
              exit 1
            fi
            echo "OK: $1 ('$2')"
          }
          count_of() { # <kinds> <namespace> [selector]
            local kinds="$1" ns="$2" sel="${3:-}"
            if [ -n "${sel}" ]; then
              kubectl get "${kinds}" -n "${ns}" -l "${sel}" --no-headers 2>/dev/null | grep -c . || true
            else
              kubectl get "${kinds}" -n "${ns}" --no-headers 2>/dev/null | grep -c . || true
            fi
          }
          wait_gone() { # <resource> <name> <namespace> <timeoutSeconds>
            local res="$1" name="$2" ns="$3" timeout="$4" deadline
            deadline=$(( $(date +%s) + timeout ))
            while kubectl get "${res}" "${name}" -n "${ns}" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${res}/${name} in ${ns} still present after ${timeout}s"
                return 1
              fi
              sleep 5
            done
            echo "OK: ${res}/${name} in ${ns} is gone"
          }
          assert_no_event() { # <reason> <namespace>
            local reason="$1" ns="$2" out
            if ! out="$(kubectl get events -n "${ns}" --field-selector "reason=${reason}" --no-headers 2>/dev/null)"; then
              echo "ERROR: kubectl get events in ${ns} failed; refusing to report no ${reason} event"
              exit 1
            fi
            if [ -n "${out}" ]; then
              echo "ERROR: ${ns} holds ${reason} event(s):"
              echo "${out}"
              exit 1
            fi
            echo "OK: no ${reason} event in ${ns}"
          }
          # One read rather than a wait. Only a NotFound counts as absent; any
          # other read error is retried twice, then fails the check.
          assert_absent() { # <resource> <name> <namespace>
            local res="$1" name="$2" ns="$3" err
            for _ in 1 2 3; do
              if err="$(kubectl get "${res}" "${name}" -n "${ns}" 2>&1 >/dev/null)"; then
                echo "ERROR: ${res}/${name} in ${ns} is still present"
                exit 1
              elif grep -qi 'not found' <<<"${err}"; then
                echo "OK: ${res}/${name} in ${ns} is gone"
                return 0
              fi
              echo "WARN: kubectl get ${res}/${name} failed (${err}); retrying"
              sleep 5
            done
            echo "ERROR: ${res}/${name} in ${ns} could not be read"
            exit 1
          }
          # The base64 value of a Secret key, read in one call. Never printed.
          secret_key() { # <name> <namespace> <key>
            kubectl get secret "$1" -n "$2" -o "jsonpath={.data.$3}" 2>/dev/null || true
          }
          # Waits until the delivered Secret carries the password the given
          # generation's Secret in the plane's namespace holds.
          wait_delivered_password() { # <generation> <timeoutSeconds>
            local gen="$1" timeout="$2" deadline want got
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              want="$(secret_key "${PREFIX}password-v${gen}" "${CP_NS}" password)"
              got="$(secret_key "${CREDS_SECRET}" "${TENANT_NS}" password)"
              if [ -n "${want}" ] && [ "${want}" = "${got}" ]; then
                echo "OK: ${CREDS_SECRET} carries the password of generation ${gen}"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${CREDS_SECRET} does not carry the password of generation ${gen} within ${timeout}s"
                return 1
              fi
              sleep 5
            done
          }
          # Probe for LIVE data: a kv-v2 soft delete leaves the metadata behind,
          # so `kv get` keeps exiting 0 with data:null after the value is purged.
          # Only data:null, or OpenBao saying the path is not there, ends the
          # loop; kubectl's own transport errors retry (see keystone-service).
          wait_kv_purged() { # <kv path> <timeoutSeconds> <what the purge follows>
            local path="$1" timeout="$2" after="$3" deadline err kv_json
            deadline=$(( $(date +%s) + timeout ))
            err="$(mktemp)"
            while true; do
              if kv_json="$(bao_exec bao kv get -format=json -mount=kv-v2 "${path}" 2>"${err}")"; then
                jq -e '.data.data == null' <<<"${kv_json}" >/dev/null 2>&1 && break
              elif grep -qiE 'no value found|no secret found' "${err}"; then
                break
              else
                echo "WARN: could not read ${path} ($(cat "${err}")); retrying"
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${path} still holds a live value, or could not be read, ${timeout}s after ${after}"
                rm -f "${err}"
                exit 1
              fi
              sleep 5
            done
            rm -f "${err}"
            echo "OK: ${path} holds no live value."
          }
          # The counterpart, so the purge check later watches a path that was
          # written. The JSON is key material, so nothing of it is printed.
          assert_kv_live() { # <kv path> <timeoutSeconds>
            local path="$1" timeout="$2" deadline err kv_json
            deadline=$(( $(date +%s) + timeout ))
            err="$(mktemp)"
            while true; do
              if kv_json="$(bao_exec bao kv get -format=json -mount=kv-v2 "${path}" 2>"${err}")" &&
                jq -e '.data.data != null' <<<"${kv_json}" >/dev/null 2>&1; then
                rm -f "${err}"
                echo "OK: ${path} holds a live value."
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${path} held no live value within ${timeout}s ($(cat "${err}"))"
                rm -f "${err}"
                exit 1
              fi
              sleep 5
            done
          }
          # Waits until the OpenBao backup holds the password the delivered Secret
          # carries. Both are credentials, so they are compared here and never
          # printed.
          wait_kv_password() { # <kv path> <timeoutSeconds>
            local path="$1" timeout="$2" deadline kv_json want got
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              want="$(base64 -d <<<"$(secret_key "${CREDS_SECRET}" "${TENANT_NS}" password)")"
              got=""
              if kv_json="$(bao_exec bao kv get -format=json -mount=kv-v2 "${path}" 2>/dev/null)"; then
                got="$(jq -r '.data.data.password // empty' <<<"${kv_json}" 2>/dev/null || true)"
              fi
              if [ -n "${want}" ] && [ "${want}" = "${got}" ]; then
                echo "OK: ${path} holds the delivered password."
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${path} does not hold the delivered password within ${timeout}s"
                exit 1
              fi
              sleep 5
            done
          }
          # Runs the verify Job from scratch and fails unless a token was issued.
          run_verify_job() { # <when>
            kubectl delete job workflow-verify -n "${TENANT_NS}" --ignore-not-found --wait=true
            sed -e "s|@TENANT_NS@|${TENANT_NS}|g" 03-openstack-verify-job.yaml | kubectl apply -f -
            if ! kubectl wait --for=condition=complete "job/workflow-verify" -n "${TENANT_NS}" --timeout=5m; then
              echo "ERROR: the verify Job did not complete ($1)"
              kubectl logs -n "${TENANT_NS}" job/workflow-verify 2>&1 || true
              exit 1
            fi
            # One capture, then here-strings: `kubectl logs | grep -q` exits on
            # the first match and kills kubectl with EPIPE under pipefail.
            local logs
            logs="$(kubectl logs -n "${TENANT_NS}" job/workflow-verify)"
            if ! grep -q "expires" <<<"${logs}" || ! grep -q "the delivered credentials authenticate" <<<"${logs}"; then
              echo "ERROR: the verify Job printed no token table ($1)"
              echo "${logs}"
              exit 1
            fi
            echo "OK: a Job in the owner's namespace issued a token ($1)."
          }
          # Runs the project-scoped verify Job from scratch and fails unless a
          # token was issued and the catalog lists the entry's public URL.
          run_scoped_verify_job() { # <when>
            local domain logs
            domain="$(kubectl get keystoneproject "${PROJECT}" -n "${TENANT_NS}" -o jsonpath='{.status.domainName}')"
            kubectl delete job workflow-scoped-verify -n "${TENANT_NS}" --ignore-not-found --wait=true
            sed -e "s|@TENANT_NS@|${TENANT_NS}|g" -e "s|@DOMAIN@|${domain}|g" 07-openstack-scoped-verify-job.yaml \
              | kubectl apply -f -
            if ! kubectl wait --for=condition=complete "job/workflow-scoped-verify" -n "${TENANT_NS}" --timeout=5m; then
              echo "ERROR: the scoped verify Job did not complete ($1)"
              kubectl logs -n "${TENANT_NS}" job/workflow-scoped-verify 2>&1 || true
              exit 1
            fi
            # One capture, then here-strings, for the EPIPE reason run_verify_job
            # gives.
            logs="$(kubectl logs -n "${TENANT_NS}" job/workflow-scoped-verify)"
            if ! grep -q "expires" <<<"${logs}" || ! grep -q "https://dns.example.test/v2" <<<"${logs}"; then
              echo "ERROR: the scoped verify Job printed no token table or no catalog URL ($1)"
              echo "${logs}"
              exit 1
            fi
            echo "OK: a Job in the owner's namespace scoped a token to the project and read the catalog ($1)."
          }
          # The managed catalog Services carrying a selector: the collision
          # probe is an unmanaged import of the row it found, so it does not
          # count as a registered row.
          managed_services() { # <selector>
            kubectl get services.openstack.k-orc.cloud -n "${CP_NS}" -l "$1" \
              -o jsonpath='{range .items[?(@.spec.managementPolicy=="managed")]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
              | grep -c . || true
          }

          # ── The two namespaces the plane does not own ─────────────────────
          kubectl create namespace "${TENANT_NS}"
          kubectl create namespace "${OUTSIDER_NS}"

          # ── Seed the per-CR OpenBao paths this plane reads ────────────────
          KORC_CONTROLPLANES="${CP_NS}/${CP_NAME}" \
            ../../../../deploy/openbao/bootstrap/write-bootstrap-secrets.sh
          echo "OK: the per-CR admin-password path is seeded."

          # ── Apply the ControlPlane ────────────────────────────────────────
          sed -e "s|@TENANT_NS@|${TENANT_NS}|g" 00-controlplane-cr.yaml \
            | kubectl apply -n "${CP_NS}" -f -

          wait_cp_condition InfrastructureReady 600
          kubectl wait mariadb/openstack-db -n "${CP_NS}" --for=condition=Ready --timeout=600s
          ../../../../deploy/openbao/bootstrap/setup-database-tenant.sh "${CP_NS}" "${CP_NAME}"
          echo "OK: OpenBao database-engine tenant onboarded."

          wait_cp_condition DBCredentialsReady 300
          wait_cp_condition KeystoneReady 900
          wait_cp_condition KORCReady 600
          wait_cp_condition AdminCredentialReady 600
          echo "OK: the plane serves an identity plane orders can reach."

          # ══ LEG 1 — the order is delivered beside it ══════════════════════
          sed -e "s|@TENANT_NS@|${TENANT_NS}|g" -e "s|@CP_NS@|${CP_NS}|g" \
            01-keystoneuser-tenant.yaml | kubectl apply -f -

          # K-ORC creates the user in Keystone and ESO pushes the password to
          # OpenBao before anything is delivered, so this is the longest wait.
          wait_condition keystoneuser "${ORDER}" "${TENANT_NS}" Ready True 900
          assert_eq "the user is provisioned" "UserProvisioned" \
            "$(condition_reason keystoneuser "${ORDER}" "${TENANT_NS}" UserReady)"
          assert_eq "the credentials are delivered" "Delivered" \
            "$(condition_reason keystoneuser "${ORDER}" "${TENANT_NS}" DeliveryReady)"
          assert_eq "status names the delivered Secret" "${CREDS_SECRET}" \
            "$(kubectl get keystoneuser "${ORDER}" -n "${TENANT_NS}" -o jsonpath='{.status.secretName}')"
          assert_eq "status names both keys" "clouds.yaml password" \
            "$(kubectl get keystoneuser "${ORDER}" -n "${TENANT_NS}" -o jsonpath='{.status.secretKeys[*]}')"
          assert_nonempty "Keystone resolved the user id" \
            "$(kubectl get keystoneuser "${ORDER}" -n "${TENANT_NS}" -o jsonpath='{.status.userID}')"
          assert_eq "the order holds generation 1" "1" \
            "$(kubectl get keystoneuser "${ORDER}" -n "${TENANT_NS}" -o jsonpath='{.status.passwordGeneration}')"
          assert_eq "one K-ORC User sits in the plane's namespace" "1" \
            "$(count_of users.openstack.k-orc.cloud "${CP_NS}" "${ORDER_SELECTOR}")"

          # The children's common prefix, read off the managed User
          # (<prefix>user), and the OpenBao path, read off the PushSecret.
          USER_CR="$(kubectl get users.openstack.k-orc.cloud -n "${CP_NS}" -l "${ORDER_SELECTOR}" \
            -o jsonpath='{.items[0].metadata.name}')"
          PREFIX="${USER_CR%user}"
          KV_PATH="$(kubectl get pushsecret "${PREFIX}backup" -n "${CP_NS}" \
            -o jsonpath='{.spec.data[0].match.remoteRef.remoteKey}')"
          if ! grep -qE "^openstack/keystone/${CP_NS}/${ORDER}-[0-9a-f]{8}-user/service-accounts/credentials\$" <<<"${KV_PATH}"; then
            echo "ERROR: the backup path '${KV_PATH}' does not have the documented shape"; exit 1
          fi
          echo "OK: the password is backed up to ${KV_PATH}."

          # Nothing that can reach OpenBao is in the owner's namespace: no store,
          # no ServiceAccount besides the one every namespace gets, no client
          # certificate, no ESO object. The Secret is the only thing delivered.
          assert_eq "no store, certificate or ESO object in the owner's namespace" "0" \
            "$(count_of secretstores.external-secrets.io,certificates.cert-manager.io,pushsecrets.external-secrets.io,externalsecrets.external-secrets.io "${TENANT_NS}")"
          assert_eq "no ServiceAccount besides default in the owner's namespace" "default" \
            "$(kubectl get serviceaccounts -n "${TENANT_NS}" -o jsonpath='{.items[*].metadata.name}')"
          assert_eq "the delivered Secret is the only labelled Secret there" "${CREDS_SECRET}" \
            "$(kubectl get secrets -n "${TENANT_NS}" -l c5c3.io/keystoneuser-name -o jsonpath='{.items[*].metadata.name}')"
          assert_eq "the order owns its Secret" "KeystoneUser/${ORDER}" \
            "$(kubectl get secret "${CREDS_SECRET}" -n "${TENANT_NS}" \
              -o jsonpath='{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}')"
          # Tested, never printed: both values are credentials.
          for k in password 'clouds\.yaml'; do
            if [ -z "$(secret_key "${CREDS_SECRET}" "${TENANT_NS}" "${k}")" ]; then
              echo "ERROR: the delivered Secret is missing key ${k}"; exit 1
            fi
          done
          # One capture, then a here-string, for the EPIPE reason run_verify_job
          # gives.
          CLOUDS_YAML="$(base64 -d <<<"$(secret_key "${CREDS_SECRET}" "${TENANT_NS}" 'clouds\.yaml')")"
          if grep -q project_name <<<"${CLOUDS_YAML}"; then
            echo "ERROR: the delivered clouds.yaml carries a project"; exit 1
          fi
          unset CLOUDS_YAML
          echo "OK: the Secret carries password and an unscoped clouds.yaml."

          run_verify_job "after delivery"
          assert_kv_live "${KV_PATH}" 120

          # ══ LEG 2 — an edited or deleted Secret comes back ════════════════
          kubectl patch secret "${CREDS_SECRET}" -n "${TENANT_NS}" --type merge -p '{"data":{"password":"Zm9v"}}'
          wait_delivered_password 1 120
          kubectl delete secret "${CREDS_SECRET}" -n "${TENANT_NS}"
          wait_delivered_password 1 120
          assert_eq "the re-created Secret is owned by the order" "KeystoneUser/${ORDER}" \
            "$(kubectl get secret "${CREDS_SECRET}" -n "${TENANT_NS}" \
              -o jsonpath='{.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}')"
          run_verify_job "after the repair"

          # ══ LEG 3 — raising passwordGeneration rotates ════════════════════
          V1_PASSWORD="$(secret_key "${CREDS_SECRET}" "${TENANT_NS}" password)"
          kubectl patch keystoneuser "${ORDER}" -n "${TENANT_NS}" --type merge -p '{"spec":{"passwordGeneration":2}}'
          GEN_DEADLINE=$(( $(date +%s) + 600 ))
          until [ "$(kubectl get keystoneuser "${ORDER}" -n "${TENANT_NS}" -o jsonpath='{.status.passwordGeneration}')" = "2" ]; do
            if [ "$(date +%s)" -ge "${GEN_DEADLINE}" ]; then
              echo "ERROR: status.passwordGeneration did not reach 2 within 600s"
              kubectl get keystoneuser "${ORDER}" -n "${TENANT_NS}" \
                -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}: {.message}){"\n"}{end}' 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          echo "OK: Keystone holds generation 2."
          wait_condition keystoneuser "${ORDER}" "${TENANT_NS}" Ready True 300
          wait_delivered_password 2 300
          if [ "$(secret_key "${CREDS_SECRET}" "${TENANT_NS}" password)" = "${V1_PASSWORD}" ]; then
            echo "ERROR: the rotation delivered the generation-1 password again"; exit 1
          fi
          # Nothing is delivered before the push of the new password, so the
          # backup already holds it; the poll only rides out a slow read.
          wait_kv_password "${KV_PATH}" 120
          wait_gone secret "${PREFIX}password-v1" "${CP_NS}" 300
          run_verify_job "after the rotation"

          # ══ LEG 4 — the pieces are refused without roles or consent ═══════
          for fixture in 04-keystoneproject-tenant.yaml 05-keystoneroleassignment-tenant.yaml \
            06-keystonecatalogentry-tenant.yaml; do
            sed -e "s|@TENANT_NS@|${TENANT_NS}|g" -e "s|@CP_NS@|${CP_NS}|g" "${fixture}" | kubectl apply -f -
          done
          wait_condition keystoneproject "${PROJECT}" "${TENANT_NS}" Ready True 300
          assert_nonempty "Keystone resolved the project id" \
            "$(kubectl get keystoneproject "${PROJECT}" -n "${TENANT_NS}" -o jsonpath='{.status.projectID}')"
          wait_reason keystoneroleassignment "${MEMBER}" "${TENANT_NS}" AssignmentReady RoleNotAllowed 300
          MEMBER_MESSAGE="$(condition_message keystoneroleassignment "${MEMBER}" "${TENANT_NS}" AssignmentReady)"
          if ! grep -qF '["member"]' <<<"${MEMBER_MESSAGE}" || ! grep -qF 'admits roles []' <<<"${MEMBER_MESSAGE}"; then
            echo "ERROR: the role refusal does not name the role and the empty allowlist: ${MEMBER_MESSAGE}"; exit 1
          fi
          wait_reason keystonecatalogentry "${DNS}" "${TENANT_NS}" CatalogReady CatalogNotAllowed 300
          if ! grep -q allowCatalogEntries <<<"$(condition_message keystonecatalogentry "${DNS}" "${TENANT_NS}" CatalogReady)"; then
            echo "ERROR: the catalog refusal does not name allowCatalogEntries"; exit 1
          fi
          assert_eq "the refused assignment projects nothing" "0" \
            "$(count_of "${PIECE_KINDS}" "${CP_NS}" "${MEMBER_SELECTOR}")"
          assert_eq "the refused catalog entry projects nothing" "0" \
            "$(count_of "${PIECE_KINDS}" "${CP_NS}" "${DNS_SELECTOR}")"

          # ══ LEG 5 — admitting the role and the catalog entry ══════════════
          kubectl patch controlplane "${CP_NAME}" -n "${CP_NS}" --type json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/namespaceAssignments/0\",\"value\":{\"namespace\":\"${TENANT_NS}\",\"allowedRoles\":[\"member\"],\"allowCatalogEntries\":true}}]"
          wait_condition keystoneroleassignment "${MEMBER}" "${TENANT_NS}" Ready True 600
          wait_condition keystonecatalogentry "${DNS}" "${TENANT_NS}" Ready True 600
          for field in roleID userID projectID; do
            assert_nonempty "the assignment reports its ${field}" \
              "$(kubectl get keystoneroleassignment "${MEMBER}" -n "${TENANT_NS}" -o "jsonpath={.status.${field}}")"
          done
          assert_nonempty "the catalog entry reports its service id" \
            "$(kubectl get keystonecatalogentry "${DNS}" -n "${TENANT_NS}" -o jsonpath='{.status.serviceID}')"
          assert_eq "the catalog entry reports two endpoint ids" "2" \
            "$(kubectl get keystonecatalogentry "${DNS}" -n "${TENANT_NS}" -o jsonpath='{.status.endpoints[*].id}' | wc -w | tr -d ' ')"
          assert_eq "one RoleAssignment carries the assignment's labels" "1" \
            "$(count_of roleassignments.openstack.k-orc.cloud "${CP_NS}" "${MEMBER_SELECTOR}")"
          assert_eq "one Service carries the entry's labels" "1" \
            "$(count_of services.openstack.k-orc.cloud "${CP_NS}" "${DNS_SELECTOR}")"
          assert_eq "two Endpoints carry the entry's labels" "2" \
            "$(count_of endpoints.openstack.k-orc.cloud "${CP_NS}" "${DNS_SELECTOR}")"
          run_scoped_verify_job "after the role is assigned"

          # A second order of the same tuple, and a second entry of the same row.
          DUP_SELECTOR="c5c3.io/keystoneroleassignment-name=workflow-member-dup,c5c3.io/keystoneroleassignment-namespace=${TENANT_NS}"
          COLLISION_SELECTOR="c5c3.io/keystonecatalogentry-name=workflow-dns-dup,c5c3.io/keystonecatalogentry-namespace=${TENANT_NS}"
          sed -e "s|@TENANT_NS@|${TENANT_NS}|g" -e "s|@CP_NS@|${CP_NS}|g" \
            08-keystoneroleassignment-duplicate.yaml | kubectl apply -f -
          wait_reason keystoneroleassignment workflow-member-dup "${TENANT_NS}" AssignmentReady DuplicateRoleAssignment 120
          if ! grep -q "\"${MEMBER}\"" <<<"$(condition_message keystoneroleassignment workflow-member-dup "${TENANT_NS}" AssignmentReady)"; then
            echo "ERROR: the duplicate refusal does not name ${MEMBER}"; exit 1
          fi
          assert_eq "the duplicate projects no Role or RoleAssignment" "0" \
            "$(count_of roles.openstack.k-orc.cloud,roleassignments.openstack.k-orc.cloud "${CP_NS}" "${DUP_SELECTOR}")"
          sed -e "s|@TENANT_NS@|${TENANT_NS}|g" -e "s|@CP_NS@|${CP_NS}|g" \
            09-keystonecatalogentry-collision.yaml | kubectl apply -f -
          wait_reason keystonecatalogentry workflow-dns-dup "${TENANT_NS}" CatalogReady ServiceCollision 300
          assert_eq "the colliding entry registers no Service" "0" "$(managed_services "${COLLISION_SELECTOR}")"
          kubectl delete keystoneroleassignment workflow-member-dup -n "${TENANT_NS}" --wait=false
          kubectl delete keystonecatalogentry workflow-dns-dup -n "${TENANT_NS}" --wait=false
          wait_gone keystoneroleassignment workflow-member-dup "${TENANT_NS}" 120
          wait_gone keystonecatalogentry workflow-dns-dup "${TENANT_NS}" 120
          echo "OK: a duplicate assignment and a colliding catalog entry are refused and leave nothing behind."

          # ══ LEG 6 — taking the role or the catalog consent away freezes ═══
          kubectl patch controlplane "${CP_NAME}" -n "${CP_NS}" --type json \
            -p '[{"op":"replace","path":"/spec/namespaceAssignments/0/allowedRoles","value":[]}]'
          wait_reason keystoneroleassignment "${MEMBER}" "${TENANT_NS}" AssignmentReady RoleNotAllowed 300
          assert_eq "the RoleAssignment stays while the role is off the list" "1" \
            "$(count_of roleassignments.openstack.k-orc.cloud "${CP_NS}" "${MEMBER_SELECTOR}")"
          run_scoped_verify_job "with the role frozen"
          kubectl patch controlplane "${CP_NAME}" -n "${CP_NS}" --type json \
            -p '[{"op":"replace","path":"/spec/namespaceAssignments/0/allowCatalogEntries","value":false}]'
          wait_reason keystonecatalogentry "${DNS}" "${TENANT_NS}" CatalogReady CatalogNotAllowed 300
          assert_eq "the Service stays while the catalog consent is cleared" "1" \
            "$(count_of services.openstack.k-orc.cloud "${CP_NS}" "${DNS_SELECTOR}")"
          FULL_ENTRY="{\"namespace\":\"${TENANT_NS}\",\"allowedRoles\":[\"member\"],\"allowCatalogEntries\":true}"
          kubectl patch controlplane "${CP_NAME}" -n "${CP_NS}" --type json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/namespaceAssignments/0\",\"value\":${FULL_ENTRY}}]"
          wait_condition keystoneroleassignment "${MEMBER}" "${TENANT_NS}" Ready True 300
          wait_condition keystonecatalogentry "${DNS}" "${TENANT_NS}" Ready True 300
          echo "OK: the frozen pieces revoked nothing and recovered."

          # ══ LEG 7 — an unassigned namespace is refused ════════════════════
          sed -e "s|@OUTSIDER_NS@|${OUTSIDER_NS}|g" -e "s|@CP_NS@|${CP_NS}|g" \
            02-keystoneuser-outsider.yaml | kubectl apply -f -
          wait_condition keystoneuser "${OUTSIDER}" "${OUTSIDER_NS}" Ready False 300
          for ctype in UserReady DeliveryReady; do
            wait_reason keystoneuser "${OUTSIDER}" "${OUTSIDER_NS}" "${ctype}" NamespaceNotAssigned 300
          done
          # The condition has to say what to edit.
          if ! grep -q "spec.namespaceAssignments" \
               <<<"$(condition_message keystoneuser "${OUTSIDER}" "${OUTSIDER_NS}" UserReady)"; then
            echo "ERROR: the refusal message does not name the field that assigns the namespace"; exit 1
          fi
          assert_nothing_created() { # <when>
            assert_eq "nothing in the plane's namespace for the refused order ($1)" "0" \
              "$(count_of "${CHILD_KINDS}" "${CP_NS}" "${OUTSIDER_SELECTOR}")"
            assert_eq "no Secret delivered for the refused order ($1)" "0" \
              "$(count_of secrets "${OUTSIDER_NS}" c5c3.io/keystoneuser-name)"
            echo "OK: the refused order created nothing ($1)."
          }
          assert_nothing_created "immediately"
          # The settle separates "refused" from "slow".
          sleep 30
          assert_nothing_created "after a settle"

          # ══ LEG 8 — withdrawing the assignment freezes the orders ═════════
          kubectl patch controlplane "${CP_NAME}" -n "${CP_NS}" --type merge \
            -p '{"spec":{"namespaceAssignments":null}}'
          for ctype in UserReady DeliveryReady; do
            wait_reason keystoneuser "${ORDER}" "${TENANT_NS}" "${ctype}" NamespaceNotAssigned 300
          done
          wait_reason keystoneproject "${PROJECT}" "${TENANT_NS}" ProjectReady NamespaceNotAssigned 300
          wait_reason keystoneroleassignment "${MEMBER}" "${TENANT_NS}" AssignmentReady NamespaceNotAssigned 300
          wait_reason keystonecatalogentry "${DNS}" "${TENANT_NS}" CatalogReady NamespaceNotAssigned 300
          kubectl get secret "${CREDS_SECRET}" -n "${TENANT_NS}" >/dev/null
          assert_eq "the Keystone user stays while the order is frozen" "1" \
            "$(count_of users.openstack.k-orc.cloud "${CP_NS}" "${ORDER_SELECTOR}")"
          assert_eq "the project stays while the order is frozen" "1" \
            "$(count_of projects.openstack.k-orc.cloud "${CP_NS}" "${PROJECT_SELECTOR}")"
          assert_eq "the RoleAssignment stays while the order is frozen" "1" \
            "$(count_of roleassignments.openstack.k-orc.cloud "${CP_NS}" "${MEMBER_SELECTOR}")"
          assert_eq "the catalog rows stay while the order is frozen" "3" \
            "$(count_of services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud "${CP_NS}" "${DNS_SELECTOR}")"
          kubectl patch secret "${CREDS_SECRET}" -n "${TENANT_NS}" --type merge -p '{"data":{"password":"Zm9v"}}'
          sleep 90
          assert_eq "a frozen order does not repair its Secret" "Zm9v" \
            "$(secret_key "${CREDS_SECRET}" "${TENANT_NS}" password)"
          echo "OK: withdrawing the assignment froze the order and revoked nothing."

          kubectl patch controlplane "${CP_NAME}" -n "${CP_NS}" --type merge \
            -p "{\"spec\":{\"namespaceAssignments\":[${FULL_ENTRY}]}}"
          wait_condition keystoneuser "${ORDER}" "${TENANT_NS}" Ready True 300
          wait_delivered_password 2 120
          wait_condition keystoneproject "${PROJECT}" "${TENANT_NS}" Ready True 300
          wait_condition keystoneroleassignment "${MEMBER}" "${TENANT_NS}" Ready True 300
          wait_condition keystonecatalogentry "${DNS}" "${TENANT_NS}" Ready True 300
          echo "OK: restoring the assignment recovered the orders."

          # ══ LEG 9 — deleting the orders tears them down ═══════════════════
          kubectl delete job workflow-verify workflow-scoped-verify -n "${TENANT_NS}" --ignore-not-found
          kubectl delete keystoneuser "${OUTSIDER}" -n "${OUTSIDER_NS}"
          wait_gone keystoneuser "${OUTSIDER}" "${OUTSIDER_NS}" 300

          # The user goes first and holds: the assignment still references it.
          kubectl delete keystoneuser "${ORDER}" -n "${TENANT_NS}" --wait=false
          wait_reason keystoneuser "${ORDER}" "${TENANT_NS}" UserReady ReferencedByRoleAssignments 120
          if ! grep -q "\"${MEMBER}\"" <<<"$(condition_message keystoneuser "${ORDER}" "${TENANT_NS}" UserReady)"; then
            echo "ERROR: the hold does not name ${MEMBER}"; exit 1
          fi
          kubectl get keystoneuser "${ORDER}" -n "${TENANT_NS}" >/dev/null
          assert_eq "the held user's Keystone user stays" "1" \
            "$(count_of users.openstack.k-orc.cloud "${CP_NS}" "${ORDER_SELECTOR}")"

          # K-ORC unassigns the role before the assignment's finalizer goes.
          kubectl delete keystoneroleassignment "${MEMBER}" -n "${TENANT_NS}" --wait=false
          wait_gone keystoneroleassignment "${MEMBER}" "${TENANT_NS}" 300
          assert_eq "no Role or RoleAssignment carries the assignment's labels" "0" \
            "$(count_of roles.openstack.k-orc.cloud,roleassignments.openstack.k-orc.cloud "${CP_NS}" "${MEMBER_SELECTOR}")"

          # K-ORC deletes the Keystone user and ESO the OpenBao path before the
          # finalizer is released, so this is the slow delete.
          wait_gone keystoneuser "${ORDER}" "${TENANT_NS}" 600
          assert_absent secret "${CREDS_SECRET}" "${TENANT_NS}"
          assert_eq "every child in the plane's namespace went with the order" "0" \
            "$(count_of "${CHILD_KINDS}" "${CP_NS}" "${ORDER_SELECTOR}")"
          wait_kv_purged "${KV_PATH}" 120 "the order left"
          echo "OK: the order's teardown reached Keystone, the Secret and OpenBao."

          kubectl delete keystonecatalogentry "${DNS}" -n "${TENANT_NS}" --wait=false
          kubectl delete keystoneproject "${PROJECT}" -n "${TENANT_NS}" --wait=false
          wait_gone keystonecatalogentry "${DNS}" "${TENANT_NS}" 300
          wait_gone keystoneproject "${PROJECT}" "${TENANT_NS}" 300
          assert_eq "no catalog row or Region import carries the entry's labels" "0" \
            "$(count_of services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud,regions.openstack.k-orc.cloud "${CP_NS}" "${DNS_SELECTOR}")"
          assert_eq "no Project carries the project's labels" "0" \
            "$(count_of projects.openstack.k-orc.cloud "${CP_NS}" "${PROJECT_SELECTOR}")"
          echo "OK: the project and the catalog entry went with their orders."

          # The plane goes down through its own finalizer, in the order the
          # foreign-namespace suite documents and checks.
          CP_KORC_RESIDUE="users.openstack.k-orc.cloud,projects.openstack.k-orc.cloud,roles.openstack.k-orc.cloud,roleassignments.openstack.k-orc.cloud,services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud,regions.openstack.k-orc.cloud,domains.openstack.k-orc.cloud,applicationcredentials.openstack.k-orc.cloud"
          kubectl delete controlplane "${CP_NAME}" -n "${CP_NS}" --wait=false
          DRAIN_DEADLINE=$(( $(date +%s) + 300 ))
          while [ "$(count_of "${CP_KORC_RESIDUE}" "${CP_NS}")" != "0" ]; do
            if [ "$(date +%s)" -ge "${DRAIN_DEADLINE}" ]; then
              echo "ERROR: the plane's K-ORC children did not drain within 300s of its deletion"
              kubectl get "${CP_KORC_RESIDUE}" -n "${CP_NS}" 2>&1 || true
              exit 1
            fi
            sleep 5
          done
          echo "OK: the plane's own K-ORC children drained against a live Keystone."
          kubectl wait --for=delete "controlplane/${CP_NAME}" -n "${CP_NS}" --timeout=10m
          assert_absent keystone "${CP_NAME}-keystone" "${CP_NS}"
          assert_no_event OpenBaoCleanupStalled "${CP_NS}"
          assert_no_event KeystoneTeardownStalled "${CP_NS}"
          kubectl delete namespace "${TENANT_NS}" "${OUTSIDER_NS}" --wait=false || true
          echo "OK: the Keystone orders proven end to end."
    catch:
    - script:
        # Pinned, because chainsaw applies the test's exec budget to every
        # script operation; a dump against a wedged apiserver must not inherit
        # 50m.
        timeout: 5m
        shell: bash
        content: |
          # A separate shell from the try script, so everything is re-derived.
          TENANT_NS="${NAMESPACE}-tenant"
          OUTSIDER_NS="${NAMESPACE}-outsider"
          echo "=== ControlPlane conditions ==="
          kubectl get controlplane cp -n "${NAMESPACE}" \
            -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}: {.message}){"\n"}{end}' 2>&1 || true
          echo "=== Orders ==="
          kubectl get keystoneuser,keystoneproject,keystoneroleassignment,keystonecatalogentry -A -o yaml 2>&1 || true
          echo "=== Order children in the plane's namespace ==="
          kubectl get users.openstack.k-orc.cloud,pushsecrets.external-secrets.io,secrets \
            -n "${NAMESPACE}" -l c5c3.io/keystoneuser-name -o wide 2>&1 || true
          for label in c5c3.io/keystoneproject-name c5c3.io/keystoneroleassignment-name c5c3.io/keystonecatalogentry-name; do
            kubectl get projects.openstack.k-orc.cloud,roles.openstack.k-orc.cloud,roleassignments.openstack.k-orc.cloud,services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud,regions.openstack.k-orc.cloud \
              -n "${NAMESPACE}" -l "${label}" \
              -o jsonpath='{range .items[*]}{.kind}/{.metadata.name}: {range .status.conditions[*]}{.type}={.status} ({.message}) {end}{"\n"}{end}' 2>&1 || true
          done
          kubectl get pushsecrets.external-secrets.io -n "${NAMESPACE}" -l c5c3.io/keystoneuser-name \
            -o jsonpath='{range .items[*]}{.metadata.name}: {range .status.conditions[*]}{.type}={.status} ({.message}) {end}{"\n"}{end}' 2>&1 || true
          echo "=== The order namespaces ==="
          for ns in "${TENANT_NS}" "${OUTSIDER_NS}"; do
            echo "--- ${ns} ---"
            kubectl get secretstore,serviceaccount,certificate,externalsecret,pushsecret,secret,job -n "${ns}" 2>&1 || true
          done
          echo "=== Verify Jobs ==="
          kubectl logs -n "${TENANT_NS}" job/workflow-verify --tail=100 2>&1 || true
          kubectl logs -n "${TENANT_NS}" job/workflow-scoped-verify --tail=100 2>&1 || true
          echo "=== c5c3-operator ==="
          OPERATOR_NS="$(kubectl get pods -A -l app.kubernetes.io/name=c5c3-operator \
            -o 'jsonpath={.items[0].metadata.namespace}' 2>/dev/null || true)"
          kubectl logs -n "${OPERATOR_NS:-c5c3-system}" -l app.kubernetes.io/name=c5c3-operator --tail=150 --all-containers 2>&1 || true
          echo "=== K-ORC controller ==="
          kubectl logs -n orc-system deploy/orc-controller-manager --pod-running-timeout=5s --tail=100 --all-containers 2>&1 || true
          echo "=== external-secrets ==="
          kubectl logs -n external-secrets -l app.kubernetes.io/name=external-secrets --tail=100 --all-containers 2>&1 || true
          echo "=== Events ==="
          for ns in "${NAMESPACE}" "${TENANT_NS}" "${OUTSIDER_NS}"; do
            echo "--- ${ns} ---"
            kubectl get events -n "${ns}" --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
          done
    finally:
    - script:
        # Pinned for the same reason as catch above. The waits below are bounded
        # and add up to 1110s; 20m covers them plus the deletes that drive them,
        # and keeps the suite's ceiling at exec + catch + finally + cleanup =
        # 90m, which is the number .github/workflows/ci.yaml budgets against.
        timeout: 20m
        shell: bash
        content: |
          # When the try block reached its own teardown every delete below is a
          # no-op. When it died early this is the only teardown there is, and the
          # order matters for the reason the foreign-namespace suite gives: the
          # orders first, while Keystone and the plane's store still serve the
          # calls their finalizers make, then the plane, then the two namespaces
          # this suite created itself. The pieces go before the user, the
          # assignment first, because a user or project an assignment references
          # holds its deletion. Every wait is bounded and best-effort.
          TENANT_NS="${NAMESPACE}-tenant"
          OUTSIDER_NS="${NAMESPACE}-outsider"
          gone_within() { # <resource> <name> <namespace> <timeoutSeconds>
            local deadline
            deadline=$(( $(date +%s) + $4 ))
            while kubectl get "$1" "$2" -n "$3" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "WARN: $1/$2 in $3 still present after $4s; leaving it to chainsaw cleanup"
                return 1
              fi
              sleep 5
            done
            return 0
          }
          # The root token the try block staged in openbao-0 goes with the
          # suite; the pod is shared with the other suites on this job.
          kubectl exec -n shared-services openbao-0 -- \
            rm -f /tmp/.bao-token 2>&1 || true
          kubectl delete job workflow-verify workflow-scoped-verify -n "${TENANT_NS}" --ignore-not-found --wait=false 2>&1 || true

          for ra in workflow-member workflow-member-dup; do
            kubectl delete keystoneroleassignment "${ra}" -n "${TENANT_NS}" --ignore-not-found --wait=false 2>&1 || true
          done
          gone_within keystoneroleassignment workflow-member "${TENANT_NS}" 90 || true
          gone_within keystoneroleassignment workflow-member-dup "${TENANT_NS}" 30 || true
          for entry in workflow-dns workflow-dns-dup; do
            kubectl delete keystonecatalogentry "${entry}" -n "${TENANT_NS}" --ignore-not-found --wait=false 2>&1 || true
          done
          gone_within keystonecatalogentry workflow-dns "${TENANT_NS}" 90 || true
          gone_within keystonecatalogentry workflow-dns-dup "${TENANT_NS}" 30 || true
          kubectl delete keystoneproject workflow-project -n "${TENANT_NS}" --ignore-not-found --wait=false 2>&1 || true
          gone_within keystoneproject workflow-project "${TENANT_NS}" 90 || true

          kubectl delete keystoneuser workflow -n "${TENANT_NS}" --ignore-not-found --wait=false 2>&1 || true
          kubectl delete keystoneuser outsider -n "${OUTSIDER_NS}" --ignore-not-found --wait=false 2>&1 || true
          gone_within keystoneuser workflow "${TENANT_NS}" 120 || true
          # The refused one created nothing, so it has nothing to hand back.
          gone_within keystoneuser outsider "${OUTSIDER_NS}" 60 || true

          kubectl delete controlplane cp -n "${NAMESPACE}" --ignore-not-found --wait=false 2>&1 || true
          CP_KORC_RESIDUE="users.openstack.k-orc.cloud,projects.openstack.k-orc.cloud,roles.openstack.k-orc.cloud,roleassignments.openstack.k-orc.cloud,services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud,regions.openstack.k-orc.cloud,domains.openstack.k-orc.cloud,applicationcredentials.openstack.k-orc.cloud"
          DRAIN_DEADLINE=$(( $(date +%s) + 240 ))
          while [ "$(kubectl get "${CP_KORC_RESIDUE}" -n "${NAMESPACE}" --no-headers 2>/dev/null | grep -c .)" != "0" ]; do
            if [ "$(date +%s)" -ge "${DRAIN_DEADLINE}" ]; then
              echo "WARN: K-ORC residue still present after 240s; leaving it to the stall breakers"
              break
            fi
            sleep 5
          done
          kubectl delete keystone cp-keystone -n "${NAMESPACE}" --ignore-not-found --wait=false 2>&1 || true
          gone_within keystone cp-keystone "${NAMESPACE}" 120 || true

          gone_within controlplane cp "${NAMESPACE}" 240 || true

          kubectl delete namespace "${TENANT_NS}" "${OUTSIDER_NS}" --ignore-not-found --wait=false 2>&1 || true
