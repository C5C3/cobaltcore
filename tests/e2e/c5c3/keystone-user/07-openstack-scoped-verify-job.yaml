# Proves the role assignment from inside the owner's namespace: the delivered
# clouds.yaml is unscoped, and OS_PROJECT_NAME with OS_PROJECT_DOMAIN_NAME
# scope the token to the ordered project. `token issue` fails unless the user
# holds a role there, and `catalog show dns` reads the catalog entry the order
# registered out of the scoped token's catalog.
#
# @DOMAIN@ is substituted by the test with the project's status.domainName.
# The image and pull policy are the 03- Job's, for the reason it gives.
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-scoped-verify
  namespace: "@TENANT_NS@"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: osc
        image: ghcr.io/c5c3/tempest:2026.1
        imagePullPolicy: IfNotPresent
        env:
        - name: OS_CLIENT_CONFIG_FILE
          value: /etc/openstack/clouds.yaml
        - name: OS_PROJECT_NAME
          value: workflow-project
        - name: OS_PROJECT_DOMAIN_NAME
          value: "@DOMAIN@"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "== openstack --os-cloud admin token issue =="
          openstack --os-cloud admin token issue
          echo "== openstack --os-cloud admin catalog show dns =="
          openstack --os-cloud admin catalog show dns -f value -c endpoints
          echo "OK: the delivered credentials scope to the ordered project"
        volumeMounts:
        - name: clouds
          mountPath: /etc/openstack
          readOnly: true
      volumes:
      - name: clouds
        secret:
          secretName: workflow-credentials
