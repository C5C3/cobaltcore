# A second order of the tuple workflow-member assigns: the same user, project
# and role. It is the younger of the two, so it reports
# DuplicateRoleAssignment naming workflow-member and projects nothing.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: workflow-member-dup
  namespace: "@TENANT_NS@"
spec:
  controlPlaneRef:
    name: cp
    namespace: "@CP_NS@"
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  role: member
