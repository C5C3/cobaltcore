# Proves the delivered credentials are the live ones, from inside the namespace
# they were delivered to: `token issue` fails unless the password in the Secret
# is the one K-ORC applied to the Keystone user. The ordered user has no project
# and no role, so the token is unscoped and the Job makes no catalog call.
#
# The image is pinned to the tag the e2e-controlplane job loads into kind, with
# IfNotPresent so it uses that copy rather than pulling from GHCR. The test
# script applies the Job, waits for it, and deletes it again before the next
# run.
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-verify
  namespace: "@TENANT_NS@"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: osc
        image: ghcr.io/c5c3/tempest:2025.2
        imagePullPolicy: IfNotPresent
        env:
        - name: OS_CLIENT_CONFIG_FILE
          value: /etc/openstack/clouds.yaml
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "== openstack --os-cloud admin token issue =="
          openstack --os-cloud admin token issue
          echo "OK: the delivered credentials authenticate"
        volumeMounts:
        - name: clouds
          mountPath: /etc/openstack
          readOnly: true
      volumes:
      - name: clouds
        secret:
          secretName: workflow-credentials
