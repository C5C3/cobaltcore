# The order under test: a Keystone user ordered from the assigned namespace.
#
# userName is left to default to metadata.name ("workflow"), passwordGeneration
# to 1 and spec.rotation to the 720h schedule; the suite raises the generation
# to 2 and lets the schedule rotate it to 3.
# controlPlaneRef names the plane's namespace explicitly, because the order
# lives in another one.
#
# The orders guide (docs/guides/order-resources-from-a-controlplane.md) imports the
# region below.
# region keystoneuser-workflow
apiVersion: c5c3.io/v1alpha1
kind: KeystoneUser
metadata:
  name: workflow
  namespace: "@TENANT_NS@"
spec:
  controlPlaneRef:
    name: cp
    namespace: "@CP_NS@"
# endregion keystoneuser-workflow
