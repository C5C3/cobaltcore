# An application credential for the ordered user "workflow" on the ordered
# project "workflow-project". The operator mints it as the user, which needs
# the role the assignment "workflow-member" gives the user on the project, so
# the suite sees the order refused before the role is admitted.
#
# The schedule is shortened from the 720h default to a 3m interval and a 2m
# grace period, so the suite observes a scheduled rotation, a login with the
# superseded credential inside the grace period and the end of the grace
# period within its budget. Two minutes leave room for the verify Job to run
# between the switch and the end of the grace period.
#
# The orders guide (docs/guides/order-resources-from-a-controlplane.md) imports the
# region below.
# region keystoneapplicationcredential-workflow-appcred
apiVersion: c5c3.io/v1alpha1
kind: KeystoneApplicationCredential
metadata:
  name: workflow-appcred
  namespace: "@TENANT_NS@"
spec:
  controlPlaneRef:
    name: cp
    namespace: "@CP_NS@"
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  rotation:
    interval: 3m
    gracePeriod: 2m
# endregion keystoneapplicationcredential-workflow-appcred
