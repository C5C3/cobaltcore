# OpenStack client verification Job for the full-controlplane-keystone E2E test
# (Link 7b). It authenticates with the materialised admin
# clouds.yaml (the minted, OpenBao-round-tripped application credential
# delivered to the per-CR k-orc-clouds-yaml Secret by the credential chain) and
# runs `openstack token issue` + `openstack catalog list` to prove the
# credential actually works end-to-end and that the identity, image, placement,
# key-manager, network, and block-storage services are catalogued. It also lists
# the role assignments of the INJECTED "glance", "placement", "barbican",
# "neutron", "cinder", "nova" and "neutron-nova" service accounts and greps for
# the "service" role (and for "admin" on cinder, nova and neutron-nova, while
# "neutron" must hold service alone), proving the RoleAssignments landed in
# Keystone. It uploads a real image through the projected Glance endpoint
# into the Garage S3 backend, waits for it to reach "active", and deletes it
# (proving the image service works end-to-end rather than only being
# catalogued), lists the placement resource classes through the projected
# Placement endpoint for the same reason, stores a secret through the projected
# Barbican endpoint, reads its payload back and compares it byte for byte
# against the stored literal, and creates, shows and deletes a network through
# the projected Neutron endpoint. Through the projected Cinder endpoint it runs
# four more round-trips: a volume on the NFS backend, a backup created, restored
# into that volume and deleted, an encrypted volume type whose LUKS key is
# counted into and back out of Barbican, and two creates from the same image
# where the second one has to be served by the image-volume cache. Through the
# projected Nova endpoint it then boots one server: it checks that the fake
# compute reports up, creates a flavor, a 1 MiB image, a network and a subnet,
# waits for the server to reach ACTIVE on that compute, checks the port it
# carries is bound on the same host with vif_type ovs, signs a metadata request
# with the ControlPlane-generated shared secret and compares the 200 it answers
# against the 403 a wrong signature gets, and deletes what it made. It also reads
# the RegionOne description back and compares it against the literal the
# ControlPlane's `spec.regionDescription` sets.
#
# the orc-system copy of k-orc-clouds-yaml was removed; the
# operator now materialises the per-CR k-orc-clouds-yaml Secret ONLY into the
# ControlPlane namespace (openstack). This Job therefore runs in the
# ControlPlane namespace `openstack` and mounts the operator-owned per-CR
# k-orc-clouds-yaml Secret materialised there. Applied by the chainsaw script
# via `kubectl apply -f` after the chain has converged, and deleted in the
# test's `finally` block.
#
# DECISION image is the repo's own tempest image, which bundles the
# OpenStack client. The e2e-controlplane CI job loads ghcr.io/c5c3/tempest:2025.2
# into kind (the tag CI builds — there is no :latest), so the image is pinned to
# that tag with imagePullPolicy: IfNotPresent to use the kind-loaded copy rather
# than pulling from GHCR. The `openstack secret` subcommands come from the
# python-barbicanclient plugin the same image bundles, and the `openstack
# volume` subcommands from the python-cinderclient it pulls in with
# python-openstackclient. Behind the chainsaw presence guard the verify step
# never runs on a cluster that lacks the stack.
# The `admin` cloud entry name is the cloudName K-ORC writes into the clouds.yaml
# (spec.korc.adminCredential in 00-controlplane-cr.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: cp-openstack-verify
  namespace: openstack
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: osc
          image: ghcr.io/c5c3/tempest:2025.2
          imagePullPolicy: IfNotPresent
          env:
            - name: OS_CLIENT_CONFIG_FILE
              value: /etc/openstack/clouds.yaml
            # The metadata shared secret the ControlPlane generated for its own
            # compute service. The Job signs its metadata request with it, which
            # is the only way to prove the generated value reached the Nova side:
            # a metadata API that was configured with no secret at all answers
            # the same 200 to an unsigned request, and one configured with a
            # different value answers 403 to this signature.
            - name: METADATA_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: controlplane-keystone-nova-metadata-secret
                  key: shared_secret
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "== openstack --os-cloud admin token issue =="
              openstack --os-cloud admin token issue
              echo "== openstack --os-cloud admin catalog list =="
              openstack --os-cloud admin catalog list
              echo "== image service catalogued =="
              openstack --os-cloud admin catalog list | grep -qi image
              echo "== placement service catalogued =="
              openstack --os-cloud admin catalog list | grep -qi placement
              echo "== key-manager service catalogued =="
              openstack --os-cloud admin catalog list | grep -qi key-manager
              echo "== network service catalogued =="
              openstack --os-cloud admin catalog list | grep -qi network
              echo "== block-storage service catalogued =="
              openstack --os-cloud admin catalog list | grep -qi block-storage
              echo "== region description round-trip =="
              DESC="$(openstack --os-cloud admin region show RegionOne -f value -c description)"
              test "${DESC}" = "CobaltCore e2e region" || { echo "ERROR: region description '${DESC}' != 'CobaltCore e2e region'"; exit 1; }
              echo "OK: region description round-trip"
              echo "== openstack --os-cloud admin role assignment list --names --user glance =="
              openstack --os-cloud admin role assignment list --names --user glance
              openstack --os-cloud admin role assignment list --user glance --names -f value -c Role | grep -qx service
              echo "== openstack --os-cloud admin role assignment list --names --user placement =="
              openstack --os-cloud admin role assignment list --names --user placement
              openstack --os-cloud admin role assignment list --user placement --names -f value -c Role | grep -qx service
              echo "== openstack --os-cloud admin role assignment list --names --user barbican =="
              openstack --os-cloud admin role assignment list --names --user barbican
              openstack --os-cloud admin role assignment list --user barbican --names -f value -c Role | grep -qx service
              echo "== openstack --os-cloud admin role assignment list --names --user neutron =="
              openstack --os-cloud admin role assignment list --names --user neutron
              openstack --os-cloud admin role assignment list --user neutron --names -f value -c Role | grep -qx service
              # The network service's OWN account holds service alone. The admin
              # reach its port notifier needs belongs to the separate neutron-nova
              # user below, so an admin row here would widen every neutron API
              # call the service makes on its own behalf.
              if openstack --os-cloud admin role assignment list --user neutron --names -f value -c Role | grep -qx admin; then
                echo "ERROR: the neutron service account holds admin; only its neutron-nova notifier may"
                exit 1
              fi
              echo "== openstack --os-cloud admin role assignment list --names --user cinder =="
              openstack --os-cloud admin role assignment list --names --user cinder
              # Cinder takes a second role: it deletes the Barbican secret of an
              # encrypted volume as a fallback when the volume's owner cannot,
              # which Barbican's secure-RBAC defaults put behind admin. Both rows
              # are asserted, so dropping either one fails.
              openstack --os-cloud admin role assignment list --user cinder --names -f value -c Role | grep -qx service
              openstack --os-cloud admin role assignment list --user cinder --names -f value -c Role | grep -qx admin
              echo "== openstack --os-cloud admin role assignment list --names --user nova =="
              openstack --os-cloud admin role assignment list --names --user nova
              # Nova holds admin for the mirror of cinder's reason: it calls the
              # block-storage API as its own service user in admin contexts,
              # where it carries no user token, and cinder refuses a caller
              # holding service alone on a volume that belongs to a user.
              openstack --os-cloud admin role assignment list --user nova --names -f value -c Role | grep -qx service
              openstack --os-cloud admin role assignment list --user nova --names -f value -c Role | grep -qx admin
              echo "== openstack --os-cloud admin role assignment list --names --user neutron-nova =="
              openstack --os-cloud admin role assignment list --names --user neutron-nova
              # The port notifier's account, provisioned by the second
              # registration the network service takes. Nova looks the instance
              # behind a notified port up with the caller's own context,
              # unelevated, so an account holding service alone has every
              # network-changed event answered 404 and leaves the port in BUILD.
              openstack --os-cloud admin role assignment list --user neutron-nova --names -f value -c Role | grep -qx service
              openstack --os-cloud admin role assignment list --user neutron-nova --names -f value -c Role | grep -qx admin
              echo "== image upload round-trip =="
              # The projected K-ORC catalog rows carry no region — K-ORC's
              # EndpointResourceSpec has no region field — while the mounted
              # clouds.yaml pins region_name (RegionOne by default), so a
              # region-scoped lookup finds no image endpoint at all ("internal
              # endpoint for image service in RegionOne region not found"). The
              # image commands therefore run against a copy of the document with
              # the region_name line stripped; an empty --os-region-name or
              # OS_REGION_NAME override is DROPPED by osc-lib's config merge, so
              # the stripped copy is the only way to clear the filter. Interface
              # resolution (endpoint_type: internal) still selects the projected
              # internal endpoint, and identity is unaffected: keystone-manage
              # bootstrap registers its own RegionOne identity rows.
              grep -v 'region_name' /etc/openstack/clouds.yaml > /tmp/clouds-noregion.yaml
              dd if=/dev/urandom of=/tmp/e2e.img bs=1024 count=1
              OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin image create --disk-format raw --container-format bare --file /tmp/e2e.img e2e-upload
              STATUS="$(OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin image show e2e-upload -f value -c status)"
              test "${STATUS}" = "active" || { echo "ERROR: uploaded image status '${STATUS}' != active"; exit 1; }
              OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin image delete e2e-upload
              echo "OK: image uploaded to the projected endpoint, reached active, and was deleted"
              echo "== placement API round-trip =="
              # The projected placement catalog rows carry no region either — the
              # same K-ORC constraint documented above — so the osc-placement
              # commands run against the region-stripped copy too. `resource class
              # list` is a read-only call through the projected Placement endpoint:
              # it proves the API answers an authenticated request, not just that
              # the endpoint is catalogued.
              OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin resource class list
              echo "OK: placement answered a resource-class listing through the projected endpoint"
              echo "== barbican secret round-trip =="
              # Store a secret and read its payload back. This is the only check
              # that spans the whole key-manager chain: the catalog entry resolves
              # the endpoint, Barbican validates the token against Keystone, and the
              # payload travels through the vault plugin into the dedicated OpenBao
              # instance and back out. Catalogue-only checks miss every step after
              # the first. The key-manager rows carry no region either, so this runs
              # against the region-stripped copy for the reason documented above.
              SECRET_PAYLOAD='c5c3-e2e-barbican-payload'
              SECRET_HREF="$(OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin secret store --name e2e-roundtrip --payload "${SECRET_PAYLOAD}" -f value -c 'Secret href')"
              test -n "${SECRET_HREF}" || { echo "ERROR: secret store returned no href"; exit 1; }
              RETRIEVED="$(OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin secret get -p "${SECRET_HREF}" -f value -c Payload)"
              test "${RETRIEVED}" = "${SECRET_PAYLOAD}" || { echo "ERROR: retrieved payload '${RETRIEVED}' != stored payload '${SECRET_PAYLOAD}'"; exit 1; }
              OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin secret delete "${SECRET_HREF}"
              echo "OK: secret round-trip payload matches the stored literal, and the secret was deleted"
              echo "== network round-trip =="
              # The D8 CRUD check for the network service, driven through the
              # ControlPlane's own admin credential rather than a Tempest
              # identity. cp-verify-net is a pure-OVN LOGICAL network: northd
              # runs in the referenced OVNCentral and writes it into the
              # Northbound database, so no chassis has to be bound for the
              # create to reach ACTIVE. The network rows carry no region either,
              # so this runs against the region-stripped copy for the reason
              # documented above.
              OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin network create cp-verify-net
              NET_STATUS="$(OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin network show cp-verify-net -f value -c status)"
              test "${NET_STATUS}" = "ACTIVE" || { echo "ERROR: created network status '${NET_STATUS}' != ACTIVE"; exit 1; }
              OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin network delete cp-verify-net
              echo "OK: network round-trip created, showed ACTIVE, and deleted cp-verify-net"
              echo "== block-storage round-trips =="
              # The D8 CRUD checks for the block-storage service, driven through
              # the ControlPlane's own admin credential like the network one
              # above. The block-storage rows carry no region either, so every
              # call in this section goes through one wrapper over the
              # region-stripped copy.
              osc() { OS_CLIENT_CONFIG_FILE=/tmp/clouds-noregion.yaml openstack --os-cloud admin "$@"; }
              # wait_status <kind> <name> <want> <timeoutSeconds>: poll one
              # object's status every 5s, and print the last status seen when the
              # deadline passes. Cinder answers a create before the volume exists
              # on the backend, so every create here is followed by one of these.
              # The kind is one word ("volume", "image") or two ("volume backup"),
              # and is left unquoted so both reach the command line as written.
              wait_status() {
                ws_deadline=$(( $(date +%s) + $4 ))
                while true; do
                  ws_status="$(osc $1 show "$2" -f value -c status 2>/dev/null || true)"
                  if [ "${ws_status}" = "$3" ]; then
                    return 0
                  fi
                  if [ "$(date +%s)" -ge "${ws_deadline}" ]; then
                    echo "ERROR: $1 $2 status '${ws_status:-<none>}' != $3 within $4s"
                    # The show itself, for the reason the status was not read:
                    # a volume the API answers with an error state, or a name
                    # that resolves to more than one object.
                    osc $1 show "$2" 2>&1 || true
                    exit 1
                  fi
                  sleep 5
                done
              }
              # wait_gone <kind> <name> <timeoutSeconds>: poll until a show of the
              # object fails, which is how the client reports one that is gone. A
              # delete is asynchronous, so a later count would otherwise race it.
              wait_gone() {
                wg_deadline=$(( $(date +%s) + $3 ))
                while true; do
                  if ! osc $1 show "$2" >/dev/null 2>&1; then
                    return 0
                  fi
                  if [ "$(date +%s)" -ge "${wg_deadline}" ]; then
                    echo "ERROR: $1 $2 still present after $3s"
                    exit 1
                  fi
                  sleep 5
                done
              }
              echo "== volume round-trip =="
              # A volume on the NFS backend the ControlPlane projected. Reaching
              # available spans the whole service: the API took the request, the
              # scheduler answered it over the bus, and cinder-volume created the
              # file on the mounted share.
              osc volume create --size 1 cp-vol
              wait_status volume cp-vol available 120
              echo "OK: volume round-trip"
              echo "== backup round-trip =="
              # cinder-backup reads the volume off the volume share and writes the
              # chunks onto the backup share. The restore goes back into the same
              # volume, which is the half that proves the chunks are readable
              # again, and the delete proves the backup service owns them.
              # openstackclient restores into a volume that already exists only
              # behind --force; without it the command refuses before any API
              # call ("Volume 'cp-vol' already exists; if you want to restore
              # the backup to it you need to specify the '--force' option").
              osc volume backup create --name cp-bk cp-vol
              wait_status "volume backup" cp-bk available 180
              osc volume backup restore --force cp-bk cp-vol
              wait_status volume cp-vol available 180
              osc volume backup delete cp-bk
              wait_gone "volume backup" cp-bk 120
              echo "OK: backup round-trip"
              echo "== encrypted volume type =="
              # The key-manager half of the block-storage service. Creating a
              # volume of an encrypted type has cinder store a LUKS key in
              # Barbican, and deleting that volume has it delete the key again.
              # Counting the secrets on both sides is what proves the key reached
              # Barbican: the type and the volume are created just the same
              # against a key manager that is never called.
              BEFORE="$(osc secret list -f value -c 'Secret href' | wc -l)"
              osc volume type create --encryption-provider luks --encryption-cipher aes-xts-plain64 \
                --encryption-key-size 256 --encryption-control-location front-end cp-luks
              osc volume create --size 1 --type cp-luks cp-enc
              wait_status volume cp-enc available 120
              AFTER="$(osc secret list -f value -c 'Secret href' | wc -l)"
              test "${AFTER}" -eq "$((BEFORE + 1))" || { echo "ERROR: barbican secret count ${AFTER} != $((BEFORE + 1)) after creating an encrypted volume"; exit 1; }
              osc volume delete cp-enc
              wait_gone volume cp-enc 120
              test "$(osc secret list -f value -c 'Secret href' | wc -l)" -eq "${BEFORE}" \
                || { echo "ERROR: the encrypted volume's key outlived the volume in Barbican"; exit 1; }
              osc volume type delete cp-luks
              echo "OK: encrypted volume type"
              echo "== image-volume cache =="
              # The cache is enabled on the nfs1 backend, so the FIRST create from
              # an image leaves a deployment-owned volume named image-<uuid> beside
              # the tenant's, and the second request clones that instead of pulling
              # the image through Glance again. The count of cache entries is what
              # tells the two apart: a cache that never engaged leaves none, and one
              # that engaged twice leaves two. The cache volume belongs to the
              # internal tenant the ControlPlane projected onto the child, which is
              # why it is only visible with --all-projects.
              dd if=/dev/urandom of=/tmp/cache.img bs=1024 count=1024
              osc image create --disk-format raw --container-format bare --file /tmp/cache.img cp-cache-img
              wait_status image cp-cache-img active 120
              IMG="$(osc image show cp-cache-img -f value -c id)"
              osc volume create --size 1 --image "${IMG}" cp-img-1
              wait_status volume cp-img-1 available 180
              COUNT="$(osc volume list --all-projects -f value -c Name | grep -cx "image-${IMG}" || true)"
              test "${COUNT}" -eq 1 || { echo "ERROR: expected one cache entry image-${IMG} in the all-projects listing, found ${COUNT}"; exit 1; }
              osc volume create --size 1 --image "${IMG}" cp-img-2
              wait_status volume cp-img-2 available 180
              COUNT="$(osc volume list --all-projects -f value -c Name | grep -cx "image-${IMG}" || true)"
              test "${COUNT}" -eq 1 || { echo "ERROR: the second create-from-image left ${COUNT} cache entries image-${IMG} instead of cloning the one"; exit 1; }
              osc volume delete cp-img-2
              osc volume delete cp-img-1
              wait_gone volume cp-img-2 120
              wait_gone volume cp-img-1 120
              # The cache volume is the deployment's, not the tenant's, so nothing
              # above removed it and the namespace teardown reaches no backend.
              CACHE_ID="$(osc volume list --all-projects -f value -c ID -c Name | awk -v n="image-${IMG}" '$2 == n {print $1}')"
              test -n "${CACHE_ID}" || { echo "ERROR: no cache volume image-${IMG} left to delete"; exit 1; }
              osc volume delete "${CACHE_ID}"
              wait_gone volume "${CACHE_ID}" 120
              osc volume delete cp-vol
              wait_gone volume cp-vol 120
              osc image delete cp-cache-img
              echo "OK: image-volume cache"
              echo "== compute round-trip =="
              # The CRUD check for the compute service, driven through the
              # ControlPlane's own admin credential like the network and
              # block-storage ones and through the same region-stripped osc()
              # wrapper: the compute rows carry no region either.
              #
              # The fake compute the suite deploys is the only nova-compute on
              # this cluster, so exactly one host has to report up. The state
              # travels over the bus on a periodic, and the report can lag the
              # discovery the chainsaw script ran, so the listing is polled for
              # a minute before it is counted.
              COMPUTE_HOST=""
              for _ in $(seq 1 12); do
                COMPUTE_HOST="$(osc compute service list --service nova-compute \
                  -f value -c Host -c State | awk '$2 == "up" { print $1 }')"
                if [ -n "${COMPUTE_HOST}" ]; then
                  break
                fi
                sleep 5
              done
              test "$(echo "${COMPUTE_HOST}" | wc -w)" -eq 1 || {
                echo "ERROR: expected exactly one nova-compute host up, got '${COMPUTE_HOST}'"
                osc compute service list --service nova-compute 2>&1 || true
                exit 1
              }
              echo "OK: compute service ${COMPUTE_HOST} up"
              # The smallest flavor the fake driver can be asked for. It is
              # created only when absent, so a rerun against a cloud that
              # already carries it does not fail on the duplicate name.
              osc flavor show m1.nano >/dev/null 2>&1 \
                || osc flavor create --vcpus 1 --ram 128 --disk 1 m1.nano
              # One mebibyte of nothing: the fake driver never reads the image,
              # and a small file keeps the Glance upload inside the budget.
              truncate -s 1M /tmp/cp-boot.raw
              osc image create --disk-format raw --container-format bare --file /tmp/cp-boot.raw cp-boot
              wait_status image cp-boot active 120
              # A tenant network of the suite's own. The server needs a port on
              # one for the chassis to bind and for the metadata request below
              # to carry an address.
              osc network create cp-compute-net
              osc subnet create --network cp-compute-net --subnet-range 10.77.0.0/24 cp-compute-subnet
              osc server create --image cp-boot --flavor m1.nano --network cp-compute-net cp-server
              # Polled rather than --wait so a server that goes to ERROR fails
              # here with the show that names the fault instead of spending the
              # whole window on one that is already dead.
              SRV_DEADLINE=$(( $(date +%s) + 300 ))
              while true; do
                SRV_STATUS="$(osc server show cp-server -f value -c status 2>/dev/null || true)"
                if [ "${SRV_STATUS}" = "ACTIVE" ]; then
                  break
                fi
                if [ "${SRV_STATUS}" = "ERROR" ] || [ "$(date +%s)" -ge "${SRV_DEADLINE}" ]; then
                  echo "ERROR: server cp-server status '${SRV_STATUS:-<none>}' != ACTIVE within 300s"
                  osc server show cp-server 2>&1 || true
                  exit 1
                fi
                sleep 5
              done
              SRV_HOST="$(osc server show cp-server -f value -c OS-EXT-SRV-ATTR:host)"
              test "${SRV_HOST}" = "${COMPUTE_HOST}" \
                || { echo "ERROR: server cp-server landed on '${SRV_HOST}', want '${COMPUTE_HOST}'"; exit 1; }
              echo "OK: server cp-server ACTIVE on ${SRV_HOST}"
              # The port the network gave the server. A bound port is what tells
              # a scheduled server from a networked one: vif_type ovs plus a
              # host_id means the OVN chassis on that node claimed it, while a
              # server whose port never bound still reads ACTIVE here.
              PORT_ID="$(osc port list --server cp-server -f value -c ID)"
              test -n "${PORT_ID}" || { echo "ERROR: server cp-server carries no port"; exit 1; }
              PORT_JSON="$(osc port show "${PORT_ID}" -f json)"
              export PORT_JSON
              # openstackclient spells the binding attributes with a colon in
              # some releases and with an underscore in others, so the document
              # is read by key with both spellings accepted rather than by
              # column name.
              PORT_FACTS="$(python3 <<'PYEOF'
              import json
              import os
              import re

              port = json.loads(os.environ["PORT_JSON"])


              def field(*names):
                  for name in names:
                      if name in port:
                          return port[name]
                  raise SystemExit("port document carries none of: %s" % ", ".join(names))


              addresses = re.findall(r"\b\d{1,3}(?:\.\d{1,3}){3}\b", json.dumps(field("fixed_ips")))
              print(field("binding:vif_type", "binding_vif_type"))
              print(field("binding:host_id", "binding_host_id"))
              print(addresses[0] if addresses else "")
              PYEOF
              )"
              VIF_TYPE="$(echo "${PORT_FACTS}" | sed -n 1p)"
              BOUND_HOST="$(echo "${PORT_FACTS}" | sed -n 2p)"
              FIXED_IP="$(echo "${PORT_FACTS}" | sed -n 3p)"
              test "${VIF_TYPE}" = "ovs" \
                || { echo "ERROR: port ${PORT_ID} vif_type '${VIF_TYPE}', want ovs"; exit 1; }
              test "${BOUND_HOST}" = "${COMPUTE_HOST}" \
                || { echo "ERROR: port ${PORT_ID} bound to '${BOUND_HOST}', want '${COMPUTE_HOST}'"; exit 1; }
              test -n "${FIXED_IP}" || { echo "ERROR: port ${PORT_ID} carries no fixed IPv4 address"; exit 1; }
              echo "OK: port bound (${VIF_TYPE}) on ${BOUND_HOST}"
              # The signed metadata round-trip, made by hand rather than from
              # inside the instance: the fake driver runs no guest, so nothing
              # there can reach 169.254.169.254. The four headers are what the
              # metadata agent on the chassis sends for a real instance.
              #
              # The wrong-signature 403 is the half that proves the generated
              # secret reached the compute side. A metadata API configured with
              # no secret at all skips the check and answers 200 to both
              # requests, so the 200 alone would pass against a Nova that never
              # read the ControlPlane's Secret.
              SERVER_ID="$(osc server show cp-server -f value -c id)"
              PROJECT_ID="$(osc server show cp-server -f value -c project_id)"
              export SERVER_ID PROJECT_ID FIXED_IP
              python3 <<'PYEOF'
              import hashlib
              import hmac
              import json
              import os
              import urllib.error
              import urllib.request

              URL = ("http://controlplane-keystone-nova-metadata.openstack.svc:8775"
                     "/openstack/latest/meta_data.json")
              server_id = os.environ["SERVER_ID"]
              secret = os.environ["METADATA_SHARED_SECRET"]


              def get(signature):
                  request = urllib.request.Request(URL, headers={
                      "X-Instance-ID": server_id,
                      "X-Tenant-ID": os.environ["PROJECT_ID"],
                      "X-Instance-ID-Signature": signature,
                      "X-Forwarded-For": os.environ["FIXED_IP"],
                  })
                  return urllib.request.urlopen(request, timeout=30)


              def sign(key):
                  return hmac.new(key.encode(), server_id.encode(), hashlib.sha256).hexdigest()


              response = get(sign(secret))
              if response.status != 200:
                  raise SystemExit("signed metadata request returned HTTP %s" % response.status)
              document = json.loads(response.read().decode())
              if document.get("uuid") != server_id:
                  raise SystemExit(
                      "metadata uuid %r is not the server's %r" % (document.get("uuid"), server_id))

              try:
                  status = get(sign("not-the-shared-secret")).status
              except urllib.error.HTTPError as err:
                  status = err.code
              if status != 403:
                  raise SystemExit(
                      "metadata request with a wrong signature returned HTTP %s, want 403" % status)
              PYEOF
              echo "OK: metadata signed round-trip"
              osc server delete --wait cp-server
              osc subnet delete cp-compute-subnet
              osc network delete cp-compute-net
              osc image delete cp-boot
              echo "OK: compute round-trip"
          volumeMounts:
            - name: clouds
              mountPath: /etc/openstack
              readOnly: true
      volumes:
        - name: clouds
          secret:
            secretName: k-orc-clouds-yaml
