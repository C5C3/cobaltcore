# The OVN chassis of the full-ControlPlane suite. Its pods program the local
# Open vSwitch of every node the selector matches, which is the one kind node.
#
# Neutron binds a port only to a host that has a live chassis row in the
# Southbound database, so without this CR the server the verify Job boots ends
# in ERROR on a binding failure. The chassis registers under the node's name
# (operators/ovn/internal/controller/reconcile_nodes.go:145), which is why the
# fake compute of 06-fake-compute.yaml takes its [DEFAULT] host from the same
# field.
#
# The selector matches openstack.c5c3.io/chassis, the label the chainsaw script
# puts on the node before it applies the ControlPlane; the suite's third finally
# script takes it off again.
#
# The central is the standalone OVNCentral 03-ovncentral-cr.yaml applies, the
# same one services.neutron.ovn.centralRef names, so the chassis and the network
# service share one Southbound database.
#
# No bridge mappings and no gateway: there is no provider network on a kind node
# to map, and the suite boots its server on a tenant network alone. spec.image is
# left unset so the operator resolves the same OVN image the control plane runs.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNChassis
metadata:
  name: controlplane-keystone-chassis
  namespace: openstack
spec:
  centralRef:
    name: controlplane-keystone-ovn
  nodeSelector:
    openstack.c5c3.io/chassis: "true"
