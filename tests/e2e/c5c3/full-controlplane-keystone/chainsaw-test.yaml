# Chainsaw E2E test for the full c5c3 ControlPlane → Keystone chain. It applies one ControlPlane CR (group c5c3.io/v1alpha1) and asserts
# the entire orchestration chain LINK BY LINK, gating each link on the previous
# one before proceeding:
#
#   1. Infrastructure  — owned MariaDB ("openstack-db") + Memcached
#                        ("openstack-memcached") created in the openstack
#                        namespace and owned by the ControlPlane; the shared bus
#                        is referenced brownfield against a vhost of this suite's
#                        own on the kind broker, so no broker is projected;
#                        InfrastructureReady=True.
#   2. Keystone        — owned Keystone CR ("controlplane-keystone-keystone")
#                        with image tag derived from spec.openStackRelease,
#                        database/cache clusterRefs wired to the infra CRs, and
#                        merged spec.policyOverrides; KeystoneReady=True.
#   3. ApplicationCred — owned K-ORC ApplicationCredential
#                        ("controlplane-keystone-admin-app-credential") minted
#                        with restricted:true (spec.resource.unrestricted=false);
#                        KORCReady=True.
#   4. Credential chain — minted credential → operator Secret → PushSecret
#                        ("…-admin-app-credential-backup") → OpenBao →
#                        ExternalSecret "k-orc-clouds-yaml" Ready in the
#                        control-plane namespace (this is the AdminCredentialReady
#                        gate after the C1 co-location fix; the clouds.yaml
#                        ExternalSecret is operator-created per-CR in the
#                        control-plane namespace only);
#                        AdminCredentialReady=True.
#                        (: the control-plane-namespace k-orc-clouds-yaml ExternalSecret is now OPERATOR-CREATED — per-CR, controller-owned — and the bootstrap clouds.yaml is operator-seeded; this test WAITS FOR, never pre-creates, them.)
#   5. Catalog         — owned K-ORC Service ("…-identity-service") + Endpoint
#                        ("…-identity-endpoint"); CatalogReady=True.
#   5b. Registrations  — one KeystoneService child per built-in service
#                        ("…-glance", "…-placement", "…-barbican", "…-neutron"),
#                        each carrying that service's catalog entry and its
#                        service account. The stored ControlPlane carries no
#                        inline account surface; every child reports Ready=True
#                        (AllReady) over CatalogReady=CatalogRegistered and
#                        AccountReady=AccountProvisioned, and the K-ORC
#                        RoleAssignment it label-owns is Available.
#   5c. Glance child   — owned Glance CR ("…-glance") with database/cache clusterRefs,
#                        an engine-issued (Dynamic) DB credential drawn from the
#                        OpenBao database engine, the derived Keystone endpoint, the
#                        service user its registration provisions, and its
#                        GlanceBackend ("…-glance-default") against the Garage S3
#                        bucket; GlanceReady=True.
#   5d. Image catalog  — the image registration's K-ORC Service + internal/public
#                        Endpoints, resolved through its ownership labels, both URLs
#                        the in-cluster Glance API (no gateway in this fixture).
#   5e. Placement child — owned Placement CR ("…-placement") on the same terms as the
#                        Glance child: database/cache clusterRefs, an engine-issued
#                        (Dynamic) DB credential, the derived Keystone endpoint, and
#                        the service user its registration provisions;
#                        PlacementReady=True.
#   5f. Placement cat. — the placement registration's K-ORC Service +
#                        internal/public Endpoints, resolved through its ownership
#                        labels, both URLs the in-cluster Placement API (no gateway
#                        in this fixture).
#   5g. Barbican child — owned Barbican CR ("…-barbican") on the Placement child's
#                        terms (database/cache clusterRefs, an engine-issued
#                        (Dynamic) DB credential, the derived Keystone endpoint, the
#                        service user its registration provisions) PLUS the
#                        dedicated secret store the fixture asks for: an
#                        OpenBaoCluster ("…-barbican-bao") reporting
#                        Available=True, a BarbicanSecretStore
#                        ("…-barbican-store") reporting Ready=True, the AppRole
#                        Secret ("…-barbican-store-approle") the barbican-operator
#                        mints against it, and SecretStoresReady=AllStoresProjected
#                        on the child; BarbicanReady=True.
#   5h. Key-mgr cat.   — the key-manager registration's K-ORC Service +
#                        internal/public Endpoints, resolved through its ownership
#                        labels, both URLs the in-cluster Barbican API (no gateway
#                        in this fixture).
#   5i. OVN + Neutron  — OVNReady=True (reason OVNCentralReady) mirroring the
#                        standalone OVNCentral this suite applies beside the
#                        ControlPlane, then the owned Neutron CR ("…-neutron") on
#                        the Barbican child's terms plus the bus Secret
#                        ("…-neutron-messaging") it references brownfield, the
#                        resolved OVN centralRef and the sized RPC workers;
#                        NeutronReady=True.
#   5j. Network cat.   — the network registration's K-ORC Service +
#                        internal/public Endpoints, resolved through its ownership
#                        labels, both URLs the in-cluster Neutron API (no gateway
#                        in this fixture).
#   5k. Cinder child   — owned Cinder CR ("…-cinder") on the Neutron child's terms
#                        (database/cache clusterRefs, an engine-issued (Dynamic) DB
#                        credential, the derived Keystone endpoint, the service user
#                        its registration provisions, the bus Secret
#                        "…-cinder-messaging" it references brownfield) PLUS what no
#                        peer carries: the Glance and Barbican endpoints of its
#                        sibling services, the internal tenant read off the
#                        registration's account status, and one CinderBackend
#                        ("nfs1") and one CinderBackupBackend ("nfsbk") satellite
#                        against the kind NFS export, both attached by cinderRef;
#                        CinderReady=True.
#   5l. Block-st. cat. — the block-storage registration's K-ORC Service +
#                        internal/public Endpoints, resolved through its ownership
#                        labels, both URLs the in-cluster Cinder API on the
#                        project-less /v3 path (no gateway in this fixture).
#   5m. Nova child     — owned Nova CR ("…-nova") on the Cinder child's terms
#                        (cluster refs, the derived Keystone endpoint, the service
#                        user its registration provisions, the bus Secret
#                        "…-nova-messaging") plus what no peer carries: TWO
#                        engine-issued DB credentials, one per schema (nova_api and
#                        nova), the generated metadata shared secret behind an ESO
#                        Password generator, the cinder and barbican client
#                        sections its sibling services switch on, and the compute
#                        contract the child publishes on
#                        status.computeConfigSecretRef; NovaReady=True. Then
#                        ServiceAccountsReady=True, which waits here rather than
#                        at 5b: the hypervisor operator's registration
#                        ("…-nova-hypervisor-operator") is projected only once
#                        the Nova child is Ready.
#   5n. Compute cat.   — the compute registration's K-ORC Service +
#                        internal/public Endpoints, resolved through its ownership
#                        labels, both URLs the in-cluster Nova API on the /v2.1
#                        path (no gateway in this fixture).
#   5o. Notifier leg   — the account-only KeystoneService ("…-neutron-nova") the
#                        network service posts its port notifications as, the
#                        spec.nova block the ControlPlane writes onto the Neutron
#                        child, and the OS_NOVA__PASSWORD env the neutron operator
#                        sources from that account's Secret. The OVN chassis, the
#                        metadata agent and the fake compute the suite applies
#                        beside the plane then give the compute service a host to
#                        place on and an agent to answer its instances.
#   6. Aggregate       — ControlPlane Ready=True (reason AllReady).
#   6z. Node budget    — hack/ci-check-node-budget.sh sums the effective
#                        requests of every pod on the kind node except the
#                        compute-node data plane (OVN chassis, metadata agent,
#                        fake compute) and fails above 4000m CPU or 16Gi
#                        memory. Enforced under E2E_NODE_BUDGET=true (the
#                        e2e-controlplane job); otherwise it prints a SKIP line.
#   7. API reachable   — Keystone /v3 returns HTTP 200; `openstack token issue`,
#                        `openstack catalog list` (identity, image, placement,
#                        key-manager, network AND block-storage), an image upload
#                        round-trip through the projected Glance endpoint into the
#                        Garage S3 backend, a placement resource-class listing, a
#                        Barbican secret store/get round-trip whose retrieved
#                        payload is compared byte for byte against the stored
#                        literal, a network create/show/delete round-trip through
#                        the projected Neutron endpoint, and four block-storage
#                        round-trips through the projected Cinder endpoint (a
#                        volume on the NFS backend, a backup created, restored and
#                        deleted, an encrypted volume type whose key lands in
#                        Barbican and leaves again, and a second create-from-image
#                        served by the image-volume cache), and a compute
#                        round-trip that boots one server on the fake compute,
#                        checks its port bound on that host and signs a metadata
#                        request with the generated shared secret, all succeed
#                        using the materialised admin clouds.yaml (proves the
#                        minted, pushed, re-materialised application credential
#                        authenticates and the services work).
#   7d. Hypervisor op. — the auth Secret ("…-nova-hypervisor-operator-auth")
#                        carries exactly the seven keys of the hypervisor
#                        operator's chart values; the K-ORC fixtures of
#                        deploy/kind/hypervisor-operator-fixtures/fixtures.yaml
#                        become Available; and a Job authenticating as the
#                        hypervisor operator's user
#                        (07-hypervisor-operator-verify-job.yaml) proves one
#                        public compute and placement row per scope, the admin
#                        reach into services, hypervisors, aggregates and
#                        Placement, and the test@cc3test scope.
#
# ── DECISION: belt-and-braces presence guard + single consolidated script ────
# Ambiguity: the task says "follow tests/e2e/keystone/basic-deployment
# structure" (pure declarative `assert` steps). basic-deployment can do that
# because the keystone e2e-operator matrix job deploys the keystone-operator and
# the infra operators it needs. The c5c3 chain additionally needs K-ORC and the
# c5c3-operator, which the current kind E2E wiring (hack/deploy-infra.sh +
# hack/ci-deploy-operator.sh) does NOT install. Under the suite's
# `execution.failFast: true` (tests/e2e/chainsaw-config.yaml) a pure declarative
# test would HARD-FAIL the entire e2e-operator job on any cluster missing that
# stack — including the PR that introduces this file.
# Chose: the repo's established kind-only belt-and-braces gating pattern
# (tests/e2e/keystone/gateway-quick-start-smoke, tests/e2e/infrastructure/
# chaos-mesh-health). A runtime presence guard probes for the required CRDs +
# the OpenBao ClusterSecretStore and exits 0 with a SKIP line when the stack is
# absent, so the test is default-safe; when the stack IS present it asserts the
# full chain link-by-link. Because chainsaw has no step-level skip, the guard and
# all link assertions live in ONE script step (declarative asserts in sibling
# steps would time out and fail even after the guard exited 0 — see the
# chaos-mesh-health pattern). The `# ── Link N ──` headers preserve the
# link-by-link structure of basic-deployment.
# Reviewer: please verify, and note the kind E2E wiring to deploy K-ORC + the
# c5c3-operator (so this test exercises rather than skips) is a documented
# fast-follow on the GitOps/CI wiring (/).
#
# ── DECISION: OpenStack client image for token/catalog verification ──────────
# `openstack token issue` / `openstack catalog list` need the OpenStack CLI. The
# verify Job (01-openstack-verify-job.yaml) uses ghcr.io/c5c3/tempest:2025.2 —
# the repo's own image that bundles the OpenStack client. The e2e-controlplane CI
# job loads that image into kind (mirroring the tempest job) so it need not be
# pulled from GHCR. Behind the presence guard this never runs on a stack that
# lacks it.
#
# ── NOTE: operator-owned seed execution ───────────
# The operator-owned bootstrap clouds.yaml seed (seedBootstrapCloudsYAML) and
# the per-CR k-orc-clouds-yaml ExternalSecret (ensureKORCCloudsYAMLExternalSecret)
# are exercised by THIS suite only on a live kind cluster carrying the c5c3 +
# K-ORC + keystone stack (WITH_CONTROLPLANE=true). That stack is NOT available in
# the CI sandbox (no kind cluster), so behind the presence guard the test SKIPs
# there rather than running. The operator seed behaviour is instead verified
# in-sandbox by the envtest integration test
# TestIntegration_FullReconcile_ManagedToReady, which drives the full chain to
# AdminCredentialReady=True against the operator-created per-CR ExternalSecret.
# Wiring K-ORC + the c5c3-operator into kind E2E so this suite EXERCISES rather
# than skips remains the documented fast-follow (/).
#
# ── NOTE: operator-projected ExternalSecret ────────
# The orc-system copy of the k-orc-clouds-yaml ExternalSecret/Secret was removed:
# the operator now materialises the per-CR k-orc-clouds-yaml Secret ONLY into the
# ControlPlane namespace (openstack). Link 4 therefore no longer waits for an
# orc-system copy, and the Link 7b verify Job + its diagnostics moved to the
# ControlPlane namespace. The K-ORC controller itself still runs in orc-system,
# so the controller-log diagnostic in the catch block stays on that namespace.
#
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: full-controlplane-keystone
spec:
  namespace: openstack
  # Serialised, because the compute leg pins a node: the script labels a node
  # openstack.c5c3.io/chassis and the OVNChassis pods that land on it program
  # the local Open vSwitch over host paths they share with any other chassis or
  # metadata agent. hack/kind-config.yaml declares a single node, so a suite
  # rendering either one at the same time would contend with this one.
  concurrent: false
  # The full chain (Galera bring-up + Keystone bootstrap + K-ORC mint + the
  # OpenBao round-trip + the dedicated OpenBao instance the Barbican store is
  # provisioned against) is long-running, so the consolidated script and its
  # diagnostic catch get generous bounds well above the 120s suite default.
  timeouts:
    assert: 5m
    exec: 30m
  steps:
  # ── Step 1: Presence-gate, apply the ControlPlane, assert the chain ────────
  - try:
    - script:
        timeout: 65m
        # Chainsaw defaults to `sh`, which rejects `set -o pipefail`; every
        # infra/keystone e2e script pins bash for the same reason.
        shell: bash
        content: |
          set -euo pipefail

          CP_NS=openstack
          CP_NAME=controlplane-keystone
          KEYSTONE_CR="${CP_NAME}-keystone"
          HORIZON_CR="${CP_NAME}-horizon"
          AC_NAME="${CP_NAME}-admin-app-credential"
          PUSH_SECRET="${CP_NAME}-admin-app-credential-backup"
          SVC_CR="${CP_NAME}-identity-service"
          EP_CR="${CP_NAME}-identity-endpoint"
          REGION_CR="${CP_NAME}-region"
          GLANCE_CR="${CP_NAME}-glance"
          PLACEMENT_CR="${CP_NAME}-placement"
          BARBICAN_CR="${CP_NAME}-barbican"
          BARBICAN_STORE="${BARBICAN_CR}-store"
          BARBICAN_BAO="${BARBICAN_CR}-bao"
          NEUTRON_CR="${CP_NAME}-neutron"
          CINDER_CR="${CP_NAME}-cinder"
          NOVA_CR="${CP_NAME}-nova"
          CLOUDS_SECRET=k-orc-clouds-yaml

          # The node the chassis programs and the compute registers under. The
          # OVN chassis writes external_ids:hostname from the node's name and
          # neutron binds a port only to a host that has a live chassis, so the
          # fake compute takes its [DEFAULT] host from the same field and the
          # verify Job's server has to land here. The label goes on BEFORE the
          # ControlPlane is applied so the chassis finds a node the moment it is
          # created; the third finally script takes it off again.
          NODE="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          if [ -z "${NODE}" ]; then
            echo "ERROR: the cluster lists no node to run the chassis on"; exit 1
          fi

          # Each built-in service registers through a KeystoneService child of its
          # own, named like the service child it registers (both are the
          # ControlPlane name plus the service suffix).
          GLANCE_KS="${GLANCE_CR}"
          PLACEMENT_KS="${PLACEMENT_CR}"
          BARBICAN_KS="${BARBICAN_CR}"
          NEUTRON_KS="${NEUTRON_CR}"
          CINDER_KS="${CINDER_CR}"
          NOVA_KS="${NOVA_CR}"
          # The network service takes a SECOND registration beside its own: the
          # account-only child carrying the user neutron posts its port
          # notifications to nova as. It is named after the Neutron child, not
          # after the compute one, so the two registrations one network service
          # holds sort together.
          NOTIFIER_KS="${NEUTRON_CR}-nova"
          # A registration's K-ORC children live in the ControlPlane's namespace and
          # carry a name-hash prefix, so nothing here can address them by name: they
          # are resolved through the ownership labels the registration stamps. The
          # namespace half of the selector is the registration's own, which in this
          # suite is the ControlPlane's, since every service is co-located with it.
          # The identity row above keeps its ControlPlane-derived name: it belongs to
          # the plane itself, not to a registration.
          GLANCE_SELECTOR="c5c3.io/keystoneservice-name=${GLANCE_KS},c5c3.io/keystoneservice-namespace=${CP_NS}"
          PLACEMENT_SELECTOR="c5c3.io/keystoneservice-name=${PLACEMENT_KS},c5c3.io/keystoneservice-namespace=${CP_NS}"
          BARBICAN_SELECTOR="c5c3.io/keystoneservice-name=${BARBICAN_KS},c5c3.io/keystoneservice-namespace=${CP_NS}"
          NEUTRON_SELECTOR="c5c3.io/keystoneservice-name=${NEUTRON_KS},c5c3.io/keystoneservice-namespace=${CP_NS}"
          CINDER_SELECTOR="c5c3.io/keystoneservice-name=${CINDER_KS},c5c3.io/keystoneservice-namespace=${CP_NS}"
          NOVA_SELECTOR="c5c3.io/keystoneservice-name=${NOVA_KS},c5c3.io/keystoneservice-namespace=${CP_NS}"

          # ── Presence guard ──────────────────────────────
          # Probe for every CRD the chain spans plus the OpenBao
          # ClusterSecretStore the credential chain pushes through.
          #
          # E2E_REQUIRE_CONTROLPLANE_STACK gates the failure mode. The dedicated
          # e2e-controlplane CI job deploys the full stack and sets it to "true",
          # so a missing operator / CRD FAILS LOUDLY (exit 1) — broken wiring must
          # not go green there. Every other context (the c5c3 e2e-operator matrix
          # leg, a local run against a plain cluster) leaves it unset, so the guard
          # SKIPs cleanly (exit 0) when the stack is absent, keeping this suite
          # default-safe. Chainsaw script steps inherit the process environment
          # (the same way KUBECONFIG reaches them), so the job step's env: block
          # is enough to set it.
          REQUIRE_STACK="${E2E_REQUIRE_CONTROLPLANE_STACK:-false}"
          gate_absent() { # <reason...>
            if [ "${REQUIRE_STACK}" = "true" ]; then
              echo "ERROR: $*"
              echo "       E2E_REQUIRE_CONTROLPLANE_STACK=true — the full ControlPlane"
              echo "       stack is required on this cluster; failing loudly so broken"
              echo "       wiring cannot go green."
              exit 1
            fi
            echo "SKIP: $*"
            echo "      The c5c3-operator + K-ORC + keystone-operator stack is not"
            echo "      deployed here, so the full ControlPlane chain is not exercised."
            exit 0
          }

          missing=""
          for crd in \
            controlplanes.c5c3.io \
            keystoneservices.c5c3.io \
            keystones.keystone.openstack.c5c3.io \
            horizons.horizon.openstack.c5c3.io \
            glances.glance.openstack.c5c3.io \
            glancebackends.glance.openstack.c5c3.io \
            placements.placement.openstack.c5c3.io \
            barbicans.barbican.openstack.c5c3.io \
            barbicansecretstores.barbican.openstack.c5c3.io \
            neutrons.neutron.openstack.c5c3.io \
            cinders.cinder.openstack.c5c3.io \
            cinderbackends.cinder.openstack.c5c3.io \
            cinderbackupbackends.cinder.openstack.c5c3.io \
            novas.nova.openstack.c5c3.io \
            ovncentrals.ovn.openstack.c5c3.io \
            ovnchassis.ovn.openstack.c5c3.io \
            neutronmetadataagents.neutron.openstack.c5c3.io \
            rabbitmqclusters.rabbitmq.com \
            openbaoclusters.openbao.org \
            openbaotenants.openbao.org \
            applicationcredentials.openstack.k-orc.cloud \
            services.openstack.k-orc.cloud \
            endpoints.openstack.k-orc.cloud \
            roleassignments.openstack.k-orc.cloud \
            regions.openstack.k-orc.cloud \
            externalsecrets.external-secrets.io \
            vaultdynamicsecrets.generators.external-secrets.io; do
            if ! kubectl get crd "$crd" >/dev/null 2>&1; then
              missing="${missing} ${crd}"
            fi
          done
          if [ -n "${missing}" ]; then
            gate_absent "required CRDs not present:${missing}"
          fi
          if ! kubectl get clustersecretstore openbao-cluster-store >/dev/null 2>&1; then
            gate_absent "openbao-cluster-store ClusterSecretStore not present; the admin-credential push chain cannot complete."
          fi
          # The CRDs alone no longer prove the stack: the e2e-operator (c5c3)
          # matrix leg installs every CRD the c5c3 controller watches WITHOUT
          # deploying the sibling operators. This chain needs the
          # keystone-operator to drive the projected Keystone to Ready, so
          # probe for its running pods (any namespace — the release namespace
          # differs per job), not just its schema.
          #
          # The probe captures via command substitution and retries; it must
          # NOT be simplified back to `kubectl … 2>/dev/null | grep -q .`.
          # Under pipefail that pipeline reads a transient apiserver error
          # (stderr discarded, kubectl's exit never inspected) — or grep -q
          # closing the pipe on the first of two replica lines, killing
          # kubectl with EPIPE after the match — as "no pods", and the gate
          # then fails a cluster that runs the full stack. Only a listing
          # that stays empty across every attempt gates.
          operator_running() { # <app.kubernetes.io/name label value>
            local pods
            for _ in 1 2 3 4 5; do
              if pods="$(kubectl get pods -A -l "app.kubernetes.io/name=$1" --no-headers 2>/dev/null)" \
                && [ -n "${pods}" ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! operator_running keystone-operator; then
            gate_absent "no keystone-operator is running; the cluster carries the stack's CRDs only."
          fi
          # Same for the glance-operator: it drives the projected Glance child to
          # Ready, so probe for its running pods (any namespace), not just its schema.
          if ! operator_running glance-operator; then
            gate_absent "no glance-operator is running; the cluster carries the stack's CRDs only."
          fi
          # Same for the placement-operator: it drives the projected Placement child
          # to Ready, so probe for its running pods (any namespace), not just its schema.
          if ! operator_running placement-operator; then
            gate_absent "no placement-operator is running; the cluster carries the stack's CRDs only."
          fi
          # Same for the barbican-operator: it drives the projected Barbican child
          # to Ready and mints the secret store's AppRole credentials against the
          # dedicated instance.
          if ! operator_running barbican-operator; then
            gate_absent "no barbican-operator is running; the cluster carries the stack's CRDs only."
          fi
          # The dedicated secret store additionally needs the openbao-operator: it
          # is what drives the projected OpenBaoCluster to Available, and both the
          # store and the Barbican child wait for that. Without the probe a cluster
          # carrying the openbao.org CRDs but no controller would hang here for the
          # whole script timeout instead of gating.
          if ! operator_running openbao-operator; then
            gate_absent "no openbao-operator is running; the dedicated Barbican secret store cannot be provisioned."
          fi
          # The ovn-operator drives the standalone OVNCentral this suite applies
          # to Ready, and the ControlPlane mirrors that readiness into OVNReady.
          if ! operator_running ovn-operator; then
            gate_absent "no ovn-operator is running; the referenced OVNCentral cannot reach Ready."
          fi
          # The neutron-operator drives the projected Neutron child to Ready.
          if ! operator_running neutron-operator; then
            gate_absent "no neutron-operator is running; the projected Neutron child cannot reach Ready."
          fi
          # The cinder-operator drives the projected Cinder child to Ready.
          if ! operator_running cinder-operator; then
            gate_absent "no cinder-operator is running; the projected Cinder child cannot reach Ready."
          fi
          # The nova-operator drives the projected Nova child to Ready and
          # publishes the compute contract the fake compute of
          # 06-fake-compute.yaml mounts.
          if ! operator_running nova-operator; then
            gate_absent "no nova-operator is running; the projected Nova child cannot reach Ready."
          fi
          # Two infrastructure stacks beyond the operators, both of them opt-in on
          # the CI job and neither installed by deploy-infra.sh by default. The
          # block-storage service casts real RPC over the bus and mounts both of
          # its shares from the in-cluster export, so a cluster missing either one
          # brings up no Cinder at all. Probing here turns that into one gated line
          # instead of a CinderReady wait that burns the whole script budget.
          if [ "$(kubectl get rabbitmqcluster shared-rabbitmq -n openstack \
            -o jsonpath='{.status.conditions[?(@.type=="AllReplicasReady")].status}' 2>/dev/null || true)" != "True" ]; then
            gate_absent "shared-rabbitmq is not serving in openstack; deploy the kind messaging stack (WITH_MESSAGING=true) so the block-storage service has a broker."
          fi
          if ! kubectl get deploy nfs-server -n openstack >/dev/null 2>&1; then
            gate_absent "no nfs-server Deployment in openstack; deploy the kind NFS stack (WITH_NFS=true) so the block-storage service has its shares."
          fi

          echo "OK: c5c3 + K-ORC + keystone + glance + placement + barbican + openbao + neutron + ovn + cinder + nova CRDs, OpenBao store, the shared-rabbitmq broker, the nfs-server export, and running"
          echo "    keystone-operator, glance-operator, placement-operator, barbican-operator, openbao-operator, ovn-operator, neutron-operator, cinder-operator, and nova-operator present — running the full ControlPlane → Keystone chain."

          # ── Helpers ────────────────────────────────────────────────────────
          # Poll a ControlPlane status condition to True. Implemented as an
          # explicit poll (not `kubectl wait`) so a condition that is briefly
          # absent or False simply retries instead of erroring out, and so the
          # failure message names the last-observed status for triage.
          wait_cp_condition() { # <conditionType> <timeoutSeconds>
            local ctype="$1" timeout="$2"
            local deadline status
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              status="$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" \
                -o "jsonpath={.status.conditions[?(@.type=='${ctype}')].status}" 2>/dev/null || true)"
              if [ "${status}" = "True" ]; then
                echo "OK: ControlPlane condition ${ctype}=True"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ControlPlane condition ${ctype} not True within ${timeout}s (last: '${status:-<none>}')"
                return 1
              fi
              sleep 5
            done
          }

          # Poll an arbitrary resource's Ready condition (ExternalSecret /
          # PushSecret both expose a "Ready" condition).
          wait_ready_condition() { # <resource> <name> <namespace> <timeoutSeconds>
            local res="$1" name="$2" ns="$3" timeout="$4"
            local deadline status
            deadline=$(( $(date +%s) + timeout ))
            while true; do
              status="$(kubectl get "${res}" "${name}" -n "${ns}" \
                -o "jsonpath={.status.conditions[?(@.type=='Ready')].status}" 2>/dev/null || true)"
              if [ "${status}" = "True" ]; then
                echo "OK: ${res}/${name} Ready=True"
                return 0
              fi
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "ERROR: ${res}/${name} Ready not True within ${timeout}s (last: '${status:-<none>}')"
                return 1
              fi
              sleep 5
            done
          }

          assert_eq() { # <description> <expected> <actual>
            if [ "$2" != "$3" ]; then
              echo "ERROR: $1 — expected '$2', got '$3'"
              exit 1
            fi
            echo "OK: $1 ('$3')"
          }

          # How many objects of the given kinds a label selector resolves to.
          # `grep -c .` counts lines and returns 1 on an empty listing, which the
          # trailing `|| true` turns back into a printed "0".
          count_of() { # <kinds> <namespace> <selector>
            kubectl get "$1" -n "$2" -l "$3" --no-headers 2>/dev/null | grep -c . || true
          }

          owner_of() { # <resource> <name>  → controller ControlPlane name
            kubectl get "$1" "$2" -n "${CP_NS}" \
              -o "jsonpath={.metadata.ownerReferences[?(@.kind=='ControlPlane')].name}" 2>/dev/null || true
          }

          # Apply the ControlPlane CR now that the CRD presence guard has passed.
          # Chainsaw runs scripts with the test directory as CWD.
          kubectl apply -f 02-horizon-secret-key-externalsecret.yaml
          # The OVN control plane the ControlPlane's services.neutron references.
          # Applied here, inside the script and behind the gate, rather than as a
          # separate chainsaw apply step: a separate step would hard-fail on a
          # devstack that carries no OVN CRD, which is the case the gate above is
          # meant to SKIP.
          kubectl apply -f 03-ovncentral-cr.yaml
          # The brownfield bus Secret spec.infrastructure.messaging references. It
          # is written rather than applied: the helper takes a vhost of this
          # suite's own on the shared kind broker and renders the transport URL of
          # that vhost into the Secret, which is what keeps these RPC topics out of
          # the vhosts the parallel cinder suites hold. The ControlPlane reads the
          # Secret and copies the URL to the Neutron and Cinder children. The
          # finally block deletes the vhost again.
          ../../cinder/broker-vhost.sh create "${CP_NAME}" "${CP_NAME}-messaging" "${CP_NS}"
          # The chassis role the OVNChassis of 04-ovnchassis-cr.yaml selects on.
          # It is written before the ControlPlane so the label is already there
          # when the OVN leg applies the chassis, and it is written with
          # --overwrite so a node a previous run left labelled converges.
          kubectl label node "${NODE}" openstack.c5c3.io/chassis=true --overwrite
          echo "OK: labelled node ${NODE} with openstack.c5c3.io/chassis=true"
          kubectl apply -f 00-controlplane-cr.yaml

          # ── Link 1: Infrastructure (MariaDB + Memcached, owned) ────────────
          wait_cp_condition InfrastructureReady 600
          kubectl get mariadb openstack-db -n "${CP_NS}" >/dev/null
          kubectl get memcacheds.memcached.c5c3.io openstack-memcached -n "${CP_NS}" >/dev/null
          assert_eq "MariaDB openstack-db owned by ControlPlane" "${CP_NAME}" "$(owner_of mariadb openstack-db)"
          assert_eq "Memcached openstack-memcached owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of memcacheds.memcached.c5c3.io openstack-memcached)"

          # ── Onboard the OpenBao database-engine tenant (stage b, #439) ──────
          # Managed-mode Keystone now draws engine-issued (Dynamic) DB
          # credentials from database/mariadb/creds/keystone-<ns> (keyed on the
          # namespace alone). That per-tenant role only exists after
          # setup-database-tenant.sh configures
          # it against the now-Ready MariaDB. The e2e-controlplane CI job runs
          # deploy-infra with WITH_CONTROLPLANE_CR=false, so deploy-infra does not
          # onboard — this suite must. The script is idempotent, so a second
          # onboard (e.g. a local WITH_CONTROLPLANE_CR=true run) is safe.
          kubectl wait mariadb/openstack-db -n "${CP_NS}" --for=condition=Ready --timeout=300s
          export BAO_TOKEN
          BAO_TOKEN="$(kubectl get secret openbao-init-keys -n shared-services \
            -o jsonpath='{.data.init-output}' | base64 -d | jq -r '.root_token')"
          if [ -z "${BAO_TOKEN}" ] || [ "${BAO_TOKEN}" = "null" ]; then
            echo "ERROR: could not extract OpenBao root token for tenant onboarding"; exit 1
          fi
          # bao_exec runs a bao command inside openbao-0 with the mTLS client
          # material (mirrors deploy/openbao/bootstrap/common.sh); reused by the
          # revocation/isolation link below.
          bao_exec() {
            kubectl exec -n shared-services openbao-0 -- \
              env BAO_ADDR=https://127.0.0.1:8200 BAO_TOKEN="${BAO_TOKEN}" \
              VAULT_CACERT=/openbao/tls/ca.crt \
              VAULT_CLIENT_CERT=/openbao/client-tls/tls.crt \
              VAULT_CLIENT_KEY=/openbao/client-tls/tls.key "$@"
          }
          ../../../../deploy/openbao/bootstrap/setup-database-tenant.sh "${CP_NS}" "${CP_NAME}"
          echo "OK: OpenBao database-engine tenant onboarded."
          wait_cp_condition DBCredentialsReady 300

          # ── Assert the DB-credential ExternalSecret is generator-backed ────
          # Named after the projected Keystone CR, not the ControlPlane:
          # dbCredentialSecretName = keystoneName(cp) + "-db-credentials"
          # (reconcile_dbcredentials.go), i.e. <cp>-keystone-db-credentials.
          DB_SECRET="${KEYSTONE_CR}-db-credentials"
          assert_eq "DB-credential ExternalSecret uses a VaultDynamicSecret generator" "VaultDynamicSecret" \
            "$(kubectl get externalsecret "${DB_SECRET}" -n "${CP_NS}" \
              -o "jsonpath={.spec.dataFrom[0].sourceRef.generatorRef.kind}")"
          assert_eq "DB-credential ExternalSecret carries no static Data refs" "" \
            "$(kubectl get externalsecret "${DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.data}')"
          kubectl get vaultdynamicsecret "${DB_SECRET}" -n "${CP_NS}" >/dev/null
          kubectl get serviceaccount keystone-db-creds -n "${CP_NS}" >/dev/null
          # The materialised Secret must carry the engine-issued username (a
          # transient v-kube-... login), not the static "keystone" user.
          DB_USERNAME="$(kubectl get secret "${DB_SECRET}" -n "${CP_NS}" \
            -o "jsonpath={.data.username}" | base64 -d)"
          if [ "${DB_USERNAME}" = "keystone" ] || [ -z "${DB_USERNAME}" ]; then
            echo "ERROR: DB-credential Secret username '${DB_USERNAME}' is not engine-issued"; exit 1
          fi
          echo "OK: DB credential is engine-issued (username '${DB_USERNAME}')"

          # ── Link 2: Keystone CR (tag / clusterRefs / merged policy) ────────
          wait_cp_condition KeystoneReady 600
          assert_eq "Keystone projected with Dynamic credentialsMode" "Dynamic" \
            "$(kubectl get keystone "${KEYSTONE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.credentialsMode}')"
          assert_eq "Keystone image tag derived from openStackRelease" "2025.2" \
            "$(kubectl get keystone "${KEYSTONE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.image.tag}')"
          assert_eq "Keystone database clusterRef wired to infra" "openstack-db" \
            "$(kubectl get keystone "${KEYSTONE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.clusterRef.name}')"
          assert_eq "Keystone cache clusterRef wired to infra" "openstack-memcached" \
            "$(kubectl get keystone "${KEYSTONE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.cache.clusterRef.name}')"
          assert_eq "Global oslo.policy override merged into Keystone CR" "role:admin" \
            "$(kubectl get keystone "${KEYSTONE_CR}" -n "${CP_NS}" -o "jsonpath={.spec.policyOverrides.rules['identity:list_users']}")"
          assert_eq "Keystone CR owned by ControlPlane" "${CP_NAME}" "$(owner_of keystone "${KEYSTONE_CR}")"

          # ── Link 2b: Horizon child (gated on KeystoneReady) ────────────────
          wait_cp_condition HorizonReady 600
          assert_eq "Horizon image tag derived from openStackRelease" "2025.2" \
            "$(kubectl get horizon "${HORIZON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.image.tag}')"
          assert_eq "Horizon cache clusterRef wired to infra" "openstack-memcached" \
            "$(kubectl get horizon "${HORIZON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.cache.clusterRef.name}')"
          # The cluster-local convention URL (same as K-ORC's auth_url) — the
          # external gateway hostname must never leak in: OPENSTACK_KEYSTONE_URL
          # is consumed server-side by the dashboard pods.
          assert_eq "Horizon keystoneEndpoint derived from the naming convention" \
            "http://${KEYSTONE_CR}.${CP_NS}.svc:5000/v3" \
            "$(kubectl get horizon "${HORIZON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.keystoneEndpoint}')"
          assert_eq "Horizon secretKeyRef overridden to the per-CP Secret" \
            "controlplane-keystone-horizon-secret-key" \
            "$(kubectl get horizon "${HORIZON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.secretKeyRef.name}')"
          assert_eq "Horizon CR owned by ControlPlane" "${CP_NAME}" "$(owner_of horizon "${HORIZON_CR}")"

          # ── Link 2c: Horizon dashboard login round-trip ────────────────────
          # A real login POST is the only check that exercises the dashboard's
          # server-side Keystone path end-to-end: Django authenticates against
          # OPENSTACK_KEYSTONE_URL and then lists the user's projects via the
          # catalog interface selected by OPENSTACK_ENDPOINT_TYPE. A login-page
          # GET renders without a live Keystone and misses both (which is how
          # an unreachable keystoneEndpoint once passed CI). Success is the 302
          # redirect plus a sessionid cookie; a failed login re-renders the
          # form with HTTP 200.
          echo "== Horizon login POST (expect 302 + sessionid) =="
          ADMIN_PW="$(kubectl get secret "${KEYSTONE_CR}-admin-credentials" -n "${CP_NS}" \
            -o 'jsonpath={.data.password}' | base64 -d)"
          kubectl run cp-horizon-login --image=ghcr.io/c5c3/keystone:2025.2 --rm -i --restart=Never \
            -n "${CP_NS}" \
            --env "HORIZON_BASE=http://${HORIZON_CR}.${CP_NS}.svc:8080" \
            --env "OS_PASSWORD=${ADMIN_PW}" \
            --command -- python3 - <<'PYEOF'
          import http.cookiejar
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          base = os.environ['HORIZON_BASE']
          login_url = base + '/auth/login/'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(jar), NoRedirect())
          body = opener.open(login_url).read().decode()
          token = re.search('name="csrfmiddlewaretoken" value="([^"]+)"', body).group(1)
          form = urllib.parse.urlencode({
              'csrfmiddlewaretoken': token,
              'region': 'default',
              'domain': 'Default',
              'username': 'admin',
              'password': os.environ['OS_PASSWORD'],
          }).encode()
          req = urllib.request.Request(login_url, data=form,
                                       headers={'Referer': login_url})
          try:
              status = opener.open(req).status
          except urllib.error.HTTPError as err:
              status = err.code
          assert status == 302, (
              'login POST returned HTTP %s (expected 302); the dashboard could '
              'not authenticate against Keystone' % status)
          assert any(c.name == 'sessionid' for c in jar), \
              'no sessionid cookie after the login redirect'
          print('OK: dashboard login round-trip succeeded (302 + sessionid)')
          PYEOF
          echo "OK: Horizon authenticated against Keystone through the cluster-local endpoint"

          # ── Link 3: K-ORC ApplicationCredential (restricted:true, owned) ───
          wait_cp_condition KORCReady 600
          # restricted:true projects to K-ORC's spec.resource.unrestricted=false.
          assert_eq "ApplicationCredential minted restricted (unrestricted=false)" "false" \
            "$(kubectl get applicationcredential "${AC_NAME}" -n "${CP_NS}" -o 'jsonpath={.spec.resource.unrestricted}')"
          assert_eq "ApplicationCredential owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of applicationcredential "${AC_NAME}")"

          # ── Link 4: credential chain → k-orc-clouds-yaml (control-plane ns) ─
          # C1: AdminCredentialReady gates on the clouds.yaml ExternalSecret in the
          # CONTROL-PLANE namespace (co-located with the K-ORC CRs K-ORC resolves
          # CloudCredentialsRef against).: the orc-system copy was
          # removed, so the clouds.yaml ExternalSecret/Secret now exists in the
          # CP_NS only — assert the gate-relevant CP_NS ExternalSecret/Secret here.
          # the CP_NS k-orc-clouds-yaml ExternalSecret and the
          # bootstrap password clouds.yaml are now seeded/created by the
          # c5c3-operator during reconcileKORC (seedBootstrapCloudsYAML +
          # ensureKORCCloudsYAMLExternalSecret), so the wait_ready_condition
          # externalsecret "${CLOUDS_SECRET}" "${CP_NS}" below observes an
          # operator-owned object — this suite waits for it, never pre-creates it.
          # the minted admin application credential now
          # round-trips through the PER-CR OpenBao path
          #   openstack/keystone/openstack/controlplane-keystone/admin/app-credential
          # (openstack/keystone/{cp.Namespace}/{cp.Name}/admin/app-credential),
          # not the former cluster-global openstack/keystone/admin/app-credential,
          # so two ControlPlanes never clobber each other's credential. The
          # PushSecret-name binding ("${CP_NAME}-admin-app-credential-backup")
          # is a K8s resource name and is unchanged. The PushSecret/ExternalSecret
          # Ready conditions below and the `openstack token issue` step in Link 7b
          # transitively verify the per-CR path: the credential is readable back
          # from exactly that key and authenticates end-to-end.
          wait_ready_condition pushsecret "${PUSH_SECRET}" "${CP_NS}" 300
          wait_ready_condition externalsecret "${CLOUDS_SECRET}" "${CP_NS}" 300
          kubectl get secret "${CLOUDS_SECRET}" -n "${CP_NS}" >/dev/null
          wait_cp_condition AdminCredentialReady 600

          # ── Link 5: catalog (K-ORC Service + Endpoint + Region, owned) ─────
          wait_cp_condition CatalogReady 600
          kubectl get services.openstack.k-orc.cloud "${SVC_CR}" -n "${CP_NS}" >/dev/null
          kubectl get endpoints.openstack.k-orc.cloud "${EP_CR}" -n "${CP_NS}" >/dev/null
          assert_eq "K-ORC identity Service owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of services.openstack.k-orc.cloud "${SVC_CR}")"
          assert_eq "K-ORC identity Endpoint owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of endpoints.openstack.k-orc.cloud "${EP_CR}")"

          # CatalogReady flips only once the described Region is Available for
          # its current generation, so no retry loop is needed here.
          kubectl get regions.openstack.k-orc.cloud "${REGION_CR}" -n "${CP_NS}" >/dev/null
          assert_eq "K-ORC Region owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of regions.openstack.k-orc.cloud "${REGION_CR}")"
          assert_eq "K-ORC Region adopted the bootstrap region" "RegionOne" \
            "$(kubectl get regions.openstack.k-orc.cloud "${REGION_CR}" -n "${CP_NS}" -o jsonpath='{.status.id}')"
          assert_eq "K-ORC Region carries spec.regionDescription" "CobaltCore e2e region" \
            "$(kubectl get regions.openstack.k-orc.cloud "${REGION_CR}" -n "${CP_NS}" -o jsonpath='{.spec.resource.description}')"
          assert_eq "K-ORC Region detaches on delete" "detach" \
            "$(kubectl get regions.openstack.k-orc.cloud "${REGION_CR}" -n "${CP_NS}" -o jsonpath='{.spec.managedOptions.onDelete}')"
          assert_eq "K-ORC Region Available" "True" \
            "$(kubectl get regions.openstack.k-orc.cloud "${REGION_CR}" -n "${CP_NS}" -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')"

          # ── Link 5b: glance + placement + barbican + neutron registrations ──
          # Each built-in service registers through a KeystoneService child the
          # ControlPlane projects, carrying both the catalog entry and the service
          # account (user glance/placement/barbican/neutron in project
          # service-{glance,placement,barbican,neutron}, role "service", which
          # Keystone's SRBAC default for identity:validate_token requires).
          #
          # Each child then has to converge on its own conditions. Ready=AllReady
          # aggregates CatalogReady and AccountReady, so a child that reports it
          # holds both its catalog rows in Keystone and a user whose password
          # round-tripped through OpenBao. The wait is the widest of the chain's
          # K-ORC legs because each registration creates a project, a user and a
          # role import before it touches the catalog at all.

          # assert_registration drives one registration to Ready and checks the role
          # binding behind its account. The RoleAssignment is looked up through the
          # ownership labels rather than by name: a registration's K-ORC children
          # carry a prefix hashed over its namespace and name, which nothing outside
          # the operator can compute.
          assert_registration() { # <keystoneservice name> <label selector>
            local ks="$1" sel="$2" ra
            wait_ready_condition keystoneservice "${ks}" "${CP_NS}" 900
            assert_eq "registration ${ks} aggregates to AllReady" "AllReady" \
              "$(kubectl get keystoneservice "${ks}" -n "${CP_NS}" \
                -o "jsonpath={.status.conditions[?(@.type=='Ready')].reason}")"
            assert_eq "registration ${ks} registered its catalog entry" "CatalogRegistered" \
              "$(kubectl get keystoneservice "${ks}" -n "${CP_NS}" \
                -o "jsonpath={.status.conditions[?(@.type=='CatalogReady')].reason}")"
            assert_eq "registration ${ks} provisioned its account" "AccountProvisioned" \
              "$(kubectl get keystoneservice "${ks}" -n "${CP_NS}" \
                -o "jsonpath={.status.conditions[?(@.type=='AccountReady')].reason}")"
            assert_eq "registration ${ks} projected exactly one RoleAssignment" "1" \
              "$(count_of roleassignments.openstack.k-orc.cloud "${CP_NS}" "${sel}")"
            for ra in $(kubectl get roleassignments.openstack.k-orc.cloud -n "${CP_NS}" -l "${sel}" \
              -o jsonpath='{.items[*].metadata.name}'); do
              assert_eq "RoleAssignment ${ra} Available" "True" \
                "$(kubectl get roleassignments.openstack.k-orc.cloud "${ra}" -n "${CP_NS}" \
                  -o "jsonpath={.status.conditions[?(@.type=='Available')].status}")"
            done
          }
          assert_registration "${GLANCE_KS}" "${GLANCE_SELECTOR}"
          assert_registration "${PLACEMENT_KS}" "${PLACEMENT_SELECTOR}"
          assert_registration "${BARBICAN_KS}" "${BARBICAN_SELECTOR}"
          assert_registration "${NEUTRON_KS}" "${NEUTRON_SELECTOR}"
          # ServiceAccountsReady aggregates these and every later registration,
          # the hypervisor operator's among them, which the Nova leg projects
          # only once the Nova child is Ready. It is therefore awaited in link
          # 5m, after NovaReady.

          # ── Link 5c: Glance child (gated on KeystoneReady + registration) ───
          # GlanceReady mirrors the child's Ready, which requires the real
          # glance-api Deployment + db-sync against MariaDB and the S3 backend —
          # this is the live end-to-end proof the envtest chain simulates.
          wait_cp_condition GlanceReady 600
          assert_eq "Glance image tag derived from openStackRelease" "2025.2" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.image.tag}')"
          assert_eq "Glance database clusterRef wired to infra" "openstack-db" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.clusterRef.name}')"
          assert_eq "Glance logical database is glance" "glance" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.database}')"
          assert_eq "Glance DB secretRef points at the projected DB-credential Secret" "${CP_NAME}-glance-db-credentials" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.secretRef.name}')"
          assert_eq "Glance projected with Dynamic credentialsMode" "Dynamic" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.credentialsMode}')"

          # ── Assert the Glance DB credential is generator-backed (engine-issued) ─
          # Named after the projected Glance CR: <cp>-glance-db-credentials.
          # The glance dynamic objects are ensured INSIDE the Keystone-gated
          # reconcileGlance rather than pre-gate like Keystone's, so these
          # assertions sit after GlanceReady. That ordering is sound because
          # reconcileGlance gates the child on this ExternalSecret reporting Ready
          # AND on the Secret behind it carrying an engine-issued username
          # (WaitingForGlanceDBCredential) before it projects credentialsMode
          # Dynamic — so GlanceReady=True already implies an engine-issued
          # credential has materialised. The username check below re-asserts that
          # end-to-end against a real ESO+OpenBao, not just the operator's gate.
          GLANCE_DB_SECRET="${GLANCE_CR}-db-credentials"
          assert_eq "Glance DB-credential ExternalSecret uses a VaultDynamicSecret generator" "VaultDynamicSecret" \
            "$(kubectl get externalsecret "${GLANCE_DB_SECRET}" -n "${CP_NS}" \
              -o "jsonpath={.spec.dataFrom[0].sourceRef.generatorRef.kind}")"
          assert_eq "Glance DB-credential ExternalSecret carries no static Data refs" "" \
            "$(kubectl get externalsecret "${GLANCE_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.data}')"
          kubectl get vaultdynamicsecret "${GLANCE_DB_SECRET}" -n "${CP_NS}" >/dev/null
          # Glance shares the ControlPlane namespace in this suite, so the
          # per-tenant engine role is glance-<CP_NS>.
          assert_eq "Glance VaultDynamicSecret reads the glance engine-role creds path" "database/mariadb/creds/glance-${CP_NS}" \
            "$(kubectl get vaultdynamicsecret "${GLANCE_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.path}')"
          kubectl get serviceaccount glance-db-creds -n "${CP_NS}" >/dev/null
          # The materialised Secret must carry the engine-issued username (a
          # transient v-kube-... login), not the static "glance" user.
          GLANCE_DB_USERNAME="$(kubectl get secret "${GLANCE_DB_SECRET}" -n "${CP_NS}" \
            -o "jsonpath={.data.username}" | base64 -d)"
          if [ "${GLANCE_DB_USERNAME}" = "glance" ] || [ -z "${GLANCE_DB_USERNAME}" ]; then
            echo "ERROR: Glance DB-credential Secret username '${GLANCE_DB_USERNAME}' is not engine-issued"; exit 1
          fi
          echo "OK: Glance DB credential is engine-issued (username '${GLANCE_DB_USERNAME}')"
          assert_eq "Glance cache clusterRef wired to infra" "openstack-memcached" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.cache.clusterRef.name}')"
          assert_eq "Glance keystoneEndpoint derived from the naming convention" \
            "http://${KEYSTONE_CR}.${CP_NS}.svc:5000/v3" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.keystoneEndpoint}')"
          assert_eq "Glance service user derived from its registration (username)" "glance" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.username}')"
          # Every built-in takes a per-service project of its own.
          assert_eq "Glance service user project" "service-glance" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.projectName}')"
          # The consumer Secret contract of the registration: <registration>-credentials.
          assert_eq "Glance service user secretRef" "${GLANCE_KS}-credentials" \
            "$(kubectl get glances.glance.openstack.c5c3.io "${GLANCE_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.secretRef.name}')"
          assert_eq "Glance CR owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of glances.glance.openstack.c5c3.io "${GLANCE_CR}")"

          # The projected GlanceBackend for the single "default" entry.
          GLANCE_BACKEND="${GLANCE_CR}-default"
          kubectl get glancebackends.glance.openstack.c5c3.io "${GLANCE_BACKEND}" -n "${CP_NS}" >/dev/null
          assert_eq "GlanceBackend attached to the Glance child" "${GLANCE_CR}" \
            "$(kubectl get glancebackends.glance.openstack.c5c3.io "${GLANCE_BACKEND}" -n "${CP_NS}" -o 'jsonpath={.spec.glanceRef.name}')"
          assert_eq "GlanceBackend is the default store" "true" \
            "$(kubectl get glancebackends.glance.openstack.c5c3.io "${GLANCE_BACKEND}" -n "${CP_NS}" -o 'jsonpath={.spec.isDefault}')"
          assert_eq "GlanceBackend S3 host is the Garage endpoint" "http://garage.shared-services.svc.cluster.local:3900" \
            "$(kubectl get glancebackends.glance.openstack.c5c3.io "${GLANCE_BACKEND}" -n "${CP_NS}" -o 'jsonpath={.spec.s3.host}')"
          assert_eq "GlanceBackend owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of glancebackends.glance.openstack.c5c3.io "${GLANCE_BACKEND}")"

          # ── Link 5d: image catalog (the registration's Service + Endpoints) ─
          # Per design decision D6 the image service registers BOTH an internal and
          # a public Endpoint at birth; with no gateway in this fixture both URLs
          # advertise the in-cluster Glance API Service.
          #
          # assert_catalog_rows checks the catalog half of one registration, and the
          # placement and key-manager links below reuse it. Every row is resolved
          # through the registration's ownership labels (its children carry a name
          # prefix hashed over its identity, which nothing outside the operator can
          # compute), and the counts are what prove these are the only rows it holds:
          # a leftover row would put a second endpoint of the same interface into the
          # Keystone catalog.
          assert_catalog_rows() { # <keystoneservice name> <label selector> <serviceType> <url>
            local ks="$1" sel="$2" want_type="$3" want_url="$4" svc ep ifaces
            assert_eq "registration ${ks} projected exactly one catalog Service" "1" \
              "$(count_of services.openstack.k-orc.cloud "${CP_NS}" "${sel}")"
            svc="$(kubectl get services.openstack.k-orc.cloud -n "${CP_NS}" -l "${sel}" \
              -o jsonpath='{.items[0].metadata.name}')"
            assert_eq "K-ORC ${want_type} Service ${svc} Available" "True" \
              "$(kubectl get services.openstack.k-orc.cloud "${svc}" -n "${CP_NS}" \
                -o "jsonpath={.status.conditions[?(@.type=='Available')].status}")"
            assert_eq "K-ORC Service ${svc} type" "${want_type}" \
              "$(kubectl get services.openstack.k-orc.cloud "${svc}" -n "${CP_NS}" \
                -o 'jsonpath={.spec.resource.type}')"
            assert_eq "registration ${ks} projected exactly two catalog Endpoints" "2" \
              "$(count_of endpoints.openstack.k-orc.cloud "${CP_NS}" "${sel}")"
            # The rows are told apart by their interfaces, not by their names, and
            # the pair is sorted so the assertion does not depend on the order the
            # API server lists them in.
            ifaces="$(kubectl get endpoints.openstack.k-orc.cloud -n "${CP_NS}" -l "${sel}" \
              -o 'jsonpath={.items[*].spec.resource.interface}' | tr ' ' '\n' | sort | xargs)"
            assert_eq "registration ${ks} advertises an internal and a public row" "internal public" "${ifaces}"
            for ep in $(kubectl get endpoints.openstack.k-orc.cloud -n "${CP_NS}" -l "${sel}" \
              -o jsonpath='{.items[*].metadata.name}'); do
              assert_eq "${want_type} Endpoint ${ep} Available" "True" \
                "$(kubectl get endpoints.openstack.k-orc.cloud "${ep}" -n "${CP_NS}" \
                  -o "jsonpath={.status.conditions[?(@.type=='Available')].status}")"
              # Both rows carry the same URL: with no gateway in this fixture the
              # public interface advertises the same in-cluster API Service.
              assert_eq "${want_type} Endpoint ${ep} URL" "${want_url}" \
                "$(kubectl get endpoints.openstack.k-orc.cloud "${ep}" -n "${CP_NS}" \
                  -o 'jsonpath={.spec.resource.url}')"
            done
          }
          IMG_URL="http://${GLANCE_CR}.${CP_NS}.svc:9292"
          assert_catalog_rows "${GLANCE_KS}" "${GLANCE_SELECTOR}" image "${IMG_URL}"

          # ── Link 5e: Placement child (gated on KeystoneReady + registration) ─
          # PlacementReady mirrors the child's Ready, which requires the real
          # placement-api Deployment + db-sync against MariaDB — this is the live
          # end-to-end proof the envtest chain simulates.
          wait_cp_condition PlacementReady 600
          assert_eq "Placement image tag derived from openStackRelease" "2025.2" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.image.tag}')"
          assert_eq "Placement database clusterRef wired to infra" "openstack-db" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.clusterRef.name}')"
          assert_eq "Placement logical database is placement" "placement" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.database}')"
          assert_eq "Placement DB secretRef points at the projected DB-credential Secret" "${CP_NAME}-placement-db-credentials" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.secretRef.name}')"
          assert_eq "Placement projected with Dynamic credentialsMode" "Dynamic" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.credentialsMode}')"

          # ── Assert the Placement DB credential is generator-backed ──────────
          # Named after the projected Placement CR: <cp>-placement-db-credentials.
          # Like Glance's, the placement dynamic objects are ensured INSIDE the
          # Keystone-gated reconcilePlacement rather than pre-gate like Keystone's,
          # so these assertions sit after PlacementReady. That ordering is sound
          # because reconcilePlacement gates the child on this ExternalSecret
          # reporting Ready AND on the Secret behind it carrying an engine-issued
          # username (WaitingForPlacementDBCredential) before it projects
          # credentialsMode Dynamic. The username check below re-asserts that
          # end-to-end against a real ESO+OpenBao, not just the operator's gate.
          PLACEMENT_DB_SECRET="${PLACEMENT_CR}-db-credentials"
          assert_eq "Placement DB-credential ExternalSecret uses a VaultDynamicSecret generator" "VaultDynamicSecret" \
            "$(kubectl get externalsecret "${PLACEMENT_DB_SECRET}" -n "${CP_NS}" \
              -o "jsonpath={.spec.dataFrom[0].sourceRef.generatorRef.kind}")"
          assert_eq "Placement DB-credential ExternalSecret carries no static Data refs" "" \
            "$(kubectl get externalsecret "${PLACEMENT_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.data}')"
          kubectl get vaultdynamicsecret "${PLACEMENT_DB_SECRET}" -n "${CP_NS}" >/dev/null
          # Placement shares the ControlPlane namespace in this suite, so the
          # per-tenant engine role is placement-<CP_NS>.
          assert_eq "Placement VaultDynamicSecret reads the placement engine-role creds path" "database/mariadb/creds/placement-${CP_NS}" \
            "$(kubectl get vaultdynamicsecret "${PLACEMENT_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.path}')"
          kubectl get serviceaccount placement-db-creds -n "${CP_NS}" >/dev/null
          # The materialised Secret must carry the engine-issued username (a
          # transient v-kube-... login), not the static "placement" user.
          PLACEMENT_DB_USERNAME="$(kubectl get secret "${PLACEMENT_DB_SECRET}" -n "${CP_NS}" \
            -o "jsonpath={.data.username}" | base64 -d)"
          if [ "${PLACEMENT_DB_USERNAME}" = "placement" ] || [ -z "${PLACEMENT_DB_USERNAME}" ]; then
            echo "ERROR: Placement DB-credential Secret username '${PLACEMENT_DB_USERNAME}' is not engine-issued"; exit 1
          fi
          echo "OK: Placement DB credential is engine-issued (username '${PLACEMENT_DB_USERNAME}')"
          assert_eq "Placement cache clusterRef wired to infra" "openstack-memcached" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.cache.clusterRef.name}')"
          assert_eq "Placement keystoneEndpoint derived from the naming convention" \
            "http://${KEYSTONE_CR}.${CP_NS}.svc:5000/v3" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.keystoneEndpoint}')"
          assert_eq "Placement service user derived from its registration (username)" "placement" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.username}')"
          assert_eq "Placement service user project" "service-placement" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.projectName}')"
          assert_eq "Placement service user secretRef" "${PLACEMENT_KS}-credentials" \
            "$(kubectl get placements.placement.openstack.c5c3.io "${PLACEMENT_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.secretRef.name}')"
          assert_eq "Placement CR owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of placements.placement.openstack.c5c3.io "${PLACEMENT_CR}")"

          # ── Link 5f: placement catalog (the registration's rows) ────────────
          # The placement service registers an internal AND a public Endpoint at
          # birth like the image one; with no gateway in this fixture both URLs
          # advertise the in-cluster Placement API Service.
          PLACEMENT_URL="http://${PLACEMENT_CR}.${CP_NS}.svc:8778"
          assert_catalog_rows "${PLACEMENT_KS}" "${PLACEMENT_SELECTOR}" placement "${PLACEMENT_URL}"

          # ── Link 5g: Barbican child + its dedicated OpenBao secret store ────
          # BarbicanReady mirrors the child's Ready, which needs the real
          # barbican-api Deployment + db-sync against MariaDB AND a secret store the
          # barbican-operator could authenticate against. The dedicated store makes
          # that second half a chain of its own, all of it inside this one wait: the
          # c5c3-operator provisions an OpenBaoCluster, the openbao-operator brings
          # it up and self-inits the KV mount, the AppRole and the Kubernetes auth
          # method, and only then can the barbican-operator log in and mint the
          # store's credentials. The window is therefore wider than the other
          # children's.
          wait_cp_condition BarbicanReady 900

          # The dedicated instance first: it is what the store is provisioned
          # against, so a store that is Ready without an Available instance would be
          # reading a server this ControlPlane did not project. deletionPolicy is
          # asserted because the deletion suite depends on it — the instance name is
          # derived from the ControlPlane name, so a retained data-<instance>-0 PVC
          # would meet the next ControlPlane of the same name with raft storage
          # sealed under a key that no longer exists.
          kubectl get openbaoclusters.openbao.org "${BARBICAN_BAO}" -n "${CP_NS}" >/dev/null
          assert_eq "dedicated OpenBaoCluster Available" "True" \
            "$(kubectl get openbaoclusters.openbao.org "${BARBICAN_BAO}" -n "${CP_NS}" \
              -o "jsonpath={.status.conditions[?(@.type=='Available')].status}")"
          # The API-server egress allowance the operator resolves from the live
          # cluster's EndpointSlice default/kubernetes. APIServerNetworkReady is the
          # openbao-operator's own verdict on it, and it is Unknown (reason
          # APIServerEndpointIPsRecommended) whenever only the in-cluster service VIP
          # is allowed — the posture kindnet stops honouring from kind 0.32 onwards,
          # where the instance then loses the API server and wedges its raft storage.
          assert_eq "dedicated OpenBaoCluster APIServerNetworkReady" "True" \
            "$(kubectl get openbaoclusters.openbao.org "${BARBICAN_BAO}" -n "${CP_NS}" \
              -o "jsonpath={.status.conditions[?(@.type=='APIServerNetworkReady')].status}")"
          BAO_API_IPS="$(kubectl get openbaoclusters.openbao.org "${BARBICAN_BAO}" -n "${CP_NS}" \
            -o 'jsonpath={.spec.network.apiServerEndpointIPs[*]}')"
          if [ -z "${BAO_API_IPS}" ]; then
            echo "ERROR: dedicated OpenBaoCluster carries no spec.network.apiServerEndpointIPs"
            exit 1
          fi
          echo "OK: dedicated OpenBaoCluster pins API-server endpoint IPs ('${BAO_API_IPS}')"
          # The image version is deliberately NOT asserted: it is a Renovate-managed
          # pin in the operator (defaultOpenBaoVersion), and a bump PR must not have
          # to edit an e2e fixture to stay green.
          assert_eq "dedicated OpenBaoCluster reaps its PVCs on delete" "DeletePVCs" \
            "$(kubectl get openbaoclusters.openbao.org "${BARBICAN_BAO}" -n "${CP_NS}" -o 'jsonpath={.spec.deletionPolicy}')"
          assert_eq "dedicated OpenBaoCluster owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of openbaoclusters.openbao.org "${BARBICAN_BAO}")"
          # No ControlPlane-owned OpenBaoTenant is asserted here ON PURPOSE: the kind
          # overlay's proving instance already runs a tenant targeting the openstack
          # namespace, and the operator skips its own rather than admitting the
          # namespace twice (two finalizers over one namespace).
          kubectl get secret "${BARBICAN_BAO}-unseal-key" -n "${CP_NS}" >/dev/null
          kubectl get serviceaccount "${BARBICAN_BAO}-provisioner" -n "${CP_NS}" >/dev/null
          # The cluster-scoped auth-delegator binding carries a hash of the
          # instance's namespace in its name (two same-named ControlPlanes in
          # different namespaces must not collide on it), so it is looked up by the
          # ownership labels the projection stamps rather than by a derived name.
          [ -n "$(kubectl get clusterrolebinding \
            -l "c5c3.io/controlplane-name=${CP_NAME},c5c3.io/controlplane-namespace=${CP_NS}" \
            -o jsonpath='{.items[*].metadata.name}')" ]

          # The store attaches the child to that instance. Ready=AllReady aggregates
          # its ProvisioningReady / CredentialsReady / ConfigProjected
          # sub-conditions, so it only turns True once the operator has mounted the
          # KV path and minted an AppRole secret ID the server accepts.
          kubectl get barbicansecretstores.barbican.openstack.c5c3.io "${BARBICAN_STORE}" -n "${CP_NS}" >/dev/null
          wait_ready_condition barbicansecretstores.barbican.openstack.c5c3.io "${BARBICAN_STORE}" "${CP_NS}" 600
          assert_eq "BarbicanSecretStore Ready reason" "AllReady" \
            "$(kubectl get barbicansecretstores.barbican.openstack.c5c3.io "${BARBICAN_STORE}" -n "${CP_NS}" \
              -o "jsonpath={.status.conditions[?(@.type=='Ready')].reason}")"
          assert_eq "BarbicanSecretStore points at the dedicated instance" "${BARBICAN_BAO}" \
            "$(kubectl get barbicansecretstores.barbican.openstack.c5c3.io "${BARBICAN_STORE}" -n "${CP_NS}" \
              -o 'jsonpath={.spec.openBao.instanceRef.name}')"
          assert_eq "BarbicanSecretStore is the Barbican's default store" "true" \
            "$(kubectl get barbicansecretstores.barbican.openstack.c5c3.io "${BARBICAN_STORE}" -n "${CP_NS}" \
              -o 'jsonpath={.spec.isDefault}')"
          assert_eq "BarbicanSecretStore owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of barbicansecretstores.barbican.openstack.c5c3.io "${BARBICAN_STORE}")"
          # The AppRole credentials Secret the barbican-operator mints for the store
          # (<store>-approle, keys role-id/secret-id). It is what the API pods source
          # OS_VAULT_PLUGIN__APPROLE_SECRET_ID from, so an empty one would leave the
          # pods unable to reach their own key material.
          kubectl get secret "${BARBICAN_STORE}-approle" -n "${CP_NS}" >/dev/null
          for key in role-id secret-id; do
            if [ -z "$(kubectl get secret "${BARBICAN_STORE}-approle" -n "${CP_NS}" -o "jsonpath={.data.${key}}")" ]; then
              echo "ERROR: AppRole Secret ${BARBICAN_STORE}-approle carries no ${key} data key"; exit 1
            fi
          done
          echo "OK: AppRole Secret ${BARBICAN_STORE}-approle carries role-id and secret-id"
          assert_eq "Barbican child aggregated its stores" "AllStoresProjected" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" \
              -o "jsonpath={.status.conditions[?(@.type=='SecretStoresReady')].reason}")"

          # The child itself, on the Placement child's terms.
          assert_eq "Barbican image tag derived from openStackRelease" "2025.2" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.image.tag}')"
          assert_eq "Barbican database clusterRef wired to infra" "openstack-db" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.clusterRef.name}')"
          assert_eq "Barbican logical database is barbican" "barbican" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.database}')"
          assert_eq "Barbican DB secretRef points at the projected DB-credential Secret" "${BARBICAN_CR}-db-credentials" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.secretRef.name}')"
          assert_eq "Barbican projected with Dynamic credentialsMode" "Dynamic" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.credentialsMode}')"

          # ── Assert the Barbican DB credential is generator-backed ───────────
          # Same shape and same ordering rationale as the Glance and Placement
          # checks: the dynamic objects are ensured inside the Keystone-gated
          # reconcileBarbican, and the child only reaches Dynamic once an
          # engine-issued credential has materialised. Barbican shares the
          # ControlPlane namespace here, so the per-tenant engine role is
          # barbican-<CP_NS>.
          BARBICAN_DB_SECRET="${BARBICAN_CR}-db-credentials"
          assert_eq "Barbican DB-credential ExternalSecret uses a VaultDynamicSecret generator" "VaultDynamicSecret" \
            "$(kubectl get externalsecret "${BARBICAN_DB_SECRET}" -n "${CP_NS}" \
              -o "jsonpath={.spec.dataFrom[0].sourceRef.generatorRef.kind}")"
          assert_eq "Barbican DB-credential ExternalSecret carries no static Data refs" "" \
            "$(kubectl get externalsecret "${BARBICAN_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.data}')"
          kubectl get vaultdynamicsecret "${BARBICAN_DB_SECRET}" -n "${CP_NS}" >/dev/null
          assert_eq "Barbican VaultDynamicSecret reads the barbican engine-role creds path" "database/mariadb/creds/barbican-${CP_NS}" \
            "$(kubectl get vaultdynamicsecret "${BARBICAN_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.path}')"
          kubectl get serviceaccount barbican-db-creds -n "${CP_NS}" >/dev/null
          BARBICAN_DB_USERNAME="$(kubectl get secret "${BARBICAN_DB_SECRET}" -n "${CP_NS}" \
            -o "jsonpath={.data.username}" | base64 -d)"
          if [ "${BARBICAN_DB_USERNAME}" = "barbican" ] || [ -z "${BARBICAN_DB_USERNAME}" ]; then
            echo "ERROR: Barbican DB-credential Secret username '${BARBICAN_DB_USERNAME}' is not engine-issued"; exit 1
          fi
          echo "OK: Barbican DB credential is engine-issued (username '${BARBICAN_DB_USERNAME}')"
          assert_eq "Barbican cache clusterRef wired to infra" "openstack-memcached" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.cache.clusterRef.name}')"
          assert_eq "Barbican keystoneEndpoint derived from the naming convention" \
            "http://${KEYSTONE_CR}.${CP_NS}.svc:5000/v3" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.keystoneEndpoint}')"
          assert_eq "Barbican service user derived from its registration (username)" "barbican" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.username}')"
          assert_eq "Barbican service user project" "service-barbican" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.projectName}')"
          assert_eq "Barbican service user secretRef" "${BARBICAN_KS}-credentials" \
            "$(kubectl get barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.secretRef.name}')"
          assert_eq "Barbican CR owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of barbicans.barbican.openstack.c5c3.io "${BARBICAN_CR}")"

          # ── Link 5h: key-manager catalog (the registration's rows) ──────────
          # The key-manager service registers an internal AND a public Endpoint at
          # birth like the image and placement ones; with no gateway in this fixture
          # both URLs advertise the in-cluster Barbican API Service.
          BARBICAN_URL="http://${BARBICAN_CR}.${CP_NS}.svc:9311"
          assert_catalog_rows "${BARBICAN_KS}" "${BARBICAN_SELECTOR}" key-manager "${BARBICAN_URL}"

          # ── Link 5i: OVN gate + Neutron child (the network service) ────────
          # Two gates stand in front of this child that no peer has. OVNReady
          # owns nothing: it mirrors the readiness of the standalone OVNCentral
          # applied above, so it turns True once that central serves both
          # databases and has published its client Secret. NeutronReady then
          # needs the bus Secret delivered beside the child, the registration,
          # the engine-issued DB credential, and the child's own Ready, which
          # waits on db-sync, on the OVN client certificate mirrored out of the
          # central's clientSecretName, and on the API Deployment. That is a
          # longer chain than any peer's, so the window is wider.
          wait_cp_condition OVNReady 300
          assert_eq "OVNReady reason is OVNCentralReady" "OVNCentralReady" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" \
              -o "jsonpath={.status.conditions[?(@.type=='OVNReady')].reason}")"

          # The chassis attaches to the same central, and it is applied here
          # rather than beside the compute leg because its pods need the OVN
          # control plane to be serving before they can register. Neutron binds a
          # port only to a host that has a live chassis row in the Southbound
          # database, so the compute leg below would have every port of the
          # booted server left unbound without it. Like the central, the chassis
          # is applied inside the script and behind the gate: a separate apply
          # step would hard-fail on a devstack that carries no OVN CRD.
          kubectl apply -f 04-ovnchassis-cr.yaml
          kubectl wait ovnchassis/"${CP_NAME}"-chassis -n "${CP_NS}" \
            --for=condition=Ready --timeout=300s
          echo "OK: OVNChassis ${CP_NAME}-chassis Ready on node ${NODE}"

          wait_cp_condition NeutronReady 900

          assert_eq "Neutron image tag derived from openStackRelease" "2025.2" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.image.tag}')"
          assert_eq "Neutron database clusterRef wired to infra" "openstack-db" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.clusterRef.name}')"
          assert_eq "Neutron logical database is neutron" "neutron" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.database}')"
          assert_eq "Neutron DB secretRef points at the projected DB-credential Secret" "${NEUTRON_CR}-db-credentials" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.secretRef.name}')"
          assert_eq "Neutron projected with Dynamic credentialsMode" "Dynamic" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.credentialsMode}')"

          # ── Assert the Neutron DB credential is generator-backed ────────────
          # Same shape and same ordering rationale as the Glance, Placement and
          # Barbican checks: the dynamic objects are ensured inside the
          # Keystone-gated reconcileNeutron, and the child only reaches Dynamic
          # once an engine-issued credential has materialised. Neutron shares the
          # ControlPlane namespace here, so the per-tenant engine role is
          # neutron-<CP_NS>.
          NEUTRON_DB_SECRET="${NEUTRON_CR}-db-credentials"
          assert_eq "Neutron DB-credential ExternalSecret uses a VaultDynamicSecret generator" "VaultDynamicSecret" \
            "$(kubectl get externalsecret "${NEUTRON_DB_SECRET}" -n "${CP_NS}" \
              -o "jsonpath={.spec.dataFrom[0].sourceRef.generatorRef.kind}")"
          assert_eq "Neutron DB-credential ExternalSecret carries no static Data refs" "" \
            "$(kubectl get externalsecret "${NEUTRON_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.data}')"
          kubectl get vaultdynamicsecret "${NEUTRON_DB_SECRET}" -n "${CP_NS}" >/dev/null
          assert_eq "Neutron VaultDynamicSecret reads the neutron engine-role creds path" "database/mariadb/creds/neutron-${CP_NS}" \
            "$(kubectl get vaultdynamicsecret "${NEUTRON_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.path}')"
          kubectl get serviceaccount neutron-db-creds -n "${CP_NS}" >/dev/null
          NEUTRON_DB_USERNAME="$(kubectl get secret "${NEUTRON_DB_SECRET}" -n "${CP_NS}" \
            -o "jsonpath={.data.username}" | base64 -d)"
          if [ "${NEUTRON_DB_USERNAME}" = "neutron" ] || [ -z "${NEUTRON_DB_USERNAME}" ]; then
            echo "ERROR: Neutron DB-credential Secret username '${NEUTRON_DB_USERNAME}' is not engine-issued"; exit 1
          fi
          echo "OK: Neutron DB credential is engine-issued (username '${NEUTRON_DB_USERNAME}')"
          assert_eq "Neutron cache clusterRef wired to infra" "openstack-memcached" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.cache.clusterRef.name}')"
          assert_eq "Neutron keystoneEndpoint derived from the naming convention" \
            "http://${KEYSTONE_CR}.${CP_NS}.svc:5000/v3" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.keystoneEndpoint}')"
          assert_eq "Neutron service user derived from its registration (username)" "neutron" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.username}')"
          assert_eq "Neutron service user project" "service-neutron" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.projectName}')"
          assert_eq "Neutron service user secretRef" "${NEUTRON_KS}-credentials" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.secretRef.name}')"

          # The bus reaches the child as a brownfield secretRef naming the Secret
          # the ControlPlane wrote beside it, never the source Secret
          # spec.infrastructure.messaging references: the delivered one is what
          # the plane writes, refuses to adopt and tears down with itself.
          assert_eq "Neutron messaging secretRef points at the delivered bus Secret" "${CP_NAME}-neutron-messaging" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.messaging.secretRef.name}')"
          kubectl get secret "${CP_NAME}-neutron-messaging" -n "${CP_NS}" >/dev/null

          # The OVN control plane, with the namespace RESOLVED by the ControlPlane
          # rather than left for the child to default: the fixture leaves
          # centralRef.namespace empty and the plane fills in its own.
          assert_eq "Neutron ovn centralRef names the applied OVNCentral" "controlplane-keystone-ovn" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.ovn.centralRef.name}')"
          assert_eq "Neutron ovn centralRef namespace defaulted to the ControlPlane's own" "openstack" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.ovn.centralRef.namespace}')"
          assert_eq "Neutron RPC workers sized from the Minimal profile" "1" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.workers.deployment.replicas}')"
          assert_eq "Neutron CR owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}")"

          # ── Link 5j: network catalog (the registration's rows) ──────────────
          # The network service registers an internal AND a public Endpoint at
          # birth like its peers; with no gateway in this fixture both URLs
          # advertise the in-cluster Neutron API Service.
          NEUTRON_URL="http://${NEUTRON_CR}.${CP_NS}.svc:9696"
          assert_catalog_rows "${NEUTRON_KS}" "${NEUTRON_SELECTOR}" network "${NEUTRON_URL}"

          # ── Link 5k: Cinder child + satellites (the block-storage service) ──
          # The widest window in the suite, and it buys the most. CinderReady
          # needs the delivered bus Secret, the registration and the account IDs
          # it publishes, the engine-issued DB credential, and the child's own
          # Ready, which waits on db-sync, on the API Deployment, and on one
          # cinder-volume and one cinder-backup pod that each have to mount an NFS
          # share before they report anything.
          wait_cp_condition CinderReady 900

          assert_eq "Cinder image tag derived from openStackRelease" "2025.2" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.image.tag}')"
          assert_eq "Cinder database clusterRef wired to infra" "openstack-db" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.clusterRef.name}')"
          assert_eq "Cinder logical database is cinder" "cinder" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.database}')"
          assert_eq "Cinder DB secretRef points at the projected DB-credential Secret" "${CINDER_CR}-db-credentials" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.secretRef.name}')"
          assert_eq "Cinder projected with Dynamic credentialsMode" "Dynamic" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.credentialsMode}')"

          # ── Assert the Cinder DB credential is generator-backed ─────────────
          # Same shape and same ordering rationale as the peers above: the dynamic
          # objects are ensured inside the Keystone-gated reconcileCinder, and the
          # child only reaches Dynamic once an engine-issued credential has
          # materialised. Cinder shares the ControlPlane namespace here, so the
          # per-tenant engine role is cinder-<CP_NS>.
          CINDER_DB_SECRET="${CINDER_CR}-db-credentials"
          assert_eq "Cinder DB-credential ExternalSecret uses a VaultDynamicSecret generator" "VaultDynamicSecret" \
            "$(kubectl get externalsecret "${CINDER_DB_SECRET}" -n "${CP_NS}" \
              -o "jsonpath={.spec.dataFrom[0].sourceRef.generatorRef.kind}")"
          assert_eq "Cinder DB-credential ExternalSecret carries no static Data refs" "" \
            "$(kubectl get externalsecret "${CINDER_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.data}')"
          kubectl get vaultdynamicsecret "${CINDER_DB_SECRET}" -n "${CP_NS}" >/dev/null
          assert_eq "Cinder VaultDynamicSecret reads the cinder engine-role creds path" "database/mariadb/creds/cinder-${CP_NS}" \
            "$(kubectl get vaultdynamicsecret "${CINDER_DB_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.path}')"
          kubectl get serviceaccount cinder-db-creds -n "${CP_NS}" >/dev/null
          CINDER_DB_USERNAME="$(kubectl get secret "${CINDER_DB_SECRET}" -n "${CP_NS}" \
            -o "jsonpath={.data.username}" | base64 -d)"
          if [ "${CINDER_DB_USERNAME}" = "cinder" ] || [ -z "${CINDER_DB_USERNAME}" ]; then
            echo "ERROR: Cinder DB-credential Secret username '${CINDER_DB_USERNAME}' is not engine-issued"; exit 1
          fi
          echo "OK: Cinder DB credential is engine-issued (username '${CINDER_DB_USERNAME}')"

          assert_eq "Cinder cache clusterRef wired to infra" "openstack-memcached" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.cache.clusterRef.name}')"
          assert_eq "Cinder keystoneEndpoint derived from the naming convention" \
            "http://${KEYSTONE_CR}.${CP_NS}.svc:5000/v3" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.keystoneEndpoint}')"
          assert_eq "Cinder service user derived from its registration (username)" "cinder" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.username}')"
          assert_eq "Cinder service user project" "service-cinder" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.projectName}')"
          assert_eq "Cinder service user secretRef" "${CINDER_KS}-credentials" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.secretRef.name}')"

          # The bus reaches the child as its own delivered Secret, never the source
          # the ControlPlane read, on the rule the Neutron link documents.
          assert_eq "Cinder messaging secretRef points at the delivered bus Secret" "${CP_NAME}-cinder-messaging" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.messaging.secretRef.name}')"
          kubectl get secret "${CP_NAME}-cinder-messaging" -n "${CP_NS}" >/dev/null

          # Glance and Barbican are siblings rather than gates, so the two
          # endpoints only prove the plane wired the declared services together:
          # Cinder pulls an image through the first and stores volume-encryption
          # keys through the second. The verify Job exercises both for real.
          assert_eq "Cinder glanceEndpoint points at the projected Glance" \
            "http://${GLANCE_CR}.${CP_NS}.svc:9292" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.glanceEndpoint}')"
          assert_eq "Cinder key manager points at the projected Barbican" \
            "http://${BARBICAN_CR}.${CP_NS}.svc:9311" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.keyManager.barbican.endpoint}')"

          # The internal tenant the image-volume cache owns its cached volumes as.
          # Cinder passes both IDs to the volume API without resolving them, so the
          # only projectable pair is the one Keystone assigned, which the
          # registration publishes on its account status. Reading the expected
          # value off that status is the point: a hardcoded ID would pass against a
          # projection that invented one.
          CINDER_ACCOUNT_PROJECT="$(kubectl get keystoneservice "${CINDER_KS}" -n "${CP_NS}" \
            -o 'jsonpath={.status.account.projectID}')"
          CINDER_ACCOUNT_USER="$(kubectl get keystoneservice "${CINDER_KS}" -n "${CP_NS}" \
            -o 'jsonpath={.status.account.userID}')"
          if [ -z "${CINDER_ACCOUNT_PROJECT}" ] || [ -z "${CINDER_ACCOUNT_USER}" ]; then
            echo "ERROR: registration ${CINDER_KS} published no status.account project/user ID"; exit 1
          fi
          assert_eq "Cinder internal tenant carries the registration's project" "${CINDER_ACCOUNT_PROJECT}" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.internalTenant.projectID}')"
          assert_eq "Cinder internal tenant carries the registration's user" "${CINDER_ACCOUNT_USER}" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.internalTenant.userID}')"

          assert_eq "Cinder API replicas sized from the Minimal profile" "1" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.api.deployment.replicas}')"
          assert_eq "Cinder CR owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of cinders.cinder.openstack.c5c3.io "${CINDER_CR}")"

          # The two satellites carry the BARE entry names, not names prefixed with
          # the ControlPlane's: cinder keys every volume by the backend it was
          # created on, so a rename would strand the volumes already there. Each
          # attaches to the child by cinderRef (inverted attachment) and is owned by
          # the plane.
          assert_eq "CinderBackend nfs1 attaches to the projected Cinder" "${CINDER_CR}" \
            "$(kubectl get cinderbackends.cinder.openstack.c5c3.io nfs1 -n "${CP_NS}" -o 'jsonpath={.spec.cinderRef.name}')"
          assert_eq "CinderBackend nfs1 owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of cinderbackends.cinder.openstack.c5c3.io nfs1)"
          assert_eq "CinderBackupBackend nfsbk attaches to the projected Cinder" "${CINDER_CR}" \
            "$(kubectl get cinderbackupbackends.cinder.openstack.c5c3.io nfsbk -n "${CP_NS}" -o 'jsonpath={.spec.cinderRef.name}')"
          assert_eq "CinderBackupBackend nfsbk owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of cinderbackupbackends.cinder.openstack.c5c3.io nfsbk)"
          # The host identity the backend's cinder-volume registers under. It is
          # what the volumes on that backend are keyed by, so it has to be derived
          # from the projected child's name and the entry's, not from either alone.
          assert_eq "Cinder reports the projected backend's host identity" "${CINDER_CR}@nfs1" \
            "$(kubectl get cinders.cinder.openstack.c5c3.io "${CINDER_CR}" -n "${CP_NS}" -o 'jsonpath={.status.volumeServices[0].host}')"

          # ── Link 5l: block-storage catalog (the registration's rows) ────────
          # The block-storage service registers an internal AND a public Endpoint
          # at birth like its peers; with no gateway in this fixture both URLs
          # advertise the in-cluster Cinder API Service, on the project-less /v3
          # path (decision D8 of #979).
          CINDER_URL="http://${CINDER_CR}.${CP_NS}.svc:8776/v3"
          assert_catalog_rows "${CINDER_KS}" "${CINDER_SELECTOR}" block-storage "${CINDER_URL}"

          # ── Link 5m: Nova child + its two DB chains (the compute service) ───
          # The widest projection of the chain. NovaReady needs the delivered bus
          # Secret, the registration, TWO engine-issued DB credentials, the
          # generated metadata shared secret, and the child's own Ready, which
          # waits on the db-sync of both schemas and on five Deployments (API,
          # metadata, scheduler, conductor, console proxy). That is more than any
          # peer, so the window matches the widest one already in the suite.
          wait_cp_condition NovaReady 900
          assert_eq "NovaReady reason is NovaReady" "NovaReady" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" \
              -o "jsonpath={.status.conditions[?(@.type=='NovaReady')].reason}")"

          # ServiceAccountsReady aggregates every built-in registration. The
          # last one, the hypervisor operator's account, is projected only once
          # the Nova child is Ready, and NovaReady=True above means its password
          # has been delivered, so the aggregate is due now.
          wait_cp_condition ServiceAccountsReady 600
          assert_eq "ServiceAccountsReady aggregates the projected registrations" "ServiceAccountsProvisioned" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" \
              -o "jsonpath={.status.conditions[?(@.type=='ServiceAccountsReady')].reason}")"

          assert_eq "Nova image tag derived from openStackRelease" "2025.2" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.image.tag}')"

          # Nova is the only service whose state lives in two logical databases:
          # the API schema holds the cell map, the flavors and the instance
          # mappings, the cell schema holds the instances themselves. They are
          # separate databases with separate credentials, so the projection wires
          # two of everything and the assertions below cover both halves.
          NOVA_API_DB_SECRET="${NOVA_CR}-api-db-credentials"
          NOVA_CELL_DB_SECRET="${NOVA_CR}-db-credentials"
          assert_eq "Nova API database clusterRef wired to infra" "openstack-db" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.apiDatabase.clusterRef.name}')"
          assert_eq "Nova API logical database is nova_api" "nova_api" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.apiDatabase.database}')"
          assert_eq "Nova API DB secretRef points at the projected API DB-credential Secret" "${NOVA_API_DB_SECRET}" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.apiDatabase.secretRef.name}')"
          assert_eq "Nova API database projected with Dynamic credentialsMode" "Dynamic" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.apiDatabase.credentialsMode}')"
          assert_eq "Nova cell database clusterRef wired to infra" "openstack-db" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.clusterRef.name}')"
          assert_eq "Nova cell logical database is nova" "nova" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.database}')"
          assert_eq "Nova cell DB secretRef points at the projected cell DB-credential Secret" "${NOVA_CELL_DB_SECRET}" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.secretRef.name}')"
          assert_eq "Nova cell database projected with Dynamic credentialsMode" "Dynamic" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.database.credentialsMode}')"

          # ── Assert both Nova DB credentials are generator-backed ────────────
          # Same shape and same ordering rationale as the peers above: the
          # dynamic objects are ensured inside the Keystone-gated reconcileNova,
          # and the child only reaches Dynamic once an engine-issued credential
          # has materialised. The two chains differ in the engine role they draw
          # from and the ServiceAccount whose token buys the lease, so one helper
          # drives the pair.
          assert_nova_db_credential() { # <name> <engine role> <serviceaccount> <static user>
            local name="$1" role="$2" sa="$3" static="$4" username
            assert_eq "Nova ${name} ExternalSecret uses a VaultDynamicSecret generator" "VaultDynamicSecret" \
              "$(kubectl get externalsecret "${name}" -n "${CP_NS}" \
                -o "jsonpath={.spec.dataFrom[0].sourceRef.generatorRef.kind}")"
            assert_eq "Nova ${name} ExternalSecret carries no static Data refs" "" \
              "$(kubectl get externalsecret "${name}" -n "${CP_NS}" -o 'jsonpath={.spec.data}')"
            kubectl get vaultdynamicsecret "${name}" -n "${CP_NS}" >/dev/null
            assert_eq "Nova ${name} VaultDynamicSecret reads the ${role} engine-role creds path" \
              "database/mariadb/creds/${role}" \
              "$(kubectl get vaultdynamicsecret "${name}" -n "${CP_NS}" -o 'jsonpath={.spec.path}')"
            kubectl get serviceaccount "${sa}" -n "${CP_NS}" >/dev/null
            # The materialised Secret must carry the engine-issued username (a
            # transient v-kube-... login), not the static schema user.
            username="$(kubectl get secret "${name}" -n "${CP_NS}" -o 'jsonpath={.data.username}' | base64 -d)"
            if [ "${username}" = "${static}" ] || [ -z "${username}" ]; then
              echo "ERROR: Nova ${name} Secret username '${username}' is not engine-issued"; exit 1
            fi
            echo "OK: Nova ${name} is engine-issued (username '${username}')"
          }
          # Nova shares the ControlPlane namespace in this suite, so the
          # per-tenant engine roles are nova-api-<CP_NS> and nova-cell-<CP_NS>.
          # The cell role reads "nova-cell-" rather than "nova-" because no role
          # name may be a hyphen-prefix of another: the per-tenant name is
          # <role>-<namespace>, which flattens a role "nova" in namespace "api-x"
          # and a role "nova-api" in namespace "x" onto one name.
          assert_nova_db_credential "${NOVA_API_DB_SECRET}" "nova-api-${CP_NS}" nova-api-db-creds nova_api
          assert_nova_db_credential "${NOVA_CELL_DB_SECRET}" "nova-cell-${CP_NS}" nova-cell-db-creds nova

          assert_eq "Nova cache clusterRef wired to infra" "openstack-memcached" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.cache.clusterRef.name}')"
          assert_eq "Nova keystoneEndpoint derived from the naming convention" \
            "http://${KEYSTONE_CR}.${CP_NS}.svc:5000/v3" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.keystoneEndpoint}')"
          assert_eq "Nova service user derived from its registration (username)" "nova" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.username}')"
          assert_eq "Nova service user project" "service-nova" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.projectName}')"
          assert_eq "Nova service user secretRef" "${NOVA_KS}-credentials" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.serviceUser.secretRef.name}')"

          # The bus reaches the child as its own delivered Secret, never the
          # source the ControlPlane read, on the rule the Neutron link documents.
          assert_eq "Nova messaging secretRef points at the delivered bus Secret" "${CP_NAME}-nova-messaging" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.messaging.secretRef.name}')"
          kubectl get secret "${CP_NAME}-nova-messaging" -n "${CP_NS}" >/dev/null

          # The two optional client sections follow the declared services: this
          # plane runs block storage and a key manager, so nova may attach a
          # volume and read an encrypted volume's key. Neither endpoint is
          # overridden: the catalog's internal rows already carry the managed
          # in-cluster URLs.
          assert_eq "Nova cinder client section switched on by the declared block-storage service" "true" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.endpoints.cinder.enabled}')"
          assert_eq "Nova barbican client section switched on by the declared key manager" "true" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.endpoints.barbican.enabled}')"

          # ── The generated metadata shared secret ────────────────────────────
          # The value the metadata agent signs a proxied instance request with
          # and the compute service checks that signature against. The
          # ControlPlane sees both sides, so it GENERATES the value through ESO
          # rather than asking for one, and writes two references without ever
          # reading it. The verify Job's 403 on a wrong signature is what proves
          # the generated value reached the Nova side.
          NOVA_METADATA_SECRET="${NOVA_CR}-metadata-secret"
          assert_eq "Nova metadata sharedSecretRef names the generated Secret" "${NOVA_METADATA_SECRET}" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.metadata.sharedSecretRef.name}')"
          assert_eq "the metadata shared secret is minted by a Password generator" "Password" \
            "$(kubectl get externalsecret "${NOVA_METADATA_SECRET}" -n "${CP_NS}" \
              -o "jsonpath={.spec.dataFrom[0].sourceRef.generatorRef.kind}")"
          # Zero turns the periodic sync off. A Password generator mints a NEW
          # value on every read, so a refreshing ExternalSecret would rotate the
          # secret out from under the agent already signing with it.
          assert_eq "the metadata shared-secret ExternalSecret does not refresh" "0s" \
            "$(kubectl get externalsecret "${NOVA_METADATA_SECRET}" -n "${CP_NS}" -o 'jsonpath={.spec.refreshInterval}')"
          kubectl get passwords.generators.external-secrets.io "${NOVA_METADATA_SECRET}" -n "${CP_NS}" >/dev/null
          # The ExternalSecret renames the generator's "password" key to
          # shared_secret, the key both consumers default their reference to.
          NOVA_METADATA_VALUE="$(kubectl get secret "${NOVA_METADATA_SECRET}" -n "${CP_NS}" \
            -o 'jsonpath={.data.shared_secret}' | base64 -d)"
          if [ -z "${NOVA_METADATA_VALUE}" ]; then
            echo "ERROR: the metadata shared-secret Secret ${NOVA_METADATA_SECRET} carries no shared_secret key"; exit 1
          fi
          echo "OK: the metadata shared secret materialised (${#NOVA_METADATA_VALUE} characters)"

          # The compute contract: the nova.conf fragment and the bus credentials
          # a nova-compute needs to join this plane. 06-fake-compute.yaml mounts
          # exactly this Secret, which is why the fixture is applied only after
          # this assertion holds.
          assert_eq "Nova publishes the compute contract Secret" "${NOVA_CR}-compute-config" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.status.computeConfigSecretRef.name}')"
          kubectl get secret "${NOVA_CR}-compute-config" -n "${CP_NS}" >/dev/null

          # The four replica counts the ControlPlane sizes. They are asserted
          # together because three of them are written EXPLICITLY by the
          # projection: their deployment blocks are struct values, so the API
          # server materialises the shared default of three into each one before
          # the nova defaulting webhook (which only reaches an ABSENT block) can
          # say otherwise, and a projection that left them alone would run three
          # metadata APIs, three schedulers and three conductors on one node.
          assert_eq "Nova API replicas sized from the Minimal profile" "1" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.api.deployment.replicas}')"
          assert_eq "Nova metadata replicas sized from the Minimal profile" "1" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.metadata.deployment.replicas}')"
          assert_eq "Nova scheduler replicas sized from the Minimal profile" "1" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.scheduler.deployment.replicas}')"
          assert_eq "Nova conductor replicas sized from the Minimal profile" "1" \
            "$(kubectl get novas.nova.openstack.c5c3.io "${NOVA_CR}" -n "${CP_NS}" -o 'jsonpath={.spec.conductor.deployment.replicas}')"
          assert_eq "Nova CR owned by ControlPlane" "${CP_NAME}" \
            "$(owner_of novas.nova.openstack.c5c3.io "${NOVA_CR}")"

          # ── Link 5n: compute catalog (the registration's rows) ──────────────
          # The compute service registers an internal AND a public Endpoint at
          # birth like its peers; with no gateway in this fixture both URLs
          # advertise the in-cluster Nova API Service on the /v2.1 path the
          # compute API is served under.
          NOVA_URL="http://${NOVA_CR}.${CP_NS}.svc:8774/v2.1"
          assert_catalog_rows "${NOVA_KS}" "${NOVA_SELECTOR}" compute "${NOVA_URL}"

          # ── Link 5o: the Neutron → Nova notifier leg ───────────────────────
          # The wire between the two services: neutron posts a port's status
          # changes to the compute API, and it authenticates as an account of its
          # own rather than as itself. The block below only exists because this
          # plane declares both services, which is what makes it the one thing
          # neither the Neutron nor the Nova link can assert alone.
          assert_eq "Neutron notifier authenticates as the notifier account" "neutron-nova" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" \
              -o 'jsonpath={.spec.nova.serviceUser.username}')"
          assert_eq "Neutron notifier password comes from the notifier registration's Secret" \
            "${NOTIFIER_KS}-credentials" \
            "$(kubectl get neutrons.neutron.openstack.c5c3.io "${NEUTRON_CR}" -n "${CP_NS}" \
              -o 'jsonpath={.spec.nova.serviceUser.secretRef.name}')"
          # The password never reaches the rendered configuration: the neutron
          # operator injects it as an env override on the API Deployment and on
          # the workers, so the Deployment is where the wiring is visible.
          assert_eq "neutron-server sources OS_NOVA__PASSWORD from that Secret" "${NOTIFIER_KS}-credentials" \
            "$(kubectl get deployment "${NEUTRON_CR}" -n "${CP_NS}" \
              -o "jsonpath={.spec.template.spec.containers[0].env[?(@.name=='OS_NOVA__PASSWORD')].valueFrom.secretKeyRef.name}")"

          # The registration behind that Secret carries an ACCOUNT ALONE: a user
          # another service authenticates as answers no requests itself, so it
          # has no endpoint to advertise.
          wait_ready_condition keystoneservice "${NOTIFIER_KS}" "${CP_NS}" 900
          assert_eq "notifier registration ${NOTIFIER_KS} carries no catalog entry" "" \
            "$(kubectl get keystoneservice "${NOTIFIER_KS}" -n "${CP_NS}" -o 'jsonpath={.spec.catalog}')"
          assert_eq "notifier registration provisions the neutron-nova user" "neutron-nova" \
            "$(kubectl get keystoneservice "${NOTIFIER_KS}" -n "${CP_NS}" -o 'jsonpath={.spec.account.userName}')"
          assert_eq "notifier registration names the network service's project" "service-neutron" \
            "$(kubectl get keystoneservice "${NOTIFIER_KS}" -n "${CP_NS}" -o 'jsonpath={.spec.account.project.name}')"
          # That project is REFERENCED, not created: the network service's own
          # registration owns service-neutron, and a second creator would have
          # the first teardown delete it underneath. The field is omitempty, so
          # an unset value and an explicit false both mean "referenced".
          NOTIFIER_CREATES_PROJECT="$(kubectl get keystoneservice "${NOTIFIER_KS}" -n "${CP_NS}" \
            -o 'jsonpath={.spec.account.project.create}')"
          if [ -n "${NOTIFIER_CREATES_PROJECT}" ] && [ "${NOTIFIER_CREATES_PROJECT}" != "false" ]; then
            echo "ERROR: notifier registration ${NOTIFIER_KS} creates service-neutron (create='${NOTIFIER_CREATES_PROJECT}'); the network service's own registration owns it"
            exit 1
          fi
          echo "OK: notifier registration ${NOTIFIER_KS} references rather than creates service-neutron"
          # service alone is not enough here, and it is the one place in the
          # chain where that is true of an account nobody serves requests as:
          # nova resolves the instance behind a notified port with the caller's
          # own context, unelevated, so a notifier holding service alone has
          # every event answered 404 and leaves the port in BUILD.
          assert_eq "notifier registration binds service and admin" "service admin" \
            "$(kubectl get keystoneservice "${NOTIFIER_KS}" -n "${CP_NS}" -o 'jsonpath={.spec.account.roles[*]}')"

          # ── The metadata agent, on the chassis the OVN leg brought up ───────
          # Its SecretsReady gate resolves the shared secret the ControlPlane
          # generated, so a Ready agent proves that value reaches a consumer
          # OUTSIDE the plane through the same reference the Nova child carries.
          kubectl apply -f 05-neutronmetadataagent-cr.yaml
          kubectl wait neutronmetadataagent/"${CP_NAME}"-agent -n "${CP_NS}" \
            --for=condition=Ready --timeout=300s
          assert_eq "metadata agent resolved the ControlPlane's shared secret" "True" \
            "$(kubectl get neutronmetadataagent "${CP_NAME}"-agent -n "${CP_NS}" \
              -o "jsonpath={.status.conditions[?(@.type=='SecretsReady')].status}")"

          # ── The nova-compute the plane places on ───────────────────────────
          # The ControlPlane projects no compute workload: a nova-compute belongs
          # to a hypervisor. What it publishes for one is the contract Secret
          # asserted above, and 06-fake-compute.yaml is what a compute cluster
          # would build out of it. nova-scheduler places a server only on a host
          # that also has a mapping in the API database, and nova-manage writes
          # those from a 300-second periodic, which is longer than this step can
          # wait, so the helper runs the discovery by hand.
          kubectl apply -f 06-fake-compute.yaml
          kubectl rollout status deploy/"${CP_NAME}"-fake-compute -n "${CP_NS}" --timeout=300s
          ../../nova/discover-hosts.sh "${NOVA_CR}" "${CP_NS}" "${NODE}"

          # ── Link 6: aggregate Ready=True ───────────────────────────────────
          wait_cp_condition Ready 300
          assert_eq "Aggregate Ready reason" "AllReady" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o "jsonpath={.status.conditions[?(@.type=='Ready')].reason}")"

          # ── Link 6z: node budget ───────────────────────────────────────────
          # With the whole plane Ready, the pods on the kind node must request
          # no more than one 4 vCPU / 16 GiB node offers. The compute-node data
          # plane stays out of the sum: the OVN chassis, the metadata agent and
          # the fake compute stand in for a hypervisor, which the budget of the
          # control plane, its backing services, the operators and the platform
          # stack does not cover. The kind node is larger than that budget, so
          # only a job that sets E2E_NODE_BUDGET=true enforces it; a local run
          # on a busier cluster prints a SKIP line.
          if [ "${E2E_NODE_BUDGET:-false}" = "true" ]; then
            if ! NODE_BUDGET_SELECTOR='app.kubernetes.io/name notin (ovnchassis,neutronmetadataagent,nova-fake-compute)' \
                ../../../../hack/ci-check-node-budget.sh; then
              echo "ERROR: the stack requests more than the node budget (table above)"
              exit 1
            fi
          else
            echo "SKIP: node budget gate (set E2E_NODE_BUDGET=true to enforce)"
          fi

          # ── Link 6a: status.services[] reports all eight services ready ────
          # keystone [0], horizon [1], glance [2], placement [3], barbican [4],
          # neutron [5], cinder [6], nova [7] — the stable order
          # setServicesStatus emits.
          assert_eq "status.services[0] is keystone" "keystone" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[0].name}')"
          assert_eq "status.services[0] keystone ready" "true" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[0].ready}')"
          assert_eq "status.services[1] is horizon" "horizon" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[1].name}')"
          assert_eq "status.services[1] horizon ready" "true" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[1].ready}')"
          assert_eq "status.services[2] is glance" "glance" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[2].name}')"
          assert_eq "status.services[2] glance ready" "true" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[2].ready}')"
          assert_eq "status.services[3] is placement" "placement" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[3].name}')"
          assert_eq "status.services[3] placement ready" "true" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[3].ready}')"
          assert_eq "status.services[4] is barbican" "barbican" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[4].name}')"
          assert_eq "status.services[4] barbican ready" "true" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[4].ready}')"
          assert_eq "status.services[5] is neutron" "neutron" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[5].name}')"
          assert_eq "status.services[5] neutron ready" "true" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[5].ready}')"
          assert_eq "status.services[6] is cinder" "cinder" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[6].name}')"
          assert_eq "status.services[6] cinder ready" "true" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[6].ready}')"
          assert_eq "status.services[7] is nova" "nova" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[7].name}')"
          assert_eq "status.services[7] nova ready" "true" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o 'jsonpath={.status.services[7].ready}')"
          # The count, so a ninth row nobody asserted cannot ride along unseen.
          assert_eq "status.services reports exactly eight services" "8" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" \
              -o 'jsonpath={.status.services[*].name}' | wc -w | tr -d ' ')"

          # ── Link 6b: dynamic DB credential engine (no-static / revoke / iso) ─
          # Per-tenant role is keyed on the namespace alone (dbDynamicRoleFor /
          # setup-database-tenant.sh: keystone-<ns>).
          ROLE="keystone-${CP_NS}"

          # AC 2/6: no long-lived static DB password at rest — the retired
          # stage-(a) per-CP KV path must NOT exist.
          if bao_exec bao kv get "kv-v2/openstack/keystone/${CP_NS}/${CP_NAME}/db" >/dev/null 2>&1; then
            echo "ERROR: retired static DB KV path still present at rest"; exit 1
          fi
          echo "OK: no static DB password at rest (retired per-CP KV path absent)"

          # login_probe <user> <pass> → exits 0 iff the credential authenticates
          # against the tenant MariaDB. Uses the keystone image's pymysql (already
          # a dependency; no extra image to load) from a throwaway pod.
          login_probe() {
            kubectl run "mariadb-login-$(date +%s%N)" --image=ghcr.io/c5c3/keystone:2025.2 \
              --rm -i --restart=Never -n "${CP_NS}" --command -- \
              python3 -c "import pymysql; pymysql.connect(host='openstack-db.${CP_NS}.svc', port=3306, user='$1', password='$2', connect_timeout=10).close()"
          }

          # AC 3: an issued credential authenticates, then is rejected after revoke.
          CREDS="$(bao_exec bao read -format=json "database/mariadb/creds/${ROLE}")"
          U1="$(echo "${CREDS}" | jq -r '.data.username')"
          P1="$(echo "${CREDS}" | jq -r '.data.password')"
          L1="$(echo "${CREDS}" | jq -r '.lease_id')"
          echo "== issued lease ${L1} (user ${U1}); expect login OK =="
          login_probe "${U1}" "${P1}"
          echo "OK: engine-issued credential authenticates"
          bao_exec bao lease revoke "${L1}"
          sleep 5
          echo "== after revoke; expect login REJECTED =="
          if login_probe "${U1}" "${P1}"; then
            echo "ERROR: revoked credential still authenticates (AC 3)"; exit 1
          fi
          echo "OK: revoked credential is rejected by MariaDB (AC 3)"

          # AC 4 (single-tenant lease isolation): two leases, revoke one, the
          # other still authenticates and the ControlPlane stays Ready.
          CREDS_A="$(bao_exec bao read -format=json "database/mariadb/creds/${ROLE}")"
          CREDS_B="$(bao_exec bao read -format=json "database/mariadb/creds/${ROLE}")"
          LA="$(echo "${CREDS_A}" | jq -r '.lease_id')"
          UB="$(echo "${CREDS_B}" | jq -r '.data.username')"
          PB="$(echo "${CREDS_B}" | jq -r '.data.password')"
          bao_exec bao lease revoke "${LA}"
          sleep 5
          echo "== lease B must survive lease A's revoke =="
          login_probe "${UB}" "${PB}"
          echo "OK: an unrelated lease survives another's revoke (AC 4 lease isolation)"
          assert_eq "ControlPlane still Ready after lease revokes" "True" \
            "$(kubectl get controlplane "${CP_NAME}" -n "${CP_NS}" -o "jsonpath={.status.conditions[?(@.type=='Ready')].status}")"

          # ── Link 6c: glance-db / keystone-db SERVICE isolation ─────────────
          # deploy/openbao/policies/glance-db-dynamic.hcl claims the two role +
          # policy pairs are told apart by the ServiceAccount NAME the token
          # carries — glance-db-creds vs keystone-db-creds — and that this holds
          # even for two services CO-LOCATED in one namespace. This suite runs
          # exactly that co-located shape (Glance shares ${CP_NS}), so it is the
          # place to prove it. (The cross-TENANT half of the claim is the
          # multi-controlplane suite's keystone-db check; this is the
          # cross-SERVICE half, which nothing exercised before.)
          GLANCE_ROLE="glance-${CP_NS}"
          # login <sa> <role> → prints the client token minted from that SA's JWT.
          db_login() {
            bao_exec bao write -field=token "auth/kubernetes/management/login" \
              role="$2" jwt="$(kubectl create token "$1" -n "${CP_NS}" --duration=10m)"
          }
          G_TOKEN="$(db_login glance-db-creds glance-db)"
          if [ -z "${G_TOKEN}" ]; then
            echo "ERROR: glance-db login returned no token"; exit 1
          fi
          # Positive control first, so a broken login cannot make the denies below
          # pass vacuously.
          if ! bao_exec env BAO_TOKEN="${G_TOKEN}" \
            bao read "database/mariadb/creds/${GLANCE_ROLE}" >/dev/null 2>&1; then
            echo "ERROR: glance token could not read its OWN creds path ${GLANCE_ROLE}"; exit 1
          fi
          echo "OK: glance token reads its own creds path (${GLANCE_ROLE})"
          if bao_exec env BAO_TOKEN="${G_TOKEN}" \
            bao read "database/mariadb/creds/${ROLE}" >/dev/null 2>&1; then
            echo "ERROR: glance token READ the keystone creds path ${ROLE} in its own namespace"; exit 1
          fi
          echo "OK: glance token denied on the co-located keystone creds path (${ROLE})"
          # The mirror direction: keystone's token must not reach glance's path.
          K_TOKEN="$(db_login keystone-db-creds keystone-db)"
          if bao_exec env BAO_TOKEN="${K_TOKEN}" \
            bao read "database/mariadb/creds/${GLANCE_ROLE}" >/dev/null 2>&1; then
            echo "ERROR: keystone token READ the glance creds path ${GLANCE_ROLE} in its own namespace"; exit 1
          fi
          echo "OK: keystone token denied on the co-located glance creds path (${GLANCE_ROLE}) — service isolation holds"
          unset BAO_TOKEN

          # ── Link 7a: Keystone /v3 returns HTTP 200 ─────────────────────────
          # Mirrors tests/e2e/keystone/basic-deployment: GET the in-cluster
          # Keystone v3 root from a throwaway pod using the keystone image's
          # python (no extra image to load). urlopen() raises on non-200.
          KS_URL="http://${KEYSTONE_CR}.${CP_NS}.svc:5000/v3"
          echo "== curl Keystone ${KS_URL} (expect HTTP 200) =="
          kubectl run cp-keystone-v3 --image=ghcr.io/c5c3/keystone:2025.2 --rm -i --restart=Never \
            -n "${CP_NS}" --command -- \
            python3 -c "import sys,urllib.request; r=urllib.request.urlopen('${KS_URL}'); print('HTTP', r.status); sys.exit(0 if r.status == 200 else 1)"
          echo "OK: Keystone /v3 returned HTTP 200"

          # ── Link 7b: openstack token issue + catalog list ─────────────────
          # Authenticate with the materialised admin clouds.yaml (the minted,
          # OpenBao-round-tripped application credential) and prove a token can
          # be issued and the identity service appears in the catalog. The Job
          # manifest lives in a sibling fixture (01-openstack-verify-job.yaml); it
          # runs in the ControlPlane namespace and mounts the per-CR
          # k-orc-clouds-yaml Secret materialised there.
          echo "== openstack token issue + catalog list (cloud: admin) =="
          kubectl delete job cp-openstack-verify -n "${CP_NS}" --ignore-not-found
          kubectl apply -f 01-openstack-verify-job.yaml
          # The Job runs dozens of openstack CLI calls in sequence (token issue,
          # catalog list, five role-assignment lists, then the image, placement,
          # secret and network round-trips), and with seven services up on the
          # 4-vCPU CI node each call takes 15-25s: the run that added the network
          # round-trip was still on `network show` when a 5m wait expired. The four
          # block-storage round-trips add more than twenty calls of their own, most
          # of them behind a poll on a volume reaching available. A 15m wait
          # expired on three runs with every leg green and the Job inside its last
          # one, the image-volume cache; the slowest needed about 16m. The compute
          # round-trip adds a boot polled to ACTIVE, a port lookup and two
          # metadata requests on top of that, so the wait is 25m, which sits
          # inside the 65m step budget above.
          kubectl wait --for=condition=complete job/cp-openstack-verify -n "${CP_NS}" --timeout=25m
          echo "=== openstack client output ==="
          # Fetch the Job log ONCE and assert on the captured text. `kubectl
          # logs | grep -q` fails under pipefail exactly when it MATCHES:
          # grep -q exits at the first hit and closes the pipe while kubectl is
          # still streaming, so kubectl dies on EPIPE and pipefail turns the
          # matched pipeline into a failure. The image round-trip output grew
          # the log past the point where kubectl finishes writing before grep
          # exits. A single capture also pins every assertion to one pod's log
          # instead of re-selecting a pod per kubectl call.
          #
          # That pod is the Succeeded one, read by name. job/<name> resolves to
          # the OLDEST pod (kubectl's log-pod sort ranks finished pods equal on
          # phase, readiness and restarts, then puts the older first), which
          # after a backoffLimit retry is the failed attempt: a Job that came
          # good on its retry would fail every assertion below.
          VERIFY_PODS="$(kubectl get pods -n "${CP_NS}" -l job-name=cp-openstack-verify \
            --field-selector=status.phase=Succeeded -o name)"
          VERIFY_POD="${VERIFY_PODS%%$'\n'*}"
          test -n "${VERIFY_POD}" || { echo "ERROR: no Succeeded pod of cp-openstack-verify"; exit 1; }
          VERIFY_LOGS="$(kubectl logs -n "${CP_NS}" "${VERIFY_POD}")"
          printf '%s\n' "${VERIFY_LOGS}"
          grep -qi "identity" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: identity (keystone) service not listed in the catalog"; exit 1; }
          grep -qi "image" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: image (glance) service not listed in the catalog"; exit 1; }
          grep -qi "placement" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: placement service not listed in the catalog"; exit 1; }
          grep -qi "key-manager" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: key-manager (barbican) service not listed in the catalog"; exit 1; }
          grep -qi "network" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: network service missing from the catalog"; exit 1; }
          grep -qi "block-storage" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: block-storage (cinder) service not listed in the catalog"; exit 1; }
          # The Job fails itself on a payload mismatch; this grep pins the positive
          # line so a silently skipped round-trip cannot pass as a green Job.
          grep -q "secret round-trip payload matches" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the Barbican secret round-trip did not confirm a matching payload"; exit 1; }
          grep -q "OK: network round-trip" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the network round-trip did not confirm an ACTIVE network"; exit 1; }
          grep -q "OK: region description round-trip" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the Keystone region description did not round-trip through openstack region show"; exit 1; }
          grep -q "OK: volume round-trip" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the volume round-trip did not reach an available volume on the NFS backend"; exit 1; }
          grep -q "OK: backup round-trip" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the backup round-trip did not create, restore and delete a backup"; exit 1; }
          grep -q "OK: encrypted volume type" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the encrypted volume did not put exactly one key into Barbican and take it back out"; exit 1; }
          grep -q "OK: image-volume cache" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the second create-from-image did not reuse the cached image volume"; exit 1; }
          # The compute round-trip. The server and the port lines are matched
          # WITH the node in them, so a server that landed anywhere else, or a
          # port bound to another host, fails here instead of passing on a line
          # that merely starts the same way.
          grep -q "OK: compute service " <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: no nova-compute host reported up to the verify Job"; exit 1; }
          # The host as the Job printed it, compared rather than only matched, so
          # a mismatch names both sides instead of failing a silent grep. awk
          # stops at the first hit without a pipe, which is the same reason the
          # matches above use here-strings.
          VERIFY_HOST="$(awk '/^OK: compute service .* up$/ { print $4; exit }' <<<"${VERIFY_LOGS}")"
          assert_eq "the compute the verify Job saw is the labelled node" "${NODE}" "${VERIFY_HOST}"
          grep -q "OK: server cp-server ACTIVE on ${NODE}" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: cp-server did not reach ACTIVE on node ${NODE}"; exit 1; }
          grep -q "OK: port bound (ovs) on ${NODE}" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the server's port was not bound with vif_type ovs on node ${NODE}"; exit 1; }
          grep -q "OK: metadata signed round-trip" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the signed metadata request did not answer 200 with the server's uuid, or a wrong signature was not refused"; exit 1; }
          grep -q "OK: compute round-trip" <<<"${VERIFY_LOGS}" \
            || { echo "ERROR: the compute round-trip did not boot and remove a server"; exit 1; }

          # ── Link 7c: the port events the boot travelled on ─────────────────
          # Booting a server is the only thing in this suite that makes the two
          # services call each other: neutron posts network-changed to the
          # compute API as the notifier account, and nova answers it. The verify
          # Job sees neither call, so the proof is in the two logs.
          #
          # Both are captured ONCE and matched with here-strings, the rule the
          # verify-Job capture above documents: a `kubectl logs | grep -q`
          # pipeline fails under pipefail exactly when it matches.
          #
          # The nova API's uWSGI access log prints the request path and the
          # status on one line, so a 200 on os-server-external-events is the
          # compute side of the exchange. The API Deployment carries the Nova
          # CR's own name (the components take a suffix, the API does not).
          NOVA_API_LOGS="$(kubectl logs -n "${CP_NS}" "deploy/${NOVA_CR}" --tail=2000)"
          if ! grep -Eq 'os-server-external-events.*200' <<<"${NOVA_API_LOGS}"; then
            echo "ERROR: the nova API logged no os-server-external-events call answered 200; the notifier never reached it"
            printf '%s\n' "${NOVA_API_LOGS}"
            exit 1
          fi
          echo "OK: the nova API answered an os-server-external-events call with 200"
          # The neutron side of the same exchange. A notifier whose account is
          # too narrow still posts the event and still logs it, but nova answers
          # 404 and neutron records the event as returned with failed status, so
          # the absence of that line is what proves the roles are right.
          #
          # network-vif-deleted is deliberately NOT asserted: nova answers 404
          # for an instance it has already destroyed whatever role the caller
          # holds, so the teardown leaves a failed-status line no wiring can
          # remove.
          NEUTRON_LOGS="$(kubectl logs -n "${CP_NS}" "deploy/${NEUTRON_CR}" --tail=2000)"
          if grep -Eq 'network-changed.*returned with failed status' <<<"${NEUTRON_LOGS}"; then
            echo "ERROR: neutron recorded a network-changed event nova refused; the notifier account is too narrow"
            printf '%s\n' "${NEUTRON_LOGS}"
            exit 1
          fi
          echo "OK: no network-changed event came back from nova with a failed status"

          # ── Link 7d: the hypervisor operator's account ─────────────────────
          # spec.services.nova.hypervisorOperator has the plane write the auth
          # Secret openstack-hypervisor-operator's chart values are filled from.
          # Its key NAMES are read and compared; the values are never printed,
          # because the Secret carries a cloud-admin password.
          HVO_AUTH_SECRET="${NOVA_CR}-hypervisor-operator-auth"
          HVO_KEYS="$(kubectl get secret "${HVO_AUTH_SECRET}" -n "${CP_NS}" \
            -o go-template='{{range $k, $v := .data}}{{$k}}{{"\n"}}{{end}}')"
          echo "${HVO_AUTH_SECRET} keys: $(tr '\n' ' ' <<<"${HVO_KEYS}")"
          assert_eq "the auth Secret carries the seven keys of the hypervisor operator's chart values" \
            "$(printf '%s\n' auth_url password project_domain_name project_name region_name user_domain_name username)" \
            "${HVO_KEYS}"

          # K-ORC caches one client per clouds.yaml for half the token lifetime
          # (about 30 minutes), and the client keeps the service catalog of the
          # token it authenticated with. The plane's credential was first used
          # before the compute, network and block-storage rows existed, so until
          # that entry expires the flavor, volume type, network and subnet fail
          # with "No suitable endpoint could be found in the service catalog". A
          # restart empties the cache; the overlay's header tells users the same.
          # Drop it once k-orc/openstack-resource-controller#941 is fixed.
          kubectl rollout restart deployment/orc-controller-manager -n orc-system
          kubectl rollout status deployment/orc-controller-manager -n orc-system --timeout=5m

          # The fixtures the hypervisor operator's start and smoke test look up
          # by fixed names, from the example overlay. fixtures.yaml alone: the
          # overlay's image.yaml downloads cirros, which CI never does. The wait
          # reads the same file, so a fixture added there is waited for too.
          kubectl apply -f ../../../../deploy/kind/hypervisor-operator-fixtures/fixtures.yaml
          kubectl wait --for=condition=Available --timeout=10m \
            -f ../../../../deploy/kind/hypervisor-operator-fixtures/fixtures.yaml

          # The hypervisor operator does not run in kind; the Job makes its
          # calls as its user instead. About twenty CLI calls at the 15-25s the
          # verify Job above measures per call fit the 10m wait.
          echo "== calls as the hypervisor operator's user =="
          kubectl delete job cp-hypervisor-operator-verify -n "${CP_NS}" --ignore-not-found
          kubectl apply -f 07-hypervisor-operator-verify-job.yaml
          kubectl wait --for=condition=complete job/cp-hypervisor-operator-verify -n "${CP_NS}" --timeout=10m
          # Captured once from the Succeeded pod and matched with here-strings,
          # for the reasons the verify-Job capture above documents.
          HVO_PODS="$(kubectl get pods -n "${CP_NS}" -l job-name=cp-hypervisor-operator-verify \
            --field-selector=status.phase=Succeeded -o name)"
          HVO_POD="${HVO_PODS%%$'\n'*}"
          test -n "${HVO_POD}" || { echo "ERROR: no Succeeded pod of cp-hypervisor-operator-verify"; exit 1; }
          HVO_LOGS="$(kubectl logs -n "${CP_NS}" "${HVO_POD}")"
          printf '%s\n' "${HVO_LOGS}"
          for line in "OK: hvo catalog" "OK: hvo compute services" "OK: hvo aggregates" \
            "OK: hvo placement" "OK: hvo test scope"; do
            grep -q "${line}" <<<"${HVO_LOGS}" \
              || { echo "ERROR: the hypervisor-operator Job printed no '${line}' line"; exit 1; }
          done
          echo "OK: token issued, identity + image + placement + key-manager + network + block-storage + compute services catalogued, the image, placement, secret, network, volume, backup, encryption, cache and compute round-trips passed, and the hypervisor operator's account reaches what it needs — full chain verified."
    catch:
    - script:
        # Pinned, because chainsaw applies the test's exec budget to EVERY
        # script operation and not just to the try block. Left unpinned this
        # dump would inherit 30m against a wedged apiserver, where a kubectl
        # call blocks instead of erroring and `2>&1 || true` bounds the exit
        # status rather than the duration.
        timeout: 5m
        shell: bash
        content: |
          echo "=== ControlPlane describe ==="
          kubectl describe controlplane controlplane-keystone -n openstack 2>&1 || true
          echo "=== ControlPlane status.conditions ==="
          kubectl get controlplane controlplane-keystone -n openstack \
            -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}: {.message}){"\n"}{end}' 2>&1 || true
          echo "=== Projected child CRs ==="
          kubectl get mariadb,memcacheds.memcached.c5c3.io,keystone -n openstack 2>&1 || true
          kubectl get applicationcredentials.openstack.k-orc.cloud,services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud,regions.openstack.k-orc.cloud -n openstack 2>&1 || true
          echo "=== Service registrations (KeystoneService children) ==="
          kubectl get keystoneservice -n openstack -o yaml 2>&1 || true
          echo "=== K-ORC children the registrations own ==="
          kubectl get users.openstack.k-orc.cloud,projects.openstack.k-orc.cloud,roles.openstack.k-orc.cloud,roleassignments.openstack.k-orc.cloud,services.openstack.k-orc.cloud,endpoints.openstack.k-orc.cloud \
            -n openstack -L c5c3.io/keystoneservice-name -o wide 2>&1 || true
          echo "=== Credential chain (PushSecret / ExternalSecret) ==="
          kubectl describe pushsecret controlplane-keystone-admin-app-credential-backup -n openstack 2>&1 || true
          kubectl describe externalsecret k-orc-clouds-yaml -n openstack 2>&1 || true
          echo "=== Dynamic DB credential engine (ExternalSecret / VaultDynamicSecret / SA) ==="
          kubectl describe externalsecret controlplane-keystone-keystone-db-credentials -n openstack 2>&1 || true
          kubectl describe vaultdynamicsecret controlplane-keystone-keystone-db-credentials -n openstack 2>&1 || true
          kubectl get serviceaccount keystone-db-creds -n openstack 2>&1 || true
          echo "=== Glance child + GlanceBackends ==="
          kubectl get glances.glance.openstack.c5c3.io,glancebackends.glance.openstack.c5c3.io -n openstack 2>&1 || true
          kubectl describe glance controlplane-keystone-glance -n openstack 2>&1 || true
          kubectl describe externalsecret controlplane-keystone-glance-db-credentials -n openstack 2>&1 || true
          kubectl describe vaultdynamicsecret controlplane-keystone-glance-db-credentials -n openstack 2>&1 || true
          kubectl get serviceaccount glance-db-creds -n openstack 2>&1 || true
          echo "=== glance-operator logs (last 200 lines) ==="
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --tail=200 --all-containers 2>&1 || true
          echo "=== Placement child ==="
          kubectl get placements.placement.openstack.c5c3.io -n openstack 2>&1 || true
          kubectl describe placements.placement.openstack.c5c3.io controlplane-keystone-placement -n openstack 2>&1 || true
          kubectl describe externalsecret controlplane-keystone-placement-db-credentials -n openstack 2>&1 || true
          kubectl describe vaultdynamicsecret controlplane-keystone-placement-db-credentials -n openstack 2>&1 || true
          kubectl get serviceaccount placement-db-creds -n openstack 2>&1 || true
          echo "=== placement-operator logs (last 200 lines) ==="
          kubectl logs -n placement-system -l app.kubernetes.io/name=placement-operator --tail=200 --all-containers 2>&1 || true
          echo "=== Barbican child + secret store + dedicated OpenBao instance ==="
          kubectl get barbicans.barbican.openstack.c5c3.io,barbicansecretstores.barbican.openstack.c5c3.io -n openstack 2>&1 || true
          kubectl describe barbicans.barbican.openstack.c5c3.io controlplane-keystone-barbican -n openstack 2>&1 || true
          kubectl describe barbicansecretstores.barbican.openstack.c5c3.io controlplane-keystone-barbican-store -n openstack 2>&1 || true
          kubectl describe openbaoclusters.openbao.org controlplane-keystone-barbican-bao -n openstack 2>&1 || true
          kubectl get secret controlplane-keystone-barbican-store-approle -n openstack 2>&1 || true
          kubectl describe externalsecret controlplane-keystone-barbican-db-credentials -n openstack 2>&1 || true
          kubectl describe vaultdynamicsecret controlplane-keystone-barbican-db-credentials -n openstack 2>&1 || true
          kubectl get serviceaccount barbican-db-creds -n openstack 2>&1 || true
          echo "=== barbican-operator logs (last 200 lines) ==="
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --tail=200 --all-containers 2>&1 || true
          echo "=== Neutron child + its bus Secret + the referenced OVNCentral ==="
          kubectl get neutrons.neutron.openstack.c5c3.io,ovncentrals.ovn.openstack.c5c3.io -n openstack 2>&1 || true
          kubectl describe neutrons.neutron.openstack.c5c3.io controlplane-keystone-neutron -n openstack 2>&1 || true
          kubectl describe ovncentrals.ovn.openstack.c5c3.io controlplane-keystone-ovn -n openstack 2>&1 || true
          kubectl get secret controlplane-keystone-neutron-messaging -n openstack 2>&1 || true
          kubectl describe externalsecret controlplane-keystone-neutron-db-credentials -n openstack 2>&1 || true
          kubectl describe vaultdynamicsecret controlplane-keystone-neutron-db-credentials -n openstack 2>&1 || true
          kubectl get serviceaccount neutron-db-creds -n openstack 2>&1 || true
          echo "=== neutron-operator logs (last 200 lines) ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --tail=200 --all-containers 2>&1 || true
          echo "=== Cinder child + satellites + bus Secret + DB credential ==="
          kubectl get cinders.cinder.openstack.c5c3.io,cinderbackends.cinder.openstack.c5c3.io,cinderbackupbackends.cinder.openstack.c5c3.io -n openstack 2>&1 || true
          kubectl describe cinders.cinder.openstack.c5c3.io controlplane-keystone-cinder -n openstack 2>&1 || true
          kubectl describe cinderbackends.cinder.openstack.c5c3.io nfs1 -n openstack 2>&1 || true
          kubectl describe cinderbackupbackends.cinder.openstack.c5c3.io nfsbk -n openstack 2>&1 || true
          kubectl get secret controlplane-keystone-cinder-messaging -n openstack 2>&1 || true
          kubectl describe externalsecret controlplane-keystone-cinder-db-credentials -n openstack 2>&1 || true
          kubectl describe vaultdynamicsecret controlplane-keystone-cinder-db-credentials -n openstack 2>&1 || true
          kubectl get serviceaccount cinder-db-creds -n openstack 2>&1 || true
          echo "=== cinder-operator logs (last 200 lines) ==="
          kubectl logs -n cinder-system -l app.kubernetes.io/name=cinder-operator --tail=200 --all-containers 2>&1 || true
          echo "=== Cinder service pod logs (api, scheduler, volume, backup; last 200 lines) ==="
          # Dumped here, inside catch, because the finally block below deletes
          # the vhost these pods sit on: every tail the workflow's diagnostics
          # steps take afterwards is "vhost ... not found" from the teardown,
          # and what cinder-volume and the scheduler did with the verify Job's
          # volume is gone with it.
          for pod in $(kubectl get pods -n openstack -l app.kubernetes.io/instance=controlplane-keystone-cinder -o name 2>/dev/null); do
            echo "--- ${pod} ---"
            kubectl logs -n openstack "${pod}" --all-containers --tail=200 2>&1 || true
          done
          echo "=== Nova child + its two DB chains + the metadata shared secret ==="
          kubectl get novas.nova.openstack.c5c3.io -n openstack 2>&1 || true
          kubectl describe novas.nova.openstack.c5c3.io controlplane-keystone-nova -n openstack 2>&1 || true
          kubectl get secret controlplane-keystone-nova-messaging -n openstack 2>&1 || true
          kubectl describe externalsecret controlplane-keystone-nova-api-db-credentials -n openstack 2>&1 || true
          kubectl describe vaultdynamicsecret controlplane-keystone-nova-api-db-credentials -n openstack 2>&1 || true
          kubectl describe externalsecret controlplane-keystone-nova-db-credentials -n openstack 2>&1 || true
          kubectl describe vaultdynamicsecret controlplane-keystone-nova-db-credentials -n openstack 2>&1 || true
          kubectl get serviceaccount nova-api-db-creds nova-cell-db-creds -n openstack 2>&1 || true
          kubectl describe externalsecret controlplane-keystone-nova-metadata-secret -n openstack 2>&1 || true
          kubectl get secret controlplane-keystone-nova-compute-config -n openstack 2>&1 || true
          echo "=== Nova Deployments (api, metadata, scheduler, conductor, console proxy) ==="
          # The API Deployment carries the Nova CR's bare name; the four
          # component ones take a suffix each.
          kubectl get deployment controlplane-keystone-nova \
            controlplane-keystone-nova-metadata \
            controlplane-keystone-nova-scheduler \
            controlplane-keystone-nova-conductor \
            controlplane-keystone-nova-novncproxy -n openstack -o wide 2>&1 || true
          echo "=== nova-operator logs (last 200 lines) ==="
          kubectl logs -n nova-system -l app.kubernetes.io/name=nova-operator --tail=200 --all-containers 2>&1 || true
          echo "=== nova API logs (last 400 lines) ==="
          # Dumped here rather than left to the workflow's diagnostics, for the
          # reason the cinder pod logs above document: the finally block deletes
          # the vhost these services sit on.
          kubectl logs -n openstack deploy/controlplane-keystone-nova --tail=400 2>&1 || true
          echo "=== neutron-server logs (last 400 lines) ==="
          kubectl logs -n openstack deploy/controlplane-keystone-neutron --tail=400 2>&1 || true
          echo "=== Fake compute, OVN chassis and metadata agent ==="
          kubectl get deployment controlplane-keystone-fake-compute -n openstack -o wide 2>&1 || true
          kubectl logs -n openstack deploy/controlplane-keystone-fake-compute --tail=200 2>&1 || true
          kubectl describe ovnchassis controlplane-keystone-chassis -n openstack 2>&1 || true
          kubectl describe neutronmetadataagent controlplane-keystone-agent -n openstack 2>&1 || true
          echo "=== ovn-operator logs (last 200 lines) ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --tail=200 --all-containers 2>&1 || true
          echo "=== openbao-operator logs (last 100 lines) ==="
          kubectl logs -n openbao-operator-system -l app.kubernetes.io/name=openbao-operator --tail=100 --all-containers 2>&1 || true
          echo "=== OpenBao logs (last 100 lines) ==="
          kubectl logs -n shared-services -l app.kubernetes.io/name=openbao --tail=100 --all-containers 2>&1 || true
          echo "=== c5c3-operator logs (last 200 lines) ==="
          kubectl logs -n c5c3-system -l app.kubernetes.io/name=c5c3-operator --tail=200 --all-containers 2>&1 || true
          echo "=== K-ORC controller logs (last 100 lines) ==="
          kubectl logs -n orc-system -l app.kubernetes.io/name=openstack-resource-controller --tail=100 --all-containers 2>&1 || true
          echo "=== openstack verify Job pod logs (every attempt) ==="
          # job/<name> resolves to ONE pod, the oldest, so after a backoffLimit
          # retry the later attempt is the one not shown. The label lists every
          # pod the Job made; a Never-restart pod is kept as Failed rather than
          # replaced, so every attempt's log is still there to read.
          for pod in $(kubectl get pods -n openstack -l job-name=cp-openstack-verify -o name 2>/dev/null); do
            echo "--- ${pod} ---"
            kubectl logs -n openstack "${pod}" --tail=400 2>&1 || true
          done
          echo "=== Hypervisor-operator fixtures (K-ORC) ==="
          # The auth Secret is deliberately not dumped: it carries a cloud-admin
          # password.
          kubectl get -o wide -f ../../../../deploy/kind/hypervisor-operator-fixtures/fixtures.yaml 2>&1 || true
          echo "=== hypervisor-operator verify Job pod logs (every attempt) ==="
          for pod in $(kubectl get pods -n openstack -l job-name=cp-hypervisor-operator-verify -o name 2>/dev/null); do
            echo "--- ${pod} ---"
            kubectl logs -n openstack "${pod}" --tail=400 2>&1 || true
          done
          echo "=== Events (openstack ns, last 30) ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
    finally:
    - script:
        # Pinned for the same reason as catch above; one delete needs nothing
        # like the test's exec budget. Keeps the suite's ceiling at
        # exec + catch + finally + cleanup = 65 + 5 + 5 + 5 + 2 + 3 = 85m, which is
        # the number .github/workflows/ci.yaml budgets against.
        timeout: 5m
        shell: bash
        content: |
          # Best-effort cleanup of the verify Job, which now lives in the
          # openstack namespace (the ControlPlane and its owned children are GC'd
          # by chainsaw's namespace teardown).
          kubectl delete job cp-openstack-verify -n openstack --ignore-not-found 2>&1 || true
    - script:
        # The vhost the create call took on the shared broker. `|| true` is the
        # helper's contract rather than a choice made here: the delete reaches the
        # broker through kubectl exec into the one pod every cinder suite shares,
        # and a broker that is restarting under that load must not redden a run
        # whose assertions all passed. The helper prints one WARNING: line for a
        # leak, and the vhost dies with the kind cluster either way.
        timeout: 2m
        shell: bash
        content: |
          ../../cinder/broker-vhost.sh delete controlplane-keystone || true
    - script:
        # The compute leg's own footprint. None of it is owned by the
        # ControlPlane, so chainsaw's namespace teardown reaches the fake compute
        # and the two CRs only by namespace, and the node label not at all: a
        # label left behind advertises a chassis role nothing serves, which the
        # next suite rendering an OVNChassis would schedule against.
        #
        # Deletes run in reverse order of the apply (the hypervisor-operator
        # Job and fixtures first, then the compute, then the agent, then the
        # chassis that both sit on) and every one is best-effort: a run that
        # gated out before it applied any of them must not redden here.
        #
        # The fixtures go while the ControlPlane's credential still works,
        # because K-ORC deletes the managed ones through it. Keystone refuses
        # to delete an enabled domain and K-ORC does not disable one first, so
        # cc3test is disabled before the delete.
        timeout: 5m
        shell: bash
        content: |
          kubectl delete job cp-hypervisor-operator-verify -n openstack --ignore-not-found 2>&1 || true
          kubectl patch domains.openstack.k-orc.cloud/hvo-cc3test -n openstack --type=merge \
            -p '{"spec":{"resource":{"enabled":false}}}' 2>&1 || true
          kubectl wait domains.openstack.k-orc.cloud/hvo-cc3test -n openstack \
            --for=jsonpath='{.status.resource.enabled}'=false --timeout=1m 2>&1 || true
          kubectl delete -f ../../../../deploy/kind/hypervisor-operator-fixtures/fixtures.yaml \
            --ignore-not-found --wait --timeout=3m 2>&1 || true
          kubectl delete -f 06-fake-compute.yaml --ignore-not-found 2>&1 || true
          kubectl delete neutronmetadataagent controlplane-keystone-agent -n openstack --ignore-not-found 2>&1 || true
          kubectl delete ovnchassis controlplane-keystone-chassis -n openstack --ignore-not-found 2>&1 || true
          kubectl label nodes --all openstack.c5c3.io/chassis- 2>&1 || true
