# ControlPlane CR fixture for the admin-password-scoping E2E test
#
# A minimal managed-mode ControlPlane named "controlplane". It carries no
# namespace: the suite applies it into chainsaw's ephemeral namespace with
# `kubectl apply -n`. Its name is LOAD-BEARING for this suite: the
# c5c3-operator's reconcileAdminPassword derives the per-ControlPlane
# admin-password ExternalSecret/Secret name
#   keystoneName(cp) + "-admin-credentials" = "controlplane-keystone-admin-credentials"
# and the OpenBao remoteRef key
#   bootstrap/{cp.KeystoneNamespace()}/{keystoneName(cp)}/admin
#     = bootstrap/<namespace>/controlplane-keystone/admin
# (the Keystone namespace is the ControlPlane's own, as the CR places no
# service in a namespace of its own).
#
# ── DECISION: a fresh CR in the suite's own namespace ───────────────────────
# The suite seeds that path itself with write-bootstrap-secrets.sh before it
# applies this CR, so nothing depends on what deploy-infra seeded. The CR omits
# spec.infrastructure, which the defaulting webhook fills with the well-known
# managed clusters (openstack-db, openstack-memcached), and it omits a gateway
# block: Gateway openstack-gw admits routes from its own namespace only.
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: controlplane
spec:
  openStackRelease: "2026.1"
  services:
    keystone: {}
  sizing:
    profile: Minimal
