# controlPlaneRef.name is immutable (CEL transition rule): the edit would
# strand the assignment the order created on the old plane. The error
# carries 'controlPlaneRef.name is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-immutable
spec:
  controlPlaneRef:
    name: cp-other
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  role: member
