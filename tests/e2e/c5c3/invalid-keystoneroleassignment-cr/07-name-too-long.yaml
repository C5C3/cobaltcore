# A 64-byte metadata.name is rejected by the root CEL rule: the name is
# carried as a label value on the order's children, which Kubernetes caps
# at 63 bytes. The error carries 'metadata.name must be at most 63 bytes'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  role: member
