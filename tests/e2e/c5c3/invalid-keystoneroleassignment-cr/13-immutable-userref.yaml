# userRef is immutable (CEL transition rule): the assignment binds the user
# it was created for. The error carries 'userRef is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: another-user
  projectRef:
    name: workflow-project
  role: member
