# An order without a userRef is rejected by the CRD required list. The error
# carries 'Required value'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-invalid-userref-missing
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  projectRef:
    name: workflow-project
  role: member
