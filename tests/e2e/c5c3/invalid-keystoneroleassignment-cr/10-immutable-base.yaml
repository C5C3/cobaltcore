# Valid base for the immutability wave. It is applied FIRST and must
# SUCCEED. The 11-15 variants reuse this metadata.name, so Chainsaw applies
# each of them to the live object as an UPDATE, which is what makes the CEL
# transition rules evaluate at all.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  role: member
