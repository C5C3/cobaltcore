# role is immutable (CEL transition rule): another role is another
# assignment. The error carries 'role is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  role: reader
