# projectRef is immutable (CEL transition rule): the assignment binds the
# project it was created for. The error carries 'projectRef is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-immutable
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  projectRef:
    name: another-project
  role: member
