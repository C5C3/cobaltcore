# An order without a projectRef is rejected by the CRD required list. The
# error carries 'Required value'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-invalid-projectref-missing
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  role: member
