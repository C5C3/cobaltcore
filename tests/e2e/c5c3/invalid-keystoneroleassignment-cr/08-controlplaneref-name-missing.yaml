# A controlPlaneRef without a name is rejected by the required list of the
# CRD schema. No defaulting webhook runs for the kind, so nothing fills the
# field in before validation. The error carries 'Required value'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-invalid-ref-name-missing
spec:
  controlPlaneRef:
    namespace: cp-namespace
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  role: member
