# role carrying a comma is rejected by the CRD pattern that mirrors K-ORC's
# KeystoneName. The error carries 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-invalid-role-comma
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  role: a,b
