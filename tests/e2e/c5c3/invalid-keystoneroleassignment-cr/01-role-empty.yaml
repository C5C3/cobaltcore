# An empty role is rejected by the CRD minimum. The error carries
# 'should be at least 1 chars'.
apiVersion: c5c3.io/v1alpha1
kind: KeystoneRoleAssignment
metadata:
  name: kra-invalid-role-empty
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  userRef:
    name: workflow
  projectRef:
    name: workflow-project
  role: ""
