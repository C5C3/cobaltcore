# databaseName carrying a dash is rejected by the CRD pattern of a MySQL
# identifier. The error carries 'should match'.
apiVersion: c5c3.io/v1alpha1
kind: MariaDBDatabase
metadata:
  name: mdb-invalid-databasename-dash
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  databaseName: my-db
