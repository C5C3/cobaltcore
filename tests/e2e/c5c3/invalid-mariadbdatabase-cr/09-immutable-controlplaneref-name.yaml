# controlPlaneRef.name is immutable (CEL transition rule): the edit would
# strand the database the order created on the old plane. The error
# carries 'controlPlaneRef.name is immutable'.
apiVersion: c5c3.io/v1alpha1
kind: MariaDBDatabase
metadata:
  name: mdb-immutable
spec:
  controlPlaneRef:
    name: cp-other
  databaseName: svc_db
  deletionPolicy: Retain
