# Chainsaw E2E tests for the MariaDBDatabase admission surface. Pins the CRD
# patterns, bounds, enum, required fields and CEL rules in
# operators/c5c3/api/v1alpha1/mariadbdatabase_types.go to deterministic
# admission failures against a real API server.
#
# The kind has no webhook, defaulting or validating: an order may live on a
# target cluster, and no c5c3 webhook runs there. Every rejection below is the
# schema's own, so no step needs an arm ruling a webhook denial out.
#
# Fixtures carry NO metadata.namespace: Chainsaw runs the Test in its own
# ephemeral namespace and injects it.
#
# The referenced ControlPlane `cp-invalid-cr-absent` never exists, by design.
# Admission tolerates the dangling reference, and the reconciler parks the one
# admitted order on ControlPlaneNotFound, projects nothing and installs no
# `c5c3.io/mariadbdatabase-teardown` finalizer
# (operators/c5c3/internal/controller/mariadbdatabase_controller.go), so
# Chainsaw's namespace cleanup cannot wedge.
#
# All fixtures are generated from the single canonical scaffold in
# `_generate.py`. After editing the scaffold or any per-fixture override,
# regenerate via:
#   python3 tests/e2e/c5c3/invalid-mariadbdatabase-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes `_generate.py
# --check` and `test_generate.py`, so a hand-edit to a generated fixture fails
# the build before the cluster-bound e2e-operator job runs.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: c5c3-invalid-mariadbdatabase-cr
spec:
  steps:
  # databaseName carrying a dash (CRD pattern of a MySQL identifier).
  - try:
    - apply:
        file: 00-databasename-dash.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'databaseName')): true
            (contains($error, 'should match')): true
  # A 65-byte databaseName (CRD maximum, MySQL's identifier limit).
  - try:
    - apply:
        file: 01-databasename-too-long.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'databaseName')): true
            (contains($error, 'Too long')): true
  # An empty databaseName (CRD minimum); the default is the absent field.
  - try:
    - apply:
        file: 02-databasename-empty.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'databaseName')): true
            (contains($error, 'should be at least 1 chars')): true
  # A 64-byte metadata.name (root CEL rule): the name is a label value on the
  # order's children.
  - try:
    - apply:
        file: 03-name-too-long.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'metadata.name must be at most 63 bytes')): true
  # A name whose default schema name is no MySQL identifier (root CEL rule).
  - try:
    - apply:
        file: 04-name-not-identifier.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'metadata.name is not a MySQL identifier')): true
  # A controlPlaneRef without a name (CRD required list). No defaulting webhook
  # fills it in first.
  - try:
    - apply:
        file: 05-controlplaneref-name-missing.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'controlPlaneRef.name')): true
            (contains($error, 'Required value')): true
  # controlPlaneRef.namespace outside the RFC-1123 label shape (CRD pattern).
  - try:
    - apply:
        file: 06-controlplaneref-namespace-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'namespace')): true
            (contains($error, 'should match')): true
  # deletionPolicy outside the CRD enum.
  - try:
    - apply:
        file: 07-deletionpolicy-invalid.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'deletionPolicy')): true
            (contains($error, 'Unsupported value')): true
  # The immutability wave: the base is admitted, and every later fixture
  # changes one field of it, so Chainsaw applies it as an UPDATE and the CEL
  # transition rules evaluate.
  - try:
    - apply:
        file: 08-immutable-base.yaml
  - try:
    - apply:
        file: 09-immutable-controlplaneref-name.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'controlPlaneRef.name is immutable')): true
  - try:
    - apply:
        file: 10-immutable-controlplaneref-namespace.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'controlPlaneRef.namespace is immutable')): true
  - try:
    - apply:
        file: 11-immutable-databasename.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'databaseName is immutable')): true
