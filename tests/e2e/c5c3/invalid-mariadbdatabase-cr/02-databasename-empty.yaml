# An empty databaseName is rejected by the CRD minimum: the default is spelled
# by leaving the field out, which means metadata.name with its dashes as
# underscores. The error carries 'should be at least 1 chars'.
apiVersion: c5c3.io/v1alpha1
kind: MariaDBDatabase
metadata:
  name: mdb-invalid-databasename-empty
spec:
  controlPlaneRef:
    name: cp-invalid-cr-absent
  databaseName: ""
