# ControlPlane fixture for the dedicated-namespaces E2E test.
#
# It places its four services in namespaces of their OWN, per lifecycle:
#
#   - Keystone lands in @KEYSTONE_NS@ under the Managed lifecycle: the operator
#     creates the namespace, stamps it with the ControlPlane's ownership labels,
#     and deletes it with the ControlPlane.
#   - Horizon lands in @HORIZON_NS@ under the External lifecycle: the operator
#     uses a pre-existing namespace (the test creates it) and never touches its
#     lifecycle.
#   - Glance lands in @GLANCE_NS@ under a SECOND Managed lifecycle, exercising the
#     operator creating and later deleting a second owned namespace. Whenever
#     services.glance is set the defaulting webhook additionally injects the glance
#     service account with its targetNamespace pinned to the Glance namespace
#     (@GLANCE_NS@) — the webhook accepts targetNamespace only when it names the
#     ControlPlane's own or one of its dedicated service namespaces, so it must
#     equal the dedicated glance namespace.
#   - Placement lands in @PLACEMENT_NS@ under a THIRD Managed lifecycle, on the same
#     terms as Glance: services.placement likewise makes the webhook inject the
#     placement service account with its targetNamespace pinned to @PLACEMENT_NS@.
#
# The @KEYSTONE_NS@ / @HORIZON_NS@ / @GLANCE_NS@ / @PLACEMENT_NS@ tokens are
# substituted by the test script from the ephemeral test namespace, so each run gets
# fresh, collision-free namespace names. The CR itself carries NO metadata.namespace:
# chainsaw runs the suite in its own ephemeral namespace and the test applies this CR
# into it.
#
# The SHARED infrastructure block is MANAGED (clusterRef), so the operator
# provisions its backing services — and, because backing services follow the
# service, it provisions them in each SERVICE's namespace, which is what the suite
# asserts. The instances are kind-sized (single non-Galera replica, small volume)
# so they schedule on a single-node cluster.
#
# The region markers are consumed by a VitePress code-import in
# docs/guides/dedicated-service-namespaces.md — the guide embeds this fixture
# verbatim so its exhibit cannot drift from what the suite tests.
# region controlplane
apiVersion: c5c3.io/v1alpha1
kind: ControlPlane
metadata:
  name: cp
spec:
  openStackRelease: "2025.2"
  infrastructure:
    database:
      clusterRef:
        name: openstack-db
      database: keystone
      secretRef:
        name: keystone-db
      replicas: 1
      storageSize: 512Mi
    cache:
      clusterRef:
        name: openstack-memcached
      backend: dogpile.cache.pymemcache
      replicas: 1
  services:
    keystone:
      replicas: 1
      namespace:
        name: "@KEYSTONE_NS@"
        lifecycle: Managed
    horizon:
      replicas: 1
      namespace:
        name: "@HORIZON_NS@"
        lifecycle: External
    glance:
      replicas: 1
      namespace:
        name: "@GLANCE_NS@"
        lifecycle: Managed
      backends:
        - name: default
          type: S3
          isDefault: true
          s3:
            endpoint: "http://garage.openstack.svc.cluster.local:3900"
            bucket: glance-images
            region: garage
            credentialsSecretRef:
              name: garage-s3-credentials
    placement:
      replicas: 1
      namespace:
        name: "@PLACEMENT_NS@"
        lifecycle: Managed
  korc:
    adminCredential:
      cloudCredentialsRef:
        cloudName: admin
      passwordSecretRef:
        name: keystone-admin
        key: password
    # A service account delivering its credentials into the dedicated Keystone
    # namespace: its source Secret, PushSecret, consumer ExternalSecret, and the
    # materialized credentials Secret all land in @KEYSTONE_NS@ (carrying the
    # ownership labels), reading the OpenBao path keyed on that namespace. The
    # webhook accepts targetNamespace only when it names the ControlPlane's own or
    # one of its dedicated service namespaces, so admitting this CR proves the rule.
    serviceAccounts:
    - name: nova
      project:
        name: service
      targetNamespace: "@KEYSTONE_NS@"
# endregion controlplane
