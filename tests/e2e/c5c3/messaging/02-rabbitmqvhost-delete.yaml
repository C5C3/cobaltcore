# A second order whose vhost goes with it: deletionPolicy Delete. It keeps the
# default schedule, which never falls due inside the suite.
apiVersion: c5c3.io/v1alpha1
kind: RabbitMQVhost
metadata:
  name: workflow-delete
  namespace: "@TENANT_NS@"
spec:
  controlPlaneRef:
    name: cp
    namespace: "@CP_NS@"
  deletionPolicy: Delete
