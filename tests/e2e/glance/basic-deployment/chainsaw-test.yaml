# Chainsaw E2E test for happy-path Glance deployment (2025.2 release).
# Validates the full reconciliation cycle:
#   - All 9 sub-conditions progress to True with expected reasons
#   - Aggregate Ready=True with reason AllReady
#   - The API Deployment launches the eventlet glance-api server (the pre-2026.1
#     launch mode: `glance-api --config-dir ...`)
#   - Owned resources exist (Deployment, Service on 9292, PDB, config ConfigMap,
#     backends Secret)
#   - A CR without spec.importFiltering renders the restrictive
#     [import_filtering_opts] defaults into glance-api.conf
#   - The attached default S3 backend reaches Ready=True
#   - The Glance API answers /healthcheck over HTTP (200) — the oslo healthcheck
#     middleware proves the WSGI app serves requests
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: glance-basic-deployment
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply the Glance CR and its default S3 backend ──────────────
  - try:
    - apply:
        file: 00-glance-cr.yaml
    - apply:
        file: 01-glance-backend.yaml
  # ── Step 2: Assert all sub-conditions and Ready ────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: glance.openstack.c5c3.io/v1alpha1
          kind: Glance
          metadata:
            name: glance-basic
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "True"
              reason: SecretsAvailable
            (conditions[?type == 'BackendsReady']):
            - status: "True"
              reason: AllBackendsProjected
            (conditions[?type == 'DatabaseReady']):
            - status: "True"
              reason: DatabaseSynced
            (conditions[?type == 'DeploymentReady']):
            - status: "True"
              reason: DeploymentReady
            (conditions[?type == 'GlanceAPIReady']):
            - status: "True"
              reason: APIHealthy
            (conditions[?type == 'HPAReady']):
            - status: "True"
              reason: HPANotRequired
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
            (conditions[?type == 'HTTPRouteReady']):
            - status: "True"
              reason: HTTPRouteNotRequired
            (conditions[?type == 'DBPurgeReady']):
            - status: "True"
              reason: DBPurgeScheduled
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== Glance CR status ==="
          kubectl get glance glance-basic -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== GlanceBackend status ==="
          kubectl get glancebackend glance-basic-s3 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Glance API pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=glance-basic -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Assert the Deployment, its eventlet launch command, Service ──
  # ── and PDB ─────────────────────────────────────────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: glance-basic
            namespace: openstack
          spec:
            template:
              spec:
                containers:
                - name: glance-api
                  command:
                  - glance-api
                  - --config-dir
                  - /etc/glance/glance-api.conf.d/
                  - --config-dir
                  - /etc/glance/backends.conf.d/
                # This CR carries no spec.staging, so both scratch emptyDirs
                # must fall back to the operator's 10Gi default. Without a
                # sizeLimit an import fills the node's disk and takes every
                # unrelated pod on it down with the API; the explicit-value path
                # is covered by the 2026-1 variant of this suite.
                (volumes[?name == 'staging'].emptyDir.sizeLimit | [0]): 10Gi
                (volumes[?name == 'tasks-work'].emptyDir.sizeLimit | [0]): 10Gi
                # It carries no spec.imageCache either, and that block is opt-in:
                # the pod must stay a lone glance-api container with no cache
                # volume. An unconditional maintenance sidecar or cache emptyDir
                # would otherwise land on every deployment that never asked for
                # one, spending node disk and a container slot silently.
                (length(containers) == `1`): true
                (length(volumes[?name == 'image-cache']) == `0`): true
          status:
            (availableReplicas > `0`): true
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: glance-basic
            namespace: openstack
          spec:
            ports:
            - port: 9292
    - assert:
        resource:
          apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata:
            name: glance-basic
            namespace: openstack
            labels:
              app.kubernetes.io/name: glance
              app.kubernetes.io/instance: glance-basic
              app.kubernetes.io/managed-by: glance-operator
          spec:
            minAvailable: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: glance
                app.kubernetes.io/instance: glance-basic
  # ── Step 4: Assert the default S3 backend is Ready ─────────────────────
  - try:
    - assert:
        resource:
          apiVersion: glance.openstack.c5c3.io/v1alpha1
          kind: GlanceBackend
          metadata:
            name: glance-basic-s3
            namespace: openstack
          status:
            (conditions[?type == 'CredentialsReady']):
            - status: "True"
              reason: CredentialsAvailable
            (conditions[?type == 'ConfigProjected']):
            - status: "True"
              reason: ConfigProjected
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
  # ── Step 5: Assert the rendered config ConfigMap and backends Secret ────
  # The second script pins the default web-download filter posture: this CR
  # carries no importFiltering block, so [import_filtering_opts] must render the
  # operator's restrictive defaults. The greps are anchored on both sides
  # because "allowed_ports" is a substring of "disallowed_ports", and they
  # include the brackets: all six options are declared bounds=True upstream, so
  # an unbracketed value is one oslo.config refuses to parse. It refuses lazily,
  # on the first read inside validate_import_uri, which is why nothing in this
  # suite goes unready when the format is wrong — only a web-download import
  # fails, and only in the tempest legs.
  - try:
    - script:
        content: |
          kubectl get cm -n openstack -o name | grep glance-basic-config-
          kubectl get secret -n openstack -o name | grep glance-basic-backends-
    - script:
        content: |
          set -eu
          CM=$(kubectl get deploy glance-basic -n openstack \
            -o 'jsonpath={.spec.template.spec.volumes[?(@.name=="config")].configMap.name}')
          test -n "$CM"
          kubectl get cm "$CM" -n openstack -o 'jsonpath={.data.glance-api\.conf}' \
            > /tmp/glance-basic-api.conf
          grep -q '^allowed_schemes = \[https\]$' /tmp/glance-basic-api.conf
          grep -q '^allowed_ports = \[443\]$' /tmp/glance-basic-api.conf
          grep '^disallowed_hosts = \[' /tmp/glance-basic-api.conf | grep -q '169\.254\.169\.254'
          echo "OK: $CM ships the default import filter posture (https/443, metadata host denied)"
  # ── Step 6: Assert the Glance API answers /healthcheck over HTTP ────────
  # HTTP-level API coverage: the oslo healthcheck middleware answers without
  # touching the database or Keystone, proving the WSGI app is serving requests.
  - try:
    - script:
        timeout: 60s
        content: |
          kubectl run curl-test-glance-basic -n $NAMESPACE --image=ghcr.io/c5c3/glance:2025.2 --rm -i --restart=Never \
            --command -- python3 -c "import urllib.request; r = urllib.request.urlopen('http://glance-basic.openstack.svc:9292/healthcheck'); assert r.status == 200, r.status; print('healthcheck OK, status %d' % r.status)"
    catch:
    - script:
        content: |
          echo "=== Glance CR status ==="
          kubectl get glance glance-basic -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Glance API pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=glance-basic -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 7: Assert the default db-purge CronJob schedule and CLI flags ──
  # A CR without spec.dbPurge tracks the operator defaults: daily at 00:01,
  # glance-manage db purge with a 30-day retention and a 1000-row cap per table,
  # and no purge_images_table pass — that one frees a deleted image's UUID for
  # reuse and is opt-in (the 2026-1 suite covers the opt-in shape). The manual
  # run pins the glance-manage purge CLI contract for this release rather than
  # waiting for the first midnight fire.
  - try:
    - assert:
        resource:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: glance-basic-db-purge
            namespace: openstack
          spec:
            schedule: "1 0 * * *"
            concurrencyPolicy: Forbid
            suspend: false
            jobTemplate:
              spec:
                activeDeadlineSeconds: 3600
    - script:
        content: |
          set -eu
          CMD=$(kubectl get cronjob glance-basic-db-purge -n openstack \
            -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[?(@.name=="db-purge")].command}')
          echo "db-purge command: $CMD"
          echo "$CMD" | grep -q -- '--age_in_days 30'
          echo "$CMD" | grep -q -- '--max_rows 1000'
          if echo "$CMD" | grep -q 'purge_images_table'; then
            echo "FAIL: purge_images_table must stay off without spec.dbPurge.purgeImagesTable"
            exit 1
          fi
          echo "OK: glance-basic-db-purge carries the default glance-manage purge flags"
    - script:
        timeout: 180s
        content: |
          set -eu

          kubectl create job glance-basic-db-purge-manual \
            --from=cronjob/glance-basic-db-purge -n openstack
          kubectl wait --for=condition=complete \
            job/glance-basic-db-purge-manual -n openstack --timeout=120s

          echo "OK: db-purge job completed successfully"
    catch:
    - script:
        content: |
          echo "=== db-purge CronJob ==="
          kubectl get cronjob glance-basic-db-purge -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== db-purge manual Job pods ==="
          kubectl get pods -n $NAMESPACE -l job-name=glance-basic-db-purge-manual -o wide 2>&1 || true
          for pod in $(kubectl get pods -n $NAMESPACE -l job-name=glance-basic-db-purge-manual -o name 2>/dev/null); do
            echo "--- $pod logs ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=100 2>&1 || true
            echo "--- $pod previous logs ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=100 --previous 2>&1 || true
            echo "--- $pod describe ---"
            kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -30 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -20 || true
