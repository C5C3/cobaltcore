# Default S3 image store for the glance-import-plugins CR. glance-api registers
# no store without a default backend, so the CR cannot reach a running
# Deployment (nor Ready) without it. It points at the in-cluster Garage S3
# endpoint and the pre-created glance-images bucket the kind infrastructure
# overlay ships, the same store the sibling glance suites write to. This suite
# uploads nothing, so it only ever reads the bucket's existence.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: GlanceBackend
metadata:
  name: glance-import-plugins-s3
  namespace: openstack
spec:
  glanceRef:
    name: glance-import-plugins
  type: S3
  isDefault: true
  s3:
    host: http://garage.openstack.svc.cluster.local:3900
    bucket: glance-images
    region: garage
    credentialsSecretRef:
      name: garage-s3-credentials
