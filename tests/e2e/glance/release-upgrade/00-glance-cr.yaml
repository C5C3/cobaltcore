# Glance CR fixture for the release-upgrade E2E test.
# Managed mode at the initial 2026.1 release: database via clusterRef to
# openstack-db (schema glance_release_upgrade), cache via clusterRef to
# openstack-memcached. The database credentials come from the ESO-synced
# glance-db Secret and the service-user password from the pre-seeded
# keystone-admin Secret (both deploy/kind/infrastructure). glance-api cannot
# start without a default image store, so 01-glance-backend.yaml attaches one
# before Ready can settle. A single replica keeps the rollout observable when
# 02-patch-upgrade.yaml bumps the release to 2026.2.
#
# Steps 3 and 6 of the suite store an image at 2026.1 and read it back at
# 2026.2. No Keystone is deployed in the glance e2e leg, so the image API is
# opened without a live token, the three settings of
# tests/e2e/glance/s3-multistore/00-glance-cr.yaml:
#   - [DEFAULT] allow_anonymous_access=true lets keystonemiddleware's
#     delay_auth_decision pipeline admit the tokenless request instead of
#     returning 401 from ContextMiddleware;
#   - the unauthenticated-context filter replaces the read_only anonymous
#     context, on which glance's @mutating decorator 403s every write before
#     any policy check;
#   - policyOverrides opens the image API rules for the role-less context ("@"
#     is oslo.policy's always-allow token; the CRD's CEL rule forbids an empty
#     rule value).
# The seven rules are s3-multistore's set, kept whole. Step 3 calls add_image,
# upload_image and get_image; step 6 calls get_images, get_image and
# download_image. Neither step calls delete_image or modify_image: the save
# that follows the 2026.2 S3 location rewrite goes from the location layer
# straight to the DB layer and passes no API policy check.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-release-upgrade
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: glance_release_upgrade
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  extraConfig:
    DEFAULT:
      allow_anonymous_access: "true"
  middleware:
    - name: unauthenticated-context
      filterFactory: glance.api.middleware.context:UnauthenticatedContextMiddleware.factory
      position: after
  policyOverrides:
    rules:
      add_image: "@"
      get_image: "@"
      get_images: "@"
      upload_image: "@"
      download_image: "@"
      delete_image: "@"
      modify_image: "@"
