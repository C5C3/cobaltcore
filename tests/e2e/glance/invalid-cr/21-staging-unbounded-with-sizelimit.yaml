# spec.staging.unbounded and spec.staging.sizeLimit contradict each
# other: unbounded renders both scratch emptyDirs with no sizeLimit at
# all, so there is no bound left for sizeLimit to name. The CEL rule on
# StagingSpec rejects the pair at the schema level, with the validating
# webhook repeating it for the ControlPlane copy of the same type.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-staging-unbounded
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  staging:
    unbounded: true
    sizeLimit: 40Gi
