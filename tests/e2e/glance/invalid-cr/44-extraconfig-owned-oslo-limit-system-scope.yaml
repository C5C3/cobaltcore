# spec.extraConfig setting [oslo_limit] system_scope is rejected by the
# validating webhook. The rendered [oslo_limit] auth and endpoint keys are
# Rejected registry entries owned by spec.keystoneLimits: a wrong value
# fails every quota check, and every image create answers 500.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-extraconfig-oslo-limit-system-scope
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  extraConfig:
    oslo_limit:
      system_scope: all
