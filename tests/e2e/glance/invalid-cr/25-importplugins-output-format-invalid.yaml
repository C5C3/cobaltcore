# spec.importPlugins.conversion.outputFormat of 'qcow3' violates the CRD
# Enum marker (qcow2;raw;vmdk). ValidateImportPlugins repeats the enum as
# defense in depth and for the ControlPlane, which carries this very type
# on services.glance.importPlugins.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-importplugins-format
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  importPlugins:
    conversion:
      outputFormat: qcow3
