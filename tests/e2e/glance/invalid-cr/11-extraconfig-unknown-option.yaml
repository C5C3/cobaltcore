# spec.extraConfig setting an unknown option 'default_backend_typo' in
# the known [glance_store] section is rejected by the validating webhook:
# the option is absent from the glance 2025.2 option catalog, so a typo'd
# key can never silently reach the rendered glance-api.conf.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-extraconfig-unknown-option
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  extraConfig:
    glance_store:
      default_backend_typo: s3
