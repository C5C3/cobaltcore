# Chainsaw E2E tests for Glance CRD webhook + CEL validation rejection.
# Pins the implemented CEL XValidation, kubebuilder-marker, and
# webhook.validate() rejection paths in operators/glance/api/v1alpha1/ to a
# deterministic admission failure. Each step applies an otherwise-valid Glance
# CR with a single aspect violating the rule under test, captures the admission
# $error, and asserts the field path plus message substring.
#
# All fixtures are generated from the single canonical scaffold in
# `_generate.py` (mirroring tests/e2e/horizon/invalid-cr/). After editing the
# scaffold or any per-fixture override, regenerate via:
#   python3 tests/e2e/glance/invalid-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes
# `_generate.py --check` (drift mode, both directions incl. orphans) and
# `test_generate.py` (FIXTURES count + chainsaw-test.yaml cross-reference)
# so any hand-edit to a generated fixture fails the build before the
# cluster-bound e2e-operator job runs.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: glance-invalid-cr
spec:
  steps:
  # spec.image with both tag and digest must be rejected.
  - try:
    - apply:
        file: 00-image-both-tag-digest.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'image')): true
            (contains($error, 'exactly one of image.tag or image.digest')): true
  # spec.openStackRelease with a non-cadence value must be rejected.
  - try:
    - apply:
        file: 01-openstackrelease-pattern.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'openStackRelease')): true
  # spec.database with both clusterRef and host must be rejected.
  - try:
    - apply:
        file: 02-database-clusterref-and-host.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'database')): true
            (contains($error, 'exactly one of clusterRef or host')): true
  # spec.cache with both clusterRef and servers must be rejected.
  - try:
    - apply:
        file: 03-cache-clusterref-and-servers.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'cache')): true
            (contains($error, 'exactly one of clusterRef or servers')): true
  # spec.keystoneEndpoint with a non-http(s) scheme must be rejected.
  - try:
    - apply:
        file: 04-keystone-endpoint-bad-scheme.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'keystoneEndpoint')): true
  # spec.autoscaling.minReplicas above maxReplicas must be rejected.
  - try:
    - apply:
        file: 05-autoscaling-min-above-max.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'minReplicas must not exceed maxReplicas')): true
  # spec.gateway with an empty hostname must be rejected.
  - try:
    - apply:
        file: 06-gateway-empty-hostname.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'hostname')): true
  # spec.apiServer.uwsgi.httpKeepAliveTimeout set with httpKeepAlive false must
  # be rejected (CEL rule on UWSGISpec).
  - try:
    - apply:
        file: 07-uwsgi-keepalive-timeout-without-keepalive.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'httpKeepAliveTimeout may only be set when httpKeepAlive is true')): true
  # spec.extraConfig with an empty section name must be rejected by the webhook.
  - try:
    - apply:
        file: 08-extraconfig-empty-section.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'extraConfig section name must not be empty')): true
  # spec.extraConfig with an empty option key must be rejected by the webhook.
  - try:
    - apply:
        file: 09-extraconfig-empty-key.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'extraConfig key must not be empty')): true
  # spec.extraConfig setting [keystone_authtoken] password must be rejected by
  # the webhook — the operator owns it via spec.serviceUser.secretRef and a file
  # value would leak the service password into the namespace-readable ConfigMap.
  - try:
    - apply:
        file: 10-extraconfig-owned-password.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'password is managed via spec.serviceUser.secretRef')): true
  # spec.extraConfig setting an unknown option (typo'd key) in a known section
  # must be rejected: it is absent from the glance 2025.2 option catalog.
  - try:
    - apply:
        file: 11-extraconfig-unknown-option.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'no such option in the glance 2025.2 option catalog')): true
  # spec.extraConfig declaring an unknown section (typo'd section name) must be
  # rejected: it is absent from the glance 2025.2 option catalog.
  - try:
    - apply:
        file: 12-extraconfig-unknown-section.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'no such section in the glance 2025.2 option catalog')): true
  # spec.importFiltering with both allowedHosts and disallowedHosts non-empty must
  # be rejected (CEL rule on ImportFilteringSpec): glance ignores the deny-list
  # whenever the matching allow-list is non-empty.
  - try:
    - apply:
        file: 13-importfiltering-allow-and-deny-hosts.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'allowedHosts and disallowedHosts are mutually exclusive')): true
  # A spec.importFiltering host carrying a newline must be rejected. The value is
  # comma-joined verbatim into [import_filtering_opts], so it would otherwise
  # render an INI section the ownership and catalog gates never inspect. The item
  # markers bound length only — the webhook is the sole gate here.
  - try:
    - apply:
        file: 14-importfiltering-host-control-char.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must not contain newline or carriage-return characters')): true
  # spec.extraConfig setting an [import_filtering_opts] key must be rejected: all
  # six are Rejected registry entries owned by spec.importFiltering, so the URI
  # filter cannot be loosened behind the admission gates that make that visible.
  - try:
    - apply:
        file: 15-extraconfig-owned-importfiltering.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'disallowed_hosts is managed via spec.importFiltering')): true
  # A newline in a spec.extraConfig option VALUE must be rejected: the rendered
  # INI writes `key = value` verbatim, so it would inject a whole section past the
  # ownership and catalog gates, which key on names and never inspect values.
  - try:
    - apply:
        file: 16-extraconfig-value-control-char.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'extraConfig key and value must not contain a newline or carriage return')): true
  # spec.dbPurge.retentionDays of 0 must be rejected by the CRD Minimum=1
  # marker.
  - try:
    - apply:
        file: 17-dbpurge-retentiondays-zero.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'dbPurge.retentionDays')): true
            (contains($error, 'should be greater than or equal to 1')): true
  # spec.dbPurge.schedule with a non-cron value must be rejected by the
  # validating webhook.
  - try:
    - apply:
        file: 18-dbpurge-invalid-schedule.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'invalid cron expression')): true
  # A metadata.name past 43 characters must be rejected: the {name}-db-purge
  # CronJob would exceed the 52-character cap the API server enforces, so the CR
  # would admit cleanly and then fail every reconcile.
  - try:
    - apply:
        file: 19-name-too-long-for-purge-cronjob.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'name must be at most 43 characters')): true
