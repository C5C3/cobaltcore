# spec.extraConfig declaring an unknown section 'glance_stor' (a typo for
# [glance_store]) is rejected by the validating webhook: the section is
# absent from the glance 2025.2 option catalog, so a typo'd section name
# can never silently reach the rendered glance-api.conf.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-extraconfig-unknown-section
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  extraConfig:
    glance_stor:
      default_backend: s3
