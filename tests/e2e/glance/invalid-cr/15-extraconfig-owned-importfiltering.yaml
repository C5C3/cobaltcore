# spec.extraConfig setting an [import_filtering_opts] key is rejected by
# the validating webhook. All six keys are Rejected registry entries owned
# by spec.importFiltering: the typed field expresses every one of them, so
# an extraConfig override buys no reach — only a way around the exclusivity
# rules, the host INI guard, and the warning that flags a loosened filter.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-extraconfig-importfiltering
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  extraConfig:
    import_filtering_opts:
      disallowed_hosts: ""
