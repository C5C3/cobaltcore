# spec.dbPurge.schedule with a non-cron value is rejected by the
# validating webhook — the cron grammar has no CRD schema counterpart,
# so DBPurgeSpec.Schedule is validated exclusively via
# validation.CronSchedule.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-dbpurge-schedule
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  dbPurge:
    schedule: "totally-not-cron"
