# spec.importFiltering with both allowedHosts and disallowedHosts non-empty
# violates the ImportFilteringSpec CEL rule: glance ignores the deny-list
# whenever the matching allow-list is non-empty, so accepting both would
# silently drop the denied host. The webhook mirrors it via
# validateImportFiltering.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-importfiltering-hosts
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  importFiltering:
    allowedHosts:
    - mirror.example.com
    disallowedHosts:
    - 169.254.169.254
