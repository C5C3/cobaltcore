# spec.imageCache.maintenanceInterval below a minute is rejected by the
# validating webhook — a metav1.Duration renders as a plain string in the
# CRD schema, a shape that carries no floor at all, so ValidateImageCache
# is the sole gate. Every tick walks the cache directory and its sqlite
# index, so a sub-minute loop spends the pod's local-disk bandwidth on
# maintenance rather than on the downloads the cache exists to accelerate.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-imagecache-interval
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  imageCache:
    maintenanceInterval: 59s
