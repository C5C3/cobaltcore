# spec.extraConfig carrying a newline in an option VALUE is rejected by the
# validating webhook. The rendered INI writes `key = value` verbatim, so the
# newline would inject a whole [profiler] section past the ownership and
# catalog gates — they key on (section, key) names and never look inside a
# value. The section and key here are both catalog-known and owned, which is
# exactly the shape that would otherwise be admitted.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-extraconfig-value-control-char
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  extraConfig:
    glance_store:
      default_backend: "s3\n[profiler]\nenabled = true"
