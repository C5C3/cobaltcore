# spec.middleware[].name of `cache` alongside spec.imageCache is rejected
# by the validating webhook: the operator injects that paste filter itself
# while the cache is on and renders its [filter:cache] section, so the two
# definitions would collide and the pipeline would end up with wiring
# nobody wrote. It correlates two spec fields, so no schema marker can
# express it and admission is the sole gate. The reservation lasts only as
# long as spec.imageCache is set — drop that block and this same
# middleware is admissible again.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-imagecache-middleware
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  imageCache: {}
  middleware:
  - name: cache
    filterFactory: example.middleware:Filter.factory
    position: after
