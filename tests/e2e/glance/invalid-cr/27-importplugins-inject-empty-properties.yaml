# spec.importPlugins.injectMetadata with an empty properties map violates the
# MinProperties=1 marker on the field, which is required as well, so an
# absent map is rejected the same way. validateImportInjectMetadata mirrors
# both: enabling inject_image_metadata with nothing to inject says nothing.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-importplugins-inject-empty
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  importPlugins:
    injectMetadata:
      properties: {}
