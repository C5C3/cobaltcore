# spec.targetClusterRef.name empty violates the MinLength=1 marker on
# the shared TargetClusterRefSpec; the webhook mirrors it via
# validation.TargetClusterRef. An unnamed target names no registered
# cluster, so the operator would have nowhere to place the children.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-targetclusterref
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  targetClusterRef:
    name: ""
