# spec.extraConfig setting [image_import_opts] image_import_plugins is
# rejected by the validating webhook. It is one of four Rejected registry
# entries owned by spec.importPlugins: a hand-written list can order
# conversion ahead of decompression, which rewrites the archive instead of
# the disk image inside it. Reaching that error at all is the per-key
# registry exemption at work: the section is in no catalog, so an
# unregistered key under it draws the unknown-section verdict instead.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-invalid-extraconfig-importplugins
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: glance-service-password
  extraConfig:
    image_import_opts:
      image_import_plugins: "[image_conversion,image_decompression]"
