# Default S3 image store for the glance-smoke CR. glance-api registers no store
# without a default backend, so the CR cannot reach a running Deployment (nor
# Ready) without it. It points at the in-cluster Garage S3 endpoint and the
# pre-created glance-images bucket the kind infrastructure overlay ships.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: GlanceBackend
metadata:
  name: glance-smoke-s3
  namespace: openstack
spec:
  glanceRef:
    name: glance-smoke
  type: S3
  isDefault: true
  s3:
    host: http://garage.openstack.svc.cluster.local:3900
    bucket: glance-images
    region: garage
    credentialsSecretRef:
      name: garage-s3-credentials
