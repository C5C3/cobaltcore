# Minimal Glance CR fixture for the Gateway quick-start smoke test — the
# counterpart to tests/e2e/keystone/gateway-quick-start-smoke and
# tests/e2e/horizon/gateway-quick-start-smoke for the third Gateway listener
# the kind overlay adds for the image service.
#
# This smoke test exercises the end-to-end TLS + Gateway data-plane path:
# `curl -k https://glance.127-0-0-1.nip.io/healthcheck` must return HTTP 200.
# That requires a Glance CR whose spec.gateway produces an HTTPRoute attaching
# to the kind overlay's `openstack-gw` Gateway on its `https-glance` listener
# (hostname `glance.127-0-0-1.nip.io`, terminating with `glance-nip-io-tls`).
#
# Name-collision avoidance: chainsaw-config.yaml sets `execution.parallel: 4`,
# so this fixture uses a unique CR name (`glance-smoke`) to avoid clashing with
# the sibling glance suites that share the `openstack` namespace and the
# backing services (`openstack-db`, `openstack-memcached`, Garage S3) and on
# HTTPRoute object names inside the `openstack` namespace. No other glance
# suite attaches to the nip.io Gateway hostname, so a root-path route does not
# conflict.
#
# The `/healthcheck` endpoint is the oslo healthcheck app mounted above the
# auth pipeline, so it answers 200 without a live Keystone or a database
# round-trip; keystoneEndpoint therefore points at the cluster-local
# convention URL and the smoke needs no running Keystone — exactly like the
# glance basic-deployment fixture. The hostname MUST match the `https-glance`
# listener hostname AND the dnsName on `Certificate/glance-nip-io-tls` so the
# listener's TLS Secret matches the SNI the client presents.
#
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-smoke
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/glance
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: glance_smoke
    secretRef:
      name: glance-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  gateway:
    parentRef:
      name: openstack-gw
    hostname: glance.127-0-0-1.nip.io
    path: /
