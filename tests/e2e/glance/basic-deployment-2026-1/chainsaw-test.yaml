# Chainsaw E2E test for happy-path Glance deployment (2026.1 release).
# Validates the full reconciliation cycle:
#   - All 9 sub-conditions progress to True with expected reasons
#   - Aggregate Ready=True with reason AllReady
#   - The API Deployment launches under uWSGI (the 2026.1-and-later launch mode,
#     `uwsgi ... --wsgi-file /var/lib/openstack/bin/glance-wsgi-api ...`; the
#     image-shipped shim, because glance's stock WSGI module ignores --pyargv
#     and would never see the two --config-dir mounts) — this is the one
#     assertion that genuinely differs from the 2025.2 basic-deployment suite,
#     where the eventlet glance-api server is launched instead
#   - Owned resources exist (Deployment, Service on 9292, PDB, config ConfigMap,
#     backends Secret)
#   - The attached default S3 backend reaches Ready=True
#   - The Glance API answers /healthcheck over HTTP (200) — the oslo healthcheck
#     middleware proves the WSGI app serves requests
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: glance-basic-deployment-2026-1
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply the Glance CR and its default S3 backend ──────────────
  - try:
    - apply:
        file: 00-glance-cr.yaml
    - apply:
        file: 01-glance-backend.yaml
  # ── Step 2: Assert all sub-conditions and Ready ────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: glance.openstack.c5c3.io/v1alpha1
          kind: Glance
          metadata:
            name: glance-basic-2026
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "True"
              reason: SecretsAvailable
            (conditions[?type == 'BackendsReady']):
            - status: "True"
              reason: AllBackendsProjected
            (conditions[?type == 'DatabaseReady']):
            - status: "True"
              reason: DatabaseSynced
            (conditions[?type == 'DeploymentReady']):
            - status: "True"
              reason: DeploymentReady
            (conditions[?type == 'GlanceAPIReady']):
            - status: "True"
              reason: APIHealthy
            (conditions[?type == 'HPAReady']):
            - status: "True"
              reason: HPANotRequired
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
            (conditions[?type == 'HTTPRouteReady']):
            - status: "True"
              reason: HTTPRouteNotRequired
            (conditions[?type == 'DBPurgeReady']):
            - status: "True"
              reason: DBPurgeScheduled
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== Glance CR status ==="
          kubectl get glance glance-basic-2026 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== GlanceBackend status ==="
          kubectl get glancebackend glance-basic-2026-s3 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Glance API pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=glance-basic-2026 -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Assert the Deployment, its uWSGI launch command, Service ────
  # ── and PDB ─────────────────────────────────────────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: glance-basic-2026
            namespace: openstack
          spec:
            template:
              spec:
                containers:
                - name: glance-api
                  command:
                  - uwsgi
                  - "--http"
                  - ":9292"
                  - "--http-auto-chunked"
                  - "--http-chunked-input"
                  - "--http-keepalive"
                  - "--log-master"
                  - "--log-format"
                  - "%(method) %(uri) => generated %(rsize) bytes in %(msecs) msecs (%(proto) %(status))"
                  - "--wsgi-file"
                  - "/var/lib/openstack/bin/glance-wsgi-api"
                  - "--master"
                  - "--lazy-apps"
                  - "--need-app"
                  - "--processes"
                  - "2"
                  - "--threads"
                  - "1"
                  - "--pyargv"
                  - "--config-dir /etc/glance/glance-api.conf.d/ --config-dir /etc/glance/backends.conf.d/"
                # The CR sets spec.staging.sizeLimit, so the explicit value must
                # land on BOTH scratch emptyDirs — staging holds the import
                # download, tasks-work the async task scratch, and either one
                # unbounded fills the node's disk. The default-path assertion
                # (10Gi with no spec.staging) lives in the 2025.2
                # basic-deployment suite.
                (volumes[?name == 'staging'].emptyDir.sizeLimit | [0]): 20Gi
                (volumes[?name == 'tasks-work'].emptyDir.sizeLimit | [0]): 20Gi
          status:
            (availableReplicas > `0`): true
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: glance-basic-2026
            namespace: openstack
          spec:
            ports:
            - port: 9292
    - assert:
        resource:
          apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata:
            name: glance-basic-2026
            namespace: openstack
            labels:
              app.kubernetes.io/name: glance
              app.kubernetes.io/instance: glance-basic-2026
              app.kubernetes.io/managed-by: glance-operator
          spec:
            minAvailable: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: glance
                app.kubernetes.io/instance: glance-basic-2026
  # ── Step 4: Assert the default S3 backend is Ready ─────────────────────
  - try:
    - assert:
        resource:
          apiVersion: glance.openstack.c5c3.io/v1alpha1
          kind: GlanceBackend
          metadata:
            name: glance-basic-2026-s3
            namespace: openstack
          status:
            (conditions[?type == 'CredentialsReady']):
            - status: "True"
              reason: CredentialsAvailable
            (conditions[?type == 'ConfigProjected']):
            - status: "True"
              reason: ConfigProjected
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
  # ── Step 5: Assert the rendered config ConfigMap and backends Secret ────
  - try:
    - script:
        content: |
          kubectl get cm -n openstack -o name | grep glance-basic-2026-config-
          kubectl get secret -n openstack -o name | grep glance-basic-2026-backends-
  # ── Step 6: Assert the Glance API answers /healthcheck over HTTP ────────
  # HTTP-level API coverage: the oslo healthcheck middleware answers without
  # touching the database or Keystone, proving the WSGI app is serving requests.
  # The probe retries connection-level failures inside the pod: kube-proxy's
  # endpoint programming can trail the CR's Ready flip by a second or two, so
  # a single-shot request races it (seen in CI). HTTP errors still fail hard.
  - try:
    - script:
        timeout: 90s
        content: |
          kubectl run curl-test-glance-basic-2026 -n $NAMESPACE --image=ghcr.io/c5c3/glance:2026.1 --rm -i --restart=Never \
            --command -- python3 -c "
          import time, urllib.error, urllib.request
          last = None
          for _ in range(15):
              try:
                  r = urllib.request.urlopen('http://glance-basic-2026.openstack.svc:9292/healthcheck')
                  assert r.status == 200, r.status
                  print('healthcheck OK, status %d' % r.status)
                  break
              except urllib.error.HTTPError as exc:
                  raise SystemExit('GET /healthcheck -> HTTP %d' % exc.code)
              except (urllib.error.URLError, ConnectionError, OSError) as exc:
                  last = exc
                  print('healthcheck retry: %s' % exc)
                  time.sleep(2)
          else:
              raise SystemExit('healthcheck never answered after retries: %r' % last)
          "
    catch:
    - script:
        content: |
          echo "=== Glance CR status ==="
          kubectl get glance glance-basic-2026 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n glance-system -l app.kubernetes.io/name=glance-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Glance API pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=glance-basic-2026 -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 7: Assert the db-purge CronJob and an operator-observed run ──────
  # The CR sets spec.dbPurge, so this leg covers the accept path through the CRD
  # schema plus the validating webhook and the operator honoring each knob: the
  # every-minute schedule, the 7-day retention, and the opt-in images-table pass
  # (off by default — the images row is what keeps a deleted image's UUID
  # reserved). The every-minute schedule then produces a real firing inside the
  # suite, so the chain no unit test can reach is exercised end to end: the
  # CronJob controller propagates the jobTemplate labels and a controller
  # reference onto the Job it spawns, the operator lists that Job by label,
  # keeps it because it is controlled by the CronJob, and stamps the
  # once-per-UID dedupe annotation as it counts the run.
  - try:
    - assert:
        resource:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: glance-basic-2026-db-purge
            namespace: openstack
          spec:
            schedule: "*/1 * * * *"
            # Two purges deleting the same rows contend; a wedged run must not
            # outlive its deadline and must not be overtaken by the next firing.
            concurrencyPolicy: Forbid
            suspend: false
            jobTemplate:
              spec:
                activeDeadlineSeconds: 3600
    - script:
        content: |
          set -eu
          CMD=$(kubectl get cronjob glance-basic-2026-db-purge -n openstack \
            -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[?(@.name=="db-purge")].command}')
          echo "db-purge command: $CMD"
          echo "$CMD" | grep -q -- '--age_in_days 7'
          echo "$CMD" | grep -q -- '--max_rows 1000'
          echo "$CMD" | grep -q 'purge_images_table'
          echo "OK: glance-basic-2026-db-purge carries the spec.dbPurge glance-manage purge flags"
    - script:
        timeout: 300s
        content: |
          set -eu

          # The CronJob controller fires within the minute; wait for the Job it
          # spawns to complete. This pins the glance-manage purge CLI contract
          # for this release against a real database.
          echo "waiting for a CronJob-spawned db-purge run to complete..."
          for _ in $(seq 1 60); do
            LAST=$(kubectl get cronjob glance-basic-2026-db-purge -n openstack \
              -o jsonpath='{.status.lastSuccessfulTime}')
            [ -n "$LAST" ] && break
            sleep 5
          done
          [ -n "$LAST" ] || { echo "FAIL: no db-purge run succeeded"; exit 1; }
          echo "OK: db-purge run succeeded at $LAST"

          # The operator must have observed that run: the dedupe annotation is
          # stamped only for a terminal Job the purge CronJob controls, so a
          # non-empty value proves the whole list → ownership → count chain ran
          # against a Job the CronJob controller built, not a hand-made one.
          echo "waiting for the operator to observe the run..."
          for _ in $(seq 1 30); do
            UID_ANN=$(kubectl get glance glance-basic-2026 -n openstack \
              -o jsonpath='{.metadata.annotations.cobaltcore\.c5c3\.io/last-db-purge-job-uid}')
            [ -n "$UID_ANN" ] && break
            sleep 5
          done
          [ -n "$UID_ANN" ] || { echo "FAIL: the operator never observed a purge run"; exit 1; }
          echo "OK: operator observed db-purge Job UID $UID_ANN"
    - assert:
        resource:
          apiVersion: glance.openstack.c5c3.io/v1alpha1
          kind: Glance
          metadata:
            name: glance-basic-2026
            namespace: openstack
          status:
            (conditions[?type == 'DBPurgeReady']):
            - status: "True"
              reason: DBPurgeScheduled
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== db-purge CronJob ==="
          kubectl get cronjob glance-basic-2026-db-purge -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== db-purge Jobs ==="
          kubectl get jobs -n $NAMESPACE -o wide 2>&1 | grep db-purge || true
          echo "=== db-purge pods ==="
          for jb in $(kubectl get jobs -n $NAMESPACE -o name 2>/dev/null | grep db-purge); do
            name=${jb#job.batch/}
            echo "--- $name ---"
            kubectl describe -n $NAMESPACE "$jb" 2>&1 | tail -30 || true
            for pod in $(kubectl get pods -n $NAMESPACE -l job-name="$name" -o name 2>/dev/null); do
              echo "--- $pod logs ---"
              kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=100 2>&1 || true
              echo "--- $pod describe ---"
              kubectl describe -n $NAMESPACE "$pod" 2>&1 | tail -30 || true
            done
          done
          echo "=== Glance CR ==="
          kubectl get glance glance-basic-2026 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -20 || true
