# Patch: unset spec.podDisruptionBudget. Chainsaw merge-patches with this
# manifest, setting the field to null, so the default budget returns.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-scale
  namespace: openstack
spec:
  podDisruptionBudget: null
