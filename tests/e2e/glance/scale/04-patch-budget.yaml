# Patch: set the Glance API PodDisruptionBudget to maxUnavailable: 1.
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-scale
  namespace: openstack
spec:
  podDisruptionBudget:
    maxUnavailable: 1
