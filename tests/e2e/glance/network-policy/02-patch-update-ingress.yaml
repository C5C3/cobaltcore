# Patch: add a second ingress source, the namespace of the outside probe
# client (glance-netpol-outside).
apiVersion: glance.openstack.c5c3.io/v1alpha1
kind: Glance
metadata:
  name: glance-netpol
  namespace: openstack
spec:
  networkPolicy:
    ingress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openstack
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: glance-netpol-outside
