# Control pod for the network-policy-egress E2E test (Step 4b of
# chainsaw-test.yaml). It runs in horizon-system beside the probe pod of
# 02-probe-pod.yaml but carries a name no policy selects, so its connection to
# the MariaDB port shows that the server listens and is reachable before Step 5
# reads a timeout on that port as the policy's drop. It has no
# pod-template-hash label, so no ReplicaSet adopts it, and chainsaw deletes it
# when the test ends. The horizon service image brings the python3 the probe
# runs. UID and GID 42424 are the openstack user of the service images
# (internal/common/deployment/security_context.go).
apiVersion: v1
kind: Pod
metadata:
  name: horizon-operator-netpol-control
  namespace: horizon-system
  labels:
    app.kubernetes.io/name: netpol-probe-client
    app.kubernetes.io/instance: horizon-operator-netpol
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsNonRoot: true
    runAsUser: 42424
    runAsGroup: 42424
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: ghcr.io/c5c3/horizon:2026.1
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
