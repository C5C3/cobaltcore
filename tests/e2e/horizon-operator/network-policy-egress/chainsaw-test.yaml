# Chainsaw E2E test for the horizon-operator NetworkPolicy egress restriction,
# the Horizon copy of tests/e2e/keystone-operator/network-policy-egress.
#
# ENFORCEMENT
#   The kindnetd of kind v0.32 and later (CI pins KIND_VERSION) enforces
#   NetworkPolicy and judges egress after the Service DNAT: a connection to
#   the kubernetes Service VIP (10.96.0.1:443) is judged as one to the API
#   server's endpoint address on port 6443, so a rule naming the VIP never
#   matches. Such a rule let the operator through only when its first API
#   connection opened before kindnet added the new pod to its policy set,
#   and failed the install whenever kindnet was faster. Step 1 therefore
#   reads the addresses and the port from EndpointSlice default/kubernetes,
#   the source hack/deploy-infra.sh reads for the OpenBao instance.
#   This test validates that:
#     1. The chart renders the NetworkPolicy (Helm install + Step 2 assert).
#     2. The operator pod starts and turns Ready under the enforced policy,
#        so its DNS and API server rules admit the traffic it starts with,
#        and its setup probes read the Gateway API as installed (Step 2b).
#     3. The policy selects the pod of this release and not the pod of the
#        primary horizon-operator release, and it is the only NetworkPolicy
#        in horizon-system (Step 2c). The operator pod never restarted,
#        checked after the install (Step 2c) and after the last probe
#        (Step 5b).
#     4. A Horizon CR reconciles to Ready=True while the policy is present.
#     5. A control pod no policy selects reaches TCP 3306 on openstack-db, so
#        Step 5 reads a timeout on that port as the policy's drop and not as
#        a server that does not listen (Step 4b).
#     6. A pod the policy selects is dropped on a port no rule admits and
#        reaches the dashboard through its Service (Step 5), which the
#        chart's TCP 8080 rule admits for the dashboard health check.
#     7. After that drop, the pod the policy selects resolves a cluster name
#        and reaches the API server endpoint and the kubernetes Service VIP
#        on fresh connections (Step 5b).
#   With leader election enabled and a second operator release installed
#   alongside the primary one from hack/ci-deploy-operator.sh, there is no
#   guarantee the netpol-restricted pod (vs. the primary) is the one that
#   drove the CR to Ready, so item 4 alone does not prove the API rule;
#   item 6 does.
#
# Installs a second horizon-operator Helm release with networkPolicy.enabled=
# true and the cluster's API server endpoint, then applies a minimal Horizon
# CR and asserts it reaches Ready=True under the egress policy. A catch block
# dumps operator pod logs, the rendered NetworkPolicy, and namespace events on
# failure.
#
# webhook.enabled=false (see 00-install-operator.yaml) avoids conflicting
# admission-webhook registration with the primary operator deployed by
# hack/ci-deploy-operator.sh — matching the pattern established in
# tests/e2e/horizon/namespace-scoped-rbac/chainsaw-test.yaml.
#
# Verifies:
#   - NetworkPolicy is emitted in the release namespace
#   - Operator pod starts and stays Ready under the policy
#   - The netpol operator's setup log reports the Gateway API as detected, so
#     a probe the policy blocks is not read as a missing CRD
#   - The policy selects only the pod of this release, it is the only policy
#     in horizon-system, and the operator pod never restarts during the test
#   - A Horizon CR reconciles to Ready=True under the policy
#   - A control pod no policy selects reaches the MariaDB port
#   - The policy drops a pod it selects on the MariaDB port and admits it to
#     the dashboard on TCP 8080
#   - After that drop, the pod resolves a cluster name and reaches the API
#     server endpoint and the kubernetes Service VIP
#   - Failures produce enough diagnostic output to debug egress regressions
#     without re-running locally
#
# The operator NetworkPolicy lives in horizon-system; the Horizon CR stays in
# openstack to exercise cross-Namespace operator-to-workload semantics.
#
# Running it locally: the chart's operator-library dependency must be vendored
# first (`helm dependency build operators/horizon/helm/horizon-operator`,
# which hack/ci-deploy-operator.sh does on CI). Paths resolve from
# GITHUB_WORKSPACE in CI and from the git repository root locally.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: horizon-operator-network-policy-egress
spec:
  namespace: horizon-system
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Install operator Helm chart with networkPolicy.enabled=true ──
  # kubeApiServer comes from EndpointSlice default/kubernetes, not from the
  # values file (see ENFORCEMENT above).
  - try:
    - script:
        timeout: 120s
        content: |
          set -eu
          REPO_ROOT="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}"
          SLICE="$(kubectl get endpointslice kubernetes -n default -o json)"
          CIDRS="$(echo "${SLICE}" | jq -r '[.endpoints[]?.addresses[]? | . + (if contains(":") then "/128" else "/32" end)] | unique | join(",")')"
          PORT="$(echo "${SLICE}" | jq -r '[.ports[]?.port | select(. != null)] | first // empty')"
          if [ -z "${CIDRS}" ] || [ -z "${PORT}" ]; then
            echo "ERROR: EndpointSlice default/kubernetes carries no address or no port"
            exit 1
          fi
          helm install horizon-operator-netpol \
            "${REPO_ROOT}/operators/horizon/helm/horizon-operator/" \
            --namespace horizon-system --create-namespace \
            --values "${REPO_ROOT}/tests/e2e/horizon-operator/network-policy-egress/00-install-operator.yaml" \
            --set "networkPolicy.kubeApiServer.cidrs={${CIDRS}}" \
            --set "networkPolicy.kubeApiServer.ports={${PORT}}" \
            --wait --timeout 90s
    catch:
    - script:
        content: |
          echo "=== Helm status ==="
          helm status horizon-operator-netpol -n horizon-system 2>&1 || true
          echo "=== Pod status ==="
          kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o wide 2>&1 || true
          echo "=== Operator pod logs ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 2>&1 || true
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 --previous 2>&1 || true
          done
          echo "=== NetworkPolicy state ==="
          kubectl get networkpolicy horizon-operator-netpol -n horizon-system -o yaml 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n horizon-system --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
    # The step cleanup runs at the end of the test, also after a failed step,
    # so the second release cannot outlive this suite. The release-scoped
    # uninstall removes the Deployment, ServiceAccount, ClusterRole/Binding
    # and NetworkPolicy of this release and leaves the primary operator of
    # hack/ci-deploy-operator.sh installed.
    cleanup:
    - script:
        content: |
          helm uninstall horizon-operator-netpol -n horizon-system 2>&1 || true
  # ── Step 2: Assert NetworkPolicy exists in release namespace ──
  - try:
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: horizon-operator-netpol
            namespace: horizon-system
            labels:
              app.kubernetes.io/name: horizon-operator
              app.kubernetes.io/instance: horizon-operator-netpol
              app.kubernetes.io/managed-by: Helm
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: horizon-operator
                app.kubernetes.io/instance: horizon-operator-netpol
            policyTypes:
            - Ingress
            - Egress
  # ── Step 2b: Assert the setup probes answered under the policy ──────────
  # The e2e cluster serves HTTPRoute (hack/deploy-infra.sh installs the
  # Gateway API CRDs), so the setup probe must read it as installed. A probe
  # the policy blocks fails the operator's setup and restarts the pod, which
  # Step 1's --wait reports; this step catches a blocked probe read as a
  # missing CRD instead. The setup log is written before leader election, so
  # the line is there whichever release leads. kubectl logs reads the running
  # container, whose setup decided the watches it runs with.
  - try:
    - script:
        timeout: 60s
        content: |
          set -eu
          PODS="$(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o name)"
          if [ -z "${PODS}" ]; then
            echo "ERROR: no horizon-operator-netpol pod found"
            exit 1
          fi
          for pod in ${PODS}; do
            LOGS="$(kubectl logs -n horizon-system "${pod}" --all-containers)"
            if ! printf '%s\n' "${LOGS}" | grep -qF 'Gateway API detected; enabling HTTPRoute watch and reconciliation'; then
              echo "ERROR: ${pod} did not log the Gateway API as detected under the policy; first 40 log lines:"
              printf '%s\n' "${LOGS}" | head -40
              exit 1
            fi
            echo "${pod} logged the Gateway API as detected"
          done
  # ── Step 2c: Assert what the policy selects and that the pod never restarted
  # The policy selects the pods of this release by its two selector labels.
  # The primary horizon-operator release carries instance horizon-operator,
  # so the policy cannot select it, and no other policy in horizon-system may
  # judge the pods of Steps 4b and 5. A restart shows that the policy denied
  # the operator something it starts with.
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: horizon-operator-netpol
            namespace: horizon-system
          spec:
            selector:
              matchLabels:
                app.kubernetes.io/name: horizon-operator
                app.kubernetes.io/instance: horizon-operator-netpol
          status:
            readyReplicas: 1
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: horizon-operator
            namespace: horizon-system
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/instance: horizon-operator
    - script:
        timeout: 30s
        content: |
          set -eu
          POLICIES="$(kubectl get networkpolicy -n horizon-system -o name)"
          if [ "${POLICIES}" != "networkpolicy.networking.k8s.io/horizon-operator-netpol" ]; then
            echo "ERROR: horizon-system holds NetworkPolicies besides horizon-operator-netpol:"
            printf '%s\n' "${POLICIES}"
            exit 1
          fi
    - script:
        timeout: 60s
        content: |
          set -eu
          PODS="$(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o name)"
          if [ -z "${PODS}" ]; then
            echo "ERROR: no horizon-operator-netpol pod found"
            exit 1
          fi
          for pod in ${PODS}; do
            RESTARTS="$(kubectl get -n horizon-system "${pod}" -o jsonpath='{.status.containerStatuses[*].restartCount}')"
            if [ -z "${RESTARTS}" ]; then
              echo "ERROR: ${pod} reports no container status"
              exit 1
            fi
            for n in ${RESTARTS}; do
              if [ "${n}" != 0 ]; then
                echo "ERROR: ${pod} restarted ${n} times under the policy; previous log:"
                kubectl logs -n horizon-system "${pod}" --all-containers --previous --tail=60 2>&1 || true
                exit 1
              fi
            done
            echo "${pod} has not restarted under the policy"
          done
    catch:
    - script:
        timeout: 60s
        content: |
          echo "=== Fixture pods ==="
          kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o wide --show-labels 2>&1 || true
          kubectl get pods -n openstack -l app.kubernetes.io/instance=horizon-netpol-egress -o wide --show-labels 2>&1 || true
          echo "=== Pods that are not Ready ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o name 2>/dev/null); do
            ready="$(kubectl get -n horizon-system "$pod" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
            if [ "$ready" != True ]; then
              echo "--- $pod ---"
              kubectl describe -n horizon-system "$pod" 2>&1 | tail -20 || true
            fi
          done
          echo "=== NetworkPolicy YAML ==="
          kubectl get networkpolicy horizon-operator-netpol -n horizon-system -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol,pod-template-hash -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 2>&1 || true
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 --previous 2>&1 || true
          done
          echo "=== EndpointSlice and Service default/kubernetes ==="
          kubectl get endpointslice kubernetes -n default -o yaml 2>&1 || true
          kubectl get service kubernetes -n default -o yaml 2>&1 || true
          echo "=== Events (horizon-system, last 30) ==="
          kubectl get events -n horizon-system --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
          echo "=== Events (openstack, last 30) ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Apply minimal Horizon CR ───────────────────────────
  - try:
    - apply:
        file: 01-horizon-cr.yaml
  # ── Step 4: Assert Horizon CR reaches Ready=True under restricted policy
  - try:
    - assert:
        resource:
          apiVersion: horizon.openstack.c5c3.io/v1alpha1
          kind: Horizon
          metadata:
            name: horizon-netpol-egress
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== Operator pod logs (current) ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n horizon-system "$pod" --all-containers --tail=200 2>&1 || true
          done
          echo "=== Operator pod logs (previous) ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n horizon-system "$pod" --all-containers --tail=200 --previous 2>&1 || true
          done
          echo "=== NetworkPolicy YAML ==="
          kubectl get networkpolicy horizon-operator-netpol -n horizon-system -o yaml 2>&1 || true
          echo "=== Horizon CR status ==="
          kubectl get horizon horizon-netpol-egress -n openstack -o jsonpath='{.status}' 2>&1 | jq . || true
          echo "=== Dashboard pod logs ==="
          for pod in $(kubectl get pods -n openstack -l app.kubernetes.io/instance=horizon-netpol-egress -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n openstack "$pod" --all-containers --tail=80 2>&1 || true
            kubectl logs -n openstack "$pod" --all-containers --tail=80 --previous 2>&1 || true
          done
          echo "=== Events (operator ns, last 30) ==="
          kubectl get events -n horizon-system --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
          echo "=== Events (workload ns, last 30) ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 4b: Reach the MariaDB port from a pod no policy selects ────────
  # The control pod of 03-control-pod.yaml carries a name no policy selects.
  # Its connection shows that openstack-db listens on TCP 3306 and is
  # reachable from horizon-system, so a timeout in Step 5 is the policy's
  # drop and not a server that does not answer.
  - try:
    - apply:
        file: 03-control-pod.yaml
    - script:
        timeout: 3m
        content: |
          set -eu
          kubectl wait --for=condition=Ready pod/horizon-operator-netpol-control \
            -n horizon-system --timeout=120s
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          "${PROBE}" horizon-system horizon-operator-netpol-control open openstack-db.openstack.svc 3306
    catch:
    - script:
        timeout: 60s
        content: |
          echo "=== Fixture pods ==="
          kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o wide --show-labels 2>&1 || true
          kubectl get pods -n openstack -l app.kubernetes.io/instance=horizon-netpol-egress -o wide --show-labels 2>&1 || true
          echo "=== Pods that are not Ready ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o name 2>/dev/null); do
            ready="$(kubectl get -n horizon-system "$pod" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
            if [ "$ready" != True ]; then
              echo "--- $pod ---"
              kubectl describe -n horizon-system "$pod" 2>&1 | tail -20 || true
            fi
          done
          echo "=== NetworkPolicy YAML ==="
          kubectl get networkpolicy horizon-operator-netpol -n horizon-system -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol,pod-template-hash -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 2>&1 || true
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 --previous 2>&1 || true
          done
          echo "=== EndpointSlice and Service default/kubernetes ==="
          kubectl get endpointslice kubernetes -n default -o yaml 2>&1 || true
          kubectl get service kubernetes -n default -o yaml 2>&1 || true
          echo "=== Events (horizon-system, last 30) ==="
          kubectl get events -n horizon-system --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
          echo "=== Events (openstack, last 30) ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 5: Probe the enforced policy from a pod it selects ─────────────
  # Step 4 cannot tell which release drove the CR to Ready (see ENFORCEMENT
  # above). The probe pod of 02-probe-pod.yaml carries the release's selector
  # labels, so the policy judges its connections. kindnet adds a new pod to
  # its policy set a moment after the pod starts, so the probe first waits
  # until a connection to the MariaDB Service, which no rule admits, is
  # dropped. The dashboard Service the health check calls must then answer
  # the login page, which only the chart's TCP 8080 rule admits.
  - try:
    - apply:
        file: 02-probe-pod.yaml
    - script:
        timeout: 6m
        content: |
          set -eu
          kubectl wait --for=condition=Ready pod/horizon-operator-netpol-probe \
            -n horizon-system --timeout=120s
          kubectl exec -n horizon-system horizon-operator-netpol-probe -- python3 -c "
          import socket, time, urllib.error, urllib.request

          def dropped(host, port):
              try:
                  socket.create_connection((host, port), timeout=5).close()
              except socket.timeout:
                  return True
              except OSError as exc:
                  print('TCP %d to %s not dropped yet: %s' % (port, host, exc))
                  return False
              print('TCP %d to %s connected: the policy does not hold the pod yet' % (port, host))
              return False

          for _ in range(15):
              if dropped('openstack-db.openstack.svc', 3306):
                  print('TCP 3306 to openstack-db is dropped')
                  break
              time.sleep(2)
          else:
              raise SystemExit('the policy never dropped TCP 3306 to openstack-db')

          last = None
          for _ in range(5):
              try:
                  r = urllib.request.urlopen('http://horizon-netpol-egress.openstack.svc:8080/auth/login/', timeout=10)
                  print('GET /auth/login/ -> HTTP %d' % r.status)
                  break
              except urllib.error.HTTPError as exc:
                  raise SystemExit('GET /auth/login/ -> HTTP %d' % exc.code)
              except OSError as exc:
                  last = exc
                  print('GET /auth/login/ retry: %s' % exc)
                  time.sleep(2)
          else:
              raise SystemExit('the policy dropped the dashboard on TCP 8080: %r' % last)
          "
    catch:
    - script:
        content: |
          echo "=== Probe pod ==="
          kubectl get pod horizon-operator-netpol-probe -n horizon-system -o wide --show-labels 2>&1 || true
          kubectl describe pod horizon-operator-netpol-probe -n horizon-system 2>&1 | tail -20 || true
          echo "=== NetworkPolicy YAML ==="
          kubectl get networkpolicy horizon-operator-netpol -n horizon-system -o yaml 2>&1 || true
          echo "=== Dashboard pods and Service ==="
          kubectl get pods,endpointslices -n openstack -l app.kubernetes.io/instance=horizon-netpol-egress -o wide --show-labels 2>&1 || true
          echo "=== Operator pod logs ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol,pod-template-hash -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 2>&1 || true
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 --previous 2>&1 || true
          done
          echo "=== Events (horizon-system, last 30) ==="
          kubectl get events -n horizon-system --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
          echo "=== Events (openstack, last 30) ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 5b: Probe DNS and the API server after the drop ────────────────
  # Step 5 saw the policy drop the probe pod, so kindnet holds it. Each call
  # below opens a fresh connection, which only the policy's DNS and API
  # server rules admit. The API endpoint is the first IPv4 address of
  # EndpointSlice default/kubernetes, the address Step 1 admits; the Service
  # VIP reaches it through the DNAT. The trailing dot keeps the resolver off
  # the search list. The last script repeats Step 2c's restart check, since
  # the operator pod has run under the policy through Steps 3 to 5b. The
  # probe and control pods carry the release's instance label too, so the
  # pod-template-hash selector leaves them out.
  - try:
    - script:
        timeout: 3m
        content: |
          set -eu
          # require <name> <value>: stop with an ERROR line when the value is empty.
          require() {
            if [ -z "$2" ]; then
              echo "ERROR: $1 is empty"
              exit 1
            fi
          }
          SLICE="$(kubectl get endpointslice kubernetes -n default -o json)"
          API_IP="$(echo "${SLICE}" | jq -r '[.endpoints[]?.addresses[]? | select(contains(":") | not)] | first // empty')"
          API_PORT="$(echo "${SLICE}" | jq -r '[.ports[]?.port | select(. != null)] | first // empty')"
          VIP="$(kubectl get service kubernetes -n default -o jsonpath='{.spec.clusterIP}')"
          VIP_PORT="$(kubectl get service kubernetes -n default -o jsonpath='{.spec.ports[0].port}')"
          require API_IP "${API_IP}"
          require API_PORT "${API_PORT}"
          require VIP "${VIP}"
          require VIP_PORT "${VIP_PORT}"
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          "${PROBE}" horizon-system horizon-operator-netpol-probe resolves kubernetes.default.svc.cluster.local.
          "${PROBE}" horizon-system horizon-operator-netpol-probe open "${API_IP}" "${API_PORT}"
          "${PROBE}" horizon-system horizon-operator-netpol-probe open "${VIP}" "${VIP_PORT}"
    - script:
        timeout: 60s
        content: |
          set -eu
          PODS="$(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol,pod-template-hash -o name)"
          if [ -z "${PODS}" ]; then
            echo "ERROR: no horizon-operator-netpol operator pod found"
            exit 1
          fi
          for pod in ${PODS}; do
            RESTARTS="$(kubectl get -n horizon-system "${pod}" -o jsonpath='{.status.containerStatuses[*].restartCount}')"
            if [ -z "${RESTARTS}" ]; then
              echo "ERROR: ${pod} reports no container status"
              exit 1
            fi
            for n in ${RESTARTS}; do
              if [ "${n}" != 0 ]; then
                echo "ERROR: ${pod} restarted ${n} times under the policy; previous log:"
                kubectl logs -n horizon-system "${pod}" --all-containers --previous --tail=60 2>&1 || true
                exit 1
              fi
            done
            echo "${pod} has not restarted under the policy"
          done
    catch:
    - script:
        timeout: 60s
        content: |
          echo "=== Fixture pods ==="
          kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o wide --show-labels 2>&1 || true
          kubectl get pods -n openstack -l app.kubernetes.io/instance=horizon-netpol-egress -o wide --show-labels 2>&1 || true
          echo "=== Pods that are not Ready ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol -o name 2>/dev/null); do
            ready="$(kubectl get -n horizon-system "$pod" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
            if [ "$ready" != True ]; then
              echo "--- $pod ---"
              kubectl describe -n horizon-system "$pod" 2>&1 | tail -20 || true
            fi
          done
          echo "=== NetworkPolicy YAML ==="
          kubectl get networkpolicy horizon-operator-netpol -n horizon-system -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          for pod in $(kubectl get pods -n horizon-system -l app.kubernetes.io/instance=horizon-operator-netpol,pod-template-hash -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 2>&1 || true
            kubectl logs -n horizon-system "$pod" --all-containers --tail=120 --previous 2>&1 || true
          done
          echo "=== EndpointSlice and Service default/kubernetes ==="
          kubectl get endpointslice kubernetes -n default -o yaml 2>&1 || true
          kubectl get service kubernetes -n default -o yaml 2>&1 || true
          echo "=== Events (horizon-system, last 30) ==="
          kubectl get events -n horizon-system --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
          echo "=== Events (openstack, last 30) ==="
          kubectl get events -n openstack --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
