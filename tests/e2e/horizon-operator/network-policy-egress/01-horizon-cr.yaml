# Horizon CR fixture for the horizon-operator network-policy-egress E2E test:
# basic-deployment's spec with one replica. The dashboard Service
# horizon-netpol-egress.openstack.svc is in the rendered ALLOWED_HOSTS, so the
# probe pod of 02-probe-pod.yaml can GET the login page through it.
apiVersion: horizon.openstack.c5c3.io/v1alpha1
kind: Horizon
metadata:
  name: horizon-netpol-egress
  namespace: openstack
spec:
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/horizon
    tag: "2026.1"
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  secretKeyRef:
    name: horizon-secret-key
    key: secret-key
