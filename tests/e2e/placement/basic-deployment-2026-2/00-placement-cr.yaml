# Placement CR fixture for the basic-deployment E2E test (2026.2 release).
# Managed mode: database via clusterRef to openstack-db (schema
# placement_basic_2026_2), cache via clusterRef to openstack-memcached. The
# database credentials come from the ESO-synced placement-db Secret and the
# service-user password from the pre-seeded keystone-admin Secret (both
# deploy/kind/infrastructure). Apart from the release, the image tag, and the
# names, this is the plain basic-deployment suite's fixture: placement has
# shipped the same WSGI application across every release, so the operator
# renders the same launch command and the same placement.conf for each of them.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-basic-2026-2
  namespace: openstack
spec:
  openStackRelease: "2026.2"
  deployment:
    replicas: 3
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2026.2"
  database:
    clusterRef:
      name: openstack-db
    database: placement_basic_2026_2
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
