# spec.podDisruptionBudget sets both minAvailable and maxUnavailable. The CEL
# rule on the shared PodDisruptionBudgetSpec answers first with "exactly one
# of minAvailable or maxUnavailable must be set"; the webhook mirrors it
# (validation.PodDisruptionBudgetValues).
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-invalid-pdb-both-set
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: placement
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: placement-service-password
  podDisruptionBudget:
    minAvailable: 1
    maxUnavailable: 1
