# spec.deployment.verticalAutoscaling.minReplicas of zero violates the Minimum=1
# marker; the webhook mirrors it.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-vpa-min-replicas-zero
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
    verticalAutoscaling:
      updateMode: Auto
      minReplicas: 0
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: placement
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: placement-service-password
