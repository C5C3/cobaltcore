# spec.deployment.nodeSelector with the key "bad key" is not a qualified label
# name. The schema admits any string key on the map, so the validating
# webhook (validation.NodeSelectorLabels) is the only gate before the
# rendered pod template reaches the API server and is refused there.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-invalid-nodeselector
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
    nodeSelector:
      "bad key": x
  image:
    repository: ghcr.io/c5c3/placement
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: placement
    secretRef:
      name: placement-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: placement-service-password
