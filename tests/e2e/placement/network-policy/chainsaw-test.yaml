# Chainsaw E2E test for the NetworkPolicy sub-reconciler.
#
# ENFORCEMENT: the kindnetd of kind v0.32 and later (CI pins KIND_VERSION)
# enforces NetworkPolicy. The suite asserts the rendered policy object
# (ingress on the Placement API port 8778, auto-derived
# DNS/database/keystone/cache egress) and its lifecycle, and probes the
# policy with the four pods of 03-probe-pods.yaml through
# ../../lib/assert-networkpolicy-enforced.sh (Step 3):
#   - the target, which carries the policy's selector labels, is dropped on
#     sink port 9999, which no egress rule admits;
#   - it resolves a cluster name, which the DNS rule admits;
#   - it reaches the sink on TCP 3306, 5000 and 11211, every TCP egress port
#     the policy admits but 53;
#   - a client in placement-system, the operator namespace, is dropped on
#     target port 9999, which no ingress rule admits, and reaches TCP 8778;
#   - a client in placement-netpol-outside is dropped on TCP 8778 until the
#     update patch admits its namespace (Step 4).
# On a CNI that does not enforce NetworkPolicy the first probe fails with "was
# never dropped". TCP 53 is not probed: the sink listens on unprivileged ports
# only, DNS is probed by resolution, and Step 2 pins the rule.
#
# The auto-derived egress order is deterministic (DNS, database, keystone,
# cache):
#   - DNS      UDP+TCP 53
#   - database TCP 3306 (spec.database default port)
#   - keystone TCP 5000 (parsed from spec.keystoneEndpoint)
#   - cache    TCP 11211 (managed memcached)
# Unlike glance, placement renders a dedicated keystone egress rule:
# keystonemiddleware validates every authenticated request server-side, and
# without that rule the API answers 503 while both readiness signals keep
# passing (they target the unauthenticated version document). Placement reads
# and writes nothing but its own database, so there is no object-store egress
# rule.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: placement-network-policy
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply the Placement CR with networkPolicy ──────────────────
  - try:
    - apply:
        file: 00-placement-cr.yaml
  # ── Step 2: Assert NetworkPolicy created with the expected rules ───────
  - try:
    - assert:
        resource:
          apiVersion: placement.openstack.c5c3.io/v1alpha1
          kind: Placement
          metadata:
            name: placement-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyReady
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: placement-netpol
            namespace: openstack
          spec:
            # The selector carries no component key, so the policy covers the
            # API pods and the db-sync pods alike — without the DNS and database
            # egress, placement-manage cannot reach the schema it migrates.
            podSelector:
              matchLabels:
                app.kubernetes.io/name: placement
                app.kubernetes.io/instance: placement-netpol
            policyTypes:
            - Ingress
            - Egress
            ingress:
            - ports:
              - protocol: TCP
                port: 8778
            egress:
            - ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
            - ports:
              - protocol: TCP
                port: 3306
            - ports:
              - protocol: TCP
                port: 5000
            - ports:
              - protocol: TCP
                port: 11211
    catch:
    - script:
        content: |
          echo "=== Placement CR status ==="
          kubectl get placement placement-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== NetworkPolicy ==="
          kubectl get networkpolicy placement-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n placement-system -l app.kubernetes.io/name=placement-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n placement-system -l app.kubernetes.io/name=placement-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Probe the enforced policy ──────────────────────────────────
  # The pods of 03-probe-pods.yaml stand in for the Placement pods (see
  # ENFORCEMENT above). kindnet adds a new pod to its policy set a moment
  # after the pod starts, so the first dropped probe polls until the target's
  # connection times out. The inside client's open probe then shows that
  # kindnet knows the clients, which start together, so the outside client's
  # drop comes from the policy. The trailing dot keeps the resolver off the
  # search list.
  - try:
    - apply:
        file: 03-probe-pods.yaml
    - script:
        timeout: 8m
        content: |
          set -eu
          kubectl wait --for=condition=Ready --timeout=120s -n openstack \
            pod/placement-netpol-probe-target pod/placement-netpol-probe-sink
          kubectl wait --for=condition=Ready --timeout=120s -n placement-system pod/placement-netpol-probe-inside
          kubectl wait --for=condition=Ready --timeout=120s -n placement-netpol-outside pod/placement-netpol-probe-outside
          TARGET="$(kubectl get pod placement-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          SINK="$(kubectl get pod placement-netpol-probe-sink -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ] || [ -z "${SINK}" ]; then
            echo "ERROR: a probe pod has no pod IP (target '${TARGET}', sink '${SINK}')"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          # Egress of the pod the policy selects. The first drop proves kindnet holds it.
          "${PROBE}" openstack placement-netpol-probe-target dropped "${SINK}" 9999
          "${PROBE}" openstack placement-netpol-probe-target resolves kubernetes.default.svc.cluster.local.
          "${PROBE}" openstack placement-netpol-probe-target open "${SINK}" 3306 5000 11211
          # Ingress into it: a port no rule admits, then the API port from an admitted
          # and from a foreign namespace.
          "${PROBE}" placement-system placement-netpol-probe-inside dropped "${TARGET}" 9999
          "${PROBE}" placement-system placement-netpol-probe-inside open "${TARGET}" 8778
          "${PROBE}" placement-netpol-outside placement-netpol-probe-outside dropped "${TARGET}" 8778
    catch:
    - script:
        timeout: 2m
        content: |
          echo "=== Probe pods ==="
          kubectl get pods -A -l app.kubernetes.io/instance=placement-netpol -o wide --show-labels 2>&1 || true
          for ref in openstack/placement-netpol-probe-target openstack/placement-netpol-probe-sink \
            placement-system/placement-netpol-probe-inside placement-netpol-outside/placement-netpol-probe-outside; do
            echo "--- ${ref} ---"
            kubectl logs -n "${ref%%/*}" "${ref#*/}" 2>&1 || true
            kubectl describe pod -n "${ref%%/*}" "${ref#*/}" 2>&1 | tail -20 || true
          done
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicy -n openstack -l app.kubernetes.io/instance=placement-netpol -o yaml 2>&1 || true
          echo "=== Events (placement-netpol-outside) ==="
          kubectl get events -n placement-netpol-outside 2>&1 || true
  # ── Step 4: Add a second ingress source and assert it lands ────────────
  # Peer arithmetic: the operator appends one peer per declared ingress source
  # plus one for its own Namespace (so the operator's health check reaches the
  # API). One source therefore renders 2 peers and the patched two sources
  # render 3 — `>= 3` is what distinguishes "the patch landed" from "the policy
  # is unchanged".
  - try:
    - patch:
        file: 01-patch-update-ingress.yaml
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: placement-netpol
            namespace: openstack
          spec:
            ingress:
            - (length(from) >= `3`): true
    # The patch admits placement-netpol-outside, so its client, which Step 3
    # saw dropped, now reaches the API port. That proves the patched policy is
    # enforced and the earlier drop came from the policy.
    - script:
        timeout: 2m
        content: |
          set -eu
          TARGET="$(kubectl get pod placement-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ]; then
            echo "ERROR: the probe target has no pod IP"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          "${PROBE}" placement-netpol-outside placement-netpol-probe-outside open "${TARGET}" 8778
    catch:
    - script:
        content: |
          echo "=== Placement CR status ==="
          kubectl get placement placement-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== NetworkPolicy ==="
          kubectl get networkpolicy placement-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n placement-system -l app.kubernetes.io/name=placement-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n placement-system -l app.kubernetes.io/name=placement-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 5: Disable networkPolicy and assert deletion ──────────────────
  - try:
    - patch:
        file: 02-patch-disable-networkpolicy.yaml
    - assert:
        resource:
          apiVersion: placement.openstack.c5c3.io/v1alpha1
          kind: Placement
          metadata:
            name: placement-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
    - script:
        content: |
          if kubectl get networkpolicy placement-netpol -n $NAMESPACE 2>/dev/null; then
            echo "FAIL: NetworkPolicy should have been deleted"
            exit 1
          fi
          echo "PASS: NetworkPolicy correctly deleted"
