# Patch: scale the Placement API down to a single replica (PDB flips to
# maxUnavailable=1 to avoid drain deadlock).
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-scale
  namespace: openstack
spec:
  deployment:
    replicas: 1
