# Patch: scale the Placement API from 3 to 5 replicas.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-scale
  namespace: openstack
spec:
  deployment:
    replicas: 5
