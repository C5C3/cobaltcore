# Patch: set the Placement API PodDisruptionBudget to maxUnavailable: 1.
apiVersion: placement.openstack.c5c3.io/v1alpha1
kind: Placement
metadata:
  name: placement-scale
  namespace: openstack
spec:
  podDisruptionBudget:
    maxUnavailable: 1
