# Patch to trigger a cross-release upgrade from 2026.1 to 2026.2. Both fields
# move together: release tracking keys on spec.openStackRelease while the phase
# Jobs and the API pods run spec.image, and the operator refuses a bump that
# leaves the image untouched (it would promote installedRelease off Jobs that
# migrated nothing).
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-release-upgrade
  namespace: openstack
spec:
  openStackRelease: "2026.2"
  image:
    tag: "2026.2"
