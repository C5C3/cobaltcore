# Patch: scale the Neutron API from 3 to 5 replicas.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-scale
  namespace: openstack
spec:
  deployment:
    replicas: 5
