# Neutron CR fixture for the scaling E2E test (2025.2 release).
#
# Managed mode: the schema neutron_scale on the openstack-db MariaDB cluster,
# the openstack-memcached cache, the ESO-synced neutron-db credentials and the
# pre-seeded keystone-admin service-user password (both from
# deploy/kind/infrastructure). The broker and the OVN control plane come from
# the two sibling fixtures.
#
# The API starts at three replicas, which is what makes the PodDisruptionBudget
# assertion meaningful: the shared builder renders minAvailable=1 above one
# replica and maxUnavailable=1 at exactly one, and the suite patches across that
# boundary. Both workers stay at one replica throughout — they are the control
# group that says a patch to spec.deployment.replicas reached the API Deployment
# alone.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-scale
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 3
  workers:
    deployment:
      replicas: 1
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron_scale
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: neutron-scale-messaging
  ovn:
    centralRef:
      name: neutron-scale-ovn
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
