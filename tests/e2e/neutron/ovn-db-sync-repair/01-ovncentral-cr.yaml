# OVN control plane the neutron-dbsync CR programs, and the database the repair
# run rewrites.
#
# The Neutron reconciler gates on this CR's status: it needs both
# internalDbAddress values and the published clientSecretName before it renders
# ml2_conf.ini. Single-member Raft clusters and a single northd keep the
# bring-up inside the suite's wait budget; the multi-member cluster is what
# tests/e2e/ovn/central-basic-deployment/ covers.
#
# The backup CronJob is suspended: this suite asserts nothing about it, and a
# suspended schedule keeps the hourly database dump off a node that runs two
# suites at a time.
#
# The issuer is the cluster-scoped one the kind overlay ships. OVN authenticates
# every connection, so both databases, the client identity the Neutron pods
# mount and the one the probe pods mount are issued from the same CA.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: neutron-dbsync-ovn
  namespace: openstack
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca-issuer
  northbound:
    replicas: 1
  southbound:
    replicas: 1
  northd:
    deployment:
      replicas: 1
  backup:
    suspend: true
