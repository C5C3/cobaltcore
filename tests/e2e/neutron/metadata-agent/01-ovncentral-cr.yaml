# OVNCentral fixture for the metadata-agent E2E test.
#
# The control plane here is scaffolding for the chassis and the agent under
# test, so it runs one Raft member per database and one northd replica. The
# backup is suspended: a snapshot of an empty logical model proves nothing this
# suite is about, and the CronJob would only compete for the single node's disk.
#
# Two of its status fields reach the agent: the Southbound internalDbAddress the
# agent reads port bindings from, which the last step compares the rendered
# ovn_sb_connection against, and the published client Secret the agent mounts to
# authenticate with.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: neutron-agent-ovn
  namespace: openstack
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca-issuer
  northbound:
    replicas: 1
  southbound:
    replicas: 1
  northd:
    deployment:
      replicas: 1
  backup:
    suspend: true
