# The Secret the https agent of 05-neutronmetadataagent-https.yaml signs its
# forwarded requests with, under the key the webhook defaults sharedSecretRef.key
# to. It stands in for the copy the ControlPlane delivers to an agent on a
# compute cluster. No Nova metadata API runs in this suite, so the value is a
# placeholder that only has to reach the pod's environment.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-agent-nova-metadata
  namespace: openstack
stringData:
  shared_secret: e2e-metadata-shared-secret
