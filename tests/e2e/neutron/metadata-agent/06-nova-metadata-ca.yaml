# The CA bundle the https agent of 05-neutronmetadataagent-https.yaml verifies
# the Nova metadata API with, under the key the webhook defaults
# caBundleSecretRef.key to. It is one self-signed certificate for
# nova-metadata.example.test, generated once with
#   openssl req -x509 -newkey rsa:2048 -nodes -keyout /dev/null \
#     -subj /CN=nova-metadata.example.test -days 3650
# The suite compares the bytes the pod mounts with these and never parses them.
