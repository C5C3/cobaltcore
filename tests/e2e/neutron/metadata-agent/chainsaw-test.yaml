# Chainsaw E2E test for a NeutronMetadataAgent on the one node of the kind
# cluster. Validates what only a real node can answer:
#   - all 3 sub-conditions progress to True with their expected reasons, and
#     the aggregate Ready=True with reason AllReady
#   - the DaemonSet lands on the node the OVNChassis selects, with the chassis's
#     own nodeSelector copied verbatim and hostNetwork on, and runs a ready pod
#   - the wait-for-chassis init container exited 0, which means it found this
#     node's system-id in the local Open vSwitch database over the socket the
#     chassis pods create, and the agent container is ready without a restart
#   - the rendered neutron_ovn_metadata_agent.ini points the agent at that local
#     database and at the Southbound address the OVNCentral published, pins
#     metadata_workers = 4 and root_helper = env, and carries no transport_url
#     line
#
# That last assertion is what #904 owes this suite: an agent with spec.messaging
# unset opens no broker connection, and the decision that the transport URL
# never reaches the ConfigMap (it is an env override when a bus is configured at
# all) was until now pinned only by the operator's unit tests.
#
# Steps 6 to 8 re-point the agent at a Nova metadata API behind a gateway, the
# shape of an agent on a compute cluster (#1064):
#   - with spec.novaMetadata.caBundleSecretRef naming a Secret that does not
#     exist yet, SecretsReady=False with reason WaitingForNovaMetadataCA
#   - once the Secret exists, all three sub-conditions and Ready are True again
#   - the rendered ini carries the https host, port and protocol and
#     auth_ca_cert = /etc/nova-metadata-ca/ca.crt, and no shared secret; the
#     shared secret reaches the agent container as an env var sourced from its
#     Secret, and the file the container reads at /etc/nova-metadata-ca/ca.crt
#     is the Secret's ca.crt, byte for byte
#
# Steps 9 to 11 measure the memory of the agent container with networks on its
# node (#1173). The operator's memory default is sized for 32 networks, and no
# other suite makes the agent provision one:
#   - step 9 takes the reading of an agent with no network
#   - step 10 writes one network and then 31 more into the Northbound database,
#     binds a port of each on the node, and reads the container's cgroup once
#     the agent runs one haproxy per network
#   - step 11 restarts the agent into 2026.1, where it provisions all 32
#     networks in one pass
# Every phase prints a MEMORY-READING line and fails on a container restart, on
# an OOM kill and on a working set above 90% of the container's memory limit,
# so a default that no longer holds 32 networks fails this suite.
# docs/reference/testing/sizing-calibration.md (Metadata agent memory) has the
# rule that turns the readings into the default.
#
# ── The seeded model ──────────────────────────────────────────────────
# Neutron writes the logical model on a real deployment. Here ovn-nbctl writes
# it: a switch named neutron-<network>, a localport with the device owner
# network:distributed, a MAC and neutron:cidrs, and a VIF port the chassis
# claims. northd copies the switch name and the ports' external_ids into the
# Southbound rows, and the agent provisions a network from them. If the agent
# starts no haproxy, the catch output says which input _get_provision_params
# missed (a metadata port without a MAC, no neutron:cidrs, no VIF port with an
# IPv4 address on the chassis), and the model in 07-memory-probe-script.yaml
# is to be corrected to supply it.
#
# spec.concurrent is false because the agent pods run with hostNetwork and share
# /run/openvswitch and /run/netns on the node with the OVNChassis pods.
# hack/kind-config.yaml declares a single node, so a second suite rendering an
# OVNChassis or a NeutronMetadataAgent at the same time would contend with this
# one over the same host paths.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: neutron-metadata-agent
spec:
  namespace: openstack
  concurrent: false
  timeouts:
    # The control plane, the two chassis DaemonSets, the chassis registration
    # and the agent DaemonSet in sequence take longer than the 120s the shared
    # config allows.
    assert: 5m
  steps:
  # ── Step 1: Label the node the chassis selects ─────────────────────────
  # The suite labels the node itself rather than relying on the cluster
  # bring-up, so it runs against any kind cluster the CI job hands it. The
  # step cleanup takes the label off again, which is what keeps a later suite
  # from finding a node advertising a chassis role nothing serves.
  - try:
    - script:
        content: |
          set -eu
          NODE="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          test -n "$NODE"
          kubectl label node "$NODE" openstack.c5c3.io/chassis=true --overwrite
          echo "OK: labelled node $NODE with openstack.c5c3.io/chassis=true"
    cleanup:
    - script:
        content: |
          set -eu
          for node in $(kubectl get nodes -l openstack.c5c3.io/chassis=true -o name); do
            kubectl label "$node" openstack.c5c3.io/chassis- || true
          done
          echo "OK: removed openstack.c5c3.io/chassis from every node"
  # ── Step 2: Bring up the control plane and the chassis ─────────────────
  # The agent's first gate resolves both CRs, so neither can be skipped: the
  # nodeSelector and the tolerations come from the chassis, the Southbound
  # address and the client Secret from the central the chassis attaches to.
  - try:
    - apply:
        file: 01-ovncentral-cr.yaml
    - apply:
        file: 02-ovnchassis-cr.yaml
    - assert:
        resource:
          apiVersion: ovn.openstack.c5c3.io/v1alpha1
          kind: OVNCentral
          metadata:
            name: neutron-agent-ovn
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
            clientSecretName: neutron-agent-ovn-client
    - assert:
        resource:
          apiVersion: ovn.openstack.c5c3.io/v1alpha1
          kind: OVNChassis
          metadata:
            name: neutron-agent-chassis
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
            desiredNumberScheduled: 1
            numberReady: 1
    catch:
    - script:
        content: |
          echo "=== OVNCentral CR status ==="
          kubectl get ovncentral neutron-agent-ovn -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== OVNChassis CR status ==="
          kubectl get ovnchassis neutron-agent-chassis -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Control-plane and chassis pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent-ovn -o name 2>/dev/null) \
                     $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent-chassis -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Node labels ==="
          kubectl get nodes --show-labels 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Apply the agent and assert its conditions ──────────────────
  # The agent runs no optional step, so all three sub-conditions are set on
  # every pass. SecretsAvailable is the reason a CR that references no Secret at
  # all reports: with neither spec.messaging nor spec.novaMetadata there is
  # nothing to gate on, and the step must still say so rather than stay silent.
  - try:
    - apply:
        file: 03-neutronmetadataagent-cr.yaml
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: NeutronMetadataAgent
          metadata:
            name: neutron-agent
            namespace: openstack
          status:
            (conditions[?type == 'ChassisReady']):
            - status: "True"
              reason: ChassisResolved
            (conditions[?type == 'SecretsReady']):
            - status: "True"
              reason: SecretsAvailable
            (conditions[?type == 'DaemonSetReady']):
            - status: "True"
              reason: DaemonSetReady
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== NeutronMetadataAgent CR status ==="
          kubectl get neutronmetadataagent neutron-agent -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== OVNChassis CR status ==="
          kubectl get ovnchassis neutron-agent-chassis -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== OVNCentral CR status ==="
          kubectl get ovncentral neutron-agent-ovn -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Agent DaemonSet ==="
          kubectl describe ds neutron-agent-metadata-agent -n $NAMESPACE 2>&1 || true
          echo "=== Agent pod logs (init containers included) ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 --previous 2>&1 || true
          done
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 4: Assert the DaemonSet and its pod ───────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: neutron-agent-metadata-agent
            namespace: openstack
          spec:
            template:
              spec:
                # Copied from the OVNChassis rather than declared on the agent:
                # a selector of its own could put the agent on a node where no
                # chassis creates the local database socket it waits for.
                nodeSelector:
                  openstack.c5c3.io/chassis: "true"
                # The agent answers the 169.254.169.254 requests arriving on the
                # node's own interfaces, so it runs in the node's network
                # namespace.
                hostNetwork: true
          status:
            desiredNumberScheduled: 1
            numberReady: 1
    # A ready pod says nothing about how it got there. The init container polls
    # the local Open vSwitch database until the chassis on this node has written
    # its system-id, and an agent container that crash-looped its way to
    # readiness would have spent that time not answering instances.
    - script:
        content: |
          set -eu
          PODS="$(kubectl get pods -n openstack \
            -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent \
            -o name)"
          if [ -z "${PODS}" ]; then
            echo "FAIL: no pod of the metadata-agent DaemonSet found"
            exit 1
          fi
          STATUS=0
          for pod in ${PODS}; do
            POD_STATUS=0
            INIT_EXIT="$(kubectl get "${pod}" -n openstack -o \
              "jsonpath={.status.initContainerStatuses[?(@.name=='wait-for-chassis')].state.terminated.exitCode}")"
            if [ "${INIT_EXIT}" != "0" ]; then
              echo "FAIL: ${pod} wait-for-chassis terminated exit code '${INIT_EXIT}', want 0"
              POD_STATUS=1
            fi
            READY="$(kubectl get "${pod}" -n openstack -o \
              "jsonpath={.status.containerStatuses[?(@.name=='metadata-agent')].ready}")"
            if [ "${READY}" != "true" ]; then
              echo "FAIL: ${pod} container metadata-agent ready is '${READY}', want true"
              POD_STATUS=1
            fi
            RESTARTS="$(kubectl get "${pod}" -n openstack -o \
              "jsonpath={.status.containerStatuses[?(@.name=='metadata-agent')].restartCount}")"
            if [ "${RESTARTS}" != "0" ]; then
              echo "FAIL: ${pod} container metadata-agent restarted ${RESTARTS} time(s)"
              POD_STATUS=1
            fi
            if [ "${POD_STATUS}" -eq 0 ]; then
              echo "OK: ${pod} wait-for-chassis exited 0, metadata-agent ready, no restart"
            else
              STATUS=1
            fi
          done
          exit "${STATUS}"
    catch:
    - script:
        content: |
          echo "=== NeutronMetadataAgent CR status ==="
          kubectl get neutronmetadataagent neutron-agent -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Agent DaemonSet ==="
          kubectl describe ds neutron-agent-metadata-agent -n $NAMESPACE 2>&1 || true
          echo "=== Agent pods ==="
          kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o wide 2>&1 || true
          echo "=== Agent pod logs (init containers included) ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 --previous 2>&1 || true
          done
          echo "=== Chassis pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent-chassis -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 2>&1 || true
          done
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 5: Assert the rendered agent config ───────────────────────────
  # The ConfigMap is content-hashed, so it is resolved through the DaemonSet's
  # config volume rather than guessed by name.
  #
  # Three lines carry the whole assertion. ovsdb_connection is the local socket
  # the chassis pods create on the node, which is why the two workloads share
  # one; ovn_sb_connection has to be the address this OVNCentral published,
  # not a default the operator invented; and transport_url must not appear at
  # all — the agent names no bus, and even one that did would receive the URL as
  # an env override rather than in a ConfigMap every pod mounts.
  #
  # The CR sets no spec.metadataWorkers, so the file carries the operator
  # default, metadata_workers = 4.
  #
  # The CR sets no spec.extraConfig either, so the command the agent starts
  # privsep-helper through is the operator's own, env. Steps 10 and 11 prove it
  # on the node: an agent that cannot start privsep-helper provisions no
  # network.
  - try:
    - script:
        content: |
          set -eu
          CM=$(kubectl get ds neutron-agent-metadata-agent -n openstack \
            -o 'jsonpath={.spec.template.spec.volumes[?(@.name=="config")].configMap.name}')
          test -n "$CM"
          kubectl get cm "$CM" -n openstack \
            -o 'jsonpath={.data.neutron_ovn_metadata_agent\.ini}' > /tmp/neutron-agent.ini
          grep -Fxq 'ovsdb_connection = unix:/run/openvswitch/db.sock' /tmp/neutron-agent.ini
          SB=$(kubectl get ovncentral neutron-agent-ovn -n openstack \
            -o 'jsonpath={.status.southbound.internalDbAddress}')
          test -n "$SB"
          grep -Fxq "ovn_sb_connection = ${SB}" /tmp/neutron-agent.ini
          grep -Fxq 'metadata_workers = 4' /tmp/neutron-agent.ini
          grep -Fxq 'root_helper = env' /tmp/neutron-agent.ini
          if grep -q '^transport_url' /tmp/neutron-agent.ini; then
            echo "ERROR: neutron_ovn_metadata_agent.ini carries a transport_url line"
            exit 1
          fi
          echo "OK: $CM reads the local database and ${SB}, pins metadata_workers = 4 and root_helper = env, and renders no transport_url"
    catch:
    - script:
        content: |
          echo "=== Config ConfigMaps ==="
          kubectl get cm -n $NAMESPACE -o name 2>&1 | grep neutron-agent-config- || true
          echo "=== Rendered config ==="
          CM=$(kubectl get ds neutron-agent-metadata-agent -n $NAMESPACE -o 'jsonpath={.spec.template.spec.volumes[?(@.name=="config")].configMap.name}' 2>/dev/null || true)
          kubectl get cm "$CM" -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== OVNCentral CR status ==="
          kubectl get ovncentral neutron-agent-ovn -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== NeutronMetadataAgent CR status ==="
          kubectl get neutronmetadataagent neutron-agent -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Agent pod logs (init containers included) ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 2>&1 || true
          done
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=60 2>&1 || true
  # ── Step 6: Point the agent at a gateway and wait for its CA bundle ─────
  # The agent now proxies over https and names a CA bundle whose Secret does
  # not exist yet. The gate holds the pass before the Config and DaemonSet
  # steps, so the running pod keeps its previous template rather than one
  # whose volume never mounts.
  - try:
    - apply:
        file: 04-nova-metadata-shared-secret.yaml
    - apply:
        file: 05-neutronmetadataagent-https.yaml
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: NeutronMetadataAgent
          metadata:
            name: neutron-agent
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "False"
              reason: WaitingForNovaMetadataCA
    catch:
    - script:
        content: |
          echo "=== NeutronMetadataAgent CR status ==="
          kubectl get neutronmetadataagent neutron-agent -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Agent DaemonSet ==="
          kubectl describe ds neutron-agent-metadata-agent -n $NAMESPACE 2>&1 || true
          echo "=== Agent pods ==="
          kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o wide 2>&1 || true
          echo "=== Agent pod logs (init containers included) ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 --previous 2>&1 || true
          done
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 7: Publish the CA bundle and assert the agent converges ────────
  # The Secret event reaches the agent through the Secret-name index, which
  # carries the CA ref's name. The new template mounts the bundle, so the
  # DaemonSet rolls, and DaemonSetReady turns True only once the new pod is
  # ready.
  - try:
    - apply:
        file: 06-nova-metadata-ca.yaml
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: NeutronMetadataAgent
          metadata:
            name: neutron-agent
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "True"
              reason: SecretsAvailable
            (conditions[?type == 'DaemonSetReady']):
            - status: "True"
              reason: DaemonSetReady
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          echo "=== NeutronMetadataAgent CR status ==="
          kubectl get neutronmetadataagent neutron-agent -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Agent DaemonSet ==="
          kubectl describe ds neutron-agent-metadata-agent -n $NAMESPACE 2>&1 || true
          echo "=== Agent pods ==="
          kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o wide 2>&1 || true
          echo "=== Agent pod logs (init containers included) ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 --previous 2>&1 || true
          done
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 8: Assert the https config, the env and the mounted bundle ─────
  # The rollout is awaited first, so the exec below reaches a pod of the
  # template that mounts the bundle. The shared secret must not appear in the
  # ConfigMap every agent pod mounts: it reaches the container as the
  # OS_DEFAULT__METADATA_PROXY_SHARED_SECRET override, sourced from its Secret.
  - try:
    - script:
        timeout: 4m
        content: |
          set -eu
          kubectl rollout status ds/neutron-agent-metadata-agent -n openstack --timeout=3m
          CM=$(kubectl get ds neutron-agent-metadata-agent -n openstack \
            -o 'jsonpath={.spec.template.spec.volumes[?(@.name=="config")].configMap.name}')
          test -n "$CM"
          kubectl get cm "$CM" -n openstack \
            -o 'jsonpath={.data.neutron_ovn_metadata_agent\.ini}' > /tmp/neutron-agent-https.ini
          for line in 'nova_metadata_host = nova-metadata.example.test' \
                      'nova_metadata_port = 443' \
                      'nova_metadata_protocol = https' \
                      'auth_ca_cert = /etc/nova-metadata-ca/ca.crt'; do
            if ! grep -Fxq "$line" /tmp/neutron-agent-https.ini; then
              echo "FAIL: $CM carries no line '$line'"
              exit 1
            fi
          done
          if grep -q '^metadata_proxy_shared_secret' /tmp/neutron-agent-https.ini; then
            echo "FAIL: $CM carries a metadata_proxy_shared_secret line"
            exit 1
          fi
          echo "OK: $CM renders the https Nova metadata keys and auth_ca_cert, and no shared secret"

          POD=""
          for pod in $(kubectl get pods -n openstack \
            -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o name); do
            if [ -z "$(kubectl get "$pod" -n openstack -o 'jsonpath={.metadata.deletionTimestamp}')" ]; then
              POD="$pod"
            fi
          done
          if [ -z "$POD" ]; then
            echo "FAIL: no running pod of the metadata-agent DaemonSet found"
            exit 1
          fi

          SECRET=$(kubectl get "$POD" -n openstack -o \
            'jsonpath={.spec.containers[?(@.name=="metadata-agent")].env[?(@.name=="OS_DEFAULT__METADATA_PROXY_SHARED_SECRET")].valueFrom.secretKeyRef.name}')
          if [ "$SECRET" != "neutron-agent-nova-metadata" ]; then
            echo "FAIL: $POD sources OS_DEFAULT__METADATA_PROXY_SHARED_SECRET from '$SECRET', want neutron-agent-nova-metadata"
            exit 1
          fi
          echo "OK: $POD sources the shared secret from neutron-agent-nova-metadata"

          kubectl get secret neutron-agent-nova-metadata-ca -n openstack \
            -o 'jsonpath={.data.ca\.crt}' | base64 -d > /tmp/nova-metadata-ca.expected
          kubectl exec -n openstack "$POD" -c metadata-agent -- \
            cat /etc/nova-metadata-ca/ca.crt > /tmp/nova-metadata-ca.mounted
          if ! cmp -s /tmp/nova-metadata-ca.expected /tmp/nova-metadata-ca.mounted; then
            echo "FAIL: /etc/nova-metadata-ca/ca.crt in $POD differs from the Secret's ca.crt"
            exit 1
          fi
          echo "OK: $POD reads the Secret's ca.crt at /etc/nova-metadata-ca/ca.crt"
    catch:
    - script:
        content: |
          echo "=== NeutronMetadataAgent CR status ==="
          kubectl get neutronmetadataagent neutron-agent -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Agent DaemonSet ==="
          kubectl describe ds neutron-agent-metadata-agent -n $NAMESPACE 2>&1 || true
          echo "=== Agent pods ==="
          kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o wide 2>&1 || true
          echo "=== Agent pod logs (init containers included) ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=80 --previous 2>&1 || true
          done
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 9: Take the idle reading ──────────────────────────────────────
  # Steps 9 to 11 read the memory of the agent container out of its cgroup
  # while the agent provisions networks. Each phase prints one MEMORY-READING
  # line and fails on a restart, an OOM kill or a working set above 90% of
  # the container's memory limit. The functions that take the readings are in
  # memory-lib.sh beside this file. Chainsaw scripts share no shell state but
  # run in the suite directory, so every script of these steps sources it.
  #
  # This step takes the reading with no network on the node. The probe script
  # is applied here and not in step 10, whose cleanup still runs it: chainsaw
  # runs the step cleanups last-in first-out, so this step's ConfigMap outlives
  # the cleanup of the step after it.
  - try:
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: NeutronMetadataAgent
          metadata:
            name: neutron-agent
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - apply:
        file: 07-memory-probe-script.yaml
    - script:
        timeout: 6m
        shell: bash
        content: |
          set -euo pipefail
          source ./memory-lib.sh

          agent_pod
          phase 2025.2 0 60
    catch: &agent-memory-dump
    # The dump is the same at steps 9, 10 and 11: what the agent reports and
    # logged, what it left on the node, and what the chassis and the probe pods
    # said. The agent log is where a network that was not provisioned shows
    # which input was missing. Each command is guarded so an object that a
    # given step never reached does not short-circuit the rest.
    - script:
        timeout: 3m
        shell: bash
        content: |
          echo "=== NeutronMetadataAgent CR ==="
          kubectl get neutronmetadataagent neutron-agent -n "$NAMESPACE" -o yaml 2>&1 || true
          echo "=== Agent DaemonSet ==="
          kubectl describe ds neutron-agent-metadata-agent -n "$NAMESPACE" 2>&1 || true
          echo "=== Agent pods ==="
          kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o wide 2>&1 || true
          for pod in $(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/instance=neutron-agent,app.kubernetes.io/component=metadata-agent -o name 2>/dev/null); do
            echo "=== $pod: logs (init containers included) ==="
            kubectl logs -n "$NAMESPACE" "$pod" --all-containers --tail=200 2>&1 || true
            kubectl logs -n "$NAMESPACE" "$pod" --all-containers --tail=200 --previous 2>&1 || true
            echo "=== $pod: ip netns list ==="
            kubectl exec -n "$NAMESPACE" "$pod" -c metadata-agent -- ip netns list 2>&1 || true
            echo "=== $pod: process names ==="
            kubectl exec -n "$NAMESPACE" "$pod" -c metadata-agent -- sh -c 'cat /proc/[0-9]*/comm 2>/dev/null' 2>&1 | sort | uniq -c || true
          done
          echo "=== Chassis pod logs ==="
          for pod in $(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/instance=neutron-agent-chassis -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n "$NAMESPACE" "$pod" --all-containers --tail=80 2>&1 || true
          done
          echo "=== ovs-vsctl show ==="
          kubectl exec ds/neutron-agent-chassis-ovs -n "$NAMESPACE" -c ovsdb-server -- \
            ovs-vsctl --timeout=15 show 2>&1 || true
          echo "=== Probe pods ==="
          for pod in neutron-agent-memory-probe-seed-1 neutron-agent-memory-probe-seed-2 \
            neutron-agent-memory-probe-cleanup; do
            echo "--- $pod ---"
            kubectl describe pod "$pod" -n "$NAMESPACE" 2>&1 || true
            kubectl logs -n "$NAMESPACE" "$pod" --tail=200 2>&1 || true
          done
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 10: Provision one network, then 32 ─────────────────────────────
  # The probe writes the logical model into the Northbound database, and an
  # internal interface on br-int carrying external_ids:iface-id makes the
  # chassis claim the network's VIF port, which is what a hypervisor's port
  # plug does. The agent then builds the ovnmeta- namespace and starts one
  # haproxy for the network.
  #
  # The reading at one network is the figure the lab run of #1142 is compared
  # with, and the reading at 32 is what the operator's memory default has to
  # hold.
  - try:
    - script:
        timeout: 20m
        shell: bash
        content: |
          set -euo pipefail
          source ./memory-lib.sh

          # run_probe <pod> <mode> <first> <last> <sentinel>
          #
          # Runs probe.sh in a pod of the OVN image and reads the verdict from the
          # pod log after a terminal phase. The sentinel, not the phase, is the
          # verdict: a probe that fails ends in Failed before it prints one.
          run_probe() {
            local pod="$1" mode="$2" first="$3" last="$4" sentinel="$5" pod_phase out
            kubectl run "$pod" -n "$NAMESPACE" --image="$IMG" --restart=Never \
              --overrides="$(probe_overrides "$pod" "$mode" "$first" "$last")"

            pod_phase=""
            for _ in $(seq 1 90); do
              pod_phase="$(kubectl get pod "$pod" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
              case "${pod_phase}" in Succeeded|Failed) break ;; esac
              sleep 2
            done
            out="$(kubectl logs -n "$NAMESPACE" "$pod" 2>&1 || true)"
            echo "${out}"
            echo "pod phase: ${pod_phase:-<none>}"
            if ! grep -qx "$sentinel" <<< "${out}"; then
              echo "FAIL: the log of probe pod ${pod} carries no ${sentinel}"
              exit 1
            fi
          }

          DS=ds/neutron-agent-chassis-ovs
          NB="$(kubectl get ovncentral neutron-agent-ovn -n "$NAMESPACE" \
            -o jsonpath='{.status.northbound.internalDbAddress}')"
          test -n "$NB"
          # The image comes from the running StatefulSet, so no fixture in this
          # suite has to spell the OVN tag the operator resolved.
          IMG="$(kubectl get sts neutron-agent-ovn-nb -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"
          test -n "$IMG"

          # br-int is created by ovn-controller rather than by the operator, so
          # its existence is polled instead of assumed.
          FOUND=""
          for _ in $(seq 1 24); do
            if kubectl exec "$DS" -n "$NAMESPACE" -c ovsdb-server -- \
              ovs-vsctl --timeout=15 br-exists br-int >/dev/null 2>&1; then
              FOUND=yes
              break
            fi
            sleep 5
          done
          if [ -z "${FOUND}" ]; then
            echo "FAIL: ovn-controller never created br-int on the node"
            kubectl exec "$DS" -n "$NAMESPACE" -c ovsdb-server -- \
              ovs-vsctl --timeout=15 list-br 2>&1 || true
            exit 1
          fi

          # plug <first> <last>: what a hypervisor's port plug does for each
          # network of the range, an internal interface on br-int that carries the
          # VIF port's name as external_ids:iface-id.
          plug() {
            local i
            for i in $(seq "$1" "$2"); do
              kubectl exec "$DS" -n "$NAMESPACE" -c ovsdb-server -- \
                ovs-vsctl --timeout=15 --may-exist add-port br-int "memvif-${i}" \
                -- set Interface "memvif-${i}" type=internal "external_ids:iface-id=memvif-${i}"
            done
          }

          agent_pod

          run_probe neutron-agent-memory-probe-seed-1 nb-seed 1 1 NB-SEED-OK
          plug 1 1
          phase 2025.2 1 180

          run_probe neutron-agent-memory-probe-seed-2 nb-seed 2 "$NETWORKS" NB-SEED-OK
          plug 2 "$NETWORKS"
          phase 2025.2 "$NETWORKS" 600
          processes 2025.2
    catch: *agent-memory-dump
    cleanup:
    # Leaves the node as the step found it: the interfaces on br-int, the
    # logical switches, the ovnmeta- namespaces and the probe pods. This is a
    # step cleanup rather than a finally: chainsaw runs it at the end of the
    # test, after the catch has read the probe pods, and before the cleanups of
    # the earlier steps delete the agent, the control plane and the probe
    # script it needs. Every command tolerates a step that failed early and
    # created nothing. The one verdict is the cleanup probe's: when it ran and
    # its log carries no sentinel, the cleanup fails, after the rest of the
    # teardown has run.
    - script:
        timeout: 8m
        shell: bash
        content: |
          set -uo pipefail
          source ./memory-lib.sh
          DS=ds/neutron-agent-chassis-ovs
          STATUS=0

          if kubectl get "$DS" -n "$NAMESPACE" >/dev/null 2>&1; then
            for i in $(seq 1 "$NETWORKS"); do
              kubectl exec "$DS" -n "$NAMESPACE" -c ovsdb-server -- \
                ovs-vsctl --timeout=15 --if-exists del-port br-int "memvif-${i}" 2>&1 || true
            done
          fi

          # The switches are dropped from the database before the database goes
          # away. Skipped when the central is already gone: the probe would only
          # wait out its own connection budget.
          PROBE=neutron-agent-memory-probe-cleanup
          NB="$(kubectl get ovncentral neutron-agent-ovn -n "$NAMESPACE" \
            -o jsonpath='{.status.northbound.internalDbAddress}' 2>/dev/null || true)"
          IMG="$(kubectl get sts neutron-agent-ovn-nb -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          if [ -n "${NB}" ] && [ -n "${IMG}" ]; then
            kubectl run "$PROBE" -n "$NAMESPACE" --image="$IMG" --restart=Never \
              --overrides="$(probe_overrides "$PROBE" nb-cleanup 1 "$NETWORKS")" 2>&1 || true
            pod_phase=""
            for _ in $(seq 1 60); do
              pod_phase="$(kubectl get pod "$PROBE" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
              case "${pod_phase}" in Succeeded|Failed) break ;; esac
              sleep 2
            done
            OUT="$(kubectl logs -n "$NAMESPACE" "$PROBE" 2>&1 || true)"
            echo "${OUT}"
            echo "pod phase: ${pod_phase:-<none>}"
            if ! grep -qx NB-CLEANUP-OK <<< "${OUT}"; then
              echo "FAIL: the log of probe pod ${PROBE} carries no NB-CLEANUP-OK"
              STATUS=1
            fi
          fi

          POD="$(find_agent_pod 2>/dev/null)"

          if [ -n "$POD" ]; then
            # The agent tears a namespace down when the last VIF port of its
            # network goes. A namespace still there after two minutes is deleted
            # by hand, with the veth end the agent put on br-int for it.
            LEFT=""
            for _ in $(seq 1 24); do
              if ! LIST="$(kubectl exec -n "$NAMESPACE" "$POD" -c metadata-agent -- ip netns list)"; then
                echo "cannot list the network namespaces in ${POD}"
                LEFT=""
                break
              fi
              LEFT="$(awk '$1 ~ /^ovnmeta-/ {print $1}' <<< "$LIST")"
              if [ -z "$LEFT" ]; then break; fi
              sleep 5
            done
            for ns in $LEFT; do
              kubectl exec -n "$NAMESPACE" "$POD" -c metadata-agent -- ip netns delete "$ns" 2>&1 || true
              net="${ns#ovnmeta-}"
              kubectl exec "$DS" -n "$NAMESPACE" -c ovsdb-server -- \
                ovs-vsctl --timeout=15 --if-exists del-port br-int "tap${net:0:10}0" 2>&1 || true
            done
          fi

          kubectl delete pod neutron-agent-memory-probe-seed-1 neutron-agent-memory-probe-seed-2 \
            neutron-agent-memory-probe-cleanup -n "$NAMESPACE" \
            --ignore-not-found --timeout=1m 2>&1 || true

          # What is left. A command that cannot run prints its own error here, so
          # an empty list is one the node answered with.
          echo "=== ovnmeta- namespaces left on the node ==="
          if [ -n "$POD" ]; then
            kubectl exec -n "$NAMESPACE" "$POD" -c metadata-agent -- ip netns list | grep '^ovnmeta-' || true
          fi
          echo "=== memvif- and tap ports left on br-int ==="
          kubectl exec "$DS" -n "$NAMESPACE" -c ovsdb-server -- \
            ovs-vsctl --timeout=15 list-ports br-int | grep -E '^(memvif-|tap)' || true
          exit "$STATUS"
  # ── Step 11: Restart into 2026.1 and resync ─────────────────────────────
  # The haproxy processes die with the old container while the namespaces stay
  # on the node, so the new agent's first sync provisions all 32 networks in
  # one pass. That is the path an OOM-killed agent takes on every restart, and
  # it gives the reading for the second release the default serves.
  - try:
    - script:
        timeout: 15m
        shell: bash
        content: |
          set -euo pipefail
          source ./memory-lib.sh

          kubectl patch neutronmetadataagent neutron-agent -n "$NAMESPACE" --type merge -p '{"spec":{"openStackRelease":"2026.1","image":{"tag":"2026.1"}}}'

          # Wait for the operator to render the new image into the DaemonSet, so
          # the rollout status below does not return for the old template.
          IMAGE=""
          for _ in $(seq 1 24); do
            IMAGE="$(kubectl get ds neutron-agent-metadata-agent -n "$NAMESPACE" \
              -o 'jsonpath={.spec.template.spec.containers[?(@.name=="metadata-agent")].image}')"
            case "$IMAGE" in *:2026.1) break ;; esac
            sleep 5
          done
          case "$IMAGE" in
          *:2026.1) ;;
          *)
            echo "FAIL: the DaemonSet still runs ${IMAGE} 2m after the release patch"
            exit 1
            ;;
          esac

          kubectl rollout status ds/neutron-agent-metadata-agent -n "$NAMESPACE" --timeout=5m

          agent_pod
          phase 2026.1 "$NETWORKS" 600
          processes 2026.1
    catch: *agent-memory-dump
