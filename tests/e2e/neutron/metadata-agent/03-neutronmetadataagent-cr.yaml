# NeutronMetadataAgent fixture for the metadata-agent E2E test.
#
# spec.messaging is unset. The OVN metadata agent opens no RPC and no
# notification connection of its own — it reads what it needs out of the
# Southbound database — so the bus is optional, and leaving it out is what makes
# the "no transport_url line" assertion of the last step mean something.
#
# spec.novaMetadata is unset too: Nova is not onboarded onto this operator, so
# there is no metadata API to proxy to and the oslo defaults apply. Without it
# the agent also references no Secret at all, which is the path the
# SecretsReady=True/SecretsAvailable assertion covers.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-agent
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: neutron-agent-chassis
