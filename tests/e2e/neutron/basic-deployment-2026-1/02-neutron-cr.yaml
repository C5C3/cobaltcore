# Neutron CR for the basic-deployment E2E test (2026.1 release).
#
# The per-release twin of tests/e2e/neutron/basic-deployment/02-neutron-cr.yaml:
# same managed-mode wiring, same replica counts, a schema of its own
# (neutron_basic_2026_1) so both suites can run in parallel against the one
# MariaDB cluster.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-basic-2026-1
  namespace: openstack
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 2
  workers:
    deployment:
      replicas: 1
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: neutron_basic_2026_1
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: neutron-basic-2026-1-messaging
  ovn:
    centralRef:
      name: neutron-basic-2026-1-ovn
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
