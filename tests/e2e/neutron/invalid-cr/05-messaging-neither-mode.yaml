# spec.messaging present but naming neither mode violates the same
# MessagingSpec XOR CEL rule from the other side. The block is required on
# NeutronSpec, so an empty object is the way to reach the rule: an omitted
# spec.messaging is answered by the required-properties list instead, which
# pins nothing about the XOR.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-messaging-neither
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging: {}
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
