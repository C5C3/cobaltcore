# spec.podDisruptionBudget.maxUnavailable of "half" is neither an integer nor a
# percentage. The int-or-string schema admits any string, so the validating
# webhook answers (validation.PodDisruptionBudgetValues) with "must be a
# non-negative integer or a percentage from 0% to 100%".
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-pdb-malformed-value
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
  podDisruptionBudget:
    maxUnavailable: "half"
