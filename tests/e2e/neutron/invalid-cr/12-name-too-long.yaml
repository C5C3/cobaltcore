# A metadata.name of 41 characters is rejected by the validating webhook
# alone. The bound is 40: the sync CronJob is named {name}-ovn-db-sync, 12
# characters on top of the CR name, against the 52-character cap Kubernetes
# puts on a CronJob name. The name is a valid DNS-1123 subdomain apart from
# its length, so the bound is the only rule it breaks. The rule runs in
# ValidateCreate only, so the finalizer-removal update never trips over it.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-name-past-the-40-char-cap
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
