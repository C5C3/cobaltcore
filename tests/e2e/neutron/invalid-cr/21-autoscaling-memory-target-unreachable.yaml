# spec.autoscaling.targetMemoryUtilization of 150 with no resources block is
# rejected by the validating webhook alone. A container whose block names no
# memory renders the same figure as request and limit, so the API pod can
# never use more than 100% of its memory request and the HPA would never
# scale out. The schema admits any target of at least 1, so the reachability
# rule is the only one broken.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-autoscaling-memory
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetMemoryUtilization: 150
