# spec.deployment.verticalAutoscaling.minAllowed.cpu above maxAllowed.cpu is
# rejected by the validating webhook alone: CEL cannot compare quantities across
# two maps.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-vpa-min-above-max
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
  deployment:
    verticalAutoscaling:
      updateMode: "Off"
      minAllowed:
        cpu: "2"
      maxAllowed:
        cpu: "1"
