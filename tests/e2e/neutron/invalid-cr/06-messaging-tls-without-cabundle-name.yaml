# spec.messaging.tls with an unnamed CA bundle Secret has nothing to verify
# the broker against. The schema answers: caBundleSecretRef is a required
# property of the TLS block and its name carries the MinLength=1 marker of
# the shared SecretRefSpec, so the empty name is rejected before the
# webhook's field.Required twin runs.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-messaging-tls
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
    tls:
      caBundleSecretRef:
        name: ""
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
