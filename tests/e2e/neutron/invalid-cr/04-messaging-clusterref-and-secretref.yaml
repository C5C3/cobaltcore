# spec.messaging with both clusterRef and secretRef violates the shared
# MessagingSpec XOR CEL rule: managed mode derives the transport URL from
# the RabbitmqCluster, brownfield mode reads it from the Secret, and naming
# both leaves no rule for which URL the pods get. The webhook mirrors it via
# MessagingXOR.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-messaging-both
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
    secretRef:
      name: neutron-transport-url
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
