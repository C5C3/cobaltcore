# spec.ovn.centralRef.name empty violates the MinLength=1 marker on
# OVNCentralRef, which the API server answers before the webhook's
# field.Required twin runs. The ML2/OVN mechanism driver writes the logical
# network model into the Northbound database of the named OVNCentral, so a
# Neutron without one has nothing to program.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-ovn-centralref
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ""
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
