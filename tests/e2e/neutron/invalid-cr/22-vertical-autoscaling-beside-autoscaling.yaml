# spec.deployment.verticalAutoscaling beside spec.autoscaling violates the CEL
# rule on the spec root; the webhook mirrors it. Every HPA scales on the
# utilization a VPA changes, so the two are rejected on one Deployment. The API
# server reports the rule at spec, with the block's path in the message.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-vpa-beside-autoscaling
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
  deployment:
    verticalAutoscaling:
      updateMode: "Off"
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 80
