# spec.nova.serviceUser.secretRef.name empty violates the MinLength=1 marker
# on the shared SecretRefSpec (internal/common/types/types.go), which the API
# server answers before the webhook's field.Required twin runs. The Secret
# carries the password Neutron notifies Nova with, so an unnamed one leaves
# the notifier unable to call os-server-external-events at all.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-nova-secretref
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
  nova:
    serviceUser:
      secretRef:
        name: ""
