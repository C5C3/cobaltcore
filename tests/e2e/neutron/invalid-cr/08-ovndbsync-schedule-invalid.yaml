# spec.ovnDBSync.schedule outside the cron grammar is rejected by the
# validating webhook alone. The field carries no CRD pattern on purpose: the
# accepted grammar includes descriptors such as @daily, which no regex
# expresses without also rejecting valid expressions, so
# validation.CronSchedule is the sole gate. The value carries two fields
# where five are expected, so it is rejected at admission rather than by
# the CronJob create the reconciler would otherwise attempt.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-ovndbsync-schedule
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
  ovnDBSync:
    schedule: "x y"
