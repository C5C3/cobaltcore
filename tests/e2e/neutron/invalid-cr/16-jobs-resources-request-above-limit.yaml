# A spec.jobs.resources memory request above its limit is rejected by the
# validating webhook alone (validation.RequestsWithinLimits):
# ResourceRequirements is an embedded upstream type carrying no cross-field
# marker, so admission is the only gate before the rendered Job and CronJob
# pod templates reach the API server and are refused there.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-jobs-resources
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
  jobs:
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 512Mi
