# spec.extraConfig setting an unknown option in a known section is rejected
# by the validating webhook against the embedded neutron 2025.2 option
# catalog. [DEFAULT] is a section the catalog carries, so the rejection is
# the unknown-option one rather than the unknown-section one.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-invalid-extraconfig-option
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    clusterRef:
      name: openstack-rabbitmq
  ovn:
    centralRef:
      name: ovn-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: neutron-service-password
  extraConfig:
    DEFAULT:
      no_such_option: "1"
