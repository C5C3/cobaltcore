# Brownfield transport-URL Secret for the neutron-netpol CR.
#
# The e2e cluster runs no broker. Nothing in the reconcile path dials one: the
# messaging step reads this Secret, checks that the URL parses with the rabbit
# scheme, and copies it into the derived Secret neutron-netpol-transport-url.
# The port in the URL is also what the messaging egress rule of the policy under
# test opens, so a changed port here changes the last egress rule the suite
# asserts.
#
# The name is neutron-netpol-messaging rather than neutron-netpol-transport-url:
# the latter is the derived Secret the operator writes, and a fixture under that
# name would be overwritten on the first pass.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-netpol-messaging
  namespace: openstack
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
