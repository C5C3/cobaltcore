# OVN control plane the neutron-netpol CR programs.
#
# The Neutron reconciler gates on this CR's status, and the network-policy step
# reads the same two addresses: the OVN egress rule holds one port per distinct
# member port of the published Northbound and Southbound addresses, so without a
# ready OVNCentral the rule the suite asserts is not rendered at all.
#
# Single-member Raft clusters and a single northd keep the bring-up inside the
# suite's assert budget; the multi-member cluster is what
# tests/e2e/ovn/central-basic-deployment/ covers. The backup CronJob is
# suspended: this suite asserts nothing about it.
apiVersion: ovn.openstack.c5c3.io/v1alpha1
kind: OVNCentral
metadata:
  name: neutron-netpol-ovn
  namespace: openstack
spec:
  tls:
    issuerRef:
      name: openstack-ovn-ca-issuer
  northbound:
    replicas: 1
  southbound:
    replicas: 1
  northd:
    deployment:
      replicas: 1
  backup:
    suspend: true
