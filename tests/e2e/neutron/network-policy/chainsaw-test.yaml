# Chainsaw E2E test for the NetworkPolicy sub-reconciler.
#
# ENFORCEMENT: the kindnetd of kind v0.32 and later (CI pins KIND_VERSION)
# enforces NetworkPolicy. The suite asserts the rendered policy object
# (ingress on the Neutron API port 9696, auto-derived
# DNS/database/keystone/cache/OVN/messaging egress) and its lifecycle, and
# probes the policy with the four pods of 05-probe-pods.yaml through
# ../../lib/assert-networkpolicy-enforced.sh (Step 3):
#   - the target, which carries the policy's selector labels, is dropped on
#     sink port 9999, which no egress rule admits;
#   - it resolves a cluster name, which the DNS rule admits;
#   - it reaches the sink on TCP 3306, 5000, 5672, 6641, 6642 and 11211, every
#     TCP egress port the policy admits but 53;
#   - a client in neutron-system, the operator namespace, is dropped on target
#     port 9999, which no ingress rule admits, and reaches TCP 9696;
#   - a client in neutron-netpol-outside is dropped on TCP 9696 until the
#     update patch admits its namespace (Step 4).
# On a CNI that does not enforce NetworkPolicy the first probe fails with "was
# never dropped". TCP 53 is not probed: the sink listens on unprivileged ports
# only, DNS is probed by resolution, and Step 2 pins the rule.
#
# The auto-derived egress order is deterministic (DNS, database, keystone,
# cache, OVN, messaging):
#   - DNS       UDP+TCP 53
#   - database  TCP 3306 (spec.database default port)
#   - keystone  TCP 5000 (parsed from spec.keystoneEndpoint)
#   - cache     TCP 11211 (managed memcached)
#   - OVN       TCP 6641 + 6642, one port per distinct member port of the two
#               addresses the OVNCentral published
#   - messaging TCP 5672 (the port of the transport URL in the broker Secret)
# The last two rules are what separates Neutron from the sibling suites: an
# ML2/OVN Neutron writes the logical network model to the Northbound database
# and its maintenance worker reads the Southbound one, and every Neutron process
# publishes on the RPC bus. Neither destination is reachable by a label
# selector, so both rules are port-only and both disappear from the rendered
# policy while their input is unresolved.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: neutron-network-policy
spec:
  namespace: openstack
  timeouts:
    # The OVNCentral has to issue three certificates and bootstrap two Raft
    # databases before the Neutron reconciler renders anything, and the schema
    # migration and the API cold start follow. That does not fit the 120s the
    # shared config allows.
    assert: 5m
  steps:
  # ── Step 1: Apply the broker Secret, the OVNCentral and the Neutron CR ──
  - try:
    - apply:
        file: 00-messaging-secret.yaml
    - apply:
        file: 01-ovncentral-cr.yaml
    - apply:
        file: 02-neutron-cr.yaml
  # ── Step 2: Assert the NetworkPolicy carries the expected rules ─────────
  - try:
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: Neutron
          metadata:
            name: neutron-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyReady
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: neutron-netpol
            namespace: openstack
          spec:
            # The selector carries no component key, so one policy covers the
            # API pods, both worker Deployments and the db-sync pods alike. All
            # of them read the same database, publish on the same broker and
            # dial the same two OVN databases.
            podSelector:
              matchLabels:
                app.kubernetes.io/name: neutron
                app.kubernetes.io/instance: neutron-netpol
            policyTypes:
            - Ingress
            - Egress
            ingress:
            - ports:
              - protocol: TCP
                port: 9696
            egress:
            - ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
            - ports:
              - protocol: TCP
                port: 3306
            - ports:
              - protocol: TCP
                port: 5000
            - ports:
              - protocol: TCP
                port: 11211
            # The two OVN databases, sorted ascending: the addresses come from
            # an unordered pair of status fields, so the rule is sorted to stay
            # deterministic.
            - ports:
              - protocol: TCP
                port: 6641
              - protocol: TCP
                port: 6642
            - ports:
              - protocol: TCP
                port: 5672
    catch:
    - script:
        content: |
          echo "=== Neutron CR status ==="
          kubectl get neutron neutron-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== OVNCentral CR status ==="
          kubectl get ovncentral neutron-netpol-ovn -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== NetworkPolicy ==="
          kubectl get networkpolicy neutron-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Probe the enforced policy ───────────────────────────────────
  # The pods of 05-probe-pods.yaml stand in for the Neutron pods (see
  # ENFORCEMENT above). kindnet adds a new pod to its policy set a moment
  # after the pod starts, so the first dropped probe polls until the target's
  # connection times out. The inside client's open probe then shows that
  # kindnet knows the clients, which start together, so the outside client's
  # drop comes from the policy. The trailing dot keeps the resolver off the
  # search list.
  - try:
    - apply:
        file: 05-probe-pods.yaml
    - script:
        timeout: 8m
        content: |
          set -eu
          kubectl wait --for=condition=Ready --timeout=120s -n openstack \
            pod/neutron-netpol-probe-target pod/neutron-netpol-probe-sink
          kubectl wait --for=condition=Ready --timeout=120s -n neutron-system pod/neutron-netpol-probe-inside
          kubectl wait --for=condition=Ready --timeout=120s -n neutron-netpol-outside pod/neutron-netpol-probe-outside
          TARGET="$(kubectl get pod neutron-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          SINK="$(kubectl get pod neutron-netpol-probe-sink -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ] || [ -z "${SINK}" ]; then
            echo "ERROR: a probe pod has no pod IP (target '${TARGET}', sink '${SINK}')"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          # Egress of the pod the policy selects. The first drop proves kindnet holds it.
          "${PROBE}" openstack neutron-netpol-probe-target dropped "${SINK}" 9999
          "${PROBE}" openstack neutron-netpol-probe-target resolves kubernetes.default.svc.cluster.local.
          "${PROBE}" openstack neutron-netpol-probe-target open "${SINK}" 3306 5000 5672 6641 6642 11211
          # Ingress into it: a port no rule admits, then the API port from an admitted
          # and from a foreign namespace.
          "${PROBE}" neutron-system neutron-netpol-probe-inside dropped "${TARGET}" 9999
          "${PROBE}" neutron-system neutron-netpol-probe-inside open "${TARGET}" 9696
          "${PROBE}" neutron-netpol-outside neutron-netpol-probe-outside dropped "${TARGET}" 9696
    catch:
    - script:
        timeout: 2m
        content: |
          echo "=== Probe pods ==="
          kubectl get pods -A -l app.kubernetes.io/instance=neutron-netpol -o wide --show-labels 2>&1 || true
          for ref in openstack/neutron-netpol-probe-target openstack/neutron-netpol-probe-sink \
            neutron-system/neutron-netpol-probe-inside neutron-netpol-outside/neutron-netpol-probe-outside; do
            echo "--- ${ref} ---"
            kubectl logs -n "${ref%%/*}" "${ref#*/}" 2>&1 || true
            kubectl describe pod -n "${ref%%/*}" "${ref#*/}" 2>&1 | tail -20 || true
          done
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicy -n openstack -l app.kubernetes.io/instance=neutron-netpol -o yaml 2>&1 || true
          echo "=== Events (neutron-netpol-outside) ==="
          kubectl get events -n neutron-netpol-outside 2>&1 || true
  # ── Step 4: Add a second ingress source and assert it lands ────────────
  # Peer arithmetic: the operator appends one peer per declared ingress source
  # plus one for its own Namespace (so the operator's health check reaches the
  # API). One source therefore renders 2 peers and the patched two sources
  # render 3 — `>= 3` is what distinguishes "the patch landed" from "the policy
  # is unchanged".
  - try:
    - patch:
        file: 03-patch-update-ingress.yaml
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: neutron-netpol
            namespace: openstack
          spec:
            ingress:
            - (length(from) >= `3`): true
    # The patch admits neutron-netpol-outside, so its client, which Step 3 saw
    # dropped, now reaches the API port. That proves the patched policy is
    # enforced and the earlier drop came from the policy.
    - script:
        timeout: 2m
        content: |
          set -eu
          TARGET="$(kubectl get pod neutron-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ]; then
            echo "ERROR: the probe target has no pod IP"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          "${PROBE}" neutron-netpol-outside neutron-netpol-probe-outside open "${TARGET}" 9696
    catch:
    - script:
        content: |
          echo "=== Neutron CR status ==="
          kubectl get neutron neutron-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== NetworkPolicy ==="
          kubectl get networkpolicy neutron-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 5: Disable networkPolicy and assert deletion ──────────────────
  - try:
    - patch:
        file: 04-patch-disable-networkpolicy.yaml
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: Neutron
          metadata:
            name: neutron-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
    - script:
        content: |
          if kubectl get networkpolicy neutron-netpol -n $NAMESPACE 2>/dev/null; then
            echo "FAIL: NetworkPolicy should have been deleted"
            exit 1
          fi
          echo "PASS: NetworkPolicy correctly deleted"
    catch:
    - script:
        content: |
          echo "=== Neutron CR status ==="
          kubectl get neutron neutron-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicy -n $NAMESPACE 2>&1 || true
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
