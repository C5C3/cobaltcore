# Chainsaw E2E test for a Neutron CR and its OVN control plane reconciling
# under restricted PodSecurity.
#
# Decisions worth knowing before reading the steps:
#
#   - Opt-out from per-test namespace (`spec.namespace: ""`): Chainsaw's
#     per-test namespace plumbing creates a chainsaw-* namespace WITHOUT PSS
#     labels. To exercise restricted-profile admission we must own the
#     namespace, so this test sets `spec.namespace: ""` to OPT OUT of the
#     plumbing entirely; Chainsaw then creates no namespace and the test
#     applies its own labelled namespace `neutron-pss-restricted-test` from
#     00-namespace.yaml. Chainsaw's applied-resource cleanup deletes that
#     namespace (and everything in it) when the test finishes.
#
#   - The OVNCentral is part of the subject, not scaffolding: D9 claims the OVN
#     database pods run under the Restricted profile, and this is the only suite
#     that asserts that claim against admission rather than against the rendered
#     securityContext. `ovn.centralRef` is namespace-local anyway, so the
#     central has to live in the labelled namespace for the Neutron CR to
#     resolve it.
#
#   - Brownfield mode (database.host + cache.servers, no clusterRef): the shared
#     provisioning flow resolves `Database.ClusterRef` / `Cache.ClusterRef` in
#     the Neutron CR's own namespace, so a CR in `neutron-pss-restricted-test`
#     cannot reach `openstack/openstack-db` through clusterRef. Brownfield
#     wiring reaches the existing cluster DB/cache without duplicating infra;
#     the `neutron_pss` Database/User/Grant are pre-created in `openstack` by
#     Step 2.
#
#   - ESO-managed Secrets (keystone-admin / neutron-db are ExternalSecrets, not
#     plain Secrets): `reconcileSecrets` gates SecretsReady on the per-tenant
#     store and the ESO-synced credential Secrets. The Step-1 script seeds the
#     namespace-scoped OpenBao paths by COPYING the shared standalone values,
#     then provisions this namespace's per-tenant store via
#     setup-eso-tenant.sh.
#
#   - Zero-PSS-violation event scan (Step 5): the parent controller emits a
#     `FailedCreate` event with the violation listed verbatim when PSS rejects
#     a Pod, so a zero-match scan on `violates PodSecurity "restricted:latest"`
#     is the explicit regression net for any future reconciler — in either
#     operator — that forgets the restricted securityContext.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: neutron-pod-security-restricted
spec:
  # Disable Chainsaw's per-test namespace plumbing so Pods land in our
  # PSS-labelled namespace.
  namespace: ""
  timeouts:
    # Each step carries its own budget, and the two longest are the OVNCentral
    # bring-up (three certificates plus two Raft bootstraps) and the Neutron
    # schema migration behind it.
    assert: 5m
  steps:
  # ── Step 1: Apply the labelled namespace + ESO ExternalSecrets ──────────
  # Asserts the PSS enforce label is present so a mis-typed label would surface
  # here, before any Pod is created. Also asserts each ExternalSecret reaches
  # Ready=True so a regression that broke ESO sync fails here, not deeper in
  # Step 4 where the operator's SecretsReady condition would be the only signal.
  - try:
    - apply:
        file: 00-namespace.yaml
    # Provision this namespace's per-tenant OpenBao store and seed its
    # namespace-scoped admin + db paths by COPYING the shared values, so the two
    # ExternalSecrets (which authenticate as the eso-tenant identity) can sync
    # and the `neutron` MariaDB user's password still matches the value the
    # brownfield User CR reconciles onto the same shared user — no SET PASSWORD
    # race. Chainsaw runs scripts with the test directory as CWD.
    - script:
        timeout: 5m
        shell: bash
        content: |
          set -euo pipefail
          BAO_NS="shared-services"
          BAO_POD="openbao-0"
          TENANT_NS="neutron-pss-restricted-test"
          BAO_TOKEN="$(kubectl get secret openbao-init-keys -n "${BAO_NS}" \
            -o jsonpath='{.data.init-output}' | base64 -d | jq -r '.root_token')"
          bao_exec() {
            kubectl exec -n "${BAO_NS}" "${BAO_POD}" -- \
              env BAO_ADDR="https://127.0.0.1:8200" BAO_TOKEN="${BAO_TOKEN}" \
              VAULT_CACERT="/openbao/tls/ca.crt" \
              VAULT_CLIENT_CERT=/openbao/client-tls/tls.crt \
              VAULT_CLIENT_KEY=/openbao/client-tls/tls.key "$@"
          }
          ADMIN_PASS="$(bao_exec bao kv get -mount=kv-v2 -field=password \
            bootstrap/openstack/controlplane-keystone/admin)"
          DB_USER="$(bao_exec bao kv get -mount=kv-v2 -field=username \
            openstack/neutron/openstack/standalone/db)"
          DB_PASS="$(bao_exec bao kv get -mount=kv-v2 -field=password \
            openstack/neutron/openstack/standalone/db)"
          bao_exec bao kv put -mount=kv-v2 "bootstrap/${TENANT_NS}/pss/admin" \
            password="${ADMIN_PASS}" >/dev/null
          bao_exec bao kv put -mount=kv-v2 "openstack/neutron/${TENANT_NS}/pss/db" \
            username="${DB_USER}" password="${DB_PASS}" >/dev/null
          ../../../../deploy/openbao/bootstrap/setup-eso-tenant.sh "${TENANT_NS}"
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: neutron-pss-restricted-test
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/enforce-version: latest
    - assert:
        resource:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: keystone-admin
            namespace: neutron-pss-restricted-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        resource:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: neutron-db
            namespace: neutron-pss-restricted-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  # ── Step 2: Pre-create brownfield MariaDB Database/User/Grant ──────────
  # The CRs live in `openstack` (the MariaDB operator's namespace), not in the
  # test namespace, because MariaDB CRs reference `openstack-db` via a
  # same-namespace `mariaDbRef`. The User CR manages the canonical `neutron`
  # MariaDB user against the existing `openstack/neutron-db` Secret and is
  # marked `cleanupPolicy: Skip` so this test's User-CR deletion does not drop
  # the user out from under a sibling test.
  - try:
    - apply:
        file: 00-brownfield-db-setup.yaml
    - assert:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Database
          metadata:
            name: neutron-pss-restricted-db
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: User
          metadata:
            name: neutron-pss-restricted-user
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
    - assert:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Grant
          metadata:
            name: neutron-pss-restricted-grant
            namespace: openstack
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
  # ── Step 3: Bring up the OVN control plane in the labelled namespace ────
  # Ready=True here is the D9 assertion: the two Raft StatefulSets and the
  # northd Deployment produce running pods, which under `restricted:latest`
  # they cannot do unless every container satisfies the profile.
  - try:
    - apply:
        file: 01-messaging-secret.yaml
    - apply:
        file: 02-ovncentral-cr.yaml
    - assert:
        resource:
          apiVersion: ovn.openstack.c5c3.io/v1alpha1
          kind: OVNCentral
          metadata:
            name: neutron-pss-ovn
            namespace: neutron-pss-restricted-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    catch:
    - script:
        content: |
          NS=neutron-pss-restricted-test
          echo "=== OVNCentral CR status ==="
          kubectl get ovncentral neutron-pss-ovn -n "$NS" -o yaml 2>&1 || true
          echo "=== Pod securityContext (CR namespace) ==="
          kubectl get pods -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.securityContext}{"\t"}{.spec.containers[*].securityContext}{"\n"}{end}' 2>&1 || true
          echo "=== OVN pod logs ==="
          for pod in $(kubectl get pods -n "$NS" -l app.kubernetes.io/instance=neutron-pss-ovn -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n "$NS" "$pod" --all-containers --tail=60 2>&1 || true
          done
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=100 2>&1 || true
          echo "=== Sorted events (last 30, CR namespace) ==="
          kubectl get events -n "$NS" --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 4: Apply the Neutron CR, assert Ready ─────────────────────────
  # The Ready=True signal is the primary end-to-end gate — every Pod the
  # reconciler creates (API Deployment, both worker Deployments, db-sync Job)
  # must have been admitted under restricted PSS for the sub-conditions to flip
  # True.
  #
  # The trailing `error` assertions enforce the brownfield-mode invariant: NO
  # Database/User/Grant CR named after the Neutron CR may be created in the
  # test namespace.
  - try:
    - apply:
        file: 03-neutron-cr.yaml
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: Neutron
          metadata:
            name: neutron-pss
            namespace: neutron-pss-restricted-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
    - error:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Database
          metadata:
            name: neutron-pss
            namespace: neutron-pss-restricted-test
    - error:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: User
          metadata:
            name: neutron-pss
            namespace: neutron-pss-restricted-test
    - error:
        resource:
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Grant
          metadata:
            name: neutron-pss
            namespace: neutron-pss-restricted-test
    catch:
    - script:
        content: |
          NS=neutron-pss-restricted-test
          echo "=== Neutron CR status ==="
          kubectl get neutron neutron-pss -n "$NS" -o yaml 2>&1 || true
          echo "=== OVNCentral CR status ==="
          kubectl get ovncentral neutron-pss-ovn -n "$NS" -o yaml 2>&1 || true
          echo "=== Pod securityContext (CR namespace) ==="
          kubectl get pods -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.securityContext}{"\t"}{.spec.containers[*].securityContext}{"\n"}{end}' 2>&1 || true
          echo "=== Sorted events (last 30, CR namespace) ==="
          kubectl get events -n "$NS" --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
          echo "=== Job pods ==="
          for pod in $(kubectl get pods -n "$NS" -l job-name -o name 2>/dev/null); do
            echo "--- $pod logs ---"
            kubectl logs -n "$NS" "$pod" --all-containers --tail=100 2>&1 || true
            echo "--- $pod describe (last 30 lines) ---"
            kubectl describe -n "$NS" "$pod" 2>&1 | tail -30 || true
          done
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=100 2>&1 || true
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=100 2>&1 || true
  # ── Step 5: Assert zero PSS-violation FailedCreate events ──────────────
  # PSS admission rejection emits a `FailedCreate` event on the Pod's parent
  # (Deployment/StatefulSet/Job) with the violation listed verbatim. A
  # zero-match scan on `violates PodSecurity "restricted:latest"` is the
  # explicit regression net for any future reconciler that forgets the
  # restricted securityContext. The scan is scoped to the test namespace so
  # unrelated FailedCreate events in `openstack` are not picked up.
  - try:
    - script:
        shell: bash
        content: |
          set -euo pipefail
          NS=neutron-pss-restricted-test
          NEEDLE='violates PodSecurity "restricted:latest"'

          MSGS=$(kubectl get events -n "$NS" \
            --field-selector reason=FailedCreate \
            -o jsonpath='{range .items[*]}{.message}{"\n"}{end}')
          # grep -c returns 1 when zero matches; guard with `|| true` so
          # `set -e` does not abort before the count check runs.
          COUNT=$(printf '%s\n' "$MSGS" | grep -cF "$NEEDLE" || true)
          if [ "$COUNT" -ne 0 ]; then
            echo "FAIL: $COUNT FailedCreate event(s) carry the PSS-restricted violation:"
            printf '%s\n' "$MSGS" | grep -F "$NEEDLE" || true
            exit 1
          fi
          echo "OK: zero PSS-restricted FailedCreate events in $NS"
    catch:
    - script:
        content: |
          NS=neutron-pss-restricted-test
          echo "=== Pod securityContext (CR namespace) ==="
          kubectl get pods -n "$NS" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.securityContext}{"\t"}{.spec.containers[*].securityContext}{"\n"}{end}' 2>&1 || true
          echo "=== All FailedCreate events (CR namespace) ==="
          kubectl get events -n "$NS" --field-selector reason=FailedCreate \
            -o custom-columns=LAST:.lastTimestamp,OBJ:.involvedObject.kind/.involvedObject.name,MSG:.message 2>&1 || true
          echo "=== Sorted events (last 30, CR namespace) ==="
          kubectl get events -n "$NS" --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
