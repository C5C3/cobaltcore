# Brownfield transport-URL Secret for the neutron-pss CR, in the labelled test
# namespace.
#
# It is a plain Secret rather than an ExternalSecret: the messaging step reads
# the referenced Secret directly and never consults the secret store, so
# routing it through the per-tenant store would test ESO twice and prove nothing
# about PSS admission. The two credentials the operator does gate on the store
# (keystone-admin, neutron-db) are ExternalSecrets in 00-namespace.yaml.
#
# The e2e cluster runs no broker, so the host points at the reserved .invalid
# TLD, which never resolves.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-pss-messaging
  namespace: neutron-pss-restricted-test
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
