# Chainsaw E2E test for the optional HTTPRoute sub-reconciler.
# Verifies the full lifecycle of spec.gateway driven by the Neutron CR:
#   - Apply a Neutron CR with spec.gateway and assert the HTTPRoute is created
#     with the expected ParentRef/Hostname/BackendRef (Neutron API port 9696).
#   - Before any Gateway controller reports Accepted, HTTPRouteReady is False
#     with reason HTTPRouteNotAccepted.
#   - Simulate a Gateway controller accepting the route by patching the parent
#     status, then assert HTTPRouteReady flips True/HTTPRouteAccepted.
#   - Unset spec.gateway and assert the HTTPRoute is deleted and HTTPRouteReady
#     is True with reason HTTPRouteNotRequired.
#
# Unlike the placement twin this suite asserts no status.endpoint flip: Neutron
# writes the cluster-local Service URL there on every pass, gateway or not,
# because the endpoint reports what the health probe reached.
#
# SCOPE: this suite covers the operator's HTTPRoute contract only — it patches
# the Accepted condition itself rather than running a Gateway controller, so
# nothing here proves traffic actually reaches the Neutron API.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: neutron-httproute
spec:
  namespace: openstack
  timeouts:
    # The OVNCentral bring-up, the schema migration and the API cold start all
    # precede the parallel group that owns the route, and none of that fits the
    # 120s the shared config allows.
    assert: 5m
  steps:
  # ── Step 1: Install HTTPRoute CRD ──────────────────────────────────────
  # The E2E cluster may not install a Gateway controller; apply the minimal
  # CRD so the operator can create HTTPRoute objects and the test can patch
  # their status.
  - try:
    - apply:
        file: 00-httproute-crd.yaml
  # ── Step 2: Apply the fixtures and the Neutron CR with spec.gateway ─────
  - try:
    - apply:
        file: 01-messaging-secret.yaml
    - apply:
        file: 02-ovncentral-cr.yaml
    - apply:
        file: 03-neutron-cr.yaml
  # ── Step 3: Assert HTTPRoute created with the expected spec ────────────
  - try:
    - assert:
        resource:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: neutron-route
            namespace: openstack
            labels:
              app.kubernetes.io/name: neutron
              app.kubernetes.io/instance: neutron-route
              app.kubernetes.io/managed-by: neutron-operator
          spec:
            parentRefs:
            - name: not-a-real-gateway
            hostnames:
            - neutron-route.example.test
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /
              backendRefs:
              - name: neutron-route
                port: 9696
              # The rule carries no `timeouts` stanza: neutron answers short
              # JSON requests and streams nothing, so the operator leaves the
              # request cap to the gateway implementation's default
              # (buildNeutronHTTPRoute passes no RequestTimeout). The stub CRD
              # above preserves unknown fields, so a timeout the operator
              # started rendering would round-trip and show up as a diff
              # against this assertion.
    catch:
    - script:
        content: |
          echo "=== Neutron CR status ==="
          kubectl get neutron neutron-route -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== HTTPRoute ==="
          kubectl get httproute -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== OVNCentral CR status ==="
          kubectl get ovncentral neutron-route-ovn -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 4: Assert HTTPRouteReady=False/HTTPRouteNotAccepted ───────────
  # No Gateway controller reconciles not-a-real-gateway, so the route's parent
  # status stays empty and the operator reports the route as unaccepted.
  - try:
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: Neutron
          metadata:
            name: neutron-route
            namespace: openstack
          status:
            (conditions[?type == 'HTTPRouteReady']):
            - status: "False"
              reason: HTTPRouteNotAccepted
  # ── Step 5: Simulate Gateway controller accepting the HTTPRoute ────────
  - try:
    - script:
        content: |
          kubectl patch httproute neutron-route -n $NAMESPACE \
            --subresource=status --type=merge -p '{
              "status": {
                "parents": [{
                  "parentRef": {"name": "not-a-real-gateway"},
                  "controllerName": "e2e.example.com/fake-gateway-controller",
                  "conditions": [{
                    "type": "Accepted",
                    "status": "True",
                    "reason": "Accepted",
                    "message": "Simulated Accepted condition for E2E test",
                    "lastTransitionTime": "2026-07-05T00:00:00Z",
                    "observedGeneration": 1
                  }]
                }]
              }
            }'
  # ── Step 6: Assert HTTPRouteReady=True/HTTPRouteAccepted ───────────────
  - try:
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: Neutron
          metadata:
            name: neutron-route
            namespace: openstack
          status:
            (conditions[?type == 'HTTPRouteReady']):
            - status: "True"
              reason: HTTPRouteAccepted
    catch:
    - script:
        content: |
          echo "=== Neutron CR status ==="
          kubectl get neutron neutron-route -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== HTTPRoute ==="
          kubectl get httproute -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== neutron-operator pod logs ==="
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n neutron-system -l app.kubernetes.io/name=neutron-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== ovn-operator pod logs ==="
          kubectl logs -n ovn-system -l app.kubernetes.io/name=ovn-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 7: Unset spec.gateway ─────────────────────────────────────────
  - try:
    - patch:
        file: 04-patch-remove-gateway.yaml
  # ── Step 8: Assert HTTPRoute deleted and NotRequired ───────────────────
  - try:
    - assert:
        resource:
          apiVersion: neutron.openstack.c5c3.io/v1alpha1
          kind: Neutron
          metadata:
            name: neutron-route
            namespace: openstack
          status:
            (conditions[?type == 'HTTPRouteReady']):
            - status: "True"
              reason: HTTPRouteNotRequired
    - script:
        content: |
          # Verify HTTPRoute no longer exists.
          if kubectl get httproute neutron-route -n $NAMESPACE 2>/dev/null; then
            echo "FAIL: HTTPRoute should have been deleted"
            exit 1
          fi
          echo "PASS: HTTPRoute correctly deleted"
