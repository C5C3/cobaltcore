# Neutron CR for the deletion-cleanup E2E test.
#
# Same managed-mode wiring as the basic-deployment fixture, on a schema of its
# own (neutron_deletion). Managed mode is what the suite needs: it is the mode
# that creates the MariaDB Database, User and Grant CRs whose removal the
# finalizer is responsible for.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: Neutron
metadata:
  name: neutron-deletion
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  workers:
    deployment:
      replicas: 1
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: neutron_deletion
    secretRef:
      name: neutron-db
  cache:
    clusterRef:
      name: openstack-memcached
  messaging:
    secretRef:
      name: neutron-deletion-messaging
  ovn:
    centralRef:
      name: neutron-deletion-central
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
