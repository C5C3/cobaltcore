# spec.novaMetadata.sharedSecretRef.name empty violates the MinLength=1
# marker on the shared SecretRefSpec, which answers before the webhook's
# field.Required twin. An unnamed Secret carries no shared secret to sign
# forwarded requests with, and Nova rejects an unsigned request when it is
# configured with a secret of its own.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ovn-chassis
  novaMetadata:
    sharedSecretRef:
      name: ""
