# spec.targetClusterRef.name empty violates the MinLength=1 marker on the
# shared TargetClusterRefSpec. An unnamed target names no registered
# cluster, so the operator would have nowhere to place the agent DaemonSet.
# The webhook repeats it via validation.TargetClusterRef, but the schema
# answers first.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ovn-chassis
  targetClusterRef:
    name: ""
