# spec.verticalAutoscaling.minAllowed naming ephemeral-storage violates the CEL
# rule on VerticalAutoscalingSpec; the webhook mirrors it. The VPA the operator
# writes controls cpu and memory only.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ovn-chassis
  verticalAutoscaling:
    updateMode: "Off"
    minAllowed:
      ephemeral-storage: 1Gi
