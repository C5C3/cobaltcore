# spec.verticalAutoscaling.minReplicas of zero violates the Minimum=1 marker;
# the webhook mirrors it.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2026.1"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2026.1"
  chassisRef:
    name: ovn-chassis
  verticalAutoscaling:
    updateMode: Auto
    minReplicas: 0
