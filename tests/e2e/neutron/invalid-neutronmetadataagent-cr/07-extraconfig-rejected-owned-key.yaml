# spec.extraConfig setting [ovs] ovsdb_connection is rejected by the
# validating webhook. The key is Rejected rather than merely owned because
# the agent reads the local OVS database over the socket the chassis pods
# share, and another address points it at a node whose ports it is not
# answering for.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ovn-chassis
  extraConfig:
    ovs:
      ovsdb_connection: "tcp:1.2.3.4:6640"
