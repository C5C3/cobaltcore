# spec.metadataWorkers of -1 violates the Minimum=0 marker. 0 is the lowest
# count the agent accepts: it serves metadata requests one at a time in the main
# process. The schema answers before the validating webhook's twin.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ovn-chassis
  metadataWorkers: -1
