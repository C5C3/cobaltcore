# spec.image with both tag and digest violates the ImageSpec XOR CEL rule
# (has(self.tag) != has(self.digest)); validateImage mirrors it in the
# webhook with the same message, but the schema answers first.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  chassisRef:
    name: ovn-chassis
