# spec.chassisRef.name empty violates the MinLength=1 marker on
# OVNChassisRef, which the API server answers before the webhook's
# field.Required twin runs. The chassis is what puts the agent on a node
# and gives it the local OVS database to read, so an agent without one has
# nothing to attach to.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ""
