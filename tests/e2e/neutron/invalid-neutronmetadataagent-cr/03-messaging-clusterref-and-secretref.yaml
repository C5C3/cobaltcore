# spec.messaging with both clusterRef and secretRef violates the shared
# MessagingSpec XOR CEL rule: managed mode derives the transport URL from
# the RabbitmqCluster, brownfield mode reads it from the Secret, and naming
# both leaves no rule for which URL the agent gets. The block is optional on
# this kind, so the rule applies only once it is present.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ovn-chassis
  messaging:
    clusterRef:
      name: openstack-rabbitmq
    secretRef:
      name: neutron-transport-url
