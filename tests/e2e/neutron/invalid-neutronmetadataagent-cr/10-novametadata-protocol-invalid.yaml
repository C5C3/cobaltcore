# spec.novaMetadata.protocol: ftp violates the Enum=http;https marker on
# NovaMetadataSpec, which the API server answers before the webhook's
# field.Invalid twin runs. The value is the scheme the agent forwards the
# instance's request to the Nova metadata API with, rendered as [DEFAULT]
# nova_metadata_protocol.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ovn-chassis
  novaMetadata:
    protocol: ftp
