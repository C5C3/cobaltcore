# spec.extraConfig setting an unknown option in a known section is rejected
# by the validating webhook against the embedded neutron 2025.2 option
# catalog. extraConfig is a preserve-unknown-fields map, so CEL cannot
# constrain its keys and admission is the only gate. [DEFAULT] is a section
# the catalog carries, so the rejection is the unknown-option one rather
# than the unknown-section one.
apiVersion: neutron.openstack.c5c3.io/v1alpha1
kind: NeutronMetadataAgent
metadata:
  name: neutron-metadata-agent
spec:
  openStackRelease: "2025.2"
  image:
    repository: ghcr.io/c5c3/neutron
    tag: "2025.2"
  chassisRef:
    name: ovn-chassis
  extraConfig:
    DEFAULT:
      no_such_option: "1"
