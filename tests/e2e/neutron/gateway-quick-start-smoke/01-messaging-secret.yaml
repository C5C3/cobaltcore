# Brownfield transport-URL Secret for the neutron-smoke CR.
#
# The e2e cluster runs no broker. Nothing in the reconcile path dials one: the
# messaging step reads this Secret, checks that the URL parses with the rabbit
# scheme, and copies it into the derived Secret neutron-smoke-transport-url,
# which the pods consume as OS_DEFAULT__TRANSPORT_URL. The host therefore points
# at the reserved .invalid TLD, which never resolves, so a code change that
# started connecting on the reconcile path fails here instead of passing
# quietly.
#
# The Secret is applied from the Step-2 script rather than as a chainsaw fixture
# so it shares the CRD presence guard with the two CRs beside it: on an overlay
# without the operators the whole suite skips without leaving an orphan Secret
# in the shared namespace.
apiVersion: v1
kind: Secret
metadata:
  name: neutron-smoke-messaging
  namespace: openstack
type: Opaque
stringData:
  transport_url: rabbit://neutron:neutron@rabbitmq.openstack.invalid:5672/
