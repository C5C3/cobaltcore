# Default secret store for the healthcheck E2E test, in managed mode against the
# proving OpenBaoCluster openbao-instance. The operator's probe runs in the
# post-deployment parallel group, so it has nothing to probe until a
# credential-ready default store lets the workload be created.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-healthcheck-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-healthcheck
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
