# Secret store for the PSS-restricted E2E test, in brownfield (server) mode.
#
# Server mode is the only mode available here. `instanceRef` resolves the
# OpenBaoCluster, its CA Secret and its provisioner ServiceAccount in the STORE's
# own namespace, and the proving instance lives in `openstack`, so a managed store
# in this namespace would reference objects that do not exist. Addressing the same
# instance by URL reaches it across namespaces, and the two Secrets it needs are
# materialized into this namespace by tests/e2e/barbican/approle-credentials.sh.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-pss-store
  namespace: barbican-pss-restricted-test
spec:
  barbicanRef:
    name: barbican-pss
  type: OpenBao
  isDefault: true
  openBao:
    server:
      url: https://openbao-instance.openstack.svc:8200
      caBundleSecretRef:
        name: openbao-instance-ca
      credentialsSecretRef:
        name: barbican-brownfield-approle
