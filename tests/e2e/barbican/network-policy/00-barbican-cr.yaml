# Barbican CR with spec.networkPolicy for the NetworkPolicy lifecycle test.
# Managed mode (clusterRef openstack-db, schema barbican_netpol), same shape as
# the basic-deployment fixture, plus the default secret store in
# 01-barbican-secretstore.yaml. The store is what puts the OpenBao egress rule in
# the rendered policy: the port is derived from the projected store's server URL,
# not from the CR.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-netpol
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican_netpol
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
  networkPolicy:
    ingress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openstack
