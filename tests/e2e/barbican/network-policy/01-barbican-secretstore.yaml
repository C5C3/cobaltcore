# Default secret store for the NetworkPolicy E2E test, in managed mode against the
# proving OpenBaoCluster openbao-instance.
#
# The store's server URL is what the OpenBao egress rule is derived from: a
# managed store resolves to https://<instance>.<namespace>.svc:8200, so the
# rendered policy opens TCP 8200. Only credential-ready stores contribute a host,
# which is why the egress rule appears once this store goes ready and not before.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-netpol-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-netpol
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
