# Chainsaw E2E test for the NetworkPolicy sub-reconciler.
#
# ENFORCEMENT: the kindnetd of kind v0.32 and later (CI pins KIND_VERSION)
# enforces NetworkPolicy. The suite asserts the rendered policy object
# (ingress on the Barbican API port 9311, auto-derived
# DNS/database/keystone/cache/OpenBao egress) and its lifecycle, and probes
# the policy with the four pods of 04-probe-pods.yaml through
# ../../lib/assert-networkpolicy-enforced.sh (Step 3):
#   - the target, which carries the policy's selector labels, is dropped on
#     sink port 9999, which no egress rule admits;
#   - it resolves a cluster name, which the DNS rule admits;
#   - it reaches the sink on TCP 3306, 5000, 8200 and 11211, every TCP egress
#     port the policy admits but 53;
#   - a client in barbican-system, the operator namespace, is dropped on
#     target port 9999, which no ingress rule admits, and reaches TCP 9311;
#   - a client in barbican-netpol-outside is dropped on TCP 9311 until the
#     update patch admits its namespace (Step 4).
# On a CNI that does not enforce NetworkPolicy the first probe fails with "was
# never dropped". TCP 53 is not probed: the sink listens on unprivileged ports
# only, DNS is probed by resolution, and Step 2 pins the rule.
#
# The auto-derived egress order is deterministic (DNS, database, keystone, cache,
# OpenBao):
#   - DNS      UDP+TCP 53
#   - database TCP 3306 (spec.database default port)
#   - keystone TCP 5000 (parsed from spec.keystoneEndpoint)
#   - cache    TCP 11211 (managed memcached)
#   - OpenBao  TCP 8200 (parsed from the projected secret store's server URL)
# The last rule is the barbican-specific one: the vault plugin stores every secret
# on that server, and the port comes from the store projection rather than from
# the CR — a store nobody has authenticated yet opens no port at all.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: barbican-network-policy
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply the Barbican CR with networkPolicy and its store ──────
  - try:
    - apply:
        file: 00-barbican-cr.yaml
    - apply:
        file: 01-barbican-secretstore.yaml
  # ── Step 2: Assert NetworkPolicy created with the expected rules ───────
  - try:
    - assert:
        resource:
          apiVersion: barbican.openstack.c5c3.io/v1alpha1
          kind: Barbican
          metadata:
            name: barbican-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyReady
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: barbican-netpol
            namespace: openstack
          spec:
            # The selector carries no component key, so the policy covers the
            # API pods, the db-sync pods and the db-clean pods alike — without
            # the DNS and database egress, barbican-manage cannot reach the
            # schema it migrates and cleans.
            podSelector:
              matchLabels:
                app.kubernetes.io/name: barbican
                app.kubernetes.io/instance: barbican-netpol
            policyTypes:
            - Ingress
            - Egress
            ingress:
            - ports:
              - protocol: TCP
                port: 9311
            egress:
            - ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
            - ports:
              - protocol: TCP
                port: 3306
            - ports:
              - protocol: TCP
                port: 5000
            - ports:
              - protocol: TCP
                port: 11211
            - ports:
              - protocol: TCP
                port: 8200
    catch:
    - script:
        content: |
          echo "=== Barbican CR status ==="
          kubectl get barbican barbican-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== BarbicanSecretStore status ==="
          kubectl get barbicansecretstore barbican-netpol-store -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== NetworkPolicy ==="
          kubectl get networkpolicy barbican-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Probe the enforced policy ──────────────────────────────────
  # The pods of 04-probe-pods.yaml stand in for the Barbican pods (see
  # ENFORCEMENT above). kindnet adds a new pod to its policy set a moment
  # after the pod starts, so the first dropped probe polls until the target's
  # connection times out. The inside client's open probe then shows that
  # kindnet knows the clients, which start together, so the outside client's
  # drop comes from the policy. The trailing dot keeps the resolver off the
  # search list.
  - try:
    - apply:
        file: 04-probe-pods.yaml
    - script:
        timeout: 8m
        content: |
          set -eu
          kubectl wait --for=condition=Ready --timeout=120s -n openstack \
            pod/barbican-netpol-probe-target pod/barbican-netpol-probe-sink
          kubectl wait --for=condition=Ready --timeout=120s -n barbican-system pod/barbican-netpol-probe-inside
          kubectl wait --for=condition=Ready --timeout=120s -n barbican-netpol-outside pod/barbican-netpol-probe-outside
          TARGET="$(kubectl get pod barbican-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          SINK="$(kubectl get pod barbican-netpol-probe-sink -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ] || [ -z "${SINK}" ]; then
            echo "ERROR: a probe pod has no pod IP (target '${TARGET}', sink '${SINK}')"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          # Egress of the pod the policy selects. The first drop proves kindnet holds it.
          "${PROBE}" openstack barbican-netpol-probe-target dropped "${SINK}" 9999
          "${PROBE}" openstack barbican-netpol-probe-target resolves kubernetes.default.svc.cluster.local.
          "${PROBE}" openstack barbican-netpol-probe-target open "${SINK}" 3306 5000 8200 11211
          # Ingress into it: a port no rule admits, then the API port from an admitted
          # and from a foreign namespace.
          "${PROBE}" barbican-system barbican-netpol-probe-inside dropped "${TARGET}" 9999
          "${PROBE}" barbican-system barbican-netpol-probe-inside open "${TARGET}" 9311
          "${PROBE}" barbican-netpol-outside barbican-netpol-probe-outside dropped "${TARGET}" 9311
    catch:
    - script:
        timeout: 2m
        content: |
          echo "=== Probe pods ==="
          kubectl get pods -A -l app.kubernetes.io/instance=barbican-netpol -o wide --show-labels 2>&1 || true
          for ref in openstack/barbican-netpol-probe-target openstack/barbican-netpol-probe-sink \
            barbican-system/barbican-netpol-probe-inside barbican-netpol-outside/barbican-netpol-probe-outside; do
            echo "--- ${ref} ---"
            kubectl logs -n "${ref%%/*}" "${ref#*/}" 2>&1 || true
            kubectl describe pod -n "${ref%%/*}" "${ref#*/}" 2>&1 | tail -20 || true
          done
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicy -n openstack -l app.kubernetes.io/instance=barbican-netpol -o yaml 2>&1 || true
          echo "=== Events (barbican-netpol-outside) ==="
          kubectl get events -n barbican-netpol-outside 2>&1 || true
  # ── Step 4: Add a second ingress source and assert it lands ────────────
  # Peer arithmetic: the operator appends one peer per declared ingress source
  # plus one for its own Namespace (so the operator's health check reaches the
  # API). One source therefore renders 2 peers and the patched two sources
  # render 3 — `>= 3` is what distinguishes "the patch landed" from "the policy
  # is unchanged".
  - try:
    - patch:
        file: 02-patch-update-ingress.yaml
    - assert:
        resource:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: barbican-netpol
            namespace: openstack
          spec:
            ingress:
            - (length(from) >= `3`): true
    # The patch admits barbican-netpol-outside, so its client, which Step 3
    # saw dropped, now reaches the API port. That proves the patched policy is
    # enforced and the earlier drop came from the policy.
    - script:
        timeout: 2m
        content: |
          set -eu
          TARGET="$(kubectl get pod barbican-netpol-probe-target -n openstack -o jsonpath='{.status.podIP}')"
          if [ -z "${TARGET}" ]; then
            echo "ERROR: the probe target has no pod IP"
            exit 1
          fi
          PROBE=../../lib/assert-networkpolicy-enforced.sh
          "${PROBE}" barbican-netpol-outside barbican-netpol-probe-outside open "${TARGET}" 9311
    catch:
    - script:
        content: |
          echo "=== Barbican CR status ==="
          kubectl get barbican barbican-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== NetworkPolicy ==="
          kubectl get networkpolicy barbican-netpol -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --all-containers --tail=60 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 5: Disable networkPolicy and assert deletion ──────────────────
  - try:
    - patch:
        file: 03-patch-disable-networkpolicy.yaml
    - assert:
        resource:
          apiVersion: barbican.openstack.c5c3.io/v1alpha1
          kind: Barbican
          metadata:
            name: barbican-netpol
            namespace: openstack
          status:
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
    - script:
        content: |
          if kubectl get networkpolicy barbican-netpol -n $NAMESPACE 2>/dev/null; then
            echo "FAIL: NetworkPolicy should have been deleted"
            exit 1
          fi
          echo "PASS: NetworkPolicy correctly deleted"
