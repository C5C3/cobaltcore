# spec.extraConfig carrying a newline in an option VALUE is rejected by the
# validating webhook. The rendered INI writes `key = value` verbatim, so the
# newline would inject a whole [DEFAULT] db_auto_create line past the
# ownership and catalog gates — they key on (section, key) names and never
# look inside a value. The section and key here are both catalog-known and
# unowned, which is exactly the shape that would otherwise be admitted.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-cfg-value-control-char
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  extraConfig:
    quotas:
      quota_secrets: "10\n[DEFAULT]\ndb_auto_create = true"
