# spec.deployment.replicas below the CRD Minimum=1 marker. The value is -1
# rather than 0 because DeploymentSpec.Default() normalizes a zero to
# DefaultReplicas in the mutating webhook, which runs before schema
# validation — a CR asking for 0 replicas is admitted and scaled up. Only a
# negative count survives defaulting and reaches the Minimum marker.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-replicas
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: -1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
