# spec.deployment.verticalAutoscaling.minReplicas of zero violates the Minimum=1
# marker; the webhook mirrors it.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-vpa-min-replicas-zero
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
    verticalAutoscaling:
      updateMode: Auto
      minReplicas: 0
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
