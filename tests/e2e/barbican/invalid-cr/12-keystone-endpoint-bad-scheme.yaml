# spec.keystoneEndpoint with a non-http(s) scheme violates the CRD pattern
# (^https?://); the webhook's validateEndpointURL mirrors it. The value is
# rendered as [keystone_authtoken] auth_url, which keystonemiddleware can
# only reach over http or https.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-endpoint-scheme
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: ftp://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
