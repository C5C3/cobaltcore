# spec.extraConfig with a newline in a SECTION name is rejected by the
# validating webhook. The renderer writes '[%s]' verbatim, so the newline
# opens a second section — here [DEFAULT], whose db_auto_create the operator
# owns — from a place the ownership and catalog gates never look: they key on
# the section name as a whole.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-cfg-section-control-char
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  extraConfig:
    "quotas\n[DEFAULT]\ndb_auto_create = true":
      quota_secrets: "10"
