# spec.extraConfig declaring an unknown section 'quota' (a typo for [quotas])
# is rejected by the validating webhook: the section is absent from the
# barbican 2025.2 option catalog, so a typo'd section name can never silently
# reach the rendered barbican.conf. The name is deliberately outside the
# 'secretstore:' prefix the catalog scan exempts, which the per-store sections
# take their names from.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-cfg-unknown-section
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  extraConfig:
    quota:
      quota_secrets: "10"
