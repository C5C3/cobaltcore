# spec.deployment.verticalAutoscaling.updateMode outside Off, Initial, Recreate
# and Auto violates the Enum marker; the webhook mirrors it.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-vpa-update-mode
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
    verticalAutoscaling:
      updateMode: Sometimes
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
