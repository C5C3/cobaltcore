# spec.dbClean.batchPauseMilliseconds of -1 violates the CRD Minimum=0
# marker on DBCleanSpec; validateDBClean repeats it as defense in depth.
# barbican-manage db clean rejects a negative --batch-pause-ms as well.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-dbclean-batchpause
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  dbClean:
    batchPauseMilliseconds: -1
