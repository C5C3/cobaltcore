# spec.gateway.parentRef.name empty violates the MinLength=1 marker on
# GatewayParentRefSpec. An HTTPRoute has to name the Gateway it attaches to;
# an unnamed parent leaves the route unattached and the API unreachable from
# outside. The webhook repeats the check as field.Required.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-gateway-parentref
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  gateway:
    parentRef:
      name: ""
    hostname: barbican.example.com
