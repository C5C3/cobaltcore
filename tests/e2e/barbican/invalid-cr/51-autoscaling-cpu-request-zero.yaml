# spec.deployment.resources.requests.cpu names a CPU request of zero while
# spec.autoscaling sets targetCPUUtilization. The HorizontalPodAutoscaler
# divides the pods' usage by the sum of their containers' requests, so a zero
# request fails the metric or inflates it. A resource.Quantity floor has no
# marker, so the validating webhook (validation.AutoscalingTargetRequests)
# answers.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-autoscaling-request
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
    resources:
      requests:
        cpu: "0"
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  autoscaling:
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 80
