# spec.autoscaling with neither targetCPUUtilization nor
# targetMemoryUtilization violates the second AutoscalingSpec CEL rule; the
# webhook mirrors it as field.Required on the block. An HPA with no metric
# has nothing to scale on, so it would hold the replica count wherever it
# found it.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-autoscaling-no-target
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
