# spec.deployment.verticalAutoscaling.minAllowed naming ephemeral-storage
# violates the CEL rule on VerticalAutoscalingSpec; the webhook mirrors it. The
# VPA the operator writes controls cpu and memory only.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-vpa-foreign-resource
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
    verticalAutoscaling:
      updateMode: "Off"
      minAllowed:
        ephemeral-storage: 1Gi
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
