# A spec.policyOverrides.rules entry with an empty value violates the CEL rule
# on the shared PolicySpec; the webhook mirrors it via
# policy.ValidatePolicyRules. oslo.policy reads an empty rule as 'allow
# everyone', which is the opposite of what spelling the rule out means. The
# rule is declared on the type, so the API server reports it at
# spec.policyOverrides rather than at the map entry.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-policyoverrides-rule-value
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  policyOverrides:
    rules:
      "secret:get": ""
