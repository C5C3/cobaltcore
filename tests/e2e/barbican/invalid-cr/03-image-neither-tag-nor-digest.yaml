# spec.image with neither tag nor digest violates the ImageSpec CEL rule
# (has(self.tag) || has(self.digest)); the webhook mirrors it with the same
# message. A repository alone names no reproducible image, and the
# reconciler would render a bare repository reference that resolves to
# :latest. Both fields are omitted rather than set to an empty string,
# which the tag/digest patterns would reject first.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-image-neither
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
