# spec.autoscaling.targetCPUUtilization above the CRD Maximum=100 marker. The
# field is a utilization percentage of the container's CPU request, so 150
# asks the HPA to hold pods at a level the request cannot express. The replica
# bounds are kept consistent so the marker is the only rule broken.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-autoscaling-cpu
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 150
