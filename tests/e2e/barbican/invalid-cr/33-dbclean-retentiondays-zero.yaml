# spec.dbClean.retentionDays of 0 violates the CRD Minimum=1 marker on
# DBCleanSpec; validateDBClean repeats it as defense in depth. A zero-day
# window would hard-delete the rows an in-flight request just soft-deleted.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-dbclean-retention
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  dbClean:
    retentionDays: 0
