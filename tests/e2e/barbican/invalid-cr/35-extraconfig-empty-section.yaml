# spec.extraConfig with an empty section name is rejected by the validating
# webhook — extraConfig is a free-form map of maps, so no marker reaches its
# keys and the webhook is the sole gate. A nameless section would render as a
# bare [] line in barbican.conf.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-cfg-empty-section
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  extraConfig:
    "":
      quota_secrets: "10"
