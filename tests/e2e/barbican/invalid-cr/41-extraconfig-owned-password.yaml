# spec.extraConfig setting [keystone_authtoken] password is rejected by the
# validating webhook. The operator owns it via spec.serviceUser.secretRef and
# the middleware reads it from the OS_KEYSTONE_AUTHTOKEN__PASSWORD env
# override, so a file value is inert at runtime but would copy the service
# password into the config Secret every API pod mounts — one of the three
# Rejected entries in the owned-key registry.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-cfg-owned-password
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  extraConfig:
    keystone_authtoken:
      password: s3cr3t
