# spec.keystonePublicEndpoint with a non-numeric port is rejected by the
# validating webhook alone. The value clears the CRD pattern, which
# constrains the scheme only; url.Parse is what refuses the port, so
# validateEndpointURL is the sole gate. Left admitted, the string would reach
# clients as the [keystone_authtoken] www_authenticate_uri a 401 points them
# at.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-public-endpoint
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  keystonePublicEndpoint: http://keystone.example.com:not-a-port/v3
