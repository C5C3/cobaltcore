# spec.deployment.verticalAutoscaling beside spec.autoscaling violates the CEL
# rule on the spec root; the webhook mirrors it. Every HPA scales on the
# utilization a VPA changes, so the two are rejected on one Deployment. The API
# server reports the rule at spec, with the block's path in the message.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-vpa-beside-autoscaling
spec:
  openStackRelease: "2026.1"
  deployment:
    replicas: 1
    verticalAutoscaling:
      updateMode: "Off"
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2026.1"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 80
