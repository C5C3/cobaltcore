# spec.gateway.hostname empty violates the MinLength=1 marker on the shared
# GatewaySpec. An HTTPRoute without a hostname would attach to the Gateway and
# match every request reaching its listener. The webhook repeats the check as
# field.Required.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-invalid-gateway-hostname
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    secretRef:
      name: barbican-service-password
  gateway:
    parentRef:
      name: openstack-gw
    hostname: ""
