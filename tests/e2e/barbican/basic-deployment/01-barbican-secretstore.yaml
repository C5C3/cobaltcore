# Default secret store for the basic-deployment E2E test, in managed mode.
#
# instanceRef points at the proving OpenBaoCluster openbao-instance
# (deploy/kind/infrastructure/openbao-instance.yaml) in this namespace, and
# everything else is derived from that name: the server URL, the CA Secret
# openbao-instance-tls-ca, and the provisioner ServiceAccount the operator
# authenticates as to mint the store's AppRole credentials. A managed store is
# pinned to the barbican/ mount the instance's self-init provisions, so
# kvMountpoint is left at its default.
#
# isDefault is what makes the parent Barbican reach Ready: a Barbican with no
# credential-ready default store reports SecretStoresReady=False with reason
# NoDefaultSecretStore and never renders a config.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-basic-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-basic
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
