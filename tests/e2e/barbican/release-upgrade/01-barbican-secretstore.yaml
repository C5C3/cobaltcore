# Default secret store for the release-upgrade E2E test, in managed mode against
# the proving OpenBaoCluster openbao-instance. The store spans the upgrade
# untouched: the secret-store contract carries no release, so the same store backs
# the 2025.2 and the 2026.1 leg of the suite.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-release-upgrade-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-release-upgrade
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
