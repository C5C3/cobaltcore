# Barbican CR fixture for the release-upgrade E2E test.
# Managed mode at the initial 2025.2 release: database via clusterRef to
# openstack-db (schema barbican_release_upgrade), cache via clusterRef to
# openstack-memcached. The database credentials come from the ESO-synced
# barbican-db Secret and the service-user password from the pre-seeded
# keystone-admin Secret (both deploy/kind/infrastructure). A single replica keeps
# the rollout observable when 02-patch-upgrade.yaml bumps the release to 2026.1.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-release-upgrade
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican_release_upgrade
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
