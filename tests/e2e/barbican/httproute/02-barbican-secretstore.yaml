# Default secret store for the HTTPRoute E2E test, in managed mode against the
# proving OpenBaoCluster openbao-instance.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-httproute-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-httproute
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
