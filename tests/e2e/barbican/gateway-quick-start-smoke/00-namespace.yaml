# Namespace fixture for the Barbican Gateway quick-start smoke test.
#
# The `openstack` namespace is already created by the kind overlay
# (`deploy/kind/base/`) because it holds the Gateway/Certificate objects wired
# in `openstack-gateway.yaml` (including the `https-barbican` listener and its
# `barbican-nip-io-tls` Certificate), the proving OpenBao instance, and the
# managed backing services. We still apply it here defensively so the suite is
# self-contained — chainsaw's `apply` is idempotent on an existing Namespace,
# which makes the test tolerate being invoked against a bare cluster as well.
#
---
apiVersion: v1
kind: Namespace
metadata:
  name: openstack
