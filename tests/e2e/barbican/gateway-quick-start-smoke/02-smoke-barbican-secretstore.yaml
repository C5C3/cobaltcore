# Secret store for the Gateway quick-start smoke test, in brownfield (server)
# mode against the proving OpenBaoCluster openbao-instance.
#
# Server mode keeps the smoke self-contained: the credentials come from the two
# Secrets tests/e2e/barbican/approle-credentials.sh materializes, so the suite
# needs nothing from a sibling suite's managed store and the operator writes
# nothing to OpenBao while the smoke runs. Barbican serves no request at all
# without a credential-ready default store, so this fixture is what makes the
# 200 on /healthcheck reachable.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-smoke-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-smoke
  type: OpenBao
  isDefault: true
  openBao:
    server:
      url: https://openbao-instance.openstack.svc:8200
      caBundleSecretRef:
        name: openbao-instance-ca
      credentialsSecretRef:
        name: barbican-brownfield-approle
