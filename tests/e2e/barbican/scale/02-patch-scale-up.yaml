# Patch: scale the Barbican API from 3 to 5 replicas.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-scale
  namespace: openstack
spec:
  deployment:
    replicas: 5
