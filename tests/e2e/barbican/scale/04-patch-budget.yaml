# Patch: set the Barbican API PodDisruptionBudget to maxUnavailable: 1.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-scale
  namespace: openstack
spec:
  podDisruptionBudget:
    maxUnavailable: 1
