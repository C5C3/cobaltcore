# Default secret store for the scale E2E test, in managed mode against the
# proving OpenBaoCluster openbao-instance. Barbican creates no workload at all
# without a credential-ready default store, so the scale suite needs one before it
# has replicas to count.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-scale-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-scale
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
