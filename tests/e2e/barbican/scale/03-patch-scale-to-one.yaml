# Patch: scale the Barbican API down to a single replica (PDB flips to
# maxUnavailable=1 to avoid drain deadlock).
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-scale
  namespace: openstack
spec:
  deployment:
    replicas: 1
