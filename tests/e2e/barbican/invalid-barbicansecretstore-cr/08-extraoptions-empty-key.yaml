# spec.extraOptions with an empty option name is rejected by the validating
# webhook: the map key has no schema counterpart to bound it, and a nameless
# option would render as a bare `= value` line in [vault_plugin].
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbicanstore-empty-option
spec:
  barbicanRef:
    name: barbican
  type: OpenBao
  openBao:
    instanceRef:
      name: openbao-instance
  extraOptions:
    "": "10"
