# spec.openBao with both instanceRef and server violates the mode CEL rule
# (has(self.instanceRef) != has(self.server)); validateStoreUnion mirrors it.
# The two modes disagree on who provisions the mount, so a store naming both
# names no server at all.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbicanstore-both-modes
spec:
  barbicanRef:
    name: barbican
  type: OpenBao
  openBao:
    instanceRef:
      name: openbao-instance
    server:
      url: https://openbao.example.com:8200
      credentialsSecretRef:
        name: barbican-openbao-credentials
