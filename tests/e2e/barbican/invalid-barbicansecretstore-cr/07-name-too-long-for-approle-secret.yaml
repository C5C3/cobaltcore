# A metadata.name of 56 characters, one past
# MaxBarbicanSecretStoreNameLength, is rejected by the validating webhook on
# CREATE: the operator appends "-approle" to name the AppRole credentials
# Secret, and the result would exceed the 63-character DNS label budget. The
# rule runs in ValidateCreate only, so the finalizer-removal update never
# trips over it.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-store-invalid-name-too-long-for-approle-secrets
spec:
  barbicanRef:
    name: barbican
  type: OpenBao
  openBao:
    instanceRef:
      name: openbao-instance
