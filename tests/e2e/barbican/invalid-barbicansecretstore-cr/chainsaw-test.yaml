# Chainsaw E2E tests for BarbicanSecretStore CRD + webhook validation rejection.
# Pins every implemented CEL XValidation, kubebuilder-marker, and
# webhook.validate() rejection path in
# operators/barbican/api/v1alpha1/barbicansecretstore_* to a deterministic
# admission failure. Each step applies an otherwise-valid store CR with a single
# aspect violating the rule under test, captures the admission $error, and
# asserts the message substring.
#
# Fixture categories:
#   - Create-rejection fixtures (00-11) are each applied once and rejected.
#   - Immutability pairs: the base is applied first and must SUCCEED, and the
#     second fixture reuses its name so it is applied as an UPDATE that the CRD
#     CEL transition rule (evaluated only on UPDATE) rejects — barbicanRef
#     (12/13), kvMountpoint (14/15), and the managed-vs-brownfield mode (16/17).
#     A type-immutability pair is deliberately absent: OpenBao is the only enum
#     value, so a changed type is already rejected by the Enum marker.
#   - Sibling pairs: the base is applied first and must SUCCEED, and the second
#     store attaches to the same Barbican — a second default (18/19) and a
#     second OpenBao store (20/21), both rejected by the validating webhook's
#     namespace-scoped List.
#
# To prevent scaffold drift across fixtures they are generated from a single
# source of truth in `_generate.py`. After editing the canonical scaffold or
# any per-fixture override, regenerate via:
#   python3 tests/e2e/barbican/invalid-barbicansecretstore-cr/_generate.py
# CI runs `make verify-invalid-cr-fixtures`, which invokes
# `_generate.py --check` (drift mode incl. the orphan sweep) and
# `test_generate.py` (FIXTURES count + chainsaw-test.yaml cross-reference)
# so any hand-edit fails the build before the cluster-bound e2e-operator job.
#
# The test runs in an ephemeral namespace: the base CRs reference Barbicans and
# OpenBao servers that do not exist there — admission deliberately tolerates the
# dangling references (GitOps ordering) and the store carries no finalizer, so
# namespace cleanup never wedges.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: barbican-invalid-barbicansecretstore-cr
spec:
  steps:
  # type OpenBao without spec.openBao must be rejected (union rule).
  - try:
    - apply:
        file: 00-type-openbao-without-openbao-block.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one store block matching spec.type')): true
  # spec.openBao with both instanceRef and server must be rejected.
  - try:
    - apply:
        file: 01-openbao-instanceref-and-server.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one of instanceRef or server must be set')): true
  # spec.openBao with neither instanceRef nor server must be rejected by the
  # same rule.
  - try:
    - apply:
        file: 02-openbao-neither-instanceref-nor-server.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one of instanceRef or server must be set')): true
  # A managed store on a mount other than barbican must be rejected: the
  # self-init contract provisions only that mount.
  - try:
    - apply:
        file: 03-managed-store-foreign-mount.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must keep kvMountpoint barbican and leave namespace unset')): true
  # A managed store naming an OpenBao namespace must be rejected by the same
  # rule: the self-init contract provisions at the root namespace.
  - try:
    - apply:
        file: 04-managed-store-with-openbao-namespace.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'must keep kvMountpoint barbican and leave namespace unset')): true
  # A brownfield server URL without TLS must be rejected by the ^https://
  # pattern on OpenBaoServerSpec.URL.
  - try:
    - apply:
        file: 05-brownfield-plaintext-url.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'openBao.server.url')): true
            (contains($error, 'should match')): true
  # A reserved store name (exact "default") must be rejected by the webhook.
  - try:
    - apply:
        file: 06-reserved-name-default.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'reserved or operator-managed barbican.conf section')): true
  # A metadata.name past 55 characters must be rejected on CREATE: the
  # "{name}-approle" credentials Secret would exceed the DNS label budget.
  - try:
    - apply:
        file: 07-name-too-long-for-approle-secret.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'name must be at most 55 characters')): true
  # An empty spec.extraOptions option name must be rejected by the webhook: the
  # map key has no schema counterpart to bound it.
  - try:
    - apply:
        file: 08-extraoptions-empty-key.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'option name must not be empty')): true
  # extraOptions keys must match the ^[A-Za-z0-9_]+$ allowlist, which runs
  # before the exact-match denylist.
  - try:
    - apply:
        file: 09-extraoptions-bad-charset.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'option name must match')): true
  # extraOptions must not carry an option the operator renders from a typed
  # spec.openBao field.
  - try:
    - apply:
        file: 10-extraoptions-denylist.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'option "kv_mountpoint" is owned by')): true
            (contains($error, 'spec.openBao.kvMountpoint')): true
  # A newline in an extraOptions value must be rejected: the renderer writes
  # `key = value` verbatim into [vault_plugin], so it injects a plugin option
  # through a key that is on no list.
  - try:
    - apply:
        file: 11-extraoptions-value-control-char.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'value must not contain newline or carriage-return characters')): true
  # ── barbicanRef-immutability block ──────────────────────────────────────
  # The valid base CR is applied first and must SUCCEED.
  - try:
    - apply:
        file: 12-immutable-barbicanref-base.yaml
  # barbicanRef is immutable (CEL transition rule, UPDATE-only).
  - try:
    - apply:
        file: 13-immutable-barbicanref.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'barbicanRef is immutable')): true
  # ── kvMountpoint-immutability block ─────────────────────────────────────
  # The valid brownfield base CR is applied first and must SUCCEED.
  - try:
    - apply:
        file: 14-immutable-kvmountpoint-base.yaml
  # kvMountpoint is immutable (CEL transition rule, UPDATE-only).
  - try:
    - apply:
        file: 15-immutable-kvmountpoint.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'kvMountpoint is immutable')): true
  # ── store-mode-immutability block ───────────────────────────────────────
  # The valid brownfield base CR is applied first and must SUCCEED. Brownfield,
  # because the update below reaches the object as a merge patch: it adds its
  # own branch without removing the base's, and the transition rule is keyed on
  # has(instanceRef), which only flips when the base lacks it.
  - try:
    - apply:
        file: 16-immutable-mode-base.yaml
  # The managed/brownfield mode is immutable (CEL transition rule, UPDATE-only).
  - try:
    - apply:
        file: 17-immutable-mode.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'the store mode (instanceRef vs server) is immutable')): true
  # ── single-default block ────────────────────────────────────────────────
  # The valid default base CR is applied first and must SUCCEED.
  - try:
    - apply:
        file: 18-default-base.yaml
  # A second default store on the same Barbican must be rejected by the webhook.
  # The OpenBao-uniqueness rule answers this CR too and both errors aggregate,
  # so the assertion pins the single-default message.
  - try:
    - apply:
        file: 19-second-default.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'exactly one default store is allowed')): true
  # ── OpenBao-uniqueness block ────────────────────────────────────────────
  # The valid non-default base CR is applied first and must SUCCEED.
  - try:
    - apply:
        file: 20-openbao-unique-base.yaml
  # A second OpenBao store on the same Barbican must be rejected by the webhook:
  # the [vault_plugin] options are process-global, so both stores would share
  # one server, one credential, and one mount.
  - try:
    - apply:
        file: 21-second-openbao.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error, 'is already of type OpenBao')): true
