# Barbican CR fixture for the deletion-cleanup E2E test.
# Managed mode: same pattern as basic-deployment, unique name barbican-deletion
# (schema barbican_deletion). Deleting the CR exercises the finalizer-driven
# MariaDB CR sweep and the garbage collection of every owned child, including the
# recurring db-clean CronJob. A single replica keeps the teardown short.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: Barbican
metadata:
  name: barbican-deletion
  namespace: openstack
spec:
  openStackRelease: "2025.2"
  deployment:
    replicas: 1
  image:
    repository: ghcr.io/c5c3/barbican
    tag: "2025.2"
  database:
    clusterRef:
      name: openstack-db
    database: barbican_deletion
    secretRef:
      name: barbican-db
  cache:
    clusterRef:
      name: openstack-memcached
  keystoneEndpoint: http://keystone.openstack.svc.cluster.local:5000/v3
  serviceUser:
    username: admin
    projectName: admin
    userDomainName: Default
    projectDomainName: Default
    secretRef:
      name: keystone-admin
      key: password
