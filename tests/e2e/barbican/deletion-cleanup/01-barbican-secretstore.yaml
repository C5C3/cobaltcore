# Default secret store for the deletion-cleanup E2E test, in managed mode against
# the proving OpenBaoCluster openbao-instance. The suite deletes it before the
# Barbican CR so the store leg of the teardown is observable on its own: a
# detached store leaves the last-good config in place rather than tearing the API
# down with it.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-deletion-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-deletion
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
