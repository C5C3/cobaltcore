# Brownfield secret store for the brownfield-secret-store E2E test.
#
# Server mode addresses an OpenBao provisioned outside this operator, and the
# operator is read-only against it: it reads the two referenced Secrets, verifies
# the credentials with a login and a capability read, and writes no mount, no
# policy and no AppRole. Both Secrets are materialized by
# tests/e2e/barbican/approle-credentials.sh, which stands in for the out-of-band
# provisioning such a store assumes.
#
# The server here is the same proving instance the managed suite provisions
# against, addressed by its Service URL rather than by instanceRef. TLS is
# mandatory on the URL: the role ID, the secret ID, and every secret barbican
# stores travel it.
# region brownfield-store
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-store-brownfield-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-store-brownfield
  type: OpenBao
  isDefault: true
  openBao:
    server:
      url: https://openbao-instance.openstack.svc:8200
      caBundleSecretRef:
        name: openbao-instance-ca
      credentialsSecretRef:
        name: barbican-brownfield-approle
# endregion brownfield-store
