# Default secret store for the 2026.1 basic-deployment E2E test, in managed mode
# against the proving OpenBaoCluster openbao-instance. The secret-store contract
# is release-independent, so this fixture is the 2025.2 twin with the names
# moved; see tests/e2e/barbican/basic-deployment/01-barbican-secretstore.yaml for
# what the managed mode derives from the instance name.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-basic-2026-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-basic-2026
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
