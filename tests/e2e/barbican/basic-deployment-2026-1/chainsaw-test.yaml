# Chainsaw E2E test for happy-path Barbican deployment (2026.1 release).
# The per-release twin of the 2025.2 basic-deployment suite. Barbican has only
# ever shipped a WSGI application, so there is no launch mode to select per
# release: this suite asserts the SAME uWSGI command and the same [vault_plugin]
# credential split against the 2026.1 image. What does differ is the paste file
# the image ships, and the assertions below are the inverse of the 2025.2 leg's:
#   - All 9 sub-conditions progress to True with expected reasons
#   - Aggregate Ready=True with reason AllReady
#   - The attached managed secret store reaches Ready=True
#   - The API Deployment runs the :2026.1 image under the same uWSGI command
#   - The rendered barbican.conf carries the vault plugin's approle_role_id and
#     NOT its approle_secret_id
#   - The rendered paste file has the 2026.1 shape: the oslo request_id filter is
#     present and the repoze.profile pipeline is gone
#   - The Barbican API answers /healthcheck with 200 from inside the API pod
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: barbican-basic-deployment-2026-1
spec:
  namespace: openstack
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: Apply the Barbican CR and its default secret store ──────────
  - try:
    - apply:
        file: 00-barbican-cr.yaml
    - apply:
        file: 01-barbican-secretstore.yaml
  # ── Step 2: Assert all sub-conditions and Ready ────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: barbican.openstack.c5c3.io/v1alpha1
          kind: Barbican
          metadata:
            name: barbican-basic-2026
            namespace: openstack
          status:
            (conditions[?type == 'SecretsReady']):
            - status: "True"
              reason: SecretsAvailable
            (conditions[?type == 'SecretStoresReady']):
            - status: "True"
              reason: AllStoresProjected
            (conditions[?type == 'DatabaseReady']):
            - status: "True"
              reason: DatabaseSynced
            (conditions[?type == 'DBCleanReady']):
            - status: "True"
              reason: DBCleanScheduled
            (conditions[?type == 'DeploymentReady']):
            - status: "True"
              reason: DeploymentReady
            (conditions[?type == 'BarbicanAPIReady']):
            - status: "True"
              reason: APIHealthy
            (conditions[?type == 'HPAReady']):
            - status: "True"
              reason: HPANotRequired
            (conditions[?type == 'NetworkPolicyReady']):
            - status: "True"
              reason: NetworkPolicyNotRequired
            (conditions[?type == 'HTTPRouteReady']):
            - status: "True"
              reason: HTTPRouteNotRequired
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
            (contains(projectedSecretStores || `[]`, 'barbican-basic-2026-store')): true
    catch:
    - script:
        content: |
          echo "=== Barbican CR status ==="
          kubectl get barbican barbican-basic-2026 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== BarbicanSecretStore status ==="
          kubectl get barbicansecretstore barbican-basic-2026-store -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Barbican API pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=barbican-basic-2026 -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
  # ── Step 3: Assert the Deployment, its uWSGI launch command, Service ────
  # ── and PDB ─────────────────────────────────────────────────────────────
  - try:
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: barbican-basic-2026
            namespace: openstack
          spec:
            template:
              spec:
                containers:
                - name: barbican-api
                  image: ghcr.io/c5c3/barbican:2026.1
                  command:
                  - uwsgi
                  - "--http"
                  - ":9311"
                  - "--http-keepalive"
                  - "--log-master"
                  - "--log-format"
                  - "%(method) %(uri) => generated %(rsize) bytes in %(msecs) msecs (%(proto) %(status))"
                  - "--module"
                  - "barbican.wsgi.api:application"
                  - "--master"
                  - "--lazy-apps"
                  - "--need-app"
                  - "--processes"
                  - "2"
                  - "--threads"
                  - "1"
                (length(containers) == `1`): true
                (containers[0].env[?name == 'OS_DATABASE__CONNECTION'].valueFrom.secretKeyRef.name | [0]): barbican-basic-2026-db-connection
                (containers[0].env[?name == 'OS_DATABASE__CONNECTION'].valueFrom.secretKeyRef.key | [0]): connection
                (containers[0].env[?name == 'OS_KEYSTONE_AUTHTOKEN__PASSWORD'].valueFrom.secretKeyRef.name | [0]): keystone-admin
                (containers[0].env[?name == 'OS_KEYSTONE_AUTHTOKEN__PASSWORD'].valueFrom.secretKeyRef.key | [0]): password
                (containers[0].env[?name == 'OS_VAULT_PLUGIN__APPROLE_SECRET_ID'].valueFrom.secretKeyRef.name | [0]): barbican-basic-2026-store-approle
                (containers[0].env[?name == 'OS_VAULT_PLUGIN__APPROLE_SECRET_ID'].valueFrom.secretKeyRef.key | [0]): secret-id
                (volumes[?name == 'secret-store-ca'].secret.secretName | [0]): openbao-instance-tls-ca
          status:
            (availableReplicas > `0`): true
    - script:
        content: |
          set -eu
          for key in db-connection-hash authtoken-hash secret-store-credentials-hash; do
            VALUE=$(kubectl get deploy barbican-basic-2026 -n openstack \
              -o "jsonpath={.spec.template.metadata.annotations['barbican\.c5c3\.io/${key}']}")
            if [ -z "$VALUE" ]; then
              echo "ERROR: pod template carries no barbican.c5c3.io/${key} annotation"
              exit 1
            fi
            echo "OK: barbican.c5c3.io/${key} = $VALUE"
          done
    - assert:
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: barbican-basic-2026
            namespace: openstack
          spec:
            ports:
            - port: 9311
    - assert:
        resource:
          apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata:
            name: barbican-basic-2026
            namespace: openstack
            labels:
              app.kubernetes.io/name: barbican
              app.kubernetes.io/instance: barbican-basic-2026
              app.kubernetes.io/managed-by: barbican-operator
          spec:
            minAvailable: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: barbican
                app.kubernetes.io/instance: barbican-basic-2026
              matchExpressions:
              - key: batch.kubernetes.io/job-name
                operator: DoesNotExist
  # ── Step 4: Assert the attached secret store is Ready ──────────────────
  - try:
    - assert:
        resource:
          apiVersion: barbican.openstack.c5c3.io/v1alpha1
          kind: BarbicanSecretStore
          metadata:
            name: barbican-basic-2026-store
            namespace: openstack
          status:
            (conditions[?type == 'ProvisioningReady']):
            - status: "True"
              reason: Provisioned
            (conditions[?type == 'CredentialsReady']):
            - status: "True"
              reason: CredentialsAvailable
            (conditions[?type == 'ConfigProjected']):
            - status: "True"
              reason: ConfigProjected
            (conditions[?type == 'Ready']):
            - status: "True"
              reason: AllReady
  # ── Step 5: Assert the rendered config Secret ──────────────────────────
  # The [vault_plugin] greps are identical to the 2025.2 leg's: the credential
  # split does not move with the release, and keeping them here is what turns
  # that claim into an end-to-end one against the 2026.1 image.
  #
  # The paste greps are the INVERSE of the 2025.2 leg's. Upstream added the oslo
  # request_id filter to every pipeline and dropped the repoze.profile pipeline
  # in 2026.1, and both deltas ride on the same release boundary in
  # reconcile_config.go, so a boundary that moved shows up here.
  - try:
    - script:
        content: |
          kubectl get secret -n openstack -o name | grep barbican-basic-2026-config-
    - script:
        content: |
          set -eu
          SEC=$(kubectl get deploy barbican-basic-2026 -n openstack \
            -o 'jsonpath={.spec.template.spec.volumes[?(@.name=="config")].secret.secretName}')
          test -n "$SEC"
          kubectl get secret "$SEC" -n openstack -o 'jsonpath={.data.barbican\.conf}' \
            | base64 -d > /tmp/barbican-basic-2026.conf
          kubectl get secret "$SEC" -n openstack -o 'jsonpath={.data.barbican-api-paste\.ini}' \
            | base64 -d > /tmp/barbican-basic-2026-paste.ini
          awk '/^\[vault_plugin\]$/{f=1;next} /^\[/{f=0} f' /tmp/barbican-basic-2026.conf \
            > /tmp/barbican-basic-2026-vault-plugin.ini
          grep -q '^approle_role_id = ' /tmp/barbican-basic-2026-vault-plugin.ini
          if grep -q 'approle_secret_id' /tmp/barbican-basic-2026.conf; then
            echo "ERROR: barbican.conf carries an approle_secret_id option"
            exit 1
          fi
          echo "OK: $SEC renders approle_role_id in [vault_plugin] and no approle_secret_id"
          grep -q '^\[filter:request_id\]$' /tmp/barbican-basic-2026-paste.ini
          if grep -q '^\[pipeline:barbican-profile\]$' /tmp/barbican-basic-2026-paste.ini; then
            echo "ERROR: barbican-api-paste.ini carries the pre-2026.1 barbican-profile pipeline"
            exit 1
          fi
          echo "OK: $SEC renders the 2026.1 paste shape (request_id filter, no barbican-profile pipeline)"
  # ── Step 6: Assert the Barbican API answers /healthcheck over HTTP ──────
  - try:
    - script:
        timeout: 90s
        content: |
          set -eu
          POD=$(kubectl get pods -n $NAMESPACE \
            -l app.kubernetes.io/instance=barbican-basic-2026 \
            --field-selector=status.phase=Running -o name 2>/dev/null | head -1 || true)
          if [ -z "$POD" ]; then
            echo "ERROR: no Running barbican-api pod for barbican-basic-2026"
            exit 1
          fi
          kubectl exec -n $NAMESPACE "$POD" -c barbican-api -- python3 -c "
          import time, urllib.error, urllib.request
          last = None
          for _ in range(15):
              try:
                  r = urllib.request.urlopen('http://localhost:9311/healthcheck')
                  assert r.status == 200, r.status
                  print('healthcheck OK, status %d' % r.status)
                  break
              except urllib.error.HTTPError as exc:
                  raise SystemExit('GET /healthcheck -> HTTP %d' % exc.code)
              except (urllib.error.URLError, ConnectionError, OSError) as exc:
                  last = exc
                  print('healthcheck retry: %s' % exc)
                  time.sleep(2)
          else:
              raise SystemExit('healthcheck never answered after retries: %r' % last)
          "
    catch:
    - script:
        content: |
          echo "=== Barbican CR status ==="
          kubectl get barbican barbican-basic-2026 -n $NAMESPACE -o yaml 2>&1 || true
          echo "=== Operator pod logs ==="
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --all-containers --tail=60 2>&1 || true
          kubectl logs -n barbican-system -l app.kubernetes.io/name=barbican-operator --all-containers --tail=60 --previous 2>&1 || true
          echo "=== Barbican API pod logs ==="
          for pod in $(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=barbican-basic-2026 -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 2>&1 || true
            kubectl logs -n $NAMESPACE "$pod" --all-containers --tail=60 --previous 2>&1 || true
          done
          echo "=== Service and Endpoints ==="
          kubectl get svc,endpoints -n $NAMESPACE -l app.kubernetes.io/instance=barbican-basic-2026 2>&1 || true
          echo "=== Events ==="
          kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' 2>&1 | tail -30 || true
