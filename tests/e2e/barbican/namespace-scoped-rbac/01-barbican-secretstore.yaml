# Default secret store for the barbican-ns-scoped CR, the healthcheck store
# under this suite's names, in managed mode against the proving OpenBaoCluster
# openbao-instance. The operator's probe runs in the post-deployment parallel
# group, so it has nothing to probe until a credential-ready default store lets
# the workload be created. The store controller requests the
# openbao-instance-provisioner token through the TokenRequest grant the suite
# installs with the release.
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-ns-scoped-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-ns-scoped
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
