# Managed secret store for the managed-secret-store E2E test.
#
# instanceRef is the managed mode: the operator authenticates to the referenced
# OpenBaoCluster as its provisioner ServiceAccount, verifies the barbican/ mount
# and the barbican AppRole the instance's self-init provisioned, mints a secret ID
# through the AppRole generate endpoint, and writes the credentials into the
# Secret it derives by appending "-approle" to this store's name.
#
# kvMountpoint is left at its default: a managed store is pinned to the barbican/
# mount, which is the only one the self-init contract provisions.
# region managed-store
apiVersion: barbican.openstack.c5c3.io/v1alpha1
kind: BarbicanSecretStore
metadata:
  name: barbican-store-managed-store
  namespace: openstack
spec:
  barbicanRef:
    name: barbican-store-managed
  type: OpenBao
  isDefault: true
  openBao:
    instanceRef:
      name: openbao-instance
# endregion managed-store
