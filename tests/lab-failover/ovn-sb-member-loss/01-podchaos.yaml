# PodChaos of ovn-sb-member-loss: the Southbound follower, which step 3 renders in for
# @POD@, is down for 180 s.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: lf-ovn-sb-member-loss
  namespace: openstack-ha
spec:
  action: pod-failure
  mode: all
  duration: "180s"
  selector:
    pods:
      openstack-ha:
        - "@POD@"
