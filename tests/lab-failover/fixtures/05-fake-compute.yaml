# The nova-compute the server stream of the lab failover suites schedules
# onto, on nova's fake virt driver: tests/e2e/c5c3/full-controlplane-keystone/
# 06-fake-compute.yaml under the names of the ControlPlane cp-ha.
#
# The ControlPlane projects no compute workload, and what the projected Nova
# publishes for one is the contract Secret cp-ha-nova-compute-config. The
# Secret is consumed, never created here: the nova operator writes it, so
# `hack/lab-failover.sh up` applies this file only after NovaReady and then
# maps the host with tests/e2e/nova/discover-hosts.sh.
#
# The compute registers under the name of the node it runs on, like the lab's
# hypervisors. Each Nova has databases of its own, so that host name does not
# collide with the lab's.
#
# The labels are app.kubernetes.io/name: nova-fake-compute rather than "nova",
# because every selector the nova operator writes matches on
# app.kubernetes.io/name: nova. The instance label is cp-ha-nova.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cp-ha-fake-compute-conf
  namespace: openstack-ha
  labels:
    app.kubernetes.io/name: nova-fake-compute
    app.kubernetes.io/instance: cp-ha-nova
data:
  # The overlay the contract fragment says nothing about: what to drive, where
  # to write and which console address to report. oslo.config reads every file
  # in a --config-dir, so this lands beside the fragment rather than replacing
  # it.
  #
  # FakeDriverWithoutFakeNodes reports one node named after [DEFAULT] host,
  # which keeps the hypervisor, the compute service and the resource provider
  # under one name.
  #
  # vif plugging is switched off and given a zero timeout, as in the e2e
  # fixture. The servers of the workload's server stream carry no port, so no
  # network-vif-plugged event is due.
  #
  # server_proxyclient_address is the loopback the fake driver would serve a
  # console on. Nothing connects to it, but [vnc] enabled is true in the
  # fragment, so the option has to resolve.
  compute.conf: |
    [DEFAULT]
    compute_driver = fake.FakeDriverWithoutFakeNodes
    vif_plugging_is_fatal = false
    vif_plugging_timeout = 0
    state_path = /var/lib/nova
    [oslo_concurrency]
    lock_path = /var/lib/nova/tmp
    [vnc]
    server_listen = 0.0.0.0
    server_proxyclient_address = 127.0.0.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-ha-fake-compute
  namespace: openstack-ha
  labels:
    app.kubernetes.io/name: nova-fake-compute
    app.kubernetes.io/instance: cp-ha-nova
spec:
  replicas: 1
  # Recreate, because the two pods of a rolling update would register under the
  # same [DEFAULT] host and hold the same compute node record open twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nova-fake-compute
      app.kubernetes.io/instance: cp-ha-nova
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nova-fake-compute
        app.kubernetes.io/instance: cp-ha-nova
    spec:
      # nova-compute never calls the Kubernetes API, so the pod gets no token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 42424
        runAsGroup: 42424
        fsGroup: 42424
      initContainers:
        # nova-compute writes a uuid to state_path/compute_id on its first start
        # and refuses to start again if the file is gone while its service
        # record is not. state_path is an emptyDir here, so the file dies with
        # the pod: seeding a fixed uuid is what lets the pod restart.
        - name: node-identity
          image: ghcr.io/c5c3/nova:2026.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", 'printf %s "$COMPUTE_ID" > /var/lib/nova/compute_id']
          env:
            - name: COMPUTE_ID
              value: d13d13d1-0000-4000-8000-000000001393
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /var/lib/nova
      containers:
        - name: nova-compute
          image: ghcr.io/c5c3/nova:2026.1
          imagePullPolicy: IfNotPresent
          # The fragment by absolute path, the overlay as a directory: the
          # fragment is one key of a Secret whose other keys are values rather
          # than config files, so a --config-dir over the mount would hand
          # oslo.config the transport URL as if it were a document.
          command:
            - nova-compute
            - --config-file
            - /etc/nova/compute-config/nova-compute.conf
            - --config-dir
            - /etc/nova/compute.conf.d
          env:
            # The identity the compute registers under. It is the node's name
            # because the OVN chassis registers under that name too
            # (operators/ovn/internal/controller/reconcile_nodes.go:145 sets
            # external_ids:hostname="${NODE_NAME}"), and neutron binds a port
            # only to a host that has a live chassis. A compute under any other
            # name would leave every port unbound.
            - name: OS_DEFAULT__HOST
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OS_DEFAULT__TRANSPORT_URL
              valueFrom:
                secretKeyRef:
                  name: cp-ha-nova-compute-config
                  key: transport_url
            # The four client sections of the fragment and the token middleware
            # all authenticate as the one service account the contract publishes
            # under the password key, which is why every override reads it.
            - name: OS_KEYSTONE_AUTHTOKEN__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cp-ha-nova-compute-config
                  key: password
            - name: OS_SERVICE_USER__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cp-ha-nova-compute-config
                  key: password
            - name: OS_PLACEMENT__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cp-ha-nova-compute-config
                  key: password
            - name: OS_NEUTRON__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cp-ha-nova-compute-config
                  key: password
            - name: OS_CINDER__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cp-ha-nova-compute-config
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: compute-config
              mountPath: /etc/nova/compute-config
              readOnly: true
            - name: compute-overlay
              mountPath: /etc/nova/compute.conf.d
              readOnly: true
            - name: state
              mountPath: /var/lib/nova
            - name: tmp
              mountPath: /tmp
      volumes:
        # The whole Secret, not one key: on a TLS bus the contract adds ca.crt
        # beside the fragment, which is where its ssl_ca_file points.
        - name: compute-config
          secret:
            secretName: cp-ha-nova-compute-config
        - name: compute-overlay
          configMap:
            name: cp-ha-fake-compute-conf
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
