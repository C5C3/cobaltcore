# The Horizon Django SECRET_KEY of the ControlPlane cp-ha, which
# spec.services.horizon.secretKeyRef of 03-controlplane.yaml names. The
# default the reconciler falls back to, the Secret horizon-secret-key, exists
# in openstack only.
#
# cp_seed of tests/e2e-chaos/lib/controlplane.sh runs
# write-bootstrap-secrets.sh with KORC_CONTROLPLANES=openstack-ha/cp-ha, which
# writes the key to bootstrap/openstack-ha/cp-ha-horizon/secret-key when the
# path is absent.
#
# The store is the namespaced openbao-tenant-store, not the ClusterSecretStore
# openbao-cluster-store of
# tests/e2e/c5c3/full-controlplane-keystone/02-horizon-secret-key-externalsecret.yaml:
# the cluster store admits the namespaces openstack and shared-services only
# (deploy/eso/clustersecretstore.yaml). The c5c3-operator creates the tenant
# store in the plane's namespace in its ESOTenantStore step, and the policy
# eso-tenant grants it bootstrap/<namespace>/*. `hack/lab-failover.sh up`
# applies this file once the ControlPlane reads ESOTenantStoreReady=True.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cp-ha-horizon-secret-key
  namespace: openstack-ha
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-tenant-store
    kind: SecretStore
  target:
    name: cp-ha-horizon-secret-key
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: bootstrap/openstack-ha/cp-ha-horizon/secret-key
        property: secret-key
