# Lab failover test: broker minority partition.
#
# Fault: a NetworkChaos partition, direction both, cuts
# openstack-rabbitmq-server-0 off from server-1 and server-2 for 180 s:
# server-0 is a minority of one.
#
# Claim, phase by phase:
#   fault     Within 60 s of AllInjected server-1 lists 2 running nodes.
#   recovery  Once the NetworkChaos is gone, every node lists 3 running
#             nodes, no partition and no alarm, and every quorum queue of the
#             vhost / has all its members online, within 300 s (BROKER-OK).
#             The step prints the broker's cluster_partition_handling, which
#             decides what server-0 did in the minority.
#
# Blast radius: the traffic between the three broker pods of openstack-ha,
# selected by name; none runs on hostNetwork. The NetworkChaos ends itself
# after its duration, and the catch of step 3 and the finally of step 4
# delete it.
#
# Leg: lab only, through `hack/lab-failover.sh run` after the go-ahead;
# neither nightly nor gating (D2 of #1386). The plane is the Standard
# ControlPlane openstack-ha/cp-ha that `hack/lab-failover.sh up` brings up.
#
# Workload: the token, server and volume streams of
# ../../e2e-chaos/lib/workload.sh run against the plane's in-cluster
# endpoints through the fault, as the plane's admin; verify adds the
# Placement audit of cp-ha-nova and the OVN database comparison of
# cp-ha-neutron. The budget is an estimate until a lab run measures it.
# Chaos budget: failures=40 recovery=300s
# Chaos budget measured: 2026-10-19, estimate, failures 40, recovery 300 s
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rabbitmq-minority-partition
spec:
  namespace: openstack-ha
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: The plane and its three clusters are healthy ───────────────
  - try:
    - script:
        timeout: 10m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          lf_baseline
    catch:
    - &lf-dump
      script:
        timeout: 5m
        shell: bash
        content: |
          . ../lib/failover.sh
          lf_dump
  # ── Step 2: Start the workload ─────────────────────────────────────────
  - try:
    - script:
        timeout: 6m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          lf_workload_start rabbitmq-minority-partition token,server,volume
    catch:
    - *lf-dump
    - &workload-dump
      script:
        timeout: 1m
        content: ../../e2e-chaos/lib/workload.sh dump rabbitmq-minority-partition
    cleanup:
    - script:
        timeout: 1m
        content: ../../e2e-chaos/lib/workload.sh stop rabbitmq-minority-partition
  # ── Step 3: Inject the fault ───────────────────────────────────────────
  - try:
    - script:
        timeout: 3m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          echo "targets: ${LF_BROKER}-server-0 against server-1 and server-2"
          ../../e2e-chaos/lib/workload.sh mark rabbitmq-minority-partition fault-start
          lf_render 01-networkchaos.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl wait networkchaos/lf-rabbitmq-minority-partition -n "$NAMESPACE" --for=condition=AllInjected --timeout=60s
    catch:
    - &lift
      script:
        timeout: 3m
        shell: bash
        content: |
          . ../lib/failover.sh
          lf_delete_chaos networkchaos lf-rabbitmq-minority-partition
    - *lf-dump
    - *workload-dump
  # ── Step 4: The fault check, then lift the fault ───────────────────────
  - try:
    - script:
        timeout: 8m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          # server-1 sees the broker without server-0.
          two_running() {
            local st
            st="$(rabbit_cluster "${LF_BROKER}-server-1")" || return 1
            echo "${LF_BROKER}-server-1: ${st}"
            case "$st" in "running=2 "*) ;; *) return 1 ;; esac
          }
          lf_until 60 "${LF_BROKER}-server-1 lists 2 running nodes" two_running
          lf_wait_expired networkchaos lf-rabbitmq-minority-partition 240
          lf_delete_chaos networkchaos lf-rabbitmq-minority-partition
          ../../e2e-chaos/lib/workload.sh mark rabbitmq-minority-partition fault-end
    catch:
    - *lf-dump
    - *workload-dump
    finally:
    - *lift
  # ── Step 5: Recovery ─────────────────────────────────────────────────
  - try:
    - script:
        timeout: 7m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          rabbit_wait_healthy 300
          echo "cluster_partition_handling: $(rabbit_partition_handling)"
    catch:
    - *lf-dump
    - *workload-dump
  # ── Step 6: Judge the workload against the budget ─────────────────────
  - try:
    - script:
        timeout: 20m
        content: ../../e2e-chaos/lib/workload.sh verify rabbitmq-minority-partition --placement-audit cp-ha-nova --ovn-db-sync cp-ha-neutron
    catch:
    - *lf-dump
    - *workload-dump
