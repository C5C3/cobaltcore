# NetworkChaos of rabbitmq-minority-partition: server-0 of RabbitmqCluster
# openstack-rabbitmq and the other two nodes cannot reach each other for
# 180 s. The pod names are fixed, so the manifest carries no placeholder.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: lf-rabbitmq-minority-partition
  namespace: openstack-ha
spec:
  action: partition
  mode: all
  direction: both
  duration: "180s"
  selector:
    pods:
      openstack-ha:
        - openstack-rabbitmq-server-0
  target:
    mode: all
    selector:
      pods:
        openstack-ha:
          - openstack-rabbitmq-server-1
          - openstack-rabbitmq-server-2
