# Lab failover test: broker node loss.
#
# Fault: a PodChaos pod-failure holds down openstack-rabbitmq-server-0,
# the first peer-discovery seed of RabbitmqCluster openstack-rabbitmq,
# for 180 s.
#
# Claim, phase by phase:
#   fault     Within 60 s of AllInjected server-1 lists 2 running nodes.
#   recovery  Once the PodChaos is gone, every node lists 3 running nodes,
#             no partition and no alarm, and every quorum queue of the vhost
#             / has all its members online, within 300 s (BROKER-OK).
#
# Blast radius: pods of openstack-ha only, selected by name; none runs on
# hostNetwork. The PodChaos ends itself after its duration, and the catch of
# step 3 and the finally of step 4 delete it.
#
# Leg: lab only, through `hack/lab-failover.sh run` after the go-ahead;
# neither nightly nor gating (D2 of #1386). The plane is the Standard
# ControlPlane openstack-ha/cp-ha that `hack/lab-failover.sh up` brings up.
#
# Workload: the token, server and volume streams of
# ../../e2e-chaos/lib/workload.sh run against the plane's in-cluster
# endpoints through the fault, as the plane's admin; verify adds the
# Placement audit of cp-ha-nova and the OVN database comparison of
# cp-ha-neutron. The budget is an estimate until a lab run measures it.
# Chaos budget: failures=40 recovery=300s
# Chaos budget measured: 2026-10-19, estimate, failures 40, recovery 300 s
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rabbitmq-node-loss
spec:
  namespace: openstack-ha
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: The plane and its three clusters are healthy ───────────────
  - try:
    - script:
        timeout: 10m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          lf_baseline
    catch:
    - &lf-dump
      script:
        timeout: 5m
        shell: bash
        content: |
          . ../lib/failover.sh
          lf_dump
  # ── Step 2: Start the workload ─────────────────────────────────────────
  - try:
    - script:
        timeout: 6m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          lf_workload_start rabbitmq-node-loss token,server,volume
    catch:
    - *lf-dump
    - &workload-dump
      script:
        timeout: 1m
        content: ../../e2e-chaos/lib/workload.sh dump rabbitmq-node-loss
    cleanup:
    - script:
        timeout: 1m
        content: ../../e2e-chaos/lib/workload.sh stop rabbitmq-node-loss
  # ── Step 3: Inject the fault ───────────────────────────────────────────
  - try:
    - script:
        timeout: 3m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          echo "target: ${LF_BROKER}-server-0"
          ../../e2e-chaos/lib/workload.sh mark rabbitmq-node-loss fault-start
          lf_render 01-podchaos.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl wait podchaos/lf-rabbitmq-node-loss -n "$NAMESPACE" --for=condition=AllInjected --timeout=60s
    catch:
    - &lift
      script:
        timeout: 3m
        shell: bash
        content: |
          . ../lib/failover.sh
          lf_delete_chaos podchaos lf-rabbitmq-node-loss
    - *lf-dump
    - *workload-dump
  # ── Step 4: The fault check, then lift the fault ───────────────────────
  - try:
    - script:
        timeout: 8m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          # server-1 sees the broker without server-0.
          two_running() {
            local st
            st="$(rabbit_cluster "${LF_BROKER}-server-1")" || return 1
            echo "${LF_BROKER}-server-1: ${st}"
            case "$st" in "running=2 "*) ;; *) return 1 ;; esac
          }
          lf_until 60 "${LF_BROKER}-server-1 lists 2 running nodes" two_running
          lf_wait_expired podchaos lf-rabbitmq-node-loss 240
          lf_delete_chaos podchaos lf-rabbitmq-node-loss
          ../../e2e-chaos/lib/workload.sh mark rabbitmq-node-loss fault-end
    catch:
    - *lf-dump
    - *workload-dump
    finally:
    - *lift
  # ── Step 5: Recovery ─────────────────────────────────────────────────
  - try:
    - script:
        timeout: 7m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          rabbit_wait_healthy 300
    catch:
    - *lf-dump
    - *workload-dump
  # ── Step 6: Judge the workload against the budget ─────────────────────
  - try:
    - script:
        timeout: 20m
        content: ../../e2e-chaos/lib/workload.sh verify rabbitmq-node-loss --placement-audit cp-ha-nova --ovn-db-sync cp-ha-neutron
    catch:
    - *lf-dump
    - *workload-dump
