# PodChaos of galera-member-loss: the member at status.currentPrimary of
# MariaDB openstack-db, which step 3 renders in for @POD@, is down for
# 180 s.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: lf-galera-member-loss
  namespace: openstack-ha
spec:
  action: pod-failure
  mode: all
  duration: "180s"
  selector:
    pods:
      openstack-ha:
        - "@POD@"
