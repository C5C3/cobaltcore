# Lab failover test: Galera primary-component loss.
#
# Fault: one PodChaos pod-failure holds down, for 180 s, the member that
# MariaDB openstack-db names in status.currentPrimary and the member with
# the next index mod 3. The third member is left without a quorum.
#
# Claim, phase by phase:
#   fault     Within 60 s of AllInjected the third member reports a
#             wsrep_cluster_status other than Primary, and MariaDB
#             openstack-db reads GaleraReady=False.
#   recovery  Once the PodChaos is gone, the mariadb-operator's Galera
#             recovery, on its defaults, brings the three members back into
#             one Primary component within 900 s (GALERA-OK), with no hand
#             action. The step prints status.galeraRecovery.bootstrap when
#             the operator set it while the step ran.
#
# Blast radius: pods of openstack-ha only, selected by name; none runs on
# hostNetwork. The PodChaos ends itself after its duration, and the catch of
# step 3 and the finally of step 4 delete it.
#
# Leg: lab only, through `hack/lab-failover.sh run` after the go-ahead;
# neither nightly nor gating (D2 of #1386). The plane is the Standard
# ControlPlane openstack-ha/cp-ha that `hack/lab-failover.sh up` brings up.
#
# Workload: the token, network, server, volume, image, placement and secret
# streams of ../../e2e-chaos/lib/workload.sh run against the plane's
# in-cluster endpoints through the fault, as the plane's admin; verify adds
# the Placement audit of cp-ha-nova and the OVN database comparison of
# cp-ha-neutron. The budget is an estimate until a lab run measures it.
# Chaos budget: failures=1000 recovery=900s
# Chaos budget measured: 2026-10-19, estimate, failures 1000, recovery 900 s
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: galera-primary-loss
spec:
  namespace: openstack-ha
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: The plane and its three clusters are healthy ───────────────
  - try:
    - script:
        timeout: 10m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          lf_baseline
    catch:
    - &lf-dump
      script:
        timeout: 5m
        shell: bash
        content: |
          . ../lib/failover.sh
          lf_dump
  # ── Step 2: Start the workload ─────────────────────────────────────────
  - try:
    - script:
        timeout: 6m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          lf_workload_start galera-primary-loss token,network,server,volume,image,placement,secret
    catch:
    - *lf-dump
    - &workload-dump
      script:
        timeout: 1m
        content: ../../e2e-chaos/lib/workload.sh dump galera-primary-loss
    cleanup:
    - script:
        timeout: 1m
        content: ../../e2e-chaos/lib/workload.sh stop galera-primary-loss
  # ── Step 3: Inject the fault ───────────────────────────────────────────
  - try:
    - script:
        timeout: 3m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          primary="$(kubectl get mariadb "$LF_DB" -n "$NAMESPACE" -o jsonpath='{.status.currentPrimary}')"
          case " ${LF_MEMBERS} " in
            *" ${primary#"${LF_DB}"-} "*) ;;
            *) echo "FAIL: MariaDB ${LF_DB} names no current primary ('${primary}')"; exit 1 ;;
          esac
          next="${LF_DB}-$(((${primary##*-} + 1) % LF_MEMBER_COUNT))"
          echo "targets: ${primary}, the current primary, and ${next}"
          ../../e2e-chaos/lib/workload.sh mark galera-primary-loss fault-start
          lf_render 01-podchaos.yaml POD_A="$primary" POD_B="$next" | kubectl apply -n "$NAMESPACE" -f -
          kubectl wait podchaos/lf-galera-primary-loss -n "$NAMESPACE" --for=condition=AllInjected --timeout=60s
    catch:
    - &lift
      script:
        timeout: 3m
        shell: bash
        content: |
          . ../lib/failover.sh
          lf_delete_chaos podchaos lf-galera-primary-loss
    - *lf-dump
    - *workload-dump
  # ── Step 4: The fault check, then lift the fault ───────────────────────
  - try:
    - script:
        timeout: 8m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          targets=" $(kubectl get podchaos lf-galera-primary-loss -n "$NAMESPACE" -o json | jq -r --arg ns "$NAMESPACE" '.spec.selector.pods[$ns] | join(" ")') "
          for i in $LF_MEMBERS; do
            case "$targets" in *" ${LF_DB}-${i} "*) ;; *) third="${LF_DB}-${i}" ;; esac
          done
          echo "the third member: ${third}"
          # The third member has lost the Primary component, and the operator
          # reports the cluster unhealthy.
          lost() {
            local st galera
            st="$(galera_member_status "$third")" || return 1
            galera="$(cp_status mariadb "$LF_DB" GaleraReady)" || return 1
            echo "${third}: ${st}; GaleraReady=${galera:-<none>}"
            case "$st" in *" status=Primary "*) return 1 ;; esac
            [ "$galera" = "False" ]
          }
          lf_until 60 "${third} is out of the Primary component and GaleraReady is False" lost
          lf_wait_expired podchaos lf-galera-primary-loss 240
          lf_delete_chaos podchaos lf-galera-primary-loss
          ../../e2e-chaos/lib/workload.sh mark galera-primary-loss fault-end
    catch:
    - *lf-dump
    - *workload-dump
    finally:
    - *lift
  # ── Step 5: Recovery ─────────────────────────────────────────────────
  - try:
    - script:
        timeout: 17m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          # A sampler records status.galeraRecovery.bootstrap while the wait
          # runs, because the mariadb-operator resets the recovery status.
          seen="$(mktemp)"
          (
            while true; do
              kubectl get mariadb "$LF_DB" -n "$NAMESPACE" -o jsonpath='{.status.galeraRecovery.bootstrap}{"\n"}' >>"$seen" 2>/dev/null || true
              sleep "$LF_POLL_INTERVAL"
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true; rm -f "$seen"' EXIT
          rc=0
          galera_wait_healthy 900 || rc=$?
          bootstrap="$(grep . "$seen" | tail -n 1)" || bootstrap=""
          echo "galeraRecovery.bootstrap: ${bootstrap:-not set while the step ran}"
          exit "$rc"
    catch:
    - *lf-dump
    - *workload-dump
  # ── Step 6: Judge the workload against the budget ─────────────────────
  - try:
    - script:
        timeout: 30m
        content: ../../e2e-chaos/lib/workload.sh verify galera-primary-loss --placement-audit cp-ha-nova --ovn-db-sync cp-ha-neutron
    catch:
    - *lf-dump
    - *workload-dump
