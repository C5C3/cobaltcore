# PodChaos of galera-primary-loss: two of the three members of MariaDB
# openstack-db, which step 3 renders in for @POD_A@ and @POD_B@, are down
# for 180 s.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: lf-galera-primary-loss
  namespace: openstack-ha
spec:
  action: pod-failure
  mode: all
  duration: "180s"
  selector:
    pods:
      openstack-ha:
        - "@POD_A@"
        - "@POD_B@"
