# Lab failover test: OVN Northbound Raft member loss.
#
# Fault: a PodChaos pod-failure holds down one Northbound follower of
# OVNCentral cp-ha-ovn, the lowest-index member ovn_leader does not
# name, for 180 s.
#
# Claim, phase by phase:
#   fault     Within 60 s of AllInjected the follower no longer answers,
#             and at every 5 s sample until the PodChaos ran out the other
#             two members keep one leader.
#   recovery  Once the PodChaos is gone, the three members are in the
#             cluster with one leader within 180 s (RAFT-OK), and
#             ovn-nbctl --wait=sb sync returns within 60 s
#             (NORTHD-SYNC-OK).
#
# Blast radius: pods of openstack-ha only, selected by name; none runs on
# hostNetwork. The PodChaos ends itself after its duration, and the catch of
# step 3 and the finally of step 4 delete it.
#
# Leg: lab only, through `hack/lab-failover.sh run` after the go-ahead;
# neither nightly nor gating (D2 of #1386). The plane is the Standard
# ControlPlane openstack-ha/cp-ha that `hack/lab-failover.sh up` brings up.
#
# Workload: the token and network streams of ../../e2e-chaos/lib/workload.sh
# run against the plane's in-cluster endpoints through the fault, as the
# plane's admin; verify adds the Placement audit of cp-ha-nova and the OVN
# database comparison of cp-ha-neutron. The budget is an estimate until a
# lab run measures it.
# Chaos budget: failures=5 recovery=60s
# Chaos budget measured: 2026-10-19, estimate, failures 5, recovery 60 s
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ovn-nb-member-loss
spec:
  namespace: openstack-ha
  timeouts:
    assert: 5m
  steps:
  # ── Step 1: The plane and its three clusters are healthy ───────────────
  - try:
    - script:
        timeout: 10m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          lf_baseline
    catch:
    - &lf-dump
      script:
        timeout: 5m
        shell: bash
        content: |
          . ../lib/failover.sh
          lf_dump
  # ── Step 2: Start the workload ─────────────────────────────────────────
  - try:
    - script:
        timeout: 6m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          lf_workload_start ovn-nb-member-loss token,network
    catch:
    - *lf-dump
    - &workload-dump
      script:
        timeout: 1m
        content: ../../e2e-chaos/lib/workload.sh dump ovn-nb-member-loss
    cleanup:
    - script:
        timeout: 1m
        content: ../../e2e-chaos/lib/workload.sh stop ovn-nb-member-loss
  # ── Step 3: Inject the fault ───────────────────────────────────────────
  - try:
    - script:
        timeout: 3m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          target="$(ovn_follower nb)"
          echo "target: ${target}, a follower"
          ../../e2e-chaos/lib/workload.sh mark ovn-nb-member-loss fault-start
          lf_render 01-podchaos.yaml POD="$target" | kubectl apply -n "$NAMESPACE" -f -
          kubectl wait podchaos/lf-ovn-nb-member-loss -n "$NAMESPACE" --for=condition=AllInjected --timeout=60s
    catch:
    - &lift
      script:
        timeout: 3m
        shell: bash
        content: |
          . ../lib/failover.sh
          lf_delete_chaos podchaos lf-ovn-nb-member-loss
    - *lf-dump
    - *workload-dump
  # ── Step 4: The fault check, then lift the fault ───────────────────────
  - try:
    - script:
        timeout: 8m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          target="$(kubectl get podchaos lf-ovn-nb-member-loss -n "$NAMESPACE" -o json | jq -r --arg ns "$NAMESPACE" '.spec.selector.pods[$ns][0]')"
          # The follower is down: its ovsdb container no longer answers.
          down() {
            if ovn_role nb "${target##*-}" >/dev/null 2>&1; then return 1; fi
            echo "${target} does not answer"
          }
          # The other two members keep one leader.
          one_leader() {
            local i pod role leaders=0 roles=""
            for i in $LF_MEMBERS; do
              pod="${LF_OVN}-nb-${i}"
              if [ "$pod" = "$target" ]; then continue; fi
              role="$(ovn_role nb "$i")" || role="<unreachable>"
              roles="${roles} ${pod}=${role:-<none>}"
              if [ "$role" = "leader" ]; then leaders=$((leaders + 1)); fi
            done
            echo "roles:${roles}"
            [ "$leaders" -eq 1 ]
          }
          lf_until 60 "${target} is down" down
          lf_wait_expired podchaos lf-ovn-nb-member-loss 240 one_leader
          lf_delete_chaos podchaos lf-ovn-nb-member-loss
          ../../e2e-chaos/lib/workload.sh mark ovn-nb-member-loss fault-end
    catch:
    - *lf-dump
    - *workload-dump
    finally:
    - *lift
  # ── Step 5: Recovery ─────────────────────────────────────────────────
  - try:
    - script:
        timeout: 6m
        shell: bash
        content: |
          set -euo pipefail
          . ../lib/failover.sh
          ovn_wait_healthy nb 180
          ovn_wait_northd_sync 60
    catch:
    - *lf-dump
    - *workload-dump
  # ── Step 6: Judge the workload against the budget ─────────────────────
  - try:
    - script:
        timeout: 16m
        content: ../../e2e-chaos/lib/workload.sh verify ovn-nb-member-loss --placement-audit cp-ha-nova --ovn-db-sync cp-ha-neutron
    catch:
    - *lf-dump
    - *workload-dump
