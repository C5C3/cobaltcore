# dizzy `keystone pressure` profile for #1459: expand implied roles in linear
# time and look up each role once when Keystone lists effective role
# assignments.
#
# The scenario of dizzy's scenario schema reference, "A fan for
# C5C3/cobaltcore#1459": one fan user starts with grants on 500 projects, and
# four stages grow them to 1000, 2000 and 4000 while the workers draw
# validate, effective and grant_churn. Read the report's Stages table: each
# stage's effective latency at its grant count. #1459 measured about fourfold
# growth per doubling on SQLite; on kind with MariaDB, main's 2026.2 image
# grows about twofold, so compare the two builds stage by stage.
#
# The three roles form a chain, role-0001 implies role-0002 and role-0002
# implies role-0003, the shape of Keystone's admin, member and reader. The fan
# grants draw their roles from all three, so each brings one implied
# assignment on average, and Keystone's implied-role expansion and duplicate
# check, the code #1459 changes, run for every listing. grant_churn at the
# weight of effective keeps Keystone's computed-assignment cache cold: Keystone
# answers a repeated listing of the same user from that cache until the next
# assignment write, and a cached listing expands nothing. Its one churn user is
# the last regular user, never the fan user.
#
# The run provisions 4000 projects before the first worker starts and grows
# the fan by 3500 grants while it runs. The grants of a stage come out of its
# window, and a stage whose grants outlast it records nothing. A Keystone on
# kind makes 16 to 45 grants a second, the CI runner the fewer, so stage 4
# spends up to two minutes on its 2000: keep --duration at 12m or more.
#
# See docs/reference/testing/keystone-pressure-testing.md.
name: effective-fan
seed: 42

resources:
  domains:  1
  roles:    3
  projects: 4000
  users:    20
  implied_roles:
    - { prior: role-0001, implies: [role-0002] }
    - { prior: role-0002, implies: [role-0003] }

distribution:
  projects_per_domain:            { min: 1, max: 3 }
  assignments_per_user:           { min: 1, max: 3 }
  domain_scoped_assignment_ratio: 0.1
  users_issuing_tokens_ratio:     0.5
  fan_users:                      1
  fan_assignments:                { min: 500, max: 500 }

pressure:
  duration: 20m
  workers:  8
  tokens:   20
  churn_users: 1               # taken from the end of the plan's users; never the fan
  mix:
    validate:    10
    effective:   20
    revoke:       0
    grant_churn: 20
    issue:        0
  stages:                     # four equal windows of the run duration
    - fan_assignments: 500
    - fan_assignments: 1000
    - fan_assignments: 2000
    - fan_assignments: 4000
