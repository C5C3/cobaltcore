# Static Apache scaffold for the keystone-federation-proxy sidecar. Loads the
# modules the operator-rendered proxy.conf depends on and pins every runtime
# path to /tmp (the pod's only writable mount — the root filesystem is
# read-only) or stderr. All deployment-specific configuration — the
# OIDC directives, protected Locations, header stripping, and the reverse
# proxy to the localhost-bound uWSGI — arrives via the IncludeOptional hook
# at the bottom, mounted from the operator-projected federation Secret.
#
# nixpkgs' httpd compiles in only core, mod_so and http_core. mod_unixd is
# loaded because httpd refuses to start without it (AH00136), although
# `apache2 -t` passes, and mod_log_config keeps the directive set the Debian
# binary offered. image.nix replaces the @...@ placeholders with the store
# paths of httpd and the two federation modules through replaceVars.
LoadModule mpm_event_module @httpd@/modules/mod_mpm_event.so
LoadModule unixd_module @httpd@/modules/mod_unixd.so
LoadModule log_config_module @httpd@/modules/mod_log_config.so
LoadModule authn_core_module @httpd@/modules/mod_authn_core.so
LoadModule authz_core_module @httpd@/modules/mod_authz_core.so
LoadModule authz_user_module @httpd@/modules/mod_authz_user.so
LoadModule headers_module @httpd@/modules/mod_headers.so
LoadModule proxy_module @httpd@/modules/mod_proxy.so
LoadModule proxy_http_module @httpd@/modules/mod_proxy_http.so
LoadModule auth_openidc_module @mod_auth_openidc@/modules/mod_auth_openidc.so
LoadModule auth_mellon_module @mod_auth_mellon@/modules/mod_auth_mellon.so

ServerName keystone-federation-proxy
Listen 5050

PidFile /tmp/apache2.pid
DefaultRuntimeDir /tmp
Mutex default:/tmp

ErrorLog /dev/stderr
LogLevel warn

DocumentRoot /var/www/html

IncludeOptional /etc/keystone-federation-proxy/conf.d/*.conf
