<text x="1268" y="763.2" font-size="20" font-weight="400" fill="#8A2B63">ssl_ca_crt_file</text>
<text x="40" y="1321.2" font-size="20" font-weight="400" fill="#55606E">{cp}, {ns}: the ControlPlane and the namespace of its Barbican. {credentials}, {ca}: the two Secrets the external block names. {mount}: its kvMountpoint, barbican by default.</text>
<text x="40" y="1347.2" font-size="20" font-weight="400" fill="#55606E">One Barbican takes one OpenBao store, so a ControlPlane runs one of the two panels.</text>
<text x="40" y="1373.2" font-size="20" font-weight="400" fill="#55606E">A standalone BarbicanSecretStore has the same two modes; its OpenBaoCluster is then yours.</text>
<text x="40" y="1399.2" font-size="20" font-weight="400" fill="#55606E">The management OpenBao asks every client for a certificate, which the vault plugin of Barbican cannot present. It is no server for an external store.</text>
