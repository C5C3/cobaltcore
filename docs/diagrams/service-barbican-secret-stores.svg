<text x="1204" y="951.2" font-size="20" font-weight="400" fill="#55606E">database credentials only</text>
<polyline points="1300,804 1256,804 1256,674 1220.5,674" fill="none" stroke="#B0387F" stroke-width="3" stroke-dasharray="9 6"/>
