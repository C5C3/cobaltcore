<polyline points="448,228 528,228 528,352 569.5,352" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="580,352 565,359.2 565,344.8" fill="#3A4452"/>
<polyline points="448,292 498,292 498,416 569.5,416" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="580,416 565,423.2 565,408.8" fill="#3A4452"/>
<polyline points="870,352 1010,352 1010,198.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1010,188 1017.2,203 1002.8,203" fill="#3A4452"/>
<polyline points="870,416 1090,416 1090,198.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1090,188 1097.2,203 1082.8,203" fill="#3A4452"/>
<polyline points="870,480 1170,480 1170,198.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1170,188 1177.2,203 1162.8,203" fill="#3A4452"/>
<polyline points="1220,164 1640,164 1640,217.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1640,228 1632.8,213 1647.2,213" fill="#3A4452"/>
<text x="1364" y="145.2" font-size="20" font-weight="400" fill="#2B3440">every release of layer 4</text>
<polyline points="870,672 1409.5,672" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1420,672 1405,679.2 1405,664.8" fill="#3A4452"/>
<polyline points="870,736 1409.5,736" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1420,736 1405,743.2 1405,728.8" fill="#3A4452"/>
<polyline points="100,164 58,164 58,870 410,870 410,999.5" fill="none" stroke="#3A4452" stroke-width="3" stroke-dasharray="3 9"/>
<polygon points="410,1010 402.8,995 417.2,995" fill="#3A4452"/>
<text x="80" y="823.2" font-size="20" font-weight="400" fill="#2B3440">its Issuer and Certificates need cert-manager's CRDs</text>
<text x="80" y="851.2" font-size="20" font-weight="400" fill="#55606E">retryInterval 2m, until they exist</text>
<polyline points="448,1098 1480,1098 1480,834.5" fill="none" stroke="#3A4452" stroke-width="3" stroke-dasharray="3 9"/>
<polygon points="1480,824 1487.2,839 1472.8,839" fill="#3A4452"/>
<text x="508" y="1055.2" font-size="20" font-weight="400" fill="#2B3440">the manager starts only with the K-ORC CRDs</text>
<text x="508" y="1083.2" font-size="20" font-weight="400" fill="#55606E">install retries: 30</text>
<text x="40" y="1201.2" font-size="20" font-weight="400" fill="#55606E">A pill is a HelmRelease of deploy/flux-system/releases, under its metadata.name. The two in the box Flux Kustomizations are Flux Kustomization resources.</text>
<text x="40" y="1227.2" font-size="20" font-weight="400" fill="#55606E">A solid arrow is a dependsOn entry. An entry that other arrows imply is left out. The table on the page lists every entry.</text>
<text x="40" y="1253.2" font-size="20" font-weight="400" fill="#55606E">A dotted arrow holds at run time and is declared nowhere: dependsOn of a HelmRelease names only HelmReleases, dependsOn of a Kustomization only Kustomizations.</text>
</svg>
