<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="916" viewBox="0 0 1808 916" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Pipeline of the NeutronMetadataAgent controller">
<title>Pipeline of the NeutronMetadataAgent controller</title>
<rect width="1808" height="916" fill="#F6F5F1"/>
<rect x="100" y="40" width="1290" height="602" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="119" y="79.36" font-size="26" font-weight="700" fill="#2B3440">Pipeline</text>
<text x="119" y="111.2" font-size="20" font-weight="400" fill="#55606E">one entry after another; the first that returns a requeue or an error ends the pass</text>
<circle cx="50" cy="178" r="10" fill="#17202B"/>
<polyline points="60,178 229.5,178" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="240,178 225,185.2 225,170.8" fill="#3A4452"/>
<rect x="240" y="150" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="186.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Chassis</text>
<text x="530" y="172.2" font-size="20" font-weight="400" fill="#55606E">sets ChassisReady</text>
<text x="530" y="198.2" font-size="20" font-weight="400" fill="#55606E">hands on the resolved chassis</text>
<polyline points="375,206 375,231.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,242 367.8,227 382.2,227" fill="#3A4452"/>
<rect x="240" y="242" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="278.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Secrets</text>
<text x="530" y="264.2" font-size="20" font-weight="400" fill="#55606E">sets SecretsReady</text>
<text x="530" y="290.2" font-size="20" font-weight="400" fill="#55606E">hands on transportDigest and sharedSecretDigest</text>
<polyline points="375,298 375,334.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,345 367.8,330 382.2,330" fill="#3A4452"/>
<rect x="240" y="345" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="381.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Config</text>
<text x="530" y="354.2" font-size="20" font-weight="400" fill="#55606E">reports through SecretsReady</text>
<text x="530" y="380.2" font-size="20" font-weight="400" fill="#55606E">reads the chassis</text>
<text x="530" y="406.2" font-size="20" font-weight="400" fill="#55606E">hands on configMapName</text>
<polyline points="375,401 375,448.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,459 367.8,444 382.2,444" fill="#3A4452"/>
<rect x="240" y="459" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="495.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">DaemonSet</text>
<text x="530" y="468.2" font-size="20" font-weight="400" fill="#55606E">sets DaemonSetReady</text>
<text x="530" y="494.2" font-size="20" font-weight="400" fill="#55606E">reads the chassis, configMapName and the digests</text>
<text x="530" y="520.2" font-size="20" font-weight="400" fill="#55606E">sets status.installedImage</text>
<polyline points="375,515 375,551.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,562 367.8,547 382.2,547" fill="#3A4452"/>
<rect x="240" y="562" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="598.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">AgentVPA</text>
<text x="530" y="597.2" font-size="20" font-weight="400" fill="#55606E">sets VPAReady</text>
<rect x="1330" y="682" width="220" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1440" y="718.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">updateStatus</text>
<text x="1330" y="767.2" font-size="20" font-weight="400" fill="#55606E">aggregates Ready from the sub-conditions</text>
<text x="1330" y="793.2" font-size="20" font-weight="400" fill="#55606E">writes the status only when it changed</text>
<polyline points="375,618 375,710 1319.5,710" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1330,710 1315,717.2 1315,702.8" fill="#3A4452"/>
<text x="820" y="693.2" font-size="20" font-weight="400" fill="#2B3440">every entry returned zero</text>
<polyline points="1390,178 1440,178 1440,671.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1440,682 1432.8,667 1447.2,667" fill="#3A4452"/>
<text x="1456" y="237.2" font-size="20" font-weight="400" fill="#2B3440">first requeue or error</text>
<text x="40" y="843.2" font-size="20" font-weight="400" fill="#55606E">A step label is the sub_reconciler value of the operator's metrics.</text>
<text x="40" y="869.2" font-size="20" font-weight="400" fill="#55606E">There is no parallel group: every step runs in order.</text>
</svg>
