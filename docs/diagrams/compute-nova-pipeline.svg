<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="2177" viewBox="0 0 1808 2177" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Sub-reconciler pipeline of the Nova operator">
<title>Sub-reconciler pipeline of the Nova operator</title>
<rect width="1808" height="2177" fill="#F6F5F1"/>
<rect x="100" y="40" width="1290" height="1863" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="119" y="79.36" font-size="26" font-weight="700" fill="#2B3440">Pipeline</text>
<text x="119" y="111.2" font-size="20" font-weight="400" fill="#55606E">one entry after another; the first that returns a requeue or an error ends the pass</text>
<circle cx="50" cy="178" r="10" fill="#17202B"/>
<polyline points="60,178 229.5,178" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="240,178 225,185.2 225,170.8" fill="#3A4452"/>
<rect x="240" y="150" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="186.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Secrets</text>
<text x="530" y="172.2" font-size="20" font-weight="400" fill="#55606E">sets SecretsReady</text>
<text x="530" y="198.2" font-size="20" font-weight="400" fill="#55606E">hands on the values and two digests</text>
<polyline points="375,206 375,231.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,242 367.8,227 382.2,227" fill="#3A4452"/>
<rect x="240" y="242" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="278.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">DBConnectionSecrets</text>
<text x="530" y="264.2" font-size="20" font-weight="400" fill="#55606E">reports through SecretsReady</text>
<text x="530" y="290.2" font-size="20" font-weight="400" fill="#55606E">hands on apiDSNDigest and cellDSNDigest</text>
<polyline points="375,298 375,323.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,334 367.8,319 382.2,319" fill="#3A4452"/>
<rect x="240" y="334" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="370.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">TransportURLSecret</text>
<text x="530" y="356.2" font-size="20" font-weight="400" fill="#55606E">reports through SecretsReady</text>
<text x="530" y="382.2" font-size="20" font-weight="400" fill="#55606E">hands on transportURL, its digest and egressPort</text>
<polyline points="375,390 375,415.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,426 367.8,411 382.2,411" fill="#3A4452"/>
<rect x="240" y="426" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="462.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Config</text>
<text x="530" y="448.2" font-size="20" font-weight="400" fill="#55606E">reports through SecretsReady</text>
<text x="530" y="474.2" font-size="20" font-weight="400" fill="#55606E">hands on configMapName</text>
<polyline points="375,482 375,507.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,518 367.8,503 382.2,503" fill="#3A4452"/>
<rect x="240" y="518" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="554.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">ComputeConfig</text>
<text x="530" y="540.2" font-size="20" font-weight="400" fill="#55606E">sets ComputeConfigReady</text>
<text x="530" y="566.2" font-size="20" font-weight="400" fill="#55606E">reads transportURL and the values</text>
<polyline points="375,574 375,599.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,610 367.8,595 382.2,595" fill="#3A4452"/>
<rect x="240" y="610" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="646.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Database</text>
<text x="530" y="632.2" font-size="20" font-weight="400" fill="#55606E">sets DatabaseReady</text>
<text x="530" y="658.2" font-size="20" font-weight="400" fill="#55606E">reads configMapName</text>
<polyline points="375,666 375,691.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,702 367.8,687 382.2,687" fill="#3A4452"/>
<rect x="240" y="702" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="738.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Conductor</text>
<text x="530" y="724.2" font-size="20" font-weight="400" fill="#55606E">sets ConductorReady</text>
<text x="530" y="750.2" font-size="20" font-weight="400" fill="#55606E">reads the digests and egressPort</text>
<polyline points="375,758 375,783.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,794 367.8,779 382.2,779" fill="#3A4452"/>
<rect x="240" y="794" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="830.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Scheduler</text>
<text x="530" y="816.2" font-size="20" font-weight="400" fill="#55606E">sets SchedulerReady</text>
<text x="530" y="842.2" font-size="20" font-weight="400" fill="#55606E">reads the digests and egressPort</text>
<polyline points="375,850 375,875.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,886 367.8,871 382.2,871" fill="#3A4452"/>
<rect x="240" y="886" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="922.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Metadata</text>
<text x="530" y="908.2" font-size="20" font-weight="400" fill="#55606E">sets MetadataReady</text>
<text x="530" y="934.2" font-size="20" font-weight="400" fill="#55606E">reads the digests</text>
<polyline points="375,942 375,967.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,978 367.8,963 382.2,963" fill="#3A4452"/>
<rect x="240" y="978" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="1014.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">ConsoleProxy</text>
<text x="530" y="1000.2" font-size="20" font-weight="400" fill="#55606E">sets ConsoleProxyReady</text>
<text x="530" y="1026.2" font-size="20" font-weight="400" fill="#55606E">reads the digests</text>
<polyline points="375,1034 375,1070.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,1081 367.8,1066 382.2,1066" fill="#3A4452"/>
<rect x="240" y="1081" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="1117.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Deployment</text>
<text x="530" y="1090.2" font-size="20" font-weight="400" fill="#55606E">sets DeploymentReady</text>
<text x="530" y="1116.2" font-size="20" font-weight="400" fill="#55606E">reads the digests</text>
<text x="530" y="1142.2" font-size="20" font-weight="400" fill="#55606E">sets status.endpoint</text>
<polyline points="375,1137 375,1173.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,1184 367.8,1169 382.2,1169" fill="#3A4452"/>
<rect x="240" y="1184" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="1220.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">DBArchive</text>
<text x="530" y="1206.2" font-size="20" font-weight="400" fill="#55606E">sets DBArchiveReady</text>
<text x="530" y="1232.2" font-size="20" font-weight="400" fill="#55606E">reads configMapName</text>
<polyline points="375,1240 375,1265.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,1276 367.8,1261 382.2,1261" fill="#3A4452"/>
<rect x="120" y="1276" width="840" height="603" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="139" y="1315.36" font-size="26" font-weight="700" fill="#2B3440">Parallel group</text>
<text x="139" y="1347.2" font-size="20" font-weight="400" fill="#55606E">every member starts; the shortest requeue is returned</text>
<rect x="140" y="1369" width="350" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="315" y="1405.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">HTTPRoute</text>
<text x="140" y="1452.2" font-size="20" font-weight="400" fill="#55606E">sets HTTPRouteReady</text>
<rect x="560" y="1369" width="350" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="735" y="1405.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">MetadataHTTPRoute</text>
<text x="560" y="1452.2" font-size="20" font-weight="400" fill="#55606E">sets MetadataHTTPRouteReady</text>
<rect x="140" y="1503" width="350" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="315" y="1539.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">ConsoleHTTPRoute</text>
<text x="140" y="1586.2" font-size="20" font-weight="400" fill="#55606E">sets ConsoleHTTPRouteReady</text>
<rect x="560" y="1503" width="350" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="735" y="1539.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">HealthCheck</text>
<text x="560" y="1586.2" font-size="20" font-weight="400" fill="#55606E">sets NovaAPIReady</text>
<rect x="140" y="1637" width="350" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="315" y="1673.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">HPA</text>
<text x="140" y="1720.2" font-size="20" font-weight="400" fill="#55606E">sets HPAReady</text>
<rect x="560" y="1637" width="350" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="735" y="1673.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">VPA</text>
<text x="560" y="1720.2" font-size="20" font-weight="400" fill="#55606E">sets VPAReady</text>
<rect x="140" y="1771" width="350" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="315" y="1807.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">NetworkPolicy</text>
<text x="140" y="1854.2" font-size="20" font-weight="400" fill="#55606E">sets NetworkPolicyReady</text>
<rect x="1330" y="1943" width="220" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1440" y="1979.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">updateStatus</text>
<text x="1330" y="2028.2" font-size="20" font-weight="400" fill="#55606E">aggregates Ready from the sub-conditions</text>
<text x="1330" y="2054.2" font-size="20" font-weight="400" fill="#55606E">writes the status only when it changed</text>
<polyline points="375,1879 375,1971 1319.5,1971" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1330,1971 1315,1978.2 1315,1963.8" fill="#3A4452"/>
<text x="820" y="1954.2" font-size="20" font-weight="400" fill="#2B3440">every entry returned zero</text>
<polyline points="1390,178 1440,178 1440,1932.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1440,1943 1432.8,1928 1447.2,1928" fill="#3A4452"/>
<text x="1456" y="237.2" font-size="20" font-weight="400" fill="#2B3440">first requeue or error</text>
<text x="40" y="2104.2" font-size="20" font-weight="400" fill="#55606E">A step label is the sub_reconciler value of the operator's metrics.</text>
<text x="40" y="2130.2" font-size="20" font-weight="400" fill="#55606E">The Keystone operator draws the same pattern with two parallel groups in service-reconciler-pipeline.</text>
</svg>
