<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1352" viewBox="0 0 1540 1352" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Event flow of the Glance operator">
<title>Event flow of the Glance operator</title>
<rect width="1540" height="1352" fill="#F6F5F1"/>
