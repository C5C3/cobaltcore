<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1240" viewBox="0 0 1540 1240" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Event flow of the Glance operator">
<title>Event flow of the Glance operator</title>
<rect width="1540" height="1240" fill="#F6F5F1"/>
<rect x="60" y="40" width="409" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="264.5" y="76.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">GlanceReconciler.Reconcile()</text>
<rect x="130" y="114" width="511" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="385.5" y="145.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileDelete() (deletionTimestamp set)</text>
<polyline points="90,138 130,138" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,196 188,196" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="203.2" font-size="20" font-weight="400" fill="#2B3440">MariaDB CRs still live</text>
<rect x="446" y="182" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="489" y="202.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="546" y="203.2" font-size="20" font-weight="700" fill="#2B3440">FinalizingDatabase</text>
<polyline points="160,228 188,228" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="235.2" font-size="20" font-weight="400" fill="#2B3440">MariaDB cleanup done</text>
<rect x="446" y="214" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="489" y="234.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="546" y="235.2" font-size="20" font-weight="700" fill="#2B3440">DatabaseFinalized</text>
<polyline points="160,162 160,228" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="258" width="272" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="266" y="289.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileBackends()</text>
<polyline points="90,282 130,282" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,340 188,340" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="347.2" font-size="20" font-weight="400" fill="#2B3440">per-backend fault (missing Secret / control char)</text>
<rect x="700" y="326" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="749" y="346.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="812" y="347.2" font-size="20" font-weight="700" fill="#2B3440">GlanceBackendSkipped</text>
<polyline points="160,306 160,340" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="370" width="233" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="246.5" y="401.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileConfig()</text>
<polyline points="90,394 130,394" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,452 188,452" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="459.2" font-size="20" font-weight="400" fill="#2B3440">spec.extraConfig overrides operator-owned keys</text>
<rect x="696" y="438" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="745" y="458.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="808" y="459.2" font-size="20" font-weight="700" fill="#2B3440">ExtraConfigOwnedKeyOverride</text>
<text x="696" y="491.2" font-size="20" font-weight="400" fill="#55606E">gated on transition into ExtraConfigHealthy=False, Reason=OwnedKeysOverridden</text>
<polyline points="160,418 160,452" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="514" width="266" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="263" y="545.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileDatabase()</text>
<polyline points="90,538 130,538" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,596 188,596" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="603.2" font-size="20" font-weight="400" fill="#2B3440">db_sync fails</text>
<rect x="422" y="582" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="471" y="602.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="534" y="603.2" font-size="20" font-weight="700" fill="#2B3440">DBSyncFailed</text>
<polyline points="160,628 188,628" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="635.2" font-size="20" font-weight="400" fill="#2B3440">db_sync succeeds</text>
<rect x="422" y="614" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="465" y="634.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="522" y="635.2" font-size="20" font-weight="700" fill="#2B3440">DatabaseSynced</text>
<polyline points="160,660 188,660" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="667.2" font-size="20" font-weight="400" fill="#2B3440">Job-UID patch fails</text>
<rect x="422" y="646" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="471" y="666.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="534" y="667.2" font-size="20" font-weight="700" fill="#2B3440">DBSyncMetricEmissionDeferred</text>
<polyline points="160,692 188,692" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="699.2" font-size="20" font-weight="400" fill="#2B3440">release upgrade</text>
<rect x="422" y="678" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="465" y="698.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="522" y="699.2" font-size="20" font-weight="700" fill="#2B3440">UpgradeInitiated / ExpandComplete /</text>
<text x="522" y="731.2" font-size="20" font-weight="700" fill="#2B3440">MigrateComplete / UpgradeComplete /</text>
<text x="522" y="763.2" font-size="20" font-weight="700" fill="#2B3440">UpgradeAborted</text>
<rect x="422" y="774" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="471" y="794.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="534" y="795.2" font-size="20" font-weight="700" fill="#2B3440">VersionParseError / DowngradeNotSupported /</text>
<text x="534" y="827.2" font-size="20" font-weight="700" fill="#2B3440">UpgradePathInvalid / UpgradeTargetChanged /</text>
<text x="534" y="859.2" font-size="20" font-weight="700" fill="#2B3440">ExpandFailed / MigrateFailed / ContractFailed</text>
<polyline points="160,562 160,692" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="882" width="293" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="276.5" y="913.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileDeployment()</text>
<polyline points="90,906 130,906" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,964 188,964" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="971.2" font-size="20" font-weight="400" fill="#2B3440">rollout ready mid-upgrade</text>
<rect x="479" y="950" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="522" y="970.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="579" y="971.2" font-size="20" font-weight="700" fill="#2B3440">DeploymentRolloutComplete</text>
<polyline points="160,930 160,964" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="994" width="258" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="259" y="1025.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileDBPurge()</text>
<polyline points="90,1018 130,1018" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,1076 188,1076" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="1083.2" font-size="20" font-weight="400" fill="#2B3440">newest run failed</text>
<rect x="422" y="1062" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="471" y="1082.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="534" y="1083.2" font-size="20" font-weight="700" fill="#2B3440">DBPurgeJobFailed</text>
<polyline points="160,1108 188,1108" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="1115.2" font-size="20" font-weight="400" fill="#2B3440">Job-UID patch fails</text>
<rect x="422" y="1094" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="471" y="1114.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="534" y="1115.2" font-size="20" font-weight="700" fill="#2B3440">DBPurgeMetricEmissionDeferred</text>
<polyline points="160,1042 160,1108" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="90,96 90,1018" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="40" y="1183.2" font-size="20" font-weight="400" fill="#55606E">A filled chip is a Warning event, an outline chip a Normal event. A line with two chips emits one or the other.</text>
<text x="40" y="1209.2" font-size="20" font-weight="400" fill="#55606E">Every reason is described in the Event Reasons Reference of the page.</text>
</svg>
