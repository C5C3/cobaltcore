<text x="522" y="843.2" font-size="20" font-weight="700" fill="#2B3440">MigrateComplete / UpgradeComplete /</text>
<text x="522" y="875.2" font-size="20" font-weight="700" fill="#2B3440">UpgradeAborted</text>
