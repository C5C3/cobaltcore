<text x="40" y="1981.2" font-size="20" font-weight="400" fill="#55606E">{cp}: the ControlPlane. {ns}: the Nova namespace, by default also the namespace of the OVN central. {cluster}: the target cluster the pool, the chassis and the agent name.</text>
