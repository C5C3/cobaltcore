<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="780" viewBox="0 0 1808 780" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="One platform, many OpenStack clouds">
<title>One platform, many OpenStack clouds</title>
<rect width="1808" height="780" fill="#F6F5F1"/>
<text x="40" y="64.64" font-size="24" font-weight="700" fill="#55606E" letter-spacing="2">WHAT IT DOES</text>
<rect x="41.5" y="85.5" width="637" height="117" rx="14.5" fill="#E7EDF9" stroke="#2457C5" stroke-width="3"/>
<text x="68" y="136.8" font-size="30" font-weight="700" fill="#1D47A6">OpenStack clouds</text>
<text x="68" y="174.64" font-size="24" font-weight="400" fill="#2B3440">OpenStack API for users and tools</text>
<rect x="41.5" y="219.5" width="637" height="117" rx="14.5" fill="#1E6B40" stroke="#1E6B40" stroke-width="3"/>
<text x="68" y="270.8" font-size="30" font-weight="700" fill="#FBFAF7">CobaltCore</text>
<text x="68" y="308.64" font-size="24" font-weight="400" fill="#DCEFE3">Operates the OpenStack control planes</text>
<rect x="41.5" y="353.5" width="637" height="117" rx="14.5" fill="#EEEAF7" stroke="#5E43A8" stroke-width="3"/>
<text x="68" y="404.8" font-size="30" font-weight="700" fill="#4B3592">Kubernetes</text>
<text x="68" y="442.64" font-size="24" font-weight="400" fill="#2B3440">Clusters created and managed by Gardener</text>
<rect x="41.5" y="487.5" width="637" height="117" rx="14.5" fill="#E9ECEF" stroke="#7D8794" stroke-width="3"/>
<text x="68" y="538.8" font-size="30" font-weight="700" fill="#2B3440">Garden Linux</text>
<text x="68" y="576.64" font-size="24" font-weight="400" fill="#2B3440">Operating system on every node</text>
<rect x="41.5" y="621.5" width="637" height="117" rx="14.5" fill="#FBEFE3" stroke="#C9620F" stroke-width="3"/>
<text x="68" y="672.8" font-size="30" font-weight="700" fill="#A44E07">Bare metal</text>
<text x="68" y="710.64" font-size="24" font-weight="400" fill="#2B3440">Provisioned and managed by IronCore</text>
<rect x="734" y="40" width="2" height="700" fill="#D5D9DE"/>
<text x="784" y="64.64" font-size="24" font-weight="700" fill="#55606E" letter-spacing="2">WHY IT MATTERS</text>
<rect x="784" y="84" width="64" height="64" rx="32" fill="#E6F1EA"/>
<g transform="translate(800,100) scale(1.33)" fill="none" stroke="#1E6B40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g>
<text x="876" y="118.8" font-size="30" font-weight="700" fill="#17202B">Kubernetes-native OpenStack</text>
<text x="876" y="158.24" font-size="24" font-weight="400" fill="#55606E">Each control plane runs as a set of Kubernetes operators, one per OpenStack</text>
<text x="876" y="189.44" font-size="24" font-weight="400" fill="#55606E">service.</text>
<rect x="784" y="216" width="64" height="64" rx="32" fill="#E6F1EA"/>
<g transform="translate(800,232) scale(1.33)" fill="none" stroke="#1E6B40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></g>
<text x="876" y="250.8" font-size="30" font-weight="700" fill="#17202B">One resource per cloud</text>
<text x="876" y="290.24" font-size="24" font-weight="400" fill="#55606E">A single ControlPlane resource describes a complete control plane, and Flux keeps</text>
<text x="876" y="321.44" font-size="24" font-weight="400" fill="#55606E">it in sync from Git.</text>
<rect x="784" y="348" width="64" height="64" rx="32" fill="#E6F1EA"/>
<g transform="translate(800,364) scale(1.33)" fill="none" stroke="#1E6B40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></g>
<text x="876" y="382.8" font-size="30" font-weight="700" fill="#17202B">Grows with demand</text>
<text x="876" y="422.24" font-size="24" font-weight="400" fill="#55606E">Run many control planes from one operation plane and attach more compute,</text>
<text x="876" y="453.44" font-size="24" font-weight="400" fill="#55606E">storage and network clusters as needed.</text>
<rect x="784" y="480" width="64" height="64" rx="32" fill="#E6F1EA"/>
<g transform="translate(800,496) scale(1.33)" fill="none" stroke="#1E6B40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g>
<text x="876" y="514.8" font-size="30" font-weight="700" fill="#17202B">Day-2 operations built in</text>
<text x="876" y="554.24" font-size="24" font-weight="400" fill="#55606E">Upgrade workflows, key rotation, readiness status and observability come with the</text>
<text x="876" y="585.44" font-size="24" font-weight="400" fill="#55606E">platform.</text>
<rect x="784" y="612" width="64" height="64" rx="32" fill="#E6F1EA"/>
<g transform="translate(800,628) scale(1.33)" fill="none" stroke="#1E6B40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></g>
<text x="876" y="646.8" font-size="30" font-weight="700" fill="#17202B">Open building blocks</text>
<text x="876" y="686.24" font-size="24" font-weight="400" fill="#55606E">IronCore, Gardener, Garden Linux and OpenStack: open source from bare metal to</text>
<text x="876" y="717.44" font-size="24" font-weight="400" fill="#55606E">API.</text>
</svg>
