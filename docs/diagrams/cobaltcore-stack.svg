<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="818" viewBox="0 0 1640 818" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="One stack, five building blocks">
<title>One stack, five building blocks</title>
<rect width="1640" height="818" fill="#F6F5F1"/>
<rect x="40" y="40" width="220" height="130" rx="16" fill="#1D47A6"/>
