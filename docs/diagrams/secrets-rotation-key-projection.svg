<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="348" viewBox="0 0 1560 348" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="How a rotated key reaches the running pods without a rollout">
<title>How a rotated key reaches the running pods without a rollout</title>
<rect width="1560" height="348" fill="#F6F5F1"/>
<text x="40" y="66.36" font-size="26" font-weight="700" fill="#2B3440">In-place key rotation</text>
<text x="40" y="97.2" font-size="20" font-weight="400" fill="#55606E">no rollout: the pod template carries no hash of the key Secrets</text>
<rect x="60" y="116" width="369" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="244.5" y="151.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">The CronJob stages the keys</text>
<circle cx="76" cy="116" r="14" fill="#17202B"/>
<text x="76" y="121.76" font-size="16" font-weight="700" fill="#FDFCF9" text-anchor="middle">1</text>
<rect x="479" y="116" width="343" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="650.5" y="151.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">The operator commits them</text>
<circle cx="495" cy="116" r="14" fill="#17202B"/>
<text x="495" y="121.76" font-size="16" font-weight="700" fill="#FDFCF9" text-anchor="middle">2</text>
<polyline points="429,144 468.5,144" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="479,144 464,151.2 464,136.8" fill="#3A4452"/>
<rect x="872" y="116" width="427" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1085.5" y="151.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">The kubelet projects the new keys</text>
<circle cx="888" cy="116" r="14" fill="#17202B"/>
<text x="888" y="121.76" font-size="16" font-weight="700" fill="#FDFCF9" text-anchor="middle">3</text>
<polyline points="822,144 861.5,144" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="872,144 857,151.2 857,136.8" fill="#3A4452"/>
<polyline points="1299,144 1329,144 1329,192 30,192 30,240 49.5,240" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="60,240 45,247.2 45,232.8" fill="#3A4452"/>
<rect x="60" y="212" width="440" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="280" y="247.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">Running pods see the new key files</text>
<circle cx="76" cy="212" r="14" fill="#17202B"/>
<text x="76" y="217.76" font-size="16" font-weight="700" fill="#FDFCF9" text-anchor="middle">4</text>
</svg>
