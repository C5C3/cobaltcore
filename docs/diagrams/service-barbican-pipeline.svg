<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="1493" viewBox="0 0 1808 1493" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Sub-reconciler pipeline of the Barbican operator">
<title>Sub-reconciler pipeline of the Barbican operator</title>
<rect width="1808" height="1493" fill="#F6F5F1"/>
<rect x="100" y="40" width="1290" height="1179" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="119" y="79.36" font-size="26" font-weight="700" fill="#2B3440">Pipeline</text>
<text x="119" y="111.2" font-size="20" font-weight="400" fill="#55606E">one entry after another; the first that returns a requeue or an error ends the pass</text>
<circle cx="50" cy="178" r="10" fill="#17202B"/>
<polyline points="60,178 229.5,178" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="240,178 225,185.2 225,170.8" fill="#3A4452"/>
<rect x="240" y="150" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="186.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Secrets</text>
<text x="530" y="172.2" font-size="20" font-weight="400" fill="#55606E">sets SecretsReady</text>
<text x="530" y="198.2" font-size="20" font-weight="400" fill="#55606E">hands on authtokenDigest</text>
<polyline points="375,206 375,231.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,242 367.8,227 382.2,227" fill="#3A4452"/>
<rect x="240" y="242" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="278.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">DBConnectionSecret</text>
<text x="530" y="264.2" font-size="20" font-weight="400" fill="#55606E">reports through SecretsReady</text>
<text x="530" y="290.2" font-size="20" font-weight="400" fill="#55606E">hands on dsnDigest</text>
<polyline points="375,298 375,334.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,345 367.8,330 382.2,330" fill="#3A4452"/>
<rect x="240" y="345" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="381.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">SecretStores</text>
<text x="530" y="354.2" font-size="20" font-weight="400" fill="#55606E">sets SecretStoresReady</text>
<text x="530" y="380.2" font-size="20" font-weight="400" fill="#55606E">hands on the store projection</text>
<text x="530" y="406.2" font-size="20" font-weight="400" fill="#55606E">never ends the pass</text>
<polyline points="375,401 375,448.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,459 367.8,444 382.2,444" fill="#3A4452"/>
<rect x="240" y="459" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="495.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Config</text>
<text x="530" y="468.2" font-size="20" font-weight="400" fill="#55606E">reports through SecretsReady</text>
<text x="530" y="494.2" font-size="20" font-weight="400" fill="#55606E">reads the projection</text>
<text x="530" y="520.2" font-size="20" font-weight="400" fill="#55606E">hands on configSecretName</text>
<polyline points="375,515 375,551.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,562 367.8,547 382.2,547" fill="#3A4452"/>
<rect x="240" y="562" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="598.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">DBClean</text>
<text x="530" y="584.2" font-size="20" font-weight="400" fill="#55606E">sets DBCleanReady</text>
<text x="530" y="610.2" font-size="20" font-weight="400" fill="#55606E">reads configSecretName</text>
<polyline points="375,618 375,643.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,654 367.8,639 382.2,639" fill="#3A4452"/>
<rect x="240" y="654" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="690.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Database</text>
<text x="530" y="676.2" font-size="20" font-weight="400" fill="#55606E">sets DatabaseReady</text>
<text x="530" y="702.2" font-size="20" font-weight="400" fill="#55606E">reads configSecretName</text>
<polyline points="375,710 375,746.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,757 367.8,742 382.2,742" fill="#3A4452"/>
<rect x="240" y="757" width="270" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="375" y="793.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Deployment</text>
<text x="530" y="766.2" font-size="20" font-weight="400" fill="#55606E">sets DeploymentReady</text>
<text x="530" y="792.2" font-size="20" font-weight="400" fill="#55606E">reads the projection and the two digests</text>
<text x="530" y="818.2" font-size="20" font-weight="400" fill="#55606E">sets status.endpoint</text>
<polyline points="375,813 375,849.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="375,860 367.8,845 382.2,845" fill="#3A4452"/>
<rect x="120" y="860" width="840" height="335" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="139" y="899.36" font-size="26" font-weight="700" fill="#2B3440">Parallel group</text>
<text x="139" y="931.2" font-size="20" font-weight="400" fill="#55606E">every member starts; the shortest requeue is returned</text>
<rect x="140" y="953" width="210" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="245" y="989.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">HTTPRoute</text>
<text x="140" y="1036.2" font-size="20" font-weight="400" fill="#55606E">sets HTTPRouteReady</text>
<rect x="420" y="953" width="210" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="525" y="989.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">HealthCheck</text>
<text x="420" y="1036.2" font-size="20" font-weight="400" fill="#55606E">sets BarbicanAPIReady</text>
<rect x="700" y="953" width="210" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="805" y="989.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">HPA</text>
<text x="700" y="1036.2" font-size="20" font-weight="400" fill="#55606E">sets HPAReady</text>
<rect x="140" y="1087" width="210" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="245" y="1123.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">VPA</text>
<text x="140" y="1170.2" font-size="20" font-weight="400" fill="#55606E">sets VPAReady</text>
<rect x="420" y="1087" width="210" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="525" y="1123.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">NetworkPolicy</text>
<text x="420" y="1170.2" font-size="20" font-weight="400" fill="#55606E">sets NetworkPolicyReady</text>
<rect x="1330" y="1259" width="220" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1440" y="1295.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">updateStatus</text>
<text x="1330" y="1344.2" font-size="20" font-weight="400" fill="#55606E">aggregates Ready from the sub-conditions</text>
<text x="1330" y="1370.2" font-size="20" font-weight="400" fill="#55606E">writes the status only when it changed</text>
<polyline points="375,1195 375,1287 1319.5,1287" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1330,1287 1315,1294.2 1315,1279.8" fill="#3A4452"/>
<text x="820" y="1270.2" font-size="20" font-weight="400" fill="#2B3440">every entry returned zero</text>
<polyline points="1390,178 1440,178 1440,1248.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1440,1259 1432.8,1244 1447.2,1244" fill="#3A4452"/>
<text x="1456" y="237.2" font-size="20" font-weight="400" fill="#2B3440">first requeue or error</text>
<text x="40" y="1420.2" font-size="20" font-weight="400" fill="#55606E">A step label is the sub_reconciler value of the operator's metrics.</text>
<text x="40" y="1446.2" font-size="20" font-weight="400" fill="#55606E">The Keystone operator draws the same pattern with two parallel groups in service-reconciler-pipeline.</text>
</svg>
