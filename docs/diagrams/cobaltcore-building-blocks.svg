<polygon points="320,836 305,843.2 305,828.8" fill="#2F8A57"/>
<text x="584" y="820.24" font-size="24" font-weight="400" fill="#55606E">Horizon and Placement attach no backends. A new service brings an operator of its own and one more block in</text>
<text x="584" y="851.44" font-size="24" font-weight="400" fill="#55606E">spec.services; a service from outside registers with a KeystoneService.</text>
<rect x="40" y="932" width="1760" height="2" rx="0" fill="#D5D9DE"/>
<text x="40" y="983.36" font-size="26" font-weight="700" fill="#17202B">Attach</text>
<text x="40" y="1022.24" font-size="24" font-weight="400" fill="#55606E">Apply a CR that names the service, or add an entry</text>
<text x="40" y="1053.44" font-size="24" font-weight="400" fill="#55606E">to the ControlPlane. The service projects it into its</text>
<text x="40" y="1084.64" font-size="24" font-weight="400" fill="#55606E">config.</text>
<text x="640" y="983.36" font-size="26" font-weight="700" fill="#17202B">Detach</text>
<text x="640" y="1022.24" font-size="24" font-weight="400" fill="#55606E">Delete the CR, or drop the entry. The service</text>
<text x="640" y="1053.44" font-size="24" font-weight="400" fill="#55606E">renders its config without it.</text>
<text x="1240" y="983.36" font-size="26" font-weight="700" fill="#17202B">Scale</text>
<text x="1240" y="1022.24" font-size="24" font-weight="400" fill="#55606E">spec.sizing sets replicas and resources per</text>
<text x="1240" y="1053.44" font-size="24" font-weight="400" fill="#55606E">component and can autoscale the APIs. More pools,</text>
<text x="1240" y="1084.64" font-size="24" font-weight="400" fill="#55606E">backends and ControlPlanes add capacity.</text>
