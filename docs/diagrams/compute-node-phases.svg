<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="1142" viewBox="0 0 1808 1142" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Phases of a node in a NovaCompute pool">
<title>Phases of a node in a NovaCompute pool</title>
<rect width="1808" height="1142" fill="#F6F5F1"/>
<rect x="620" y="150" width="1100" height="296" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="639" y="189.36" font-size="26" font-weight="700" fill="#2B3440">Selected</text>
<text x="639" y="221.2" font-size="20" font-weight="400" fill="#55606E">the pod runs on the node</text>
<rect x="620" y="616" width="1100" height="296" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="639" y="655.36" font-size="26" font-weight="700" fill="#2B3440">Leaving</text>
<text x="639" y="687.2" font-size="20" font-weight="400" fill="#55606E">no longer selected</text>
<circle cx="160" cy="110" r="10" fill="#17202B"/>
<rect x="60" y="300" width="200" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="160" y="336.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Conflict</text>
<text x="60" y="383.2" font-size="20" font-weight="400" fill="#55606E">another pool of the same Nova holds the node</text>
<text x="60" y="409.2" font-size="20" font-weight="400" fill="#55606E">no pod of this pool runs there</text>
<rect x="700" y="300" width="200" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="800" y="336.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Pending</text>
<text x="700" y="383.2" font-size="20" font-weight="400" fill="#55606E">no compute service yet,</text>
<text x="700" y="409.2" font-size="20" font-weight="400" fill="#55606E">or its host is not mapped</text>
<rect x="1420" y="300" width="200" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1520" y="336.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Active</text>
<text x="1420" y="383.2" font-size="20" font-weight="400" fill="#55606E">service registered, host mapped</text>
<rect x="640" y="766" width="200" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="740" y="802.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Draining</text>
<text x="640" y="849.2" font-size="20" font-weight="400" fill="#55606E">the pod stays, the service is disabled,</text>
<text x="640" y="875.2" font-size="20" font-weight="400" fill="#55606E">Nova still counts servers</text>
<rect x="1360" y="766" width="200" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1460" y="802.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Releasing</text>
<text x="1360" y="849.2" font-size="20" font-weight="400" fill="#55606E">no server left; the pod is released,</text>
<text x="1360" y="875.2" font-size="20" font-weight="400" fill="#55606E">then the service is deleted</text>
<polyline points="170,110 885,110 885,289.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="885,300 877.8,285 892.2,285" fill="#3A4452"/>
<text x="522.5" y="69.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">the node matches spec.nodeSelector</text>
<text x="522.5" y="94.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">a person labels the node</text>
<polyline points="160,120 160,289.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="160,300 152.8,285 167.2,285" fill="#3A4452"/>
<text x="176" y="169.64" font-size="24" font-weight="400" fill="#2B3440">selected, but another pool holds it</text>
<text x="176" y="194.2" font-size="20" font-weight="400" fill="#55606E">the pool yields</text>
<polyline points="260,328 689.5,328" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="700,328 685,335.2 685,320.8" fill="#3A4452"/>
<text x="440" y="289.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">the other pool dropped its entry</text>
<text x="440" y="314.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">the pool</text>
<polyline points="900,316 1409.5,316" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1420,316 1405,323.2 1405,308.8" fill="#3A4452"/>
<text x="1160" y="277.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">service registered and host mapped</text>
<text x="1160" y="302.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">nova-compute and the host discovery of the pool</text>
<polyline points="1420,340 910.5,340" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="900,340 915,332.8 915,347.2" fill="#3A4452"/>
<text x="1160" y="369.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">the service is gone from Nova</text>
<text x="1160" y="394.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">hvo, or a person</text>
<polyline points="820,446 820,755.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="820,766 812.8,751 827.2,751" fill="#3A4452"/>
<text x="836" y="483.64" font-size="24" font-weight="400" fill="#2B3440">label removed, Node deleted, or pool deleted</text>
<text x="836" y="508.2" font-size="20" font-weight="400" fill="#55606E">a person; the pool disables the service once</text>
<polyline points="1380,446 1380,755.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1380,766 1372.8,751 1387.2,751" fill="#3A4452"/>
<text x="1364" y="551.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="end">another pool selects the node</text>
<text x="1364" y="576.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">a person relabels; nothing is disabled</text>
<polyline points="640,616 640,456.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="640,446 647.2,461 632.8,461" fill="#3A4452"/>
<text x="624" y="517.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="end">selected again</text>
<text x="624" y="542.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">a person; the service stays disabled</text>
<polyline points="840,780 1349.5,780" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1360,780 1345,787.2 1345,772.8" fill="#3A4452"/>
<text x="1100" y="739.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">Nova counts no server on the host</text>
<text x="1100" y="764.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">hvo or a person moves them; the pool polls every 30s</text>
<polyline points="1360,808 850.5,808" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="840,808 855,800.8 855,815.2" fill="#3A4452"/>
<text x="1344" y="851.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="end">Nova refuses the delete with 409</text>
<text x="1344" y="876.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">the pool</text>
<polyline points="1560,794 1700,794 1700,977.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1700,988 1692.8,973 1707.2,973" fill="#3A4452"/>
<text x="1744" y="1011.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">no entry in status.nodes</text>
<text x="1684" y="947.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="end">pod gone, service deleted</text>
<text x="1684" y="972.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">the pool; this cannot be undone</text>
<text x="40" y="1069.2" font-size="20" font-weight="400" fill="#55606E">The pool never moves a server, never enables a service and never times a drain out.</text>
<text x="40" y="1095.2" font-size="20" font-weight="400" fill="#55606E">hvo: openstack-hypervisor-operator. Two steps set the phase: the Nodes step from the Kubernetes side, the Services step from the Nova API.</text>
</svg>
