<text x="1020" y="1450.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">verify-service-images</text>
<text x="1020" y="1481.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">pulls the image from ghcr.io</text>
<text x="1020" y="1509.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">verify_{service}.sh, option catalog</text>
