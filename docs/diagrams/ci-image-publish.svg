<polygon points="780,1415 772.8,1400 787.2,1400" fill="#3A4452"/>
<polyline points="1278,1375 1278,1404.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1278,1415 1270.8,1400 1285.2,1400" fill="#3A4452"/>
<rect x="1528" y="756" width="240" height="180" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="1547" y="795.36" font-size="26" font-weight="700" fill="#2B3440">ghcr.io</text>
<polygon points="1566,839 1730,839 1746,861 1730,883 1566,883 1550,861" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="1648" y="869.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">{service}</text>
<text x="1648" y="908.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">pushed on a push</text>
<polyline points="1448,861 1539.5,861" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1550,861 1535,868.2 1535,853.8" fill="#3A4452"/>
<text x="40" y="1611.2" font-size="20" font-weight="400" fill="#55606E">A bold job key is a job of .github/workflows/build-images.yaml, a box inside its frame a step of that job. {service}: one image of the service matrix.</text>
<text x="40" y="1645.2" font-size="20" font-weight="400" fill="#55606E">No base image exists. A build reads nothing from ghcr.io; the Cachix cache cobaltcore serves store paths when it is reachable and fails no build when it is not.</text>
<text x="40" y="1679.2" font-size="20" font-weight="400" fill="#55606E">A manual run, workflow_dispatch, takes the push path. The workflow has no tag trigger.</text>
</svg>
