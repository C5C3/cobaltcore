<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="1489" viewBox="0 0 1808 1489" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Image publish pipeline: pull request and push">
<title>Image publish pipeline: pull request and push</title>
<rect width="1808" height="1489" fill="#F6F5F1"/>
<rect x="40" y="40" width="1728" height="229" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="59" y="79.36" font-size="26" font-weight="700" fill="#2B3440">Every run</text>
<text x="59" y="114.2" font-size="20" font-weight="400" fill="#55606E">the base images are built, pushed and merged on both paths</text>
<rect x="64" y="133" width="360" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="244" y="168.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">build-base-images</text>
<text x="244" y="199.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">python-base and venv-builder</text>
<text x="244" y="227.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">amd64 and arm64, pushed by digest</text>
<rect x="504" y="133" width="360" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="684" y="168.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">merge-base-images</text>
<text x="684" y="199.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">one manifest per image</text>
<text x="684" y="227.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">tags latest and the commit</text>
<rect x="944" y="133" width="360" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1124" y="197.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">verify-base-images</text>
<rect x="1384" y="133" width="360" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1564" y="182.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">generate-matrix</text>
<text x="1564" y="213.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">services, releases, platforms</text>
<polyline points="424,189 493.5,189" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="504,189 489,196.2 489,181.8" fill="#3A4452"/>
<polyline points="864,189 933.5,189" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="944,189 929,196.2 929,181.8" fill="#3A4452"/>
<polyline points="1304,189 1373.5,189" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1384,189 1369,196.2 1369,181.8" fill="#3A4452"/>
<rect x="40" y="329" width="480" height="994" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="59" y="368.36" font-size="26" font-weight="700" fill="#2B3440">Pull request</text>
<rect x="60" y="392" width="440" height="531" rx="13" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="79" y="431.36" font-size="26" font-weight="700" fill="#2B3440">build-service-images</text>
<rect x="80" y="455" width="400" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="280" y="490.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Build</text>
<text x="280" y="521.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">linux/amd64 only</text>
<text x="280" y="549.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">loaded into the local Docker daemon</text>
<rect x="80" y="595" width="400" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="280" y="630.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Scan the image</text>
<text x="280" y="661.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">Grype, no report upload</text>
<rect x="80" y="707" width="400" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="280" y="742.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Verify the image</text>
<text x="280" y="773.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">tests/container-images/verify_{service}.sh</text>
<rect x="80" y="819" width="400" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="280" y="854.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Verify option catalog</text>
<text x="280" y="885.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">the services with a catalog</text>
<rect x="140" y="963" width="280" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="280" y="998.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">test-service-images</text>
<text x="280" y="1029.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">the upstream unit tests</text>
<text x="59" y="1296.2" font-size="20" font-weight="400" fill="#55606E">The run ends here. No service image is pushed.</text>
<rect x="600" y="329" width="868" height="994" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="619" y="368.36" font-size="26" font-weight="700" fill="#2B3440">Push to main or stable/**, or a manual run</text>
<rect x="620" y="392" width="438" height="307" rx="13" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="639" y="431.36" font-size="26" font-weight="700" fill="#2B3440">build-service-images</text>
<rect x="640" y="455" width="398" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="839" y="490.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Build</text>
<text x="839" y="521.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">amd64 and arm64, each on its own runner</text>
<text x="839" y="549.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">pushed by digest</text>
<rect x="640" y="595" width="398" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="839" y="630.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Export digest</text>
<text x="839" y="661.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">one artifact per platform</text>
<rect x="640" y="739" width="280" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="780" y="774.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">test-service-images</text>
<text x="780" y="805.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">the upstream unit tests</text>
<rect x="1088" y="532" width="360" height="619" rx="13" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="1107" y="571.36" font-size="26" font-weight="700" fill="#2B3440">merge-service-images</text>
<rect x="1108" y="595" width="320" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1268" y="630.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Create and push manifest</text>
<text x="1268" y="661.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">with the tags of the Tag Schema</text>
<rect x="1108" y="707" width="320" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1268" y="742.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Generate SBOM</text>
<text x="1268" y="773.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">CycloneDX</text>
<rect x="1108" y="819" width="320" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1268" y="854.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Scan the SBOM</text>
<text x="1268" y="885.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">Grype, report to the Security tab</text>
<rect x="1108" y="931" width="320" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1268" y="963.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Attest SBOM</text>
<rect x="1108" y="1007" width="320" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1268" y="1039.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Attest build provenance</text>
<rect x="1108" y="1083" width="320" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1268" y="1115.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Sign with cosign</text>
<rect x="700" y="1191" width="640" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1020" y="1226.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">verify-service-images</text>
<text x="1020" y="1257.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">pulls the image from ghcr.io</text>
<text x="1020" y="1285.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">verify_{service}.sh, option catalog</text>
<rect x="1548" y="329" width="220" height="354" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="1567" y="368.36" font-size="26" font-weight="700" fill="#2B3440">ghcr.io</text>
<polygon points="1586,392 1730,392 1746,414 1730,436 1586,436 1570,414" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="1658" y="422.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">python-base</text>
<polygon points="1586,456 1730,456 1746,478 1730,500 1586,500 1570,478" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="1658" y="486.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">venv-builder</text>
