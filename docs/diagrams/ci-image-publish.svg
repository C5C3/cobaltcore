<text x="324" y="199.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">nix flake check: the Nix lint</text>
<text x="324" y="227.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">and the checks of the flake</text>
<rect x="644" y="133" width="520" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="904" y="168.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">nix-lock-check</text>
<text x="904" y="199.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">hack/nix-lock.sh --check: the locks</text>
<text x="904" y="227.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">and the image pins match their inputs</text>
<rect x="1224" y="133" width="520" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1484" y="168.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">generate-matrix</text>
<text x="1484" y="199.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">services, releases, platforms</text>
