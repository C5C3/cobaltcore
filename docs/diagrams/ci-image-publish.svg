<text x="300" y="490.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Build</text>
<text x="300" y="521.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">nix build, linux/amd64 only</text>
<polyline points="300,539 300,556.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="300,567 292.8,552 307.2,552" fill="#3A4452"/>
