<text x="839" y="854.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Export digest</text>
<text x="839" y="885.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">one artifact per platform</text>
