<text x="300" y="1229.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">the upstream unit tests, as the Nix build</text>
<text x="300" y="1257.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">.#{service}-{release_}-test-run and its check</text>
<text x="59" y="1516.2" font-size="20" font-weight="400" fill="#55606E">The run ends here. No service image is pushed.</text>
<rect x="600" y="329" width="888" height="1226" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="619" y="368.36" font-size="26" font-weight="700" fill="#2B3440">Push to main or stable/**, or a manual run</text>
<rect x="620" y="392" width="438" height="531" rx="13" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="639" y="431.36" font-size="26" font-weight="700" fill="#2B3440">build-service-images</text>
