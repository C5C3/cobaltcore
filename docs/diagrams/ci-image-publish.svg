<text x="300" y="969.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">tests/container-images/verify_{service}.sh</text>
<polyline points="300,987 300,1004.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="300,1015 292.8,1000 307.2,1000" fill="#3A4452"/>
