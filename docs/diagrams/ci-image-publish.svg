<text x="839" y="742.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Push by digest</text>
<text x="839" y="773.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">skopeo</text>
<polyline points="839,791 839,808.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="839,819 831.8,804 846.2,804" fill="#3A4452"/>
