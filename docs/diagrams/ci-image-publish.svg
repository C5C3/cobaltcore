<text x="1646" y="306.2" font-size="20" font-weight="400" fill="#2B3440" text-anchor="end">pushed on every run</text>
<polyline points="1428,637 1559.5,637" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1570,637 1555,644.2 1555,629.8" fill="#3A4452"/>
<text x="1508" y="626.2" font-size="20" font-weight="400" fill="#2B3440" text-anchor="middle">pushed</text>
<text x="40" y="1374.2" font-size="20" font-weight="400" fill="#55606E">A bold job key is a job of .github/workflows/build-images.yaml, a box inside its frame a step of that job. {service}: one image of the service matrix.</text>
<text x="40" y="1408.2" font-size="20" font-weight="400" fill="#55606E">A service build reads the base images from the registry by digest. That is why a pull request pushes them too.</text>
<text x="40" y="1442.2" font-size="20" font-weight="400" fill="#55606E">A manual run, workflow_dispatch, takes the push path. The workflow has no tag trigger.</text>
