<text x="1278" y="1339.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Sign with cosign</text>
<polyline points="1038,861 1097.5,861" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1108,861 1093,868.2 1093,853.8" fill="#3A4452"/>
