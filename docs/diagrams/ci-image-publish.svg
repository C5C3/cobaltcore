<text x="839" y="521.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">nix build, amd64 and arm64,</text>
<text x="839" y="549.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">each on its own runner</text>
