<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="1726" viewBox="0 0 1808 1726" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Image publish pipeline: pull request and push">
<title>Image publish pipeline: pull request and push</title>
<rect width="1808" height="1726" fill="#F6F5F1"/>
<rect x="40" y="40" width="1728" height="229" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="59" y="79.36" font-size="26" font-weight="700" fill="#2B3440">Every run</text>
<text x="59" y="114.2" font-size="20" font-weight="400" fill="#55606E">build-service-images waits for all three, test-service-images for nix-lock-check and generate-matrix</text>
<rect x="64" y="133" width="520" height="112" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
