<text x="300" y="857.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">Grype, no report upload</text>
<polyline points="300,875 300,892.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="300,903 292.8,888 307.2,888" fill="#3A4452"/>
