<text x="1278" y="1078.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Scan the SBOM</text>
<text x="1278" y="1109.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">Grype, report to the Security tab</text>
<polyline points="1278,1127 1278,1144.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1278,1155 1270.8,1140 1285.2,1140" fill="#3A4452"/>
<rect x="1108" y="1155" width="340" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1278" y="1187.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Attest SBOM</text>
<polyline points="1278,1203 1278,1220.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1278,1231 1270.8,1216 1285.2,1216" fill="#3A4452"/>
<rect x="1108" y="1231" width="340" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="1278" y="1263.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Attest build provenance</text>
<polyline points="1278,1279 1278,1296.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1278,1307 1270.8,1292 1285.2,1292" fill="#3A4452"/>
