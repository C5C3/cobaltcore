<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="1458" viewBox="0 0 1808 1458" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Metadata path from an instance to the Nova metadata API">
<title>Metadata path from an instance to the Nova metadata API</title>
<rect width="1808" height="1458" fill="#F6F5F1"/>
<rect x="41.5" y="41.5" width="1725" height="586.5" rx="12" fill="#FDFCF9" stroke="#7D8794" stroke-width="3"/>
<rect x="68" y="60" width="84" height="36" rx="18" fill="#3A4452"/>
<text x="110" y="86.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">node</text>
<text x="166" y="86.64" font-size="24" font-weight="700" fill="#17202B">{node}</text>
<text x="258.01" y="85.2" font-size="20" font-weight="400" fill="#55606E">a hypervisor node</text>
<rect x="70" y="120" width="150" height="34" rx="17" fill="#FDFCF9" stroke="#C6343C" stroke-width="2"/>
<text x="145" y="145.64" font-size="24" font-weight="600" fill="#A3262E" text-anchor="middle">instance</text>
<text x="236" y="144.2" font-size="20" font-weight="400" fill="#55606E">calls http://169.254.169.254</text>
<rect x="70" y="250" width="180" height="34" rx="17" fill="#FDFCF9" stroke="#B38A00" stroke-width="2"/>
<text x="160" y="275.64" font-size="24" font-weight="600" fill="#6F5600" text-anchor="middle">Open vSwitch</text>
<text x="266" y="274.2" font-size="20" font-weight="400" fill="#55606E">OVN answers the address on the chassis</text>
<rect x="180" y="330" width="500" height="190" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="199" y="369.36" font-size="26" font-weight="700" fill="#2B3440">one network namespace per network</text>
<text x="199" y="403.2" font-size="20" font-weight="400" fill="#55606E">created by the agent</text>
<rect x="204" y="426" width="140" height="34" rx="17" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="274" y="451.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">haproxy</text>
<text x="204" y="487.2" font-size="20" font-weight="400" fill="#55606E">one per network, started by the agent</text>
<rect x="900" y="330" width="840" height="190" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="919" y="369.36" font-size="26" font-weight="700" fill="#2B3440">{agent}-metadata-agent</text>
<rect x="924" y="419" width="300" height="48" rx="17" fill="#FDFCF9" stroke="#2457C5" stroke-width="2"/>
<text x="1074" y="451.64" font-size="24" font-weight="600" fill="#1D47A6" text-anchor="middle">metadata-agent</text>
<text x="1240" y="437.2" font-size="20" font-weight="400" fill="#55606E">neutron-ovn-metadata-agent</text>
<text x="1240" y="463.2" font-size="20" font-weight="400" fill="#55606E">socket /var/lib/neutron/metadata_proxy</text>
<rect x="204" y="550" width="140" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="274" y="582.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">/run/netns</text>
<polyline points="912,520 912,574 344,574" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="110,154 110,239.5" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="110,250 102.8,235 117.2,235" fill="#2457C5"/>
<circle cx="110" cy="180" r="18" fill="#17202B"/>
<text x="110" y="187.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">1</text>
<text x="150" y="209.2" font-size="20" font-weight="400" fill="#2B3440">http to 169.254.169.254</text>
<polyline points="110,284 110,443 193.5,443" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="204,443 189,450.2 189,435.8" fill="#2457C5"/>
<circle cx="110" cy="310" r="18" fill="#17202B"/>
<text x="110" y="317.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">2</text>
<text x="150" y="313.2" font-size="20" font-weight="400" fill="#2B3440">into the namespace of its network</text>
<polyline points="344,443 913.5,443" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="924,443 909,450.2 909,435.8" fill="#2457C5"/>
<circle cx="370" cy="443" r="18" fill="#17202B"/>
<text x="370" y="450.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">3</text>
<text x="790" y="432.2" font-size="20" font-weight="400" fill="#2B3440" text-anchor="middle">socket metadata_proxy</text>
<rect x="40" y="688" width="1728" height="646" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="59" y="727.36" font-size="26" font-weight="700" fill="#2B3440">Namespace {ns} of the ControlPlane</text>
<rect x="1460" y="771" width="280" height="34" rx="17" fill="#FDFCF9" stroke="#B38A00" stroke-width="2"/>
<text x="1600" y="796.64" font-size="24" font-weight="600" fill="#6F5600" text-anchor="middle">Southbound database</text>
<polyline points="1104,467 1104,788 1449.5,788" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="1460,788 1445,795.2 1445,780.8" fill="#2457C5"/>
<circle cx="1104" cy="493" r="18" fill="#17202B"/>
<text x="1104" y="500.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">4</text>
<text x="1144" y="777.2" font-size="20" font-weight="400" fill="#2B3440">which port is asking</text>
<rect x="1430" y="934" width="290" height="48" rx="17" fill="#FDFCF9" stroke="#2457C5" stroke-width="2"/>
<text x="1575" y="966.64" font-size="24" font-weight="600" fill="#1D47A6" text-anchor="middle">{nova}-metadata</text>
<text x="1720" y="897.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">Service and Deployment, port 8775</text>
<text x="1720" y="923.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">[neutron] service_metadata_proxy = true</text>
<polyline points="1064,467 1064,958 1419.5,958" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="1430,958 1415,965.2 1415,950.8" fill="#2457C5"/>
<circle cx="1064" cy="493" r="18" fill="#17202B"/>
<text x="1064" y="500.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">5</text>
<text x="1104" y="947.2" font-size="20" font-weight="400" fill="#2B3440">http to port 8775, signed</text>
<text x="1080" y="985.2" font-size="20" font-weight="400" fill="#55606E">X-Instance-ID-Signature: an HMAC</text>
<text x="1080" y="1011.2" font-size="20" font-weight="400" fill="#55606E">keyed with the shared secret</text>
<rect x="1508" y="1068" width="236" height="48" rx="20" fill="#2B3440"/>
<text x="1626" y="1100.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">Database nova_api</text>
<polyline points="1690,982 1690,1057.5" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="1690,1068 1682.8,1053 1697.2,1053" fill="#2457C5"/>
<circle cx="1690" cy="1008" r="18" fill="#17202B"/>
<text x="1690" y="1015.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">6</text>
<text x="1676" y="1053.2" font-size="20" font-weight="400" fill="#2B3440" text-anchor="end">which instance it is</text>
<rect x="1360" y="1091" width="120" height="34" rx="17" fill="#FDFCF9" stroke="#7D8794" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1420" y="1116.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">Gateway</text>
<text x="1480" y="1152.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">services.nova.metadataGateway</text>
<polyline points="1034,467 1034,1108 1349.5,1108" fill="none" stroke="#2457C5" stroke-width="3" stroke-dasharray="9 6"/>
<polygon points="1360,1108 1345,1115.2 1345,1100.8" fill="#2457C5"/>
<text x="1050" y="1097.2" font-size="20" font-weight="400" fill="#2B3440">https, verified with the CA bundle</text>
<polyline points="1440,1091 1440,992.5" fill="none" stroke="#2457C5" stroke-width="3" stroke-dasharray="9 6"/>
<polygon points="1440,982 1447.2,997 1432.8,997" fill="#2457C5"/>
<path d="M64 1194 H378 L394 1210 V1242 H64 Z" fill="#F7E8F0" stroke="#B0387F" stroke-width="2"/>
<polyline points="378,1194 378,1210 394,1210" fill="none" stroke="#B0387F" stroke-width="2"/>
<text x="229" y="1226.64" font-size="24" font-weight="600" fill="#8A2B63" text-anchor="middle">{cp}-nova-metadata-secret</text>
<text x="64" y="1269.2" font-size="20" font-weight="400" fill="#55606E">key shared_secret</text>
<text x="64" y="1295.2" font-size="20" font-weight="400" fill="#55606E">generated once, by an ESO Password generator</text>
<path d="M64 864 H448 L464 880 V912 H64 Z" fill="#F7E8F0" stroke="#B0387F" stroke-width="2" stroke-dasharray="6 4"/>
<polyline points="448,864 448,880 464,880" fill="none" stroke="#B0387F" stroke-width="2"/>
<text x="264" y="896.64" font-size="24" font-weight="600" fill="#8A2B63" text-anchor="middle">{cp}-nova-metadata-agent-secret</text>
<text x="64" y="851.2" font-size="20" font-weight="400" fill="#55606E">the copy for an agent on a compute cluster</text>
<polyline points="164,1194 164,922.5" fill="none" stroke="#B0387F" stroke-width="3" stroke-dasharray="9 6"/>
<polygon points="164,912 171.2,927 156.8,927" fill="#B0387F"/>
<text x="180" y="1060.2" font-size="20" font-weight="400" fill="#8A2B63">copied by the c5c3-operator</text>
<polyline points="464,888 954,888 954,477.5" fill="none" stroke="#B0387F" stroke-width="3" stroke-dasharray="9 6"/>
<polygon points="954,467 961.2,482 946.8,482" fill="#B0387F"/>
<polyline points="394,1206 994,1206 994,477.5" fill="none" stroke="#B0387F" stroke-width="3"/>
<polygon points="994,467 1001.2,482 986.8,482" fill="#B0387F"/>
<text x="410" y="1197.2" font-size="20" font-weight="400" fill="#8A2B63">OS_DEFAULT__METADATA_PROXY_SHARED_SECRET</text>
<polyline points="394,1230 1494,1230 1494,992.5" fill="none" stroke="#B0387F" stroke-width="3"/>
<polygon points="1494,982 1501.2,997 1486.8,997" fill="#B0387F"/>
<text x="560" y="1255.2" font-size="20" font-weight="400" fill="#8A2B63">OS_NEUTRON__METADATA_PROXY_SHARED_SECRET</text>
<text x="40" y="1385.2" font-size="20" font-weight="400" fill="#55606E">{node}: a hypervisor node. {agent}: the NeutronMetadataAgent. {nova}: the Nova resource, {cp}-nova. {cp}, {ns}: the ControlPlane and its namespace.</text>
<text x="40" y="1411.2" font-size="20" font-weight="400" fill="#55606E">Solid: the agent runs on the cluster of its Nova. Dashed: what changes for an agent on a compute cluster.</text>
</svg>
