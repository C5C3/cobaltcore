<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="1172" viewBox="0 0 1808 1172" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Rotation of an ordered credential">
<title>Rotation of an ordered credential</title>
<rect width="1808" height="1172" fill="#F6F5F1"/>
<circle cx="700" cy="60" r="18" fill="#17202B"/>
<text x="700" y="67.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">1</text>
<text x="732" y="67.2" font-size="20" font-weight="400" fill="#55606E">the operator creates N+1; the Secret still holds N, which stays valid</text>
<circle cx="760" cy="108" r="18" fill="#17202B"/>
<text x="760" y="115.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">2</text>
<text x="792" y="115.2" font-size="20" font-weight="400" fill="#55606E">the backend holds N+1: status.credentialGeneration reads N+1,</text>
<text x="792" y="141.2" font-size="20" font-weight="400" fill="#55606E">the Secret is rewritten once the backup holds the new document,</text>
<text x="792" y="167.2" font-size="20" font-weight="400" fill="#55606E">previousCredentialID names N</text>
<circle cx="1240" cy="208" r="18" fill="#17202B"/>
<text x="1240" y="215.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">3</text>
<text x="1272" y="215.2" font-size="20" font-weight="400" fill="#55606E">previousCredentialDeleteAt has passed: N is deleted</text>
<rect x="140" y="250" width="1100" height="44" fill="#F7E8F0" stroke="#B0387F" stroke-width="2"/>
<text x="160" y="280.64" font-size="24" font-weight="600" fill="#8A2B63">generation N, delivered</text>
<rect x="700" y="314" width="1000" height="44" fill="#F7E8F0" stroke="#B0387F" stroke-width="2"/>
<text x="800" y="344.64" font-size="24" font-weight="600" fill="#8A2B63">generation N+1, delivered</text>
<polyline points="700,78 700,400" fill="none" stroke="#3A4452" stroke-width="2"/>
<polyline points="760,126 760,400" fill="none" stroke="#3A4452" stroke-width="2"/>
<polyline points="1240,226 1240,400" fill="none" stroke="#3A4452" stroke-width="2"/>
<polyline points="120,400 1720,400" fill="none" stroke="#3A4452" stroke-width="3"/>
<polyline points="140,390 140,410" fill="none" stroke="#3A4452" stroke-width="3"/>
<polyline points="700,390 700,410" fill="none" stroke="#3A4452" stroke-width="3"/>
<polyline points="1180,390 1180,410" fill="none" stroke="#3A4452" stroke-width="3"/>
<polyline points="1240,390 1240,410" fill="none" stroke="#3A4452" stroke-width="3"/>
<text x="140" y="439.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">mint of N</text>
<text x="700" y="439.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">mint of N + interval</text>
<text x="1240" y="439.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">switch + grace period</text>
<text x="760" y="465.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">the Secret switches</text>
<text x="1180" y="465.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">mint of N + interval + grace period</text>
<text x="1180" y="491.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">the expiry: the net under a deletion the operator fails to make</text>
<text x="40" y="551.2" font-size="20" font-weight="400" fill="#55606E">Both generations are valid between 2 and 3. A consumer reads the Secret again within the grace period, or mounts it and reconnects on change.</text>
<text x="40" y="577.2" font-size="20" font-weight="400" fill="#55606E">Triggers: the schedule (status.nextRotation), spec.credentialGeneration or spec.passwordGeneration above the status, an expired credential, a lost secret.</text>
<text x="40" y="603.2" font-size="20" font-weight="400" fill="#55606E">No rotation starts while a grace period runs.</text>
<text x="40" y="641.2" font-size="20" font-weight="400" fill="#55606E">KeystoneApplicationCredential: interval 720h, grace period 24h (defaults); N+1 is a new credential of the same user</text>
<text x="40" y="667.2" font-size="20" font-weight="400" fill="#55606E">RabbitMQVhost: interval 720h, grace period 24h (defaults); N+1 is a new broker user {vhost}-v{N+1}</text>
<rect x="40" y="700" width="1728" height="348" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="59" y="739.36" font-size="26" font-weight="700" fill="#2B3440">The two kinds that rotate differently</text>
<rect x="64" y="762" width="190" height="48" rx="20" fill="#1E6B40"/>
<text x="159" y="794.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">KeystoneUser</text>
<text x="64" y="841.2" font-size="20" font-weight="400" fill="#55606E">interval 720h, no grace period (default)</text>
<text x="64" y="877.2" font-size="20" font-weight="400" fill="#55606E">the password of the same user is replaced, on the schedule</text>
<text x="64" y="903.2" font-size="20" font-weight="400" fill="#55606E">or when spec.passwordGeneration is raised</text>
<text x="64" y="929.2" font-size="20" font-weight="400" fill="#55606E">the old password stops when Keystone applies the new one</text>
<text x="64" y="965.2" font-size="20" font-weight="400" fill="#55606E">the Secret is rewritten after the backup;</text>
<text x="64" y="991.2" font-size="20" font-weight="400" fill="#55606E">a consumer reads it again or reconnects</text>
<text x="64" y="1017.2" font-size="20" font-weight="400" fill="#55606E">status.lastPasswordRotation, status.nextPasswordRotation</text>
<rect x="916" y="762" width="232" height="48" rx="20" fill="#1E6B40"/>
<text x="1032" y="794.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">MariaDBDatabase</text>
<text x="916" y="841.2" font-size="20" font-weight="400" fill="#55606E">ESO draws a new user from the OpenBao lease, the Secret follows</text>
<text x="916" y="877.2" font-size="20" font-weight="400" fill="#55606E">the cadence is the lease's, not a field of the order</text>
<text x="916" y="913.2" font-size="20" font-weight="400" fill="#55606E">the database credentials figure shows the refresh and the two TTLs</text>
<text x="40" y="1099.2" font-size="20" font-weight="400" fill="#55606E">Status fields: credentialGeneration or passwordGeneration, lastRotation, nextRotation,</text>
<text x="40" y="1125.2" font-size="20" font-weight="400" fill="#55606E">previousCredentialID or previousPasswordGeneration, previousCredentialDeleteAt or previousPasswordDeleteAt.</text>
</svg>
