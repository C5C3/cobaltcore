<text x="235" y="762.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">openbao-tenant-store</text>
<text x="102" y="805.2" font-size="20" font-weight="400" fill="#55606E">SecretStore</text>
