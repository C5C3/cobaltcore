<text x="1014" y="190.64" font-size="24" font-weight="700" fill="#2B3440">{ns-3}</text>
<rect x="1308" y="150" width="442" height="1136" rx="12" fill="#F6F5F1" stroke="#7D8794" stroke-width="2"/>
