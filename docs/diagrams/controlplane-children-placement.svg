<text x="1485" y="962.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">ConfigMaps</text>
<rect x="1352" y="1000" width="266" height="48" rx="17" fill="#FDFCF9" stroke="#2457C5" stroke-width="2"/>
<text x="1485" y="1032.64" font-size="24" font-weight="600" fill="#1D47A6" text-anchor="middle">workloads</text>
<text x="1352" y="1075.2" font-size="20" font-weight="400" fill="#55606E">Deployment, Service, HTTPRoute</text>
<text x="1326" y="1131.2" font-size="20" font-weight="400" fill="#55606E">the two labels plus</text>
<text x="1326" y="1157.2" font-size="20" font-weight="400" fill="#55606E">openstack.c5c3.io/owner-kind,</text>
<text x="1326" y="1183.2" font-size="20" font-weight="400" fill="#55606E">owner-name, owner-namespace</text>
<text x="1326" y="1209.2" font-size="20" font-weight="400" fill="#55606E">no owner reference</text>
<text x="1326" y="1235.2" font-size="20" font-weight="400" fill="#55606E">openstack.c5c3.io/remote-children</text>
<text x="1326" y="1261.2" font-size="20" font-weight="400" fill="#55606E">sweeps the children</text>
