<rect x="102" y="1000" width="266" height="48" rx="17" fill="#FDFCF9" stroke="#2457C5" stroke-width="2"/>
<text x="235" y="1032.64" font-size="24" font-weight="600" fill="#1D47A6" text-anchor="middle">workloads</text>
<text x="102" y="1075.2" font-size="20" font-weight="400" fill="#55606E">Deployment, Service, HTTPRoute</text>
<text x="76" y="1131.2" font-size="20" font-weight="400" fill="#55606E">owner reference:</text>
<text x="76" y="1157.2" font-size="20" font-weight="400" fill="#55606E">the garbage collector reaps the children</text>
