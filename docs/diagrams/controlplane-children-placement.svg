<text x="1352" y="189.2" font-size="20" font-weight="700" fill="#FBFAF7" text-anchor="middle">ns</text>
<text x="1392" y="190.64" font-size="24" font-weight="700" fill="#2B3440">{ns-3}</text>
<text x="76" y="227.2" font-size="20" font-weight="400" fill="#55606E">the ControlPlane namespace</text>
<text x="76" y="253.2" font-size="20" font-weight="400" fill="#55606E">a service without a namespace block</text>
<text x="554" y="227.2" font-size="20" font-weight="400" fill="#55606E">a dedicated service namespace</text>
<text x="554" y="253.2" font-size="20" font-weight="400" fill="#55606E">spec.services.{svc}.namespace</text>
<text x="554" y="279.2" font-size="20" font-weight="400" fill="#55606E">Managed lifecycle: annotation</text>
<text x="554" y="305.2" font-size="20" font-weight="400" fill="#55606E">c5c3.io/controlplane-uid</text>
<text x="948" y="227.2" font-size="20" font-weight="400" fill="#55606E">the namespace of</text>
<text x="948" y="253.2" font-size="20" font-weight="400" fill="#55606E">a placed service</text>
<text x="948" y="279.2" font-size="20" font-weight="400" fill="#55606E">namespace block and</text>
<text x="948" y="305.2" font-size="20" font-weight="400" fill="#55606E">targetClusterRef</text>
<text x="948" y="331.2" font-size="20" font-weight="400" fill="#55606E">Managed lifecycle: annotation</text>
<text x="948" y="357.2" font-size="20" font-weight="400" fill="#55606E">c5c3.io/controlplane-uid</text>
<text x="1326" y="227.2" font-size="20" font-weight="400" fill="#55606E">the same name on both clusters</text>
<text x="1326" y="253.2" font-size="20" font-weight="400" fill="#55606E">Managed lifecycle: annotation</text>
<text x="1326" y="279.2" font-size="20" font-weight="400" fill="#55606E">c5c3.io/controlplane-uid</text>
<rect x="102" y="280" width="266" height="48" rx="20" fill="#1E6B40"/>
<text x="235" y="312.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">ControlPlane {cp}</text>
<text x="102" y="355.2" font-size="20" font-weight="400" fill="#55606E">finalizer c5c3.io/orc-teardown</text>
<text x="102" y="381.2" font-size="20" font-weight="400" fill="#55606E">finalizer openstack.c5c3.io/remote-children,</text>
<text x="102" y="407.2" font-size="20" font-weight="400" fill="#55606E">once a service is placed on a target cluster</text>
<rect x="102" y="432" width="266" height="48" rx="20" fill="#1E6B40"/>
<text x="235" y="464.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">K-ORC resources</text>
<text x="102" y="507.2" font-size="20" font-weight="400" fill="#55606E">stay here for every service</text>
<rect x="102" y="540" width="266" height="48" rx="20" fill="#1D47A6"/>
<text x="235" y="572.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">service CR {cp}-{svc}</text>
