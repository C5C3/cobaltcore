<text x="554" y="1157.2" font-size="20" font-weight="400" fill="#55606E">c5c3.io/controlplane-namespace</text>
<text x="554" y="1183.2" font-size="20" font-weight="400" fill="#55606E">c5c3.io/orc-teardown</text>
<text x="554" y="1209.2" font-size="20" font-weight="400" fill="#55606E">deletes the children</text>
<rect x="948" y="540" width="266" height="48" rx="20" fill="#1D47A6"/>
<text x="1081" y="572.64" font-size="24" font-weight="700" fill="#FBFAF7" text-anchor="middle">service CR {cp}-{svc}</text>
<text x="948" y="615.2" font-size="20" font-weight="400" fill="#55606E">the CR, its status and</text>
<text x="948" y="641.2" font-size="20" font-weight="400" fill="#55606E">its finalizers stay here</text>
