<text x="40" y="1351.2" font-size="20" font-weight="400" fill="#55606E">{cp}: the ControlPlane name. {ns}: its namespace. {ns-2}, {ns-3}: namespaces a service block names. {svc}: one of the eight services. {cluster}: a registered target cluster.</text>
<text x="40" y="1377.2" font-size="20" font-weight="400" fill="#55606E">MariaDB, Memcached and the secret store exist once per namespace that hosts a service.</text>
