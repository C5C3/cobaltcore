<rect x="940" y="1093" width="504" height="44" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<path d="M980.32 1093 V1137 M1403.68 1093 V1137" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="1192" y="1123.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">Job {service}-tempest-flavor-seed</text>
<text x="940" y="1162.2" font-size="20" font-weight="400" fill="#55606E">the flavors m1.nano and m1.micro</text>
<rect x="940" y="1179" width="504" height="44" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<path d="M980.32 1179 V1223 M1403.68 1179 V1223" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="1192" y="1209.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">Job barbican-tempest-policy-check</text>
