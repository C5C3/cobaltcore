<text x="646" y="670.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">Tempest container</text>
<text x="516" y="709.2" font-size="20" font-weight="400" fill="#55606E">docker run --network host</text>
<text x="516" y="737.2" font-size="20" font-weight="400" fill="#55606E">image tempest:{release}</text>
<rect x="64" y="640" width="300" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="214" y="672.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">_output/tempest/config</text>
<text x="64" y="713.2" font-size="20" font-weight="400" fill="#55606E">tempest.conf, the test lists, run-tests.sh</text>
<rect x="64" y="760" width="220" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="174" y="792.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">_output/tempest</text>
<text x="64" y="833.2" font-size="20" font-weight="400" fill="#55606E">the JUnit report, the logs of the forwards</text>
