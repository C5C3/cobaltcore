<polyline points="916,210 374.5,210" fill="none" stroke="#B0387F" stroke-width="3"/>
<polygon points="364,210 379,202.8 379,217.2" fill="#B0387F"/>
<text x="500" y="195.2" font-size="20" font-weight="400" fill="#2B3440" text-anchor="middle">kubectl get secret</text>
<polyline points="364,250 560,250 560,279.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="560,290 552.8,275 567.2,275" fill="#3A4452"/>
<text x="572" y="275.2" font-size="20" font-weight="400" fill="#2B3440">starts</text>
<polyline points="100,270 100,590 560,590 560,629.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="560,640 552.8,625 567.2,625" fill="#3A4452"/>
<text x="116" y="575.2" font-size="20" font-weight="400" fill="#2B3440">starts it once every port answers</text>
<polyline points="700,640 700,435.5" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="700,425 707.2,440 692.8,440" fill="#2457C5"/>
<text x="688" y="485.2" font-size="20" font-weight="400" fill="#2B3440" text-anchor="end">http to the name of a Service</text>
<text x="688" y="511.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="end">--add-host points both DNS names at 127.0.0.1</text>
<polyline points="364,652 516,652" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="380" y="641.2" font-size="20" font-weight="400" fill="#2B3440">/etc/tempest</text>
<polyline points="284,784 470,784 470,674 516,674" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="300" y="773.2" font-size="20" font-weight="400" fill="#2B3440">/output</text>
<polyline points="776,320 1229.5,320" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="1240,320 1225,327.2 1225,312.8" fill="#2457C5"/>
<text x="920" y="309.2" font-size="20" font-weight="400" fill="#2B3440">every job</text>
<polyline points="776,410 1229.5,410" fill="none" stroke="#2457C5" stroke-width="3" stroke-dasharray="9 6"/>
<polygon points="1240,410 1225,417.2 1225,402.8" fill="#2457C5"/>
<text x="920" y="399.2" font-size="20" font-weight="400" fill="#2B3440">one forward per further Service</text>
<polyline points="1700,820 1700,320 1510.5,320" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="1500,320 1515,312.8 1515,327.2" fill="#2457C5"/>
<text x="1688" y="798.2" font-size="20" font-weight="400" fill="#2B3440" text-anchor="end">http to the cluster DNS names</text>
<text x="40" y="1374.2" font-size="20" font-weight="400" fill="#55606E">{keystone}, {glance} and so on: the service resource of that kind, which names its Service. {service}: the service under test. {release}: its release.</text>
<text x="40" y="1408.2" font-size="20" font-weight="400" fill="#55606E">A forward binds to localhost and stays with one pod of its Service. No hop uses TLS, and none passes the Gateway.</text>
<text x="40" y="1442.2" font-size="20" font-weight="400" fill="#55606E">A dashed part exists where the job deploys that service. A keystone job forwards port 5000 only and runs no seed Job.</text>
</svg>
