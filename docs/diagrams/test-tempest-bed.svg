<text x="59" y="114.2" font-size="20" font-weight="400" fill="#55606E">the self-hosted runner of one tempest job</text>
<rect x="64" y="186" width="300" height="84" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
