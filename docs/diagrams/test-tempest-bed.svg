<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="1489" viewBox="0 0 1808 1489" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Test bed of a Tempest job">
<title>Test bed of a Tempest job</title>
<rect width="1808" height="1489" fill="#F6F5F1"/>
<rect x="40" y="40" width="760" height="824" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
