<path d="M980.32 921 V965 M1403.68 921 V965" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="1192" y="951.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">Job {service}-tempest-catalog-setup</text>
