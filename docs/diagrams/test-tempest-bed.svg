<text x="365" y="329.36" font-size="26" font-weight="700" fill="#2B3440">kubectl port-forward</text>
<text x="365" y="364.2" font-size="20" font-weight="400" fill="#55606E">one process per Service, bound to localhost</text>
<text x="365" y="392.2" font-size="20" font-weight="400" fill="#55606E">the port of the Service on both sides</text>
