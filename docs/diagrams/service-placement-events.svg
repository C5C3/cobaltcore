<text x="628" y="346.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="691" y="347.2" font-size="20" font-weight="700" fill="#2B3440">DatabaseMaxScaleBypassed</text>
<polyline points="160,306 160,340" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="370" width="233" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="246.5" y="401.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileConfig()</text>
<polyline points="90,394 130,394" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,452 188,452" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="459.2" font-size="20" font-weight="400" fill="#2B3440">spec.extraConfig overrides operator-owned keys</text>
<rect x="696" y="438" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="745" y="458.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="808" y="459.2" font-size="20" font-weight="700" fill="#2B3440">ExtraConfigOwnedKeyOverride</text>
<text x="696" y="491.2" font-size="20" font-weight="400" fill="#55606E">gated on transition into ExtraConfigHealthy=False, Reason=OwnedKeysOverridden</text>
<polyline points="160,418 160,452" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="514" width="266" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="263" y="545.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileDatabase()</text>
<polyline points="90,538 130,538" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,596 188,596" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="603.2" font-size="20" font-weight="400" fill="#2B3440">tag/release mismatch</text>
<text x="442" y="603.2" font-size="20" font-weight="400" fill="#55606E">condition only, no event</text>
<text x="442" y="635.2" font-size="20" font-weight="400" fill="#55606E">condition only, no event</text>
<polyline points="160,660 188,660" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="667.2" font-size="20" font-weight="400" fill="#2B3440">release gate refuses</text>
<rect x="442" y="646" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="491" y="666.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="554" y="667.2" font-size="20" font-weight="700" fill="#2B3440">VersionParseError / DowngradeNotSupported /</text>
<text x="554" y="699.2" font-size="20" font-weight="700" fill="#2B3440">UpgradePathInvalid / ImageReleaseMismatch</text>
<polyline points="160,724 188,724" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="731.2" font-size="20" font-weight="400" fill="#2B3440">db_sync fails</text>
<rect x="442" y="710" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="491" y="730.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="554" y="731.2" font-size="20" font-weight="700" fill="#2B3440">DBSyncFailed</text>
<polyline points="160,756 188,756" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="763.2" font-size="20" font-weight="400" fill="#2B3440">db_sync succeeds</text>
<rect x="442" y="742" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="485" y="762.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="542" y="763.2" font-size="20" font-weight="700" fill="#2B3440">DatabaseSynced</text>
<polyline points="160,788 188,788" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="795.2" font-size="20" font-weight="400" fill="#2B3440">Job-UID patch fails</text>
<rect x="442" y="774" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="491" y="794.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="554" y="795.2" font-size="20" font-weight="700" fill="#2B3440">DBSyncMetricEmissionDeferred</text>
<polyline points="160,562 160,788" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="90,96 90,538" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="40" y="863.2" font-size="20" font-weight="400" fill="#55606E">A filled chip is a Warning event, an outline chip a Normal event. A line with two chips emits one or the other.</text>
<text x="40" y="889.2" font-size="20" font-weight="400" fill="#55606E">Every reason is described in the Event Reasons Reference of the page.</text>
</svg>
