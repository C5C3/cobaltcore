<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="920" viewBox="0 0 1540 920" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Event flow of the Placement operator">
<title>Event flow of the Placement operator</title>
<rect width="1540" height="920" fill="#F6F5F1"/>
<rect x="60" y="40" width="452" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
