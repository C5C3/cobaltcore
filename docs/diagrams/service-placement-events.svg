<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="808" viewBox="0 0 1540 808" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Event flow of the Placement operator">
<title>Event flow of the Placement operator</title>
<rect width="1540" height="808" fill="#F6F5F1"/>
<rect x="60" y="40" width="452" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="286" y="76.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">PlacementReconciler.Reconcile()</text>
<rect x="130" y="114" width="511" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="385.5" y="145.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileDelete() (deletionTimestamp set)</text>
<polyline points="90,138 130,138" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,196 188,196" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="203.2" font-size="20" font-weight="400" fill="#2B3440">MariaDB CRs still live</text>
<rect x="446" y="182" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="489" y="202.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="546" y="203.2" font-size="20" font-weight="700" fill="#2B3440">FinalizingDatabase</text>
<polyline points="160,228 188,228" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="235.2" font-size="20" font-weight="400" fill="#2B3440">MariaDB cleanup done</text>
<rect x="446" y="214" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="489" y="234.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="546" y="235.2" font-size="20" font-weight="700" fill="#2B3440">DatabaseFinalized</text>
<polyline points="160,162 160,228" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="258" width="233" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="246.5" y="289.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileConfig()</text>
<polyline points="90,282 130,282" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,340 188,340" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="347.2" font-size="20" font-weight="400" fill="#2B3440">spec.extraConfig overrides operator-owned keys</text>
<rect x="696" y="326" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="745" y="346.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="808" y="347.2" font-size="20" font-weight="700" fill="#2B3440">ExtraConfigOwnedKeyOverride</text>
<text x="696" y="379.2" font-size="20" font-weight="400" fill="#55606E">gated on transition into ExtraConfigHealthy=False, Reason=OwnedKeysOverridden</text>
<polyline points="160,306 160,340" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="130" y="402" width="266" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="263" y="433.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileDatabase()</text>
<polyline points="90,426 130,426" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="160,484 188,484" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="491.2" font-size="20" font-weight="400" fill="#2B3440">tag/release mismatch</text>
<text x="442" y="491.2" font-size="20" font-weight="400" fill="#55606E">condition only, no event</text>
<text x="442" y="523.2" font-size="20" font-weight="400" fill="#55606E">condition only, no event</text>
<polyline points="160,548 188,548" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="555.2" font-size="20" font-weight="400" fill="#2B3440">release gate refuses</text>
<rect x="442" y="534" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="491" y="554.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="554" y="555.2" font-size="20" font-weight="700" fill="#2B3440">VersionParseError / DowngradeNotSupported /</text>
<text x="554" y="587.2" font-size="20" font-weight="700" fill="#2B3440">UpgradePathInvalid / ImageReleaseMismatch</text>
<polyline points="160,612 188,612" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="619.2" font-size="20" font-weight="400" fill="#2B3440">db_sync fails</text>
<rect x="442" y="598" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="491" y="618.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="554" y="619.2" font-size="20" font-weight="700" fill="#2B3440">DBSyncFailed</text>
<polyline points="160,644 188,644" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="651.2" font-size="20" font-weight="400" fill="#2B3440">db_sync succeeds</text>
<rect x="442" y="630" width="86" height="28" rx="25" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="485" y="650.48" font-size="18" font-weight="700" fill="#2B3440" text-anchor="middle">Normal</text>
<text x="542" y="651.2" font-size="20" font-weight="700" fill="#2B3440">DatabaseSynced</text>
<polyline points="160,676 188,676" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="200" y="683.2" font-size="20" font-weight="400" fill="#2B3440">Job-UID patch fails</text>
<rect x="442" y="662" width="98" height="28" rx="25" fill="#2B3440"/>
<text x="491" y="682.48" font-size="18" font-weight="700" fill="#FBFAF7" text-anchor="middle">Warning</text>
<text x="554" y="683.2" font-size="20" font-weight="700" fill="#2B3440">DBSyncMetricEmissionDeferred</text>
<polyline points="160,450 160,676" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="90,96 90,426" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="40" y="751.2" font-size="20" font-weight="400" fill="#55606E">A filled chip is a Warning event, an outline chip a Normal event. A line with two chips emits one or the other.</text>
<text x="40" y="777.2" font-size="20" font-weight="400" fill="#55606E">Every reason is described in the Event Reasons Reference of the page.</text>
</svg>
