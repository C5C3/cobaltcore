<text x="1468" y="735.36" font-size="26" font-weight="700" fill="#6F5600">Network</text>
<g transform="translate(1640,706) scale(0.5357)"><circle cx="28" cy="13" r="10" fill="none" stroke="#17202B" stroke-width="4.67"/><path d="M28 23 L28 49 M10 34 L46 34 M28 49 L13 72 M28 49 L43 72" fill="none" stroke="#17202B" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1680" y="733.92" font-size="22" font-weight="400" fill="#55606E">team</text>
<text x="1444" y="800.2" font-size="20" font-weight="400" fill="#55606E">each run by a team of its own</text>
<polyline points="300,276 300,509.5" fill="none" stroke="#B0387F" stroke-width="3"/>
<polygon points="300,520 292.8,505 307.2,505" fill="#B0387F"/>
<text x="288" y="380.2" font-size="20" font-weight="400" fill="#8A2B63" text-anchor="end">compute contract</text>
<polyline points="440,520 440,286.5" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="440,276 447.2,291 432.8,291" fill="#2457C5"/>
<text x="452" y="366.2" font-size="20" font-weight="700" fill="#1D47A6">hvo calls the Nova API:</text>
<text x="452" y="394.2" font-size="20" font-weight="400" fill="#1D47A6">maintenance, eviction, aggregates</text>
<polyline points="900,520 900,286.5" fill="none" stroke="#B0387F" stroke-width="3"/>
<polygon points="900,276 907.2,291 892.8,291" fill="#B0387F"/>
<text x="912" y="380.2" font-size="20" font-weight="400" fill="#8A2B63">PushSecret</text>
<polyline points="1290,520 1290,286.5" fill="none" stroke="#2457C5" stroke-width="3"/>
<polygon points="1290,276 1297.2,291 1282.8,291" fill="#2457C5"/>
<text x="1302" y="366.2" font-size="20" font-weight="700" fill="#1D47A6">ovn-controller joins</text>
<text x="1302" y="394.2" font-size="20" font-weight="400" fill="#1D47A6">the Southbound database</text>
<rect x="40" y="852" width="1760" height="96" rx="12" fill="#FBEFE3" stroke="#C9620F" stroke-width="2"/>
<g transform="translate(64,880) scale(0.5357)"><circle cx="28" cy="13" r="10" fill="none" stroke="#17202B" stroke-width="4.67"/><path d="M28 23 L28 49 M10 34 L46 34 M28 49 L13 72 M28 49 L43 72" fill="none" stroke="#17202B" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="909.36" font-size="26" font-weight="700" fill="#17202B">Platform team</text>
<text x="330" y="909.64" font-size="24" font-weight="400" fill="#2B3440">bare metal with IronCore or metal-stack, and every Kubernetes cluster above with Gardener</text>
<rect x="40" y="988" width="1760" height="2" rx="0" fill="#D5D9DE"/>
<text x="40" y="1039.36" font-size="26" font-weight="700" fill="#17202B">Add a hypervisor</text>
<text x="40" y="1078.24" font-size="24" font-weight="400" fill="#55606E">The compute team labels a node. The pool registers</text>
<text x="40" y="1109.44" font-size="24" font-weight="400" fill="#55606E">it in Nova, and hvo adds it to the aggregate of its</text>
<text x="40" y="1140.64" font-size="24" font-weight="400" fill="#55606E">zone.</text>
<text x="640" y="1039.36" font-size="26" font-weight="700" fill="#17202B">Maintain a hypervisor</text>
<text x="640" y="1078.24" font-size="24" font-weight="400" fill="#55606E">The compute team sets spec.maintenance on the</text>
<text x="640" y="1109.44" font-size="24" font-weight="400" fill="#55606E">node's Hypervisor. hvo disables the host in Nova</text>
<text x="640" y="1140.64" font-size="24" font-weight="400" fill="#55606E">and live-migrates its servers.</text>
<text x="1240" y="1039.36" font-size="26" font-weight="700" fill="#17202B">Rotate a credential</text>
<text x="1240" y="1078.24" font-size="24" font-weight="400" fill="#55606E">The ControlPlane rewrites the compute contract on</text>
<text x="1240" y="1109.44" font-size="24" font-weight="400" fill="#55606E">every compute cluster in place. Nobody hands the</text>
<text x="1240" y="1140.64" font-size="24" font-weight="400" fill="#55606E">new values over.</text>
</svg>
