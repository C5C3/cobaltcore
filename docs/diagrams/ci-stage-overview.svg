<text x="40" y="1197.2" font-size="20" font-weight="400" fill="#55606E">A label is a job of .github/workflows/ci.yaml, under its key. A box holds the jobs of one stage, and a frame the stages of one event.</text>
<text x="40" y="1231.2" font-size="20" font-weight="400" fill="#55606E">An arrow says that a job of the stage at its tip needs a job of the stage at its tail. The job table on the page lists every needs entry.</text>
<text x="40" y="1265.2" font-size="20" font-weight="400" fill="#55606E">From the image build on, a job starts when the image build succeeded and none of the jobs it needs failed or was cancelled. A gate that was skipped holds nothing back.</text>
</svg>
