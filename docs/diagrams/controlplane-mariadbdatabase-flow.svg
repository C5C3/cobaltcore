<svg xmlns="http://www.w3.org/2000/svg" width="1373" height="924" viewBox="0 0 1373 924" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Reconciliation flow of the MariaDBDatabase controller">
<title>Reconciliation flow of the MariaDBDatabase controller</title>
<rect width="1373" height="924" fill="#F6F5F1"/>
<rect x="60" y="40" width="260" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="190" y="76.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Reconcile</text>
<polyline points="90,131 118,131" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="130" y="138.2" font-size="20" font-weight="400" fill="#2B3440">the order's cluster does not resolve</text>
<polyline points="499,131 522.5,131" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="533,131 518,138.2 518,123.8" fill="#3A4452"/>
<text x="545" y="138.2" font-size="20" font-weight="700" fill="#2B3440">log and end the pass</text>
<text x="775" y="138.2" font-size="20" font-weight="400" fill="#55606E">no requeue</text>
<polyline points="90,165 118,165" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="130" y="172.2" font-size="20" font-weight="400" fill="#2B3440">deleting?</text>
<polyline points="499,165 522.5,165" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="533,165 518,172.2 518,157.8" fill="#3A4452"/>
<text x="545" y="172.2" font-size="20" font-weight="700" fill="#2B3440">reconcileDelete</text>
<text x="722" y="172.2" font-size="20" font-weight="400" fill="#55606E">see Deletion and Teardown</text>
<rect x="130" y="194" width="224" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="242" y="225.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">reconcileNormal</text>
<polyline points="90,218 130,218" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="200" y="260" width="220" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="310" y="291.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">orderAdmission</text>
<polyline points="160,284 200,284" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="230,343 258,343" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="270" y="350.2" font-size="20" font-weight="400" fill="#2B3440">cluster name longer than 63</text>
<rect x="567" y="329" width="224" height="28" rx="25" fill="#FDFCF9" stroke="#17202B" stroke-width="2"/>
<text x="679" y="349.48" font-size="18" font-weight="700" fill="#17202B" text-anchor="middle">ClusterNameTooLong</text>
<text x="805" y="350.2" font-size="20" font-weight="400" fill="#55606E">no requeue</text>
<polyline points="230,377 258,377" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="270" y="384.2" font-size="20" font-weight="400" fill="#2B3440">ControlPlane read fails</text>
<rect x="567" y="363" width="232" height="28" rx="25" fill="#FDFCF9" stroke="#17202B" stroke-width="2"/>
<text x="683" y="383.48" font-size="18" font-weight="700" fill="#17202B" text-anchor="middle">ControlPlaneNotFound</text>
<text x="813" y="384.2" font-size="20" font-weight="400" fill="#55606E">10s; on a target cluster NamespaceNotAssigned, 1m</text>
<polyline points="230,411 258,411" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="270" y="418.2" font-size="20" font-weight="400" fill="#2B3440">no namespace assignment</text>
<rect x="567" y="397" width="249" height="28" rx="25" fill="#FDFCF9" stroke="#17202B" stroke-width="2"/>
<text x="691.5" y="417.48" font-size="18" font-weight="700" fill="#17202B" text-anchor="middle">NamespaceNotAssigned</text>
<text x="830" y="418.2" font-size="20" font-weight="400" fill="#55606E">1m, the freeze</text>
<polyline points="230,308 230,411" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="200" y="442" width="221" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="310.5" y="473.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">EnsureFinalizer</text>
<polyline points="160,466 200,466" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="437" y="473.2" font-size="20" font-weight="400" fill="#55606E">c5c3.io/mariadbdatabase-teardown</text>
<rect x="200" y="508" width="388" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="394" y="539.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">mariaDBDatabaseDynamicGate</text>
<polyline points="160,532 200,532" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="230,591 258,591" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="270" y="598.2" font-size="20" font-weight="400" fill="#2B3440">credentials mode is not Dynamic</text>
<rect x="615" y="577" width="319" height="28" rx="25" fill="#FDFCF9" stroke="#17202B" stroke-width="2"/>
<text x="774.5" y="597.48" font-size="18" font-weight="700" fill="#17202B" text-anchor="middle">DynamicCredentialsUnavailable</text>
<text x="948" y="598.2" font-size="20" font-weight="400" fill="#55606E">10m</text>
<polyline points="230,625 258,625" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="270" y="632.2" font-size="20" font-weight="400" fill="#2B3440">DBCredentialsReady not met</text>
<rect x="615" y="611" width="255" height="28" rx="25" fill="#FDFCF9" stroke="#17202B" stroke-width="2"/>
<text x="742.5" y="631.48" font-size="18" font-weight="700" fill="#17202B" text-anchor="middle">WaitingForDBCredentials</text>
<text x="884" y="632.2" font-size="20" font-weight="400" fill="#55606E">10s</text>
<polyline points="230,556 230,625" fill="none" stroke="#7D8794" stroke-width="2"/>
<rect x="200" y="656" width="251" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="325.5" y="687.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">provisionDatabase</text>
<polyline points="160,680 200,680" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="467" y="687.2" font-size="20" font-weight="400" fill="#55606E">instrumented: MariaDBDatabaseProvision</text>
<rect x="200" y="722" width="247" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="323.5" y="753.92" font-size="22" font-weight="700" fill="#2B3440" text-anchor="middle">deliverCredentials</text>
<polyline points="160,746 200,746" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="463" y="753.2" font-size="20" font-weight="400" fill="#55606E">instrumented: MariaDBDatabaseDelivery</text>
<polyline points="160,242 160,746" fill="none" stroke="#7D8794" stroke-width="2"/>
<polyline points="90,96 90,218" fill="none" stroke="#7D8794" stroke-width="2"/>
<text x="40" y="853.2" font-size="20" font-weight="400" fill="#55606E">A chip is the reason both sub-conditions carry when the pass ends there; the note is the requeue.</text>
<text x="40" y="879.2" font-size="20" font-weight="400" fill="#55606E">A bold name after an arrow is the function the pass continues in.</text>
</svg>
