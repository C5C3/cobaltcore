<text x="66" y="1413.2" font-size="20" font-weight="400" fill="#55606E">Controllers, UI and development sizing</text>
<text x="66" y="1441.2" font-size="20" font-weight="400" fill="#55606E">Composes Flux, operators, OpenBao and c5c3</text>
