<text x="40" y="1118.2" font-size="20" font-weight="400" fill="#55606E">An arrow runs from a directory to the overlay that lists it under resources. The overlay renders what its base renders and then patches it.</text>
<text x="40" y="1144.2" font-size="20" font-weight="400" fill="#55606E">Step n is a step of make deploy-infra. EXTERNAL_CLUSTER=true applies the lab column in place of the kind column, and EXTERNAL_OVERLAY names another root.</text>
</svg>
