<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="2360" viewBox="0 0 1808 2360" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="Deployment composition: canonical bases, kind and metal-stack">
<title>Deployment composition: canonical bases, kind and metal-stack</title>
<rect width="1808" height="2360" fill="#F6F5F1"/>
<text x="48" y="60.02" font-size="32" font-weight="700" fill="#2B3440">Deployment composition</text>
<text x="48" y="93.2" font-size="20" font-weight="400" fill="#55606E">Arrow: a resource directory points to the root that imports it. Composition does not imply readiness or apply order.</text>
<text x="48" y="155.58" font-size="28" font-weight="700" fill="#2B3440">Canonical bases</text>
<text x="48" y="187.2" font-size="20" font-weight="400" fill="#55606E">Every reusable manifest and bootstrap asset lives directly in its owning base. There are no compatibility aliases.</text>
<rect x="48" y="236" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="66" y="269.92" font-size="22" font-weight="700" fill="#2B3440">bases/operators</text>
<text x="66" y="305.2" font-size="20" font-weight="400" fill="#55606E">namespaces.yaml</text>
<text x="66" y="333.2" font-size="20" font-weight="400" fill="#55606E">sources/ and releases/</text>
<text x="66" y="361.2" font-size="20" font-weight="400" fill="#55606E">Protects staged namespaces from pruning</text>
<rect x="640" y="236" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="658" y="269.92" font-size="22" font-weight="700" fill="#2B3440">bases/flux</text>
<text x="658" y="305.2" font-size="20" font-weight="400" fill="#55606E">fluxinstance.yaml</text>
<text x="658" y="333.2" font-size="20" font-weight="400" fill="#55606E">Runtime installed before operator resources</text>
<text x="658" y="361.2" font-size="20" font-weight="400" fill="#55606E">No automatic Git synchronization</text>
<rect x="1232" y="236" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="1250" y="269.92" font-size="22" font-weight="700" fill="#2B3440">bases/controlplane-operator</text>
<text x="1250" y="305.2" font-size="20" font-weight="400" fill="#55606E">helmrelease.yaml</text>
<text x="1250" y="333.2" font-size="20" font-weight="400" fill="#55606E">Reconcile after operator/bootstrap gates</text>
<text x="1250" y="361.2" font-size="20" font-weight="400" fill="#55606E">ControlPlane instances belong to overlays</text>
<rect x="48" y="448" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="66" y="481.92" font-size="22" font-weight="700" fill="#2B3440">bases/tls</text>
<text x="66" y="517.2" font-size="20" font-weight="400" fill="#55606E">Certificate and ClusterIssuer manifests</text>
<text x="66" y="545.2" font-size="20" font-weight="400" fill="#55606E">Requires ready cert-manager</text>
<text x="66" y="573.2" font-size="20" font-weight="400" fill="#55606E">Precedes shared OpenBao installation</text>
<rect x="640" y="448" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="658" y="481.92" font-size="22" font-weight="700" fill="#2B3440">bases/shared-openbao</text>
<text x="658" y="517.2" font-size="20" font-weight="400" fill="#55606E">helmrelease.yaml</text>
<text x="658" y="545.2" font-size="20" font-weight="400" fill="#55606E">bootstrap/ scripts and policies/ HCL</text>
<text x="658" y="573.2" font-size="20" font-weight="400" fill="#55606E">Separate inputs retain their lifecycle gates</text>
<rect x="1232" y="448" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="1250" y="481.92" font-size="22" font-weight="700" fill="#2B3440">bases/eso-store</text>
<text x="1250" y="517.2" font-size="20" font-weight="400" fill="#55606E">clustersecretstore.yaml</text>
<text x="1250" y="545.2" font-size="20" font-weight="400" fill="#55606E">Requires initialized shared OpenBao</text>
<text x="1250" y="573.2" font-size="20" font-weight="400" fill="#55606E">Retains namespace grant boundaries</text>
<rect x="48" y="660" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="66" y="693.92" font-size="22" font-weight="700" fill="#2B3440">bases/infrastructure</text>
<text x="66" y="729.2" font-size="20" font-weight="400" fill="#55606E">Reference MariaDB, Memcached and Garage</text>
<text x="66" y="757.2" font-size="20" font-weight="400" fill="#55606E">Composes TLS and the shared ESO store</text>
<text x="66" y="785.2" font-size="20" font-weight="400" fill="#55606E">Requires controller CRDs</text>
<rect x="640" y="660" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="658" y="693.92" font-size="22" font-weight="700" fill="#2B3440">bases/target-cluster-access</text>
<text x="658" y="729.2" font-size="20" font-weight="400" fill="#55606E">Helm chart, templates and intentional CRD copies</text>
<text x="658" y="757.2" font-size="20" font-weight="400" fill="#55606E">make helm-package-target-cluster</text>
<text x="658" y="785.2" font-size="20" font-weight="400" fill="#55606E">make verify-crd-sync</text>
<rect x="1232" y="660" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="1250" y="693.92" font-size="22" font-weight="700" fill="#2B3440">deploy/examples</text>
<text x="1250" y="729.2" font-size="20" font-weight="400" fill="#55606E">base-customization: individual stage patches</text>
<text x="1250" y="757.2" font-size="20" font-weight="400" fill="#55606E">sizing-overlay: a staged composition</text>
<text x="1250" y="785.2" font-size="20" font-weight="400" fill="#55606E">Copy into the deployment repository</text>
<text x="48" y="919.58" font-size="28" font-weight="700" fill="#2B3440">Ownership and readiness</text>
<text x="48" y="951.2" font-size="20" font-weight="400" fill="#55606E">A directory import composes objects; it does not wait for dependencies or assign a second Flux owner.</text>
<rect x="48" y="1000" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="66" y="1033.92" font-size="22" font-weight="700" fill="#2B3440">Deployment repositories</text>
<text x="66" y="1069.2" font-size="20" font-weight="400" fill="#55606E">Select bases and one environment overlay</text>
<text x="66" y="1097.2" font-size="20" font-weight="400" fill="#55606E">Pin the revision and supply storage choices</text>
<text x="66" y="1125.2" font-size="20" font-weight="400" fill="#55606E">Keep one reconciler per resource identity</text>
<rect x="640" y="1000" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="658" y="1033.92" font-size="22" font-weight="700" fill="#2B3440">Development composition</text>
<text x="658" y="1069.2" font-size="20" font-weight="400" fill="#55606E">Flux + operators + OpenBao + c5c3</text>
<text x="658" y="1097.2" font-size="20" font-weight="400" fill="#55606E">Environment gateways and storage are separate</text>
<text x="658" y="1125.2" font-size="20" font-weight="400" fill="#55606E">Bootstrap gates remain in make deploy-infra</text>
<rect x="1232" y="1000" width="528" height="154" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="1250" y="1033.92" font-size="22" font-weight="700" fill="#2B3440">Path migration</text>
<text x="1250" y="1069.2" font-size="20" font-weight="400" fill="#55606E">Old flux-system/openbao/eso folders removed</text>
<text x="1250" y="1097.2" font-size="20" font-weight="400" fill="#55606E">Old GitOps aliases removed</text>
<text x="1250" y="1125.2" font-size="20" font-weight="400" fill="#55606E">Update external imports to canonical bases</text>
<text x="48" y="1247.58" font-size="28" font-weight="700" fill="#2B3440">Sibling environment overlays</text>
<text x="48" y="1279.2" font-size="20" font-weight="400" fill="#55606E">Each environment imports the same shared bases. Gateway, storage and host settings belong to its overlay.</text>
<text x="48" y="1325.64" font-size="24" font-weight="700" fill="#2B3440">Shared bases</text>
<text x="640" y="1325.64" font-size="24" font-weight="700" fill="#2B3440">deploy/overlays/kind</text>
<text x="1232" y="1325.64" font-size="24" font-weight="700" fill="#2B3440">deploy/overlays/metal-stack</text>
<rect x="48" y="1344" width="528" height="126" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
