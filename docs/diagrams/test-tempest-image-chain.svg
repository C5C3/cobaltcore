<rect x="80" y="460" width="640" height="250" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="99" y="499.36" font-size="26" font-weight="700" fill="#2B3440">build-images.yaml</text>
<text x="99" y="531.2" font-size="20" font-weight="400" fill="#55606E">builds, scans, signs and pushes to GHCR</text>
<rect x="100" y="550" width="240" height="40" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="220" y="577.2" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">generate-matrix</text>
<text x="355" y="576.48" font-size="18" font-weight="400" fill="#55606E">discovers the releases from releases/*/</text>
<rect x="100" y="600" width="240" height="40" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="220" y="627.2" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">build-tempest</text>
<text x="355" y="626.48" font-size="18" font-weight="400" fill="#55606E">per release and platform: amd64, arm64</text>
<rect x="100" y="650" width="240" height="40" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="220" y="677.2" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">merge-tempest-image</text>
<text x="355" y="676.48" font-size="18" font-weight="400" fill="#55606E">multi-arch manifest, SBOM, Grype, cosign</text>
<rect x="780" y="460" width="960" height="250" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="799" y="499.36" font-size="26" font-weight="700" fill="#2B3440">ci.yaml</text>
<text x="799" y="531.2" font-size="20" font-weight="400" fill="#55606E">builds the image and runs Tempest per service and release</text>
<rect x="800" y="550" width="240" height="40" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="920" y="577.2" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">build-e2e-images</text>
<text x="1055" y="576.48" font-size="18" font-weight="400" fill="#55606E">per release: hack/ci-nix-build-e2e-images.sh builds the image</text>
<rect x="800" y="600" width="240" height="40" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="920" y="627.2" font-size="20" font-weight="700" fill="#2B3440" text-anchor="middle">tempest (matrix)</text>
<text x="1055" y="626.48" font-size="18" font-weight="400" fill="#55606E">per leg: load the image, deploy the services, run Tempest, upload the JUnit</text>
<rect x="60" y="760" width="420" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="270" y="796.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">tests/tempest/&lt;config-dir&gt;/</text>
<text x="60" y="847.2" font-size="20" font-weight="400" fill="#55606E">tempest.conf: rendered with the localhost URI and the admin password</text>
<text x="60" y="873.2" font-size="20" font-weight="400" fill="#55606E">include-tests.txt: split into phases/phase-1-core.txt and phases/phase-2-plugin.txt</text>
<text x="60" y="899.2" font-size="20" font-weight="400" fill="#55606E">exclude-tests.txt: copied</text>
