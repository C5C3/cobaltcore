<polygon points="1260,930 1252.8,915 1267.2,915" fill="#3A4452"/>
<rect x="1080" y="930" width="360" height="56" rx="6" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="1260" y="966.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">tempest-results.xml</text>
<text x="1080" y="1017.2" font-size="20" font-weight="400" fill="#55606E">_output/tempest/, uploaded as the JUnit artifact</text>
