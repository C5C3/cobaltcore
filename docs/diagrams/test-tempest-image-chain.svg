<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="From the Tempest version pins to the JUnit report">
<title>From the Tempest version pins to the JUnit report</title>
<rect width="1800" height="1050" fill="#F6F5F1"/>
<rect x="60" y="60" width="420" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
