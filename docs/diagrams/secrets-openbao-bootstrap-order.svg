<svg xmlns="http://www.w3.org/2000/svg" width="1071" height="570" viewBox="0 0 1071 570" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="The order the five OpenBao bootstrap scripts run in">
<title>The order the five OpenBao bootstrap scripts run in</title>
<rect width="1071" height="570" fill="#F6F5F1"/>
<rect x="100" y="60" width="381" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="290.5" y="96.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">init-unseal.sh</text>
<circle cx="60" cy="88" r="16" fill="#17202B"/>
<text x="60" y="95.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">1</text>
<text x="501" y="95.2" font-size="20" font-weight="400" fill="#55606E">initializes the Shamir keys and unseals every replica</text>
<rect x="100" y="152" width="381" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="290.5" y="188.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">setup-secret-engines.sh</text>
<circle cx="60" cy="180" r="16" fill="#17202B"/>
<text x="60" y="187.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">2</text>
<polyline points="290.5,116 290.5,141.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="290.5,152 283.3,137 297.7,137" fill="#3A4452"/>
<text x="501" y="187.2" font-size="20" font-weight="400" fill="#55606E">enables the KV v2 and PKI engines</text>
<rect x="100" y="244" width="381" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="290.5" y="280.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">setup-auth.sh</text>
<circle cx="60" cy="272" r="16" fill="#17202B"/>
<text x="60" y="279.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">3</text>
<polyline points="290.5,208 290.5,233.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="290.5,244 283.3,229 297.7,229" fill="#3A4452"/>
<text x="501" y="279.2" font-size="20" font-weight="400" fill="#55606E">configures the Kubernetes auth method and AppRole</text>
<rect x="100" y="336" width="381" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="290.5" y="372.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">setup-policies.sh</text>
<circle cx="60" cy="364" r="16" fill="#17202B"/>
<text x="60" y="371.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">4</text>
<polyline points="290.5,300 290.5,325.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="290.5,336 283.3,321 297.7,321" fill="#3A4452"/>
<text x="501" y="371.2" font-size="20" font-weight="400" fill="#55606E">applies the 12 least-privilege HCL policies</text>
<rect x="100" y="428" width="381" height="56" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="290.5" y="464.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">write-bootstrap-secrets.sh</text>
<circle cx="60" cy="456" r="16" fill="#17202B"/>
<text x="60" y="463.2" font-size="20" font-weight="700" fill="#FDFCF9" text-anchor="middle">5</text>
<polyline points="290.5,392 290.5,417.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="290.5,428 283.3,413 297.7,413" fill="#3A4452"/>
<text x="501" y="463.2" font-size="20" font-weight="400" fill="#55606E">generates and seeds the initial passwords</text>
<text x="40" y="535.2" font-size="20" font-weight="400" fill="#55606E">Each script needs what the one before it wrote.</text>
</svg>
