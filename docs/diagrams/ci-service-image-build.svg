<svg xmlns="http://www.w3.org/2000/svg" width="1808" height="1870" viewBox="0 0 1808 1870" font-family="'IBM Plex Sans', Arial, Helvetica, sans-serif" role="img" aria-label="The build of a service image on the Nix path">
<title>The build of a service image on the Nix path</title>
<rect width="1808" height="1870" fill="#F6F5F1"/>
<text x="40" y="66.36" font-size="26" font-weight="700" fill="#2B3440">Repository</text>
<text x="40" y="95.2" font-size="20" font-weight="400" fill="#55606E">files of this checkout</text>
<text x="590" y="66.36" font-size="26" font-weight="700" fill="#2B3440">Before the build</text>
<text x="590" y="95.2" font-size="20" font-weight="400" fill="#55606E">make nix-lock on a developer machine or</text>
<text x="590" y="123.2" font-size="20" font-weight="400" fill="#55606E">a Renovate branch, never in the build job</text>
<rect x="590" y="150" width="520" height="620" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="614" y="189.36" font-size="26" font-weight="700" fill="#2B3440">hack/nix-lock.sh</text>
<rect x="614" y="220" width="472" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="850" y="252.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Resolve source ref</text>
<text x="614" y="293.2" font-size="20" font-weight="400" fill="#55606E">nix flake prefetch: the commit and the NAR hash</text>
<rect x="614" y="340" width="472" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="850" y="372.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Merge constraints</text>
<text x="614" y="413.2" font-size="20" font-weight="400" fill="#55606E">scripts/apply-constraint-overrides.sh on a copy</text>
<rect x="614" y="540" width="472" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="850" y="572.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">Add the base pins</text>
<text x="614" y="613.2" font-size="20" font-weight="400" fill="#55606E">by name alone where the constraints pin one</text>
<rect x="614" y="640" width="472" height="48" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="850" y="672.64" font-size="24" font-weight="700" fill="#2B3440" text-anchor="middle">uv lock</text>
<text x="614" y="713.2" font-size="20" font-weight="400" fill="#55606E">on pyproject.toml: the project, its extras and</text>
<text x="614" y="741.2" font-size="20" font-weight="400" fill="#55606E">pip packages, the base pins, the constraints</text>
<polyline points="1066,268 1066,329.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1066,340 1058.8,325 1073.2,325" fill="#3A4452"/>
<polyline points="1066,388 1066,529.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1066,540 1058.8,525 1073.2,525" fill="#3A4452"/>
<polyline points="1066,588 1066,629.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1066,640 1058.8,625 1073.2,625" fill="#3A4452"/>
<text x="590" y="807.2" font-size="20" font-weight="400" fill="#55606E">The lock is committed. nix-lock-check fails</text>
<text x="590" y="835.2" font-size="20" font-weight="400" fill="#55606E">a pull request whose locks lag the pins.</text>
<rect x="40" y="220" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="252.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">releases/{release}/source-refs.yaml</text>
<text x="40" y="293.2" font-size="20" font-weight="400" fill="#55606E">one git ref per service</text>
<rect x="40" y="340" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="372.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">releases/{release}/upper-constraints.txt</text>
<text x="40" y="413.2" font-size="20" font-weight="400" fill="#55606E">the pins of OpenStack requirements</text>
<rect x="40" y="440" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="472.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">overrides/{release}/constraints.txt</text>
<text x="40" y="513.2" font-size="20" font-weight="400" fill="#55606E">optional: pins to set or to drop</text>
<rect x="40" y="540" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="572.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">nix/base-requirements.txt</text>
<text x="40" y="613.2" font-size="20" font-weight="400" fill="#55606E">the release-independent pins of every lock</text>
<rect x="40" y="640" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="672.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">releases/{release}/extra-packages.yaml</text>
<text x="40" y="713.2" font-size="20" font-weight="400" fill="#55606E">pip extras and pip packages per image</text>
<polyline points="510,244 603.5,244" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,244 599,251.2 599,236.8" fill="#3A4452"/>
<polyline points="510,352 603.5,352" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,352 599,359.2 599,344.8" fill="#3A4452"/>
<polyline points="510,464 556,464 556,376 603.5,376" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,376 599,383.2 599,368.8" fill="#3A4452"/>
<polyline points="510,564 603.5,564" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,564 599,571.2 599,556.8" fill="#3A4452"/>
<polyline points="510,664 603.5,664" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,664 599,671.2 599,656.8" fill="#3A4452"/>
<rect x="1190" y="640" width="578" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="1479" y="672.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">nix/locks/{release}/{service}/</text>
<text x="1190" y="713.2" font-size="20" font-weight="400" fill="#55606E">sources.json: ref, commit, hash, project, patches</text>
<text x="1190" y="741.2" font-size="20" font-weight="400" fill="#55606E">pyproject.toml, uv.lock</text>
<polyline points="1086,652 1179.5,652" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1190,652 1175,659.2 1175,644.8" fill="#3A4452"/>
<text x="590" y="896.36" font-size="26" font-weight="700" fill="#2B3440">The build</text>
<text x="590" y="925.2" font-size="20" font-weight="400" fill="#55606E">the step Build service image of the job</text>
<text x="590" y="953.2" font-size="20" font-weight="400" fill="#55606E">build-service-images, through build-nix-image</text>
<rect x="590" y="980" width="520" height="684" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="614" y="1019.36" font-size="26" font-weight="700" fill="#2B3440">nix build .#{service}-{release_}-image</text>
<rect x="614" y="1050" width="472" height="118" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="633" y="1084.64" font-size="24" font-weight="700" fill="#2B3440">Fetch the source</text>
<text x="633" y="1117.2" font-size="20" font-weight="400" fill="#55606E">by commit and hash, and apply the patches</text>
<text x="633" y="1145.2" font-size="20" font-weight="400" fill="#55606E">sources.json lists: pkgs.applyPatches</text>
<rect x="614" y="1210" width="472" height="118" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="633" y="1244.64" font-size="24" font-weight="700" fill="#2B3440">Build the venv</text>
<text x="633" y="1277.2" font-size="20" font-weight="400" fill="#55606E">uv2nix: the wheels and sdists uv.lock pins,</text>
<text x="633" y="1305.2" font-size="20" font-weight="400" fill="#55606E">with the build inputs of nixpkgs-images</text>
<rect x="614" y="1370" width="472" height="270" rx="6" fill="#FDFCF9" stroke="#3A4452" stroke-width="2"/>
<text x="633" y="1404.64" font-size="24" font-weight="700" fill="#2B3440">Assemble the image</text>
<text x="633" y="1437.2" font-size="20" font-weight="400" fill="#55606E">nix/lib/service-image.nix: the venv under</text>
<text x="633" y="1465.2" font-size="20" font-weight="400" fill="#55606E">/var/lib/openstack, the FHS façade, the</text>
<text x="633" y="1493.2" font-size="20" font-weight="400" fill="#55606E">packages image.nix names, user 42424</text>
<polyline points="850,1168 850,1199.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="850,1210 842.8,1195 857.2,1195" fill="#3A4452"/>
<polyline points="850,1328 850,1359.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="850,1370 842.8,1355 857.2,1355" fill="#3A4452"/>
<polyline points="1190,670 1135,670 1135,1074 1096.5,1074" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1086,1074 1101,1066.8 1101,1081.2" fill="#3A4452"/>
<polyline points="1190,684 1160,684 1160,1234 1096.5,1234" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1086,1234 1101,1226.8 1101,1241.2" fill="#3A4452"/>
<rect x="40" y="990" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="1022.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">flake.nix</text>
<text x="40" y="1063.2" font-size="20" font-weight="400" fill="#55606E">with flake.lock: the nixpkgs-images revision</text>
<rect x="40" y="1090" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="1122.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">patches/{service}/{release}/*.patch</text>
<text x="40" y="1163.2" font-size="20" font-weight="400" fill="#55606E">optional</text>
<rect x="40" y="1230" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="1262.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">nix/lib/python-env.nix</text>
<text x="40" y="1303.2" font-size="20" font-weight="400" fill="#55606E">fetches and patches the source, builds the venv</text>
<rect x="40" y="1390" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="1422.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">images/{service}/image.nix</text>
<text x="40" y="1463.2" font-size="20" font-weight="400" fill="#55606E">the same file for every release</text>
<rect x="40" y="1490" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="1522.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">nix/lib/service-image.nix</text>
<text x="40" y="1563.2" font-size="20" font-weight="400" fill="#55606E">what every service image shares</text>
<rect x="40" y="1590" width="470" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="275" y="1622.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">nix/lib/fhs-layout.nix</text>
<text x="40" y="1663.2" font-size="20" font-weight="400" fill="#55606E">the FHS façade</text>
<polyline points="510,1014 579.5,1014" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="590,1014 575,1021.2 575,1006.8" fill="#3A4452"/>
<polyline points="510,1114 603.5,1114" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,1114 599,1121.2 599,1106.8" fill="#3A4452"/>
<polyline points="510,1254 603.5,1254" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,1254 599,1261.2 599,1246.8" fill="#3A4452"/>
<polyline points="510,1414 603.5,1414" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,1414 599,1421.2 599,1406.8" fill="#3A4452"/>
<polyline points="510,1514 603.5,1514" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,1514 599,1521.2 599,1506.8" fill="#3A4452"/>
<polyline points="510,1614 603.5,1614" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="614,1614 599,1621.2 599,1606.8" fill="#3A4452"/>
<polyline points="1086,1505 1179.5,1505" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1190,1505 1175,1512.2 1175,1497.8" fill="#3A4452"/>
<polygon points="1206,1483 1329,1483 1345,1505 1329,1527 1206,1527 1190,1505" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="1267.5" y="1513.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">{service}</text>
<text x="1190" y="1556.2" font-size="20" font-weight="400" fill="#55606E">{service}:{release}, a streamLayeredImage script:</text>
<text x="1190" y="1584.2" font-size="20" font-weight="400" fill="#55606E">docker load on a pull request,</text>
<text x="1190" y="1612.2" font-size="20" font-weight="400" fill="#55606E">skopeo push by digest on a push</text>
<polyline points="1720,688 1720,809.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1720,820 1712.8,805 1727.2,805" fill="#3A4452"/>
<rect x="1190" y="820" width="578" height="300" rx="13" fill="#EEF0F3" stroke="#7D8794" stroke-width="2"/>
<text x="1214" y="859.36" font-size="26" font-weight="700" fill="#2B3440">A second build for nova</text>
<text x="1214" y="890.2" font-size="20" font-weight="400" fill="#55606E">the nova lock's nova-compute dependency group</text>
<text x="1214" y="918.2" font-size="20" font-weight="400" fill="#55606E">and the block nova-compute of extra-packages.yaml</text>
<rect x="1214" y="940" width="530" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="1479" y="972.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">images/nova-compute/image.nix</text>
<rect x="1214" y="1008" width="530" height="48" fill="#E9ECEF" stroke="#7D8794" stroke-width="2"/>
<text x="1479" y="1040.64" font-size="24" font-weight="600" fill="#2B3440" text-anchor="middle">nix/pkgs/libvirt.nix</text>
<text x="1214" y="1081.2" font-size="20" font-weight="400" fill="#55606E">the libvirt the libvirt-python binding builds against</text>
<polyline points="1479,1120 1479,1159.5" fill="none" stroke="#3A4452" stroke-width="3"/>
<polygon points="1479,1170 1471.8,1155 1486.2,1155" fill="#3A4452"/>
<polygon points="1395,1170 1563,1170 1579,1192 1563,1214 1395,1214 1379,1192" fill="#FDFCF9" stroke="#7D8794" stroke-width="2"/>
<text x="1479" y="1200.64" font-size="24" font-weight="400" fill="#2B3440" text-anchor="middle">nova-compute</text>
<text x="1479" y="1239.2" font-size="20" font-weight="400" fill="#55606E" text-anchor="middle">nova-compute:{release}</text>
<text x="40" y="1721.2" font-size="20" font-weight="400" fill="#55606E">{service}: a key of source-refs.yaml with a directory under images/. {release}: a directory under releases/;</text>
<text x="40" y="1755.2" font-size="20" font-weight="400" fill="#55606E">{release_} is the release with its dot replaced by _, because a flake attribute cannot contain a dot.</text>
<text x="40" y="1789.2" font-size="20" font-weight="400" fill="#55606E">The build reads releases/ and overrides/ only through the lock. The patches it applies are the files sources.json lists.</text>
<text x="40" y="1823.2" font-size="20" font-weight="400" fill="#55606E">A grey box with square corners is a file or a directory. An arrow starts at what is read and points at the step or the build that reads it.</text>
</svg>
