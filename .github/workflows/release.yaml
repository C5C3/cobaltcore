---
name: Publish CobaltCore release
"on":
  # ci.yaml calls this workflow after publishing the RC images and charts.
  workflow_call:
    inputs:
      operators:
        description: Operator matrix whose chart archives CI published for this RC
        type: string
        required: true
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    if: github.event.created && !github.event.deleted && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify the release
        id: tag
        run: python3 scripts/release/publish.py identify

      - name: Download the exact chart archives from the candidate build
        if: steps.tag.outputs.kind == 'rc' && !steps.tag.outputs.published
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-chart-*
          path: assets
          merge-multiple: true

      - name: Publish the release with its changelog
        if: '!steps.tag.outputs.published'
        env:
          OPERATORS: ${{ inputs.operators }}
        run: python3 scripts/release/publish.py publish
