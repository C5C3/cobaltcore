---
name: Publish CobaltCore release
"on":
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  HELM_VERSION: v4.3.1

jobs:
  release:
    if: github.event.created && !github.event.deleted && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: publish-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify the release
        id: tag
        run: python3 scripts/release/publish.py identify

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        if: '!steps.tag.outputs.published'
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: ./.github/actions/setup-docker-registry
        if: '!steps.tag.outputs.published'
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the candidate images and charts and publish the stable release
        if: '!steps.tag.outputs.published'
        run: python3 scripts/release/publish.py publish
