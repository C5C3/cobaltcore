          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Merge and attest openstack-hypervisor-operator
        id: merge-hvo
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator
