            github_token=${{ secrets.GITHUB_TOKEN }}
          labels-title: openstack-hypervisor-operator
          labels-description: openstack-hypervisor-operator built from a pinned upstream main commit with CobaltCore patches
          metadata-tags: |
            type=raw,value=sha-${{ steps.hvo-commit.outputs.commit }}
          cache-scope: hvo
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/openstack-hypervisor-operator:pr-verify', needs.prepare.outputs.image-owner) || format('ghcr.io/{0}/openstack-hypervisor-operator', needs.prepare.outputs.image-owner) }}
          artifact-name: digests-hvo-${{ steps.platform-pair.outputs.value }}
          grype-category: grype-hvo-${{ steps.platform-pair.outputs.value }}
          image-ref-for-scan: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator:pr-verify
          verify-script: tests/container-images/verify_hvo.sh
          verify-image-ref: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator:pr-verify

  merge-hvo-image:
    if: github.event_name != 'pull_request'
    needs: [build-hvo, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    outputs:
      hvo-image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator@${{ steps.merge-hvo.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve hvo commit
        id: hvo-commit
        run: |
          commit=$(hack/ci-resolve-hvo-commit.sh)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # sha-<hvo-commit> is the tag the upstream chart of that commit renders
      # from its appVersion, upstream-<hvo-commit> is the one
      # hack/ghcr-prune-stale-versions.py keeps once a newer pin holds
      # latest. Both and latest are main-only so that two branches building
      # the same pin cannot silently overwrite them;
      # sha-<hvo-commit>-<sha> is pushed from every branch.
      - name: Build hvo tags
        id: hvo-tags
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator
          HVO_COMMIT: ${{ steps.hvo-commit.outputs.commit }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAGS="${IMAGE}:sha-${HVO_COMMIT}-${COMMIT_SHA}"
          [[ "${GITHUB_REF_NAME}" == "main" ]] && TAGS="${TAGS} ${IMAGE}:sha-${HVO_COMMIT} ${IMAGE}:upstream-${HVO_COMMIT} ${IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Merge and attest openstack-hypervisor-operator
        id: merge-hvo
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator
          artifact-pattern: digests-hvo-*
          tags: ${{ steps.hvo-tags.outputs.tags }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator:sha-${{ steps.hvo-commit.outputs.commit }}-${{ github.sha }}
          sbom-output-file: sbom-hvo.cyclonedx.json
          grype-category: grype-hvo

  # Runs on both architectures: PR mode compiles amd64 only (docker load takes
  # a single platform), so the arm64 half of the published manifest is first
  # executed here. docker pull resolves the manifest to the runner's own
  # architecture, so the runner is what selects the variant under test.
  verify-hvo-image:
    if: github.event_name != 'pull_request'
    needs: [merge-hvo-image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Pull and verify openstack-hypervisor-operator image
        env:
          HVO_IMAGE: ${{ needs.merge-hvo-image.outputs.hvo-image }}
        run: |
          docker pull "$HVO_IMAGE"
          bash tests/container-images/verify_hvo.sh "$HVO_IMAGE"

  # Release-independent kvm-node-agent compiled from a pinned commit of its
  # upstream main branch with the patches under images/kvm-node-agent/patches/:
  # the image has no release axis. Per-platform builds pushed by digest,
