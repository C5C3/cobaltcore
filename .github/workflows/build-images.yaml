---
name: Build Images
"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - stable/**
    paths:
      - images/**
      - releases/**
      - patches/**
      - scripts/**
      - hack/ci-*
      - hack/gen-option-catalog.sh
      - operators/keystone/api/v1alpha1/catalogs/**
      - operators/glance/api/v1alpha1/catalogs/**
      - operators/neutron/api/v1alpha1/catalogs/**
      - operators/cinder/api/v1alpha1/catalogs/**
      - operators/nova/api/v1alpha1/catalogs/**
      - .github/actions/**
      - tests/container-images/**
      - tests/lib/ceph_bindings.sh
      - tests/lib/build_tools.sh
      - tests/lib/static_image.sh
      - .github/workflows/build-images.yaml
      - flake.nix
      - flake.lock
      # The go directive the go-directive check of nix-flake-check compares
      # with the Go of nixpkgs-images.
      - go.work
      - nix/lib/**
      - nix/pkgs/**
      - nix/locks/**
      - nix/base-requirements.txt
      - hack/nix-lock.sh
  # The pull-request list is exactly what this workflow reads: the images and
  # their build inputs, the composite actions it reaches (directly or through
  # build-nix-image, setup-docker-registry and merge-manifest-and-attest),
  # the hack scripts it calls, the flake inputs, the go.work whose go directive
  # nix-flake-check compares with the Go of nixpkgs-images, the
  # shared library, packages and locks the Nix-built images are built from with
  # the generator nix-lock-check runs, and the per-image verify scripts with
  # the helpers they source. The four structural scripts under
  # tests/container-images/ belong to verify-container-images.yaml, which runs
  # them; this workflow never does, so they are excluded. GitHub
  # evaluates the list in order, which is why the negations follow the positive
  # entry they carve out of, and quoted, because a bare "!" starts a YAML tag.
  pull_request:
    paths:
      - images/**
      - releases/**
      - patches/**
      - scripts/**
      - overrides/**
      - hack/ci-generate-build-matrix.sh
      - hack/ci-merge-manifest.sh
      - hack/ci-tag-libvirt-keeper.sh
      - hack/ci-resolve-image-changes.sh
      - hack/ci-resolve-ovn-version.sh
      - hack/ci-resolve-hvo-commit.sh
      - hack/ci-resolve-kna-commit.sh
      - hack/resolve-test-ref.sh
      - hack/gen-option-catalog.sh
      - operators/keystone/api/v1alpha1/catalogs/**
      - operators/glance/api/v1alpha1/catalogs/**
      - operators/neutron/api/v1alpha1/catalogs/**
      - operators/cinder/api/v1alpha1/catalogs/**
      - operators/nova/api/v1alpha1/catalogs/**
      - .github/actions/build-nix-image/**
      - .github/actions/checkout-service-source/**
      - .github/actions/derive-service-tags/**
      - .github/actions/export-digest/**
      - .github/actions/merge-manifest-and-attest/**
      - .github/actions/platform-pair/**
      - .github/actions/registry-login/**
      - .github/actions/setup-docker-registry/**
      - .github/actions/setup-nix/**
      - .github/actions/supply-chain-attest/**
      - tests/container-images/**
      - "!tests/container-images/verify_build_images_workflow.sh"
      - "!tests/container-images/verify_deviation_comments.sh"
      - "!tests/container-images/verify_release_config.sh"
      - "!tests/container-images/verify_spdx_headers.sh"
      - tests/lib/ceph_bindings.sh
      - tests/lib/build_tools.sh
      - tests/lib/static_image.sh
      - .github/workflows/build-images.yaml
      - flake.nix
      - flake.lock
      # The go directive the go-directive check of nix-flake-check compares
      # with the Go of nixpkgs-images.
      - go.work
      - nix/lib/**
      - nix/pkgs/**
      - nix/locks/**
      - nix/base-requirements.txt
      - hack/nix-lock.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classify the changed paths, then resolve them into the service list and the
  # release-independent image flags the build and test jobs gate on. An image is
  # built when its own sources changed.
  #
  # Three inputs build everything, because everything is built from them: an
  # event that is not a pull request, a change to the workflow's own plumbing,
  # and a change to what every service image is built from (the base filter)
  # or the release configuration. Push and workflow_dispatch runs therefore
  # publish exactly what they publish today.
  #
  # To add a new service: see hack/ci-resolve-image-changes.sh for full
  # instructions.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      services: ${{ steps.result.outputs.services }}
      has-services: ${{ steps.result.outputs.has-services }}
      build-tempest: ${{ steps.result.outputs.build-tempest }}
      build-ovn: ${{ steps.result.outputs.build-ovn }}
      build-proxy: ${{ steps.result.outputs.build-proxy }}
      build-shifter: ${{ steps.result.outputs.build-shifter }}
      build-libvirt: ${{ steps.result.outputs.build-libvirt }}
      build-hvo: ${{ steps.result.outputs.build-hvo }}
      build-kna: ${{ steps.result.outputs.build-kna }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The action diffs against the pull request base. On push and
      # workflow_dispatch it is skipped, its outputs resolve to the empty
      # string, and the resolver overrides them with "everything" anyway.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            # ---------------------------------------------------------------
            # One filter per service image: its image.nix and companion
            # files, its locks, its patches, the option catalogs the build
            # verifies, and the script that verifies the built image.
            # ---------------------------------------------------------------
            svc_keystone:
              - 'images/keystone/**'
              - 'nix/locks/*/keystone/**'
              - 'patches/keystone/**'
              - 'operators/keystone/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_keystone.sh'
            svc_horizon:
              - 'images/horizon/**'
              - 'nix/locks/*/horizon/**'
              - 'patches/horizon/**'
              - 'tests/container-images/verify_horizon.sh'
            svc_glance:
              - 'images/glance/**'
              - 'nix/locks/*/glance/**'
              - 'patches/glance/**'
              - 'operators/glance/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_glance.sh'
              - 'tests/lib/ceph_bindings.sh'
            svc_placement:
              - 'images/placement/**'
              - 'nix/locks/*/placement/**'
              - 'patches/placement/**'
              - 'tests/container-images/verify_placement.sh'
            svc_barbican:
              - 'images/barbican/**'
              - 'nix/locks/*/barbican/**'
              - 'patches/barbican/**'
              - 'tests/container-images/verify_barbican.sh'
            svc_neutron:
              - 'images/neutron/**'
              - 'nix/locks/*/neutron/**'
              - 'patches/neutron/**'
              - 'operators/neutron/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_neutron.sh'
            svc_cinder:
              - 'images/cinder/**'
              - 'nix/locks/*/cinder/**'
              - 'patches/cinder/**'
              - 'operators/cinder/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_cinder.sh'
              - 'tests/lib/ceph_bindings.sh'
            svc_nova:
              - 'images/nova/**'
              - 'nix/locks/*/nova/**'
              - 'patches/nova/**'
              - 'operators/nova/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_nova.sh'
              # The compute image is built from nova's lock, patches and
              # constraints and rides the nova service name.
              - 'images/nova-compute/**'
              - 'tests/container-images/verify_nova_compute.sh'
              - 'tests/lib/ceph_bindings.sh'
            # ---------------------------------------------------------------
            # Everything every service image is built from: the flake inputs,
            # the shared Nix library and packages, the lock generator, the
            # action that builds the images, the release pins, the build
            # scripts, the constraint overrides.
            # ---------------------------------------------------------------
            base:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/lib/**'
              - 'nix/pkgs/**'
              - 'hack/nix-lock.sh'
              - '.github/actions/build-nix-image/**'
              - '.github/actions/setup-nix/**'
              # The build-tools check of every service and Tempest verify
              # script.
              - 'tests/lib/build_tools.sh'
              - 'releases/**'
              - 'scripts/**'
              - 'overrides/**'
            # ---------------------------------------------------------------
            # The release-independent images, one filter each.
            # ---------------------------------------------------------------
            tempest:
              - 'images/tempest/**'
              - 'nix/locks/*/tempest/**'
              - 'tests/container-images/verify_tempest.sh'
            # ovn, proxy, shifter, libvirt, hvo and kna are Nix-built: each is
            # rebuilt when its flake inputs, the shared library or the actions
            # that build it move. Their filters include this list through the
            # anchor; on its own it steers nothing.
            nix_image_inputs: &nix_image_inputs
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/lib/**'
              - '.github/actions/build-nix-image/**'
              - '.github/actions/setup-nix/**'
            # ovn's, the proxy's and libvirt's verify scripts also source the
            # build-tools check, hvo's and kna's the static-image check.
            ovn:
              - *nix_image_inputs
              - 'images/ovn/**'
              - 'tests/container-images/verify_ovn.sh'
              - 'tests/lib/build_tools.sh'
            proxy:
              - *nix_image_inputs
              - 'images/keystone-federation-proxy/**'
              - 'tests/container-images/verify_keystone_federation_proxy.sh'
              - 'tests/lib/build_tools.sh'
            shifter:
              - *nix_image_inputs
              - 'images/backup-shifter/**'
              - 'tests/container-images/verify_backup_shifter.sh'
            libvirt:
              - *nix_image_inputs
              - 'images/libvirt/**'
              - 'nix/pkgs/libvirt.nix'
              - 'tests/container-images/verify_libvirt.sh'
              - 'tests/lib/build_tools.sh'
            hvo:
              - *nix_image_inputs
              - 'images/openstack-hypervisor-operator/**'
              - 'tests/container-images/verify_hvo.sh'
              - 'tests/lib/static_image.sh'
            kna:
              - *nix_image_inputs
              - 'images/kvm-node-agent/**'
              - 'tests/container-images/verify_kna.sh'
              - 'tests/lib/static_image.sh'
            # ---------------------------------------------------------------
            # The workflow itself, and everything any of its jobs may call.
            # ---------------------------------------------------------------
            plumbing:
              - '.github/workflows/build-images.yaml'
              - '.github/actions/checkout-service-source/**'
              - '.github/actions/derive-service-tags/**'
              - '.github/actions/export-digest/**'
              - '.github/actions/merge-manifest-and-attest/**'
              - '.github/actions/platform-pair/**'
              - '.github/actions/registry-login/**'
              - '.github/actions/setup-docker-registry/**'
              - '.github/actions/supply-chain-attest/**'
              - 'hack/ci-generate-build-matrix.sh'
              - 'hack/ci-merge-manifest.sh'
              - 'hack/ci-tag-libvirt-keeper.sh'
              - 'hack/ci-resolve-image-changes.sh'
              - 'hack/ci-resolve-ovn-version.sh'
              - 'hack/ci-resolve-hvo-commit.sh'
              - 'hack/ci-resolve-kna-commit.sh'
              - 'hack/resolve-test-ref.sh'
              - 'hack/gen-option-catalog.sh'

      - name: Resolve the image set
        id: result
        env:
          EVENT_NAME: ${{ github.event_name }}
          ALL_SERVICES: keystone horizon glance placement barbican neutron cinder nova
          FILTER_svc_keystone: ${{ steps.filter.outputs.svc_keystone }}
          FILTER_svc_horizon: ${{ steps.filter.outputs.svc_horizon }}
          FILTER_svc_glance: ${{ steps.filter.outputs.svc_glance }}
          FILTER_svc_placement: ${{ steps.filter.outputs.svc_placement }}
          FILTER_svc_barbican: ${{ steps.filter.outputs.svc_barbican }}
          FILTER_svc_neutron: ${{ steps.filter.outputs.svc_neutron }}
          FILTER_svc_cinder: ${{ steps.filter.outputs.svc_cinder }}
          FILTER_svc_nova: ${{ steps.filter.outputs.svc_nova }}
          FILTER_base: ${{ steps.filter.outputs.base }}
          FILTER_tempest: ${{ steps.filter.outputs.tempest }}
          FILTER_ovn: ${{ steps.filter.outputs.ovn }}
          FILTER_proxy: ${{ steps.filter.outputs.proxy }}
          FILTER_shifter: ${{ steps.filter.outputs.shifter }}
          FILTER_libvirt: ${{ steps.filter.outputs.libvirt }}
          FILTER_hvo: ${{ steps.filter.outputs.hvo }}
          FILTER_kna: ${{ steps.filter.outputs.kna }}
          FILTER_plumbing: ${{ steps.filter.outputs.plumbing }}
        run: hack/ci-resolve-image-changes.sh

  # The gate of every Nix-built image: nix flake check --no-build evaluates
  # every output of the runner's system, and the build step builds the three
  # checks that need no service lock (nix-lint runs nixfmt, statix and
  # deadnix); without --no-build the check
  # would also run the unit tests of every lock, which test-service-images
  # runs one leg each. The nix eval instantiates every arm64 output without
  # building it, which --all-systems cannot do on an x86 runner. The Cachix
  # step reads the cobaltcore cache and pushes to it only when
  # CACHIX_AUTH_TOKEN is set.
  nix-flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check the flake
        run: |
          nix flake check --no-build --print-build-logs
          nix build .#checks.x86_64-linux.nix-lint .#checks.x86_64-linux.fhs-layout \
            .#checks.x86_64-linux.service-tests --print-build-logs

      - name: Instantiate the arm64 images
        run: |
          nix eval --json .#packages.aarch64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'

  # The locks under nix/locks/ and the noVNC hash are derived from the release
  # pins, the constraint overrides, the patches and the base pins of
  # nix/base-requirements.txt, and
  # the hashes in images/ovn/source.json,
  # images/openstack-hypervisor-operator/source.json and
  # images/kvm-node-agent/source.json, with the OVS commit of the 'ovs'
  # gitlink, from the commits those pins name, and operators/<op>/vendor.json
  # from the go.mod and go.sum files of the operator: hack/nix-lock.sh --check
  # regenerates them with the uv of the lock-tools shell and fails when the
  # result differs from the committed files. A Renovate pull request that
  # moves a pin fails here until `make nix-lock` is pushed to its branch. The
  # GitHub token lifts the API rate limit of the source prefetches.
  nix-lock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the locks
        run: |
          nix develop .#lock-tools --command bash hack/nix-lock.sh --check || {
            echo "::error::the Nix locks or image pins are stale: run make nix-lock and commit the result"
            exit 1
          }

  # Single source for lowercase image owner.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image-owner: ${{ steps.owner.outputs.owner }}
    steps:
      - name: Normalize image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  generate-matrix:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build-matrix: ${{ steps.matrix.outputs.build-matrix }}
      tempest-matrix: ${{ steps.matrix.outputs.tempest-matrix }}
      tempest-release-matrix: ${{ steps.matrix.outputs.tempest-release-matrix }}
      nova-compute-releases: ${{ steps.matrix.outputs.nova-compute-releases }}
      nova-compute-build-matrix: ${{ steps.matrix.outputs.nova-compute-build-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1

      - name: Generate service×release matrix
        id: matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SERVICES: ${{ needs.changes.outputs.services }}
        run: hack/ci-generate-build-matrix.sh

  # Nix-built image: images/tempest/image.nix over the tempest lock of the
  # release, which pins the five releases/<release>/test-refs.yaml versions.
  build-tempest:
    needs: [changes, generate-matrix, nix-flake-check, nix-lock-check, prepare]
    if: needs.changes.outputs.build-tempest == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.tempest-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # A flake attribute cannot contain a dot, so the release names its
      # attribute with an underscore (tempest-2026_1-image).
      - name: Resolve flake attribute
        id: attr
        env:
          MATRIX_RELEASE: ${{ matrix.release }}
        run: echo "attribute=tempest-${MATRIX_RELEASE//./_}-image" >> "$GITHUB_OUTPUT"

      - name: Build Tempest image
        id: build-tempest
        if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'  # defense-in-depth: matrix already excludes ARM64 on PRs
        uses: ./.github/actions/build-nix-image
        with:
          attribute: ${{ steps.attr.outputs.attribute }}
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          artifact-name: digests-tempest-${{ matrix.release }}-${{ steps.platform-pair.outputs.value }}
          grype-category: grype-tempest-${{ matrix.release }}-${{ steps.platform-pair.outputs.value }}
          verify-script: tests/container-images/verify_tempest.sh
          verify-image-ref: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest:${{ matrix.release }}
          vulnix-artifact-name: vulnix-tempest-${{ matrix.release }}-${{ steps.platform-pair.outputs.value }}

  merge-tempest-image:
    if: github.event_name != 'pull_request'
    needs: [build-tempest, generate-matrix, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.tempest-release-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tempest tags
        id: tempest-tags
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest
          MATRIX_RELEASE: ${{ matrix.release }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TEMPEST_VERSION=$(hack/resolve-test-ref.sh "releases/${MATRIX_RELEASE}/test-refs.yaml" tempest)
          TAGS="${IMAGE}:${MATRIX_RELEASE} ${IMAGE}:${MATRIX_RELEASE}-${COMMIT_SHA}"
          [[ "${GITHUB_REF_NAME}" == "main" ]] && TAGS="${TAGS} ${IMAGE}:${TEMPEST_VERSION}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Merge and attest Tempest
        id: merge-tempest
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest
          artifact-pattern: digests-tempest-${{ matrix.release }}-*
          tags: ${{ steps.tempest-tags.outputs.tags }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest:${{ matrix.release }}-${{ github.sha }}
          sbom-output-file: sbom-tempest-${{ matrix.release }}.cyclonedx.json
          grype-category: grype-tempest-${{ matrix.release }}

  # Release-independent Apache federation sidecar for Keystone,
  # images/keystone-federation-proxy/image.nix, built by build-nix-image
  # (docs/reference/ci-cd/nix-image-build.md). mod_auth_openidc is built
  # from the commit images/keystone-federation-proxy/source.json pins,
  # Apache and mod_auth_mellon come from the nixpkgs-images revision
  # flake.lock pins, so the image has no release axis: per-platform builds
  # pushed by digest and merged by the merge job, verified inline on PRs
  # (tempest pattern), merged + attested with the :latest / :<sha> tag
  # scheme on push events.
  build-keystone-federation-proxy:
    needs: [changes, nix-flake-check, prepare]
    if: needs.changes.outputs.build-proxy == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Reject fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::error::Fork PRs cannot push to GHCR. Open your PR from a branch in the upstream repository." && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build keystone-federation-proxy
        id: build-keystone-federation-proxy
        # PR mode loads locally for the inline scan+verify; ARM64 is skipped
        # on PRs because docker load supports a single platform.
        if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'
        uses: ./.github/actions/build-nix-image
        with:
          attribute: keystone-federation-proxy-image
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/keystone-federation-proxy
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          artifact-name: digests-keystone-federation-proxy-${{ steps.platform-pair.outputs.value }}
          grype-category: grype-keystone-federation-proxy-${{ steps.platform-pair.outputs.value }}
