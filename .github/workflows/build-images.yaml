          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Resolve hvo commit
        id: hvo-commit
        run: |
          commit=$(hack/ci-resolve-hvo-commit.sh)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Build openstack-hypervisor-operator
        id: build-hvo
        # PR mode loads locally for the inline scan+verify; ARM64 is skipped
        # on PRs because docker load supports a single platform.
        if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'
        uses: ./.github/actions/build-push-image
        with:
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator
          context: images/openstack-hypervisor-operator
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
