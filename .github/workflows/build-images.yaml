  # Release-independent rclone shifter for the OVN database backups, the first
  # Nix-built image: images/backup-shifter/image.nix, built by build-nix-image
  # (docs/reference/ci-cd/nix-image-build.md). rclone comes from the
  # nixpkgs-images revision flake.lock pins, so the image has no release axis:
  # per-platform builds pushed by digest and merged by the merge job, verified
  # inline on PRs (tempest pattern), merged + attested with the :latest /
  # :<sha> tag scheme on push events.
  build-backup-shifter:
    needs: [changes, nix-flake-check, prepare]
