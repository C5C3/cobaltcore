      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and attest backup-shifter
        id: merge-backup-shifter
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/backup-shifter
          artifact-pattern: digests-backup-shifter-*
          tags: ghcr.io/${{ needs.prepare.outputs.image-owner }}/backup-shifter:latest ghcr.io/${{ needs.prepare.outputs.image-owner }}/backup-shifter:${{ github.sha }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/backup-shifter:${{ github.sha }}
          sbom-output-file: sbom-backup-shifter.cyclonedx.json
          grype-category: grype-backup-shifter

  # Release-independent libvirt daemon and QEMU for containerized hypervisor
  # nodes. libvirt, QEMU and OVMF come from the ubuntu:noble archive, so the
  # image has no release axis: per-platform builds pushed by digest
  # (base-image pattern), verified inline on PRs (tempest pattern), merged +
  # attested with the base-image :latest / :<sha> tag scheme on push events.
  # On main, a third tag <libvirt-package-version>-r<N> is minted once per
  # value and never moved (hack/ci-tag-libvirt-keeper.sh); the lab manifests
  # pin it by digest.
  build-libvirt:
    needs: [changes, lint-dockerfiles, prepare]
    if: needs.changes.outputs.build-libvirt == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Reject fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::error::Fork PRs cannot push to GHCR. Open your PR from a branch in the upstream repository." && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Resolve ubuntu:noble digest
        id: ubuntu-base
        run: hack/ci-resolve-ubuntu-digest.sh

      - name: Build libvirt
        id: build-libvirt
        # PR mode loads locally for the inline scan+verify; ARM64 is skipped
        # on PRs because docker load supports a single platform.
        if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'
        uses: ./.github/actions/build-push-image
        with:
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/libvirt
          context: images/libvirt
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
          build-args: |
            APT_MIRROR=http://azure.archive.ubuntu.com
          labels-title: libvirt
          labels-description: libvirt and QEMU/KVM for containerized hypervisor nodes
          extra-labels: |
            org.opencontainers.image.base.name=ubuntu:noble
            org.opencontainers.image.base.digest=${{ steps.ubuntu-base.outputs.digest }}
          cache-scope: libvirt
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/libvirt:pr-verify', needs.prepare.outputs.image-owner) || format('ghcr.io/{0}/libvirt', needs.prepare.outputs.image-owner) }}
          artifact-name: digests-libvirt-${{ steps.platform-pair.outputs.value }}
          grype-category: grype-libvirt-${{ steps.platform-pair.outputs.value }}
          image-ref-for-scan: ghcr.io/${{ needs.prepare.outputs.image-owner }}/libvirt:pr-verify
          verify-script: tests/container-images/verify_libvirt.sh
          verify-image-ref: ghcr.io/${{ needs.prepare.outputs.image-owner }}/libvirt:pr-verify

  merge-libvirt-image:
    if: github.event_name != 'pull_request'
    needs: [build-libvirt, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    steps:
      # The full history on main, where the keeper step runs:
      # hack/ci-tag-libvirt-keeper.sh counts the commits under images/libvirt,
      # and a shallow clone counts one. The count reads commits and trees
      # only, so the blobs outside HEAD stay on the server.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ github.ref_name != 'main' && 1 || 0 }}
          filter: blob:none

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and attest libvirt
        id: merge-libvirt
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/libvirt
          artifact-pattern: digests-libvirt-*
          tags: ghcr.io/${{ needs.prepare.outputs.image-owner }}/libvirt:latest ghcr.io/${{ needs.prepare.outputs.image-owner }}/libvirt:${{ github.sha }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/libvirt:${{ github.sha }}
          sbom-output-file: sbom-libvirt.cyclonedx.json
          grype-category: grype-libvirt

      # The keeper tag is main-only, as ovn:<ovn-version> is, so that two
      # branches cannot claim one tag. A tag that exists already stays on the
      # digest it names.
      - name: Mint the libvirt keeper tag
        id: keeper-tag
        if: github.ref_name == 'main'
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image-owner }}/libvirt
          DIGEST: ${{ steps.merge-libvirt.outputs.digest }}
        run: hack/ci-tag-libvirt-keeper.sh

  # Release-independent OVS + OVN daemons compiled from pinned upstream
  # sources: images/ovn/Dockerfile pins the OVN tag and takes OVS from that
  # tag's 'ovs' submodule gitlink, so the image has no release axis.
  # Per-platform builds pushed by digest, verified inline on PRs, tagged
  # <ovn-version>-<sha> on every push and <ovn-version> + latest on main.
  build-ovn:
    needs: [changes, lint-dockerfiles, prepare]
    if: needs.changes.outputs.build-ovn == 'true'
    runs-on: ${{ matrix.runner }}
    # OVS and OVN are compiled from source on a 4-vCPU runner.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Reject fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::error::Fork PRs cannot push to GHCR. Open your PR from a branch in the upstream repository." && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Resolve ubuntu:noble digest
        id: ubuntu-base
        run: hack/ci-resolve-ubuntu-digest.sh

      - name: Resolve OVN version
        id: ovn-version
        run: |
          version=$(hack/ci-resolve-ovn-version.sh)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build ovn
        id: build-ovn
        # PR mode loads locally for the inline scan+verify; ARM64 is skipped
        # on PRs because docker load supports a single platform.
        if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'
        uses: ./.github/actions/build-push-image
        with:
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/ovn
          context: images/ovn
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
          build-args: |
            APT_MIRROR=http://azure.archive.ubuntu.com
          # The Dockerfile fetches OVN and OVS from github.com with the git
          # noble ships; the token authenticates those fetches (see the
          # Dockerfile). A secret, not a build-arg: it reaches no layer.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels-title: ovn
          labels-description: OVN and Open vSwitch daemons and client tools built from pinned upstream sources
          metadata-tags: |
            type=raw,value=${{ steps.ovn-version.outputs.version }}
          extra-labels: |
            org.opencontainers.image.base.name=ubuntu:noble
            org.opencontainers.image.base.digest=${{ steps.ubuntu-base.outputs.digest }}
          cache-scope: ovn
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/ovn:pr-verify', needs.prepare.outputs.image-owner) || format('ghcr.io/{0}/ovn', needs.prepare.outputs.image-owner) }}
          artifact-name: digests-ovn-${{ steps.platform-pair.outputs.value }}
          grype-category: grype-ovn-${{ steps.platform-pair.outputs.value }}
          image-ref-for-scan: ghcr.io/${{ needs.prepare.outputs.image-owner }}/ovn:pr-verify
          verify-script: tests/container-images/verify_ovn.sh
          verify-image-ref: ghcr.io/${{ needs.prepare.outputs.image-owner }}/ovn:pr-verify

  merge-ovn-image:
    if: github.event_name != 'pull_request'
    needs: [build-ovn, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    outputs:
      ovn-image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/ovn@${{ steps.merge-ovn.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve OVN version
        id: ovn-version
        run: |
          version=$(hack/ci-resolve-ovn-version.sh)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # <ovn-version> and latest are main-only so that two branches building
      # the same upstream version cannot silently overwrite them;
      # <ovn-version>-<sha> is pushed from every branch.
      - name: Build OVN tags
        id: ovn-tags
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image-owner }}/ovn
          OVN_VERSION: ${{ steps.ovn-version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAGS="${IMAGE}:${OVN_VERSION}-${COMMIT_SHA}"
          [[ "${GITHUB_REF_NAME}" == "main" ]] && TAGS="${TAGS} ${IMAGE}:${OVN_VERSION} ${IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Merge and attest ovn
        id: merge-ovn
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/ovn
          artifact-pattern: digests-ovn-*
          tags: ${{ steps.ovn-tags.outputs.tags }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/ovn:${{ steps.ovn-version.outputs.version }}-${{ github.sha }}
          sbom-output-file: sbom-ovn.cyclonedx.json
          grype-category: grype-ovn

  # Runs on both architectures: PR mode compiles amd64 only (docker load takes
  # a single platform), so the arm64 half of the published manifest is first
  # executed here. docker pull resolves the manifest to the runner's own
  # architecture, so the runner is what selects the variant under test.
  verify-ovn-image:
    if: github.event_name != 'pull_request'
    needs: [merge-ovn-image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Pull and verify ovn image
        env:
          OVN_IMAGE: ${{ needs.merge-ovn-image.outputs.ovn-image }}
        run: |
          docker pull "$OVN_IMAGE"
          bash tests/container-images/verify_ovn.sh "$OVN_IMAGE"

  # Release-independent openstack-hypervisor-operator compiled from a pinned
  # commit of its upstream main branch with the patches under
  # images/openstack-hypervisor-operator/patches/: the image has no release
  # axis. Per-platform builds pushed by digest, verified inline on PRs, tagged
  # sha-<hvo-commit>-<sha> on every push and sha-<hvo-commit>,
  # upstream-<hvo-commit> + latest on main.
  build-hvo:
    needs: [changes, lint-dockerfiles, prepare]
    if: needs.changes.outputs.build-hvo == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Reject fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::error::Fork PRs cannot push to GHCR. Open your PR from a branch in the upstream repository." && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
