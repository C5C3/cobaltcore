            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Reject fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::error::Fork PRs cannot push to GHCR. Open your PR from a branch in the upstream repository." && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build openstack-hypervisor-operator
        id: build-hvo
        # PR mode loads locally for the inline scan+verify; ARM64 is skipped
        # on PRs because docker load supports a single platform.
        if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'
        uses: ./.github/actions/build-nix-image
        with:
          attribute: openstack-hypervisor-operator-image
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          artifact-name: digests-hvo-${{ steps.platform-pair.outputs.value }}
          grype-category: grype-hvo-${{ steps.platform-pair.outputs.value }}
          verify-script: tests/container-images/verify_hvo.sh
          verify-image-ref: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator:pr-verify
          vulnix-artifact-name: vulnix-hvo-${{ steps.platform-pair.outputs.value }}

  merge-hvo-image:
    if: github.event_name != 'pull_request'
    needs: [build-hvo, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    outputs:
      hvo-image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/openstack-hypervisor-operator@${{ steps.merge-hvo.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve hvo commit
        id: hvo-commit
        run: |
          commit=$(hack/ci-resolve-hvo-commit.sh)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # sha-<hvo-commit> is the tag the upstream chart of that commit renders
      # from its appVersion, upstream-<hvo-commit> is the one
      # hack/ghcr-prune-stale-versions.py keeps once a newer pin holds
      # latest. Both and latest are main-only so that two branches building
      # the same pin cannot silently overwrite them;
      # sha-<hvo-commit>-<sha> is pushed from every branch.
