---
name: Build Images
"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - stable/**
    paths:
      - images/**
      - operators/Dockerfile
      - releases/**
      - patches/**
      - scripts/**
      - hack/ci-*
      - hack/gen-option-catalog.sh
      - operators/keystone/api/v1alpha1/catalogs/**
      - operators/glance/api/v1alpha1/catalogs/**
      - operators/neutron/api/v1alpha1/catalogs/**
      - operators/cinder/api/v1alpha1/catalogs/**
      - operators/nova/api/v1alpha1/catalogs/**
      - .github/actions/**
      - tests/container-images/**
      - tests/lib/ceph_bindings.sh
      - .github/workflows/build-images.yaml
      - .hadolint.yaml
  # The pull-request list is exactly what this workflow reads: the images and
  # their build inputs, the composite actions it reaches (directly or through
  # build-push-image, setup-docker-registry and merge-manifest-and-attest), the
  # hack scripts it calls, and the per-image verify scripts with the helper
  # three of them source. The four structural scripts under
  # tests/container-images/ belong to verify-container-images.yaml, which runs
  # them; this workflow never does, so they are excluded. GitHub
  # evaluates the list in order, which is why the negations follow the positive
  # entry they carve out of, and quoted, because a bare "!" starts a YAML tag.
  pull_request:
    paths:
      - images/**
      - operators/Dockerfile
      - releases/**
      - patches/**
      - scripts/**
      - overrides/**
      - hack/ci-generate-build-matrix.sh
      - hack/ci-merge-manifest.sh
      - hack/ci-tag-libvirt-keeper.sh
      - hack/ci-resolve-extra-packages.sh
      - hack/ci-resolve-image-changes.sh
      - hack/ci-resolve-ovn-version.sh
      - hack/ci-resolve-hvo-commit.sh
      - hack/ci-resolve-kna-commit.sh
      - hack/ci-resolve-ubuntu-digest.sh
      - hack/ci-run-unit-tests.sh
      - hack/ci-wait-for-image.sh
      - hack/resolve-test-ref.sh
      - hack/gen-option-catalog.sh
      - operators/keystone/api/v1alpha1/catalogs/**
      - operators/glance/api/v1alpha1/catalogs/**
      - operators/neutron/api/v1alpha1/catalogs/**
      - operators/cinder/api/v1alpha1/catalogs/**
      - operators/nova/api/v1alpha1/catalogs/**
      - .github/actions/build-push-image/**
      - .github/actions/checkout-service-source/**
      - .github/actions/derive-service-tags/**
      - .github/actions/export-digest/**
      - .github/actions/merge-manifest-and-attest/**
      - .github/actions/platform-pair/**
      - .github/actions/registry-login/**
      - .github/actions/setup-docker-registry/**
      - .github/actions/supply-chain-attest/**
      - tests/container-images/**
      - "!tests/container-images/verify_build_images_workflow.sh"
      - "!tests/container-images/verify_deviation_comments.sh"
      - "!tests/container-images/verify_release_config.sh"
      - "!tests/container-images/verify_spdx_headers.sh"
      - tests/lib/ceph_bindings.sh
      - .github/workflows/build-images.yaml
      - .hadolint.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classify the changed paths, then resolve them into the service list and the
  # release-independent image flags the build and test jobs gate on. An image is
  # built when its own sources changed.
  #
  # Three inputs build everything, because everything is built from them: an
  # event that is not a pull request, a change to the workflow's own plumbing,
  # and a change to the base images or the release configuration. Push and
  # workflow_dispatch runs therefore publish exactly what they publish today.
  #
  # The base-image jobs stay outside this: they run on every run of the
  # workflow, because four of their outputs are what the service, Tempest and
  # test jobs build against.
  #
  # To add a new service: see hack/ci-resolve-image-changes.sh for full
  # instructions.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      services: ${{ steps.result.outputs.services }}
      has-services: ${{ steps.result.outputs.has-services }}
      build-tempest: ${{ steps.result.outputs.build-tempest }}
      build-ovn: ${{ steps.result.outputs.build-ovn }}
      build-proxy: ${{ steps.result.outputs.build-proxy }}
      build-shifter: ${{ steps.result.outputs.build-shifter }}
      build-libvirt: ${{ steps.result.outputs.build-libvirt }}
      build-hvo: ${{ steps.result.outputs.build-hvo }}
      build-kna: ${{ steps.result.outputs.build-kna }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The action diffs against the pull request base. On push and
      # workflow_dispatch it is skipped, its outputs resolve to the empty
      # string, and the resolver overrides them with "everything" anyway.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            # ---------------------------------------------------------------
            # One filter per service image: its Dockerfile and build context,
            # its patches, the option catalogs the build verifies, and the
            # script that verifies the built image.
            # ---------------------------------------------------------------
            svc_keystone:
              - 'images/keystone/**'
              - 'patches/keystone/**'
              - 'operators/keystone/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_keystone.sh'
            svc_horizon:
              - 'images/horizon/**'
              - 'patches/horizon/**'
              - 'tests/container-images/verify_horizon.sh'
            svc_glance:
              - 'images/glance/**'
              - 'patches/glance/**'
              - 'operators/glance/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_glance.sh'
              - 'tests/lib/ceph_bindings.sh'
            svc_placement:
              - 'images/placement/**'
              - 'patches/placement/**'
              - 'tests/container-images/verify_placement.sh'
            svc_barbican:
              - 'images/barbican/**'
              - 'patches/barbican/**'
              - 'tests/container-images/verify_barbican.sh'
            svc_neutron:
              - 'images/neutron/**'
              - 'patches/neutron/**'
              - 'operators/neutron/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_neutron.sh'
            svc_cinder:
              - 'images/cinder/**'
              - 'patches/cinder/**'
              - 'operators/cinder/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_cinder.sh'
              - 'tests/lib/ceph_bindings.sh'
            svc_nova:
              - 'images/nova/**'
              - 'patches/nova/**'
              - 'operators/nova/api/v1alpha1/catalogs/**'
              - 'tests/container-images/verify_nova.sh'
              # The compute image is built from nova's pin, patches and
              # constraints and rides the nova service name.
              - 'images/nova-compute/**'
              - 'tests/container-images/verify_nova_compute.sh'
              - 'tests/lib/ceph_bindings.sh'
            # ---------------------------------------------------------------
            # Everything every service image is built from: the two base
            # images, the release pins, the build scripts, the constraint
            # overrides.
            # ---------------------------------------------------------------
            base:
              - 'images/python-base/**'
              - 'images/venv-builder/**'
              - 'releases/**'
              - 'scripts/**'
              - 'overrides/**'
            # ---------------------------------------------------------------
            # The release-independent images, one filter each.
            # ---------------------------------------------------------------
            tempest:
              - 'images/tempest/**'
              - 'tests/container-images/verify_tempest.sh'
            ovn:
              - 'images/ovn/**'
              - 'tests/container-images/verify_ovn.sh'
            proxy:
              - 'images/keystone-federation-proxy/**'
              - 'tests/container-images/verify_keystone_federation_proxy.sh'
            shifter:
              - 'images/backup-shifter/**'
              - 'tests/container-images/verify_backup_shifter.sh'
            libvirt:
              - 'images/libvirt/**'
              - 'tests/container-images/verify_libvirt.sh'
            hvo:
              - 'images/openstack-hypervisor-operator/**'
              - 'tests/container-images/verify_hvo.sh'
            kna:
              - 'images/kvm-node-agent/**'
              - 'tests/container-images/verify_kna.sh'
            # ---------------------------------------------------------------
            # The workflow itself, and everything any of its jobs may call.
            # ---------------------------------------------------------------
            plumbing:
              - '.github/workflows/build-images.yaml'
              - '.hadolint.yaml'
              - '.github/actions/build-push-image/**'
              - '.github/actions/checkout-service-source/**'
              - '.github/actions/derive-service-tags/**'
              - '.github/actions/export-digest/**'
              - '.github/actions/merge-manifest-and-attest/**'
              - '.github/actions/platform-pair/**'
              - '.github/actions/registry-login/**'
              - '.github/actions/setup-docker-registry/**'
              - '.github/actions/supply-chain-attest/**'
              - 'hack/ci-generate-build-matrix.sh'
              - 'hack/ci-merge-manifest.sh'
              - 'hack/ci-tag-libvirt-keeper.sh'
              - 'hack/ci-resolve-extra-packages.sh'
              - 'hack/ci-resolve-image-changes.sh'
              - 'hack/ci-resolve-ovn-version.sh'
              - 'hack/ci-resolve-hvo-commit.sh'
              - 'hack/ci-resolve-kna-commit.sh'
              - 'hack/ci-resolve-ubuntu-digest.sh'
              - 'hack/ci-run-unit-tests.sh'
              - 'hack/ci-wait-for-image.sh'
              - 'hack/resolve-test-ref.sh'
              - 'hack/gen-option-catalog.sh'

      - name: Resolve the image set
        id: result
        env:
          EVENT_NAME: ${{ github.event_name }}
          ALL_SERVICES: keystone horizon glance placement barbican neutron cinder nova
          FILTER_svc_keystone: ${{ steps.filter.outputs.svc_keystone }}
          FILTER_svc_horizon: ${{ steps.filter.outputs.svc_horizon }}
          FILTER_svc_glance: ${{ steps.filter.outputs.svc_glance }}
          FILTER_svc_placement: ${{ steps.filter.outputs.svc_placement }}
          FILTER_svc_barbican: ${{ steps.filter.outputs.svc_barbican }}
          FILTER_svc_neutron: ${{ steps.filter.outputs.svc_neutron }}
          FILTER_svc_cinder: ${{ steps.filter.outputs.svc_cinder }}
          FILTER_svc_nova: ${{ steps.filter.outputs.svc_nova }}
          FILTER_base: ${{ steps.filter.outputs.base }}
          FILTER_tempest: ${{ steps.filter.outputs.tempest }}
          FILTER_ovn: ${{ steps.filter.outputs.ovn }}
          FILTER_proxy: ${{ steps.filter.outputs.proxy }}
          FILTER_shifter: ${{ steps.filter.outputs.shifter }}
          FILTER_libvirt: ${{ steps.filter.outputs.libvirt }}
          FILTER_hvo: ${{ steps.filter.outputs.hvo }}
          FILTER_kna: ${{ steps.filter.outputs.kna }}
          FILTER_plumbing: ${{ steps.filter.outputs.plumbing }}
        run: hack/ci-resolve-image-changes.sh

  lint-dockerfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    strategy:
      matrix:
        dockerfile:
          - images/python-base/Dockerfile
          - images/venv-builder/Dockerfile
          - images/keystone/Dockerfile
          - images/horizon/Dockerfile
          - images/glance/Dockerfile
          - images/placement/Dockerfile
          - images/barbican/Dockerfile
          - images/neutron/Dockerfile
          - images/cinder/Dockerfile
          - images/nova/Dockerfile
          - images/nova-compute/Dockerfile
          - images/tempest/Dockerfile
          - images/keystone-federation-proxy/Dockerfile
          - images/ovn/Dockerfile
          - images/backup-shifter/Dockerfile
          - images/libvirt/Dockerfile
          - images/openstack-hypervisor-operator/Dockerfile
          - images/kvm-node-agent/Dockerfile
          - operators/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning
          config: .hadolint.yaml

  # Single source for lowercase image owner.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image-owner: ${{ steps.owner.outputs.owner }}
    steps:
      - name: Normalize image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  # Per-platform builds pushed by digest; merge-base-images assembles manifests.
  build-base-images:
    needs: [lint-dockerfiles, prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Reject fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::error::Fork PRs cannot push to GHCR. Open your PR from a branch in the upstream repository." && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Resolve ubuntu:noble digest
        id: ubuntu-base
        run: hack/ci-resolve-ubuntu-digest.sh

      - name: Build and push python-base
        id: build-python-base
        uses: ./.github/actions/build-push-image
        with:
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base
          context: images/python-base
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
          build-args: |
            APT_MIRROR=http://azure.archive.ubuntu.com
          labels-title: python-base
          labels-description: Python runtime base image for OpenStack services
          extra-labels: |
            org.opencontainers.image.base.name=ubuntu:noble
            org.opencontainers.image.base.digest=${{ steps.ubuntu-base.outputs.digest }}
          cache-scope: python-base
          tags: ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base
          artifact-name: digests-python-base-${{ steps.platform-pair.outputs.value }}
          digest-dir: /tmp/digests/python-base

      # ghcr.io is eventually consistent: the freshly-pushed python-base digest
      # is occasionally not yet resolvable when venv-builder consumes it as a
      # --build-context source, failing the build with a 404. Wait for it to
      # propagate first (same backoff as ci-merge-manifest.sh).
      - name: Wait for python-base digest to propagate
        env:
          REF: ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base@${{ steps.build-python-base.outputs.digest }}
        run: hack/ci-wait-for-image.sh

      - name: Build and push venv-builder
        id: build-venv-builder
        uses: ./.github/actions/build-push-image
        with:
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/venv-builder
          context: images/venv-builder
          build-contexts: |
            python-base=docker-image://ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base@${{ steps.build-python-base.outputs.digest }}
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
          labels-title: venv-builder
          labels-description: Python virtualenv builder image for OpenStack services
          extra-labels: |
            org.opencontainers.image.base.name=ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base
            org.opencontainers.image.base.digest=${{ steps.build-python-base.outputs.digest }}
          cache-scope: venv-builder
          tags: ghcr.io/${{ needs.prepare.outputs.image-owner }}/venv-builder
          artifact-name: digests-venv-builder-${{ steps.platform-pair.outputs.value }}
          digest-dir: /tmp/digests/venv-builder

  # Assembles per-platform digests into multi-arch manifests with attestation.
  merge-base-images:
    needs: [build-base-images, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write  # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    outputs:
      python-base-image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base@${{ steps.merge-python-base.outputs.digest }}
      python-base-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base
      python-base-digest: ${{ steps.merge-python-base.outputs.digest }}
      venv-builder-image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/venv-builder@${{ steps.merge-venv-builder.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and attest python-base
        id: merge-python-base
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base
          artifact-pattern: digests-python-base-*
          digest-dir: /tmp/digests/python-base
          tags: ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base:latest ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base:${{ github.sha }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base:${{ github.sha }}
          sbom-output-file: sbom-python-base.cyclonedx.json
          grype-category: grype-python-base
          scan-mode: ${{ github.event_name == 'pull_request' && 'image' || 'sbom' }}

      - name: Merge and attest venv-builder
        id: merge-venv-builder
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/venv-builder
          artifact-pattern: digests-venv-builder-*
          digest-dir: /tmp/digests/venv-builder
          tags: ghcr.io/${{ needs.prepare.outputs.image-owner }}/venv-builder:latest ghcr.io/${{ needs.prepare.outputs.image-owner }}/venv-builder:${{ github.sha }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/venv-builder:${{ github.sha }}
          sbom-output-file: sbom-venv-builder.cyclonedx.json
          grype-category: grype-venv-builder
          scan-mode: ${{ github.event_name == 'pull_request' && 'image' || 'sbom' }}

  verify-base-images:
    needs: [merge-base-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Pull and verify base images
        env:
          PYTHON_BASE_IMAGE: ${{ needs.merge-base-images.outputs.python-base-image }}
          VENV_BUILDER_IMAGE: ${{ needs.merge-base-images.outputs.venv-builder-image }}
        run: |
          docker pull "$PYTHON_BASE_IMAGE"
          docker pull "$VENV_BUILDER_IMAGE"
          bash tests/container-images/verify_python_base.sh "$PYTHON_BASE_IMAGE"
          bash tests/container-images/verify_venv_builder.sh "$VENV_BUILDER_IMAGE"

  generate-matrix:
    needs: [changes, merge-base-images, verify-base-images]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build-matrix: ${{ steps.matrix.outputs.build-matrix }}
      tempest-matrix: ${{ steps.matrix.outputs.tempest-matrix }}
      tempest-release-matrix: ${{ steps.matrix.outputs.tempest-release-matrix }}
      nova-compute-releases: ${{ steps.matrix.outputs.nova-compute-releases }}
      nova-compute-build-matrix: ${{ steps.matrix.outputs.nova-compute-build-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1

      - name: Generate service×release matrix
        id: matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SERVICES: ${{ needs.changes.outputs.services }}
        run: hack/ci-generate-build-matrix.sh

  build-tempest:
    needs: [changes, lint-dockerfiles, merge-base-images, verify-base-images, generate-matrix, prepare]
    if: needs.changes.outputs.build-tempest == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.tempest-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1

      - name: Resolve Tempest versions
        id: versions
        env:
          MATRIX_RELEASE: ${{ matrix.release }}
        run: |
          # shellcheck disable=SC2129 # deliberate: three independent appends read better here
          echo "tempest=$(hack/resolve-test-ref.sh "releases/${MATRIX_RELEASE}/test-refs.yaml" tempest)" >> "$GITHUB_OUTPUT"
          echo "barbican-tempest-plugin=$(hack/resolve-test-ref.sh "releases/${MATRIX_RELEASE}/test-refs.yaml" barbican-tempest-plugin)" >> "$GITHUB_OUTPUT"
          echo "keystone-tempest-plugin=$(hack/resolve-test-ref.sh "releases/${MATRIX_RELEASE}/test-refs.yaml" keystone-tempest-plugin)" >> "$GITHUB_OUTPUT"
          echo "neutron-tempest-plugin=$(hack/resolve-test-ref.sh "releases/${MATRIX_RELEASE}/test-refs.yaml" neutron-tempest-plugin)" >> "$GITHUB_OUTPUT"

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Build Tempest image
        id: build-tempest
        if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'  # defense-in-depth: matrix already excludes ARM64 on PRs
        uses: ./.github/actions/build-push-image
        with:
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest
          context: images/tempest
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
          build-args: |
            TEMPEST_VERSION=${{ steps.versions.outputs.tempest }}
            BARBICAN_TEMPEST_PLUGIN_VERSION=${{ steps.versions.outputs.barbican-tempest-plugin }}
            KEYSTONE_TEMPEST_PLUGIN_VERSION=${{ steps.versions.outputs.keystone-tempest-plugin }}
            NEUTRON_TEMPEST_PLUGIN_VERSION=${{ steps.versions.outputs.neutron-tempest-plugin }}
          build-contexts: |
            python-base=docker-image://ghcr.io/${{ needs.prepare.outputs.image-owner }}/python-base@${{ needs.merge-base-images.outputs.python-base-digest }}
            venv-builder=docker-image://${{ needs.merge-base-images.outputs.venv-builder-image }}
            upper-constraints=releases/${{ matrix.release }}/
          labels-title: tempest
          labels-description: OpenStack Tempest API testing framework
          cache-scope: tempest-${{ matrix.release }}
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/tempest:{1}', needs.prepare.outputs.image-owner, matrix.release) || format('ghcr.io/{0}/tempest', needs.prepare.outputs.image-owner) }}
          artifact-name: digests-tempest-${{ matrix.release }}-${{ steps.platform-pair.outputs.value }}
          grype-category: grype-tempest-${{ matrix.release }}-${{ steps.platform-pair.outputs.value }}
          image-ref-for-scan: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest:${{ matrix.release }}
          verify-script: tests/container-images/verify_tempest.sh
          verify-image-ref: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest:${{ matrix.release }}

  merge-tempest-image:
    if: github.event_name != 'pull_request'
    needs: [build-tempest, generate-matrix, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.tempest-release-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tempest tags
        id: tempest-tags
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest
          MATRIX_RELEASE: ${{ matrix.release }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TEMPEST_VERSION=$(hack/resolve-test-ref.sh "releases/${MATRIX_RELEASE}/test-refs.yaml" tempest)
          TAGS="${IMAGE}:${MATRIX_RELEASE} ${IMAGE}:${MATRIX_RELEASE}-${COMMIT_SHA}"
          [[ "${GITHUB_REF_NAME}" == "main" ]] && TAGS="${TAGS} ${IMAGE}:${TEMPEST_VERSION}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Merge and attest Tempest
        id: merge-tempest
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest
          artifact-pattern: digests-tempest-${{ matrix.release }}-*
          tags: ${{ steps.tempest-tags.outputs.tags }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/tempest:${{ matrix.release }}-${{ github.sha }}
          sbom-output-file: sbom-tempest-${{ matrix.release }}.cyclonedx.json
          grype-category: grype-tempest-${{ matrix.release }}

