          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/keystone-federation-proxy:pr-verify', needs.prepare.outputs.image-owner) || format('ghcr.io/{0}/keystone-federation-proxy', needs.prepare.outputs.image-owner) }}
