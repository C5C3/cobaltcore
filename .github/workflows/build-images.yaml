    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Reject fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::error::Fork PRs cannot push to GHCR. Open your PR from a branch in the upstream repository." && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Resolve kna commit
        id: kna-commit
        run: |
          commit=$(hack/ci-resolve-kna-commit.sh)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Build kvm-node-agent
        id: build-kna
        # PR mode loads locally for the inline scan+verify; ARM64 is skipped
        # on PRs because docker load supports a single platform.
        if: github.event_name != 'pull_request' || matrix.platform == 'linux/amd64'
        uses: ./.github/actions/build-push-image
        with:
          image-name: ghcr.io/${{ needs.prepare.outputs.image-owner }}/kvm-node-agent
          context: images/kvm-node-agent
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
          # The Dockerfile fetches the upstream source from github.com; the
          # token authenticates that fetch (see images/ovn/Dockerfile). A
          # secret, not a build-arg: it reaches no layer.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels-title: kvm-node-agent
          labels-description: kvm-node-agent built from a pinned upstream main commit with CobaltCore patches
          metadata-tags: |
            type=raw,value=sha-${{ steps.kna-commit.outputs.commit }}
          cache-scope: kna
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/kvm-node-agent:pr-verify', needs.prepare.outputs.image-owner) || format('ghcr.io/{0}/kvm-node-agent', needs.prepare.outputs.image-owner) }}
          artifact-name: digests-kna-${{ steps.platform-pair.outputs.value }}
          grype-category: grype-kna-${{ steps.platform-pair.outputs.value }}
          image-ref-for-scan: ghcr.io/${{ needs.prepare.outputs.image-owner }}/kvm-node-agent:pr-verify
          verify-script: tests/container-images/verify_kna.sh
          verify-image-ref: ghcr.io/${{ needs.prepare.outputs.image-owner }}/kvm-node-agent:pr-verify

  merge-kna-image:
    if: github.event_name != 'pull_request'
    needs: [build-kna, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    outputs:
      kna-image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/kvm-node-agent@${{ steps.merge-kna.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve kna commit
        id: kna-commit
        run: |
          commit=$(hack/ci-resolve-kna-commit.sh)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # sha-<kna-commit> is the tag the upstream chart of that commit renders
      # from its appVersion, upstream-<kna-commit> is the one
      # hack/ghcr-prune-stale-versions.py keeps once a newer pin holds
      # latest. Both and latest are main-only so that two branches building
      # the same pin cannot silently overwrite them;
      # sha-<kna-commit>-<sha> is pushed from every branch.
      - name: Build kna tags
        id: kna-tags
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.image-owner }}/kvm-node-agent
          KNA_COMMIT: ${{ steps.kna-commit.outputs.commit }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAGS="${IMAGE}:sha-${KNA_COMMIT}-${COMMIT_SHA}"
          [[ "${GITHUB_REF_NAME}" == "main" ]] && TAGS="${TAGS} ${IMAGE}:sha-${KNA_COMMIT} ${IMAGE}:upstream-${KNA_COMMIT} ${IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Merge and attest kvm-node-agent
        id: merge-kna
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ghcr.io/${{ needs.prepare.outputs.image-owner }}/kvm-node-agent
          artifact-pattern: digests-kna-*
          tags: ${{ steps.kna-tags.outputs.tags }}
          inspect-tag: ghcr.io/${{ needs.prepare.outputs.image-owner }}/kvm-node-agent:sha-${{ steps.kna-commit.outputs.commit }}-${{ github.sha }}
          sbom-output-file: sbom-kna.cyclonedx.json
          grype-category: grype-kna

  # Runs on both architectures: PR mode compiles amd64 only (docker load takes
  # a single platform), so the arm64 half of the published manifest is first
  # executed here. docker pull resolves the manifest to the runner's own
  # architecture, so the runner is what selects the variant under test.
  verify-kna-image:
    if: github.event_name != 'pull_request'
    needs: [merge-kna-image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Pull and verify kvm-node-agent image
        env:
          KNA_IMAGE: ${{ needs.merge-kna-image.outputs.kna-image }}
        run: |
          docker pull "$KNA_IMAGE"
          bash tests/container-images/verify_kna.sh "$KNA_IMAGE"

  # Per-platform service builds pushed by digest or loaded locally for PR verification.
  build-service-images:
    needs: [changes, merge-base-images, verify-base-images, generate-matrix, prepare]
    if: needs.changes.outputs.has-services == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write  # gh#108: actions/attest v4.1.0 storage record
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout service source
        id: checkout-source
        uses: ./.github/actions/checkout-service-source
        with:
          service: ${{ matrix.service }}
          release: ${{ matrix.release }}

      - name: Resolve extra packages
        id: extra-pkgs
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          MATRIX_RELEASE: ${{ matrix.release }}
        run: hack/ci-resolve-extra-packages.sh

      - name: Derive tags
        id: tags
        uses: ./.github/actions/derive-service-tags
        with:
          service: ${{ matrix.service }}
          release: ${{ matrix.release }}
          repository-owner: ${{ github.repository_owner }}

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Build service image
        id: build-service
        uses: ./.github/actions/build-push-image
        with:
          image-name: ${{ steps.tags.outputs.image }}
          context: images/${{ matrix.service }}
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
          build-args: |
            PIP_EXTRAS=${{ steps.extra-pkgs.outputs.pip-extras }}
            PIP_PACKAGES=${{ steps.extra-pkgs.outputs.pip-packages }}
            EXTRA_APT_PACKAGES=${{ steps.extra-pkgs.outputs.apt-packages }}
          build-contexts: |
            python-base=docker-image://${{ needs.merge-base-images.outputs.python-base-image }}
            venv-builder=docker-image://${{ needs.merge-base-images.outputs.venv-builder-image }}
            ${{ matrix.service }}=src/${{ matrix.service }}
            upper-constraints=releases/${{ matrix.release }}/
          # A Dockerfile that fetches from github.com with the git noble ships
          # mounts this secret into that one RUN (see images/nova/Dockerfile,
          # the only service image doing so today, for the noVNC tree); the
          # others never read it. A secret, not a build-arg: it reaches no
          # layer.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels-title: ${{ matrix.service }}
          labels-description: OpenStack ${{ matrix.service }} service
          metadata-tags: |
            type=raw,value=${{ steps.checkout-source.outputs.source-ref }}
          extra-labels: |
            org.opencontainers.image.base.name=${{ needs.merge-base-images.outputs.python-base-name }}
            org.opencontainers.image.base.digest=${{ needs.merge-base-images.outputs.python-base-digest }}
          cache-scope: ${{ matrix.service }}-${{ matrix.release }}
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          tags: ${{ github.event_name == 'pull_request' && steps.tags.outputs.composite || steps.tags.outputs.image }}
          artifact-name: ${{ github.event_name != 'pull_request' && format('digests-service-{0}-{1}-{2}', matrix.service, matrix.release, steps.platform-pair.outputs.value) || '' }}
          grype-category: ${{ github.event_name == 'pull_request' && format('grype-{0}-{1}', matrix.service, steps.platform-pair.outputs.value) || '' }}
          image-ref-for-scan: ${{ steps.tags.outputs.composite }}
          verify-script: ${{ github.event_name == 'pull_request' && format('tests/container-images/verify_{0}.sh', matrix.service) || '' }}
          verify-image-ref: ${{ steps.tags.outputs.composite }}

      - name: Verify option catalog
        if: github.event_name == 'pull_request' && (matrix.service == 'keystone' || matrix.service == 'glance' || matrix.service == 'neutron' || matrix.service == 'cinder' || matrix.service == 'nova')
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          MATRIX_RELEASE: ${{ matrix.release }}
          IMAGE_REF: ${{ steps.tags.outputs.composite }}
          SOURCE_DIR: src/${{ matrix.service }}
        run: hack/gen-option-catalog.sh --check "$MATRIX_SERVICE" "$MATRIX_RELEASE" "$IMAGE_REF"

  # Assembles per-platform service digests into multi-arch manifests with attestation.
  merge-service-images:
    if: github.event_name != 'pull_request'
    needs: [merge-base-images, build-service-images, generate-matrix, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write  # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        uses: ./.github/actions/derive-service-tags
        with:
          service: ${{ matrix.service }}
          release: ${{ matrix.release }}
          repository-owner: ${{ github.repository_owner }}

      - name: Build service image tags
        id: service-tags
        env:
          COMPOSITE_TAG: ${{ steps.tags.outputs.composite }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
          VERSION_TAG: ${{ steps.tags.outputs.version }}
          RELEASE_TAG: ${{ steps.tags.outputs.release }}
        run: |
          TAGS="${COMPOSITE_TAG} ${SHA_TAG}"
          [[ "${GITHUB_REF_NAME}" == "main" ]] && TAGS="${TAGS} ${VERSION_TAG} ${RELEASE_TAG}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Merge and attest service image
        id: merge-service
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ${{ steps.tags.outputs.image }}
          artifact-pattern: digests-service-${{ matrix.service }}-${{ matrix.release }}-*
          tags: ${{ steps.service-tags.outputs.tags }}
          inspect-tag: ${{ steps.tags.outputs.composite }}
          sbom-output-file: sbom-${{ matrix.service }}.cyclonedx.json
          grype-category: grype-${{ matrix.service }}

  test-service-images:
    needs: [changes, merge-base-images, verify-base-images, generate-matrix]
    if: needs.changes.outputs.has-services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    services:
      mysql:
        image: mysql:9.7
        env: {MYSQL_ROOT_PASSWORD: openstack}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -popenstack" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: openstack, POSTGRES_PASSWORD: openstack}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U openstack" --health-interval=10s --health-timeout=5s --health-retries=5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout service source
        id: checkout-source
        uses: ./.github/actions/checkout-service-source
        with:
          service: ${{ matrix.service }}
          release: ${{ matrix.release }}

      - name: Resolve pip extras
        id: pip-extras
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          MATRIX_RELEASE: ${{ matrix.release }}
        run: |
          extras=$(yq -r ".\"${MATRIX_SERVICE}\".pip_extras // [] | join(\",\")" "releases/${MATRIX_RELEASE}/extra-packages.yaml")
          echo "install_spec=.${extras:+[$extras]}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Run tests
        env:
          SERVICE_NAME: ${{ matrix.service }}
          SERVICE_VERSION: ${{ steps.checkout-source.outputs.source-ref }}
          INSTALL_SPEC: ${{ steps.pip-extras.outputs.install_spec }}
          VENV_BUILDER_IMAGE: ${{ needs.merge-base-images.outputs.venv-builder-image }}
          RELEASE: ${{ matrix.release }}
          OS_TEST_DBAPI_ADMIN_CONNECTION: "sqlite://;mysql+pymysql://root:openstack@127.0.0.1/;postgresql+psycopg2://openstack:openstack@127.0.0.1/openstack"
        run: hack/ci-run-unit-tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.service }}-${{ matrix.release }}
          path: results/testresults.subunit
          retention-days: 30

  verify-service-images:
    if: github.event_name != 'pull_request'
    needs: [merge-service-images, test-service-images, generate-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'
      - name: Derive tags
        id: tags
        uses: ./.github/actions/derive-service-tags
        with:
          service: ${{ matrix.service }}
          release: ${{ matrix.release }}
          repository-owner: ${{ github.repository_owner }}

      - name: Pull and verify service image
        env:
          IMAGE_REF: ${{ steps.tags.outputs.composite }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          docker pull "$IMAGE_REF"
          bash "tests/container-images/verify_${SERVICE_NAME}.sh" "$IMAGE_REF"

      - name: Verify option catalog
        if: matrix.service == 'keystone' || matrix.service == 'glance' || matrix.service == 'neutron' || matrix.service == 'cinder' || matrix.service == 'nova'
        env:
          MATRIX_SERVICE: ${{ matrix.service }}
          MATRIX_RELEASE: ${{ matrix.release }}
          IMAGE_REF: ${{ steps.tags.outputs.composite }}
        run: hack/gen-option-catalog.sh --check "$MATRIX_SERVICE" "$MATRIX_RELEASE" "$IMAGE_REF"

  # The compute image of images/nova-compute/, built from nova's source pin
  # with nova's patches and constraints. Jobs of its own rather than steps in
  # the nova leg of build-service-images: a failed leg there skips
  # merge-service-images for every service.
  build-nova-compute-image:
    needs: [merge-base-images, verify-base-images, generate-matrix, prepare]
    if: needs.generate-matrix.outputs.nova-compute-releases != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write  # gh#108: actions/attest v4.1.0 storage record
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.nova-compute-build-matrix) }}
    # The release verify_nova_compute.sh compares the binding's pin for; a
    # branch or SHA pin leaves nova a version no source-refs.yaml carries. Set
    # on the job because build-push-image runs the script with its environment.
    env:
      NOVA_COMPUTE_RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout service source
        id: checkout-source
        uses: ./.github/actions/checkout-service-source
        with:
          service: nova
          release: ${{ matrix.release }}

      - name: Resolve extra packages
        id: extra-pkgs
        env:
          MATRIX_SERVICE: nova-compute
          MATRIX_RELEASE: ${{ matrix.release }}
        run: hack/ci-resolve-extra-packages.sh

      - name: Derive tags
        id: tags
        uses: ./.github/actions/derive-service-tags
        with:
          service: nova
          image: nova-compute
          release: ${{ matrix.release }}
          repository-owner: ${{ github.repository_owner }}

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform }}

      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'

      - name: Build compute image
        id: build-nova-compute
        uses: ./.github/actions/build-push-image
        with:
          image-name: ${{ steps.tags.outputs.image }}
          context: images/nova-compute
          platform: ${{ matrix.platform }}
          platform-pair: ${{ steps.platform-pair.outputs.value }}
          build-args: |
            PIP_EXTRAS=${{ steps.extra-pkgs.outputs.pip-extras }}
            PIP_PACKAGES=${{ steps.extra-pkgs.outputs.pip-packages }}
            EXTRA_APT_PACKAGES=${{ steps.extra-pkgs.outputs.apt-packages }}
          build-contexts: |
            python-base=docker-image://${{ needs.merge-base-images.outputs.python-base-image }}
            venv-builder=docker-image://${{ needs.merge-base-images.outputs.venv-builder-image }}
            nova=src/nova
            upper-constraints=releases/${{ matrix.release }}/
          labels-title: nova-compute
          labels-description: OpenStack nova-compute with the libvirt driver and host storage tooling
          metadata-tags: |
            type=raw,value=${{ steps.checkout-source.outputs.source-ref }}
          extra-labels: |
            org.opencontainers.image.base.name=${{ needs.merge-base-images.outputs.python-base-name }}
            org.opencontainers.image.base.digest=${{ needs.merge-base-images.outputs.python-base-digest }}
          cache-scope: nova-compute-${{ matrix.release }}
          push-by-digest: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          tags: ${{ github.event_name == 'pull_request' && steps.tags.outputs.composite || steps.tags.outputs.image }}
          artifact-name: ${{ github.event_name != 'pull_request' && format('digests-nova-compute-{0}-{1}', matrix.release, steps.platform-pair.outputs.value) || '' }}
          grype-category: ${{ github.event_name == 'pull_request' && format('grype-nova-compute-{0}', steps.platform-pair.outputs.value) || '' }}
          image-ref-for-scan: ${{ steps.tags.outputs.composite }}
          verify-script: ${{ github.event_name == 'pull_request' && 'tests/container-images/verify_nova_compute.sh' || '' }}
          verify-image-ref: ${{ steps.tags.outputs.composite }}

  # Assembles the per-platform compute digests into one multi-arch manifest
  # per release. The artifact pattern cannot match nova's own digests, which
  # are named digests-service-nova-<release>-*.
  merge-nova-compute-image:
    if: github.event_name != 'pull_request'
    needs: [build-nova-compute-image, generate-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
      attestations: write #: GitHub Attestations API
      artifact-metadata: write  # gh#108: actions/attest v4.1.0 storage record
      security-events: write #: GitHub Security tab SARIF upload
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.generate-matrix.outputs.nova-compute-releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        uses: ./.github/actions/derive-service-tags
        with:
          service: nova
          image: nova-compute
          release: ${{ matrix.release }}
          repository-owner: ${{ github.repository_owner }}

      - name: Build compute image tags
        id: compute-tags
        env:
          COMPOSITE_TAG: ${{ steps.tags.outputs.composite }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
          VERSION_TAG: ${{ steps.tags.outputs.version }}
          RELEASE_TAG: ${{ steps.tags.outputs.release }}
        run: |
          TAGS="${COMPOSITE_TAG} ${SHA_TAG}"
          [[ "${GITHUB_REF_NAME}" == "main" ]] && TAGS="${TAGS} ${VERSION_TAG} ${RELEASE_TAG}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Merge and attest compute image
        id: merge-nova-compute
        uses: ./.github/actions/merge-manifest-and-attest
        with:
          image: ${{ steps.tags.outputs.image }}
          artifact-pattern: digests-nova-compute-${{ matrix.release }}-*
          tags: ${{ steps.compute-tags.outputs.tags }}
          inspect-tag: ${{ steps.tags.outputs.composite }}
          sbom-output-file: sbom-nova-compute-${{ matrix.release }}.cyclonedx.json
          grype-category: grype-nova-compute-${{ matrix.release }}

  # Runs on both architectures, as verify-ovn-image does: pull requests build
  # amd64 only (docker load takes a single platform), so the arm64 build of
  # the compiled libvirt binding is first executed here. docker pull resolves
  # the manifest to the runner's own architecture, so the runner is what
  # selects the variant under test.
  verify-nova-compute-image:
    if: github.event_name != 'pull_request'
    needs: [merge-nova-compute-image, generate-matrix]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.generate-matrix.outputs.nova-compute-releases) }}
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          install-cosign: 'false'
      - name: Derive tags
        id: tags
        uses: ./.github/actions/derive-service-tags
        with:
          service: nova
          image: nova-compute
          release: ${{ matrix.release }}
          repository-owner: ${{ github.repository_owner }}

      - name: Pull and verify compute image
        env:
          IMAGE_REF: ${{ steps.tags.outputs.composite }}
          NOVA_COMPUTE_RELEASE: ${{ matrix.release }}
        run: |
          docker pull "$IMAGE_REF"
          bash tests/container-images/verify_nova_compute.sh "$IMAGE_REF"
