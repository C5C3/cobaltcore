          verify-image-ref: ghcr.io/${{ needs.prepare.outputs.image-owner }}/keystone-federation-proxy:pr-verify

  merge-keystone-federation-proxy-image:
    if: github.event_name != 'pull_request'
    needs: [build-keystone-federation-proxy, prepare]
