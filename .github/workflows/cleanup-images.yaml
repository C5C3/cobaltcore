---
name: Cleanup Images

# Retention is decided from each package version's whole tag set, not from a
# "keep the newest N" counter: a version survives only while it carries `latest`
# or a bare version / release tag (`32.0.0`, `2026.1`). Everything else -- SHA
# tags, run-scoped E2E tags, composite tags whose release tag has since moved to
# a newer manifest, and untagged leftovers -- is a build artifact with a
# successor and goes.
#
# The three jobs share one implementation (hack/ghcr-prune-stale-versions.py)
# and differ only in which candidates they consider. The two narrow jobs run
# first so the bulk of the backlog is gone under a readable per-class log before
# the general sweep spends its deletion budget.

"on":
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print what would be deleted without deleting it"
        required: false
        default: false
        type: boolean
      min-age-hours:
        description: "Skip versions younger than this many hours"
        required: false
        default: "24"
        type: string
      max-deletions:
        description: "Maximum deletions per package per job ('0' for no cap)"
        required: false
        default: "500"
        type: string
      packages:
        description: "Restrict the run to these packages (comma-separated; empty means all)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_PRUNE_DRY_RUN: ${{ inputs.dry-run || false }}
  MIN_AGE_HOURS: ${{ inputs.min-age-hours || '24' }}
  MAX_DELETIONS: ${{ inputs.max-deletions || '500' }}

jobs:
  # The package lists come from images/ and operators/ rather than from a
  # hardcoded matrix. keystone-federation-proxy accumulated 352 stale E2E tags
  # because it was missing from every hand-maintained list; deriving them means
  # a newly onboarded service cannot lose its cleanup coverage.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.matrix.outputs.cleanup-packages }}
      e2e-packages: ${{ steps.matrix.outputs.cleanup-e2e-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate cleanup package matrix
        id: matrix
        env:
          CLEANUP_PACKAGES: ${{ inputs.packages }}
        run: hack/ci-generate-cleanup-matrix.sh

  # ── 1. Run-scoped E2E tags ─────────────────────────────────────────
  # ci.yaml's cleanup-e2e-tags prunes these at the end of each run; a run that
  # is cancelled first leaks them. This is the safety net (GH-310).
  cleanup-e2e-stale-tags:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.e2e-packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prune stale e2e-* tags for ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 hack/ghcr-prune-stale-versions.py \
            --org "${{ github.repository_owner }}" \
            --package "${{ matrix.package }}" \
            --only-tag-pattern '^e2e-' \
            --min-age-hours "${MIN_AGE_HOURS}" \
            --max-deletions "${MAX_DELETIONS}"

  # ── 2. Commit-SHA tags ─────────────────────────────────────────────
  # Every publishing path leaves one behind: <sha7> on service images, <sha40>
  # on base images, sha-<sha40> on operator images, <release>-<sha40> on
  # tempest. A SHA tag that shares its manifest with a release tag is kept --
  # the keeper rule outranks the pattern.
  cleanup-sha-tags:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prune commit-SHA tags for ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 hack/ghcr-prune-stale-versions.py \
            --org "${{ github.repository_owner }}" \
            --package "${{ matrix.package }}" \
            --only-sha-tags \
            --min-age-hours "${MIN_AGE_HOURS}" \
            --max-deletions "${MAX_DELETIONS}"

  # ── 3. Full retention sweep ────────────────────────────────────────
  # Whatever the two narrow jobs did not name: composite tags left behind when
  # a newer build took the release tag, `dev`, orphaned per-platform manifests,
  # and cosign artifacts whose subject is gone. Runs last so the deletion cap
  # is spent on the leftovers rather than on the bulk classes above.
  cleanup-stale-versions:
    needs: [prepare, cleanup-e2e-stale-tags, cleanup-sha-tags]
    # Ordering, not gating: one package failing to prune its SHA tags is no
    # reason to leave every other package unswept.
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sweep versions without a keeper tag for ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 hack/ghcr-prune-stale-versions.py \
            --org "${{ github.repository_owner }}" \
            --package "${{ matrix.package }}" \
            --min-age-hours "${MIN_AGE_HOURS}" \
            --max-deletions "${MAX_DELETIONS}"
