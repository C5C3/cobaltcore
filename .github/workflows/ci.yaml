---
name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  # The nightly chaos run (#1388): every e2e-chaos leg and e2e-chaos-random
  # (#1395) against main, and nothing else; it ends before Performance (01:30)
  # and the Flux path (02:45). report-nightly-chaos files a red scheduled
  # night; a dispatch (gh workflow run ci.yaml --ref main) files nothing.
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The workflows the E2E jobs call do not inherit this env: each declares the
# REGISTRY, IMAGE_PREFIX and KIND_CLUSTER it reads, and the create-kind-cluster
# action installs the kind of hack/install-test-deps.sh.
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/c5c3
  # Pin tool versions for CI reproducibility (single source of truth).
  CONTROLLER_GEN_VERSION: v0.22.0
  GOFUMPT_VERSION: v0.12.0
  GOLANGCI_LINT_VERSION: v2.14.0
  # The helm of every azure/setup-helm job. Unpinned, a helm release would change
  # how helm-push talks to ghcr.io without a commit. Renovate bumps it without
  # automerge: helm-push runs only after a merge.
  HELM_VERSION: v4.3.1

# A `labeled` event for a label that does not steer CI gets a group of its own,
# so a triage label no longer cancels the pipeline in flight; the changes job
# resolves it to nothing. A ci:* label (or run-chaos) supersedes the run in
# flight. The group names the event, so a night never delays or cancels main's
# push run, and a second dispatch waits for the first.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && !startsWith(github.event.label.name, 'ci:') && github.event.label.name != 'run-chaos' && format('noop-{0}', github.run_id) || format('{0}-{1}-{2}', github.ref, github.workflow, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Match the changed paths against .github/ci-filters.yaml, then resolve them
  # into one flag per job and the legs of each matrix (hack/ci-resolve-changes.sh,
  # which also says how to add an operator). A job runs when one of ITS OWN
  # inputs changed: the code it tests, the images it loads, the suite it runs,
  # the scripts it calls. Labels only add: ci:full runs everything; ci:tempest,
  # ci:chaos (alias run-chaos), ci:controlplane, ci:multicluster and ci:pressure
  # one area each; ci:measure-sizing the VPA sizing measurement. A change to the
  # shared e2e substrate or the workflow plumbing runs a canary, e2e-infra and
  # the keystone leg. A triage label resolves to nothing (noop). A tag push
  # forces every area and operator, a push to main keeps the publish matrix,
  # and a scheduled or dispatched run is the nightly chaos run alone.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      noop: ${{ steps.result.outputs.noop }}
      go: ${{ steps.result.outputs.go }}
      docs: ${{ steps.result.outputs.docs }}
      helm: ${{ steps.result.outputs.helm }}
      target-cluster-chart: ${{ steps.result.outputs.target-cluster-chart }}
      e2e-infra: ${{ steps.result.outputs.e2e-infra }}
      e2e-chaos: ${{ steps.result.outputs.e2e-chaos }}
      e2e-chaos-random: ${{ steps.result.outputs.e2e-chaos-random }}
      e2e-prometheus: ${{ steps.result.outputs.e2e-prometheus }}
      e2e-controlplane: ${{ steps.result.outputs.e2e-controlplane }}
      e2e-controlplane-sso: ${{ steps.result.outputs.e2e-controlplane-sso }}
      e2e-external-keystone: ${{ steps.result.outputs.e2e-external-keystone }}
      e2e-autoscaling: ${{ steps.result.outputs.e2e-autoscaling }}
      e2e-multicluster: ${{ steps.result.outputs.e2e-multicluster }}
      e2e-orders-multicluster: ${{ steps.result.outputs.e2e-orders-multicluster }}
      e2e-ovn-overlay: ${{ steps.result.outputs.e2e-ovn-overlay }}
      e2e-nova-libvirt: ${{ steps.result.outputs.e2e-nova-libvirt }}
      e2e-bgp-fabric: ${{ steps.result.outputs.e2e-bgp-fabric }}
      keystone-pressure: ${{ steps.result.outputs.keystone-pressure }}
      e2e-operator-upgrade: ${{ steps.result.outputs.e2e-operator-upgrade }}
      tempest: ${{ steps.result.outputs.tempest }}
      measure-sizing: ${{ steps.result.outputs.measure-sizing }}
      actionlint: ${{ steps.result.outputs.actionlint }}
      changed-operators: ${{ steps.result.outputs.changed-operators }}
      changed-services: ${{ steps.result.outputs.changed-services }}
      changed-tempest: ${{ steps.result.outputs.changed-tempest }}
      changed-proxy: ${{ steps.result.outputs.changed-proxy }}
      changed-ovn: ${{ steps.result.outputs.changed-ovn }}
      changed-libvirt: ${{ steps.result.outputs.changed-libvirt }}
      build-e2e-images: ${{ steps.result.outputs.build-e2e-images }}
      has-e2e-operators: ${{ steps.result.outputs.has-e2e-operators }}
      e2e-operators: ${{ steps.result.outputs.e2e-operators }}
      e2e-operator-legs: ${{ steps.e2e-operator-legs.outputs.legs }}
      e2e-operator-upgrade-operators: ${{ steps.result.outputs.e2e-operator-upgrade-operators }}
      test-targets: ${{ steps.result.outputs.test-targets }}
      tempest-releases: ${{ steps.tempest-matrix.outputs.tempest-releases }}
      keystone-pressure-releases: ${{ steps.keystone-pressure-matrix.outputs.keystone-pressure-releases }}
      cleanup-e2e-packages: ${{ steps.cleanup-matrix.outputs.cleanup-e2e-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # A night has no change set; its outputs read as empty strings.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: .github/ci-filters.yaml
      # Extracted to hack/ci-resolve-changes.sh (review #2 comment 3).
      - name: Resolve effective changes
        id: result
        env:
          ALL_OPERATORS: keystone c5c3 horizon glance placement barbican ovn neutron cinder nova
          # The operators that ship an OpenStack service image: the keys in
          # releases/*/source-refs.yaml that name an operator in ALL_OPERATORS
          # above. A service image can land a phase before its operator, so a
          # key without an operator waits here. Pinned by
          # tests/unit/ci/change_classes_wiring_test.sh.
          SERVICE_OPERATORS: keystone horizon glance placement barbican neutron cinder nova
          # The operator whose e2e leg stands in for the pipeline when the shared
          # substrate or the workflow plumbing changes.
          CANARY_OPERATOR: keystone
          # toJSON, not join: GitHub expression literals carry no escape
          # sequences, so join(..., '\n') would join on a literal backslash-n.
          # The resolver reads null and any non-array as an empty label set.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          # The names of the filters that matched, as a JSON array. The
          # resolver reads each one as FILTER_<name>=true.
          MATCHED_FILTERS: ${{ steps.filter.outputs.changes }}
        run: hack/ci-resolve-changes.sh
      # Derive Tempest release matrix from releases/ directories (review #1).
      # Avoids hardcoding releases in the workflow — adding or removing a release
      # only requires updating releases/ and tests/tempest/, not this file.
      - name: Generate Tempest release matrix
        id: tempest-matrix
        # The generator still checks every service's config directory for every
        # release; TEMPEST_SERVICES only narrows what it emits.
        env:
          TEMPEST_SERVICES: ${{ join(fromJson(steps.result.outputs.tempest-services), ' ') }}
        run: hack/ci-generate-tempest-matrix.sh

      # One keystone-pressure leg per release that ships a Keystone image, read
      # from releases/*/source-refs.yaml for the same reason: adding a release
      # must not require an edit here.
      - name: Generate keystone-pressure release matrix
        id: keystone-pressure-matrix
        run: |
          releases="$(OPERATOR=keystone hack/ci-service-image-releases.sh)"
          echo "keystone-pressure-releases=$(jq -Rnc '{release: [inputs | select(length > 0)]}' <<<"${releases}")" >>"$GITHUB_OUTPUT"

      # Derive the GHCR package list from images/ and operators/ for the same
      # reason: onboarding a service must not require remembering to add it to
      # a cleanup matrix by hand.
      - name: Generate cleanup package matrix
        id: cleanup-matrix
        run: hack/ci-generate-cleanup-matrix.sh

      # The e2e-operator job runs one leg per operator in e2e-operators, except
      # nova, whose suites run as two shards on two kind clusters (see "Run E2E
      # tests" there). The publish jobs read e2e-operators and must see nova
      # once, so the shards live in an output of their own.
      - name: Shard the e2e-operator matrix
        id: e2e-operator-legs
        env:
          E2E_OPERATORS: ${{ steps.result.outputs.e2e-operators }}
        run: |
          legs=$(jq -c '{include: [.operator[] | if . == "nova"
            then {operator: ., shard: "1"}, {operator: ., shard: "2"}
            else {operator: .} end]}' <<<"${E2E_OPERATORS}")
          echo "legs=${legs}" >>"$GITHUB_OUTPUT"

  lint:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version-file: go.work
      # Cache golangci-lint result cache — golangci-lint-action with install-only:true
      # does not manage the analysis cache itself, so we persist it explicitly.
      # Include Go and golangci-lint versions so upgrades automatically invalidate.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $HOME/.cache/golangci-lint
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-
            ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-golangci-
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: Run lint
        run: make lint

  # Verify all Go files conform to gofumpt formatting.
  # Runs gofumpt -l to detect non-conforming files, then prints a unified
  # diff (gofumpt -d) on failure so developers can see exactly what to fix.
  format-check:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version-file: go.work
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gofumpt-cache
        with:
          path: $HOME/go/bin/gofumpt
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-gofumpt-${{ env.GOFUMPT_VERSION }}
      - name: Install gofumpt
        if: steps.gofumpt-cache.outputs.cache-hit != 'true'
        run: go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
      # Only check git-tracked Go files to skip generated, vendored,
      # or tooling code that may not follow gofumpt conventions (review #1).
      - name: Check formatting
        run: |
          unformatted=$(git ls-files '*.go' | xargs -r gofumpt -l)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofumpt:"
            echo "$unformatted"
            git ls-files '*.go' | xargs -r gofumpt -d
            exit 1
          fi

  # shellcheck over the scripts of make shellcheck, on every pull request.
  shellcheck:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck on hack/*.sh, operator rotation scripts and the BGP fabric lab
        run: make shellcheck

  # Always on: the tracked tree carries no internal feature or requirement ID
  # (CC-NNNN / REQ-NNN).
  feature-ids:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the tree is free of internal feature/requirement IDs
        run: make check-feature-ids

  # Always on: no file carries more unresolved "Reviewer: please …" markers
  # than its baseline in scripts/review-markers-baseline.txt.
  review-markers:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check no new unresolved reviewer markers were introduced
        run: make check-review-markers

  # Run every shell unit test under tests/unit/ (every *_test.sh,
  # found by discovery) through bats, one bats test per script, across
  # every CPU of the runner. Repo files only — adds no injection surface.
  # make test-shell installs bats with `make install-bats` at the
  # BATS_VERSION / BATS_COMMIT pin of the Makefile; GNU parallel and
  # flock, which bats needs for more than one worker, come from the
  # runner image. TEST_SHELL_JOBS is set, so a runner image without them
  # fails the job instead of running it serially.
  # ubuntu-latest preinstalls bash, jq, mikefarah/yq, perl, npx; kustomize
  # is installed explicitly so deploy/ overlay tests run the full assertion
  # set instead of skipping their kustomize-build checks. The renovate/
  # tests pull renovate-config-validator via npx, taking ~30s on a cold
  # runner. The serial run took 9 to 13 minutes and bats takes about 4 to
  # 6, so 10 minutes leave room for a cold npx download. The JUnit report
  # is uploaded on every outcome.
  test-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=v5.4.3
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin
      - name: Run shell unit tests
        run: TEST_SHELL_JOBS="$(nproc)" make test-shell
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shell-junit-report
          path: _output/test-shell/report.xml
          retention-days: 14

  # The invalid-CR Chainsaw fixtures match their generator (_generate.py
  # --check) and chainsaw-test.yaml, before any cluster-bound job runs.
  verify-invalid-cr-fixtures:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify invalid-CR fixture drift and structure
        run: make verify-invalid-cr-fixtures

  # chainsaw lint over every Chainsaw test and config, so schema drift fails
  # before a kind cluster starts.
  chainsaw-lint:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-test-deps
      - name: Run chainsaw lint
        run: make chainsaw-lint

  # Static-lint every workflow file. actionlint resolves the expression
  # contexts, so a `needs.changes.outputs.<name>` that no job exports fails here
  # rather than silently evaluating to the empty string and leaving a job
  # unscheduled — the failure mode the change classes above are built on. It
  # also runs shellcheck over every `run:` script. `self-hosted` is a built-in
  # label; a custom runner pool would have to be declared in
  # .github/actionlint.yaml before it can be used in `runs-on:`.
  actionlint:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.actionlint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned and checksummed like the yq install in verify-container-images.yaml.
      # Renovate bumps ACTIONLINT_VERSION; the checksum then fails until it is
      # updated with it, which is the intended signal.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version
      - name: Lint workflows
        run: actionlint -no-color

  # Matrix over [common, keystone, c5c3] to deduplicate common coverage
  # into a single leg (review comment #7/#8).
  test:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.test-targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Run unit tests
        run: |
          if [ "${{ matrix.target }}" = "common" ]; then
            make test-common
          else
            make test-operator OPERATOR=${{ matrix.target }}
          fi
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: cover-unit-${{ matrix.target }}.out
          flags: unit-${{ matrix.target }}
          fail_ci_if_error: false

  # Integration tests with envtest, coverage uploaded to Codecov
  # Includes internal/common to meet 80% codecov target (review comment #5).
  test-integration:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    # envtest is CPU-bound, hence the larger runner. The c5c3 suite takes about
    # 22 minutes; the job wall sits above the Makefile's 30-minute go-test
    # timeout, so a hung suite still panics with a goroutine dump.
    runs-on: self-hosted
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.test-targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      # Derive the envtest k8s version from the Makefile (single source of truth).
      - name: Get envtest k8s version
        id: envtest-ver
        run: echo "version=$(awk '/ENVTEST_K8S_VERSION/ {print $NF; exit}' Makefile)" >> "$GITHUB_OUTPUT"
      # Cache kubebuilder envtest assets (etcd, kube-apiserver binaries).
      # Key on the k8s version — invalidates automatically when Makefile changes it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $HOME/.local/share/kubebuilder-envtest
          key: ${{ runner.os }}-envtest-${{ steps.envtest-ver.outputs.version }}
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
      - name: Run integration tests
        run: |
          if [ "${{ matrix.target }}" = "common" ]; then
            make test-integration-common
          else
            make test-integration OPERATOR=${{ matrix.target }}
          fi
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: cover-integration-${{ matrix.target }}.out
          flags: integration-${{ matrix.target }}
          fail_ci_if_error: false

  # Race condition detection for Go tests.
  # Runs all unit tests with -race to catch data races in concurrent operator code
  # (reconcilers, watches, informer caches). Separate from the main test job because
  # the race detector adds 2-5x overhead. Uses -count=1 to disable test caching —
  # race conditions are non-deterministic, so cached results could mask real races.
  test-race:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Run race-detected tests
        run: make test-race RACE_FLAGS="-count=1"

  # Scan Go modules for reachable vulnerabilities using govulncheck.
  # govulncheck is the official Go vulnerability scanner maintained by the Go
  # team — it detects actually reachable vulnerable code paths, not just
  # dependency list matches.  Uses @latest intentionally (not pinned) because
  # the vulnerability database is updated frequently and pinning an old version
  # defeats the purpose of vulnerability scanning.
  govulncheck:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: make govulncheck

  # Verify generated code (CRD manifests, deepcopy) is committed
  # and up-to-date. Fails if make manifests or make generate produces uncommitted diffs.
  verify-codegen:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version-file: go.work
      # Verify every workspace member's go.mod/go.sum matches what go mod tidy
      # writes. It needs only the Go toolchain, so it runs ahead of code
      # generation: an untidy module is a clearer failure here than as an
      # anonymous line in the diff at the end of this job.
      - name: Verify Go modules are tidy
        run: make verify-go-tidy
      # The vendor hash of each operator image (operators/<op>/vendor.json)
      # derives from the go.mod and go.sum files of the operator, its
      # siblings and internal/common. The check runs no Nix, so a Renovate
      # gomod bump fails here in seconds, naming make nix-lock, until the
      # regenerated files are pushed.
      - name: Verify the operator vendor hashes
        run: make nix-lock-check-operators
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: controller-gen-cache
        with:
          path: $HOME/go/bin/controller-gen
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-controller-gen-${{ env.CONTROLLER_GEN_VERSION }}
      - name: Install controller-gen
        if: steps.controller-gen-cache.outputs.cache-hit != 'true'
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@${{ env.CONTROLLER_GEN_VERSION }}
      - name: Run code generation
        run: |
          make manifests
          make generate
      # Verify Helm chart CRD copies match controller-gen output.
      - name: Verify CRD sync
        run: make verify-crd-sync
      # Verify the chart RBAC rules templates match the controller-gen
      # ClusterRole that make manifests just regenerated from the markers.
      - name: Verify Helm RBAC rules sync
        # The generator reads controller-gen YAML with PyYAML, which the
        # ubuntu runner image ships; the fallback covers an image without it.
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          make verify-helm-rbac
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'make manifests && make generate' and commit the result."
            exit 1
          fi

  docs:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build documentation
        run: npm run docs:build

  # Build cobaltcore.dev with the docs of the pull request: cobaltcore-dev/docs
  # renders the pages docs/.vitepress/publish.json lists from a checkout of
  # docs/, tests/ and deploy/. Until it has docs/.vitepress/overlay.ts the job
  # ends with a notice. It builds another repository's default branch, so it
  # never blocks a merge, and neither checkout persists its token.
  docs-overlay:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out cobaltcore-dev/docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cobaltcore-dev/docs
          path: site
          persist-credentials: false
      - name: Check whether cobaltcore-dev/docs reads the overlay
        id: consumer
        run: |
          if [ -f site/docs/.vitepress/overlay.ts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::cobaltcore-dev/docs has no docs/.vitepress/overlay.ts and does not render these docs yet; skipping the cobaltcore.dev build"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the docs of the pull request
        if: steps.consumer.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: site/docs/_upstream/cobaltcore
          persist-credentials: false
          sparse-checkout: |
            docs
            tests
            deploy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.consumer.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        if: steps.consumer.outputs.ready == 'true'
        working-directory: site
        run: npm ci
      - name: Build cobaltcore.dev
        if: steps.consumer.outputs.ready == 'true'
        working-directory: site
        run: npm run docs:build

  # helm lint, helm template over the scenarios below and helm-unittest for every
  # chart under operators/*/helm/, after checking the generated schema and RBAC
  # templates, and a render with the values.yaml of each released chart.
  helm-validate:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install helm-unittest plugin
        # NOTE: --verify=false because helm-unittest does not publish GPG signatures for plugin releases.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false
      - name: Verify values.schema.json is generated from the shared source
        run: make verify-helm-schema
      - name: Verify the RBAC rules templates are generated from config/rbac
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          make verify-helm-rbac
      - name: Build chart dependencies (vendor operator-library)
        run: make helm-deps
      - name: Helm lint
        run: |
          for chart in operators/*/helm/*-operator operators/*/helm/*-testbed; do
            echo "--- lint $chart ---"
            helm lint "$chart"
          done
      - name: Helm template
        run: |
          for chart in operators/*/helm/*-operator operators/*/helm/*-testbed; do
            echo "=== $chart ==="
            echo "--- Scenario 1: default values ---"
            helm template test "$chart"
            echo "--- Scenario 2: webhook disabled ---"
            helm template test "$chart" --set webhook.enabled=false
            echo "--- Scenario 3: external service account ---"
            helm template test "$chart" --set serviceAccount.create=false --set serviceAccount.name=existing-sa
            echo "--- Scenario 4: custom resources ---"
            helm template test "$chart" --set resources.limits.cpu=100m --set resources.limits.memory=64Mi
            # A chart may refuse the mode by design (ovn-operator watches
            # cluster-scoped Nodes; c5c3-operator watches cluster-scoped
            # Namespaces, SizingProfiles and ClusterSecretStores;
            # neutron-operator reads across namespaces):
            # it overrides the operator-library.chart.namespaceScopedUnsupported
            # hook, the shared Role template fails the render with the
            # documented "is not supported by <chart>" message, and the chart's
            # role_test.yaml pins that message. Such a refusal passes here;
            # any other render failure still fails the job.
            echo "--- Scenario 5: namespace-scoped RBAC ---"
            if ! out=$(helm template test "$chart" --set rbac.namespaceScoped=true --set webhook.enabled=false 2>&1); then
              if grep -q "rbac.namespaceScoped=true is not supported by" <<<"$out"; then
                echo "chart refuses namespace-scoped RBAC by design:"
                grep "is not supported by" <<<"$out"
              else
                echo "$out"
                exit 1
              fi
            fi
            # Renders the placement keys, which proves every chart's generated
            # schema admits nodeSelector, tolerations and priorityClassName,
            # then checks that they reach the Deployment's pod spec: a chart
            # with its own deployment.yaml would accept the keys and drop them.
            # The helm call stays alone on its line because the cinder and nova
            # matrix tests read each scenario's flags from it.
            echo "--- Scenario 6: node placement ---"
            out=$(
              helm template test "$chart" --set priorityClassName=cobaltcore-platform --set nodeSelector.role=platform --set tolerations[0].key=role --set tolerations[0].operator=Equal --set tolerations[0].value=platform --set tolerations[0].effect=NoSchedule
            )
            placed=$(yq 'select(.kind == "Deployment") | .spec.template.spec | .priorityClassName + " " + .nodeSelector.role + " " + .tolerations[0].key' <<<"$out")
            if [ "$placed" != "cobaltcore-platform platform role" ]; then
              echo "::error::$chart does not render the placement keys into its Deployment (got: $placed)"
              exit 1
            fi
            # Renders the standalone webhook release, then checks that its
            # ClusterRole is the generated webhook rule set, which names no
            # secrets, and that the Deployment runs without controllers and
            # without a lease. yq ea reads every document at once, and the
            # resources and args are matched element by element: contains()
            # matches substrings, so barbicansecretstores would read as
            # secrets. The helm call stays alone on its line for the cinder
            # and nova matrix tests.
            echo "--- Scenario 7: standalone webhook ---"
            out=$(
              helm template test "$chart" --set webhook.standalone=true
            )
            grants_secrets=$(yq ea '[select(.kind == "ClusterRole") | .rules[].resources[]] | any_c(. == "secrets")' <<<"$out")
            standalone_args=$(yq ea '[select(.kind == "Deployment") | .spec.template.spec.containers[0].args[]] | (any_c(. == "--enable-controllers=false") and all_c(. != "--leader-elect"))' <<<"$out")
            if [ "$grants_secrets" != "false" ] || [ "$standalone_args" != "true" ]; then
              echo "::error::$chart grants secrets to the standalone webhook or renders its arguments wrong (secrets: $grants_secrets, args: $standalone_args)"
              exit 1
            fi
            # Renders the disruption budget keys. Each count alone must reach
            # the PodDisruptionBudget without the other: the other count left
            # set in the chart's values.yaml would merge with it, and the
            # schema rejects the pair. A render that skips the schema must take
            # maxUnavailable over minAvailable, and enabled=false must render
            # no budget. Each helm call stays alone on its line for the cinder
            # and nova matrix tests.
            echo "--- Scenario 8: disruption budget ---"
            budget='select(.kind == "PodDisruptionBudget") | .spec | del(.selector)'
            out=$(
              helm template test "$chart" --set podDisruptionBudget.maxUnavailable=1
            )
            alone=$(yq -o json -I0 "$budget" <<<"$out")
            out=$(
              helm template test "$chart" --set podDisruptionBudget.minAvailable=1
            )
            min_alone=$(yq -o json -I0 "$budget" <<<"$out")
            out=$(
              helm template test "$chart" --skip-schema-validation --set podDisruptionBudget.minAvailable=1 --set podDisruptionBudget.maxUnavailable=2
            )
            both=$(yq -o json -I0 "$budget" <<<"$out")
            out=$(
              helm template test "$chart" --set podDisruptionBudget.enabled=false
            )
            disabled=$(yq -o json -I0 "$budget" <<<"$out")
            if [ "$alone" != '{"maxUnavailable":1}' ] || [ "$min_alone" != '{"minAvailable":1}' ] || [ "$both" != '{"maxUnavailable":2}' ] || [ -n "$disabled" ]; then
              echo "::error::$chart renders the disruption budget keys wrong (maxUnavailable alone: $alone, minAvailable alone: $min_alone, both counts without the schema: $both, enabled=false: ${disabled:-no budget})"
              exit 1
            fi
          done
      - name: Helm unittest
        run: |
          for chart in operators/*/helm/*-operator operators/*/helm/*-testbed; do
            echo "--- unittest $chart ---"
            helm unittest "$chart"
          done
      # Renders every operator chart with the values.yaml of its released chart,
      # the highest tag under oci://ghcr.io/c5c3/charts, pulled without a login,
      # so a removed or renamed key fails here instead of at a deployment's
      # helm upgrade. An intended removal is waived in
      # hack/helm-removed-values.yaml. The render is its own step because the
      # cinder and nova matrix tests replay every helm template line of the
      # Helm template step.
      - name: Render the released chart values
        run: make verify-helm-released-values
      # The target-cluster-access chart is validated on its own: it has no
      # subchart, no values.schema.json, and none of the operator scenarios the
      # loops above render (webhook, RBAC scope, image resources). Its own
      # scenarios turn on the namespace list, which is a required value.
      - name: Validate target-cluster-access chart
        run: |
          chart=deploy/bases/target-cluster-access
          echo "--- lint $chart ---"
          helm lint "$chart" --set 'namespaces={openstack}'
          echo "--- Scenario 1: one namespace ---"
          helm template test "$chart" --set 'namespaces={openstack}'
          echo "--- Scenario 2: several namespaces ---"
          helm template test "$chart" --set 'namespaces={openstack,glance}'
          echo "--- Scenario 3: namespaces created elsewhere ---"
          helm template test "$chart" --set 'namespaces={openstack}' --set createNamespaces=false
          echo "--- unittest $chart ---"
          helm unittest "$chart"

  # ---------------------------------------------------------------------------
  # E2E. Each job below calls the reusable workflow named in its uses:, which
  # holds its runner, wall, matrix and steps; ci.yaml decides when it runs and
  # what it gets. A job that loads images waits for build-e2e-images and pulls
  # what its image-map names. always() lets a job run when a Go gate it needs
  # was skipped, as on a pull request that changes a suite alone; the failure
  # and cancelled guards still stop it when one failed. The Suite Workflows
  # section of docs/reference/ci-cd/ci-workflow.md maps each job to its file.
  # ---------------------------------------------------------------------------
  # The infrastructure stack on kind, asserted, then deployed again on the same
  # cluster to prove it converges (ci-e2e-infra.yaml).
  e2e-infra:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.e2e-infra == 'true'
    uses: ./.github/workflows/ci-e2e-infra.yaml

  # Builds the E2E images whose sources the change touched, pushes them under
  # run-scoped tags and resolves every other image to the digest main last
  # published (ci-build-e2e-images.yaml). Every job below that loads an image
  # pulls through its image-map. It runs on a pull request and on the night.
  # A fork's pull request skips it, and with it every E2E job but e2e-infra
  # and e2e-bgp-fabric: the push to GHCR needs a writable token, and a
  # maintainer runs the E2E jobs by pushing the change to a branch here.
  build-e2e-images:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, verify-invalid-cr-fixtures, chainsaw-lint]
    # A night has no pull request, so the fork guard reads true there. An
    # artifact fallback for forks would bring back the download timeouts GH-310
    # removed; a fork's pull request still gets every check that needs no image.
    if: |
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.build-e2e-images == 'true' &&
      github.event.pull_request.head.repo.fork != true &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-build-e2e-images.yaml
    with:
      changed-operators: ${{ needs.changes.outputs.changed-operators }}
      changed-services: ${{ needs.changes.outputs.changed-services }}
      changed-tempest: ${{ needs.changes.outputs.changed-tempest }}
      changed-proxy: ${{ needs.changes.outputs.changed-proxy }}
      changed-ovn: ${{ needs.changes.outputs.changed-ovn }}
      changed-libvirt: ${{ needs.changes.outputs.changed-libvirt }}
      build-cover-images: ${{ needs.changes.outputs.has-e2e-operators == 'true' || needs.changes.outputs.e2e-chaos == 'true' || needs.changes.outputs.tempest == 'true' }}

  # The suites of each operator the change selects, one leg per operator and
  # nova in two shards (ci-e2e-operator.yaml).
  e2e-operator:
    needs: [changes, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.has-e2e-operators == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-operator.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}
      matrix: ${{ needs.changes.outputs.e2e-operator-legs }}

  # The helm upgrade in place of each operator whose code, suite or shared
  # upgrade input changed (e2e-operator-upgrade.yaml, which operator-upgrade.yaml
  # also calls after every publish on main).
  e2e-operator-upgrade:
    needs: [changes, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.e2e-operator-upgrade == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-operator-upgrade.yaml
    with:
      operators: ${{ needs.changes.outputs.e2e-operator-upgrade-operators }}
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # The chaos suites under Chaos Mesh, one leg per entry (ci-e2e-chaos.yaml):
  # on a pull request for a suite change or ci:chaos (run-chaos), and every
  # night (#1388). It waits for every e2e-operator leg; a failed one skips it.
  # Every leg gates: a red leg fails the job, and tempest skips.
  e2e-chaos:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images, e2e-operator]
    if: |
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.e2e-chaos == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-chaos.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # The random chaos run of #1395 (ci-e2e-chaos-random.yaml): every night, on a
  # change to its own files and under ci:full, gating like a chaos leg.
  e2e-chaos-random:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.e2e-chaos-random == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-chaos-random.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # Files a red scheduled night (#1388) through hack/ci-report-nightly-chaos.sh:
  # one issue per failed suite, per red leg that names no suite, for a night no
  # leg ran, and for a night whose self-hosted jobs took longer than 780 minutes
  # (the budget of #1392). It is the only job here that holds issues: write, on
  # a GitHub-hosted runner; a dispatch never reports, and a re-run comments on
  # the open issues.
  report-nightly-chaos:
    needs: [changes, build-e2e-images, e2e-chaos, e2e-chaos-random]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A leg that hit its wall uploaded no report; the script files the leg
      # then.
      - name: Download the JUnit reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-chaos-junit-report-*
          path: _output/nightly
      - name: Report the night
        run: hack/ci-report-nightly-chaos.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_SHA: ${{ github.sha }}
          REPORTS_DIR: _output/nightly
          BUDGET_MINUTES: "780"

  # The Prometheus stack suites of keystone and horizon (ci-e2e-prometheus.yaml).
  e2e-prometheus:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.e2e-prometheus == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-prometheus.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # The four ControlPlane jobs run for a c5c3 change and under ci:controlplane,
  # each also for its own suite, and never for a fork. This one runs the
  # ControlPlane suites on one full plane (ci-e2e-controlplane.yaml).
  e2e-controlplane:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-controlplane == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-controlplane.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}
      measure-sizing: ${{ needs.changes.outputs.measure-sizing }}

  # The federated ControlPlane, Horizon websso through the gateway, on a
  # cluster of its own (ci-e2e-controlplane-sso.yaml).
  e2e-controlplane-sso:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-controlplane-sso == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-controlplane-sso.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}
      measure-sizing: ${{ needs.changes.outputs.measure-sizing }}

  # The API HorizontalPodAutoscalers of a full ControlPlane under token load
  # (ci-e2e-autoscaling.yaml).
  e2e-autoscaling:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-autoscaling == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-autoscaling.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # External ControlPlanes against a Keystone no operator owns
  # (ci-e2e-external-keystone.yaml).
  e2e-external-keystone:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-external-keystone == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-external-keystone.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # Services placed on a target cluster through the target-cluster-access
  # chart (ci-e2e-multicluster.yaml).
  e2e-multicluster:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-multicluster == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-multicluster.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # Orders delivered to a namespace on a registered target cluster
  # (ci-e2e-orders-multicluster.yaml). A c5c3 change runs it too.
  e2e-orders-multicluster:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-orders-multicluster == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-orders-multicluster.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # The multi-node OVN overlay suites (ci-e2e-ovn-overlay.yaml). They do not
  # gate: they need kernel modules on the runner host.
  e2e-ovn-overlay:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-ovn-overlay == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-ovn-overlay.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # Nova's libvirt driver against a real libvirtd (ci-e2e-nova-libvirt.yaml).
  # It does not gate: the pool's chassis needs a kernel module on the host.
  e2e-nova-libvirt:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-nova-libvirt == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-e2e-nova-libvirt.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}

  # The node side of the BGP fabric on frr-k8s (ci-e2e-bgp-fabric.yaml). It
  # does not gate, and it loads no run-scoped image, so it needs changes alone.
  e2e-bgp-fabric:
    needs: [changes]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-bgp-fabric == 'true'
    uses: ./.github/workflows/ci-e2e-bgp-fabric.yaml

  # Keystone token-path load, main's image against this change's, one leg per
  # release (ci-keystone-pressure.yaml). It reports numbers and does not gate.
  keystone-pressure:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.keystone-pressure == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-keystone-pressure.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}
      matrix: ${{ needs.changes.outputs.keystone-pressure-releases }}

  # Tempest against each service, one leg per service and release
  # (ci-tempest.yaml), once every E2E job it needs finished without failure: a
  # failed one skips tempest, a path-filter-skipped one does not.
  tempest:
    needs: [changes, build-e2e-images, e2e-infra, e2e-operator, e2e-chaos, e2e-prometheus]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.tempest == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-tempest.yaml
    with:
      image-map: ${{ needs.build-e2e-images.outputs.image-map }}
      measure-sizing: ${{ needs.changes.outputs.measure-sizing }}
      matrix: ${{ needs.changes.outputs.tempest-releases }}

  # GH-310: prune the run-scoped GHCR tags of build-e2e-images once every job
  # that might pull them has finished; cleanup-images.yaml catches the tags of
  # a cancelled run.
  cleanup-e2e-tags:
    needs: [changes, build-e2e-images, e2e-operator, e2e-operator-upgrade, e2e-chaos, e2e-chaos-random, e2e-prometheus, e2e-controlplane, e2e-controlplane-sso, e2e-autoscaling, e2e-external-keystone, e2e-multicluster, e2e-orders-multicluster, e2e-ovn-overlay, e2e-nova-libvirt, keystone-pressure, tempest]
    if: |
      always() &&
      needs.build-e2e-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Best effort: GHCR refuses to delete the last tagged version of a package,
    # which a package main has never published still is.
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.changes.outputs.cleanup-e2e-packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # GH-312: this job runs in parallel with build-and-push, which uploads
      # per-platform manifests via push-by-digest=true (i.e. untagged) and
      # relies on merge-operator-images to assemble them into a tagged manifest
      # list. Pruning untagged images mid-flight removes those digests and
      # breaks the merge step — so the prune runs in --only-tag-pattern mode,
      # where untagged versions are out of scope by construction.
      - name: Delete run-scoped tags for ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 hack/ghcr-prune-stale-versions.py \
            --org "${{ github.repository_owner }}" \
            --package "${{ matrix.package }}" \
            --only-tag-pattern "^e2e-${{ github.run_id }}-" \
            --min-age-hours 0 \
            --max-deletions 0

  # Build operator container images per platform on native runners.
  # Each platform is pushed by digest; merge-operator-images assembles the manifest list.
  # Runs only on push events (main branch or v* tags) after E2E passed.
  # The image is the flake attribute <op>-operator-image, built, scanned with
  # vulnix and pushed by digest through build-nix-image; the cobaltcore Cachix
  # cache of setup-nix serves the build. merge-operator-images reads the
  # digests-operator-<op>-<platform-pair> artifacts and writes the index
  # annotations.
  build-and-push:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    # Publish-only-on-merge: the merged commit's PR was already green, so we do
    # not re-run the E2E suite on push. This job depends only on `changes` (for
    # the operator matrix) and builds the image from the flake, independent of
    # build-e2e-images.
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.has-e2e-operators == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        operator: ${{ fromJson(needs.changes.outputs.e2e-operators).operator }}
        platform:
          - name: linux/amd64
            runner: ubuntu-latest
          - name: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform.name }}

      # skopeo in build-nix-image pushes with the credentials docker login
      # writes here.
      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - id: build
        uses: ./.github/actions/build-nix-image
        with:
          attribute: ${{ matrix.operator }}-operator-image
          image-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
          push-by-digest: 'true'
          artifact-name: digests-operator-${{ matrix.operator }}-${{ steps.platform-pair.outputs.value }}
          vulnix-artifact-name: vulnix-operator-${{ matrix.operator }}-${{ steps.platform-pair.outputs.value }}
          # OCI manifests, so the manifest list merge-operator-images creates
          # is an OCI index, which can carry the revision annotation.
          manifest-format: oci

  # Assemble per-platform digests into multi-arch manifest lists, push with
  # final tags (SHA, latest, semver) and sign the index with cosign.
  merge-operator-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-and-push]
    if: github.event_name == 'push' && needs.build-and-push.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.e2e-operators) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Buildx for imagetools create, the docker login the push and cosign
      # use, and cosign for the sign step.
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The operator upgrade suites install a baseline pinned to a chart
      # version (tests/e2e-operator-upgrade/<op>-helm-upgrade/baseline.yaml),
      # so main tags every operator image it publishes with the version its
      # Chart.yaml names. hack/ghcr-prune-stale-versions.py keeps a bare
      # X.Y.Z tag forever, and once Chart.yaml moves past a version no push
      # writes that tag again. Any other version only warns: the step writes
      # no version, the metadata action drops a raw tag with an empty value,
      # and the index still gets its sha and latest tags.
      - name: Read the chart version
        id: chart
        env:
          OPERATOR: ${{ matrix.operator }}
        run: |
          chart="operators/${OPERATOR}/helm/${OPERATOR}-operator/Chart.yaml"
          version="$(hack/ci-read-chart-version.sh "${chart}")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::${chart} has no X.Y.Z version (got: '${version}'); the image gets no chart-version tag"
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Generate OCI tags and index annotations via docker/metadata-action.
      # The image carries its four static labels and nothing that changes per
      # build, so the per-build metadata goes onto the index: the source,
      # url, version, created and revision annotations of the action, with the
      # title, description, licenses and vendor of the image labels in place
      # of the repository's. type=semver strips the v prefix
      # (v0.1.0 -> 0.1.0). The chart-version tag carries the enable rule of
      # latest, so on main both name one digest and a v* tag push writes
      # neither.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.chart.outputs.version }},enable={{is_default_branch}}
          annotations: |
            org.opencontainers.image.title=${{ matrix.operator }}-operator
            org.opencontainers.image.description=CobaltCore OpenStack ${{ matrix.operator }} operator
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=SAP SE

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-operator-${{ matrix.operator }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push manifest list
        id: manifest
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
        run: |
          cd /tmp/digests
          # shellcheck disable=SC2012 # deliberate: counting entries, not parsing names
          [[ $(ls | wc -l) -ge 1 ]] || { echo "::error::No digests found for ${{ matrix.operator }}-operator"; exit 1; }
          # The commit goes onto the index as an annotation:
          # hack/ci-resolve-e2e-images.sh reads it to decide whether :latest
          # is current. The metadata annotations carry the same revision; the
          # explicit one keeps that contract out of the action's defaults.
          # The platform manifests stay the OCI manifests skopeo pushed, so
          # the image digests move only with an input; from Docker manifests
          # imagetools create would build a Docker manifest list and drop the
          # annotations. The assignment fails the step when jq does, which a
          # process substitution feeding mapfile would not.
          annotations=$(jq -er '.annotations // error("docker/metadata-action wrote no annotations") | .[] | ("--annotation", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotation_args <<< "$annotations"
          # The index digest the sign step names comes from this push. A read
          # of the sha- tag afterwards can return the index of an earlier
          # attempt when the job is re-run. The metadata file stays out of
          # /tmp/digests, whose * names the source digests.
          metadata="${RUNNER_TEMP}/imagetools-metadata.json"
          # shellcheck disable=SC2046 # deliberate: both substitutions expand to argument lists
          docker buildx imagetools create \
            --metadata-file "${metadata}" \
            "${annotation_args[@]}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          digest="$(jq -er '.["containerimage.descriptor"].digest' "${metadata}")" || digest=""
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::docker buildx imagetools create wrote no index digest to ${metadata}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Keyless signature of the index digest; see "Cosign Signing" in
      # docs/reference/ci-cd/ci-workflow.md.
      - name: Sign the manifest list
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: hack/ci-cosign-sign.sh "${IMAGE}@${DIGEST}"

  # Package and push operator Helm charts to GHCR OCI registry and sign them
  # with cosign. Runs only on push events after E2E passed. Uses versioned
  # chart packaging for v* tag pushes.
  helm-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publish-only-on-merge: see build-and-push. The chart is packaged and pushed
    # for every changed operator on push without re-running the E2E suite.
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.has-e2e-operators == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.e2e-operators) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: ${{ env.HELM_VERSION }}
      # The docker login helm push and cosign read, and cosign: Helm's
      # registry client falls back to Docker's config.json. The job builds no
      # image, so it starts no Buildx builder.
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          setup-buildx: 'false'
      - name: Package and push Helm chart
        id: push
        env:
          OPERATOR: ${{ matrix.operator }}
        run: |
          # Remove stale chart tarballs to prevent glob ambiguity.
          rm -f "${OPERATOR}"-operator-*.tgz
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            make helm-package OPERATOR="${OPERATOR}" CHART_VERSION="${GITHUB_REF_NAME#v}"
          else
            make helm-package OPERATOR="${OPERATOR}"
          fi
          # ghcr.io now and then 404s the manifest helm has just uploaded when
          # helm fetches it back to tag it; the script retries that one error.
          hack/ci-helm-push.sh "${OPERATOR}"-operator-*.tgz oci://${{ env.REGISTRY }}/c5c3/charts
      # Keyless signature of the pushed chart digest; see "Cosign Signing" in
      # docs/reference/ci-cd/ci-workflow.md.
      - name: Sign the chart
        env:
          CHART_REF: ${{ steps.push.outputs.ref }}
        run: hack/ci-cosign-sign.sh "${CHART_REF}"

  # Package and push the target-cluster-access chart to the GHCR OCI registry.
  # It is a job of its own rather than a step in helm-push because that job is a
  # per-operator matrix: an in-matrix step would package and push this single
  # chart once per leg, and the legs would race on the same registry tag.
  helm-push-target-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publish-only-on-merge: see build-and-push.
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.target-cluster-chart == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write #: Sigstore OIDC signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: ${{ env.HELM_VERSION }}
      # The docker login helm push and cosign read, and cosign, without a
      # Buildx builder; see helm-push.
      - name: Setup Docker registry
        uses: ./.github/actions/setup-docker-registry
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          setup-buildx: 'false'
      - name: Package and push Helm chart
        id: push
        run: |
          # Remove stale chart tarballs to prevent glob ambiguity.
          rm -f target-cluster-access-*.tgz
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            make helm-package-target-cluster CHART_VERSION="${GITHUB_REF_NAME#v}"
          else
            make helm-package-target-cluster
          fi
          # Retries ghcr.io's 404 on the tag step, as in helm-push.
          hack/ci-helm-push.sh target-cluster-access-*.tgz oci://${{ env.REGISTRY }}/c5c3/charts
      # Keyless signature of the pushed chart digest, as in helm-push.
      - name: Sign the chart
        env:
          CHART_REF: ${{ steps.push.outputs.ref }}
        run: hack/ci-cosign-sign.sh "${CHART_REF}"

  # Create GitHub release with auto-generated release notes
  # on v* tag pushes, after images and charts are published.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [changes, merge-operator-images, helm-push]
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      needs.merge-operator-images.result == 'success' &&
      needs.helm-push.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: ${{ env.HELM_VERSION }}
      # Package Helm chart tarballs to attach as release assets.
      - name: Package Helm charts
        run: |
          for op in $(echo '${{ needs.changes.outputs.e2e-operators }}' | jq -r '.operator[]'); do
            make helm-package OPERATOR="${op}" CHART_VERSION="${GITHUB_REF_NAME#v}"
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: "*-operator-*.tgz"
