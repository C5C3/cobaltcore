---
name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/c5c3
  # Kind cluster name — single source of truth for every e2e job's
  # create-kind-cluster `cluster-name` and `kind load --name`. Mirrors the
  # CLUSTER_NAME default in hack/deploy-infra.sh.
  KIND_CLUSTER: cobaltcore
  # kind binary version for every e2e job, passed to the create-kind-cluster
  # composite action, which hands it to helm/kind-action. That action defaults to v0.31.0,
  # whose kindnetd does not yet enforce egress against the post-DNAT destination —
  # the posture under which the OpenBao instances' NetworkPolicy needs an explicit
  # API-server allowance. Pinning it here keeps CI on the enforcing build, in
  # lockstep with the KIND_VERSION in hack/install-test-deps.sh that local
  # development installs (tests/unit/renovate asserts the two match).
  KIND_VERSION: v0.33.0
  # Pin tool versions for CI reproducibility (single source of truth).
  CONTROLLER_GEN_VERSION: v0.22.0
  GOFUMPT_VERSION: v0.12.0
  GOLANGCI_LINT_VERSION: v2.13.2

# A `labeled` event for a label that does not steer CI gets a group of its own,
# so adding `bug` or `documentation` to a pull request no longer cancels the
# pipeline in flight and starts it again. The changes job resolves such a run to
# nothing, so it costs one ubuntu-latest runner for about twenty seconds. A
# ci:* label (or the run-chaos alias) lands in the normal group and is meant to
# supersede the run in flight: it asks for more jobs than that run scheduled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && !startsWith(github.event.label.name, 'ci:') && github.event.label.name != 'run-chaos' && format('noop-{0}', github.run_id) || format('{0}-{1}', github.ref, github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classify the changed paths, then resolve them into one flag per job. A job
  # runs when one of ITS OWN inputs changed: the code it tests, the images it
  # loads, the suite it runs, the scripts it calls. Nothing runs because Go code
  # changed somewhere else.
  #
  # Five labels add to that, and never subtract: ci:full runs everything,
  # ci:tempest / ci:chaos / ci:controlplane / ci:multicluster switch on one area
  # each. run-chaos is kept as an alias of ci:chaos.
  #
  # A change to the substrate every e2e job stands on (deploy/**, the infra
  # scripts, the shared composite actions) or to the workflow plumbing runs a
  # canary instead of the pipeline: e2e-infra plus the keystone leg.
  #
  # Adding a triage label resolves to nothing at all (noop), so it no longer
  # cancels the run in flight; the concurrency group above keeps such an event
  # out of the pull request's own group.
  #
  # To add a new operator: see hack/ci-resolve-changes.sh for full instructions.
  #
  # On tag pushes the full release pipeline must always run, so all areas and
  # all operators are forced active regardless of which files were touched. On a
  # push to main the operator matrix keeps the publish semantics it has today.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      noop: ${{ steps.result.outputs.noop }}
      go: ${{ steps.result.outputs.go }}
      docs: ${{ steps.result.outputs.docs }}
      helm: ${{ steps.result.outputs.helm }}
      target-cluster-chart: ${{ steps.result.outputs.target-cluster-chart }}
      e2e-infra: ${{ steps.result.outputs.e2e-infra }}
      e2e-chaos: ${{ steps.result.outputs.e2e-chaos }}
      e2e-prometheus: ${{ steps.result.outputs.e2e-prometheus }}
      e2e-controlplane: ${{ steps.result.outputs.e2e-controlplane }}
      e2e-controlplane-sso: ${{ steps.result.outputs.e2e-controlplane-sso }}
      e2e-external-keystone: ${{ steps.result.outputs.e2e-external-keystone }}
      e2e-multicluster: ${{ steps.result.outputs.e2e-multicluster }}
      e2e-ovn-overlay: ${{ steps.result.outputs.e2e-ovn-overlay }}
      e2e-operator-upgrade: ${{ steps.result.outputs.e2e-operator-upgrade }}
      tempest: ${{ steps.result.outputs.tempest }}
      actionlint: ${{ steps.result.outputs.actionlint }}
      changed-operators: ${{ steps.result.outputs.changed-operators }}
      changed-services: ${{ steps.result.outputs.changed-services }}
      changed-tempest: ${{ steps.result.outputs.changed-tempest }}
      changed-proxy: ${{ steps.result.outputs.changed-proxy }}
      build-e2e-images: ${{ steps.result.outputs.build-e2e-images }}
      has-e2e-operators: ${{ steps.result.outputs.has-e2e-operators }}
      e2e-operators: ${{ steps.result.outputs.e2e-operators }}
      e2e-operator-legs: ${{ steps.e2e-operator-legs.outputs.legs }}
      test-targets: ${{ steps.result.outputs.test-targets }}
      tempest-releases: ${{ steps.tempest-matrix.outputs.tempest-releases }}
      cleanup-e2e-packages: ${{ steps.cleanup-matrix.outputs.cleanup-e2e-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # ---------------------------------------------------------------
            # Operator code. One filter per operator, its own source tree only:
            # a change here runs that operator's Go gates, its unit and envtest
            # legs, and its e2e leg. Nothing else.
            # ---------------------------------------------------------------
            keystone:
              - 'operators/keystone/**'
            c5c3:
              - 'operators/c5c3/**'
            horizon:
              - 'operators/horizon/**'
            glance:
              - 'operators/glance/**'
            placement:
              - 'operators/placement/**'
            barbican:
              - 'operators/barbican/**'
            ovn:
              - 'operators/ovn/**'
            neutron:
              - 'operators/neutron/**'
            cinder:
              - 'operators/cinder/**'
            nova:
              - 'operators/nova/**'
            # ---------------------------------------------------------------
            # Service image sources. A change runs that service's e2e leg
            # against a freshly built image; the operator binary is untouched.
            # ---------------------------------------------------------------
            image_keystone:
              - 'images/keystone/**'
              - 'patches/keystone/**'
            image_horizon:
              - 'images/horizon/**'
              - 'patches/horizon/**'
            image_glance:
              - 'images/glance/**'
              - 'patches/glance/**'
            image_placement:
              - 'images/placement/**'
              - 'patches/placement/**'
            image_barbican:
              - 'images/barbican/**'
              - 'patches/barbican/**'
            image_neutron:
              - 'images/neutron/**'
              - 'patches/neutron/**'
            image_cinder:
              - 'images/cinder/**'
              - 'patches/cinder/**'
            image_nova:
              - 'images/nova/**'
              - 'images/nova-compute/**'
              - 'patches/nova/**'
            # ovn ships the OVS/OVN daemons the CRs project and the rclone
            # shifter the OVNCentral backup CronJob uploads with. Neither is a
            # per-release service image, so they steer the ovn e2e leg rather
            # than changed-services.
            image_ovn:
              - 'images/ovn/**'
              - 'images/backup-shifter/**'
            # The keystone oidc-federation suite projects this sidecar.
            image_proxy:
              - 'images/keystone-federation-proxy/**'
            image_tempest:
              - 'images/tempest/**'
              - 'hack/ci-build-tempest-image.sh'
            # ---------------------------------------------------------------
            # Shared code and shared image inputs.
            # ---------------------------------------------------------------
            # Every operator's binary is built from this.
            go_common:
              - 'internal/**'
              - 'go.work'
              - 'go.work.sum'
              - 'operators/Dockerfile'
              - '.golangci.yml'
            # Every service image and both Tempest images are built from this.
            images_base:
              - 'images/python-base/**'
              - 'images/venv-builder/**'
              - 'releases/**'
              - 'scripts/**'
              - 'overrides/**'
              - 'hack/ci-build-service-image.sh'
              - 'hack/ci-service-image-releases.sh'
            # ---------------------------------------------------------------
            # Tempest. tempest_src switches the job on; the per-service filters
            # narrow the matrix to the configuration that changed. Without a
            # label, this is the only path that runs Tempest on a pull request.
            # ---------------------------------------------------------------
            tempest_src:
              - 'images/tempest/**'
              - 'tests/tempest/**'
              - 'hack/tempest/**'
              - 'hack/ci-run-tempest.sh'
              - 'hack/ci-build-tempest-image.sh'
              - 'hack/ci-generate-tempest-matrix.sh'
            tempest_keystone:
              - 'tests/tempest/keystone-*/**'
            tempest_glance:
              - 'tests/tempest/glance-*/**'
            tempest_barbican:
              - 'tests/tempest/barbican-*/**'
            tempest_neutron:
              - 'tests/tempest/neutron-*/**'
            tempest_cinder:
              - 'tests/tempest/cinder-*/**'
            tempest_nova:
              - 'tests/tempest/nova-*/**'
            # ---------------------------------------------------------------
            # Per-operator e2e suites. Editing one operator's suite runs that
            # operator's leg, not the other nine.
            # ---------------------------------------------------------------
            tests_e2e_keystone:
              - 'tests/e2e/keystone/**'
              - 'tests/e2e/keystone-operator/**'
            tests_e2e_c5c3:
              - 'tests/e2e/c5c3/**'
            tests_e2e_horizon:
              - 'tests/e2e/horizon/**'
              - 'tests/e2e/horizon-operator/**'
            tests_e2e_glance:
              - 'tests/e2e/glance/**'
              - 'tests/e2e/glance-operator/**'
            tests_e2e_placement:
              - 'tests/e2e/placement/**'
              - 'tests/e2e/placement-operator/**'
            tests_e2e_barbican:
              - 'tests/e2e/barbican/**'
              - 'tests/e2e/barbican-operator/**'
            tests_e2e_ovn:
              - 'tests/e2e/ovn/**'
            tests_e2e_neutron:
              - 'tests/e2e/neutron/**'
            tests_e2e_cinder:
              - 'tests/e2e/cinder/**'
              - 'tests/e2e/cinder-operator/**'
            tests_e2e_nova:
              - 'tests/e2e/nova/**'
              - 'tests/e2e/nova-operator/**'
            # ---------------------------------------------------------------
            # Suites that live in a job of their own. Each filter names exactly
            # the suite its job runs, so an edit schedules that job and no
            # other. The ControlPlane suites are split three ways because they
            # run on three separate clusters.
            # ---------------------------------------------------------------
            tests_controlplane:
              - 'tests/e2e/c5c3/full-controlplane-keystone/**'
              - 'tests/e2e/c5c3/keystone-service/**'
              - 'tests/e2e/c5c3/keystone-service-foreign-namespace/**'
            tests_controlplane_sso:
              - 'tests/e2e-controlplane-sso/**'
            tests_external_keystone:
              - 'tests/e2e/c5c3/external-keystone/**'
            tests_chaos:
              - 'tests/e2e-chaos/**'
            tests_multicluster:
              - 'tests/e2e-multicluster/**'
              - 'deploy/target-cluster/**'
            tests_ovn_overlay:
              - 'tests/e2e-ovn-overlay/**'
            tests_operator_upgrade:
              - 'tests/e2e-operator-upgrade/**'
              - 'hack/ci-fetch-released-operator.sh'
            tests_prometheus:
              - 'tests/e2e/keystone/prometheus-stack/**'
              - 'deploy/kind/prometheus/**'
              - 'operators/keystone/dashboards/**'
              - 'operators/keystone/helm/keystone-operator/templates/servicemonitor.yaml'
            e2e_infra:
              - 'tests/e2e/infrastructure/**'
            # ---------------------------------------------------------------
            # The canary. A change to the substrate every e2e job stands on, or
            # to the workflow plumbing, proves itself against e2e-infra plus the
            # keystone leg rather than against the whole pipeline. ci:full is
            # how you ask for the rest.
            # ---------------------------------------------------------------
            e2e_shared:
              - 'deploy/**'
              - 'tests/e2e/chainsaw-config.yaml'
              - 'hack/deploy-infra.sh'
              - 'hack/deploy-mgmt-cluster.sh'
              - 'hack/install-test-deps.sh'
              - 'hack/kind-config.yaml'
              - 'hack/kind-config-multinode.yaml'
              - 'hack/ci-deploy-operator.sh'
              - 'hack/ci-deploy-korc.sh'
              - 'hack/ci-dump-diagnostics.sh'
              - '.github/actions/setup-e2e-infra/**'
              - '.github/actions/setup-test-deps/**'
              - '.github/actions/load-e2e-images/**'
              - '.github/actions/registry-login/**'
            # OpenBao is one piece of the substrate with an operator that
            # exercises it directly, so barbican joins the canary for it.
            e2e_openbao:
              - 'deploy/openbao/**'
            # K-ORC is the other: only the jobs that run hack/ci-deploy-korc.sh
            # deploy its pinned commit and image, so the c5c3 leg (the
            # cheapest of them) joins the canary for a change to the pin.
            e2e_korc:
              - 'deploy/flux-system/sources/k-orc.yaml'
              - 'deploy/flux-system/releases/k-orc.yaml'
              - 'hack/ci-deploy-korc.sh'
            ci_plumbing:
              - '.github/workflows/ci.yaml'
              - '.github/actions/**'
              - 'hack/ci-*.sh'
            actionlint:
              - '.github/**'
            makefile:
              - 'Makefile'
            # ---------------------------------------------------------------
            # Everything else.
            # ---------------------------------------------------------------
            docs:
              - 'docs/**'
              - 'package.json'
              - 'package-lock.json'
            # The operator charts share the operator-library library chart and a
            # values.schema.json generator, so a change to any chart, the shared
            # library, either generator, or the Makefile targets behind them
            # must re-run Helm validation.
            helm:
              - 'operators/*/helm/**'
              - 'deploy/target-cluster/**'
              - 'hack/gen-helm-values-schema.py'
              - 'hack/gen-helm-rbac-rules.py'
              - 'Makefile'
            # The target-cluster-access chart is published outside the
            # per-operator helm-push matrix, so it needs its own gate.
            target_cluster_chart:
              - 'deploy/target-cluster/**'
            # Push events only, and ignored on pull requests. Reproduces the
            # operator set today's go_common and e2e-test unions publish on a
            # push to main, so what lands in GHCR after a merge does not change
            # with this rewiring. Delete it when the post-merge behaviour is
            # revisited.
            publish_legacy:
              - 'hack/**'
              - 'scripts/**'
              - 'releases/**'
              - 'deploy/**'
              - 'images/python-base/**'
              - 'images/venv-builder/**'
              - 'images/tempest/**'
              - 'tests/e2e/**'
              - 'tests/e2e-chaos/**'
              - 'tests/e2e-operator-upgrade/**'
              - 'tests/tempest/**'
              - '.github/workflows/ci.yaml'
              - '.github/actions/**'
      # Extracted to hack/ci-resolve-changes.sh (review #2 comment 3).
      - name: Resolve effective changes
        id: result
        env:
          ALL_OPERATORS: keystone c5c3 horizon glance placement barbican ovn neutron cinder nova
          # The operators that ship an OpenStack service image: the keys in
          # releases/*/source-refs.yaml that name an operator in ALL_OPERATORS
          # above. A service image can land a phase before its operator, so a
          # key without an operator waits here. Pinned by
          # tests/unit/ci/change_classes_wiring_test.sh.
          SERVICE_OPERATORS: keystone horizon glance placement barbican neutron cinder nova
          # The operator whose e2e leg stands in for the pipeline when the shared
          # substrate or the workflow plumbing changes.
          CANARY_OPERATOR: keystone
          # toJSON, not join: GitHub expression literals carry no escape
          # sequences, so join(..., '\n') would join on a literal backslash-n.
          # The resolver reads null and any non-array as an empty label set.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          FILTER_keystone: ${{ steps.filter.outputs.keystone }}
          FILTER_c5c3: ${{ steps.filter.outputs.c5c3 }}
          FILTER_horizon: ${{ steps.filter.outputs.horizon }}
          FILTER_glance: ${{ steps.filter.outputs.glance }}
          FILTER_placement: ${{ steps.filter.outputs.placement }}
          FILTER_barbican: ${{ steps.filter.outputs.barbican }}
          FILTER_ovn: ${{ steps.filter.outputs.ovn }}
          FILTER_neutron: ${{ steps.filter.outputs.neutron }}
          FILTER_cinder: ${{ steps.filter.outputs.cinder }}
          FILTER_nova: ${{ steps.filter.outputs.nova }}
          FILTER_image_keystone: ${{ steps.filter.outputs.image_keystone }}
          FILTER_image_horizon: ${{ steps.filter.outputs.image_horizon }}
          FILTER_image_glance: ${{ steps.filter.outputs.image_glance }}
          FILTER_image_placement: ${{ steps.filter.outputs.image_placement }}
          FILTER_image_barbican: ${{ steps.filter.outputs.image_barbican }}
          FILTER_image_neutron: ${{ steps.filter.outputs.image_neutron }}
          FILTER_image_cinder: ${{ steps.filter.outputs.image_cinder }}
          FILTER_image_nova: ${{ steps.filter.outputs.image_nova }}
          FILTER_image_ovn: ${{ steps.filter.outputs.image_ovn }}
          FILTER_image_proxy: ${{ steps.filter.outputs.image_proxy }}
          FILTER_image_tempest: ${{ steps.filter.outputs.image_tempest }}
          FILTER_go_common: ${{ steps.filter.outputs.go_common }}
          FILTER_images_base: ${{ steps.filter.outputs.images_base }}
          FILTER_tempest_src: ${{ steps.filter.outputs.tempest_src }}
          FILTER_tempest_keystone: ${{ steps.filter.outputs.tempest_keystone }}
          FILTER_tempest_glance: ${{ steps.filter.outputs.tempest_glance }}
          FILTER_tempest_barbican: ${{ steps.filter.outputs.tempest_barbican }}
          FILTER_tempest_neutron: ${{ steps.filter.outputs.tempest_neutron }}
          FILTER_tempest_cinder: ${{ steps.filter.outputs.tempest_cinder }}
          FILTER_tempest_nova: ${{ steps.filter.outputs.tempest_nova }}
          FILTER_tests_e2e_keystone: ${{ steps.filter.outputs.tests_e2e_keystone }}
          FILTER_tests_e2e_c5c3: ${{ steps.filter.outputs.tests_e2e_c5c3 }}
          FILTER_tests_e2e_horizon: ${{ steps.filter.outputs.tests_e2e_horizon }}
          FILTER_tests_e2e_glance: ${{ steps.filter.outputs.tests_e2e_glance }}
          FILTER_tests_e2e_placement: ${{ steps.filter.outputs.tests_e2e_placement }}
          FILTER_tests_e2e_barbican: ${{ steps.filter.outputs.tests_e2e_barbican }}
          FILTER_tests_e2e_ovn: ${{ steps.filter.outputs.tests_e2e_ovn }}
          FILTER_tests_e2e_neutron: ${{ steps.filter.outputs.tests_e2e_neutron }}
          FILTER_tests_e2e_cinder: ${{ steps.filter.outputs.tests_e2e_cinder }}
          FILTER_tests_e2e_nova: ${{ steps.filter.outputs.tests_e2e_nova }}
          FILTER_tests_controlplane: ${{ steps.filter.outputs.tests_controlplane }}
          FILTER_tests_controlplane_sso: ${{ steps.filter.outputs.tests_controlplane_sso }}
          FILTER_tests_external_keystone: ${{ steps.filter.outputs.tests_external_keystone }}
          FILTER_tests_chaos: ${{ steps.filter.outputs.tests_chaos }}
          FILTER_tests_multicluster: ${{ steps.filter.outputs.tests_multicluster }}
          FILTER_tests_ovn_overlay: ${{ steps.filter.outputs.tests_ovn_overlay }}
          FILTER_tests_operator_upgrade: ${{ steps.filter.outputs.tests_operator_upgrade }}
          FILTER_tests_prometheus: ${{ steps.filter.outputs.tests_prometheus }}
          FILTER_e2e_infra: ${{ steps.filter.outputs.e2e_infra }}
          FILTER_e2e_shared: ${{ steps.filter.outputs.e2e_shared }}
          FILTER_e2e_openbao: ${{ steps.filter.outputs.e2e_openbao }}
          FILTER_e2e_korc: ${{ steps.filter.outputs.e2e_korc }}
          FILTER_ci_plumbing: ${{ steps.filter.outputs.ci_plumbing }}
          FILTER_actionlint: ${{ steps.filter.outputs.actionlint }}
          FILTER_makefile: ${{ steps.filter.outputs.makefile }}
          FILTER_docs: ${{ steps.filter.outputs.docs }}
          FILTER_helm: ${{ steps.filter.outputs.helm }}
          FILTER_target_cluster_chart: ${{ steps.filter.outputs.target_cluster_chart }}
          FILTER_publish_legacy: ${{ steps.filter.outputs.publish_legacy }}
        run: hack/ci-resolve-changes.sh
      # Derive Tempest release matrix from releases/ directories (review #1).
      # Avoids hardcoding releases in the workflow — adding or removing a release
      # only requires updating releases/ and tests/tempest/, not this file.
      - name: Generate Tempest release matrix
        id: tempest-matrix
        # The generator still checks every service's config directory for every
        # release; TEMPEST_SERVICES only narrows what it emits.
        env:
          TEMPEST_SERVICES: ${{ join(fromJson(steps.result.outputs.tempest-services), ' ') }}
        run: hack/ci-generate-tempest-matrix.sh

      # Derive the GHCR package list from images/ and operators/ for the same
      # reason: onboarding a service must not require remembering to add it to
      # a cleanup matrix by hand.
      - name: Generate cleanup package matrix
        id: cleanup-matrix
        run: hack/ci-generate-cleanup-matrix.sh

      # The e2e-operator job runs one leg per operator in e2e-operators, except
      # nova, whose suites run as two shards on two kind clusters (see "Run E2E
      # tests" there). The publish jobs read e2e-operators and must see nova
      # once, so the shards live in an output of their own.
      - name: Shard the e2e-operator matrix
        id: e2e-operator-legs
        env:
          E2E_OPERATORS: ${{ steps.result.outputs.e2e-operators }}
        run: |
          legs=$(jq -c '{include: [.operator[] | if . == "nova"
            then {operator: ., shard: "1"}, {operator: ., shard: "2"}
            else {operator: .} end]}' <<<"${E2E_OPERATORS}")
          echo "legs=${legs}" >>"$GITHUB_OUTPUT"

  lint:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version-file: go.work
      # Cache golangci-lint result cache — golangci-lint-action with install-only:true
      # does not manage the analysis cache itself, so we persist it explicitly.
      # Include Go and golangci-lint versions so upgrades automatically invalidate.
      - uses: actions/cache@v6
        with:
          path: $HOME/.cache/golangci-lint
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-
            ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-golangci-
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: Run lint
        run: make lint

  # Verify all Go files conform to gofumpt formatting.
  # Runs gofumpt -l to detect non-conforming files, then prints a unified
  # diff (gofumpt -d) on failure so developers can see exactly what to fix.
  format-check:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version-file: go.work
      - uses: actions/cache@v6
        id: gofumpt-cache
        with:
          path: $HOME/go/bin/gofumpt
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-gofumpt-${{ env.GOFUMPT_VERSION }}
      - name: Install gofumpt
        if: steps.gofumpt-cache.outputs.cache-hit != 'true'
        run: go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
      # Only check git-tracked Go files to skip generated, vendored,
      # or tooling code that may not follow gofumpt conventions (review #1).
      - name: Check formatting
        run: |
          unformatted=$(git ls-files '*.go' | xargs -r gofumpt -l)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofumpt:"
            echo "$unformatted"
            git ls-files '*.go' | xargs -r gofumpt -d
            exit 1
          fi

  # Validate shell scripts with shellcheck to catch scripting issues
  # early.  shellcheck is pre-installed on ubuntu-latest runners.
  # Runs unconditionally — it is fast and hack/ scripts are exercised in E2E.
  shellcheck:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck on hack/*.sh and operator rotation scripts
        run: make shellcheck

  # Always-on gate: the whole tracked tree (code, tests, CI, scripts, docs)
  # must be free of internal feature/requirement IDs (CC-NNNN / REQ-NNN). Runs
  # unconditionally on every PR — not path-filtered — so a stray ID added
  # anywhere is caught. Folds in the former docs-only check.
  feature-ids:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the tree is free of internal feature/requirement IDs
        run: make check-feature-ids

  # Always-on gate: no NEW unresolved reviewer markers ("Reviewer: please …"
  # questions committed instead of answered) may land anywhere in the tracked
  # tree. Pre-existing markers are tolerated via the per-file baseline in
  # scripts/review-markers-baseline.txt and are expected to shrink over time;
  # the gate fails only when a file exceeds its baselined count.
  review-markers:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check no new unresolved reviewer markers were introduced
        run: make check-review-markers

  # Run every shell unit test under tests/unit/ (hack/, deploy/, docs/,
  # renovate/). Repo files only — adds no injection surface. ubuntu-latest
  # preinstalls bash, jq, mikefarah/yq, perl, npx; kustomize is installed
  # explicitly so deploy/ overlay tests run the full assertion set instead
  # of skipping their kustomize-build checks. The renovate/ tests pull
  # renovate-config-validator via npx, taking ~30s on a cold runner.
  test-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=v5.4.3
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin
      - name: Run shell unit tests
        run: make test-shell

  # Enforce the canonical-scaffold contract for the invalid-CR
  # Chainsaw fixtures (sourcery-ai review #1, FC1 from review #2). Runs
  # `_generate.py --check` (drift mode) and the test_generate.py unit suite
  # (FIXTURES count + chainsaw-test.yaml cross-reference) so a hand-edit to
  # any 02-…/03-…/…/12-*.yaml fixture, or a rename/removal that desynchs
  # FIXTURES from chainsaw-test.yaml, fails the build before the heavy
  # cluster-bound e2e-operator job runs. Always-on because the check is
  # sub-second and python3 is preinstalled on ubuntu-latest runners — no
  # untrusted GitHub event input is read, so no injection surface is added.
  verify-invalid-cr-fixtures:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify invalid-CR fixture drift and structure
        run: make verify-invalid-cr-fixtures

  # Schema-lint every Chainsaw test (tests/**/chainsaw-test.yaml) and config
  # (tests/{e2e,e2e-chaos}/chainsaw-config.yaml) via `chainsaw lint` so typos,
  # removed fields, or schema drift after a chainsaw version bump fail fast —
  # before the cluster-bound e2e-operator/e2e-chaos jobs spin up a kind cluster.
  # Always-on: no cluster needed; chainsaw is restored from the shared testdeps
  # cache via the same composite action setup-e2e-infra uses internally.
  chainsaw-lint:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.noop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-test-deps
      - name: Run chainsaw lint
        run: make chainsaw-lint

  # Static-lint every workflow file. actionlint resolves the expression
  # contexts, so a `needs.changes.outputs.<name>` that no job exports fails here
  # rather than silently evaluating to the empty string and leaving a job
  # unscheduled — the failure mode the change classes above are built on. It
  # also runs shellcheck over every `run:` script. Custom runner labels are
  # declared in .github/actionlint.yaml.
  actionlint:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.actionlint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned and checksummed like the yq install in verify-container-images.yaml.
      # Renovate bumps ACTIONLINT_VERSION; the checksum then fails until it is
      # updated with it, which is the intended signal.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version
      - name: Lint workflows
        run: actionlint -no-color

  # Matrix over [common, keystone, c5c3] to deduplicate common coverage
  # into a single leg (review comment #7/#8).
  test:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.test-targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Run unit tests
        run: |
          if [ "${{ matrix.target }}" = "common" ]; then
            make test-common
          else
            make test-operator OPERATOR=${{ matrix.target }}
          fi
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: cover-unit-${{ matrix.target }}.out
          flags: unit-${{ matrix.target }}
          fail_ci_if_error: false

  # Integration tests with envtest, coverage uploaded to Codecov
  # Includes internal/common to meet 80% codecov target (review comment #5).
  test-integration:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    # 4 vCPU (was 2): the keystone envtest leg sat at ~14m on a 2-vCPU runner
    # against the 15m timeout, and the password-rotation integration
    # tests tipped it over. envtest is CPU-bound, so the larger runner pulls the
    # wall-clock back down. The c5c3 controller envtest suite has since grown to
    # ~22m (barbican made it five services), so the Makefile's go-test timeout is
    # 30m — and the job wall sits above it at 35m so a hung suite still panics
    # with a goroutine dump instead of being killed silently by the runner.
    runs-on: self-hosted
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.test-targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      # Derive the envtest k8s version from the Makefile (single source of truth).
      - name: Get envtest k8s version
        id: envtest-ver
        run: echo "version=$(awk '/ENVTEST_K8S_VERSION/ {print $NF; exit}' Makefile)" >> "$GITHUB_OUTPUT"
      # Cache kubebuilder envtest assets (etcd, kube-apiserver binaries).
      # Key on the k8s version — invalidates automatically when Makefile changes it.
      - uses: actions/cache@v6
        with:
          path: $HOME/.local/share/kubebuilder-envtest
          key: ${{ runner.os }}-envtest-${{ steps.envtest-ver.outputs.version }}
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
      - name: Run integration tests
        run: |
          if [ "${{ matrix.target }}" = "common" ]; then
            make test-integration-common
          else
            make test-integration OPERATOR=${{ matrix.target }}
          fi
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: cover-integration-${{ matrix.target }}.out
          flags: integration-${{ matrix.target }}
          fail_ci_if_error: false

  # Race condition detection for Go tests.
  # Runs all unit tests with -race to catch data races in concurrent operator code
  # (reconcilers, watches, informer caches). Separate from the main test job because
  # the race detector adds 2-5x overhead. Uses -count=1 to disable test caching —
  # race conditions are non-deterministic, so cached results could mask real races.
  test-race:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Run race-detected tests
        run: make test-race RACE_FLAGS="-count=1"

  # Scan Go modules for reachable vulnerabilities using govulncheck.
  # govulncheck is the official Go vulnerability scanner maintained by the Go
  # team — it detects actually reachable vulnerable code paths, not just
  # dependency list matches.  Uses @latest intentionally (not pinned) because
  # the vulnerability database is updated frequently and pinning an old version
  # defeats the purpose of vulnerability scanning.
  govulncheck:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: make govulncheck

  # Verify generated code (CRD manifests, deepcopy) is committed
  # and up-to-date. Fails if make manifests or make generate produces uncommitted diffs.
  verify-codegen:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: setup-go
        with:
          go-version-file: go.work
      # Verify every workspace member's go.mod/go.sum matches what go mod tidy
      # writes. It needs only the Go toolchain, so it runs ahead of code
      # generation: an untidy module is a clearer failure here than as an
      # anonymous line in the diff at the end of this job.
      - name: Verify Go modules are tidy
        run: make verify-go-tidy
      - uses: actions/cache@v6
        id: controller-gen-cache
        with:
          path: $HOME/go/bin/controller-gen
          key: ${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-controller-gen-${{ env.CONTROLLER_GEN_VERSION }}
      - name: Install controller-gen
        if: steps.controller-gen-cache.outputs.cache-hit != 'true'
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@${{ env.CONTROLLER_GEN_VERSION }}
      - name: Run code generation
        run: |
          make manifests
          make generate
      # Verify Helm chart CRD copies match controller-gen output.
      - name: Verify CRD sync
        run: make verify-crd-sync
      # Verify the chart RBAC rules templates match the controller-gen
      # ClusterRole that make manifests just regenerated from the markers.
      - name: Verify Helm RBAC rules sync
        # The generator reads controller-gen YAML with PyYAML, which the
        # ubuntu runner image ships; the fallback covers an image without it.
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          make verify-helm-rbac
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'make manifests && make generate' and commit the result."
            exit 1
          fi

  docs:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build documentation
        run: npm run docs:build

  # Validate Helm chart structure, template rendering, and unit tests.
  # Runs helm lint, helm template with multiple value override scenarios, and
  # helm-unittest for every operator chart to catch regressions early without a
  # cluster. The charts share the operator-library subchart and a generated
  # values.schema.json, so the job verifies the schema is in sync and vendors
  # the subchart (make helm-deps) before rendering. The chart list is the
  # operators/*/helm/*-operator glob, so a new operator chart that follows the
  # directory convention is validated without editing this job.
  helm-validate:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install helm-unittest plugin
        # NOTE: --verify=false because helm-unittest does not publish GPG signatures for plugin releases.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false
      - name: Verify values.schema.json is generated from the shared source
        run: make verify-helm-schema
      - name: Verify the RBAC rules templates are generated from config/rbac
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          make verify-helm-rbac
      - name: Build chart dependencies (vendor operator-library)
        run: make helm-deps
      - name: Helm lint
        run: |
          for chart in operators/*/helm/*-operator operators/*/helm/*-testbed; do
            echo "--- lint $chart ---"
            helm lint "$chart"
          done
      - name: Helm template
        run: |
          for chart in operators/*/helm/*-operator operators/*/helm/*-testbed; do
            echo "=== $chart ==="
            echo "--- Scenario 1: default values ---"
            helm template test "$chart"
            echo "--- Scenario 2: webhook disabled ---"
            helm template test "$chart" --set webhook.enabled=false
            echo "--- Scenario 3: external service account ---"
            helm template test "$chart" --set serviceAccount.create=false --set serviceAccount.name=existing-sa
            echo "--- Scenario 4: custom resources ---"
            helm template test "$chart" --set resources.limits.cpu=100m --set resources.limits.memory=64Mi
            # A chart may refuse the mode by design (ovn-operator watches
            # cluster-scoped Nodes; neutron-operator reads across namespaces):
            # it overrides the operator-library.chart.namespaceScopedUnsupported
            # hook, the shared Role template fails the render with the
            # documented "is not supported by <chart>" message, and the chart's
            # role_test.yaml pins that message. Such a refusal passes here;
            # any other render failure still fails the job.
            echo "--- Scenario 5: namespace-scoped RBAC ---"
            if ! out=$(helm template test "$chart" --set rbac.namespaceScoped=true --set webhook.enabled=false 2>&1); then
              if grep -q "rbac.namespaceScoped=true is not supported by" <<<"$out"; then
                echo "chart refuses namespace-scoped RBAC by design:"
                grep "is not supported by" <<<"$out"
              else
                echo "$out"
                exit 1
              fi
            fi
          done
      - name: Helm unittest
        run: |
          for chart in operators/*/helm/*-operator operators/*/helm/*-testbed; do
            echo "--- unittest $chart ---"
            helm unittest "$chart"
          done
      # The target-cluster-access chart is validated on its own: it has no
      # subchart, no values.schema.json, and none of the operator scenarios the
      # loops above render (webhook, RBAC scope, image resources). Its own
      # scenarios turn on the namespace list, which is a required value.
      - name: Validate target-cluster-access chart
        run: |
          chart=deploy/target-cluster/target-cluster-access
          echo "--- lint $chart ---"
          helm lint "$chart" --set 'namespaces={openstack}'
          echo "--- Scenario 1: one namespace ---"
          helm template test "$chart" --set 'namespaces={openstack}'
          echo "--- Scenario 2: several namespaces ---"
          helm template test "$chart" --set 'namespaces={openstack,glance}'
          echo "--- Scenario 3: namespaces created elsewhere ---"
          helm template test "$chart" --set 'namespaces={openstack}' --set createNamespaces=false
          echo "--- unittest $chart ---"
          helm unittest "$chart"

  # End-to-end infrastructure deployment and Chainsaw test.
  # Deploys the full infrastructure stack to a kind cluster and validates health
  # of all operators, CRs, and ExternalSecrets via Chainsaw assertions.
  e2e-infra:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.e2e-infra == 'true'
    runs-on: self-hosted
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # Use composite action for shared Flux CLI + test deps + deploy-infra sequence.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
      - name: Run Chainsaw E2E tests
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e/chainsaw-config.yaml tests/e2e/infrastructure/
      # Locks the same-parameter re-run convergence (#650).  Runs make
      # deploy-infra directly (not the composite action, and deliberately
      # WITHOUT SKIP_KIND_CREATE) so the script's own existing-cluster
      # detection path -- the developer flow from the bug report -- is
      # exercised.  CLUSTER_NAME is passed explicitly from KIND_CLUSTER rather
      # than relying on the script's default happening to match it: without it,
      # editing KIND_CLUSTER above would make the script find no cluster of that
      # name, `kind create cluster` a fresh one, and deploy into that instead --
      # a silently-green second fresh deploy that tests zero convergence.
      - name: Re-run deploy-infra with unchanged parameters
        run: make deploy-infra
        env:
          CLUSTER_NAME: ${{ env.KIND_CLUSTER }}
      # Verifies a healthy stack is left unchanged after the same-parameter
      # re-run -- including the two `no-*` absence suites still passing.  A
      # distinct report name keeps the first run's JUnit XML intact.
      - name: Re-run Chainsaw E2E tests after unchanged re-run
        run: |
          chainsaw test --config tests/e2e/chainsaw-config.yaml --report-name chainsaw-report-rerun tests/e2e/infrastructure/
      # Additive opt-in leg (#650, #978) -- both opt-ins are set on ONE
      # convergence run. `make deploy-infra` is convergent: a second run
      # re-applies every overlay and re-walks all eight steps, so a separate
      # WITH_NFS re-run would repeat the whole base install for the sake of
      # one `kubectl apply -k deploy/kind/nfs` and one extra name on the
      # HelmRelease wait list. The gates that prove each opt-in landed live
      # inside this one invocation: the script's Phase-3 wait covers the
      # metrics-server and csi-driver-nfs HelmReleases, and its Step-3
      # `kubectl rollout status deployment/nfs-server` covers the server (the
      # best-effort nfsd/nfs/nfsv4 modprobe runs under the same passwordless
      # sudo the OVN legs rely on). Either failing fails the step. The
      # additive-convergence property is unchanged: the base stack was
      # installed by the first run and re-converged by the second, so this
      # third one still layers opt-ins onto an existing cluster.
      - name: Re-run deploy-infra with WITH_METRICS_SERVER=true and WITH_NFS=true
        run: make deploy-infra
        env:
          CLUSTER_NAME: ${{ env.KIND_CLUSTER }}
          WITH_METRICS_SERVER: "true"
          WITH_NFS: "true"
      # nfs-health SKIPs (exit 0) when Deployment/nfs-server is absent, because
      # it also runs on the two legs that never set WITH_NFS. This leg is the
      # only one that installs the stack, so dropping `WITH_NFS: "true"` above
      # -- a merge resolution, a revert, a copy of the step into a new job --
      # would leave the whole workflow green with the NFS stack shipped
      # untested and no failing signal anywhere: deploy-infra skips the
      # overlay, wait_for_helmreleases never gets csi-driver-nfs appended, the
      # suite prints SKIP, and `no-nfs-when-disabled` is not in the scoped set
      # below to contradict it. These two gets are the assertion that the
      # opt-in landed; each fails the leg on its own.
      - name: Assert the additive WITH_NFS opt-in landed
        run: |
          kubectl get deployment nfs-server -n openstack -o name
          kubectl get helmrelease csi-driver-nfs -n kube-system -o name
      # The full suite is NOT re-run here because
      # `no-metrics-server-when-disabled` and `no-nfs-when-disabled` assert
      # the absence of what this leg just (correctly) installed -- the scoped
      # set proves the base stack is untouched, Prometheus is still absent,
      # and both NFS exports mount through csi-driver-nfs.
      - name: Run scoped Chainsaw E2E tests after additive re-run
        run: |
          chainsaw test --config tests/e2e/chainsaw-config.yaml --report-name chainsaw-report-additive tests/e2e/infrastructure/infra-stack-health tests/e2e/infrastructure/garage-health tests/e2e/infrastructure/flux-web-health tests/e2e/infrastructure/no-prometheus-when-disabled tests/e2e/infrastructure/openbao-instance tests/e2e/infrastructure/nfs-health
      # Use shared diagnostic dump script.  `always()` (matching every other
      # e2e job) also covers the timeout-cancellation path -- `failure()`
      # alone is skipped when timeout-minutes expires, discarding the cluster
      # state exactly when a hung re-run leg makes it hardest to debug.
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-infra-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # Centralized image build for E2E test jobs.
  # Builds all Docker images (operator, service, tempest) once and pushes them
  # to GHCR with run-scoped tags (e2e-${run_id}-<tag>).  e2e-operator,
  # e2e-chaos and tempest pull from GHCR via load-e2e-images instead of
  # rebuilding, saving ~5-10 min per CI run.
  #
  # GH-310: Replaces the previous docker-save → zstd → upload-artifact path.
  # Layer-level pull retries plus the GHCR CDN avoid the 5-minute
  # download-artifact timeouts that flaked the artifact-based transport.
  build-e2e-images:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, verify-invalid-cr-fixtures, chainsaw-lint]
    # always(): allow the job to run when upstream Go jobs are skipped
    # (e.g. pure E2E test-definition PRs where go=false). The explicit
    # failure/cancelled guard still blocks if any upstream actually failed.
    #
    # Fork guard: push to GHCR requires a writable GITHUB_TOKEN, which forks
    # do not get on pull_request events. The downstream consumer jobs
    # (e2e-operator, e2e-chaos, tempest) all gate on
    # `needs.build-e2e-images.result == 'success'` and pull from GHCR via
    # `load-e2e-images`, so without the push there is nothing for them to
    # consume. We explicitly skip the whole E2E pipeline for fork PRs and
    # accept the tradeoff: forks still get full pre-flight signal (lint,
    # format-check, shellcheck, test, test-integration, test-race,
    # govulncheck, verify-codegen, helm-validate, e2e-infra), and a
    # maintainer can run E2E by pushing the change to a same-repo branch.
    # Reintroducing an artifact-based fallback for forks would bring back
    # the 5-minute download-artifact timeouts that GH-310 fixed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.build-e2e-images == 'true' &&
      github.event.pull_request.head.repo.fork != true &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    # 120 minutes: the 45 the job needed before the OVN build was added, plus
    # the 60 the build-ovn job of .github/workflows/build-images.yaml budgets
    # for an uncached compile of Open vSwitch and OVN from source, plus slack.
    # The cache does not shorten the first run of a PR: this job writes the
    # scope e2e-ovn, which nothing on the default branch populates (build-ovn
    # writes ovn-<platform-pair> from a different builder and build-args), and
    # Actions caches are isolated per PR ref. Under the previous 60 the job was
    # killed before the Tempest images were built, and every E2E job gates on
    # its success, so the PR would have shipped with no E2E coverage at all.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image-map: ${{ steps.images.outputs.image-map }}
    env:
      RUN_TAG: e2e-${{ github.run_id }}
    steps:
      # Full history: the resolver checks the revision of every operator image
      # it reuses against the commits in this checkout, and builds an image
      # whose revision it cannot find here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Enable BuildKit (required for type=gha cache) as the default builder.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The resolver says which image sources this pull request changed. This
      # step builds those and resolves every other image to the digest behind
      # the tag main last published, then hands the consumers one image-map so
      # they pull whatever it names. A run that changes no image source builds
      # nothing here and still leaves every consumer with a working reference.
      # An operator image is reused only when its revision carries every commit
      # to that operator's sources, so a :latest that main's manifest merge left
      # behind is built here instead.
      - name: Resolve images
        id: images
        env:
          CHANGED_OPERATORS: ${{ needs.changes.outputs.changed-operators }}
          CHANGED_SERVICES: ${{ needs.changes.outputs.changed-services }}
          CHANGED_TEMPEST: ${{ needs.changes.outputs.changed-tempest }}
          CHANGED_PROXY: ${{ needs.changes.outputs.changed-proxy }}
        run: hack/ci-resolve-e2e-images.sh

      # Build base images once — all subsequent service and tempest builds
      # reuse them via the skip-if-exists guard in ci-build-service-image.sh.
      # GHA cache scopes are shared across branches; these images rarely change.
      # Only the service and Tempest images build FROM them, so a run that
      # reuses both skips this step.
      - name: Build base images
        if: env.NEEDS_BASE_IMAGES == 'true'
        run: |
          docker build -t python-base \
            --cache-from type=gha,scope=e2e-python-base \
            --cache-to type=gha,mode=max,scope=e2e-python-base \
            --build-arg APT_MIRROR=http://azure.archive.ubuntu.com \
            images/python-base/
          docker build -t venv-builder \
            --cache-from type=gha,scope=e2e-venv-builder \
            --cache-to type=gha,mode=max,scope=e2e-venv-builder \
            images/venv-builder/

      # The keystone oidc-federation e2e projects the mod_auth_openidc sidecar.
      # The image is built when images/keystone-federation-proxy/** changed and
      # otherwise comes from the map.
      - name: Build federation proxy image
        if: env.BUILD_PROXY == 'true'
        run: |
          docker build -t "${IMAGE_PREFIX}/keystone-federation-proxy:dev" \
            --cache-from type=gha,scope=e2e-keystone-federation-proxy \
            --cache-to type=gha,mode=max,scope=e2e-keystone-federation-proxy \
            --build-arg APT_MIRROR=http://azure.archive.ubuntu.com \
            images/keystone-federation-proxy/

      # Build operator images for all resolved operators.
      - name: Build operator images
        run: |
          for op in $BUILD_OPERATORS; do
            echo "::group::Building ${op}-operator:dev"
            make docker-build OPERATOR="${op}" IMG="${IMAGE_PREFIX}/${op}-operator:dev" \
              DOCKER_CACHE_FROM="type=gha,scope=e2e-${op}-operator" \
              DOCKER_CACHE_TO="type=gha,mode=max,scope=e2e-${op}-operator"
            echo "::endgroup::"
          done

      # Build the service images whose sources changed, one line per
      # (service, release) pair. ci-resolve-e2e-images.sh derives the release
      # list per operator from releases/<release>/source-refs.yaml through
      # ci-service-image-releases.sh (the single source of truth, also used by
      # ci-generate-build-matrix.sh). Orchestration operators without a service
      # image — e.g. c5c3, which deploys K-ORC via an upstream Helm chart —
      # yield no releases and so never appear here. A line with a third field
      # builds a derived image (nova-compute) from the service's source.
      - name: Build service images
        env:
          # Authenticates the source clones from github.com; see the script.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          while read -r svc release image; do
            [ -n "$svc" ] || continue
            image="${image:-$svc}"
            echo "::group::Building ${image}:${release}"
            OPERATOR="${svc}" IMAGE="${image}" IMAGE_PREFIX="${IMAGE_PREFIX}" RELEASE="${release}" \
              DOCKER_BUILD_CACHE_FROM="type=gha,scope=e2e-${image}-${release}" \
              DOCKER_BUILD_CACHE_TO="type=gha,mode=max,scope=e2e-${image}-${release}" \
              hack/ci-build-service-image.sh
            echo "::endgroup::"
          done <<<"$BUILD_SERVICE_IMAGES"

      # The OVN daemon image carries no OpenStack release: its version is
      # pinned in images/ovn/Dockerfile and resolved by
      # hack/ci-resolve-ovn-version.sh, so the loop above never builds it.
      # OVN_VERSION goes to $GITHUB_ENV because the push step below and the
      # consumer jobs address the image by that tag and the workflow must not
      # carry a second copy of the pin.
      - name: Build OVN image
        env:
          # Authenticates the source fetches from github.com inside the
          # build; the script mounts it as a BuildKit secret.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          OVN_VERSION="$(hack/ci-resolve-ovn-version.sh)"
          echo "::group::Building ovn:${OVN_VERSION}"
          OVN_IMAGE="${IMAGE_PREFIX}/ovn:${OVN_VERSION}" \
            DOCKER_BUILD_CACHE_FROM="type=gha,scope=e2e-ovn" \
            DOCKER_BUILD_CACHE_TO="type=gha,mode=max,scope=e2e-ovn" \
            hack/ci-build-ovn-image.sh
          echo "::endgroup::"
          echo "OVN_VERSION=${OVN_VERSION}" >> "$GITHUB_ENV"

      # Build the Tempest images for the releases the map marked as built.
      - name: Build Tempest images
        run: |
          for release in $BUILD_TEMPEST_RELEASES; do
            echo "::group::Building tempest:${release}"
            RELEASE="${release}" TEMPEST_IMAGE="${IMAGE_PREFIX}/tempest:${release}" \
              DOCKER_BUILD_CACHE_FROM="type=gha,scope=e2e-tempest-${release}" \
              DOCKER_BUILD_CACHE_TO="type=gha,mode=max,scope=e2e-tempest-${release}" \
              hack/ci-build-tempest-image.sh
            echo "::endgroup::"
          done

      # GH-310: Push every E2E image this run built to GHCR under a run-scoped
      # tag so consumer jobs can `docker pull` instead of downloading a 355 MB
      # single-blob artifact (which intermittently times out at the 5-minute
      # mark). Tags use the form e2e-${run_id}-<original-tag>; cleanup-e2e-tags
      # prunes them at the end of the run, with a nightly safety net for
      # cancelled workflows in cleanup-images.yaml. A reused image is never
      # tagged here: the consumers pull it by the digest the map carries.
      - name: Push E2E images to GHCR
        run: |
          # docker push has no built-in retry, so a transient ghcr.io timeout
          # ("Client.Timeout exceeded while awaiting headers") fails the whole
          # job even though login already succeeded. Mirror the bounded
          # retry/backoff of the registry-login action so push flakes no
          # longer break CI.
          MAX_ATTEMPTS=5
          BASE_DELAY=5
          push_with_retry() {
            local run_ref="$1"
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              if docker push "${run_ref}"; then
                return 0
              fi
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                local delay=$((attempt * BASE_DELAY))
                echo "::warning::docker push ${run_ref} failed (attempt ${attempt}/${MAX_ATTEMPTS}); retrying in ${delay}s"
                sleep "$delay"
              fi
            done
            echo "::error::docker push ${run_ref} failed after ${MAX_ATTEMPTS} attempts"
            return 1
          }
          push_image() {
            local local_ref="$1"     # e.g. ghcr.io/c5c3/keystone:2025.2
            local repo="${local_ref%:*}"
            local tag="${local_ref##*:}"
            local run_ref="${repo}:${RUN_TAG}-${tag}"
            echo "::group::Push ${run_ref}"
            docker tag "${local_ref}" "${run_ref}"
            push_with_retry "${run_ref}"
            echo "::endgroup::"
          }
          if [ "$BUILD_PROXY" = "true" ]; then
            push_image "${IMAGE_PREFIX}/keystone-federation-proxy:dev"
          fi
          for op in $BUILD_OPERATORS; do
            push_image "${IMAGE_PREFIX}/${op}-operator:dev"
          done
          while read -r svc release image; do
            [ -n "$svc" ] || continue
            push_image "${IMAGE_PREFIX}/${image:-$svc}:${release}"
          done <<<"$BUILD_SERVICE_IMAGES"
          for release in $BUILD_TEMPEST_RELEASES; do
            push_image "${IMAGE_PREFIX}/tempest:${release}"
          done
          push_image "${IMAGE_PREFIX}/ovn:${OVN_VERSION}"

  # End-to-end operator tests using kind cluster and Chainsaw.
  # Loads pre-built images from the build-e2e-images artifact, deploys via Helm,
  # and runs Chainsaw test suites per operator.
  # Only runs when Go/operator code or E2E test definitions change, and only
  # after all pre-flight checks (lint, tests, shellcheck) have passed.
  e2e-operator:
    needs: [changes, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.has-e2e-operators == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    # The keystone leg is pinned back to Blacksmith for now: it is by far the
    # largest suite in this matrix and has not been stable on the self-hosted
    # runners since they took over. The other legs stay self-hosted.
    runs-on: ${{ matrix.operator == 'keystone' && 'blacksmith-4vcpu-ubuntu-2404' || 'self-hosted' }}
    # 150 minutes for the nova leg: the kind broker, fourteen extra image loads
    # (about 4 minutes) and five sibling deploys (about 2 minutes) come before
    # its suites, and each suite brings five services up. On 2026-09-18 the leg
    # reached its first suite after 14.5 minutes and spent the next 76 on twelve
    # of its fifteen suites, two at a time and without a failed step, before a
    # 90-minute wall cancelled it with three full-tier suites unfinished. A wall
    # that arrives first kills chainsaw outright: no catch block runs and no
    # JUnit report is written, so the job says nothing about which suite it
    # stopped in. Under a 150-minute wall the leg took 125 to 137 minutes,
    # until compute-node-pool, 27 minutes that no other suite runs beside,
    # pushed it past 150 on 2026-09-24 with one suite unfinished. It now runs
    # as two shards (the matrix below), each with the bring-up and about half
    # the suites: about 80 to 95 minutes, so 150 is the wall per shard with
    # headroom for a slow runner. Move a suite between the shards, or
    # re-derive, if one overruns. The other legs keep 68; the neutron leg,
    # with one sibling, took 41 minutes on 2026-09-17.
    timeout-minutes: ${{ matrix.operator == 'nova' && 150 || 68 }}
    permissions:
      contents: read
      packages: read
    # e2e-operators with the nova leg split into shards 1 and 2 (see "Shard
    # the e2e-operator matrix" in the changes job). A leg without a shard is
    # named as before, e2e-operator (<operator>).
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.e2e-operator-legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # Resolve which images this operator needs: always its operator image,
      # plus one service image per release that ships one. The release list
      # comes from source-refs.yaml (ci-service-image-releases.sh), so an
      # orchestration operator without a service image — e.g. c5c3 —
      # loads only its operator image instead of failing to pull a
      # non-existent c5c3:<release>.
      - name: Resolve E2E images
        id: e2e-images
        env:
          OPERATOR: ${{ matrix.operator }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          releases="$(OPERATOR="${OPERATOR}" hack/ci-service-image-releases.sh)"
          OVN_VERSION="$(hack/ci-resolve-ovn-version.sh)"
          refs="${IMAGE_PREFIX}/${OPERATOR}-operator:dev"
          for release in ${releases}; do
            refs="${refs}"$'\n'"${IMAGE_PREFIX}/${OPERATOR}:${release}"
          done
          # The oidc-federation suite projects the mod_auth_openidc sidecar,
          # so the keystone leg also pulls the federation proxy image.
          if [ "${OPERATOR}" = "keystone" ]; then
            refs="${refs}"$'\n'"${IMAGE_PREFIX}/keystone-federation-proxy:dev"
          fi
          # ovn ships no per-release service image: its DaemonSets and Pods all
          # run the one OVN daemon image the operator hard-codes at the pin
          # hack/ci-resolve-ovn-version.sh reads from images/ovn/Dockerfile.
          if [ "${OPERATOR}" = "ovn" ]; then
            refs="${refs}"$'\n'"${IMAGE_PREFIX}/ovn:${OVN_VERSION}"
          fi
          # A Neutron never reaches Ready without a live OVNCentral, so the
          # neutron leg deploys the ovn-operator as well and needs both the
          # operator image and the daemon image that operator rolls out.
          if [ "${OPERATOR}" = "neutron" ]; then
            refs="${refs}"$'\n'"${IMAGE_PREFIX}/ovn-operator:dev"$'\n'"${IMAGE_PREFIX}/ovn:${OVN_VERSION}"
          fi
          # A Nova has no identity-free posture (spec.keystoneEndpoint and
          # spec.serviceUser are required), and its functional suites boot a
          # server, which needs a Placement allocation, a Glance image and a
          # Neutron backed by an OVNCentral. The nova leg therefore deploys
          # five sibling operators and needs their images plus every service
          # image each sibling ships, so the per-release Nova suites can pair
          # a release with its own siblings.
          if [ "${OPERATOR}" = "nova" ]; then
            for sibling in keystone placement glance ovn neutron; do
              refs="${refs}"$'\n'"${IMAGE_PREFIX}/${sibling}-operator:dev"
              for release in $(OPERATOR="${sibling}" hack/ci-service-image-releases.sh); do
                refs="${refs}"$'\n'"${IMAGE_PREFIX}/${sibling}:${release}"
              done
            done
            # The compute-node-pool suite runs a NovaCompute, whose pods run
            # the nova-compute image of each nova release.
            for release in $(OPERATOR=nova hack/ci-service-image-releases.sh); do
              refs="${refs}"$'\n'"${IMAGE_PREFIX}/nova-compute:${release}"
            done
            refs="${refs}"$'\n'"${IMAGE_PREFIX}/ovn:${OVN_VERSION}"
            # The catalog, seed and verify Jobs of the functional Nova suites
            # run the `openstack` client the tempest image bundles, at 2025.2
            # on both per-release suites, so it is loaded once.
            refs="${refs}"$'\n'"${IMAGE_PREFIX}/tempest:2025.2"
          fi
          {
            echo "releases<<EOF"; echo "${releases}"; echo "EOF"
            echo "refs<<EOF"; echo "${refs}"; echo "EOF"
            echo "ovn-version=${OVN_VERSION}"
          } >> "$GITHUB_OUTPUT"
      # GH-310: Pull pre-built images from GHCR (run-scoped tag).
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: ${{ steps.e2e-images.outputs.refs }}
      - name: Load images into kind
        env:
          OPERATOR: ${{ matrix.operator }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          SERVICE_RELEASES: ${{ steps.e2e-images.outputs.releases }}
          OVN_VERSION: ${{ steps.e2e-images.outputs.ovn-version }}
          REFS: ${{ steps.e2e-images.outputs.refs }}
          KIND_CLUSTER: ${{ env.KIND_CLUSTER }}
        run: |
          # The nova leg loads the resolve step's list as it stands, so the
          # sibling images are named in one place, and in one call, so the
          # python-base layers the service images share are saved and imported
          # once rather than once per image. It runs first because kind saves
          # every image of a call as soon as one is missing: the per-image
          # loads below then find the leg's own images on the node and skip
          # them.
          if [ "${OPERATOR}" = "nova" ]; then
            # shellcheck disable=SC2086 # deliberate: split the ref list
            kind load docker-image ${REFS} --name "${KIND_CLUSTER}"
          fi
          kind load docker-image "${IMAGE_PREFIX}/${OPERATOR}-operator:dev" --name "${KIND_CLUSTER}"
          # shellcheck disable=SC2086 # deliberate: split the release list
          for release in ${SERVICE_RELEASES}; do
            kind load docker-image "${IMAGE_PREFIX}/${OPERATOR}:${release}" --name "${KIND_CLUSTER}"
          done
          if [ "${OPERATOR}" = "keystone" ]; then
            kind load docker-image "${IMAGE_PREFIX}/keystone-federation-proxy:dev" --name "${KIND_CLUSTER}"
          fi
          if [ "${OPERATOR}" = "ovn" ]; then
            kind load docker-image "${IMAGE_PREFIX}/ovn:${OVN_VERSION}" --name "${KIND_CLUSTER}"
          fi
          if [ "${OPERATOR}" = "neutron" ]; then
            kind load docker-image "${IMAGE_PREFIX}/ovn-operator:dev" --name "${KIND_CLUSTER}"
            kind load docker-image "${IMAGE_PREFIX}/ovn:${OVN_VERSION}" --name "${KIND_CLUSTER}"
          fi
          # The image-upgrade E2E test re-tags the 2025.2 service image; only
          # operators that ship a 2025.2 service image need it loaded.
          # shellcheck disable=SC2086 # deliberate: split the release list
          if printf '%s\n' ${SERVICE_RELEASES} | grep -qx 2025.2; then
            docker tag "${IMAGE_PREFIX}/${OPERATOR}:2025.2" \
              "${IMAGE_PREFIX}/${OPERATOR}:2025.2-upgraded"
            kind load docker-image "${IMAGE_PREFIX}/${OPERATOR}:2025.2-upgraded" --name "${KIND_CLUSTER}"
          fi
      # Use composite action for shared Flux CLI + test deps + deploy-infra sequence.
      # The ovn and neutron chassis DaemonSets open a Geneve tunnel from the
      # kind node, which needs the openvswitch and geneve modules loaded on the
      # host, and the nova leg's compute-node-pool suite runs a chassis on the
      # node its nova-compute waits for. Empty on every other leg, where
      # deploy-infra.sh keeps its default of not touching the host's modules.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_OVN_KERNEL_MODULES: ${{ (matrix.operator == 'ovn' || matrix.operator == 'neutron' || matrix.operator == 'nova') && 'true' || '' }}
          # The cinder suites mount their volumes as inline CSI volumes from
          # the kind NFS export, and each one takes its own vhost on the
          # shared broker. Every Nova process dials the bus, and the
          # scheduler and the conductor report ready off their broker
          # connection, so the nova leg takes the broker and not the NFS
          # export. Empty on every other leg, where deploy-infra.sh keeps
          # its default of installing neither.
          WITH_NFS: ${{ matrix.operator == 'cinder' && 'true' || '' }}
          WITH_MESSAGING: ${{ (matrix.operator == 'cinder' || matrix.operator == 'nova') && 'true' || '' }}
      # The c5c3 ControlPlane controller Owns()/Watches() the Keystone,
      # KeystoneIdentityBackend, Horizon, Glance, GlanceBackend, and K-ORC kinds
      # (ControlPlaneReconciler.SetupWithManager). controller-runtime informers
      # for a kind whose CRD is absent never sync, so without these CRDs the
      # elected leader dies on the controller's 2-minute cache-sync timeout and
      # the ControlPlane reconciler never runs on this leg — the webhook keeps
      # serving, so the breakage only surfaces in suites that need the
      # reconciler. Install the sibling operators' CRDs (charts only — their
      # controllers stay undeployed; suites that need them run in the
      # e2e-controlplane job) and K-ORC via the shared pinned installer.
      - name: Install CRDs watched by the c5c3-operator
        if: matrix.operator == 'c5c3'
        env:
          # Authenticates the K-ORC clone from github.com; see the script.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          kubectl apply -f operators/keystone/helm/keystone-operator/crds/
          kubectl apply -f operators/horizon/helm/horizon-operator/crds/
          kubectl apply -f operators/glance/helm/glance-operator/crds/
          kubectl apply -f operators/placement/helm/placement-operator/crds/
          hack/ci-deploy-korc.sh
      # The nova leg runs the identity, placement, image, OVN and network
      # operators beside the nova-operator: spec.keystoneEndpoint and
      # spec.serviceUser are required on the CRD, and a booted server needs a
      # Placement allocation, a Glance image and a Neutron port. The OVN
      # control plane comes with the neutron-operator's need for a live
      # OVNCentral, and the compute-node-pool suite runs a single-node
      # OVNChassis beside it for the nova-compute of its NovaCompute.
      - name: Deploy keystone-operator
        if: matrix.operator == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
          NAMESPACE: keystone-system
      - name: Deploy placement-operator
        if: matrix.operator == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: placement
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/placement-operator
          NAMESPACE: placement-system
      - name: Deploy glance-operator
        if: matrix.operator == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: glance
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/glance-operator
          NAMESPACE: glance-system
      # Both neutron reconcilers Watches() an OVN kind: the Neutron controller
      # reads the OVNCentral's published Northbound and Southbound addresses,
      # and the NeutronMetadataAgent controller resolves its OVNChassis. The
      # CRDs alone would only keep the manager's cache sync from timing out;
      # the objects those reconcilers read still have to exist and be Ready, so
      # this leg deploys the ovn-operator itself into ovn-system. The deploy
      # script installs the OVN CRDs on the way. The nova leg deploys a Neutron
      # of its own, so it needs the same OVNCentral behind it.
      - name: Deploy ovn-operator
        if: matrix.operator == 'neutron' || matrix.operator == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ovn
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/ovn-operator
          NAMESPACE: ovn-system
      # After the ovn-operator, whose OVNCentral CRD the neutron-operator
      # watches, and before the nova-operator.
      - name: Deploy neutron-operator
        if: matrix.operator == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: neutron
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/neutron-operator
          NAMESPACE: neutron-system
      # Use shared operator deployment script. NAMESPACE mirrors what
      # hack/ci-dump-diagnostics.sh derives (${OPERATOR}-system) so the
      # diagnostics of a failed run actually find the operator's pods and logs
      # — without it every matrix leg lands in the script default
      # keystone-system while the dump looks elsewhere.
      - name: Deploy operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ${{ matrix.operator }}
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
          NAMESPACE: ${{ matrix.operator }}-system
          # kind's ClusterIPs fall in this range; allowlisting it lets the
          # oidc-federation suite's discovery-mode backend fetch the in-cluster
          # Keycloak metadata past the operator's SSRF guard. keystone-gated
          # because only the keystone chart exposes federation.metadataAllowCidrs.
          FEDERATION_METADATA_ALLOW_CIDRS: ${{ matrix.operator == 'keystone' && '10.96.0.0/12' || '' }}
          # The barbican suites create managed BarbicanSecretStore objects in the
          # openstack Namespace, and the operator only mints their OpenBaoCluster
          # provisioner token where the chart granted it a TokenRequest Role,
          # restricted to the provisioner account of the proving instance.
          # ci-deploy-operator.sh applies the value for OPERATOR=barbican only,
          # so the other matrix legs ignore it.
          BARBICAN_SECRET_STORE_GRANTS: openstack=openbao-instance-provisioner
      - name: Run E2E tests
        env:
          OPERATOR: ${{ matrix.operator }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p _output/reports
          # Operator-chart-level tests (e.g. network-policy-egress)
          # live under tests/e2e/<operator>-operator/ to keep them separate from
          # the per-CR tests under tests/e2e/<operator>/. Include the directory
          # only when it exists so operators without chart-level tests still run.
          test_dirs=("tests/e2e/${OPERATOR}/")
          if [ -d "tests/e2e/${OPERATOR}-operator/" ]; then
            test_dirs+=("tests/e2e/${OPERATOR}-operator/")
          fi
          # The nova leg runs as two shards. Shard 2 runs the suites named
          # below, shard 1 every other suite of both directories, so a new
          # suite lands in shard 1 without an edit here. The split follows the
          # durations measured on 2026-09-24: each shard takes three of the six
          # suites that run 24 to 30 minutes, compute-node-pool among shard 2's,
          # and shard 1 takes gateway-quick-start-smoke and scale, the two other
          # suites that run alone (concurrent: false). The NovaCompute suites
          # stay together in shard 2. The suites are passed as directories
          # because chainsaw's include/exclude regex filters are no-ops.
          if [ "${OPERATOR}" = "nova" ]; then
            shard_two="compute-node-pool invalid-novacompute-cr basic-deployment-2026-1 release-upgrade healthcheck deletion-cleanup pod-security-restricted"
            test_dirs=()
            for dir in tests/e2e/nova/*/ tests/e2e/nova-operator/*/; do
              case " ${shard_two} " in
                *" $(basename "${dir}") "*) shard=2 ;;
                *) shard=1 ;;
              esac
              if [ "${shard}" = "${SHARD}" ]; then
                test_dirs+=("${dir}")
              fi
            done
            if [ "${#test_dirs[@]}" -eq 0 ]; then
              echo "::error::no nova suite belongs to shard '${SHARD}'"
              exit 1
            fi
          fi
          # Every neutron suite carries its own OVNCentral beside the Neutron
          # API, its two worker Deployments and a db-sync Job, so four of them
          # at once do not fit one kind node: the workers and the db-sync Jobs
          # stay Pending on "Insufficient cpu" and the CRs never reach Ready.
          # A cinder suite is the same size: three or four Deployments, a
          # db-sync Job and a probe pod, which four at once do not fit on a
          # 4-vCPU node either.
          # A Nova suite of #1039 carries a Keystone, an OVNCentral, a Neutron,
          # a Placement, a Glance and the five Nova workloads, so four at once
          # do not fit either; the nova leg is narrowed before the first such
          # suite exists.
          # Only these three legs are narrowed; the shared config's parallel: 4
          # is what every other operator runs at.
          parallel=()
          if [ "${OPERATOR}" = "neutron" ] || [ "${OPERATOR}" = "cinder" ] || [ "${OPERATOR}" = "nova" ]; then
            parallel=(--parallel 2)
          fi
          chainsaw test --config tests/e2e/chainsaw-config.yaml "${parallel[@]}" "${test_dirs[@]}"
      # Use shared diagnostic dump script.
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: ${{ matrix.operator }}
      # The neutron leg runs a second operator, in ovn-system. The dump above
      # derives its Namespace from the matrix operator and never looks there.
      - name: Dump diagnostic info (ovn)
        if: always() && matrix.operator == 'neutron'
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: ovn
      # The nova leg runs five more operators, each in its own Namespace the
      # first dump never looks at. One call per operator, since the script
      # reads a single OPERATOR. OPERATOR_ONLY keeps each pass to the sections
      # that differ: the infrastructure block and the openstack Namespace's Job
      # and pod logs do not change with OPERATOR, and the dump above already
      # emitted them. Repeated five times they would bury the operator evidence
      # this step exists for and spend the grace window `Delete kind cluster`
      # below needs when the job wall cancels the run.
      - name: Dump diagnostic info (nova siblings)
        if: always() && matrix.operator == 'nova'
        run: |
          for op in keystone placement glance ovn neutron; do
            OPERATOR="${op}" OPERATOR_ONLY=1 hack/ci-dump-diagnostics.sh
          done
      # Two artifacts of one run cannot share a name, so each nova shard adds
      # its number: e2e-nova-1-junit-report and e2e-nova-2-junit-report.
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.operator }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # Operator helm-upgrade-in-place E2E: installs the last released
  # keystone-operator chart+image from GHCR as the baseline, brings a Keystone
  # CR to Ready, then `helm upgrade`s to the locally built chart+CRDs and asserts
  # the deployed Keystone survives the operator upgrade (Ready persists,
  # status.installedRelease unchanged, no re-bootstrap). Given the cross-release
  # bootstrap history this is the highest-risk untested path. The suite manages
  # the operator release itself, so it lives outside tests/e2e/ and runs in its
  # own job rather than the per-CR e2e-operator matrix.
  e2e-operator-upgrade:
    needs: [changes, build-e2e-images]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.e2e-operator-upgrade == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    timeout-minutes: 68
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-helm guarantees `helm` (registry login + pull) regardless of the
      # runner image, matching the helm-push job.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # Pull the run-scoped images from GHCR: the locally built operator (:dev,
      # the upgrade target) and the 2025.2 service image the CR fixture uses.
      # This step also `docker login`s GHCR, which the baseline image pull below
      # reuses.
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone:2025.2
      - name: Load images into kind
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone:2025.2 --name ${{ env.KIND_CLUSTER }}
      # `helm registry login` is separate from the `docker login` that
      # load-e2e-images performs; the released chart is pulled via `helm pull`.
      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
      # Fetch the last released operator chart+image (the upgrade baseline) and
      # load the released image into kind.
      - name: Fetch released operator baseline
        id: baseline
        run: hack/ci-fetch-released-operator.sh
        env:
          KIND_CLUSTER: ${{ env.KIND_CLUSTER }}
      # Use composite action for shared Flux CLI + test deps + deploy-infra sequence.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
      # Install the RELEASED operator (pulled chart + :latest image) as the
      # upgrade baseline. CHART_DIR points at the untarred pulled chart so
      # ci-deploy-operator.sh installs the released chart, not the in-repo one.
      - name: Deploy released operator (baseline)
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
          IMAGE_TAG: latest
          CHART_DIR: ${{ steps.baseline.outputs.chart_dir }}
      - name: Run operator upgrade E2E
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e-operator-upgrade/chainsaw-config.yaml tests/e2e-operator-upgrade/
      # Use shared diagnostic dump script.
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: keystone
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-operator-upgrade-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # End-to-end chaos tests using kind cluster, Chaos Mesh,
  # and Chainsaw.  Builds the keystone operator image, deploys it with Chaos
  # Mesh infrastructure, and runs chaos test suites (MariaDB pod kill,
  # Memcached pod kill, OpenBao pod kill, network partition, network latency).
  # Only runs when Go/operator code or chaos test definitions change (or when
  # the run-chaos PR label is applied), and only after all pre-flight checks
  # have passed or been skipped.
  #
  # Chaos tests run only after every e2e-operator matrix leg has finished
  # without failure: a failed e2e-operator run skips e2e-chaos, a
  # path-filter-skipped one does not block it (always() + the
  # failure/cancelled guards below). This supersedes,
  # which had removed the dependency to run both jobs in parallel.
  #
  # run-chaos PR label trigger added for on-demand chaos
  # validation of operator code changes.
  #
  # Gating is split by matrix leg (see continue-on-error below): the pod-chaos
  # leg is blocking — an operator-restart/PDB/rotation regression fails the
  # build — while the network-chaos and ovn legs stay non-blocking. The
  # network leg's ip_set/xt_set/sch_netem dependency makes it prone to
  # environment flakiness, and the ovn leg builds an OVN datapath out of the
  # host's openvswitch/geneve modules, which puts it under the non-blocking
  # entry rule of `### Kernel-module-dependent suites` in
  # docs/reference/ci-cd/ci-workflow.md. On-demand pre-validation of any leg is
  # available via the run-chaos PR label.
  e2e-chaos:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images, e2e-operator]
    # always(): allow the job to run when upstream Go jobs are skipped
    # (e.g. pure E2E test-definition PRs where go=false). The explicit
    # failure/cancelled guard still blocks if any upstream actually failed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.e2e-chaos == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    # The pod leg is pinned back to Blacksmith for now: it is the blocking leg
    # and has not been stable on the self-hosted runners since they took over.
    # The network and ovn legs stay self-hosted. The split into three matrix
    # entries is kept so PodChaos, NetworkChaos and the OVN datapath suite stay
    # independently gated (see continue-on-error below) and so the suites run
    # in parallel.
    #
    # test_dirs lists the per-suite test directories explicitly, so a new test
    # directory must be added to the appropriate suite below when introduced.
    # (chainsaw's --{include,exclude}-test-regex flags were no-ops up to
    # v0.2.14; the pinned release applies them, but they match the Go test
    # name chainsaw/<metadata.name>, not a directory, and a bare name selects
    # nothing and still exits 0, so the explicit list stays.)
    strategy:
      fail-fast: false
      matrix:
        include:
          # tests/e2e/infrastructure/chaos-mesh-health is included in
          # every matrix entry so the kind-only chaos-mesh installation is
          # health-checked against the cluster each runner spins up. Every
          # runner sets WITH_CHAOS_MESH=true via setup-e2e-infra (env block
          # below), so the test's runtime presence guard never SKIPs here.
          - suite: pod
            runner: blacksmith-4vcpu-ubuntu-2404
            test_dirs: >-
              tests/e2e/infrastructure/chaos-mesh-health
              tests/e2e-chaos/api-pod-kill-pdb
              tests/e2e-chaos/cronjob-rotation-failure
              tests/e2e-chaos/deletion-stuck-finalizer
              tests/e2e-chaos/mariadb-pod-kill
              tests/e2e-chaos/memcached-pod-kill
              tests/e2e-chaos/horizon-memcached-pod-kill
              tests/e2e-chaos/horizon-operator-pod-kill
              tests/e2e-chaos/openbao-pod-kill
              tests/e2e-chaos/keystone-federation
              tests/e2e-chaos/operator-pod-crash
              tests/e2e-chaos/operator-pod-kill
              tests/e2e-chaos/glance-operator-pod-kill
              tests/e2e-chaos/placement-operator-pod-kill
              tests/e2e-chaos/barbican-operator-pod-kill
          - suite: network
            runner: self-hosted
            test_dirs: >-
              tests/e2e/infrastructure/chaos-mesh-health
              tests/e2e-chaos/mariadb-network-latency
              tests/e2e-chaos/mariadb-network-partition
              tests/e2e-chaos/glance-garage-outage
              tests/e2e-chaos/barbican-openbao-outage
              tests/e2e-chaos/neutron-mariadb-outage
              tests/e2e-chaos/neutron-broker-outage
              tests/e2e-chaos/cinder-operator-pod-kill
              tests/e2e-chaos/cinder-broker-outage
              tests/e2e-chaos/cinder-nfs-outage
          # ovn-southbound-outage kills the Southbound Pod and asserts the
          # chassis datapath keeps forwarding, so the leg needs the openvswitch
          # and geneve modules on the runner host (WITH_OVN_KERNEL_MODULES
          # below). That kernel-module dependency is what keeps the leg
          # non-blocking. No suite here touches Keystone, so this leg deploys
          # the ovn-operator alone and skips the keystone stack.
          - suite: ovn
            runner: self-hosted
            test_dirs: >-
              tests/e2e/infrastructure/chaos-mesh-health
              tests/e2e-chaos/ovn-southbound-outage
          # The three nova outage suites bring up the heaviest stack in this
          # job: a Keystone, a Placement, an OVNCentral, a Neutron, a Glance
          # and a Nova with a fake compute behind it. They get a leg of their
          # own instead of widening the network leg, which already spends 78 of
          # its 90 minutes and deploys no placement-operator. Like the ovn leg
          # this one is non-blocking (see continue-on-error below): all three
          # faults are NetworkChaos partitions and carry the sch_netem/ip_set
          # dependency the network leg carries.
          - suite: nova
            runner: self-hosted
            test_dirs: >-
              tests/e2e/infrastructure/chaos-mesh-health
              tests/e2e-chaos/nova-broker-outage
              tests/e2e-chaos/nova-mariadb-outage
              tests/e2e-chaos/nova-placement-outage
    runs-on: ${{ matrix.runner }}
    # 150 minutes for the nova leg, 90 for the other three. This leg loads
    # eighteen images and runs eight operator deploys before its first suite,
    # and its three suites each stand up a Keystone, an OVNCentral, a Neutron, a
    # Placement, a Glance and a five-workload Nova. They run one after the other:
    # tests/e2e-chaos/chainsaw-config.yaml sets parallel: 1, where the
    # e2e-operator nova leg fits comparable suites into 90 minutes only because
    # it runs them two at a time.
    #
    # The wall has to outlast that bring-up plus the suites that pass plus the
    # step a stalling suite times out in and the catch block after it —
    # nova-broker-outage's heaviest step alone declares 43 minutes (six applies
    # and five 8m asserts on the sibling services) and its catch another 13.
    # Under that, the job wall arrives first: chainsaw is killed outright, no
    # catch block and no step cleanup runs, the JUnit report is never written,
    # and the leg — non-blocking per continue-on-error below — reports as a
    # cancelled job that says nothing about which suite stalled. The bring-up
    # term is the estimate in that sum; confirm it against the first green run
    # of this leg and re-derive if it overruns.
    timeout-minutes: ${{ matrix.suite == 'nova' && 150 || 90 }}
    # Pod-chaos is blocking; network-chaos, ovn and nova stay non-blocking
    # (their kernel-module dependency keeps them flakiness-prone). See the
    # gating note above the job. The nova leg is the third of them because its
    # three suites are NetworkChaos partitions on the sch_netem and ip_set
    # modules, the same dependency the network leg's suites have.
    #
    # The three non-blocking legs are named, rather than negating the blocking
    # one: a fifth leg added to the matrix above then gates merges by default
    # and has to be argued out of it here, instead of arriving silently
    # non-blocking and passing green while it fails.
    continue-on-error: ${{ matrix.suite == 'network' || matrix.suite == 'ovn' || matrix.suite == 'nova' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # images/ovn/Dockerfile holds the pin; resolving it here keeps the tag
      # out of this workflow.
      - name: Resolve OVN version
        run: echo "OVN_VERSION=$(hack/ci-resolve-ovn-version.sh)" >> "$GITHUB_ENV"
      # GH-310: Pull pre-built images from GHCR (run-scoped tag).
      # The keystone stack is skipped on the ovn leg, whose suites bring up no
      # Keystone, Horizon, Glance or Barbican, so it loads through a step of its
      # own rather than repeating the leg gate on every image.
      - name: Load E2E images (keystone stack)
        if: matrix.suite != 'ovn'
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone:2025.2
            ${{ env.IMAGE_PREFIX }}/keystone-federation-proxy:dev
            ${{ env.IMAGE_PREFIX }}/horizon-operator:dev
            ${{ env.IMAGE_PREFIX }}/horizon:2025.2
            ${{ env.IMAGE_PREFIX }}/glance-operator:dev
            ${{ env.IMAGE_PREFIX }}/glance:2025.2
            ${{ env.IMAGE_PREFIX }}/barbican-operator:dev
            ${{ env.IMAGE_PREFIX }}/barbican:2025.2
      # Every entry below is gated on the legs that deploy it; the action skips
      # the blank lines the other legs render here.
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            # placement is exercised by the pod leg alone (see the pod-leg-only
            # load and deploy steps below).
            ${{ matrix.suite == 'pod' && format('{0}/placement-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ matrix.suite == 'pod' && format('{0}/placement:2025.2', env.IMAGE_PREFIX) || '' }}
            # Both the ovn leg and the network leg's neutron suites bring up an
            # OVNCentral, so both need the operator image and the OVN daemon
            # image that operator rolls out.
            ${{ matrix.suite != 'pod' && format('{0}/ovn-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ matrix.suite != 'pod' && format('{0}/ovn:{1}', env.IMAGE_PREFIX, env.OVN_VERSION) || '' }}
            # The two neutron outage suites run on the network leg alone.
            ${{ matrix.suite == 'network' && format('{0}/neutron-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ matrix.suite == 'network' && format('{0}/neutron:2025.2', env.IMAGE_PREFIX) || '' }}
            # The three cinder outage suites run on the network leg alone.
            # Each deploys a Cinder, so each needs the service image beside
            # the operator one.
            ${{ matrix.suite == 'network' && format('{0}/cinder-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ matrix.suite == 'network' && format('{0}/cinder:2025.2', env.IMAGE_PREFIX) || '' }}
            # The three nova outage suites run on the nova leg alone. The OVN
            # pair above already covers that leg (!= 'pod'), and the keystone
            # and glance images arrive with the keystone stack on every
            # non-ovn leg, so seven refs are left to name here.
            # A Nova boots no server without a Placement to claim from.
            ${{ matrix.suite == 'nova' && format('{0}/placement-operator:dev', env.IMAGE_PREFIX) || '' }}
            # The Placement API that operator rolls out.
            ${{ matrix.suite == 'nova' && format('{0}/placement:2025.2', env.IMAGE_PREFIX) || '' }}
            # The port of every booted server comes from a Neutron.
            ${{ matrix.suite == 'nova' && format('{0}/neutron-operator:dev', env.IMAGE_PREFIX) || '' }}
            # The Neutron API and the metadata agent beside it.
            ${{ matrix.suite == 'nova' && format('{0}/neutron:2025.2', env.IMAGE_PREFIX) || '' }}
            # The operator whose CRs the three suites drive.
            ${{ matrix.suite == 'nova' && format('{0}/nova-operator:dev', env.IMAGE_PREFIX) || '' }}
            # The five Nova workloads and the fake compute beside them.
            ${{ matrix.suite == 'nova' && format('{0}/nova:2025.2', env.IMAGE_PREFIX) || '' }}
            # The openstack client the catalog, seed and verify Jobs run.
            ${{ matrix.suite == 'nova' && format('{0}/tempest:2025.2', env.IMAGE_PREFIX) || '' }}
      - name: Load images into kind
        if: matrix.suite != 'ovn'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-federation-proxy:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/horizon-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/horizon:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/glance-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/glance:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/barbican-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/barbican:2025.2 --name ${{ env.KIND_CLUSTER }}
      # placement-operator-pod-kill is the only suite that touches placement and
      # it runs on the pod leg; none of the network leg's suites reference it.
      # Keep the load off that leg — `kind load docker-image` is a docker
      # save piped into the node's containerd and the placement service image is
      # the expensive half of the pair.
      - name: Load placement images into kind
        if: matrix.suite == 'pod'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/placement-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/placement:2025.2 --name ${{ env.KIND_CLUSTER }}
      # kubelet only skips the registry for a tag already on the node, so both
      # legs that run an OVNCentral load the daemon image the operator rolls
      # out alongside the operator image itself.
      - name: Load OVN images into kind
        if: matrix.suite != 'pod'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }} --name ${{ env.KIND_CLUSTER }}
      - name: Load neutron images into kind
        if: matrix.suite == 'network'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron:2025.2 --name ${{ env.KIND_CLUSTER }}
      - name: Load cinder images into kind
        if: matrix.suite == 'network'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/cinder-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/cinder:2025.2 --name ${{ env.KIND_CLUSTER }}
      # The nova leg's own seven. None of the per-leg steps above reaches them:
      # the placement pair is gated on the pod leg and the neutron pair on the
      # network one. The OVN pair this leg also needs is loaded by the
      # `!= 'pod'` step above.
      - name: Load nova leg images into kind
        if: matrix.suite == 'nova'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/placement-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/placement:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/nova-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/nova:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/tempest:2025.2 --name ${{ env.KIND_CLUSTER }}
      # Use composite action for shared Flux CLI + test deps + deploy-infra sequence.
      # Opt in to Chaos Mesh - required for the chaos suites; covers every matrix entry.
      # The ovn leg's chassis DaemonSet opens a Geneve tunnel from the kind
      # node, which needs the openvswitch and geneve modules on the host. Empty
      # on the other two legs, where deploy-infra.sh keeps its default of not
      # touching the host's modules.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_CHAOS_MESH: "true"
          WITH_OVN_KERNEL_MODULES: ${{ matrix.suite == 'ovn' && 'true' || '' }}
          # The three cinder suites attach an NFS backend, which the operator
          # mounts as an inline CSI volume from the kind NFS export, and two of
          # them (cinder-operator-pod-kill, cinder-nfs-outage) take a vhost on
          # the shared broker. Two of the three nova suites take a vhost there
          # too (nova-mariadb-outage, nova-placement-outage); the third,
          # nova-broker-outage, brings a RabbitmqCluster of its own, because
          # its fault severs the whole broker and doing that to the shared one
          # would take the rest of the leg down with it. The NFS export stays
          # on the network leg alone. Empty elsewhere, where deploy-infra.sh
          # keeps its default of installing neither.
          WITH_NFS: ${{ matrix.suite == 'network' && 'true' || '' }}
          WITH_MESSAGING: ${{ (matrix.suite == 'network' || matrix.suite == 'nova') && 'true' || '' }}
      # Use shared operator deployment script. The ovn leg skips it along with
      # the rest of the keystone stack: no suite there creates a Keystone.
      - name: Deploy operator
        if: matrix.suite != 'ovn'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
      # The horizon chaos suites (horizon-operator-pod-kill,
      # horizon-memcached-pod-kill) need the horizon-operator too. It must land
      # in its own dedicated horizon-system namespace (not the script's
      # keystone-system default) because horizon-operator-pod-kill selects and
      # kills the operator pod by `-n horizon-system` — the same namespace the
      # Flux/deploy-infra path installs it into — and its PodChaos targets
      # horizon-system. Without this the operator installs into keystone-system,
      # the pod selector finds nothing, and the recovery assertion fails.
      - name: Deploy horizon operator
        if: matrix.suite != 'ovn'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: horizon
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/horizon-operator
          NAMESPACE: horizon-system
      # The glance chaos suites (glance-operator-pod-kill, glance-garage-outage)
      # need the glance-operator too. Like horizon it must land in its own
      # dedicated glance-system namespace (not the script's keystone-system
      # default) because glance-operator-pod-kill selects and kills the operator
      # pod by `-n glance-system` — the same namespace the Flux/deploy-infra path
      # installs it into — and its PodChaos targets glance-system. Without this
      # the operator installs into keystone-system, the pod selector finds
      # nothing, and the recovery assertion fails.
      - name: Deploy glance operator
        if: matrix.suite != 'ovn'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: glance
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/glance-operator
          NAMESPACE: glance-system
      # The placement chaos suite needs the placement-operator too. Like horizon
      # and glance it must land in its own placement-system namespace, not the
      # script's keystone-system default: that is where the Flux/deploy-infra
      # path installs it and where the suite's pod selector and PodChaos look.
      # Pod leg only — the suite that needs it runs there, so the network leg
      # would `helm install --wait` an operator that reconciles nothing.
      - name: Deploy placement operator
        if: matrix.suite == 'pod'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: placement
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/placement-operator
          NAMESPACE: placement-system
      # Both barbican chaos suites need the barbican-operator, one per leg
      # (barbican-operator-pod-kill on pod, barbican-openbao-outage on network),
      # so unlike placement this deploy runs on both keystone-stack legs. Like
      # horizon and glance it must land in its own barbican-system namespace,
      # not the script's keystone-system default: that is where the
      # Flux/deploy-infra path installs it and where the pod-kill suite's
      # selector and PodChaos look.
      - name: Deploy barbican operator
        if: matrix.suite != 'ovn'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: barbican
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/barbican-operator
          NAMESPACE: barbican-system
          # Both suites create their managed BarbicanSecretStore in the openstack
          # Namespace, and the operator only mints their OpenBaoCluster
          # provisioner token where the chart granted it a TokenRequest Role,
          # restricted to the provisioner account of the proving instance.
          BARBICAN_SECRET_STORE_GRANTS: openstack=openbao-instance-provisioner
      # ovn-southbound-outage drives an OVNCentral and an OVNChassis directly,
      # and both neutron suites need a live OVNCentral before their Neutron can
      # reach Ready. The deploy script installs the OVN CRDs on the way. Like
      # the sibling operators it lands in its own ovn-system namespace, which is
      # also where the ovn leg's diagnostics dump looks.
      - name: Deploy ovn operator
        if: matrix.suite != 'pod'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ovn
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/ovn-operator
          NAMESPACE: ovn-system
      # The two neutron outage suites run on the network leg alone, so the
      # neutron-operator deploys there alone. It follows the keystone and ovn
      # deploys above: each suite creates a Keystone and an OVNCentral its
      # Neutron depends on.
      - name: Deploy neutron operator
        if: matrix.suite == 'network'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: neutron
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/neutron-operator
          NAMESPACE: neutron-system
      # The three cinder outage suites run on the network leg alone, so the
      # cinder-operator deploys there alone. Like the sibling operators it
      # lands in its own cinder-system namespace, not the script's
      # keystone-system default: that is where the Flux/deploy-infra path
      # installs it and where cinder-operator-pod-kill's pod selector and
      # PodChaos look.
      - name: Deploy cinder operator
        if: matrix.suite == 'network'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: cinder
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/cinder-operator
          NAMESPACE: cinder-system
      # The three nova outage suites run on the nova leg alone, so the three
      # operators they need deploy there alone. The first two names carry a
      # "(nova leg)" suffix because tests/lib/ci_yaml.sh returns the first step
      # of an exact name and the placement and neutron steps above are pinned
      # by theirs: a second step under either name would be invisible to every
      # assertion in tests/unit/ci/. No ovn step is needed here: the one above
      # is gated `!= 'pod'` and already covers this leg.
      - name: Deploy placement operator (nova leg)
        if: matrix.suite == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: placement
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/placement-operator
          NAMESPACE: placement-system
      - name: Deploy neutron operator (nova leg)
        if: matrix.suite == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: neutron
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/neutron-operator
          NAMESPACE: neutron-system
      # Last of the leg's deploys: the Nova of each suite resolves a Keystone
      # endpoint, a Placement and a Neutron, and none of the three is
      # reconciled before the steps above ran.
      - name: Deploy nova operator
        if: matrix.suite == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: nova
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/nova-operator
          NAMESPACE: nova-system
      - name: Run chaos E2E tests
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e-chaos/chainsaw-config.yaml \
            ${{ matrix.test_dirs }}
      # Use shared diagnostic dump script. It derives the operator namespace
      # from OPERATOR, and the ovn leg has no keystone-system to dump.
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: ${{ matrix.suite == 'ovn' && 'ovn' || 'keystone' }}
      # The dump above derives its namespace from one OPERATOR, so on the nova
      # leg it covers keystone-system and nothing else. The script reads a
      # single OPERATOR per run, hence one call per remaining namespace.
      # OPERATOR_ONLY keeps each pass to the three sections that differ: the
      # infrastructure block and the openstack Job and pod logs are the same
      # dump every time, and the step above already emitted them. Repeated,
      # they would bury the operator evidence this step exists for and spend
      # the grace window `Delete kind cluster` below needs when the job wall
      # cancels the run.
      - name: Dump diagnostic info (nova leg)
        if: always() && matrix.suite == 'nova'
        run: |
          for op in nova placement glance ovn neutron; do
            OPERATOR="${op}" OPERATOR_ONLY=1 hack/ci-dump-diagnostics.sh
          done
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-chaos-junit-report-${{ matrix.suite }}
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # End-to-end Prometheus stack tests using kind cluster,
  # kube-prometheus-stack, and Chainsaw.  Builds the keystone operator image,
  # deploys it with the monitoring stack (WITH_PROMETHEUS=true on the shared
  # composite action), enables the keystone-operator ServiceMonitor via the
  # post-deploy patch baked into hack/deploy-infra.sh, and runs the
  # prometheus-stack chainsaw suite (HelmRelease readiness, ServiceMonitor
  # presence in openstack, Prometheus target health for keystone-operator,
  # Grafana dashboard presence).
  #
  # Single matrix entry on the self-hosted runner — the
  # kube-prometheus stack is deterministic, so unlike e2e-chaos this job runs
  # `continue-on-error: false`.  Inherits the e2e-chaos `needs:` chain so the
  # same upstream Go gate applies and an operator code change re-runs the
  # prometheus suite alongside e2e-chaos.
  e2e-prometheus:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    # always(): allow the job to run when upstream Go jobs are skipped
    # (e.g. pure E2E test-definition PRs where go=false). The explicit
    # failure/cancelled guard still blocks if any upstream actually failed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.e2e-prometheus == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    timeout-minutes: 68
    continue-on-error: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # GH-310: Pull pre-built images from GHCR (run-scoped tag).
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone:2025.2
      - name: Load images into kind
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone:2025.2 --name ${{ env.KIND_CLUSTER }}
      # Use composite action for shared Flux CLI + test deps + deploy-infra sequence.
      # Opt in to kube-prometheus-stack — required for the prometheus suite.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_PROMETHEUS: "true"
      # Use shared operator deployment script.
      # WITH_PROMETHEUS=true gates --set monitoring.serviceMonitor.enabled=true
      # on the helm install. Without it, the chart's gated ServiceMonitor template
      # renders nothing and chainsaw step 2 (servicemonitor-exists) plus step 3
      # (prometheus-target-up) cascade-fail. The kind/base kustomization keeps the
      # keystone-operator HelmRelease suspended, so the patch in deploy-infra.sh
      # cannot enable the ServiceMonitor reactively.
      - name: Deploy operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
          WITH_PROMETHEUS: "true"
      - name: Run prometheus E2E tests
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e/chainsaw-config.yaml \
            tests/e2e/keystone/prometheus-stack/
      # Use shared diagnostic dump script.
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: keystone
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-prometheus-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # Full ControlPlane -> Keystone chain E2E on kind. Deploys keystone-operator +
  # K-ORC + c5c3-operator as local dev images (the GHCR-published Flux chart path
  # is bypassed via CONTROLPLANE_OPERATORS=external) and runs the
  # full-controlplane-keystone Chainsaw suite with the presence guard set to fail
  # loudly (E2E_REQUIRE_CONTROLPLANE_STACK=true), so broken wiring in the live
  # chain fails the build instead of SKIPping.
  #
  # It then runs the keystone-service-foreign-namespace suite, which brings up a
  # second, Keystone-only ControlPlane of its own to register against from
  # namespaces that plane does not own. The two are SEPARATE steps rather than one
  # chainsaw invocation over both directories: the shared config sets failFast, so
  # a red registration suite would abort the full-chain suite this job exists for,
  # and sequential steps also keep two identity planes from converging on one node
  # at the same time.
  #
  # A third step runs the keystone-service suite, the own-namespace registration
  # (round-trip, rotation, collision/adopt, deletion), against a third
  # Keystone-only plane of its own. It stays separate for the same failFast
  # reason.
  #
  # A real MariaDB + Memcached + Keystone + three operators + OpenBao + ESO +
  # K-ORC + cert-manager + Envoy on one node is heavy, so this is a dedicated job
  # with an extended timeout on the larger runner (matching tempest).
  #
  # The three suites run in sequence against one node, so their wall clocks add
  # rather than overlap. A suite's ceiling is NOT its exec budget alone: chainsaw
  # applies that budget to every script operation, so try, catch and finally each
  # get one, and the cleanup runs after all three. Each of the three therefore
  # pins its catch and its finally explicitly, which puts the ceilings at
  # 65+5+5+5+2+3 = 85m (full-chain, where the compute leg added a third finally
  # script and lengthened the exec budget), 40+5+20+15 = 80m (foreign-namespace)
  # and 50+5+20+15 = 90m (own-namespace). Unpinned, catch and finally would
  # inherit the exec budget and the own-namespace ceiling alone would be 165m.
  #
  # timeout-minutes has to outlast the bring-up (kind create, twenty kind
  # loads, setup-e2e-infra, K-ORC and ten operator deploys) plus the suites
  # that pass plus the full ceiling of the one that stalls, or the job wall
  # arrives before a suite's own timeout does: chainsaw is killed outright, its
  # catch block never runs, and a stalled leg is reported as a cancelled job
  # with no JUnit report to read it out of.
  #
  # The eighth service moved the sum again, so the wall is re-derived once more:
  # the bring-up grew two image loads and a tenth operator deploy, and the OVN
  # kernel modules load in the setup as well, which the bring-up estimate below
  # still absorbs; the full-chain ceiling grew 65m -> 85m. 240m therefore covers
  # ~40m of bring-up, the 85m ceiling of the full-chain suite (at its ceiling,
  # not an observed pass: it is the suite this leg just lengthened), ~25m for the
  # foreign-namespace pass, and the 90m ceiling of the last suite. The bring-up
  # and foreign-namespace terms are the two estimates in that sum — confirm both
  # against the first green run of this leg and re-derive if either overruns. The
  # worst case holds the runner for a full four hours, which is the price of a
  # stalled suite reporting as a failure rather than a cancellation.
  e2e-controlplane:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    # always(): allow the job to run when upstream Go jobs are skipped
    # (e.g. pure E2E test-definition PRs where go=false). The explicit
    # failure/cancelled guard still blocks if any upstream actually failed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-controlplane == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    timeout-minutes: 240
    continue-on-error: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # images/ovn/Dockerfile holds the pin; resolving it here keeps the tag
      # out of this workflow.
      - name: Resolve OVN version
        run: echo "OVN_VERSION=$(hack/ci-resolve-ovn-version.sh)" >> "$GITHUB_ENV"
      # Pull the pre-built dev operator images plus the service images the
      # projected children run (the OVN daemon image among them, which the
      # ovn-operator rolls out for the standalone central the suite applies) and
      # the OpenStack-client (tempest) image the verify Job uses.
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/c5c3-operator:dev
            ${{ env.IMAGE_PREFIX }}/horizon-operator:dev
            ${{ env.IMAGE_PREFIX }}/glance-operator:dev
            ${{ env.IMAGE_PREFIX }}/placement-operator:dev
            ${{ env.IMAGE_PREFIX }}/barbican-operator:dev
            ${{ env.IMAGE_PREFIX }}/ovn-operator:dev
            ${{ env.IMAGE_PREFIX }}/neutron-operator:dev
            ${{ env.IMAGE_PREFIX }}/cinder-operator:dev
            ${{ env.IMAGE_PREFIX }}/nova-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone:2025.2
            ${{ env.IMAGE_PREFIX }}/horizon:2025.2
            ${{ env.IMAGE_PREFIX }}/glance:2025.2
            ${{ env.IMAGE_PREFIX }}/placement:2025.2
            ${{ env.IMAGE_PREFIX }}/barbican:2025.2
            ${{ env.IMAGE_PREFIX }}/neutron:2025.2
            ${{ env.IMAGE_PREFIX }}/cinder:2025.2
            ${{ env.IMAGE_PREFIX }}/nova:2025.2
            ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }}
            ${{ env.IMAGE_PREFIX }}/tempest:2025.2
      - name: Load images into kind
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/c5c3-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/horizon-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/glance-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/placement-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/barbican-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/cinder-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/nova-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/horizon:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/glance:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/placement:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/barbican:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/cinder:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/nova:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }} --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/tempest:2025.2 --name ${{ env.KIND_CLUSTER }}
      # Prepare the shared infra (TLS, OpenBao + per-CR seeding, ESO store) and
      # suspend the Flux ControlPlane stack; the operators are deployed below.
      # CONTROLPLANE_NAME must match the fixture CR (controlplane-keystone) so the
      # OpenBao bootstrap seeds the per-CR admin-password path the chain reads.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_CONTROLPLANE: "true"
          CONTROLPLANE_OPERATORS: external
          CONTROLPLANE_NAME: controlplane-keystone
          WITH_CONTROLPLANE_CR: "false"
          # The seventh service, Cinder, mounts its NFS shares from the kind NFS
          # export and takes a vhost of its own on the shared broker, so this leg
          # opts into both stacks the way the cinder e2e-operator leg does.
          # deploy-infra.sh installs neither by default.
          WITH_NFS: "true"
          WITH_MESSAGING: "true"
          # The suite applies an OVNChassis with a real ovn-controller, which
          # binds the compute's port and opens a Geneve tunnel from the kind
          # node; that tunnel needs the openvswitch and geneve modules on the
          # runner host, which deploy-infra.sh modprobes under this switch.
          WITH_OVN_KERNEL_MODULES: "true"
      # Deploy K-ORC (CRDs + controller) from the upstream installer at the tag
      # pinned in deploy/flux-system/sources/k-orc.yaml.
      - name: Deploy K-ORC
        env:
          # Authenticates the K-ORC clone from github.com; see the script.
          GITHUB_TOKEN: ${{ github.token }}
        run: hack/ci-deploy-korc.sh
      # keystone-operator first so its CRD exists before c5c3-operator projects
      # Keystone CRs.
      - name: Deploy keystone-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
          NAMESPACE: keystone-system
      # horizon-operator before c5c3-operator so the Horizon CRD exists
      # before c5c3-operator projects the Horizon child.
      - name: Deploy horizon-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: horizon
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/horizon-operator
          NAMESPACE: horizon-system
      # glance-operator before c5c3-operator so the Glance and GlanceBackend CRDs
      # exist before c5c3-operator projects the Glance child and its backends.
      - name: Deploy glance-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: glance
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/glance-operator
          NAMESPACE: glance-system
      # placement-operator before c5c3-operator so the Placement CRD exists
      # before c5c3-operator projects the Placement child.
      - name: Deploy placement-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: placement
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/placement-operator
          NAMESPACE: placement-system
      # barbican-operator before c5c3-operator so the Barbican and
      # BarbicanSecretStore CRDs exist before c5c3-operator projects the
      # Barbican child and its dedicated secret store. barbican-system is
      # also the namespace c5c3-operator assumes the barbican-operator runs
      # in when it binds the TokenRequest grant.
      #
      # BARBICAN_SECRET_STORE_GRANTS is deliberately unset here, unlike on the
      # e2e-operator and e2e-chaos legs. Those point the store at the shared
      # proving instance, whose provisioner account the chart has to name up
      # front. This job's store hangs off the instance the ControlPlane
      # creates, and the ControlPlane projects the matching TokenRequest Role
      # and RoleBinding for that instance's own provisioner account at
      # runtime.
      - name: Deploy barbican-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: barbican
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/barbican-operator
          NAMESPACE: barbican-system
      # ovn-operator before c5c3-operator so the OVNCentral CRD is served before
      # the ControlPlane reads the central its services.neutron references. The
      # operator itself drives that standalone central, which the full-chain
      # suite applies beside the ControlPlane, to Ready.
      - name: Deploy ovn-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ovn
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/ovn-operator
          NAMESPACE: ovn-system
      # neutron-operator before c5c3-operator so the Neutron CRD exists before
      # c5c3-operator projects the Neutron child, and so something drives that
      # child to Ready once it lands.
      - name: Deploy neutron-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: neutron
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/neutron-operator
          NAMESPACE: neutron-system
      # cinder-operator before c5c3-operator so the Cinder CRDs exist before
      # c5c3-operator projects the Cinder child and its two satellite kinds, and
      # so something drives that child to Ready once it lands.
      - name: Deploy cinder-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: cinder
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/cinder-operator
          NAMESPACE: cinder-system
      # nova-operator before c5c3-operator so the Nova CRD exists before
      # c5c3-operator projects the Nova child, and so something drives that
      # child to Ready once it lands.
      - name: Deploy nova-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: nova
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/nova-operator
          NAMESPACE: nova-system
      - name: Deploy c5c3-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: c5c3
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/c5c3-operator
          NAMESPACE: c5c3-system
      # E2E_REQUIRE_CONTROLPLANE_STACK=true flips the suite's presence guard from
      # SKIP to a hard failure, so missing wiring cannot go green.
      - name: Run full ControlPlane chain E2E test
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e/chainsaw-config.yaml \
            tests/e2e/c5c3/full-controlplane-keystone/
        env:
          E2E_REQUIRE_CONTROLPLANE_STACK: "true"
      # The foreign-namespace registration suite runs against the same cluster but
      # in its own invocation, so its failure cannot cascade into the full-chain
      # result above. A distinct report name keeps that run's JUnit XML intact.
      - name: Run foreign-namespace registration E2E test
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e/chainsaw-config.yaml \
            --report-name chainsaw-report-keystone-service \
            tests/e2e/c5c3/keystone-service-foreign-namespace/
        env:
          E2E_REQUIRE_CONTROLPLANE_STACK: "true"
      # The own-namespace registration suite runs third, again in its own
      # invocation for the failFast reason above, under a report name of its own
      # so all three JUnit files survive in the uploaded artifact.
      - name: Run own-namespace registration E2E test
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e/chainsaw-config.yaml \
            --report-name chainsaw-report-keystone-service-own-namespace \
            tests/e2e/c5c3/keystone-service/
        env:
          E2E_REQUIRE_CONTROLPLANE_STACK: "true"
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: c5c3
      # The cinder half of the same dump: the script reads OPERATOR for the
      # operator namespace (cinder-system) and leaves NAMESPACE at openstack,
      # where the projected Cinder child and its satellites run.
      - name: Dump cinder diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: cinder
      # The nova half of the same dump: the script reads OPERATOR for the
      # operator namespace (nova-system) and leaves NAMESPACE at openstack,
      # where the projected Nova child and the suite's fake compute run.
      - name: Dump nova diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: nova
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-controlplane-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # Federated ControlPlane E2E: the end-user SSO experience (Horizon websso
  # choices, the multi-domain login dropdown, and the websso round trip through
  # the gateway).
  #
  # A SEPARATE job rather than a second suite directory on e2e-controlplane: the
  # ControlPlane webhook permits one ControlPlane per namespace, and the shared
  # `openstack-gw` Gateway sets `allowedRoutes.namespaces.from: Same` (the
  # operators deliberately do not manage ReferenceGrant), so the two suites can
  # share neither the `openstack` namespace nor the Gateway. Each therefore
  # needs its own kind cluster.
  #
  # The suite therefore also lives outside tests/e2e/ (mirroring
  # tests/e2e-operator-upgrade/): the per-CR e2e-operator matrix leg runs
  # `chainsaw test tests/e2e/<operator>/` over the whole directory and would
  # otherwise run this chain on a cluster that has neither keystone-operator,
  # horizon-operator nor K-ORC.
  #
  # It loads the keystone-federation-proxy sidecar image so the suite's
  # ControlPlane CR can pin `federationProxyImage.tag: dev` — without it the
  # suite would validate the sidecar already published on main.
  e2e-controlplane-sso:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    # always(): allow the job to run when upstream Go jobs are skipped
    # (e.g. pure E2E test-definition PRs where go=false). The explicit
    # failure/cancelled guard still blocks if any upstream actually failed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-controlplane-sso == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    timeout-minutes: 90
    continue-on-error: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/c5c3-operator:dev
            ${{ env.IMAGE_PREFIX }}/horizon-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone-federation-proxy:dev
            ${{ env.IMAGE_PREFIX }}/keystone:2025.2
            ${{ env.IMAGE_PREFIX }}/horizon:2025.2
      - name: Load images into kind
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/c5c3-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/horizon-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-federation-proxy:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/horizon:2025.2 --name ${{ env.KIND_CLUSTER }}
      # CONTROLPLANE_NAME must match the fixture CR (controlplane-sso) so the
      # OpenBao bootstrap seeds the per-CR admin-password and Horizon
      # SECRET_KEY paths the chain reads.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_CONTROLPLANE: "true"
          CONTROLPLANE_OPERATORS: external
          CONTROLPLANE_NAME: controlplane-sso
          WITH_CONTROLPLANE_CR: "false"
      - name: Deploy K-ORC
        env:
          # Authenticates the K-ORC clone from github.com; see the script.
          GITHUB_TOKEN: ${{ github.token }}
        run: hack/ci-deploy-korc.sh
      - name: Deploy keystone-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
          NAMESPACE: keystone-system
      - name: Deploy horizon-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: horizon
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/horizon-operator
          NAMESPACE: horizon-system
      # The c5c3 manager also watches the Glance and GlanceBackend kinds; an
      # informer for an absent CRD never syncs, so the elected leader dies on
      # the cache-sync timeout. The suite's CR declares no services.glance, so
      # only the CRDs are needed — the glance-operator itself stays undeployed.
      - name: Install Glance CRDs watched by the c5c3-operator
        run: kubectl apply -f operators/glance/helm/glance-operator/crds/
      # The c5c3 manager also watches the Placement kind. The suite's CR
      # declares no services.placement, so only the CRD is needed; the
      # placement-operator itself stays undeployed.
      - name: Install Placement CRDs watched by the c5c3-operator
        run: kubectl apply -f operators/placement/helm/placement-operator/crds/
      - name: Deploy c5c3-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: c5c3
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/c5c3-operator
          NAMESPACE: c5c3-system
      - name: Run federated ControlPlane E2E test
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e/chainsaw-config.yaml \
            tests/e2e-controlplane-sso/
        env:
          E2E_REQUIRE_CONTROLPLANE_STACK: "true"
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: c5c3
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-controlplane-sso-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # External-mode ControlPlane E2E: an External CR driven against a plain
  # Keystone the operator does NOT own (a brownfield-adoption stand-in).
  #
  # A SEPARATE job rather than a second suite directory on e2e-controlplane: the
  # ControlPlane webhook permits one ControlPlane per namespace, and this suite
  # brings up a wholly different infrastructure shape — a plain, operator-free
  # SQLite Keystone fixture in its own namespace plus four External ControlPlanes,
  # none of which provision MariaDB/Memcached. It shares the e2e-controlplane
  # change-detection output and path filter (the e2e_controlplane filter already
  # watches operators/c5c3/**, operators/keystone/**, tests/e2e/c5c3/** and the
  # deploy/hack wiring this job depends on), exactly as e2e-controlplane-sso does.
  e2e-external-keystone:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    # always(): allow the job to run when upstream Go jobs are skipped
    # (e.g. pure E2E test-definition PRs where go=false). The explicit
    # failure/cancelled guard still blocks if any upstream actually failed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-external-keystone == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    timeout-minutes: 90
    continue-on-error: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # The Horizon service image is NOT loaded: External mode never runs a
      # Horizon workload (HorizonReady=HorizonNotManaged); the horizon-operator is
      # deployed only so its CRD exists for the c5c3 manager's Owns(Horizon) watch.
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/c5c3-operator:dev
            ${{ env.IMAGE_PREFIX }}/horizon-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone:2025.2
            ${{ env.IMAGE_PREFIX }}/tempest:2025.2
      - name: Load images into kind
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/c5c3-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/horizon-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone:2025.2 --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/tempest:2025.2 --name ${{ env.KIND_CLUSTER }}
      # CONTROLPLANE_NAME is left at its default: the OpenBao bootstrap only seeds
      # bootstrap/openstack/<name>-keystone/admin (the managed-mode admin-password
      # path), which the External ControlPlanes here — in their own namespaces,
      # authenticating from user-supplied Secrets — never read. The suite asserts
      # the External CP's own per-CR OpenBao paths are never-seeded, so no seed
      # must target them (see deploy/openbao/bootstrap/write-bootstrap-secrets.sh).
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_CONTROLPLANE: "true"
          CONTROLPLANE_OPERATORS: external
          WITH_CONTROLPLANE_CR: "false"
      - name: Deploy K-ORC
        env:
          # Authenticates the K-ORC clone from github.com; see the script.
          GITHUB_TOKEN: ${{ github.token }}
        run: hack/ci-deploy-korc.sh
      # keystone-operator first so its CRD exists before c5c3-operator's manager
      # cache starts (it Owns Keystone/Horizon children even in External mode).
      - name: Deploy keystone-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
          NAMESPACE: keystone-system
      - name: Deploy horizon-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: horizon
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/horizon-operator
          NAMESPACE: horizon-system
      # The c5c3 manager also watches the Glance and GlanceBackend kinds; an
      # informer for an absent CRD never syncs, so the elected leader dies on
      # the cache-sync timeout. External mode forbids services.glance, so only
      # the CRDs are needed — the glance-operator itself stays undeployed.
      - name: Install Glance CRDs watched by the c5c3-operator
        run: kubectl apply -f operators/glance/helm/glance-operator/crds/
      # The c5c3 manager also watches the Placement kind. External mode forbids
      # services.placement, so only the CRD is needed; the placement-operator
      # itself stays undeployed.
      - name: Install Placement CRDs watched by the c5c3-operator
        run: kubectl apply -f operators/placement/helm/placement-operator/crds/
      - name: Deploy c5c3-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: c5c3
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/c5c3-operator
          NAMESPACE: c5c3-system
      # E2E_REQUIRE_CONTROLPLANE_STACK=true flips the suite's presence guard from
      # SKIP to a hard failure, so missing wiring cannot go green.
      - name: Run External-mode ControlPlane E2E test
        run: |
          mkdir -p _output/reports
          chainsaw test --config tests/e2e/chainsaw-config.yaml \
            tests/e2e/c5c3/external-keystone/
        env:
          E2E_REQUIRE_CONTROLPLANE_STACK: "true"
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: c5c3
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-external-keystone-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # Two-cluster placed-services E2E on kind. Brings up a target cluster running
  # the infrastructure and no operator (INFRA_ONLY=true), a management cluster
  # running keystone-operator, barbican-operator, ovn-operator and
  # neutron-operator and no infrastructure, and runs tests/e2e-multicluster/
  # across both.
  #
  # The management cluster reaches the target EXCLUSIVELY through a kubeconfig
  # minted from the target-cluster-access chart's ServiceAccount token. Running
  # the suite on those credentials is what proves the chart's grant set: a
  # missing verb surfaces as a CR that never reaches Ready, where an admin
  # kubeconfig would paper over it.
  #
  # BARBICAN_SECRET_STORE_GRANTS is deliberately unset, as on e2e-controlplane.
  # It renders the operator's LOCAL TokenRequest Role, and a placed store mints
  # its provisioner token on the target cluster instead, through the chart's
  # grant there.
  e2e-multicluster:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    # always(): allow the job to run when upstream Go jobs are skipped
    # (e.g. pure E2E test-definition PRs where go=false). The explicit
    # failure/cancelled guard still blocks if any upstream actually failed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-multicluster == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    timeout-minutes: 90
    continue-on-error: false
    permissions:
      contents: read
      packages: read
    env:
      # The registration name the suite's fixtures reference, and the kind
      # cluster it belongs to.
      TARGET_CLUSTER: cobaltcore-target
      MGMT_CLUSTER: cobaltcore-mgmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The target cluster takes the workload config (host ports, containerd
      # tuning); the management cluster is created by
      # hack/deploy-mgmt-cluster.sh with no config at all, so the two never
      # contend for a host port.
      - name: Create target kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.TARGET_CLUSTER }}
      # images/ovn/Dockerfile holds the pin; resolving it here keeps the tag
      # out of this workflow.
      - name: Resolve OVN version
        run: echo "OVN_VERSION=$(hack/ci-resolve-ovn-version.sh)" >> "$GITHUB_ENV"
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/barbican-operator:dev
            ${{ env.IMAGE_PREFIX }}/ovn-operator:dev
            ${{ env.IMAGE_PREFIX }}/neutron-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone:2025.2
            ${{ env.IMAGE_PREFIX }}/barbican:2025.2
            ${{ env.IMAGE_PREFIX }}/neutron:2025.2
            ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }}
      # The service images run on the target; the operator images run on the
      # management cluster, which does not exist yet. The OVN daemon image is a
      # service image here: the placed OVNCentral's databases and northd all run
      # on the target.
      - name: Load service images into the target cluster
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone:2025.2 --name "$TARGET_CLUSTER"
          kind load docker-image ${{ env.IMAGE_PREFIX }}/barbican:2025.2 --name "$TARGET_CLUSTER"
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron:2025.2 --name "$TARGET_CLUSTER"
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }} --name "$TARGET_CLUSTER"
      - name: Setup target-cluster infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          INFRA_ONLY: "true"
          CLUSTER_NAME: ${{ env.TARGET_CLUSTER }}
      - name: Create the management cluster
        run: hack/deploy-mgmt-cluster.sh
        env:
          CLUSTER_NAME: ${{ env.MGMT_CLUSTER }}
      - name: Load operator images into the management cluster
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-operator:dev --name "$MGMT_CLUSTER"
          kind load docker-image ${{ env.IMAGE_PREFIX }}/barbican-operator:dev --name "$MGMT_CLUSTER"
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn-operator:dev --name "$MGMT_CLUSTER"
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron-operator:dev --name "$MGMT_CLUSTER"
      # hack/deploy-mgmt-cluster.sh left the kubectl context on the management
      # cluster, which is where all four operators are installed.
      - name: Deploy keystone-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
          NAMESPACE: keystone-system
      - name: Deploy barbican-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: barbican
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/barbican-operator
          NAMESPACE: barbican-system
      # The ovn-operator projects the placed central's StatefulSets, its backup
      # volume and its Certificates onto the target over the registered
      # kubeconfig. No other operator in this job writes a StatefulSet or a
      # PersistentVolumeClaim there, so those two grants of the chart are
      # exercised only while this one runs.
      - name: Deploy ovn-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ovn
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/ovn-operator
          NAMESPACE: ovn-system
      # The neutron-operator reads the central's status on this cluster, where
      # both CRs live, and places the API Deployment and the mirrored OVN client
      # Secret on the target. Its OVNCentral CRD comes from the ovn-operator
      # above, so that one is deployed first.
      - name: Deploy neutron-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: neutron
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/neutron-operator
          NAMESPACE: neutron-system
      # createNamespaces=false: the openstack namespace already exists on the
      # target from the infrastructure deploy.
      - name: Install the target-cluster-access chart on the target
        run: |
          helm install --kube-context "kind-$TARGET_CLUSTER" \
            target-cluster-access deploy/target-cluster/target-cluster-access \
            -n c5c3-access --create-namespace \
            --set 'namespaces={openstack}' \
            --set createNamespaces=false
      # Register the target on the management cluster. The admin kubeconfig kind
      # holds for the target is NEVER used here: the kubeconfig assembled below
      # carries the chart's ServiceAccount token and nothing else, so every
      # request the operators make is authorized by the chart's Role and
      # ClusterRole. The server URL is the --internal one, because the address
      # that has to resolve is the one a pod on the management cluster dials
      # across the shared docker network.
      - name: Register the target cluster
        run: |
          set -euo pipefail
          secret=target-cluster-access-token
          token=""
          for _ in $(seq 1 30); do
            token=$(kubectl --context "kind-$TARGET_CLUSTER" -n c5c3-access get secret "$secret" \
              -o jsonpath='{.data.token}' 2>/dev/null || true)
            [ -n "$token" ] && break
            sleep 2
          done
          if [ -z "$token" ]; then
            echo "::error::the token controller did not populate $secret on $TARGET_CLUSTER"
            exit 1
          fi
          workdir=$(mktemp -d)
          kubectl --context "kind-$TARGET_CLUSTER" -n c5c3-access get secret "$secret" \
            -o jsonpath='{.data.ca\.crt}' | base64 -d > "$workdir/ca.crt"
          kind get kubeconfig --internal --name "$TARGET_CLUSTER" > "$workdir/internal.kubeconfig"
          server=$(kubectl --kubeconfig "$workdir/internal.kubeconfig" config view \
            -o jsonpath='{.clusters[0].cluster.server}')
          export KUBECONFIG="$workdir/registration.kubeconfig"
          kubectl config set-cluster "$TARGET_CLUSTER" \
            --server="$server" --certificate-authority="$workdir/ca.crt" --embed-certs=true
          kubectl config set-credentials target-cluster-access --token="$(echo "$token" | base64 -d)"
          kubectl config set-context "$TARGET_CLUSTER" \
            --cluster="$TARGET_CLUSTER" --user=target-cluster-access
          kubectl config use-context "$TARGET_CLUSTER"
          unset KUBECONFIG
          kubectl --context "kind-$MGMT_CLUSTER" create namespace c5c3-clusters
          # The namespaces key scopes the operators' caches on this cluster to
          # the one namespace the chart granted them.
          kubectl --context "kind-$MGMT_CLUSTER" -n c5c3-clusters create secret generic "$TARGET_CLUSTER" \
            --from-file=kubeconfig="$workdir/registration.kubeconfig" \
            --from-literal=namespaces=openstack
          kubectl --context "kind-$MGMT_CLUSTER" -n c5c3-clusters label secret "$TARGET_CLUSTER" \
            sigs.k8s.io/multicluster-runtime-kubeconfig=true
      # Chainsaw's own credentials for asserting on the target. This is the
      # admin kubeconfig, and it reaches nothing the operators use: they read
      # the registration Secret written above.
      - name: Write the chainsaw kubeconfig for the target cluster
        run: |
          mkdir -p _output
          kind get kubeconfig --name "$TARGET_CLUSTER" > _output/cobaltcore-target.kubeconfig
      - name: Run the two-cluster E2E suite
        run: |
          mkdir -p _output/reports
          kubectl config use-context "kind-$MGMT_CLUSTER"
          make e2e-multicluster
      - name: Dump diagnostic info (management cluster)
        if: always()
        run: |
          kubectl config use-context "kind-$MGMT_CLUSTER"
          hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: keystone
      # No OPERATOR on the target: it runs the infrastructure and nothing else,
      # so the script's infrastructure section is the whole dump.
      - name: Dump diagnostic info (target cluster)
        if: always()
        run: |
          kubectl config use-context "kind-$TARGET_CLUSTER"
          hack/ci-dump-diagnostics.sh
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-multicluster-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # Multi-node OVN overlay E2E on kind. Brings up the one-control-plane,
  # two-worker cluster of hack/kind-config-multinode.yaml, deploys the
  # ovn-operator, and runs tests/e2e-ovn-overlay/ across both workers: one
  # logical switch port per node, a ping across the Geneve tunnel between them,
  # and the Southbound rows that say which chassis carried it.
  #
  # continue-on-error: true because the suite needs the openvswitch and geneve
  # kernel modules on the runner host, which puts it under the non-blocking entry
  # rule of `### Kernel-module-dependent suites` in
  # docs/reference/ci-cd/ci-workflow.md. A later change flips it to blocking
  # once its pass history on main justifies the flip. The single-node chassis
  # baseline under tests/e2e/ovn/ stays blocking inside the e2e-operator legs.
  #
  # The job runs alone on its runner: hack/kind-config-multinode.yaml and
  # hack/kind-config.yaml bind the same host ports (443 and 8428 on 127.0.0.1),
  # so a second cluster created from either file on the same host fails to bind
  # them.
  e2e-ovn-overlay:
    needs: [changes, lint, shellcheck, test, test-integration, verify-codegen, chainsaw-lint, build-e2e-images]
    # always(): allow the job to run when upstream Go jobs are skipped
    # (e.g. pure E2E test-definition PRs where go=false). The explicit
    # failure/cancelled guard still blocks if any upstream actually failed.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      needs.changes.outputs.e2e-ovn-overlay == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The multi-node config is passed through the action's `config:` input
      # rather than KIND_CONFIG: setup-e2e-infra runs with SKIP_KIND_CREATE,
      # so the cluster already exists by the time hack/deploy-infra.sh reads
      # that variable.
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config-multinode.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # images/ovn/Dockerfile holds the pin; resolving it here keeps the tag
      # out of this workflow.
      - name: Resolve OVN version
        run: echo "OVN_VERSION=$(hack/ci-resolve-ovn-version.sh)" >> "$GITHUB_ENV"
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/ovn-operator:dev
            ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }}
      # Every node runs its own chassis pods, and kind loads an image onto all
      # of a cluster's nodes.
      - name: Load images into kind
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn-operator:dev --name "${{ env.KIND_CLUSTER }}"
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }} --name "${{ env.KIND_CLUSTER }}"
      # The chassis DaemonSets open a Geneve tunnel from each kind node, which
      # needs the openvswitch and geneve modules loaded on the host.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_OVN_KERNEL_MODULES: "true"
      - name: Deploy ovn-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ovn
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/ovn-operator
          NAMESPACE: ovn-system
      - name: Run the overlay suite
        run: |
          mkdir -p _output/reports
          make e2e-ovn-overlay
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: ovn
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ovn-overlay-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # Tempest API integration tests.
  # Deploys services into a kind cluster and runs the OpenStack Tempest test
  # suite against them.  One leg per service: keystone, glance, barbican,
  # neutron, cinder and nova.
  # Matrix over OpenStack releases to validate each release independently.
  #
  # Runs only after every E2E job has finished without failure: a failed
  # E2E job skips tempest, a path-filter-skipped one does not block it
  # (always() + the failure/cancelled guards below). The e2e-chaos network
  # leg is continue-on-error, so its result is always 'success' and merely
  # delays tempest. The e2e-chaos pod leg is blocking, so a pod-chaos failure
  # surfaces as a job 'failure' and blocks tempest via the guard below.
  tempest:
    needs: [changes, build-e2e-images, e2e-infra, e2e-operator, e2e-chaos, e2e-prometheus]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.tempest == 'true' &&
      needs.build-e2e-images.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    # Two walls above the 68 the other legs keep. Run 35083301017 measured the
    # cinder 2025.2 leg at 56 minutes: 40 of bring-up (13 of image pulls for
    # seven images, 14 inside `Setup E2E infrastructure`) and 15.5 of tempest.
    # A nova leg pulls thirteen images and waits on eight CRs, of which the Nova
    # alone takes about 8 minutes to reach Ready, and the Phase-0 lab of #1015
    # ran the compute suite in 42 minutes at two workers: about 70 minutes of
    # bring-up plus 42 of run, hence 150. A cinder leg carries four more
    # operators, three more service images and four more CRs on top of those 56
    # minutes, and its suite gains six compute-tagged test methods and
    # test_incremental_backup, which lands near 90, hence 120. Both numbers are
    # estimates; re-derive them from the first green run of each leg.
    timeout-minutes: ${{ matrix.service == 'nova' && 150 || matrix.service == 'cinder' && 120 || 68 }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.tempest-releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          version: ${{ env.KIND_VERSION }}
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # images/ovn/Dockerfile holds the pin; resolving it here keeps the tag out
      # of this workflow. The step runs on every leg because only the neutron,
      # nova and cinder ones read OVN_VERSION, and a grep costs nothing on the
      # others.
      - name: Resolve OVN version
        run: echo "OVN_VERSION=$(hack/ci-resolve-ovn-version.sh)" >> "$GITHUB_ENV"
      # -- Keystone --------------------------------------------------------
      # GH-310: Pull pre-built images from GHCR (run-scoped tag).
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone:${{ matrix.release }}
            ${{ env.IMAGE_PREFIX }}/tempest:${{ matrix.release }}
            # The neutron leg brings up an OVNCentral next to its Neutron, so it
            # pulls both operator images and both service images. The other legs
            # render blank lines here, which the action skips.
            ${{ matrix.service == 'neutron' && format('{0}/neutron-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ matrix.service == 'neutron' && format('{0}/neutron:{1}', env.IMAGE_PREFIX, matrix.release) || '' }}
            ${{ matrix.service == 'neutron' && format('{0}/ovn-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ matrix.service == 'neutron' && format('{0}/ovn:{1}', env.IMAGE_PREFIX, env.OVN_VERSION) || '' }}
            # The cinder leg pulls its own two images here and takes the glance
            # pair from the step below, whose condition covers it as well: its
            # volume suites create volumes from an image and upload volumes back
            # to one, so the leg runs a Glance next to the Cinder.
            ${{ matrix.service == 'cinder' && format('{0}/cinder-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ matrix.service == 'cinder' && format('{0}/cinder:{1}', env.IMAGE_PREFIX, matrix.release) || '' }}
            # The compute stack the nova and cinder legs share: four operators,
            # the three service images their CRs roll out, and the OVN daemon
            # image the OVNCentral runs at the resolved pin.
            ${{ (matrix.service == 'nova' || matrix.service == 'cinder') && format('{0}/ovn-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ (matrix.service == 'nova' || matrix.service == 'cinder') && format('{0}/neutron-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ (matrix.service == 'nova' || matrix.service == 'cinder') && format('{0}/placement-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ (matrix.service == 'nova' || matrix.service == 'cinder') && format('{0}/nova-operator:dev', env.IMAGE_PREFIX) || '' }}
            ${{ (matrix.service == 'nova' || matrix.service == 'cinder') && format('{0}/neutron:{1}', env.IMAGE_PREFIX, matrix.release) || '' }}
            ${{ (matrix.service == 'nova' || matrix.service == 'cinder') && format('{0}/placement:{1}', env.IMAGE_PREFIX, matrix.release) || '' }}
            ${{ (matrix.service == 'nova' || matrix.service == 'cinder') && format('{0}/nova:{1}', env.IMAGE_PREFIX, matrix.release) || '' }}
            ${{ (matrix.service == 'nova' || matrix.service == 'cinder') && format('{0}/ovn:{1}', env.IMAGE_PREFIX, env.OVN_VERSION) || '' }}
      - name: Load images into kind
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/keystone:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
      # -- Glance ----------------------------------------------------------
      # The glance leg additionally pulls the glance-operator and the matching
      # glance service image; the keystone leg needs neither. The cinder leg
      # takes the same pair, for the Glance its volume suites create images
      # from, and loads it into kind in its own step below; the nova leg takes
      # it for the Glance its servers boot from.
      - name: Load Glance E2E images
        if: matrix.service == 'glance' || matrix.service == 'cinder' || matrix.service == 'nova'
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/glance-operator:dev
            ${{ env.IMAGE_PREFIX }}/glance:${{ matrix.release }}
      # The tempest image is kind-loaded on the glance and nova legs: the
      # keystone leg runs it exclusively via `docker run` on the runner, but
      # both of these also run it in-cluster — the catalog-setup Job, and on the
      # nova leg the image-seed and flavor-seed Jobs — which resolves the image
      # on the kind node (imagePullPolicy: IfNotPresent) and would otherwise
      # pull the published tag from GHCR instead of this PR's build.
      - name: Load Glance images into kind
        if: matrix.service == 'glance' || matrix.service == 'nova'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/glance-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/glance:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/tempest:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
      # -- Barbican --------------------------------------------------------
      # The barbican leg additionally pulls the barbican-operator and the
      # matching barbican service image; the keystone leg needs neither.
      - name: Load Barbican E2E images
        if: matrix.service == 'barbican'
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ needs.build-e2e-images.outputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/barbican-operator:dev
            ${{ env.IMAGE_PREFIX }}/barbican:${{ matrix.release }}
      # The tempest image is kind-loaded on the barbican leg for the same reason
      # as on the glance leg: it also runs in-cluster as the catalog-setup Job,
      # which resolves the image on the kind node (imagePullPolicy: IfNotPresent)
      # and would otherwise pull the published tag from GHCR instead of this PR's
      # build.
      - name: Load Barbican images into kind
        if: matrix.service == 'barbican'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/barbican-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/barbican:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/tempest:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
      # -- Neutron ---------------------------------------------------------
      # kubelet only skips the registry for a tag already on the node, so the
      # OVN daemon image the OVNCentral rolls out is loaded next to the two
      # operator images and the neutron service image. The tempest image is
      # kind-loaded here for the same reason as on the glance and barbican legs:
      # the catalog-setup Job runs it in-cluster.
      - name: Load neutron images into kind
        if: matrix.service == 'neutron'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/neutron:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }} --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/tempest:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
      # -- Cinder ----------------------------------------------------------
      # Both operators and both service images: the leg runs a Glance next to
      # its Cinder. The tempest image is kind-loaded here for the same reason as
      # on the glance, barbican and neutron legs: the catalog-setup Job and the
      # image-seed Job run it in-cluster.
      - name: Load cinder images into kind
        if: matrix.service == 'cinder'
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/cinder-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/cinder:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/glance-operator:dev --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/glance:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/tempest:${{ matrix.release }} --name ${{ env.KIND_CLUSTER }}
      # -- Compute stack ---------------------------------------------------
      # kubelet only skips the registry for a tag already on the node, so both
      # compute-stack legs load the eight refs they share here. Each leg's
      # glance pair and tempest image come from a step above: the cinder leg's
      # from its own, the nova leg's from the glance one.
      #
      # One call for all eight. Each `kind load` is a `docker save` piped into
      # the node's containerd, and the three service images end at the same
      # `FROM python-base` (images/nova/Dockerfile) while the four operator
      # images share their own base, so eight calls save and import those shared
      # layers over and over. The nova e2e leg already loads its list this way
      # ("Load images into kind" above).
      - name: Load compute stack images into kind
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: |
          kind load docker-image \
            ${{ env.IMAGE_PREFIX }}/ovn-operator:dev \
            ${{ env.IMAGE_PREFIX }}/neutron-operator:dev \
            ${{ env.IMAGE_PREFIX }}/placement-operator:dev \
            ${{ env.IMAGE_PREFIX }}/nova-operator:dev \
            ${{ env.IMAGE_PREFIX }}/neutron:${{ matrix.release }} \
            ${{ env.IMAGE_PREFIX }}/placement:${{ matrix.release }} \
            ${{ env.IMAGE_PREFIX }}/nova:${{ matrix.release }} \
            ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }} \
            --name ${{ env.KIND_CLUSTER }}
      # Use composite action for shared Flux CLI + test deps + deploy-infra sequence.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          # The cinder leg's volume backend and backup target are NFS exports
          # the operator mounts as inline CSI volumes, and its Cinder takes the
          # shared broker in managed mode. Empty on every other leg, where
          # deploy-infra.sh keeps its default of installing neither.
          #
          # The Nova of both compute-stack legs takes that same broker in
          # managed mode, so the nova leg opts into it as well.
          WITH_NFS: ${{ matrix.service == 'cinder' && 'true' || '' }}
          WITH_MESSAGING: ${{ (matrix.service == 'cinder' || matrix.service == 'nova') && 'true' || '' }}
          # The nova leg runs a real OVN chassis, whose pods open a Geneve
          # tunnel from the kind node and need the openvswitch and geneve
          # modules on the runner host; deploy-infra.sh modprobes them under
          # this switch. The cinder leg deploys no chassis, so it leaves the
          # host's modules alone.
          WITH_OVN_KERNEL_MODULES: ${{ matrix.service == 'nova' && 'true' || '' }}
      # Use shared operator deployment script.
      - name: Deploy operator (keystone)
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
      # The glance leg also needs the glance-operator in its own glance-system
      # namespace before its Glance CR reconciles, and so do the cinder leg for
      # the Glance it deploys next to its Cinder and the nova leg for the Glance
      # its servers boot from.
      - name: Deploy glance operator
        if: matrix.service == 'glance' || matrix.service == 'cinder' || matrix.service == 'nova'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: glance
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/glance-operator
          NAMESPACE: glance-system
      # The barbican leg needs the barbican-operator in its own barbican-system
      # namespace before its Barbican CR reconciles. The managed
      # BarbicanSecretStore lives in the openstack Namespace, and the operator
      # only mints its OpenBaoCluster provisioner token where the chart granted
      # it a TokenRequest Role, hence the Namespace=provisioner-account pair the
      # grant is rendered from and restricted to.
      - name: Deploy barbican operator
        if: matrix.service == 'barbican'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: barbican
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/barbican-operator
          NAMESPACE: barbican-system
          BARBICAN_SECRET_STORE_GRANTS: openstack=openbao-instance-provisioner
      # A Neutron never reaches Ready without a live OVNCentral: its controller
      # reads the published Northbound and Southbound addresses off that CR
      # before it renders ml2_conf.ini. The neutron leg therefore deploys both
      # operators, each into its own namespace, and so do the two compute-stack
      # legs, whose Nova binds every server's port on a Neutron of their own.
      - name: Deploy ovn operator
        if: matrix.service == 'neutron' || matrix.service == 'nova' || matrix.service == 'cinder'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ovn
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/ovn-operator
          NAMESPACE: ovn-system
      - name: Deploy neutron operator
        if: matrix.service == 'neutron' || matrix.service == 'nova' || matrix.service == 'cinder'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: neutron
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/neutron-operator
          NAMESPACE: neutron-system
      # The cinder leg needs the cinder-operator in its own cinder-system
      # namespace before its Cinder, CinderBackend and CinderBackupBackend CRs
      # reconcile. The glance-operator it also needs comes from the step above.
      - name: Deploy cinder operator
        if: matrix.service == 'cinder'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: cinder
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/cinder-operator
          NAMESPACE: cinder-system
      # The rest of the compute stack of the nova and cinder legs; the
      # glance-, ovn- and neutron-operator they also need are deployed by the
      # steps above, whose conditions cover both legs. A Nova claims its
      # inventory in a Placement, so both of these have to be watching before
      # the CRs below are applied.
      - name: Deploy placement operator
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: placement
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/placement-operator
          NAMESPACE: placement-system
      - name: Deploy nova operator
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: nova
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/nova-operator
          NAMESPACE: nova-system
      # Every service deploys the Keystone CR from its own config-dir (the
      # glance and barbican legs run against their own
      # keystone-<service>-tempest identity CR).
      - name: Deploy Keystone CR for Tempest
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/00-keystone-cr.yaml
          kubectl wait keystone/${{ matrix.cr-name }} -n openstack \
            --for=condition=Ready --timeout=300s
      # The glance leg bootstraps the image catalog (Keystone service +
      # endpoints via a setup Job) before its Glance + GlanceBackend CRs, which
      # depend on that catalog entry to reconcile.
      - name: Bootstrap image catalog
        if: matrix.service == 'glance'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/01-catalog-setup-job.yaml
          kubectl wait --for=condition=complete job/glance-tempest-catalog-setup -n openstack \
            --timeout=300s
      - name: Deploy Glance CR for Tempest
        if: matrix.service == 'glance'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/02-glance-cr.yaml
          kubectl apply -f ${{ matrix.config-dir }}/03-glancebackend-cr.yaml
          kubectl apply -f ${{ matrix.config-dir }}/04-glancebackend2-cr.yaml
          kubectl wait glance/${{ matrix.glance-cr-name }} -n openstack \
            --for=condition=Ready --timeout=300s
      # The barbican leg bootstraps the key-manager catalog (Keystone service +
      # endpoints via a setup Job) before its Barbican + BarbicanSecretStore CRs,
      # which depend on that catalog entry to reconcile.
      - name: Bootstrap key-manager catalog
        if: matrix.service == 'barbican'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/01-catalog-setup-job.yaml
          kubectl wait --for=condition=complete job/barbican-tempest-catalog-setup -n openstack \
            --timeout=300s
      # The store goes Ready first: Barbican renders no config and never starts
      # without a credential-ready default store, so waiting on it separately
      # keeps a store-side failure from surfacing as an opaque Barbican timeout.
      - name: Deploy Barbican CR for Tempest
        if: matrix.service == 'barbican'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/02-barbican-cr.yaml
          kubectl apply -f ${{ matrix.config-dir }}/03-barbicansecretstore-cr.yaml
          kubectl wait barbicansecretstore/${{ matrix.barbican-cr-name }}-store -n openstack \
            --for=condition=Ready --timeout=300s
          kubectl wait barbican/${{ matrix.barbican-cr-name }} -n openstack \
            --for=condition=Ready --timeout=300s
      # Every plugin API test runs as project_admin, which Barbican's legacy and
      # secure-RBAC rules both accept, so this Job is what shows the rendered
      # enforce_new_defaults took effect: a member-only user creates and deletes
      # a secret, and a key-manager:service-admin-only user is refused project
      # quotas.
      - name: Verify key-manager policy defaults
        if: matrix.service == 'barbican'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/04-policy-check-job.yaml
          kubectl wait --for=condition=complete job/barbican-tempest-policy-check -n openstack \
            --timeout=300s
      # The neutron leg bootstraps the network catalog (Keystone service +
      # endpoints via a setup Job) before its OVNCentral and Neutron CRs: the
      # Neutron reconciler authenticates against that catalog entry.
      - name: Bootstrap network catalog
        if: matrix.service == 'neutron'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/01-catalog-setup-job.yaml
          kubectl wait --for=condition=complete job/neutron-tempest-catalog-setup -n openstack \
            --timeout=300s
      # The OVNCentral goes Ready first: Neutron renders no ml2_conf.ini without
      # the published database addresses and the client identity, so waiting on
      # it separately keeps an OVN-side failure from surfacing as an opaque
      # Neutron timeout. Its name arrives as the ovn-cr-name matrix key, like
      # every other CR this job waits on, so no copy of it lives here; the
      # generator and the fixture that carry it are held in agreement by
      # tests/unit/ci/neutron_e2e_matrix_test.sh.
      - name: Deploy OVNCentral for Tempest
        if: matrix.service == 'neutron'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/02-messaging-secret.yaml
          kubectl apply -f ${{ matrix.config-dir }}/03-ovncentral-cr.yaml
          kubectl wait ovncentral/${{ matrix.ovn-cr-name }} -n openstack \
            --for=condition=Ready --timeout=300s
      # 600s rather than the 300s the other legs use: the Neutron brings up an
      # api Deployment, an rpc-worker Deployment and a db-sync Job, and the
      # db-sync alone takes minutes against the alembic head.
      - name: Deploy Neutron CR for Tempest
        if: matrix.service == 'neutron'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/04-neutron-cr.yaml
          kubectl wait neutron/${{ matrix.neutron-cr-name }} -n openstack \
            --for=condition=Ready --timeout=600s
      # The cinder leg bootstraps the block-storage catalog (the Cinder and
      # Glance services plus their endpoints via a setup Job) before its CRs:
      # the Cinder reconciler authenticates against that catalog entry, and the
      # Cinder resolves the image service from it too.
      - name: Bootstrap block-storage catalog
        if: matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/01-catalog-setup-job.yaml
          kubectl wait --for=condition=complete job/cinder-tempest-catalog-setup -n openstack \
            --timeout=300s
      # The nova leg bootstraps the compute catalog (the compute, placement,
      # image and network services plus their endpoints via a setup Job) before
      # any of its CRs: the Nova resolves its siblings through that catalog on
      # the internal interface, and the Neutron and Placement reconcilers
      # authenticate against their own entries.
      - name: Bootstrap compute catalog
        if: matrix.service == 'nova'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/01-catalog-setup-job.yaml
          kubectl wait --for=condition=complete job/nova-tempest-catalog-setup -n openstack \
            --timeout=300s
      # The compute-stack steps from here on name their fixtures by suffix glob,
      # unquoted so the shell expands it: the numeric prefixes differ between
      # tests/tempest/nova-<slug>/ and tests/tempest/cinder-<slug>/, where the
      # volume fixtures come first. Each pattern matches one file in either
      # directory, and a pattern that matches nothing reaches kubectl as its own
      # literal text, which fails the step instead of skipping it.
      #
      # Applied here, waited on below. Neither the OVNCentral nor the Placement
      # has an upstream in this set — nothing in the fixtures references the
      # Glance or the Cinder, and the catalog entries the Placement
      # authenticates against are written by the setup Job above — so they
      # reconcile while the cinder leg brings up its Glance, its Cinder and its
      # seed image, and while the nova leg waits out its OVNCentral and its
      # Neutron, instead of after them. The steps below re-apply the same
      # manifests, which is a no-op, and then wait.
      #
      # The Neutron is deliberately not applied here: its controller
      # error-requeues until the OVNCentral publishes its database addresses,
      # and whether controller-runtime's backoff then costs more than the
      # overlap saves has to be measured, not assumed.
      - name: Apply the independent compute-stack CRs
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/*-messaging-secret.yaml
          kubectl apply -f ${{ matrix.config-dir }}/*-ovncentral-cr.yaml
          kubectl apply -f ${{ matrix.config-dir }}/*-placement-cr.yaml
      # The Glance goes Ready before the Cinder is applied: the seed image the
      # volume tests boot from is uploaded to it, and a store-side failure here
      # would otherwise surface as an opaque Cinder timeout.
      - name: Deploy Glance CR for the cinder leg
        if: matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/02-glance-cr.yaml
          kubectl apply -f ${{ matrix.config-dir }}/03-glancebackend-cr.yaml
          kubectl wait glance/${{ matrix.glance-cr-name }} -n openstack \
            --for=condition=Ready --timeout=300s
      # 600s rather than the 300s the glance and barbican legs use: the Cinder
      # brings up an api, a scheduler, a volume and a backup Deployment plus a
      # db-sync Job, and the backends have to be attached before the volume and
      # backup services are projected at all.
      - name: Deploy Cinder CR for Tempest
        if: matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/04-cinderbackend-cr.yaml
          kubectl apply -f ${{ matrix.config-dir }}/05-cinderbackupbackend-cr.yaml
          kubectl apply -f ${{ matrix.config-dir }}/06-cinder-cr.yaml
          kubectl wait cinder/${{ matrix.cinder-cr-name }} -n openstack \
            --for=condition=Ready --timeout=600s
      # tempest.conf pins [compute] image_ref to the UUID this Job creates, so
      # the create-volume-from-image cases have an image before the run starts.
      - name: Seed the image the volume tests boot from
        if: matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/07-image-seed-job.yaml
          kubectl wait --for=condition=complete job/cinder-tempest-image-seed -n openstack \
            --timeout=300s
      # The OVNCentral goes Ready first: the Neutron renders no ml2_conf.ini
      # without the published database addresses and the client identity, so an
      # OVN-side failure surfaces here rather than as an opaque Neutron timeout.
      - name: Deploy OVNCentral for the compute stack
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/*-messaging-secret.yaml
          kubectl apply -f ${{ matrix.config-dir }}/*-ovncentral-cr.yaml
          kubectl wait ovncentral/${{ matrix.ovn-cr-name }} -n openstack \
            --for=condition=Ready --timeout=300s
      # 600s for the reason the neutron leg's own step gives above.
      - name: Deploy Neutron CR for the compute stack
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/*-neutron-cr.yaml
          kubectl wait neutron/${{ matrix.neutron-cr-name }} -n openstack \
            --for=condition=Ready --timeout=600s
      # The Placement holds the inventory the compute publishes and the
      # scheduler reads, so it is Ready before the Nova is applied.
      - name: Deploy Placement CR
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/*-placement-cr.yaml
          kubectl wait placement/${{ matrix.placement-cr-name }} -n openstack \
            --for=condition=Ready --timeout=300s
      # The nova leg's own image service. It is Ready before the seed Job
      # uploads to it; the cinder leg has its Glance from the step further up.
      - name: Deploy Glance CR for the nova leg
        if: matrix.service == 'nova'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/06-glance-cr.yaml
          kubectl apply -f ${{ matrix.config-dir }}/07-glancebackend-cr.yaml
          kubectl wait glance/${{ matrix.glance-cr-name }} -n openstack \
            --for=condition=Ready --timeout=300s
      # tempest.conf pins [compute] image_ref and image_ref_alt to the two UUIDs
      # this Job creates, so every boot case has its image before the run
      # starts.
      - name: Seed the images the compute tests boot from
        if: matrix.service == 'nova'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/08-image-seed-job.yaml
          kubectl wait --for=condition=complete job/nova-tempest-image-seed -n openstack \
            --timeout=300s
      # 900s rather than the 600s the Neutron and the Cinder take: the first CI
      # run of the nova e2e leg measured 3 minutes for the eight MariaDB CRs at
      # the operator's 30s requeue and 3 more for the six nova-manage runs of
      # the db-sync, which puts Ready about 8 minutes after the apply
      # (tests/e2e/nova/basic-deployment/chainsaw-test.yaml:60-63).
      - name: Deploy Nova CR
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/*-metadata-secret.yaml
          kubectl apply -f ${{ matrix.config-dir }}/*-nova-cr.yaml
          kubectl wait nova/${{ matrix.nova-cr-name }} -n openstack \
            --for=condition=Ready --timeout=900s
      # nova-scheduler places a server only on a host that has a mapping in the
      # API database, and it writes those mappings from a 300-second periodic,
      # which is longer than the run can wait for its first boot. The step
      # therefore runs the discovery by hand.
      #
      # The host differs by leg. The cinder leg's compute registers as fake-1,
      # the nova leg's under the node's name, because the OVN chassis registers
      # under that name and neutron binds a port only to a host with a live
      # chassis (tests/tempest/nova-2025-2/11-fake-compute.yaml).
      - name: Deploy the fake compute
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/*-fake-compute.yaml
          kubectl rollout status deploy/${{ matrix.nova-cr-name }}-fake-compute -n openstack --timeout=300s
          host=fake-1
          if [ "${{ matrix.service }}" = "nova" ]; then
            host="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          fi
          tests/e2e/nova/discover-hosts.sh ${{ matrix.nova-cr-name }} openstack "$host"
      # The chassis programs the local Open vSwitch of every node its selector
      # matches, and it selects on a label the cluster bring-up does not set, so
      # the step writes that label first (the one
      # tests/e2e/neutron/metadata-agent/chainsaw-test.yaml:48-54 writes too).
      # Without a live chassis row in the Southbound database every server the
      # suite boots ends in ERROR on a binding failure.
      - name: Deploy the OVN chassis
        if: matrix.service == 'nova'
        run: |
          kubectl label node "$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')" openstack.c5c3.io/chassis=true --overwrite
          kubectl apply -f ${{ matrix.config-dir }}/12-ovnchassis-cr.yaml
          kubectl wait ovnchassis/ovn-${{ matrix.nova-cr-name }}-chassis -n openstack \
            --for=condition=Ready --timeout=300s
      # The agent answers the 169.254.169.254 requests the servers on that
      # chassis make, which is what the metadata_service tests read back.
      - name: Deploy the metadata agent
        if: matrix.service == 'nova'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/13-neutronmetadataagent-cr.yaml
          kubectl wait neutronmetadataagent/neutron-${{ matrix.nova-cr-name }}-agent -n openstack \
            --for=condition=Ready --timeout=300s
      # tempest.conf pins [compute] flavor_ref and flavor_ref_alt to the two ids
      # this Job creates. It talks to the Nova API, so it comes after the Nova
      # is Ready.
      - name: Seed the flavors
        if: matrix.service == 'nova' || matrix.service == 'cinder'
        run: |
          kubectl apply -f ${{ matrix.config-dir }}/*-flavor-seed-job.yaml
          kubectl wait --for=condition=complete job/${{ matrix.service }}-tempest-flavor-seed -n openstack \
            --timeout=300s
      # Use shared Tempest wrapper script.
      - name: Run Tempest API tests
        run: hack/ci-run-tempest.sh
        env:
          CONFIG_DIR: ${{ matrix.config-dir }}
          TEMPEST_IMAGE: ${{ env.IMAGE_PREFIX }}/tempest:${{ matrix.release }}
          SERVICE_K8S_NAME: ${{ matrix.service-k8s-name }}
          # The Glance Service carries the CR name. The matrix emits
          # glance-cr-name for the glance legs, for the cinder legs, whose
          # volume tests create volumes from an image, and for the nova legs,
          # whose servers boot from one. Empty elsewhere (matrix key absent →
          # ""), which disables the 9292 port-forward in ci-run-tempest.sh.
          GLANCE_K8S_NAME: ${{ matrix.glance-cr-name }}
          # The Barbican Service carries the CR name. Empty for the keystone and
          # glance legs (matrix key absent → ""), which disables the 9311
          # port-forward in ci-run-tempest.sh.
          BARBICAN_K8S_NAME: ${{ matrix.barbican-cr-name }}
          # The Neutron Service carries the CR name. The cinder and nova legs
          # set it too: the nova legs' servers bind a port on that Neutron, and
          # on both compute-stack legs tempest's dynamic credentials delete each
          # project's default security group through the network API, which is
          # the reason the cinder legs forward it. Empty for the keystone,
          # glance and barbican legs (matrix key absent → ""), which disables
          # the 9696 port-forward in ci-run-tempest.sh.
          NEUTRON_K8S_NAME: ${{ matrix.neutron-cr-name }}
          # The Cinder Service carries the CR name. Empty on every other leg
          # (matrix key absent → ""), which disables the 8776 port-forward in
          # ci-run-tempest.sh.
          CINDER_K8S_NAME: ${{ matrix.cinder-cr-name }}
          # The Nova Service carries the CR name. Empty on every leg without a
          # compute stack (matrix key absent → ""), which disables the 8774
          # port-forward in ci-run-tempest.sh.
          NOVA_K8S_NAME: ${{ matrix.nova-cr-name }}
          # The noVNC console proxy Service is <nova>-novncproxy. Only the nova
          # legs open a console, for test_novnc_bad_token; empty everywhere
          # else, which disables the 6080 port-forward in ci-run-tempest.sh.
          NOVA_CONSOLE_K8S_NAME: ${{ matrix.service == 'nova' && format('{0}-novncproxy', matrix.nova-cr-name) || '' }}
          # The Placement Service carries the CR name. Both compute-stack legs
          # register a placement endpoint in their catalog and declare the
          # service available in tempest.conf, so the name has to resolve inside
          # the container: without the 8778 forward a test that builds the
          # placement client dies on name resolution and is reported as an
          # error rather than a skip. Empty on every other leg (matrix key
          # absent → ""), which disables that forward.
          PLACEMENT_K8S_NAME: ${{ matrix.placement-cr-name }}
          # stestr worker count. Set by hack/ci-generate-tempest-matrix.sh for
          # the neutron legs (2), whose node also hosts OVN and Neutron, for
          # the cinder legs (2), whose node hosts the broker, the NFS server,
          # four Cinder workloads, a Glance and a compute stack, and for the
          # nova legs (2), whose node hosts the whole compute stack; empty for
          # the other legs (matrix key absent → ""), which leaves
          # ci-run-tempest.sh on its default of 4.
          TEMPEST_CONCURRENCY: ${{ matrix.tempest-concurrency }}
      - name: Upload Tempest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempest-${{ matrix.service }}-${{ matrix.release }}-results
          # The rendered tempest.conf carries the cleartext Keystone admin
          # password substituted by hack/ci-run-tempest.sh; keep it out of the
          # retained artifact. The JUnit/subunit results carry no secrets.
          path: |
            _output/tempest/
            !_output/tempest/config/tempest.conf
          retention-days: 14
      # Use shared diagnostic dump script.
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: keystone
      # A compute-stack leg runs five or six more operators, each in a Namespace
      # the dump above never looks at. One call per operator, since the
      # script reads a single OPERATOR. OPERATOR_ONLY keeps each pass to the
      # sections that differ: the infrastructure block and the openstack
      # Namespace's Job and pod logs do not change with OPERATOR, and the dump
      # above already emitted them.
      - name: Dump diagnostic info (compute stack)
        if: always() && (matrix.service == 'nova' || matrix.service == 'cinder')
        run: |
          ops="nova placement ovn neutron glance"
          if [ "${{ matrix.service }}" = "cinder" ]; then
            ops="${ops} cinder"
          fi
          for op in ${ops}; do
            OPERATOR="${op}" OPERATOR_ONLY=1 hack/ci-dump-diagnostics.sh
          done
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh

  # GH-310: Prune the run-scoped GHCR tags pushed by build-e2e-images.
  # Runs as soon as every consumer that might still pull the images has
  # finished (success, failure, cancelled, or skipped) so leftover
  # e2e-${run_id}-* tags don't accumulate on the package page. The
  # nightly cleanup-images workflow has a safety-net job that catches
  # tags that survive a cancelled run before this one fires.
  cleanup-e2e-tags:
    needs: [changes, build-e2e-images, e2e-operator, e2e-operator-upgrade, e2e-chaos, e2e-ovn-overlay, tempest]
    if: |
      always() &&
      needs.build-e2e-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pruning run-scoped tags is best-effort housekeeping — a failure must not
    # fail the PR. A brand-new package (e.g. c5c3-operator before it is first
    # published to main) has only the run-scoped e2e tag, and GHCR refuses to
    # delete the last tagged version of a package ("You must delete the package
    # instead"). The nightly cleanup-images workflow is the safety net for any
    # leaked e2e-* tags.
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.changes.outputs.cleanup-e2e-packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # GH-312: this job runs in parallel with build-and-push, which uploads
      # per-platform manifests via push-by-digest=true (i.e. untagged) and
      # relies on merge-operator-images to assemble them into a tagged manifest
      # list. Pruning untagged images mid-flight removes those digests and
      # breaks the merge step — so the prune runs in --only-tag-pattern mode,
      # where untagged versions are out of scope by construction.
      - name: Delete run-scoped tags for ${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 hack/ghcr-prune-stale-versions.py \
            --org "${{ github.repository_owner }}" \
            --package "${{ matrix.package }}" \
            --only-tag-pattern "^e2e-${{ github.run_id }}-" \
            --min-age-hours 0 \
            --max-deletions 0

  # Build operator container images per platform on native runners.
  # Each platform is pushed by digest; merge-operator-images assembles the manifest list.
  # Runs only on push events (main branch or v* tags) after E2E passed.
  build-and-push:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 23
    # Publish-only-on-merge: the merged commit's PR was already green, so we do
    # not re-run the E2E suite on push. This job depends only on `changes` (for
    # the operator matrix) and builds the image from its own cache scope,
    # independent of build-e2e-images.
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.has-e2e-operators == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        operator: ${{ fromJson(needs.changes.outputs.e2e-operators).operator }}
        platform:
          - name: linux/amd64
            runner: ubuntu-latest
          - name: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform pair
        id: platform-pair
        uses: ./.github/actions/platform-pair
        with:
          platform: ${{ matrix.platform.name }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate OCI annotations consistent with the two-layer OCI annotation
      # pattern in build-images.yaml. type=semver strips the v prefix (v0.1.0 -> 0.1.0).
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
          labels: |
            org.opencontainers.image.title=${{ matrix.operator }}-operator
            org.opencontainers.image.description=Kubernetes operator for OpenStack ${{ matrix.operator }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=SAP SE

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: operators/Dockerfile
          build-args: |
            OPERATOR=${{ matrix.operator }}
          platforms: ${{ matrix.platform.name }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.operator }}-operator-${{ steps.platform-pair.outputs.value }}
          cache-to: type=gha,mode=max,scope=${{ matrix.operator }}-operator-${{ steps.platform-pair.outputs.value }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-operator-${{ matrix.operator }}-${{ steps.platform-pair.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble per-platform digests into multi-arch manifest lists
  # and push with final tags (SHA, latest, semver).
  merge-operator-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-and-push]
    if: github.event_name == 'push' && needs.build-and-push.result == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.e2e-operators) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: ./.github/actions/registry-login
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate OCI tags via docker/metadata-action.
      # type=semver strips the v prefix (v0.1.0 -> 0.1.0).
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=${{ matrix.operator }}-operator
            org.opencontainers.image.description=Kubernetes operator for OpenStack ${{ matrix.operator }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=SAP SE

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-operator-${{ matrix.operator }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push manifest list
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.operator }}-operator
        run: |
          cd /tmp/digests
          # shellcheck disable=SC2012 # deliberate: counting entries, not parsing names
          [[ $(ls | wc -l) -ge 1 ]] || { echo "::error::No digests found for ${{ matrix.operator }}-operator"; exit 1; }
          # shellcheck disable=SC2046 # deliberate: both substitutions expand to argument lists
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

  # Package and push operator Helm charts to GHCR OCI registry.
  # Runs only on push events after E2E passed. Uses versioned chart packaging
  # for v* tag pushes.
  helm-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publish-only-on-merge: see build-and-push. The chart is packaged and pushed
    # for every changed operator on push without re-running the E2E suite.
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.has-e2e-operators == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.e2e-operators) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
      - name: Package and push Helm chart
        env:
          OPERATOR: ${{ matrix.operator }}
        run: |
          # Remove stale chart tarballs to prevent glob ambiguity.
          rm -f "${OPERATOR}"-operator-*.tgz
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            make helm-package OPERATOR="${OPERATOR}" CHART_VERSION="${GITHUB_REF_NAME#v}"
          else
            make helm-package OPERATOR="${OPERATOR}"
          fi
          helm push "${OPERATOR}"-operator-*.tgz oci://${{ env.REGISTRY }}/c5c3/charts

  # Package and push the target-cluster-access chart to the GHCR OCI registry.
  # It is a job of its own rather than a step in helm-push because that job is a
  # per-operator matrix: an in-matrix step would package and push this single
  # chart once per leg, and the legs would race on the same registry tag.
  helm-push-target-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publish-only-on-merge: see build-and-push.
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.target-cluster-chart == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
      - name: Package and push Helm chart
        run: |
          # Remove stale chart tarballs to prevent glob ambiguity.
          rm -f target-cluster-access-*.tgz
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            make helm-package-target-cluster CHART_VERSION="${GITHUB_REF_NAME#v}"
          else
            make helm-package-target-cluster
          fi
          helm push target-cluster-access-*.tgz oci://${{ env.REGISTRY }}/c5c3/charts

  # Create GitHub release with auto-generated release notes
  # on v* tag pushes, after images and charts are published.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [changes, merge-operator-images, helm-push]
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      needs.merge-operator-images.result == 'success' &&
      needs.helm-push.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      # Package Helm chart tarballs to attach as release assets.
      - name: Package Helm charts
        run: |
          for op in $(echo '${{ needs.changes.outputs.e2e-operators }}' | jq -r '.operator[]'); do
            make helm-package OPERATOR="${op}" CHART_VERSION="${GITHUB_REF_NAME#v}"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: "*-operator-*.tgz"
