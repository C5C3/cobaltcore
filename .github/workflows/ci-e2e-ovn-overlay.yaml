---
# Multi-node OVN overlay E2E on kind. Brings up the one-control-plane,
# two-worker cluster of hack/kind-config-multinode.yaml with the frr-k8s
# overlay (WITH_FRR_K8S=true), deploys the ovn-operator, and runs the three
# suites of tests/e2e-ovn-overlay/. default-spread checks where the replicas
# of an OVNCentral that names no spread land on workers without a zone label:
# northd two on each, the Northbound members on both. fabric-advertised-route
# attaches one worker to two FRR Pods through an OVNChassis spec.fabric and
# follows a route of a test logical router to both peers. geneve-datapath
# puts one logical switch port on each node, pings across the Geneve tunnel
# between them, and reads the Southbound rows that say which chassis carried
# it.
#
# continue-on-error: true because geneve-datapath needs the openvswitch and
# geneve kernel modules on the runner host, and fabric-advertised-route the
# vrf module as well, which puts the job under the
# non-blocking entry rule of `### Kernel-module-dependent suites` in
# docs/reference/ci-cd/ci-workflow.md. default-spread needs no kernel module,
# but it needs the two workers, so it runs in this job and is non-blocking
# with it. A later change flips the job to blocking once its pass history on
# main justifies the flip. The single-node chassis baseline under
# tests/e2e/ovn/ stays blocking inside the e2e-operator legs.
#
# The job runs alone on its runner: hack/kind-config-multinode.yaml and
# hack/kind-config.yaml bind the same host ports (443 and 8428 on 127.0.0.1),
# so a second cluster created from either file on the same host fails to bind
# them.
#
# The e2e-ovn-overlay job of ci.yaml calls this workflow and decides when it runs.
name: E2E OVN Overlay

"on":
  workflow_call:
    inputs:
      image-map:
        description: >
          JSON object mapping each canonical image ref the job loads to the
          reference to pull for it (see .github/actions/load-e2e-images).
        type: string
        required: true

permissions:
  contents: read
  packages: read

# A called workflow does not inherit the env of ci.yaml, so the values its
# steps and scripts read are declared here. kind is not pinned here: the
# create-kind-cluster action installs the KIND_VERSION of
# hack/install-test-deps.sh.
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/c5c3
  KIND_CLUSTER: cobaltcore

jobs:
  e2e-ovn-overlay:
    runs-on: self-hosted
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The multi-node config is passed through the action's `config:` input
      # rather than KIND_CONFIG: setup-e2e-infra runs with SKIP_KIND_CREATE,
      # so the cluster already exists by the time hack/deploy-infra.sh reads
      # that variable.
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          config: hack/kind-config-multinode.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # images/ovn/source.json holds the pin; resolving it here keeps the tag
      # out of this workflow.
      - name: Resolve OVN version
        run: echo "OVN_VERSION=$(hack/ci-resolve-ovn-version.sh)" >> "$GITHUB_ENV"
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ inputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/ovn-operator:dev
            ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }}
      # Every node runs its own chassis pods, and kind loads an image onto all
      # of a cluster's nodes.
      - name: Load images into kind
        run: |
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn-operator:dev --name "${{ env.KIND_CLUSTER }}"
          kind load docker-image ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }} --name "${{ env.KIND_CLUSTER }}"
      # The chassis DaemonSets open a Geneve tunnel from each kind node, which
      # needs the openvswitch and geneve modules loaded on the host.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_OVN_KERNEL_MODULES: "true"
          WITH_FRR_K8S: "true"
      - name: Deploy ovn-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ovn
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/ovn-operator
          NAMESPACE: ovn-system
      - name: Run the overlay suite
        run: |
          mkdir -p _output/reports
          make e2e-ovn-overlay
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: ovn
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ovn-overlay-junit-report
          path: _output/reports/
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh
