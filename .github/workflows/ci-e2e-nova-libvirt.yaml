---
# Nova's libvirt driver against a real libvirtd on kind. Brings up the
# single-node cluster of hack/kind-config.yaml, deploys the nova-operator
# and its six siblings, and runs the two suites of tests/e2e-nova-libvirt/
# against libvirtd from ghcr.io/c5c3/libvirt:latest in a DaemonSet on the
# node and a NovaCompute pool with virtType: qemu beside it. The guests run
# under QEMU's TCG emulation, which needs no /dev/kvm.
#
# server-boot boots a server from the stack's zero image and asserts that
# libvirt runs the domain from the qcow2 disk nova-compute built, and that
# deleting the server removes both. guest-dataplane boots two cirros guests
# on one tenant network and attaches a Cinder volume on the kind NFS server
# to one of them. Probes inside that guest judge DHCP, metadata, pings to
# the peer, a security-group deny and the volume. The suite then kills
# libvirt and nova-compute under the running guest with Chaos Mesh (the
# lab's faults F1 and F2), reads the volume's counter on the backend, and
# runs four tempest.scenario tests that never log into a guest. KVM, live
# migration and north-south traffic stay with the lab run of
# docs/quick-start-metal-stack.md.
#
# continue-on-error: true because the pool's chassis gate needs the
# openvswitch kernel module on the runner host, which puts the job under
# the non-blocking entry rule of `### Kernel-module-dependent suites` in
# docs/reference/ci-cd/ci-workflow.md. A later change flips it to blocking
# once its pass history on main justifies the flip.
#
# The job runs alone on its runner: hack/kind-config.yaml binds host ports
# 443 and 8428 on 127.0.0.1, so a second cluster created from it on the
# same host fails to bind them.
#
# The e2e-nova-libvirt job of ci.yaml calls this workflow and decides when it runs.
name: E2E Nova Libvirt

"on":
  workflow_call:
    inputs:
      image-map:
        description: >
          JSON object mapping each canonical image ref the job loads to the
          reference to pull for it (see .github/actions/load-e2e-images).
        type: string
        required: true

permissions:
  contents: read
  packages: read

# A called workflow does not inherit the env of ci.yaml, so the values its
# steps and scripts read are declared here. kind is not pinned here: the
# create-kind-cluster action installs the KIND_VERSION of
# hack/install-test-deps.sh.
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/c5c3
  KIND_CLUSTER: cobaltcore

jobs:
  e2e-nova-libvirt:
    runs-on: self-hosted
    # About 34 minutes before the guest suite (four runs, the suite 14 of
    # them), plus about 4 for the cinder images, NFS and Chaos Mesh, plus
    # about 50 for the guest suite: the bring-up 12, the guests 10, the deny
    # and the faults 12, the backend read 3 and Tempest 15. The rest is
    # headroom for TCG on a busy runner. Re-derive the value from the first
    # green run.
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create kind cluster
        uses: ./.github/actions/create-kind-cluster
        with:
          config: hack/kind-config.yaml
          cluster-name: ${{ env.KIND_CLUSTER }}
      # images/ovn/source.json holds the pin; resolving it here keeps the tag
      # out of this workflow.
      - name: Resolve OVN version
        run: echo "OVN_VERSION=$(hack/ci-resolve-ovn-version.sh)" >> "$GITHUB_ENV"
      # The 2026.1 stack of tests/e2e/nova/compute-node-pool, whose fixtures the
      # suites apply, the Cinder the guest suite adds, the tempest image its
      # Jobs, its client pod and its Tempest run use, which also carries the
      # cirros guest image, and the libvirt image the suites start libvirtd
      # from. The map
      # resolves libvirt:latest to this run's build when the pull request
      # changed an input of the image, and otherwise to the digest latest
      # names on GHCR.
      - name: Load E2E images
        uses: ./.github/actions/load-e2e-images
        with:
          image-map: ${{ inputs.image-map }}
          images: |
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev
            ${{ env.IMAGE_PREFIX }}/placement-operator:dev
            ${{ env.IMAGE_PREFIX }}/glance-operator:dev
            ${{ env.IMAGE_PREFIX }}/ovn-operator:dev
            ${{ env.IMAGE_PREFIX }}/neutron-operator:dev
            ${{ env.IMAGE_PREFIX }}/cinder-operator:dev
            ${{ env.IMAGE_PREFIX }}/nova-operator:dev
            ${{ env.IMAGE_PREFIX }}/keystone:2026.1
            ${{ env.IMAGE_PREFIX }}/placement:2026.1
            ${{ env.IMAGE_PREFIX }}/glance:2026.1
            ${{ env.IMAGE_PREFIX }}/neutron:2026.1
            ${{ env.IMAGE_PREFIX }}/cinder:2026.1
            ${{ env.IMAGE_PREFIX }}/nova:2026.1
            ${{ env.IMAGE_PREFIX }}/nova-compute:2026.1
            ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }}
            ${{ env.IMAGE_PREFIX }}/tempest:2026.1
            ${{ env.IMAGE_PREFIX }}/libvirt:latest
      # One call, so the Nix store layers the service images share are saved
      # and imported once rather than once per image.
      - name: Load images into kind
        run: |
          kind load docker-image \
            ${{ env.IMAGE_PREFIX }}/keystone-operator:dev \
            ${{ env.IMAGE_PREFIX }}/placement-operator:dev \
            ${{ env.IMAGE_PREFIX }}/glance-operator:dev \
            ${{ env.IMAGE_PREFIX }}/ovn-operator:dev \
            ${{ env.IMAGE_PREFIX }}/neutron-operator:dev \
            ${{ env.IMAGE_PREFIX }}/cinder-operator:dev \
            ${{ env.IMAGE_PREFIX }}/nova-operator:dev \
            ${{ env.IMAGE_PREFIX }}/keystone:2026.1 \
            ${{ env.IMAGE_PREFIX }}/placement:2026.1 \
            ${{ env.IMAGE_PREFIX }}/glance:2026.1 \
            ${{ env.IMAGE_PREFIX }}/neutron:2026.1 \
            ${{ env.IMAGE_PREFIX }}/cinder:2026.1 \
            ${{ env.IMAGE_PREFIX }}/nova:2026.1 \
            ${{ env.IMAGE_PREFIX }}/nova-compute:2026.1 \
            ${{ env.IMAGE_PREFIX }}/ovn:${{ env.OVN_VERSION }} \
            ${{ env.IMAGE_PREFIX }}/tempest:2026.1 \
            ${{ env.IMAGE_PREFIX }}/libvirt:latest \
            --name "${{ env.KIND_CLUSTER }}"
      # The pool's chassis gate needs an OVNChassis on the node, which needs
      # the openvswitch module on the host, and every Nova process dials the
      # message bus. The guest suite's Cinder serves its volume from the kind
      # NFS server, and its faults F1 and F2 are Chaos Mesh PodChaos objects.
      - name: Setup E2E infrastructure
        uses: ./.github/actions/setup-e2e-infra
        env:
          WITH_OVN_KERNEL_MODULES: "true"
          WITH_MESSAGING: "true"
          WITH_NFS: "true"
          WITH_CHAOS_MESH: "true"
      # The operators of the nova leg of e2e-operator, in its order: the
      # ovn-operator before the neutron-operator, whose reconcilers watch the
      # OVN kinds, and both before the nova-operator. The cinder-operator runs
      # the guest suite's volume service.
      - name: Deploy keystone-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: keystone
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/keystone-operator
          NAMESPACE: keystone-system
      - name: Deploy placement-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: placement
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/placement-operator
          NAMESPACE: placement-system
      - name: Deploy glance-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: glance
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/glance-operator
          NAMESPACE: glance-system
      - name: Deploy ovn-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: ovn
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/ovn-operator
          NAMESPACE: ovn-system
      - name: Deploy neutron-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: neutron
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/neutron-operator
          NAMESPACE: neutron-system
      - name: Deploy cinder-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: cinder
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/cinder-operator
          NAMESPACE: cinder-system
      - name: Deploy nova-operator
        run: hack/ci-deploy-operator.sh
        env:
          OPERATOR: nova
          IMAGE_REPO: ${{ env.IMAGE_PREFIX }}/nova-operator
          NAMESPACE: nova-system
      - name: Run the libvirt suite
        run: |
          mkdir -p _output/reports
          make e2e-nova-libvirt
      - name: Dump diagnostic info
        if: always()
        run: hack/ci-dump-diagnostics.sh
        env:
          OPERATOR: nova
      # The six sibling operators run in Namespaces of their own, which the
      # dump above never looks at. OPERATOR_ONLY keeps each pass to the
      # operator's own sections, as on the nova leg of e2e-operator.
      - name: Dump diagnostic info (nova siblings)
        if: always()
        run: |
          for op in keystone placement glance ovn neutron cinder; do
            OPERATOR="${op}" OPERATOR_ONLY=1 hack/ci-dump-diagnostics.sh
          done
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nova-libvirt-junit-report
          path: _output/reports/
          retention-days: 14
      # The guest suite's Tempest run. The rendered tempest.conf carries the
      # cleartext Keystone admin password hack/ci-run-tempest.sh substitutes,
      # so it stays out of the retained artifact, as on the tempest job.
      - name: Upload Tempest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-nova-libvirt-tempest-results
          path: |
            _output/tempest-nova-libvirt/
            !_output/tempest-nova-libvirt/config/tempest.conf
          retention-days: 14
      # Last step of the job, so the dump above still had a cluster to read;
      # `always()` covers the failed and timed-out runs.  Never fails the job
      # (see hack/ci-delete-kind-cluster.sh).
      - name: Delete kind cluster
        if: always()
        run: hack/ci-delete-kind-cluster.sh
