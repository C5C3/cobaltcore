# Composite action to fetch pre-built E2E images from GHCR.
# Shared between e2e-operator, e2e-chaos and tempest jobs.
#
# GH-310: Pulls each image from a run-scoped GHCR tag
# (e2e-${run_id}-<tag>) and re-tags it back to its canonical local
# reference so downstream `kind load docker-image` calls work
# unchanged. Replaces the previous download-artifact + zstd | docker
# load path, which timed out at the 5-minute mark for the 355 MB
# single-blob artifact.
#
# With operator-variant: cover, every <repo>-operator:dev ref is filled
# from the coverage-instrumented <repo>-operator:cover image instead, still
# tagged as the :dev ref the job loads into kind and deploys.

name: Load E2E images
description: >
  Pull pre-built E2E images from GHCR by run-scoped tag and re-tag
  them to their canonical local references. The build-e2e-images job
  pushes each image as ghcr.io/c5c3/<name>:e2e-${run_id}-<tag>; this
  action reverses the rewrite so consumers can keep using the
  release-scoped local refs. When the job passes its image-map, a ref
  the run did not build is pulled by the digest main published instead.

inputs:
  run-id:
    description: GitHub run ID used as the run-scoped tag prefix.
    required: false
    default: ${{ github.run_id }}
  images:
    description: >
      Multiline list of canonical local image refs to materialise
      locally (one per line, e.g. "ghcr.io/c5c3/keystone:2026.1").
      For each line the action pulls
      <repo>:e2e-<run-id>-<tag> from GHCR and re-tags it to the
      provided ref. Blank lines and lines starting with `#` are
      ignored.
    required: true
  image-map:
    description: >
      The build-e2e-images job's image-map output: a JSON object
      mapping each canonical ref to the reference to pull for it,
      either <repo>:e2e-<run-id>-<tag> for an image this run built or
      <repo>@sha256:... for one it reused from main. A ref the map
      does not carry falls back to the run-scoped tag, and so does
      every ref when the input is left empty.
    required: false
    default: ''
  operator-variant:
    description: >
      Empty, or cover. With cover, a ref that ends in -operator:dev is
      looked up in the image-map, and pulled from the run-scoped tag
      when the map lacks it, as the same repository's cover tag, and
      the pulled image is tagged as the original :dev ref. Every other
      ref is pulled as without it. Any other value fails the step
      before the first pull.
    required: false
    default: ''
  registry:
    description: Container registry to authenticate against.
    required: false
    default: ghcr.io
  username:
    description: Username for the registry login.
    required: false
    default: ${{ github.actor }}
  password:
    description: >
      Token for the registry login. Defaults to the workflow's
      GITHUB_TOKEN, which has packages:read for the same repo and
      packages:write when the calling job grants it.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/registry-login
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Pull and re-tag E2E images
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        RUN_ID: ${{ inputs.run-id }}
        IMAGE_MAP: ${{ inputs.image-map }}
        OPERATOR_VARIANT: ${{ inputs.operator-variant }}
      run: |
        set -euo pipefail
        run_tag="e2e-${RUN_ID}"
        case "${OPERATOR_VARIANT:-}" in
          "" | cover) ;;
          *)
            echo "::error::operator-variant must be empty or cover, got '${OPERATOR_VARIANT}'"
            exit 1
            ;;
        esac
        # Reject a malformed map before the first pull rather than halfway
        # through the list, where half the images are already re-tagged.
        if [[ -n "${IMAGE_MAP}" ]] && ! jq -e 'type == "object"' <<<"${IMAGE_MAP}" >/dev/null 2>&1; then
          echo "::error::image-map is not a JSON object"
          exit 1
        fi
        while IFS= read -r raw; do
          # Strip trailing line comments and surrounding whitespace.
          ref=""
          read -r ref _ <<< "${raw%%#*}" || true
          [[ -z "${ref}" ]] && continue

          if [[ "${ref}" != *:* ]]; then
            echo "::error::Image ref '${ref}' has no :tag suffix"
            exit 1
          fi
          repo="${ref%:*}"
          # The ref the image is looked up as: an operator's :dev ref under
          # the cover variant is filled from the same repository's cover tag.
          lookup="${ref}"
          if [[ "${OPERATOR_VARIANT:-}" == "cover" && "${ref}" == *-operator:dev ]]; then
            lookup="${repo}:cover"
          fi
          tag="${lookup##*:}"
          src=""
          if [[ -n "${IMAGE_MAP}" ]]; then
            src=$(jq -r --arg ref "${lookup}" '.[$ref] // empty' <<<"${IMAGE_MAP}")
          fi
          if [[ -z "${src}" ]]; then
            src="${repo}:${run_tag}-${tag}"
            if [[ -n "${IMAGE_MAP}" ]]; then
              echo "no image-map entry for ${lookup}; pulling ${src}"
            fi
          fi
          echo "::group::Pull ${src} → ${ref}"
          docker pull "${src}"
          docker tag "${src}" "${ref}"
          echo "::endgroup::"
        done <<< "${IMAGES}"
