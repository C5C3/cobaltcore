# Composite action encapsulating the Docker buildx + registry login +
# cosign installation sequence shared across build-images workflow jobs and
# the three publish jobs of ci.yaml (merge-operator-images, helm-push,
# helm-push-target-cluster).

name: Setup Docker registry
description: >
  Optionally configure Docker Buildx, authenticate to a container registry,
  and optionally install cosign for image and chart signing. Called by the
  build-images workflow jobs and by the merge-operator-images, helm-push
  and helm-push-target-cluster jobs of ci.yaml.

inputs:
  registry:
    description: Container registry URL
    required: false
    default: ghcr.io
  username:
    description: Registry username
    required: true
  password:
    description: Registry password/token
    required: true
  setup-buildx:
    description: >
      Whether to set up Docker Buildx; a job that builds no image and runs no
      imagetools command passes 'false' and starts no BuildKit builder
    required: false
    default: 'true'
  install-cosign:
    description: Whether to install cosign
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      if: inputs.setup-buildx != 'false'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to container registry
      uses: ./.github/actions/registry-login
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Install cosign
      if: inputs.install-cosign != 'false'
      uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4
