name: Derive service image tags
description: >
  Compute the image name and all tags (composite, version, SHA) for a service
  image. Used by the build, merge and verify jobs of the service images and
  of nova-compute, so that tag derivation stays in a single, authoritative
  location. The image name defaults to the service name; the nova-compute
  jobs name their image apart from the nova service it is built from.

inputs:
  service:
    description: OpenStack service name (e.g. keystone)
    required: true
  release:
    description: Release directory name (e.g. 2025.2)
    required: true
  repository-owner:
    description: GitHub repository owner (github.repository_owner)
    required: true
  image:
    description: Image name under the owner; empty means the service name. The version and the patch count still come from service.
    required: false
    default: ''
  install_yq:
    description: Install yq before running. Set to 'false' if the caller already provides yq.
    required: false
    default: 'true'

outputs:
  image:
    description: Bare image name without tag (e.g. ghcr.io/owner/keystone, or ghcr.io/owner/nova-compute with service nova and image nova-compute)
    value: ${{ steps.run.outputs.image }}
  composite:
    description: Full composite tag reference (e.g. ghcr.io/owner/keystone:28.0.0-p0-main-abc1234)
    value: ${{ steps.run.outputs.composite }}
  version:
    description: Version-only tag reference (e.g. ghcr.io/owner/keystone:28.0.0)
    value: ${{ steps.run.outputs.version }}
  sha:
    description: Short-SHA tag reference (e.g. ghcr.io/owner/keystone:abc1234)
    value: ${{ steps.run.outputs.sha }}
  release:
    description: Release tag reference (e.g. ghcr.io/owner/keystone:2025.2)
    value: ${{ steps.run.outputs.release }}
  version-ref:
    description: Raw upstream version string (e.g. 28.0.0)
    value: ${{ steps.run.outputs.version-ref }}

runs:
  using: composite
  steps:
    - name: Install yq
      if: ${{ inputs.install_yq != 'false' }}
      uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6

    - name: Derive tags
      id: run
      shell: bash
      env:
        MATRIX_SERVICE: ${{ inputs.service }}
        MATRIX_RELEASE: ${{ inputs.release }}
        IMAGE_OWNER: ${{ inputs.repository-owner }}
        IMAGE_NAME: ${{ inputs.image }}
      run: |
        VERSION=$(yq ".\"${MATRIX_SERVICE}\"" "releases/${MATRIX_RELEASE}/source-refs.yaml")
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "::error::No source-ref found for '${MATRIX_SERVICE}' in releases/${MATRIX_RELEASE}/source-refs.yaml"
          exit 1
        fi

        IMAGE_OWNER="${IMAGE_OWNER,,}"
        SHORT_SHA="${GITHUB_SHA::7}"
        BRANCH="${GITHUB_REF_NAME//\//-}"

        PATCH_DIR="patches/${MATRIX_SERVICE}/${MATRIX_RELEASE}"
        if [ -d "$PATCH_DIR" ]; then
          PATCH_COUNT=$(find "$PATCH_DIR" -name '*.patch' -type f | wc -l | xargs)
        else
          PATCH_COUNT=0
        fi

        IMAGE="ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME:-${MATRIX_SERVICE}}"
        COMPOSITE="${VERSION}-p${PATCH_COUNT}-${BRANCH}-${SHORT_SHA}"

        echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
        echo "composite=${IMAGE}:${COMPOSITE}" >> "$GITHUB_OUTPUT"
        echo "version=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
        echo "sha=${IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
        echo "release=${IMAGE}:${MATRIX_RELEASE}" >> "$GITHUB_OUTPUT"
        echo "version-ref=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Tags: ${IMAGE}:${COMPOSITE}, ${IMAGE}:${VERSION}, ${IMAGE}:${SHORT_SHA}, ${IMAGE}:${MATRIX_RELEASE}"
