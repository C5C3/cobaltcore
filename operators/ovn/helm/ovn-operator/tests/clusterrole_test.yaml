# ClusterRole RBAC rules unit tests.
#
# The rule set is the manual mirror of the kubebuilder RBAC markers in
# operators/ovn/internal/controller/ovncentral_controller.go and
# ovnchassis_controller.go, plus the leases rule the manager's leader election
# needs. These assertions are the pin for that sync: a marker added or a verb
# widened in either controller without the matching edit in
# templates/_helpers.tpl fails here.
suite: ClusterRole
templates:
  - templates/clusterrole.yaml
tests:
  - it: should have the correct number of rules
    asserts:
      - lengthEqual:
          path: rules
          count: 10

  # Both CR kinds share one rule. The operator reads them, stamps their status
  # and manages their finalizers; the CRs themselves are authored by whoever
  # deploys the control plane.
  - it: should grant read plus update and patch on the OVN CRs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals
              - ovnchassis
            verbs:
              - get
              - list
              - watch
              - update
              - patch

  - it: should not grant create or delete on the OVN CRs
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals
              - ovnchassis
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant get/update/patch on the OVN status subresources
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals/status
              - ovnchassis/status
            verbs:
              - get
              - update
              - patch

  - it: should grant update on the OVN finalizers subresources
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals/finalizers
              - ovnchassis/finalizers
            verbs:
              - update

  # nodes, pods and secrets share the one read-only core rule, mirroring the
  # nodes;pods;secrets marker.
  - it: should grant read-only on nodes
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
              - pods
              - secrets
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only on pods and secrets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
              - pods
              - secrets
            verbs:
              - get
              - list
              - watch
      # secrets hold the certificate material cert-manager writes; the operator
      # reads them and must never join them to the writable core rule.
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - services
              - configmaps
              - persistentvolumeclaims
              - secrets
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # A read-only grant on nodes is what keeps the operator from cordoning,
  # labelling or deleting one; the chassis layer only reads their addresses.
  - it: should not grant write verbs on nodes
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
              - pods
              - secrets
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - get
              - list
              - watch
              - update
              - patch

  - it: should grant full CRUD on core resources
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - services
              - configmaps
              - persistentvolumeclaims
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # The backup volume is a PersistentVolumeClaim the operator creates and
  # removes itself, so it shares the writable core rule.
  - it: should grant full CRUD on persistentvolumeclaims
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - services
              - configmaps
              - persistentvolumeclaims
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should restrict events to create and patch only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - events
            verbs:
              - create
              - patch

  # No controller in this binary mints a bound ServiceAccount token, and a
  # cluster-wide grant would let anyone reaching the operator ServiceAccount
  # act as any ServiceAccount in scope.
  - it: should not grant serviceaccounts/token cluster-wide
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - serviceaccounts/token
            verbs:
              - create

  # statefulsets carry the databases, deployments the northd and relay tiers,
  # daemonsets the per-node chassis pods.
  - it: should grant full CRUD on the workload kinds
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - statefulsets
              - deployments
              - daemonsets
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should not narrow the workload rule to deployments alone
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - deployments
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # The chassis maintenance Jobs share the batch rule with the backup CronJob.
  - it: should grant full CRUD on batch jobs and cronjobs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - batch
            resources:
              - jobs
              - cronjobs
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should not narrow the batch rule to jobs alone
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - batch
            resources:
              - jobs
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant full CRUD on certificates
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - cert-manager.io
            resources:
              - certificates
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant full CRUD on leases for leader election
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # ClusterRole must not render in namespace-scoped mode.
  - it: should not render ClusterRole when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
