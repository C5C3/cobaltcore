# ClusterRole unit tests.
#
# The rules come from templates/_rbac-rules.tpl, generated from the operator's
# +kubebuilder:rbac markers (make sync-helm-rbac); the rule shape follows
# controller-gen (resources with identical verbs merged, verbs sorted). This
# suite pins the rendering, the wiring of the generated rules into the
# ClusterRole, and the grants whose restriction is deliberate; it does not
# re-assert every generated rule.
suite: ClusterRole
templates:
  - templates/clusterrole.yaml
tests:
  - it: should not grant create or delete on the OVN CRs
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals
              - ovnchassis
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant get/update/patch on the OVN status subresources
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals/status
              - ovnchassis/status
            verbs:
              - get
              - patch
              - update

  - it: should grant update on the OVN finalizers subresources
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals/finalizers
              - ovnchassis/finalizers
            verbs:
              - update

  # nodes and pods share the one read-only core rule, mirroring the nodes;pods
  # marker.
  - it: should grant read-only on nodes and pods
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - nodes
              - pods
            verbs:
              - get
              - list
              - watch

  # The chassis controller copies the central's client Secret onto the
  # chassis's cluster (<chassis>-ovn-client), so secrets sit on the full-verb
  # core rule beside the other children the operator writes.
  - it: should grant full CRUD on secrets for the client-identity copy
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - configmaps
              - persistentvolumeclaims
              - secrets
              - services
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  # A read-only grant on nodes is what keeps the operator from cordoning,
  # labelling or deleting one; the chassis layer only reads their addresses.
  - it: should not grant write verbs on nodes
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - nodes
              - pods
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
      - notContains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - nodes
            verbs:
              - get
              - list
              - patch
              - update
              - watch

  - it: should restrict events to create and patch only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - events
            verbs:
              - create
              - patch

  # No controller in this binary mints a bound ServiceAccount token, and a
  # cluster-wide grant would let anyone reaching the operator ServiceAccount
  # act as any ServiceAccount in scope.
  - it: should not grant serviceaccounts/token cluster-wide
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - serviceaccounts/token
            verbs:
              - create

  - it: should not narrow the workload rule to deployments alone
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - deployments
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should not narrow the batch rule to jobs alone
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - batch
            resources:
              - jobs
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant read-only on priorityclasses for webhook validation
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - scheduling.k8s.io
            resources:
              - priorityclasses
            verbs:
              - get
              - list
              - watch

  - it: should grant full CRUD on poddisruptionbudgets for the Raft budgets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - policy
            resources:
              - poddisruptionbudgets
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant full CRUD on leases for leader election
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # ClusterRole must not render in namespace-scoped mode.
  - it: should not render ClusterRole when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Standalone webhook mode: the ClusterRole carries only the reads of
  # templates/_webhook-rbac-rules.tpl, generated from the markers with
  # roleName=ovn-webhook, and no leases rule.
  - it: should render only the webhook rule set when webhook.standalone is true
    set:
      webhook:
        standalone: true
    asserts:
      - lengthEqual:
          path: rules
          count: 1
      - contains:
          path: rules
          content:
            apiGroups:
              - scheduling.k8s.io
            resources:
              - priorityclasses
            verbs:
              - get
      - notContains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
