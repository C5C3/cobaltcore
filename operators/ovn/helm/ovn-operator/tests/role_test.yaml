# The namespace-scoped Role is not rendered by this chart: the OVNChassis
# controller watches cluster-scoped Nodes, and a Role accepts a rule naming them
# while granting nothing for it, so the operator would deploy and then die on
# its Node informer's cache-sync timeout. The rules themselves are pinned by
# clusterrole_test.yaml, which covers the one scope this chart supports.
suite: Role
templates:
  - templates/role.yaml
tests:
  - it: should fail when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "cluster-scoped Nodes"

  - it: should fail when rbac.namespaceScoped is true and webhook.enabled is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "webhook/enabled"

  - it: should render nothing when rbac.namespaceScoped is false
    asserts:
      - hasDocuments:
          count: 0
