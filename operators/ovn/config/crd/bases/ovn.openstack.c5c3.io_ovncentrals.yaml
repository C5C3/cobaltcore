                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'replicas is immutable: Raft membership changes are not
                    supported'
                  rule: self.replicas == oldSelf.replicas
                - message: 'electionTimerMs is immutable: it is applied when the clustered
                    database is created'
                  rule: self.electionTimerMs == oldSelf.electionTimerMs
                - message: 'storage is immutable: volumeClaimTemplates cannot change'
                  rule: self.storage == oldSelf.storage
              northd:
                default: {}
                description: |-
                  Northd configures the ovn-northd daemon that compiles the Northbound model
                  into Southbound flows.
                properties:
                  deployment:
                    description: |-
                      Deployment groups the pod-level knobs for the northd Deployment (replicas,
                      resources, rollout strategy, graceful-termination timings, and scheduling
                      constraints). Only one northd instance is active at a time: the others sit
                      in standby and take over when the active one loses its lock.
                    properties:
                      preStopSleepSeconds:
                        description: |-
                          PreStopSleepSeconds is the sleep duration (seconds) of the preStop
                          lifecycle hook, configured independently of the overall grace period
                          This covers the window between EndpointSlice removal and
                          kube-proxy/ingress-controller propagation so new requests stop arriving
                          before SIGTERM reaches the API process. When nil, the reconciler applies a default
                          of 5s. Zero is permitted to disable the sleep. The cross-field rule
                          preStopSleepSeconds < terminationGracePeriodSeconds is enforced by the
                          validating webhook to guarantee a non-zero drain window.
                        format: int64
                        minimum: 0
                        type: integer
                      priorityClassName:
                        description: |-
                          PriorityClassName sets the priority class for service API pods.
                          When set, the operator passes the value through to the PodSpec, allowing
                          cluster administrators to control scheduling priority and preemption.
                          When unset, no priority class is configured and the cluster default applies.
                        type: string
                      replicas:
                        default: 3
                        description: Replicas is the desired number of service API
                          pods.
                        format: int32
                        minimum: 1
                        type: integer
                      resources:
                        description: |-
                          Resources defines the CPU and memory requests and limits for the service API
                          container. When unset, the defaulting webhook injects the operator's
                          documented resource defaults (100m/500m CPU, with memory sized per
                          service — see the operator's CRD reference) to ensure Burstable QoS class
                          and enable HPA utilization calculations.
                        properties:
                          claims:
                            description: |-
                              Claims lists the names of resources, defined in spec.resourceClaims,
                              that are used by this container.

                              This field depends on the
                              DynamicResourceAllocation feature gate.

                              This field is immutable. It can only be set for containers.
