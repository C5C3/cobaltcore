---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-ovn-openstack-c5c3-io-v1alpha1-ovncentral
  failurePolicy: Fail
  name: movncentral.kb.io
  rules:
  - apiGroups:
    - ovn.openstack.c5c3.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - ovncentrals
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-ovn-openstack-c5c3-io-v1alpha1-ovncentral
  failurePolicy: Fail
  name: vovncentral.kb.io
  rules:
  - apiGroups:
    - ovn.openstack.c5c3.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - ovncentrals
  sideEffects: None
