              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KeystoneUserSpec defines the desired state of a KeystoneUser.
            properties:
              controlPlaneRef:
                description: |-
                  ControlPlaneRef names the ControlPlane whose identity plane the user is
                  created in. An order on a target cluster sets the namespace: the
                  ControlPlane lives on the management cluster, in a namespace the order's
                  own namespace does not name.

                  Both halves are frozen after creation. Re-pointing a live order would
                  strand the Keystone user it created on the old plane. Delete and re-create
                  the order to move it. The namespace rule spells the field __namespace__,
                  the escape Kubernetes CEL requires for a property named after a CEL
                  reserved word.
                properties:
                  name:
                    description: Name is the referenced ControlPlane CR's name.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the referenced ControlPlane CR's namespace. Empty (the
                      default) means the KeystoneService's own namespace. The referenced
                      ControlPlane does not have to exist at admission time (GitOps ordering:
                      the registration may be applied before the ControlPlane); a dangling
                      reference surfaces as a status condition, not an admission error.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: controlPlaneRef.name is immutable; delete and re-create
                    the KeystoneUser to move it to another ControlPlane
                  rule: self.name == oldSelf.name
                - message: controlPlaneRef.namespace is immutable; delete and re-create
                    the KeystoneUser to move it to another ControlPlane
                  rule: '(has(self.__namespace__) ? self.__namespace__ : '''') ==
                    (has(oldSelf.__namespace__) ? oldSelf.__namespace__ : '''')'
              passwordGeneration:
                default: 1
                description: |-
                  PasswordGeneration is the generation of the user's password. Raising it
                  rotates the password: the operator generates a new one, Keystone applies
                  it, and the delivered Secret is rewritten. It may only increase.
                format: int64
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: passwordGeneration may only increase
                  rule: self >= oldSelf
              userName:
                description: |-
                  UserName is the Keystone user name. Empty (the default) means the order's
                  metadata.name. The pattern and caps mirror K-ORC's OpenStackName.

                  The effective name is frozen after creation by a rule on the whole object,
                  so setting userName to a value other than metadata.name later is rejected
                  as well. The name identifies a live Keystone user, and an edit would create
                  a second one.
                maxLength: 255
                minLength: 1
                pattern: ^[^,]+$
                type: string
            required:
            - controlPlaneRef
            type: object
