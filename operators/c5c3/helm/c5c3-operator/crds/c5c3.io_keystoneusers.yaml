                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              secretName:
                description: |-
                  SecretName is the name of the delivered Secret in the order's namespace,
                  <metadata.name>-credentials.
                type: string
              userID:
                description: UserID is the Keystone user id. Empty until the user
                  is provisioned.
                maxLength: 1024
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 63 bytes; it is carried as a label
