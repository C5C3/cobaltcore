# Values schema validation unit tests for the c5c3-operator chart.
# The shared schema is pinned by the operator-library testbed suite; this suite
# proves the chart ships an enforced schema and covers what the chart adds.
suite: Values Schema Validation
templates:
  - templates/deployment.yaml
tests:
  # ---------------------------------------------------------------------------
  # additionalProperties: false
  # ---------------------------------------------------------------------------
  - it: should reject unknown top-level property
    set:
      unknownField: true
    asserts:
      - failedTemplate:
          errorPattern: "additional properties.*not allowed"

  # ---------------------------------------------------------------------------
  # barbicanOperator schema constraints
  # ---------------------------------------------------------------------------
  - it: should reject non-string barbicanOperator.namespace
    set:
      barbicanOperator:
        namespace: 42
    asserts:
      - failedTemplate:
          errorPattern: "/barbicanOperator/namespace.*got number, want string"

  - it: should reject unknown property in barbicanOperator
    set:
      barbicanOperator:
        account: barbican-operator
    asserts:
      - failedTemplate:
          errorPattern: "/barbicanOperator.*additional properties.*not allowed"

  - it: should accept a valid barbicanOperator override
    set:
      barbicanOperator:
        namespace: openstack
        serviceAccount: barbican-controller-manager
    asserts:
      - isKind:
          of: Deployment
