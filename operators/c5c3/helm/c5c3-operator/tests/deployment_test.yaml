# Deployment unit tests for the c5c3-operator chart.
# The shared Deployment skeleton is pinned by the operator-library testbed
# suite; this suite pins the chart's image default and what the chart adds.
suite: Deployment
templates:
  - templates/deployment.yaml
tests:
  - it: should set container image from Chart.AppVersion when tag is empty
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/c5c3/c5c3-operator:0.1.0"

  - it: should append image digest when image.digest is set
    set:
      image:
        digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/c5c3/c5c3-operator:0.1.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  - it: should combine explicit tag with digest
    set:
      image:
        tag: latest
        digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/c5c3/c5c3-operator:latest@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  # barbican-operator identity and openbao-operator namespace environment tests.
  - it: should render the barbican-operator identity and openbao-operator namespace env from the defaults
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: BARBICAN_OPERATOR_NAMESPACE
              value: barbican-system
            - name: BARBICAN_OPERATOR_SERVICE_ACCOUNT
              value: barbican-operator
            - name: OPENBAO_OPERATOR_NAMESPACE
              value: openbao-operator-system

  - it: should render an overridden barbican-operator identity
    set:
      barbicanOperator:
        namespace: openstack
        serviceAccount: barbican-controller-manager
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BARBICAN_OPERATOR_NAMESPACE
            value: openstack
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BARBICAN_OPERATOR_SERVICE_ACCOUNT
            value: barbican-controller-manager

  - it: should render an overridden openbao-operator namespace
    set:
      openbaoOperator:
        namespace: bao-system
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENBAO_OPERATOR_NAMESPACE
            value: bao-system

  # Each env entry is gated on its whole key (barbicanOperator,
  # openbaoOperator) so the sibling operator charts, which never set them, keep
  # rendering an env-less container. Nulling both here reproduces that render.
  - it: should render no env block when barbicanOperator and openbaoOperator are unset
    set:
      barbicanOperator: null
      openbaoOperator: null
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env
