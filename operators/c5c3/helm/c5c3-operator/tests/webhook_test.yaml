# Webhook configuration unit tests.
# The ControlPlane CR lives in group c5c3.io (DECISION plan #1). The
# validating webhook intercepts only CREATE/UPDATE — DELETE is deliberately not
# registered so a down operator (which serves the webhook in-process with
# failurePolicy=Fail) can never block CR or namespace deletion.
suite: Webhook Configuration
templates:
  - templates/webhook-configuration.yaml
tests:
  - it: should render MutatingWebhookConfiguration when webhook is enabled
    documentIndex: 0
    asserts:
      - isKind:
          of: MutatingWebhookConfiguration
      - matchRegex:
          path: metadata.name
          pattern: -mutating$
      - equal:
          path: webhooks[0].name
          value: mcontrolplane.kb.io
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /mutate-c5c3-io-v1alpha1-controlplane
      - equal:
          path: webhooks[0].admissionReviewVersions
          value:
            - v1
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].sideEffects
          value: None
      - equal:
          path: webhooks[0].rules[0].apiGroups
          value:
            - c5c3.io
      - equal:
          path: webhooks[0].rules[0].resources
          value:
            - controlplanes

  - it: should render ValidatingWebhookConfiguration when webhook is enabled
    documentIndex: 1
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - matchRegex:
          path: metadata.name
          pattern: -validating$
      - equal:
          path: webhooks[0].name
          value: vcontrolplane.kb.io
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /validate-c5c3-io-v1alpha1-controlplane
      - equal:
          path: webhooks[0].admissionReviewVersions
          value:
            - v1
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].sideEffects
          value: None
      - equal:
          path: webhooks[0].rules[0].apiGroups
          value:
            - c5c3.io
      - equal:
          path: webhooks[0].rules[0].resources
          value:
            - controlplanes
      - contains:
          path: webhooks[0].rules[0].operations
          content: CREATE
      - contains:
          path: webhooks[0].rules[0].operations
          content: UPDATE
      # DELETE must NOT be intercepted: with failurePolicy=Fail a down operator
      # would otherwise block CR and namespace deletion.
      - notContains:
          path: webhooks[0].rules[0].operations
          content: DELETE

  - it: should set cert-manager CA injection annotation on the MutatingWebhookConfiguration
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/RELEASE-NAME-c5c3-operator-webhook

  - it: should set cert-manager CA injection annotation on the ValidatingWebhookConfiguration
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/RELEASE-NAME-c5c3-operator-webhook

  # The KeystoneService entries ride the shared template's additionalWebhooks
  # list, so they land at index 1 of BOTH configurations. The entry declares no
  # apiGroup of its own, so asserting it here pins the inheritance from the
  # base dict.
  - it: should carry the KeystoneService mutating webhook as second entry
    documentIndex: 0
    asserts:
      - equal:
          path: webhooks[1].name
          value: mkeystoneservice.kb.io
      - equal:
          path: webhooks[1].clientConfig.service.path
          value: /mutate-c5c3-io-v1alpha1-keystoneservice
      - equal:
          path: webhooks[1].rules[0].apiGroups
          value:
            - c5c3.io
      - equal:
          path: webhooks[1].rules[0].resources
          value:
            - keystoneservices
      - equal:
          path: webhooks[1].failurePolicy
          value: Fail
      - equal:
          path: webhooks[1].sideEffects
          value: None

  - it: should carry the KeystoneService validating webhook as second entry
    documentIndex: 1
    asserts:
      - equal:
          path: webhooks[1].name
          value: vkeystoneservice.kb.io
      - equal:
          path: webhooks[1].clientConfig.service.path
          value: /validate-c5c3-io-v1alpha1-keystoneservice
      - equal:
          path: webhooks[1].rules[0].apiGroups
          value:
            - c5c3.io
      - equal:
          path: webhooks[1].rules[0].resources
          value:
            - keystoneservices
      - contains:
          path: webhooks[1].rules[0].operations
          content: CREATE
      - contains:
          path: webhooks[1].rules[0].operations
          content: UPDATE
      # DELETE must NOT be intercepted on the KeystoneService entry either.
      - notContains:
          path: webhooks[1].rules[0].operations
          content: DELETE

  - it: should not render any documents when webhook is disabled
    set:
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
