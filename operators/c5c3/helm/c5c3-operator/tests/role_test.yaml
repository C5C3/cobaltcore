# The namespace-scoped Role is not rendered by this chart: the ControlPlane
# controller watches cluster-scoped Namespaces, SizingProfiles and
# ClusterSecretStores and creates ClusterRoleBindings. A Role accepts rules
# naming them while granting nothing for them, so the operator would deploy and
# then die on its cache-sync timeout. The rules themselves are pinned by
# clusterrole_test.yaml, which covers the one scope this chart supports.
suite: Role
templates:
  - templates/role.yaml
tests:
  - it: should fail when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - failedTemplate:
          errorPattern: cluster-scoped Namespaces

  - it: should fail when rbac.namespaceScoped is true and webhook.enabled is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: webhook/enabled

  - it: should render nothing when rbac.namespaceScoped is false
    asserts:
      - hasDocuments:
          count: 0
