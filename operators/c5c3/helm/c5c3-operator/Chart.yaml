apiVersion: v2
name: c5c3-operator
description: A Helm chart for deploying the c5c3 ControlPlane operator
type: application
version: 0.21.0
appVersion: "0.1.0"
# The shared naming/label helpers and the Deployment skeleton live in the
# operator-library library chart so they are defined once for both operator
# charts. It is vendored into charts/ at package time (helm dependency build).
dependencies:
  - name: operator-library
    version: 0.12.0
    repository: "file://../../../shared/helm/operator-library"
# Helm validates values against values.schema.json automatically.
annotations:
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: added
      description: "services.glance.quotas enforces per-project Glance image quotas through Keystone unified limits. Upgrade K-ORC (apply deploy/flux-system again) to commit fdf2df5ce62c or later before setting it: an older K-ORC rejects the system-scoped RoleAssignment, and the Glance registration then holds at AccountReady=False/ServiceAccountError. The glance-operator chart of the same release is required too, since it serves spec.keystoneLimits"
    - kind: changed
      description: "services.glance.extraConfig and globalExtraConfig refuse [DEFAULT] use_keystone_limits and the [oslo_limit] credential, scope and endpoint keys while services.glance is set. A ControlPlane that already carries one of them keeps it with an admission warning, but a new or changed value is refused, and so is a kept one once the update sets services.glance.quotas. Move hand-configured unified limits to services.glance.quotas and remove the keys in the same update"
    - kind: added
      description: RBAC for get, list, watch, create, patch and delete on the K-ORC registeredlimits and patch on registeredlimits/status, for the RegisteredLimit children a KeystoneService's catalog.registeredLimits projects
    - kind: added
      description: "KeystoneService spec.catalog.registeredLimits (Keystone registered limits on the service row, in the ControlPlane's region) and spec.account.systemRoles (roles on the system scope, honored only in the ControlPlane's own namespaces)"
    - kind: added
      description: extraVolumes and extraVolumeMounts append volumes and manager volume mounts (operator-library 0.12.0)
    - kind: added
      description: openbaoOperator.namespace (default openbao-operator-system), rendered as the OPENBAO_OPERATOR_NAMESPACE environment variable, names the namespace the openbao-operator runs in
    - kind: changed
      description: "A dedicated Barbican store on the management cluster is admitted by an OpenBaoTenant in the openbao-operator namespace, under the guardrail spec: a quota of 100 pods, 20 CPU and 64Gi of requests and no limits.*, and a LimitRange that sets only a 100m/128Mi default request. The ClusterRole regains patch on openbaotenants for that tenant's Server-Side Apply. A namespace an earlier version admitted keeps its tenant. A downgrade leaves the new tenant behind in the openbaoOperator.namespace namespace (default openbao-operator-system); remove it with kubectl delete openbaotenant -n <openbaoOperator.namespace> -l c5c3.io/controlplane-name=<cp>,c5c3.io/controlplane-namespace=<ns>"
    - kind: changed
      description: The ClusterRole drops every verb that neither the RBAC usage audit of the e2e suites nor a call site in the operator claims (docs/reference/testing/rbac-usage-audit.md), and the leader-election rule grants get, create and update on leases only
    - kind: removed
      description: "RBAC for get and patch on the orc-controller-manager Deployment; K-ORC at commit da276e44 or later refreshes its own service catalog, so the operator no longer restarts it. Upgrade K-ORC (apply deploy/flux-system again) before or together with this chart; an older K-ORC misses a service registered after its first login for up to half a token lifetime and needs kubectl rollout restart deployment/orc-controller-manager -n orc-system"
    - kind: added
      description: "webhook.standalone runs the release as a standalone admission webhook for namespace-scoped installs: --enable-controllers=false, no leader election, a ClusterRole reduced to the webhook reads (operator-library 0.11.0)"
    - kind: added
      description: controller.defaultImagePullPolicy is accepted for parity with the service operator charts and not consumed, because the operator renders no container (operator-library 0.10.0)
    - kind: added
      description: pullPolicy on every image reference of the ControlPlane CRD (services.<service>.image, federationProxyImage), projected into the service CRs
    - kind: added
      description: spec.imagePullPolicy on the ControlPlane, projected into the image pullPolicy of every service CR it creates unless an image override names its own
    - kind: added
      description: RBAC for get and patch on the orc-controller-manager Deployment (resourceNames-scoped), so the operator can restart K-ORC when a ControlPlane's service catalog changes
    - kind: added
      description: nodeSelector, tolerations and priorityClassName values place and prioritize the operator pods (operator-library 0.9.0)
    - kind: added
      description: RBAC for patch on the K-ORC status subresources, so the reconcilers can clear a latched transport error from a child's Progressing condition
    - kind: added
      description: RBAC for K-ORC regions (openstack.k-orc.cloud/regions) for the bootstrap Region the ControlPlane adopts
    - kind: changed
      description: Shared NetworkPolicy, ClusterRole and Role templates moved into the operator-library chart (0.8.0); chart-specific behaviour goes through the operator-library.chart.* hooks
    - kind: changed
      description: RBAC rules are generated from the operator's kubebuilder markers (templates/_rbac-rules.tpl, make sync-helm-rbac) instead of being maintained by hand; rules with identical verbs are merged as controller-gen emits them
    - kind: added
      description: extraArgs and extraEnv values append verbatim manager arguments and environment variables
    - kind: removed
      description: ControlPlane CRD fields spec.korc.serviceAccounts, spec.services.keystone.external.catalog.managedEntries and status.serviceAccounts; declare service accounts and catalog entries with a KeystoneService CR instead
    - kind: added
      description: barbicanOperator value names the namespace and ServiceAccount of the barbican-operator, rendered as BARBICAN_OPERATOR_NAMESPACE and BARBICAN_OPERATOR_SERVICE_ACCOUNT on the manager container
    - kind: added
      description: RBAC for the projected Barbican child and its BarbicanSecretStore, the dedicated OpenBao instance (openbao.org), and the Role/RoleBinding plus TokenRequest grant that instance needs
    - kind: added
      description: RBAC for K-ORC projects (openstack.k-orc.cloud/projects) for the KeystoneService registrations (the projected built-in children and standalone CRs)
    - kind: added
      description: Optional image.digest value pins the operator image by immutable digest (rendered as repository:tag@digest)
    - kind: added
      description: RBAC for the projected Horizon child (services.horizon on the ControlPlane CRD)
    - kind: changed
      description: Shared manifests (certificate, service, serviceaccount, rolebindings, PDB, ServiceMonitor, webhook configurations) moved into the operator-library chart
    - kind: added
      description: Initial c5c3 ControlPlane operator chart
    - kind: added
      description: Expose operator log level, encoder, and development mode as chart values
    - kind: added
      description: PodDisruptionBudget (minAvailable 1, replicas > 1) and best-effort node spread for the operator Deployment
    - kind: changed
      description: Validating webhook no longer intercepts DELETE, so a down operator cannot block CR or namespace deletion
    - kind: added
      description: RBAC for the dynamic per-tenant MariaDB DB-credential engine (generators.external-secrets.io/vaultdynamicsecrets, cert-manager.io/certificates, core/serviceaccounts)
    - kind: changed
      description: Namespace-scoped installs clear --clusters-namespace, so the operator engages no target cluster and reads no Secret outside its release namespace
