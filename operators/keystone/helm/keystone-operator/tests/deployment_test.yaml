# Deployment unit tests for the keystone-operator chart.
# The shared Deployment skeleton is pinned by the operator-library testbed
# suite; this suite pins the chart's image default and what the chart adds.
suite: Deployment
templates:
  - templates/deployment.yaml
tests:
  - it: should set container image from Chart.AppVersion when tag is empty
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/c5c3/keystone-operator:0.1.0"

  - it: should append image digest when image.digest is set
    set:
      image:
        digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/c5c3/keystone-operator:0.1.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  - it: should combine explicit tag with digest
    set:
      image:
        tag: latest
        digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/c5c3/keystone-operator:latest@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  # Federation metadata allowlist (--federation-metadata-allow-cidrs) tests.
  - it: should render --federation-metadata-allow-cidrs from federation.metadataAllowCidrs
    set:
      federation:
        metadataAllowCidrs:
          - "10.96.0.0/12"
          - "fd00::/108"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --federation-metadata-allow-cidrs=10.96.0.0/12,fd00::/108

  - it: should omit --federation-metadata-allow-cidrs when the list is empty
    set:
      federation:
        metadataAllowCidrs: []
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --leader-elect
            - --max-concurrent-reconciles=2
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
