# Values schema validation unit tests for the keystone-operator chart.
# The shared schema is pinned by the operator-library testbed suite; this suite
# proves the chart ships an enforced schema and covers what the chart adds.
suite: Values Schema Validation
templates:
  - templates/deployment.yaml
tests:
  # ---------------------------------------------------------------------------
  # additionalProperties: false
  # ---------------------------------------------------------------------------
  - it: should reject unknown top-level property
    set:
      unknownField: true
    asserts:
      - failedTemplate:
          errorPattern: "additional properties.*not allowed"

  # ---------------------------------------------------------------------------
  # federation schema constraints
  # ---------------------------------------------------------------------------
  - it: should reject non-array federation.metadataAllowCidrs
    set:
      federation:
        metadataAllowCidrs: "10.0.0.0/8"
    asserts:
      - failedTemplate:
          errorPattern: "/federation/metadataAllowCidrs.*got string, want array"

  - it: should reject invalid CIDR in federation.metadataAllowCidrs
    set:
      federation:
        metadataAllowCidrs:
          - "999.0.0.1/32"
    asserts:
      - failedTemplate:
          errorPattern: "/federation/metadataAllowCidrs.*does not match pattern"

  - it: should accept a valid federation.metadataAllowCidrs list
    set:
      federation:
        metadataAllowCidrs:
          - "10.96.0.0/12"
          - "fd00::/108"
    asserts:
      - isKind:
          of: Deployment
