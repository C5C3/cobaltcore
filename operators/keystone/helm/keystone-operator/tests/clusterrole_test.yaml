# ClusterRole unit tests.
#
# The rules come from templates/_rbac-rules.tpl, generated from the operator's
# +kubebuilder:rbac markers (make sync-helm-rbac); the rule shape follows
# controller-gen (resources with identical verbs merged, verbs sorted). This
# suite pins the rendering, the wiring of the generated rules into the
# ClusterRole, and the grants whose restriction is deliberate; it does not
# re-assert every generated rule.
suite: ClusterRole
templates:
  - templates/clusterrole.yaml
tests:
  - it: should grant full CRUD on keystones
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - keystone.openstack.c5c3.io
            resources:
              - keystones
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant read and update (no create/delete) on keystoneidentitybackends
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - keystone.openstack.c5c3.io
            resources:
              - keystoneidentitybackends
            verbs:
              - get
              - list
              - update
              - watch

  - it: should restrict events to create and patch only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - events
            verbs:
              - create
              - patch

  - it: should grant read-only on pods for policy validation error extraction
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - pods
            verbs:
              - get
              - list

  - it: should grant read-only on mariadb cluster CRs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - k8s.mariadb.com
            resources:
              - mariadbs
            verbs:
              - get
              - list
              - watch

  - it: should grant CRUD without delete on externalsecrets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - externalsecrets
            verbs:
              - create
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant read-only on clustersecretstores and secretstores
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - clustersecretstores
              - secretstores
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only on httproutes/status
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes/status
            verbs:
              - get

  - it: should grant read-only on priorityclasses for webhook validation
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - scheduling.k8s.io
            resources:
              - priorityclasses
            verbs:
              - get
              - list
              - watch

  - it: should grant full CRUD on leases for leader election
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # ClusterRole must not render in namespace-scoped mode.
  - it: should not render ClusterRole when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
