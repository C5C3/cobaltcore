# ClusterRole unit tests.
#
# The rules come from templates/_rbac-rules.tpl, generated from the operator's
# +kubebuilder:rbac markers (make sync-helm-rbac); the rule shape follows
# controller-gen (resources with identical verbs merged, verbs sorted). This
# suite pins the rendering, the wiring of the generated rules into the
# ClusterRole, and the grants whose restriction is deliberate; it does not
# re-assert every generated rule.
suite: ClusterRole
templates:
  - templates/clusterrole.yaml
tests:
  - it: should grant full CRUD on the Neutron CRs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - neutron.openstack.c5c3.io
            resources:
              - neutronmetadataagents
              - neutrons
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant get/update/patch on the Neutron status subresource
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - neutron.openstack.c5c3.io
            resources:
              - neutronmetadataagents/status
              - neutrons/status
            verbs:
              - get
              - patch
              - update

  - it: should grant update on the Neutron finalizers subresource
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - neutron.openstack.c5c3.io
            resources:
              - neutronmetadataagents/finalizers
              - neutrons/finalizers
            verbs:
              - update

  # Both OVN kinds belong to ovn-operator. This operator reads the OVNCentral
  # for the connection strings and the OVNChassis a metadata agent runs beside.
  - it: should grant read-only on the OVN CRs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals
              - ovnchassis
            verbs:
              - get
              - list
              - watch

  - it: should not grant write verbs on the OVN CRs
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals
              - ovnchassis
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch
      - notContains:
          path: rules
          content:
            apiGroups:
              - ovn.openstack.c5c3.io
            resources:
              - ovncentrals
              - ovnchassis
            verbs:
              - get
              - list
              - patch
              - update
              - watch

  - it: should restrict events to create and patch only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - events
            verbs:
              - create
              - patch

  # No controller in this binary mints a bound ServiceAccount token, and a
  # cluster-wide grant would let anyone reaching the operator ServiceAccount
  # act as any ServiceAccount in scope. This is the barbican piece the chart
  # deliberately drops.
  - it: should not grant serviceaccounts/token cluster-wide
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - serviceaccounts/token
            verbs:
              - create

  # No code path lists pods or reaches a Service through the API server proxy,
  # so neither grant is in the marker block and neither may appear here.
  - it: should not grant pods or services/proxy
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - pods
            verbs:
              - get
              - list
      - notContains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - services/proxy
            verbs:
              - get

  - it: should not narrow the workload rule to deployments alone
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - deployments
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant read-only on mariadbs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - k8s.mariadb.com
            resources:
              - mariadbs
            verbs:
              - get
              - list
              - watch

  # Managed messaging derives the transport URL from the named RabbitmqCluster,
  # which the operator reads and never writes.
  - it: should grant read-only on rabbitmqclusters
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - rabbitmq.com
            resources:
              - rabbitmqclusters
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only on externalsecrets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - clustersecretstores
              - externalsecrets
              - secretstores
            verbs:
              - get
              - list
              - watch

  # The Accepted condition is written by the upstream Gateway controller, so
  # get is all the operator needs on the status subresource.
  - it: should grant get on the httproutes status subresource
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes/status
            verbs:
              - get

  # The webhook resolves spec.priorityClassName at admission time.
  - it: should grant read-only on priorityclasses
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - scheduling.k8s.io
            resources:
              - priorityclasses
            verbs:
              - get
              - list
              - watch

  - it: should grant full CRUD on leases for leader election
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # ClusterRole must not render in namespace-scoped mode.
  - it: should not render ClusterRole when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
