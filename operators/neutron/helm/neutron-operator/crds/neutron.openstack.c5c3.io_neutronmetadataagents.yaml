    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NeutronMetadataAgent is the Schema for the neutronmetadataagents API. It puts
          the OVN metadata agent onto the nodes an OVNChassis already runs on: one
          DaemonSet whose pods share the chassis's local OVS database and answer the
          169.254.169.254 requests the instances on that node make.

          The agent is a separate kind from Neutron because it belongs in the chassis's
          namespace. Those pods are privileged and run on the compute and network nodes,
          which is not where the Neutron API Deployment belongs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NeutronMetadataAgentSpec defines the desired state of NeutronMetadataAgent.

              The targetClusterRef transition rules (evaluated only on UPDATE) freeze the
              ref, and the chassisRef rule freezes the chassis the agent runs alongside.
              Both are enforced at the schema layer so the guarantee holds even when the
              validating webhook is down: an agent re-pointed at another chassis lands on
              another set of nodes, where the local OVS databases carry none of the ports it
              was answering for.
            properties:
              chassisRef:
                description: |-
                  ChassisRef names the OVNChassis this agent runs alongside. The agent reads
                  the chassis's local OVS database over the socket the chassis pods share, so
                  the two land on the same nodes and in the same namespace.
                properties:
                  name:
                    description: Name is the OVNChassis's name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              extraConfig:
                additionalProperties:
                  additionalProperties:
                    type: string
                  type: object
                description: |-
                  ExtraConfig provides free-form INI sections for
                  neutron_ovn_metadata_agent.ini configuration not covered by explicit CRD
                  fields.

                  The option names are validated against the flat union catalog of
                  neutron.conf, ml2_conf.ini and neutron_ovn_metadata_agent.ini, which carries
                  no per-file provenance. A section that belongs to the API process therefore
                  passes validation, and oslo.config ignores it at runtime.
                type: object
              image:
                description: |-
                  Image defines the Neutron container image the agent runs from. It is
                  required: the agent is deployed next to an OVNChassis whose image this
                  operator does not resolve, so there is no tested pairing to fall back on.
                properties:
                  digest:
                    description: |-
                      Digest pins the image by immutable content digest (e.g.
                      "sha256:<64 hex chars>"). Optional: exactly one of Tag or Digest must be
                      set. A pinned digest closes the supply-chain gap where a mutable tag can be
                      re-pushed behind a stable name, at the cost of disabling release tracking.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  repository:
                    description: |-
                      Repository is the OCI image repository, optionally including the registry
                      host (e.g. "ghcr.io/c5c3/<service>" or "c5c3/<service>"). The pattern is a
                      permissive OCI reference — lowercase alphanumeric components separated by
                      ".", "_", "-", "/", or ":" (registry port) — so mirror and host:port forms
                      are accepted while an empty string (which "required" alone admits) and
                      obvious garbage are rejected.
                    minLength: 1
                    pattern: ^[a-z0-9]+([._:/-][a-z0-9]+)*$
                    type: string
                  tag:
                    description: |-
                      Tag is the OCI image tag (e.g. "2025.2"). It follows the OCI tag grammar:
                      up to 128 characters of word characters, dots, and dashes, and must not
                      begin with a dot or dash. Optional: exactly one of Tag or Digest must be
                      set. The pattern is enforced only when a tag is present.
                    pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$
                    type: string
                required:
                - repository
                type: object
                x-kubernetes-validations:
                - message: exactly one of image.tag or image.digest must be set
                  rule: has(self.tag) != has(self.digest)
              logging:
                description: |-
                  Logging configures oslo.log output for the agent container. When unset, the
                  defaulting webhook materializes a LoggingSpec with Format=text, Level=INFO,
                  Debug=false.
                properties:
                  debug:
                    description: |-
                      Debug toggles oslo.log [DEFAULT] debug=true. Independent of Level
                      because oslo.log gates several extra-verbose code paths on the
                      debug flag specifically (SQL echo, auth-backend tracing). It is a
                      nil-preserving pointer so "unset" is representable: the defaulting webhook
                      restores the documented default (false) when the pointer is nil, and the
                      reconciler falls back to the same default for CRs that bypass the webhook.
                    type: boolean
                  format:
                    default: text
                    description: |-
                      Format selects the on-wire layout of oslo.log records.
                      "text" emits the standard oslo.log line format; "json" emits one
                      JSON object per record for direct ingest by Loki/OpenSearch.
                    enum:
                    - text
                    - json
                    type: string
                  level:
                    default: INFO
                    description: Level is the root logger level applied to oslo.log.
                    enum:
                    - DEBUG
                    - INFO
                    - WARNING
                    - ERROR
                    - CRITICAL
                    type: string
                  perLoggerLevels:
                    additionalProperties:
                      type: string
                    description: |-
                      PerLoggerLevels overrides the level of named loggers, mirroring
                      oslo.log's `default_log_levels`. Example:
                      {"sqlalchemy.engine": "WARNING", "myservice.middleware": "DEBUG"}.
                      Each value must be one of DEBUG/INFO/WARNING/ERROR/CRITICAL and every
                      logger name must be non-empty. These are now enforced by the CRD CEL
                      XValidation rules below as well as by the validating webhook (a plain
                      enum on additionalProperties is still not expressible in CRD v1, so the
                      value constraint is written as an `in [...]` CEL rule rather than an enum).
                    type: object
                    x-kubernetes-validations:
                    - message: logger name must not be empty
                      rule: self.all(k, k != '')
                    - message: per-logger level must be one of DEBUG, INFO, WARNING,
                        ERROR, CRITICAL
                      rule: self.all(k, self[k] in ['DEBUG','INFO','WARNING','ERROR','CRITICAL'])
                type: object
              messaging:
                description: |-
                  Messaging optionally defines the RabbitMQ connection the agent uses. The OVN
                  metadata agent opens no RPC and no notification connection of its own: it
                  reads what it needs out of the Southbound database. It is offered because
                  n_rpc.init, which config.init calls unconditionally, parses oslo.messaging's
                  default rabbit:// transport URL without dialing it, so a deployment that
                  wants the agent to carry the same bus configuration as the API can say so.
                  When set, the agent gets the same transport-URL env override the API pods
                  get.
                properties:
                  clusterRef:
                    description: ClusterRef references a RabbitmqCluster CR in the
                      cluster (managed mode).
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  replicas:
                    default: 3
                    description: |-
                      Replicas is the number of RabbitMQ pods in the referenced cluster (managed
                      mode). It mirrors CacheSpec.Replicas: only the managed-mode projection
                      honours it, so a constrained cluster such as a single-node kind can pin a
                      single pod. Ignored in brownfield mode.
                    format: int32
                    minimum: 1
                    type: integer
                  secretRef:
                    description: |-
                      SecretRef references the K8s Secret holding the complete rabbit:// transport
                      URL under Key (brownfield mode). The defaulting webhooks materialize an
                      empty Key to DefaultTransportURLSecretKey.
                    properties:
                      key:
                        type: string
                      name:
                        description: |-
                          Name is the referenced Secret's name. It must be a non-empty DNS-1123
                          subdomain (the Kubernetes object-name grammar). Tightening the shared type
                          fixes every consumer at once — a service operator adminPasswordSecretRef /
                          database.secretRef / messaging / TLS cert refs and the c5c3
                          passwordSecretRef — so an empty name no longer slips through "required".
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  tls:
                    description: |-
                      TLS configures the client trust for the broker connection. The pointer keeps
                      the field opt-in: a nil TLS means a plaintext connection.
                    properties:
                      caBundleSecretRef:
                        description: |-
                          CABundleSecretRef references the K8s Secret holding the CA bundle the
                          consumer trusts when verifying the broker endpoint. The defaulting webhooks
                          materialize an empty Key to "ca.crt".
                        properties:
                          key:
                            type: string
                          name:
                            description: |-
                              Name is the referenced Secret's name. It must be a non-empty DNS-1123
                              subdomain (the Kubernetes object-name grammar). Tightening the shared type
                              fixes every consumer at once — a service operator adminPasswordSecretRef /
                              database.secretRef / messaging / TLS cert refs and the c5c3
                              passwordSecretRef — so an empty name no longer slips through "required".
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - caBundleSecretRef
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of clusterRef or secretRef must be set
                  rule: has(self.clusterRef) != has(self.secretRef)
              novaMetadata:
                description: |-
                  NovaMetadata points the agent at the Nova metadata API it proxies to. Nova
                  is not onboarded onto this operator, so a nil block renders nothing and the
                  oslo defaults apply.
                properties:
                  host:
                    description: |-
                      Host is the address of the Nova metadata API. When empty the oslo default
                      applies.
                    type: string
                  port:
                    description: |-
                      Port is the port the Nova metadata API listens on. The defaulting webhook
                      fills it with 8775, nova-api-metadata's own default, when the block is set
                      and the port is zero.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  sharedSecretRef:
                    description: |-
                      SharedSecretRef references the Secret holding the secret the agent signs
                      forwarded requests with. Nova rejects an unsigned request when it is
                      configured with a secret of its own, so the two values have to match. The
                      key is webhook-defaulted to "shared_secret".
                    properties:
                      key:
                        type: string
                      name:
                        description: |-
                          Name is the referenced Secret's name. It must be a non-empty DNS-1123
                          subdomain (the Kubernetes object-name grammar). Tightening the shared type
                          fixes every consumer at once — a service operator adminPasswordSecretRef /
                          database.secretRef / messaging / TLS cert refs and the c5c3
                          passwordSecretRef — so an empty name no longer slips through "required".
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                type: object
              openStackRelease:
                description: |-
                  OpenStackRelease names the OpenStack release this agent runs. It selects the
                  option catalog spec.extraConfig is validated against.

                  The pattern matches the OpenStack date-based release scheme (YYYY.N where N
                  is 1 or 2, the two-releases-per-year cadence, e.g. 2025.2, 2026.1). The
                  [12] minor class keeps this CRD pattern, the validating webhook, and
                  release.ParseRelease in agreement so a non-cadence minor (e.g. 2025.9) is
                  rejected at every layer.
                pattern: ^\d{4}\.[12]$
                type: string
              resources:
                description: |-
                  Resources defines the CPU and memory requests and limits for the agent
                  container. When empty the operator applies the shared container defaults,
                  the ones a defaulted DeploymentSpec carries.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              targetClusterRef:
                description: |-
                  TargetClusterRef names the registered target cluster that receives this
                  agent's children. The CR itself stays on the management cluster, and so do
                  its status and its finalizers. When omitted, the children are created on the
                  local cluster. The field is immutable (see the transition rules on this
                  spec).
                properties:
                  name:
                    description: |-
                      Name is the registered target cluster's name. It must be a non-empty
                      DNS-1123 subdomain (the Kubernetes object-name grammar), matching
                      SecretStoreRefSpec.Name.
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
            required:
            - chassisRef
            - image
            - openStackRelease
            type: object
            x-kubernetes-validations:
            - message: targetClusterRef is immutable
              rule: has(self.targetClusterRef) == has(oldSelf.targetClusterRef)
            - message: targetClusterRef is immutable
              rule: '!has(self.targetClusterRef) || !has(oldSelf.targetClusterRef)
                || self.targetClusterRef.name == oldSelf.targetClusterRef.name'
            - message: chassisRef is immutable
              rule: self.chassisRef.name == oldSelf.chassisRef.name
          status:
            description: NeutronMetadataAgentStatus defines the observed state of
              NeutronMetadataAgent.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  NeutronMetadataAgent state. Each condition carries an ObservedGeneration so
                  consumers can tell a stale condition from one reflecting the current spec;
                  use the conditions helper (internal/common/conditions) to upsert them.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
