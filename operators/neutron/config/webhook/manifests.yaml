  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-neutron-openstack-c5c3-io-v1alpha1-neutronmetadataagent
  failurePolicy: Fail
  name: vneutronmetadataagent.kb.io
  rules:
  - apiGroups:
    - neutron.openstack.c5c3.io
