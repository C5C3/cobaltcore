# Webhook configuration unit tests.
#
# The operator serves admission for three kinds, so each configuration carries
# three entries: the Cinder base entry plus the two satellite kinds passed as
# additionalWebhooks.
suite: Webhook Configuration
templates:
  - templates/webhook-configuration.yaml
tests:
  - it: should render MutatingWebhookConfiguration when webhook is enabled
    documentIndex: 0
    asserts:
      - isKind:
          of: MutatingWebhookConfiguration
      - matchRegex:
          path: metadata.name
          pattern: -mutating$
      - equal:
          path: webhooks[0].name
          value: mcinder.kb.io
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /mutate-cinder-openstack-c5c3-io-v1alpha1-cinder
      - contains:
          path: webhooks[0].rules[0].resources
          content: cinders
      - equal:
          path: webhooks[0].admissionReviewVersions
          value:
            - v1
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].sideEffects
          value: None
      - lengthEqual:
          path: webhooks
          count: 3

  - it: should render ValidatingWebhookConfiguration when webhook is enabled
    documentIndex: 1
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - matchRegex:
          path: metadata.name
          pattern: -validating$
      - equal:
          path: webhooks[0].name
          value: vcinder.kb.io
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /validate-cinder-openstack-c5c3-io-v1alpha1-cinder
      - contains:
          path: webhooks[0].rules[0].resources
          content: cinders
      - equal:
          path: webhooks[0].admissionReviewVersions
          value:
            - v1
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - equal:
          path: webhooks[0].sideEffects
          value: None
      - contains:
          path: webhooks[0].rules[0].operations
          content: CREATE
      - contains:
          path: webhooks[0].rules[0].operations
          content: UPDATE
      # DELETE must NOT be intercepted: with failurePolicy=Fail a down operator
      # would otherwise block CR and namespace deletion.
      - notContains:
          path: webhooks[0].rules[0].operations
          content: DELETE
      - lengthEqual:
          path: webhooks
          count: 3

  - it: should set cert-manager CA injection annotation on both configs
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/RELEASE-NAME-cinder-operator-webhook

  - it: should set cert-manager CA injection annotation on validating config
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/RELEASE-NAME-cinder-operator-webhook

  - it: should carry the backend mutating webhook as second entry
    documentIndex: 0
    asserts:
      - equal:
          path: webhooks[1].name
          value: mcinderbackend.kb.io
      - equal:
          path: webhooks[1].clientConfig.service.path
          value: /mutate-cinder-openstack-c5c3-io-v1alpha1-cinderbackend
      - contains:
          path: webhooks[1].rules[0].resources
          content: cinderbackends
      - equal:
          path: webhooks[1].failurePolicy
          value: Fail

  - it: should carry the backend validating webhook as second entry
    documentIndex: 1
    asserts:
      - equal:
          path: webhooks[1].name
          value: vcinderbackend.kb.io
      - equal:
          path: webhooks[1].clientConfig.service.path
          value: /validate-cinder-openstack-c5c3-io-v1alpha1-cinderbackend
      - contains:
          path: webhooks[1].rules[0].resources
          content: cinderbackends
      # DELETE must NOT be intercepted on the backend entry either.
      - notContains:
          path: webhooks[1].rules[0].operations
          content: DELETE

  - it: should carry the backup-backend mutating webhook as third entry
    documentIndex: 0
    asserts:
      - equal:
          path: webhooks[2].name
          value: mcinderbackupbackend.kb.io
      - equal:
          path: webhooks[2].clientConfig.service.path
          value: /mutate-cinder-openstack-c5c3-io-v1alpha1-cinderbackupbackend
      - contains:
          path: webhooks[2].rules[0].resources
          content: cinderbackupbackends
      - equal:
          path: webhooks[2].failurePolicy
          value: Fail

  - it: should carry the backup-backend validating webhook as third entry
    documentIndex: 1
    asserts:
      - equal:
          path: webhooks[2].name
          value: vcinderbackupbackend.kb.io
      - equal:
          path: webhooks[2].clientConfig.service.path
          value: /validate-cinder-openstack-c5c3-io-v1alpha1-cinderbackupbackend
      - contains:
          path: webhooks[2].rules[0].resources
          content: cinderbackupbackends
      # DELETE must NOT be intercepted on the backup-backend entry either.
      - notContains:
          path: webhooks[2].rules[0].operations
          content: DELETE

  - it: should not render any documents when webhook is disabled
    set:
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
