  group: cinder.openstack.c5c3.io
  names:
    kind: CinderBackupBackend
    listKind: CinderBackupBackendList
    plural: cinderbackupbackends
    singular: cinderbackupbackend
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.cinderRef.name
