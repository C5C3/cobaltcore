  name: mnovacompute.kb.io
  rules:
  - apiGroups:
    - nova.openstack.c5c3.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - novacomputes
  sideEffects: None
