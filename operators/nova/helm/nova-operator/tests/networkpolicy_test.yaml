# NetworkPolicy unit tests for the nova-operator additions.
# The shared NetworkPolicy is pinned by the operator-library testbed suite;
# this suite covers the three egress rules the chart adds through the
# operator-library.chart.networkPolicyEgress hook: the Nova API health check,
# and the Keystone and Placement calls of the NovaCompute controller.
suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: should not render a NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the Nova, Keystone and Placement API egress rules after the shared rules
    set:
      networkPolicy:
        enabled: true
        kubeApiServer:
          cidrs: ["172.18.0.2/32"]
          ports: [6443]
    asserts:
      # DNS, kube-apiserver, then the Nova, Keystone and Placement API rules.
      - lengthEqual:
          path: spec.egress
          count: 5
      - equal:
          path: spec.egress[2]
          value:
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: nova
                    app.kubernetes.io/managed-by: nova-operator
            ports:
              - protocol: TCP
                port: 8774
      - equal:
          path: spec.egress[3]
          value:
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: keystone
                    app.kubernetes.io/managed-by: keystone-operator
            ports:
              - protocol: TCP
                port: 5000
              - protocol: TCP
                port: 5050
      - equal:
          path: spec.egress[4]
          value:
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: placement
                    app.kubernetes.io/managed-by: placement-operator
            ports:
              - protocol: TCP
                port: 8778

  - it: should keep the three API rules when DNS egress is disabled
    set:
      networkPolicy:
        enabled: true
        kubeApiServer:
          cidrs: ["172.18.0.2/32"]
          ports: [6443]
        dns:
          enabled: false
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 4
      - equal:
          path: spec.egress[1].ports
          value:
            - protocol: TCP
              port: 8774
      - equal:
          path: spec.egress[2].ports
          value:
            - protocol: TCP
              port: 5000
            - protocol: TCP
              port: 5050
      - equal:
          path: spec.egress[3].ports
          value:
            - protocol: TCP
              port: 8778

  - it: should still fail the render when kubeApiServer.cidrs is empty
    set:
      networkPolicy:
        enabled: true
        kubeApiServer:
          cidrs: []
          ports: [6443]
    asserts:
      - failedTemplate:
          errorPattern: "cidrs"
