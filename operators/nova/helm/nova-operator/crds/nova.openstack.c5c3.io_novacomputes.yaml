metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: novacomputes.nova.openstack.c5c3.io
spec:
  group: nova.openstack.c5c3.io
  names:
    kind: NovaCompute
    listKind: NovaComputeList
    plural: novacomputes
    singular: novacompute
  scope: Namespaced
