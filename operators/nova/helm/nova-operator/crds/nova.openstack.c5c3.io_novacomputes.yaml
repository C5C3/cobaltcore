    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NovaCompute is the Schema for the novacomputes API. It runs nova-compute on
          one node pool of a compute cluster: a DaemonSet on the nodes its nodeSelector
          matches, joined to the Nova the CR names through that Nova's compute
          contract.

          One NovaCompute covers one pool. Nodes with different libvirt settings get a
          second CR rather than a wider selector, because everything below the
          selector applies uniformly to every node it matches. Every pool of a Nova
          maps into that Nova's single cell.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NovaComputeSpec defines the desired state of NovaCompute.

              The targetClusterRef transition rules (evaluated only on UPDATE) freeze the
              ref, and the novaRef rule freezes the control plane the pool joins. Both are
              enforced at the schema layer, so the guarantee holds even when the validating
              webhook is down: a pool moved to another cluster or another Nova leaves its
              compute services registered where it was.
            properties:
              extraConfig:
                additionalProperties:
                  additionalProperties:
                    type: string
                  type: object
                description: |-
                  ExtraConfig provides free-form INI sections merged over the pool's
                  rendered config. It is the per-pool override surface. The keys the pods
                  take from their environment or their mounts are rejected at admission.
                type: object
              image:
                description: |-
                  Image is the nova-compute image. When nil the operator runs
                  ghcr.io/c5c3/nova-compute tagged with the referenced Nova's
                  status.installedRelease, so the pool follows the control plane once that
                  has upgraded and not before.
                properties:
                  digest:
                    description: |-
                      Digest pins the image by immutable content digest (e.g.
                      "sha256:<64 hex chars>"). Optional: exactly one of Tag or Digest must be
                      set. A pinned digest closes the supply-chain gap where a mutable tag can be
                      re-pushed behind a stable name, at the cost of disabling release tracking.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  repository:
                    description: |-
                      Repository is the OCI image repository, optionally including the registry
                      host (e.g. "ghcr.io/c5c3/<service>" or "c5c3/<service>"). The pattern is a
                      permissive OCI reference — lowercase alphanumeric components separated by
                      ".", "_", "-", "/", or ":" (registry port) — so mirror and host:port forms
                      are accepted while an empty string (which "required" alone admits) and
                      obvious garbage are rejected.
                    minLength: 1
                    pattern: ^[a-z0-9]+([._:/-][a-z0-9]+)*$
                    type: string
                  tag:
                    description: |-
                      Tag is the OCI image tag (e.g. "2025.2"). It follows the OCI tag grammar:
                      up to 128 characters of word characters, dots, and dashes, and must not
                      begin with a dot or dash. Optional: exactly one of Tag or Digest must be
                      set. The pattern is enforced only when a tag is present.
                    pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$
                    type: string
                required:
                - repository
                type: object
                x-kubernetes-validations:
                - message: exactly one of image.tag or image.digest must be set
                  rule: has(self.tag) != has(self.digest)
              libvirt:
                default: {}
                description: Libvirt carries the [libvirt] options the pool renders.
                properties:
                  cpuMode:
                    description: |-
                      CPUMode is [libvirt] cpu_mode. When empty the key is not rendered and
                      Nova's own default applies.
                    enum:
                    - host-model
                    - host-passthrough
                    - custom
                    - none
                    type: string
                  cpuModels:
                    description: |-
                      CPUModels is [libvirt] cpu_models, rendered comma-joined. It is required
                      with cpuMode custom and must be empty otherwise.
                    items:
                      pattern: ^[A-Za-z0-9_.-]+$
                      type: string
                    type: array
                  imagesType:
                    description: |-
                      ImagesType is [libvirt] images_type. When empty the key is not rendered.
                      The rbd, lvm and ploop backends are not offered: the compute image
                      carries neither a Ceph client nor lvm2.
                    enum:
                    - default
                    - qcow2
                    - raw
                    - flat
                    type: string
                  virtType:
                    default: kvm
                    description: |-
                      VirtType is [libvirt] virt_type. qemu runs guests without hardware
                      acceleration and is for nodes without KVM.
                    enum:
                    - kvm
                    - qemu
                    type: string
                type: object
                x-kubernetes-validations:
                - message: cpuModels is required when cpuMode is custom and must be
                    empty otherwise
                  rule: (has(self.cpuMode) && self.cpuMode == 'custom') == (has(self.cpuModels)
                    && size(self.cpuModels) > 0)
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector picks the nodes of the pool. It is required and must carry
                  at least one label: an empty selector matches every node in the cluster.
                  It may change, and a node that stops matching is drained before its pod
                  goes: it keeps nova-compute until Nova reports no instance on it.
                minProperties: 1
                type: object
              novaRef:
                description: |-
                  NovaRef names the Nova in the same namespace this pool joins. The pods
                  mount that Nova's compute contract, and the node services are registered
                  with its API. It is immutable.
                properties:
                  name:
                    description: Name is the Nova's name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              resources:
                description: |-
                  Resources defines the CPU and memory requests and limits of the
                  nova-compute container and of its wait-for-chassis init container. When
                  nil both carry none.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              targetClusterRef:
                description: |-
                  TargetClusterRef selects the registered target cluster the DaemonSet is
                  created on. When nil it is created on the cluster the operator runs in.
                  The ref is immutable once set.
                properties:
                  name:
                    description: |-
                      Name is the registered target cluster's name. It must be a non-empty
                      DNS-1123 subdomain (the Kubernetes object-name grammar), matching
                      SecretStoreRefSpec.Name.
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              tolerations:
                description: |-
                  Tolerations let the pods run on tainted nodes. The webhook rejects a
                  toleration of kvm.cloud.sap/offboarding:NoExecute without
                  tolerationSeconds: openstack-hypervisor-operator deletes a node's compute
                  service only once every agent pod on it is gone.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              updateStrategy:
                default: {}
                description: UpdateStrategy paces the DaemonSet rollout.
                properties:
                  maxUnavailable:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      MaxUnavailable is how many nodes may restart nova-compute at once. It
                      applies to RollingUpdate only; the validating webhook rejects it alongside
                      OnDelete. When nil the operator renders 1.
                    x-kubernetes-int-or-string: true
                  type:
                    default: RollingUpdate
                    description: |-
                      Type selects the rollout mode. OnDelete hands the pace to whoever drains
                      the nodes. Every change of the pool's node set rolls the pods under
                      RollingUpdate, so a pool that must not restart nova-compute during a
                      migration takes OnDelete.
                    enum:
                    - RollingUpdate
                    - OnDelete
                    type: string
                type: object
            required:
            - nodeSelector
            - novaRef
            type: object
            x-kubernetes-validations:
            - message: targetClusterRef is immutable
              rule: has(self.targetClusterRef) == has(oldSelf.targetClusterRef)
            - message: targetClusterRef is immutable
              rule: '!has(self.targetClusterRef) || !has(oldSelf.targetClusterRef)
                || self.targetClusterRef.name == oldSelf.targetClusterRef.name'
            - message: novaRef is immutable
              rule: self.novaRef.name == oldSelf.novaRef.name
          status:
            description: NovaComputeStatus defines the observed state of NovaCompute.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the NovaCompute
                  state. Each condition carries an ObservedGeneration so consumers can tell a
                  stale condition from one reflecting the current spec; use the conditions
                  helper (internal/common/conditions) to upsert them.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredNumberScheduled:
                description: |-
                  DesiredNumberScheduled is how many nodes the DaemonSet should run on,
                  mirrored from the DaemonSet status.
                format: int32
                type: integer
              installedImage:
                description: |-
                  InstalledImage is the image reference the running DaemonSet was projected
                  from. It is stamped once the rollout is complete.
                type: string
              nodes:
                description: |-
                  Nodes is the per-node ledger of the pool. A node that stops being
                  selected keeps its entry until its compute service is deleted, so the
                  record of a drain outlives the selection.
                items:
                  description: NovaComputeNodeStatus is the state of one node of the
                    pool.
                  properties:
                    conflictsWith:
                      description: ConflictsWith names the NovaCompute that holds
                        a node in Conflict.
                      type: string
                    disabledReason:
                      description: DisabledReason is the reason Nova records for a
                        disabled service.
                      type: string
                    instances:
                      description: Instances is how many servers Nova reports on a
                        draining node.
                      format: int32
                      type: integer
                    name:
                      description: Name is the node's name, which is also the compute
                        service's host.
                      type: string
                    phase:
                      description: Phase is where the node stands in the pool's lifecycle.
                      enum:
                      - Pending
                      - Active
                      - Draining
                      - Releasing
                      - Conflict
                      type: string
                    serviceID:
                      description: |-
                        ServiceID is the id of the nova-compute service registered under the
                        node name.
                      type: string
                    serviceState:
                      description: 'ServiceState is the service''s liveness as Nova
                        reports it: up or down.'
                      type: string
                    serviceStatus:
                      description: |-
                        ServiceStatus is the service's administrative status as Nova reports it:
                        enabled or disabled.
                      type: string
                    zone:
                      description: |-
                        Zone is the node's topology.kubernetes.io/zone label, the availability
                        zone its host aggregate carries.
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              numberReady:
                description: NumberReady is how many of those nodes have a ready nova-compute
                  pod.
                format: int32
                type: integer
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation the controller last
                  reconciled, so a stale status is distinguishable from a current one.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
