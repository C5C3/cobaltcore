apiVersion: v2
name: nova-operator
description: A Helm chart for deploying the Nova OpenStack compute service operator
type: application
version: 0.2.0
appVersion: "0.1.0"
# The shared naming/label helpers and the Deployment skeleton live in the
# operator-library library chart so they are defined once for all operator
# charts. It is vendored into charts/ at package time (helm dependency build).
dependencies:
  - name: operator-library
    version: 0.9.0
    repository: "file://../../../shared/helm/operator-library"
# Helm validates values against values.schema.json automatically.
annotations:
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: added
      description: nodeSelector, tolerations and priorityClassName values place and prioritize the operator pods (operator-library 0.9.0)
    - kind: added
      description: Initial nova-operator chart on the shared operator-library (deployment, Nova admission webhook, RBAC, PDB, ServiceMonitor, opt-in NetworkPolicy)
