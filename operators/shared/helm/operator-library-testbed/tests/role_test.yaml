# Role unit tests for the shared operator-library.role template: the
# namespace-scoped rendering, its two guards, and the hook-less default
# (no operator-library.chart.namespaceScopedUnsupported override, so the mode
# is accepted).
suite: Role
templates:
  - templates/role.yaml
tests:
  - it: should render a Role with the chart rules when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: RELEASE-NAME-operator-library-testbed
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - lengthEqual:
          path: rules
          count: 2
      - contains:
          path: rules
          content:
            apiGroups:
              - testbed.c5c3.io
            resources:
              - testbeds
            verbs:
              - get
              - list
              - watch

  - it: should fail when rbac.namespaceScoped is true and webhook.enabled is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "webhook/enabled"

  - it: should not render a Role when rbac.namespaceScoped is false
    asserts:
      - hasDocuments:
          count: 0
