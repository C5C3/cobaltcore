---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-barbican-openstack-c5c3-io-v1alpha1-barbican
  failurePolicy: Fail
  name: mbarbican.kb.io
  rules:
  - apiGroups:
    - barbican.openstack.c5c3.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - barbicans
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-barbican-openstack-c5c3-io-v1alpha1-barbicansecretstore
  failurePolicy: Fail
  name: mbarbicansecretstore.kb.io
  rules:
  - apiGroups:
    - barbican.openstack.c5c3.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - barbicansecretstores
  sideEffects: None
