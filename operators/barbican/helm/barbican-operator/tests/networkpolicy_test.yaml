# NetworkPolicy unit tests for the barbican-operator additions.
# The shared NetworkPolicy is pinned by the operator-library testbed suite;
# this suite covers the OpenBao egress rule the chart adds through the
# operator-library.chart.networkPolicyEgress hook.
suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
tests:
  # ---------------------------------------------------------------------------
  # OpenBao egress — ports-only TCP 8200, on by default. The rule carries no
  # `to` peer because a brownfield BarbicanSecretStore names a user-supplied
  # server the chart cannot resolve.
  # ---------------------------------------------------------------------------
  - it: should render a ports-only OpenBao egress rule by default
    set:
      networkPolicy:
        enabled: true
        kubeApiServer:
          cidrs: ["10.96.0.1/32"]
          ports: [6443]
    asserts:
      # DNS, kube-apiserver, OpenBao — the OpenBao rule comes last.
      - lengthEqual:
          path: spec.egress
          count: 3
      - equal:
          path: spec.egress[2].ports
          value:
            - protocol: TCP
              port: 8200
      - isNull:
          path: spec.egress[2].to

  - it: should drop the OpenBao egress rule when networkPolicy.openBao.enabled is false
    set:
      networkPolicy:
        enabled: true
        kubeApiServer:
          cidrs: ["10.96.0.1/32"]
          ports: [6443]
        openBao:
          enabled: false
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 2
      - notContains:
          path: spec.egress
          content:
            ports:
              - protocol: TCP
                port: 8200
