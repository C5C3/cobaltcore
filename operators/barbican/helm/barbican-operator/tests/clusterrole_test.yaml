# ClusterRole RBAC rules unit tests.
#
# The rule set is the manual mirror of the kubebuilder RBAC markers in
# operators/barbican/internal/controller/barbican_controller.go and
# barbicansecretstore_controller.go, plus the leases rule the manager's leader
# election needs. These assertions are the pin for that sync: a marker added or
# a verb widened in either controller without the matching edit in
# templates/_helpers.tpl fails here.
suite: ClusterRole
templates:
  - templates/clusterrole.yaml
tests:
  - it: should have the correct number of rules
    asserts:
      - lengthEqual:
          path: rules
          count: 22

  - it: should grant full CRUD on barbicans
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicans
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant get/update/patch on barbicans/status
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicans/status
            verbs:
              - get
              - update
              - patch

  - it: should grant update on barbicans/finalizers
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicans/finalizers
            verbs:
              - update

  # Store CRs are user-authored: both controllers only read them, so the rule
  # must stay read-only. A widened verb list here would exceed the markers.
  - it: should grant read-only on barbicansecretstores
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicansecretstores
            verbs:
              - get
              - list
              - watch

  - it: should not grant write verbs on barbicansecretstores
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicansecretstores
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant get/update/patch on barbicansecretstores/status
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicansecretstores/status
            verbs:
              - get
              - update
              - patch

  - it: should grant update on barbicansecretstores/finalizers
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicansecretstores/finalizers
            verbs:
              - update

  - it: should grant full CRUD on apps/deployments
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - apps
            resources:
              - deployments
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant full CRUD on core resources
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - services
              - configmaps
              - secrets
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should restrict events to create and patch only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - events
            verbs:
              - create
              - patch

  # A cluster-wide create on serviceaccounts/token would let anyone reaching the
  # operator ServiceAccount mint a token for a ServiceAccount in any namespace.
  # It is bound per namespace and narrowed to the named provisioner accounts by
  # templates/tokenrequest-rbac.yaml instead, and must never appear here.
  - it: should not grant serviceaccounts/token cluster-wide
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - serviceaccounts/token
            verbs:
              - create

  # Barbican runs a periodic maintenance workload: the db-clean CronJob shares
  # the batch rule with the db-sync Job.
  - it: should grant full CRUD on batch jobs and cronjobs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - batch
            resources:
              - jobs
              - cronjobs
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should not narrow the batch rule to jobs alone
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - batch
            resources:
              - jobs
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant full CRUD on mariadb resources
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - k8s.mariadb.com
            resources:
              - databases
              - users
              - grants
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant read-only on mariadb cluster CRs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - k8s.mariadb.com
            resources:
              - mariadbs
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only on externalsecrets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - externalsecrets
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only on clustersecretstores and secretstores
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - clustersecretstores
              - secretstores
            verbs:
              - get
              - list
              - watch

  # A managed store provisions against an OpenBaoCluster it names; the store
  # controller reads and watches that instance but never writes it.
  - it: should grant read-only on openbaoclusters
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - openbao.org
            resources:
              - openbaoclusters
            verbs:
              - get
              - list
              - watch

  - it: should grant full CRUD on poddisruptionbudgets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - policy
            resources:
              - poddisruptionbudgets
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant full CRUD on horizontalpodautoscalers
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - autoscaling
            resources:
              - horizontalpodautoscalers
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant full CRUD on networkpolicies
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - networking.k8s.io
            resources:
              - networkpolicies
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant full CRUD on httproutes
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  - it: should grant read-only on httproutes/status
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes/status
            verbs:
              - get

  - it: should grant read-only on priorityclasses for webhook validation
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - scheduling.k8s.io
            resources:
              - priorityclasses
            verbs:
              - get
              - list
              - watch

  - it: should grant full CRUD on leases for leader election
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # ClusterRole must not render in namespace-scoped mode.
  - it: should not render ClusterRole when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
