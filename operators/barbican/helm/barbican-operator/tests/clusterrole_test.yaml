# ClusterRole unit tests.
#
# The rules come from templates/_rbac-rules.tpl, generated from the operator's
# +kubebuilder:rbac markers (make sync-helm-rbac); the rule shape follows
# controller-gen (resources with identical verbs merged, verbs sorted). This
# suite pins the rendering, the wiring of the generated rules into the
# ClusterRole, and the grants whose restriction is deliberate; it does not
# re-assert every generated rule.
suite: ClusterRole
templates:
  - templates/clusterrole.yaml
tests:
  - it: should grant full CRUD on barbicans
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicans
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should not grant create/patch/delete on barbicansecretstores
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - barbican.openstack.c5c3.io
            resources:
              - barbicansecretstores
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should restrict events to create and patch only
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - events
            verbs:
              - create
              - patch

  # A cluster-wide create on serviceaccounts/token would let anyone reaching the
  # operator ServiceAccount mint a token for a ServiceAccount in any namespace.
  # It is bound per namespace and narrowed to the named provisioner accounts by
  # templates/tokenrequest-rbac.yaml instead, and must never appear here.
  - it: should not grant serviceaccounts/token cluster-wide
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - serviceaccounts/token
            verbs:
              - create

  - it: should not narrow the batch rule to jobs alone
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups:
              - batch
            resources:
              - jobs
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

  - it: should grant read-only on mariadb cluster CRs
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - k8s.mariadb.com
            resources:
              - mariadbs
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only on externalsecrets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - external-secrets.io
            resources:
              - clustersecretstores
              - externalsecrets
              - secretstores
            verbs:
              - get
              - list
              - watch

  # A managed store provisions against an OpenBaoCluster it names; the store
  # controller reads and watches that instance but never writes it.
  - it: should grant read-only on openbaoclusters
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - openbao.org
            resources:
              - openbaoclusters
            verbs:
              - get
              - list
              - watch

  - it: should grant read-only on httproutes/status
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - gateway.networking.k8s.io
            resources:
              - httproutes/status
            verbs:
              - get

  - it: should grant read-only on priorityclasses for webhook validation
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - scheduling.k8s.io
            resources:
              - priorityclasses
            verbs:
              - get
              - list
              - watch

  - it: should grant full CRUD on leases for leader election
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete

  # ClusterRole must not render in namespace-scoped mode.
  - it: should not render ClusterRole when rbac.namespaceScoped is true
    set:
      rbac:
        namespaceScoped: true
      webhook:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
