apiVersion: v2
name: barbican-operator
description: A Helm chart for deploying the Barbican OpenStack key-management service operator
type: application
version: 0.2.0
appVersion: "0.1.0"
# The shared naming/label helpers and the Deployment skeleton live in the
# operator-library library chart so they are defined once for all operator
# charts. It is vendored into charts/ at package time (helm dependency build).
dependencies:
  - name: operator-library
    version: 0.8.0
    repository: "file://../../../shared/helm/operator-library"
# Helm validates values against values.schema.json automatically.
annotations:
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: Shared NetworkPolicy, ClusterRole and Role templates moved into the operator-library chart (0.8.0); chart-specific behaviour goes through the operator-library.chart.* hooks
    - kind: changed
      description: RBAC rules are generated from the operator's kubebuilder markers (templates/_rbac-rules.tpl, make sync-helm-rbac) instead of being maintained by hand; rules with identical verbs are merged as controller-gen emits them
    - kind: added
      description: extraArgs and extraEnv values append verbatim manager arguments and environment variables
    - kind: added
      description: Initial barbican-operator chart on the shared operator-library (deployment, Barbican and BarbicanSecretStore admission webhooks, RBAC, PDB, ServiceMonitor, opt-in NetworkPolicy with an OpenBao egress rule)
    - kind: changed
      description: Namespace-scoped installs clear --clusters-namespace, so the operator engages no target cluster and reads no Secret outside its release namespace
