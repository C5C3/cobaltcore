---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: glances.glance.openstack.c5c3.io
spec:
  group: glance.openstack.c5c3.io
  names:
    kind: Glance
    listKind: GlanceList
    plural: glances
    singular: glance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.installedRelease
      name: Release
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Glance is the Schema for the glances API. It deploys the Glance image service:
          the API server (eventlet glance-api below release 2026.1, uWSGI from 2026.1),
          its database and cache connections, and the Keystone integration. Image stores
          (S3 today) attach out-of-band through GlanceBackend CRs rather than living in
          this spec.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GlanceSpec defines the desired state of Glance.

              The targetClusterRef transition rules (evaluated only on UPDATE) freeze the
              ref: adding it, removing it, or renaming it after creation is rejected at the
              schema layer, so the guarantee holds even when the validating webhook is
              down. Moving a service between clusters is not a supported mutation.
            properties:
              apiServer:
                description: |-
                  APIServer tunes the Glance API server process. Its two knobs are
                  release-conditional: uwsgi applies only from 2026.1 (uWSGI launch mode) and
                  workers only below 2026.1 (eventlet launch mode). When nil the operator uses
                  hardcoded defaults for the active launch mode.
                properties:
                  uwsgi:
                    description: |-
                      UWSGI configures the uWSGI application server parameters. Effective only
                      from release 2026.1, where Glance launches under uWSGI; ignored below
                      2026.1 (eventlet launch mode).
                    properties:
                      harakiri:
                        description: |-
                          Harakiri caps the per-request worker lifetime (seconds) via the uWSGI
                          --harakiri flag. A request blocked longer than this bound is
                          killed so a single stuck request cannot prevent other in-flight
                          requests from completing cleanly before graceful shutdown ends. When
                          nil, the --harakiri flag is omitted from the uWSGI command entirely
                          (no hidden default is injected). The webhook additionally requires
                          harakiri < terminationGracePeriodSeconds - preStopSleepSeconds so the
                          shutdown envelope is consistent.
                        format: int32
                        minimum: 1
                        type: integer
                      httpKeepAlive:
                        description: |-
                          HTTPKeepAlive enables the --http-keepalive flag on the uWSGI process.
                          When false, the flag is omitted from the command. It is a nil-preserving
                          pointer so "unset" is representable: the owning operator's defaulting
                          webhook restores the documented default (true) when the pointer is nil,
                          and the reconciler falls back to the same default for CRs that bypass the
                          webhook. An explicit false is honored verbatim.
                        type: boolean
                      httpKeepAliveTimeout:
                        description: |-
                          HTTPKeepAliveTimeout bounds the idle timeout (seconds) of keep-alive
                          connections via the uWSGI --http-keepalive-timeout flag.
                          A bounded timeout forces clients to reconnect through the Service so
                          they never reuse a socket to a removed pod. When nil, the flag is
                          omitted from the uWSGI command. Zero is rejected to avoid the
                          unbounded-timeout interpretation. A value at or below
                          preStopSleepSeconds is recommended so idle sockets have closed before
                          SIGTERM reaches uWSGI.
                        format: int32
                        minimum: 1
                        type: integer
                      processes:
                        default: 2
                        description: Processes is the number of uWSGI worker processes.
                        format: int32
                        minimum: 1
                        type: integer
                      threads:
                        default: 1
                        description: Threads is the number of threads per uWSGI worker
                          process.
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: httpKeepAliveTimeout may only be set when httpKeepAlive
                        is true
                      rule: '!has(self.httpKeepAliveTimeout) || !has(self.httpKeepAlive)
                        || self.httpKeepAlive'
                  workers:
                    description: |-
                      Workers is the number of eventlet API worker processes, rendered as
                      [DEFAULT] workers in glance-api.conf. Effective only below release 2026.1,
                      where Glance launches the eventlet glance-api server; ignored from 2026.1
                      (uWSGI launch mode, where uwsgi applies instead). When nil below 2026.1 the
                      operator renders DefaultEventletWorkers rather than letting the eventlet
                      server fall back to one worker per host CPU, so the worker count — and thus
                      the memory footprint — stays deterministic regardless of node size.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              autoscaling:
                description: |-
                  Autoscaling configures horizontal pod autoscaling for the Glance API
                  deployment. When set, a HorizontalPodAutoscaler is created targeting the
                  deployment. When removed, the HPA is deleted.
                properties:
                  behavior:
                    description: |-
                      Behavior configures how fast the HorizontalPodAutoscaler scales up and
                      down. The operator copies the block verbatim into the HPA's
                      spec.behavior. A direction left unset takes the Kubernetes default:
                      scale up at once, and scale down after a 300 s stabilization window.
                      tolerance is a Kubernetes quantity: write it as a string or a
                      milli-value ("0.05" or 50m), because the CRD schema rejects a bare
                      decimal such as 0.05. It needs Kubernetes 1.33 or newer: an older API
                      server refuses the HPA the operator applies, whose schema lacks the
                      field, and one with the feature gate HPAConfigurableTolerance off drops
                      it.
                    properties:
                      scaleDown:
                        description: |-
                          scaleDown is scaling policy for scaling Down.
                          If not set, the default value is to allow to scale down to minReplicas pods, with a
                          300 second stabilization window (i.e., the highest recommendation for
                          the last 300sec is used).
                        properties:
                          policies:
                            description: |-
                              policies is a list of potential scaling polices which can be used during scaling.
                              If not set, use the default values:
                              - For scale up: allow doubling the number of pods, or an absolute change of 4 pods in a 15s window.
                              - For scale down: allow all pods to be removed in a 15s window.
                            items:
                              description: HPAScalingPolicy is a single policy which
                                must hold true for a specified past interval.
                              properties:
                                periodSeconds:
                                  description: |-
                                    periodSeconds specifies the window of time for which the policy should hold true.
                                    PeriodSeconds must be greater than zero and less than or equal to 1800 (30 min).
                                  format: int32
                                  type: integer
                                type:
                                  description: type is used to specify the scaling
                                    policy.
                                  type: string
                                value:
                                  description: |-
                                    value contains the amount of change which is permitted by the policy.
                                    It must be greater than zero
                                  format: int32
                                  type: integer
                              required:
                              - periodSeconds
                              - type
                              - value
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          selectPolicy:
                            description: |-
                              selectPolicy is used to specify which policy should be used.
                              If not set, the default value Max is used.
                            type: string
                          stabilizationWindowSeconds:
                            description: |-
                              stabilizationWindowSeconds is the number of seconds for which past recommendations should be
                              considered while scaling up or scaling down.
                              StabilizationWindowSeconds must be greater than or equal to zero and less than or equal to 3600 (one hour).
                              If not set, use the default values:
                              - For scale up: 0 (i.e. no stabilization is done).
                              - For scale down: 300 (i.e. the stabilization window is 300 seconds long).
                            format: int32
                            type: integer
                          tolerance:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              tolerance is the tolerance on the ratio between the current and desired
                              metric value under which no updates are made to the desired number of
                              replicas (e.g. 0.01 for 1%). Must be greater than or equal to zero. If not
                              set, the default cluster-wide tolerance is applied (by default 10%).

                              For example, if autoscaling is configured with a memory consumption target of 100Mi,
                              and scale-down and scale-up tolerances of 5% and 1% respectively, scaling will be
                              triggered when the actual consumption falls below 95Mi or exceeds 101Mi.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        type: object
                      scaleUp:
                        description: |-
                          scaleUp is scaling policy for scaling Up.
                          If not set, the default value is the higher of:
                            * increase no more than 4 pods per 60 seconds
                            * double the number of pods per 60 seconds
                          No stabilization is used.
                        properties:
                          policies:
                            description: |-
                              policies is a list of potential scaling polices which can be used during scaling.
                              If not set, use the default values:
                              - For scale up: allow doubling the number of pods, or an absolute change of 4 pods in a 15s window.
                              - For scale down: allow all pods to be removed in a 15s window.
                            items:
                              description: HPAScalingPolicy is a single policy which
                                must hold true for a specified past interval.
                              properties:
                                periodSeconds:
                                  description: |-
                                    periodSeconds specifies the window of time for which the policy should hold true.
                                    PeriodSeconds must be greater than zero and less than or equal to 1800 (30 min).
                                  format: int32
                                  type: integer
                                type:
                                  description: type is used to specify the scaling
                                    policy.
                                  type: string
                                value:
                                  description: |-
                                    value contains the amount of change which is permitted by the policy.
                                    It must be greater than zero
                                  format: int32
                                  type: integer
                              required:
                              - periodSeconds
                              - type
                              - value
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          selectPolicy:
                            description: |-
                              selectPolicy is used to specify which policy should be used.
                              If not set, the default value Max is used.
                            type: string
                          stabilizationWindowSeconds:
                            description: |-
                              stabilizationWindowSeconds is the number of seconds for which past recommendations should be
                              considered while scaling up or scaling down.
                              StabilizationWindowSeconds must be greater than or equal to zero and less than or equal to 3600 (one hour).
                              If not set, use the default values:
                              - For scale up: 0 (i.e. no stabilization is done).
                              - For scale down: 300 (i.e. the stabilization window is 300 seconds long).
                            format: int32
                            type: integer
                          tolerance:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              tolerance is the tolerance on the ratio between the current and desired
                              metric value under which no updates are made to the desired number of
                              replicas (e.g. 0.01 for 1%). Must be greater than or equal to zero. If not
                              set, the default cluster-wide tolerance is applied (by default 10%).

                              For example, if autoscaling is configured with a memory consumption target of 100Mi,
                              and scale-down and scale-up tolerances of 5% and 1% respectively, scaling will be
                              triggered when the actual consumption falls below 95Mi or exceeds 101Mi.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        type: object
                    type: object
                  maxReplicas:
                    description: MaxReplicas is the upper bound for the number of
                      replicas.
                    format: int32
                    minimum: 1
                    type: integer
                  minReplicas:
                    description: |-
                      MinReplicas is the lower bound for the number of replicas.
                      Defaults to the API block's replica count if unset. The API
                      PodDisruptionBudget follows this bound: maxUnavailable: 1 at one
                      replica, so a drain can evict the last pod, and minAvailable: 1 above.
                    format: int32
                    minimum: 1
                    type: integer
                  targetCPUUtilization:
                    description: |-
                      TargetCPUUtilization is the target average CPU utilization (percentage).
                      The HPA measures it against the summed CPU requests of every container
                      in the API pod, so while it is set the webhook rejects a zero or
                      negative CPU request, or a limit the request would be copied from.
                      A value above 100 is valid wherever a container may use more CPU than
                      it requests. The webhook rejects a target that no container's CPU limit
                      lets the pod reach.
                    format: int32
                    minimum: 1
                    type: integer
                  targetMemoryUtilization:
                    description: |-
                      TargetMemoryUtilization is the target average memory utilization (percentage).
                      The HPA measures it against the summed memory requests of every
                      container in the API pod, so while it is set the webhook rejects a zero
                      or negative memory request, or a limit the request would be copied from.
                      A value above 100 is valid wherever a container may use more memory
                      than it requests. A container whose block names no memory renders the
                      same figure as request and limit, so the webhook rejects a target that
                      no container's memory limit lets the pod reach.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - maxReplicas
                type: object
                x-kubernetes-validations:
                - message: at least one of targetCPUUtilization or targetMemoryUtilization
                    must be set
                  rule: has(self.targetCPUUtilization) || has(self.targetMemoryUtilization)
                - message: minReplicas must not exceed maxReplicas
                  rule: '!has(self.minReplicas) || self.minReplicas <= self.maxReplicas'
              cache:
                description: |-
                  Cache defines the Memcached cache configuration.
                  Supports managed (clusterRef) and brownfield (servers) modes; the
                  clusterRef/servers mutual-exclusivity rule lives on commonv1.CacheSpec.
                properties:
                  backend:
                    description: Backend is the cache backend (e.g. dogpile.cache.pymemcache).
                    type: string
                  clusterRef:
                    description: ClusterRef references a Memcached CR in the cluster
                      (managed mode).
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  replicas:
                    description: |-
                      Replicas is the number of Memcached pod replicas in the referenced cluster
                      (managed mode). Used to generate the correct number of StatefulSet pod
                      endpoints. Only used when ClusterRef is set. When unset, the ControlPlane
                      takes the value from its sizing (Standard: 3).
                    format: int32
                    minimum: 1
                    type: integer
                  servers:
                    description: Servers is the list of cache server endpoints (brownfield
                      mode).
                    items:
                      pattern: ^[^\n\r]*$
                      type: string
                    type: array
                required:
                - backend
                type: object
                x-kubernetes-validations:
                - message: exactly one of clusterRef or servers must be set
                  rule: has(self.clusterRef) != (has(self.servers) && size(self.servers)
                    > 0)
                - message: clusterRef.name must not contain a newline or carriage
                    return
                  rule: '!has(self.clusterRef) || !self.clusterRef.name.matches(''[\n\r]'')'
              database:
                description: |-
                  Database defines the MariaDB connection parameters.
                  Supports managed (clusterRef) and brownfield (host/port) modes. The
                  clusterRef/host mutual-exclusivity rule and the credentialsMode
                  (Static/Dynamic) contract are inherited from commonv1.DatabaseSpec, so they
                  hold here without per-field duplication.
                properties:
                  clusterRef:
                    description: ClusterRef references a MariaDB CR in the cluster
                      (managed mode).
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  credentialsMode:
                    description: |-
                      CredentialsMode selects how the service DB credential in SecretRef is
                      provisioned. "Static" (the default when empty) has the operator manage
                      the MariaDB User/Grant CRs with a long-lived password from SecretRef.
                      "Dynamic" has an external secrets engine issue short-lived credentials on
                      demand: SecretRef then carries both a username and password, no User/Grant
                      CRs are managed, and no long-lived DB password remains at rest. Dynamic is
                      only valid in managed mode (ClusterRef set).
                    enum:
                    - Static
                    - Dynamic
                    type: string
                  database:
                    description: |-
                      Database is the database name within the cluster. Constrained to the MySQL
                      identifier character set and the 64-character identifier limit.
                    maxLength: 64
                    minLength: 1
                    pattern: ^[A-Za-z0-9_]+$
                    type: string
                  host:
                    description: |-
                      Host is the database hostname (brownfield mode). The pattern is a
                      permissive host matcher that accepts DNS names, IPv4, and IPv6 literals
                      while rejecting empty strings and shell/path metacharacters; it is not a
                      strict RFC-1123 validator, deliberately, so airgapped/mirror endpoints are
                      not rejected at admission.
                    minLength: 1
                    pattern: ^[a-zA-Z0-9._:-]+$
                    type: string
                  port:
                    description: |-
                      Port is the database port (brownfield mode, default 3306). Omitted (managed
                      mode) leaves it unset; an explicit value must be a valid TCP port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    description: |-
                      Replicas is the number of managed MariaDB replicas provisioned in
                      fresh-create mode. It mirrors CacheSpec.Replicas: only the c5c3 operator's
                      managed-mode projection honours it (a single replica yields a
                      single-instance non-Galera MariaDB, three or more yield a Galera cluster),
                      so a constrained cluster such as a single-node kind can schedule the
                      fresh-create path. Operators that adopt an existing MariaDB (the c5c3 adopted-infra path,
                      and every service operator) ignore it. Only meaningful when ClusterRef is
                      set. When unset, the ControlPlane takes the value from its sizing
                      (Standard: 3).
                    format: int32
                    minimum: 1
                    type: integer
                  secretRef:
                    description: SecretRef references the K8s Secret with credentials.
                    properties:
                      key:
                        type: string
                      name:
                        description: |-
                          Name is the referenced Secret's name. It must be a non-empty DNS-1123
                          subdomain (the Kubernetes object-name grammar). Tightening the shared type
                          fixes every consumer at once — a service operator adminPasswordSecretRef /
                          database.secretRef / messaging / TLS cert refs and the c5c3
                          passwordSecretRef — so an empty name no longer slips through "required".
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  storageSize:
                    description: |-
                      StorageSize is the persistent-volume size requested for each managed
                      MariaDB replica in fresh-create mode. Like Replicas, only the c5c3
                      operator's managed-mode projection honours it (it is written to the owned
                      MariaDB's spec.storage.size); operators that adopt an existing MariaDB
                      (the c5c3 adopted-infra path, and every service operator) ignore it. When
                      unset, the ControlPlane takes the value from its sizing (Standard: 100Gi,
                      the production baseline of deploy/flux-system/infrastructure/mariadb.yaml);
                      a constrained cluster such as a single-node kind can pin a far smaller
                      value (e.g. 512Mi) so CI does not request a 100Gi volume it never fills.
                      Immutable after creation: the mariadb-operator rejects
                      changing spec.storage.size on a live CR, so the ControlPlane validating
                      webhook freezes it too. Only meaningful when ClusterRef is set. The pattern
                      admits binary IEC units (Mi/Gi/Ti) matching the Kubernetes quantity grammar
                      the operator parses with resource.ParseQuantity.
                    pattern: ^[0-9]+(Mi|Gi|Ti)$
                    type: string
                  tls:
                    description: |-
                      TLS optionally enables TLS/mTLS for the database connection. The pointer keeps the field opt-in and non-mutating: a nil
                      TLS means plaintext TCP, preserving the pre-existing behavior for all
                      existing DatabaseSpec consumers.
                    properties:
                      caBundleSecretRef:
                        description: |-
                          CABundleSecretRef references the K8s Secret holding the server CA
                          bundle the client trusts when verifying the database endpoint.
                        properties:
                          key:
                            type: string
                          name:
                            description: |-
                              Name is the referenced Secret's name. It must be a non-empty DNS-1123
                              subdomain (the Kubernetes object-name grammar). Tightening the shared type
                              fixes every consumer at once — a service operator adminPasswordSecretRef /
                              database.secretRef / messaging / TLS cert refs and the c5c3
                              passwordSecretRef — so an empty name no longer slips through "required".
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                      clientCertSecretRef:
                        description: |-
                          ClientCertSecretRef references the K8s Secret holding the client
                          keypair presented to the database for mutual TLS.
                        properties:
                          key:
                            type: string
                          name:
                            description: |-
                              Name is the referenced Secret's name. It must be a non-empty DNS-1123
                              subdomain (the Kubernetes object-name grammar). Tightening the shared type
                              fixes every consumer at once — a service operator adminPasswordSecretRef /
                              database.secretRef / messaging / TLS cert refs and the c5c3
                              passwordSecretRef — so an empty name no longer slips through "required".
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                      mode:
                        description: |-
                          Mode selects the TLS verification strength applied to the connection:
                            - disabled:       TLS is off; certificate references are ignored.
                            - prefer/require: encrypt the connection only (no peer verification).
                            - verify-ca:      additionally verify the server certificate chain
                                               against the trusted CA bundle.
                            - verify-full:    additionally verify the server certificate chain
                                               and that the server hostname matches the
                                               certificate identity.
                        enum:
                        - disabled
                        - prefer
                        - require
                        - verify-ca
                        - verify-full
                        type: string
                    required:
                    - caBundleSecretRef
                    - clientCertSecretRef
                    type: object
                required:
                - database
                - secretRef
                type: object
                x-kubernetes-validations:
                - message: exactly one of clusterRef or host must be set
                  rule: has(self.clusterRef) != has(self.host)
                - message: credentialsMode Dynamic requires clusterRef (managed mode)
                  rule: '!has(self.credentialsMode) || self.credentialsMode != ''Dynamic''
                    || has(self.clusterRef)'
              dbPurge:
                description: |-
                  DBPurge tunes the recurring database purge that hard-deletes the rows
                  glance only ever soft-deletes. The operator resolves the effective
                  retention and schedule at reconcile time — DefaultDBPurgeRetentionDays and
                  DefaultDBPurgeSchedule — rather than materializing them into the CR, so a
                  nil block resolves exactly like an empty struct and both keep tracking the
                  operator defaults. The task-row sweep is scheduled on every Glance; the
                  destructive extras are opt-in (purgeImagesTable) or reversible (suspend).
                properties:
                  purgeImagesTable:
                    description: |-
                      PurgeImagesTable enables the second glance-manage db purge_images_table
                      pass, which hard-deletes the images rows themselves. It defaults to false:
                      the row is what keeps a deleted image's UUID reserved, and glance's v2
                      image-create accepts a client-supplied id, so once the row is gone any
                      project member can claim the freed UUID for an image of their own and every
                      Heat template, Terraform state, or server image_ref still pinning it boots
                      that image instead (OSSN-0075). Enable it only where policy denies
                      client-supplied image IDs. The images table grows far more slowly than the
                      tasks table db purge already covers.
                    type: boolean
                  retentionDays:
                    description: |-
                      RetentionDays is how long a soft-deleted row survives before the purge
                      hard-deletes it — the --age_in_days argument both commands take. When unset
                      the operator resolves DefaultDBPurgeRetentionDays; the lower bound of one
                      day keeps the purge from racing the rows an in-flight import just wrote.
                      Lowering it applies retroactively at the next firing, so the validating
                      webhook warns on a reduction.
                    format: int32
                    minimum: 1
                    type: integer
                  schedule:
                    description: |-
                      Schedule is the standard cron expression the purge CronJob runs on. When
                      empty the operator resolves DefaultDBPurgeSchedule. The value is checked by
                      the validating webhook rather than by a CRD pattern — as with the keystone
                      schedules, the accepted grammar includes descriptors such as @daily, which
                      no regex expresses without also rejecting valid expressions.

                      It is also the only lever over purge throughput: each run deletes at most a
                      fixed number of rows per table (the operator-owned --max_rows cap), so a
                      deployment whose daily soft-deletes outgrow one run's ceiling needs a more
                      frequent schedule to keep up.
                    type: string
                  suspend:
                    description: |-
                      Suspend pauses the purge CronJob without deleting it, matching the keystone
                      TrustFlushSpec.Suspend semantics. It is the escape hatch for a brownfield
                      deployment onboarding onto this operator: the first run applies the
                      retention window retroactively to a backlog that has never been purged, so
                      an operator who wants to stage that can suspend the CronJob, raise
