                  Glance's ExternalSecrets and PushSecrets through. When omitted the operator
                  uses the shared cluster-scoped openbao-cluster-store, so existing
                  deployments keep working unchanged. Set kind to SecretStore with the name of
                  a namespaced store in THIS Glance's namespace to reach OpenBao as a
                  per-tenant identity. The ControlPlane operator projects this field onto the
                  Glance it owns, so operators normally configure it there rather than here.
                properties:
                  kind:
                    default: ClusterSecretStore
                    description: |-
                      Kind is the store scope: ClusterSecretStore (cluster-scoped, the default)
                      or SecretStore (resolved in the CR's namespace).
                    enum:
                    - ClusterSecretStore
                    - SecretStore
                    type: string
                  name:
                    description: |-
                      Name is the referenced store's name. It must be a non-empty DNS-1123
                      subdomain (the Kubernetes object-name grammar), matching SecretRefSpec.Name.
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              serviceUser:
                description: |-
                  ServiceUser identifies the Keystone service account Glance authenticates as
                  and the Secret holding its password. The username/domain fields are
                  webhook-defaulted (glance / service / Default / Default) in a later commit;
                  the password Secret reference is required.
                properties:
                  projectDomainName:
                    description: |-
                      ProjectDomainName is the domain the service project lives in
                      ([keystone_authtoken] project_domain_name). Webhook-defaulted to "Default".
                    type: string
                  projectName:
                    description: |-
                      ProjectName is the Keystone project the service user scopes to
                      ([keystone_authtoken] project_name). Webhook-defaulted to "service".
                    type: string
                  secretRef:
                    description: |-
                      SecretRef references the Secret holding the service user's password. The
                      key is webhook-defaulted to "password" in a later commit.
                    properties:
                      key:
                        type: string
                      name:
                        description: |-
                          Name is the referenced Secret's name. It must be a non-empty DNS-1123
                          subdomain (the Kubernetes object-name grammar). Tightening the shared type
                          fixes every consumer at once — a service operator adminPasswordSecretRef /
                          database.secretRef / messaging / TLS cert refs and the c5c3
                          passwordSecretRef — so an empty name no longer slips through "required".
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  userDomainName:
                    description: |-
                      UserDomainName is the domain the service user lives in
                      ([keystone_authtoken] user_domain_name). Webhook-defaulted to "Default".
                    type: string
                  username:
                    description: |-
                      Username is the Keystone username Glance authenticates as
                      ([keystone_authtoken] username). Webhook-defaulted to "glance".
                    type: string
                required:
                - secretRef
                type: object
              staging:
                description: |-
                  Staging bounds the node-local scratch space an image import may consume.
                  The operator resolves the effective size limit at reconcile time —
                  DefaultStagingSizeLimit — rather than materializing it into the CR, so a
                  nil block, an empty block, and a nil sizeLimit all mean the same thing:
                  use the operator default. Leaving it unset therefore keeps tracking that
                  default across upgrades instead of freezing today's value into the stored
                  CR. Setting staging.unbounded opts out of the bound altogether.
                properties:
                  sizeLimit:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      SizeLimit caps each of the two scratch emptyDirs, staging and tasks-work.
                      It must be at least 1Mi. When unset the operator resolves
                      DefaultStagingSizeLimit (10Gi) at reconcile time.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  unbounded:
                    description: |-
                      Unbounded removes the bound entirely: the operator renders both scratch
                      emptyDirs without a sizeLimit, so an import may consume node disk until
                      the node itself runs out. It is the escape hatch for a deployment whose
                      largest import cannot be expressed as a number worth committing to —
                      notably one that ran before this field existed, since an operator upgrade
                      otherwise stamps DefaultStagingSizeLimit onto its Deployment and starts
                      evicting on imports that used to succeed. Prefer raising SizeLimit; reach
                      for this only to deliberately restore the pre-bound behaviour, and size
                      the node accordingly, because nothing then stops one import from filling
                      the disk out from under every other pod on it.

                      It is a separate field rather than a sentinel SizeLimit so the 1Mi floor
                      keeps rejecting the sub-byte quantities it exists to catch. Setting both
                      is a contradiction and rejected at admission.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: 'unbounded and sizeLimit are mutually exclusive: an unbounded
                    staging area has no size limit to configure'
                  rule: '!(has(self.unbounded) && self.unbounded && has(self.sizeLimit))'
              targetClusterRef:
                description: |-
                  TargetClusterRef names the registered target cluster that receives this
                  Glance's children: Deployments, ConfigMaps, Secrets, and the database
                  CRs. The CR itself stays on the management cluster, and so do its status
                  and its finalizers. When omitted, the children are created on the local
                  cluster (the management cluster the operator runs on) and the deployment
                  behaves exactly like a single-cluster one. The field is immutable (see the
                  transition rules on this spec).

                  A child written to the target carries no owner reference, since nothing
                  on that cluster resolves one into the management cluster. Three labels
                  name the owner instead: openstack.c5c3.io/owner-kind,
                  openstack.c5c3.io/owner-name, and openstack.c5c3.io/owner-namespace.
                  Deleting the CR deletes the children that carry its labels, under a
                  finalizer the CR installs whenever the ref is set, so a target cluster
                  may have the service CRDs installed. A cluster deregistered past the
                  abandon window is the exception: its children cannot be reached and stay
                  behind on it.
                properties:
                  name:
                    description: |-
                      Name is the registered target cluster's name. It must be a non-empty
                      DNS-1123 subdomain (the Kubernetes object-name grammar), matching
                      SecretStoreRefSpec.Name.
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
            required:
            - cache
            - database
            - image
            - keystoneEndpoint
            - openStackRelease
            - serviceUser
            type: object
            x-kubernetes-validations:
            - message: targetClusterRef is immutable
              rule: has(self.targetClusterRef) == has(oldSelf.targetClusterRef)
            - message: targetClusterRef is immutable
              rule: '!has(self.targetClusterRef) || !has(oldSelf.targetClusterRef)
                || self.targetClusterRef.name == oldSelf.targetClusterRef.name'
          status:
            description: GlanceStatus defines the observed state of Glance.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the Glance state.
                  Each condition carries an ObservedGeneration so consumers can tell a stale
                  condition from one reflecting the current spec; use the conditions helper
                  (internal/common/conditions) to upsert them.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the Glance API endpoint URL clients use.
                type: string
              installedRelease:
                description: |-
                  InstalledRelease is the OpenStack release whose database schema is currently
                  installed, promoted to spec.openStackRelease after a successful db-sync.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation the controller last
                  reconciled, so a stale status is distinguishable from a current one.
                format: int64
                type: integer
              targetRelease:
                description: |-
                  TargetRelease is the spec.openStackRelease being converged to during an
                  active upgrade.
                type: string
              upgradePhase:
                description: |-
                  UpgradePhase is the current expand-migrate-contract phase during an active
                  release upgrade (Expanding, Migrating, RollingUpdate, Contracting); empty
                  when no upgrade is in flight.
                enum:
                - Expanding
                - Migrating
                - RollingUpdate
                - Contracting
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
