# Kind cluster configuration for local development and CI.
# Single control-plane node suitable for CI runners (~7GB RAM, 2 vCPUs).
# Used by hack/deploy-infra.sh to create the E2E test cluster.
# Feature: CC-0010, REQ-010
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Disable leader election for scheduler and controller-manager.
    # In a single-node CI cluster there is only one instance of each component,
    # so leader election adds ~5 s of startup delay with no benefit.
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        scheduler:
          extraArgs:
            leader-elect: "false"
        controllerManager:
          extraArgs:
            leader-elect: "false"
