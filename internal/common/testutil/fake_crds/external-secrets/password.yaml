# Minimal fake CRD for External Secrets Operator's Password generator. Used by
# envtest only, NOT a production-grade schema. It covers the fields the c5c3
# operator's novaMetadataPasswordGenerator builder sets so integration tests can
# assert on them without the apiserver pruning unknown fields.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: passwords.generators.external-secrets.io
spec:
  group: generators.external-secrets.io
  names:
    plural: passwords
    singular: password
    kind: Password
    listKind: PasswordList
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                length:
                  type: integer
                  default: 24
                digits:
                  type: integer
                symbols:
                  type: integer
                symbolCharacters:
                  type: string
                noUpper:
                  type: boolean
                  default: false
                allowRepeat:
                  type: boolean
                  default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
