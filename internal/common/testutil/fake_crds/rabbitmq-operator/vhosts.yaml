# Minimal fake CRD for the RabbitMQ Messaging Topology Operator's Vhost
# resource. Used by envtest only — NOT a production-grade schema: spec and
# status keep every field, so a test can write the shapes the c5c3-operator
# applies and the status the topology operator would report.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vhosts.rabbitmq.com
spec:
  group: rabbitmq.com
  names:
    plural: vhosts
    singular: vhost
    kind: Vhost
    listKind: VhostList
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
