# Minimal fake CRD for the openbao-operator's OpenBaoCluster resource.
# Used by envtest only — NOT a production-grade schema. The spec keeps unknown
# fields so a test fixture may carry any subset of the production spec without
# this file tracking the upstream schema.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openbaoclusters.openbao.org
spec:
  group: openbao.org
  names:
    plural: openbaoclusters
    singular: openbaocluster
    kind: OpenBaoCluster
    listKind: OpenBaoClusterList
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
