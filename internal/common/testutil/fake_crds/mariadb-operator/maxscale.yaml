# Minimal fake CRD for MariaDB Operator's MaxScale resource.
# Used by envtest only — NOT a production-grade schema. It carries the spec
# fields database.ResolveEndpoint reads to decide whether a MaxScale routes
# every statement to the primary.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: maxscales.k8s.mariadb.com
spec:
  group: k8s.mariadb.com
  names:
    plural: maxscales
    singular: maxscale
    kind: MaxScale
    listKind: MaxScaleList
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mariaDbRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      router:
                        type: string
                      suspend:
                        type: boolean
                      params:
                        type: object
                        additionalProperties:
                          type: string
                      listener:
                        type: object
                        properties:
                          port:
                            type: integer
                          suspend:
                            type: boolean
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
