# Minimal fake CRD for MariaDB Operator's MariaDB resource.
# Used by envtest only — NOT a production-grade schema.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mariadbs.k8s.mariadb.com
spec:
  group: k8s.mariadb.com
  names:
    plural: mariadbs
    singular: mariadb
    kind: MariaDB
    listKind: MariaDBList
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                image:
                  type: string
                rootPasswordSecretKeyRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                # galera, replication and maxScaleRef decide the route
                # database.ResolveEndpoint renders; without them the API
                # server would prune the fields an envtest sets.
                galera:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    primary:
                      type: object
                      properties:
                        podIndex:
                          type: integer
                replication:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                maxScaleRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                # affinity and podDisruptionBudget carry the anti-affinity and
                # budget the ControlPlane projects onto a Galera cluster.
                affinity:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                podDisruptionBudget:
                  type: object
                  properties:
                    maxUnavailable:
                      x-kubernetes-int-or-string: true
                    minAvailable:
                      x-kubernetes-int-or-string: true
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                replicas:
                  type: integer
                currentPrimaryPodIndex:
                  type: integer
